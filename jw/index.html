<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>리듬게임 - 바구니 공 던지기 (최종 확정본)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 450px;
            background: linear-gradient(135deg, #2b2b2b 0%, #1f1f1f 100%);
            border: 2px solid #444;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #2b2b2b;
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 2rem;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0,255,204,0.5);
        }

        p {
            color: #aaa;
            margin-bottom: 10px;
        }

        .menu-btn {
            background: #333;
            color: #fff;
            border: 2px solid #00ffcc;
            padding: 8px 20px;
            margin: 5px;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 280px;
            text-align: center;
        }

        .menu-btn:hover {
            background: #00ffcc;
            color: #1a1a1a;
            box-shadow: 0 0 15px #00ffcc;
            transform: scale(1.03);
        }

        .map-grid, .bonus-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .skin-container {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 750px;
        }

        .skin-card {
            background: #333;
            border: 2px solid #555;
            padding: 8px 10px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            width: 85px;
        }

        .skin-card.selected {
            border-color: #00ffcc;
            box-shadow: 0 0 10px #00ffcc;
        }

        .skin-card.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .skin-preview {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            margin: 0 auto 6px auto;
        }

        #top-hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 5;
            background: rgba(0,0,0,0.3);
        }

        .hud-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.1rem;
            font-weight: bold;
        }

        #progress-bar-container {
            width: 100%;
            height: 12px;
            background: #444;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #666;
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00ffcc, #ff00ff);
            transition: width 0.1s linear;
        }

        .player {
            position: absolute;
            left: 80px;
            bottom: 60px;
            width: 40px;
            height: 40px;
            background: #ff5555;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            box-shadow: 0 0 10px #ff5555;
            z-index: 4;
        }

        .ball {
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
        }

        .basket {
            position: absolute;
            left: 490px;
            bottom: 60px;
            width: 70px;
            height: 50px;
            border: 4px solid #666;
            border-top: none;
            border-radius: 0 0 20px 20px;
            background: rgba(100, 100, 100, 0.2);
            transition: background 0.1s, border-color 0.1s, box-shadow 0.1s;
            z-index: 4;
        }

        .basket.open-good {
            background: rgba(68, 255, 68, 0.4);
            border-color: #44ff44;
            box-shadow: 0 0 20px #44ff44;
        }

        .basket.open-perfect {
            background: rgba(0, 255, 204, 0.4);
            border-color: #00ffcc;
            box-shadow: 0 0 25px #00ffcc;
        }

        .basket.closed {
            background: rgba(255, 85, 85, 0.4);
            border-color: #ff5555;
            box-shadow: 0 0 20px #ff5555;
        }

        #basket-balls-container {
            position: absolute;
            left: 490px;
            bottom: 60px;
            width: 70px;
            height: 40px;
            z-index: 4;
            pointer-events: none;
            overflow: hidden;
        }

        .collected-ball {
            position: absolute;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        #feedback-text {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            font-weight: bold;
            z-index: 6;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
            pointer-events: none;
            transition: opacity 0.5s;
        }

        .back-btn {
            position: absolute;
            bottom: 10px;
            background: #444;
            border: none;
            color: #fff;
            padding: 6px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
        .back-btn:hover {
            background: #666;
        }

        /* 도움말 버튼 (우측 상단 ?) */
        #help-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 35px;
            height: 35px;
            background: #333;
            border: 2px solid #00ffcc;
            color: #00ffcc;
            border-radius: 50%;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            z-index: 15;
        }
        #help-btn:hover {
            background: #00ffcc;
            color: #1a1a1a;
            box-shadow: 0 0 10px #00ffcc;
        }

        /* 모달 공통 스타일 */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }

        .modal-box {
            background: #2b2b2b;
            border: 2px solid #00ffcc;
            padding: 20px 30px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,255,204,0.3);
            max-width: 350px;
            width: 100%;
        }

        .modal-box h2 {
            color: #00ffcc;
            margin-top: 0;
            margin-bottom: 15px;
        }

        .modal-box p {
            line-height: 1.6;
            color: #ddd;
            margin-bottom: 20px;
            text-align: left;
        }

        .modal-btns {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- 우측 상단 도움말 버튼 -->
        <button id="help-btn" onclick="openHelpModal()">?</button>

        <!-- 1. 시작 화면 -->
        <div id="main-menu" class="screen">
            <h1>BALL RHYTHM</h1>
            <p style="color: #ffcc00; font-size: 0.9rem; margin-bottom: 5px;">🔊 소리를 활성화하는 것을 권장합니다</p>
            <p id="total-score-display" style="color: #00ffcc; font-weight: bold; margin-bottom: 8px;">누적 점수: 0점</p>
            <button class="menu-btn" onclick="openScreen('map-screen')">게임 시작</button>
            <button class="menu-btn" onclick="openScreen('skin-screen')">스킨 상점</button>
            <button id="bonus-menu-btn" class="menu-btn hidden" style="border-color: #ff00ff; color: #ff99ff;" onclick="openScreen('bonus-screen')">보너스 모드 (속도 조절)</button>
        </div>

        <!-- 2. 스킨 화면 -->
        <div id="skin-screen" class="screen hidden">
            <h1>스킨 상점</h1>
            <div class="skin-container">
                <div class="skin-card selected" id="skin-default" onclick="selectSkin('default')">
                    <div class="skin-preview" style="background: #00ffcc; box-shadow: 0 0 8px #00ffcc;"></div>
                    <span style="font-size:0.75rem;">기본공</span>
                </div>
                <div class="skin-card locked" id="skin-yellow" onclick="selectSkin('yellow')">
                    <div class="skin-preview" style="background: #ffcc00; box-shadow: 0 0 8px #ffcc00;"></div>
                    <span id="yellow-status" style="font-size:0.68rem;">노랑공<br>(1맵 1천점)</span>
                </div>
                <div class="skin-card locked" id="skin-blue" onclick="selectSkin('blue')">
                    <div class="skin-preview" style="background: #0088ff; box-shadow: 0 0 8px #0088ff;"></div>
                    <span id="blue-status" style="font-size:0.68rem;">파랑공<br>(2맵 1천점)</span>
                </div>
                <div class="skin-card locked" id="skin-purple" onclick="selectSkin('purple')">
                    <div class="skin-preview" style="background: #9933ff; box-shadow: 0 0 8px #9933ff;"></div>
                    <span id="purple-status" style="font-size:0.68rem;">보라공<br>(3맵 1천점)</span>
                </div>
                <div class="skin-card locked" id="skin-red" onclick="selectSkin('red')">
                    <div class="skin-preview" style="background: #ff3333; box-shadow: 0 0 8px #ff3333;"></div>
                    <span id="red-status" style="font-size:0.68rem;">빨강공<br>(누적1만)</span>
                </div>
                <div class="skin-card locked" id="skin-green" onclick="selectSkin('green')">
                    <div class="skin-preview" style="background: #33cc33; box-shadow: 0 0 8px #33cc33;"></div>
                    <span id="green-status" style="font-size:0.68rem;">초록공<br>(누적3만)</span>
                </div>
                <div class="skin-card locked" id="skin-black" onclick="selectSkin('black')">
                    <div class="skin-preview" style="background: #222222; border: 1px solid #777; box-shadow: 0 0 8px #000;"></div>
                    <span id="black-status" style="font-size:0.68rem;">검은공<br>(누적5만)</span>
                </div>
                <div class="skin-card locked" id="skin-custom" onclick="selectSkin('custom')">
                    <div class="skin-preview" style="background: linear-gradient(45deg, red, yellow, blue);"></div>
                    <span id="custom-status" style="font-size:0.68rem;">커스텀<br>(누적10만)</span>
                </div>
            </div>
            <button class="back-btn" onclick="openScreen('main-menu')">돌아가기</button>
        </div>

        <!-- 3. 맵 선택 화면 -->
        <div id="map-screen" class="screen hidden">
            <h1>맵 선택</h1>
            <div class="map-grid">
                <button class="menu-btn" onclick="startGame(0, 1)">맵 1: 네온 스타트 (Easy)</button>
                <button class="menu-btn" onclick="startGame(1, 1)">맵 2: 더블 비트 서킷 (Hard)</button>
                <button class="menu-btn" style="border-color: #ff5555;" onclick="startGame(2, 1)">맵 3: 카오스 익스트림 (Extreme)</button>
            </div>
            <button class="back-btn" onclick="openScreen('main-menu')">돌아가기</button>
        </div>

        <!-- 5. 보너스 모드 화면 -->
        <div id="bonus-screen" class="screen hidden">
            <h1>보너스 모드 (속도 조절)</h1>
            <div class="bonus-grid">
                <button class="menu-btn" style="border-color: #ff00ff;" onclick="startBonusGame(1.5)">1.5배속 모드</button>
                <button class="menu-btn" style="border-color: #ff00ff;" onclick="startBonusGame(2.0)">2.0배속 모드</button>
                <button class="menu-btn" style="border-color: #ff00ff;" onclick="startBonusGame(2.5)">2.5배속 모드</button>
                <button class="menu-btn" style="border-color: #ff00ff;" onclick="startBonusGame(3.0)">3.0배속 모드</button>
            </div>
            <button class="back-btn" onclick="openScreen('main-menu')">돌아가기</button>
        </div>

        <!-- 4. 결과 화면 -->
        <div id="result-screen" class="screen hidden">
            <h1 id="result-title">STAGE CLEAR!</h1>
            <p id="result-desc">점수 및 결과 정보</p>
            <button class="menu-btn" onclick="openScreen('map-screen')">맵 선택으로</button>
        </div>

        <!-- 플레이 방법 설명 모달 -->
        <div id="help-modal" class="modal-overlay hidden">
            <div class="modal-box">
                <h2>플레이 방법</h2>
                <p>
                    <strong>SPACE:</strong> 공 던지기<br>
                    <strong>ESC:</strong> 메뉴 화면<br>
                    <strong>P:</strong> 초기화 설정
                </p>
                <button class="menu-btn" style="width: 100%; margin: 0;" onclick="closeHelpModal()">닫기</button>
            </div>
        </div>

        <!-- 초기화 확인 모달 -->
        <div id="reset-modal" class="modal-overlay hidden">
            <div class="modal-box">
                <h2>초기화 설정</h2>
                <p style="text-align: center;">초기화 하시겠습니까?</p>
                <div class="modal-btns">
                    <button class="menu-btn" style="width: 110px; border-color: #ff5555; color: #ff5555;" onclick="executeReset()">예</button>
                    <button class="menu-btn" style="width: 110px;" onclick="closeResetModal()">아니오</button>
                </div>
            </div>
        </div>

        <!-- 상단 HUD -->
        <div id="top-hud" class="hidden">
            <div class="hud-row">
                <span id="hud-map-name">맵: 네온 스타트</span>
                <span id="hud-score">Score: 0 | Combo: 0</span>
            </div>
            <div id="progress-bar-container">
                <div id="progress-bar"></div>
            </div>
        </div>

        <div id="feedback-text" class="hidden"></div>
        <div class="player hidden" id="player">P</div>
        <div class="basket hidden" id="basket"></div>
        <div id="basket-balls-container"></div>
    </div>

    <script>
        const mainMenu = document.getElementById('main-menu');
        const skinScreen = document.getElementById('skin-screen');
        const mapScreen = document.getElementById('map-screen');
        const bonusScreen = document.getElementById('bonus-screen');
        const resultScreen = document.getElementById('result-screen');
        const topHud = document.getElementById('top-hud');
        const player = document.getElementById('player');
        const basket = document.getElementById('basket');
        const basketBallsContainer = document.getElementById('basket-balls-container');
        const container = document.getElementById('game-container');
        const progressBar = document.getElementById('progress-bar');
        const hudMapName = document.getElementById('hud-map-name');
        const hudScore = document.getElementById('hud-score');
        const feedbackText = document.getElementById('feedback-text');
        const resultTitle = document.getElementById('result-title');
        const resultDesc = document.getElementById('result-desc');
        const bonusMenuBtn = document.getElementById('bonus-menu-btn');
        const totalScoreDisplay = document.getElementById('total-score-display');
        const helpModal = document.getElementById('help-modal');
        const resetModal = document.getElementById('reset-modal');
        const helpBtn = document.getElementById('help-btn');

        let isPlaying = false;
        let audioCtx = null;

        let totalScore = 0;
        let unlockedYellow = false;
        let unlockedBlue = false;
        let unlockedPurple = false;
        let unlockedRed = false;
        let unlockedGreen = false;
        let unlockedBlack = false;
        let unlockedCustom = false;
        let currentSkin = 'default';
        let spacePressed = false;

        function openHelpModal() {
            helpModal.classList.remove('hidden');
        }

        function closeHelpModal() {
            helpModal.classList.add('hidden');
        }

        function openResetModal() {
            resetModal.classList.remove('hidden');
        }

        function closeResetModal() {
            resetModal.classList.add('hidden');
        }

        function executeReset() {
            totalScore = 0;
            unlockedYellow = false;
            unlockedBlue = false;
            unlockedPurple = false;
            unlockedRed = false;
            unlockedGreen = false;
            unlockedBlack = false;
            unlockedCustom = false;
            currentSkin = 'default';

            totalScoreDisplay.innerText = `누적 점수: ${totalScore}점`;
            
            // 모든 스킨 카드 잠금 상태 복원
            document.querySelectorAll('.skin-card').forEach(card => card.classList.remove('selected', 'locked'));
            document.querySelectorAll('.skin-card:not(#skin-default)').forEach(card => card.classList.add('locked'));
            document.getElementById('skin-default').classList.add('selected');

            document.getElementById('yellow-status').innerHTML = "노랑공<br>(1맵 1천점)";
            document.getElementById('blue-status').innerHTML = "파랑공<br>(2맵 1천점)";
            document.getElementById('purple-status').innerHTML = "보라공<br>(3맵 1천점)";
            document.getElementById('red-status').innerHTML = "빨강공<br>(누적1만)";
            document.getElementById('green-status').innerHTML = "초록공<br>(누적3만)";
            document.getElementById('black-status').innerHTML = "검은공<br>(누적5만)";
            document.getElementById('custom-status').innerHTML = "커스텀<br>(누적10만)";

            bonusMenuBtn.classList.add('hidden');
            closeResetModal();
            openScreen('main-menu');
            alert("게임 데이터가 초기화되었습니다.");
        }

        function selectSkin(skinName) {
            if (skinName === 'yellow' && !unlockedYellow) return;
            if (skinName === 'blue' && !unlockedBlue) return;
            if (skinName === 'purple' && !unlockedPurple) return;
            if (skinName === 'red' && !unlockedRed) return;
            if (skinName === 'green' && !unlockedGreen) return;
            if (skinName === 'black' && !unlockedBlack) return;
            if (skinName === 'custom' && !unlockedCustom) return;
            
            currentSkin = skinName;
            
            document.querySelectorAll('.skin-card').forEach(card => card.classList.remove('selected'));
            document.getElementById('skin-' + skinName).classList.add('selected');
        }

        function checkSkinsAndRewards(diffIndex, stageScore) {
            totalScore += stageScore;
            totalScoreDisplay.innerText = `누적 점수: ${totalScore}점`;

            if (diffIndex === 0 && stageScore >= 1000 && !unlockedYellow) {
                unlockedYellow = true;
                document.getElementById('skin-yellow').classList.remove('locked');
                document.getElementById('yellow-status').innerHTML = "노랑공<br>(해금완료)";
                alert("축하합니다! 1스테이지 1,000점 달성으로 '노랑공' 해금!");
            }
            if (diffIndex === 1 && stageScore >= 1000 && !unlockedBlue) {
                unlockedBlue = true;
                document.getElementById('skin-blue').classList.remove('locked');
                document.getElementById('blue-status').innerHTML = "파랑공<br>(해금완료)";
                alert("축하합니다! 2스테이지 1,000점 달성으로 '파랑공' 해금!");
            }
            if (diffIndex === 2 && speedMultiplier === 1 && stageScore >= 1000 && !unlockedPurple) {
                unlockedPurple = true;
                document.getElementById('skin-purple').classList.remove('locked');
                document.getElementById('purple-status').innerHTML = "보라공<br>(해금완료)";
                alert("축하합니다! 3스테이지 1,000점 달성으로 '보라공' 해금!");
            }

            if (totalScore >= 10000 && !unlockedRed) {
                unlockedRed = true;
                document.getElementById('skin-red').classList.remove('locked');
                document.getElementById('red-status').innerHTML = "빨강공<br>(해금완료)";
                alert("축하합니다! 누적 10,000점 달성으로 '빨강공' 해금!");
            }
            if (totalScore >= 30000 && !unlockedGreen) {
                unlockedGreen = true;
                document.getElementById('skin-green').classList.remove('locked');
                document.getElementById('green-status').innerHTML = "초록공<br>(해금완료)";
                alert("축하합니다! 누적 30,000점 달성으로 '초록공' 해금!");
            }
            if (totalScore >= 50000 && !unlockedBlack) {
                unlockedBlack = true;
                document.getElementById('skin-black').classList.remove('locked');
                document.getElementById('black-status').innerHTML = "검은공<br>(해금완료)";
                alert("축하합니다! 누적 50,000점 달성으로 '검은공' 해금!");
            }
            if (totalScore >= 100000 && !unlockedCustom) {
                unlockedCustom = true;
                document.getElementById('skin-custom').classList.remove('locked');
                document.getElementById('custom-status').innerHTML = "커스텀<br>(해금완료)";
                bonusMenuBtn.classList.remove('hidden');
                alert("축하합니다! 누적 100,000점 달성으로 궁극의 '커스텀 색 공' 및 '보너스 모드' 해금!");
            }
        }

        const difficulties = [
            { name: "맵 1: 네온 스타트 (Easy)", beatInterval: 1050, openDuration: 600, totalBeats: 20, patternType: 'normal' },
            { name: "맵 2: 더블 비트 서킷 (Hard)", beatInterval: 1000, openDuration: 500, totalBeats: 24, patternType: 'double' },
            { name: "맵 3: 카오스 익스트림 (Extreme)", beatInterval: 420, openDuration: 180, totalBeats: 32, patternType: 'chaos' }
        ];

        let currentDiffIndex = 0;
        let currentBeatCount = 0;
        let score = 0;
        let combo = 0;
        let gameTimer = null;
        let isBasketOpen = false;
        let collectedBalls = [];
        let speedMultiplier = 1;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playThudSound(freq = 150) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(35, audioCtx.currentTime + 0.2);

            gain.gain.setValueAtTime(0.9, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }

        function openScreen(screenId) {
            stopGame();
            closeHelpModal();
            closeResetModal();
            mainMenu.classList.add('hidden');
            skinScreen.classList.add('hidden');
            mapScreen.classList.add('hidden');
            bonusScreen.classList.add('hidden');
            resultScreen.classList.add('hidden');
            
            // 시작 화면일 때만 ? 버튼 표시
            if (screenId === 'main-menu') {
                helpBtn.classList.remove('hidden');
            } else {
                helpBtn.classList.add('hidden');
            }

            document.getElementById(screenId).classList.remove('hidden');
        }

        function startGame(diffIndex, mult) {
            initAudio();
            helpBtn.classList.add('hidden');
            currentDiffIndex = diffIndex;
            speedMultiplier = mult;
            const baseDiff = difficulties[diffIndex];

            const diff = {
                name: baseDiff.name + (mult > 1 ? ` (x${mult})` : ''),
                beatInterval: baseDiff.beatInterval / mult,
                openDuration: baseDiff.openDuration / mult,
                totalBeats: baseDiff.totalBeats,
                patternType: baseDiff.patternType
            };

            mainMenu.classList.add('hidden');
            mapScreen.classList.add('hidden');
            bonusScreen.classList.add('hidden');
            topHud.classList.remove('hidden');
            player.classList.remove('hidden');
            basket.classList.remove('hidden');

            hudMapName.innerText = diff.name;
            score = 0;
            combo = 0;
            currentBeatCount = 0;
            clearBasketBalls();
            updateScoreAndProgress();

            isPlaying = true;
            spacePressed = false;
            runRhythmLoop(diff);
        }

        function startBonusGame(mult) {
            startGame(2, mult);
        }

        function stopGame() {
            isPlaying = false;
            spacePressed = false;
            topHud.classList.add('hidden');
            player.classList.add('hidden');
            basket.classList.add('hidden');
            clearTimeout(gameTimer);
        }

        function clearBasketBalls() {
            collectedBalls.forEach(b => b.remove());
            collectedBalls = [];
        }

        function addBallToBasket() {
            let ballColor = '#00ffcc';
            if (currentSkin === 'yellow') ballColor = '#ffcc00';
            if (currentSkin === 'blue') ballColor = '#0088ff';
            if (currentSkin === 'purple') ballColor = '#9933ff';
            if (currentSkin === 'red') ballColor = '#ff3333';
            if (currentSkin === 'green') ballColor = '#33cc33';
            if (currentSkin === 'black') ballColor = '#222222';
            if (currentSkin === 'custom') ballColor = 'linear-gradient(45deg, red, yellow, blue)';

            const bEl = document.createElement('div');
            bEl.classList.add('collected-ball');
            bEl.style.background = ballColor;
            bEl.style.left = (20 + Math.random() * 30) + 'px';
            bEl.style.top = (20 + Math.random() * 10) + 'px';
            
            basketBallsContainer.appendChild(bEl);
            collectedBalls.push(bEl);

            if (collectedBalls.length > 3) {
                const oldestBall = collectedBalls.shift();
                oldestBall.remove();
            }
        }

        function runRhythmLoop(diff) {
            if (!isPlaying) return;

            if (currentBeatCount >= diff.totalBeats) {
                checkSkinsAndRewards(currentDiffIndex, score);
                endGame(true);
                return;
            }

            let startDelay = 0;
            if (diff.patternType === 'chaos') {
                startDelay = (currentBeatCount % 3 === 0) ? 120 : ((currentBeatCount % 2 === 0) ? -60 : 0);
            }

            gameTimer = setTimeout(() => {
                if (!isPlaying) return;

                let thudFreq = 150;
                if (currentDiffIndex === 1) thudFreq = 180;
                if (currentDiffIndex === 2 || speedMultiplier > 1) thudFreq = 220;
                
                playThudSound(thudFreq);
                isBasketOpen = true;
                basket.className = 'basket open-good';

                let perfectDelay = diff.openDuration * 0.35;
                let perfectTimer = setTimeout(() => {
                    if (!isPlaying || !isBasketOpen) return;
                    basket.className = 'basket open-perfect';
                }, perfectDelay);

                if (diff.patternType === 'double') {
                    setTimeout(() => {
                        if (!isPlaying) return;
                        isBasketOpen = false;
                        basket.className = 'basket closed';

                        setTimeout(() => {
                            if (!isPlaying) return;
                            playThudSound(200);
                            isBasketOpen = true;
                            basket.className = 'basket open-perfect';
                        }, 90);
                    }, diff.openDuration / 2);
                }

                gameTimer = setTimeout(() => {
                    if (!isPlaying) return;
                    clearTimeout(perfectTimer);
                    isBasketOpen = false;
                    basket.className = 'basket closed';

                    let nextWait = diff.beatInterval - diff.openDuration - startDelay;
                    gameTimer = setTimeout(() => {
                        currentBeatCount++;
                        updateScoreAndProgress();
                        runRhythmLoop(diff);
                    }, nextWait > 30 ? nextWait : 30);

                }, diff.openDuration);

            }, Math.max(10, startDelay));
        }

        function updateScoreAndProgress() {
            const baseDiff = difficulties[currentDiffIndex];
            hudScore.innerText = `Score: ${score} | Combo: ${combo}`;
            let percent = Math.floor((currentBeatCount / baseDiff.totalBeats) * 100);
            progressBar.style.width = percent + '%';
        }

        const startX = 100;
        const startY = 360;
        const targetX = 525; 

        function throwBall() {
            if (!isPlaying) return;

            const ball = document.createElement('div');
            ball.classList.add('ball');
            
            if (currentSkin === 'yellow') {
                ball.style.background = '#ffcc00';
                ball.style.boxShadow = '0 0 10px #ffcc00';
            } else if (currentSkin === 'blue') {
                ball.style.background = '#0088ff';
                ball.style.boxShadow = '0 0 10px #0088ff';
            } else if (currentSkin === 'purple') {
                ball.style.background = '#9933ff';
                ball.style.boxShadow = '0 0 10px #9933ff';
            } else if (currentSkin === 'red') {
                ball.style.background = '#ff3333';
                ball.style.boxShadow = '0 0 10px #ff3333';
            } else if (currentSkin === 'green') {
                ball.style.background = '#33cc33';
                ball.style.boxShadow = '0 0 10px #33cc33';
            } else if (currentSkin === 'black') {
                ball.style.background = '#222222';
                ball.style.boxShadow = '0 0 10px #000';
            } else if (currentSkin === 'custom') {
                ball.style.background = 'linear-gradient(45deg, red, yellow, blue)';
                ball.style.boxShadow = '0 0 12px #ff00ff';
            } else {
                ball.style.background = '#00ffcc';
                ball.style.boxShadow = '0 0 10px #00ffcc';
            }

            ball.style.left = startX + 'px';
            ball.style.top = startY + 'px';
            container.appendChild(ball);

            let posX = startX;
            let posY = startY;
            let flightTimeFrames = 30; 
            let speedX = (targetX - startX) / flightTimeFrames;
            let speedY = -7.2;
            let gravity = 0.45;

            let frameCount = 0;
            let hasCheckedHit = false;

            function update() {
                if (!isPlaying) {
                    ball.remove();
                    return;
                }

                posX += speedX;
                posY += speedY;
                speedY += gravity;
                frameCount++;

                ball.style.left = posX + 'px';
                ball.style.top = posY + 'px';

                if (!hasCheckedHit && posX >= targetX - 35 && posX <= targetX + 35) {
                    hasCheckedHit = true;
                    let distance = Math.abs(posX - targetX);

                    if (isBasketOpen) {
                        if (distance <= 14) {
                            score += 100; 
                            combo++;
                            showFeedback("PERFECT! (+100)", "#00ffcc");
                        } else {
                            score += 50;  
                            combo++;
                            showFeedback("GOOD! (+50)", "#ffcc00");
                        }

                        if (combo === 10) {
                            score += 400;
                            showFeedback("COMBO 10! (+400)", "#ff00ff");
                        }

                        addBallToBasket();
                        ball.style.transform = "translate(-50%, -50%) scale(0.2)";
                        ball.style.opacity = "0";
                    } else {
                        combo = 0;
                        showFeedback("MISS", "#ff5555");
                    }
                    updateScoreAndProgress();
                }

                if (frameCount > flightTimeFrames + 15 || posY > container.clientHeight) {
                    ball.remove();
                } else {
                    requestAnimationFrame(update);
                }
            }

            requestAnimationFrame(update);
        }

        function showFeedback(text, color) {
            feedbackText.innerText = text;
            feedbackText.style.color = color;
            feedbackText.style.opacity = '1';
            setTimeout(() => {
                feedbackText.style.opacity = '0';
            }, 300);
        }

        function endGame(isClear) {
            stopGame();
            resultScreen.classList.remove('hidden');
            if (isClear) {
                resultTitle.innerText = "STAGE CLEAR!";
                resultTitle.style.color = "#00ffcc";
                resultDesc.innerText = `획득 점수: ${score}점 (총 누적: ${totalScore}점)`;
            } else {
                resultTitle.innerText = "GAME OVER";
                resultTitle.style.color = "#ff5555";
                resultDesc.innerText = `도달한 점수: ${score}점`;
            }
        }

        window.addEventListener('keydown', (e) => {
            // P 키 입력 시 초기화 확인 창 토글 (메인 화면에서만 동작 또는 게임 외 상태에서)
            if (e.code === 'KeyP' && !isPlaying) {
                e.preventDefault();
                if (resetModal.classList.contains('hidden')) {
                    openResetModal();
                } else {
                    closeResetModal();
                }
                return;
            }

            if (e.code === 'Space' && isPlaying) {
                e.preventDefault();
                if (!spacePressed) {
                    spacePressed = true;
                    throwBall();
                }
            }
            if (e.code === 'Escape') {
                if (!resetModal.classList.contains('hidden')) {
                    closeResetModal();
                } else if (!helpModal.classList.contains('hidden')) {
                    closeHelpModal();
                } else {
                    openScreen('main-menu');
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space') {
                spacePressed = false;
            }
        });
    </script>
</body>
