<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>NIGHTLINE / CITY SWING</title>
<style>
  :root{ --acc:#7ef0d0; --warn:#ff5a4a; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#05070a;}
  body{font-family:'Consolas','Menlo','Courier New',monospace;user-select:none;-webkit-user-select:none;touch-action:none;cursor:crosshair;}
  canvas{display:block;position:fixed;top:0;left:0;width:100%;height:100%;}
  #gl{z-index:1;}
  #ui{z-index:2;pointer-events:none;}
  #help{
    position:fixed;z-index:5;left:18px;top:18px;max-width:342px;
    padding:13px 15px 14px;background:rgba(6,10,14,.82);
    border:1px solid rgba(126,240,208,.32);border-left:3px solid var(--acc);
    color:#d5e8e2;font-size:12px;line-height:1.65;backdrop-filter:blur(6px);
    transition:opacity .6s ease;
  }
  #help h1{margin:0 0 8px;font-size:12px;letter-spacing:2.5px;color:var(--acc);font-weight:700;}
  #help dl{margin:0;display:grid;grid-template-columns:104px 1fr;gap:3px 10px;}
  #help dt{color:#ff9d6b;font-weight:700;}
  #help dd{margin:0;color:#b6cbc5;}
  #help .foot{margin-top:9px;padding-top:8px;border-top:1px solid rgba(126,240,208,.18);color:#7b918b;font-size:11px;}
  #help.dim{opacity:0;}
  #boot{
    position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;
    flex-direction:column;background:#05070a;color:var(--acc);font-size:13px;letter-spacing:4px;
  }
  #boot span{margin-top:14px;color:#41615a;font-size:11px;letter-spacing:2px;}
  #boot.done{opacity:0;pointer-events:none;transition:opacity .8s ease;}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<canvas id="gl"></canvas>
<canvas id="ui"></canvas>

<div id="help">
  <h1>NIGHTLINE &middot; CITY SWING</h1>
  <dl>
    <dt>마우스 클릭·유지</dt><dd>커서 지점에 줄 발사 / 스윙</dd>
    <dt>버튼 놓기</dt><dd>줄 끊고 관성으로 비행</dd>
    <dt>W A S D</dt><dd>공중 자세 제어 / 지상 이동</dd>
    <dt>Space</dt><dd>점프 · 도약</dd>
    <dt>Shift</dt><dd>줄 감기 (가속)</dd>
    <dt>R</dt><dd>출발 지점으로 복귀</dd>
    <dt>H / P</dt><dd>안내창 / 화질 전환</dd>
  </dl>
  <p class="foot">건물 벽에 커서를 올리고 클릭하면 줄이 붙습니다. 진자 최저점에서 놓으면 가장 멀리 날아갑니다. 붉은 표시를 따라가면 벽을 부수는 거인이 있습니다.</p>
</div>

<div id="boot">SYSTEMS INITIALIZING<span>CITY MESH / TRAVERSAL</span></div>

<script>
(function () {
  'use strict';

  var DEG = Math.PI / 180;
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }

  var C = {
    acc: '#ff3a48', ice: '#f2f4f6', warn: '#ff8a3a',
    amber: '#ffb04a', dim: 'rgba(242,244,246,.45)'
  };
  var FOV = 72;

  if (typeof THREE === 'undefined') {
    document.getElementById('boot').innerHTML =
      'THREE.JS \uB85C\uB4DC \uC2E4\uD328<span>\uC778\uD130\uB137 \uC5F0\uACB0\uC744 \uD655\uC778\uD558\uC138\uC694</span>';
    return;
  }
  start();

  function start() {

    function sRGBc(hex) { return new THREE.Color(hex).convertSRGBToLinear(); }

    // ---------------------------------------------- renderer
    var glCanvas = document.getElementById('gl');
    var renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.autoClear = false;
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.06;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    var scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(sRGBc(0x120a0e).getHex(), 0.00115);

    var camera = new THREE.PerspectiveCamera(FOV, window.innerWidth / window.innerHeight, 0.15, 3000);

    // ---------------------------------------------- sky (unmanaged, display space)
    var skyMat = new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false, fog: false,
      uniforms: {
        top: { value: new THREE.Color(0x07080b) },
        mid: { value: new THREE.Color(0x14121a) },
        bot: { value: new THREE.Color(0x4d0d16) }
      },
      vertexShader: 'varying vec3 vP;void main(){vP=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
      fragmentShader: [
        'uniform vec3 top;uniform vec3 mid;uniform vec3 bot;varying vec3 vP;',
        'void main(){float y=clamp(vP.y*1.5+0.05,-1.0,1.0);',
        'vec3 c=y>0.0?mix(mid,top,pow(y,0.7)):mix(mid,bot,pow(-y,0.42));',
        'gl_FragColor=vec4(c,1.0);}'
      ].join('\n')
    });
    var sky = new THREE.Mesh(new THREE.SphereGeometry(900, 32, 18), skyMat);
    sky.renderOrder = -1;
    scene.add(sky);

    scene.add(new THREE.HemisphereLight(sRGBc(0x3c4d70), sRGBc(0x181520), 0.52));
    var fill = new THREE.DirectionalLight(sRGBc(0xff3a46), 0.10);
    fill.position.set(220, 60, -180);
    scene.add(fill);
    var sun = new THREE.DirectionalLight(sRGBc(0xe4ecf7), 2.45);
    sun.position.set(-180, 220, 120);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    var shCam = sun.shadow.camera;
    shCam.left = -140; shCam.right = 140; shCam.top = 140; shCam.bottom = -140;
    shCam.near = 1; shCam.far = 700;
    shCam.updateProjectionMatrix();
    sun.shadow.bias = -0.0008;
    sun.shadow.normalBias = 0.8;
    scene.add(sun);
    scene.add(sun.target);

    // flat cel ramp: a handful of hard value steps, like screen-printed art
    function toonRamp(steps) {
      var d = new Uint8Array(steps);
      for (var i = 0; i < steps; i++) d[i] = Math.round(28 + (i / (steps - 1)) * 227);
      var t = new THREE.DataTexture(d, steps, 1, THREE.LuminanceFormat);
      t.minFilter = THREE.NearestFilter;
      t.magFilter = THREE.NearestFilter;
      t.generateMipmaps = false;
      t.needsUpdate = true;
      return t;
    }
    var RAMP = toonRamp(4);

    // crimson rim so silhouettes separate from the black field
    function rimLight(mat, hex, amt, power) {
      var col = sRGBc(hex);
      mat.onBeforeCompile = function (sh) {
        sh.uniforms.rimCol = { value: col };
        sh.uniforms.rimAmt = { value: amt };
        sh.fragmentShader = sh.fragmentShader
          .replace('#include <common>',
            '#include <common>\nuniform vec3 rimCol;uniform float rimAmt;')
          .replace('#include <tonemapping_fragment>',
            'float rimF = pow( 1.0 - clamp( dot( normalize( normal ), normalize( vViewPosition ) ), 0.0, 1.0 ), ' + power.toFixed(1) + ' );\n' +
            'gl_FragColor.rgb += rimCol * rimF * rimAmt;\n' +
            '#include <tonemapping_fragment>');
      };
      mat.customProgramCacheKey = function () { return 'rim' + amt + '_' + power; };
      return mat;
    }
    function skySheen(mat) { return mat; }

    // ---------------------------------------------- street grid ground
    var GH = 0;
    var groundGeo = new THREE.PlaneGeometry(3000, 3000, 1, 1);
    groundGeo.rotateX(-Math.PI / 2);
    var streetTex = (function () {
      var cv = document.createElement('canvas');
      cv.width = cv.height = 512;
      var g = cv.getContext('2d');
      g.fillStyle = '#2e3237'; g.fillRect(0, 0, 512, 512);
      for (var i = 0; i < 4000; i++) {
        g.fillStyle = 'rgba(' + (Math.random() > 0.5 ? '210,214,220,' : '12,14,17,') + (0.04 + Math.random() * 0.16) + ')';
        g.fillRect(Math.random() * 512, Math.random() * 512, 2, 2);
      }
      // pavement border of the block
      g.fillStyle = '#5b6068';
      g.fillRect(0, 0, 512, 62); g.fillRect(0, 450, 512, 62);
      g.fillRect(0, 0, 62, 512); g.fillRect(450, 0, 62, 512);
      // lane dashes
      g.fillStyle = '#c9cdd2';
      for (var d = 0; d < 512; d += 46) { g.fillRect(d, 253, 22, 5); g.fillRect(253, d, 5, 22); }
      var t = new THREE.CanvasTexture(cv);
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.repeat.set(3000 / 132, 3000 / 132);
      t.encoding = THREE.sRGBEncoding;
      t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
      return t;
    })();
    var groundMesh = new THREE.Mesh(groundGeo, new THREE.MeshToonMaterial({
      map: streetTex, color: sRGBc(0x8b929c), gradientMap: RAMP
    }));
    groundMesh.receiveShadow = true;
    scene.add(groundMesh);

    // ---------------------------------------------- city
    var buildings = [];   // AABBs for collision and grapple targeting
    (function buildCity() {
      var cv = document.createElement('canvas');
      cv.width = cv.height = 256;
      var x2 = cv.getContext('2d');
      var bg = x2.createLinearGradient(0, 0, 0, 256);
      bg.addColorStop(0, '#7a8492'); bg.addColorStop(1, '#616b79');
      x2.fillStyle = bg; x2.fillRect(0, 0, 256, 256);
      for (var wy = 0; wy < 8; wy++) {
        x2.fillStyle = 'rgba(8,9,12,.6)';
        x2.fillRect(0, wy * 32 + 26, 256, 6);
        for (var wx = 0; wx < 8; wx++) {
          var l = Math.random();
          x2.fillStyle = l > 0.94 ? '#ff6a52' : (l > 0.84 ? '#f0ad68' : (l > 0.55 ? '#6d7b91' : '#4a5464'));
          x2.fillRect(wx * 32 + 5, wy * 32 + 6, 22, 19);
          x2.fillStyle = 'rgba(255,255,255,.06)';
          x2.fillRect(wx * 32 + 5, wy * 32 + 6, 22, 5);
          x2.fillStyle = 'rgba(10,12,15,.45)';
          x2.fillRect(wx * 32 + 27, wy * 32 + 6, 2, 19);
        }
      }
      var winTex = new THREE.CanvasTexture(cv);
      winTex.wrapS = winTex.wrapT = THREE.RepeatWrapping;
      winTex.encoding = THREE.sRGBEncoding;
      winTex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());

      var P = [], NR = [], UV = [], CL = [], IDX = [];
      var tints = [0x99a3b1, 0x8b95a3, 0xa08a90, 0x818b99, 0xa4adba].map(sRGBc);
      var seed = 730941;
      function rnd() { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }

      function face(v, nx, ny, nz, uw, uh, col) {
        var b = P.length / 3;
        var uvs = [[0, 0], [uw, 0], [uw, uh], [0, uh]];
        for (var i = 0; i < 4; i++) {
          P.push(v[i][0], v[i][1], v[i][2]);
          NR.push(nx, ny, nz);
          UV.push(uvs[i][0], uvs[i][1]);
          CL.push(col.r, col.g, col.b);
        }
        IDX.push(b, b + 1, b + 2, b, b + 2, b + 3);
      }
      function box(cx, cz, w, d, h, y0, tint) {
        var x0 = cx - w / 2, x1 = cx + w / 2, z0 = cz - d / 2, z1 = cz + d / 2, y1 = y0 + h;
        var uw = w / 4.2, ud = d / 4.2, uh = h / 4.2;
        face([[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]], 0, 0, 1, uw, uh, tint);
        face([[x1, y0, z0], [x0, y0, z0], [x0, y1, z0], [x1, y1, z0]], 0, 0, -1, uw, uh, tint);
        face([[x1, y0, z1], [x1, y0, z0], [x1, y1, z0], [x1, y1, z1]], 1, 0, 0, ud, uh, tint);
        face([[x0, y0, z0], [x0, y0, z1], [x0, y1, z1], [x0, y1, z0]], -1, 0, 0, ud, uh, tint);
        var roof = tint.clone().multiplyScalar(0.55);
        face([[x0, y1, z0], [x0, y1, z1], [x1, y1, z1], [x1, y1, z0]], 0, 1, 0, 0.3, 0.3, roof);
      }

      var STEP = 132, HALF = 1150;
      for (var bx = -HALF; bx <= HALF; bx += STEP) {
        for (var bz = -HALF; bz <= HALF; bz += STEP) {
          var lots = 1 + Math.floor(rnd() * 2);
          for (var li = 0; li < lots; li++) {
            var w = 34 + rnd() * 46, d = 34 + rnd() * 46;
            var cx = bx + (rnd() - 0.5) * (STEP - 96);
            var cz = bz + (rnd() - 0.5) * (STEP - 96);
            var dist = Math.hypot(cx, cz);
            var tall = rnd();
            var h = 34 + rnd() * 60 + (dist < 780 ? tall * tall * 150 : 0);
            var tint = tints[Math.floor(rnd() * tints.length)];
            box(cx, cz, w, d, h, GH, tint);
            buildings.push({ x: cx, z: cz, w: w, d: d, h: h, y0: GH });
            if (h > 130 && rnd() > 0.4) {
              var h2 = h * (0.16 + rnd() * 0.2);
              box(cx, cz, w * 0.6, d * 0.6, h2, GH + h, tint);
              buildings.push({ x: cx, z: cz, w: w * 0.6, d: d * 0.6, h: h2, y0: GH + h });
            }
          }
        }
      }

      var g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
      g.setAttribute('normal', new THREE.Float32BufferAttribute(NR, 3));
      g.setAttribute('uv', new THREE.Float32BufferAttribute(UV, 2));
      g.setAttribute('color', new THREE.Float32BufferAttribute(CL, 3));
      g.setIndex(IDX);
      var m = new THREE.Mesh(g, new THREE.MeshToonMaterial({
        map: winTex, vertexColors: true, gradientMap: RAMP
      }));
      m.castShadow = true; m.receiveShadow = true;
      scene.add(m);
      window.__cityMesh = m;
    })();

    // ---------------------------------------------- the grappler
    var suit = rimLight(new THREE.MeshToonMaterial({ color: sRGBc(0x0d0f13), gradientMap: RAMP }), 0xff3341, 0.72, 3.4);
    var crimson = rimLight(new THREE.MeshToonMaterial({ color: sRGBc(0xb01522), gradientMap: RAMP }), 0xff5a63, 0.5, 3.2);
    var trim = new THREE.MeshBasicMaterial({ color: sRGBc(0xd6dae0) });
    var lens = new THREE.MeshBasicMaterial({ color: sRGBc(0xf4f6f8) });

    var hero = new THREE.Group();
    var torso = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.86, 0.36), suit);
    torso.position.y = 0.05; hero.add(torso);
    var hips = new THREE.Mesh(new THREE.BoxGeometry(0.54, 0.3, 0.34), suit);
    hips.position.y = -0.5; hero.add(hips);
    var shoulderL = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.26, 0.38), crimson);
    shoulderL.position.set(-0.36, 0.4, 0); hero.add(shoulderL);
    var shoulderR = shoulderL.clone(); shoulderR.position.x = 0.36; hero.add(shoulderR);
    var chestP = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.34, 0.03), crimson);
    chestP.position.set(0, 0.22, -0.19); hero.add(chestP);
    var embV = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.22, 0.03), trim);
    embV.position.set(0, 0.22, -0.21); hero.add(embV);
    var embH = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.07, 0.03), trim);
    embH.position.set(0, 0.28, -0.21); hero.add(embH);
    var belt = new THREE.Mesh(new THREE.BoxGeometry(0.56, 0.09, 0.36), crimson);
    belt.position.set(0, -0.36, 0); hero.add(belt);
    var head = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.38, 0.36), suit);
    head.position.y = 0.68; hero.add(head);
    var eyeL = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.07, 0.03), lens);
    eyeL.position.set(-0.10, 0.72, -0.19); eyeL.rotation.z = 0.22; hero.add(eyeL);
    var eyeR = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.07, 0.03), lens);
    eyeR.position.set(0.10, 0.72, -0.19); eyeR.rotation.z = -0.22; hero.add(eyeR);
    var crown = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.07, 0.38), crimson);
    crown.position.set(0, 0.86, 0); hero.add(crown);

    function limb(len, w) {
      var grp = new THREE.Group();
      var m2 = new THREE.Mesh(new THREE.BoxGeometry(w, len, w), suit);
      m2.position.y = -len / 2;
      grp.add(m2);
      return grp;
    }
    function cuff(grp, len, w) {
      var c = new THREE.Mesh(new THREE.BoxGeometry(w * 1.18, len * 0.34, w * 1.18), crimson);
      c.position.y = -len * 0.82;
      grp.add(c);
    }
    var armL = limb(0.78, 0.17); armL.position.set(-0.38, 0.42, 0); cuff(armL, 0.78, 0.17); hero.add(armL);
    var armR = limb(0.78, 0.17); armR.position.set(0.38, 0.42, 0); cuff(armR, 0.78, 0.17); hero.add(armR);
    var legL = limb(0.9, 0.2); legL.position.set(-0.17, -0.6, 0); cuff(legL, 0.9, 0.2); hero.add(legL);
    var legR = limb(0.9, 0.2); legR.position.set(0.17, -0.6, 0); cuff(legR, 0.9, 0.2); hero.add(legR);
    hero.traverse(function (o) { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    scene.add(hero);

    // web line
    var webGeoC = new THREE.CylinderGeometry(0.055, 0.055, 1, 6, 1, true);
    var webLine = new THREE.Mesh(webGeoC, new THREE.MeshBasicMaterial({ color: 0xffffff }));
    webLine.frustumCulled = false;
    webLine.visible = false;
    scene.add(webLine);
    var WEB_UP = new THREE.Vector3(0, 1, 0);

    var anchorMark = new THREE.Mesh(new THREE.SphereGeometry(0.45, 10, 8),
      new THREE.MeshBasicMaterial({ color: 0xffffff }));
    anchorMark.visible = false;
    scene.add(anchorMark);

    // ---------------------------------------------- the wall breaker
    var brute = new THREE.Group();
    (function () {
      var skin = rimLight(new THREE.MeshToonMaterial({ color: sRGBc(0x2f8a34), gradientMap: RAMP }), 0x7dff8a, 0.45, 3.6);
      var cloth = new THREE.MeshToonMaterial({ color: sRGBc(0x14161a), gradientMap: RAMP });
      var t = new THREE.Mesh(new THREE.BoxGeometry(3.4, 3.0, 2.0), skin);
      t.position.y = 1.6; brute.add(t);
      var sh = new THREE.Mesh(new THREE.BoxGeometry(4.4, 1.2, 2.2), skin);
      sh.position.y = 2.7; brute.add(sh);
      var hd = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), skin);
      hd.position.y = 3.6; brute.add(hd);
      var pants = new THREE.Mesh(new THREE.BoxGeometry(3.2, 1.4, 2.0), cloth);
      pants.position.y = -0.2; brute.add(pants);
      function big(len, w) {
        var g2 = new THREE.Group();
        var mm = new THREE.Mesh(new THREE.BoxGeometry(w, len, w), skin);
        mm.position.y = -len / 2; g2.add(mm);
        var fist = new THREE.Mesh(new THREE.BoxGeometry(w * 1.5, w * 1.4, w * 1.5), skin);
        fist.position.y = -len; g2.add(fist);
        return g2;
      }
      brute.userData.armR = big(2.6, 1.05); brute.userData.armR.position.set(2.1, 2.9, 0);
      brute.userData.armL = big(2.6, 1.05); brute.userData.armL.position.set(-2.1, 2.9, 0);
      brute.add(brute.userData.armR, brute.userData.armL);
      var lg = big(2.2, 1.1); lg.position.set(0.9, -0.7, 0); brute.add(lg);
      var lg2 = big(2.2, 1.1); lg2.position.set(-0.9, -0.7, 0); brute.add(lg2);
      brute.traverse(function (o) { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    })();
    scene.add(brute);

    var bruteHost = null, bruteFace = null, bruteY = 60, bruteT = 0, punchT = 0;
    (function pickHost() {
      var best = null;
      for (var i = 0; i < buildings.length; i++) {
        var b = buildings[i];
        if (b.h < 120) continue;
        var d = Math.hypot(b.x - 140, b.z - 140);
        if (!best || d < best.d) best = { b: b, d: d };
      }
      bruteHost = best ? best.b : buildings[0];
      bruteFace = { nx: 0, nz: 1 };
      bruteY = bruteHost.y0 + bruteHost.h * 0.55;
    })();

    // debris + shockwave pools
    var debris = [], debrisPool = [];
    var debGeo = new THREE.BoxGeometry(1, 1, 1);
    var debMat = new THREE.MeshToonMaterial({ color: sRGBc(0x6d7580), gradientMap: RAMP, flatShading: true });
    for (var di = 0; di < 90; di++) {
      var dm = new THREE.Mesh(debGeo, debMat);
      dm.visible = false; dm.castShadow = true;
      scene.add(dm);
      debrisPool.push({ m: dm, v: new THREE.Vector3(), spin: new THREE.Vector3(), life: 0 });
    }
    var ringMat = new THREE.MeshBasicMaterial({ color: 0xff3a45, transparent: true, opacity: 0, side: THREE.DoubleSide });
    var ring = new THREE.Mesh(new THREE.RingGeometry(0.86, 1.0, 40), ringMat);
    ring.visible = false;
    scene.add(ring);
    var ringT = 0;

    function spawnDebris(pos, nrm, power) {
      for (var i = 0; i < 14; i++) {
        if (!debrisPool.length) break;
        var p = debrisPool.pop();
        p.m.position.copy(pos);
        p.m.position.x += (Math.random() - 0.5) * 3;
        p.m.position.y += (Math.random() - 0.5) * 3;
        p.m.position.z += (Math.random() - 0.5) * 3;
        var s = 0.35 + Math.random() * 1.1;
        p.m.scale.set(s, s * (0.5 + Math.random()), s);
        p.m.visible = true;
        p.v.set(nrm.x * (6 + Math.random() * 10), 4 + Math.random() * 9, nrm.z * (6 + Math.random() * 10));
        p.v.x += (Math.random() - 0.5) * 7; p.v.z += (Math.random() - 0.5) * 7;
        p.v.multiplyScalar(power);
        p.spin.set(Math.random() * 6, Math.random() * 6, Math.random() * 6);
        p.life = 2.4 + Math.random() * 1.6;
        debris.push(p);
      }
    }

    // ---------------------------------------------- player physics
    var pos = new THREE.Vector3(0, 90, 260);
    var vel = new THREE.Vector3(0, 0, 0);
    var anchor = new THREE.Vector3();
    var attached = false, ropeLen = 0;
    var grounded = false;
    var camYaw = Math.PI, camPitch = -0.12;
    var shake = 0, distTravel = 0, topSpeed = 0;
    var facing = Math.PI;
    var swingPhase = 0;

    function resetPlayer() {
      // start on the approach to the wall breaker so it reads immediately
      pos.set(bruteHost.x + 6, bruteY + 46, bruteHost.z + bruteHost.d / 2 + 165);
      vel.set(0, 0, -9);
      attached = false; webLine.visible = false; anchorMark.visible = false;
      distTravel = 0; topSpeed = 0; camYaw = 0; facing = 0;
      camPos.set(pos.x, pos.y + 3, pos.z + 9);
    }

    // ---------------------------------------------- input
    var keys = {}, mouseDown = false;
    var mouseNDC = new THREE.Vector2(0, 0);
    var helpEl = document.getElementById('help');
    var helpOn = true, helpTimer = 14, postOn = true;

    window.addEventListener('keydown', function (e) {
      keys[e.code] = true;
      if (e.code === 'KeyH') { helpOn = !helpOn; helpEl.classList.toggle('dim', !helpOn); helpTimer = 14; }
      if (e.code === 'KeyR') resetPlayer();
      if (e.code === 'KeyP') {
        postOn = !postOn;
        renderer.shadowMap.enabled = postOn;
        scene.traverse(function (o) { if (o.material) o.material.needsUpdate = true; });
      }
      if (e.code === 'Space') e.preventDefault();
    });
    window.addEventListener('keyup', function (e) { keys[e.code] = false; });
    window.addEventListener('mousemove', function (e) {
      mouseNDC.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouseNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;
    });
    window.addEventListener('mousedown', function (e) {
      if (e.button !== 0) return;
      mouseDown = true;
      tryAttach();
    });
    window.addEventListener('mouseup', function (e) { if (e.button === 0) release(); });
    window.addEventListener('contextmenu', function (e) { e.preventDefault(); });

    var raycaster = new THREE.Raycaster();
    var missFlash = 0;

    function tryAttach() {
      raycaster.setFromCamera(mouseNDC, camera);
      raycaster.far = 420;
      var hits = raycaster.intersectObject(window.__cityMesh, false);
      if (hits.length) {
        anchor.copy(hits[0].point);
        ropeLen = Math.max(6, pos.distanceTo(anchor));
        attached = true;
        webLine.visible = true;
        anchorMark.visible = true;
        anchorMark.position.copy(anchor);
        swingPhase = 0;
      } else {
        missFlash = 0.5;
      }
    }
    function release() {
      mouseDown = false;
      attached = false;
      webLine.visible = false;
      anchorMark.visible = false;
    }

    // ---------------------------------------------- collision
    function resolveCollisions(dt) {
      var r = 0.75;
      grounded = false;
      if (pos.y - 1.0 <= GH) { pos.y = GH + 1.0; if (vel.y < 0) vel.y = 0; grounded = true; }
      for (var i = 0; i < buildings.length; i++) {
        var b = buildings[i];
        var hx = b.w / 2 + r, hz = b.d / 2 + r;
        var dx = pos.x - b.x, dz = pos.z - b.z;
        if (Math.abs(dx) > hx || Math.abs(dz) > hz) continue;
        if (pos.y < b.y0 - 1.2 || pos.y > b.y0 + b.h + 1.0) continue;
        var pX = hx - Math.abs(dx);
        var pZ = hz - Math.abs(dz);
        var pY = (b.y0 + b.h + 1.0) - pos.y;
        if (pY <= pX && pY <= pZ) {
          pos.y = b.y0 + b.h + 1.0;
          if (vel.y < 0) vel.y = 0;
          grounded = true;
        } else if (pX <= pZ) {
          pos.x = b.x + (dx > 0 ? hx : -hx);
          vel.x *= -0.15;
        } else {
          pos.z = b.z + (dz > 0 ? hz : -hz);
          vel.z *= -0.15;
        }
      }
    }

    // ---------------------------------------------- post chain
    var rtScene = new THREE.WebGLRenderTarget(2, 2, {
      minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
      format: THREE.RGBAFormat, depthBuffer: true, stencilBuffer: false
    });
    var rtA = new THREE.WebGLRenderTarget(2, 2, {
      minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
      format: THREE.RGBAFormat, depthBuffer: false, stencilBuffer: false
    });
    var rtB = rtA.clone();
    var POST_VS = 'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.0,1.0);}';
    var brightMat = new THREE.ShaderMaterial({
      uniforms: { tDiffuse: { value: null }, threshold: { value: 0.72 } },
      vertexShader: POST_VS,
      fragmentShader: [
        'uniform sampler2D tDiffuse;uniform float threshold;varying vec2 vUv;',
        'void main(){vec3 c=texture2D(tDiffuse,vUv).rgb;',
        'float l=dot(c,vec3(0.2126,0.7152,0.0722));',
        'float k=max(l-threshold,0.0)/max(l,0.0001);',
        'gl_FragColor=vec4(c*k,1.0);}'
      ].join('\n')
    });
    var blurMat = new THREE.ShaderMaterial({
      uniforms: { tDiffuse: { value: null }, dir: { value: new THREE.Vector2() }, res: { value: new THREE.Vector2(1, 1) } },
      vertexShader: POST_VS,
      fragmentShader: [
        'uniform sampler2D tDiffuse;uniform vec2 dir;uniform vec2 res;varying vec2 vUv;',
        'void main(){vec2 t=dir/res;vec3 s=texture2D(tDiffuse,vUv).rgb*0.227027;',
        's+=(texture2D(tDiffuse,vUv+t*1.3846).rgb+texture2D(tDiffuse,vUv-t*1.3846).rgb)*0.316216;',
        's+=(texture2D(tDiffuse,vUv+t*3.2307).rgb+texture2D(tDiffuse,vUv-t*3.2307).rgb)*0.070270;',
        'gl_FragColor=vec4(s,1.0);}'
      ].join('\n')
    });
    var compMat = new THREE.ShaderMaterial({
      uniforms: {
        tScene: { value: null }, tBloom: { value: null },
        bloomAmt: { value: 0.34 }, vigAmt: { value: 0.42 },
        grainAmt: { value: 0.018 }, aberrAmt: { value: 0.0022 },
        speedAmt: { value: 0.0 }, streakAmt: { value: 0.0 },
        tSeed: { value: 0 }, tFlow: { value: 0 }
      },
      vertexShader: POST_VS,
      fragmentShader: [
        'uniform sampler2D tScene;uniform sampler2D tBloom;',
        'uniform float bloomAmt;uniform float vigAmt;uniform float grainAmt;',
        'uniform float aberrAmt;uniform float speedAmt;uniform float streakAmt;',
        'uniform float tSeed;uniform float tFlow;',
        'varying vec2 vUv;',
        'void main(){',
        '  vec2 d=vUv-0.5;float r2=dot(d,d);',
        '  vec2 off=d*aberrAmt*(0.35+r2*3.0);',
        '  vec3 c;',
        '  c.r=texture2D(tScene,vUv+off).r;',
        '  c.g=texture2D(tScene,vUv).g;',
        '  c.b=texture2D(tScene,vUv-off).b;',
        // radial speed blur toward the centre
        '  vec3 rb=vec3(0.0);',
        '  for(int i=1;i<=4;i++){float f=float(i)/4.0;rb+=texture2D(tScene,vUv-d*f*speedAmt).rgb;}',
        '  c=mix(c,rb*0.25,clamp(speedAmt*7.0,0.0,0.62));',
        '  c+=texture2D(tBloom,vUv).rgb*bloomAmt;',
        '  gl_FragColor=vec4(max(c,0.0),1.0);',
        '  #include <encodings_fragment>',
        // poster contrast: crush the blacks, hold the reds
        '  gl_FragColor.rgb=clamp((gl_FragColor.rgb-0.5)*1.12+0.48,0.0,1.0);',
        // diagonal crimson speed streaks, cleared away from the centre
        '  float ca=0.5299,sa=0.8480;',
        '  float axis=vUv.x*ca-vUv.y*sa;',
        '  float coord=axis*22.0+tFlow;',
        '  float cell=floor(coord);',
        '  float rw=fract(sin(cell*17.13)*4127.7);',
        '  float rv=fract(sin(cell*39.77)*9187.3);',
        '  float line=step(fract(coord),0.018+0.075*rw);',
        '  float edge=smoothstep(0.045,0.30,r2);',
        '  gl_FragColor.rgb+=vec3(0.90,0.09,0.14)*line*(0.30+0.70*rv)*streakAmt*edge;',
        '  gl_FragColor.rgb*=1.0-vigAmt*smoothstep(0.09,0.60,r2);',
        '  float n=fract(sin(dot(vUv*vec2(tSeed+1.3,tSeed+2.7),vec2(12.9898,78.233)))*43758.5453);',
        '  gl_FragColor.rgb+=(n-0.5)*grainAmt;',
        '}'
      ].join('\n')
    });
    var postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    var postScene = new THREE.Scene();
    var postQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), brightMat);
    postQuad.frustumCulled = false;
    postScene.add(postQuad);
    function pass(mat, target) {
      postQuad.material = mat;
      renderer.setRenderTarget(target);
      renderer.render(postScene, postCam);
    }

    // ---------------------------------------------- UI
    var uiCanvas = document.getElementById('ui');
    var ux = uiCanvas.getContext('2d');
    var L = null;
    function mono(s, w) { return (w || '') + ' ' + s + 'px Consolas,"Courier New",monospace'; }

    function onResize() {
      var w = window.innerWidth, h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var W = Math.round(w * dpr), H = Math.round(h * dpr);
      var S = Math.max(W / 1600, H / 900);
      L = { W: W, H: H, S: S, vw: W / S, vh: H / S };
      L.l = 800 - L.vw / 2; L.r = 800 + L.vw / 2;
      L.t = 450 - L.vh / 2; L.b = 450 + L.vh / 2;
      uiCanvas.width = W; uiCanvas.height = H;
      var pr = renderer.getPixelRatio();
      var pw = Math.max(2, Math.floor(w * pr)), ph = Math.max(2, Math.floor(h * pr));
      rtScene.setSize(pw, ph);
      rtA.setSize(Math.max(2, pw >> 1), Math.max(2, ph >> 1));
      rtB.setSize(Math.max(2, pw >> 1), Math.max(2, ph >> 1));
      blurMat.uniforms.res.value.set(Math.max(2, pw >> 1), Math.max(2, ph >> 1));
    }
    window.addEventListener('resize', onResize);
    onResize();

    function setTx(ctx) {
      ctx.setTransform(L.S, 0, 0, L.S, L.W / 2 - 800 * L.S, L.H / 2 - 450 * L.S);
    }

    // ---------------------------------------------- loop
    var last = performance.now();
    var camPos = new THREE.Vector3(0, 100, 300);
    var tmpV = new THREE.Vector3();
    var vProj = new THREE.Vector3();
    var bootEl = document.getElementById('boot');
    setTimeout(function () { bootEl.classList.add('done'); }, 700);
    resetPlayer();

    function animate() {
      requestAnimationFrame(animate);
      var now = performance.now();
      var dt = Math.min((now - last) / 1000, 0.04);
      last = now;

      if (helpOn && helpTimer > 0) { helpTimer -= dt; if (helpTimer <= 0) helpEl.classList.add('dim'); }
      if (missFlash > 0) missFlash -= dt;

      // ---------- movement
      var camFwd = new THREE.Vector3(-Math.sin(camYaw), 0, -Math.cos(camYaw));
      var camRight = new THREE.Vector3(Math.cos(camYaw), 0, -Math.sin(camYaw));

      var inF = (keys['KeyW'] ? 1 : 0) - (keys['KeyS'] ? 1 : 0);
      var inR = (keys['KeyD'] ? 1 : 0) - (keys['KeyA'] ? 1 : 0);

      vel.y -= 26 * dt;

      if (grounded) {
        var runA = 46;
        vel.x += (camFwd.x * inF + camRight.x * inR) * runA * dt;
        vel.z += (camFwd.z * inF + camRight.z * inR) * runA * dt;
        vel.x *= Math.exp(-5.5 * dt);
        vel.z *= Math.exp(-5.5 * dt);
        if (keys['Space']) { vel.y = 17; grounded = false; }
      } else {
        var airA = attached ? 13 : 20;
        vel.x += (camFwd.x * inF + camRight.x * inR) * airA * dt;
        vel.z += (camFwd.z * inF + camRight.z * inR) * airA * dt;
        vel.multiplyScalar(Math.exp(-0.16 * dt));
      }

      if (attached) {
        if (keys['ShiftLeft'] || keys['ShiftRight']) ropeLen = Math.max(5, ropeLen - 26 * dt);
        else ropeLen = Math.max(5, ropeLen - 3.5 * dt);

        // tangential boost so the pendulum keeps its rhythm
        tmpV.copy(pos).sub(anchor);
        var dist = tmpV.length();
        if (dist > 0.001) {
          var radial = tmpV.clone().normalize();
          var tang = new THREE.Vector3().copy(vel).addScaledVector(radial, -vel.dot(radial));
          if (tang.lengthSq() > 0.01) vel.addScaledVector(tang.normalize(), 15 * dt);
        }
      }

      pos.addScaledVector(vel, dt);

      // rope constraint
      if (attached) {
        tmpV.copy(pos).sub(anchor);
        var d2 = tmpV.length();
        if (d2 > ropeLen) {
          tmpV.multiplyScalar(1 / d2);
          pos.copy(anchor).addScaledVector(tmpV, ropeLen);
          var vr = vel.dot(tmpV);
          if (vr > 0) vel.addScaledVector(tmpV, -vr);
        }
        if (mouseDown === false) release();
      }

      resolveCollisions(dt);
      if (pos.y < -40) resetPlayer();

      var spd = vel.length();
      distTravel += spd * dt;
      if (spd > topSpeed) topSpeed = spd;

      hero.position.copy(pos);
      if (spd > 2) facing = lerp(facing, Math.atan2(-vel.x, -vel.z), clamp(dt * 5, 0, 1));
      hero.rotation.set(0, facing, 0);
      var lean = clamp(spd / 60, 0, 1);
      hero.rotation.x = -lean * (attached ? 0.85 : 0.5);
      hero.rotation.z = attached ? clamp(-vel.y * 0.012, -0.55, 0.55) : 0;

      // limb posing
      swingPhase += dt * (grounded ? spd * 0.6 : 3.0);
      if (attached) {
        tmpV.copy(anchor).sub(pos);
        var up = Math.atan2(tmpV.y, Math.hypot(tmpV.x, tmpV.z));
        // firing arm reaches the anchor, trailing arm streams back, legs tuck
        armR.rotation.x = -(Math.PI * 0.88 + up * 0.45);
        armR.rotation.z = -0.24;
        armL.rotation.x = 0.55 + Math.sin(swingPhase * 0.7) * 0.1;
        armL.rotation.z = 0.42;
        legL.rotation.x = 1.55 + Math.sin(swingPhase) * 0.14;
        legR.rotation.x = 0.35 - Math.sin(swingPhase) * 0.18;
        legR.rotation.z = -0.18;
      } else if (grounded) {
        armR.rotation.x = Math.sin(swingPhase) * 0.8; armR.rotation.z = 0;
        armL.rotation.x = -Math.sin(swingPhase) * 0.8; armL.rotation.z = 0;
        legL.rotation.z = 0; legR.rotation.z = 0;
        legL.rotation.x = -Math.sin(swingPhase) * 0.7;
        legR.rotation.x = Math.sin(swingPhase) * 0.7;
      } else {
        armR.rotation.x = -1.7 + Math.sin(swingPhase * 0.6) * 0.2; armR.rotation.z = -0.3;
        armL.rotation.x = -1.4 - Math.sin(swingPhase * 0.6) * 0.2; armL.rotation.z = 0.3;
        legL.rotation.x = 0.35; legR.rotation.x = -0.2;
        legL.rotation.z = 0; legR.rotation.z = 0;
      }

      if (attached) {
        var handWorld = new THREE.Vector3(0.38, 0.9, 0).applyEuler(hero.rotation).add(pos);
        var wdir = new THREE.Vector3().copy(anchor).sub(handWorld);
        var wlen = Math.max(wdir.length(), 0.01);
        webLine.position.copy(handWorld).addScaledVector(wdir, 0.5);
        webLine.scale.set(1, wlen, 1);
        webLine.quaternion.setFromUnitVectors(WEB_UP, wdir.normalize());
      }

      // ---------- camera
      var targetYaw = spd > 6 ? Math.atan2(-vel.x, -vel.z) : facing;
      var dy = ((targetYaw - camYaw + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
      camYaw += dy * clamp(dt * 2.6, 0, 1);
      camPitch = lerp(camPitch, clamp(-0.10 - vel.y * 0.006, -0.5, 0.30), clamp(dt * 3, 0, 1));

      var back = 8.5 + clamp(spd * 0.09, 0, 5);
      var desired = new THREE.Vector3(
        pos.x + Math.sin(camYaw) * back,
        pos.y + 3.0 - camPitch * 12,
        pos.z + Math.cos(camYaw) * back
      );
      camPos.lerp(desired, clamp(dt * 6.5, 0, 1));
      shake = Math.max(0, shake - dt * 1.6);
      camera.position.copy(camPos);
      camera.position.x += (Math.random() - 0.5) * shake * 1.4;
      camera.position.y += (Math.random() - 0.5) * shake * 1.4;
      camera.lookAt(pos.x, pos.y + 1.2, pos.z);
      camera.fov = lerp(camera.fov, FOV + clamp(spd * 0.30, 0, 22), clamp(dt * 3, 0, 1));
      camera.updateProjectionMatrix();

      sky.position.copy(pos);
      sun.position.set(pos.x - 180, 220, pos.z + 120);
      sun.target.position.set(pos.x, pos.y * 0.4, pos.z);
      sun.target.updateMatrixWorld();

      // ---------- brute
      bruteT += dt;
      var bh = bruteHost;
      var faceZ = bh.z + bh.d / 2;
      bruteY = bh.y0 + bh.h * 0.55 + Math.sin(bruteT * 0.16) * bh.h * 0.16;
      brute.position.set(bh.x, bruteY, faceZ + 1.9);
      brute.rotation.y = Math.PI;
      var cyc = bruteT % 2.6;
      var arm = brute.userData.armR;
      if (cyc < 0.95) {
        // wind up: pull the fist back, away from the wall
        arm.rotation.x = lerp(-0.5, 1.15, cyc / 0.95);
      } else if (cyc < 1.15) {
        // strike: drive it into the wall
        var st = (cyc - 0.95) / 0.20;
        arm.rotation.x = lerp(1.15, -1.55, st);
        if (st > 0.8 && punchT < bruteT - 1) {
          punchT = bruteT;
          var hit = new THREE.Vector3(bh.x - 1.6, bruteY + 1.2, faceZ + 0.4);
          spawnDebris(hit, { x: 0, z: 1 }, 1);
          ring.position.copy(hit); ring.position.z += 0.3;
          ring.rotation.set(0, 0, 0);
          ring.scale.set(1, 1, 1);
          ring.visible = true;
          ringMat.opacity = 0.5;
          ringT = 0;
          var pd = pos.distanceTo(hit);
          if (pd < 260) shake = Math.max(shake, clamp(1 - pd / 260, 0, 1) * 0.9);
        }
      } else {
        arm.rotation.x = lerp(-1.55, -0.5, clamp((cyc - 1.15) / 0.85, 0, 1));
      }
      brute.userData.armL.rotation.x = -1.9 + Math.sin(bruteT * 0.9) * 0.10;

      if (ring.visible) {
        ringT += dt;
        ring.scale.setScalar(1 + ringT * 17);
        ringMat.opacity = Math.max(0, 0.5 - ringT * 0.85);
        if (ringMat.opacity <= 0) ring.visible = false;
      }
      for (var pi = debris.length - 1; pi >= 0; pi--) {
        var pp = debris[pi];
        pp.v.y -= 22 * dt;
        pp.m.position.addScaledVector(pp.v, dt);
        pp.m.rotation.x += pp.spin.x * dt;
        pp.m.rotation.y += pp.spin.y * dt;
        pp.life -= dt;
        if (pp.m.position.y < GH + 0.3) { pp.m.position.y = GH + 0.3; pp.v.set(0, 0, 0); }
        if (pp.life <= 0) {
          pp.m.visible = false;
          debris.splice(pi, 1);
          debrisPool.push(pp);
        }
      }

      // ---------- render
      renderer.setRenderTarget(postOn ? rtScene : null);
      renderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
      renderer.clear(true, true, false);
      renderer.render(scene, camera);

      if (postOn) {
        compMat.uniforms.speedAmt.value = clamp((spd - 20) / 620, 0, 0.055);
        compMat.uniforms.streakAmt.value = clamp((spd - 13) / 34, 0, 1) * 0.72;
        compMat.uniforms.tFlow.value = -(now % 100000) / 1000 * 3.2;
        brightMat.uniforms.tDiffuse.value = rtScene.texture;
        pass(brightMat, rtA);
        blurMat.uniforms.tDiffuse.value = rtA.texture;
        blurMat.uniforms.dir.value.set(1, 0);
        pass(blurMat, rtB);
        blurMat.uniforms.tDiffuse.value = rtB.texture;
        blurMat.uniforms.dir.value.set(0, 1);
        pass(blurMat, rtA);
        compMat.uniforms.tScene.value = rtScene.texture;
        compMat.uniforms.tBloom.value = rtA.texture;
        compMat.uniforms.tSeed.value = (now % 10000) / 900;
        pass(compMat, null);
      }

      // ---------- HUD
      ux.setTransform(1, 0, 0, 1, 0, 0);
      ux.clearRect(0, 0, L.W, L.H);
      setTx(ux);

      // crosshair at the cursor
      var cxp = 800 + mouseNDC.x * L.vw / 2;
      var cyp = 450 - mouseNDC.y * L.vh / 2;
      ux.strokeStyle = missFlash > 0 ? C.warn : (attached ? C.acc : 'rgba(233,244,241,.75)');
      ux.lineWidth = 1.8;
      ux.beginPath();
      ux.arc(cxp, cyp, attached ? 13 : 9, 0, 7);
      ux.stroke();
      ux.beginPath();
      ux.moveTo(cxp - 17, cyp); ux.lineTo(cxp - 6, cyp);
      ux.moveTo(cxp + 6, cyp); ux.lineTo(cxp + 17, cyp);
      ux.moveTo(cxp, cyp - 17); ux.lineTo(cxp, cyp - 6);
      ux.moveTo(cxp, cyp + 6); ux.lineTo(cxp, cyp + 17);
      ux.stroke();

      // brute marker
      vProj.set(brute.position.x, brute.position.y + 3, brute.position.z).project(camera);
      var behind = vProj.z > 1;
      var bxp = 800 + vProj.x * L.vw / 2, byp = 450 - vProj.y * L.vh / 2;
      if (!behind) {
        ux.strokeStyle = C.warn; ux.lineWidth = 2;
        ux.beginPath();
        ux.moveTo(bxp - 12, byp - 12); ux.lineTo(bxp - 12, byp - 4);
        ux.moveTo(bxp - 12, byp - 12); ux.lineTo(bxp - 4, byp - 12);
        ux.moveTo(bxp + 12, byp + 12); ux.lineTo(bxp + 12, byp + 4);
        ux.moveTo(bxp + 12, byp + 12); ux.lineTo(bxp + 4, byp + 12);
        ux.stroke();
        ux.fillStyle = C.warn; ux.font = mono(11, 'bold'); ux.textAlign = 'center';
        ux.fillText(Math.round(pos.distanceTo(brute.position)) + 'm', bxp, byp + 26);
      }

      // readouts
      var panelX = L.l + 26, panelY = L.b - 132;
      ux.fillStyle = 'rgba(6,10,14,.55)';
      ux.fillRect(panelX - 12, panelY - 26, 250, 118);
      ux.strokeStyle = 'rgba(126,240,208,.28)'; ux.lineWidth = 1;
      ux.strokeRect(panelX - 12, panelY - 26, 250, 118);
      ux.textAlign = 'left';
      ux.fillStyle = C.acc; ux.font = mono(11, 'bold');
      ux.fillText('TRAVERSAL', panelX, panelY - 10);
      ux.fillStyle = C.ice; ux.font = mono(30, 'bold');
      ux.fillText(String(Math.round(spd * 3.6)), panelX, panelY + 26);
      ux.fillStyle = C.dim; ux.font = mono(11, 'bold');
      ux.fillText('KM/H', panelX + 92, panelY + 26);
      ux.fillStyle = C.ice; ux.font = mono(15, 'bold');
      ux.fillText('ALT  ' + Math.round(pos.y) + ' m', panelX, panelY + 52);
      ux.fillText('DIST ' + (distTravel / 1000).toFixed(2) + ' km', panelX, panelY + 74);

      ux.textAlign = 'right';
      ux.fillStyle = attached ? C.acc : C.dim;
      ux.font = mono(13, 'bold');
      ux.fillText(attached ? 'LINE ANCHORED  ' + Math.round(ropeLen) + 'm' : 'LINE READY',
        L.r - 26, L.b - 34);
      ux.fillStyle = C.dim; ux.font = mono(11, 'bold');
      ux.fillText('TOP ' + Math.round(topSpeed * 3.6) + ' KM/H', L.r - 26, L.b - 16);

      if (missFlash > 0) {
        ux.textAlign = 'center';
        ux.fillStyle = C.warn; ux.font = mono(14, 'bold');
        ux.fillText('NO ANCHOR', 800, 450 + 60);
      }
      ux.setTransform(1, 0, 0, 1, 0, 0);
    }

    animate();
  }
})();
</script>

</html>
