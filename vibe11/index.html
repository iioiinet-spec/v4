<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 수학 개념학습 프롬프트 6학년군 | 세영코딩연구소</title><style>:root{font-family:'Malgun Gothic',Arial,sans-serif;color:#14213d;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:24px}header{background:#142d57;color:white;padding:28px;border-radius:20px}h1{margin:0 0 10px;font-size:30px}h2{font-size:24px}p,li{line-height:1.8;font-size:17px}.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin:20px 0}.tabs button,.action,select{border:2px solid #c6d3e7;background:white;padding:13px 8px;border-radius:12px;font-weight:700;font-size:16px;cursor:pointer}.tabs button.active{background:#174e9b;color:white;border-color:#174e9b}.panel{background:white;border-radius:18px;padding:25px;box-shadow:0 8px 28px #152c5010}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.action{background:#174e9b;color:white;border-color:#174e9b}.action.secondary{background:white;color:#174e9b}.prompt{white-space:pre-wrap;background:#f0f5fc;border-left:5px solid #2459a0;padding:20px;border-radius:8px;font-size:17px;line-height:1.85;margin-top:18px}.demo{margin-top:22px;border:1px solid #d9e3f2;border-radius:14px;padding:18px}.visual{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0}.tile{min-width:42px;height:42px;padding:9px;background:#d8e9ff;border:2px solid #568bcf;text-align:center;border-radius:7px;font-weight:bold}.answer{display:none;background:#edf8ee;padding:15px;border-radius:9px;margin-top:10px}.answer.show{display:block}.small{color:#53627b;font-size:15px}footer{text-align:center;margin:25px}.printonly{display:none}@media(max-width:750px){.tabs{grid-template-columns:repeat(3,1fr)}.wrap{padding:12px}h1{font-size:24px}}@media print{body{background:white}.wrap{max-width:none;padding:0}header{color:black;background:white;border-bottom:2px solid black;border-radius:0}.tabs,.controls,.noprint,footer{display:none!important}.panel{box-shadow:none;padding:8px}.prompt{background:white;border:1px solid #555;font-size:13px}.printonly{display:block}.answer{display:block!important}h1{font-size:22px}p,li{font-size:13px}h2{font-size:18px}@page{size:A4;margin:14mm}}</style></head><body><div class="wrap"><header><h1>AI와 함께하는 수학 개념 이해</h1><p>초등 4·5·6학년 / 중등 1·2·3학년 | 학년별 AI 학습 프롬프트 6종</p><div>세영코딩연구소 · 저자 Ph.D KIM</div></header><nav class="tabs" id="tabs" aria-label="학년 선택"></nav><main class="panel"><h2 id="grade"></h2><p id="intro"></p><div class="controls"><label for="topic">학습 단원 선택 </label><select id="topic"></select><button class="action" id="copy">AI 프롬프트 복사</button><button class="action secondary" onclick="window.print()">현재 학년 인쇄 / PDF 저장</button></div><div class="small noprint" id="copyStatus" aria-live="polite">프롬프트를 복사해 ChatGPT 등 AI 대화창에 붙여 넣으세요.</div><h2>학년별 맞춤 프롬프트</h2><div class="prompt" id="prompt"></div><section class="demo"><h2>직접 탐구하는 미니 활동</h2><p id="question"></p><div class="visual" id="visual"></div><button class="action secondary noprint" id="reveal">정답·해설 확인</button><div class="answer" id="answer"></div></section><p class="small">학습 방법: 개념 질문 → 생활 속 예시 → 시각적 설명 → 힌트 3단계 → 직접 풀이 → 오답 분석 → 유사문제. AI 답변은 교재·교사의 검토와 함께 사용하세요.</p></main><footer>© 세영코딩연구소 · AI 수학 학습 자료</footer></div><script>
const data=[
{grade:'초등 4학년',intro:'큰 수, 각도, 곱셈과 나눗셈, 분수·소수의 기초를 그림과 이야기로 배웁니다.',topics:['큰 수와 자릿값','각도와 삼각형','곱셈과 나눗셈','분수의 덧셈과 뺄셈','소수의 덧셈과 뺄셈','막대그래프'],q:'사과 12개를 3명에게 똑같이 나누면 한 명당 몇 개일까요?',tiles:['●','●','●','●','●','●','●','●','●','●','●','●'],a:'12 ÷ 3 = 4. 3명에게 1개씩 4번 나누어 주면 각자 4개입니다.'},
{grade:'초등 5학년',intro:'약수·배수, 분수 연산, 도형의 넓이와 평균을 구체적인 예로 이해합니다.',topics:['약수와 배수','약분과 통분','분수의 덧셈과 뺄셈','분수의 곱셈','소수의 곱셈','직육면체와 부피','평균'],q:'분수 1/2와 1/4를 더하면 얼마일까요?',tiles:['1/4','1/4','1/4','1/4'],a:'1/2 = 2/4이므로 2/4 + 1/4 = 3/4입니다. 네 칸 중 세 칸을 채운 양입니다.'},
{grade:'초등 6학년',intro:'비와 비율, 분수·소수 나눗셈, 원의 넓이와 입체도형을 단계별로 탐구합니다.',topics:['분수의 나눗셈','소수의 나눗셈','비와 비율','백분율','원의 넓이','원기둥과 원뿔','비례식과 비례배분'],q:'20명 중 5명이 안경을 썼다면 전체의 몇 %일까요?',tiles:['5명','20명','5÷20','×100'],a:'5 ÷ 20 = 0.25이고 0.25 × 100 = 25%입니다.'},
{grade:'중등 1학년',intro:'정수와 유리수, 문자와 식, 일차방정식, 좌표와 그래프의 원리를 연결합니다.',topics:['소인수분해','정수와 유리수','문자와 식','일차방정식','좌표평면과 그래프','기본 도형','자료의 정리'],q:'x + 7 = 12에서 x는 얼마일까요?',tiles:['x','+7','=12','−7'],a:'등식 양변에서 7을 빼면 x = 12 − 7 = 5입니다.'},
{grade:'중등 2학년',intro:'연립방정식, 일차함수, 부등식, 도형의 성질과 확률을 모델링합니다.',topics:['유리수와 순환소수','식의 계산','일차부등식','연립일차방정식','일차함수','삼각형과 사각형의 성질','경우의 수와 확률'],q:'x + y = 7, x − y = 1일 때 x와 y는?',tiles:['x+y=7','x−y=1','두 식 더하기'],a:'두 식을 더하면 2x = 8, x = 4입니다. x + y = 7에 대입하면 y = 3입니다.'},
{grade:'중등 3학년',intro:'제곱근, 인수분해, 이차방정식·이차함수, 삼각비와 통계를 시각화합니다.',topics:['제곱근과 실수','다항식의 곱셈','인수분해','이차방정식','이차함수','피타고라스 정리','삼각비','산포도와 상관관계'],q:'x² − 5x + 6 = 0의 해는?',tiles:['x²','−5x','+6','=0'],a:'(x − 2)(x − 3) = 0으로 인수분해합니다. 따라서 x = 2 또는 x = 3입니다.'}
];let current=0;const $=id=>document.getElementById(id);function makePrompt(d,t){return `너는 ${d.grade} 학생을 가르치는 친절하고 정확한 수학 전문 교사이자 소크라테스식 AI 튜터야.\n\n[학습 목표]\n학년: ${d.grade}\n단원: ${t}\n목표: 공식을 암기하기보다 개념이 왜 성립하는지 스스로 설명하고 응용할 수 있도록 돕는다.\n\n[수업 진행 규칙]\n1. 먼저 학생에게 이 단원에서 이미 아는 내용과 어려운 부분을 한 가지씩 물어보고 답변을 기다려.\n2. 학년 수준에 맞는 쉬운 말과 일상생활 사례 2개로 핵심 개념을 설명해. 낯선 용어는 즉시 풀이해.\n3. 표, 수직선, 격자, 도형의 ASCII 그림 등 텍스트로 표현 가능한 시각 자료를 사용해.\n4. 개념의 원리를 단계별로 보여주고, 공식이 등장하면 왜 그런 식이 되는지 유도해.\n5. 먼저 쉬운 확인 문제 1개만 내고 학생의 답을 기다려. 정답을 미리 공개하지 마.\n6. 틀리면 답을 바로 말하지 말고 힌트 1→2→3을 차례로 제공해. 같은 오류가 반복되면 더 작은 수나 쉬운 사례로 돌아가.\n7. 학생이 답하면 풀이의 맞고 틀린 이유를 설명하고, 다른 풀이가 가능한지도 보여줘.\n8. 이후 기본·응용·도전 문제를 각 1개씩 순서대로 내되 매번 답을 기다려. 계산 결과와 문제 조건을 스스로 검산해.\n9. 마지막에는 핵심 개념 3줄 요약, 자주 하는 실수 2개, 복습 문제 2개를 제시해.\n10. 대화는 한국어로 진행하고 칭찬은 구체적인 학습 행동에만 해. 중등 수학은 식 변형의 근거를 명확히 설명해.\n\n[시작]\n'${t}'를 배우는 이유를 흥미로운 질문 하나로 시작하고 학생의 답을 기다려.`}function render(){let d=data[current];$('tabs').innerHTML='';data.forEach((x,i)=>{let b=document.createElement('button');b.textContent=x.grade;b.className=i===current?'active':'';b.setAttribute('aria-pressed',i===current);b.onclick=()=>{current=i;render()};$('tabs').appendChild(b)});$('grade').textContent=d.grade+' · AI 수학 튜터';$('intro').textContent=d.intro;$('topic').innerHTML='';d.topics.forEach(t=>{let o=document.createElement('option');o.textContent=t;$('topic').appendChild(o)});updatePrompt();$('question').textContent=d.q;$('visual').innerHTML='';d.tiles.forEach(t=>{let s=document.createElement('span');s.className='tile';s.textContent=t;$('visual').appendChild(s)});$('answer').textContent=d.a;$('answer').classList.remove('show');$('copyStatus').textContent='프롬프트를 복사해 ChatGPT 등 AI 대화창에 붙여 넣으세요.'}function updatePrompt(){$('prompt').textContent=makePrompt(data[current],$('topic').value)}$('topic').addEventListener('change',updatePrompt);$('reveal').onclick=()=>$('answer').classList.toggle('show');$('copy').onclick=async()=>{let s=$('prompt').textContent;try{await navigator.clipboard.writeText(s)}catch(e){let a=document.createElement('textarea');a.value=s;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}$('copyStatus').textContent='복사했습니다. AI 채팅창에 붙여 넣으세요.'};render();</script></body></html>
