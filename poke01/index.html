<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#241a45">
  <title>이로치 인큐베이터 · 포켓몬 키우기</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">

  <style>
    /* ============================================================
       디자인 토큰
       ============================================================ */
    :root {
      /* 셸(기기 외장) */
      --shell-1: #4a3579;
      --shell-2: #2a1e50;
      --shell-3: #1b1338;

      /* 표면 */
      --paper: #fffdf7;
      --paper-2: #fff7e9;
      --track: #efe4d3;

      /* 잉크 */
      --ink: #2b2145;
      --ink-2: #6b5f86;
      --ink-3: #9e93b5;

      /* 포인트 */
      --gold: #ffc53d;
      --gold-deep: #e08b00;
      --violet: #7c5cff;
      --violet-soft: #efe8ff;
      --rose: #ff6b9d;
      --mint: #2fc79a;
      --coral: #ff5d5d;

      /* 방 */
      --wall-1: #fff6e9;
      --wall-2: #f7e6d2;
      --wood-1: #e8bd8d;
      --wood-2: #c68c58;
      --sky-1: #7fc9f2;
      --sky-2: #d9f2ff;

      --radius-shell: 30px;
      --radius-panel: 22px;
      --radius-card: 14px;

      --font-display: 'Jua', 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      --font-ui: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', -apple-system, sans-serif;

      --shadow-shell: 0 30px 60px -20px rgba(20, 10, 45, .65), 0 6px 16px rgba(20, 10, 45, .3);
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      padding: 18px 14px calc(18px + env(safe-area-inset-bottom));
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: var(--font-ui);
      color: var(--ink);
      -webkit-text-size-adjust: 100%;
      background:
        radial-gradient(900px 520px at 12% -10%, rgba(124, 92, 255, .55), transparent 60%),
        radial-gradient(760px 480px at 96% 6%, rgba(255, 197, 61, .32), transparent 62%),
        radial-gradient(700px 600px at 50% 118%, rgba(255, 107, 157, .3), transparent 60%),
        linear-gradient(160deg, #241a45 0%, #170f30 55%, #120b26 100%);
      background-attachment: fixed;
    }

    /* 은은한 별가루 */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(1.6px 1.6px at 18% 22%, rgba(255,255,255,.7), transparent),
        radial-gradient(1.4px 1.4px at 72% 14%, rgba(255,255,255,.55), transparent),
        radial-gradient(1.8px 1.8px at 42% 68%, rgba(255,255,255,.5), transparent),
        radial-gradient(1.3px 1.3px at 86% 74%, rgba(255,255,255,.6), transparent),
        radial-gradient(1.5px 1.5px at 8% 84%, rgba(255,255,255,.45), transparent);
      opacity: .8;
    }

    button { font-family: inherit; }

    :where(button, .option-card):focus-visible {
      outline: 3px solid var(--violet);
      outline-offset: 3px;
      border-radius: 10px;
    }

    /* ============================================================
       기기 외장
       ============================================================ */
    .device {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 448px;
      padding: 12px;
      border-radius: var(--radius-shell);
      background: linear-gradient(165deg, var(--shell-1) 0%, var(--shell-2) 48%, var(--shell-3) 100%);
      box-shadow:
        var(--shadow-shell),
        inset 0 1px 0 rgba(255, 255, 255, .28),
        inset 0 -2px 0 rgba(0, 0, 0, .35);
      border: 1px solid rgba(255, 255, 255, .1);
    }

    .device-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 2px 6px 10px;
    }

    .led {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--mint);
      box-shadow: 0 0 8px var(--mint), 0 0 2px #fff inset;
      animation: ledPulse 2.4s ease-in-out infinite;
      flex: none;
    }

    @keyframes ledPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .35; }
    }

    .brand {
      font-family: var(--font-display);
      font-size: 13px;
      letter-spacing: .04em;
      color: rgba(255, 255, 255, .92);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand small {
      display: block;
      font-family: var(--font-ui);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .22em;
      color: rgba(255, 255, 255, .42);
      text-transform: uppercase;
      margin-top: 1px;
    }

    .reset-btn {
      margin-left: auto;
      flex: none;
      background: rgba(255, 255, 255, .1);
      color: rgba(255, 255, 255, .85);
      border: 1px solid rgba(255, 255, 255, .18);
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: background .18s ease, color .18s ease, transform .12s ease;
    }

    .reset-btn:hover { background: rgba(255, 107, 157, .28); color: #fff; }
    .reset-btn:active { transform: translateY(1px); }

    /* ============================================================
       내부 패널
       ============================================================ */
    .panel {
      position: relative;
      background: var(--paper);
      border-radius: var(--radius-panel);
      padding: 14px;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(43, 33, 69, .06), 0 2px 0 rgba(0, 0, 0, .18);
    }

    /* ---------- 타이틀 줄 ---------- */
    .title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .level-title {
      font-family: var(--font-display);
      font-size: 19px;
      line-height: 1.2;
      color: var(--ink);
      letter-spacing: -.01em;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status-chip {
      margin-left: auto;
      flex: none;
      font-size: 11px;
      font-weight: 700;
      color: #6b4a00;
      background: linear-gradient(180deg, #fff3cf, #ffe4a3);
      border: 1px solid #f2d089;
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    /* ---------- 진행도 레일 ---------- */
    .exp-container { margin-bottom: 12px; }

    .exp-label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 11px;
      font-weight: 700;
      color: var(--ink-2);
      margin-bottom: 5px;
    }

    .exp-label span:last-child {
      font-variant-numeric: tabular-nums;
      color: var(--ink-3);
    }

    .exp-bar-bg {
      position: relative;
      background: var(--track);
      height: 12px;
      border-radius: 999px;
      overflow: hidden;
      box-shadow: inset 0 1px 2px rgba(43, 33, 69, .16);
    }

    .exp-bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #a78bfa, #7c5cff);
      transition: width .45s cubic-bezier(.34, 1.3, .64, 1);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45);
    }

    /* ============================================================
       화면(디오라마)
       ============================================================ */
    .screen {
      position: relative;
      border-radius: 18px;
      padding: 5px;
      margin-bottom: 12px;
      background: linear-gradient(180deg, #171029, #251a44);
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, .55), 0 1px 0 rgba(255, 255, 255, .35);
    }

    /* 유리 반사 */
    .screen::after {
      content: '';
      position: absolute;
      inset: 5px;
      border-radius: 14px;
      pointer-events: none;
      background: linear-gradient(118deg, rgba(255, 255, 255, .22) 0%, rgba(255, 255, 255, .06) 26%, transparent 44%);
      z-index: 30;
    }

    .pokemon-stage {
      position: relative;
      height: 252px;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      overflow: hidden;
      background: linear-gradient(180deg, var(--wall-1) 0%, #fff1e0 46%, var(--wall-2) 72%);
    }

    /* 벽지 스트라이프 */
    .pokemon-stage::before {
      content: '';
      position: absolute;
      inset: 0 0 28% 0;
      background: repeating-linear-gradient(90deg, rgba(198, 140, 88, .07) 0 1px, transparent 1px 22px);
    }

    /* 모서리 비네트 */
    .pokemon-stage::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      box-shadow: inset 0 0 34px rgba(120, 78, 40, .18);
      z-index: 25;
    }

    /* ---------- 바닥 ---------- */
    .floor {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 28%;
      background:
        repeating-linear-gradient(90deg, rgba(120, 72, 30, .16) 0 1.5px, transparent 1.5px 44px),
        linear-gradient(180deg, var(--wood-1), var(--wood-2));
    }

    .baseboard {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 28%;
      height: 7px;
      background: linear-gradient(180deg, #fffaf1, #eddcc6);
      border-bottom: 1px solid rgba(120, 72, 30, .25);
    }

    /* ---------- 창문 ---------- */
    .window {
      position: absolute;
      top: 58px;
      left: 16px;
      width: 88px;
      height: 62px;
      border: 5px solid #fffdf8;
      border-radius: 6px;
      overflow: hidden;
      background: linear-gradient(180deg, var(--sky-1), var(--sky-2));
      box-shadow: 0 5px 12px rgba(120, 78, 40, .16), inset 0 0 10px rgba(0, 0, 0, .08);
    }

    .window .sun {
      position: absolute;
      top: 7px;
      right: 9px;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff6c9 30%, var(--gold) 70%);
      box-shadow: 0 0 12px rgba(255, 197, 61, .9);
    }

    .window .cloud {
      position: absolute;
      height: 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .95);
      animation: drift 22s linear infinite;
    }

    .window .cloud.a { top: 20px; width: 26px; }
    .window .cloud.b { top: 38px; width: 18px; animation-duration: 31s; animation-delay: -9s; opacity: .8; }

    @keyframes drift {
      from { transform: translateX(-30px); }
      to { transform: translateX(96px); }
    }

    .window .mullion-h,
    .window .mullion-v {
      position: absolute;
      background: #fffdf8;
    }

    .window .mullion-h { top: 50%; left: 0; width: 100%; height: 3px; margin-top: -1.5px; }
    .window .mullion-v { left: 50%; top: 0; height: 100%; width: 3px; margin-left: -1.5px; }

    .sill {
      position: absolute;
      top: 118px;
      left: 10px;
      width: 100px;
      height: 6px;
      border-radius: 2px;
      background: linear-gradient(180deg, #fffdf8, #e8d6bf);
      box-shadow: 0 3px 6px rgba(120, 78, 40, .16);
    }

    /* ---------- 액자 ---------- */
    .artframe {
      position: absolute;
      top: 62px;
      right: 22px;
      width: 56px;
      height: 46px;
      border: 4px solid #fffdf8;
      border-radius: 4px;
      background: linear-gradient(140deg, #cdeafd 0%, #e4d6ff 55%, #ffe0ef 100%);
      box-shadow: 0 5px 10px rgba(120, 78, 40, .16);
      overflow: hidden;
    }

    .artframe::before {
      content: '';
      position: absolute;
      bottom: -10px;
      left: -6px;
      width: 40px;
      height: 30px;
      border-radius: 50%;
      background: rgba(124, 92, 255, .35);
    }

    .artframe::after {
      content: '';
      position: absolute;
      top: 6px;
      right: 8px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(255, 197, 61, .85);
    }

    /* ---------- 소파 ---------- */
    .sofa {
      position: absolute;
      bottom: 56px;
      right: 14px;
      width: 92px;
      height: 34px;
      background: linear-gradient(180deg, #9b6bff, #7a4de0);
      border-radius: 10px 10px 6px 6px;
      box-shadow: 0 8px 14px rgba(60, 30, 110, .25);
    }

    .sofa::before {
      content: '';
      position: absolute;
      top: -15px;
      left: 0;
      width: 100%;
      height: 19px;
      background: linear-gradient(180deg, #a97dff, #8358e8);
      border-radius: 10px 10px 0 0;
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .12);
    }

    .sofa::after {
      content: '';
      position: absolute;
      inset: 4px 6px 6px;
      border-radius: 6px;
      background:
        linear-gradient(90deg, transparent 0 47%, rgba(43, 25, 90, .28) 47% 49%, transparent 49%),
        rgba(255, 255, 255, .16);
    }

    .sofa-legs {
      position: absolute;
      bottom: 50px;
      right: 20px;
      width: 80px;
      height: 7px;
      background:
        linear-gradient(90deg, #7a4a24 0 8px, transparent 8px calc(100% - 8px), #7a4a24 calc(100% - 8px) 100%);
      border-radius: 0 0 3px 3px;
    }

    /* ---------- 화분 ---------- */
    .plant {
      position: absolute;
      bottom: 52px;
      left: 18px;
      width: 26px;
      height: 22px;
      background: linear-gradient(180deg, #ef8354, #d1603a);
      border-radius: 3px 3px 8px 8px;
      box-shadow: 0 6px 10px rgba(120, 60, 30, .22);
    }

    .plant::before,
    .plant::after,
    .plant .leaf {
      content: '';
      position: absolute;
      width: 16px;
      height: 22px;
      border-radius: 70% 30% 60% 40% / 80% 70% 30% 20%;
      background: linear-gradient(160deg, #6ad6a0, #2f9d67);
      box-shadow: inset -2px -2px 4px rgba(0, 0, 0, .1);
    }

    .plant::before { bottom: 15px; left: -5px; transform: rotate(-30deg); }
    .plant::after { bottom: 15px; right: -5px; transform: rotate(30deg) scaleX(-1); }
    .plant .leaf { bottom: 19px; left: 5px; width: 15px; height: 24px; }

    /* ---------- 러그 & 공 ---------- */
    .rug {
      position: absolute;
      bottom: 9px;
      left: 50%;
      transform: translateX(-50%);
      width: 236px;
      height: 40px;
      border-radius: 50%;
      background:
        radial-gradient(ellipse at center, transparent 0 24%, rgba(255, 255, 255, .45) 24% 30%, transparent 30%),
        radial-gradient(ellipse at center, #ffe2ad 0%, #ffc08c 54%, #f0968f 100%);
      opacity: .85;
      box-shadow: 0 3px 8px rgba(120, 60, 30, .2);
    }

    .ball {
      position: absolute;
      bottom: 34px;
      left: 66px;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: linear-gradient(150deg, #fff 0 48%, #ff6b6b 48% 100%);
      border: 1.5px solid #3a2b4d;
      box-shadow: 0 3px 5px rgba(0, 0, 0, .2);
    }

    /* ---------- 반짝임 ---------- */
    .mote {
      position: absolute;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff 0 30%, var(--gold) 55%, transparent 72%);
      opacity: 0;
      animation: moteFloat 7s ease-in-out infinite;
      z-index: 12;
    }

    .mote.m1 { top: 40%; left: 24%; animation-delay: 0s; }
    .mote.m2 { top: 30%; left: 62%; animation-delay: 2.4s; }
    .mote.m3 { top: 52%; left: 79%; animation-delay: 4.6s; }

    @keyframes moteFloat {
      0%, 100% { opacity: 0; transform: translateY(8px) scale(.5); }
      50% { opacity: .95; transform: translateY(-12px) scale(1); }
    }

    /* ---------- 말풍선 ---------- */
    .speech-bubble {
      position: absolute;
      top: 9px;
      left: 50%;
      transform: translateX(-50%);
      max-width: 84%;
      background: rgba(255, 255, 255, .97);
      border: 2px solid var(--gold);
      border-radius: 14px;
      padding: 7px 13px;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.35;
      color: #8a5200;
      text-align: center;
      box-shadow: 0 6px 14px rgba(120, 78, 40, .18);
      z-index: 20;
      animation: bubblePop .32s cubic-bezier(.34, 1.56, .64, 1);
    }

    @keyframes bubblePop {
      from { opacity: 0; transform: translateX(-50%) translateY(-6px) scale(.94); }
      to { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    }

    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      border-width: 8px 7px 0;
      border-style: solid;
      border-color: var(--gold) transparent;
    }

    /* ---------- 포켓몬 ---------- */
    .pokemon-wrapper {
      position: relative;
      bottom: 18px;
      z-index: 15;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      cursor: pointer;
      filter: drop-shadow(0 3px 4px rgba(80, 40, 10, .2));
    }

    .pokemon-img {
      width: 100px;
      height: 100px;
      object-fit: contain;
      image-rendering: pixelated;
      -webkit-user-drag: none;
      user-select: none;
    }

    .pet-shadow {
      position: absolute;
      bottom: 2px;
      left: 50%;
      transform: translateX(-50%);
      width: 62px;
      height: 12px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(90, 50, 15, .24), transparent 70%);
      z-index: -1;
      transition: opacity .2s;
    }

    .anim-roll .pet-shadow,
    .anim-double-jump .pet-shadow { opacity: 0; }

    .sick-filter { filter: grayscale(85%) opacity(.65); }

    /* ---------- 모션 ---------- */
    .anim-egg-shake { animation: actEggShake .5s ease-in-out infinite alternate; }
    .anim-run { animation: actRun 1.2s ease-in-out infinite alternate; }
    .anim-jump { animation: actJump .6s cubic-bezier(.3, .9, .4, 1); }
    .anim-roll { animation: actRoll .8s linear; }
    .anim-double-jump { animation: actDoubleJumpSpin 1.2s ease-in-out; }

    @keyframes actEggShake {
      0% { transform: rotate(-12deg) translateY(0); }
      50% { transform: rotate(12deg) translateY(-8px); }
      100% { transform: rotate(-12deg) translateY(0); }
    }

    @keyframes actRun {
      0% { transform: translateX(-108px) scaleX(1); }
      49% { transform: translateX(108px) scaleX(1); }
      50% { transform: translateX(108px) scaleX(-1); }
      100% { transform: translateX(-108px) scaleX(-1); }
    }

    @keyframes actJump {
      0% { transform: translateY(0); }
      50% { transform: translateY(-72px); }
      100% { transform: translateY(0); }
    }

    @keyframes actRoll {
      0% { transform: translateX(-62px) rotate(0deg); }
      100% { transform: translateX(62px) rotate(720deg); }
    }

    @keyframes actDoubleJumpSpin {
      0% { transform: translateY(0) rotate(0deg); }
      30% { transform: translateY(-52px) rotate(180deg); }
      50% { transform: translateY(-30px) rotate(360deg); }
      80% { transform: translateY(-100px) rotate(540deg); }
      100% { transform: translateY(0) rotate(720deg); }
    }

    /* ---------- 부화/진화 연출 ---------- */
    .evolution-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 0 24px;
      font-family: var(--font-display);
      font-size: 19px;
      line-height: 1.4;
      color: #7a4a00;
      background:
        radial-gradient(circle at 50% 50%, rgba(255, 255, 255, .98) 0 42%, rgba(255, 236, 190, .96) 100%);
      opacity: 0;
      pointer-events: none;
      transition: opacity .45s ease;
      z-index: 28;
    }

    .evolution-overlay::before {
      content: '';
      position: absolute;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, transparent 0 8%, rgba(255, 197, 61, .55) 10%, transparent 12%, transparent 20%, rgba(255, 197, 61, .55) 22%, transparent 24%, transparent 33%, rgba(255, 197, 61, .55) 35%, transparent 37%, transparent 45%, rgba(255, 197, 61, .55) 47%, transparent 49%, transparent 58%, rgba(255, 197, 61, .55) 60%, transparent 62%, transparent 70%, rgba(255, 197, 61, .55) 72%, transparent 74%, transparent 83%, rgba(255, 197, 61, .55) 85%, transparent 87%);
      animation: rayspin 6s linear infinite;
      opacity: .75;
    }

    .evolution-overlay > span { position: relative; }

    .evolution-overlay.active { opacity: 1; }
    .evolution-overlay.active > span { animation: popIn .5s cubic-bezier(.34, 1.56, .64, 1); }

    @keyframes rayspin { to { transform: rotate(360deg); } }
    @keyframes popIn {
      from { transform: scale(.7); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* ============================================================
       상태 게이지
       ============================================================ */
    .stats-container {
      background: linear-gradient(180deg, var(--paper-2), #fff);
      padding: 11px 12px;
      border-radius: var(--radius-card);
      margin-bottom: 10px;
      border: 1px solid #f0e2ca;
      transition: opacity .25s ease;
    }

    .stat-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stat-row + .stat-row { margin-top: 7px; }

    .stat-icon { font-size: 13px; width: 16px; text-align: center; flex: none; }

    .stat-label {
      width: 46px;
      font-size: 11px;
      font-weight: 700;
      color: var(--ink-2);
      flex: none;
    }

    .bar-bg {
      flex: 1;
      background: var(--track);
      height: 11px;
      border-radius: 999px;
      overflow: hidden;
      box-shadow: inset 0 1px 2px rgba(43, 33, 69, .16);
    }

    .bar-fill {
      height: 100%;
      width: 70%;
      border-radius: 999px;
      background: linear-gradient(90deg, #4fe0b0, var(--mint));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5);
      transition: width .45s cubic-bezier(.34, 1.3, .64, 1), background .4s ease;
    }

    .stat-val {
      width: 30px;
      text-align: right;
      font-size: 10px;
      font-weight: 700;
      color: var(--ink-3);
      font-variant-numeric: tabular-nums;
      flex: none;
    }

    /* ============================================================
       컨트롤
       ============================================================ */
    .actions-grid,
    .motion-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      margin-bottom: 9px;
    }

    .btn {
      position: relative;
      background: #f4f0f8;
      border: 1px solid #ded5ea;
      border-radius: 12px;
      padding: 9px 2px;
      font-family: var(--font-display);
      font-size: 12px;
      line-height: 1.3;
      color: var(--ink);
      cursor: pointer;
      word-break: keep-all;
      box-shadow: 0 3px 0 #ded5ea;
      transition: transform .1s ease, box-shadow .1s ease, filter .15s ease;
    }

    .btn:hover { filter: brightness(1.04); }

    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 0 0 currentColor;
    }

    .btn-action {
      background: linear-gradient(180deg, #fffaea, #fff2d0);
      border-color: #f0d79a;
      color: #a35a06;
      box-shadow: 0 3px 0 #eccf8f;
    }

    .btn-motion {
      background: linear-gradient(180deg, #f7f2ff, #ece2ff);
      border-color: #d5c4ff;
      color: #5b3fbf;
      box-shadow: 0 3px 0 #d3c1ff;
      font-size: 11px;
    }

    .btn-egg-touch {
      grid-column: span 4;
      background: linear-gradient(180deg, #ffe08a, var(--gold));
      border-color: #eaa61c;
      color: #6b3d00;
      box-shadow: 0 4px 0 #d99306, 0 0 0 0 rgba(255, 197, 61, .55);
      font-size: 15px;
      padding: 13px;
      animation: eggGlow 2.6s ease-in-out infinite;
    }

    @keyframes eggGlow {
      0%, 100% { box-shadow: 0 4px 0 #d99306, 0 0 0 0 rgba(255, 197, 61, .5); }
      50% { box-shadow: 0 4px 0 #d99306, 0 0 0 10px rgba(255, 197, 61, 0); }
    }

    .btn-heal {
      grid-column: span 4;
      display: none;
      background: linear-gradient(180deg, #ffe8ee, #ffd3de);
      border-color: #ffb3c6;
      color: #b32450;
      box-shadow: 0 3px 0 #f5aec2;
      font-size: 14px;
      padding: 11px;

    /* ---------- 가위바위보 ---------- */
    .rsp-panel {
      background: linear-gradient(180deg, #fff8e6, #fff);
      border: 1px solid #f0d79a;
      border-radius: var(--radius-card);
      padding: 10px 12px 11px;

      font-size: 11px;
      font-weight: 700;
      color: #a35a06;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;

      display: grid;
      grid-template-columns: repeat(3, 1fr);

    }

      background: #fff;
      border: 1px solid #f0d79a;
      padding: 8px 4px;

      cursor: pointer;
      box-shadow: 0 3px 0 #f2e0b6;
      transition: transform .1s ease, box-shadow .1s ease, background .15s ease;
    }

    .rsp-btn:hover { background: #fffaeb; }
    .rsp-btn:active { transform: translateY(3px); box-shadow: none; }

    .disabled-area {
      opacity: .42;
      pointer-events: none;
      filter: saturate(.5);
    }

    /* ============================================================
       선택 화면
       ============================================================ */
    .select-modal {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #fffdf7 0%, #fff4e2 100%);
      border-radius: var(--radius-panel);
      display: flex;
      flex-direction: column;
      align-items: stretch;
      padding: 16px 14px;
      z-index: 100;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .select-modal.hidden { display: none; }

    .select-title {
      font-family: var(--font-display);
      font-size: 18px;
      color: var(--ink);
      text-align: center;
    }

    .select-sub {
      font-size: 11px;
      font-weight: 600;
      color: var(--ink-3);
      text-align: center;
      margin: 4px 0 14px;
    }

    .pokemon-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
    }

    .option-card {
      appearance: none;
      border: 1px solid #f0e2ca;
      border-radius: var(--radius-card);
      padding: 9px 4px 8px;
      cursor: pointer;
      background: linear-gradient(180deg, #fff, #fffaef);
      box-shadow: 0 3px 0 #f1e5d2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
      animation: cardIn .38s ease backwards;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .option-card:hover {
      transform: translateY(-4px);
      border-color: var(--gold);
      box-shadow: 0 7px 0 #f1e5d2, 0 10px 18px rgba(224, 139, 0, .22);
    }

    .option-card:active { transform: translateY(0); box-shadow: 0 2px 0 #f1e5d2; }

    .option-thumb {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 60%, #fff5d6 0%, #ffe9b0 70%, #ffdd8c 100%);
      box-shadow: inset 0 0 0 1px rgba(224, 139, 0, .18);
    }

    .option-thumb img {
      width: 46px;
      height: 46px;
      object-fit: contain;
      image-rendering: pixelated;
    }

    .option-name {
      font-family: var(--font-display);
      font-size: 12px;
      color: var(--ink);
      text-align: center;
      line-height: 1.2;
      word-break: keep-all;
    }

    /* ============================================================

    @media (max-width: 380px) {
      .pokemon-stage { height: 226px; }

      .level-title { font-size: 17px; }
      .btn { font-size: 10.5px; padding: 9px 1px; }
      .btn-motion { font-size: 10px; }
      .btn-egg-touch { font-size: 14px; }
      .stat-label { width: 42px; }
      .option-thumb { width: 46px; height: 46px; }
      .option-thumb img { width: 40px; height: 40px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .05ms !important;
      }
    }
  </style>
</head>

  <script>
    // 이로치 알 벡터 스프라이트
    const EGG_SPRITE = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 240'><defs><radialGradient id='g' cx='34%25' cy='28%25' r='72%25'><stop offset='0%25' stop-color='%23ffffff'/><stop offset='34%25' stop-color='%23fff6da'/><stop offset='78%25' stop-color='%23ffd76e'/><stop offset='100%25' stop-color='%23e08b00'/></radialGradient><radialGradient id='s' cx='50%25' cy='50%25' r='50%25'><stop offset='0%25' stop-color='rgba(70,40,10,0.34)'/><stop offset='100%25' stop-color='rgba(70,40,10,0)'/></radialGradient></defs><ellipse cx='100' cy='221' rx='66' ry='12' fill='url(%23s)'/><path d='M 100 20 C 150 20, 175 90, 175 145 C 175 190, 145 215, 100 215 C 55 215, 25 190, 25 145 C 25 90, 50 20, 100 20 Z' fill='url(%23g)' stroke='%23b06a00' stroke-width='4'/><ellipse cx='70' cy='78' rx='14' ry='18' fill='%237c5cff' opacity='0.7' transform='rotate(-15 70 78)'/><ellipse cx='133' cy='118' rx='18' ry='23' fill='%23ff6b9d' opacity='0.72' transform='rotate(20 133 118)'/><ellipse cx='78' cy='167' rx='16' ry='20' fill='%237c5cff' opacity='0.66' transform='rotate(-10 78 167)'/><path d='M 60 42 Q 80 29, 106 34' fill='none' stroke='%23ffffff' stroke-width='6' stroke-linecap='round' opacity='0.9'/><path d='M 148 52 l 5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 z' fill='%23ffffff' opacity='0.95'/></svg>";

    // Audio Context
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
    }

    function playSound(type) {
      initAudio();
      if (!audioCtx) return;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'click') {
        osc.frequency.setValueAtTime(400, now);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
        osc.start(now);
        osc.stop(now + 0.05);
      } else if (type === 'egg') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(350, now);
        osc.frequency.exponentialRampToValueAtTime(550, now + 0.12);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
        osc.start(now);
        osc.stop(now + 0.12);
      } else if (type === 'feed') {
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
      } else if (type === 'motion') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(250, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.25);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
      } else if (type === 'win') {
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.1);
        osc.frequency.setValueAtTime(783.99, now + 0.2);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
        osc.start(now);
        osc.stop(now + 0.35);
      } else if (type === 'hatch') {
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.setValueAtTime(450, now + 0.15);
        osc.frequency.setValueAtTime(600, now + 0.3);
        osc.frequency.setValueAtTime(850, now + 0.45);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
        osc.start(now);
        osc.stop(now + 0.6);
      } else if (type === 'levelup') {
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.setValueAtTime(554.37, now + 0.1);
        osc.frequency.setValueAtTime(659.25, now + 0.2);
        osc.frequency.setValueAtTime(880, now + 0.3);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
        osc.start(now);
        osc.stop(now + 0.5);
      } else if (type === 'heal') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(900, now + 0.2);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.start(now);
        osc.stop(now + 0.2);
      }
    }

      [

        { name: "팽태자✨", sprite: "https://play.pokemonshowdown.com/sprites/ani-shiny/prinplup.gif" },
        { name: "엠페르트✨", sprite: "https://play.pokemonshowdown.com/sprites/ani-shiny/empoleon.gif" }
      ],
      [
        { name: "랄토스✨", sprite: "https://play.pokemonshowdown.com/sprites/ani-shiny/ralts.gif" },
        { name: "킬리아✨", sprite: "https://play.pokemonshowdown.com/sprites/ani-shiny/kirlia.gif" },
        { name: "가디안✨", sprite: "https://play.pokemonshowdown.com/sprites/ani-shiny/gardevoir.gif" }
      ],
      [
        { name: "메리프✨", sprite: "https://play.pokemonshowdown.com/sprites/ani-shiny/mareep.gif" },
        { name: "보송송✨", sprite: "https://play.pokemonshowdown.com/sprites/ani-shiny/flaaffy.gif" },
        { name: "전룡✨",   sprite: "https://play.pokemonshowdown.com/sprites/ani-shiny/ampharos.gif" }
      ],
      [
        { name: "루리리✨", sprite: "https://play.pokemonshowdown.com/sprites/ani-shiny/azurill.gif" },
        { name: "마릴✨",   sprite: "https://play.pokemonshowdown.com/sprites/ani-shiny/marill.gif" },
        { name: "마릴리✨", sprite: "https://play.pokemonshowdown.com/sprites/ani-shiny/azumarill.gif" }
      ],
      [
        { name: "데덴네✨", sprite: "https://play.pokemonshowdown.com/sprites/ani-shiny/dedenne.gif" },
        { name: "토게데마루✨", sprite: "https://play.pokemonshowdown.com/sprites/ani-shiny/togedemaru.gif" },
        { name: "라이츄(알로라)✨", sprite: "https://play.pokemonshowdown.com/sprites/ani-shiny/raichu-alola.gif" }
      ],
      [
        { name: "핑복✨",   sprite: "https://play.pokemonshowdown.com/sprites/ani-shiny/happiny.gif" },
        { name: "럭키✨",   sprite: "https://play.pokemonshowdown.com/sprites/ani-shiny/chansey.gif" },
        { name: "해피너스✨", sprite: "https://play.pokemonshowdown.com/sprites/ani-shiny/blissey.gif" }
      ],
      [
        { name: "이브이✨", sprite: "https://play.pokemonshowdown.com/sprites/ani-shiny/eevee.gif" },
        { name: "샤미드✨", sprite: "https://play.pokemonshowdown.com/sprites/ani-shiny/vaporeon.gif" },
        { name: "님피아✨", sprite: "https://play.pokemonshowdown.com/sprites/ani-shiny/sylveon.gif" }
      ],
      [
        { name: "파모✨",   sprite: "https://play.pokemonshowdown.com/sprites/ani-shiny/pawmi.gif" },
        { name: "파모트✨", sprite: "https://play.pokemonshowdown.com/sprites/ani-shiny/pawmo.gif" },
        { name: "빠르모트✨", sprite: "https://play.pokemonshowdown.com/sprites/ani-shiny/pawmot.gif" }
      ],
      [
        { name: "토게피✨", sprite: "https://play.pokemonshowdown.com/sprites/ani-shiny/togepi.gif" },
        { name: "토게틱✨", sprite: "https://play.pokemonshowdown.com/sprites/ani-shiny/togetic.gif" },
        { name: "토게키스✨", sprite: "https://play.pokemonshowdown.com/sprites/ani-shiny/togekiss.gif" }
      ],
      [
        { name: "나옹✨",   sprite: "https://play.pokemonshowdown.com/sprites/ani-shiny/meowth.gif" },
        { name: "나옹마✨", sprite: "https://play.pokemonshowdown.com/sprites/ani-shiny/glameow.gif" },
        { name: "페르시온✨", sprite: "https://play.pokemonshowdown.com/sprites/ani-shiny/persian.gif" }
      ]
    ];

    const DEFAULT_DATA = {
      typeIndex: null,
      isHatched: false,
      hatchProgress: 0,
      fullness: 80,
      happiness: 80,
      cleanliness: 80,
      energy: 80,
      exp: 0,
      level: 1,
      isSick: false
    };

    let gameState = { ...DEFAULT_DATA };

    function renderSelectOptions() {
      const container = document.getElementById("pokemon-options");
      container.innerHTML = "";

      POKEMON_TREES.forEach((tree, idx) => {
        const firstForm = tree[0];
        const card = document.createElement("button");
        card.type = "button";
        card.className = "option-card";
        card.style.animationDelay = (idx * 28) + "ms";
        card.setAttribute("aria-label", firstForm.name + " 알 선택");
        card.onclick = () => selectPokemon(idx);

        const thumb = document.createElement("div");
        thumb.className = "option-thumb";

        const img = document.createElement("img");
        img.src = firstForm.sprite;
        img.alt = "";
        img.loading = "lazy";
        thumb.appendChild(img);

        const name = document.createElement("div");
        name.className = "option-name";
        name.textContent = firstForm.name;

        card.append(thumb, name);
        container.appendChild(card);
      });
    }

    function saveData() {
      localStorage.setItem('pokemon_egg_apartment_shiny_save', JSON.stringify(gameState));
    }

    function loadData() {
      const saved = localStorage.getItem('pokemon_egg_apartment_shiny_save');
      if (saved) {
        try {
          gameState = JSON.parse(saved);
        } catch (e) {
          gameState = { ...DEFAULT_DATA };
        }
      }
    }

    function confirmReset() {
      playSound('click');
      if (confirm("모든 저장 기록을 삭제하고 알부터 다시 키우시겠습니까?")) {
        localStorage.removeItem('pokemon_egg_apartment_shiny_save');
        gameState = { ...DEFAULT_DATA };
        document.getElementById("select-modal").classList.remove("hidden");
        showSpeech("기록을 지웠습니다. 품을 알을 골라주세요");
        updateUI();
      }
    }

    function selectPokemon(idx) {
      playSound('click');
      gameState = { ...DEFAULT_DATA, typeIndex: idx };
      document.getElementById("select-modal").classList.add("hidden");
      showSpeech("빛나는 이로치 알을 얻었습니다! 따뜻하게 어루만져 주세요");
      updateUI();
    }

    function clamp(val) {
      return Math.min(100, Math.max(0, val));
    }

    function getStatusText() {
      if (!gameState.isHatched) return "상태: 알";
      if (gameState.isSick) return "상태: 아픔 🤒";
      const avg = (gameState.fullness + gameState.happiness + gameState.cleanliness + gameState.energy) / 4;
      if (avg >= 70) return "상태: 최고 😄";
      if (avg >= 30) return "상태: 보통 🙂";
      return "상태: 나쁨 🙁";
    }

    function getBarGradient(val) {
      if (val > 50) return "linear-gradient(90deg, #4fe0b0, #2fc79a)";
      if (val > 20) return "linear-gradient(90deg, #ffd76e, #f5a623)";
      return "linear-gradient(90deg, #ff9a9a, #ff5d5d)";
    }

    function handlePetClick() {
      if (!gameState.isHatched) {
        touchEgg();
      }
    }

    function touchEgg() {
      if (gameState.isHatched) return;
      playSound('egg');

      const wrapper = document.getElementById("pokemon-wrapper");
      wrapper.className = "pokemon-wrapper anim-egg-shake";
      setTimeout(() => wrapper.className = "pokemon-wrapper", 500);

      gameState.hatchProgress += 12;
      showSpeech("알을 어루만져서 온도가 올랐습니다! 🐣");

      if (gameState.hatchProgress >= 100) {
        gameState.hatchProgress = 100;
        hatchEgg();
      }

      updateUI();
    }

    function showOverlay(text, duration, done) {
      const overlay = document.getElementById("evolution-overlay");
      overlay.innerHTML = "<span></span>";
      overlay.firstChild.textContent = text;
      overlay.classList.add("active");

      setTimeout(() => {
        overlay.classList.remove("active");
        if (done) done();
      }, duration);
    }

    function hatchEgg() {
      playSound('hatch');
      showOverlay("✨ 이로치 포켓몬이 부화했습니다! ✨", 1500, () => {
        gameState.isHatched = true;
        const tree = POKEMON_TREES[gameState.typeIndex];
        showSpeech(`빛나는 이로치 ${tree[0].name}(이)가 태어났습니다!`);
        updateUI();
      });
    }

    function updateUI() {
      const selectModal = document.getElementById("select-modal");
      if (gameState.typeIndex === null) {
        selectModal.classList.remove("hidden");
        return;
      }
      // 저장된 기록을 불러왔을 때도 선택 화면을 닫아준다
      selectModal.classList.add("hidden");

      const imgElem = document.getElementById("pokemon-img");
      const eggTouchBtn = document.getElementById("egg-touch-btn");
      const careBtns = document.querySelectorAll(".care-btn");
      const statsContainer = document.getElementById("stats-container");
      const motionGrid = document.getElementById("motion-grid");
      const rspPanel = document.getElementById("rsp-panel");
      const expBar = document.getElementById("exp-bar");

      if (!gameState.isHatched) {
        // 알 상태
        document.getElementById("stage-title").innerText = "이로치 알 (부화 대기 중)";
        document.getElementById("exp-title-label").innerText = "알 부화 진행도";
        expBar.style.width = gameState.hatchProgress + "%";
        expBar.style.background = "linear-gradient(90deg, #ffb37a, #ff8f3c)";
        document.getElementById("exp-text").innerText = `${gameState.hatchProgress} / 100`;

        imgElem.src = EGG_SPRITE;

        eggTouchBtn.style.display = "block";
        careBtns.forEach(btn => btn.style.display = "none");
        statsContainer.classList.add("disabled-area");
        motionGrid.classList.add("disabled-area");
        rspPanel.classList.add("disabled-area");
      } else {
        // 부화 후
        const tree = POKEMON_TREES[gameState.typeIndex];
        const stageIdx = Math.min(gameState.level - 1, tree.length - 1);
        const currentStage = tree[stageIdx];

        document.getElementById("stage-title").innerText = `${currentStage.name} Lv.${gameState.level}`;
        document.getElementById("exp-title-label").innerText = "경험치 (EXP)";
        expBar.style.width = gameState.exp + "%";
        expBar.style.background = "linear-gradient(90deg, #a78bfa, #7c5cff)";
        document.getElementById("exp-text").innerText = `${gameState.exp} / 100`;

        if (imgElem.src !== currentStage.sprite) {
          imgElem.src = currentStage.sprite;
        }

        eggTouchBtn.style.display = "none";
        careBtns.forEach(btn => btn.style.display = "block");
        statsContainer.classList.remove("disabled-area");
        motionGrid.classList.remove("disabled-area");
        rspPanel.classList.remove("disabled-area");

        updateBar("fullness-bar", gameState.fullness);
        updateBar("happiness-bar", gameState.happiness);
        updateBar("cleanliness-bar", gameState.cleanliness);
        updateBar("energy-bar", gameState.energy);
      }

      document.getElementById("status-text").innerText = getStatusText();

      const healBtn = document.getElementById("heal-btn");
      if (gameState.isSick && gameState.isHatched) {
        imgElem.classList.add("sick-filter");
        healBtn.style.display = "block";
      } else {
        imgElem.classList.remove("sick-filter");
        healBtn.style.display = "none";
      }

      saveData();
    }

    function updateBar(id, val) {
      const bar = document.getElementById(id);
      bar.style.width = val + "%";
      bar.style.background = getBarGradient(val);
      const label = document.getElementById(id + "-val");
      if (label) label.innerText = Math.round(val) + "%";
    }

    function showSpeech(text) {
      const bubble = document.getElementById("speech-bubble");
      bubble.innerText = text;
      bubble.style.animation = "none";
      void bubble.offsetWidth;
      bubble.style.animation = "";
    }

    function triggerMotion(type) {
      if (!gameState.isHatched) return;
      if (gameState.isSick) return showSpeech("아파서 움직일 수가 없어요...");
      if (gameState.energy < 10) return showSpeech("기력이 부족해요!");

      const wrapper = document.getElementById("pokemon-wrapper");
      wrapper.className = "pokemon-wrapper";
      void wrapper.offsetWidth;

      playSound('motion');

      if (type === 'run') {
        wrapper.classList.add("anim-run");
        showSpeech("거실을 신나게 달립니다! 🏃");
        gameState.energy = clamp(gameState.energy - 8);
        gameState.happiness = clamp(gameState.happiness + 10);
        addExp(8);
      } else if (type === 'jump') {
        wrapper.classList.add("anim-jump");
        showSpeech("높이 높이 점프! ⬆️");
        gameState.energy = clamp(gameState.energy - 5);
        gameState.happiness = clamp(gameState.happiness + 8);
        addExp(6);
      } else if (type === 'roll') {
        wrapper.classList.add("anim-roll");
        showSpeech("바닥을 데굴데굴 구릅니다! 🌀");
        gameState.energy = clamp(gameState.energy - 7);
        gameState.happiness = clamp(gameState.happiness + 12);
        addExp(9);
      } else if (type === 'doubleJump') {
        wrapper.classList.add("anim-double-jump");
        showSpeech("화려한 2단 점프 회전! 💫");
        gameState.energy = clamp(gameState.energy - 12);
        gameState.happiness = clamp(gameState.happiness + 18);
        addExp(15);
      }

      setTimeout(() => {
        wrapper.className = "pokemon-wrapper";
      }, 1300);

      updateUI();
    }

    function addExp(amount) {
      if (!gameState.isHatched || gameState.isSick) return;

      gameState.exp += amount;
      if (gameState.exp >= 100) {
        gameState.exp -= 100;
        gameState.level++;
        triggerEvolution();
      }
    }

    function triggerEvolution() {
      playSound('levelup');
      showOverlay("✨ 진화하는 중 ✨", 1200, () => {
        const tree = POKEMON_TREES[gameState.typeIndex];
        const stageIdx = Math.min(gameState.level - 1, tree.length - 1);
        const newStage = tree[stageIdx];
        showSpeech(`🎉 ${newStage.name}(으)로 진화했습니다!`);
        updateUI();
      });
    }

    function feed() {
      if (!gameState.isHatched) return;
      playSound('feed');
      if (gameState.isSick) return showSpeech("아파서 입맛이 없어요");
      gameState.fullness = clamp(gameState.fullness + 25);
      gameState.happiness = clamp(gameState.happiness + 5);
      showSpeech("밥을 맛있게 먹었어요! 🥣");
      addExp(10);
      updateUI();
    }

    function clean() {
      if (!gameState.isHatched) return;
      playSound('click');
      if (gameState.isSick) return showSpeech("아플 땐 치료부터 해야 해요");
      gameState.cleanliness = clamp(gameState.cleanliness + 35);
      gameState.happiness = clamp(gameState.happiness + 5);

      showSpeech("깨끗하게 목욕을 마쳤어요! 🚿");
      addExp(10);
      updateUI();
    }

    function sleep() {
      if (!gameState.isHatched) return;
      playSound('click');
      if (gameState.isSick) return showSpeech("아파서 편히 잘 수 없어요");
      gameState.energy = clamp(gameState.energy + 40);
      gameState.fullness = clamp(gameState.fullness - 10);

      showSpeech("소파 옆에서 기력을 회복했습니다! 💤");
      addExp(10);
      updateUI();
    }

    function heal() {
      if (!gameState.isHatched) return;
      playSound('heal');
      if (!gameState.isSick) return;
      gameState.isSick = false;

      gameState.fullness = Math.max(gameState.fullness, 30);
      gameState.happiness = Math.max(gameState.happiness, 30);
      gameState.cleanliness = Math.max(gameState.cleanliness, 30);
      gameState.energy = Math.max(gameState.energy, 30);

      showSpeech("치료를 받아 병이 다 나았습니다! 💊");
      updateUI();
    }

    function playRSP(userChoice) {
      if (!gameState.isHatched) return;
      if (gameState.isSick) return showSpeech("아파서 놀 수 없어요");
      if (gameState.energy < 10) return showSpeech("기력이 모자라요!");

      const choices = ['가위', '바위', '보'];
      const petChoice = choices[Math.floor(Math.random() * 3)];

      gameState.energy = clamp(gameState.energy - 10);
      gameState.fullness = clamp(gameState.fullness - 5);

      let resultText = `나 ${userChoice} vs 펫 ${petChoice} → `;

      if (userChoice === petChoice) {
        playSound('click');
        resultText += "비겼습니다!";
        gameState.happiness = clamp(gameState.happiness + 10);
        addExp(5);
      } else if (
        (userChoice === '가위' && petChoice === '보') ||
        (userChoice === '바위' && petChoice === '가위') ||
        (userChoice === '보' && petChoice === '바위')
      ) {
        playSound('win');
        resultText += "이겼습니다! 행복 +25 · EXP +15";
        gameState.happiness = clamp(gameState.happiness + 25);
        addExp(15);
      } else {
        playSound('click');
        resultText += "졌어요... 행복 +5 · EXP +5";
        gameState.happiness = clamp(gameState.happiness + 5);
        addExp(5);
      }

      showSpeech(resultText);
      updateUI();
    }

    // 타이머 루프 (4초)
    setInterval(() => {
      if (gameState.typeIndex === null) return;

      if (!gameState.isHatched) {
        gameState.hatchProgress = Math.min(100, gameState.hatchProgress + 2);
        if (gameState.hatchProgress >= 100) {
          hatchEgg();
        }
      } else {
        gameState.fullness = clamp(gameState.fullness - 2);
        gameState.happiness = clamp(gameState.happiness - 2);
        gameState.cleanliness = clamp(gameState.cleanliness - 2);
        gameState.energy = clamp(gameState.energy - 2);

        if ((gameState.fullness === 0 || gameState.happiness === 0 || gameState.cleanliness === 0 || gameState.energy === 0) && !gameState.isSick) {
          gameState.isSick = true;
          showSpeech("포켓몬이 병에 걸렸어요! 치료해주세요");
        }
      }

      updateUI();
    }, 4000);

    // 실행 초기화
    renderSelectOptions();
    loadData();
    updateUI();
  </script>
</body>
</html>
