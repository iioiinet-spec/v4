<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>빛과 색의 삼원색 — 이미지 데이터 20문제</title>
<style>
:root{
  --bg:#080b16;--panel:#11172a;--panel2:#171e35;--line:#303a5d;
  --text:#f4f6ff;--muted:#aeb8d5;--accent:#7f8cff;--good:#45d99a;--bad:#ff7184;
}
*{box-sizing:border-box}
body{
 margin:0;background:
 radial-gradient(circle at 15% 0%,rgba(255,50,50,.16),transparent 28%),
 radial-gradient(circle at 85% 0%,rgba(40,100,255,.18),transparent 30%),
 radial-gradient(circle at 50% 100%,rgba(0,255,150,.08),transparent 35%),var(--bg);
 color:var(--text);font-family:system-ui,"Noto Sans KR",sans-serif;min-height:100vh;
}
header{text-align:center;padding:42px 18px 24px}
h1{font-size:clamp(28px,5vw,48px);margin:0;letter-spacing:-2px}
header p{color:var(--muted);margin:10px auto;max-width:720px}
.rgbbar{display:flex;height:7px;max-width:700px;margin:24px auto 0;border-radius:99px;overflow:hidden}
.rgbbar span{flex:1}.red{background:#ff3e4d}.green{background:#35e68a}.blue{background:#4388ff}
.wrap{width:min(900px,92%);margin:auto;padding-bottom:50px}
.top{
 background:rgba(17,23,42,.88);border:1px solid var(--line);border-radius:20px;
 padding:17px 20px;position:sticky;top:10px;z-index:5;backdrop-filter:blur(12px)
}
.status{display:flex;justify-content:space-between;gap:15px;margin-bottom:10px;font-weight:800}
.progress{height:10px;background:#242b45;border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;width:5%;background:linear-gradient(90deg,#ff4352,#45e38e,#478dff);transition:.3s}
.card{
 margin-top:18px;background:rgba(17,23,42,.94);border:1px solid var(--line);
 border-radius:24px;padding:30px;box-shadow:0 18px 50px #0005
}
.badge{display:inline-block;padding:6px 11px;border-radius:99px;background:#252d4b;color:#bfc8ff;font-size:13px;font-weight:800}
h2{font-size:26px;line-height:1.4;margin:15px 0}
.question{font-size:18px;line-height:1.8;white-space:pre-line}
.matrix{
 display:inline-block;margin:12px 0;padding:14px 24px;border-radius:12px;
 background:#090c15;border:1px solid #39425f;font:700 21px/1.7 ui-monospace,monospace
}
.options{display:grid;gap:11px;margin-top:25px}
.option{
 text-align:left;width:100%;padding:15px 17px;border:1px solid #39435f;border-radius:13px;
 background:#151c31;color:var(--text);cursor:pointer;font-size:16px;transition:.15s
}
.option:hover:not(:disabled){transform:translateY(-1px);border-color:#7280c5;background:#1c2540}
.option:disabled{cursor:default}
.option.correct{background:rgba(69,217,154,.13);border-color:var(--good)}
.option.wrong{background:rgba(255,113,132,.13);border-color:var(--bad)}
.explain{
 margin-top:20px;padding:18px;border-radius:14px;background:#0d1221;border-left:4px solid var(--accent);
 line-height:1.75;color:#d9def1
}
.next{
 margin-top:20px;width:100%;padding:15px;border:0;border-radius:13px;
 background:#7180ff;color:white;font-size:16px;font-weight:900;cursor:pointer
}
.next:hover{filter:brightness(1.1)}
.hidden{display:none}
.result{text-align:center;padding:40px 20px}
.score{font-size:56px;font-weight:950;margin:15px 0}
.rank{font-size:21px;font-weight:800}
.retry{margin-top:24px;padding:13px 25px;border:0;border-radius:12px;background:#7180ff;color:#fff;font-weight:800;cursor:pointer}
.footer{text-align:center;color:#7e89aa;padding:10px}
@media(max-width:600px){.card{padding:22px}h2{font-size:22px}.question{font-size:16px}.status{font-size:14px}}
</style>
</head>
<body>
<header>
 <h1>빛과 색의 삼원색</h1>
 <p>이미지 데이터의 표현과 변환 · 실전 예제 20문항</p>
 <div class="rgbbar"><span class="red"></span><span class="green"></span><span class="blue"></span></div>
</header>

<main class="wrap">
 <div class="top">
  <div class="status"><span id="part">Part 1 · 픽셀과 행렬의 기초</span><span id="count">1 / 20</span></div>
  <div class="progress"><i id="bar"></i></div>
 </div>

 <section id="quizCard" class="card">
  <span id="badge" class="badge">PIXEL & MATRIX</span>
  <h2 id="title"></h2>
  <div id="question" class="question"></div>
  <div id="options" class="options"></div>
  <div id="explain" class="explain hidden"></div>
  <button id="next" class="next hidden">다음 문제 →</button>
 </section>

 <section id="result" class="card result hidden">
  <span class="badge">MISSION COMPLETE</span>
  <h2>20문제 완료!</h2>
  <div id="finalScore" class="score"></div>
  <div id="finalRank" class="rank"></div>
  <p id="finalText"></p>
  <button class="retry" onclick="location.reload()">다시 풀기</button>
 </section>
</main>
<div class="footer">RGB의 빛에서 시작해 픽셀과 행렬의 세계까지 🌈</div>

<script>
const qs=[
 {part:"Part 1 · 픽셀과 행렬의 기초",badge:"PIXEL & MATRIX",title:"이미지 해상도와 행렬 차원",
  q:"가로 400px, 세로 300px 크기의 흑백 이미지가 있다.\n이 이미지를 행렬 A로 표현할 때 올바른 차원은?",
  o:["① 400×300","② 300×400","③ 300×300","④ 400×400"],a:1,
  e:"행렬의 행(Row)은 세로 방향, 열(Column)은 가로 방향을 나타냅니다. 따라서 세로 300 × 가로 400이므로 300×400입니다."},
 {part:"Part 1 · 픽셀과 행렬의 기초",badge:"PIXEL & MATRIX",title:"흑백 이미지의 픽셀 값 범위",
  q:"8비트 Grayscale 이미지에 대한 설명 중 가장 적절하지 않은 것은?",
  o:["① 0~255까지 총 256가지 명도 단계를 갖는다.","② 0에 가까울수록 어둡다.","③ 255에 가까울수록 밝다.","④ 128은 검은색과 흰색이 번갈아 나타나는 점이다."],a:3,
  e:"128은 검정과 흰색이 번갈아 나타나는 값이 아니라 중간 회색을 나타냅니다."},
 {part:"Part 1 · 픽셀과 행렬의 기초",badge:"PIXEL & MATRIX",title:"픽셀 위치와 행렬 인덱싱",
  q:"다음 3×3 이미지 행렬에서 상단에서 2번째 행, 좌측에서 3번째 열의 값 M₂₃은 얼마인가?",
  m:"15  30   50\n200  80  250\n100 250  120",o:["① 50","② 100","③ 200","④ 250"],a:3,
  e:"Mᵢⱼ에서 i는 행, j는 열입니다. 따라서 M₂₃은 2행 3열인 250입니다."},
 {part:"Part 1 · 픽셀과 행렬의 기초",badge:"PIXEL & MATRIX",title:"흑백 이미지 메모리 계산",
  q:"가로 1000px, 세로 1000px인 8비트 Grayscale 이미지의 데이터 용량은?\n(헤더와 압축은 무시)",
  o:["① 1,000 Byte","② 100,000 Byte","③ 1,000,000 Byte","④ 3,000,000 Byte"],a:2,
  e:"총 픽셀은 1,000×1,000=1,000,000개입니다. 8비트는 픽셀당 1Byte이므로 총 1,000,000Byte입니다."},

 {part:"Part 2 · 컬러(RGB) 이미지 표현",badge:"RGB",title:"RGB 컬러 이미지의 텐서 구조",
  q:"가로 W, 세로 H인 RGB 컬러 이미지를 일반적인 다차원 배열로 표현할 때 올바른 Shape은?",
  o:["① (H,W)","② (W,H)","③ (H,W,3)","④ (3,H×W)"],a:2,
  e:"각 위치에 R, G, B 세 채널이 있으므로 일반적인 H×W×3 구조입니다."},
 {part:"Part 2 · 컬러(RGB) 이미지 표현",badge:"RGB",title:"RGB 채널 값과 색상",
  q:"한 픽셀의 RGB 값이 (255, 255, 0)일 때 화면에 표시되는 색은?",
  o:["① 보라색","② 노랑색","③ 청록색","④ 흰색"],a:1,
  e:"R과 G의 빛을 최대 강도로 켜고 B를 끄면 노란색(Yellow)이 됩니다. R+G=Yellow입니다."},
 {part:"Part 2 · 컬러(RGB) 이미지 표현",badge:"RGB",title:"Grayscale 변환 공식의 원리",
  q:"Y=0.299R+0.587G+0.114B와 같은 가중합을 사용하는 가장 중요한 이유는?",
  o:["① 행렬 연산 속도를 높이기 위해","② 사람의 색상별 시각적 민감도를 반영하기 위해","③ R 데이터 손실을 방지하기 위해","④ 파일 용량을 줄이기 위해"],a:1,
  e:"사람의 시각은 색상 채널마다 밝기를 다르게 느낍니다. 이 가중치를 사용하면 사람이 느끼는 밝기에 가까운 Grayscale을 얻을 수 있습니다."},

 {part:"Part 3 · 밝기 및 명암비 조절",badge:"TRANSFORM",title:"스칼라 덧셈과 밝기 조절",
  q:"A의 모든 픽셀 밝기를 30만큼 올리려고 한다.\nA =",
  m:"100  200\n150   80",o:["① 130 230 / 180 110","② 70 170 / 120 50","③ 300 600 / 450 240","④ 100 200 / 150 80"],a:0,
  e:"A+30은 모든 성분에 30을 더하는 것입니다. 결과는 [[130,230],[180,110]]입니다."},
 {part:"Part 3 · 밝기 및 명암비 조절",badge:"CLIPPING",title:"오버플로우와 클리핑",
  q:"8비트 이미지에서 픽셀 220에 50을 더했다.\n0≤x≤255로 클리핑하면 최종 값은?",
  o:["① 270","② 255","③ 14","④ 0"],a:1,
  e:"220+50=270이지만 8비트의 최댓값은 255입니다. 따라서 255로 클리핑합니다."},
 {part:"Part 3 · 밝기 및 명암비 조절",badge:"CONTRAST",title:"스칼라 곱과 명암비",
  q:"모든 픽셀에 1보다 큰 c를 곱하는 Y=cX 연산의 주요 효과는?",
  o:["① 해상도가 증가한다.","② 명암비가 증가한다.","③ 90도 회전한다.","④ 흑백이 컬러가 된다."],a:1,
  e:"픽셀 값의 차이를 확대하므로 밝은 부분과 어두운 부분의 차이, 즉 명암비가 커집니다."},
 {part:"Part 3 · 밝기 및 명암비 조절",badge:"TRANSFORM",title:"밝기와 대비 선형 변환",
  q:"초기 픽셀 x=100에 y=clip(1.5x−20)을 적용하면?",
  o:["① 130","② 150","③ 170","④ 200"],a:0,
  e:"100×1.5=150, 150−20=130입니다. 130은 0~255 범위 안이므로 그대로 130입니다."},

 {part:"Part 4 · 전치행렬과 이미지 변환",badge:"TRANSPOSE",title:"전치행렬의 시각적 효과",
  q:"행렬 A의 행과 열을 바꾸는 전치 Aᵀ를 정사각형 이미지에 적용하면?",
  o:["① 좌우 반전","② 상하 반전","③ 주대각선 기준 대칭 이동","④ 시계 방향 90도 회전"],a:2,
  e:"Aᵀ의 성분은 (Aᵀ)ᵢⱼ=Aⱼᵢ입니다. 따라서 주대각선을 기준으로 대칭 이동한 것과 같습니다."},
 {part:"Part 4 · 전치행렬과 이미지 변환",badge:"ROTATION",title:"전치와 90도 회전",
  q:"시계 방향 90도 회전을 만들 때 전치(T)와 좌우 반전(Fh)의 조합으로 올바른 것은?",
  o:["① 전치 후 좌우 반전 Fh(Aᵀ)","② 좌우 반전 후 상하 반전","③ 전치만 2회","④ 좌우 반전→전치→상하 반전"],a:0,
  e:"전치 후 좌우 반전을 하면 시계 방향 90도 회전과 같은 결과가 됩니다."},
 {part:"Part 4 · 전치행렬과 이미지 변환",badge:"TRANSPOSE",title:"직사각형 행렬의 전치",
  q:"다음 2×3 행렬 B의 전치 Bᵀ는?",
  m:"10 40\n20 50\n30 60",o:["① 3×2, [[10,20,30],[40,50,60]]","② 3×2, [[60,40,20],[50,30,10]]","③ 2×3, [[40,10],[50,20],[60,30]]","④ 2×3, [[30,60],[20,50],[10,40]]"],a:0,
  e:"2×3 행렬을 전치하면 3×2가 됩니다. 원래 첫 행 (10,20,30)이 첫 열이 됩니다."},
 {part:"Part 4 · 전치행렬과 이미지 변환",badge:"FLIP",title:"좌우 반전과 전치의 차이",
  q:"좌우 반전과 전치 연산에 대한 설명 중 옳지 않은 것은?",
  o:["① 전치는 차원이 바뀔 수 있지만 좌우 반전은 차원을 유지한다.","② 전치는 주대각선 대칭, 좌우 반전은 중앙 수직선 대칭이다.","③ 전치와 좌우 반전은 수학적으로 완전히 동일하다.","④ 좌우 반전은 반전 행렬을 이용해 구현할 수 있다."],a:2,
  e:"전치와 좌우 반전은 서로 다른 연산입니다. 전치는 행과 열을 교환하고, 좌우 반전은 각 행의 순서를 뒤집습니다."},

 {part:"Part 5 · 행렬 합성 및 실전 응용",badge:"BLENDING",title:"알파 블렌딩",
  q:"α=0.7일 때 두 이미지 A, B의 알파 블렌딩 공식은?",
  o:["① C=0.7A+0.7B","② C=0.7A+0.3B","③ C=0.3A+0.7B","④ C=A+B−0.7"],a:1,
  e:"표준 공식은 C=αA+(1−α)B입니다. α=0.7이므로 C=0.7A+0.3B입니다."},
 {part:"Part 5 · 행렬 합성 및 실전 응용",badge:"MASK",title:"마스킹 연산",
  q:"원본 이미지 I에서 특정 영역만 남기고 나머지를 검은색으로 만들려 한다. 마스크 M은?",
  o:["① 남길 영역 1, 지울 영역 0","② 남길 영역 0, 지울 영역 1","③ 남길 영역 255, 지울 영역 255","④ 남길 영역 −1, 지울 영역 0"],a:0,
  e:"성분별 곱 I⊙M에서 1은 원본 값을 유지하고 0은 픽셀을 0으로 만듭니다."},
 {part:"Part 5 · 행렬 합성 및 실전 응용",badge:"EDGE",title:"엣지 검출 필터",
  q:"명도 변화가 급격한 테두리를 찾는 미분 필터의 일반적인 특징은?",
  o:["① 모든 성분의 합이 255이다.","② 필터 성분의 합이 일반적으로 0이다.","③ 모든 성분이 음수이다.","④ 이미지를 2배 확대한다."],a:1,
  e:"평탄한 영역에서는 변화량이 0이 되도록 필터 성분의 합을 0으로 구성하는 것이 일반적입니다."},
 {part:"Part 5 · 행렬 합성 및 실전 응용",badge:"DIFFERENCE",title:"영상 차분과 변화 감지",
  q:"이전 프레임 F₁과 현재 프레임 F₂로 움직이는 물체를 감지할 때 적절한 차분은?",
  o:["① D=F₁+F₂","② D=|F₂−F₁|","③ D=F₁×F₂","④ D=F₂ᵀ"],a:1,
  e:"같은 위치의 픽셀 값 차이의 절댓값을 구하면 변화가 없는 곳은 0에 가까워지고 움직임이 있는 곳은 크게 나타납니다."},
 {part:"Part 5 · 행렬 합성 및 실전 응용",badge:"FINAL",title:"종합 응용 — 3단계 이미지 변환",
  q:"X에 대해 ① 전치 → ② 모든 값에 ×2 → ③ 모든 값에 +20 후 0~255 클리핑을 순서대로 적용한다. 최종 행렬은?",
  m:"X =  [100  200]\n      [ 50    0]",o:["① [[220,120],[420,20]]","② [[220,120],[255,20]]","③ [[220,420],[120,20]]","④ [[200,400],[100,0]]"],a:1,
  e:"Xᵀ=[[100,50],[200,0]] → ×2=[[200,100],[400,0]] → +20=[[220,120],[420,20]]. 420은 255를 초과하므로 클리핑하여 [[220,120],[255,20]]이 됩니다."}
];

let idx=0,score=0,locked=false;
const $=id=>document.getElementById(id);

function render(){
 locked=false;
 const q=qs[idx];
 $("part").textContent=q.part;$("count").textContent=`${idx+1} / ${qs.length}`;
 $("bar").style.width=`${((idx+1)/qs.length)*100}%`;
 $("badge").textContent=q.badge;$("title").textContent=`Q${idx+1}. ${q.title}`;
 $("question").textContent=q.q;
 $("question").innerHTML=q.q.replace(/\n/g,"<br>");
 if(q.m){
  const m=document.createElement("div");m.className="matrix";m.innerHTML=q.m.replace(/\n/g,"<br>");
  $("question").appendChild(m);
 }
 $("options").innerHTML="";
 q.o.forEach((text,i)=>{
  const b=document.createElement("button");b.className="option";b.textContent=text;
  b.onclick=()=>answer(i,b);$("options").appendChild(b);
 });
 $("explain").className="explain hidden";$("explain").innerHTML="";
 $("next").className="next hidden";
 $("next").textContent=idx===qs.length-1?"결과 보기 →":"다음 문제 →";
 window.scrollTo({top:0,behavior:"smooth"});
}
function answer(n,clicked){
 if(locked)return;locked=true;
 const q=qs[idx];
 document.querySelectorAll(".option").forEach((b,i)=>{
  b.disabled=true;
  if(i===q.a)b.classList.add("correct");
 });
 if(n===q.a)score++;
 else clicked.classList.add("wrong");
 $("explain").className="explain";
 $("explain").innerHTML=`<b>${n===q.a?"✓ 정답!":"✕ 아쉬워요!"}</b><br>${q.e}`;
 $("next").className="next";
}
$("next").onclick=()=>{
 if(idx<qs.length-1){idx++;render()}else finish();
};
function finish(){
 $("quizCard").className="card hidden";$("result").className="card result";
 $("bar").style.width="100%";$("count").textContent="완료";
 $("finalScore").textContent=`${score} / ${qs.length}`;
 let rank,text;
 const p=score/qs.length;
 if(p===1){rank="🌈 RGB 마스터";text="20문제 전부 정답! 이미지 데이터를 행렬로 보는 감각이 완벽합니다."}
 else if(p>=.85){rank="✨ 이미지 데이터 전문가";text="거의 완벽합니다. 몇 문제만 다시 확인하면 됩니다."}
 else if(p>=.65){rank="🔬 이미지 데이터 탐구자";text="핵심 개념을 잘 잡았습니다. 틀린 문제의 해설을 다시 확인해 보세요."}
 else{rank="🌱 이미지 데이터 입문자";text="괜찮습니다! 픽셀 → RGB → 행렬 → 변환 순서로 다시 복습해 보세요."}
 $("finalRank").textContent=rank;$("finalText").textContent=text;
 window.scrollTo({top:0,behavior:"smooth"});
}
render();
</script>
