<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3회차 · 이미지 데이터의 표현과 변환 — 20문제</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0d0f14;
    --panel: #161922;
    --panel-2: #1c202c;
    --line: #2a2f3d;
    --text: #eceef3;
    --sub: #9aa1b4;
    --R: #ff5c72;
    --G: #43d17a;
    --B: #57a2ff;
    --gold: #f0c14b;
    --radius: 18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1100px 600px at 12% -10%, rgba(255,92,114,.10), transparent 60%),
      radial-gradient(1100px 600px at 90% 0%, rgba(87,162,255,.10), transparent 55%),
      radial-gradient(900px 500px at 50% 110%, rgba(67,209,122,.08), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Noto Sans KR', sans-serif;
    min-height:100vh;
    padding:32px 16px 80px;
  }
  .wrap{max-width:880px;margin:0 auto;}

  header{
    display:flex; align-items:flex-start; justify-content:space-between; gap:24px;
    margin-bottom:20px; flex-wrap:wrap;
  }
  .eyebrow{
    font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.14em;
    color:var(--sub); text-transform:uppercase; margin:0 0 8px;
  }
  .eyebrow b{color:var(--gold); font-weight:600;}
  h1{
    font-family:'Space Grotesk',sans-serif; font-size:clamp(24px,4vw,34px);
    font-weight:700; line-height:1.25; margin:0; letter-spacing:-.01em;
  }
  h1 span.px{
    background:linear-gradient(90deg,var(--R),var(--G),var(--B));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .sub{color:var(--sub); font-size:14px; margin-top:8px; max-width:560px;}

  .topicrow{
    display:flex; flex-wrap:wrap; gap:8px; margin-bottom:24px;
  }
  .topicpill{
    font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--sub);
    border:1px solid var(--line); background:var(--panel-2);
    padding:6px 12px; border-radius:99px;
  }

  .pxgrid{
    display:grid; grid-template-columns:repeat(5,14px); grid-template-rows:repeat(4,14px);
    gap:3px; padding:10px; background:var(--panel); border:1px solid var(--line);
    border-radius:10px; flex-shrink:0;
  }
  .pxcell{
    width:14px; height:14px; border-radius:3px; background:#252a38;
    transition:background .25s ease, transform .2s ease;
  }
  .pxcell.correct{background:var(--G);}
  .pxcell.wrong{background:var(--R);}
  .pxcell.current{outline:1.5px solid var(--gold); animation:blink 1.2s infinite;}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:.45;}}

  .progressbar{height:6px; background:var(--panel-2); border-radius:99px; overflow:hidden; margin-bottom:26px; border:1px solid var(--line);}
  .progressfill{height:100%; width:0%; background:linear-gradient(90deg,var(--R),var(--gold),var(--G),var(--B)); transition:width .35s ease;}

  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:28px 26px; margin-bottom:18px;
  }
  .qmeta{
    display:flex; align-items:center; gap:10px; margin-bottom:14px;
  }
  .qnum{
    font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:700;
    color:var(--bg); background:var(--gold); padding:3px 10px; border-radius:99px;
  }
  .qtag{
    font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--sub);
    letter-spacing:.05em;
  }
  .qtext{font-size:19px; line-height:1.55; font-weight:600; margin:0 0 22px; letter-spacing:-.01em;}
  .qtext code{
    font-family:'JetBrains Mono',monospace; background:#0d101a; border:1px solid var(--line);
    padding:2px 6px; border-radius:6px; font-size:.85em; color:var(--B);
  }

  .options{display:flex; flex-direction:column; gap:10px;}
  .opt{
    display:flex; align-items:center; gap:12px;
    text-align:left; width:100%; padding:14px 16px;
    background:var(--panel-2); border:1px solid var(--line); border-radius:12px;
    color:var(--text); font-family:'Noto Sans KR',sans-serif; font-size:15px;
    cursor:pointer; transition:border-color .15s, background .15s, transform .1s;
  }
  .opt:hover:not(:disabled){border-color:#454d64; transform:translateY(-1px);}
  .opt:disabled{cursor:default;}
  .opt .tag{
    font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--sub);
    width:20px; flex-shrink:0;
  }
  .opt.selected{border-color:var(--gold);}
  .opt.correct{border-color:var(--G); background:rgba(67,209,122,.12);}
  .opt.correct .tag{color:var(--G);}
  .opt.wrong{border-color:var(--R); background:rgba(255,92,114,.12);}
  .opt.wrong .tag{color:var(--R);}

  .explain{
    margin-top:18px; padding:14px 16px; border-radius:12px;
    background:#0d101a; border:1px solid var(--line);
    font-size:14px; line-height:1.6; color:#c7cbdb; display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--gold);}

  .navrow{display:flex; justify-content:space-between; align-items:center; margin-top:8px;}
  .btn{
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14px;
    padding:11px 20px; border-radius:11px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--text); cursor:pointer; transition:.15s;
  }
  .btn:hover:not(:disabled){border-color:#454d64;}
  .btn:disabled{opacity:.35; cursor:not-allowed;}
  .btn.primary{background:var(--gold); color:#181307; border-color:var(--gold);}
  .btn.primary:hover:not(:disabled){filter:brightness(1.06);}

  .footer-note{text-align:center; color:var(--sub); font-size:12px; margin-top:20px; font-family:'JetBrains Mono',monospace;}

  .result{display:none; text-align:center; padding:10px 8px 4px;}
  .result.show{display:block;}
  .result h2{font-family:'Space Grotesk'; font-size:30px; margin:6px 0 2px;}
  .result .score{
    font-family:'JetBrains Mono',monospace; font-size:56px; font-weight:700;
    background:linear-gradient(90deg,var(--R),var(--G),var(--B));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    margin:10px 0;
  }
  .result p{color:var(--sub); font-size:14px;}
  .resultbar{display:flex; gap:10px; justify-content:center; margin-top:22px; flex-wrap:wrap;}

  .reviewlist{margin-top:26px; text-align:left; display:flex; flex-direction:column; gap:10px;}
  .reviewitem{
    display:flex; gap:12px; padding:12px 14px; border-radius:10px; border:1px solid var(--line); background:var(--panel-2);
    font-size:13px; align-items:flex-start;
  }
  .reviewitem .dot{width:9px;height:9px;border-radius:50%;margin-top:4px;flex-shrink:0;}
  .reviewitem.ok .dot{background:var(--G);}
  .reviewitem.bad .dot{background:var(--R);}
  .reviewitem .rtext{color:#c7cbdb; line-height:1.5;}
  .reviewitem .rtext b{color:var(--text);}

  #quizStage{display:block;}
  #resultStage{display:none;}

  @media(max-width:520px){
    .card{padding:20px 16px;}
    header{flex-direction:column;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <p class="eyebrow"><b>3회차</b> · 이미지 데이터 단원</p>
      <h1>이미지 데이터의<br><span class="px">표현과 변환</span> — 20문제</h1>
      <p class="sub">픽셀과 행렬, 흑백·컬러(RGB) 표현, 전치행렬, 행렬의 덧셈·뺄셈, 실수배까지 — 수업 시간에 배운 내용만으로 구성했습니다.</p>
    </div>
    <div class="pxgrid" id="pxGrid"></div>
  </header>

  <div class="topicrow">
    <span class="topicpill">① 픽셀과 행렬</span>
    <span class="topicpill">② 흑백 이미지</span>
    <span class="topicpill">③ 컬러 이미지(RGB)</span>
    <span class="topicpill">④ 전치행렬</span>
    <span class="topicpill">⑤ 행렬의 덧셈·뺄셈</span>
    <span class="topicpill">⑥ 행렬의 실수배</span>
  </div>

  <div class="progressbar"><div class="progressfill" id="progressFill"></div></div>

  <div id="quizStage">
    <div class="card" id="quizCard">
      <div class="qmeta">
        <span class="qnum" id="qNum">Q1</span>
        <span class="qtag" id="qTag">개념</span>
      </div>
      <p class="qtext" id="qText"></p>
      <div class="options" id="optionsBox"></div>
      <div class="explain" id="explainBox"></div>
    </div>

    <div class="navrow">
      <button class="btn" id="prevBtn">← 이전</button>
      <span class="footer-note" id="liveScore">정답 0 / 시도 0</span>
      <button class="btn primary" id="nextBtn" disabled>다음 →</button>
    </div>
  </div>

  <div id="resultStage">
    <div class="card result" id="resultCard">
      <p class="eyebrow">채점 결과</p>
      <h2>수고하셨습니다!</h2>
      <div class="score" id="finalScore">0 / 20</div>
      <p id="finalMsg">아래에서 문항별 정답과 해설을 확인할 수 있어요.</p>
      <div class="resultbar">
        <button class="btn primary" id="reviewBtn">문항별 해설 보기</button>
        <button class="btn" id="retryBtn">처음부터 다시 풀기</button>
      </div>
      <div class="reviewlist" id="reviewList"></div>
    </div>
  </div>

  <p class="footer-note">R · G · B 채널이 채워지면 한 문제씩 완료됩니다 — 20/20을 완성해 보세요.</p>
</div>

<script>
const QUESTIONS = [
  {tag:"① 픽셀과 행렬", q:"디지털 이미지는 무엇들의 모임으로 이루어져 있나요?",
   opts:["문자(Character)","픽셀(Pixel)","벡터(Vector)","함수(Function)"], answer:1,
   exp:"이미지는 작은 점인 <b>픽셀</b>들의 모임이며, 각 픽셀이 가진 색상 정보를 <b>행렬</b>로 표현합니다."},

  {tag:"① 픽셀과 행렬", q:"각 픽셀이 가진 색상 정보를 수학적으로 표현하는 대상은?",
   opts:["행렬(Matrix)","그래프(Graph)","함수(Function)","집합(Set)"], answer:0,
   exp:"픽셀들의 색상 정보를 격자 형태의 숫자 배열인 <b>행렬</b>로 표현합니다."},

  {tag:"① 픽셀과 행렬", q:"가로 5개, 세로 4개의 픽셀로 이루어진 이미지를 나타내는 행렬의 크기는? (행렬 크기 = 세로×가로)",
   opts:["5×4", "4×5", "9×9", "20×20"], answer:1,
   exp:"행렬의 크기는 (행, 열) = (세로 픽셀 수, 가로 픽셀 수)이므로 <b>4×5</b> 행렬이 됩니다."},

  {tag:"① 픽셀과 행렬", q:"이미지를 나타내는 행렬에서 원소(숫자) 하나가 의미하는 것은?",
   opts:["이미지 전체의 크기","픽셀 하나의 색상 값","이미지 파일의 용량","두 이미지의 차이"], answer:1,
   exp:"행렬의 각 원소는 그 위치에 있는 <b>픽셀 하나의 색상(밝기) 값</b>을 나타냅니다."},

  {tag:"② 흑백 이미지", q:"단순 흑백 이미지는 각 픽셀을 몇 가지 값으로 표현하나요?",
   opts:["0과 1 두 가지","0~255 사이 정수","0~9 사이 정수","−1과 1 두 가지"], answer:0,
   exp:"단순 흑백 이미지는 <b>0(검정)과 1(흰색)</b> 두 가지 값만으로 각 픽셀을 표현합니다."},

  {tag:"② 흑백 이미지", q:"다양한 명도를 가진 흑백(그레이스케일) 이미지는 각 픽셀을 어떤 범위의 정수로 표현하나요?",
   opts:["0~1", "0~9", "0~255", "0~360"], answer:2,
   exp:"그레이스케일 이미지는 밝기를 <b>0(검정)부터 255(흰색)</b>까지의 정수로 세밀하게 표현합니다."},

  {tag:"② 흑백 이미지", q:"그레이스케일 이미지에서 픽셀 값이 0에서 255로 커질수록 색상은 어떻게 변하나요?",
   opts:["점점 어두워진다","점점 밝아진다","빨간색에 가까워진다","변화가 없다"], answer:1,
   exp:"값이 0(검정)에서 255(흰색)로 커질수록 픽셀은 <b>점점 밝아집니다.</b>"},

  {tag:"③ 컬러 이미지(RGB)", q:"컬러 이미지의 R, G, B 색상 정보는 몇 개의 행렬로 나누어 표현하나요?",
   opts:["1개","2개","3개","4개"], answer:2,
   exp:"R, G, B 각 색상마다 0~255 값을 가지는 행렬을 따로 만들어, 총 <b>3개의 행렬</b>로 컬러 이미지를 표현합니다."},

  {tag:"③ 컬러 이미지(RGB)", q:"R, G, B 각 행렬의 원소가 가질 수 있는 값의 범위는?",
   opts:["0~1", "0~255", "0~100", "−255~255"], answer:1,
   exp:"R, G, B 각각의 값은 <b>0부터 255</b> 사이의 정수로 표현됩니다."},

  {tag:"③ 컬러 이미지(RGB)", q:"R=255, G=255, B=255 일 때 나타나는 색은?",
   opts:["검정색","흰색","빨간색","회색"], answer:1,
   exp:"R, G, B 값이 모두 최댓값(255)이면 <b>흰색</b>이 됩니다."},

  {tag:"③ 컬러 이미지(RGB)", q:"R=0, G=0, B=0 일 때 나타나는 색은?",
   opts:["흰색","회색","검정색","노란색"], answer:2,
   exp:"R, G, B 값이 모두 0이면 빛이 전혀 없는 <b>검정색</b>이 됩니다."},

  {tag:"④ 전치행렬", q:"전치행렬이란 원래 행렬의 무엇을 서로 바꾼 행렬인가요?",
   opts:["행과 열","크기와 색상","픽셀과 벡터","가로와 대각선"], answer:0,
   exp:"전치행렬은 원래 행렬의 <b>행과 열을 서로 바꾸어</b> 만든 행렬입니다."},

  {tag:"④ 전치행렬", q:"이미지 행렬에 전치행렬을 적용하면 어떤 효과가 나타나나요?",
   opts:["색상이 반전된다","이미지가 밝아진다","이미지의 구도(가로·세로 배치)가 바뀐다","이미지 크기가 두 배가 된다"], answer:2,
   exp:"행과 열이 바뀌면서 이미지가 대각선을 기준으로 뒤집히는 등 <b>구도가 변경</b>됩니다."},

  {tag:"④ 전치행렬", q:"4행 6열(4×6) 크기의 이미지 행렬을 전치하면 크기는?",
   opts:["4×6", "6×4", "10×10", "24×24"], answer:1,
   exp:"m×n 행렬을 전치하면 n×m 행렬이 되므로, 4×6 행렬은 <b>6×4</b> 행렬이 됩니다."},

  {tag:"⑤ 행렬의 덧셈·뺄셈", q:"두 이미지의 행렬을 더하면 얻을 수 있는 것은?",
   opts:["두 이미지의 차이","두 이미지를 합성한 이미지","이미지의 크기 변경","이미지의 밝기 반전"], answer:1,
   exp:"같은 위치의 픽셀 값을 더하면 두 이미지를 <b>합성한 새로운 이미지</b>를 얻을 수 있습니다."},

  {tag:"⑤ 행렬의 덧셈·뺄셈", q:"두 이미지의 행렬을 빼면 알 수 있는 것은?",
   opts:["두 이미지의 평균 밝기","두 이미지 사이의 차이(달라진 부분)","이미지의 해상도","이미지의 색상 개수"], answer:1,
   exp:"같은 위치의 픽셀 값을 빼면 두 이미지에서 <b>달라진 부분(차이)</b>을 확인할 수 있습니다."},

  {tag:"⑤ 행렬의 덧셈·뺄셈", q:"두 이미지 행렬을 더하거나 빼려면 반드시 만족해야 하는 조건은?",
   opts:["두 행렬의 모든 원소가 0이어야 한다","두 행렬의 행과 열의 개수가 같아야 한다","두 이미지의 색이 같아야 한다","두 행렬이 정사각형이어야 한다"], answer:1,
   exp:"행렬의 덧셈과 뺄셈은 두 행렬의 <b>크기(행과 열의 개수)가 서로 같아야</b> 계산할 수 있습니다."},

  {tag:"⑥ 행렬의 실수배", q:"이미지 행렬에 1보다 작은 양수를 곱하면 이미지는 어떻게 변하나요?",
   opts:["밝아진다","어두워진다","색이 반전된다","크기가 커진다"], answer:1,
   exp:"1보다 작은 양수를 곱하면 픽셀 값이 작아져서 이미지가 <b>어두워집니다.</b>"},

  {tag:"⑥ 행렬의 실수배", q:"이미지 행렬에 1보다 큰 수를 곱하면 이미지는 어떻게 변하나요?",
   opts:["밝아진다","어두워진다","회전한다","좌우로 뒤집힌다"], answer:0,
   exp:"1보다 큰 수를 곱하면 픽셀 값이 커져서 이미지가 <b>밝아집니다.</b>"},

  {tag:"⑥ 행렬의 실수배", q:"이미지 행렬에 정확히 1을 곱하면 이미지는 어떻게 되나요?",
   opts:["완전히 검게 변한다","완전히 하얗게 변한다","원래 이미지와 같다","색상이 반전된다"], answer:2,
   exp:"1을 곱하는 것은 원래 값을 그대로 유지하는 것이므로 <b>이미지에 변화가 없습니다.</b>"}
];

let current = 0;
let selected = new Array(QUESTIONS.length).fill(null);

const pxGrid = document.getElementById('pxGrid');
const qNum = document.getElementById('qNum');
const qTag = document.getElementById('qTag');
const qText = document.getElementById('qText');
const optionsBox = document.getElementById('optionsBox');
const explainBox = document.getElementById('explainBox');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const liveScore = document.getElementById('liveScore');
const progressFill = document.getElementById('progressFill');
const quizStage = document.getElementById('quizStage');
const resultStage = document.getElementById('resultStage');

for(let i=0;i<QUESTIONS.length;i++){
  const c = document.createElement('div');
  c.className = 'pxcell';
  c.id = 'px-'+i;
  pxGrid.appendChild(c);
}

function updatePixelGrid(){
  for(let i=0;i<QUESTIONS.length;i++){
    const cell = document.getElementById('px-'+i);
    cell.classList.remove('correct','wrong','current');
    if(selected[i] !== null){
      cell.classList.add(selected[i] === QUESTIONS[i].answer ? 'correct' : 'wrong');
    }
    if(i === current) cell.classList.add('current');
  }
}

function updateProgress(){
  const answered = selected.filter(s=>s!==null).length;
  progressFill.style.width = (answered/QUESTIONS.length*100)+'%';
  const correct = selected.reduce((acc,s,i)=> acc + (s===QUESTIONS[i].answer?1:0), 0);
  liveScore.textContent = `정답 ${correct} / 시도 ${answered}`;
}

function renderQuestion(){
  const item = QUESTIONS[current];
  qNum.textContent = 'Q' + (current+1);
  qTag.textContent = item.tag;
  qText.innerHTML = item.q;
  optionsBox.innerHTML = '';
  explainBox.classList.remove('show');
  explainBox.innerHTML = '';

  const letters = ['A','B','C','D'];
  item.opts.forEach((optText, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<span class="tag">${letters[idx]}</span><span>${optText}</span>`;
    if(selected[current] !== null){
      btn.disabled = true;
      if(idx === item.answer) btn.classList.add('correct');
      else if(idx === selected[current]) btn.classList.add('wrong');
    }
    btn.addEventListener('click', ()=>selectOption(idx));
    optionsBox.appendChild(btn);
  });

  if(selected[current] !== null){
    explainBox.innerHTML = `<b>${selected[current]===item.answer?'정답입니다.':'오답입니다.'}</b> ${item.exp}`;
    explainBox.classList.add('show');
  }

  prevBtn.disabled = current === 0;
  nextBtn.disabled = selected[current] === null;
  nextBtn.textContent = current === QUESTIONS.length-1 ? '결과 보기 →' : '다음 →';

  updatePixelGrid();
  updateProgress();
}

function selectOption(idx){
  if(selected[current] !== null) return;
  selected[current] = idx;
  renderQuestion();
}

prevBtn.addEventListener('click', ()=>{
  if(current>0){ current--; renderQuestion(); }
});

nextBtn.addEventListener('click', ()=>{
  if(current < QUESTIONS.length-1){
    current++; renderQuestion();
  } else {
    showResult();
  }
});

function showResult(){
  quizStage.style.display = 'none';
  resultStage.style.display = 'block';
  document.getElementById('resultCard').classList.add('show');

  const correct = selected.reduce((acc,s,i)=> acc + (s===QUESTIONS[i].answer?1:0), 0);
  document.getElementById('finalScore').textContent = `${correct} / ${QUESTIONS.length}`;

  let msg = '';
  const pct = correct/QUESTIONS.length;
  if(pct === 1) msg = '완벽해요! 이미지 데이터 표현·변환 개념을 확실히 이해했습니다.';
  else if(pct >= 0.8) msg = '아주 잘했어요! 몇 가지 개념만 다시 짚어보면 완벽합니다.';
  else if(pct >= 0.6) msg = '좋아요! 헷갈린 개념 위주로 복습해 보세요.';
  else msg = '괜찮아요, 해설을 보면서 개념을 다시 정리해 봅시다.';
  document.getElementById('finalMsg').textContent = msg;
}

document.getElementById('reviewBtn').addEventListener('click', ()=>{
  const list = document.getElementById('reviewList');
  if(list.childElementCount > 0){ list.innerHTML=''; return; }
  const letters = ['A','B','C','D'];
  QUESTIONS.forEach((item,i)=>{
    const ok = selected[i] === item.answer;
    const div = document.createElement('div');
    div.className = 'reviewitem ' + (ok?'ok':'bad');
    div.innerHTML = `<span class="dot"></span><span class="rtext"><b>Q${i+1}. ${item.q}</b><br>
      내 답: ${selected[i]!==null? letters[selected[i]]+'. '+item.opts[selected[i]] : '(응답 없음)'} ·
      정답: ${letters[item.answer]}. ${item.opts[item.answer]}<br>${item.exp}</span>`;
    list.appendChild(div);
  });
});

document.getElementById('retryBtn').addEventListener('click', ()=>{
  current = 0;
  selected = new Array(QUESTIONS.length).fill(null);
  document.getElementById('reviewList').innerHTML = '';
  quizStage.style.display = 'block';
  resultStage.style.display = 'none';
  renderQuestion();
});

renderQuestion();
</script>
</body>
</html>
