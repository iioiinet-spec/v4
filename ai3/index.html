<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>인공지능수학 3장 - 학생 제작 문제 모음</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 800px;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 0.5rem;
    }

    header p {
      font-size: 1rem;
      color: var(--text-muted);
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: var(--shadow);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
    }

    .student-info {
      margin-bottom: 1.25rem;
    }

    .student-name {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .btn-link {
      display: inline-block;
      width: 100%;
      text-align: center;
      background-color: var(--primary-color);
      color: #ffffff;
      text-decoration: none;
      font-weight: 500;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      transition: background-color 0.2s ease;
    }

    .btn-link:hover {
      background-color: var(--primary-hover);
    }

    footer {
      margin-top: 3rem;
      text-align: center;
      font-size: 0.875rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>인공지능수학 3장</h1>
      <p>학생들이 직접 출제하고 제작한 문제 웹페이지 모음입니다.</p>
    </header>

    <main class="card-grid">
      <div class="card">
        <div class="student-info">
          <div class="student-name">임*민 학생</div>
        </div>
        <a href="http://iioiinet-spec.github.io/v4/ai3/gm" target="_blank" rel="noopener noreferrer" class="btn-link">
          문제 보러가기
        </a>
      </div>

      <div class="card">
        <div class="student-info">
          <div class="student-name">이*주 학생</div>
        </div>
        <a href="http://iioiinet-spec.github.io/v4/ai3/space" target="_blank" rel="noopener noreferrer" class="btn-link">
          문제 보러가기
        </a>
      </div>

      <div class="card">
        <div class="student-info">
          <div class="student-name">김*현 학생</div>
        </div>
        <a href="http://iioiinet-spec.github.io/v4/ai3/nh" target="_blank" rel="noopener noreferrer" class="btn-link">
          문제 보러가기
        </a>
      </div>
    </main>

    <footer>
      <p>&copy; 2026 Artificial Intelligence Mathematics. All rights reserved.</p>
    </footer>
  </div>

</body>
</html>
