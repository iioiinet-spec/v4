<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>하늘의 특공대 : 탕탕특공대 × 1943</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b1f3a;--panel:rgba(9,27,52,.84);--panel2:rgba(20,52,92,.9);--line:rgba(150,205,255,.38);--gold:#ffd24a;--gold-d:#e09a16;--mint:#62f0c4;--mint-d:#17a584;--sky:#6cc7ff;--pink:#ff6b9a;--red:#ff5468;--text:#eaf6ff;--mute:#9bb8d6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#12406e 0%,#07182e 70%);font-family:'Jua','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;color:var(--text);touch-action:none}
#stage{position:fixed;left:50%;top:50%;width:540px;height:960px;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;overflow:hidden;border-radius:18px;box-shadow:0 0 0 2px rgba(150,205,255,.25),0 20px 80px rgba(0,0,0,.55)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:absolute;inset:0;pointer-events:none}
#ui>*{pointer-events:auto}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:26px 22px;gap:14px;animation:fade .25s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.dim{background:radial-gradient(90% 70% at 50% 40%,rgba(5,16,34,.55),rgba(5,16,34,.88))}
h2{margin:0;font-size:34px;font-weight:400;color:var(--gold);text-shadow:0 3px 0 var(--gold-d),0 0 24px rgba(255,210,74,.45);letter-spacing:1px}
.sub{margin:0;color:var(--mute);font-size:16px;text-align:center;word-break:keep-all;line-height:1.35}
.logo{margin:66px 0 0;text-align:center;font-weight:400;line-height:.95}
.logo small{display:block;font-size:22px;color:#cfeaff;letter-spacing:3px;text-shadow:0 2px 0 #1a4f86;margin-bottom:6px}
.logo b{display:block;font-weight:400;font-size:84px;color:#fff;letter-spacing:2px;-webkit-text-stroke:3px #12335c;paint-order:stroke fill;text-shadow:0 6px 0 #1a5fa8,0 12px 26px rgba(0,0,0,.45),0 0 36px rgba(108,199,255,.55);transform:rotate(-3deg)}
.logo i{display:inline-block;font-style:normal;color:var(--gold)}
.btn{font:inherit;font-size:22px;color:#102a4a;background:linear-gradient(180deg,#ffe58a,var(--gold));border:3px solid #12335c;border-radius:18px;padding:12px 26px;cursor:pointer;box-shadow:0 5px 0 var(--gold-d),0 10px 20px rgba(0,0,0,.35);transition:transform .1s,filter .15s;min-width:150px}
.btn:hover{filter:brightness(1.06);transform:translateY(-2px)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--gold-d)}
.btn.big{font-size:34px;padding:16px 46px;border-radius:24px;background:linear-gradient(180deg,#8ff7d6,var(--mint));box-shadow:0 7px 0 var(--mint-d),0 14px 26px rgba(0,0,0,.4);animation:pulse 1.6s ease-in-out infinite}
.btn.alt{background:linear-gradient(180deg,#a6dcff,var(--sky));box-shadow:0 5px 0 #2a86c6,0 10px 20px rgba(0,0,0,.35)}
.btn.ghost{background:rgba(255,255,255,.1);color:var(--text);border-color:var(--line);box-shadow:none}
.btn.sm{font-size:16px;padding:8px 16px;min-width:0;border-radius:14px}
.btn[disabled]{filter:grayscale(.8) brightness(.7);cursor:not-allowed;animation:none}
@keyframes pulse{50%{transform:scale(1.05)}}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.col{display:flex;flex-direction:column;gap:12px;align-items:center;width:100%}
.foot{margin-top:auto;color:#cfe6ff;font-size:14px;text-align:center;line-height:1.5;opacity:.9;text-shadow:0 1px 3px #000}
.foot kbd{background:rgba(255,255,255,.16);border:1px solid var(--line);border-radius:6px;padding:1px 7px;font:inherit;font-size:13px}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center}
.coin{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:6px 14px 6px 8px;font-size:20px;color:var(--gold)}
.coin::before{content:'★';display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,var(--gold));color:#a46a00;font-size:16px;border:2px solid #b87a10}
.tabs{display:flex;gap:8px}
.tab{font:inherit;font-size:18px;color:var(--mute);background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:8px 22px;cursor:pointer}
.tab.on{color:#102a4a;background:linear-gradient(180deg,#a6dcff,var(--sky));border-color:#12335c}
.card{width:100%;background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:12px;display:flex;gap:12px;align-items:center;text-align:left}
.card.sel{border-color:var(--mint);box-shadow:0 0 0 3px var(--mint),0 0 26px rgba(98,240,196,.35)}
.card canvas{width:92px;height:92px;flex:none;border-radius:16px;background:radial-gradient(circle at 50% 40%,#2a6fb0,#123a66)}
.card .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.card h3{margin:0;font-size:21px;font-weight:400;display:flex;gap:8px;align-items:baseline}
.card h3 small{color:var(--mute);font-size:14px}
.card p{margin:0;font-size:14px;color:var(--mute);word-break:keep-all;line-height:1.3}
.bar{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.bar span{width:34px}
.bar i{flex:1;height:8px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i b{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--mint),var(--sky))}
.pips{display:inline-flex;gap:4px}
.pips i{width:12px;height:12px;border-radius:4px;background:rgba(255,255,255,.16);border:1px solid var(--line)}
.pips i.on{background:linear-gradient(180deg,#fff0a6,var(--gold));border-color:#b87a10}
.list{width:100%;display:flex;flex-direction:column;gap:10px;overflow:auto;padding:2px 2px 8px;max-height:640px}
.opts{display:flex;flex-direction:column;gap:12px;width:100%;margin-top:6px}
.opt{font:inherit;color:var(--text);text-align:left;background:linear-gradient(180deg,rgba(32,76,128,.95),rgba(14,40,78,.95));border:3px solid var(--line);border-radius:22px;padding:14px 16px;display:flex;gap:14px;align-items:center;cursor:pointer;transition:transform .12s,border-color .12s,box-shadow .12s;animation:pop .35s cubic-bezier(.2,1.4,.4,1) both}
.opt:nth-child(2){animation-delay:.07s}.opt:nth-child(3){animation-delay:.14s}
@keyframes pop{from{opacity:0;transform:scale(.8) translateY(20px)}to{opacity:1;transform:none}}
.opt:hover{transform:translateY(-4px) scale(1.02);border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,210,74,.5),0 14px 30px rgba(0,0,0,.4)}
.opt .ic{width:64px;height:64px;flex:none;border-radius:18px;display:grid;place-items:center;font-size:36px;background:radial-gradient(circle at 35% 30%,#4aa0e8,#1b4d8a);border:2px solid var(--line)}
.opt.new .ic{background:radial-gradient(circle at 35% 30%,#ffe58a,#e09a16)}
.opt b{display:block;font-size:22px;font-weight:400;color:#fff}
.opt em{font-style:normal;font-size:13px;color:#102a4a;background:var(--gold);border-radius:8px;padding:1px 8px;margin-left:8px}
.opt.new em{background:var(--mint)}
.opt p{margin:3px 0 0;font-size:15px;color:var(--mute);word-break:keep-all}
.stats{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-size:17px}
.stat b{font-weight:400;color:var(--gold);font-size:22px}
.new-tag{color:#102a4a;background:var(--pink);border-radius:8px;padding:1px 8px;font-size:13px;margin-left:6px;vertical-align:middle}
.toast{position:absolute;left:50%;bottom:210px;transform:translateX(-50%);background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:8px 20px;font-size:17px;white-space:nowrap;pointer-events:none;animation:toast 3.2s ease-out forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.mute{position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--panel);color:var(--text);font-size:19px;cursor:pointer;display:grid;place-items:center}
/* P 관리자 모드와 스테이지 선택 */
.stageGrid{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:9px;max-height:176px}
.stageCard{font:inherit;text-align:left;padding:11px 13px;border-radius:14px;border:2px solid rgba(180,215,250,.32);color:#f5faff;background:linear-gradient(125deg,var(--stageColor,#235e95),#0c2444 85%);cursor:pointer;min-height:73px;box-shadow:inset 0 1px rgba(255,255,255,.14)}
.stageCard b{display:block;font-size:16px;font-weight:400}.stageCard small{font-size:12px;color:#d4eaff}
.stageCard.on{border-color:#ffdc69;box-shadow:0 0 0 2px rgba(255,220,105,.32)}
.stageCard[disabled]{opacity:.45;filter:grayscale(.8);cursor:not-allowed}
.adminScreen{padding:17px 17px 18px;gap:8px;justify-content:flex-start}
.adminScreen h2{font-size:29px}
.adminScroll{width:100%;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;touch-action:pan-y;padding:1px 4px 16px}
.adminGroup{background:rgba(8,30,60,.91);border:2px solid rgba(165,210,255,.35);border-radius:17px;padding:10px 12px;margin:9px 0;display:flex;flex-direction:column;gap:8px}
.adminGroup h3{margin:0 0 3px;font-size:19px;color:#ffe488;font-weight:400}
.adminLine{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:16px;color:#eaf6ff}
.adminLine b{color:#a8e7ff;font-weight:400;font-size:14px}
.adminControls{display:flex;align-items:center;gap:6px}
.adminControl{font:inherit;font-size:15px;border:1px solid rgba(175,230,255,.5);background:#245682;color:#fff;border-radius:9px;padding:7px 10px;cursor:pointer}
.adminControl:active{background:#3d89ce}
.adminControl.warn{background:#8b3340}.adminControl.gold{color:#172b46;background:#ffe38a;border-color:#ffffff}
.adminControl[disabled]{opacity:.4;cursor:not-allowed}
.adminHelp{font-size:12px;color:#bbd5ef;line-height:1.5;margin:0}
.stageClearTitle{font-size:38px;text-align:center;color:#ffe58a}

@media (prefers-reduced-motion:reduce){.btn.big{animation:none}.scr,.opt{animation:none}}
</style>

<body>
<div id="stage"><canvas id="cv"></canvas><div id="ui"></div></div>
<script>
'use strict';
/* ================= 유틸 ================= */
const W=540,H=960,TAU=Math.PI*2;
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a),rint=(a,b)=>Math.floor(rnd(a,b+1)),clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,pick=a=>a[Math.floor(Math.random()*a.length)];
const fmt=n=>Math.round(n).toLocaleString('ko-KR');
const fmtT=s=>{s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function mix(a,b,k){const p=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16)),A=p(a),B=p(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*k).toString(16).padStart(2,'0')).join('')}
const FONT="'Jua','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif";
const cv=$('#cv'),ctx=cv.getContext('2d'),ui=$('#ui');
let RES=1;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);document.documentElement.style.setProperty('--s',s);RES=clamp(s*(window.devicePixelRatio||1),1,2.5);cv.width=Math.round(W*RES);cv.height=Math.round(H*RES)}
addEventListener('resize',fit);fit();

/* ================= 저장 ================= */
const SKEY='hanul_1943_v1';
const defSave=()=>({coins:0,own:{p38:1},sel:'p38',up:{atk:0,hp:0,spd:0,mag:0,xp:0},best:{time:0,kills:0,score:0},clears:0,mute:0,runs:0,unlocked:1,startStage:1});
let SAVE=(()=>{try{const d=JSON.parse(localStorage.getItem(SKEY));if(d){const b=defSave();return Object.assign(b,d,{own:Object.assign({p38:1},d.own),up:Object.assign(b.up,d.up),best:Object.assign(b.best,d.best)})}}catch(e){}return defSave()})();
const saveNow=()=>{try{localStorage.setItem(SKEY,JSON.stringify(SAVE))}catch(e){}};

/* ================= 사운드 (WebAudio, 가볍게) ================= */
let AC=null,MASTER=null,NB=null;const sfxT={};
function audioInit(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();MASTER=AC.createGain();MASTER.gain.value=.32;MASTER.connect(AC.destination);NB=AC.createBuffer(1,AC.sampleRate*1,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(e){AC=null}}
function tone(f,d,type,v,slide){if(!AC||SAVE.mute)return;try{const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(v||.1,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(MASTER);o.start(t);o.stop(t+d)}catch(e){}}
function noise(d,v,lp){if(!AC||SAVE.mute)return;try{const t=AC.currentTime,s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();s.buffer=NB;f.type='lowpass';f.frequency.setValueAtTime(lp||1200,t);f.frequency.exponentialRampToValueAtTime(120,t+d);g.gain.setValueAtTime(v||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(MASTER);s.start(t);s.stop(t+d)}catch(e){}}
const gate=(k,ms)=>{const n=performance.now();if(n-(sfxT[k]||0)<ms)return false;sfxT[k]=n;return true};
const SFX={
  shot(){if(gate('shot',70))tone(760+Math.random()*120,.05,'square',.035,-380)},
  hit(){if(gate('hit',50))tone(220,.05,'square',.05,-90)},
  boom(){if(gate('boom',60))noise(.32,.2,1100)},
  big(){noise(.8,.4,700);tone(90,.6,'sawtooth',.2,-50)},
  gem(){if(gate('gem',45))tone(1100+Math.random()*300,.07,'sine',.06,500)},
  lvl(){tone(523,.12,'triangle',.18);setTimeout(()=>tone(659,.12,'triangle',.18),90);setTimeout(()=>tone(784,.2,'triangle',.2),180)},
  pow(){tone(660,.1,'square',.1,400);setTimeout(()=>tone(990,.16,'square',.1,300),90)},
  roll(){tone(300,.25,'sawtooth',.06,500)},
  hurt(){noise(.22,.3,500);tone(160,.2,'sawtooth',.12,-80)},
  bomb(){noise(1,.45,900);tone(70,.8,'sawtooth',.25,-30)},
  warn(){tone(520,.18,'square',.1);setTimeout(()=>tone(520,.18,'square',.1),260);setTimeout(()=>tone(520,.18,'square',.1),520)},
  win(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.25,'triangle',.2),i*140))},
  lose(){tone(300,.9,'sawtooth',.15,-250)}
};

/* ================= 스프라이트 도우미 ================= */
const OUT='#14233c';
function sprite(w,h,fn,sc){sc=sc||2;const c=document.createElement('canvas');c.width=Math.round(w*sc);c.height=Math.round(h*sc);const x=c.getContext('2d');x.scale(sc,sc);x.translate(w/2,h/2);fn(x);c.w=w;c.h=h;return c}
function whiteOf(s){const c=document.createElement('canvas');c.width=s.width;c.height=s.height;const x=c.getContext('2d');x.drawImage(s,0,0);x.globalCompositeOperation='source-in';x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);c.w=s.w;c.h=s.h;return c}
function drawSpr(c,s,x,y,rot,sx,sy,al){c.save();c.translate(x,y);if(rot)c.rotate(rot);if(sx!==undefined&&(sx!==1||sy!==1))c.scale(sx,sy);if(al!==undefined&&al<1)c.globalAlpha=al;c.drawImage(s,-s.w/2,-s.h/2,s.w,s.h);c.restore()}
function rr(x,a,b,w,h,r){r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
function fo(x,fill,w){x.fillStyle=fill;x.fill();x.lineWidth=w||3;x.strokeStyle=OUT;x.lineJoin='round';x.stroke()}
const lgv=(x,y0,y1,a,b)=>{const g=x.createLinearGradient(0,y0,0,y1);g.addColorStop(0,a);g.addColorStop(1,b);return g};
const lgh=(x,x0,x1,a,b)=>{const g=x.createLinearGradient(x0,0,x1,0);g.addColorStop(0,a);g.addColorStop(.5,b);g.addColorStop(1,mix(b,'#000000',.18));return g};
function ell(x,cx,cy,rx,ry,rot){x.beginPath();x.ellipse(cx,cy,rx,ry,rot||0,0,TAU)}
function pilot(x,cx,cy,k,s){s=s||1;ell(x,cx,cy,5.6*s,5.8*s);fo(x,'#ffd9b3',1.6);x.beginPath();x.arc(cx,cy-1.2*s,5.9*s,Math.PI,TAU);fo(x,k,1.6);x.fillStyle='#fff';x.beginPath();x.arc(cx-2.5*s,cy-.4*s,2.3*s,0,TAU);x.arc(cx+2.5*s,cy-.4*s,2.3*s,0,TAU);x.fill();x.fillStyle='#1b2b4a';x.beginPath();x.arc(cx-2.5*s,cy-.2*s,1.1*s,0,TAU);x.arc(cx+2.5*s,cy-.2*s,1.1*s,0,TAU);x.fill()}

/* ================= 기체(플레이어) ================= */
const PLANES={
  p38:{name:'P-38 라이트닝',nick:'쌍둥이 번개',hp:110,spd:300,start:'gun',cost:0,desc:'균형 잡힌 쌍발 전투기. 쌍발 기관포로 시작해요.',k:{body:'#e8eff7',body2:'#9fb4cc',acc:'#2f7de1',nose:'#ffd24a'},stat:[.6,.55,.6]},
  p51:{name:'P-51 머스탱',nick:'붉은 질주',hp:85,spd:350,start:'spread',cost:300,desc:'가장 빠른 날쌘돌이. 부채꼴포로 시작해요.',k:{body:'#f1f4f8',body2:'#aab6c6',acc:'#e5484d',nose:'#ff7a45'},stat:[.45,.8,.8]},
  f4u:{name:'F4U 콜세어',nick:'철갑 갈매기',hp:150,spd:262,start:'missile',cost:800,desc:'튼튼한 중장갑 기체. 유도 미사일로 시작해요.',k:{body:'#7f9cc9',body2:'#4a6594',acc:'#ffd24a',nose:'#2a3f6b'},stat:[.9,.4,.5]}
};
function drawP38(x,k){
  rr(x,-38,26,76,11,5);fo(x,lgv(x,26,37,'#ffffff',k.body2));
  for(const s of[-1,1]){x.save();x.translate(s*28,0);
    rr(x,-9,-36,18,80,9);fo(x,lgh(x,-9,9,'#ffffff',k.body));
    rr(x,-12,30,24,10,4);fo(x,k.acc,2.5);
    ell(x,0,-36,8.5,7);fo(x,k.nose,2.5);x.restore()}
  rr(x,-60,-9,120,24,12);fo(x,lgv(x,-9,15,'#ffffff',k.body2));
  x.fillStyle=k.acc;rr(x,-54,2,38,5,2.5);x.fill();rr(x,16,2,38,5,2.5);x.fill();
  for(const s of[-1,1]){x.beginPath();x.arc(s*44,-1,5,0,TAU);fo(x,'#ffd24a',2)}
  ell(x,0,-6,14,33);fo(x,lgh(x,-14,14,'#ffffff',k.body));
  ell(x,0,-14,8.6,16);fo(x,lgv(x,-30,2,'#eafcff','#4fb0e8'),2.5);
  pilot(x,0,-12,k.acc,1);
}
function drawP51(x,k){
  x.beginPath();x.moveTo(-28,38);x.lineTo(0,30);x.lineTo(28,38);x.lineTo(24,47);x.lineTo(-24,47);x.closePath();fo(x,lgv(x,30,47,'#ffffff',k.body2),2.5);

  for(let i=0;i<7;i++)BGS.cld.push({x:rnd(-60,W+60),y:rnd(-100,H+100),v:rint(0,2),s:rnd(.8,1.5),sp:rnd(1.5,2.4)})}
function bgUpdate(dt,speed){
  BGS.scroll+=speed*dt;BGS.nextIsl-=speed*dt;
  for(const i of BGS.isl)i.y+=speed*dt;BGS.isl=BGS.isl.filter(i=>i.y<H+180);
  if(BGS.nextIsl<=0){BGS.nextIsl=rnd(380,720);BGS.isl.push({x:rnd(30,W-30),y:-170,v:rint(0,3),s:rnd(.8,1.2),p:rnd(0,6)})}
  for(const c of BGS.cld){c.y+=speed*c.sp*dt;if(c.y>H+120){c.y=-120;c.x=rnd(-60,W+60);c.v=rint(0,2);c.s=rnd(.8,1.5);c.sp=rnd(1.5,2.4)}}
}
function drawSea(c,t){
  const st=G?.stage||SAVE.startStage||1, tiles=STAGE_SEA[st]||[SEA,SEA2];
  const y1=BGS.scroll%H;c.drawImage(tiles[0],0,y1-H,W,H);c.drawImage(tiles[0],0,y1,W,H);
  const y2=(BGS.scroll*1.3+260)%H;c.save();c.globalAlpha=.4;c.translate(W,0);c.scale(-1,1);c.drawImage(tiles[1],0,y2-H,W,H);c.drawImage(tiles[1],0,y2,W,H);c.restore();
  for(const i of BGS.isl){const s=ISL[i.v],k=1+Math.sin(t*1.3+i.p)*.012;c.save();
    if(st===2)c.filter='brightness(.68) saturate(.72)';
    if(st===3)c.filter='sepia(.32) hue-rotate(315deg) saturate(1.2)';
    if(st===4)c.filter='hue-rotate(158deg) saturate(.56) brightness(1.3)';
    drawSpr(c,s,i.x,i.y,0,i.s*k,i.s*k);c.restore();}
  if(st===2){c.fillStyle='rgba(3,10,27,.28)';c.fillRect(0,0,W,H);
    c.strokeStyle='rgba(188,221,253,.3)';c.lineWidth=1.5;c.beginPath();
    for(let j=0;j<145;j++){const x=((j*139.7+t*95)%620)-40,y=((j*71.9+t*445)%1100)-60;c.moveTo(x,y);c.lineTo(x-9,y+32)}c.stroke();
    if(Math.sin(t*.49)+Math.sin(t*.87+2.6)>1.87){c.fillStyle='rgba(204,232,255,.19)';c.fillRect(0,0,W,H);}}
  else if(st===3){const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(196,67,37,.13)');g.addColorStop(1,'rgba(92,9,28,.24)');c.fillStyle=g;c.fillRect(0,0,W,H);
    for(let j=0;j<30;j++){const x=(j*119.7+Math.sin(t+j)*16)%W,y=((j*91.2+t*(20+j%3*5))%H);c.fillStyle='rgba(255,172,91,.38)';c.beginPath();c.arc(x,y,1.2+j%3*.7,0,TAU);c.fill()}}
  else if(st===4){c.fillStyle='rgba(210,246,255,.07)';c.fillRect(0,0,W,H);
    for(let j=0;j<36;j++){const x=((j*133.3+18)%W),y=((j*185.5+t*80)%1100)-70;c.save();c.translate(x,y);c.rotate(Math.sin(j)*.15);c.fillStyle='rgba(231,250,255,.45)';c.beginPath();c.ellipse(0,0,10+j%4*6,5+j%3*2,0,0,TAU);c.fill();c.restore()}
    c.fillStyle='rgba(244,252,255,.78)';for(let j=0;j<80;j++){const x=(j*181.3+t*29*(1+j%4*.1))%W,y=(j*79.7+t*(60+j%3*19))%H;c.fillRect(x,y,1.5,2.4)}}
  for(const q of BGS.cld){const s=CLDS[q.v];c.save();c.translate(q.x+50,q.y+86);c.scale(q.s,q.s*.8);c.globalAlpha=st===2?.4:st===3?.24:.16;c.drawImage(s,-s.w/2,-s.h/2);c.restore()}
}
function drawClouds(c){for(const q of BGS.cld){const s=CLD[q.v];c.save();c.globalAlpha=.55;c.translate(q.x,q.y);c.scale(q.s,q.s);c.drawImage(s,-s.w/2,-s.h/2);c.restore()}}

function drawTint(c,t){let a=TINT[0],b=TINT[TINT.length-1];for(let i=0;i<TINT.length-1;i++)if(t>=TINT[i][0]&&t<TINT[i+1][0]){a=TINT[i];b=TINT[i+1];break}
  const k=clamp((t-a[0])/Math.max(1,b[0]-a[0]),0,1),v=a[1].map((q,i)=>lerp(q,b[1][i],k));if(v[3]<.01)return;c.fillStyle='rgba('+Math.round(v[0])+','+Math.round(v[1])+','+Math.round(v[2])+','+v[3].toFixed(3)+')';c.fillRect(0,0,W,H)}

function msg(s,col){G.msg.push({s,col:col||'#fff',life:2.2,max:2.2});if(G.msg.length>3)G.msg.shift()}
function boom(x,y,s,quiet){
  s=s||1;const n=Math.floor(9*s);
  for(let i=0;i<n;i++){const a=rnd(0,TAU),sp=rnd(40,210)*s;part({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rnd(.3,.6),size:rnd(9,18)*s,type:'fire'})}
  for(let i=0;i<Math.ceil(3*s);i++)part({x:x+rnd(-8,8),y:y+rnd(-8,8),vx:rnd(-30,30),vy:rnd(-30,30),life:rnd(.7,1.2),size:rnd(14,26)*s,type:'smoke'});
  for(let i=0;i<Math.floor(7*s);i++){const a=rnd(0,TAU),sp=rnd(120,300);part({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rnd(.25,.5),size:2,type:'spark'})}
  for(let i=0;i<Math.floor(3*s);i++){const a=rnd(0,TAU),sp=rnd(60,160);part({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rnd(.5,.9),size:rnd(3,6),type:'debris',rot:rnd(0,TAU),vr:rnd(-9,9),g:260})}
  part({x,y,life:.32,size:46*s,type:'ring'});
  G.shake=Math.max(G.shake,3.5*s);if(!quiet)(s>1.8?SFX.big:SFX.boom)();
}

  if(e.dead)return;const c=crit(d);d=c[0];e.hp-=d;e.fl=.09;
  if(show||c[1])txt(e.x,e.y-e.r,Math.round(d),c[1]?'#ffd24a':(col||'#fff'),c[1]?24:18);

  if(b.dying)return;if(b.intro>0){spark(b.x,b.y,2,'#9ad');return}
  const c=crit(d);d=c[0];b.hp-=d;b.fl=.07;G.score+=1;
  if(show||c[1])txt(b.x+rnd(-b.rx*.5,b.rx*.5),b.y+rnd(-30,30),Math.round(d),c[1]?'#ffd24a':(col||'#fff'),c[1]?26:20);

function hurt(d){

  d=Math.max(1,Math.round(d*(1-G.stat.arm)));p.hp-=d;p.inv=.9;G.shake=11;G.redF=.45;SFX.hurt();

const DROP={scout:[0],zero:[0,0],diver:[1],bomber:[2,1,1],ace:[2,2,1],pow:[2],boat:[1,0]};
function dropItem(k,x,y){G.it.push({x,y,k,t:0,vy:50})}
function killE(e){
  if(e.dead)return;e.dead=true;G.kills++;G.score+=ET[e.type].sc;G.combo++;
  boom(e.x,e.y,e.type==='bomber'?1.8:e.type==='ace'?1.4:e.type==='boat'?1.2:.75);
  const d=ET[e.type];if(Math.random()<d.gem){for(const t of DROP[e.type])gemOf(e.x,e.y,t)}
  if(e.type==='pow')dropItem('pow',e.x,e.y);
  else{const r=Math.random();if(r<.012)dropItem('magnet',e.x,e.y);else if(r<.03&&G.p.hp<G.p.max*.9)dropItem('wrench',e.x,e.y);else if((e.type==='ace'||e.type==='bomber')&&Math.random()<.3)dropItem('wrench',e.x,e.y)}
  G.gauge+=e.type==='scout'?1.1:e.type==='bomber'?8:e.type==='ace'?10:2.4;
  if(G.gauge>=100){G.gauge-=100;if(G.bombs<3){G.bombs++;msg('대폭격 +1 !','#ffd24a')}else G.gauge=99}
}
function bossDie(b){b.dying=2.4;b.hp=0;G.eb.length=0;G.zones.length=0;G.score+=BOSS[b.kind].sc;G.slow=.5;G.flash=.4;SFX.big()}
function bossFinish(b){
  boom(b.x,b.y,3.4);G.flash=.7;G.shake=26;G.boss=null;G.bossKills++;G.bdone[b.kind]=1;
  for(let i=0;i<26;i++)gemOf(b.x+rnd(-b.rx,b.rx),b.y+rnd(-b.ry*.5,b.ry*.5),pick([1,2,2,3]));
  dropItem('wrench',b.x-30,b.y);dropItem('bomb',b.x+30,b.y);dropItem('pow',b.x,b.y-40);G.magnetT=1.6;
  const intended=STAGES[G.stage-1].boss===b.kind;
  if(intended){

function updLoot(dt){
  const p=G.p,mg=G.stat.mag;if(G.magnetT>0)G.magnetT-=dt;
  for(let i=G.gem.length-1;i>=0;i--){const g=G.gem[i];g.t+=dt;
    const dx=p.x-g.x,dy=p.y-g.y,d=Math.hypot(dx,dy)||1;
    if(G.magnetT>0||g.mag||d<mg){g.mag=true;const sp=Math.min(900,260+g.t*500+(mg*3-d)*2);g.x+=dx/d*sp*dt;g.y+=dy/d*sp*dt}
    else{g.vx*=Math.pow(.2,dt);g.vy=lerp(g.vy,70,dt*2);g.x+=g.vx*dt;g.y+=g.vy*dt}
    if(d<22){addXp(g.v);G.score+=g.v;SFX.gem();G.gem.splice(i,1);continue}
    if(g.y>H+40)G.gem.splice(i,1)}
  if(G.gem.length>260){for(let i=0;i<40;i++){const g=G.gem.shift();addXp(g.v)}}
  for(let i=G.it.length-1;i>=0;i--){const it=G.it[i];it.t+=dt;it.y+=it.vy*dt;it.x+=Math.sin(it.t*3)*20*dt;
    const dx=p.x-it.x,dy=p.y-it.y,d=Math.hypot(dx,dy)||1;if(d<mg*.8){it.x+=dx/d*320*dt;it.y+=dy/d*320*dt}

}

function updPlayer(dt){
  const p=G.p,st=G.stat,k=IN.keys;let ax=0,ay=0;
  if(k.ArrowLeft||k.KeyA)ax--;if(k.ArrowRight||k.KeyD)ax++;if(k.ArrowUp||k.KeyW)ay--;if(k.ArrowDown||k.KeyS)ay++;
  if(G.end<=0){
    if(ax||ay){const l=Math.hypot(ax,ay);p.x+=ax/l*st.spd*(p.roll>0?1.3:1)*dt;p.y+=ay/l*st.spd*(p.roll>0?1.3:1)*dt}
    if(IN.dx||IN.dy){const l=Math.hypot(IN.dx,IN.dy),mx=st.spd*1.9*dt,s=l>mx?mx/l:1;p.x+=IN.dx*s;p.y+=IN.dy*s;IN.dx=IN.dy=0}
  }else IN.dx=IN.dy=0;
  p.x=clamp(p.x,22,W-22);p.y=clamp(p.y,110,H-100);
  p.tilt=lerp(p.tilt,clamp((p.x-p.lx)/(Math.max(dt,.001)*260),-1,1),Math.min(1,dt*10));p.lx=p.x;p.prop+=dt*60;
  if(p.inv>0)p.inv-=dt;if(p.roll>0)p.roll-=dt;if(p.rollCd>0)p.rollCd-=dt;
  if(Math.random()<dt*40)part({x:p.x+rnd(-10,10),y:p.y+34,vx:rnd(-10,10),vy:rnd(60,120),life:.35,size:rnd(3,6),type:'trail'});
}
function update(dtr){
  if(!G)return;let dt=dtr;if(G.slow>0){G.slow-=dtr;dt*=.35}
  if(G.hint>0)G.hint-=dtr;
  bgUpdate(dt,85+Math.min(G.t,300)*.12);
  if(G.end<=0){G.t+=dt;G.stageT+=dt;director(dt)}
  updPlayer(dt);
  if(G.end<=0||G.result==='win')updWeapons(dt);
  updEnemies(dt);updBoss(dt);updPB(dt);updEB(dt);updZones(dt);updLoot(dt);
  for(let i=G.pt.length-1;i>=0;i--){const q=G.pt[i];q.life-=dt;if(q.life<=0){G.pt.splice(i,1);continue}q.x+=q.vx*dt;q.y+=q.vy*dt;if(q.g)q.vy+=q.g*dt;q.rot+=q.vr*dt;if(q.type==='smoke'){q.vx*=.98;q.vy*=.98}}
  for(let i=G.tx.length-1;i>=0;i--){const q=G.tx[i];q.life-=dt;q.y-=46*dt;if(q.life<=0)G.tx.splice(i,1)}
  for(let i=G.fx.length-1;i>=0;i--){G.fx[i].life-=dt;if(G.fx[i].life<=0)G.fx.splice(i,1)}
  for(let i=G.msg.length-1;i>=0;i--){G.msg[i].life-=dtr;if(G.msg[i].life<=0)G.msg.splice(i,1)}
  if(G.shake>0)G.shake=Math.max(0,G.shake-dtr*30);if(G.flash>0)G.flash-=dtr*1.6;if(G.redF>0)G.redF-=dtr;
  if(G.end>0){G.end-=dtr;if(G.end<=0)finish()}
  else if(G.pend>0&&MODE==='play')openLevelUp();
}

    if(z.t<z.warn){const bl=.1+.14*(Math.sin(z.t*22)*.5+.5);c.fillStyle='rgba(255,60,80,'+bl+')';c.fillRect(z.x-z.w/2,0,z.w,H);c.strokeStyle='rgba(255,90,110,.8)';c.lineWidth=3;c.setLineDash([14,10]);c.beginPath();c.moveTo(z.x-z.w/2,0);c.lineTo(z.x-z.w/2,H);c.moveTo(z.x+z.w/2,0);c.lineTo(z.x+z.w/2,H);c.stroke();c.setLineDash([]);
      c.fillStyle='#fff';c.font='bold 28px '+FONT;c.textAlign='center';c.strokeStyle='#c4142e';c.lineWidth=4;c.strokeText('⚠',z.x,H-210);c.fillText('⚠',z.x,H-210)}
    else{const k=1-clamp((z.t-z.warn-z.act)/.15,0,1);c.save();c.globalAlpha=k;const g=c.createLinearGradient(z.x-z.w/2,0,z.x+z.w/2,0);g.addColorStop(0,'rgba(255,60,120,0)');g.addColorStop(.25,'rgba(255,140,200,.9)');g.addColorStop(.5,'#ffffff');g.addColorStop(.75,'rgba(255,140,200,.9)');g.addColorStop(1,'rgba(255,60,120,0)');c.fillStyle=g;c.fillRect(z.x-z.w/2-6,0,z.w+12,H);c.restore()}
  }
}
function drawParticles(c){
  for(const q of G.pt){const k=q.life/q.max;
    if(q.type==='fire'){const s=q.size*(.55+k*.6);c.globalAlpha=Math.min(.95,k*1.5);c.drawImage(GLOW.o,q.x-s,q.y-s,s*2,s*2);c.globalAlpha=Math.min(1,k*1.6);c.fillStyle=k>.55?'#fff3b0':'#ffb14a';c.beginPath();c.arc(q.x,q.y,s*.38,0,TAU);c.fill();c.globalAlpha=1}
    else if(q.type==='smoke'){c.globalAlpha=k*.5;c.fillStyle='#3b4558';c.beginPath();c.arc(q.x,q.y,q.size*(1.5-k*.6),0,TAU);c.fill();c.globalAlpha=1}
    else if(q.type==='spark'){c.globalAlpha=Math.min(1,k*2);c.strokeStyle=q.col||'#ffe9a0';c.lineWidth=2;c.beginPath();c.moveTo(q.x,q.y);c.lineTo(q.x-q.vx*.04,q.y-q.vy*.04);c.stroke();c.globalAlpha=1}
    else if(q.type==='ring'){c.globalAlpha=k;c.strokeStyle=q.col||'#fff4c8';c.lineWidth=2+6*k;c.beginPath();c.arc(q.x,q.y,q.size*(1-k)+4,0,TAU);c.stroke();c.globalAlpha=1}
    else if(q.type==='debris'){c.save();c.translate(q.x,q.y);c.rotate(q.rot);c.globalAlpha=Math.min(1,k*2);c.fillStyle='#2a3448';c.fillRect(-q.size/2,-q.size/3,q.size,q.size*.66);c.restore();c.globalAlpha=1}
    else if(q.type==='trail'){c.globalAlpha=k*.5;c.fillStyle='#e8f8ff';c.beginPath();c.arc(q.x,q.y,q.size*k+1,0,TAU);c.fill();c.globalAlpha=1}
  }
  for(const f of G.fx){if(f.t==='bolt'){const k=f.life/f.max;c.save();c.globalCompositeOperation='lighter';c.lineCap='round';c.lineJoin='round';
      for(const[w,col]of[[9,'rgba(110,200,255,.35)'],[3.4,'#ffffff']]){c.strokeStyle=col;c.lineWidth=w*k;c.beginPath();f.pts.forEach((q,i)=>{if(i===0)c.moveTo(q[0],q[1]);else{const a=f.pts[i-1],mx=(a[0]+q[0])/2+rnd(-14,14),my=(a[1]+q[1])/2+rnd(-14,14);c.lineTo(mx,my);c.lineTo(q[0],q[1])}});c.stroke()}c.restore()}}
  c.font='bold 18px '+FONT;c.textAlign='center';c.textBaseline='middle';c.lineJoin='round';
  for(const t of G.tx){const k=t.life/.7;c.globalAlpha=Math.min(1,k*2);c.font='bold '+t.size+'px '+FONT;c.lineWidth=4;c.strokeStyle='#14233c';c.strokeText(t.s,t.x,t.y);c.fillStyle=t.col;c.fillText(t.s,t.x,t.y)}c.globalAlpha=1;
}
function pill(c,x,y,w,h,fill,stroke){rr(c,x,y,w,h,h/2);c.fillStyle=fill;c.fill();if(stroke){c.lineWidth=2;c.strokeStyle=stroke;c.stroke()}}
function otext(c,s,x,y,size,col,align,sw){c.font=size+'px '+FONT;c.textAlign=align||'center';c.textBaseline='middle';c.lineJoin='round';c.lineWidth=sw||5;c.strokeStyle='#0b1f3a';c.strokeText(s,x,y);c.fillStyle=col||'#fff';c.fillText(s,x,y)}
function drawBtn(c,b,fill,icon,label,frac,badge,ready){
  c.save();c.translate(b.x,b.y);c.beginPath();c.arc(0,0,b.r,0,TAU);c.fillStyle=ready?fill:'rgba(30,50,80,.8)';c.globalAlpha=.62;c.fill();c.globalAlpha=1;c.lineWidth=4;c.strokeStyle=ready?'#fff':'rgba(160,200,255,.5)';c.stroke();
  if(frac>0){c.strokeStyle='#ffd24a';c.lineWidth=5;c.lineCap='round';c.beginPath();c.arc(0,0,b.r+7,-Math.PI/2,-Math.PI/2+TAU*Math.min(1,frac));c.stroke()}
  c.font=Math.round(b.r*.9)+'px '+FONT;c.textAlign='center';c.textBaseline='middle';c.fillStyle='#fff';c.fillText(icon,0,-2);
  otext(c,label,0,b.r+16,15,'#fff','center',4);
  if(badge!==null){c.beginPath();c.arc(b.r*.7,-b.r*.7,13,0,TAU);c.fillStyle='#ff4a6a';c.fill();c.lineWidth=3;c.strokeStyle='#fff';c.stroke();otext(c,String(badge),b.r*.7,-b.r*.7+1,16,'#fff','center',0)}
  c.restore();
}

  y=98;for(const id in G.pas){pill(c,W-46,y+22,36,28,'rgba(9,27,52,.7)','rgba(150,205,255,.3)');c.font='15px '+FONT;c.textAlign='center';c.textBaseline='middle';c.fillStyle='#fff';c.fillText(PASSIVES[id].icon,W-34,y+36);otext(c,String(G.pas[id]),W-16,y+48,11,'#ffd24a','center',3);y+=32}
  // 보스 바
  const b=G.boss;if(b){const w=300,x=W/2-w/2+10,yy=78;pill(c,x-6,yy-4,w+12,24,'rgba(9,27,52,.82)','rgba(255,120,130,.7)');
    const f=clamp(b.hp/b.max,0,1);rr(c,x,yy,w,16,8);c.fillStyle='rgba(0,0,0,.5)';c.fill();if(f>0){const g=c.createLinearGradient(x,0,x+w,0);g.addColorStop(0,'#ff4a5e');g.addColorStop(1,'#ff9a6b');rr(c,x,yy,Math.max(16,w*f),16,8);c.fillStyle=g;c.fill()}
    otext(c,b.name,x+w/2,yy+40,17,'#ffd6d6','center',4);}
  // 메시지
  G.msg.forEach((m,i)=>{const k=m.life/m.max,a=Math.min(1,k*3,(1-k)*8+.2),sc=1+Math.max(0,.4-(1-k)*3);c.save();c.globalAlpha=Math.min(1,a);c.translate(W/2,215+i*40);c.scale(sc,sc);otext(c,m.s,0,0,30,m.col,'center',7);c.restore()});

  {const b=BTN.pause;c.beginPath();c.arc(b.x,b.y,b.r,0,TAU);c.fillStyle='rgba(9,27,52,.7)';c.fill();c.lineWidth=2;c.strokeStyle='rgba(150,205,255,.6)';c.stroke();c.fillStyle='#fff';c.fillRect(b.x-6,b.y-7,4.5,14);c.fillRect(b.x+1.5,b.y-7,4.5,14)}
  const rc=1-clamp(p.rollCd/3.4,0,1);drawBtn(c,BTN.roll,'#2f8ee8','🌀','회피 롤',p.rollCd>0?rc:0,null,p.rollCd<=0);

  if(p.hp/p.max<.28&&G.end<=0){const a=.12+.1*Math.sin(G.t*8);const g=c.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.75);g.addColorStop(0,'rgba(255,40,60,0)');g.addColorStop(1,'rgba(255,40,60,'+a+')');c.fillStyle=g;c.fillRect(0,0,W,H)}
  if(G.flash>0){c.fillStyle='rgba(255,255,255,'+Math.min(.85,G.flash)+')';c.fillRect(0,0,W,H)}
}
function drawGame(c){
  c.save();if(G.shake>0)c.translate(rnd(-1,1)*G.shake*.5,rnd(-1,1)*G.shake*.5);
  drawSea(c,G.t);
  for(const e of G.en)if(e.sea)drawEnemy(c,e);
  if(G.boss&&G.boss.sea)drawBoss(c,G.boss);
  drawZones(c);drawLoot(c);
  for(const e of G.en)if(!e.sea)drawEnemy(c,e);
  if(G.boss&&!G.boss.sea)drawBoss(c,G.boss);
  drawPB(c);drawOrbit(c);drawWing(c);drawPlayer(c);drawEB(c);drawParticles(c);drawClouds(c);drawTint(c,G.stageT+STAGES[G.stage-1].tint);
  c.restore();drawHUD(c);
}

  MODE='play';ui.innerHTML='';msg(STAGES[G.stage-1].name+' 진입!','#a7f8ff');
}

/* ================= P 관리자 모드 ================= */
let adminReturnMode='play';
function openAdmin(){
  if(!G||!['play','pause'].includes(MODE))return;
  adminReturnMode=MODE;MODE='admin';IN.keys={};IN.dx=IN.dy=0;renderAdmin();
}
function closeAdmin(){
  if(MODE!=='admin')return;
  MODE='play';ui.innerHTML='';
  if(adminReturnMode==='pause')pause();
}
function renderAdmin(){
  if(MODE!=='admin'||!G)return;
  const wrows=Object.keys(WEAPONS).map(id=>{const w=WEAPONS[id],lv=G.w[id]||0;
    return `<div class="adminLine"><span>${w.icon} ${w.name}<br><b>Lv.${lv} / ${w.max}</b></span><span class="adminControls"><button class="adminControl" data-a="adminWeapon" data-id="${id}" ${lv>=w.max?'disabled':''}>+1</button><button class="adminControl gold" data-a="adminWeaponMax" data-id="${id}" ${lv>=w.max?'disabled':''}>MAX</button></span></div>`}).join('');
  ui.innerHTML=`<div class="scr dim adminScreen"><h2>관리자 모드</h2><p class="sub">전투 일시정지 중 · <kbd>P</kbd> 키로 복귀</p>
    <div class="adminScroll">
      <div class="adminGroup"><h3>기체 상태</h3>
        <div class="adminLine"><span>무적 모드 <b>${G.adminGod?'활성화':'비활성화'}</b></span><button class="adminControl ${G.adminGod?'gold':'warn'}" data-a="adminGod">${G.adminGod?'무적 끄기':'무적 켜기'}</button></div>
        <div class="adminLine"><span>기체 에너지</span><button class="adminControl" data-a="adminHeal">체력 100% 회복</button></div>
        <div class="adminLine"><span>성장 레벨 Lv.${G.lv}</span><button class="adminControl" data-a="adminLevel">레벨 +5</button></div>
        <div class="adminLine"><span>대폭격 ${G.bombs}개</span><button class="adminControl" data-a="adminBomb">+3개</button></div>
      </div>
      <div class="adminGroup"><h3>무기 레벨업 · 무기 해금</h3>${wrows}<button class="adminControl gold" data-a="adminAllMax">모든 무기 MAX</button><p class="adminHelp">관리자 모드에서는 일반 장착 제한과 무관하게 모든 무기를 시험할 수 있습니다.</p></div>
      <div class="adminGroup"><h3>보스 직접 소환</h3>${Object.entries(BOSS).map(([id,b])=>`<div class="adminLine"><span>${b.name}</span><button class="adminControl warn" data-a="adminBoss" data-id="${id}">소환</button></div>`).join('')}
        <p class="adminHelp">현재 맵의 보스를 격파하면 다음 맵이 열립니다. 다른 보스 소환은 연습용입니다.</p></div>
      <div class="adminGroup"><h3>스테이지 관리</h3><div class="adminLine"><span>${G.stage}. ${STAGES[G.stage-1].name}</span><button class="adminControl gold" data-a="adminClear">현재 맵 클리어</button></div></div>
    </div><button class="btn big" style="font-size:24px;padding:9px 28px" data-a="adminClose">게임으로 돌아가기 (P)</button>
  </div>`;
}
function adminWeapon(id,max){
  if(!G||MODE!=='admin'||!WEAPONS[id])return;
  const old=G.w[id]||0;
  G.w[id]=max?WEAPONS[id].max:Math.min(WEAPONS[id].max,old+1);
  if(id==='wing'&&G.w[id]>0)syncWing();
  G.wt[id]=0;renderAdmin();
}
function adminBoss(id){
  if(!G||MODE!=='admin'||!BOSS[id])return;
  G.boss=null;G.eb=[];G.zones=[];
  startBoss(id);
  if(id===STAGES[G.stage-1].boss)G.stageBossCalled=true;
  closeAdmin();
}
function adminClear(){
  if(!G||MODE!=='admin')return;
  const final=G.stage===STAGES.length;
  G.boss=null;G.eb=[];G.zones=[];
  G.stageBossCalled=true;
  if(final){G.result='win';G.end=.1;MODE='play';ui.innerHTML=''}
  else showStageClear();
}

function finish(){
  const win=G.result==='win',coins=Math.floor(G.score/220)+Math.floor(G.kills/12)+G.bossKills*70+(win?300:0)+Math.floor(G.t/10);
  const nb={};SAVE.coins+=coins;SAVE.runs++;
  if(G.t>SAVE.best.time){SAVE.best.time=G.t;nb.t=1}if(G.kills>SAVE.best.kills){SAVE.best.kills=G.kills;nb.k=1}if(G.score>SAVE.best.score){SAVE.best.score=G.score;nb.s=1}
  if(win)SAVE.clears++;saveNow();MODE='result';
  const tag=k=>nb[k]?'<span class="new-tag">NEW</span>':'';
  ui.innerHTML=`<div class="scr dim"><h2 style="margin-top:90px;font-size:44px;${win?'':'color:#ff9aa8;text-shadow:0 3px 0 #b02a42'}">${win?'🎉 작전 성공!':'격추당했어요...'}</h2>
    <p class="sub">${win?'모든 4개 해역을 제압하고 설왕을 격파했어요!':'다음엔 더 강해져서 돌아오세요'}</p>
    <div class="stats" style="margin-top:8px"><div class="stat">생존 시간<b>${fmtT(G.t)}${tag('t')}</b></div><div class="stat">격추 수<b>${fmt(G.kills)}${tag('k')}</b></div><div class="stat">점수<b>${fmt(G.score)}${tag('s')}</b></div><div class="stat">도달 레벨<b>Lv.${G.lv}</b></div></div>
    <div class="stat" style="width:100%;font-size:20px">획득 훈장<b style="font-size:30px">★ ${fmt(coins)}</b></div>
    <div class="col" style="margin-top:auto;margin-bottom:10px"><button class="btn big" data-a="play">다시 출격!</button><div class="row"><button class="btn alt" data-a="hangar">격납고</button><button class="btn ghost" data-a="title">타이틀</button></div></div></div>`;
  win?SFX.win():0;
}
function toast(s){const d=document.createElement('div');d.className='toast';d.textContent=s;ui.appendChild(d);setTimeout(()=>d.remove(),3300)}
function toggleMute(){SAVE.mute=SAVE.mute?0:1;saveNow();ui.querySelectorAll('.mute').forEach(b=>b.textContent=SAVE.mute?'🔇':'🔊')}
ui.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;audioInit();const a=t.dataset.a,id=t.dataset.id;
  if(a==='play')startGame();else if(a==='stage'){
    const n=+t.dataset.i;if(n>=1&&n<=SAVE.unlocked){SAVE.startStage=n;saveNow();showTitle()}}
  else if(a==='nextstage')advanceStage();else if(a==='hangar')showHangar();else if(a==='title')showTitle();else if(a==='tab')showHangar(id);
  else if(a==='adminClose')closeAdmin();
  else if(a==='adminGod'){if(G&&MODE==='admin'){G.adminGod=!G.adminGod;renderAdmin()}}
  else if(a==='adminHeal'){if(G&&MODE==='admin'){G.p.hp=G.p.max;renderAdmin()}}
  else if(a==='adminLevel'){if(G&&MODE==='admin'){G.lv+=5;G.need=needXp(G.lv);G.xp=0;renderAdmin()}}
  else if(a==='adminBomb'){if(G&&MODE==='admin'){G.bombs+=3;renderAdmin()}}
  else if(a==='adminWeapon')adminWeapon(id,false);
  else if(a==='adminWeaponMax')adminWeapon(id,true);
  else if(a==='adminAllMax'){if(G&&MODE==='admin'){for(const k in WEAPONS){G.w[k]=WEAPONS[k].max;G.wt[k]=0}syncWing();renderAdmin()}}
  else if(a==='adminBoss')adminBoss(id);
  else if(a==='adminClear')adminClear();
  else if(a==='sel'){SAVE.sel=id;saveNow();showHangar()}
  else if(a==='buy'){const p=PLANES[id];if(SAVE.coins>=p.cost){SAVE.coins-=p.cost;SAVE.own[id]=1;SAVE.sel=id;saveNow();showHangar();toast(p.name+' 획득!')}}
  else if(a==='up'){const u=UPG.find(q=>q.id===id),lv=SAVE.up[id],c=u.cost[lv];if(c!==undefined&&SAVE.coins>=c){SAVE.coins-=c;SAVE.up[id]++;saveNow();showHangar()}}
  else if(a==='pick')pickOpt(+t.dataset.i);else if(a==='resume')resume();else if(a==='quit'){MODE='title';G=null;showTitle()}
  else if(a==='mute')toggleMute();
});
/* ================= 입력 ================= */
const inBtn=(b,x,y)=>(x-b.x)**2+(y-b.y)**2<(b.r+14)**2;
const cpos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H]};
cv.addEventListener('pointerdown',e=>{audioInit();if(MODE!=='play'||!G)return;const[x,y]=cpos(e);if(inBtn(BTN.pause,x,y)){pause();return}if(inBtn(BTN.roll,x,y)){doRoll();return}if(inBtn(BTN.bomb,x,y)){doBomb();return}IN.id=e.pointerId;IN.lx=x;IN.ly=y;try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',e=>{if(e.pointerId!==IN.id)return;const[x,y]=cpos(e);IN.dx+=(x-IN.lx)*1.15;IN.dy+=(y-IN.ly)*1.15;IN.lx=x;IN.ly=y});
const upP=e=>{if(e.pointerId===IN.id)IN.id=null};cv.addEventListener('pointerup',upP);cv.addEventListener('pointercancel',upP);
addEventListener('keydown',e=>{
  IN.keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  if(MODE==='play'){if(e.code==='Space'||e.code==='ShiftLeft'||e.code==='ShiftRight')doRoll();else if(e.code==='KeyB'||e.code==='KeyX')doBomb();else if(e.code==='KeyP')openAdmin();else if(e.code==='Escape')pause()}
  else if(MODE==='admin'&&(e.code==='KeyP'||e.code==='Escape'))closeAdmin();
  else if(MODE==='pause'&&e.code==='KeyP')openAdmin();
  else if(MODE==='pause'&&e.code==='Escape')resume();
  else if(MODE==='levelup'&&['Digit1','Digit2','Digit3'].includes(e.code))pickOpt(+e.code.slice(5)-1);
  if(e.code==='KeyM')toggleMute();
});
addEventListener('keyup',e=>{IN.keys[e.code]=false});
addEventListener('blur',()=>{IN.keys={};IN.id=null;if(MODE==='play')pause()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&MODE==='play')pause()});
/* ================= 시작 ================= */
let last=0;
function frame(ts){
  const dt=Math.min(.05,Math.max(0,(ts-last)/1000)||0);last=ts;
  ctx.setTransform(RES,0,0,RES,0,0);
  if(MODE==='play'){update(dt);if(G)drawGame(ctx)}
  else if((MODE==='levelup'||MODE==='pause'||MODE==='admin'||MODE==='stageclear')&&G)drawGame(ctx);
  else titleScene(ctx,dt);
  requestAnimationFrame(frame);
}
buildPlayerSprites();buildShadows();buildEnemySprites();buildBossSprites();buildGlow();buildGems();buildBG();buildStageSeas();bgReset();
showTitle();requestAnimationFrame(frame);
</script>
</body>
</html>
