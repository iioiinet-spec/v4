<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFE3B8">
<title>몽글몽글 디저트 타이쿤</title>
<style>
:root{
  --cream:#FFF7EA;
  --sand:#FFE9CC;
  --peach:#FFC9A0;
  --pink:#FF9EB5;
  --mint:#8FDCC0;
  --sky:#BFE6FF;
  --amber:#FFB020;
  --gold:#FFCF4A;
  --cocoa:#5A3D30;
  --cocoa-soft:#8A6A57;
  --line:rgba(90,61,48,.12);
  --shadow:0 6px 0 rgba(90,61,48,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  color:var(--cocoa);
  background:
    radial-gradient(1200px 700px at 50% -10%, #FFE7C4 0%, #FFD9E2 45%, #D6E9FF 100%);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  user-select:none;
}
/* ---------- 9:16 프레임 ---------- */
.phone{
  position:relative;
  width:min(100vw, calc(100dvh * 9 / 16));
  height:min(100dvh, calc(100vw * 16 / 9));
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,#CFEBFF 0%,#FFE6D0 55%,#FFDCE6 100%);
  overflow:hidden;
  box-shadow:0 24px 60px rgba(90,61,48,.28);
  border-radius:clamp(0px,3vw,26px);
}
@media (max-aspect-ratio:9/16){ .phone{border-radius:0} }

/* ---------- 상단 HUD ---------- */
.hud{
  position:relative;z-index:6;
  padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;
  display:flex;flex-direction:column;gap:8px;
}
.hud-top{display:flex;align-items:center;gap:8px}
.gold-box{
  flex:1;display:flex;align-items:center;gap:8px;
  background:linear-gradient(180deg,#FFFDF8,#FFF1DC);
  border:2px solid #fff;border-radius:18px;
  padding:8px 12px;box-shadow:var(--shadow);
}
.coin-ic{
  width:30px;height:30px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 33% 28%, #FFF0B8, var(--gold) 55%, #E8971B);
  box-shadow:inset 0 -2px 0 rgba(160,90,0,.35);
  display:grid;place-items:center;font-size:14px;font-weight:900;color:#8a5a00;
}
.gold-num{font-size:22px;font-weight:900;letter-spacing:-.5px;line-height:1.05}
.gold-sub{font-size:11px;font-weight:700;color:var(--cocoa-soft);margin-top:1px}
.icon-btn{
  width:38px;height:38px;flex:none;border:2px solid #fff;border-radius:14px;
  background:linear-gradient(180deg,#FFFDF8,#FFEFD8);box-shadow:var(--shadow);
  font-size:16px;display:grid;place-items:center;cursor:pointer;
}
.icon-btn:active{transform:translateY(2px);box-shadow:0 3px 0 rgba(90,61,48,.18)}

.level-bar{
  background:rgba(255,255,255,.62);
  border:2px solid #fff;border-radius:16px;padding:7px 10px;box-shadow:var(--shadow);
}
.level-bar .row{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;font-weight:800;margin-bottom:5px}
.level-bar .tier{color:var(--cocoa);font-size:12.5px}
.level-bar .goal{color:var(--cocoa-soft)}
.track{height:11px;border-radius:99px;background:rgba(90,61,48,.13);overflow:hidden;position:relative}
.track>span{
  display:block;height:100%;width:0%;border-radius:99px;
  background:linear-gradient(90deg,#FFD87A,var(--amber) 60%,#FF9440);
  box-shadow:0 0 10px rgba(255,176,32,.7);
  transition:width .25s ease;
}
.track::after{
  content:"";position:absolute;inset:0;border-radius:99px;
  background:linear-gradient(180deg,rgba(255,255,255,.55),transparent 55%);
}

/* ---------- 무대 ---------- */
.stage{position:relative;flex:1;min-height:0;overflow:hidden;cursor:pointer}
.sky-deco{position:absolute;inset:0;pointer-events:none}
.cloud{position:absolute;background:rgba(255,255,255,.82);border-radius:99px;filter:blur(.2px)}
.cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
.sun{
  position:absolute;top:6%;right:-18px;width:110px;height:110px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,236,170,.95),rgba(255,236,170,0) 68%);
}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
#bldg{transform-origin:180px 210px;transition:transform .09s ease-out}
.pop #bldg{transform:scale(.955) translateY(3px)}
#island{animation:float 4.2s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

.tap-hint{
  position:absolute;left:50%;bottom:12px;transform:translateX(-50%);
  font-size:12.5px;font-weight:800;color:var(--cocoa);
  background:rgba(255,255,255,.75);padding:6px 14px;border-radius:99px;
  border:2px solid #fff;pointer-events:none;animation:hint 1.8s ease-in-out infinite;
}
@keyframes hint{0%,100%{transform:translate(-50%,0);opacity:.85}50%{transform:translate(-50%,-6px);opacity:1}}

.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.float-num{
  position:absolute;transform:translate(-50%,-50%);
  font-size:19px;font-weight:900;color:#fff;
  text-shadow:0 2px 0 #E8971B,0 0 12px rgba(255,176,32,.8);
  animation:rise .95s cubic-bezier(.2,.7,.3,1) forwards;
}
.float-num.crit{font-size:26px;color:#FFF3C4;text-shadow:0 2px 0 #E2560B,0 0 16px rgba(255,120,40,.9)}
@keyframes rise{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}
  18%{opacity:1;transform:translate(-50%,-70%) scale(1.15)}
  100%{opacity:0;transform:translate(-50%,-190%) scale(.95)}
}
.coin{
  position:absolute;width:16px;height:16px;border-radius:50%;
  background:radial-gradient(circle at 34% 28%,#FFF3C0,var(--gold) 55%,#E09114);
  box-shadow:0 0 8px rgba(255,190,60,.8);
  animation:coinfly .8s ease-in forwards;
}
@keyframes coinfly{
  0%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),-140px) scale(.5)}
}
.spark{position:absolute;width:9px;height:9px;border-radius:2px;animation:spark .9s ease-out forwards}
@keyframes spark{
  0%{opacity:1;transform:translate(-50%,-50%) rotate(0) scale(1)}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(320deg) scale(.4)}
}

/* ---------- 확장 카드 ---------- */
.expand{
  position:relative;z-index:6;margin:0 12px 8px;
  display:flex;align-items:center;gap:10px;
  background:linear-gradient(180deg,#FFFDF7,#FFEBD3);
  border:2px solid #fff;border-radius:20px;padding:9px 11px;box-shadow:var(--shadow);
  cursor:pointer;transition:filter .15s;
}
.expand:active{transform:translateY(2px);box-shadow:0 3px 0 rgba(90,61,48,.18)}
.expand[disabled]{opacity:.55;cursor:default}
.expand .badge{
  width:44px;height:44px;flex:none;border-radius:15px;display:grid;place-items:center;font-size:21px;
  background:linear-gradient(160deg,#FFD98A,#FF9F6B);box-shadow:inset 0 -3px 0 rgba(160,80,20,.25);
}
.expand .t1{font-size:13.5px;font-weight:900}
.expand .t2{font-size:11.5px;font-weight:700;color:var(--cocoa-soft);margin-top:2px}
.expand .price{margin-left:auto;text-align:right;font-size:13px;font-weight:900;color:#B8791A;white-space:nowrap}

/* ---------- 하단 패널 ---------- */
.panel{
  position:relative;z-index:6;
  height:37%;min-height:190px;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#FFFCF5,#FFF3E4);
  border-top:3px solid #fff;
  border-radius:26px 26px 0 0;
  box-shadow:0 -8px 24px rgba(90,61,48,.12);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabs{display:flex;gap:6px;padding:10px 12px 6px}
.tab{
  flex:1;padding:9px 0;border:none;border-radius:14px;cursor:pointer;
  font-family:inherit;font-size:13px;font-weight:800;color:var(--cocoa-soft);
  background:rgba(90,61,48,.07);
}
.tab.on{background:linear-gradient(180deg,#FFD98A,#FFB43C);color:#5A3D30;box-shadow:0 3px 0 rgba(190,120,20,.35)}
.buy-modes{display:flex;gap:5px;padding:0 12px 8px}
.mode{
  padding:5px 12px;border:none;border-radius:99px;cursor:pointer;font-family:inherit;
  font-size:11.5px;font-weight:800;color:var(--cocoa-soft);background:rgba(90,61,48,.07);
}
.mode.on{background:#5A3D30;color:#FFE9C6}
.list{flex:1;overflow-y:auto;padding:0 12px 14px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch}
.list::-webkit-scrollbar{width:0}

.item{
  position:relative;display:flex;align-items:center;gap:10px;
  padding:9px 11px;border:2px solid #fff;border-radius:18px;
  background:#fff;box-shadow:0 3px 0 rgba(90,61,48,.12);
  cursor:pointer;overflow:hidden;text-align:left;font-family:inherit;color:inherit;
}
.item:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(90,61,48,.12)}
.item.locked{opacity:.5;filter:grayscale(.5);cursor:default}
.item .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,rgba(255,207,74,.34),rgba(255,176,32,.14));transition:width .3s}
.item.ok .fill{background:linear-gradient(90deg,rgba(143,220,192,.40),rgba(143,220,192,.14))}
.item>*{position:relative}
.ic{
  width:40px;height:40px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:20px;
  background:linear-gradient(160deg,#FFF0D6,#FFD9B7);box-shadow:inset 0 -3px 0 rgba(160,110,60,.18);
}
.meta{flex:1;min-width:0}
.nm{font-size:13.5px;font-weight:900;display:flex;align-items:center;gap:6px}
.lv{font-size:10.5px;font-weight:900;color:#fff;background:var(--pink);padding:1.5px 7px;border-radius:99px}
.sub{font-size:11px;font-weight:700;color:var(--cocoa-soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.px{text-align:right;flex:none}
.px .c{font-size:12.5px;font-weight:900;color:#B8791A}
.px .q{font-size:10px;font-weight:800;color:var(--cocoa-soft)}
.item.ok .px .c{color:#2E9E77}

/* ---------- 토스트 / 레벨업 ---------- */
.toast{
  position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 96px);transform:translateX(-50%);
  z-index:20;background:rgba(90,61,48,.92);color:#FFEBC8;
  padding:9px 16px;border-radius:99px;font-size:12.5px;font-weight:800;
  opacity:0;transition:opacity .3s, transform .3s;pointer-events:none;white-space:nowrap;max-width:88%;
}
.toast.show{opacity:1;transform:translate(-50%,6px)}
.levelup{
  position:absolute;inset:0;z-index:15;display:grid;place-items:center;pointer-events:none;opacity:0;
}
.levelup.go{animation:lvup 1.7s ease-out}
.levelup .card{
  background:linear-gradient(180deg,#FFF8E6,#FFDFA6);
  border:3px solid #fff;border-radius:24px;padding:16px 26px;text-align:center;
  box-shadow:0 12px 30px rgba(90,61,48,.3);
}
.levelup .k{font-size:12px;font-weight:800;color:#B8791A}
.levelup .v{font-size:24px;font-weight:900;margin-top:3px}
@keyframes lvup{
  0%{opacity:0;transform:scale(.7)}
  15%{opacity:1;transform:scale(1.06)}
  30%{transform:scale(1)}
  80%{opacity:1}
  100%{opacity:0;transform:scale(1.02)}
}
</style>
</head>
<body>
<div class="phone" id="phone">

  <header class="hud">
    <div class="hud-top">
      <div class="gold-box">
        <div class="coin-ic">₲</div>
        <div>
          <div class="gold-num" id="gold">0</div>
          <div class="gold-sub" id="gps">초당 0 · 클릭당 1</div>
        </div>
      </div>
      <button class="icon-btn" id="btn-reset" title="처음부터 다시 시작">↻</button>
    </div>
    <div class="level-bar">
      <div class="row">
        <span class="tier" id="tier-name">Lv.1 포장마차</span>
        <span class="goal" id="tier-goal">다음 단계까지 0%</span>
      </div>
      <div class="track"><span id="track-fill"></span></div>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="sky-deco" id="sky"><div class="sun"></div></div>
    <svg id="scene" viewBox="0 0 360 320" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
    <div class="tap-hint" id="hint">가게를 톡톡 두드려 골드를 모으세요</div>
    <div class="fx" id="fx"></div>
    <div class="levelup" id="levelup"><div class="card"><div class="k">가게 확장 완료</div><div class="v" id="lv-name">디저트 스탠드</div></div></div>
    <div class="toast" id="toast"></div>
  </main>

  <button class="expand" id="expand">
    <div class="badge">🏗️</div>
    <div>
      <div class="t1" id="ex-name">디저트 스탠드로 확장</div>
      <div class="t2" id="ex-desc">모든 수입 ×1.7 · 가게 외형이 바뀝니다</div>
    </div>
    <div class="price" id="ex-cost">₲ 400</div>
  </button>

  <section class="panel">
    <div class="tabs">
      <button class="tab on" data-tab="staff">직원 고용</button>
      <button class="tab" data-tab="up">클릭 강화</button>
    </div>
    <div class="buy-modes" id="modes">
      <button class="mode on" data-m="1">×1</button>
      <button class="mode" data-m="10">×10</button>
      <button class="mode" data-m="max">최대</button>
    </div>
    <div class="list" id="list"></div>
  </section>
</div>

<script>
(function(){
"use strict";

/* =========================================================
   0. 저장소 (localStorage 차단 환경에서는 메모리로 대체)
   ========================================================= */
var store = (function(){
  try{
    localStorage.setItem("__t__","1"); localStorage.removeItem("__t__");
    return localStorage;
  }catch(e){
    var m={};
    return {getItem:function(k){return k in m?m[k]:null;},
            setItem:function(k,v){m[k]=String(v);},
            removeItem:function(k){delete m[k];}};
  }
})();
var SAVE_KEY = "dessert_tycoon_v1";

/* =========================================================
   1. 게임 데이터
   ========================================================= */
var TIERS = [
  {n:"포장마차",       cost:0,      wall:"#E7B37E", roof:"#FF9EB5", trim:"#FFF2DC"},
  {n:"디저트 스탠드",   cost:400,    wall:"#FFE6C2", roof:"#FF8FA8", trim:"#FFFBF0"},
  {n:"동네 컵케이크방", cost:5000,   wall:"#FFF1D9", roof:"#FF7E9D", trim:"#FFFFFF"},
  {n:"몽글 디저트 카페", cost:70000,  wall:"#FFF6E6", roof:"#7FD3B4", trim:"#FFFFFF"},
  {n:"2층 티하우스",    cost:900000, wall:"#FFF3EA", roof:"#FF8FA8", trim:"#FFE3B0"},
  {n:"3층 케이크 하우스",cost:1.5e7,  wall:"#FFFBF3", roof:"#FF7E9D", trim:"#FFD3E0"},
  {n:"딸기 케이크 궁전", cost:2.5e8,  wall:"#FFFFFF", roof:"#FF6F91", trim:"#FFD24A"},
  {n:"황금 디저트 팰리스",cost:5e9,   wall:"#FFE7A8", roof:"#FFB020", trim:"#FFF6C9"}
];
var SHOP_MULT = 1.7;

var WORKERS = [
  {ic:"🧑‍🍳", n:"알바생 몽이",     gps:1,      cost:60},
  {ic:"☕",   n:"에스프레소 머신",  gps:8,      cost:750},
  {ic:"🧁",   n:"컵케이크 오븐",    gps:46,     cost:9000},
  {ic:"🍰",   n:"케이크 장인",      gps:260,    cost:110000},
  {ic:"🤖",   n:"디저트 로봇",      gps:1400,   cost:1.3e6},
  {ic:"🏭",   n:"마카롱 공장",      gps:7800,   cost:1.4e7},
  {ic:"🚁",   n:"배달 드론 편대",   gps:44000,  cost:1.7e8},
  {ic:"🚂",   n:"디저트 특급열차",  gps:260000, cost:2.1e9},
  {ic:"🌈",   n:"구름 위 카페",     gps:1.6e6,  cost:2.6e10}
];
var WR = 1.15;

var UPS = [
  {id:"click", ic:"👆", n:"손맛 훈련",   d:"클릭당 골드 +2",              cost:25,   r:1.17, max:500},
  {id:"spoon", ic:"🥄", n:"골든 스푼",   d:"클릭 수입 ×1.25",             cost:1500, r:2.5,  max:20},
  {id:"crit",  ic:"✨", n:"행운의 손길", d:"크리티컬 확률 +2% (×8 골드)", cost:900,  r:1.95, max:20},
  {id:"mgr",   ic:"📋", n:"매니저 교육", d:"초당 수입 +10%",              cost:3000, r:2.0,  max:25},
  {id:"flyer", ic:"📣", n:"홍보 전단",   d:"클릭 시 초당 수입의 +5% 추가",cost:6000, r:2.7,  max:12}
];

/* =========================================================
   2. 상태
   ========================================================= */
var S = {gold:0, total:0, clicks:0, tier:0, w:[], u:{}, t:Date.now()};
for(var i=0;i<WORKERS.length;i++) S.w.push(0);
for(var j=0;j<UPS.length;j++) S.u[UPS[j].id]=0;

function load(){
  try{
    var raw = store.getItem(SAVE_KEY); if(!raw) return null;
    var d = JSON.parse(raw);
    S.gold = +d.gold||0; S.total = +d.total||0; S.clicks = +d.clicks||0;
    S.tier = Math.min(+d.tier||0, TIERS.length-1);
    for(var i=0;i<WORKERS.length;i++) S.w[i] = (d.w && +d.w[i])||0;
    for(var k in S.u) if(d.u && d.u[k]) S.u[k] = +d.u[k];
    S.t = +d.t || Date.now();
    return d;
  }catch(e){ return null; }
}
function save(){
  S.t = Date.now();
  try{ store.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){}
}

/* =========================================================
   3. 계산식
   ========================================================= */
function shopMult(){ return Math.pow(SHOP_MULT, S.tier); }
function gps(){
  var g=0;
  for(var i=0;i<WORKERS.length;i++) g += WORKERS[i].gps * S.w[i];
  return g * shopMult() * (1 + 0.10*S.u.mgr);
}
function clickPower(){
  var base = (1 + 2*S.u.click) * shopMult() * Math.pow(1.25, S.u.spoon);
  return base + gps() * 0.05 * S.u.flyer;
}
function critChance(){ return 0.02 * S.u.crit; }
function workerCost(i,n){
  var c = WORKERS[i].cost * Math.pow(WR, S.w[i]);
  return c * (Math.pow(WR,n)-1) / (WR-1);
}
function upCost(u,n){
  var c = u.cost * Math.pow(u.r, S.u[u.id]);
  return c * (Math.pow(u.r,n)-1) / (u.r-1);
}
function maxAffordable(base, r, lv, gold){
  var c = base * Math.pow(r, lv);
  var n = Math.floor(Math.log(1 + gold*(r-1)/c) / Math.log(r));
  return Math.max(0, n);
}

/* =========================================================
   4. 숫자 포맷 (한국식 만/억/조)
   ========================================================= */
var UNITS = [[1e20,"해"],[1e16,"경"],[1e12,"조"],[1e8,"억"],[1e4,"만"]];
function fmt(n){
  if(!isFinite(n)) return "∞";
  if(n < 10000) return (n<10 ? Math.round(n*10)/10 : Math.floor(n)).toLocaleString("ko-KR");
  for(var i=0;i<UNITS.length;i++){
    if(n >= UNITS[i][0]){
      var x = n/UNITS[i][0];
      var s = x>=100 ? Math.floor(x).toString() : (Math.round(x*100)/100).toString();
      return s + UNITS[i][1];
    }
  }
  return Math.floor(n).toLocaleString("ko-KR");
}

/* =========================================================
   5. 아이소메트릭 SVG 렌더러
   ========================================================= */
var OX=180, OY=214, KX=25, KY=12.5, KZ=27;
function P(x,y,z){ return [(OX+(x-y)*KX).toFixed(1), (OY+(x+y)*KY-z*KZ).toFixed(1)]; }
function poly(pts,fill,op){
  var s="";
  for(var i=0;i<pts.length;i++) s += pts[i][0]+","+pts[i][1]+" ";
  return '<polygon points="'+s.trim()+'" fill="'+fill+'"'+(op?' opacity="'+op+'"':'')+'/>';
}
function shade(hex,f){
  var r=parseInt(hex.substr(1,2),16), g=parseInt(hex.substr(3,2),16), b=parseInt(hex.substr(5,2),16);
  function mix(v){ return Math.max(0,Math.min(255, Math.round(f>=0 ? v+(255-v)*f : v*(1+f)))); }
  function h2(v){ var s=mix(v).toString(16); return s.length<2?"0"+s:s; }
  return "#"+h2(r)+h2(g)+h2(b);
}
function box(x,y,dx,dy,z,h,c){
  var t=z+h;
  return poly([P(x,y,t),P(x+dx,y,t),P(x+dx,y+dy,t),P(x,y+dy,t)], shade(c,.20))
       + poly([P(x,y+dy,t),P(x+dx,y+dy,t),P(x+dx,y+dy,z),P(x,y+dy,z)], shade(c,-.06))
       + poly([P(x+dx,y,t),P(x+dx,y+dy,t),P(x+dx,y+dy,z),P(x+dx,y,z)], shade(c,-.17));
}
function pyr(x,y,dx,dy,z,h,c){
  var ap=P(x+dx/2, y+dy/2, z+h);
  return poly([P(x,y,z),P(x+dx,y,z),ap], shade(c,-.34))
       + poly([P(x,y,z),P(x,y+dy,z),ap], shade(c,-.34))
       + poly([P(x,y+dy,z),P(x+dx,y+dy,z),ap], shade(c,.04))
       + poly([P(x+dx,y,z),P(x+dx,y+dy,z),ap], shade(c,-.24));
}
/* 앞면(+y) 위의 창문/문 */
function faceY(y,x0,x1,z0,z1,c){
  return poly([P(x0,y,z1),P(x1,y,z1),P(x1,y,z0),P(x0,y,z0)], c);
}
function faceX(x,y0,y1,z0,z1,c){
  return poly([P(x,y0,z1),P(x,y1,z1),P(x,y1,z0),P(x,y0,z0)], c);
}
function ellipse(x,y,z,rx,ry,c,op){
  var p=P(x,y,z);
  return '<ellipse cx="'+p[0]+'" cy="'+p[1]+'" rx="'+rx+'" ry="'+ry+'" fill="'+c+'"'+(op?' opacity="'+op+'"':'')+'/>';
}
function label(x,y,z,txt,size){
  var p=P(x,y,z);
  return '<text x="'+p[0]+'" y="'+p[1]+'" font-size="'+(size||16)+'" text-anchor="middle">'+txt+'</text>';
}

function island(t){
  var grass = t>=6 ? "#B9E9A8" : "#A7E09A";
  var s = "";
  var a=P(-2.5,-2.5,0), b=P(2.5,-2.5,0), c=P(2.5,2.5,0), d=P(-2.5,2.5,0), ap=P(0,0,-3.6);
  s += poly([d,c,ap], "#C79A6E");
  s += poly([c,b,ap], "#A87A52");
  s += box(-2.5,-2.5,5,5,0,.45,grass);
  return s;
}

function decoTree(x,y){
  return box(x,y,.18,.18,.45,.45,"#9C6B45") + pyr(x-.28,y-.28,.75,.75,.85,.95,"#6FCB92");
}
function decoPlanter(x,y,c){
  return box(x,y,.42,.42,.45,.3,"#E08A6E") + pyr(x-.02,y-.02,.46,.46,.75,.38,c||"#7FD3B4");
}
function decoFence(){
  var s="";
  for(var i=-2.2;i<=2.2;i+=.55) s += box(i,2.15,.1,.1,.45,.42,"#FFF3DE");
  s += box(-2.3,2.2,4.7,.06,.82,.08,"#FFF3DE");
  return s;
}
function decoTable(x,y){
  return box(x,y,.5,.5,.45,.05,"#C98A62")
       + box(x+.2,y+.2,.1,.1,.5,.35,"#B4744F")
       + box(x-.05,y-.05,.6,.6,.85,.07,"#FFF6E6")
       + box(x+.25,y+.25,.02,.02,.92,.5,"#B4744F")
       + pyr(x-.35,y-.35,1.2,1.2,1.4,.32,"#FF9EB5");
}
function decoFountain(x,y){
  return box(x,y,1,1,.45,.24,"#EFE0C8")
       + ellipse(x+.5,y+.5,.72,20,10,"#9FDCF5")
       + box(x+.42,y+.42,.16,.16,.69,.5,"#FFF3DE")
       + ellipse(x+.5,y+.5,1.24,7,4,"#CFF0FF");
}
function decoFlag(x,y,z,c){
  return box(x,y,.05,.05,z,.7,"#FFF6E6") + poly([P(x,y,z+.7),P(x+.45,y,z+.55),P(x,y,z+.42)], c);
}

/* 단계별 가게 */
function shopBody(t){
  var T=TIERS[t], s="";
  if(t===0){ /* 포장마차 */
    s += ellipse(-.62,.72,.60,9,9,"#7A5340") + ellipse(-.62,.72,.60,3.5,3.5,"#C79A6E");
    s += ellipse(.78,.72,.60,9,9,"#7A5340") + ellipse(.78,.72,.60,3.5,3.5,"#C79A6E");
    s += box(-.78,-.42,1.56,1.0,.74,.5,T.wall);
    s += faceY(.58,-.62,-.28,.74,1.24,T.trim);
    s += faceY(.58,.06,.40,.74,1.24,T.trim);
    s += box(-.92,-.56,1.84,1.28,1.24,.1,"#FFF6E6");
    s += box(-.84,-.5,.07,.07,1.34,.86,"#C79A6E");
    s += box(.79,-.5,.07,.07,1.34,.86,"#C79A6E");
    s += box(-.84,.66,.07,.07,1.34,.86,"#C79A6E");
    s += box(.79,.66,.07,.07,1.34,.86,"#C79A6E");
    s += pyr(-1.12,-.78,2.16,1.6,2.2,.44,T.roof);
    s += label(0,.62,1.14,"🍡",15);
  } else {
    var floors = t<=3 ? 1 : (t===4 ? 2 : 3);
    var baseW = t<=2 ? 2.1 : (t<=4 ? 2.4 : 2.7);
    var baseD = baseW - .25;
    if(t>=3) s += box(-baseW/2-.45,-baseD/2-.45,baseW+.9,baseD+.9,.45,.12,"#F6E7CE"); /* 데크 */
    var z = t>=3 ? .57 : .45;
    var w=baseW, d=baseD;
    for(var f=0; f<floors; f++){
      var h = f===0 ? 1.45 : 1.15;
      s += box(-w/2,-d/2,w,d,z,h,T.wall);
      /* 창문 */
      s += faceY(d/2,-w/2+.32,-w/2+.85, z+.45, z+h-.32, "#BFE6FF");
      s += faceY(d/2, w/2-.85, w/2-.32, z+.45, z+h-.32, "#BFE6FF");
      s += faceX(w/2,-d/2+.35,-d/2+.9, z+.45, z+h-.32, shade("#BFE6FF",-.12));
      if(f===0){ /* 문 */
        s += faceY(d/2,-.28,.28,z,z+.85,"#C98A62");
        s += faceY(d/2,-.24,.24,z+.04,z+.8,"#E8B98E");
      }
      z += h;
      if(t>=5){ s += box(-w/2-.12,-d/2-.12,w+.24,d+.24,z,.14,T.trim); z+=.14; } /* 케이크 크림 층 */
      if(t>=4 && f===0){ s += box(-w/2-.3,d/2-.02,w+.6,.34,z-.1,.1,T.trim); }   /* 발코니 */
      w -= t>=5 ? .55 : .45; d -= t>=5 ? .55 : .45;
    }
    /* 지붕 */
    s += pyr(-w/2-.55, -d/2-.55, w+1.1, d+1.1, z, t>=5?1.0:.8, T.roof);
    /* 어닝 */
    if(t>=2){
      var ay = baseD/2;
      s += poly([P(-baseW/2,ay,1.35),P(baseW/2,ay,1.35),P(baseW/2,ay+.6,1.02),P(-baseW/2,ay+.6,1.02)], T.roof);
      s += poly([P(-baseW/2,ay+.6,1.02),P(baseW/2,ay+.6,1.02),P(baseW/2,ay+.6,.94),P(-baseW/2,ay+.6,.94)], shade(T.roof,-.25));
    }
    /* 꼭대기 장식 */
    var top = z + (t>=5?1.0:.8);
    if(t===5||t===6) s += ellipse(0,0,top+.2,11,11,"#FF5D73") + ellipse(-.05,-.05,top+.3,4,3,"#FFF3C4",".8");
    if(t===7){ s += pyr(-.4,-.4,.8,.8,top,.5,"#FFD24A") + ellipse(0,0,top+.75,9,9,"#FF5D73"); }
    if(t>=6){ s += decoFlag(-w/2-.5,-d/2-.5,top-.5,"#FFD24A") + decoFlag(w/2+.4,-d/2-.5,top-.5,"#7FD3B4"); }
    s += label(0, baseD/2+.62, 1.24, t>=6?"🍰":(t>=4?"🧁":"🍩"), t>=4?18:15);
  }
  return s;
}

function renderScene(){
  var t = S.tier, s = "";
  s += island(t);
  if(t>=7) s += ellipse(0,0,.46,124,60,"#FFD24A",".22");
  /* 건물 뒤쪽 장식 */
  if(t>=1) s += decoPlanter(-2.05,-1.25,"#7FD3B4");
  if(t>=4) s += decoTree(1.85,-1.9);
  if(t>=6) s += decoFountain(-2.2,-1.95);
  s += ellipse(0,0,.47,58,27,"#5A3D30",".10");
  s += shopBody(t);
  /* 건물 앞쪽 장식 */
  if(t>=2) s += decoTree(-2.05,1.1);
  if(t>=1) s += decoPlanter(2.25,-.3,"#FF9EB5");
  if(t>=3) s += decoTable(1.3,1.45) + decoFence();
  if(t>=7) s += decoPlanter(-2.35,1.9,"#FFD24A") + decoPlanter(2.35,.15,"#FFD24A");
  document.getElementById("scene").innerHTML =
    '<g id="island"><g id="bldg">'+s+'</g></g>';
}

/* =========================================================
   6. UI
   ========================================================= */
var $ = function(id){ return document.getElementById(id); };
var elGold=$("gold"), elGps=$("gps"), elTier=$("tier-name"), elGoal=$("tier-goal"),
    elFill=$("track-fill"), elList=$("list"), elFx=$("fx"), elStage=$("stage");
var tab="staff", mode=1, rows=[];

function buildClouds(){
  var sky=$("sky"), spec=[[8,12,74,20],[62,26,54,15],[26,46,44,12],[76,58,38,11]];
  for(var i=0;i<spec.length;i++){
    var c=document.createElement("div"); c.className="cloud";
    c.style.left=spec[i][0]+"%"; c.style.top=spec[i][1]+"%";
    c.style.width=spec[i][2]+"px"; c.style.height=spec[i][3]+"px";
    c.style.opacity = .55 + i*.08;
    sky.appendChild(c);
  }
}

function buildList(){
  elList.innerHTML=""; rows=[];
  var src = tab==="staff" ? WORKERS : UPS;
  for(var i=0;i<src.length;i++){
    (function(i){
      var d=src[i];
      var b=document.createElement("button");
      b.className="item";
      b.innerHTML='<div class="fill"></div>'
        + '<div class="ic">'+d.ic+'</div>'
        + '<div class="meta"><div class="nm"><span class="t"></span><span class="lv"></span></div><div class="sub"></div></div>'
        + '<div class="px"><div class="c"></div><div class="q"></div></div>';
      b.addEventListener("click", function(){ buy(i); });
      elList.appendChild(b);
      rows.push({el:b, fill:b.querySelector(".fill"), t:b.querySelector(".t"),
                 lv:b.querySelector(".lv"), sub:b.querySelector(".sub"),
                 c:b.querySelector(".c"), q:b.querySelector(".q")});
    })(i);
  }
  refreshList();
}

function countFor(i){
  if(tab==="staff"){
    if(mode==="max") return Math.max(1, maxAffordable(WORKERS[i].cost, WR, S.w[i], S.gold));
    return mode;
  }
  var u=UPS[i], left=u.max - S.u[u.id];
  if(left<=0) return 0;
  var n = mode==="max" ? Math.max(1, maxAffordable(u.cost, u.r, S.u[u.id], S.gold)) : mode;
  return Math.min(n, left);
}

function refreshList(){
  var src = tab==="staff" ? WORKERS : UPS;
  var g = gps();
  for(var i=0;i<src.length;i++){
    var r=rows[i]; if(!r) continue;
    var d=src[i], n=countFor(i), cost, lv, sub, maxed=false;
    if(tab==="staff"){
      lv=S.w[i]; cost=workerCost(i,n||1);
      var each = d.gps*shopMult()*(1+0.10*S.u.mgr);
      sub = "초당 +"+fmt(each) + (lv>0 ? "  (보유 수입 "+fmt(each*lv)+"/초)" : "");
      /* 잠금: 이전 직원을 3명 이상 고용해야 해금 */
      var locked = i>0 && S.w[i-1] < 3 && S.w[i]===0;
      r.el.classList.toggle("locked", locked);
      if(locked){
        r.t.textContent="???"; r.lv.style.display="none";
        r.sub.textContent = WORKERS[i-1].n+" 3명 고용 시 해금";
        r.c.textContent="잠김"; r.q.textContent=""; r.fill.style.width="0%";
        r.el.classList.remove("ok");
        continue;
      }
    } else {
      lv=S.u[d.id]; maxed = lv>=d.max;
      cost = maxed ? Infinity : upCost(d,n||1);
      sub = d.d + "  ·  " + lv + "/" + d.max;
    }
    r.t.textContent = d.n;
    r.lv.style.display = lv>0 ? "" : "none";
    r.lv.textContent = "Lv."+lv;
    r.sub.textContent = sub;
    if(maxed){
      r.c.textContent="MAX"; r.q.textContent=""; r.fill.style.width="100%";
      r.el.classList.add("ok"); r.el.classList.remove("locked");
    }else{
      var ok = S.gold >= cost;
      r.c.textContent = "₲ "+fmt(cost);
      r.q.textContent = (n>1 ? "×"+n : "×1");
      r.fill.style.width = Math.min(100, S.gold/cost*100).toFixed(1)+"%";
      r.el.classList.toggle("ok", ok);
    }
  }
}

function refreshHud(){
  elGold.textContent = fmt(S.gold);
  elGps.textContent = "초당 "+fmt(gps())+"  ·  클릭당 "+fmt(clickPower())
                    + (S.u.crit>0 ? "  ·  크리 "+Math.round(critChance()*100)+"%" : "");
  var T=TIERS[S.tier];
  elTier.textContent = "Lv."+(S.tier+1)+" "+T.n;
  var nx = TIERS[S.tier+1];
  if(nx){
    var p = Math.min(100, S.gold/nx.cost*100);
    elFill.style.width = p.toFixed(1)+"%";
    elGoal.textContent = "다음 단계까지 "+p.toFixed(p<10?1:0)+"%";
    $("ex-name").textContent = nx.n+"(으)로 확장";
    $("ex-desc").textContent = "모든 수입 ×1.7 · 가게 외형이 바뀝니다";
    $("ex-cost").textContent = "₲ "+fmt(nx.cost);
    $("expand").disabled = S.gold < nx.cost;
  }else{
    elFill.style.width="100%";
    elGoal.textContent = "최고 단계 달성";
    $("ex-name").textContent = "모든 확장을 마쳤어요";
    $("ex-desc").textContent = "직원을 늘려 수입을 계속 키워보세요";
    $("ex-cost").textContent = "MAX";
    $("expand").disabled = true;
  }
}

/* =========================================================
   7. 상호작용
   ========================================================= */
function toast(msg){
  var t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._h); t._h=setTimeout(function(){ t.classList.remove("show"); }, 2200);
}
function floatNum(x,y,txt,crit){
  var d=document.createElement("div");
  d.className="float-num"+(crit?" crit":"");
  d.textContent=txt; d.style.left=x+"px"; d.style.top=y+"px";
  elFx.appendChild(d);
  setTimeout(function(){ d.remove(); }, 950);
}
function coins(x,y,n){
  for(var i=0;i<n;i++){
    var c=document.createElement("div"); c.className="coin";
    c.style.left=x+"px"; c.style.top=y+"px";
    c.style.setProperty("--dx", (Math.random()*90-45).toFixed(0)+"px");
    c.style.animationDelay=(i*0.06)+"s";
    elFx.appendChild(c);
    (function(c){ setTimeout(function(){ c.remove(); }, 950); })(c);
  }
}
function sparks(x,y){
  var cols=["#FFCF4A","#FF9EB5","#8FDCC0","#FFF3C4"];
  for(var i=0;i<8;i++){
    var s=document.createElement("div"); s.className="spark";
    s.style.left=x+"px"; s.style.top=y+"px";
    s.style.background=cols[i%cols.length];
    s.style.setProperty("--dx",(Math.random()*140-70).toFixed(0)+"px");
    s.style.setProperty("--dy",(Math.random()*-110-20).toFixed(0)+"px");
    elFx.appendChild(s);
    (function(s){ setTimeout(function(){ s.remove(); }, 950); })(s);
  }
}

var hintHidden=false;
function onTap(ev){
  var r=elStage.getBoundingClientRect();
  var pt = ev.touches && ev.touches[0] ? ev.touches[0] : ev;
  var x = (pt.clientX||r.width/2)-r.left, y=(pt.clientY||r.height/2)-r.top;
  var crit = Math.random() < critChance();
  var gain = clickPower() * (crit?8:1);
  S.gold += gain; S.total += gain; S.clicks++;

  floatNum(x, y, (crit?"CRITICAL ":"+")+fmt(gain), crit);
  coins(x, y, crit?5:2);
  if(crit) sparks(x,y);

  elStage.classList.add("pop");
  clearTimeout(onTap._p); onTap._p=setTimeout(function(){ elStage.classList.remove("pop"); },90);

  if(!hintHidden && S.clicks>4){ hintHidden=true; $("hint").style.display="none"; }
  refreshHud(); refreshList();
}
elStage.addEventListener("pointerdown", onTap);

function buy(i){
  if(tab==="staff"){
    var n=countFor(i);
    var locked = i>0 && S.w[i-1] < 3 && S.w[i]===0;
    if(locked){ toast(WORKERS[i-1].n+"을(를) 3명 고용하면 열려요"); return; }
    var c=workerCost(i,n);
    if(S.gold < c){ toast("골드가 "+fmt(c-S.gold)+" 부족해요"); return; }
    S.gold-=c; S.w[i]+=n;
    toast(WORKERS[i].n+" "+n+"명 합류 · 초당 +"+fmt(WORKERS[i].gps*n*shopMult()*(1+0.10*S.u.mgr)));
  }else{
    var u=UPS[i];
    if(S.u[u.id]>=u.max){ toast("이미 최대 단계예요"); return; }
    var m=countFor(i), cc=upCost(u,m);
    if(S.gold < cc){ toast("골드가 "+fmt(cc-S.gold)+" 부족해요"); return; }
    S.gold-=cc; S.u[u.id]+=m;
    toast(u.n+" Lv."+S.u[u.id]);
  }
  refreshHud(); refreshList(); save();
}

$("expand").addEventListener("click", function(){
  var nx=TIERS[S.tier+1]; if(!nx) return;
  if(S.gold < nx.cost){ toast("골드가 "+fmt(nx.cost-S.gold)+" 부족해요"); return; }
  S.gold -= nx.cost; S.tier++;
  renderScene(); refreshHud(); refreshList(); save();
  $("lv-name").textContent = nx.n;
  var l=$("levelup"); l.classList.remove("go"); void l.offsetWidth; l.classList.add("go");
  var r=elStage.getBoundingClientRect();
  for(var i=0;i<3;i++) sparks(r.width*(.3+i*.2), r.height*.55);
});

var tabsEl=document.querySelectorAll(".tab");
for(var ti=0;ti<tabsEl.length;ti++){
  tabsEl[ti].addEventListener("click", function(){
    for(var k=0;k<tabsEl.length;k++) tabsEl[k].classList.remove("on");
    this.classList.add("on"); tab=this.dataset.tab; buildList();
  });
}
var modeEls=document.querySelectorAll(".mode");
for(var mi=0;mi<modeEls.length;mi++){
  modeEls[mi].addEventListener("click", function(){
    for(var k=0;k<modeEls.length;k++) modeEls[k].classList.remove("on");
    this.classList.add("on");
    mode = this.dataset.m==="max" ? "max" : parseInt(this.dataset.m,10);
    refreshList();
  });
}
$("btn-reset").addEventListener("click", function(){
  if(!confirm("모든 진행 상황을 지우고 처음부터 시작할까요?")) return;
  try{ store.removeItem(SAVE_KEY); }catch(e){}
  location.reload();
});

/* =========================================================
   8. 루프 · 저장 · 오프라인 수익
   ========================================================= */
var last=Date.now(), acc=0, uiAcc=0, coinAcc=0;
function loop(){
  var now=Date.now(), dt=Math.min(1000,(now-last))/1000; last=now;
  var g=gps();
  if(g>0){ var inc=g*dt; S.gold+=inc; S.total+=inc; }
  uiAcc+=dt;
  if(uiAcc>0.12){ uiAcc=0; refreshHud(); refreshList(); }
  coinAcc+=dt;
  if(g>0 && coinAcc>1.1){
    coinAcc=0;
    var r=elStage.getBoundingClientRect();
    coins(r.width*(.35+Math.random()*.3), r.height*(.5+Math.random()*.15), 1);
  }
  acc+=dt;
  if(acc>5){ acc=0; save(); }
  requestAnimationFrame(loop);
}

function boot(){
  buildClouds();
  var d=load();
  if(d && d.t){
    var secs=Math.min((Date.now()-d.t)/1000, 8*3600);
    var earn = gps()*secs*0.5;
    if(secs>60 && earn>0){
      S.gold+=earn; S.total+=earn;
      var mins=Math.floor(secs/60);
      setTimeout(function(){
        toast("자리를 비운 "+(mins>=60? Math.floor(mins/60)+"시간 "+(mins%60)+"분" : mins+"분")+" 동안 ₲"+fmt(earn)+" 벌었어요");
      }, 600);
    }
  }
  if(S.clicks>4){ hintHidden=true; $("hint").style.display="none"; }
  renderScene(); refreshHud(); buildList();
  requestAnimationFrame(loop);
}
document.addEventListener("visibilitychange", function(){ if(document.hidden) save(); });
window.addEventListener("pagehide", save);
window.addEventListener("beforeunload", save);
document.addEventListener("gesturestart", function(e){ e.preventDefault(); });

boot();
})();
</script>
