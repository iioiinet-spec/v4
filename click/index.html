<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFE3B8">
<title>몽글몽글 디저트 타이쿤</title>
<style>
:root{
  --cream:#FFF7EA; --pink:#FF9EB5; --mint:#8FDCC0;
  --amber:#FFB020; --gold:#FFCF4A;
  --cocoa:#5A3D30; --cocoa-soft:#8A6A57;
  --shadow:0 6px 0 rgba(90,61,48,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  color:var(--cocoa);
  background:radial-gradient(1200px 700px at 50% -10%, #FFE7C4 0%, #FFD9E2 45%, #D6E9FF 100%);
  display:flex;align-items:center;justify-content:center;overflow:hidden;user-select:none;
}
.phone{
  position:relative;
  width:min(100vw, calc(100dvh * 9 / 16));
  height:min(100dvh, calc(100vw * 16 / 9));
  display:flex;flex-direction:column;overflow:hidden;
  background:#FFEEDD;
  box-shadow:0 24px 60px rgba(90,61,48,.28);
  border-radius:clamp(0px,3vw,26px);
}
@media (max-aspect-ratio:9/16){ .phone{border-radius:0} }

/* ---------------- HUD ---------------- */
.hud{position:relative;z-index:6;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;display:flex;flex-direction:column;gap:8px}
.hud-top{display:flex;align-items:center;gap:8px}
.gold-box{
  flex:1;display:flex;align-items:center;gap:9px;
  background:linear-gradient(180deg,#FFFDF8,#FFF1DC);
  border:2px solid #fff;border-radius:18px;padding:8px 12px;box-shadow:var(--shadow);
}
.coin-ic{
  width:30px;height:30px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 33% 28%, #FFF6CE, var(--gold) 52%, #DE8F13);
  box-shadow:inset 0 -2px 0 rgba(160,90,0,.4), 0 0 10px rgba(255,190,60,.5);
  display:grid;place-items:center;font-size:14px;font-weight:900;color:#8a5a00;
}
.gold-num{font-size:22px;font-weight:900;letter-spacing:-.5px;line-height:1.05}
.gold-sub{font-size:11px;font-weight:700;color:var(--cocoa-soft);margin-top:1px}
.icon-btn{
  width:38px;height:38px;flex:none;border:2px solid #fff;border-radius:14px;
  background:linear-gradient(180deg,#FFFDF8,#FFEFD8);box-shadow:var(--shadow);
  font-size:16px;display:grid;place-items:center;cursor:pointer;color:var(--cocoa);
}
.icon-btn:active{transform:translateY(2px);box-shadow:0 3px 0 rgba(90,61,48,.18)}
.level-bar{background:rgba(255,255,255,.66);border:2px solid #fff;border-radius:16px;padding:7px 10px;box-shadow:var(--shadow)}
.level-bar .row{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;font-weight:800;margin-bottom:5px}
.level-bar .tier{font-size:12.5px}
.level-bar .goal{color:var(--cocoa-soft)}
.track{height:11px;border-radius:99px;background:rgba(90,61,48,.13);overflow:hidden;position:relative}
.track>span{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,#FFE59A,var(--amber) 60%,#FF8A3D);
  box-shadow:0 0 10px rgba(255,176,32,.75);transition:width .25s ease}
.track::after{content:"";position:absolute;inset:0;border-radius:99px;background:linear-gradient(180deg,rgba(255,255,255,.55),transparent 55%)}

/* ---------------- 무대 ---------------- */
.stage{position:relative;flex:1;min-height:0;overflow:hidden;cursor:pointer;transition:background 1.2s ease}
.sky{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.cloud{position:absolute;border-radius:99px;filter:blur(.3px);animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-12px)}to{transform:translateX(12px)}}
.sun{position:absolute;border-radius:50%;filter:blur(1px)}
.moon{position:absolute;border-radius:50%;background:radial-gradient(circle at 38% 34%,#FFFDF0,#FFE9B8 60%,#F6D48E);
  box-shadow:0 0 26px rgba(255,238,190,.75)}
.star{position:absolute;border-radius:50%;background:#fff;animation:tw ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
.aurora{position:absolute;left:-25%;right:-25%;height:52%;top:-6%;filter:blur(34px);opacity:.55;animation:aur 14s ease-in-out infinite alternate}
@keyframes aur{from{transform:translateX(-6%) skewX(-6deg) scaleY(.9)}to{transform:translateX(6%) skewX(6deg) scaleY(1.15)}}
.mote{position:absolute;border-radius:50%;animation:mote linear infinite}
@keyframes mote{0%{transform:translateY(0) scale(.6);opacity:0}12%{opacity:.9}100%{transform:translateY(-260px) scale(1);opacity:0}}
.hill{position:absolute;bottom:0;border-radius:50% 50% 0 0 / 100% 100% 0 0;opacity:.5}

#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
#bldg{transform-origin:180px 220px;transition:transform .09s ease-out}
.pop #bldg{transform:scale(.955) translateY(3px)}
#island{animation:float 4.6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

.tap-hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);
  font-size:12.5px;font-weight:800;color:var(--cocoa);background:rgba(255,255,255,.8);
  padding:6px 14px;border-radius:99px;border:2px solid #fff;pointer-events:none;animation:hint 1.8s ease-in-out infinite}
@keyframes hint{0%,100%{transform:translate(-50%,0);opacity:.85}50%{transform:translate(-50%,-6px);opacity:1}}

.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.float-num{position:absolute;transform:translate(-50%,-50%);font-size:19px;font-weight:900;color:#fff;
  text-shadow:0 2px 0 #E8971B,0 0 12px rgba(255,176,32,.85);animation:rise .95s cubic-bezier(.2,.7,.3,1) forwards}
.float-num.crit{font-size:26px;color:#FFF3C4;text-shadow:0 2px 0 #E2560B,0 0 16px rgba(255,120,40,.9)}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}18%{opacity:1;transform:translate(-50%,-70%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-190%) scale(.95)}}
.coin{position:absolute;width:16px;height:16px;border-radius:50%;
  background:radial-gradient(circle at 34% 28%,#FFF6CE,var(--gold) 55%,#DE8F13);
  box-shadow:0 0 9px rgba(255,190,60,.85);animation:coinfly .8s ease-in forwards}
@keyframes coinfly{0%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),-140px) scale(.5)}}
.spark{position:absolute;width:9px;height:9px;border-radius:2px;animation:spark .9s ease-out forwards}
@keyframes spark{0%{opacity:1;transform:translate(-50%,-50%) rotate(0) scale(1)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(320deg) scale(.4)}}

/* ---------------- 확장 카드 ---------------- */
.expand{position:relative;z-index:6;margin:0 12px 8px;display:flex;align-items:center;gap:10px;
  background:linear-gradient(180deg,#FFFDF7,#FFEBD3);border:2px solid #fff;border-radius:20px;
  padding:9px 11px;box-shadow:var(--shadow);cursor:pointer;color:inherit;font-family:inherit;text-align:left}
.expand:active{transform:translateY(2px);box-shadow:0 3px 0 rgba(90,61,48,.18)}
.expand[disabled]{opacity:.55;cursor:default}
.expand .badge{width:44px;height:44px;flex:none;border-radius:15px;display:grid;place-items:center;font-size:21px;
  background:linear-gradient(160deg,#FFD98A,#FF9F6B);box-shadow:inset 0 -3px 0 rgba(160,80,20,.25)}
.expand .t1{font-size:13.5px;font-weight:900}
.expand .t2{font-size:11.5px;font-weight:700;color:var(--cocoa-soft);margin-top:2px}
.expand .price{margin-left:auto;text-align:right;font-size:13px;font-weight:900;color:#B8791A;white-space:nowrap}

/* ---------------- 패널 ---------------- */
.panel{position:relative;z-index:6;height:37%;min-height:190px;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#FFFCF5,#FFF3E4);border-top:3px solid #fff;border-radius:26px 26px 0 0;
  box-shadow:0 -8px 24px rgba(90,61,48,.14);padding-bottom:env(safe-area-inset-bottom)}
.tabs{display:flex;gap:6px;padding:10px 12px 6px}
.tab{flex:1;padding:9px 0;border:none;border-radius:14px;cursor:pointer;font-family:inherit;font-size:13px;
  font-weight:800;color:var(--cocoa-soft);background:rgba(90,61,48,.07)}
.tab.on{background:linear-gradient(180deg,#FFD98A,#FFB43C);color:#5A3D30;box-shadow:0 3px 0 rgba(190,120,20,.35)}
.buy-modes{display:flex;gap:5px;padding:0 12px 8px}
.mode{padding:5px 12px;border:none;border-radius:99px;cursor:pointer;font-family:inherit;font-size:11.5px;
  font-weight:800;color:var(--cocoa-soft);background:rgba(90,61,48,.07)}
.mode.on{background:#5A3D30;color:#FFE9C6}
.list{flex:1;overflow-y:auto;padding:0 12px 14px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch}
.list::-webkit-scrollbar{width:0}
.item{position:relative;display:flex;align-items:center;gap:10px;padding:9px 11px;border:2px solid #fff;
  border-radius:18px;background:#fff;box-shadow:0 3px 0 rgba(90,61,48,.12);cursor:pointer;overflow:hidden;
  text-align:left;font-family:inherit;color:inherit}
.item:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(90,61,48,.12)}
.item.locked{opacity:.5;filter:grayscale(.5);cursor:default}
.item .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,rgba(255,207,74,.34),rgba(255,176,32,.12));transition:width .3s}
.item.ok .fill{background:linear-gradient(90deg,rgba(143,220,192,.42),rgba(143,220,192,.14))}
.item>*{position:relative}
.ic{width:40px;height:40px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:20px;
  background:linear-gradient(160deg,#FFF0D6,#FFD9B7);box-shadow:inset 0 -3px 0 rgba(160,110,60,.18)}
.meta{flex:1;min-width:0}
.nm{font-size:13.5px;font-weight:900;display:flex;align-items:center;gap:6px}
.lv{font-size:10.5px;font-weight:900;color:#fff;background:var(--pink);padding:1.5px 7px;border-radius:99px}
.sub{font-size:11px;font-weight:700;color:var(--cocoa-soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.px{text-align:right;flex:none}
.px .c{font-size:12.5px;font-weight:900;color:#B8791A}
.px .q{font-size:10px;font-weight:800;color:var(--cocoa-soft)}
.item.ok .px .c{color:#2E9E77}

.toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 96px);transform:translateX(-50%);z-index:20;
  background:rgba(90,61,48,.92);color:#FFEBC8;padding:9px 16px;border-radius:99px;font-size:12.5px;font-weight:800;
  opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;white-space:nowrap;max-width:88%}
.toast.show{opacity:1;transform:translate(-50%,6px)}
.levelup{position:absolute;inset:0;z-index:15;display:grid;place-items:center;pointer-events:none;opacity:0}
.levelup.go{animation:lvup 1.9s ease-out}
.levelup .card{background:linear-gradient(180deg,#FFF8E6,#FFDFA6);border:3px solid #fff;border-radius:24px;
  padding:16px 26px;text-align:center;box-shadow:0 12px 30px rgba(90,61,48,.34)}
.levelup .k{font-size:12px;font-weight:800;color:#B8791A}
.levelup .v{font-size:24px;font-weight:900;margin-top:3px}
.levelup .m{font-size:11.5px;font-weight:700;color:var(--cocoa-soft);margin-top:5px}
@keyframes lvup{0%{opacity:0;transform:scale(.7)}14%{opacity:1;transform:scale(1.06)}28%{transform:scale(1)}82%{opacity:1}100%{opacity:0;transform:scale(1.02)}}
</style>
</head>
<body>
<div class="phone">
  <header class="hud">
    <div class="hud-top">
      <div class="gold-box">
        <div class="coin-ic">₲</div>
        <div><div class="gold-num" id="gold">0</div><div class="gold-sub" id="gps">초당 0 · 클릭당 1</div></div>
      </div>
      <button class="icon-btn" id="btn-reset" title="처음부터 다시 시작">↻</button>
    </div>
    <div class="level-bar">
      <div class="row"><span class="tier" id="tier-name">Lv.1</span><span class="goal" id="tier-goal">0%</span></div>
      <div class="track"><span id="track-fill"></span></div>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="sky" id="sky"></div>
    <svg id="scene" viewBox="0 0 360 330" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
    <div class="tap-hint" id="hint">가게를 톡톡 두드려 골드를 모으세요</div>
    <div class="fx" id="fx"></div>
    <div class="levelup" id="levelup"><div class="card">
      <div class="k">가게 확장 완료</div><div class="v" id="lv-name">디저트 스탠드</div><div class="m" id="lv-mood"></div>
    </div></div>
    <div class="toast" id="toast"></div>
  </main>

  <button class="expand" id="expand">
    <div class="badge">🏗️</div>
    <div><div class="t1" id="ex-name">확장</div><div class="t2" id="ex-desc"></div></div>
    <div class="price" id="ex-cost">₲ 0</div>
  </button>

  <section class="panel">
    <div class="tabs">
      <button class="tab on" data-tab="staff">직원 고용</button>
      <button class="tab" data-tab="up">클릭 강화</button>
    </div>
    <div class="buy-modes">
      <button class="mode on" data-m="1">×1</button>
      <button class="mode" data-m="10">×10</button>
      <button class="mode" data-m="max">최대</button>
    </div>
    <div class="list" id="list"></div>
  </section>
</div>

<script>
(function(){
"use strict";

/* ============================ 저장소 ============================ */
var store=(function(){
  try{ localStorage.setItem("__t__","1"); localStorage.removeItem("__t__"); return localStorage; }
  catch(e){ var m={}; return {getItem:function(k){return k in m?m[k]:null;},setItem:function(k,v){m[k]=String(v);},removeItem:function(k){delete m[k];}}; }
})();
var SAVE_KEY="dessert_tycoon_v1";

/* ============================ 데이터 ============================ */
var TIERS=[
 {n:"손수레 포장마차", mood:"이른 아침, 골목의 첫 손님",   cost:0,     wall:"#D89A62", roof:"#FF9EB5", trim:"#FFF6E6", accent:"#7FD3B4", sign:"몽글"},
 {n:"디저트 스탠드",   mood:"맑은 낮, 줄 서는 노점",       cost:400,   wall:"#FFE2B8", roof:"#FF8FA8", trim:"#FFFBF0", accent:"#7FD3B4", sign:"몽글"},
 {n:"동네 컵케이크방", mood:"한낮의 골목 상점",           cost:5000,  wall:"#FFEFD6", roof:"#F2708F", trim:"#FFFFFF", accent:"#7FD3B4", sign:"CUPCAKE"},
 {n:"몽글 디저트 카페", mood:"오후 햇살과 야외 테라스",     cost:70000, wall:"#FFF6E8", roof:"#5FC7A6", trim:"#FFFFFF", accent:"#FFB020", sign:"몽글카페"},
 {n:"2층 티하우스",    mood:"노을이 물드는 티타임",        cost:900000,wall:"#FFF1E4", roof:"#F2708F", trim:"#FFE0AE", accent:"#B98BD9", sign:"TEA HOUSE"},
 {n:"3층 케이크 하우스",mood:"별이 켜지는 저녁 거리",       cost:1.5e7, wall:"#FFFBF2", roof:"#FF6F91", trim:"#FFD7E4", accent:"#FFB020", sign:"CAKE HOUSE"},
 {n:"딸기 케이크 궁전", mood:"오로라가 흐르는 밤의 궁전",   cost:2.5e8, wall:"#FFF8EE", roof:"#FF5D7E", trim:"#FFD24A", accent:"#FFD24A", sign:"PALACE"},
 {n:"황금 디저트 팰리스",mood:"황금빛으로 빛나는 전설",     cost:5e9,   wall:"#FFD98F", roof:"#F5A81C", trim:"#FFF6C9", accent:"#FFD24A", sign:"GOLD"}
];
var SHOP_MULT=1.7;

var MOODS=[
 {sky:["#D7EEFF","#FFF3DF","#FFE8CE"], cloud:"rgba(255,255,255,.9)", clouds:3, sun:["#FFF3C8",118,"6%","-14px"], stars:0,  motes:0,  mote:"#FFE7A8", hill:"#BFE3A8"},
 {sky:["#BFE4FF","#EAF6FF","#FFEFD8"], cloud:"rgba(255,255,255,.92)",clouds:4, sun:["#FFF6D2",128,"5%","-18px"], stars:0,  motes:0,  mote:"#FFE7A8", hill:"#AEDD9B"},
 {sky:["#A6D8FF","#DFF1FF","#FFEFD9"], cloud:"rgba(255,255,255,.95)",clouds:5, sun:["#FFF8DC",132,"4%","-16px"], stars:0,  motes:5,  mote:"#FFFFFF", hill:"#A2D894"},
 {sky:["#8FCDFF","#D8EEFF","#FFE6C4"], cloud:"rgba(255,255,255,.95)",clouds:5, sun:["#FFEEB4",150,"4%","-20px"], stars:0,  motes:8,  mote:"#FFC7D8", hill:"#99D48D"},
 {sky:["#FF9E6B","#FFC79A","#FFE3C8"], cloud:"rgba(255,214,190,.85)",clouds:4, sun:["#FFD79A",176,"8%","-26px"], stars:0,  motes:10, mote:"#FFD9A8", hill:"#C98F72"},
 {sky:["#5A5296","#9E6FA6","#FFB183"], cloud:"rgba(255,206,214,.5)", clouds:3, sun:["#FFC49A",150,"10%","-24px"],stars:18, motes:12, mote:"#FFE9B8", hill:"#6B5C8E"},
 {sky:["#1F2A5C","#4B3B87","#93609F"], cloud:"rgba(190,190,255,.28)",clouds:2, sun:null, moon:1, stars:34, motes:16, mote:"#CFE4FF", hill:"#3A3468", aurora:["#7BE8C8","#8FA8FF"]},
 {sky:["#2A1A4C","#6B3E86","#D08B3A"], cloud:"rgba(255,220,160,.3)", clouds:2, sun:null, moon:1, stars:42, motes:22, mote:"#FFDE8A", hill:"#4A2F63", aurora:["#FFD24A","#FF9EB5"]}
];

var WORKERS=[
 {ic:"🧑‍🍳",n:"알바생 몽이",   gps:1,      cost:60},
 {ic:"☕", n:"에스프레소 머신", gps:8,      cost:750},
 {ic:"🧁", n:"컵케이크 오븐",   gps:46,     cost:9000},
 {ic:"🍰", n:"케이크 장인",     gps:260,    cost:110000},
 {ic:"🤖", n:"디저트 로봇",     gps:1400,   cost:1.3e6},
 {ic:"🏭", n:"마카롱 공장",     gps:7800,   cost:1.4e7},
 {ic:"🚁", n:"배달 드론 편대",  gps:44000,  cost:1.7e8},
 {ic:"🚂", n:"디저트 특급열차", gps:260000, cost:2.1e9},
 {ic:"🌈", n:"구름 위 카페",    gps:1.6e6,  cost:2.6e10}
];
var WR=1.15;

var UPS=[
 {id:"click",ic:"👆",n:"손맛 훈련",  d:"클릭당 골드 +2",              cost:25,  r:1.17,max:500},
 {id:"spoon",ic:"🥄",n:"골든 스푼",  d:"클릭 수입 ×1.25",             cost:1500,r:2.5, max:20},
 {id:"crit", ic:"✨",n:"행운의 손길",d:"크리티컬 확률 +2% (×8 골드)", cost:900, r:1.95,max:20},
 {id:"mgr",  ic:"📋",n:"매니저 교육",d:"초당 수입 +10%",              cost:3000,r:2.0, max:25},
 {id:"flyer",ic:"📣",n:"홍보 전단",  d:"클릭 시 초당 수입의 +5% 추가",cost:6000,r:2.7, max:12}
];

/* ============================ 상태 ============================ */
var S={gold:0,total:0,clicks:0,tier:0,w:[],u:{},t:Date.now()};
for(var i0=0;i0<WORKERS.length;i0++) S.w.push(0);
for(var j0=0;j0<UPS.length;j0++) S.u[UPS[j0].id]=0;

function load(){
  try{
    var raw=store.getItem(SAVE_KEY); if(!raw) return null;
    var d=JSON.parse(raw);
    S.gold=+d.gold||0; S.total=+d.total||0; S.clicks=+d.clicks||0;
    S.tier=Math.min(+d.tier||0,TIERS.length-1);
    for(var i=0;i<WORKERS.length;i++) S.w[i]=(d.w&&+d.w[i])||0;
    for(var k in S.u) if(d.u&&d.u[k]) S.u[k]=+d.u[k];
    S.t=+d.t||Date.now(); return d;
  }catch(e){ return null; }
}
function save(){ S.t=Date.now(); try{ store.setItem(SAVE_KEY,JSON.stringify(S)); }catch(e){} }

/* ============================ 계산 ============================ */
function shopMult(){ return Math.pow(SHOP_MULT,S.tier); }
function gps(){ var g=0; for(var i=0;i<WORKERS.length;i++) g+=WORKERS[i].gps*S.w[i];
  return g*shopMult()*(1+0.10*S.u.mgr); }
function clickPower(){ return (1+2*S.u.click)*shopMult()*Math.pow(1.25,S.u.spoon)+gps()*0.05*S.u.flyer; }
function critChance(){ return 0.02*S.u.crit; }
function workerCost(i,n){ var c=WORKERS[i].cost*Math.pow(WR,S.w[i]); return c*(Math.pow(WR,n)-1)/(WR-1); }
function upCost(u,n){ var c=u.cost*Math.pow(u.r,S.u[u.id]); return c*(Math.pow(u.r,n)-1)/(u.r-1); }
function maxAffordable(base,r,lv,gold){ var c=base*Math.pow(r,lv);
  return Math.max(0,Math.floor(Math.log(1+gold*(r-1)/c)/Math.log(r))); }

var UNITS=[[1e20,"해"],[1e16,"경"],[1e12,"조"],[1e8,"억"],[1e4,"만"]];
function fmt(n){
  if(!isFinite(n)) return "∞";
  if(n<10000) return (n<10?Math.round(n*10)/10:Math.floor(n)).toLocaleString("ko-KR");
  for(var i=0;i<UNITS.length;i++) if(n>=UNITS[i][0]){
    var x=n/UNITS[i][0];
    return (x>=100?Math.floor(x):Math.round(x*100)/100)+UNITS[i][1];
  }
  return Math.floor(n).toLocaleString("ko-KR");
}

/* ======================================================================
   아이소메트릭 렌더러
   ====================================================================== */
var OX=180, OY=228, KX=25, KY=12.5, KZ=27;
function P(x,y,z){ return [OX+(x-y)*KX, OY+(x+y)*KY-(z||0)*KZ]; }
function pstr(a){ var s=""; for(var i=0;i<a.length;i++) s+=a[i][0].toFixed(1)+","+a[i][1].toFixed(1)+" "; return s; }
function poly(a,f,op){ return '<polygon points="'+pstr(a).trim()+'" fill="'+f+'"'+(op!=null?' opacity="'+op+'"':'')+'/>'; }
function shade(hex,f){
  var r=parseInt(hex.substr(1,2),16),g=parseInt(hex.substr(3,2),16),b=parseInt(hex.substr(5,2),16);
  function m(v){ return Math.max(0,Math.min(255,Math.round(f>=0?v+(255-v)*f:v*(1+f)))); }
  function h(v){ var s=m(v).toString(16); return s.length<2?"0"+s:s; }
  return "#"+h(r)+h(g)+h(b);
}
var DEFS='<defs>'
+'<linearGradient id="gT" x1="0" y1="0" x2=".7" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".40"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>'
+'<linearGradient id="gL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".26"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#3A2318" stop-opacity=".16"/></linearGradient>'
+'<linearGradient id="gR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".13"/><stop offset=".5" stop-color="#3A2318" stop-opacity=".03"/><stop offset="1" stop-color="#3A2318" stop-opacity=".24"/></linearGradient>'
+'<linearGradient id="gC" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3A2318" stop-opacity=".22"/><stop offset=".34" stop-color="#fff" stop-opacity=".42"/><stop offset="1" stop-color="#3A2318" stop-opacity=".2"/></linearGradient>'
+'<radialGradient id="gS" cx=".33" cy=".28"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#3A2318" stop-opacity=".24"/></radialGradient>'
+'<radialGradient id="warm"><stop offset="0" stop-color="#FFE08A" stop-opacity=".8"/><stop offset="1" stop-color="#FFE08A" stop-opacity="0"/></radialGradient>'
+'<radialGradient id="halo"><stop offset="0" stop-color="#FFD24A" stop-opacity=".55"/><stop offset="1" stop-color="#FFD24A" stop-opacity="0"/></radialGradient>'
+'<filter id="soft" x="-40%" y="-40%" width="190%" height="190%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#3A2318" flood-opacity=".26"/></filter>'
+'</defs>';

/* --- 기본 입체 --- */
function box(x,y,dx,dy,z,h,c){
  var t=z+h;
  var top=[P(x,y,t),P(x+dx,y,t),P(x+dx,y+dy,t),P(x,y+dy,t)];
  var lf=[P(x,y+dy,t),P(x+dx,y+dy,t),P(x+dx,y+dy,z),P(x,y+dy,z)];
  var rf=[P(x+dx,y,t),P(x+dx,y+dy,t),P(x+dx,y+dy,z),P(x+dx,y,z)];
  return poly(top,shade(c,.20))+poly(top,"url(#gT)")
       + poly(lf,shade(c,-.04))+poly(lf,"url(#gL)")
       + poly(rf,shade(c,-.11))+poly(rf,"url(#gR)");
}
function pyr(x,y,dx,dy,z,h,c){
  var ap=P(x+dx/2,y+dy/2,z+h);
  var l=[P(x,y+dy,z),P(x+dx,y+dy,z),ap], r=[P(x+dx,y,z),P(x+dx,y+dy,z),ap];
  return poly([P(x,y,z),P(x+dx,y,z),ap],shade(c,-.32))
       + poly([P(x,y,z),P(x,y+dy,z),ap],shade(c,-.32))
       + poly(l,shade(c,.02))+poly(l,"url(#gL)")
       + poly(r,shade(c,-.2))+poly(r,"url(#gR)");
}
function cyl(x,y,z,r,h,c){
  var b=P(x,y,z),t=P(x,y,z+h),rx=r*KX*1.414,ry=r*KY*1.414;
  var d='M'+(b[0]-rx).toFixed(1)+','+b[1].toFixed(1)
      +' L'+(t[0]-rx).toFixed(1)+','+t[1].toFixed(1)
      +' A'+rx.toFixed(1)+','+ry.toFixed(1)+' 0 0 1 '+(t[0]+rx).toFixed(1)+','+t[1].toFixed(1)
      +' L'+(b[0]+rx).toFixed(1)+','+b[1].toFixed(1)
      +' A'+rx.toFixed(1)+','+ry.toFixed(1)+' 0 0 0 '+(b[0]-rx).toFixed(1)+','+b[1].toFixed(1)+' Z';
  return '<path d="'+d+'" fill="'+shade(c,-.08)+'"/><path d="'+d+'" fill="url(#gC)"/>'
       + '<ellipse cx="'+t[0].toFixed(1)+'" cy="'+t[1].toFixed(1)+'" rx="'+rx.toFixed(1)+'" ry="'+ry.toFixed(1)+'" fill="'+shade(c,.22)+'"/>';
}
function sphere(x,y,z,r,c){
  var p=P(x,y,z),rr=r*KX*1.414;
  return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+rr.toFixed(1)+'" fill="'+c+'"/>'
       + '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+rr.toFixed(1)+'" fill="url(#gS)"/>';
}
function disc(x,y,z,r,c,op){
  var p=P(x,y,z);
  return '<ellipse cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" rx="'+(r*KX*1.414).toFixed(1)+'" ry="'+(r*KY*1.414).toFixed(1)+'" fill="'+c+'"'+(op!=null?' opacity="'+op+'"':'')+'/>';
}
function glow(x,y,z,r,id){
  var p=P(x,y,z);
  return '<ellipse cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" rx="'+r+'" ry="'+(r*0.62)+'" fill="url(#'+(id||"warm")+')"/>';
}
/* 면 위에 평면 그림(현판·창·문 등). 앵커는 면의 좌상단, 로컬 단위 = 월드 단위, +v는 아래쪽 */
function panelY(x,y,z,inner){ var p=P(x,y,z);
  return '<g transform="translate('+p[0].toFixed(1)+','+p[1].toFixed(1)+') matrix('+KX+','+KY+',0,'+KZ+',0,0)">'+inner+'</g>'; }
function panelX(x,y,z,inner){ var p=P(x,y,z);
  return '<g transform="translate('+p[0].toFixed(1)+','+p[1].toFixed(1)+') matrix('+(-KX)+','+KY+',0,'+KZ+',0,0)">'+inner+'</g>'; }

/* --- 평면 부품(로컬 좌표) --- */
function rectL(u,v,w,h,c,rx,op){
  return '<rect x="'+u+'" y="'+v+'" width="'+w+'" height="'+h+'" rx="'+(rx||0)+'" fill="'+c+'"'+(op!=null?' opacity="'+op+'"':'')+'/>';
}
function winL(u,v,w,h,frame,glass,arch){
  var s=arch
    ? '<path d="M'+u+','+(v+h)+' L'+u+','+(v+w/2)+' A'+(w/2)+','+(w/2)+' 0 0 1 '+(u+w)+','+(v+w/2)+' L'+(u+w)+','+(v+h)+' Z" fill="'+frame+'"/>'
    : rectL(u,v,w,h,frame,w*.16);
  var iu=u+.07,iv=v+.07,iw=w-.14,ih=h-.14;
  s+= arch
    ? '<path d="M'+iu+','+(iv+ih)+' L'+iu+','+(iv+iw/2)+' A'+(iw/2)+','+(iw/2)+' 0 0 1 '+(iu+iw)+','+(iv+iw/2)+' L'+(iu+iw)+','+(iv+ih)+' Z" fill="'+glass+'"/>'
    : rectL(iu,iv,iw,ih,glass,iw*.13);
  s+= '<path d="M'+(iu+.05)+','+(iv+ih-.05)+' L'+(iu+iw*.6)+','+(iv+.05)+' L'+(iu+iw*.92)+','+(iv+.05)+' L'+(iu+iw*.42)+','+(iv+ih-.05)+' Z" fill="#fff" opacity=".38"/>';
  s+= rectL(u+w/2-.025,v+.08,.05,h-.16,frame,0,.85);
  return s;
}
function signL(u,v,w,h,txt,bg,fg){
  return rectL(u,v,w,h,bg,h*.34)
    + rectL(u+.05,v+.05,w-.1,h*.34,"#fff",h*.2,.18)
    + '<text x="'+(u+w/2)+'" y="'+(v+h*.7)+'" font-size="'+(h*.56)+'" fill="'+fg+'" text-anchor="middle" font-weight="800" font-family="Pretendard,system-ui,sans-serif">'+txt+'</text>';
}
function stripesL(u,v,w,h,c,step){
  var s="",on=0;
  for(var i=u;i<u+w-0.001;i+=step){ if(on) s+=rectL(i.toFixed(3),v,Math.min(step,u+w-i).toFixed(3),h,c); on=1-on; }
  return s;
}

/* --- 조립 부품 --- */
function awning(x0,x1,y,z,drop,c1,c2,fwd){
  fwd=fwd||.5;
  var back=[P(x0,y,z),P(x1,y,z),P(x1,y+fwd,z-drop),P(x0,y+fwd,z-drop)];
  var s=poly(back,shade(c1,-.02))+poly(back,"url(#gL)");
  var on=0;
  for(var i=x0;i<x1-.001;i+=.26){
    var e=Math.min(i+.26,x1);
    if(on) s+=poly([P(i,y,z),P(e,y,z),P(e,y+fwd,z-drop),P(i,y+fwd,z-drop)],c2,.9);
    on=1-on;
  }
  /* 앞 자락 스캘럽 */
  for(var k=x0;k<x1-.001;k+=.26){
    var p=P(Math.min(k+.13,x1),y+fwd,z-drop);
    s+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="4.4" fill="'+shade(c1,-.06)+'"/>';
  }
  s+=poly([P(x0,y+fwd,z-drop),P(x1,y+fwd,z-drop),P(x1,y+fwd,z-drop-.08),P(x0,y+fwd,z-drop-.08)],shade(c1,-.2));
  return s;
}
function railing(x0,x1,y,z,c){
  var s="";
  for(var i=x0;i<=x1+.001;i+=.28) s+=box(i-.03,y-.03,.06,.06,z,.3,c);
  s+=box(x0-.05,y-.05,x1-x0+.1,.1,z+.3,.08,shade(c,-.05));
  return s;
}
function steps(cx,y,w,ztop){
  return box(cx-w/2,y,w,.34,.45,Math.max(.07,ztop-.45-.07),"#EFDFC2")
       + poly([P(cx-w/2+.08,y+.06,.45+.02),P(cx+w/2-.08,y+.06,.45+.02),
               P(cx+w/2-.08,y+.3,.45+.02),P(cx-w/2+.08,y+.3,.45+.02)],"#D9435E",.85);
}
function lamp(x,y,z,c,lit){
  var s=box(x-.05,y-.05,.1,.1,z,.95,"#6E5140")+box(x-.09,y-.09,.18,.18,z+.95,.1,"#6E5140");
  s+=sphere(x,y,z+1.16,.13,lit?"#FFE9A8":"#FFF6E0");
  if(lit) s+=glow(x,y,z+1.16,26);
  return s;
}
function stringLights(x0,x1,y,z,n){
  var s="",a=P(x0,y,z),b=P(x1,y,z);
  s+='<path d="M'+a[0].toFixed(1)+','+a[1].toFixed(1)+' Q'+((a[0]+b[0])/2).toFixed(1)+','+((a[1]+b[1])/2+16).toFixed(1)+' '+b[0].toFixed(1)+','+b[1].toFixed(1)+'" fill="none" stroke="#8A6A57" stroke-width="1.2" opacity=".8"/>';
  for(var i=1;i<n;i++){
    var t=i/n, mx=(1-t)*(1-t)*a[0]+2*(1-t)*t*((a[0]+b[0])/2)+t*t*b[0];
    var my=(1-t)*(1-t)*a[1]+2*(1-t)*t*((a[1]+b[1])/2+16)+t*t*b[1];
    var col=["#FFE08A","#FF9EB5","#8FDCC0"][i%3];
    s+='<circle cx="'+mx.toFixed(1)+'" cy="'+(my+3).toFixed(1)+'" r="3.1" fill="'+col+'"/>'
      +'<circle cx="'+mx.toFixed(1)+'" cy="'+(my+3).toFixed(1)+'" r="6.5" fill="'+col+'" opacity=".28"/>';
  }
  return s;
}
function drip(x0,x1,y,z,c){ /* 케이크 크림 흘러내림 */
  var s="";
  for(var i=x0;i<=x1+.001;i+=.22){
    var p=P(i,y,z);
    s+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="5.2" fill="'+c+'"/>';
    var q=P(i+.11,y,z-.09);
    s+='<circle cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="3.4" fill="'+shade(c,-.05)+'"/>';
  }
  return s;
}
function wheel(x,y,z,r){
  return disc(x,y,z,r,"#5F4132")+disc(x,y,z,r*.62,"#C79A6E")+disc(x,y,z,r*.2,"#8A6A57");
}

/* --- 장식 --- */
function tree(x,y,z){
  return cyl(x,y,z,.09,.42,"#9C6B45")
    + pyr(x-.42,y-.42,.84,.84,z+.34,.62,"#5FBF8B")
    + pyr(x-.34,y-.34,.68,.68,z+.76,.56,"#6FCB92")
    + pyr(x-.24,y-.24,.48,.48,z+1.16,.46,"#82D7A0");
}
function planter(x,y,z,c){
  var s=box(x-.24,y-.24,.48,.48,z,.3,"#E08A6E")+box(x-.27,y-.27,.54,.54,z+.28,.07,"#F2A585");
  s+=disc(x,y,z+.36,.22,"#5FBF8B");
  s+=sphere(x-.1,y-.06,z+.44,.09,c)+sphere(x+.12,y+.04,z+.46,.08,shade(c,.12))+sphere(x,y+.14,z+.42,.07,"#FFF3C4");
  return s;
}
function parasol(x,y,z,c){
  var s=cyl(x,y,z,.34,.05,"#EFE0C8")+cyl(x,y,z,.06,.5,"#C0A184")+cyl(x,y,z+.5,.42,.06,"#FFF6E6");
  s+=cyl(x,y,z+.56,.03,.85,"#B58F6E");
  s+=pyr(x-.62,y-.62,1.24,1.24,z+1.3,.34,c);
  s+=disc(x,y,z+1.3,.62,shade(c,-.12),.35);
  s+=sphere(x-.18,y-.1,z+.62,.09,"#FF9EB5")+sphere(x+.16,y+.06,z+.62,.09,"#FFD24A");
  return s;
}
function fountain(x,y,z){
  var s=cyl(x,y,z,.62,.26,"#EFE3CC")+disc(x,y,z+.26,.5,"#9FDCF5")+disc(x,y,z+.27,.5,"#CFF0FF",.4);
  s+=cyl(x,y,z+.26,.1,.62,"#F7EEDC")+disc(x,y,z+.88,.26,"#FFF6E6");
  s+=sphere(x,y,z+1.02,.11,"#BFE9FF");
  s+=glow(x,y,z+.9,30);
  return s;
}
function fence(z){
  var s="";
  for(var i=-2.3;i<=2.3;i+=.52) s+=box(i-.05,2.18,.1,.1,z,.36,"#FFF3DE");
  s+=box(-2.4,2.21,4.8,.05,z+.26,.07,"#FFF3DE");
  s+=box(-2.4,2.21,4.8,.05,z+.13,.06,"#FFEBCD");
  return s;
}
function path(z){
  var s="";
  for(var i=0;i<4;i++){
    var y=1.35+i*.32;
    s+=poly([P(-.34,y,z+.01),P(.34,y,z+.01),P(.34,y+.24,z+.01),P(-.34,y+.24,z+.01)],"#F3E4CA",.95);
  }
  return s;
}
function carpet(z){
  return poly([P(-.42,1.2,z+.01),P(.42,1.2,z+.01),P(.42,2.5,z+.01),P(-.42,2.5,z+.01)],"#D9435E")
       + poly([P(-.34,1.2,z+.02),P(.34,1.2,z+.02),P(.34,2.5,z+.02),P(-.34,2.5,z+.02)],"#E85A75");
}

/* --- 섬 --- */
function island(t){
  var grass = t>=7?"#CBE8A6" : (t>=5?"#8FD69A":"#A7E09A");
  var rock1 = t>=7?"#C2A06A":"#C79A6E", rock2=t>=7?"#9E7C4C":"#A87A52";
  var s="";
  var b=P(2.5,-2.5,0), c=P(2.5,2.5,0), d=P(-2.5,2.5,0), ap=P(0,0,-3.9), ap2=P(-.4,-.2,-2.6);
  s+=poly([d,c,ap],rock1)+poly([d,c,ap],"url(#gL)");
  s+=poly([c,b,ap],rock2)+poly([c,b,ap],"url(#gR)");
  s+=poly([d,ap,ap2],shade(rock1,-.12));
  s+=box(-2.5,-2.5,5,5,0,.45,grass);
  /* 잔디 위 작은 꽃 */
  var flowers=[[-2.0,1.9,"#FF9EB5"],[1.9,-2.0,"#FFD24A"],[-1.6,-2.1,"#FFF3C4"],[2.1,1.7,"#B98BD9"],[-2.2,-.6,"#FF9EB5"]];
  for(var i=0;i<flowers.length;i++) if(t>=1||i<2) s+=disc(flowers[i][0],flowers[i][1],.46,.07,flowers[i][2]);
  if(t>=6){ /* 떠 있는 작은 조각섬 */
    s+=box(-3.5,.4,.7,.7,-.5,.24,grass)+poly([P(-3.5,1.1,-.5),P(-2.8,1.1,-.5),P(-3.15,.75,-1.2)],rock2);
    s+=box(3.0,-1.2,.6,.6,-.2,.22,grass)+poly([P(3.0,-.6,-.2),P(3.6,-.6,-.2),P(3.3,-.9,-.85)],rock2);
  }
  return s;
}

/* --- 1단계: 손수레 --- */
function cart(T){
  var s="";
  s+=wheel(-.66,.8,.62,.26)+wheel(.82,.8,.62,.26);
  s+=box(-.8,-.42,1.6,1.02,.7,.5,T.wall);
  s+=panelY(-.8,.6,1.2, rectL(0,0,1.6,.5,shade(T.wall,.06))+stripesL(0,0,1.6,.5,"#FFF6E6",.2,.85)
      + rectL(0,.42,1.6,.08,shade(T.wall,-.18)));
  s+=box(-.95,-.56,1.9,1.3,1.2,.11,T.trim);
  /* 진열 */
  s+=sphere(-.52,.02,1.44,.15,"#FF9EB5")+sphere(-.16,.1,1.44,.15,"#FFD24A")+sphere(.2,-.02,1.44,.15,"#8FDCC0");
  s+=box(.5,-.16,.34,.34,1.31,.26,"#FFF6E6")+disc(.67,.01,1.57,.16,"#FFB6C8");
  /* 기둥 & 차양 */
  var pz=1.31;
  s+=box(-.86,-.5,.07,.07,pz,.88,"#B58F6E")+box(.79,-.5,.07,.07,pz,.88,"#B58F6E");
  s+=box(-.86,.66,.07,.07,pz,.88,"#B58F6E")+box(.79,.66,.07,.07,pz,.88,"#B58F6E");
  var cz=pz+.88;
  s+=box(-1.05,-.7,2.1,1.5,cz,.06,"#EFE0C8");
  s+=pyr(-1.16,-.8,2.32,1.7,cz+.06,.46,T.roof);
  /* 줄무늬 차양 */
  var ap=P(0,-.8+.85,cz+.52);
  for(var i=0;i<6;i++){
    var x0=-1.16+i*.387, x1=x0+.193;
    s+=poly([P(x0,.9,cz+.06),P(x1,.9,cz+.06),ap],"#FFF6E6",.55);
  }
  s+=panelY(-.52,.68,1.72, signL(0,0,1.04,.4,T.sign,"#5A3D30","#FFE9C6"));
  s+=lamp(1.05,.62,1.31,"#FFE9A8",1);
  return s;
}

/* --- 2단계: 스탠드 --- */
function stand(T){
  var s="";
  s+=box(-1.5,-1.35,3.0,2.7,.45,.14,"#E7CFA8");
  s+=steps(0,1.35,1.0,.59);
  s+=box(-1.2,-1.05,2.4,1.5,.59,1.05,T.wall);
  s+=panelY(-1.2,.45,1.64, rectL(0,0,2.4,1.05,shade(T.wall,.05))
    + rectL(0,.66,2.4,.39,shade(T.wall,-.1))
    + winL(.2,.4,.68,.5,T.trim,"#CFEBFF")
    + winL(1.52,.4,.68,.5,T.trim,"#CFEBFF")

var HCFG=[null,null,
 {w:2.15,d:1.85,fl:[1.92],       roofH:.92,shr:.4},
 {w:2.45,d:2.05,fl:[1.98],      roofH:1.0,shr:.4},
 {w:2.45,d:2.05,fl:[1.95,1.24], roofH:.96,shr:.44},
 {w:2.55,d:2.15,fl:[1.95,1.24,1.02], roofH:1.02,shr:.42,cake:1},
 {w:2.8, d:2.35,fl:[2.0,1.28,1.06],  roofH:1.12,shr:.44,cake:1,col:1},
 {w:2.9, d:2.45,fl:[2.05,1.32,1.1],  roofH:1.18,shr:.44,cake:1,col:1}
];
function frontFace(t,T,f,x0,y,ztop,w,h){
  var g=t>=6?"#DCF2FF":"#CFEBFF", fr=T.trim, inner="";
  inner+=rectL(0,0,w,h,shade(T.wall,.04));
  if(t>=6) inner+=rectL(0,0,w,.1,T.accent)+rectL(0,h-.12,w,.12,T.accent,0,.85);
  if(f===0){
    var dw=.68,du=w/2-dw/2, dh=.94, dv=h-dh;
    inner+=signL(w/2-.76,.1,1.52,.4,T.sign,t>=7?"#7A4E0E":"#5A3D30",t>=7?"#FFF3C4":"#FFE9C6");
    inner+=rectL(du-.08,dv-.1,dw+.16,dh+.1,fr,.1);
    inner+= t>=6
      ? '<path d="M'+du+','+h+' L'+du+','+(dv+dw/2)+' A'+(dw/2)+','+(dw/2)+' 0 0 1 '+(du+dw)+','+(dv+dw/2)+' L'+(du+dw)+','+h+' Z" fill="#B07A52"/>'
      : rectL(du,dv,dw,dh,"#B07A52",.08);
    inner+=rectL(du+.06,dv+.14,dw-.12,dh*.4,g,.06,.6);
    inner+='<circle cx="'+(du+dw-.14)+'" cy="'+(dv+dh*.55)+'" r=".05" fill="'+T.accent+'"/>';
    inner+=winL(.2,h-.98,.62,.58,fr,g,t>=6);
    inner+=winL(w-.82,h-.98,.62,.58,fr,g,t>=6);
    if(t>=3){ inner+=rectL(.16,h-.3,.7,.18,"#E08A6E",.04)+rectL(w-.86,h-.3,.7,.18,"#E08A6E",.04); }
  }else{
    inner+=winL(.22,h*.3,.6,h*.5,fr,g,t>=6);
    inner+=winL(w-.82,h*.3,.6,h*.5,fr,g,t>=6);
    if(t>=4){ /* 발코니 문 */
      inner+=rectL(w/2-.3,h*.22,.6,h*.7,fr,.08)+rectL(w/2-.25,h*.26,.5,h*.62,g,.06);
    }
  }
  return panelY(x0,y,ztop,inner);
}
function sideFace(t,T,f,x,y0,ztop,d,h){
  var g=t>=6?"#DCF2FF":"#CFEBFF", inner="";
  inner+=winL(.3,h*.3,.55,h*.46,T.trim,g,t>=6);
  inner+=winL(d-.85,h*.3,.55,h*.46,T.trim,g,t>=6);
  if(t>=6) inner+=rectL(0,0,d,.1,T.accent);
  return panelX(x,y0,ztop,inner);
}
function house(t,T){
  var C=HCFG[t], s="", z=.45, dm=(t>=4?.6:.42);
  /* 데크 */
  s+=box(-C.w/2-dm,-C.d/2-dm,C.w+dm*2,C.d+dm*2,z,.15,shade(T.trim,-.07)); z+=.15;
  s+=poly([P(-C.w/2-dm+.12,-C.d/2-dm+.12,z),P(C.w/2+dm-.12,-C.d/2-dm+.12,z),
           P(C.w/2+dm-.12,C.d/2+dm-.12,z),P(-C.w/2-dm+.12,C.d/2+dm-.12,z)],shade(T.trim,.06));
  if(t>=6) s+=carpet(z);
  s+=steps(0,C.d/2+dm,.9,z);
  var w=C.w,d=C.d, deckZ=z, tops=[];
  for(var f=0;f<C.fl.length;f++){
    var h=C.fl[f];
    s+=box(-w/2,-d/2,w,d,z,h,T.wall);
    s+=sideFace(t,T,f,w/2,-d/2,z+h,d,h);
    s+=frontFace(t,T,f,-w/2,d/2,z+h,w,h);
    z+=h;
    if(C.cake){
      s+=box(-w/2-.15,-d/2-.15,w+.3,d+.3,z,.17,T.trim);
      s+=drip(-w/2-.15,w/2+.15,d/2+.15,z+.02,T.trim);
      z+=.17;
    }else{
      s+=box(-w/2-.11,-d/2-.11,w+.22,d+.22,z,.11,T.trim); z+=.11;
    }
    tops.push({z:z,w:w,d:d});
    if(f===0){
      s+=awning(-w/2+.05,w/2-.05,d/2+.01,deckZ+C.fl[0]-.6,.2,T.roof,"#FFF6E6",.46);
      if(C.col){ /* 입구 기둥 */
        s+=cyl(-w/2+.22,d/2+.42,deckZ,.14,C.fl[0]-.1,T.trim)+cyl(w/2-.22,d/2+.42,deckZ,.14,C.fl[0]-.1,T.trim);
        s+=box(-w/2+.06,d/2+.26,.32,.32,deckZ+C.fl[0]-.1,.12,T.accent);
        s+=box(w/2-.38,d/2+.26,.32,.32,deckZ+C.fl[0]-.1,.12,T.accent);
      }
      if(t>=4) s+=railing(-w/2-.1,w/2+.1,d/2+.14,z,T.trim);
    }
    if(f===1 && t>=5) s+=railing(-w/2+.3,w/2-.3,d/2+.1,z,T.trim);
    w-=C.shr; d-=C.shr;
  }
  /* 지붕 */
  s+=box(-w/2-.34,-d/2-.34,w+.68,d+.68,z,.12,shade(T.roof,-.1)); z+=.12;
  s+=pyr(-w/2-.3,-d/2-.3,w+.6,d+.6,z,C.roofH,T.roof);
  var top=z+C.roofH;
  if(t>=5){ /* 딸기 */
    s+=sphere(0,0,top+.2,.2,"#FF4E68");
    s+=poly([P(-.12,-.06,top+.34),P(.1,-.1,top+.32),P(.02,.12,top+.36)],"#5FBF8B");
  }
  if(t>=6){
    s+=cyl(0,0,top+.34,.05,.5,"#FFD24A");
    s+=poly([P(0,0,top+.84),P(.5,0,top+.7),P(0,0,top+.6)],T.accent);
  }
  if(t>=7){
    /* 왕관 */
    s+=cyl(0,0,top+.16,.3,.14,"#FFD24A");
    s+=pyr(-.26,-.26,.52,.52,top+.3,.42,"#FFD24A");
    s+=sphere(0,0,top+.78,.12,"#FF4E68");
    s+=glow(0,0,top+.4,52,"halo");
  }
  /* 굴뚝 */
  if(t>=4) s+=box(w/2-.42,-d/2+.05,.3,.3,z+.06,.62,shade(T.trim,-.1))+box(w/2-.46,-d/2+.01,.38,.38,z+.68,.09,shade(T.trim,-.2));
  /* 조명 */
  if(t>=3){
    s+=lamp(-C.w/2-.9,C.d/2+.5,deckZ,"#FFE9A8",1);
    s+=lamp(C.w/2+.9,C.d/2+.5,deckZ,"#FFE9A8",1);
    s+=stringLights(-C.w/2-.8,C.w/2+.8,C.d/2+.5,deckZ+1.7,8);
  }
  s+=glow(0,C.d/2+.3,deckZ+.3,42);
  return s;
}
function shopBody(t){

var $=function(id){ return document.getElementById(id); };
var elGold=$("gold"),elGps=$("gps"),elTier=$("tier-name"),elGoal=$("tier-goal"),
    elFill=$("track-fill"),elList=$("list"),elFx=$("fx"),elStage=$("stage");
var tab="staff", mode=1, rows=[];

function buildList(){
  elList.innerHTML=""; rows=[];
  var src=tab==="staff"?WORKERS:UPS;
  for(var i=0;i<src.length;i++){(function(i){
    var d=src[i], b=document.createElement("button");
    b.className="item";
    b.innerHTML='<div class="fill"></div><div class="ic">'+d.ic+'</div>'
      +'<div class="meta"><div class="nm"><span class="t"></span><span class="lv"></span></div><div class="sub"></div></div>'
      +'<div class="px"><div class="c"></div><div class="q"></div></div>';
    b.addEventListener("click",function(){ buy(i); });
    elList.appendChild(b);
    rows.push({el:b,fill:b.querySelector(".fill"),t:b.querySelector(".t"),lv:b.querySelector(".lv"),
               sub:b.querySelector(".sub"),c:b.querySelector(".c"),q:b.querySelector(".q")});
  })(i);}
  refreshList();
}
function countFor(i){
  if(tab==="staff") return mode==="max"?Math.max(1,maxAffordable(WORKERS[i].cost,WR,S.w[i],S.gold)):mode;
  var u=UPS[i], left=u.max-S.u[u.id];
  if(left<=0) return 0;
  var n=mode==="max"?Math.max(1,maxAffordable(u.cost,u.r,S.u[u.id],S.gold)):mode;
  return Math.min(n,left);
}
function refreshList(){
  var src=tab==="staff"?WORKERS:UPS;
  for(var i=0;i<src.length;i++){
    var r=rows[i]; if(!r) continue;
    var d=src[i], n=countFor(i), cost, lv, sub, maxed=false;
    if(tab==="staff"){
      lv=S.w[i]; cost=workerCost(i,n||1);
      var each=d.gps*shopMult()*(1+0.10*S.u.mgr);
      sub="초당 +"+fmt(each)+(lv>0?"  (보유 "+fmt(each*lv)+"/초)":"");
      var locked=i>0&&S.w[i-1]<3&&S.w[i]===0;
      r.el.classList.toggle("locked",locked);
      if(locked){
        r.t.textContent="???"; r.lv.style.display="none";
        r.sub.textContent=WORKERS[i-1].n+" 3명 고용 시 해금";
        r.c.textContent="잠김"; r.q.textContent=""; r.fill.style.width="0%";
        r.el.classList.remove("ok"); continue;
      }
    }else{
      lv=S.u[d.id]; maxed=lv>=d.max; cost=maxed?Infinity:upCost(d,n||1);
      sub=d.d+"  ·  "+lv+"/"+d.max;
    }
    r.t.textContent=d.n;
    r.lv.style.display=lv>0?"":"none"; r.lv.textContent="Lv."+lv;
    r.sub.textContent=sub;
    if(maxed){ r.c.textContent="MAX"; r.q.textContent=""; r.fill.style.width="100%"; r.el.classList.add("ok"); }
    else{
      var ok=S.gold>=cost;
      r.c.textContent="₲ "+fmt(cost);
      r.q.textContent=n>1?"×"+n:"×1";
      r.fill.style.width=Math.min(100,S.gold/cost*100).toFixed(1)+"%";
      r.el.classList.toggle("ok",ok);
    }
  }
}
function refreshHud(){
  elGold.textContent=fmt(S.gold);
  elGps.textContent="초당 "+fmt(gps())+"  ·  클릭당 "+fmt(clickPower())
    +(S.u.crit>0?"  ·  크리 "+Math.round(critChance()*100)+"%":"");
  elTier.textContent="Lv."+(S.tier+1)+" "+TIERS[S.tier].n;
  var nx=TIERS[S.tier+1];

    elFill.style.width=p.toFixed(1)+"%";

    $("ex-desc").textContent=nx.mood+" · 모든 수입 ×1.7";

function toast(msg){
  var t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._h); t._h=setTimeout(function(){ t.classList.remove("show"); },2200);
}
function floatNum(x,y,txt,crit){
  var d=document.createElement("div");
  d.className="float-num"+(crit?" crit":""); d.textContent=txt;
  d.style.left=x+"px"; d.style.top=y+"px"; elFx.appendChild(d);

  var cols=["#FFCF4A","#FF9EB5","#8FDCC0","#FFF3C4"];
  for(var i=0;i<8;i++){
    var s=document.createElement("div"); s.className="spark";

var hintHidden=false;
function onTap(ev){
  var r=elStage.getBoundingClientRect(), pt=ev.touches&&ev.touches[0]?ev.touches[0]:ev;
  var x=(pt.clientX||r.width/2)-r.left, y=(pt.clientY||r.height/2)-r.top;
  var crit=Math.random()<critChance(), gain=clickPower()*(crit?8:1);
  S.gold+=gain; S.total+=gain; S.clicks++;
  floatNum(x,y,(crit?"CRITICAL ":"+")+fmt(gain),crit);
  coins(x,y,crit?5:2);
  if(crit) sparks(x,y);
  elStage.classList.add("pop");
  clearTimeout(onTap._p); onTap._p=setTimeout(function(){ elStage.classList.remove("pop"); },90);
  if(!hintHidden&&S.clicks>4){ hintHidden=true; $("hint").style.display="none"; }
  refreshHud(); refreshList();
}
elStage.addEventListener("pointerdown",onTap);

function buy(i){
  if(tab==="staff"){
    if(i>0&&S.w[i-1]<3&&S.w[i]===0){ toast(WORKERS[i-1].n+"을(를) 3명 고용하면 열려요"); return; }
    var n=countFor(i), c=workerCost(i,n);
    if(S.gold<c){ toast("골드가 "+fmt(c-S.gold)+" 부족해요"); return; }
    S.gold-=c; S.w[i]+=n;
    toast(WORKERS[i].n+" "+n+"명 합류 · 초당 +"+fmt(WORKERS[i].gps*n*shopMult()*(1+0.10*S.u.mgr)));
  }else{
    var u=UPS[i];
    if(S.u[u.id]>=u.max){ toast("이미 최대 단계예요"); return; }
    var m=countFor(i), cc=upCost(u,m);
    if(S.gold<cc){ toast("골드가 "+fmt(cc-S.gold)+" 부족해요"); return; }
    S.gold-=cc; S.u[u.id]+=m; toast(u.n+" Lv."+S.u[u.id]);
  }
  refreshHud(); refreshList(); save();
}

  var l=$("levelup"); l.classList.remove("go"); void l.offsetWidth; l.classList.add("go");

var last=Date.now(),acc=0,uiAcc=0,coinAcc=0;
function loop(){
  var now=Date.now(), dt=Math.min(1000,now-last)/1000; last=now;
  var g=gps();
  if(g>0){ var inc=g*dt; S.gold+=inc; S.total+=inc; }
  uiAcc+=dt; if(uiAcc>0.12){ uiAcc=0; refreshHud(); refreshList(); }
  coinAcc+=dt;
  if(g>0&&coinAcc>1.1){
    coinAcc=0;
    var r=elStage.getBoundingClientRect();
    coins(r.width*(.35+Math.random()*.3), r.height*(.5+Math.random()*.15),1);
  }
  acc+=dt; if(acc>5){ acc=0; save(); }
  requestAnimationFrame(loop);
}
function boot(){
  var d=load();
  if(d&&d.t){
    var secs=Math.min((Date.now()-d.t)/1000,8*3600), earn=gps()*secs*0.5;
    if(secs>60&&earn>0){
      S.gold+=earn; S.total+=earn;
      var mins=Math.floor(secs/60);
      setTimeout(function(){
        toast("자리를 비운 "+(mins>=60?Math.floor(mins/60)+"시간 "+(mins%60)+"분":mins+"분")+" 동안 ₲"+fmt(earn)+" 벌었어요");
      },600);
    }
  }
  if(S.clicks>4){ hintHidden=true; $("hint").style.display="none"; }
  applyMood(S.tier); renderScene(); refreshHud(); buildList();
  requestAnimationFrame(loop);
}
document.addEventListener("visibilitychange",function(){ if(document.hidden) save(); });
window.addEventListener("pagehide",save);
window.addEventListener("beforeunload",save);
document.addEventListener("gesturestart",function(e){ e.preventDefault(); });
boot();
})();
</script>
</body>
</html>
