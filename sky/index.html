<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>스카이 에이스 - 공중전</title>
<style>
  html,body{margin:0;height:100%;background:#05080f;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
  canvas{position:absolute;display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';
const W = 480, H = 760;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let scale = 1, dpr = 1;

function resize() {
  dpr = window.devicePixelRatio || 1;
  const iw = innerWidth, ih = innerHeight;
  scale = Math.min(iw / W, ih / H);
  const cw = W * scale, ch = H * scale;
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  cv.style.left = (iw - cw) / 2 + 'px'; cv.style.top = (ih - ch) / 2 + 'px';
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
}
addEventListener('resize', resize); resize();

/* ---------- utils ---------- */
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- audio ---------- */
let ac = null, muted = false;
function initAudio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (ac && ac.state === 'suspended') ac.resume();
}
function tone(f1, f2, dur, type, vol) {
  if (!ac || muted) return;
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f1, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + dur);
}
function noise(dur, vol) {
  if (!ac || muted) return;
  const n = (ac.sampleRate * dur) | 0, b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = ac.createBufferSource(), g = ac.createGain();
  s.buffer = b; g.gain.value = vol; s.connect(g); g.connect(ac.destination); s.start();
}

/* ---------- state ---------- */
let state = 'title'; // title | play | pause | admin | over
let hi = 0, newRecord = false;
try { hi = +localStorage.getItem('skyAceHi') || 0; } catch (e) {}

let P, pb, eb, ms, en, pu, pt, texts;
let score, stage, stageTime, spawnT, shake, bannerObj, overT, time = 0, kills;
let isTouch = false;

const keys = {};
const touch = { active: false, id: null, x: 0, y: 0, ox: 0, oy: 0 };

function reset() {
  P = { x: W / 2, y: H - 120, speed: 320, hp: 100, lives: 3, weapon: 1, missiles: 3,
        fire: 0, mcd: 0, inv: 2, dead: false, respawn: 0, bank: 0, px: W / 2,
        god: false, rof: 1 };
  pb = []; eb = []; ms = []; en = []; pu = []; pt = []; texts = [];
  score = 0; stage = 1; stageTime = 0; spawnT = 1.5; shake = 0; kills = 0;
  bannerObj = null; overT = 0; newRecord = false; admSel = 1;
  banner('STAGE 1', 2);
}
function banner(text, t) { bannerObj = { text, t, max: t }; }
const diff = () => 1 + (stage - 1) * 0.25;

/* ===== 3D 느낌 기체·무기 렌더러 (sky-ace 삽입용) ===== */

/* 색 보정: amt>0 밝게, amt<0 어둡게 */
function tint(hex, amt) {
  let h = hex.replace('#', '');
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  let r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
  if (amt >= 0) { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
  else { r *= 1 + amt; g *= 1 + amt; b *= 1 + amt; }
  return 'rgb(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ')';
}
function lg(x0, y0, x1, y1, stops) {
  const g = ctx.createLinearGradient(x0, y0, x1, y1);
  for (const s of stops) g.addColorStop(s[0], s[1]);
  return g;
}
function rg(x, y, r0, r1, stops) {
  const g = ctx.createRadialGradient(x, y, r0, x, y, r1);
  for (const s of stops) g.addColorStop(s[0], s[1]);
  return g;
}
function poly(pts) {
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++) i ? ctx.lineTo(pts[i][0], pts[i][1]) : ctx.moveTo(pts[i][0], pts[i][1]);
  ctx.closePath();
}
/* 원통형 동체 음영 (왼쪽 위 광원) */
function tube(w, base) {
  return lg(-w, 0, w, 0, [
    [0, tint(base, -.52)], [.14, tint(base, -.18)], [.36, tint(base, .5)],
    [.5, tint(base, .16)], [.74, tint(base, -.14)], [1, tint(base, -.58)]]);
}
/* 날개면: 뿌리(root)는 밝고 끝(tip)은 어둡게 → 꺾인 면처럼 보임 */
function panel(x0, x1, base, up) {
  return lg(x0, 0, x1, 0, up
    ? [[0, tint(base, .34)], [.55, tint(base, .02)], [1, tint(base, -.4)]]
    : [[0, tint(base, -.1)], [.6, tint(base, -.34)], [1, tint(base, -.58)]]);
}
/* 기체 아래 바다에 지는 그림자 */
function craftShadow(x, y, s, w, h) {
  const sx = x + 24 * s, sy = y + 32 * s;
  ctx.fillStyle = rg(sx, sy, 0, w * s, [[0, 'rgba(1,22,44,.42)'], [.55, 'rgba(1,22,44,.26)'], [1, 'rgba(1,22,44,0)']]);
  ctx.beginPath(); ctx.ellipse(sx, sy, w * s, h * s, 0, 0, 7); ctx.fill();
}
/* 제트 화염 */
function burner(x, y, w, len, hot) {
  const f = len * (.78 + Math.random() * .34);
  ctx.fillStyle = rg(x, y + f * .3, 0, w * 3.4, [[0, 'rgba(255,214,140,.5)'], [1, 'rgba(255,120,30,0)']]);
  ctx.beginPath(); ctx.ellipse(x, y + f * .35, w * 2.6, f * .8, 0, 0, 7); ctx.fill();
  ctx.fillStyle = lg(0, y, 0, y + f, [[0, '#fff'], [.18, hot || '#ffe9a8'], [.52, '#ff9a2e'], [1, 'rgba(255,70,0,0)']]);
  ctx.beginPath();
  ctx.moveTo(x - w, y); ctx.quadraticCurveTo(x - w * .5, y + f * .6, x, y + f);
  ctx.quadraticCurveTo(x + w * .5, y + f * .6, x + w, y); ctx.closePath(); ctx.fill();
  ctx.fillStyle = lg(0, y, 0, y + f * .55, [[0, '#fff'], [1, 'rgba(255,255,210,0)']]);
  ctx.beginPath();
  ctx.moveTo(x - w * .42, y); ctx.lineTo(x, y + f * .55); ctx.lineTo(x + w * .42, y); ctx.closePath(); ctx.fill();
}
/* 엔진 노즐 (금속 링 + 어두운 안쪽) */
function nozzle(x, y, r, base) {
  ctx.fillStyle = lg(x - r, 0, x + r, 0, [[0, tint(base, -.5)], [.4, tint(base, .3)], [1, tint(base, -.6)]]);
  ctx.beginPath(); ctx.ellipse(x, y, r, r * .52, 0, 0, 7); ctx.fill();
  ctx.fillStyle = rg(x, y, 0, r * .8, [[0, '#120a06'], [1, '#49321f']]);
  ctx.beginPath(); ctx.ellipse(x, y, r * .66, r * .34, 0, 0, 7); ctx.fill();
}
/* 캐노피 (유리 반사) */
function canopy(x, y, rx, ry) {
  ctx.fillStyle = lg(x - rx, y - ry, x + rx, y + ry,
    [[0, '#9fe6ff'], [.3, '#2e6f9e'], [.62, '#15314a'], [1, '#0b1b2a']]);
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.72)';
  ctx.beginPath(); ctx.ellipse(x - rx * .33, y - ry * .3, rx * .34, ry * .42, -.34, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(190,235,255,.3)';
  ctx.beginPath(); ctx.ellipse(x + rx * .22, y + ry * .25, rx * .3, ry * .3, .3, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(10,25,40,.55)'; ctx.lineWidth = .9;
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, 7); ctx.stroke();
}
/* 패널 라인 */
function line(x0, y0, x1, y1, a) {
  ctx.strokeStyle = 'rgba(0,0,0,' + (a || .22) + ')'; ctx.lineWidth = .8;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
}
/* 밝은 모서리(하이라이트 엣지) */
function edge(pts, a) {
  ctx.strokeStyle = 'rgba(255,255,255,' + (a || .34) + ')'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++) i ? ctx.lineTo(pts[i][0], pts[i][1]) : ctx.moveTo(pts[i][0], pts[i][1]);
  ctx.stroke();
}

/* ---------- 기체 본체 ---------- */

/* 플레이어: 델타익 요격기 */
function craftPlayer(c, bank, o) {
  const acc = '#2f6fae';
  if (o.thrust) { burner(-5.5, 25, 4, 19, '#bfe9ff'); burner(5.5, 25, 4, 19, '#bfe9ff'); }
  ctx.save(); ctx.scale(bank, 1);
  /* 수평 미익 */
  for (const s of [-1, 1]) {
    const p = [[4 * s, 15], [17 * s, 27], [17 * s, 30], [3 * s, 24]];
    poly(p); ctx.fillStyle = panel(0, 17 * s, c, s < 0); ctx.fill(); edge([p[0], p[1]], .26);
  }
  /* 주익 */
  for (const s of [-1, 1]) {
    const p = [[5 * s, -8], [31 * s, 15], [31 * s, 22], [5 * s, 21]];
    poly(p); ctx.fillStyle = panel(0, 31 * s, c, s < 0); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.3)'; ctx.lineWidth = 1; ctx.stroke();
    edge([p[0], p[1]], .42);
    /* 윙팁 파일런 */
    ctx.fillStyle = tint(acc, -.1);
    ctx.fillRect(27 * s - 1.6, 14, 3.2, 8);
    ctx.fillStyle = tint('#d7dee6', .1);
    poly([[28 * s - 1.1, 8], [28 * s + 1.1, 8], [28 * s + 1.1, 18], [28 * s - 1.1, 18]]); ctx.fill();
    ctx.fillStyle = '#b84a3a';
    poly([[28 * s - 1.1, 8], [28 * s + 1.1, 8], [28 * s, 4]]); ctx.fill();
    /* 날개 무늬 */
    ctx.fillStyle = 'rgba(47,111,174,.85)';
    poly([[11 * s, 1], [25 * s, 15], [25 * s, 19], [11 * s, 8]]); ctx.fill();
  }
  /* 카나드 */
  for (const s of [-1, 1]) {
    const p = [[4.5 * s, -21], [16 * s, -10], [16 * s, -7], [4 * s, -12]];
    poly(p); ctx.fillStyle = panel(0, 16 * s, c, s < 0); ctx.fill(); edge([p[0], p[1]], .34);
  }
  ctx.restore();
  /* 수직 미익(2장, 바깥으로 기울어짐) */
  for (const s of [-1, 1]) {
    const p = [[3.4 * s, 6], [11 * s * Math.max(.25, bank), 22], [8 * s * Math.max(.25, bank), 25], [2.4 * s, 18]];
    poly(p); ctx.fillStyle = lg(0, 6, 0, 25, [[0, tint(c, .3)], [1, tint(c, -.42)]]); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.3)'; ctx.lineWidth = .9; ctx.stroke();
  }
  /* 공기 흡입구 */
  for (const s of [-1, 1]) {
    poly([[5.4 * s, -6], [9.4 * s, -2], [9.4 * s, 10], [5.8 * s, 11]]);
    ctx.fillStyle = lg(5 * s, 0, 10 * s, 0, [[0, tint(c, -.3)], [1, tint(c, -.62)]]); ctx.fill();
    ctx.fillStyle = '#0a1420';
    poly([[6.3 * s, -4.4], [8.6 * s, -1.6], [8.6 * s, 7], [6.5 * s, 7.6]]); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.lineWidth = .8;
    ctx.beginPath(); ctx.moveTo(6.3 * s, -4.4); ctx.lineTo(8.6 * s, -1.6); ctx.stroke();
  }
  /* 동체 */
  poly([[0, -37], [3.4, -25], [6, -8], [6.6, 14], [4.8, 25], [-4.8, 25], [-6.6, 14], [-6, -8], [-3.4, -25]]);
  ctx.fillStyle = tube(6.6, c); ctx.fill();
  /* 등줄기 하이라이트 */
  ctx.fillStyle = lg(-2.6, 0, 1.4, 0, [[0, 'rgba(255,255,255,0)'], [.5, 'rgba(255,255,255,.5)'], [1, 'rgba(255,255,255,0)']]);
  poly([[-.6, -30], [1.6, -24], [1.9, 14], [-.4, 20], [-2.4, 14], [-2.2, -24]]); ctx.fill();
  /* 노즈콘 */
  ctx.fillStyle = lg(-3, -37, 3, -22, [[0, tint(c, -.4)], [.45, tint(c, .36)], [1, tint(c, -.3)]]);
  poly([[0, -37], [3.4, -25], [2.4, -21], [-2.4, -21], [-3.4, -25]]); ctx.fill();
  ctx.fillStyle = '#1b2a38';
  poly([[0, -37], [1.5, -29], [-1.5, -29]]); ctx.fill();
  line(-3.3, -22, 3.3, -22, .28); line(-5.6, 2, 5.6, 2, .18); line(-6.3, 11, 6.3, 11, .18);
  canopy(0, -14.5, 3.9, 8.4);
  nozzle(-3.6, 24.6, 3.4, c); nozzle(3.6, 24.6, 3.4, c);
  /* 기수 하이라이트 */
  ctx.fillStyle = 'rgba(255,255,255,.3)';
  poly([[-2.6, -26], [-1.1, -30], [-.4, -26], [-1.6, -20]]); ctx.fill();
}

/* 정찰기: 소형 단발 */
function craftScout(c, bank, o) {
  const acc = tint(c, -.5);
  if (o.thrust) burner(0, 20, 4.2, 15);
  ctx.save(); ctx.scale(bank, 1);
  for (const s of [-1, 1]) {   /* 미익 */
    const p = [[3 * s, 12], [13 * s, 20], [13 * s, 23], [3 * s, 19]];
    poly(p); ctx.fillStyle = panel(0, 13 * s, c, s < 0); ctx.fill();
  }
  for (const s of [-1, 1]) {   /* 주익 */
    const p = [[4 * s, -8], [27 * s, 2], [27 * s, 9], [4 * s, 11]];
    poly(p); ctx.fillStyle = panel(0, 27 * s, c, s < 0); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.3)'; ctx.lineWidth = .9; ctx.stroke();
    edge([p[0], p[1]], .4);
    ctx.fillStyle = acc; poly([[18 * s, .5], [26 * s, 4], [26 * s, 7.5], [18 * s, 6]]); ctx.fill();
  }
  ctx.restore();
  ctx.fillStyle = lg(0, 8, 0, 22, [[0, tint(c, .28)], [1, tint(c, -.45)]]);  /* 수직 미익 */
  poly([[1.6, 7], [3.2, 21], [-3.2, 21], [-1.6, 7]]); ctx.fill();
  poly([[0, -26], [3.6, -16], [5, -2], [5.2, 12], [3.4, 20], [-3.4, 20], [-5.2, 12], [-5, -2], [-3.6, -16]]);
  ctx.fillStyle = tube(5.2, c); ctx.fill();
  ctx.fillStyle = lg(-2, 0, 1, 0, [[0, 'rgba(255,255,255,0)'], [.5, 'rgba(255,255,255,.42)'], [1, 'rgba(255,255,255,0)']]);
  poly([[-.5, -20], [1.3, -15], [1.5, 12], [-1.8, 12], [-1.7, -15]]); ctx.fill();
  ctx.fillStyle = acc; poly([[0, -26], [2.2, -19], [-2.2, -19]]); ctx.fill();
  line(-4.4, -3, 4.4, -3, .22);
  canopy(0, -9, 3, 5.6);
  nozzle(0, 19.4, 3.6, c);
}

/* 전투기: 쌍수직미익 요격기 */
function craftFighter(c, bank, o) {
  const acc = tint(c, -.55);
  if (o.thrust) { burner(-4.5, 22, 3.6, 17); burner(4.5, 22, 3.6, 17); }
  ctx.save(); ctx.scale(bank, 1);
  for (const s of [-1, 1]) {   /* 미익 */
    const p = [[4 * s, 13], [15 * s, 24], [15 * s, 27], [3 * s, 21]];
    poly(p); ctx.fillStyle = panel(0, 15 * s, c, s < 0); ctx.fill();
  }
  for (const s of [-1, 1]) {   /* 후퇴각 주익 */
    const p = [[5 * s, -11], [29 * s, 8], [29 * s, 14], [5 * s, 15]];
    poly(p); ctx.fillStyle = panel(0, 29 * s, c, s < 0); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.32)'; ctx.lineWidth = 1; ctx.stroke();
    edge([p[0], p[1]], .44);
    ctx.fillStyle = tint('#f0d9a0', 0);
    poly([[13 * s, -2.5], [24 * s, 6], [24 * s, 9.5], [13 * s, 3]]); ctx.fill();
    ctx.fillStyle = '#cfd6dd'; ctx.fillRect(24 * s - 1.4, 6, 2.8, 7);   /* 윙팁 미사일 */
    ctx.fillStyle = acc; poly([[24 * s - 1.4, 6], [24 * s + 1.4, 6], [24 * s, 2.4]]); ctx.fill();
  }
  ctx.restore();
  for (const s of [-1, 1]) {   /* 쌍수직미익 */
    const p = [[3.6 * s, 4], [10.5 * s * Math.max(.3, bank), 19], [7.6 * s * Math.max(.3, bank), 23], [2.6 * s, 15]];
    poly(p); ctx.fillStyle = lg(0, 4, 0, 23, [[0, tint(c, .34)], [1, tint(c, -.48)]]); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.3)'; ctx.lineWidth = .9; ctx.stroke();
  }
  for (const s of [-1, 1]) {   /* 흡입구 */
    poly([[5 * s, -8], [8.8 * s, -4], [8.8 * s, 9], [5.4 * s, 10]]);
    ctx.fillStyle = lg(5 * s, 0, 9 * s, 0, [[0, tint(c, -.28)], [1, tint(c, -.6)]]); ctx.fill();
    ctx.fillStyle = '#0d1016';
    poly([[5.9 * s, -6.4], [8 * s, -3.6], [8 * s, 6], [6.1 * s, 6.6]]); ctx.fill();
  }
  poly([[0, -31], [3.6, -21], [5.6, -5], [6.2, 12], [4.4, 22], [-4.4, 22], [-6.2, 12], [-5.6, -5], [-3.6, -21]]);
  ctx.fillStyle = tube(6.2, c); ctx.fill();
  ctx.fillStyle = lg(-2.4, 0, 1.4, 0, [[0, 'rgba(255,255,255,0)'], [.5, 'rgba(255,255,255,.46)'], [1, 'rgba(255,255,255,0)']]);
  poly([[-.5, -25], [1.5, -20], [1.7, 12], [-2, 12], [-1.9, -20]]); ctx.fill();
  ctx.fillStyle = lg(-3, -31, 3, -18, [[0, tint(c, -.42)], [.45, tint(c, .3)], [1, tint(c, -.3)]]);
  poly([[0, -31], [3.6, -21], [2.6, -17], [-2.6, -17], [-3.6, -21]]); ctx.fill();
  ctx.fillStyle = '#1a1014'; poly([[0, -31], [1.5, -24], [-1.5, -24]]); ctx.fill();
  line(-3.4, -18, 3.4, -18, .3); line(-5.4, 1, 5.4, 1, .2);
  ctx.fillStyle = '#f0d9a0'; poly([[-1.6, -14], [1.6, -14], [1.2, -11], [-1.2, -11]]); ctx.fill();
  canopy(0, -11, 3.5, 6.8);
  nozzle(-3.3, 21.6, 3.2, c); nozzle(3.3, 21.6, 3.2, c);
}

/* 폭격기: 4발 대형기 */
function craftBomber(c, bank, o) {
  const acc = tint(c, -.5);
  ctx.save(); ctx.scale(bank, 1);
  for (const s of [-1, 1]) {   /* 수평 미익 */
    const p = [[5 * s, 14], [19 * s, 22], [19 * s, 25.5], [5 * s, 21]];
    poly(p); ctx.fillStyle = panel(0, 19 * s, c, s < 0); ctx.fill();
  }
  for (const s of [-1, 1]) {   /* 긴 주익 */
    const p = [[6 * s, -10], [31 * s, -2], [31 * s, 7], [6 * s, 12]];
    poly(p); ctx.fillStyle = panel(0, 31 * s, c, s < 0); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.34)'; ctx.lineWidth = 1; ctx.stroke();
    edge([p[0], p[1]], .4);
    for (const k of [0, 1]) {   /* 엔진 나셀 2개씩 */
      const ex = (13 + k * 10) * s, ey = -5 + k * 2.6;
      ctx.fillStyle = lg(ex - 4, 0, ex + 4, 0, [[0, tint(acc, -.3)], [.4, tint(acc, .5)], [1, tint(acc, -.45)]]);
      poly([[ex - 3.6, ey], [ex + 3.6, ey], [ex + 3, ey + 13], [ex - 3, ey + 13]]); ctx.fill();
      ctx.fillStyle = '#0b0e0a';
      ctx.beginPath(); ctx.ellipse(ex, ey + 13, 3, 1.5, 0, 0, 7); ctx.fill();
      ctx.fillStyle = rg(ex - 1, ey + 1, 0, 4, [[0, 'rgba(255,255,255,.55)'], [1, 'rgba(255,255,255,0)']]);
      ctx.beginPath(); ctx.ellipse(ex, ey + 1, 3.6, 1.8, 0, 0, 7); ctx.fill();

const clouds = [], waves = [];
for (let i = 0; i < 16; i++) clouds.push({ x: rand(0, W), y: rand(0, H), s: rand(0.7, 1.8), sp: rand(40, 110) });
for (let i = 0; i < 50; i++) waves.push({ x: rand(0, W), y: rand(0, H), l: rand(10, 36) });

function updateBG(dt) {
  for (const c of clouds) { c.y += c.sp * dt; if (c.y > H + 60) { c.y = -80; c.x = rand(0, W); } }
  for (const w of waves) { w.y += 70 * dt; if (w.y > H) { w.y = -4; w.x = rand(0, W); } }
}
function drawBG() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0b3a6b'); g.addColorStop(0.55, '#0f5a86'); g.addColorStop(1, '#14749e');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(255,255,255,0.13)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  for (const w of waves) { ctx.beginPath(); ctx.moveTo(w.x, w.y); ctx.lineTo(w.x + w.l, w.y); ctx.stroke(); }
  for (const c of clouds) {
    ctx.fillStyle = 'rgba(0,20,40,0.18)'; blob(c.x + 40, c.y + 60, c.s);
    ctx.fillStyle = 'rgba(190,220,245,' + (0.22 + c.s * 0.12) + ')'; blob(c.x + 3, c.y + 5, c.s);
    ctx.fillStyle = 'rgba(255,255,255,' + (0.4 + c.s * 0.18) + ')'; blob(c.x - 2, c.y - 3, c.s * 0.94);
  }
}
function blob(x, y, s) {
  ctx.beginPath();
  ctx.arc(x, y, 26 * s, 0, 7); ctx.arc(x + 28 * s, y + 6 * s, 20 * s, 0, 7);
  ctx.arc(x - 26 * s, y + 8 * s, 18 * s, 0, 7); ctx.arc(x + 6 * s, y - 14 * s, 18 * s, 0, 7);

}

const DEF = {
  scout:   { hp: 1,  r: 14, score: 100, sc: 0.8, col: '#e8a83e' },
  fighter: { hp: 3,  r: 17, score: 250, sc: 1.0, col: '#d24a4a' },
  bomber:  { hp: 14, r: 30, score: 700, sc: 1.8, col: '#8aa472' },
};
function spawnEnemy(type, x, y, extra) {
  const d = DEF[type];
  const e = Object.assign({ type, x, y, hp: d.hp, r: d.r, t: 0, x0: x, ph: rand(0, 6), fire: rand(0.8, 2), flash: 0, vy: 0 }, extra || {});
  en.push(e); return e;
}
function spawnBoss() {
  const hp = 100 + stage * 70;
  en.push({ type: 'boss', x: W / 2, y: -110, hp, max: hp, r: 56, sc: 3.2, t: 0, pt: 0, fire: 1, ang: 0, flash: 0, entering: true, vx: 70 });
  banner('WARNING', 2.4);
  tone(200, 120, 0.6, 'sawtooth', 0.08);
}
function spawnWave() {
  const boss = en.some(e => e.type === 'boss');
  const r = Math.random();
  if (boss || r < 0.5) {
    if (!boss && Math.random() < 0.3) {
      const x0 = rand(100, W - 100);
      for (let i = -2; i <= 2; i++) spawnEnemy('scout', x0 + i * 42, -30 - Math.abs(i) * 30, { vy: 150 + stage * 10 });
    } else spawnEnemy('scout', rand(30, W - 30), -30, { vy: 150 + stage * 10 });
  } else if (r < 0.88 || stage < 2) {
    spawnEnemy('fighter', rand(40, W - 40), -40);
  } else {
    spawnEnemy('bomber', rand(70, W - 70), -60);
  }
}
function ebullet(x, y, a, sp, r) {
  eb.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: r || 5 });
}
function aimAngle(x, y) { return Math.atan2(P.y - y, P.x - x); }

function updateEnemy(e, dt) {
  e.t += dt; e.flash = Math.max(0, e.flash - dt * 9);
  const d = diff();
  if (e.type === 'scout') {
    e.y += e.vy * dt; e.x = e.x0 + Math.sin(e.t * 2.5 + e.ph) * 36;
    e.roll = -Math.cos(e.t * 2.5 + e.ph) * 0.5;
    if (stage >= 3) { e.fire -= dt; if (e.fire <= 0 && e.y > 0 && e.y < H * 0.6) { e.fire = rand(2.5, 4); ebullet(e.x, e.y, aimAngle(e.x, e.y), 190 + d * 10, 4); } }
  } else if (e.type === 'fighter') {
    if (e.y < 110) e.y += 130 * dt; else e.y += 28 * dt;
    if (e.t > 11) e.y += 160 * dt;
    const dx = clamp(P.x - e.x, -1, 1);
    e.x += dx * 55 * dt;
    e.roll = (e.roll || 0) + (-dx * 0.5 - (e.roll || 0)) * Math.min(1, dt * 4);
    e.fire -= dt;
    if (e.fire <= 0 && e.y > 0 && e.y < H - 200) {
      e.fire = rand(1.4, 2.2) / Math.min(1.8, d);
      ebullet(e.x, e.y + 14, aimAngle(e.x, e.y), 200 + d * 15, 5);
      tone(500, 250, 0.1, 'square', 0.02);
    }
  } else if (e.type === 'bomber') {
    e.y += 42 * dt;
    e.fire -= dt;
    if (e.fire <= 0 && e.y > 0) {
      e.fire = rand(1.8, 2.6) / Math.min(1.6, d);
      const a = aimAngle(e.x, e.y);
      for (const o of [-0.3, 0, 0.3]) ebullet(e.x, e.y + 30, a + o, 170 + d * 10, 6);
      tone(300, 150, 0.15, 'square', 0.03);
    }
  } else if (e.type === 'boss') {
    if (e.entering) { e.y += 60 * dt; if (e.y >= 120) e.entering = false; return; }
    e.x += e.vx * dt;
    if (e.x > W - 90) { e.x = W - 90; e.vx = -Math.abs(e.vx); }
    if (e.x < 90) { e.x = 90; e.vx = Math.abs(e.vx); }
    e.roll = clamp(-e.vx / 300, -0.4, 0.4);
    e.pt += dt; e.fire -= dt;
    const rage = e.hp < e.max * 0.5;
    const ph = Math.floor(e.pt / 5) % 3;
    if (e.fire <= 0) {
      if (ph === 0) {
        e.fire = rage ? 0.45 : 0.7;
        for (const dx of [-40, 40]) ebullet(e.x + dx, e.y + 40, aimAngle(e.x + dx, e.y + 40), 230 + d * 8, 5);
      } else if (ph === 1) {
        e.fire = rage ? 1.0 : 1.4;
        const n = rage ? 11 : 7;
        for (let i = 0; i < n; i++) ebullet(e.x, e.y + 50, Math.PI / 2 + (i - (n - 1) / 2) * 0.22, 190, 5);
      } else {
        e.fire = rage ? 0.08 : 0.12; e.ang += 0.45;
        ebullet(e.x, e.y + 20, e.ang, 170, 4); ebullet(e.x, e.y + 20, e.ang + Math.PI, 170, 4);
      }
    }
  }
}

function drawEnemy(e) {
  if (e.type === 'boss') {
    drawCraft('boss', e.x, e.y, e.sc, e.flash > 0 ? '#e8e2ff' : '#6a5a8e',
      { flip: true, roll: e.roll || 0, flash: e.flash, t: time });
    return;
  }
  const d = DEF[e.type];
  drawCraft(e.type, e.x, e.y, d.sc, e.flash > 0 ? tint(d.col, .6) : d.col,
    { flip: true, roll: e.roll || 0, thrust: e.type !== 'bomber', flash: e.flash, t: time });
}

/* ---------- 플레이어 ---------- */
function updatePlayer(dt) {
  const p = P;
  if (p.dead) {
    p.respawn -= dt;
    if (p.respawn <= 0) {
      if (p.lives <= 0) { gameOver(); return; }
      p.dead = false; p.hp = 100; p.inv = 2.5; p.x = W / 2; p.y = H - 120; p.px = p.x;
      p.weapon = Math.max(1, p.weapon - 1);
    }
    return;
  }
  p.inv = Math.max(0, p.inv - dt);
  p.mcd = Math.max(0, p.mcd - dt);
  let ax = 0, ay = 0;
  if (keys.ArrowLeft || keys.KeyA) ax -= 1;
  if (keys.ArrowRight || keys.KeyD) ax += 1;
  if (keys.ArrowUp || keys.KeyW) ay -= 1;
  if (keys.ArrowDown || keys.KeyS) ay += 1;
  if (ax || ay) { const l = Math.hypot(ax, ay); p.x += ax / l * p.speed * dt; p.y += ay / l * p.speed * dt; }
  if (touch.active) {
    const tx = touch.x + touch.ox, ty = touch.y + touch.oy, k = Math.min(1, dt * 14);
    p.x += (tx - p.x) * k; p.y += (ty - p.y) * k;
  }
  p.x = clamp(p.x, 22, W - 22); p.y = clamp(p.y, 50, H - 40);
  const vx = (p.x - p.px) / Math.max(dt, 0.001); p.px = p.x;
  p.bank += (clamp(vx / 320, -1, 1) - p.bank) * Math.min(1, dt * 10);

  p.fire -= dt;
  if ((keys.Space || touch.active) && p.fire <= 0) { p.fire = 0.14 / P.rof; firePlayer(); }
}
function firePlayer() {
  const lv = P.weapon, x = P.x, y = P.y - 28;
  const b = (dx, vx, dmg) => pb.push({ x: x + dx, y, vx, vy: -640, dmg: dmg || 1, r: 4 });
  if (lv === 1) b(0, 0);
  else if (lv === 2) { b(-8, 0); b(8, 0); }
  else if (lv === 3) { b(0, 0, 1.2); b(-12, -70); b(12, 70); }
  else { b(-6, 0); b(6, 0); b(-16, -120); b(16, 120); b(0, 0, 1.5); }
  tone(880, 440, 0.07, 'square', 0.025);
}
function fireMissile() {
  if (state !== 'play' || P.dead || P.missiles <= 0 || P.mcd > 0) return;
  P.missiles--; P.mcd = 0.5;
  for (const s of [-1, 1]) ms.push({ x: P.x + s * 16, y: P.y - 5, vx: s * 80, vy: -200, ang: -Math.PI / 2, spd: 260, target: null, t: 0 });
  tone(300, 90, 0.35, 'sawtooth', 0.06);
}
function hurtPlayer(dmg) {
  if (P.dead || P.inv > 0 || P.god) return;
  P.hp -= dmg; shake = Math.max(shake, 8);
  tone(180, 60, 0.2, 'sawtooth', 0.07);
  if (P.hp <= 0) {
    P.hp = 0; P.dead = true; P.lives--; P.respawn = 1.6;
    explode(P.x, P.y, 34); noise(0.6, 0.2); shake = 18;
  }
}
function drawPlayer() {
  if (P.dead) return;
  if (P.inv > 0 && !P.god && Math.floor(time * 14) % 2) return;
  drawCraft('player', P.x, P.y, 1.1, '#d3e2f2', { roll: P.bank, thrust: true, t: time });
  if (P.inv > 0 || P.god) {
    const a = P.god ? 0.4 : 0.55;
    ctx.strokeStyle = 'rgba(120,220,255,' + a + ')'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(P.x, P.y, 36, 0, 7); ctx.stroke();
    ctx.fillStyle = rg(P.x, P.y, 26, 38, [[0, 'rgba(120,220,255,0)'], [1, 'rgba(120,220,255,.16)']]);
    ctx.beginPath(); ctx.arc(P.x, P.y, 38, 0, 7); ctx.fill();
  }
}

/* ---------- 이펙트 ---------- */
function explode(x, y, size) {
  const n = Math.round(size * 1.2);
  const cols = ['#fff', '#ffd34d', '#ff9a2e', '#ff5a1f', '#8a8a8a'];
  for (let i = 0; i < n; i++) {
    const a = rand(0, 6.283), s = rand(30, 60 + size * 5);
    pt.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.3, 0.8), max: 0.8, r: rand(2, 2 + size / 8), c: cols[(Math.random() * cols.length) | 0] });
  }
  for (let i = 0; i < Math.round(size / 5); i++) {
    const a = rand(0, 6.283), s = rand(10, 40);
    pt.push({ smoke: true, x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 12, life: rand(0.5, 1.1), max: 1.1, r: rand(size / 6, size / 3) });
  }
  pt.push({ ring: true, x, y, r: size * 0.4, life: 0.35, max: 0.35, grow: size * 5 });
  pt.push({ flash: true, x, y, r: size * 1.3, life: 0.16, max: 0.16 });
  noise(Math.min(0.5, 0.1 + size / 100), size > 30 ? 0.18 : 0.08);
  shake = Math.max(shake, size / 4);
}
function addText(x, y, s, c) { texts.push({ x, y, s, c: c || '#fff', life: 0.9 }); }

/* ---------- 전투 ---------- */
function hurt(e, d) {
  e.hp -= d; e.flash = 1;
  if (e.hp <= 0 && !e.dead) kill(e);
}
function kill(e) {
  e.dead = true; kills++;
  const isBoss = e.type === 'boss';
  const sc = isBoss ? 3000 * stage : DEF[e.type].score;
  score += sc; addText(e.x, e.y, '+' + sc, isBoss ? '#ffd34d' : '#fff');
  explode(e.x, e.y, isBoss ? 70 : (e.type === 'bomber' ? 38 : 22));
  if (isBoss) {
    for (let i = 0; i < 6; i++) setTimeout(() => { if (state === 'play') explode(e.x + rand(-60, 60), e.y + rand(-40, 40), 30); }, i * 120);
    for (const b of eb) { addText(b.x, b.y, '+10', '#9ef'); score += 10; }
    eb.length = 0;
    spawnPU('W', e.x - 40, e.y); spawnPU('H', e.x, e.y); spawnPU('M', e.x + 40, e.y);
    stage++; stageTime = 0; P.hp = Math.min(100, P.hp + 30);
    banner('STAGE CLEAR!  →  STAGE ' + stage, 3);
  } else {
    const r = Math.random();
    const chance = e.type === 'bomber' ? 0.6 : e.type === 'fighter' ? 0.14 : 0.06;
    if (r < chance) spawnPU(['W', 'W', 'H', 'M'][(Math.random() * 4) | 0], e.x, e.y);
  }
}
function spawnPU(t, x, y) { pu.push({ t, x, y, vy: 70, ph: rand(0, 6) }); }

function missileBlast(x, y) {
  explode(x, y, 30);
  for (const e of en) if (!e.dead && Math.hypot(e.x - x, e.y - y) < 80 + e.r) hurt(e, 10);
  for (let i = eb.length - 1; i >= 0; i--) if (Math.hypot(eb[i].x - x, eb[i].y - y) < 80) eb.splice(i, 1);
}

/* ---------- 갱신 ---------- */
function update(dt) {
  time += dt;
  updateBG(dt);
  shake = Math.max(0, shake - dt * 30);
  if (bannerObj) { bannerObj.t -= dt; if (bannerObj.t <= 0) bannerObj = null; }

  updatePlayer(dt);
  if (state !== 'play') return;

  const bossAlive = en.some(e => e.type === 'boss' && !e.dead);
  if (!bossAlive) stageTime += dt;
  if (!bossAlive && stageTime >= 40 && !en.some(e => e.type === 'boss')) spawnBoss();
  spawnT -= dt;
  if (spawnT <= 0) {
    spawnT = Math.max(0.45, 1.3 - stage * 0.1) * rand(0.7, 1.2) * (bossAlive ? 2.6 : 1);
    spawnWave();
  }

  for (const b of pb) { b.x += b.vx * dt; b.y += b.vy * dt; }
  pb = pb.filter(b => b.y > -20 && b.x > -20 && b.x < W + 20 && !b.dead);

  for (const m of ms) {
    m.t += dt;
    if (!m.target || m.target.dead || m.target.y < -20) {
      let best = null, bd = 1e9;
      for (const e of en) if (!e.dead && e.y > 0) { const d = Math.hypot(e.x - m.x, e.y - m.y); if (d < bd) { bd = d; best = e; } }
      m.target = best;
    }
    const desired = m.target ? Math.atan2(m.target.y - m.y, m.target.x - m.x) : -Math.PI / 2;
    let diffA = desired - m.ang;
    while (diffA > Math.PI) diffA -= 6.283; while (diffA < -Math.PI) diffA += 6.283;
    const turn = m.t < 0.15 ? 0 : 4.2 * dt;
    if (m.t < 0.15) { m.x += m.vx * dt; m.y += m.vy * dt; }
    else {
      m.ang += clamp(diffA, -turn, turn);
      m.spd = Math.min(560, m.spd + 420 * dt);
      m.x += Math.cos(m.ang) * m.spd * dt; m.y += Math.sin(m.ang) * m.spd * dt;
    }
    pt.push({ smoke: true, x: m.x - Math.cos(m.ang) * 9, y: m.y - Math.sin(m.ang) * 9, vx: rand(-14, 14), vy: rand(6, 26), life: 0.45, max: 0.45, r: rand(2.4, 4.4) });
    if (m.y < -40 || m.y > H + 40 || m.x < -40 || m.x > W + 40) m.dead = true;
  }

  for (const e of en) updateEnemy(e, dt);

  for (const b of eb) { b.x += b.vx * dt; b.y += b.vy * dt; }
  eb = eb.filter(b => b.x > -30 && b.x < W + 30 && b.y > -30 && b.y < H + 30 && !b.dead);

  for (const b of pb) {
    for (const e of en) {
      if (e.dead || (e.entering && e.y < -20)) continue;
      if (Math.hypot(b.x - e.x, b.y - e.y) < e.r + b.r) {
        b.dead = true; hurt(e, b.dmg);
        for (let i = 0; i < 3; i++) pt.push({ x: b.x, y: b.y, vx: rand(-70, 70), vy: rand(-70, 20), life: 0.22, max: 0.22, r: rand(1.4, 2.6), c: '#ffe27a' });
        break;
      }
    }
  }
  for (const m of ms) {
    if (m.dead) continue;
    for (const e of en) {
      if (!e.dead && Math.hypot(m.x - e.x, m.y - e.y) < e.r + 8) { m.dead = true; missileBlast(m.x, m.y); break; }
    }
  }
  ms = ms.filter(m => !m.dead);

  if (!P.dead) {
    for (const b of eb) if (Math.hypot(b.x - P.x, b.y - P.y) < b.r + 9) { b.dead = true; hurtPlayer(12); }
    for (const e of en) {
      if (e.dead) continue;
      if (Math.hypot(e.x - P.x, e.y - P.y) < e.r + 12) {
        if (e.type === 'boss') hurtPlayer(2); else { hurtPlayer(25); hurt(e, 6); }
      }
    }
    for (const u of pu) {
      if (Math.hypot(u.x - P.x, u.y - P.y) < 30) {
        u.dead = true; tone(600, 1200, 0.2, 'sine', 0.06);
        if (u.t === 'W') { if (P.weapon < 4) { P.weapon++; addText(P.x, P.y - 34, '무기 강화!', '#ffd34d'); } else { score += 500; addText(P.x, P.y - 34, '+500', '#ffd34d'); } }
        else if (u.t === 'H') { P.hp = Math.min(100, P.hp + 40); addText(P.x, P.y - 34, '수리 +40', '#7dff9a'); }
        else { P.missiles = Math.min(9, P.missiles + 2); addText(P.x, P.y - 34, '미사일 +2', '#ff8a8a'); }
      }
    }
  }
  en = en.filter(e => !e.dead && !(e.y > H + 80));
  pu.forEach(u => { u.y += u.vy * dt; u.ph += dt * 4; });
  pu = pu.filter(u => !u.dead && u.y < H + 30);

  for (const p of pt) {
    p.life -= dt;
    if (p.ring) p.r += p.grow * dt;
    else if (p.flash) p.r += p.r * dt * 2;
    else { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.97; p.vy *= 0.97; if (p.smoke) p.r += dt * 18; }
  }
  pt = pt.filter(p => p.life > 0);
  for (const t of texts) { t.life -= dt; t.y -= 30 * dt; }
  texts = texts.filter(t => t.life > 0);
}

function gameOver() {
  state = 'over'; overT = 0.7;
  if (score > hi) { hi = score; newRecord = true; try { localStorage.setItem('skyAceHi', hi); } catch (e) {} }
}
function startGame() { reset(); state = 'play'; }

/* ---------- 그리기 ---------- */
function drawBullets() {
  for (const b of pb) drawPlayerBolt(b);
  for (const b of eb) drawEnemyOrb(b);
  for (const m of ms) drawMissile(m);
}
function drawPU() {
  for (const u of pu) drawOrb(u, u.y + Math.sin(u.ph) * 3);
}
function drawFX() {
  for (const p of pt) {
    const a = clamp(p.life / p.max, 0, 1);
    if (p.ring) {
      ctx.strokeStyle = 'rgba(255,220,150,' + a + ')'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.stroke();
    } else if (p.flash) {
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = rg(p.x, p.y, 0, p.r, [[0, 'rgba(255,245,210,' + (a * .9) + ')'], [.5, 'rgba(255,170,60,' + (a * .4) + ')'], [1, 'rgba(255,90,20,0)']]);
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); ctx.restore();
    } else if (p.smoke) {
      ctx.fillStyle = rg(p.x, p.y, 0, p.r, [[0, 'rgba(150,150,150,' + (a * .34) + ')'], [1, 'rgba(110,110,110,0)']]);
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
    } else {
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = a;
      ctx.fillStyle = rg(p.x, p.y, 0, p.r * 2, [[0, p.c], [1, 'rgba(255,120,30,0)']]);
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 2, 0, 7); ctx.fill();
      ctx.globalAlpha = 1; ctx.restore();
      ctx.globalAlpha = a; ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * .62, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
    }
  }
  ctx.font = 'bold 14px "Malgun Gothic","Apple SD Gothic Neo",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const t of texts) {
    ctx.globalAlpha = clamp(t.life / 0.5, 0, 1);
    ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillText(t.s, t.x + 1, t.y + 1);
    ctx.fillStyle = t.c; ctx.fillText(t.s, t.x, t.y); ctx.globalAlpha = 1;
  }
}
function txt(s, x, y, size, color, align, weight) {
  ctx.font = (weight || 'bold') + ' ' + size + 'px "Malgun Gothic","Apple SD Gothic Neo",sans-serif';
  ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillText(s, x + 1.5, y + 1.5);
  ctx.fillStyle = color || '#fff'; ctx.fillText(s, x, y);
}
function drawHUD() {
  txt('SCORE ' + String(score).padStart(7, '0'), 14, 20, 18, '#fff');
  txt('HI ' + String(hi).padStart(7, '0'), W - 14, 20, 14, '#bfe3ff', 'right');
  txt('STAGE ' + stage, W - 14, 40, 14, '#ffd34d', 'right');

  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(14, H - 30, 150, 14);
  const hpc = P.hp > 50 ? '#4be07a' : P.hp > 25 ? '#ffd34d' : '#ff5a5a';
  ctx.fillStyle = lg(0, H - 30, 0, H - 16, [[0, tint(hpc, .35)], [1, tint(hpc, -.25)]]);
  ctx.fillRect(14, H - 30, 150 * P.hp / 100, 14);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.strokeRect(14.5, H - 29.5, 150, 14);

  txt('기체', 14, H - 48, 13, '#cfe8ff');
  for (let i = 0; i < Math.max(0, P.lives); i++) iconJet(54 + i * 19, H - 48, 1.15, '#cfe8ff');
  txt('LV ' + P.weapon, 14, H - 11, 13, '#fff');
  iconMissile(62, H - 12, 1.0);
  txt('× ' + P.missiles, 73, H - 11, 13, '#fff');
  if (P.god || P.rof !== 1 || P.speed !== 320) txt('ADMIN', W - 14, H - 11, 11, 'rgba(255,210,100,.8)', 'right', 'bold');

  const boss = en.find(e => e.type === 'boss' && !e.dead);
  if (boss) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(60, 52, W - 120, 10);
    ctx.fillStyle = lg(0, 52, 0, 62, [[0, '#dca0ff'], [1, '#9a2fd8']]);
    ctx.fillRect(60, 52, (W - 120) * clamp(boss.hp / boss.max, 0, 1), 10);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.strokeRect(60.5, 52.5, W - 120, 10);
    txt('BOSS', W / 2, 74, 12, '#e6b8ff', 'center');
  }
  if (isTouch && state === 'play') {
    const bx = W - 52, by = H - 100;
    ctx.fillStyle = rg(bx - 8, by - 10, 4, 34, [[0, 'rgba(255,140,120,.5)'], [1, 'rgba(200,40,40,.42)']]);
    ctx.beginPath(); ctx.arc(bx, by, 32, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 2; ctx.stroke();
    iconMissile(bx, by + 2, 2.0);
  }
  if (bannerObj) {
    const a = clamp(Math.min(bannerObj.t, bannerObj.max - bannerObj.t) * 3, 0, 1);
    ctx.globalAlpha = a;
    const warn = bannerObj.text === 'WARNING';
    if (warn) {
      const y = H * 0.35;
      ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(0, y - 34, W, 68);
      ctx.fillStyle = 'rgba(255,60,60,.22)'; ctx.fillRect(0, y - 34, W, 68);
      for (const s of [-1, 1]) {
        const cx = W / 2 + s * 132;
        ctx.fillStyle = '#ffd34d';
        poly([[cx, y - 15], [cx + 15, y + 11], [cx - 15, y + 11]]); ctx.fill();
        ctx.fillStyle = '#301c00'; ctx.fillRect(cx - 2, y - 7, 4, 11);
        ctx.beginPath(); ctx.arc(cx, y + 7.5, 2, 0, 7); ctx.fill();
      }
      txt('WARNING', W / 2, y, 40, '#ff5a5a', 'center', '900');
    } else txt(bannerObj.text, W / 2, H * 0.35, 30, '#fff', 'center');
    ctx.globalAlpha = 1;
  }
}
function overlay(a) { ctx.fillStyle = 'rgba(0,10,25,' + a + ')'; ctx.fillRect(0, 0, W, H); }

function draw() {
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  ctx.save();
  if (shake > 0) ctx.translate(rand(-shake, shake) * 0.5, rand(-shake, shake) * 0.5);
  drawBG();
  if (state !== 'title') {
    drawPU();
    for (const e of en) drawEnemy(e);
    drawBullets();
    drawPlayer();
    drawFX();
  } else {
    drawCraft('player', W / 2 + Math.sin(time) * 30, 430 + Math.cos(time * 1.3) * 10, 2.2,
      '#d3e2f2', { roll: Math.cos(time) * 0.42, thrust: true, t: time });
  }
  ctx.restore();

  if (state === 'title') {
    overlay(0.35);
    txt('SKY ACE', W / 2, 150, 58, '#fff', 'center', '900');
    txt('공중전', W / 2, 205, 30, '#ffd34d', 'center');
    txt('이동  방향키 / WASD / 화면 드래그', W / 2, 560, 15, '#dff0ff', 'center', 'normal');
    txt('발사  Space (누르고 있기) / 터치 시 자동 발사', W / 2, 586, 15, '#dff0ff', 'center', 'normal');
    txt('유도 미사일  X / Shift / 우측 버튼      일시정지  Esc      음소거  M', W / 2, 612, 14, '#dff0ff', 'center', 'normal');
    if (Math.floor(time * 2) % 2 === 0) txt('SPACE 또는 터치로 시작', W / 2, 668, 22, '#fff', 'center');
    txt('HI ' + hi, W / 2, 702, 14, '#bfe3ff', 'center');
    txt('세영코딩연구소  저자 : 컴퓨터공학박사 KIM', W / 2, 730, 12, 'rgba(210,230,250,.72)', 'center', 'normal');
  } else {
    drawHUD();
    if (state === 'pause') {
      overlay(0.5);
      txt('일시정지', W / 2, H / 2, 40, '#fff', 'center');
      txt('Esc 를 눌러 계속', W / 2, H / 2 + 44, 16, '#cfe8ff', 'center', 'normal');
    }
    if (state === 'admin') drawAdmin();
    if (state === 'over') {
      overlay(0.6);
      txt('GAME OVER', W / 2, 260, 48, '#ff6a6a', 'center', '900');
      txt('점수  ' + score, W / 2, 340, 26, '#fff', 'center');
      txt('최고 기록  ' + hi, W / 2, 380, 18, '#ffd34d', 'center');
      if (newRecord) txt('NEW RECORD!', W / 2, 408, 16, '#7dff9a', 'center');
      txt('격추 ' + kills + '기   도달 스테이지 ' + stage, W / 2, 440, 16, '#cfe8ff', 'center', 'normal');
      if (overT <= 0 && Math.floor(time * 2) % 2 === 0) txt('ENTER 또는 터치로 재시작', W / 2, 510, 20, '#fff', 'center');
      txt('세영코딩연구소  저자 : 컴퓨터공학박사 KIM', W / 2, 700, 12, 'rgba(210,230,250,.7)', 'center', 'normal');
    }
  }
}

/* ===================== 관리자 모드 (P) — 메뉴에는 표시하지 않음 ===================== */
let admSel = 1, admHit = [], admFlash = 0;

function admNum(label, get, set, min, max, step, fmt) {
  return { k: 'num', label, get, set, min, max, step, fmt };
}
function admRows() {
  return [
    { k: 'hdr', label: '기체 능력' },
    admNum('무기 레벨', () => P.weapon, v => P.weapon = v, 1, 4, 1, v => 'LV ' + v),
    admNum('연사 속도', () => P.rof, v => P.rof = Math.round(v * 100) / 100, 0.5, 4, 0.25, v => '× ' + v.toFixed(2)),
    admNum('이동 속도', () => P.speed, v => P.speed = v, 120, 760, 40, v => v + ''),
    admNum('미사일', () => P.missiles, v => P.missiles = v, 0, 9, 1, v => '× ' + v),
    admNum('남은 기체', () => P.lives, v => P.lives = v, 0, 9, 1, v => '× ' + v),
    admNum('체력', () => P.hp, v => P.hp = v, 0, 100, 10, v => Math.round(v) + ' / 100'),
    { k: 'tog', label: '무적', get: () => P.god, set: v => { P.god = v; if (v) P.hp = Math.max(P.hp, 1); } },
    { k: 'hdr', label: '진행' },
    admNum('스테이지', () => stage, v => { stage = v; stageTime = 0; }, 1, 30, 1, v => v + ''),
    admNum('점수', () => score, v => score = Math.max(0, v), 0, 9999999, 5000, v => String(v)),
    { k: 'hdr', label: '소환 · 실행' },
    { k: 'act', label: '정찰기 소환', run: () => spawnEnemy('scout', rand(60, W - 60), -30, { vy: 150 + stage * 10 }) },
    { k: 'act', label: '전투기 소환', run: () => spawnEnemy('fighter', rand(60, W - 60), -40) },
    { k: 'act', label: '폭격기 소환', run: () => spawnEnemy('bomber', rand(80, W - 80), -60) },
    { k: 'act', label: '보스 소환', run: () => { if (!en.some(e => e.type === 'boss' && !e.dead)) spawnBoss(); } },
    { k: 'act', label: '화면의 적 전멸', run: () => { for (const e of en) if (!e.dead && e.type !== 'boss') kill(e); eb.length = 0; } },
    { k: 'act', label: '파워업 3종 소환', run: () => { spawnPU('W', P.x - 50, P.y - 150); spawnPU('H', P.x, P.y - 150); spawnPU('M', P.x + 50, P.y - 150); } },
    { k: 'act', label: '체력 · 미사일 가득', run: () => { P.hp = 100; P.missiles = 9; } },
  ];
}
function openAdmin() {
  if (state !== 'play' && state !== 'pause') return;
  state = 'admin'; touch.active = false; touch.id = null;
  for (const k in keys) keys[k] = false;
  tone(620, 940, 0.1, 'triangle', 0.04);
}
function closeAdmin() {
  if (state !== 'admin') return;
  state = 'play';
  tone(940, 620, 0.1, 'triangle', 0.04);
}
function admMove(d) {
  const rows = admRows();
  let i = admSel;
  for (let n = 0; n < rows.length; n++) {
    i = (i + d + rows.length) % rows.length;
    if (rows[i].k !== 'hdr') break;
  }
  admSel = i; tone(520, 520, 0.03, 'square', 0.02);
}
function admAdjust(d) {
  const r = admRows()[admSel]; if (!r) return;
  if (r.k === 'num') {
    const v = clamp(r.get() + r.step * d, r.min, r.max);
    r.set(v); tone(660, 760, 0.04, 'square', 0.025);
  } else if (r.k === 'tog') { r.set(!r.get()); tone(700, 980, 0.07, 'triangle', 0.03); }
}
function admEnter() {
  const r = admRows()[admSel]; if (!r) return;
  if (r.k === 'act') { r.run(); admFlash = 0.35; tone(520, 880, 0.12, 'triangle', 0.045); }
  else if (r.k === 'tog') admAdjust(1);
  else if (r.k === 'num') admAdjust(1);
}
function admPointer(px, py) {
  for (const h of admHit) {
    if (py < h.y0 || py > h.y1) continue;
    admSel = h.i;
    const r = admRows()[h.i];
    if (r.k === 'num' || r.k === 'tog') {
      if (px >= h.mx && px <= h.mx + 26) { admAdjust(-1); return true; }
      if (px >= h.px0 && px <= h.px0 + 26) { admAdjust(1); return true; }
      if (r.k === 'tog') { admAdjust(1); return true; }
    } else if (r.k === 'act') { admEnter(); return true; }
    return true;
  }
  return false;
}
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else {
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
}
function drawAdmin() {
  const rows = admRows();
  admFlash = Math.max(0, admFlash - 0.02);
  overlay(0.72);
  const PX = 24, PW = W - 48, PY = 44, PH = H - 92;
  ctx.fillStyle = lg(0, PY, 0, PY + PH, [[0, 'rgba(16,34,54,.97)'], [1, 'rgba(10,22,38,.97)']]);
  rrect(PX, PY, PW, PH, 16); ctx.fill();
  ctx.strokeStyle = 'rgba(255,205,90,.55)'; ctx.lineWidth = 2; ctx.stroke();

  txt('ADMIN', PX + 18, PY + 26, 22, '#ffd34d', 'left', '900');
  txt('관리자 모드', PX + 114, PY + 27, 15, '#cfe8ff', 'left');
  txt('P / Esc 로 닫기', PX + PW - 18, PY + 27, 12, 'rgba(200,225,250,.7)', 'right', 'normal');
  ctx.strokeStyle = 'rgba(255,255,255,.16)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(PX + 14, PY + 44); ctx.lineTo(PX + PW - 14, PY + 44); ctx.stroke();

  admHit = [];
  let y = PY + 58;
  const RH = 26, vx = PX + PW - 120;
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i], sel = i === admSel;
    if (r.k === 'hdr') {
      txt(r.label, PX + 18, y + 14, 12, '#7fd4ff', 'left');
      ctx.strokeStyle = 'rgba(127,212,255,.25)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(PX + 18 + ctx.measureText(r.label).width + 10, y + 14); ctx.lineTo(PX + PW - 18, y + 14); ctx.stroke();
      y += 24; continue;
    }
    if (sel) {
      ctx.fillStyle = lg(PX + 10, 0, PX + PW - 10, 0, [[0, 'rgba(255,211,77,.26)'], [1, 'rgba(255,211,77,.07)']]);
      rrect(PX + 10, y, PW - 20, RH - 3, 7); ctx.fill();
      ctx.fillStyle = '#ffd34d'; rrect(PX + 10, y, 3, RH - 3, 2); ctx.fill();
    }
    txt(r.label, PX + 22, y + 11, 14, sel ? '#fff' : '#cfe0f0', 'left', sel ? 'bold' : 'normal');

    if (r.k === 'act') {
      const bw = 58, bx = PX + PW - 22 - bw;
      ctx.fillStyle = sel ? (admFlash > 0 ? '#7dff9a' : '#ffd34d') : 'rgba(255,255,255,.16)';
      rrect(bx, y + 1, bw, RH - 5, 6); ctx.fill();
      txt('실행', bx + bw / 2, y + 11, 12, sel ? '#15202c' : '#dbe8f5', 'center');
      admHit.push({ i, y0: y, y1: y + RH, mx: -99, px0: -99 });
    } else {
      const mx = vx, px0 = vx + 94;
      for (const [bx, lab, on] of [[mx, '-', r.k === 'num' ? r.get() > r.min : true], [px0, '+', r.k === 'num' ? r.get() < r.max : true]]) {
        ctx.fillStyle = sel ? (on ? 'rgba(255,211,77,.9)' : 'rgba(255,211,77,.25)') : 'rgba(255,255,255,.14)';
        rrect(bx, y + 1, 26, RH - 5, 6); ctx.fill();
        txt(lab, bx + 13, y + 11, 15, sel && on ? '#15202c' : '#c6d6e6', 'center');
      }
      const val = r.k === 'tog' ? (r.get() ? 'ON' : 'OFF') : (r.fmt ? r.fmt(r.get()) : r.get());
      txt(val, mx + 60, y + 11, 14, r.k === 'tog' ? (r.get() ? '#7dff9a' : 'rgba(210,225,240,.6)') : '#ffe9a8', 'center');
      admHit.push({ i, y0: y, y1: y + RH, mx, px0 });
    }
    y += RH;
  }
  txt('↑↓ 선택   ←→ 조절   Enter 실행   화면을 눌러도 됩니다', W / 2, PY + PH - 34, 12, 'rgba(200,225,250,.72)', 'center', 'normal');
  txt('세영코딩연구소  저자 : 컴퓨터공학박사 KIM', W / 2, PY + PH - 15, 11, 'rgba(200,225,250,.5)', 'center', 'normal');
}

/* ---------- loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  if (state === 'play') update(dt);
  else {
    time += dt; updateBG(dt);
    if (state === 'over') {
      overT -= dt;
      for (const p of pt) {
        p.life -= dt;
        if (p.ring) p.r += p.grow * dt;
        else if (p.flash) p.r += p.r * dt * 2;
        else { p.x += p.vx * dt; p.y += p.vy * dt; if (p.smoke) p.r += dt * 18; }
      }
      pt = pt.filter(p => p.life > 0);
    }
  }
  draw();
  requestAnimationFrame(frame);
}

/* ---------- input ---------- */
addEventListener('keydown', e => {
  initAudio();
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();

  if (state === 'admin') {
    if (e.repeat && !['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.code)) return;
    if (e.code === 'ArrowUp') admMove(-1);
    else if (e.code === 'ArrowDown') admMove(1);
    else if (e.code === 'ArrowLeft') admAdjust(-1);
    else if (e.code === 'ArrowRight') admAdjust(1);
    else if (e.code === 'Enter' || e.code === 'Space') admEnter();
    else if (e.code === 'KeyP' || e.code === 'Escape') closeAdmin();
    else if (e.code === 'KeyM') muted = !muted;
    return;
  }

  if (e.repeat) { keys[e.code] = true; return; }
  keys[e.code] = true;
  if (state === 'title' && (e.code === 'Space' || e.code === 'Enter')) startGame();
  else if (state === 'over' && overT <= 0 && (e.code === 'Enter' || e.code === 'Space')) startGame();
  else if (state === 'play' && (e.code === 'KeyX' || e.code === 'ShiftLeft' || e.code === 'ShiftRight')) fireMissile();
  if (e.code === 'KeyP') { if (state === 'play' || state === 'pause') openAdmin(); }
  else if (e.code === 'Escape') { if (state === 'play') state = 'pause'; else if (state === 'pause') state = 'play'; }
  if (e.code === 'KeyM') muted = !muted;
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (state === 'play') state = 'pause'; });

function toLocal(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
cv.addEventListener('pointerdown', e => {
  initAudio();
  if (e.pointerType !== 'mouse') isTouch = true;
  const p = toLocal(e);
  if (state === 'admin') { admPointer(p.x, p.y); return; }
  if (state === 'title') { startGame(); }
  else if (state === 'over') { if (overT <= 0) startGame(); return; }
  else if (state === 'pause') { state = 'play'; return; }
  if (state !== 'play') return;
  if (isTouch && Math.hypot(p.x - (W - 52), p.y - (H - 100)) < 42) { fireMissile(); return; }
  if (!touch.active) {
    touch.active = true; touch.id = e.pointerId; touch.x = p.x; touch.y = p.y;
    touch.ox = P.x - p.x; touch.oy = P.y - p.y;
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  }
});
cv.addEventListener('pointermove', e => {
  if (touch.active && e.pointerId === touch.id) { const p = toLocal(e); touch.x = p.x; touch.y = p.y; }
});
const endTouch = e => { if (e.pointerId === touch.id) { touch.active = false; touch.id = null; } };
cv.addEventListener('pointerup', endTouch);
cv.addEventListener('pointercancel', endTouch);
cv.addEventListener('contextmenu', e => e.preventDefault());

reset();
requestAnimationFrame(frame);
})();
</script>
