<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>iPhone 17 Pro Ultra 3D Sculpted Card</title>
  <style>
    :root {
      --card-width: 330px;
      --card-height: 600px;
      --neon-cyan: #00f3ff;
      --neon-magenta: #ff00a0;
      --neon-gold: #ffb700;
      --glass-bg: rgba(15, 18, 30, 0.65);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      height: -webkit-fill-available;
      background: #030508;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      perspective: 1200px;
      color: #ffffff;
    }

    /* 우주 파티클 배경 */
    .space-bg {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      overflow: hidden;
      z-index: 0;
    }

    .particle-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.6;
      animation: pulse 8s infinite alternate ease-in-out;
    }

    .orb-1 {
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, var(--neon-cyan), transparent);
      top: -10%;
      left: -10%;
    }

    .orb-2 {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, var(--neon-magenta), transparent);
      bottom: -15%;
      right: -10%;
      animation-delay: -4s;
    }

    @keyframes pulse {
      0% { transform: scale(1) translate(0, 0); }
      100% { transform: scale(1.2) translate(30px, -20px); }
    }

    /* 3D 카드 메인 씬 */
    .card-scene {
      position: relative;
      width: var(--card-width);
      height: var(--card-height);
      z-index: 10;
      transform-style: preserve-3d;
      will-change: transform;
    }

    .card {
      width: 100%;
      height: 100%;
      background: var(--glass-bg);
      backdrop-filter: blur(35px) saturate(210%);
      -webkit-backdrop-filter: blur(35px) saturate(210%);
      border-radius: 40px;
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8),
                  0 0 40px rgba(0, 243, 255, 0.2),
                  inset 0 2px 4px rgba(255, 255, 255, 0.5);
      position: relative;
      overflow: hidden;
      transform-style: preserve-3d;
    }

    .hologram-glare {
      position: absolute;
      top: -100%;
      left: -100%;
      width: 300%;
      height: 300%;
      background: radial-gradient(circle at center, rgba(255, 255, 255, 0.35) 0%, rgba(0, 243, 255, 0.15) 25%, transparent 60%);
      pointer-events: none;
      transform: translateZ(30px);
      mix-blend-mode: overlay;
      transition: transform 0.05s ease-out;
    }

    /* [3D 입체 조각 프로필 프레임] */
    .profile-avatar-wrapper {
      position: relative;
      width: 150px;
      height: 150px;
      margin-top: 10px;
      border-radius: 50%;
      padding: 8px;
      background: linear-gradient(145deg, rgba(255,255,255,0.4), rgba(15,23,42,0.9));
      box-shadow: 
        0 20px 40px rgba(0, 0, 0, 0.7),
        0 0 25px rgba(0, 243, 255, 0.6),
        inset 0 4px 8px rgba(255, 255, 255, 0.6),
        inset 0 -6px 12px rgba(0, 0, 0, 0.8);
      transform: translateZ(90px);
      transform-style: preserve-3d;
      transition: transform 0.2s ease;
    }

    .profile-avatar-wrapper::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--neon-cyan), transparent 50%, var(--neon-magenta));
      z-index: -1;
      filter: blur(2px);
    }

    .profile-avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: inset 0 3px 6px rgba(0,0,0,0.6), 0 5px 15px rgba(0,0,0,0.5);
      background: #0f172a;
      display: block;
    }

    /* [3D 입체 볼록 카메라 버튼] */
    .upload-btn {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.8);
      background: radial-gradient(circle at 30% 30%, #ff60cc, var(--neon-magenta) 60%, #800050);
      box-shadow: 
        0 10px 20px rgba(0, 0, 0, 0.6),
        0 0 15px rgba(255, 0, 160, 0.8),
        inset 0 3px 4px rgba(255, 255, 255, 0.8),
        inset 0 -4px 6px rgba(0, 0, 0, 0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      font-size: 20px;
      transform: translateZ(40px);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .upload-btn:active {
      transform: translateZ(20px) scale(0.92);
      box-shadow: 
        0 4px 10px rgba(0, 0, 0, 0.6),
        inset 0 2px 5px rgba(0, 0, 0, 0.8);
    }

    #file-input { display: none; }

    /* 텍스트 정보 */
    .info-group {
      text-align: center;
      width: 100%;
      transform: translateZ(60px);
      transform-style: preserve-3d;
    }

    .editable-text {
      outline: none;
      border-radius: 8px;
      padding: 2px 8px;
      transition: background 0.2s;
    }

    .editable-text:focus {
      background: rgba(255, 255, 255, 0.2);
      border: 1px dashed var(--neon-cyan);
    }

    .user-name {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
      background: linear-gradient(180deg, #ffffff 0%, #a5f3fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }

    .user-role {
      font-size: 13px;
      color: var(--neon-cyan);
      font-weight: 700;
      margin-bottom: 14px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
    }

    .user-bio {
      font-size: 13px;
      color: #cbd5e1;
      line-height: 1.5;
      margin-bottom: 10px;
    }

    /* [3D 입체 태그 캡슐 버튼] */
    .tag-container {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      transform: translateZ(50px);
    }

    .tag {
      font-size: 11px;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 20px;
      color: #ffffff;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.15), rgba(0, 0, 0, 0.4));
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 
        0 6px 12px rgba(0, 0, 0, 0.4),
        inset 0 1.5px 2px rgba(255, 255, 255, 0.5),
        inset 0 -2px 4px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      transition: transform 0.15s ease;
    }

    .tag:active {
      transform: scale(0.95);
    }

    /* [3D 입체 하단 대시보드 블록] */
    .card-footer-stats {
      width: 100%;
      display: flex;
      justify-content: space-around;
      background: linear-gradient(145deg, rgba(20, 25, 40, 0.8), rgba(5, 8, 15, 0.9));
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      padding: 14px 10px;
      transform: translateZ(75px);
      box-shadow: 
        0 15px 30px rgba(0, 0, 0, 0.6),
        inset 0 2px 3px rgba(255, 255, 255, 0.4),
        inset 0 -3px 6px rgba(0, 0, 0, 0.8);
    }

    .stat-item { text-align: center; }

    .stat-value {
      font-size: 15px;
      font-weight: 800;
      color: var(--neon-magenta);
      text-shadow: 0 0 8px rgba(255, 0, 160, 0.6);
    }

    .stat-label {
      font-size: 10px;
      color: #94a3b8;
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* [3D 입체 자이로 센서 활성화 플로팅 버튼] */
    .permission-btn {
      position: absolute;
      bottom: 25px;
      padding: 14px 28px;
      background: linear-gradient(145deg, #00f3ff, #ff00a0);
      border: 1.5px solid #ffffff;
      border-radius: 35px;
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      backdrop-filter: blur(15px);
      cursor: pointer;
      z-index: 100;
      box-shadow: 
        0 15px 35px rgba(0, 0, 0, 0.6),
        0 0 25px rgba(0, 243, 255, 0.6),
        inset 0 3px 5px rgba(255, 255, 255, 0.8),
        inset 0 -4px 8px rgba(0, 0, 0, 0.5);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .permission-btn:active {
      transform: scale(0.94);
      box-shadow: 
        0 5px 15px rgba(0, 0, 0, 0.6),
        inset 0 2px 4px rgba(0, 0, 0, 0.7);
    }
  </style>
</head>
<body>

  <div class="space-bg">
    <div class="particle-orb orb-1"></div>
    <div class="particle-orb orb-2"></div>
  </div>

  <div class="card-scene" id="cardScene">
    <div class="card">
      <div class="hologram-glare" id="glare"></div>

      <!-- 3D 입체 프로필 사진 영역 -->
      <div class="profile-avatar-wrapper">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80" id="profileImage" class="profile-avatar" alt="Profile" />
        <button class="upload-btn" onclick="document.getElementById('file-input').click()">📷</button>
        <input type="file" id="file-input" accept="image/*" onchange="loadPhoto(event)" />
      </div>

      <div class="info-group">
        <h2 class="user-name editable-text" contenteditable="true">김경훈</h2>
        <p class="user-role editable-text" contenteditable="true">AI & Graphic Engineer</p>
        <p class="user-bio editable-text" contenteditable="true">"iPhone 17 Pro 공간 반응형 Sculpted 3D 프로필 카드"</p>
      </div>

      <div class="tag-container">
        <span class="tag">#Sculpted_3D</span>
        <span class="tag">#Gyroscope</span>
        <span class="tag">#iPhone17Pro</span>
      </div>

      <div class="card-footer-stats">
        <div class="stat-item">
          <div class="stat-value">3D MAX</div>
          <div class="stat-label">Motion</div>
        </div>
        <div class="stat-item" style="border-left: 1px solid rgba(255,255,255,0.15); border-right: 1px solid rgba(255,255,255,0.15); padding: 0 15px;">
          <div class="stat-value">120Hz</div>
          <div class="stat-label">Refresh</div>
        </div>
        <div class="stat-item">
          <div class="stat-value">PRO</div>
          <div class="stat-label">Edition</div>
        </div>
      </div>

    </div>
  </div>

  <button class="permission-btn" id="sensorBtn" onclick="requestGyroPermission()">📱 3D 자이로 센서 활성화</button>

  <script>
    const cardScene = document.getElementById('cardScene');
    const glare = document.getElementById('glare');
    const profileImage = document.getElementById('profileImage');
    const sensorBtn = document.getElementById('sensorBtn');

    function loadPhoto(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          profileImage.src = e.target.result;
        }
        reader.readAsDataURL(file);
      }
    }

    function apply3DRotation(rotateX, rotateY) {
      cardScene.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
      
      const glareX = rotateY * 5;
      const glareY = -rotateX * 5;
      glare.style.transform = `translate3d(${glareX}px, ${glareY}px, 30px)`;
    }

    window.addEventListener('mousemove', (e) => {
      if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') return;
      
      const xAxis = (window.innerWidth / 2 - e.pageX) / 12;
      const yAxis = (window.innerHeight / 2 - e.pageY) / 12;
      apply3DRotation(yAxis, -xAxis);
    });

    function handleOrientation(event) {
      let x = event.beta; 
      let y = event.gamma;

      if (x === null || y === null) return;

      let rotateX = (x - 30) * 0.8;
      let rotateY = y * 0.8;

      rotateX = Math.max(-32, Math.min(32, rotateX));
      rotateY = Math.max(-32, Math.min(32, rotateY));

      apply3DRotation(rotateX, rotateY);
    }

    function requestGyroPermission() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(permissionState => {
            if (permissionState === 'granted') {
              window.addEventListener('deviceorientation', handleOrientation);
              sensorBtn.style.display = 'none';
            } else {
              alert('자이로 센서 접근 권한이 거부되었습니다.');
            }
          })
          .catch(console.error);
      } else if (window.DeviceOrientationEvent) {
        window.addEventListener('deviceorientation', handleOrientation);
        sensorBtn.style.display = 'none';
      } else {
        alert('이 기기에서는 자이로 센서를 지원하지 않습니다.');
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (!(typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function')) {
        if (window.DeviceOrientationEvent) {
          window.addEventListener('deviceorientation', handleOrientation);
        }
        sensorBtn.style.display = 'none';
      }
    });
  </script>
</body>
</html>
