<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>iPhone 17 Pro 3D Profile Card</title>
  <style>
    :root {
      --card-width: 320px;
      --card-height: 580px;
      --primary-color: #00f2fe;
      --accent-color: #4facfe;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      height: -webkit-fill-available;
      background: #090a0f;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      perspective: 1000px;
      color: #ffffff;
    }

    /* 3D 배경 그라디언트 빛 */
    .bg-glow {
      position: absolute;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(0, 242, 254, 0.25) 0%, rgba(79, 172, 254, 0.1) 50%, rgba(0,0,0,0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      filter: blur(40px);
      z-index: 1;
    }

    /* 카드 메인 컨테이너 */
    .card-container {
      position: relative;
      width: var(--card-width);
      height: var(--card-height);
      z-index: 10;
      transform-style: preserve-3d;
      transition: transform 0.1s ease-out;
    }

    .card {
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(25px) saturate(180%);
      -webkit-backdrop-filter: blur(25px) saturate(180%);
      border-radius: 36px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 30px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5),
                  inset 0 1px 0 rgba(255, 255, 255, 0.3);
      position: relative;
      overflow: hidden;
    }

    /* 네온 카드 반사 빛 효과 */
    .card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at center, rgba(255,255,255,0.15) 0%, transparent 60%);
      pointer-events: none;
      transform: translateZ(20px);
    }

    /* 프로필 이미지 세션 */
    .profile-avatar-wrapper {
      position: relative;
      width: 130px;
      height: 130px;
      margin-top: 15px;
      margin-bottom: 20px;
      transform: translateZ(40px);
    }

    .profile-avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 10px 25px rgba(0, 242, 254, 0.3);
      background: #1e293b;
    }

    /* Photo Upload Button */
    .upload-btn {
      position: absolute;
      bottom: -5px;
      right: -5px;
      background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      font-size: 16px;
    }

    #file-input {
      display: none;
    }

    /* 텍스트 정보 필드 */
    .info-group {
      text-align: center;
      width: 100%;
      transform: translateZ(30px);
    }

    .editable-text {
      outline: none;
      border-radius: 8px;
      padding: 2px 6px;
      transition: background 0.2s;
    }

    .editable-text:focus {
      background: rgba(255, 255, 255, 0.15);
      border: 1px dashed rgba(255, 255, 255, 0.5);
    }

    .user-name {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .user-role {
      font-size: 14px;
      color: var(--primary-color);
      font-weight: 500;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .user-bio {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    /* 태그 목록 */
    .tag-container {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 30px;
      transform: translateZ(25px);
    }

    .tag {
      font-size: 11px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 6px 12px;
      border-radius: 20px;
      color: #e2e8f0;
    }

    /* iOS 센서 권한 허용 버튼 */
    .permission-btn {
      position: absolute;
      bottom: 20px;
      padding: 10px 18px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 20px;
      color: #fff;
      font-size: 12px;
      backdrop-filter: blur(10px);
      cursor: pointer;
      z-index: 100;
      transform: translateZ(50px);
    }
  </style>
</head>
<body>

  <div class="bg-glow"></div>

  <!-- 카드 본체 -->
  <div class="card-container" id="cardContainer">
    <div class="card">
      
      <!-- 프로필 사진 영역 -->
      <div class="profile-avatar-wrapper">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80" id="profileImage" class="profile-avatar" alt="Profile" />
        <button class="upload-btn" onclick="document.getElementById('file-input').click()">📷</button>
        <input type="file" id="file-input" accept="image/*" onchange="loadPhoto(event)" />
      </div>

      <!-- 사용자 정보 (클릭 시 직접 수정 가능) -->
      <div class="info-group">
        <h2 class="user-name editable-text" contenteditable="true">김경훈</h2>
        <p class="user-role editable-text" contenteditable="true">AI & Graphic Engineer</p>
        <p class="user-bio editable-text" contenteditable="true">"아이폰 17 프로 공간 인터랙션 웹 앱 프로젝트"</p>
      </div>

      <!-- 태그 항목 -->
      <div class="tag-container">
        <span class="tag">#3D_Card</span>
        <span class="tag">#VibeCoding</span>
        <span class="tag">#iOS17Pro</span>
      </div>

      <!-- 모션 권한 요청 버튼 (iOS 전용) -->
      <button class="permission-btn" id="sensorBtn" onclick="requestGyroPermission()">📱 폰 움직임 센서 활성화</button>
    </div>
  </div>

  <script>
    const cardContainer = document.getElementById('cardContainer');
    const profileImage = document.getElementById('profileImage');
    const sensorBtn = document.getElementById('sensorBtn');

    // 1. 이미지 로드 기능 (폰에 저장된 사진 불러오기)
    function loadPhoto(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          profileImage.src = e.target.result;
        }
        reader.readAsDataURL(file);
      }
    }

    // 2. 카드 3D 회전 적용 함수
    function setCardRotation(rotateX, rotateY) {
      cardContainer.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    }

    // 3. 마우스 호버 기반 3D 기울임 (PC 테스트용)
    window.addEventListener('mousemove', (e) => {
      if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') {
        // iOS 센서 작동 중일 때는 마우스 이벤트 제한
        return;
      }
      const xAxis = (window.innerWidth / 2 - e.pageX) / 12;
      const yAxis = (window.innerHeight / 2 - e.pageY) / 12;
      setCardRotation(yAxis, -xAxis);
    });

    // 4. 아이폰 기기 자이로/모션 감지 (Device Orientation)
    function handleOrientation(event) {
      // event.beta: 전후 기울기 (-180 ~ 180)
      // event.gamma: 좌우 기울기 (-90 ~ 90)
      let x = event.beta;  
      let y = event.gamma; 

      // 각도 제한 및 민감도 조절
      if (x > 45) x = 45;
      if (x < -45) x = -45;
      if (y > 45) y = 45;
      if (y < -45) y = -45;

      const rotateX = (x / 2.5); 
      const rotateY = (y / 2.5);

      setCardRotation(rotateX, rotateY);
    }

    // 5. iOS 13+ 모션 센서 권한 요청
    function requestGyroPermission() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(permissionState => {
            if (permissionState === 'granted') {
              window.addEventListener('deviceorientation', handleOrientation);
              sensorBtn.style.display = 'none';
            } else {
              alert('자이로 센서 접근 권한이 거부되었습니다.');
            }
          })
          .catch(console.error);
      } else if (window.DeviceOrientationEvent) {
        // Android 및 일반 브라우저
        window.addEventListener('deviceorientation', handleOrientation);
        sensorBtn.style.display = 'none';
      } else {
        alert('이 기기에서는 자이로 센서를 지원하지 않습니다.');
      }
    }

    // 초기 화면 준비 완료
    window.addEventListener('DOMContentLoaded', () => {
      // iOS가 아니면 버튼 자동 숨김 및 센서 자동 연결 시도
      if (! (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function')) {
        if (window.DeviceOrientationEvent) {
          window.addEventListener('deviceorientation', handleOrientation);
        }
        sensorBtn.style.display = 'none';
      }
    });
  </script>
</body>
</html>
