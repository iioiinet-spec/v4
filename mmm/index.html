<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>말랑말랑 특공대</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700&display=swap">
<style>
/* Layout: 전체 화면 캔버스 위에 HUD와 화면 패널이 겹치는 단일 룩의 게임. 젤리 민트(주인공) 대 바이러스 핑크(적)의 대비. */
:root{
  --ink:#0b1720; --deep:#102a33; --panel:#16323c; --panel2:#1f4350; --line:#2c5a69;
  --mint:#62f0c4; --mint-d:#17a584; --pink:#ff4f93; --gold:#ffd24a; --sky:#6cc7ff; --violet:#c79bff;
  --text:#eaf7f2; --mute:#92b7ae;
  --r0:#9fb3ad; --r1:#6cc7ff; --r2:#c79bff; --r3:#ffd24a;
  --f-d:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-b:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font:500 15px/1.5 var(--f-b);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
button{font:inherit;color:inherit}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;background:var(--ink)}

.screen,.hud{position:fixed;inset:0;padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen{display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y}
.screen.veil{background:radial-gradient(ellipse at 50% 30%,#14404acc,#0b1720f2 70%)}
.screen.dim{background:#050d13d9;align-items:center;justify-content:center}
.hud{pointer-events:none;z-index:5}
.hud button{pointer-events:auto}
[hidden]{display:none!important}

h1,h2,h3{font-family:var(--f-d);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
.btn{font:400 20px/1 var(--f-d);color:#05281f;background:linear-gradient(#8bf7d6,var(--mint));border:0;border-radius:999px;padding:15px 28px;box-shadow:0 5px 0 var(--mint-d),0 12px 20px #0007;cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--mint-d),0 6px 12px #0007}
.btn.alt{background:var(--panel2);color:var(--text);box-shadow:0 5px 0 #0b2027,inset 0 0 0 2px var(--line)}
.btn.danger{background:linear-gradient(#ff9bc2,var(--pink));color:#3a0016;box-shadow:0 5px 0 #b01f5c}
.btn.sm{font-size:16px;padding:10px 18px;box-shadow:0 4px 0 var(--mint-d)}
.btn.sm.alt{box-shadow:0 4px 0 #0b2027,inset 0 0 0 2px var(--line)}
.btn:disabled{opacity:.45;filter:grayscale(.7);cursor:default}
.btn:focus-visible,.tab:focus-visible,.card:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* 타이틀 */
.title-wrap{margin:auto;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;max-width:520px;width:100%;padding-block:12px}
.logo{font:400 clamp(44px,12vw,78px)/.95 var(--f-d);color:var(--mint);text-shadow:0 4px 0 var(--mint-d),0 9px 0 #0a4a3b,0 18px 28px #0009;transform:rotate(-2deg)}
.logo small{display:block;font-size:.34em;color:var(--pink);text-shadow:0 2px 0 #7a1840;letter-spacing:.12em;margin-bottom:6px}
.sub{color:var(--mute);margin:0}
.stack{display:flex;flex-direction:column;gap:14px;width:min(320px,100%)}
.mini{font-size:13px;color:var(--mute)}
.confirm{background:#3a0f22;border:2px solid var(--pink);border-radius:16px;padding:14px;text-align:center}
.confirm p{margin:0 0 10px}

/* 스토리 */
.story-box{margin-top:auto;background:#07151bf0;border:2px solid var(--line);border-radius:20px;padding:18px 20px;min-height:132px;position:relative;max-width:760px;width:100%;align-self:center;margin-bottom:6px}
.story-box .who{font:400 15px var(--f-d);color:var(--pink);letter-spacing:.08em;margin-bottom:4px}
.story-box p{margin:0;font-size:clamp(15px,3.8vw,19px);line-height:1.65;word-break:keep-all}
.story-box .next{position:absolute;right:18px;bottom:12px;width:0;height:0;border-left:11px solid var(--mint);border-top:7px solid transparent;border-bottom:7px solid transparent;animation:nudge .9s infinite}
@keyframes nudge{50%{transform:translateX(5px)}}
.skip{align-self:flex-end;font:400 15px var(--f-d);background:#07151bcc;border:2px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer}

/* 로비 */
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.coin{font:400 22px var(--f-d);color:var(--gold);display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.coin svg{width:24px;height:24px}
.lobby{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:center;flex:1;max-width:900px;width:100%;margin:0 auto}
.hero-stage{display:flex;flex-direction:column;align-items:center;gap:10px}
.hero-stage canvas{width:min(100%,280px);aspect-ratio:1;max-width:100%}
.menu{display:flex;flex-direction:column;gap:14px}
.rec{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.rec div{background:#0e232b;border:2px solid var(--line);border-radius:14px;padding:8px 12px}
.rec b{display:block;font:400 20px var(--f-d);color:var(--mint);font-variant-numeric:tabular-nums}
.rec span{font-size:12px;color:var(--mute)}
.loadline{font-size:13px;color:var(--mute);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--panel2);border-radius:999px;padding:3px 10px 3px 6px;font-size:12px;color:var(--text)}
.chip svg{width:16px;height:16px}
@media (max-width:680px){.lobby{grid-template-columns:1fr;gap:12px}.hero-stage canvas{width:150px}}

/* 상점 */
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{font:400 18px var(--f-d);background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:9px 20px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--mint);color:#05281f;border-color:var(--mint)}
.shop-body{flex:1;max-width:980px;width:100%;margin:14px auto 0;min-height:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px;text-align:left;min-width:0}
.card.r1{border-color:#3b7aa0}.card.r2{border-color:#8c6bc2}.card.r3{border-color:#c9a02c;background:linear-gradient(#1b3a3f,var(--panel))}
.card.on{box-shadow:0 0 0 3px var(--mint)}
.card h3{font-size:18px;display:flex;align-items:center;gap:8px}
.card p{margin:0;font-size:13px;color:var(--mute);word-break:keep-all}
.ic{width:42px;height:42px;border-radius:14px;background:#0d2229;display:grid;place-items:center;flex:none}
.ic svg{width:26px;height:26px}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row>div{min-width:0}
.tag{font-size:11px;border-radius:999px;padding:2px 8px;background:#0d2229;color:var(--mute)}
.tag.r1{color:var(--r1)}.tag.r2{color:var(--r2)}.tag.r3{color:var(--r3)}
.pips{display:flex;gap:4px}.pips i{width:14px;height:6px;border-radius:3px;background:#0d2229}.pips i.f{background:var(--mint)}
.price{font:400 16px var(--f-d);color:var(--gold);display:flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.price svg{width:16px;height:16px}
.cardfoot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;gap:8px}
.slotsec{margin:0 0 6px;font:400 17px var(--f-d);color:var(--mute)}
.slotsec+.grid{margin-bottom:20px}
.note{background:#0e232b;border:2px dashed var(--line);border-radius:14px;padding:10px 14px;font-size:13px;color:var(--mute);margin-bottom:12px}

/* 레벨업 */
.lvwrap{width:min(900px,100%);display:flex;flex-direction:column;gap:14px;align-items:center}
.lvwrap h2{font-size:clamp(26px,7vw,40px);color:var(--gold);text-shadow:0 3px 0 #7a5a00}
.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;width:100%}
.cards3 .card{padding:16px;cursor:pointer;min-height:190px;transition:transform .1s}
.cards3 .card:hover{transform:translateY(-4px)}
.cards3 .ic{width:56px;height:56px}.cards3 .ic svg{width:36px;height:36px}
.new{font:400 12px var(--f-d);background:var(--pink);color:#3a0016;border-radius:999px;padding:2px 9px}
@media (max-width:680px){.cards3{grid-template-columns:1fr;gap:10px}.cards3 .card{min-height:0;flex-direction:row;align-items:center;padding:12px}.cards3 .card .body{flex:1;min-width:0}}

/* 결과 */
.resbox{background:var(--panel);border:2px solid var(--line);border-radius:24px;padding:22px;width:min(520px,100%);display:flex;flex-direction:column;gap:14px;text-align:center}
.resbox h2{font-size:clamp(30px,8vw,44px)}
.resbox.win h2{color:var(--gold)}.resbox.lose h2{color:var(--pink)}
.res-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;text-align:left}
.res-grid div{background:#0e232b;border-radius:12px;padding:8px 12px;font-size:13px;color:var(--mute)}
.res-grid b{display:block;font:400 20px var(--f-d);color:var(--text);font-variant-numeric:tabular-nums}
.res-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* HUD */
.hud-top{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:start}
.hud-l{display:flex;flex-direction:column;gap:6px;min-width:0}
.hp-row{display:flex;align-items:center;gap:8px}
.lvb{font:400 18px var(--f-d);background:var(--gold);color:#4a3600;border-radius:12px;padding:2px 9px;box-shadow:0 3px 0 #a47d00;flex:none}
.bar{position:relative;height:16px;background:#0b1a20cc;border:2px solid #000a;border-radius:999px;overflow:hidden;flex:1;max-width:240px}
.bar i{position:absolute;inset:0 auto 0 0;width:100%;background:linear-gradient(#ff8db8,var(--pink));transition:width .12s}
.bar b{position:absolute;inset:0;font:400 11px/12px var(--f-d);text-align:center;color:#fff;text-shadow:0 1px 2px #000}
.icons{display:flex;gap:4px;flex-wrap:wrap;max-width:240px}
.icons .mi{position:relative;width:26px;height:26px;border-radius:8px;background:#0b1a20cc;display:grid;place-items:center}
.icons .mi svg{width:17px;height:17px}
.icons .mi em{position:absolute;right:-3px;bottom:-4px;font:400 10px/1 var(--f-d);font-style:normal;background:#000b;color:#fff;border-radius:6px;padding:1px 3px}
.hud-c{text-align:center}
.hud-c .time{font:400 34px/1 var(--f-d);text-shadow:0 3px 0 #000a;font-variant-numeric:tabular-nums}
.hud-c .stage{font:400 13px var(--f-d);color:var(--mint);letter-spacing:.1em}
.hud-r{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.hud-r .coin{font-size:18px;background:#0b1a20cc;border-radius:999px;padding:2px 12px 2px 8px}
.pbtn{white-space:nowrap;font:400 14px var(--f-d);background:#0b1a20cc;border:2px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
.bossbar{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 80px);width:min(340px,64vw);margin:0}
.bossbar span{display:block;font:400 15px var(--f-d);color:#fff;text-shadow:0 2px 0 #000,0 0 8px #000;margin-bottom:2px}
.bossbar .bar{max-width:none;height:14px}
.xpbar{position:absolute;left:0;right:0;bottom:0;height:8px;background:#0b1a20cc}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5ad0ff,var(--mint))}
.bombbtn{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:78px;height:78px;border-radius:50%;border:0;background:linear-gradient(#ffe27a,var(--gold));color:#4a3600;font:400 15px/1.1 var(--f-d);box-shadow:0 5px 0 #a47d00,0 10px 18px #0008;cursor:pointer}
.bombbtn b{display:block;font-size:22px}
#joy{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:3px solid #ffffff55;background:#ffffff14;pointer-events:none;z-index:6}
#joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:#ffffff88}
#banner{position:fixed;left:0;right:0;top:26%;text-align:center;z-index:20;pointer-events:none;font:400 clamp(28px,8vw,58px)/1.1 var(--f-d);color:var(--gold);text-shadow:0 4px 0 #7a5a00,0 10px 24px #000b;opacity:0;padding:0 16px}
#banner.show{animation:ban 2.6s ease both}
#banner.bad{color:var(--pink);text-shadow:0 4px 0 #7a1840,0 10px 24px #000b}
@keyframes ban{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.08)}20%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 110px);transform:translateX(-50%);background:#07151bf0;border:2px solid var(--line);border-radius:999px;padding:8px 18px;font:400 16px var(--f-d);z-index:30;pointer-events:none;max-width:90vw;text-align:center}
.tip{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 40px);transform:translateX(-50%);background:#07151bd0;border-radius:16px;padding:10px 16px;font-size:14px;color:var(--text);z-index:8;pointer-events:none;text-align:center;width:max-content;max-width:88vw}
.pause-box{background:var(--panel);border:2px solid var(--line);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:12px;width:min(340px,100%);text-align:center}
.dlg{background:#07151bf5;border:2px solid var(--pink);border-radius:20px;padding:18px 20px;width:min(640px,100%);display:flex;flex-direction:column;gap:12px}
.dlg .who{font:400 18px var(--f-d);color:var(--pink)}
.dlg p{margin:0;font-size:17px;line-height:1.6;word-break:keep-all}

/* 관리자 모드 */
.hud-c .time{pointer-events:auto;cursor:pointer}
.adm{background:#061119f5}
.admbox{width:min(780px,100%);margin:0 auto;display:flex;flex-direction:column;gap:8px;padding-block:4px}
.admhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:-6px;background:#061119f5;padding:8px 0;z-index:2}
.admhead h2{font-size:24px;color:var(--gold)}
.admsec{font:400 17px var(--f-d);color:var(--mint);margin:8px 0 0}
.admgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,232px),1fr));gap:8px}
.admrow{display:flex;align-items:center;gap:7px;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:6px 8px;min-width:0}
.admrow .ic{width:30px;height:30px;border-radius:9px}
.admrow .ic svg{width:19px;height:19px}
.admrow b{font:400 14px var(--f-d);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.admrow .lvn{font:400 15px var(--f-d);color:var(--gold);min-width:38px;text-align:center;font-variant-numeric:tabular-nums}
.sq{width:30px;height:30px;flex:none;border:0;border-radius:9px;background:var(--panel2);color:var(--text);font:400 18px/1 var(--f-d);cursor:pointer;box-shadow:0 3px 0 #0b2027}
.sq.p{background:var(--mint);color:#05281f;box-shadow:0 3px 0 var(--mint-d)}
.sq:active{transform:translateY(2px);box-shadow:0 1px 0 #0b2027}
.sq:disabled{opacity:.3;cursor:default;transform:none}
@media (prefers-reduced-motion:reduce){#banner.show{animation:none;opacity:1}.story-box .next{animation:none}}
</style>
<canvas id="cv"></canvas>
<div id="hud" class="hud" hidden>
  <div class="hud-top">
    <div class="hud-l">
      <div class="hp-row"><span class="lvb" id="hLv">Lv.1</span><div class="bar"><i id="hHp"></i><b id="hHpT"></b></div></div>
      <div class="icons" id="hSk"></div>
      <div class="icons" id="hPs"></div>
    </div>
    <div class="hud-c">
      <div class="stage" id="hStage">STAGE 1 / 7</div>
      <div class="time" id="hTime">00:00</div>
      <div class="bossbar" id="hBoss" hidden><span id="hBossN"></span><div class="bar"><i id="hBossHp"></i></div></div>
    </div>
    <div class="hud-r">
      <div class="coin" id="hGold"></div>
      <button class="pbtn" id="bPause" type="button">일시정지</button>
    </div>
  </div>
  <button class="bombbtn" id="bBomb" type="button" hidden>폭탄<b id="hBomb">0</b></button>
  <div class="xpbar"><i id="hXp"></i></div>
</div>
<div id="joy" hidden><i></i></div>
<div id="ui"></div>
<div id="modal"></div>
<div id="banner"></div>
<div id="toast" hidden></div>
<script>
'use strict';
/* ================= 데이터: 스킬 / 패시브 / 적 / 보스 / 상점 / 장비 / 스토리 ================= */
const GL={
 drop:'<path d="M12 3c3.5 4.6 6 7.6 6 11a6 6 0 0 1-12 0c0-3.4 2.5-6.4 6-11z"/>',
 orbit:'<circle cx="12" cy="12" r="3"/><circle cx="12" cy="4.5" r="2.4"/><circle cx="18.5" cy="15.8" r="2.4"/><circle cx="5.5" cy="15.8" r="2.4"/>',
 puddle:'<ellipse cx="12" cy="15.5" rx="9" ry="5"/><circle cx="9" cy="9" r="2.6"/><circle cx="15.5" cy="7.5" r="1.8"/>',
 bounce:'<circle cx="8" cy="16" r="4.2"/><path d="M12 12l8-8M15 4h5v5" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>',
 wave:'<circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".6"/>',
 mist:'<circle cx="8" cy="14" r="4.5"/><circle cx="14.5" cy="11" r="5.5"/><circle cx="17" cy="16" r="3.5"/>',
 bolt:'<path d="M13 2L5 13.5h5.5L9 22l9-12h-5.5z"/>',
 bomb:'<circle cx="11" cy="14" r="7"/><path d="M16 7l3-3M18 3.5l.5 2 2 .5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>',
 pet:'<ellipse cx="12" cy="15" rx="8" ry="6.5"/><circle cx="9.3" cy="14" r="1.3" fill="#000" fill-opacity=".6"/><circle cx="14.7" cy="14" r="1.3" fill="#000" fill-opacity=".6"/><path d="M8 5l2 3M16 5l-2 3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
 heart:'<path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/>',
 star:'<path d="M12 2l2.9 6.3 6.8.8-5 4.7 1.3 6.8L12 17.2 6 20.6l1.3-6.8-5-4.7 6.8-.8z"/>',
 boot:'<path d="M8 3h6v8l6 3v5H5v-5l3-2z"/>',
 clover:'<circle cx="9" cy="9" r="4"/><circle cx="15" cy="9" r="4"/><circle cx="9" cy="15" r="4"/><circle cx="15" cy="15" r="4"/>',
 magnet:'<path d="M5 3h5v9a2 2 0 0 0 4 0V3h5v9a7 7 0 0 1-14 0z"/>',
 shield:'<path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z"/>',
 crown:'<path d="M3 18l-1-11 5 4 5-7 5 7 5-4-1 11z"/>',

/* ---- 저장 (localStorage가 막혀도 메모리로 동작) ---- */
const SAVE_KEY='mallang-tangtang-v1';
let memSave=null, SAVE=null, storageOK=true;
const defaultSave=()=>({v:1,jelly:0,up:{},items:{},loadout:[],own:{w0:0},eq:{},
  flags:{intro:false,firstRun:false,cleared:false},
  stat:{runs:0,wins:0,bestTime:0,bestStage:0,kills:0,totalJelly:0,bossKills:0,mapBest:{}},lastMap:'grass',sound:true});
function readSave(){
  let raw=null;
  try{raw=localStorage.getItem(SAVE_KEY)}catch(e){storageOK=false}
  if(!raw)return memSave?JSON.parse(memSave):null;
  try{
    const d=JSON.parse(raw),b=defaultSave();
    return Object.assign(b,d,{flags:Object.assign(b.flags,d.flags),stat:Object.assign(b.stat,d.stat)});
  }catch(e){return null}
}
function writeSave(){
  const s=JSON.stringify(SAVE);memSave=s;
  try{localStorage.setItem(SAVE_KEY,s)}catch(e){storageOK=false}
}
function wipeSave(){
  memSave=null;
  try{localStorage.removeItem(SAVE_KEY)}catch(e){}
  SAVE=defaultSave();
}

let AC=null;const lastSfx={};
const SFX={hit:[260,.05,'square',.025,180],pick:[880,.05,'sine',.03],gem:[1300,.035,'sine',.02],level:[520,.28,'triangle',.07,1250],
 boss:[120,.7,'sawtooth',.09,50],hurt:[170,.14,'sawtooth',.05,70],shoot:[560,.05,'triangle',.018,380],boom:[100,.22,'sawtooth',.07,38],
 zap:[1100,.09,'square',.025,300],ui:[540,.06,'triangle',.04],win:[523,.7,'triangle',.07,1046],buy:[700,.12,'triangle',.05,1100],pulse:[200,.2,'sine',.05,60]};
function sfx(k){
  if(!SAVE||!SAVE.sound)return;
  const now=performance.now();if(lastSfx[k]&&now-lastSfx[k]<45)return;lastSfx[k]=now;
  const S=SFX[k];if(!S)return;
  try{
    AC=AC||new(window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
    o.type=S[2];o.frequency.setValueAtTime(S[0],t);
    if(S[4])o.frequency.exponentialRampToValueAtTime(S[4],t+S[1]);
    g.gain.setValueAtTime(S[3],t);g.gain.exponentialRampToValueAtTime(.0001,t+S[1]);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+S[1]+.02);
  }catch(e){}
}

const keys={};

addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  if(typeof onKey==='function')onKey(e);
});
addEventListener('keyup',e=>{keys[e.code]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;joy.on=false;if(typeof onBlur==='function')onBlur()});
function moveVec(){
  let x=0,y=0;
  if(keys.KeyA||keys.ArrowLeft)x--;if(keys.KeyD||keys.ArrowRight)x++;
  if(keys.KeyW||keys.ArrowUp)y--;if(keys.KeyS||keys.ArrowDown)y++;
  if(x||y){const l=Math.hypot(x,y);return[x/l,y/l]}
  if(joy.on){
    let dx=joy.x-joy.ox,dy=joy.y-joy.oy;const l=Math.hypot(dx,dy);
    if(l>8){const m=Math.min(1,l/55);return[dx/l*m,dy/l*m]}
  }
  return[0,0];
}

const joyEl=$('#joy'),joyKnob=$('#joy i');
cv.addEventListener('pointerdown',e=>{
  if(!(G&&G.mode==='play'&&appState==='play'))return;
  if(joy.on)return;
  joy.on=true;joy.id=e.pointerId;joy.ox=joy.x=e.clientX;joy.oy=joy.y=e.clientY;
  if(e.pointerType!=='mouse'||true){joyEl.hidden=false;joyEl.style.left=e.clientX+'px';joyEl.style.top=e.clientY+'px';joyKnob.style.transform='translate(0,0)'}
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
});
cv.addEventListener('pointermove',e=>{
  if(!joy.on||e.pointerId!==joy.id)return;
  joy.x=e.clientX;joy.y=e.clientY;
  let dx=joy.x-joy.ox,dy=joy.y-joy.oy;const l=Math.hypot(dx,dy);
  if(l>55){joy.ox=joy.x-dx/l*55;joy.oy=joy.y-dy/l*55;dx=joy.x-joy.ox;dy=joy.y-joy.oy;joyEl.style.left=joy.ox+'px';joyEl.style.top=joy.oy+'px'}
  joyKnob.style.transform=`translate(${dx}px,${dy}px)`;
});
const joyEnd=e=>{if(e.pointerId===joy.id){joy.on=false;joyEl.hidden=true}};
cv.addEventListener('pointerup',joyEnd);cv.addEventListener('pointercancel',joyEnd);

/* ================= 그리기: 주인공 / 적 / 보스 / 배경 ================= */
const TIER_CAPE=['#c76b8a','#e08aa8','#9ac6e0','#f2d06b'];
const eqTier=slot=>{const id=SAVE&&SAVE.eq[slot];return id&&EQUIP[id]?EQUIP[id].t:-1};

let LOD=false;
function blob(c,rx,ry,col,hi){
  c.fillStyle=col;c.beginPath();c.ellipse(0,0,rx,ry,0,0,TAU);c.fill();
  if(LOD)return;
  c.fillStyle=hi||'rgba(255,255,255,.28)';c.beginPath();c.ellipse(-rx*.32,-ry*.42,rx*.36,ry*.22,-.5,0,TAU);c.fill();
}
function redEye(c,x,y,r){
  c.fillStyle='#ff2a4a';c.beginPath();c.arc(x,y,r,0,TAU);c.fill();
  if(LOD)return;
  c.fillStyle='#3a0010';c.beginPath();c.arc(x,y,r*.4,0,TAU);c.fill();
  c.fillStyle='#fff';c.beginPath();c.arc(x-r*.3,y-r*.3,r*.22,0,TAU);c.fill();
}
function shadow(c,r,y){c.fillStyle='rgba(0,0,0,.28)';c.beginPath();c.ellipse(0,y,r,r*.36,0,0,TAU);c.fill()}

/* ---- 슬라임 왕자 ---- */
function drawHero(c,x,y,sc,t,o){
  o=o||{};const mv=o.mv||0,b=Math.sin(t*(mv?13:4));
  const sy=1+b*(mv?.11:.045),sx=1-b*(mv?.08:.03);
  c.save();c.translate(x,y);c.scale(sc,sc);
  shadow(c,16,14);
  const bt=eqTier('body');
  if(bt>=0){c.fillStyle=TIER_CAPE[bt];c.beginPath();c.moveTo(-12,-6);c.quadraticCurveTo(-24*(o.face||1)*-1+(-4),6,-17,16);c.lineTo(10,12);c.lineTo(12,-6);c.closePath();c.fill()}
  c.translate(0,12);c.scale(sx,sy);c.translate(0,-12);
  const g=c.createRadialGradient(-6,-8,2,0,0,20);g.addColorStop(0,'#d4fff3');g.addColorStop(.45,'#62f0c4');g.addColorStop(1,'#25b48f');
  c.fillStyle=g;c.beginPath();c.ellipse(0,0,16.5,14,0,0,TAU);c.fill();
  c.fillStyle='rgba(255,255,255,.55)';c.beginPath();c.ellipse(-7,-8,5,2.6,-.5,0,TAU);c.fill();
  const f=o.face||1;
  c.fillStyle='#10343a';c.beginPath();c.ellipse(-5+f*1.5,-1,2.4,3.1,0,0,TAU);c.ellipse(5+f*1.5,-1,2.4,3.1,0,0,TAU);c.fill();
  c.fillStyle='#fff';c.beginPath();c.arc(-5.8+f*1.5,-2.2,.9,0,TAU);c.arc(4.2+f*1.5,-2.2,.9,0,TAU);c.fill();
  c.fillStyle='rgba(255,120,150,.55)';c.beginPath();c.ellipse(-9.5+f*1.5,3,2.4,1.5,0,0,TAU);c.ellipse(9.5+f*1.5,3,2.4,1.5,0,0,TAU);c.fill();
  c.strokeStyle='#10343a';c.lineWidth=1.5;c.beginPath();c.arc(f*1.5,3,3,.15*Math.PI,.85*Math.PI);c.stroke();
  const ft=eqTier('feet');if(ft>=0){c.fillStyle=RCOL[ft];c.beginPath();c.ellipse(-8,13,5,2.6,0,0,TAU);c.ellipse(8,13,5,2.6,0,0,TAU);c.fill()}
  const tt=eqTier('trinket');if(tt>=0){c.fillStyle=RCOL[tt];c.beginPath();c.arc(0,9,2.6,0,TAU);c.fill()}
  const ht=eqTier('head'),cc=ht<0?'#ffd24a':['#7bd36b','#d9954f','#ff7fd0','#ffd24a'][ht];
  c.fillStyle=cc;c.beginPath();c.moveTo(-8,-12);c.lineTo(-9,-21);c.lineTo(-4,-16);c.lineTo(0,-23);c.lineTo(4,-16);c.lineTo(9,-21);c.lineTo(8,-12);c.closePath();c.fill();
  if(ht===3){const rg=c.createLinearGradient(-9,0,9,0);['#ff6b6b','#ffd24a','#7ee27e','#6cc7ff','#c79bff'].forEach((k,i)=>rg.addColorStop(i/4,k));c.fillStyle=rg;c.fillRect(-8,-15,16,3)}
  else{c.fillStyle='#ff4f93';c.beginPath();c.arc(0,-14.5,1.7,0,TAU);c.fill()}
  const wt=eqTier('weapon');
  if(wt>=0){c.save();c.translate(15*f,3);c.rotate(.5*f+Math.sin(t*3)*.08);c.strokeStyle='#e8d6b5';c.lineWidth=2.4;c.lineCap='round';c.beginPath();c.moveTo(0,8);c.lineTo(0,-8);c.stroke();c.fillStyle=RCOL[wt];c.beginPath();c.arc(0,-10,3.4+wt*.5,0,TAU);c.fill();c.restore()}
  if(o.flash>0){c.globalAlpha=Math.min(.85,o.flash*5);c.fillStyle='#fff';c.beginPath();c.ellipse(0,0,16.5,14,0,0,TAU);c.fill()}
  c.restore();
}

/* ---- 적 ---- */
function drawEnemyBody(c,type,r,ph,e){
  const d=EN[type];e=e||{};
  switch(type){
  case 'slime':{const s=Math.sin(ph*5);c.scale(1+s*.06,1-s*.06);blob(c,r*1.1,r*.95,d.col,'rgba(255,255,255,.3)');
    c.fillStyle='#8fe05a';c.beginPath();c.ellipse(r*.5,r*.85,2.4,4,0,0,TAU);c.fill();
    redEye(c,-r*.38,-r*.1,r*.3);redEye(c,r*.38,-r*.1,r*.3);
    c.strokeStyle='#2a0a3a';c.lineWidth=2;c.beginPath();c.moveTo(-r*.7,-r*.5);c.lineTo(-r*.15,-r*.3);c.moveTo(r*.7,-r*.5);c.lineTo(r*.15,-r*.3);c.stroke();break}
  case 'rabbit':{c.translate(0,-Math.abs(Math.sin(ph*6))*6);
    c.fillStyle='#d9cfe0';[-1,1].forEach(k=>{c.beginPath();c.ellipse(k*r*.45,-r*1.2,r*.28,r*.85,k*.2,0,TAU);c.fill()});
    c.fillStyle='#ff9bb5';[-1,1].forEach(k=>{c.beginPath();c.ellipse(k*r*.45,-r*1.15,r*.1,r*.55,k*.2,0,TAU);c.fill()});
    blob(c,r*1.05,r,d.col);redEye(c,-r*.4,-r*.1,r*.27);redEye(c,r*.4,-r*.1,r*.27);
    c.strokeStyle='#4a2a5a';c.lineWidth=1.6;c.beginPath();for(let i=0;i<5;i++)c.lineTo(-r*.4+i*r*.2,r*.45+(i%2?3:-1));c.stroke();break}
  case 'bat':{const w=Math.sin(ph*14);c.fillStyle=d.col;
    [-1,1].forEach(k=>{c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(k*r*1.8,-r*(1.4+w),k*r*2.4,-r*.2*w);c.quadraticCurveTo(k*r*1.5,r*.9,0,r*.6);c.fill()});
    blob(c,r*.95,r*.9,'#3b2060');redEye(c,-r*.35,-r*.1,r*.25);redEye(c,r*.35,-r*.1,r*.25);break}
  case 'shroom':{c.fillStyle='#f3e3c8';c.beginPath();c.ellipse(0,r*.35,r*.7,r*.85,0,0,TAU);c.fill();
    c.fillStyle=d.col;c.beginPath();c.ellipse(0,-r*.35,r*1.25,r*.85,0,Math.PI,TAU);c.fill();c.fillRect(-r*1.25,-r*.35,r*2.5,r*.18);
    c.fillStyle='#fff';[[-.6,-.8,.22],[.3,-1,.2],[.75,-.5,.16]].forEach(p=>{c.beginPath();c.arc(p[0]*r,p[1]*r,p[2]*r,0,TAU);c.fill()});

/* ================= 장애물 (바위 / 빙산): 길을 막고, 적은 돌아간다 ================= */
let OBS=[],OGN=0,OGRID=[];
const OGC=128;
function buildObstacles(m){
  OBS=[];OGN=Math.ceil(ARENA/OGC)+1;OGRID=[];
  for(let i=0;i<OGN*OGN;i++)OGRID.push([]);
  const cfg=m.obs;if(!cfg)return;
  const R=mulberry(cfg.seed),cx=ARENA/2,cy=ARENA/2;
  let guard=0;
  while(OBS.length<cfg.n&&guard++<cfg.n*80){
    const r=cfg.r0+R()*(cfg.r1-cfg.r0),x=70+R()*(ARENA-140),y=70+R()*(ARENA-140);
    if(Math.hypot(x-cx,y-cy)<280)continue;
    let ok=true;
    for(const o of OBS)if(Math.hypot(x-o.x,y-o.y)<o.r+r+cfg.gap){ok=false;break}
    if(!ok)continue;
    const o={x,y,r,k:cfg.k,sd:R()*100,shape:[]},n=cfg.k==='ice'?7:9;
    for(let i=0;i<n;i++){const a=i/n*TAU,rr=r*(.8+(Math.sin(o.sd+i*2.7)*.5+.5)*.34);o.shape.push([Math.cos(a)*rr,Math.sin(a)*rr])}
    OBS.push(o);
  }
  OBS.forEach((o,idx)=>{
    const x0=clamp(Math.floor((o.x-o.r)/OGC),0,OGN-1),x1=clamp(Math.floor((o.x+o.r)/OGC),0,OGN-1),
          y0=clamp(Math.floor((o.y-o.r)/OGC),0,OGN-1),y1=clamp(Math.floor((o.y+o.r)/OGC),0,OGN-1);
    for(let j=y0;j<=y1;j++)for(let i=x0;i<=x1;i++)OGRID[j*OGN+i].push(idx);
  });
}
let obsTick=1;
function obsEach(x,y,rad,fn){
  if(!OBS.length)return;
  const x0=clamp(Math.floor((x-rad)/OGC),0,OGN-1),x1=clamp(Math.floor((x+rad)/OGC),0,OGN-1),
        y0=clamp(Math.floor((y-rad)/OGC),0,OGN-1),y1=clamp(Math.floor((y+rad)/OGC),0,OGN-1);
  for(let j=y0;j<=y1;j++)for(let i=x0;i<=x1;i++){
    const a=OGRID[j*OGN+i];
    for(let n=0;n<a.length;n++){const o=OBS[a[n]];if(o.dead||o.seen===obsTick)continue;
      if(Math.hypot(o.x-x,o.y-y)<o.r+rad){o.seen=obsTick;fn(o)}}
  }
  obsTick++;
}
function obsHit(x,y,r){let h=false;obsEach(x,y,r,()=>{h=true});return h}
/* 장애물 밖으로 밀어내기 */
function obsResolve(x,y,r){
  obsEach(x,y,r,o=>{
    const dx=x-o.x,dy=y-o.y;let d=Math.hypot(dx,dy);const rr=o.r+r;
    if(d<rr){if(d<.01){x=o.x+rr;y=o.y}else{x=o.x+dx/d*rr;y=o.y+dy/d*rr}}
  });
  return[x,y];
}
/* 앞이 막히면 옆으로 돌아가는 방향 계산 */
function obsSteer(x,y,r,mx,my){
  const L=Math.hypot(mx,my);if(!L)return[mx,my];
  let ax=mx/L,ay=my/L;
  obsEach(x,y,r+44,o=>{
    const dx=x-o.x,dy=y-o.y,d=Math.hypot(dx,dy)||1,rr=o.r+r+38;
    if(d>=rr)return;
    const w=(rr-d)/rr,tx=-dy/d,ty=dx/d,sg=(tx*mx+ty*my)>=0?1:-1;
    ax+=dx/d*w*1.4+tx*sg*w*2;ay+=dy/d*w*1.4+ty*sg*w*2;
  });
  const n=Math.hypot(ax,ay)||1;return[ax/n*L,ay/n*L];
}
function drawObstacles(c,cx,cy,vw,vh,t){
  for(const o of OBS){
    if(o.dead)continue;
    if(o.x<cx-o.r-20||o.x>cx+vw+o.r+20||o.y<cy-o.r-20||o.y>cy+vh+o.r+20)continue;
    c.save();c.translate(o.x,o.y);
    c.fillStyle='rgba(0,0,0,.3)';c.beginPath();c.ellipse(0,o.r*.5,o.r,o.r*.4,0,0,TAU);c.fill();
    c.beginPath();o.shape.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();
    if(o.k==='ice'){
      const g=c.createLinearGradient(0,-o.r,0,o.r);g.addColorStop(0,'#eafaff');g.addColorStop(.55,'#a3dbf2');g.addColorStop(1,'#4f9ec4');
      c.fillStyle=g;c.fill();c.strokeStyle='#e8f9ff';c.lineWidth=2.5;c.stroke();
      c.strokeStyle='rgba(255,255,255,.6)';c.lineWidth=1.8;c.beginPath();
      c.moveTo(0,-o.r*.8);c.lineTo(-o.r*.3,o.r*.15);c.lineTo(o.r*.35,o.r*.7);c.moveTo(0,-o.r*.8);c.lineTo(o.r*.5,o.r*.1);c.stroke();
      c.fillStyle='rgba(255,255,255,.92)';c.beginPath();c.ellipse(-o.r*.12,-o.r*.58,o.r*.5,o.r*.2,-.2,0,TAU);c.fill();
    }else{
      const g=c.createLinearGradient(0,-o.r,0,o.r);g.addColorStop(0,'#938a7e');g.addColorStop(1,'#4e463d');
      c.fillStyle=g;c.fill();c.strokeStyle='#332d27';c.lineWidth=2.5;c.stroke();
      c.fillStyle='rgba(255,255,255,.16)';c.beginPath();c.ellipse(-o.r*.25,-o.r*.4,o.r*.4,o.r*.2,-.4,0,TAU);c.fill();
      c.strokeStyle='rgba(0,0,0,.3)';c.lineWidth=1.8;c.beginPath();c.moveTo(-o.r*.15,-o.r*.2);c.lineTo(o.r*.2,o.r*.3);c.lineTo(o.r*.6,o.r*.05);c.stroke();
      c.fillStyle='#5d8a5a';c.beginPath();c.ellipse(o.r*.1,-o.r*.72,o.r*.34,o.r*.14,.2,0,TAU);c.fill();
    }
    c.restore();
  }
}
function drawGround(c,cx,cy,vw,vh,t){
  const T=96,x0=Math.max(0,Math.floor(cx/T)),x1=Math.min(ARENA/T-1,Math.floor((cx+vw)/T)),y0=Math.max(0,Math.floor(cy/T)),y1=Math.min(ARENA/T-1,Math.floor((cy+vh)/T));

/* ================= 전투: 런 상태 / 스킬 / 적 / 픽업 ================= */
const ARENA=2400,STAGES=7,RUN_LEN=600,STAGE_LEN=RUN_LEN/STAGES,CAP=240;
let G=null,S=null,uid=1,appState='title';
const late=t=>Math.pow(Math.max(0,t-360)/60,2);
const hpScale=t=>1+t/60*.33+Math.pow(t/60,2)*.06+late(t)*.25;
const dmgScale=t=>1+t/60*.10+Math.pow(t/60,2)*.016+late(t)*.03;
const needFor=l=>Math.round(9+l*7+l*l*1.0);
const stageOf=t=>Math.min(STAGES,Math.floor(t/STAGE_LEN)+1);
const compact=a=>{let j=0;for(let i=0;i<a.length;i++)if(!a[i].dead)a[j++]=a[i];a.length=j};

function calcStats(){
  const s={atk:1,hp:100,spd:1,def:0,crit:.05,cdr:0,magnet:1,regen:0,xp:1,gold:1,area:1,proj:0,rev:0};
  const add=(k,v)=>{s[k]=(s[k]||0)+v};
  for(const u of UPGRADES){const l=SAVE.up[u.id]||0;if(l)add(u.stat,u.per*l)}
  for(const sl of SLOTS){const id=SAVE.eq[sl.id];if(id&&EQUIP[id])for(const k in EQUIP[id].st)add(k,EQUIP[id].st[k])}

const GC=64,GN=Math.ceil(ARENA/GC)+1;const grid=[],gUsed=[];
for(let i=0;i<GN*GN;i++)grid.push([]);
function gridReset(){for(const a of grid)a.length=0;gUsed.length=0}
const gk=(x,y)=>clamp(Math.floor(y/GC),0,GN-1)*GN+clamp(Math.floor(x/GC),0,GN-1);
function gridBuild(){
  for(const k of gUsed)grid[k].length=0;gUsed.length=0;
  for(const e of G.en){if(e.dead||e.boss)continue;const k=gk(e.x,e.y),a=grid[k];if(!a.length)gUsed.push(k);a.push(e)}
}
function forHit(x,y,rad,fn){
  const q=rad+28,x0=clamp(Math.floor((x-q)/GC),0,GN-1),x1=clamp(Math.floor((x+q)/GC),0,GN-1),y0=clamp(Math.floor((y-q)/GC),0,GN-1),y1=clamp(Math.floor((y+q)/GC),0,GN-1);
  for(let j=y0;j<=y1;j++)for(let i=x0;i<=x1;i++){
    const a=grid[j*GN+i];
    for(let n=0;n<a.length;n++){const e=a[n];if(e.dead)continue;const dx=e.x-x,dy=e.y-y,rr=e.r+rad;if(dx*dx+dy*dy<rr*rr)fn(e)}
  }
  const b=G.boss;if(b&&!b.dead){const dx=b.x-x,dy=b.y-y,rr=b.r+rad;if(dx*dx+dy*dy<rr*rr)fn(b)}
}
function nearest(x,y,range,excl){
  let best=null,bd=range*range;
  for(const e of G.en){if(e.dead||(excl&&excl.has(e.id)))continue;const dx=e.x-x,dy=e.y-y,d=dx*dx+dy*dy;if(d<bd){bd=d;best=e}}
  return best;
}
function nearestN(x,y,range,n){
  const arr=[],r2=range*range;
  for(const e of G.en){if(e.dead)continue;const dx=e.x-x,dy=e.y-y,d=dx*dx+dy*dy;if(d<r2)arr.push([d,e])}
  arr.sort((a,b)=>a[0]-b[0]);return arr.slice(0,n).map(a=>a[1]);
}

function distSeg(px,py,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,l=dx*dx+dy*dy||1,t=clamp(((px-x1)*dx+(py-y1)*dy)/l,0,1);return Math.hypot(px-(x1+dx*t),py-(y1+dy*t))}
function zone(o){G.zn.push(Object.assign({age:0,done:false,delay:0,dmg:10,tk:0},o))}
function updHostile(dt){
  const p=G.p;
  for(const b of G.eb){
    if(b.hom){
      const sp=Math.hypot(b.vx,b.vy),ca=Math.atan2(b.vy,b.vx);let da=Math.atan2(p.y-b.y,p.x-b.x)-ca;
      while(da>Math.PI)da-=TAU;while(da<-Math.PI)da+=TAU;
      const na=ca+clamp(da,-b.hom*dt,b.hom*dt);b.vx=Math.cos(na)*sp;b.vy=Math.sin(na)*sp;
    }
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(b.life<=0||b.x<-30||b.y<-30||b.x>ARENA+30||b.y>ARENA+30)b.dead=true;
    else if(Math.hypot(b.x-p.x,b.y-p.y)<b.r+p.r-2){hurtP(b.dmg);if(b.slw){p.slow=Math.min(.75,p.slow+b.slw);pop(p.x,p.y-34,'느려짐!','#bff0ff',14)}b.dead=true}
    else if(OBS.length&&obsHit(b.x,b.y,b.r)){b.dead=true;burst(b.x,b.y,b.col,3,70)}
  }
  compact(G.eb);
  for(const z of G.zn){
    z.age+=dt;
    if(z.k==='blast'){
      if(!z.done&&z.age>=z.delay){z.done=true;G.shake=Math.max(G.shake,6);burst(z.x,z.y,'#ff4f93',10,190);if(Math.hypot(p.x-z.x,p.y-z.y)<z.r+p.r*.4)hurtP(z.dmg);if(z.pool)zone({k:'pool',x:z.x,y:z.y,r:z.r,life:z.pool.life,dmg:z.pool.dmg,tk:.2});if(z.ring)zone({k:'ring',x:z.x,y:z.y,r:z.r*.6,max:z.ring.max,spd:z.ring.spd,w:26,dmg:z.ring.dmg,hit:false})}
      if(z.done&&z.age>z.delay+.25)z.dead=true;
    }else if(z.k==='pool'){
      z.tk-=dt;if(z.tk<=0){z.tk=.4;if(Math.hypot(p.x-z.x,p.y-z.y)<z.r)hurtP(z.dmg)}
      if(z.age>z.life)z.dead=true;
    }else if(z.k==='beam'){
      if(!z.done&&z.age>=z.delay){z.done=true;G.shake=Math.max(G.shake,4);if(z.dmg>0&&distSeg(p.x,p.y,z.x,z.y,z.x+Math.cos(z.ang)*z.len,z.y+Math.sin(z.ang)*z.len)<z.w/2+p.r*.5)hurtP(z.dmg)}
      if(z.age>z.delay+.3)z.dead=true;
    }else if(z.k==='ring'){
      z.r+=z.spd*dt;
      if(!z.hit&&Math.abs(Math.hypot(p.x-z.x,p.y-z.y)-z.r)<z.w/2+p.r*.4){z.hit=true;hurtP(z.dmg)}
      if(z.r>z.max)z.dead=true;
    }
  }
  compact(G.zn);
}
function updPlayer(dt){
  const p=G.p,m=moveVec();

  else{p.vx=m[0]*sp;p.vy=m[1]*sp}
  let px=clamp(p.x+p.vx*dt,p.r,ARENA-p.r),py=clamp(p.y+p.vy*dt,p.r,ARENA-p.r);
  if(OBS.length){const q=obsResolve(px,py,p.r);px=clamp(q[0],p.r,ARENA-p.r);py=clamp(q[1],p.r,ARENA-p.r)}

const BDUR={
  bear:{walk:1.8,slam:1.6,charge:1.5,summon:1.4},
  king:{spiral:3.3,jump:2,ring:2.5,summon:1.5,orbs:1.7},
  doc:{vials:2.5,barrage:2.1,laser:2.7,drones:1.7,mutants:1.7,rain:3.6}
};
const BSEQ={
  bear:()=>['walk','slam','walk','charge','summon'],
  king:b=>b.enr?['spiral','jump','orbs','ring','summon','jump']:['spiral','jump','ring','summon'],
  doc:b=>b.ph===1?['vials','barrage','laser','drones']:b.ph===2?['vials','laser','mutants','barrage','laser']:['rain','laser','barrage','vials','drones']
};
function nextState(b){
  const seq=BSEQ[b.type](b);b.sq=(b.sq+1)%seq.length;b.st=seq[b.sq];b.did=false;b.n=0;b.fireT=0;
  let d=BDUR[b.type][b.st];if(b.enr||b.ph===3)d*=.82;b.stt=d;

function summonAround(b,type,n,o){
  for(let i=0;i<n&&G.en.length<CAP+40;i++){const a=i/n*TAU+rnd(0,.5);mkEnemy(type,clamp(b.x+Math.cos(a)*(b.r+40),24,ARENA-24),clamp(b.y+Math.sin(a)*(b.r+40),24,ARENA-24),o)}
}
function bossStep(b,dt,tx,ty,sp){
  const dx=tx-b.x,dy=ty-b.y,d=Math.hypot(dx,dy)||1;
  b.x=clamp(b.x+dx/d*sp*dt,b.r,ARENA-b.r);b.y=clamp(b.y+dy/d*sp*dt,b.r,ARENA-b.r);if(Math.abs(dx)>20)b.fx=dx>0?1:-1;
}
function updBoss(dt){
  const b=G.boss;if(!b||b.dead)return;
  const p=G.p,s=dmgScale(G.t)*({bear:1.3,king:1.7,doc:1.8}[b.type]),dist=Math.hypot(p.x-b.x,p.y-b.y)||1,ux=(p.x-b.x)/dist,uy=(p.y-b.y)/dist;
  b.slow=0;if(b.tel>0)b.tel=Math.max(0,b.tel-dt*1.4);

        if(b.stt<=0)nextState(b);break;
      case 'charge':

        if(b.fireT<=0){b.fireT=b.enr?.085:.1;const arms=b.enr?4:2;for(let i=0;i<arms;i++){const a=b.a2+i*TAU/arms;ebullet(b.x,b.y,Math.cos(a)*190,Math.sin(a)*190,8*s,6,6,'#c79bff')}}
        if(b.stt<=0)nextState(b);break;
      case 'jump':
        if(!b.did){b.did=true;b.tel=1;b.jx=clamp(p.x,100,ARENA-100);b.jy=clamp(p.y,100,ARENA-100);zone({k:'blast',x:b.jx,y:b.jy,r:130,delay:1,dmg:26*s,ring:{max:470,spd:180,dmg:12*s}})}
        if(!b.landed&&b.stt<=BDUR.king.jump*.5){b.landed=true;b.x=b.jx;b.y=b.jy}
        if(b.stt<=0){b.landed=false;nextState(b)}break;
      case 'ring':
        bossStep(b,dt,p.x,p.y,b.spd*.4);b.fireT-=dt;
        if(b.fireT<=0&&b.n<(b.enr?5:4)){b.fireT=.55;const off=b.n%2?Math.PI/18:0,m=18;for(let i=0;i<m;i++){const a=i/m*TAU+off;ebullet(b.x,b.y,Math.cos(a)*165,Math.sin(a)*165,8*s,6,6,'#ff7fd0')}b.n++;sfx('shoot')}
        if(b.stt<=0)nextState(b);break;
      case 'summon':
        if(!b.did){b.did=true;b.tel=1;summonAround(b,MAP.ring[1],7);sfx('boss')}

      case 'orbs':
        if(!b.did){b.did=true;b.tel=1;for(let i=0;i<5;i++){const a=i/5*TAU;ebullet(b.x,b.y,Math.cos(a)*105,Math.sin(a)*105,11*s,10,7,'#ff4f93',1.15)}}
        if(b.stt<=0)nextState(b);break;
    }
  }else{

      else if(dist<want-70)bossStep(b,dt,b.x-ux*200,b.y-uy*200,b.spd*rate);
      else bossStep(b,dt,b.x-uy*perp*160,b.y+ux*perp*160,b.spd*.6*rate);
    }

        b.fireT-=dt;
        if(b.fireT<=0&&b.n<5){b.fireT=.36/rate;b.n++;b.tel=.6;zone({k:'blast',x:clamp(p.x+rnd(-80,80),40,ARENA-40),y:clamp(p.y+rnd(-80,80),40,ARENA-40),r:72,delay:.9,dmg:16*s,pool:{life:4.2,dmg:8*s}});sfx('shoot')}
        if(b.stt<=0)nextState(b);break;
      case 'barrage':
        b.fireT-=dt;
        if(b.fireT<=0&&b.n<3){b.fireT=.5/rate;b.n++;const a0=Math.atan2(uy,ux),m=b.ph===3?9:7;for(let i=0;i<m;i++){const a=a0+(i-(m-1)/2)*.2;ebullet(b.x,b.y,Math.cos(a)*275,Math.sin(a)*275,8*s,6,4,'#ff7676')}sfx('shoot')}
        if(b.stt<=0)nextState(b);break;
      case 'laser':{

  if(dist<b.r+p.r-4)hurtP(b.dmg*s*(b.type==='doc'?.6:1));
}

function buildOptions(){
  const pool=[],sk=G.skills,ps=Object.keys(G.pass);
  for(const s of sk)if(s.lv<5)pool.push({t:'skill',id:s.id,lv:s.lv+1,w:3});
  if(sk.length<6)for(const id of SKILL_IDS)if(!sk.find(s=>s.id===id))pool.push({t:'skill',id,lv:1,w:G.lv<6?3.5:2});
  for(const id of ps)if(G.pass[id]<5)pool.push({t:'pass',id,lv:G.pass[id]+1,w:3});
  if(ps.length<6)for(const id of PASS_IDS)if(!G.pass[id])pool.push({t:'pass',id,lv:1,w:G.lv<6?1:2});
  const out=[];
  while(out.length<3&&pool.length){
    let sum=0;for(const o of pool)sum+=o.w;let r=Math.random()*sum,i=0;
    for(;i<pool.length;i++){r-=pool[i].w;if(r<=0)break}
    out.push(pool.splice(Math.min(i,pool.length-1),1)[0]);
  }
  const fb=[{t:'heal'},{t:'gold'}];while(out.length<3)out.push(fb[out.length%2]);
  return out;
}
function optInfo(o){
  if(o.t==='skill'){const d=SKILLS[o.id];return{name:d.name,g:d.g,col:d.col,lv:o.lv,desc:o.lv===1?d.desc:d.up[o.lv-1],isNew:o.lv===1,max:5,kind:'스킬'}}
  if(o.t==='pass'){const d=PASSIVES[o.id];return{name:d.name,g:d.g,col:d.col,lv:o.lv,desc:d.desc,isNew:o.lv===1,max:5,kind:'강화'}}
  if(o.t==='heal')return{name:'말랑 간식',g:'heart',col:'#ff6b9a',lv:0,desc:'체력을 40% 회복합니다.',max:0,kind:''};

}

function admSkill(id,d){

function admPass(id,d){

  else if(l>0){if(l===1)delete G.pass[id];else G.pass[id]=l-1}
  const old=G.p.maxHp;S=calcStats();G.p.maxHp=S.hp;

function sparkleBolt(c,pts,a){

  pts.forEach((q,i)=>{if(!i)c.moveTo(q[0],q[1]);else{const pr=pts[i-1],mx=(pr[0]+q[0])/2+rnd(-8,8),my=(pr[1]+q[1])/2+rnd(-8,8);c.lineTo(mx,my);c.lineTo(q[0],q[1])}});c.stroke();
  c.strokeStyle=`rgba(255,255,255,${a})`;c.lineWidth=1.2;c.stroke();
}

  if(vw>ARENA+100)cx=(ARENA-vw)/2;if(vh>ARENA+100)cy=(ARENA-vh)/2;
  const sk=G.shake>.3?G.shake:0,ox=sk?rnd(-sk,sk):0,oy=sk?rnd(-sk,sk):0;
  c.save();c.scale(z,z);c.translate(-cx+ox,-cy+oy);
  drawGround(c,cx,cy,vw,vh,T);
  if(OBS.length)drawObstacles(c,cx,cy,vw,vh,T);
  const vis=(x,y,m)=>x>cx-m&&x<cx+vw+m&&y>cy-m&&y<cy+vh+m;
  // 끈끈이 웅덩이
  for(const q of G.pz){const a=Math.min(1,(q.life-q.age)*1.5);c.globalAlpha=.55*a;const g=c.createRadialGradient(q.x,q.y,2,q.x,q.y,q.r);g.addColorStop(0,'#c4f25a');g.addColorStop(1,'#5fbf3a');c.fillStyle=g;c.beginPath();c.ellipse(q.x,q.y,q.r,q.r*.72,0,0,TAU);c.fill();c.globalAlpha=a*.8;c.fillStyle='#e5ff9a';for(let i=0;i<4;i++){const b=(T*.8+i*.25)%1;c.beginPath();c.arc(q.x+Math.cos(i*2.1)*q.r*.5,q.y-b*q.r*.5+Math.sin(i*2.1)*q.r*.2,3*(1-b),0,TAU);c.fill()}c.globalAlpha=1}
  // 적 장판
  for(const z2 of G.zn){
    if(z2.k==='blast'){const k=z2.done?1:Math.min(1,z2.age/z2.delay);c.fillStyle=z2.done?`rgba(255,255,255,${.5-(z2.age-z2.delay)*2})`:`rgba(255,79,147,${.12+.22*k})`;c.beginPath();c.arc(z2.x,z2.y,z2.r,0,TAU);c.fill();c.strokeStyle='rgba(255,79,147,.9)';c.lineWidth=3;c.beginPath();c.arc(z2.x,z2.y,z2.r*(z2.done?1:.25+.75*k),0,TAU);c.stroke();if(!z2.done){c.setLineDash([8,8]);c.beginPath();c.arc(z2.x,z2.y,z2.r,0,TAU);c.stroke();c.setLineDash([])}}
    else if(z2.k==='pool'){const a=Math.min(1,(z2.life-z2.age)*2);c.globalAlpha=.5*a;c.fillStyle='#8fe05a';c.beginPath();c.arc(z2.x,z2.y,z2.r,0,TAU);c.fill();c.globalAlpha=a;c.strokeStyle='#d4ff7a';c.lineWidth=2;c.beginPath();c.arc(z2.x,z2.y,z2.r,0,TAU);c.stroke();c.globalAlpha=1}
    else if(z2.k==='beam'){const ex=z2.x+Math.cos(z2.ang)*z2.len,ey=z2.y+Math.sin(z2.ang)*z2.len;
      if(!z2.done){c.strokeStyle=`rgba(255,79,147,${.35+.4*Math.abs(Math.sin(z2.age*14))})`;c.lineWidth=z2.dmg>0?3:z2.w;c.setLineDash(z2.dmg>0?[14,10]:[]);c.beginPath();c.moveTo(z2.x,z2.y);c.lineTo(ex,ey);c.stroke();c.setLineDash([]);if(z2.dmg<=0){c.strokeStyle='rgba(255,255,255,.25)';c.lineWidth=2;c.stroke()}}
      else if(z2.dmg>0){c.strokeStyle='rgba(255,230,240,.95)';c.lineWidth=z2.w;c.lineCap='butt';c.beginPath();c.moveTo(z2.x,z2.y);c.lineTo(ex,ey);c.stroke();c.strokeStyle='#ff4f93';c.lineWidth=z2.w*.5;c.stroke()}}
    else if(z2.k==='ring'){c.strokeStyle='rgba(255,79,147,.85)';c.lineWidth=z2.w*.7;c.beginPath();c.arc(z2.x,z2.y,z2.r,0,TAU);c.stroke();c.strokeStyle='rgba(255,220,235,.8)';c.lineWidth=3;c.stroke()}
  }
  // 산성 안개
  const ms=G.skills.find(s=>s.id==='mist');
  if(ms&&ms.rad){const g=c.createRadialGradient(p.x,p.y,ms.rad*.2,p.x,p.y,ms.rad);g.addColorStop(0,'rgba(196,242,90,.05)');g.addColorStop(1,'rgba(196,242,90,.3)');c.fillStyle=g;c.beginPath();c.arc(p.x,p.y,ms.rad,0,TAU);c.fill();c.strokeStyle='rgba(196,242,90,.5)';c.lineWidth=2;c.setLineDash([6,8]);c.lineDashOffset=-T*20;c.beginPath();c.arc(p.x,p.y,ms.rad,0,TAU);c.stroke();c.setLineDash([])}
  // 보상
  for(const g of G.gems){if(!vis(g.x,g.y,20))continue;const col=g.v>=8?'#ffd24a':g.v>=4?'#d09bff':g.v>=2?'#6cc7ff':'#7dffb0';c.fillStyle=col;c.beginPath();c.moveTo(g.x,g.y-6);c.lineTo(g.x+5,g.y);c.lineTo(g.x,g.y+6);c.lineTo(g.x-5,g.y);c.fill();c.fillStyle='rgba(255,255,255,.7)';c.fillRect(g.x-1,g.y-4,2,3)}
  for(const g of G.drops){
    if(!vis(g.x,g.y,30))continue;const bob=Math.sin(T*5+g.x)*2;c.save();c.translate(g.x,g.y+bob);
    if(g.k==='coin'){c.fillStyle='#ffd24a';c.beginPath();c.arc(0,0,6,0,TAU);c.fill();c.strokeStyle='#b08400';c.lineWidth=1.5;c.stroke();c.fillStyle='#fff3b0';c.fillRect(-1,-3.5,2,5)}
    else if(g.k==='heart'){c.scale(.8,.8);c.fillStyle='#ff6b9a';c.beginPath();c.moveTo(0,9);c.bezierCurveTo(-14,-1,-8,-12,0,-5);c.bezierCurveTo(8,-12,14,-1,0,9);c.fill()}
    else if(g.k==='magnet'){c.strokeStyle='#ff5a5a';c.lineWidth=5;c.beginPath();c.arc(0,0,7,0,Math.PI);c.moveTo(-7,0);c.lineTo(-7,-7);c.moveTo(7,0);c.lineTo(7,-7);c.stroke();c.strokeStyle='#fff';c.lineWidth=2;c.beginPath();c.moveTo(-7,-7);c.lineTo(-7,-5);c.moveTo(7,-7);c.lineTo(7,-5);c.stroke()}
    else{c.fillStyle='rgba(255,210,74,.25)';c.beginPath();c.arc(0,0,22+Math.sin(T*6)*3,0,TAU);c.fill();c.fillStyle='#8a5a3c';c.fillRect(-12,-8,24,17);c.fillStyle='#b8793f';c.fillRect(-12,-8,24,6);c.fillStyle='#ffd24a';c.fillRect(-3,-4,6,8)}
    c.restore();
  }
  // 적
  for(const e of G.en){if(e.dead||!vis(e.x,e.y,90))continue;if(e.boss)drawBoss(c,e,T);else drawEnemy(c,e,T)}
  // 새끼 슬라임
  for(const m of G.pets){c.save();c.translate(m.x,m.y);c.scale(m.fx,1);shadow(c,9,8);blob(c,10,9,'#7df2d0');c.fillStyle='#10343a';c.beginPath();c.arc(-3,-1,1.5,0,TAU);c.arc(3,-1,1.5,0,TAU);c.fill();c.restore()}
  // 플레이어
  if(!(p.inv>0&&Math.floor(T*20)%2===0&&p.hp>0))drawHero(c,p.x,p.y,1,T,{mv:p.mv,face:p.face,flash:p.flash});
  const ob=G.skills.find(s=>s.id==='orbit');
  if(ob&&ob.pos)for(const q of ob.pos){c.fillStyle='#6cc7ff';c.beginPath();c.arc(q[0],q[1],10*Math.sqrt(S.area),0,TAU);c.fill();c.fillStyle='rgba(255,255,255,.65)';c.beginPath();c.arc(q[0]-3,q[1]-3,3,0,TAU);c.fill()}
  // 투사체
  for(const q of G.pr){
    if(q.kind==='throw'){c.fillStyle='rgba(0,0,0,.25)';c.beginPath();c.ellipse(q.x,q.y,9,4,0,0,TAU);c.fill();c.fillStyle='#2a2430';c.beginPath();c.arc(q.x,q.y-q.z-8,9,0,TAU);c.fill();c.fillStyle='#ffe45c';c.beginPath();c.arc(q.x+5,q.y-q.z-17,2.6,0,TAU);c.fill()}
    else if(q.kind==='bounce'){c.fillStyle='#ffb35c';c.beginPath();c.arc(q.x,q.y,q.r,0,TAU);c.fill();c.fillStyle='rgba(255,255,255,.6)';c.beginPath();c.arc(q.x-q.r*.3,q.y-q.r*.3,q.r*.35,0,TAU);c.fill();c.strokeStyle='#ff8a3a';c.lineWidth=2;c.beginPath();c.arc(q.x,q.y,q.r,0,TAU);c.stroke()}
    else{c.fillStyle='#62f0c4';c.beginPath();c.arc(q.x,q.y,q.r,0,TAU);c.fill();c.fillStyle='#e8fff8';c.beginPath();c.arc(q.x-q.r*.25,q.y-q.r*.25,q.r*.4,0,TAU);c.fill()}
  }
  for(const b of G.eb){c.fillStyle=b.col;c.beginPath();c.arc(b.x,b.y,b.r,0,TAU);c.fill();c.fillStyle='rgba(255,255,255,.75)';c.beginPath();c.arc(b.x,b.y,b.r*.45,0,TAU);c.fill();c.globalAlpha=.3;c.fillStyle=b.col;c.beginPath();c.arc(b.x,b.y,b.r*1.6,0,TAU);c.fill();c.globalAlpha=1}
  // 이펙트
  for(const f of G.fx){
    if(f.k==='boom'){const k=1-f.life/f.m;c.fillStyle=`rgba(255,170,80,${.55*(1-k)})`;c.beginPath();c.arc(f.x,f.y,f.r*(.4+.6*k),0,TAU);c.fill();c.strokeStyle=`rgba(255,240,200,${1-k})`;c.lineWidth=4;c.stroke()}
    else if(f.k==='wave'&&f.delay<=0){const a=1-f.r/f.max;c.strokeStyle=f.col;c.globalAlpha=Math.max(0,a)*.9;c.lineWidth=f.bomb?18:9;c.beginPath();c.arc(f.x,f.y,f.r,0,TAU);c.stroke();c.globalAlpha=1}
    else if(f.k==='bolt')sparkleBolt(c,f.pts,f.life/f.m);
    else if(f.k==='delay'){c.strokeStyle='rgba(255,140,80,.7)';c.lineWidth=2;c.setLineDash([4,4]);c.beginPath();c.arc(f.x,f.y,f.rad,0,TAU);c.stroke();c.setLineDash([])}
  }
  for(const q of G.pt){c.globalAlpha=Math.max(0,q.t/q.m);c.fillStyle=q.col;c.beginPath();c.arc(q.x,q.y,q.s,0,TAU);c.fill()}c.globalAlpha=1;
  c.textAlign='center';c.lineJoin='round';
  for(const q of G.tx){c.globalAlpha=Math.min(1,q.t*3);c.font=`400 ${q.size}px Jua,sans-serif`;c.lineWidth=3;c.strokeStyle='rgba(0,0,0,.65)';c.strokeText(q.txt,q.x,q.y);c.fillStyle=q.col;c.fillText(q.txt,q.x,q.y)}c.globalAlpha=1;c.textAlign='left';
  c.restore();
  if(MAP.snowfall){
    for(let i=0;i<70;i++){
      const sx=(i*137.5+T*(14+i%4*7)+p.x*.12)%(view.w+40)-20,sy=((i*91.7+T*(70+i%5*26)+p.y*.12)%(view.h+40))-20;
      c.fillStyle='rgba(255,255,255,'+(.25+(i%4)*.15)+')';c.beginPath();c.arc(sx,sy,1.2+(i%3)*.7,0,TAU);c.fill();
    }
    c.fillStyle='rgba(120,190,230,.10)';c.fillRect(0,0,view.w,view.h);
  }
  if(G.p.slow>.05){c.fillStyle='rgba(150,220,255,'+(.10*G.p.slow).toFixed(3)+')';c.fillRect(0,0,view.w,view.h)}
  const hp=p.hp/p.maxHp;
  if(hp<.35){const g=c.createRadialGradient(view.w/2,view.h/2,Math.min(view.w,view.h)*.35,view.w/2,view.h/2,Math.max(view.w,view.h)*.75);g.addColorStop(0,'rgba(255,40,90,0)');g.addColorStop(1,`rgba(255,40,90,${.35*(1-hp/.35)*(.7+.3*Math.sin(clockT*6))})`);c.fillStyle=g;c.fillRect(0,0,view.w,view.h)}
}

/* ---- HUD ---- */
function updHud(){
  const p=G.p;
  H.lv.textContent='Lv.'+G.lv;H.hp.style.width=Math.max(0,p.hp/p.maxHp*100)+'%';H.hpT.textContent=Math.ceil(p.hp)+' / '+Math.ceil(p.maxHp);
  H.xp.style.width=(G.xp/G.need*100)+'%';H.time.textContent=fmtTime(G.t);
  H.stage.textContent=G.boss?'BOSS BATTLE':MAP.short+' · STAGE '+G.stage+' / '+STAGES;
  const gold=Math.floor(G.gold);if(gold!==hudGold){hudGold=gold;H.gold.innerHTML=ico('coin','#ffd24a')+fmt(gold)}
  const sig=G.skills.map(s=>s.id+s.lv).join()+'|'+Object.entries(G.pass).join();
  if(sig!==hudSig){hudSig=sig;
    H.sk.innerHTML=G.skills.map(s=>`<div class="mi" title="${esc(SKILLS[s.id].name)}">${ico(SKILLS[s.id].g,SKILLS[s.id].col)}<em>${s.lv}</em></div>`).join('');
    H.ps.innerHTML=Object.keys(G.pass).map(id=>`<div class="mi" title="${esc(PASSIVES[id].name)}">${ico(PASSIVES[id].g,PASSIVES[id].col)}<em>${G.pass[id]}</em></div>`).join('')}
  const b=G.boss&&!G.boss.dead?G.boss:null;H.boss.hidden=!b;
  if(b){H.bossN.textContent=BOSSES[b.type].name;H.bossHp.style.width=Math.max(0,b.hp/b.maxHp*100)+'%'}
  const hasBomb=G.loads.includes('bomb')||G.bombs>0;H.bomb.hidden=!hasBomb;if(hasBomb){H.bombN.textContent=G.bombs;H.bomb.disabled=G.bombs<=0;H.bomb.style.opacity=G.bombs>0?1:.4}
}

/* ---- 메인 루프 ---- */
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(ts-lastTs)/1000||0);lastTs=ts;clockT+=dt;
  if(appState==='play'&&G){if(G.mode==='play'||G.mode==='won')step(dt);else if(G.mode!=='over')G.shake=0;updHud()}
  if(appState==='story')storyTick(dt);
  draw();
}

/* ---- 스토리 ---- */
function startStory(pages,cb){
  appState='story';story={pages,i:0,t:0,n:0,cb};H.root.hidden=true;$('#modal').innerHTML='';joyEl.hidden=true;storyRender();
}
function storyRender(){
  const pg=story.pages[story.i];story.t=0;story.n=pg.t.length;
  ui(`<section class="screen" data-act="snext"><button class="skip" data-act="sskip" type="button">건너뛰기</button><div class="story-box">${pg.w?`<div class="who">${esc(pg.w)}</div>`:''}<p id="stxt"></p><span class="next" id="snext" hidden></span></div></section>`);
}
function storyTick(dt){
  if(!story)return;story.t+=dt;
  const n=Math.min(story.n,Math.floor(story.t*34)),el=document.getElementById('stxt');
  if(el){const txt=story.pages[story.i].t.slice(0,n);if(el.textContent!==txt)el.textContent=txt;const nx=document.getElementById('snext');if(nx)nx.hidden=n<story.n}
}
function storyAdvance(){
  if(!story)return;
  if(story.t*34<story.n){story.t=story.n/34+1;return}
  story.i++;sfx('ui');
  if(story.i>=story.pages.length)storyDone();else storyRender();
}
function storyDone(){const cb=story&&story.cb;story=null;$('#ui').innerHTML='';if(cb)cb()}

          <div><b>${fmt(st.wins)}</b><span>클리어 횟수</span></div>
        </div>
        <div class="loadline">체력 ${Math.round(s.hp)} · 공격 ${Math.round(s.atk*100)}% · 이동 ${Math.round(s.spd*100)}% · 방어 ${Math.round(s.def*100)}%</div>
        <button class="btn" data-act="start" type="button">출격! <span style="font-size:.72em">맵 고르기</span></button>
        <div class="res-btns" style="justify-content:stretch"><button class="btn alt" style="flex:1" data-act="shop" data-tab="up" type="button">상점</button><button class="btn alt" style="flex:1" data-act="shop" data-tab="eq" type="button">장비</button></div>
        <button class="btn alt sm" data-act="resetAsk" type="button">게임 초기화</button>
        <div id="resetBox"></div>
      </div>
    </div></section>`);
}
function lobbyTick(){
  if(appState!=='lobby')return;const el=document.getElementById('heroPrev');if(!el)return;
  const c=el.getContext('2d');c.clearRect(0,0,280,280);
  const g=c.createRadialGradient(140,170,10,140,170,130);g.addColorStop(0,'rgba(98,240,196,.35)');g.addColorStop(1,'rgba(98,240,196,0)');c.fillStyle=g;c.fillRect(0,0,280,280);
  drawHero(c,140,160,5.2,clockT,{face:1});
}

/* ---- 상점 ---- */
function showShop(tab){shopTab=tab||shopTab;appState='shop';shopRender(0)}
function pipsHtml(l,max){return`<div class="pips">${Array.from({length:max},(_,k)=>`<i class="${k<l?'f':''}"></i>`).join('')}</div>`}
function priceHtml(n){return`<span class="price">${ico('coin','#ffd24a')}${fmt(n)}</span>`}
function shopRender(keepScroll){
  const sc=keepScroll?($('#ui .screen')||{}).scrollTop:0;
  let body='';
  if(shopTab==='up'){
    body=`<div class="note">젤리로 영구 강화를 사요. 한 번 사면 모든 출격에 적용돼요.</div><div class="grid">`+UPGRADES.map(u=>{
      const l=SAVE.up[u.id]||0,max=l>=u.max,c=upCost(u,l);
      return`<div class="card"><div class="row"><div class="ic">${ico(u.g,u.col)}</div><div><h3>${esc(u.name)}</h3><span class="tag">Lv.${l} / ${u.max}</span></div></div>${pipsHtml(l,u.max)}<p>${esc(u.txt(Math.max(l,1)))}${max?'':` → ${esc(u.txt(l+1))}`}</p><div class="cardfoot">${max?'<span class="tag r3">최대</span>':priceHtml(c)}<button class="btn sm" data-act="buyUp" data-id="${u.id}" type="button" ${max||SAVE.jelly<c?'disabled':''}>${max?'완료':'강화'}</button></div></div>`}).join('')+`</div>`;
  }else if(shopTab==='item'){
    body=`<div class="note">출격 아이템은 한 번 쓰면 사라져요. 최대 ${LOAD_MAX}개까지 장착해서 출격할 수 있어요. (장착 ${SAVE.loadout.filter(i=>(SAVE.items[i]||0)>0).length}/${LOAD_MAX})</div><div class="grid">`+ITEMS.map(it=>{
      const n=SAVE.items[it.id]||0,on=SAVE.loadout.includes(it.id)&&n>0;
      return`<div class="card ${on?'on':''}"><div class="row"><div class="ic">${ico(it.g,it.col)}</div><div><h3>${esc(it.name)}</h3><span class="tag">보유 ${n} / ${ITEM_MAX}</span></div></div><p>${esc(it.desc)}</p><div class="cardfoot">${priceHtml(it.cost)}<div class="row"><button class="btn sm alt" data-act="loadItem" data-id="${it.id}" type="button" ${n<=0?'disabled':''}>${on?'해제':'장착'}</button><button class="btn sm" data-act="buyItem" data-id="${it.id}" type="button" ${n>=ITEM_MAX||SAVE.jelly<it.cost?'disabled':''}>구매</button></div></div></div>`}).join('')+`</div>`;
  }else{
    const s=calcStats();
    body=`<div class="note">장착 효과 합계: 체력 ${Math.round(s.hp)} · 공격 ${Math.round(s.atk*100)}% · 이동 ${Math.round(s.spd*100)}% · 방어 ${Math.round(s.def*100)}% · 치명타 ${Math.round(s.crit*100)}% · 쿨타임 -${Math.round(s.cdr*100)}%</div>`+SLOTS.map(sl=>{
      const list=Object.keys(EQUIP).filter(id=>EQUIP[id].slot===sl.id);
      return`<h3 class="slotsec">${esc(sl.name)}</h3><div class="grid">`+list.map(id=>{
        const it=EQUIP[id],own=!!SAVE.own[id],on=SAVE.eq[sl.id]===id,c=RCOST[it.t];
        return`<div class="card r${it.t} ${on?'on':''}"><div class="row"><div class="ic">${ico(sl.g,RCOL[it.t])}</div><div><h3>${esc(it.name)}</h3><span class="tag r${it.t}">${RARITY[it.t]}</span></div></div><p>${esc(statTxt(it.st))}</p>${it.sp?`<p style="color:var(--gold)">${esc(it.sp)}</p>`:''}<div class="cardfoot">${own?'<span class="tag">보유 중</span>':priceHtml(c)}${own?`<button class="btn sm ${on?'alt':''}" data-act="equip" data-id="${id}" type="button">${on?'해제':'장착'}</button>`:`<button class="btn sm" data-act="buyEq" data-id="${id}" type="button" ${SAVE.jelly<c?'disabled':''}>구매</button>`}</div></div>`}).join('')+`</div>`}).join('');
  }
  const tabs=[['up','강화'],['item','아이템'],['eq','장비']].map(t=>`<button class="tab" role="tab" aria-selected="${shopTab===t[0]}" data-act="shop" data-tab="${t[0]}" type="button">${t[1]}</button>`).join('');
  ui(`<section class="screen veil"><div class="topbar"><div class="row"><button class="btn sm alt" data-act="lobby" type="button">로비로</button>${coinHtml(SAVE.jelly)}</div><div class="tabs" role="tablist">${tabs}</div></div><div class="shop-body">${body}</div></section>`);
  if(sc)$('#ui .screen').scrollTop=sc;
}
function buyUp(id){
  const u=UPGRADES.find(x=>x.id===id),l=SAVE.up[id]||0;if(!u||l>=u.max)return;
  const c=upCost(u,l);if(SAVE.jelly<c)return toast('젤리가 부족해요');
  SAVE.jelly-=c;SAVE.up[id]=l+1;writeSave();sfx('buy');shopRender(1);
}
function buyItem(id){
  const it=ITEMS.find(x=>x.id===id),n=SAVE.items[id]||0;if(!it||n>=ITEM_MAX)return;
  if(SAVE.jelly<it.cost)return toast('젤리가 부족해요');
  SAVE.jelly-=it.cost;SAVE.items[id]=n+1;
  if(!SAVE.loadout.includes(id)&&SAVE.loadout.filter(i=>(SAVE.items[i]||0)>0).length<LOAD_MAX)SAVE.loadout.push(id);
  writeSave();sfx('buy');shopRender(1);
}
function loadItem(id){
  const on=SAVE.loadout.includes(id);
  if(on)SAVE.loadout=SAVE.loadout.filter(i=>i!==id);
  else{SAVE.loadout=SAVE.loadout.filter(i=>(SAVE.items[i]||0)>0);if(SAVE.loadout.length>=LOAD_MAX)return toast('최대 '+LOAD_MAX+'개까지 장착할 수 있어요');SAVE.loadout.push(id)}
  writeSave();sfx('ui');shopRender(1);
}
function buyEq(id){
  const it=EQUIP[id],c=RCOST[it.t];if(!it||SAVE.own[id])return;
  if(SAVE.jelly<c)return toast('젤리가 부족해요');
  SAVE.jelly-=c;SAVE.own[id]=1;SAVE.eq[it.slot]=id;writeSave();sfx('buy');shopRender(1);toast(it.name+' 장착!');
}
function equipToggle(id){
  const it=EQUIP[id];if(!it||!SAVE.own[id])return;
  if(SAVE.eq[it.slot]===id)delete SAVE.eq[it.slot];else SAVE.eq[it.slot]=id;
  writeSave();sfx('ui');shopRender(1);
}

/* ---- 결과 ---- */
function showResult(info){
  appState='result';H.root.hidden=true;
  const w=info.win;
  ui(`<section class="screen dim"><div class="resbox ${w?'win':'lose'}">
    <h2>${w?'슬라임 왕국 구출 성공!':'쓰러졌어요...'}</h2>
    <p class="sub">${w?'닥터 카오스를 물리치고 모두를 원래대로 되돌렸어요.':info.stage>=7?'조금만 더 가면 10분이었는데!':'강해져서 다시 도전해요.'}</p>
    <div class="res-grid">
      <div>생존 시간<b>${fmtTime(info.time)}</b></div><div>스테이지<b>${info.stage} / ${STAGES}</b></div>
      <div>처치한 적<b>${fmt(info.kills)}</b></div><div>도달 레벨<b>Lv.${info.lv}</b></div>
      <div>격파한 보스<b>${info.bosses} / 3</b></div><div>얻은 젤리<b style="color:var(--gold)">+${fmt(info.earned)}</b></div>
    </div>
    <p class="mini">${esc(info.map||'')} · 모은 젤리 ${fmt(info.gold)} + 생존 보너스 ${fmt(info.timeBonus)} + 보스 보너스 ${fmt(info.bossBonus)}</p>
    ${info.first?'<div class="note" style="margin:0">첫 모험을 마쳤어요! 이제 상점이 열렸어요. 젤리로 강화하고 장비를 사 보세요.</div>':''}
    <div class="res-btns"><button class="btn" data-act="lobby" type="button">로비로</button><button class="btn alt" data-act="again" type="button">같은 맵 재도전</button><button class="btn alt" data-act="mapsel" type="button">다른 맵으로</button></div>
  </div></section>`);
}

/* ---- 클릭 처리 ---- */
function onAct(a,d){
  sfx('ui');
  switch(a){
    case 'newgame':SAVE=defaultSave();hasSave=true;writeSave();startStory(STORY_OPEN,()=>{SAVE.flags.intro=true;writeSave();showMapSelect()});break;
    case 'continue':if(!SAVE.flags.intro)startStory(STORY_OPEN,()=>{SAVE.flags.intro=true;writeSave();showMapSelect()});else if(!SAVE.flags.firstRun)showMapSelect();else showLobby();break;
    case 'resetAsk':{const b=$('#resetBox');if(b)b.innerHTML=resetBox();break}
    case 'resetNo':{const b=$('#resetBox');if(b)b.innerHTML='';break}
    case 'resetDo':wipeSave();hasSave=false;showTitle();toast('처음 상태로 되돌렸어요');break;
    case 'sound':SAVE.sound=!SAVE.sound;if(hasSave)writeSave();document.querySelectorAll('[data-act="sound"]').forEach(b=>{b.textContent=soundLabel()});break;
    case 'title':showTitle();break;
    case 'lobby':showLobby();break;
    case 'start':case 'mapsel':showMapSelect();break;
    case 'mapgo':startRun(d.id);break;
    case 'again':startRun(SAVE.lastMap);break;
    case 'shop':showShop(d.tab);break;
    case 'buyUp':buyUp(d.id);break;
    case 'buyItem':buyItem(d.id);break;
    case 'loadItem':loadItem(d.id);break;
    case 'buyEq':buyEq(d.id);break;
    case 'equip':equipToggle(d.id);break;
    case 'snext':storyAdvance();break;
    case 'sskip':storyDone();break;
    case 'pick':pickOpt(+d.i);break;
    case 'dlg':if(G&&G.dlgNext)G.dlgNext();break;
    case 'resume':resumeGame();break;
    case 'admin':resumeGame();openAdmin();break;
    case 'aClose':closeAdmin();break;
    case 'aSk':case 'aPs':case 'aGod':case 'aHeal':case 'aMax':case 'aClear':case 'aLv':
    case 'aGold':case 'aBomb':case 'aWipe':case 'aTime':case 'aBoss':admAct(a,d);break;
    case 'quit':endRun(false,true);break;
  }
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b)onAct(b.dataset.act,b.dataset)});

/* ---- 시작 ---- */
(function init(){
  SAVE=readSave();hasSave=!!SAVE;if(!SAVE)SAVE=defaultSave();
  showTitle();requestAnimationFrame(frame);
})();

</script>

</body></html>
