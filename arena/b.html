<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>라이벌 아레나 · Rival Arena</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:#05060f;
    font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;
    -webkit-user-select:none; user-select:none;
    touch-action:none;
  }
  #wrap {
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(ellipse at 20% 30%, rgba(255,60,40,.16), transparent 55%),
      radial-gradient(ellipse at 80% 70%, rgba(0,220,255,.16), transparent 55%),
      #05060f;
  }
  canvas {
    display:block;
    image-rendering:auto;
    box-shadow:0 0 90px rgba(0,229,255,.18), 0 0 140px rgba(255,59,47,.14);
    border-radius:10px;
  }
  #hint {
    position:absolute; bottom:10px; left:0; right:0; text-align:center;
    color:#5a6480; font-size:12px; letter-spacing:.4px; pointer-events:none;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="1280" height="720"></canvas></div>
<div id="hint">키보드로 플레이합니다 · F11 전체화면 권장</div>
<script>
(() => {
"use strict";

/* ============================================================
   라이벌 아레나 (Rival Arena)
   RED 불꽃 기사  vs  BLUE 번개 닌자
   ============================================================ */

const cv  = document.getElementById('cv');
let ctx = cv.getContext('2d');
const W = 1280, H = 720;
const GROUND = 596;

/* ---------- 반응형 스케일 ---------- */
function fit(){
  const pad = 24;
  const s = Math.min((innerWidth-pad)/W, (innerHeight-pad-30)/H);
  cv.style.width  = (W*s)+'px';
  cv.style.height = (H*s)+'px';
}
addEventListener('resize', fit); fit();

/* ---------- 유틸 ---------- */
const rnd  = (a,b)=>a+Math.random()*(b-a);
const rndi = (a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp =(a,b,t)=>a+(b-a)*t;
const now  =()=>performance.now();

function rr(c,x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);
  c.arcTo(x,y,x+w,y,r);
  c.closePath();
}
function glow(c,color,blur,fn){
  c.save(); c.shadowColor=color; c.shadowBlur=blur; fn(); c.restore();
}

/* ---------- 찰흙(클레이) 렌더 헬퍼 ---------- */
function shade(hex, amt){
  let r,g,b;
  if(hex[0]==='#'){
    let h=hex.slice(1);
    if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    const n=parseInt(h,16);
    r=(n>>16)&255; g=(n>>8)&255; b=n&255;
  } else {
    const m=hex.match(/(\d+)\D+(\d+)\D+(\d+)/);
    if(!m) return hex;
    r=+m[1]; g=+m[2]; b=+m[3];
  }
  if(amt>=0){ r+=(255-r)*amt; g+=(255-g)*amt; b+=(255-b)*amt; }
  else { r*=(1+amt); g*=(1+amt); b*=(1+amt); }
  return 'rgb('+(r|0)+','+(g|0)+','+(b|0)+')';
}
// 손으로 빚은 듯한 덩어리: 무광 베이스 + 부드러운 명암 + 지문 자국 + 두툼한 윤곽
function clay(x,y,w,h,col,r,seed,softness){
  const rad = (r===undefined) ? Math.min(w,h)*0.45 : r;
  const sf = softness===undefined?1:softness;
  ctx.save();
  ctx.shadowColor='transparent'; ctx.shadowBlur=0;
  rr(ctx,x,y,w,h,rad); ctx.fillStyle=col; ctx.fill();
  const g=ctx.createLinearGradient(x, y, x+w*0.62, y+h);
  g.addColorStop(0,   'rgba(255,255,255,'+(0.40*sf)+')');
  g.addColorStop(0.34,'rgba(255,255,255,'+(0.10*sf)+')');
  g.addColorStop(0.60,'rgba(0,0,0,0)');
  g.addColorStop(1,   'rgba(0,0,0,'+(0.36*sf)+')');
  rr(ctx,x,y,w,h,rad); ctx.fillStyle=g; ctx.fill();
  if(seed!==undefined){
    ctx.globalAlpha=0.09; ctx.fillStyle='#1a0d10';
    for(let i=0;i<3;i++){
      const a=((seed*13+i*47)%100)/100, b=((seed*29+i*71)%100)/100;
      ctx.beginPath();
      ctx.ellipse(x+w*(0.2+a*0.6), y+h*(0.18+b*0.64), w*0.15, h*0.075, a*3.1, 0, 6.283);
      ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  // 위쪽 반짝 하이라이트 한 점
  ctx.globalAlpha=0.30; ctx.fillStyle='#ffffff';
  ctx.beginPath(); ctx.ellipse(x+w*0.32, y+h*0.2, w*0.17, h*0.09, -0.5, 0, 6.283); ctx.fill();
  ctx.globalAlpha=1;
  ctx.lineWidth=2.4; ctx.strokeStyle=shade(col,-0.5);
  rr(ctx,x,y,w,h,rad); ctx.stroke();
  ctx.restore();
}

/* ---------- 사운드 (WebAudio 간이 신스) ---------- */
const Sound = (()=>{
  let ac=null, master=null, on=true;
  function init(){
    if(ac) return;
    try{
      ac = new (window.AudioContext||window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value=.28; master.connect(ac.destination);
    }catch(e){ on=false; }
  }
  function tone(freq, dur, type, vol, slide){
    if(!on) return; init(); if(!ac) return;
    if(ac.state==='suspended') ac.resume();
    const o=ac.createOscillator(), g=ac.createGain();
    o.type=type||'square'; o.frequency.setValueAtTime(freq, ac.currentTime);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,slide), ac.currentTime+dur);
    g.gain.setValueAtTime(vol||.2, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.0008, ac.currentTime+dur);
    o.connect(g); g.connect(master); o.start(); o.stop(ac.currentTime+dur);
  }
  function noise(dur, vol, filt){
    if(!on) return; init(); if(!ac) return;
    const n=Math.floor(ac.sampleRate*dur);
    const buf=ac.createBuffer(1,n,ac.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    const src=ac.createBufferSource(); src.buffer=buf;
    const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=filt||900; bp.Q.value=.9;
    const g=ac.createGain(); g.gain.value=vol||.2;
    src.connect(bp); bp.connect(g); g.connect(master); src.start();
  }
  return {
    hitLight(){ tone(420,.09,'square',.16,180); noise(.09,.16,1500); },
    hitHeavy(){ tone(180,.20,'sawtooth',.20,60);  noise(.18,.24,700); },
    guard(){    tone(900,.07,'triangle',.12,600); noise(.06,.10,3000); },
    perfect(){  tone(1400,.10,'square',.16,2200); tone(1900,.16,'triangle',.12,2600); },
    jump(){     tone(520,.10,'triangle',.10,900); },
    dash(){     noise(.12,.12,2400); },
    charge(){   tone(300,.35,'sawtooth',.12,1200); },
    ult(){      tone(90,.55,'sawtooth',.30,700); noise(.5,.28,500); tone(1200,.4,'square',.14,200); },
    ko(){       tone(140,.7,'sawtooth',.26,45); noise(.6,.22,400); },
    bell(){     tone(880,.16,'triangle',.18); setTimeout(()=>tone(1320,.26,'triangle',.16),120); },
    ui(){       tone(700,.05,'square',.10,1000); },
    toggle(){ on=!on; return on; },
    get on(){ return on; },
    kick(){ init(); if(ac && ac.state==='suspended') ac.resume(); }
  };
})();

/* ---------- 입력 ---------- */
const keys={}, pressed={};
addEventListener('keydown', e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  if(!keys[e.code]) pressed[e.code]=true;
  keys[e.code]=true;
  Sound.kick();
});
addEventListener('keyup', e=>{ keys[e.code]=false; });
addEventListener('blur', ()=>{ for(const k in keys) keys[k]=false; });
const clearPressed = ()=>{ for(const k in pressed) delete pressed[k]; };

/* ---------- 파티클 ---------- */
const P = [];
function part(o){
  if(P.length>460) P.splice(0, 60);
  P.push(Object.assign({
    x:0,y:0,vx:0,vy:0,g:.25,life:30,max:30,size:6,color:'#fff',
    kind:'spark', rot:rnd(0,6.28), vr:rnd(-.3,.3), fade:1, drag:.98
  }, o));
}
function burst(x,y,n,colors,opt={}){
  for(let i=0;i<n;i++){
    const a=opt.dir!==undefined ? opt.dir+rnd(-opt.spread||-.9,opt.spread||.9) : rnd(0,6.283);
    const sp=rnd(opt.min||2, opt.max||9);
    part({x,y,vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-(opt.up||1),
      size:rnd(opt.s0||3, opt.s1||9), color:colors[rndi(0,colors.length-1)],
      life:rndi(opt.l0||18,opt.l1||38), max:36, g:opt.g!==undefined?opt.g:.28,
      kind:opt.kind||'spark'});
  }
}
function ring(x,y,color,r0,r1,life){
  part({x,y,kind:'ring',color,size:r0,r1:r1,life:life||22,max:life||22,g:0,vx:0,vy:0});
}
function updParticles(){
  for(let i=P.length-1;i>=0;i--){
    const p=P[i];
    p.life--;
    if(p.life<=0){ P.splice(i,1); continue; }
    if(p.kind==='ring'){ p.size = lerp(p.size, p.r1, .28); continue; }
    p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.vx*=p.drag; p.vy*=p.drag;
    p.rot+=p.vr;
    if(p.kind!=='smoke' && p.y>GROUND && p.vy>0){ p.y=GROUND; p.vy*=-.4; p.vx*=.7; }
  }
}
function drawParticles(){
  for(const p of P){
    const t = p.life/p.max, a = clamp(t,0,1);
    ctx.save();
    ctx.globalAlpha = a;
    if(p.kind==='ring'){
      ctx.strokeStyle=p.color; ctx.lineWidth=Math.max(1,6*a);
      ctx.shadowColor=p.color; ctx.shadowBlur=22;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,6.283); ctx.stroke();
    } else if(p.kind==='smoke'){
      ctx.fillStyle=p.color; ctx.globalAlpha=a*.5;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size*(2-t),0,6.283); ctx.fill();
    } else if(p.kind==='shard'){
      ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle=p.color; ctx.shadowColor=p.color; ctx.shadowBlur=14;
      ctx.fillRect(-p.size*.5,-p.size*.18,p.size,p.size*.36);
    } else {
      ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle=p.color; ctx.shadowColor=p.color; ctx.shadowBlur=16;
      const s=p.size*(.4+t*.6);
      ctx.fillRect(-s/2,-s/2,s,s);
    }
    ctx.restore();
  }
}

/* ---------- 떠오르는 텍스트 ---------- */
const Texts=[];
function popText(x,y,txt,color,size,vy){
  Texts.push({x,y,txt,color,size:size||34,life:52,max:52,vy:vy||-1.7,scale:0});
}
function updTexts(){
  for(let i=Texts.length-1;i>=0;i--){
    const t=Texts[i]; t.life--; t.y+=t.vy; t.vy*=.94;
    t.scale=lerp(t.scale,1,.3);
    if(t.life<=0) Texts.splice(i,1);
  }
}
function drawTexts(){
  for(const t of Texts){
    const a=clamp(t.life/t.max*1.6,0,1);
    ctx.save();
    ctx.globalAlpha=a; ctx.translate(t.x,t.y); ctx.scale(t.scale,t.scale);
    ctx.font=`900 ${t.size}px Pretendard,'Noto Sans KR',sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.lineWidth=7; ctx.strokeStyle='rgba(4,6,16,.9)'; ctx.strokeText(t.txt,0,0);
    ctx.shadowColor=t.color; ctx.shadowBlur=20;
    ctx.fillStyle=t.color; ctx.fillText(t.txt,0,0);
    ctx.restore();
  }
}

/* ---------- 화면 흔들림 / 히트스톱 / 플래시 ---------- */
let shake=0, hitstop=0, flash=0, flashColor='#fff', slowmo=0;
const doShake=(v)=>{ shake=Math.max(shake,v); };
const doFlash=(v,c)=>{ flash=Math.max(flash,v); flashColor=c||'#fff'; };

/* ============================================================
   아레나 (불의 존 vs 얼음의 존)
   ============================================================ */
const PLATFORMS = [
  {x:150, y:430, w:230, h:20},
  {x:900, y:430, w:230, h:20},
  {x:540, y:330, w:200, h:20}
];

let bgT=0;

/* 관중석 좌석 (한 번만 생성) */
const STAND_TOP = 62, STAND_BOT = 296;
function standEdge(x){ return STAND_BOT - 40*Math.cos(((x-W/2)/(W/2))*1.15); }
const CROWD=[];
(function buildCrowd(){
  for(let row=0; row<9; row++){
    const ry = STAND_TOP + 16 + row*24;
    const step = 15 - row*0.5;
    for(let x=18; x<W-10; x+=step){
      if(ry > standEdge(x)-16) continue;
      const jitter = ((x*7+row*31)%9)-4;
      const left = x < W/2;
      CROWD.push({
        x: x + jitter*0.6,
        y: ry + (((x*3+row*13)%5)-2),
        s: 4.2 + ((x+row)%3)*0.7,
        c: left ? 0 : 1,
        v: ((x*17+row*53)%100)/100,
        ph: ((x*11+row*7)%628)/100
      });
    }
  }
})();
const CROWD_RED  = ['#ff6a45','#ff9a3c','#e04432','#ffc46b','#b83226'];
const CROWD_BLUE = ['#4fd8ff','#7aa6ff','#2f9fd6','#a98cff','#2b6fb8'];

/* 분위기 요소 */
const emberList = Array.from({length:40},()=>({x:rnd(0,W*0.45),y:rnd(240,H),s:rnd(1.5,4),v:rnd(.3,1.1),w:rnd(0,6.28)}));
const snowList  = Array.from({length:40},()=>({x:rnd(W*0.55,W),y:rnd(240,H),s:rnd(1.5,4),v:rnd(.3,1.0),w:rnd(0,6.28)}));
const HAZE = Array.from({length:14},()=>({x:rnd(0,W),y:rnd(430,600),r:rnd(70,190),v:rnd(.08,.3),a:rnd(.03,.08)}));

/* 정적인 관중석·지붕은 한 번만 그려서 재사용 */
let STANDS=null;
function buildStands(){
  const oc=document.createElement('canvas'); oc.width=W; oc.height=STAND_BOT+60;
  const c=oc.getContext('2d');
  const _ctx=ctx; ctx=c;   // 헬퍼 재사용
  // 지붕 트러스
  ctx.fillStyle='#05060f'; ctx.fillRect(0,0,W,STAND_TOP);
  ctx.strokeStyle='rgba(150,175,220,.20)'; ctx.lineWidth=3;
  for(let i=0;i<4;i++){
    ctx.beginPath(); ctx.moveTo(-40,14+i*13);
    ctx.quadraticCurveTo(W/2,-34+i*15,W+40,14+i*13); ctx.stroke();
  }
  ctx.strokeStyle='rgba(150,175,220,.13)'; ctx.lineWidth=2;
  for(let x=40;x<W;x+=76){ ctx.beginPath(); ctx.moveTo(x,4); ctx.lineTo(x+18,56); ctx.stroke(); }
  // 스탠드 바탕
  ctx.save();
  ctx.beginPath(); ctx.moveTo(0,STAND_TOP); ctx.lineTo(W,STAND_TOP);
  for(let x=W;x>=0;x-=20) ctx.lineTo(x,standEdge(x));
  ctx.closePath();
  const sg=ctx.createLinearGradient(0,STAND_TOP,0,STAND_BOT);
  sg.addColorStop(0,'#0b0f22'); sg.addColorStop(1,'#141a35');
  ctx.fillStyle=sg; ctx.fill(); ctx.clip();
  const lw=ctx.createRadialGradient(230,200,20,230,200,420);
  lw.addColorStop(0,'rgba(255,80,30,.20)'); lw.addColorStop(1,'rgba(255,80,30,0)');
  ctx.fillStyle=lw; ctx.fillRect(0,0,W,STAND_BOT);
  const rw=ctx.createRadialGradient(1050,200,20,1050,200,420);
  rw.addColorStop(0,'rgba(0,180,255,.20)'); rw.addColorStop(1,'rgba(0,180,255,0)');
  ctx.fillStyle=rw; ctx.fillRect(0,0,W,STAND_BOT);
  ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.lineWidth=6;
  for(let row=0;row<9;row++){ const y=STAND_TOP+28+row*24;
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  ctx.fillStyle='rgba(0,0,0,.30)';
  for(let i=1;i<7;i++) ctx.fillRect(i*W/7-5,STAND_TOP,10,STAND_BOT-STAND_TOP);
  for(const p of CROWD){
    const pal=p.c?CROWD_BLUE:CROWD_RED;
    ctx.fillStyle=pal[(p.v*pal.length)|0];
    ctx.globalAlpha=0.45+p.v*0.35;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.s*0.5,0,6.283); ctx.fill();
    ctx.fillRect(p.x-p.s*0.42,p.y+p.s*0.4,p.s*0.84,p.s*0.75);
  }
  ctx.globalAlpha=1;
  ctx.restore();
  // 앞 펜스
  ctx.beginPath();
  for(let x=0;x<=W;x+=16) x===0?ctx.moveTo(0,standEdge(0)):ctx.lineTo(x,standEdge(x));
  ctx.lineTo(W,standEdge(W)+44);
  for(let x=W;x>=0;x-=16) ctx.lineTo(x,standEdge(x)+44);
  ctx.closePath();
  const bg2=ctx.createLinearGradient(0,240,0,340);
  bg2.addColorStop(0,'#1c2340'); bg2.addColorStop(1,'#0a0e1e');
  ctx.fillStyle=bg2; ctx.fill();
  ctx=_ctx;
  return oc;
}

function drawArena(){
  bgT += 0.016;

  /* ---- 1. 경기장 내부 어둠 ---- */
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#080a1a'); sky.addColorStop(.34,'#101534');
  sky.addColorStop(.66,'#0d1430'); sky.addColorStop(1,'#080b1c');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);

  /* ---- 2~5. 지붕 + 관중석 + 펜스 (캐시된 레이어) ---- */
  if(!STANDS) STANDS = buildStands();
  ctx.drawImage(STANDS, 0, 0);

  /* ---- 관중 반짝임 (동적) ---- */
  ctx.save();
  for(let i=0;i<54;i++){
    const ph = bgT*2.2 + i*0.86;
    const tw = Math.sin(ph);
    if(tw<0.55) continue;
    const x = (i*233)%W, y = STAND_TOP+24+((i*97)%206);
    if(y > standEdge(x)-18) continue;
    ctx.globalAlpha=(tw-0.55)/0.45*0.9;
    ctx.fillStyle = x<W/2 ? '#ffd08a' : '#bfe9ff';
    ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=12;
    ctx.fillRect(x,y,3,3);
  }
  ctx.restore();

  /* ---- 스포트라이트 빔 ---- */
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  const beams=[
    {x:190,  c:'255,140,60',  sw:0.55, w:150},
    {x:470,  c:'255,255,255', sw:-0.4, w:130},
    {x:810,  c:'255,255,255', sw:0.42, w:130},
    {x:1090, c:'90,210,255',  sw:-0.6, w:150}
  ];
  beams.forEach((b,i)=>{
    const sway=Math.sin(bgT*0.45+i*1.7)*b.sw*90;
    const g=ctx.createLinearGradient(b.x,40,b.x+sway,GROUND);
    g.addColorStop(0,'rgba('+b.c+',.18)');
    g.addColorStop(.55,'rgba('+b.c+',.06)');
    g.addColorStop(1,'rgba('+b.c+',0)');
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.moveTo(b.x-13,34); ctx.lineTo(b.x+13,34);
    ctx.lineTo(b.x+sway+b.w,GROUND); ctx.lineTo(b.x+sway-b.w,GROUND);
    ctx.closePath(); ctx.fill();
    ctx.globalCompositeOperation='source-over';
    ctx.fillStyle='#1a2136'; rr(ctx,b.x-16,22,32,16,4); ctx.fill();
    ctx.fillStyle='rgba('+b.c+',.95)'; ctx.shadowColor='rgba('+b.c+',1)'; ctx.shadowBlur=26;
    rr(ctx,b.x-11,32,22,5,2); ctx.fill(); ctx.shadowBlur=0;
    ctx.globalCompositeOperation='lighter';
  });
  ctx.restore();

  // LED 흐르는 띠
  ctx.save();
  for(let x=0;x<W;x+=8){
    const e=standEdge(x)+12;
    const ph=(x*0.012 - bgT*2.2);
    const v=0.35+0.65*Math.max(0,Math.sin(ph));
    ctx.globalAlpha=v*0.85;
    ctx.fillStyle = x<W/2 ? '#ff7a2b' : '#38e8ff';
    ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=14;
    ctx.fillRect(x, e, 6, 7);
  }
  ctx.restore();

  /* ---- 6. 팀 현수막 ---- */
  const banner=(bx, main, trim, emblem)=>{
    const sway=Math.sin(bgT*0.9+bx)*4;
    ctx.save();
    ctx.translate(bx,86);
    ctx.rotate(sway*0.0016);
    ctx.fillStyle='rgba(0,0,0,.45)'; rr(ctx,-45,4,90,208,6); ctx.fill();
    const g=ctx.createLinearGradient(-45,0,45,210);
    g.addColorStop(0,shade(main,.05)); g.addColorStop(1,shade(main,-.55));
    ctx.fillStyle=g; rr(ctx,-42,0,84,200,6); ctx.fill();
    ctx.strokeStyle=trim; ctx.lineWidth=3; ctx.shadowColor=trim; ctx.shadowBlur=16;
    rr(ctx,-42,0,84,200,6); ctx.stroke(); ctx.shadowBlur=0;
    // 하단 삼각 마감
    ctx.fillStyle=shade(main,-.35);
    ctx.beginPath(); ctx.moveTo(-42,200); ctx.lineTo(0,228); ctx.lineTo(42,200); ctx.closePath(); ctx.fill();
    // 엠블럼
    ctx.fillStyle=trim; ctx.shadowColor=trim; ctx.shadowBlur=20;
    ctx.save(); ctx.translate(0,74); ctx.scale(1.9,1.9); emblem(); ctx.restore();
    ctx.restore();
  };
  banner(96, '#c0281c', '#ffc23d', ()=>{
    ctx.beginPath(); ctx.moveTo(0,-16); ctx.lineTo(11,0); ctx.lineTo(0,17); ctx.lineTo(-11,0);
    ctx.closePath(); ctx.fill();
  });
  banner(W-96, '#15568c', '#7fe9ff', ()=>{
    ctx.beginPath(); ctx.moveTo(6,-17); ctx.lineTo(-9,1); ctx.lineTo(1,1); ctx.lineTo(-6,17);
    ctx.lineTo(10,-3); ctx.lineTo(0,-3); ctx.closePath(); ctx.fill();
  });

  /* ---- 7. 중앙 대형 엠블럼 (뒷벽) ---- */
  ctx.save();
  ctx.translate(W/2, 430);
  const ringA = 0.16+Math.sin(bgT*1.1)*0.05;
  ctx.globalAlpha=ringA;
  ctx.strokeStyle='#c9a2ff'; ctx.lineWidth=10; ctx.shadowColor='#8b5cf6'; ctx.shadowBlur=40;
  ctx.beginPath(); ctx.arc(0,0,168,0,6.283); ctx.stroke();
  ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(0,0,196,0,6.283); ctx.stroke();
  ctx.globalAlpha=ringA*0.8;
  for(let i=0;i<12;i++){
    const a=bgT*0.25+i*0.523;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*172, Math.sin(a)*172);
    ctx.lineTo(Math.cos(a)*192, Math.sin(a)*192);
    ctx.stroke();
  }
  ctx.restore();

  /* ---- 8. 좌우 화염/냉기 기둥 ---- */
  const pillar=(px, hot)=>{
    ctx.save();
    ctx.translate(px, GROUND);
    // 기둥 몸체
    const g=ctx.createLinearGradient(0,-250,0,0);
    g.addColorStop(0, hot?'#5a1a12':'#123a52'); g.addColorStop(1,'#0a0d1c');
    ctx.fillStyle=g; rr(ctx,-30,-250,60,250,8); ctx.fill();
    ctx.strokeStyle= hot?'rgba(255,140,60,.5)':'rgba(90,220,255,.5)';
    ctx.lineWidth=2; rr(ctx,-30,-250,60,250,8); ctx.stroke();
    // 화로
    ctx.fillStyle= hot?'#3a1109':'#0e2b40';
    rr(ctx,-38,-282,76,36,8); ctx.fill();
    // 불꽃 / 냉기
    ctx.globalCompositeOperation='lighter';
    for(let i=0;i<7;i++){
      const t=(bgT*1.5+i*0.9)%1;
      const yy=-286 - t*76, xx=Math.sin(bgT*2.4+i*2)*13*t;
      const rr2=(1-t)*26+7;
      const gg=ctx.createRadialGradient(xx,yy,0,xx,yy,rr2);
      if(hot){ gg.addColorStop(0,'rgba(255,215,120,'+(0.55*(1-t))+')'); gg.addColorStop(.5,'rgba(255,110,30,'+(0.34*(1-t))+')'); gg.addColorStop(1,'rgba(255,60,10,0)'); }
      else   { gg.addColorStop(0,'rgba(225,250,255,'+(0.55*(1-t))+')'); gg.addColorStop(.5,'rgba(80,210,255,'+(0.32*(1-t))+')'); gg.addColorStop(1,'rgba(40,140,255,0)'); }
      ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(xx,yy,rr2,0,6.283); ctx.fill();
    }
    ctx.restore();
  };
  pillar(86,true); pillar(W-86,false);

  /* ---- 9. 존 글로우 ---- */
  ctx.save(); ctx.globalCompositeOperation='lighter';
  const gl=ctx.createRadialGradient(150,GROUND-40,10,150,GROUND-40,460);
  gl.addColorStop(0,'rgba(255,90,25,.20)'); gl.addColorStop(1,'rgba(255,90,25,0)');
  ctx.fillStyle=gl; ctx.fillRect(0,300,W,H-300);
  const gr=ctx.createRadialGradient(W-150,GROUND-40,10,W-150,GROUND-40,460);
  gr.addColorStop(0,'rgba(0,190,255,.18)'); gr.addColorStop(1,'rgba(0,190,255,0)');
  ctx.fillStyle=gr; ctx.fillRect(0,300,W,H-300);
  ctx.restore();

  /* ---- 10. 중앙 크리스탈 ---- */
  for(let i=0;i<3;i++){
    const cx=W/2+(i-1)*92, cy=286+Math.sin(bgT*1.4+i)*15, sc=(i===1?1.25:0.95);
    const col = i===0?'#ff6a2b' : i===2?'#38e8ff' : '#c07bff';
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(bgT*.5+i);
    ctx.shadowColor=col; ctx.shadowBlur=32; ctx.fillStyle=col; ctx.globalAlpha=.88;
    ctx.beginPath();
    ctx.moveTo(0,-26*sc); ctx.lineTo(15*sc,0); ctx.lineTo(0,26*sc); ctx.lineTo(-15*sc,0);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha=.55; ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.moveTo(0,-13*sc); ctx.lineTo(7*sc,0); ctx.lineTo(0,13*sc); ctx.lineTo(-7*sc,0);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  /* ---- 11. 부유 플랫폼 (찰흙 돌덩이) ---- */
  for(const p of PLATFORMS){
    const hot = p.x+p.w/2 < W/2;
    const base = hot?'#7d3524':'#255a76', edge = hot?'#ff8a3c':'#5fe0ff';
    const fy = Math.sin(bgT*1.2 + p.x*0.01)*3;
    ctx.save();
    ctx.translate(0,fy);
    ctx.globalAlpha=.35; ctx.fillStyle='#000';
    ctx.beginPath(); ctx.ellipse(p.x+p.w/2, p.y+p.h+22, p.w*0.42, 9,0,0,6.283); ctx.fill();
    ctx.globalAlpha=1;
    clay(p.x, p.y, p.w, p.h+18, base, 13, (p.x|0)%97, 0.85);
    ctx.fillStyle=edge; ctx.shadowColor=edge; ctx.shadowBlur=20;
    rr(ctx,p.x+6,p.y+2,p.w-12,5,3); ctx.fill();
    ctx.restore();
  }

  /* ---- 12. 바닥 ---- */
  const fl=ctx.createLinearGradient(0,GROUND,0,H);
  fl.addColorStop(0,'#1b2038'); fl.addColorStop(.35,'#131a30'); fl.addColorStop(1,'#080b18');
  ctx.fillStyle=fl; ctx.fillRect(0,GROUND,W,H-GROUND);
  // 좌우 팀 타일 톤
  ctx.save();
  const lt=ctx.createLinearGradient(0,GROUND,W*0.5,H);
  lt.addColorStop(0,'rgba(255,90,30,.20)'); lt.addColorStop(1,'rgba(255,90,30,0)');
  ctx.fillStyle=lt; ctx.fillRect(0,GROUND,W*0.5,H-GROUND);
  const rt=ctx.createLinearGradient(W,GROUND,W*0.5,H);
  rt.addColorStop(0,'rgba(0,190,255,.20)'); rt.addColorStop(1,'rgba(0,190,255,0)');
  ctx.fillStyle=rt; ctx.fillRect(W*0.5,GROUND,W*0.5,H-GROUND);
  // 원근 타일
  ctx.globalAlpha=.14; ctx.strokeStyle='#9fc6ff'; ctx.lineWidth=2;
  for(let x=-6;x<=W+200;x+=74){
    ctx.beginPath(); ctx.moveTo(x,GROUND); ctx.lineTo(x-150,H); ctx.stroke();
  }
  let ry=GROUND+6;
  for(let i=0;i<5;i++){ ry += 10+i*8;
    ctx.beginPath(); ctx.moveTo(0,ry); ctx.lineTo(W,ry); ctx.stroke();
  }
  ctx.restore();
  // 바닥 경계 라인
  ctx.save();
  const tl=ctx.createLinearGradient(0,0,W,0);
  tl.addColorStop(0,'#ff7a2b'); tl.addColorStop(.5,'#e0c8ff'); tl.addColorStop(1,'#38e8ff');
  ctx.shadowColor='#c07bff'; ctx.shadowBlur=26; ctx.fillStyle=tl;
  ctx.fillRect(0,GROUND-5,W,7);
  ctx.restore();
  // 중앙 분리 라인
  ctx.save();
  ctx.globalAlpha=.5; ctx.strokeStyle='#e0c8ff'; ctx.lineWidth=3;
  ctx.shadowColor='#8b5cf6'; ctx.shadowBlur=18;
  ctx.setLineDash([12,10]);
  ctx.beginPath(); ctx.moveTo(W/2,GROUND); ctx.lineTo(W/2,H); ctx.stroke();
  ctx.restore();

  /* ---- 13. 안개 / 분위기 입자 ---- */
  ctx.save(); ctx.globalCompositeOperation='lighter';
  for(const h of HAZE){
    h.x += h.v; if(h.x-h.r>W) h.x=-h.r;
    const g=ctx.createRadialGradient(h.x,h.y,0,h.x,h.y,h.r);
    const c = h.x<W/2 ? '255,120,50' : '90,200,255';
    g.addColorStop(0,'rgba('+c+','+h.a+')'); g.addColorStop(1,'rgba('+c+',0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(h.x,h.y,h.r,0,6.283); ctx.fill();
  }
  ctx.restore();

  ctx.save();
  for(const e of emberList){
    e.y-=e.v; e.w+=.05; e.x+=Math.sin(e.w)*.5;
    if(e.y<300){ e.y=H+8; e.x=rnd(0,W*0.45); }
    ctx.globalAlpha=.6; ctx.fillStyle='#ff8a2b'; ctx.shadowColor='#ff6a1a'; ctx.shadowBlur=12;
    ctx.fillRect(e.x,e.y,e.s,e.s);
  }
  for(const sn of snowList){
    sn.y+=sn.v; sn.w+=.04; sn.x+=Math.sin(sn.w)*.6;
    if(sn.y>H+8){ sn.y=300; sn.x=rnd(W*0.55,W); }
    ctx.globalAlpha=.65; ctx.fillStyle='#bff4ff'; ctx.shadowColor='#5fe9ff'; ctx.shadowBlur=10;
    ctx.fillRect(sn.x,sn.y,sn.s,sn.s);
  }
  ctx.restore();
}

/* ============================================================
   파이터
   ============================================================ */
const TEAM = {
  red:{
    name:'불꽃 기사', tag:'RED',
    main:'#ff3b2f', dark:'#a3140f', trim:'#ffc23d', neon:'#ff7a2b',
    blade:'#ffca3a', blade2:'#ff5a1f',
    fx:['#ffca3a','#ff7a2b','#ff3b2f','#fff3c4'],
    ultName:'인페르노 슬래시'
  },
  blue:{
    name:'번개 닌자', tag:'BLUE',
    main:'#00d5ff', dark:'#0b5f8f', trim:'#a06bff', neon:'#38e8ff',
    blade:'#c8f6ff', blade2:'#8b5cf6',
    fx:['#c8f6ff','#38e8ff','#8b5cf6','#ffffff'],
    ultName:'천둥 질풍참'
  }
};

const MAXHP = 120;
const ATK = {
  light:{ startup:5,  active:6,  recover:9,  dmg:7,  kb:5.5, reach:124,  gauge:9,  hs:5,  sw0:-2.30, sw1:-0.70, name:'약공격' },
  heavy:{ startup:15, active:9,  recover:22, dmg:15, kb:12,  reach:138,  gauge:14, hs:10, sw0:-3.50, sw1:-0.25, name:'강공격' },
  ult:  { startup:16, active:22, recover:24, dmg:36, kb:17,  reach:180, gauge:0,  hs:16, sw0:-3.90, sw1: 0.15, name:'필살기' }
};

class Fighter {
  constructor(teamKey, side){
    this.T = TEAM[teamKey]; this.teamKey=teamKey; this.side=side; // 1=왼쪽 시작
    this.w=54; this.h=112;
    this.reset();
    this.wins=0;
  }
  reset(){
    this.x = this.side===1 ? 300 : 980;
    this.y = GROUND;
    this.vx=0; this.vy=0;
    this.facing = this.side===1 ? 1 : -1;
    this.hp=MAXHP; this.gauge=0;
    this.state='idle'; this.st=0; this.frame=0;
    this.atkType=null; this.hasHit=false;
    this.onGround=true; this.guarding=false; this.guardStart=-999;
    this.stun=0; this.invul=0; this.combo=0; this.comboT=0; this.guardCd=0; this.wasGuard=false;
    this.ghosts=[]; this.anim=0; this.dashCd=0; this.ultActive=false;
    this.trail=[]; this.prevBlade=null; this.lastHitPos=null;
    this.blinkT=0; this.hitFlash=0; this.landFx=false;
  }
  get cx(){ return this.x; }
  get cy(){ return this.y - this.h/2; }
  get box(){ return {x:this.x-this.w/2, y:this.y-this.h, w:this.w, h:this.h}; }

  canAct(){
    return this.stun<=0 && !['hurt','ko','attack','ult','dash'].includes(this.state);
  }
  setState(s){ this.state=s; this.st=0; }

  update(inp, foe){
    this.anim++;
    if(this.comboT>0){ this.comboT--; if(this.comboT<=0) this.combo=0; }
    if(this.hitFlash>0) this.hitFlash--;
    if(this.invul>0) this.invul--;
    if(this.dashCd>0) this.dashCd--;
    if(this.guardCd>0) this.guardCd--;
    if(this.stun>0) this.stun--;
    this.st++;

    // 잔상
    if(this.state==='dash' || this.ultActive){
      this.ghosts.push({x:this.x,y:this.y,f:this.facing,t:14,state:this.state,anim:this.anim});
    }
    for(let i=this.ghosts.length-1;i>=0;i--){ if(--this.ghosts[i].t<=0) this.ghosts.splice(i,1); }

    if(this.state==='ko'){
      this.vy+=0.7; this.y+=this.vy; this.x+=this.vx; this.vx*=.9;
      if(this.y>=GROUND){ this.y=GROUND; this.vy=0; this.vx*=.7; }
      return;
    }

    // 바라보는 방향
    if(this.canAct() && foe){ this.facing = foe.x < this.x ? -1 : 1; }

    /* --- 상태별 --- */
    if(this.state==='dash'){
      this.guarding=false;
      this.vx = this.dashDir*13;
      if(this.st>12){ this.setState('idle'); this.vx*=.3; }
      if(this.st%2===0) burst(this.x,this.y-40,2,this.T.fx,{min:1,max:3,s0:3,s1:6,g:.05,l0:8,l1:16});
    }
    else if(this.state==='attack' || this.state==='ult'){
      this.guarding=false;
      const A = ATK[this.atkType];
      const total = A.startup+A.active+A.recover;
      if(this.atkType==='ult'){
        // 필살기: 전진 돌진
        if(this.st>A.startup && this.st<A.startup+A.active){
          this.vx = this.facing*9;
          if(this.st%2===0){
            burst(this.x+this.facing*30, this.y-60, 3, this.T.fx, {min:2,max:7,s0:4,s1:11,g:.02,l0:12,l1:26});
          }
        } else this.vx*=.86;
      } else {
        this.vx *= this.onGround?.78:.96;
        if(this.st===A.startup && this.onGround) this.vx += this.facing*(this.atkType==='heavy'?4.2:2.2);
      }
      if(this.st>=total){ this.setState('idle'); this.ultActive=false; this.hasHit=false; }
    }
    else if(this.state==='hurt'){
      this.guarding=false;
      this.vx*=.9;
      if(this.stun<=0) this.setState('idle');
    }
    else {
      /* --- 조작 가능 --- */
      this.guarding = !!inp.guard && this.onGround;
      if(this.guarding && !this.wasGuard){
        // 가드를 갓 올린 순간에만 퍼펙트 판정. 연타 방지 쿨다운.
        this.guardStart = this.guardCd>0 ? -9999 : this.anim;
      }
      if(!this.guarding && this.wasGuard) this.guardCd = 30;
      this.wasGuard = this.guarding;

      const spd = this.guarding ? 1.3 : 4.7;
      let mv=0;
      if(inp.left)  mv-=1;
      if(inp.right) mv+=1;
      this.vx = lerp(this.vx, mv*spd, this.onGround?.42:.16);

      if(inp.jumpPressed && this.onGround && !this.guarding){
        this.vy=-15.4; this.onGround=false; Sound.jump();
        burst(this.x,this.y,10,['#ffffff','#b9c8ff'],{min:1,max:4,dir:-Math.PI/2,spread:1.3,s0:3,s1:7,g:.2,l0:10,l1:20});
      }
      if(inp.dashPressed && this.dashCd<=0 && this.onGround){
        this.dashDir = mv!==0 ? mv : this.facing;
        this.setState('dash'); this.dashCd=32; this.invul=11; Sound.dash();
        ring(this.x,this.y-52,this.T.neon,10,54,16);
      }
      if(inp.ultPressed && this.gauge>=100){
        this.startAttack('ult');
      } else if(inp.heavyPressed){ this.startAttack('heavy'); }
      else if(inp.atkPressed){ this.startAttack('light'); }

    }

    /* --- 물리 --- */
    this.vy += 0.74;
    if(this.vy>22) this.vy=22;
    this.x += this.vx;
    const py = this.y;
    this.y += this.vy;

    // 벽
    const half=this.w/2;
    if(this.x<half+16){ this.x=half+16; this.vx=0; }
    if(this.x>W-half-16){ this.x=W-half-16; this.vx=0; }

    // 바닥
    let landed=false;
    if(this.y>=GROUND){ this.y=GROUND; this.vy=0; landed=true; }
    // 플랫폼 (하향 통과 가능)
    if(this.vy>0){
      for(const p of PLATFORMS){
        if(this.x>p.x-6 && this.x<p.x+p.w+6 && py<=p.y+2 && this.y>=p.y){
          this.y=p.y; this.vy=0; landed=true;
        }
      }
    }
    if(landed && !this.onGround){
      burst(this.x,this.y,10,['#ffffff','#cfd8ff'],{min:1,max:5,dir:0,spread:3.14,s0:3,s1:7,g:.3,l0:8,l1:18});
      doShake(3);
    }
    this.onGround = landed;

    // 검 궤적 리본 + 직전 프레임 검날 위치(빠른 휘두름 관통 방지)
    if(this.hitActive()){
      const bp = this.bladePoints();
      this.trail.push({b:{x:bp.base.x,y:bp.base.y}, t:{x:bp.tip.x,y:bp.tip.y}});
      if(this.trail.length>11) this.trail.shift();
      this.prevBlade = bp;
      if(this.anim%2===0){
        burst(bp.tip.x, bp.tip.y, this.state==='ult'?3:1, this.T.fx,
          {min:.4,max:2.6,s0:3,s1:this.state==='ult'?10:7,g:.03,l0:8,l1:20});
      }
    } else {
      this.prevBlade = null;
      if(this.trail.length) this.trail.shift();
    }
  }

  startAttack(type){
    const A=ATK[type];
    if(type==='ult'){
      this.gauge=0; this.ultActive=true; this.setState('ult');
      this.invul=A.startup+6;
      Sound.ult(); doFlash(.85,this.T.neon); doShake(16);
      popText(this.x,this.y-160,this.T.ultName,this.T.trim,40);
      ring(this.x,this.y-56,this.T.neon,20,220,26);
      ring(this.x,this.y-56,'#ffffff',10,150,20);
      burst(this.x,this.y-56,44,this.T.fx,{min:3,max:13,s0:5,s1:14,g:.05,l0:20,l1:46});
      slowmo = 22;
    } else {
      this.setState('attack');
      if(type==='heavy') Sound.charge();
    }
    this.atkType=type; this.hasHit=false;
  }

  /* ---------- 포즈 파라미터 (그리기와 판정이 같은 값을 씀) ---------- */
  poseParams(){
    let legA=0, legB=0, armF=-0.5, armB=0.4, lean=0, bob=0, crouch=0, squash=1;
    if(this.state==='idle' || this.state==='hurt'){
      bob = Math.sin(this.anim*0.09)*2;
      if(this.onGround && Math.abs(this.vx)>0.9 && this.state==='idle'){
        const k=Math.sin(this.anim*0.30);
        legA=k*0.62; legB=-k*0.62; armF=-0.4-k*0.5; armB=0.4+k*0.5;
        lean=0.05*Math.sign(this.vx*this.facing||1);
        squash = 1 + Math.abs(k)*0.03;
      }
    }
    if(!this.onGround && this.state!=='ko'){
      legA=-0.45; legB=0.3; armF=-1.15; armB=1.1;
      squash = 1 + clamp(this.vy*0.006,-0.07,0.09);
    }
    if(this.guarding){ armF=-1.9; armB=-1.35; crouch=8; lean=-0.06; squash=0.96; }
    if(this.state==='dash'){ legA=-0.7; legB=0.5; armF=-2.0; armB=1.4; lean=0.28; }
    if(this.state==='hurt'){ lean=-0.22; armF=0.8; armB=1.2; squash=0.94; }
    if(this.state==='ko'){ lean=-1.15; legA=-0.5; legB=0.6; armF=1.6; armB=1.9; }
    if(this.state==='attack' || this.state==='ult'){
      const A=ATK[this.atkType], t=this.st;
      if(t < A.startup){ armF = lerp(-0.5, A.sw0, t/A.startup); lean=-0.18; squash=1.05; }
      else if(t < A.startup+A.active){ armF = lerp(A.sw0, A.sw1, (t-A.startup)/A.active); lean=0.20; squash=0.97; }
      else { armF = lerp(A.sw1,-0.5, (t-A.startup-A.active)/A.recover); lean=0.08; }
      armB=0.9; legA=0.42; legB=-0.36;
    }
    return {legA,legB,armF,armB,lean,bob,crouch,squash};
  }

  bladeLen(){ return this.state==='ult' ? 112 : 78; }

  /* 검날의 실제 월드 좌표 (그리기와 완전히 동일한 변환) */
  bladePoints(P){
    P = P || this.poseParams();
    const Y  = this.y + P.crouch*0.4 + P.bob*0.3;
    const cs = Math.cos(P.lean), sn = Math.sin(P.lean);
    const at = (d)=>{
      const L = 38 + d;
      const px = 16 - L*Math.sin(P.armF);
      const py = -92 + L*Math.cos(P.armF);
      const rx = px*cs - py*sn, ry = px*sn + py*cs;
      return { x: this.x + this.facing*rx, y: Y + ry*P.squash };
    };
    return { base: at(8), tip: at(this.bladeLen()) };
  }

  hitActive(){
    if(this.state!=='attack' && this.state!=='ult') return false;
    const A=ATK[this.atkType];
    return this.st>=A.startup && this.st<=A.startup+A.active;
  }

  /* 검날 선분(직전 프레임 포함)이 상대 몸에 닿았는지 */
  bladeHit(box, rad){
    const segs=[this.bladePoints()];
    if(this.prevBlade) segs.push(this.prevBlade);
    for(const sg of segs){
      for(let i=0;i<=9;i++){
        const t=i/9;
        const px=lerp(sg.base.x, sg.tip.x, t), py=lerp(sg.base.y, sg.tip.y, t);
        if(px > box.x-rad && px < box.x+box.w+rad &&
           py > box.y-rad && py < box.y+box.h+rad) return {x:px,y:py};
      }
    }
    return null;
  }

  takeHit(atk, A, type){
    if(this.invul>0 || this.state==='ko') return 'miss';
    const facingAttacker = (atk.x - this.x) * this.facing > 0;
    const blocking = this.guarding && facingAttacker && this.onGround;
    const perfect  = blocking && (this.anim - this.guardStart) <= 11;
    const hp0 = atk.lastHitPos;
    const px = hp0 ? hp0.x : (this.x+atk.x)/2, py = hp0 ? hp0.y : this.y-70;

    if(perfect && type!=='ult'){
      this.gauge = clamp(this.gauge+28,0,100);
      atk.stun = 26; atk.setState('hurt'); atk.vx = -this.facing*3;
      Sound.perfect(); doFlash(.5,'#ffffff'); doShake(9); hitstop=Math.max(hitstop,10);
      ring(px,py,'#ffffff',12,110,20); ring(px,py,this.T.neon,8,80,16);
      burst(px,py,26,['#ffffff',this.T.neon,'#ffe9a8'],{min:3,max:11,s0:4,s1:10,g:.1});
      popText(this.x,this.y-150,'퍼펙트 카운터!','#ffffff',30);
      atk.combo=0;
      return 'perfect';
    }
    if(blocking){
      const chip = type==='ult' ? A.dmg*0.42 : A.dmg*0.18;
      this.hp = clamp(this.hp-chip,0,MAXHP);
      this.gauge = clamp(this.gauge+9,0,100);
      this.vx = this.facing*-4;
      Sound.guard(); doShake(4); hitstop=Math.max(hitstop,3);
      burst(px,py,12,['#cfe9ff','#ffffff',this.T.neon],{min:2,max:7,s0:3,s1:7});
      ring(px,py,this.T.neon,8,44,14);
      popText(this.x,this.y-140,'가드','#bfe6ff',22);
      atk.combo=0;
      if(this.hp<=0) this.die();
      return 'block';
    }

    // 피격
    this.hp = clamp(this.hp-A.dmg,0,MAXHP);
    this.gauge = clamp(this.gauge + (type==='ult'?10:7),0,100);
    this.stun = type==='ult'?34:(type==='heavy'?26:16);
    this.setState('hurt');
    this.hitFlash = 8;
    this.vx = -this.facing*A.kb*0.9;
    this.vy = type==='light' ? -3 : -7.5;
    this.onGround=false;
    this.guarding=false;

    atk.combo++; atk.comboT=110;
    atk.gauge = clamp(atk.gauge + A.gauge,0,100);

    hitstop = Math.max(hitstop, A.hs);
    doShake(type==='ult'?18:(type==='heavy'?11:6));
    if(type==='ult'){ doFlash(.7,atk.T.neon); slowmo=Math.max(slowmo,26); }

    const dir = atk.facing>0?0:Math.PI;
    burst(px,py, type==='ult'?46:(type==='heavy'?24:14), atk.T.fx,
      {dir, spread:1.1, min:3, max:type==='ult'?15:10, s0:4, s1:type==='ult'?15:10, l0:14, l1:34});
    burst(px,py, 8, ['#ffffff'], {min:2,max:8,s0:3,s1:8,kind:'shard'});
    ring(px,py, atk.T.neon, 10, type==='ult'?160:(type==='heavy'?90:58), 18);
    if(type==='light') Sound.hitLight(); else Sound.hitHeavy();

    if(atk.combo>=2) popText(atk.x + atk.facing*40, this.y-170, atk.combo+' 콤보!', atk.T.trim, 26+Math.min(atk.combo,8)*2);

    if(this.hp<=0) this.die();
    return 'hit';
  }

  die(){
    this.setState('ko'); this.vy=-11; this.vx=-this.facing*7;
    Sound.ko(); doShake(20); doFlash(.6,'#ffffff'); slowmo=60;
    burst(this.x,this.y-60,50,[this.T.main,this.T.trim,'#ffffff'],{min:3,max:14,s0:5,s1:14,l0:26,l1:60});
    ring(this.x,this.y-60,'#ffffff',14,240,30);
  }

  /* ---------- 렌더 ---------- */
  drawGhosts(){
    for(const g of this.ghosts){
      ctx.save(); ctx.globalAlpha = (g.t/14)*0.26;
      ctx.translate(g.x,g.y); ctx.scale(g.f,1);
      ctx.fillStyle=this.T.neon; ctx.shadowColor=this.T.neon; ctx.shadowBlur=22;
      rr(ctx,-24,-104,48,58,18); ctx.fill();
      rr(ctx,-18,-46,36,46,14); ctx.fill();
      rr(ctx,-18,-136,36,36,14); ctx.fill();
      ctx.restore();
    }
  }

  /* 검 궤적 리본 */
  drawTrail(){
    if(this.trail.length<2) return;
    const T=this.T;
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    ctx.beginPath();
    for(let i=0;i<this.trail.length;i++) i===0?ctx.moveTo(this.trail[i].b.x,this.trail[i].b.y):ctx.lineTo(this.trail[i].b.x,this.trail[i].b.y);
    for(let i=this.trail.length-1;i>=0;i--) ctx.lineTo(this.trail[i].t.x,this.trail[i].t.y);
    ctx.closePath();
    const f=this.trail[0], l=this.trail[this.trail.length-1];
    const g=ctx.createLinearGradient(f.t.x,f.t.y,l.t.x,l.t.y);
    g.addColorStop(0,'rgba(255,255,255,0)');
    g.addColorStop(.55, T.blade2);
    g.addColorStop(1, T.blade);
    ctx.globalAlpha=this.state==='ult'?0.55:0.34;
    ctx.fillStyle=g; ctx.shadowColor=T.blade2; ctx.shadowBlur=30; ctx.fill();
    // 날 끝 밝은 선
    ctx.globalAlpha=this.state==='ult'?0.9:0.6;
    ctx.strokeStyle='#ffffff'; ctx.lineWidth=this.state==='ult'?5:3; ctx.lineJoin='round';
    ctx.beginPath();
    for(let i=0;i<this.trail.length;i++) i===0?ctx.moveTo(this.trail[i].t.x,this.trail[i].t.y):ctx.lineTo(this.trail[i].t.x,this.trail[i].t.y);
    ctx.stroke();
    ctx.restore();
  }

  draw(){
    const T=this.T, P=this.poseParams();
    const flashOn = this.hitFlash>0 && this.hitFlash%4<2;
    const C = (c)=> flashOn ? '#ffffff' : c;

    // 바닥 그림자 (부드럽게)
    ctx.save();
    const sg=ctx.createRadialGradient(this.x,this.y+4,2,this.x,this.y+4,36);
    sg.addColorStop(0,'rgba(0,0,0,.5)'); sg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=sg;
    ctx.beginPath(); ctx.ellipse(this.x,this.y+4,36,10,0,0,6.283); ctx.fill();
    ctx.restore();

    this.drawGhosts();
    this.drawTrail();

    ctx.save();
    ctx.translate(this.x, this.y + P.crouch*0.4 + P.bob*0.3);
    ctx.scale(this.facing, 1);
    ctx.rotate(P.lean);
    ctx.scale(1/Math.sqrt(P.squash), P.squash);   // 찰흙 스쿼시&스트레치

    // 필살기 / 무적 오라
    if(this.ultActive || this.invul>0){
      ctx.save(); ctx.globalAlpha=.42;
      ctx.shadowColor=T.neon; ctx.shadowBlur=46; ctx.fillStyle=T.neon;
      rr(ctx,-34,-144,68,150,30); ctx.fill(); ctx.restore();
    }

    const mainC = C(T.main), darkC = C(T.dark), trimC = C(T.trim);

    /* --- 뒤쪽 다리 --- */
    ctx.save(); ctx.translate(-10,-46); ctx.rotate(P.legB);
    clay(-10,-4,20,48, shade(darkC,-0.12), 10, 11, .9);
    clay(-12,36,24,17, C('#3a2430'), 8, 23, .9);
    ctx.restore();

    /* --- 뒤쪽 팔 --- */
    ctx.save(); ctx.translate(-18,-90); ctx.rotate(P.armB);
    clay(-8,-6,16,42, shade(darkC,-0.06), 8, 31, .9);
    clay(-9,32,18,16, C('#3a2430'), 8, 37, .9);
    ctx.restore();

    /* --- 앞쪽 다리 --- */
    ctx.save(); ctx.translate(10,-46); ctx.rotate(P.legA);
    clay(-10,-4,20,48, shade(mainC,-0.30), 10, 13);
    clay(-12,36,24,17, C('#3a2430'), 8, 29, .9);
    ctx.restore();

    /* --- 몸통 --- */
    clay(-25,-98,50,54, mainC, 20, 3);
    // 가슴 장식 (찰흙 덧붙임)
    ctx.save();
    ctx.fillStyle=trimC;
    ctx.strokeStyle=shade(trimC,-0.45); ctx.lineWidth=2.2;
    if(this.teamKey==='red'){
      ctx.beginPath();
      ctx.moveTo(0,-89); ctx.quadraticCurveTo(13,-76, 0,-58);
      ctx.quadraticCurveTo(-13,-76, 0,-89); ctx.closePath();
      ctx.fill(); ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.moveTo(6,-90); ctx.lineTo(-8,-73); ctx.lineTo(1,-73); ctx.lineTo(-5,-56);
      ctx.lineTo(10,-76); ctx.lineTo(0,-76); ctx.closePath();
      ctx.fill(); ctx.stroke();
    }
    ctx.globalAlpha=.28; ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.ellipse(-2,-82,4,2.4,-0.5,0,6.283); ctx.fill();
    ctx.restore();
    // 어깨 덩어리
    clay(-31,-100,18,21, trimC, 9, 41);
    clay(13,-100,18,21, trimC, 9, 47);

    /* --- 머리 --- */
    clay(-19,-137,38,38, mainC, 15, 7);
    // 볼 홍조
    ctx.save(); ctx.globalAlpha=.22;
    ctx.fillStyle= this.teamKey==='red' ? '#ff9a7a' : '#9ae8ff';
    ctx.beginPath(); ctx.ellipse(-12,-110,6,4,0,0,6.283); ctx.fill();
    ctx.beginPath(); ctx.ellipse(12,-110,6,4,0,0,6.283); ctx.fill();
    ctx.restore();

    // 투구 / 두건
    if(this.teamKey==='red'){
      clay(-21,-141,42,15, trimC, 7, 53);
      ctx.save();
      ctx.fillStyle=trimC; ctx.strokeStyle=shade(trimC,-0.45); ctx.lineWidth=2.2;
      ctx.beginPath();
      ctx.moveTo(-3,-140); ctx.quadraticCurveTo(2,-160, 11,-168);
      ctx.quadraticCurveTo(9,-150, 11,-140); ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.restore();
    } else {
      clay(-21,-142,42,14, shade(darkC,-0.05), 7, 59);
      clay(-30,-138,14,30, trimC, 6, 61);   // 두건 자락
      ctx.save(); ctx.globalAlpha=.5; ctx.fillStyle='#fff';
      ctx.fillRect(-20,-134,40,2.5); ctx.restore();
    }

    // 눈
    ctx.save();
    ctx.fillStyle='#1b0f16';
    rr(ctx,-14,-125,28,13,6); ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.5)'; ctx.lineWidth=2; rr(ctx,-14,-125,28,13,6); ctx.stroke();
    const eyeC = this.state==='ko' ? '#7a7a88' : (this.gauge>=100 ? '#ffffff' : T.neon);
    ctx.shadowColor=eyeC; ctx.shadowBlur=this.gauge>=100?24:14; ctx.fillStyle=eyeC;
    if(this.state==='ko'){
      ctx.fillRect(-11,-121,8,3); ctx.fillRect(3,-121,8,3);
    } else if(this.state==='hurt'){
      ctx.beginPath(); ctx.ellipse(-7,-119,4.4,2.4,0,0,6.283); ctx.fill();
      ctx.beginPath(); ctx.ellipse(7,-119,4.4,2.4,0,0,6.283); ctx.fill();
    } else {
      ctx.beginPath(); ctx.ellipse(-7,-119,4.2,4.6,0,0,6.283); ctx.fill();
      ctx.beginPath(); ctx.ellipse(7,-119,4.2,4.6,0,0,6.283); ctx.fill();
      ctx.shadowBlur=0; ctx.globalAlpha=.85; ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.arc(-8.4,-120.6,1.5,0,6.283); ctx.fill();
      ctx.beginPath(); ctx.arc(5.6,-120.6,1.5,0,6.283); ctx.fill();
    }
    ctx.restore();

    /* --- 앞쪽 팔 + 검 --- */
    ctx.save(); ctx.translate(16,-92); ctx.rotate(P.armF);
    clay(-8,-6,16,42, mainC, 8, 17);
    clay(-10,30,20,17, trimC, 8, 19);       // 손(장갑)
    ctx.translate(0,38);                     // 손 끝
    const bl = this.bladeLen();
    ctx.save();
    // 손잡이 (찰흙)
    clay(-5,-16,10,20, C('#4a2b1f'), 4, 71, .9);
    // 코등이
    clay(-15,2,30,9, trimC, 4, 73);
    // 날 (마법 금속 — 여기만 발광)
    ctx.shadowColor=T.blade2;
    ctx.shadowBlur=(this.state==='attack'||this.state==='ult')?36:18;
    const bg=ctx.createLinearGradient(0,8,0,bl);
    bg.addColorStop(0, T.blade2); bg.addColorStop(.45, T.blade); bg.addColorStop(1,'#ffffff');
    ctx.fillStyle=bg;
    ctx.beginPath();
    ctx.moveTo(-7,8); ctx.lineTo(7,8);
    ctx.lineTo(5.5,bl-16); ctx.lineTo(0,bl); ctx.lineTo(-5.5,bl-16);
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur=0;
    ctx.globalAlpha=.9; ctx.fillStyle='#fff'; ctx.fillRect(-1.4,12,2.8,bl-26);
    ctx.globalAlpha=1; ctx.strokeStyle=shade(T.blade2,-0.35); ctx.lineWidth=1.6; ctx.stroke();
    ctx.restore();
    ctx.restore();

    ctx.restore();
  }

  drawPortrait(x,y,scale,pose){
    // 타이틀/VS 화면용 포즈 렌더
    const sv={x:this.x,y:this.y,facing:this.facing,state:this.state,anim:this.anim,
              atkType:this.atkType,st:this.st,guarding:this.guarding,invul:this.invul,
              ultActive:this.ultActive,onGround:this.onGround,vx:this.vx,hitFlash:this.hitFlash};
    ctx.save(); ctx.translate(x,y); ctx.scale(scale,scale); ctx.translate(-x,-y);
    this.x=x; this.y=y; this.facing=pose.facing; this.state='attack';
    this.atkType='heavy'; this.st=ATK.heavy.startup+Math.round(ATK.heavy.active*0.62); this.anim=sv.anim;
    this.guarding=false; this.invul=0; this.ultActive=false; this.onGround=true; this.vx=0; this.hitFlash=0;
    this.draw();
    ctx.restore();
    Object.assign(this,sv);
  }
}

/* ============================================================
   AI 라이벌
   ============================================================ */
const AI_LEVELS = [
  {name:'쉬움',   react:26, aggr:.30, guardChance:.22, dashChance:.05, label:'처음이라면'},
  {name:'보통',   react:15, aggr:.52, guardChance:.45, dashChance:.14, label:'딱 알맞게'},
  {name:'어려움', react:7,  aggr:.78, guardChance:.72, dashChance:.28, label:'진짜 라이벌'}
];
class AI {
  constructor(level){ this.lv=AI_LEVELS[level]; this.t=0; this.plan='approach'; this.planT=0; this.react=0; this.guardHold=0; }
  think(me, foe){
    const inp={left:false,right:false,guard:false,jumpPressed:false,atkPressed:false,
               heavyPressed:false,ultPressed:false,dashPressed:false};
    if(me.state==='ko'||foe.state==='ko') return inp;
    this.t++;
    const dx = foe.x-me.x, adx=Math.abs(dx), dir=Math.sign(dx)||1;

    // 가드 유지 중이면 계속 올리고 있는다
    if(this.guardHold>0){ this.guardHold--; inp.guard=true; return inp; }

    // 상대 공격 감지 → 가드/회피
    const foeAtk = (foe.state==='attack'||foe.state==='ult');
    if(foeAtk){
      const A=ATK[foe.atkType];
      const willHit = adx < A.reach+40 && (foe.facing===-dir);
      if(willHit && this.react<=0){
        if(Math.random()<this.lv.guardChance){
          // 퍼펙트 가드 노리기: 히트 타이밍 직전에 누르기
          const tHit = A.startup - foe.st;
          if(tHit <= 4 + Math.random()*this.lv.react*0.4){ inp.guard=true; this.guardHold=rndi(6,14); }
          else if(Math.random()<.3){ inp.guard=true; this.guardHold=rndi(8,18); }
        } else if(Math.random()<this.lv.dashChance){
          inp.dashPressed=true; inp.left = dir>0; inp.right = dir<0;
        }
        this.react = 6;
      }
    }
    if(this.react>0) this.react--;

    // 필살기
    if(me.gauge>=100 && adx<210 && Math.random()<.09){ inp.ultPressed=true; return inp; }

    // 플랜 갱신
    if(--this.planT<=0){
      this.planT = rndi(20,46);
      const r=Math.random();
      if(adx>230) this.plan='approach';
      else if(r < this.lv.aggr) this.plan='attack';
      else if(r < this.lv.aggr+0.22) this.plan='space';
      else this.plan='approach';
    }

    if(!inp.guard){
      if(this.plan==='approach'){
        if(adx>92){ inp.right = dir>0; inp.left = dir<0; }
        if(me.y>440 && foe.y<440 && Math.random()<.03) inp.jumpPressed=true;
        if(adx>300 && Math.random()<this.lv.dashChance*.5){ inp.dashPressed=true; inp.right=dir>0; inp.left=dir<0; }
      } else if(this.plan==='space'){
        if(adx<150){ inp.left = dir>0; inp.right = dir<0; }
        if(Math.random()<.02) inp.jumpPressed=true;
      } else if(this.plan==='attack'){
        if(adx>95){ inp.right=dir>0; inp.left=dir<0; }
        else if(me.canAct()){
          const r=Math.random();
          if(r<.55) inp.atkPressed=true;
          else if(r<.85) inp.heavyPressed=true;
          else { inp.guard=true; this.guardHold=rndi(8,16); }
        }
      }
    }
    return inp;
  }
}

/* ============================================================
   게임 상태
   ============================================================ */
const KEYMAP = {
  p1:{left:'KeyA',right:'KeyD',jump:'KeyW',down:'KeyS',guard:'KeyS',atk:'KeyF',heavy:'KeyG',ult:'KeyV',dash:'KeyC'},
  p2:{left:'ArrowLeft',right:'ArrowRight',jump:'ArrowUp',down:'ArrowDown',guard:'ArrowDown',atk:'KeyJ',heavy:'KeyK',ult:'KeyL',dash:'Semicolon'}
};

const G = {
  scene:'title',        // title | vs | ready | fight | roundend | matchend
  mode:'ai',            // ai | vs
  aiLevel:1,
  round:1,
  timer:60*60,          // 60초(프레임)
  t:0,
  menuIndex:0,
  roundWinner:null,
  matchWinner:null
};

const P1 = new Fighter('red',  1);
const P2 = new Fighter('blue',-1);
P1.km = KEYMAP.p1; P2.km = KEYMAP.p2;
let ai = new AI(G.aiLevel);

function readInput(km){
  return {
    left:!!keys[km.left], right:!!keys[km.right],
    guard:!!keys[km.guard],
    jumpPressed:!!pressed[km.jump],
    atkPressed:!!pressed[km.atk],
    heavyPressed:!!pressed[km.heavy],
    ultPressed:!!pressed[km.ult],
    dashPressed:!!pressed[km.dash]
  };
}

function startMatch(mode, lvl){
  G.mode=mode; G.aiLevel=lvl!==undefined?lvl:G.aiLevel;
  ai=new AI(G.aiLevel);
  P1.wins=0; P2.wins=0; G.round=1;
  G.matchWinner=null;
  startRound(true);
}
function startRound(showVs){
  P1.reset(); P2.reset();
  P.length=0; Texts.length=0;
  G.timer=60*60; G.roundWinner=null;
  G.scene = showVs ? 'vs' : 'ready';
  G.t=0;
  if(showVs) Sound.bell();
}

function endRound(winner){
  G.roundWinner=winner;
  if(winner) winner.wins++;
  G.scene='roundend'; G.t=0;
  if(P1.wins>=2 || P2.wins>=2){
    G.matchWinner = P1.wins>=2?P1:P2;
  }
}

/* ---------- 충돌 ---------- */
function rectHit(a,b){
  return a && b && a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y;
}
function resolveAttacks(a,d){
  if(a.hasHit || !a.hitActive()) return;
  const rad = a.atkType==='ult' ? 38 : (a.atkType==='heavy' ? 19 : 15);
  const hit = a.bladeHit(d.box, rad);
  if(hit){
    a.hasHit = true;
    a.lastHitPos = hit;
    d.takeHit(a, ATK[a.atkType], a.atkType);
  }
}

/* ---------- 업데이트 ---------- */
function update(){
  updParticles(); updTexts();
  if(shake>0) shake*=0.86;
  if(flash>0) flash*=0.88;
  if(slowmo>0) slowmo--;

  if(G.scene==='title'){
    if(pressed['ArrowLeft']||pressed['KeyA']){ G.menuIndex=(G.menuIndex+3)%4; Sound.ui(); }
    if(pressed['ArrowRight']||pressed['KeyD']){ G.menuIndex=(G.menuIndex+1)%4; Sound.ui(); }
    if(pressed['ArrowUp']||pressed['KeyW']){ G.menuIndex=(G.menuIndex+3)%4; Sound.ui(); }
    if(pressed['ArrowDown']||pressed['KeyS']){ G.menuIndex=(G.menuIndex+1)%4; Sound.ui(); }
    if(pressed['Enter']||pressed['Space']){
      Sound.bell();
      if(G.menuIndex<3) startMatch('ai', G.menuIndex);
      else startMatch('vs');
    }
    if(pressed['Digit1']){ Sound.bell(); startMatch('ai',0); }
    if(pressed['Digit2']){ Sound.bell(); startMatch('ai',1); }
    if(pressed['Digit3']){ Sound.bell(); startMatch('ai',2); }
    if(pressed['Digit4']){ Sound.bell(); startMatch('vs'); }
    // 타이틀 배경 파티클
    if(G.t%6===0){
      burst(rnd(120,360), rnd(200,520), 1, TEAM.red.fx, {min:.4,max:1.6,g:-.02,l0:30,l1:60,s0:3,s1:7});
      burst(rnd(920,1160), rnd(200,520), 1, TEAM.blue.fx, {min:.4,max:1.6,g:-.02,l0:30,l1:60,s0:3,s1:7});
    }
    G.t++;
    return;
  }

  if(pressed['Escape']){ G.scene='title'; G.t=0; P.length=0; Texts.length=0; Sound.ui(); }
  if(pressed['KeyM']){ const s=Sound.toggle(); popText(W/2,80, s?'소리 켜짐':'소리 꺼짐','#9fb4d8',24); }

  G.t++;

  if(G.scene==='vs'){
    if(G.t===1){ doFlash(.7,'#ffffff'); doShake(10); }
    if(G.t%14===0){ doShake(5); Sound.ui(); }
    if(G.t>132 || pressed['Enter'] || pressed['Space']){ G.scene='ready'; G.t=0; Sound.bell(); }
    return;
  }

  if(G.scene==='ready'){
    if(G.t===70){ doFlash(.4,'#ffe27a'); Sound.bell(); }
    if(G.t>108){ G.scene='fight'; G.t=0; }
    return;
  }

  if(G.scene==='roundend'){
    if(G.t>150){
      if(G.matchWinner){ G.scene='matchend'; G.t=0; Sound.bell(); }
      else { G.round++; startRound(false); }
    }
    // KO 후 잔여 물리
    P1.update({}, null); P2.update({}, null);
    return;
  }

  if(G.scene==='matchend'){
    if(G.t%22===0){
      const wx = G.matchWinner===P1?360:920;
      burst(wx+rnd(-160,160), rnd(120,300), 12, G.matchWinner.T.fx, {min:1,max:6,g:.12,l0:30,l1:70,s0:4,s1:10});
    }
    if((pressed['Enter']||pressed['Space']) && G.t>50){ G.scene='title'; G.t=0; Sound.bell(); }
    if(pressed['KeyR'] && G.t>50){ startMatch(G.mode,G.aiLevel); }
    return;
  }

  /* ---------- 전투 ---------- */
  if(hitstop>0){ hitstop--; return; }
  const step = (slowmo>0 && G.t%2===0) ? false : true;
  if(!step) return;

  G.timer--;
  if(G.timer<=0){
    const w = P1.hp===P2.hp ? null : (P1.hp>P2.hp?P1:P2);
    popText(W/2,240,'시간 종료','#ffffff',48);
    endRound(w);
    return;
  }
  if(G.timer===10*60){ popText(W/2,170,'10초!','#ff6a6a',44); Sound.bell(); }

  const i1 = readInput(KEYMAP.p1);
  const i2 = G.mode==='ai' ? ai.think(P2,P1) : readInput(KEYMAP.p2);

  P1.update(i1,P2);
  P2.update(i2,P1);

  resolveAttacks(P1,P2);
  resolveAttacks(P2,P1);

  // 겹침 방지
  const d = P2.x-P1.x;
  if(Math.abs(d)<46){
    const push=(46-Math.abs(d))/2*Math.sign(d||1);
    P1.x-=push; P2.x+=push;
  }

  if(P1.state==='ko' || P2.state==='ko'){
    const w = P1.state==='ko' ? P2 : P1;
    popText(W/2,220,'K.O.','#ffffff',88);
    endRound(w);
  }
}

function bar(x,y,w,h,pct,c1,c2,flip){
  ctx.save();
  ctx.fillStyle='rgba(6,10,22,.85)'; rr(ctx,x-3,y-3,w+6,h+6,7); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.07)'; rr(ctx,x,y,w,h,5); ctx.fill();
  const fw = Math.max(0,w*pct);
  const g=ctx.createLinearGradient(x,y,x+w,y);
  g.addColorStop(0,c1); g.addColorStop(1,c2);
  ctx.save();
  rr(ctx,x,y,w,h,5); ctx.clip();
  ctx.fillStyle=g; ctx.shadowColor=c2; ctx.shadowBlur=18;
  if(flip) ctx.fillRect(x+w-fw,y,fw,h); else ctx.fillRect(x,y,fw,h);
  ctx.globalAlpha=.35; ctx.fillStyle='#fff';
  if(flip) ctx.fillRect(x+w-fw,y+2,fw,h*0.3); else ctx.fillRect(x,y+2,fw,h*0.3);
  ctx.restore();
  ctx.strokeStyle='rgba(255,255,255,.28)'; ctx.lineWidth=2; rr(ctx,x,y,w,h,5); ctx.stroke();
  ctx.restore();
}

  ctx.shadowColor = urgent? '#ff2f1f':'#7ea6ff'; ctx.shadowBlur=urgent?26:12;

  ready(P1,46,'left'); ready(P2,W-46,'right');
}

/* ---------- VS 컷씬 ---------- */
function drawVS(){
  drawArena();
  ctx.fillStyle='rgba(4,6,16,.62)'; ctx.fillRect(0,0,W,H);

  const t=clamp(G.t/34,0,1), e=1-Math.pow(1-t,3);

  // 대각 분할
  ctx.save();
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(W*0.56,0); ctx.lineTo(W*0.44,H); ctx.lineTo(0,H); ctx.closePath();
  ctx.fillStyle='rgba(120,20,10,.42)'; ctx.fill();
  ctx.beginPath(); ctx.moveTo(W*0.56,0); ctx.lineTo(W,0); ctx.lineTo(W,H); ctx.lineTo(W*0.44,H); ctx.closePath();
  ctx.fillStyle='rgba(8,50,90,.42)'; ctx.fill();
  ctx.restore();

  // 번개 분할선
  ctx.save();
  ctx.strokeStyle='#ffe27a'; ctx.lineWidth=7; ctx.shadowColor='#ffb02e'; ctx.shadowBlur=40;
  ctx.beginPath(); ctx.moveTo(W*0.56,0);
  let y=0;
  while(y<H){ y+=rnd(40,80); ctx.lineTo(W*0.56-(y/H)*W*0.12 + rnd(-24,24), y); }
  ctx.stroke(); ctx.restore();

  const off = (1-e)*520;
  P1.drawPortrait(330-off, 560, 1.5, {facing:1});
  P2.drawPortrait(950+off, 560, 1.5, {facing:-1});

  // 이름표
  ctx.save(); ctx.globalAlpha=e; ctx.textAlign='center';
  ctx.font='900 40px Pretendard,sans-serif';
  ctx.lineWidth=9; ctx.strokeStyle='rgba(4,6,16,.9)';
  ctx.strokeText('불꽃 기사',330,180); ctx.strokeText('번개 닌자',950,180);
  ctx.fillStyle=TEAM.red.trim;  ctx.shadowColor=TEAM.red.neon;  ctx.shadowBlur=26; ctx.fillText('불꽃 기사',330,180);
  ctx.fillStyle=TEAM.blue.trim; ctx.shadowColor=TEAM.blue.neon; ctx.shadowBlur=26; ctx.fillText('번개 닌자',950,180);
  ctx.shadowBlur=0; ctx.font='800 18px Pretendard,sans-serif'; ctx.fillStyle='#c9d6ee';
  ctx.fillText('RED TEAM',330,208); ctx.fillText('BLUE TEAM',950,208);
  ctx.restore();

  // VS
  const vt = clamp((G.t-26)/16,0,1);
  const vs = 1 + (1-vt)*2.6;
  ctx.save();
  ctx.translate(W/2, 340); ctx.rotate(-0.09); ctx.scale(vs,vs);
  ctx.globalAlpha=clamp(vt*1.4,0,1);
  ctx.textAlign='center'; ctx.font='900 150px Pretendard,sans-serif';
  ctx.lineWidth=16; ctx.strokeStyle='#3a1d05'; ctx.strokeText('VS',0,0);
  const vg=ctx.createLinearGradient(-90,-70,90,70);
  vg.addColorStop(0,'#fff6c9'); vg.addColorStop(.5,'#ffd166'); vg.addColorStop(1,'#ff8a2b');
  ctx.fillStyle=vg; ctx.shadowColor='#ffb02e'; ctx.shadowBlur=50; ctx.fillText('VS',0,0);
  ctx.restore();

  ctx.save(); ctx.textAlign='center'; ctx.globalAlpha=.6+Math.sin(G.t*.16)*.4;
  ctx.font='800 18px Pretendard,sans-serif'; ctx.fillStyle='#cfe0ff';
  ctx.fillText('Enter를 누르면 바로 시작', W/2, H-70);
  ctx.restore();

  drawParticles();

  ctx.font='800 24px Pretendard,sans-serif'; ctx.fillStyle='#c9d6ee';
  ctx.fillText(`최종 스코어  RED ${P1.wins} : ${P2.wins} BLUE`, W/2, 254);

  if(G.t>50){
    ctx.globalAlpha=.6+Math.sin(G.t*.12)*.4;
    ctx.font='800 20px Pretendard,sans-serif'; ctx.fillStyle='#ffd166';
    ctx.fillText('R 다시 대결 · Enter 메뉴로', W/2, H-90);
  }
  ctx.restore();
}

/* ============================================================
   메인 렌더
   ============================================================ */
function render(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,W,H);

  if(G.scene==='title'){ drawTitle(); return; }
  if(G.scene==='vs'){ drawVS(); return; }
  if(G.scene==='matchend'){ drawMatchEnd(); return; }

  ctx.save();
  if(shake>0.4) ctx.translate(rnd(-shake,shake), rnd(-shake,shake));

  drawArena();

  // 바닥 반사
  ctx.save();
  ctx.beginPath(); ctx.rect(0,GROUND,W,H-GROUND); ctx.clip();
  ctx.globalAlpha=.17;
  [P1,P2].forEach(f=>{
    ctx.save();
    ctx.translate(0, GROUND*2 + 6);
    ctx.scale(1,-0.86);
    f.draw();
    ctx.restore();
  });
  const rf=ctx.createLinearGradient(0,GROUND,0,H);
  rf.addColorStop(0,'rgba(11,15,28,0)'); rf.addColorStop(1,'rgba(11,15,28,.95)');
  ctx.globalAlpha=1; ctx.fillStyle=rf; ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.restore();

  // 캐릭터 (뒤쪽 먼저)
  const order = P1.y <= P2.y ? [P1,P2] : [P2,P1];
  order.forEach(f=>f.draw());

  drawParticles();
  drawTexts();

  ctx.restore();

  drawScoreboard();
  drawControlsHint();

  if(G.scene==='ready') drawReady();
  if(G.scene==='roundend') drawRoundEnd();

  // 화면 플래시
  if(flash>0.01){
    ctx.save(); ctx.globalAlpha=clamp(flash,0,1);
    ctx.fillStyle=flashColor; ctx.fillRect(0,0,W,H); ctx.restore();
  }
  // 비네트
  const vg=ctx.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,H*0.85);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.55)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
}

/* ============================================================
   루프
   ============================================================ */
let last=0, acc=0;
const STEP=1000/60;
function loop(ts){
  requestAnimationFrame(loop);
  if(!last) last=ts;
  acc += ts-last; last=ts;
  if(acc>200) acc=200;
  let ran=false;
  while(acc>=STEP){ update(); clearPressed(); acc-=STEP; ran=true; }
  render();
}
requestAnimationFrame(loop);

})();
</script>
