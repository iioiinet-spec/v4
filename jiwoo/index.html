<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>어지우 프로필 카드</title>

<style>
/* =====================================================
   🎨 쉽게 수정할 수 있는 설정
   ===================================================== */
:root {
  --card-width: 300px;
  --card-height: 400px;

  --card-radius: 22px;

  --card-top-color: #dff8ff;
  --card-bottom-color: #ffffff;

  --border-color: #62eaff;

  --glow-color: #62eaff;

  /* 최대 기울기 */
  --max-tilt: 12deg;

  /* 원래 위치로 돌아오는 시간 */
  --return-time: 0.4s;
}


/* =====================================================
   기본
   ===================================================== */

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;

  background:
    radial-gradient(
      circle at center,
      #e6faff 0%,
      #f5fcff 50%,
      #ffffff 100%
    );

  font-family:
    Arial,
    "Malgun Gothic",
    sans-serif;
}


/* =====================================================
   카드
   ===================================================== */

.card {
  position: relative;

  width: var(--card-width);
  height: var(--card-height);

  max-width: calc(100vw - 32px);
  max-height: calc(100vh - 32px);

  border: 1px solid var(--border-color);
  border-radius: var(--card-radius);

  background:
    linear-gradient(
      160deg,
      var(--card-top-color),
      var(--card-bottom-color)
    );

  box-shadow:
    0 0 25px rgba(98, 234, 255, 0.35),
    0 15px 35px rgba(65, 190, 215, 0.12);

  display: flex;
  flex-direction: column;
  align-items: center;

  padding-top: 48px;

  /*
    3D 효과
  */
  transform:
    perspective(800px)
    rotateX(0deg)
    rotateY(0deg);

  transform-style: preserve-3d;

  will-change: transform;

  /*
    모바일 터치 대응
  */
  touch-action: none;

  user-select: none;

  -webkit-user-select: none;

  cursor: pointer;

  /*
    중요:
    카드 자체는 항상 표시되도록 함
  */
  opacity: 1;
  visibility: visible;
}


/* =====================================================
   카드 장식
   ===================================================== */

.card::before {
  content: "";

  position: absolute;

  width: 160px;
  height: 160px;

  top: -70px;
  right: -70px;

  border-radius: 50%;

  background: rgba(98, 234, 255, 0.18);

  filter: blur(30px);

  pointer-events: none;
}

.card::after {
  content: "";

  position: absolute;

  width: 130px;
  height: 130px;

  bottom: -60px;
  left: -60px;

  border-radius: 50%;

  background: rgba(98, 234, 255, 0.12);

  filter: blur(30px);

  pointer-events: none;
}


/* =====================================================
   아바타
   ===================================================== */

.avatar {
  width: 105px;
  height: 105px;

  flex-shrink: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;

  background:
    linear-gradient(
      145deg,
      #ffffff,
      #d8f9ff
    );

  border: 1px solid #91edff;

  box-shadow:
    0 8px 20px rgba(72, 211, 237, 0.22);

  font-size: 58px;

  /*
    카드보다 앞으로 튀어나옴
  */
  transform: translateZ(35px);

  pointer-events: none;
}


/* =====================================================
   이름
   ===================================================== */

.name {
  margin-top: 25px;

  color: #173b46;

  font-size: 28px;
  font-weight: 800;

  transform: translateZ(28px);

  text-shadow:
    0 2px 10px rgba(55, 205, 230, 0.18);

  pointer-events: none;
}


/* =====================================================
   소개
   ===================================================== */

.description {
  margin-top: 13px;

  color: #55717a;

  font-size: 15px;
  font-weight: 500;

  text-align: center;

  pointer-events: none;
}


/* =====================================================
   태그
   ===================================================== */

.tags {
  display: flex;

  gap: 8px;

  margin-top: 25px;

  justify-content: center;

  flex-wrap: wrap;

  padding: 0 20px;

  pointer-events: none;
}

.tag {
  padding: 8px 12px;

  border-radius: 999px;

  background: #e8fbff;

  border: 1px solid #82eaff;

  color: #237b8c;

  font-size: 12px;
  font-weight: 700;

  box-shadow:
    0 3px 10px rgba(65, 211, 237, 0.12);
}


/* =====================================================
   모바일
   ===================================================== */

@media (max-width: 500px) {

  .card {
    padding-top: 40px;
  }

  .avatar {
    width: 90px;
    height: 90px;
    font-size: 50px;
  }

  .name {
    font-size: 25px;
  }

  .description {
    font-size: 14px;
  }
}
</style>
</head>


<body>

<!-- =====================================================
     프로필 카드
     ===================================================== -->

<div class="card" id="profileCard">

  <div class="avatar">
    🩵
  </div>

  <div class="name">
    어지우
  </div>

  <div class="description">
    게임을 만드는 중학생
  </div>

  <div class="tags">

    <div class="tag">
      🎮 게임
    </div>

    <div class="tag">
      💻 코딩
    </div>

    <div class="tag">
      🎨 디자인
    </div>

  </div>

</div>


<script>
/* =====================================================
   카드 3D 효과
   ===================================================== */

(function () {

  "use strict";

  const card = document.getElementById("profileCard");

  /* 카드가 없으면 아무것도 실행하지 않음 */
  if (!card) {
    return;
  }

  const MAX_TILT = 12;


  /* ===================================================
     카드 기울이기
     =================================================== */

  function tiltCard(clientX, clientY) {

    const rect = card.getBoundingClientRect();

    const x = clientX - rect.left;
    const y = clientY - rect.top;

    const centerX = rect.width / 2;
    const centerY = rect.height / 2;

    let normalX = (x - centerX) / centerX;
    let normalY = (y - centerY) / centerY;

    /* 범위를 -1 ~ 1로 제한 */
    normalX = Math.max(-1, Math.min(1, normalX));
    normalY = Math.max(-1, Math.min(1, normalY));

    const rotateY = normalX * MAX_TILT;
    const rotateX = -normalY * MAX_TILT;

    card.style.transition =
      "transform 0.1s ease-out";

    card.style.transform =
      "perspective(800px) " +
      "rotateX(" + rotateX + "deg) " +
      "rotateY(" + rotateY + "deg)";

    card.style.boxShadow =
      "0 0 35px rgba(98,234,255,0.48), " +
      "0 20px 45px rgba(65,190,215,0.18)";
  }


  /* ===================================================
     원래 위치
     =================================================== */

  function resetCard() {

    card.style.transition =
      "transform 0.4s ease, box-shadow 0.4s ease";

    card.style.transform =
      "perspective(800px) " +
      "rotateX(0deg) " +
      "rotateY(0deg)";

    card.style.boxShadow =
      "0 0 25px rgba(98,234,255,0.35), " +
      "0 15px 35px rgba(65,190,215,0.12)";
  }


  /* ===================================================
     🖥️ PC 마우스
     =================================================== */

  card.addEventListener("mousemove", function (event) {

    tiltCard(
      event.clientX,
      event.clientY
    );

  });


  card.addEventListener("mouseleave", function () {

    resetCard();

  });


  /* ===================================================
     📱 모바일 터치
     =================================================== */

  card.addEventListener(
    "touchstart",
    function (event) {

      if (!event.touches.length) {
        return;
      }

      const touch = event.touches[0];

      tiltCard(
        touch.clientX,
        touch.clientY
      );

    },
    { passive: true }
  );


  card.addEventListener(
    "touchmove",
    function (event) {

      if (!event.touches.length) {
        return;
      }

      const touch = event.touches[0];

      tiltCard(
        touch.clientX,
        touch.clientY
      );

    },
    { passive: true }
  );


  card.addEventListener(
    "touchend",
    function () {

      resetCard();

    },
    { passive: true }
  );


  card.addEventListener(
    "touchcancel",
    function () {

      resetCard();

    },
    { passive: true }
  );


  /* ===================================================
     📱 기기 방향 센서
     
     센서를 지원하지 않는 기기에서는 그냥 무시합니다.
     따라서 카드 표시에는 영향을 주지 않습니다.
     =================================================== */

  function orientationHandler(event) {

    if (
      typeof event.beta !== "number" ||
      typeof event.gamma !== "number"
    ) {
      return;
    }

    let beta = event.beta;
    let gamma = event.gamma;

    beta = Math.max(-45, Math.min(45, beta));
    gamma = Math.max(-45, Math.min(45, gamma));

    const rotateX =
      (beta / 45) * MAX_TILT;

    const rotateY =
      (gamma / 45) * MAX_TILT;

    card.style.transition =
      "transform 0.12s ease-out";

    card.style.transform =
      "perspective(800px) " +
      "rotateX(" + rotateX + "deg) " +
      "rotateY(" + rotateY + "deg)";
  }


  /*
    센서 권한 요청이 필요한 경우에만 실행
  */

  let sensorStarted = false;

  function startSensor() {

    if (sensorStarted) {
      return;
    }

    if (
      typeof DeviceOrientationEvent === "undefined"
    ) {
      return;
    }

    /* iPhone/iPad */
    if (
      typeof DeviceOrientationEvent.requestPermission ===
      "function"
    ) {

      DeviceOrientationEvent
        .requestPermission()
        .then(function (permission) {

          if (permission === "granted") {

            window.addEventListener(
              "deviceorientation",
              orientationHandler
            );

            sensorStarted = true;
          }

        })
        .catch(function () {
          /* 센서가 거부되어도 카드에는 영향 없음 */
        });

    } else {

      /* 일반 Android / 브라우저 */
      window.addEventListener(
        "deviceorientation",
        orientationHandler
      );

      sensorStarted = true;
    }
  }


  /*
    사용자가 카드를 처음 터치했을 때
    센서를 활성화해 봅니다.
  */

  card.addEventListener(
    "click",
    function () {
      startSensor();
    }
  );


  /* ===================================================
     화면 크기가 바뀌면 카드 초기화
     =================================================== */

  window.addEventListener(
    "resize",
    function () {
      resetCard();
    }
  );


  /* ===================================================
     초기 상태를 확실하게 설정
     =================================================== */

  card.style.transform =
    "perspective(800px) rotateX(0deg) rotateY(0deg)";

})();
</script>

</body>
</html>
