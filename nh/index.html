<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>중학교 3학년 2학기 수학 심화 평가 & 크기 조절 메모장</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MathJax for LaTeX Rendering -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #f8fafc;
        }
        canvas {
            touch-action: none;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        /* Split Pane Resizer */
        #resizer {
            width: 6px;
            background-color: #e2e8f0;
            cursor: col-resize;
            transition: background-color 0.2s;
        }
        #resizer:hover, #resizer.active {
            background-color: #6366f1;
        }
        /* 펜 버튼 선택 효과 */
        .color-btn {
            position: relative;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .color-btn.active {
            transform: scale(1.08);
            box-shadow: 0 0 0 2px #ffffff, 0 0 0 4px #6366f1;
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden text-slate-800">
    <!-- Header -->
    <header class="bg-white border-b border-slate-200 px-6 py-3 flex justify-between items-center z-10 shadow-sm flex-shrink-0">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 text-white p-2 rounded-lg shadow-md">
                <i data-lucide="book-open" class="w-6 h-6"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold text-slate-900">중학교 3학년 2학기 수학 심화 단원별 평가</h1>
                <p class="text-xs text-slate-500">삼각비 · 원의 성질 심화 (총 <span id="total-count">13</span>문항)</p>
            </div>
        </div>

        <div class="flex items-center gap-4">
            <div class="hidden md:flex items-center gap-2.5 bg-slate-100 px-4 py-1.5 rounded-full text-xs font-semibold text-slate-600">
                <span>진행: <span id="solved-count" class="text-indigo-600 font-bold">0</span>/<span id="total-count-badge">13</span></span>
                <span class="text-slate-300">|</span>
                <span>맞은 개수: <span id="score-count" class="text-emerald-600 font-bold">0</span>개</span>
                <span class="text-slate-300">|</span>
                <span>틀린 개수: <span id="wrong-count" class="text-rose-600 font-bold">0</span>개</span>
            </div>

            <button onclick="resetQuiz()" class="flex items-center gap-1.5 text-xs font-medium text-slate-600 hover:text-rose-600 border border-slate-200 hover:border-rose-200 px-3 py-1.5 rounded-lg transition bg-white shadow-sm">
                <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
                초기화
            </button>
        </div>
    </header>

    <!-- Main Container with Resizable Panes -->
    <div id="main-container" class="flex flex-1 overflow-hidden">
        <!-- Left Section: Quiz Panel -->
        <main id="left-panel" class="flex flex-col bg-white overflow-hidden" style="width: 58%;">
            <!-- Question Navigation Tabs -->
            <div class="px-6 py-3 border-b border-slate-100 bg-slate-50/50 flex items-center justify-between overflow-x-auto custom-scrollbar flex-shrink-0">
                <div class="flex gap-1.5 min-w-max" id="question-tabs">
                    <!-- Dynamic Question Buttons -->
                </div>
            </div>

            <!-- Scrollable Question Content Area -->
            <div class="flex-1 overflow-y-auto p-6 custom-scrollbar" id="quiz-container">
                <!-- Category Badge -->
                <div class="flex items-center justify-between mb-3">
                    <span id="unit-badge" class="inline-block px-3 py-1 rounded-full text-xs font-semibold bg-indigo-50 text-indigo-700 border border-indigo-100">
                        단원 이름
                    </span>
                    <span id="sub-unit-text" class="text-xs text-slate-400 font-medium">소단원</span>
                </div>

                <!-- Question Text -->
                <div class="mb-6">
                    <h2 class="text-base font-bold text-slate-900 leading-relaxed flex items-start gap-2">
                        <span id="q-number" class="text-indigo-600">Q1.</span>
                        <span id="q-title" class="flex-1">문제가 여기에 표시됩니다.</span>
                    </h2>
                </div>

                <!-- Answer Choices -->
                <div class="space-y-2.5 mb-6" id="options-container">
                    <!-- Dynamic Choices -->
                </div>

                <!-- Control & Submit Buttons -->
                <div class="flex items-center justify-between pt-4 border-t border-slate-100">
                    <button id="prev-btn" onclick="navigateQuestion(-1)" class="flex items-center gap-1 text-sm font-semibold text-slate-600 hover:text-indigo-600 disabled:opacity-40 disabled:hover:text-slate-600 px-3 py-2 rounded-lg transition">
                        <i data-lucide="chevron-left" class="w-4 h-4"></i> 이전 문제
                    </button>
                    <button id="submit-btn" onclick="checkAnswer()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm px-6 py-2.5 rounded-lg shadow-sm hover:shadow transition flex items-center gap-2">
                        <i data-lucide="check-circle-2" class="w-4 h-4"></i> 정답 제출
                    </button>
                    <button id="next-btn" onclick="navigateQuestion(1)" class="flex items-center gap-1 text-sm font-semibold text-slate-600 hover:text-indigo-600 disabled:opacity-40 disabled:hover:text-slate-600 px-3 py-2 rounded-lg transition">
                        다음 문제 <i data-lucide="chevron-right" class="w-4 h-4"></i>
                    </button>
                </div>

                <!-- Result Simple Banner -->
                <div id="result-box" class="mt-6 p-4 rounded-xl border hidden transition-all flex items-center gap-2">
                    <span id="result-icon"></span>
                    <span id="result-text" class="text-sm font-bold"></span>
                </div>
            </div>
        </main>

        <!-- Resizer Handle -->
        <div id="resizer" class="hidden md:block flex-shrink-0"></div>

        <!-- Right Section: Scratchpad & Notepad Panel -->
        <aside id="right-panel" class="hidden md:flex flex-col bg-slate-50 overflow-hidden flex-1" style="width: 42%;">
            <!-- Notepad Header Tabs -->
            <div class="bg-white border-b border-slate-200 px-4 py-2.5 flex items-center justify-between flex-shrink-0">
                <div class="flex items-center gap-2">
                    <button id="tab-canvas-btn" onclick="switchNoteTab('canvas')" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold bg-indigo-50 text-indigo-700 transition">
                        <i data-lucide="pen-tool" class="w-3.5 h-3.5"></i> 연습장 계산판
                    </button>
                    <button id="tab-text-btn" onclick="switchNoteTab('text')" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-500 hover:bg-slate-100 transition">
                        <i data-lucide="file-text" class="w-3.5 h-3.5"></i> 텍스트 메모장
                    </button>
                </div>

                <!-- Scratchpad Toolbar -->
                <div id="canvas-tools" class="flex items-center gap-2">
                    <div class="flex items-center gap-2 border-r border-slate-200 pr-2">
                        <button id="color-btn-black" onclick="setPenColor('#000000', 'black')" class="color-btn active w-5 h-5 rounded-full bg-black focus:outline-none" title="검정색"></button>
                        <button id="color-btn-blue" onclick="setPenColor('#2563eb', 'blue')" class="color-btn w-5 h-5 rounded-full bg-blue-600 focus:outline-none" title="파란색"></button>
                        <button id="color-btn-red" onclick="setPenColor('#dc2626', 'red')" class="color-btn w-5 h-5 rounded-full bg-red-600 focus:outline-none" title="빨간색"></button>
                        <button id="color-btn-green" onclick="setPenColor('#059669', 'green')" class="color-btn w-5 h-5 rounded-full bg-emerald-600 focus:outline-none" title="초록색"></button>
                    </div>
                    <button id="eraser-btn" onclick="toggleEraser()" class="px-2.5 py-1.5 rounded-md hover:bg-slate-100 text-slate-600 border border-slate-200 text-xs flex items-center gap-1.5 transition font-medium" title="지우개">
                        <i data-lucide="eraser" class="w-3.5 h-3.5"></i> 지우개
                    </button>
                    <button onclick="clearCanvas()" class="px-2.5 py-1.5 rounded-md hover:bg-rose-50 text-rose-600 border border-slate-200 text-xs flex items-center gap-1.5 transition font-medium" title="전체 지우기">
                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> 지우기
                    </button>
                </div>
            </div>

            <!-- Canvas Container -->
            <div id="canvas-container" class="flex-1 relative overflow-hidden bg-white cursor-crosshair">
                <canvas id="scratchpad" class="absolute inset-0 w-full h-full"></canvas>
            </div>

            <!-- Text Note Container -->
            <div id="text-container" class="flex-1 p-4 hidden flex-col bg-white">
                <textarea id="text-memo" class="w-full h-full p-4 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none resize-none text-sm leading-relaxed custom-scrollbar text-slate-800 placeholder-slate-400" placeholder="문제 풀이 아이디어나 수식 메모를 자유롭게 작성하세요... (자동 저장됩니다)"></textarea>
            </div>

            <!-- Footer indicator -->
            <div class="px-4 py-2 bg-slate-100 border-t border-slate-200 text-right text-[11px] text-slate-400">
                경계선을 좌우로 끌어 메모장 크기를 조절할 수 있습니다.
            </div>
        </aside>
    </div>

    <!-- Quiz Data & Logic Script -->
    <script>
        const quizData = [
            // --- 삼각비 ---
            {
                id: 1,
                unit: "1. 삼각비",
                subunit: "삼각비의 정의와 성질",
                question: "$\\sin A = \\frac{4}{5}$일 때, $\\frac{1 - \\cos A}{1 + \\cos A}$의 값을 구하시오.",
                options: ["$\\frac{1}{3}$", "$\\frac{1}{4}$", "$\\frac{2}{3}$", "$\\frac{3}{4}$"],
                correct: 1
            },
            {
                id: 2,
                unit: "1. 삼각비",
                subunit: "삼각비의 값의 계산",
                question: "$(\\sin 30^\\circ + \\cos 60^\\circ) \\times \\tan 45^\\circ - \\sin 90^\\circ \\times \\cos 0^\\circ$의 값을 구하시오.",
                options: ["$-1$", "$0$", "$1$", "$2$"],
                correct: 1
            },
            {
                id: 3,
                unit: "1. 삼각비",
                subunit: "삼각비의 활용 (거리와 높이)",
                question: "어느 지점에서 탑의 꼭짓점을 올려다본 각이 $30^\\circ$이고, 탑을 향해 $20\\text{ m}$ 더 걸어가서 올려다본 각이 $60^\\circ$일 때, 탑의 높이는?",
                options: ["$10\\sqrt{3}\\text{ m}$", "$15\\text{ m}$", "$20\\text{ m}$", "$20\\sqrt{3}\\text{ m}$"],
                correct: 0
            },
            {
                id: 4,
                unit: "1. 삼각비",
                subunit: "삼각형의 넓이",
                question: "삼각형 $ABC$에서 $b = 8\\text{ cm}$, $c = 10\\text{ cm}$이고 $\\angle A = 60^\\circ$일 때, 이 삼각형의 넓이는?",
                options: ["$20\\sqrt{3}\\text{ cm}^2$", "$25\\sqrt{3}\\text{ cm}^2$", "$40\\text{ cm}^2$", "$40\\sqrt{3}\\text{ cm}^2$"],
                correct: 0
            },
            {
                id: 5,
                unit: "1. 삼각비",
                subunit: "삼각표의 활용",
                question: "직각삼각형에서 빗변의 길이가 $12\\text{ cm}$이고 한 예각의 크기가 $35^\\circ$일 때, 이와 대응하는 높이의 길이는? (단, $\\sin 35^\\circ = 0.57$로 계산)",
                options: ["$6.2\\text{ cm}$", "$6.84\\text{ cm}$", "$7.2\\text{ cm}$", "$8.4\\text{ cm}$"],
                correct: 1
            },
            {
                id: 6,
                unit: "1. 삼각비",
                subunit: "입체도형에서의 삼각비",
                question: "한 모서리의 길이가 $6\\text{ cm}$인 정사면체에서 높이와 밑면이 이루는 각의 크기를 $\\theta$라 할 때, $\\cos \\theta$의 값은?",
                options: ["$\\frac{\\sqrt{3}}{3}$", "$\\frac{\\sqrt{6}}{3}$", "$\\frac{1}{3}$", "$\\frac{2}{3}$"],
                correct: 0
            },
            // --- 원의 성질 ---
            {
                id: 7,
                unit: "2. 원의 성질",
                subunit: "원과 현",
                question: "반지름의 길이가 $10\\text{ cm}$인 원에서 중심으로부터의 거리가 $6\\text{ cm}$인 현의 길이는?",
                options: ["$12\\text{ cm}$", "$16\\text{ cm}$", "$18\\text{ cm}$", "$20\\text{ cm}$"],
                correct: 1
            },
            {
                id: 8,
                unit: "2. 원의 성질",
                subunit: "원과 접선",
                question: "원 밖의 점 $P$에서 원에 그은 두 접선의 접점을 각각 $A, B$라 하자. $\\angle APB = 70^\\circ$일 때, $\\angle OAB$의 크기는? (단, $O$는 원의 중심)",
                options: ["$35^\\circ$", "$40^\\circ$", "$45^\\circ$", "$55^\\circ$"],
                correct: 0
            },
            {
                id: 9,
                unit: "2. 원의 성질",
                subunit: "원주각의 성질",
                question: "한 원에서 호의 길이가 중심각의 크기에 비례할 때, $\\text{arc } AB : \\text{arc } BC : \\text{arc } CA = 2 : 3 : 4$인 삼각형 $ABC$에서 가장 큰 내각의 크기는?",
                options: ["$70^\\circ$", "$80^\\circ$", "$90^\\circ$", "$100^\\circ$"],
                correct: 1
            },
            {
                id: 10,
                unit: "2. 원의 성질",
                subunit: "원에 내접하는 사각형",
                question: "원에 내접하는 사각형 $ABCD$에서 $\\angle A : \\angle C = 2 : 3$일 때, $\\angle C$의 크기는?",
                options: ["$96^\\circ$", "$108^\\circ$", "$120^\\circ$", "$135^\\circ$"],
                correct: 1
            },
            {
                id: 11,
                unit: "2. 원의 성질",
                subunit: "접선과 현이 이루는 각",
                question: "원 $O$의 접선과 현이 이루는 각이 $50^\\circ$이고, 그 현에 대한 원주각의 크기가 $x$일 때, $x$의 값은?",
                options: ["$40^\\circ$", "$50^\\circ$", "$60^\\circ$", "$100^\\circ$"],
                correct: 1
            },
            {
                id: 12,
                unit: "2. 원의 성질",
                subunit: "원의 성질 응용",
                question: "두 원이 두 점에서 만날 때, 공통현의 길이를 구하는 문제에서 원의 반지름이 각각 $5\\text{ cm}, 13\\text{ cm}$이고 중심사이의 거리가 $12\\text{ cm}$일 때, 공통현의 길이는?",
                options: ["$\\frac{60}{13}\\text{ cm}$", "$\\frac{120}{13}\\text{ cm}$", "$10\\text{ cm}$", "$12\\text{ cm}$"],
                correct: 1
            },
            {
                id: 13,
                unit: "2. 원의 성질",
                subunit: "원주각과 중심각의 활용",
                question: "원 위의 네 점 $A, B, C, D$에 대하여 $\\angle ADB = 35^\\circ$, $\\angle CAD = 25^\\circ$일 때, $\\angle ABC$의 크기는?",
                options: ["$50^\\circ$", "$55^\\circ$", "$60^\\circ$", "$65^\\circ$"],
                correct: 2
            }
        ];

        let currentIndex = 0;
        let userAnswers = new Array(quizData.length).fill(null);
        let activeTab = 'canvas';
        let canvasNotes = {};
        let textNotes = {};

        let scratchCanvas, scratchCtx;
        let isDrawing = false;
        let penColor = '#000000';
        let isEraser = false;

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('total-count').innerText = quizData.length;
            document.getElementById('total-count-badge').innerText = quizData.length;
            initTabs();
            initCanvases();
            initResizer();
            renderQuestion();
            lucide.createIcons();
            window.addEventListener('resize', handleCanvasResizes);
        });

        // --- Resizable Split Pane Logic ---
        function initResizer() {
            const resizer = document.getElementById('resizer');
            const leftPanel = document.getElementById('left-panel');
            const rightPanel = document.getElementById('right-panel');
            const mainContainer = document.getElementById('main-container');

            let isResizing = false;

            resizer.addEventListener('mousedown', (e) => {
                isResizing = true;
                resizer.classList.add('active');
                document.body.style.cursor = 'col-resize';
                e.preventDefault();
            });

            window.addEventListener('mousemove', (e) => {
                if (!isResizing) return;
                const containerRect = mainContainer.getBoundingClientRect();
                const offsetX = e.clientX - containerRect.left;
                const totalWidth = containerRect.width;

                let leftPercent = (offsetX / totalWidth) * 100;
                if (leftPercent < 30) leftPercent = 30;
                if (leftPercent > 75) leftPercent = 75;

                leftPanel.style.width = leftPercent + '%';
                rightPanel.style.width = (100 - leftPercent) + '%';
                handleCanvasResizes();
            });

            window.addEventListener('mouseup', () => {
                if (isResizing) {
                    isResizing = false;
                    resizer.classList.remove('active');
                    document.body.style.cursor = 'default';
                    handleCanvasResizes();
                }
            });
        }

        function initTabs() {
            const container = document.getElementById('question-tabs');
            container.innerHTML = '';
            quizData.forEach((q, idx) => {
                const btn = document.createElement('button');
                btn.id = `tab-btn-${idx}`;
                btn.className = `px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1 ${idx === currentIndex ? 'bg-indigo-600 text-white shadow-sm' : 'bg-white text-slate-600 hover:bg-slate-100 border border-slate-200'}`;
                btn.innerHTML = `<span>Q${idx + 1}</span>`;
                btn.onclick = () => jumpToQuestion(idx);
                container.appendChild(btn);
            });
        }

        function renderQuestion() {
            const data = quizData[currentIndex];

            document.getElementById('unit-badge').innerText = data.unit;
            document.getElementById('sub-unit-text').innerText = data.subunit;
            document.getElementById('q-number').innerText = `Q${currentIndex + 1}.`;
            document.getElementById('q-title').innerHTML = data.question;

            quizData.forEach((_, idx) => {
                const btn = document.getElementById(`tab-btn-${idx}`);
                if (btn) {
                    const isAnswered = userAnswers[idx] !== null;
                    const isCorrect = userAnswers[idx] === quizData[idx].correct;

                    if (idx === currentIndex) {
                        btn.className = "px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1 bg-indigo-600 text-white shadow-sm";
                    } else if (isAnswered) {
                        if (isCorrect) {
                            btn.className = "px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1 bg-emerald-50 text-emerald-700 border border-emerald-200";
                        } else {
                            btn.className = "px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1 bg-rose-50 text-rose-700 border border-rose-200";
                        }
                    } else {
                        btn.className = "px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1 bg-white text-slate-600 hover:bg-slate-100 border border-slate-200";
                    }
                }
            });

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            const isSubmitted = userAnswers[currentIndex] !== null;

            data.options.forEach((optText, optIdx) => {
                const label = document.createElement('label');
                let borderStyle = "border-slate-200 hover:border-indigo-300 bg-white";
                let checkChecked = "";

                if (userAnswers[currentIndex] === optIdx) {
                    checkChecked = "checked";
                    borderStyle = "border-indigo-600 bg-indigo-50/50 text-indigo-900 font-medium";
                }

                label.className = `flex items-center gap-3 p-3 rounded-xl border cursor-pointer transition ${borderStyle}`;
                label.innerHTML = `
                    <input type="radio" name="option" value="${optIdx}" ${checkChecked} ${isSubmitted ? 'disabled' : ''} class="w-4 h-4 text-indigo-600 focus:ring-indigo-500 border-slate-300">
                    <span class="text-sm flex-1">${optText}</span>
                `;
                optionsContainer.appendChild(label);
            });

            document.getElementById('prev-btn').disabled = currentIndex === 0;
            document.getElementById('next-btn').disabled = currentIndex === quizData.length - 1;

            const resultBox = document.getElementById('result-box');
            if (isSubmitted) {
                showResultBadge();
            } else {
                resultBox.classList.add('hidden');
            }

            restoreNotesForCurrentQuestion();

            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }

        function jumpToQuestion(index) {
            saveNotesForCurrentQuestion();
            currentIndex = index;
            renderQuestion();
        }

        function navigateQuestion(step) {
            const newIndex = currentIndex + step;
            if (newIndex >= 0 && newIndex < quizData.length) {
                jumpToQuestion(newIndex);
            }
        }

        function checkAnswer() {
            const selectedOption = document.querySelector('input[name="option"]:checked');
            if (!selectedOption) {
                alert("답안을 선택해 주세요!");
                return;
            }

            const chosenIdx = parseInt(selectedOption.value);
            userAnswers[currentIndex] = chosenIdx;

            updateScoreAndProgress();
            showResultBadge();
            renderQuestion();
        }

        function showResultBadge() {
            const data = quizData[currentIndex];
            const userChoice = userAnswers[currentIndex];
            const isCorrect = userChoice === data.correct;

            const resultBox = document.getElementById('result-box');
            const resultIcon = document.getElementById('result-icon');
            const resultText = document.getElementById('result-text');

            resultBox.classList.remove('hidden');

            if (isCorrect) {
                resultBox.className = "mt-6 p-4 rounded-xl border border-emerald-200 bg-emerald-50 flex items-center gap-2 transition-all";
                resultIcon.innerHTML = `<i data-lucide="check-circle" class="w-5 h-5 text-emerald-600"></i>`;
                resultText.className = "text-sm font-bold text-emerald-800";
                resultText.innerText = "정답입니다!";
            } else {
                resultBox.className = "mt-6 p-4 rounded-xl border border-rose-200 bg-rose-50 flex items-center gap-2 transition-all";
                resultIcon.innerHTML = `<i data-lucide="x-circle" class="w-5 h-5 text-rose-600"></i>`;
                resultText.className = "text-sm font-bold text-rose-800";
                resultText.innerText = "오답입니다.";
            }
            lucide.createIcons();
        }

        function updateScoreAndProgress() {
            let solved = 0;
            let score = 0;
            let wrong = 0;

            userAnswers.forEach((ans, idx) => {
                if (ans !== null) {
                    solved++;
                    if (ans === quizData[idx].correct) {
                        score += 1;
                    } else {
                        wrong += 1;
                    }
                }
            });

            document.getElementById('solved-count').innerText = solved;
            document.getElementById('score-count').innerText = score;
            document.getElementById('wrong-count').innerText = wrong;
        }

        function resetQuiz() {
            if (confirm("모든 풀이 및 메모 기록을 초기화하시겠습니까?")) {
                userAnswers = new Array(quizData.length).fill(null);
                canvasNotes = {};
                textNotes = {};
                currentIndex = 0;
                clearCanvas();
                document.getElementById('text-memo').value = '';
                updateScoreAndProgress();
                renderQuestion();
            }
        }

        // --- Canvas Initialization & Drawing System ---
        function initCanvases() {
            scratchCanvas = document.getElementById('scratchpad');
            scratchCtx = scratchCanvas.getContext('2d');

            handleCanvasResizes();

            scratchCanvas.addEventListener('mousedown', startScratchDraw);
            scratchCanvas.addEventListener('mousemove', drawScratch);
            scratchCanvas.addEventListener('mouseup', stopScratchDraw);
            scratchCanvas.addEventListener('mouseleave', stopScratchDraw);
            scratchCanvas.addEventListener('touchstart', startScratchTouch, { passive: false });
            scratchCanvas.addEventListener('touchmove', drawScratchTouch, { passive: false });
            scratchCanvas.addEventListener('touchend', stopScratchDraw);

            const textMemo = document.getElementById('text-memo');
            textMemo.addEventListener('input', () => {
                textNotes[currentIndex] = textMemo.value;
            });
        }

        function handleCanvasResizes() {
            const scratchContainer = document.getElementById('canvas-container');
            if (scratchContainer && scratchCanvas) {
                let imgData = scratchCanvas.width > 0 ? scratchCtx.getImageData(0, 0, scratchCanvas.width, scratchCanvas.height) : null;
                scratchCanvas.width = scratchContainer.clientWidth;
                scratchCanvas.height = scratchContainer.clientHeight;
                scratchCtx.lineCap = 'round';
                scratchCtx.lineJoin = 'round';
                if (imgData) scratchCtx.putImageData(imgData, 0, 0);
            }
        }

        function getScratchPos(e) {
            const rect = scratchCanvas.getBoundingClientRect();
            return { x: e.clientX - rect.left, y: e.clientY - rect.top };
        }

        function startScratchDraw(e) {
            isDrawing = true;
            const pos = getScratchPos(e);
            scratchCtx.beginPath();
            scratchCtx.moveTo(pos.x, pos.y);
        }

        function drawScratch(e) {
            if (!isDrawing) return;
            const pos = getScratchPos(e);
            scratchCtx.strokeStyle = isEraser ? '#ffffff' : penColor;
            scratchCtx.lineWidth = isEraser ? 20 : 2.5;
            scratchCtx.lineTo(pos.x, pos.y);
            scratchCtx.stroke();
        }

        function startScratchTouch(e) {
            e.preventDefault();
            if (e.touches.length === 1) startScratchDraw(e.touches[0]);
        }

        function drawScratchTouch(e) {
            e.preventDefault();
            if (e.touches.length === 1) drawScratch(e.touches[0]);
        }

        function stopScratchDraw() {
            if (isDrawing) {
                isDrawing = false;
                scratchCtx.closePath();
                saveNotesForCurrentQuestion();
            }
        }

        function setPenColor(color, colorName) {
            penColor = color;
            isEraser = false;
            document.getElementById('eraser-btn').classList.remove('bg-slate-200', 'border-slate-400');

            document.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`color-btn-${colorName}`).classList.add('active');
        }

        function toggleEraser() {
            isEraser = !isEraser;
            const eraserBtn = document.getElementById('eraser-btn');
            if (isEraser) {
                eraserBtn.classList.add('bg-slate-200', 'border-slate-400');
            } else {
                eraserBtn.classList.remove('bg-slate-200', 'border-slate-400');
            }
        }

        function clearCanvas() {
            if (!scratchCtx || !scratchCanvas) return;
            scratchCtx.clearRect(0, 0, scratchCanvas.width, scratchCanvas.height);
            delete canvasNotes[currentIndex];
        }

        function saveNotesForCurrentQuestion() {
            if (scratchCanvas && scratchCtx) {
                canvasNotes[currentIndex] = scratchCtx.getImageData(0, 0, scratchCanvas.width, scratchCanvas.height);
            }
            textNotes[currentIndex] = document.getElementById('text-memo').value;
        }

        function restoreNotesForCurrentQuestion() {
            if (scratchCanvas && scratchCtx) {
                scratchCtx.clearRect(0, 0, scratchCanvas.width, scratchCanvas.height);
                if (canvasNotes[currentIndex]) {
                    scratchCtx.putImageData(canvasNotes[currentIndex], 0, 0);
                }
            }
            const textMemo = document.getElementById('text-memo');
            if (textMemo) {
                textMemo.value = textNotes[currentIndex] || '';
            }
        }

        function switchNoteTab(tab) {
            activeTab = tab;
            const canvasContainer = document.getElementById('canvas-container');
            const textContainer = document.getElementById('text-container');
            const canvasTools = document.getElementById('canvas-tools');
            const tabCanvasBtn = document.getElementById('tab-canvas-btn');
            const tabTextBtn = document.getElementById('tab-text-btn');

            if (tab === 'canvas') {
                canvasContainer.classList.remove('hidden');
                textContainer.classList.add('hidden');
                canvasTools.classList.remove('hidden');

                tabCanvasBtn.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold bg-indigo-50 text-indigo-700 transition";
                tabTextBtn.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-500 hover:bg-slate-100 transition";
                handleCanvasResizes();
            } else {
                canvasContainer.classList.add('hidden');
                textContainer.classList.remove('hidden');
                canvasTools.classList.add('hidden');

                tabCanvasBtn.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-500 hover:bg-slate-100 transition";
                tabTextBtn.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold bg-indigo-50 text-indigo-700 transition";
            }
        }
    </script>
</body>
</html>
