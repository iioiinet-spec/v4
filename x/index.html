<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<title>크리스마스 카드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700&family=Gaegu&display=swap" rel="stylesheet">
<style>
/* ───────── 색과 글꼴 ───────── */
:root{
  --void:#05070f;        /* 가장 바깥 */
  --night:#070c1a;       /* 카드 안쪽 하늘 위 */
  --night2:#0e1830;      /* 카드 안쪽 하늘 아래 */
  --ink:#f4ead8;         /* 메시지 */
  --gold:#e8c37e;        /* 금박 */
  --gold-dim:#8a6f3e;
  --serif:'Gowun Batang', serif;
  --hand:'Gaegu', cursive;
  --ui:system-ui, -apple-system, 'Segoe UI', sans-serif;
}
*{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0; background:var(--void); color:var(--ink);
  font-family:var(--ui); overflow:hidden; overscroll-behavior:none;
  display:grid; place-items:center;
  -webkit-tap-highlight-color:transparent;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
/* 바깥 어둠에 아주 옅은 빛 */
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:radial-gradient(70% 55% at 50% 44%, rgba(90,120,200,.13), transparent 70%);
}

/* ───────── 카드 ───────── */
.stage{ position:relative; z-index:1; perspective:1600px; perspective-origin:50% 45%; }
.card{
  position:relative;
  /* 3:4 카드. 가로와 세로 중 먼저 닿는 쪽에 맞춥니다 */
  width:min(94vw, 70vh, 760px);
  aspect-ratio:3/4;
  border-radius:3px;
  transform-style:preserve-3d;
  box-shadow:0 40px 90px -20px rgba(0,0,0,.85), 0 0 0 1px rgba(232,195,126,.16);
}
/* 길쭉한 화면(휴대폰)에서는 세로를 꽉 채웁니다 */
@media (max-aspect-ratio: 5/8){
  .card{ width:min(94vw, 760px); height:min(93vh, 1120px); aspect-ratio:auto; }
}

/* 카드 속 장면 */
.scene{
  position:absolute; inset:0; overflow:hidden; border-radius:3px;
  background:linear-gradient(180deg, var(--night) 0%, #0b1428 46%, var(--night2) 78%, #16244a 100%);
}
#sky{ position:absolute; inset:0; width:100%; height:100%; display:block; }
/* 비네팅 — 캔버스에 그리지 않고 CSS로 (공짜) */
.vig{
  position:absolute; inset:0; pointer-events:none;
  background:
    radial-gradient(120% 86% at 50% 42%, transparent 44%, rgba(3,5,12,.62) 100%),
    linear-gradient(180deg, rgba(3,5,12,.5), transparent 26%);
}

/* 메시지 */
.msg{
  position:absolute; left:0; right:0; top:6%;
  padding:0 10%; text-align:center; pointer-events:none;
  animation:drift 11s ease-in-out infinite;
}
@keyframes drift{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-7px); } }
.msg .to{
  margin:0 0 clamp(14px,2.6vh,26px); font-family:var(--serif);
  font-size:clamp(13px,2.05vh,19px); letter-spacing:.22em; color:var(--gold);
  opacity:0; text-shadow:0 0 22px rgba(232,195,126,.5);
}
.msg .body{ margin:0; font-family:var(--serif); }
.msg .ln{
  display:block; opacity:0;
  font-size:clamp(17px,3.1vh,29px); line-height:1.95; letter-spacing:.035em;
  text-shadow:0 0 26px rgba(214,228,255,.42), 0 1px 2px rgba(0,0,0,.5);
}
.msg .from{
  margin:clamp(16px,3vh,30px) 0 0; font-family:var(--serif);
  font-size:clamp(12px,1.9vh,17px); letter-spacing:.14em; color:#dfe6f6; opacity:0;
  text-shadow:0 0 18px rgba(200,216,255,.4);
}
@keyframes riseIn{ from{ opacity:0; transform:translateY(30px);} to{ opacity:1; transform:translateY(0);} }
@keyframes glowIn{ from{ opacity:0; } to{ opacity:1; } }
.play .msg .to   { animation:glowIn 1.5s ease forwards; }
.play .msg .ln   { animation:riseIn 1.35s cubic-bezier(.22,.9,.3,1) forwards; }
.play .msg .from { animation:glowIn 1.8s ease forwards; }

/* ───────── 덮개 (닫힌 상태) ───────── */
.leaf{
  position:absolute; top:0; bottom:0; width:50.2%;
  background:
    radial-gradient(130% 100% at 50% 0%, #15203c 0%, #0a1024 55%, #060a16 100%);
  transform-style:preserve-3d; backface-visibility:hidden;
  transition:transform 1.5s cubic-bezier(.62,.02,.2,1), box-shadow 1.5s ease;
  will-change:transform;
}
.leaf.l{ left:0;  transform-origin:left center;  border-radius:3px 0 0 3px;
         box-shadow:inset -22px 0 40px -24px rgba(0,0,0,.9); }
.leaf.r{ right:0; transform-origin:right center; border-radius:0 3px 3px 0;
         box-shadow:inset 22px 0 40px -24px rgba(0,0,0,.9); }
/* 금박 테두리 */
.leaf::after{
  content:''; position:absolute; inset:14px; pointer-events:none;
  border:1px solid rgba(232,195,126,.3);
}
.leaf.l::after{ border-right:none; }
.leaf.r::after{ border-left:none; }
/* 가운데 이음선 */
.seam{
  position:absolute; left:50%; top:0; bottom:0; width:1px; margin-left:-.5px;
  background:linear-gradient(180deg, transparent, rgba(232,195,126,.42) 18%, rgba(232,195,126,.42) 82%, transparent);
  transition:opacity .5s ease; z-index:3;
}
/* 덮개 위 장식 — 두 쪽에 걸쳐 하나의 그림처럼 */
.emblem{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:min(34%, 186px); z-index:2; pointer-events:none;
  transition:opacity .7s ease, transform 1s ease;
}
.emblem svg{ width:100%; height:auto; display:block; }
.coverTxt{
  position:absolute; left:0; right:0; bottom:13%; text-align:center; z-index:2;
  pointer-events:none; transition:opacity .6s ease;
}
.coverTxt .to{
  font-family:var(--serif); font-size:clamp(14px,2.2vh,20px); letter-spacing:.3em;
  color:var(--gold); margin:0 0 14px; text-shadow:0 0 20px rgba(232,195,126,.45);
}
.coverTxt .tap{
  font-family:var(--ui); font-size:11.5px; letter-spacing:.3em; color:#7d8bab;
  margin:0; animation:breathe 3.2s ease-in-out infinite;
}
@keyframes breathe{ 0%,100%{ opacity:.45; } 50%{ opacity:1; } }

/* 열린 상태 */
.card.open .leaf.l{ transform:rotateY(-162deg); box-shadow:none; }
.card.open .leaf.r{ transform:rotateY(162deg);  box-shadow:none; }
.card.open .seam, .card.open .emblem, .card.open .coverTxt{ opacity:0; }
.card.open .emblem{ transform:translate(-50%,-50%) scale(1.5); }
.card.open .leaf{ pointer-events:none; }

/* 클릭 영역 */
.hit{ position:absolute; inset:0; z-index:4; cursor:pointer; background:transparent; border:0; }
.card.open .hit{ display:none; }

/* ───────── 조작 ───────── */
.ui{
  position:absolute; right:14px; bottom:14px; z-index:6;
  display:flex; gap:7px; opacity:0; transition:opacity .6s ease;
}
.card.open .ui{ opacity:.3; }
.ui:hover, .ui:focus-within, .ui.show{ opacity:1 !important; }
.ui button{
  width:38px; height:38px; border-radius:50%; cursor:pointer;
  border:1px solid rgba(232,195,126,.3); background:rgba(8,12,24,.62);
  color:var(--gold); font-size:14px; display:grid; place-items:center;
  backdrop-filter:blur(6px); transition:background .25s, border-color .25s, transform .2s;
}
.ui button:hover{ background:rgba(232,195,126,.17); border-color:rgba(232,195,126,.6); transform:translateY(-2px); }
.ui button:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
.ui button[aria-pressed="true"]{ background:rgba(232,195,126,.24); }

/* 설정 서랍 */
.panel{
  position:absolute; left:0; right:0; bottom:0; z-index:7;
  background:rgba(6,10,20,.93); backdrop-filter:blur(14px);
  border-top:1px solid rgba(232,195,126,.26);
  padding:16px 16px calc(16px + env(safe-area-inset-bottom));
  transform:translateY(102%); transition:transform .45s cubic-bezier(.3,.9,.3,1);
  font-family:var(--ui);
}
.panel.on{ transform:translateY(0); }
.panel label{ display:block; font-size:10.5px; letter-spacing:.16em; color:#8d9ab8; margin:0 0 4px; }
.panel input, .panel textarea, .panel select{
  width:100%; background:rgba(255,255,255,.055); color:var(--ink);
  border:1px solid rgba(232,195,126,.22); border-radius:4px;
  padding:8px 10px; font-family:var(--serif); font-size:14.5px; line-height:1.6;
}
.panel textarea{ resize:vertical; min-height:74px; }
.panel input:focus, .panel textarea:focus, .panel select:focus{
  outline:none; border-color:rgba(232,195,126,.6); background:rgba(255,255,255,.085); }
.panel .row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
.panel .row3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:10px; }
@media (max-width:460px){ .panel .row, .panel .row3{ grid-template-columns:1fr; } }
.panel .acts{ display:flex; gap:8px; margin-top:12px; }
.panel .acts button{
  flex:1; padding:10px; border-radius:999px; cursor:pointer; font-size:13.5px;
  border:1px solid rgba(232,195,126,.3); background:transparent; color:var(--gold);
  font-family:var(--ui); }
.panel .acts button.main{ background:var(--gold); border-color:var(--gold); color:#14100a; font-weight:600; }
.panel .acts button:hover{ background:rgba(232,195,126,.15); }
.panel .acts button.main:hover{ opacity:.9; background:var(--gold); }

#toast{
  position:absolute; left:50%; bottom:68px; transform:translate(-50%,10px); z-index:9;
  background:rgba(6,10,20,.9); color:var(--gold); border:1px solid rgba(232,195,126,.3);
  padding:8px 16px; border-radius:999px; font-size:12.5px; font-family:var(--ui);
  opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; backdrop-filter:blur(6px);
}
#toast.on{ opacity:1; transform:translate(-50%,0); }

@media (prefers-reduced-motion: reduce){
  .leaf{ transition-duration:.45s; }
  .msg{ animation:none; }
  .coverTxt .tap{ animation:none; opacity:.7; }
}
</style>
</head>
<body>

<div class="stage">
  <div class="card" id="card">

    <!-- 카드 안 -->
    <div class="scene">
      <canvas id="sky"></canvas>
      <div class="vig"></div>
      <div class="msg" id="msg">
        <p class="to" id="mTo"></p>
        <p class="body" id="mBody"></p>
        <p class="from" id="mFrom"></p>
      </div>
    </div>

    <!-- 덮개 -->
    <div class="leaf l"></div>
    <div class="leaf r"></div>
    <div class="seam"></div>
    <div class="emblem" aria-hidden="true">
      <svg viewBox="0 0 200 200" fill="none">
        <circle cx="100" cy="100" r="74" stroke="#e8c37e" stroke-opacity=".3" stroke-width="1"/>
        <circle cx="100" cy="100" r="64" stroke="#e8c37e" stroke-opacity=".16" stroke-width="1"/>
        <path d="M100 48 L112 88 L154 88 L120 112 L132 152 L100 128 L68 152 L80 112 L46 88 L88 88 Z"
              fill="#e8c37e" fill-opacity=".9"/>
        <path d="M100 30 L100 54 M100 146 L100 170 M30 100 L54 100 M146 100 L170 100"
              stroke="#e8c37e" stroke-opacity=".5" stroke-width="1" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="coverTxt">
      <p class="to" id="cTo">To. 소중한 당신에게</p>
      <p class="tap">눌러서 열기</p>
    </div>
    <button class="hit" id="hit" type="button" aria-label="카드 열기"></button>

    <!-- 조작 -->
    <div class="ui" id="ui">
      <button id="bMusic" type="button" aria-pressed="false" aria-label="음악">♪</button>
      <button id="bReplay" type="button" aria-label="다시 보기">↺</button>
      <button id="bLink" type="button" aria-label="링크 복사">⎘</button>
      <button id="bEdit" type="button" aria-label="메시지 고치기">✎</button>
    </div>

    <!-- 설정 -->
    <div class="panel" id="panel">
      <div class="row">
        <div><label for="iTo">받는 사람</label><input id="iTo" type="text" maxlength="28"></div>
        <div><label for="iFrom">보내는 사람</label><input id="iFrom" type="text" maxlength="28"></div>
      </div>
      <label for="iBody">메시지 — 줄을 나누면 한 줄씩 떠오릅니다</label>
      <textarea id="iBody" maxlength="140" rows="3"></textarea>
      <div class="row3" style="margin-top:10px">
        <div><label for="iFont">글씨체</label>
          <select id="iFont">
            <option value="Gowun Batang">고운바탕</option>
            <option value="Nanum Myeongjo">나눔명조</option>
            <option value="Gaegu">개구 · 손글씨</option>
          </select></div>
        <div><label for="iSong">음악</label>
          <select id="iSong">
            <option value="0">고요한 밤 거룩한 밤</option>
            <option value="1">징글벨</option>
          </select></div>
        <div><label for="iMood">트리 빛깔</label>
          <select id="iMood">
            <option value="0">황금빛</option>
            <option value="1">새벽빛</option>
            <option value="2">장미빛</option>
          </select></div>
      </div>
      <div class="acts">
        <button id="pClose" type="button">닫기</button>
        <button id="pApply" class="main" type="button">카드에 담기</button>
      </div>
    </div>

    <div id="toast" role="status" aria-live="polite"></div>
  </div>
</div>

<script>
'use strict';
(function(){

/* ═══════════ 설정 ═══════════ */
var DEFAULT = {
  to: 'To. 소중한 당신에게',
  body: '올 한 해 참 고마웠습니다\n당신의 밤에도\n이 불빛이 닿기를',
  from: '— 마음을 담아',
  font: 'Gowun Batang',
  song: '0',
  mood: '0'
};
var S = Object.assign({}, DEFAULT);

/* 주소에 담긴 메시지 먼저, 없으면 저장된 것 */
function readHash(){
  try{
    var h = location.hash.slice(1);
    if (!h) return null;
    var p = new URLSearchParams(h), o = {};
    ['to','body','from','font','song','mood'].forEach(function(k){
      if (p.has(k)) o[k] = p.get(k);
    });
    return Object.keys(o).length ? o : null;
  }catch(e){ return null; }
}
function readStore(){
  try{ return JSON.parse(localStorage.getItem('xmas-card-v1') || 'null'); }catch(e){ return null; }
}
function writeStore(){
  try{ localStorage.setItem('xmas-card-v1', JSON.stringify(S)); }catch(e){}
}
Object.assign(S, readStore() || {}, readHash() || {});

var $ = function(id){ return document.getElementById(id); };
var card = $('card'), cv = $('sky'), ctx = cv.getContext('2d', { alpha:false });
var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ═══════════ 빛깔 ═══════════ */
/* [r,g,b, 뽑힐 가중치] — 앞쪽 둘이 대부분을 차지합니다 */
var MOODS = [
  [ [255,214,140,34], [255,246,224,26], [255,168,86,14], [150,214,255,9], [255,150,170,8], [150,240,200,9] ],
  [ [190,224,255,32], [245,250,255,26], [140,190,255,16], [200,170,255,10], [255,235,190,8],  [160,255,235,8] ],
  [ [255,170,190,32], [255,235,230,24], [255,120,150,16], [220,160,255,12], [255,214,140,10], [160,220,255,6] ]
];

/* ═══════════ 스프라이트 — 딱 한 번만 그려 두고 재사용 ═══════════ */
/* shadowBlur 는 프레임마다 쓰면 아주 느립니다. 미리 그려 둔 그림을
   drawImage 로 찍는 방식이 같은 모양에 수십 배 빠릅니다. */
var SPR = 64;
function makeGlow(rgb, core){
  var c = document.createElement('canvas');
  c.width = c.height = SPR;
  var g = c.getContext('2d');
  var h = SPR / 2;
  var grd = g.createRadialGradient(h, h, 0, h, h, h);
  var col = rgb[0] + ',' + rgb[1] + ',' + rgb[2];
  grd.addColorStop(0,    'rgba(255,255,255,' + (core ? 1 : .95) + ')');
  grd.addColorStop(0.12, 'rgba(' + col + ',1)');
  grd.addColorStop(0.30, 'rgba(' + col + ',0.42)');
  grd.addColorStop(0.62, 'rgba(' + col + ',0.10)');
  grd.addColorStop(1,    'rgba(' + col + ',0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, SPR, SPR);
  return c;
}
function makeSoft(alpha){            /* 눈송이 — 가장자리가 부드러운 흰 점 */
  var c = document.createElement('canvas');
  c.width = c.height = 32;
  var g = c.getContext('2d'), h = 16;
  var grd = g.createRadialGradient(h, h, 0, h, h, h);
  grd.addColorStop(0,   'rgba(255,255,255,' + alpha + ')');
  grd.addColorStop(0.4, 'rgba(238,246,255,' + (alpha * 0.55) + ')');
  grd.addColorStop(1,   'rgba(220,235,255,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 32, 32);
  return c;
}
function makeStar(rgb){              /* 꼭대기 별 — 둥근 빛 + 네 갈래 */
  var N = 256, c = document.createElement('canvas');
  c.width = c.height = N;
  var g = c.getContext('2d'), h = N / 2;
  var col = rgb[0] + ',' + rgb[1] + ',' + rgb[2];
  var grd = g.createRadialGradient(h, h, 0, h, h, h * 0.42);
  grd.addColorStop(0, 'rgba(255,255,255,1)');
  grd.addColorStop(0.25, 'rgba(' + col + ',0.85)');
  grd.addColorStop(1, 'rgba(' + col + ',0)');
  g.fillStyle = grd; g.fillRect(0, 0, N, N);
  g.globalCompositeOperation = 'lighter';
  [0, Math.PI / 2, Math.PI / 4, -Math.PI / 4].forEach(function(a, i){
    var len = i < 2 ? h * 0.96 : h * 0.52;
    var wid = i < 2 ? 3.4 : 2.0;
    g.save(); g.translate(h, h); g.rotate(a);
    var lg = g.createLinearGradient(-len, 0, len, 0);
    lg.addColorStop(0,   'rgba(' + col + ',0)');
    lg.addColorStop(0.5, 'rgba(255,255,255,0.9)');
    lg.addColorStop(1,   'rgba(' + col + ',0)');
    g.fillStyle = lg;
    g.fillRect(-len, -wid / 2, len * 2, wid);
    g.restore();
  });
  return c;
}

var glows = [], softs = [], starSpr = null;
function buildSprites(){
  glows = MOODS[+S.mood].map(function(m){ return makeGlow(m); });
  softs = [makeSoft(0.95), makeSoft(0.6), makeSoft(0.34)];
  starSpr = makeStar(MOODS[+S.mood][0]);
}

/* ═══════════ 크기와 성능 등급 ═══════════ */
var W = 0, H = 0, DPR = 1, tier = 2;   /* tier 2 = 가장 좋음, 0 = 가장 가벼움 */
var COUNT = { tree:0, snow:0, bokeh:0 };

function budget(){
  var area = W * H;
  var base = Math.min(1.15, Math.max(0.42, area / (760 * 1010)));
  var k = [0.42, 0.68, 1][tier];
  COUNT.tree  = Math.round(820 * base * k);
  COUNT.snow  = Math.round(230 * base * k);
  COUNT.bokeh = Math.round(16  * base * k);
  if (reduce){ COUNT.snow = Math.round(COUNT.snow * 0.5); }
}
function resize(){
  var r = cv.getBoundingClientRect();
  W = Math.max(1, Math.round(r.width));
  H = Math.max(1, Math.round(r.height));
  /* 화면이 클수록 배율을 낮춰 픽셀 수가 폭발하지 않게 */
  var cap = (W * H > 620 * 830) ? 1.6 : 2;
  DPR = Math.min(window.devicePixelRatio || 1, cap, tier === 0 ? 1.25 : cap);
  cv.width  = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  budget();
  buildScene();
}

/* ═══════════ 장면 ═══════════ */
var tree = [], snow = [], bokeh = [], geo = {};

function buildScene(){
  /* 트리가 놓일 자리 — 글이 끝나는 높이를 재서 그 아래로 내립니다.
     메시지가 길어져도 꼭대기 별과 겹치지 않습니다. */
  var msgBottom = H * 0.40;
  try{
    var mr = document.getElementById('msg').getBoundingClientRect();
    var cr = cv.getBoundingClientRect();
    if (mr.height) msgBottom = mr.bottom - cr.top;
  }catch(e){}
  geo.cx = W * 0.5;
  geo.baseY = H * 0.885;                                           /* 밑동 */
  /* 꼭대기 별은 둘레로 빛이 퍼집니다. 그 반지름만큼 더 내려
     글과 별빛이 서로 닿지 않게 두 번에 걸쳐 자리를 잡습니다. */
  var top = Math.max(H * 0.45, msgBottom + H * 0.03);
  var rad = Math.min(W * 0.30, (geo.baseY - top) * 0.47);
  top = Math.max(top, Math.min(H * 0.70, msgBottom + rad * 0.85));
  geo.topY  = top;
  geo.hgt   = geo.baseY - top;
  geo.rad   = Math.min(W * 0.30, geo.hgt * 0.47);
  geo.focal = geo.rad * 3.4;

  /* 트리 — 황금각으로 원뿔을 감아 올라가는 나선 */
  tree = [];
  var N = COUNT.tree, GOLD = 2.39996323;
  var pal = MOODS[+S.mood];
  var wsum = 0; pal.forEach(function(p){ wsum += p[3]; });
  for (var i = 0; i < N; i++){
    var t = i / N;                   /* 0 꼭대기 → 1 밑동 */
    var tt = Math.pow(t, 0.86);      /* 아래로 갈수록 촘촘하게 */
    var ang = i * GOLD;
    /* 두 겹 — 겉면과 살짝 안쪽. 안쪽이 깊이를 만듭니다 */
    var inner = (i % 7 === 0) ? 0.58 : (i % 3 === 0 ? 0.84 : 1);
    var r = tt * geo.rad * inner * (0.93 + Math.random() * 0.14);
    var pick = Math.random() * wsum, ci = 0;
    for (var k = 0; k < pal.length; k++){ pick -= pal[k][3]; if (pick <= 0){ ci = k; break; } }
    tree.push({
      x: Math.cos(ang) * r,
      z: Math.sin(ang) * r,
      y: geo.topY + tt * geo.hgt + (Math.random() - 0.5) * 3,
      c: ci,
      s: (0.42 + Math.random() * 0.75) * (1 + (1 - tt) * 0.28),  /* 위쪽이 조금 크게 */
      sp: 0.6 + Math.random() * 1.9,                              /* 깜빡이는 빠르기 */
      ph: Math.random() * 6.283,                                  /* 깜빡임 시작점 */
      b: 0.5 + Math.random() * 0.5                                /* 기본 밝기 */
    });
  }

  /* 눈 — 깊이 세 겹 */
  snow = [];
  for (var j = 0; j < COUNT.snow; j++){
    var layer = j % 3;
    snow.push({
      x: Math.random() * W,
      y: Math.random() * H,
      l: layer,
      r: [1.6, 3.0, 5.2][layer] * (0.7 + Math.random() * 0.7),
      v: [7, 14, 26][layer] * (0.75 + Math.random() * 0.6),   /* 초당 픽셀 */
      w: (6 + Math.random() * 16) * (layer + 1) * 0.5,        /* 좌우 흔들림 폭 */
      ph: Math.random() * 6.283,
      sp: 0.25 + Math.random() * 0.45
    });
  }

  /* 보케 — 아주 흐린 큰 빛. 깊이감만 담당합니다 */
  bokeh = [];
  for (var b = 0; b < COUNT.bokeh; b++){
    bokeh.push({
      x: Math.random() * W, y: Math.random() * H * 0.8,
      r: 26 + Math.random() * 62,
      a: 0.025 + Math.random() * 0.045,
      v: 2 + Math.random() * 5,
      c: Math.floor(Math.random() * 3),
      ph: Math.random() * 6.283
    });
  }
}

/* ═══════════ 그리기 ═══════════ */
var rot = 0, clock = 0, raf = 0, last = 0, running = false;

function drawGround(){
  /* 밑동 아래 번지는 빛 */
  var g = ctx.createRadialGradient(geo.cx, geo.baseY + 6, 0, geo.cx, geo.baseY + 6, geo.rad * 2.5);
  var m = MOODS[+S.mood][0];
  g.addColorStop(0,   'rgba(' + m[0] + ',' + m[1] + ',' + m[2] + ',0.17)');
  g.addColorStop(0.45,'rgba(' + m[0] + ',' + m[1] + ',' + m[2] + ',0.05)');
  g.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, geo.baseY - geo.rad, W, H - (geo.baseY - geo.rad));
}

function frame(now){
  if (!running) return;
  raf = requestAnimationFrame(frame);

  var dt = Math.min(0.05, (now - last) / 1000 || 0.016);
  last = now;
  clock += dt;
  rot += dt * (reduce ? 0.035 : 0.085);

  /* 배경 — 카드 안 하늘. 그라데이션은 CSS 가 맡고 캔버스는 투명 대신 어둠으로 */
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#070c1a';
  ctx.fillRect(0, 0, W, H);
  var sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0,    '#060a16');
  sky.addColorStop(0.46, '#0b1428');
  sky.addColorStop(0.80, '#0e1830');
  sky.addColorStop(1,    '#17254c');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  /* 보케 (뒤) */
  ctx.globalCompositeOperation = 'lighter';
  for (var b = 0; b < bokeh.length; b++){
    var o = bokeh[b];
    o.y -= o.v * dt;
    if (o.y < -o.r) { o.y = H + o.r; o.x = Math.random() * W; }
    var oa = o.a * (0.6 + 0.4 * Math.sin(clock * 0.5 + o.ph));
    ctx.globalAlpha = oa;
    ctx.drawImage(glows[o.c], o.x - o.r, o.y - o.r, o.r * 2, o.r * 2);
  }

  /* 먼 눈 (트리 뒤) */
  ctx.globalCompositeOperation = 'source-over';
  drawSnowLayer(0, dt);

  drawGround();

  /* 트리 — 반사 먼저, 그 위에 본체 */
  ctx.globalCompositeOperation = 'lighter';
  drawTree(true);
  drawTree(false);
  drawStar();

  /* 가까운 눈 (트리 앞) */
  ctx.globalCompositeOperation = 'source-over';
  drawSnowLayer(1, dt);
  drawSnowLayer(2, dt);

  ctx.globalAlpha = 1;
  probe(dt);
}

function drawTree(mirror){
  var cosR = Math.cos(rot), sinR = Math.sin(rot);
  var f = geo.focal, cx = geo.cx, base = geo.baseY;
  var step = mirror ? (tier === 2 ? 2 : 3) : 1;      /* 반사는 솎아서 그립니다 */
  for (var i = 0; i < tree.length; i += step){
    var p = tree[i];
    var X = p.x * cosR - p.z * sinR;
    var Z = p.x * sinR + p.z * cosR;
    var k = f / (f + Z);                              /* 원근 */
    var sx = cx + X * k;
    var sy = mirror ? base + (base - p.y) * 0.42 : p.y;
    if (mirror) sy = base + (base - p.y) * 0.42;
    else sy = base - (base - p.y) * k;                /* 위쪽일수록 살짝 안으로 */
    var tw = 0.56 + 0.44 * Math.sin(clock * p.sp + p.ph);
    var a = p.b * tw * (0.42 + 0.58 * k);
    if (mirror) a *= 0.2;
    if (a < 0.012) continue;
    var sz = p.s * k * 13;
    ctx.globalAlpha = a;
    ctx.drawImage(glows[p.c], sx - sz, sy - sz, sz * 2, sz * 2);
  }
}

function drawStar(){
  var pulse = 0.72 + 0.28 * Math.sin(clock * 1.25);
  var sz = geo.rad * 0.80 * pulse;
  ctx.globalAlpha = 0.46 + 0.26 * pulse;
  ctx.save();
  ctx.translate(geo.cx, geo.topY);
  ctx.rotate(clock * 0.09);
  ctx.drawImage(starSpr, -sz, -sz, sz * 2, sz * 2);
  ctx.restore();
}

function drawSnowLayer(layer, dt){
  for (var i = 0; i < snow.length; i++){
    var f = snow[i];
    if (f.l !== layer) continue;
    f.y += f.v * dt;
    f.x += Math.sin(clock * f.sp + f.ph) * f.w * dt;
    if (f.y - f.r > H){ f.y = -f.r; f.x = Math.random() * W; }
    if (f.x < -20) f.x = W + 20; else if (f.x > W + 20) f.x = -20;
    ctx.globalAlpha = [0.42, 0.62, 0.42][layer];
    ctx.drawImage(softs[layer], f.x - f.r, f.y - f.r, f.r * 2, f.r * 2);
  }
}

/* ═══════════ 성능 감시 — 느리면 스스로 가벼워집니다 ═══════════ */
var pFrames = 0, pTime = 0, pDrops = 0;
function probe(dt){
  if (pDrops >= 2) return;
  pFrames++; pTime += dt;
  if (pFrames < 70) return;
  var fps = pFrames / pTime;
  pFrames = 0; pTime = 0;
  if (fps < 46 && tier > 0){
    tier--; pDrops++;
    resize();
  }
}

/* ═══════════ 메시지 ═══════════ */
function paintMessage(){
  $('mTo').textContent = S.to;
  $('cTo').textContent = S.to;
  $('mFrom').textContent = S.from;
  document.documentElement.style.setProperty('--serif', "'" + S.font + "', serif");

  var body = $('mBody');
  body.textContent = '';
  var lines = String(S.body).split('\n').slice(0, 5);
  lines.forEach(function(t, i){
    var s = document.createElement('span');
    s.className = 'ln';
    s.textContent = t || ' ';
    s.style.animationDelay = (1.15 + i * 0.52) + 's';
    body.appendChild(s);
  });
  $('mTo').style.animationDelay = '0.5s';
  $('mFrom').style.animationDelay = (1.35 + lines.length * 0.52) + 's';
  document.title = S.to.replace(/^To\.\s*/, '') + ' — 크리스마스 카드';
}
function replayMessage(){
  card.classList.remove('play');
  void card.offsetWidth;              /* 애니메이션을 처음부터 다시 */
  card.classList.add('play');
}

/* ═══════════ 음악 ═══════════ */
var F = { C4:261.63, D4:293.66, E4:329.63, F4:349.23, G4:392.00, A4:440.00, B4:493.88,
          C5:523.25, D5:587.33, E5:659.25, F5:698.46,
          F2:87.31, G2:98.00, C3:130.81 };
/* 모두 저작권이 풀린 옛 캐럴입니다 */
var SONGS = [
  { name:'고요한 밤 거룩한 밤', beat:0.34, phrases:[
    { bass:'C3', n:[['G4',3],['A4',1],['G4',2],['E4',6]] },
    { bass:'C3', n:[['G4',3],['A4',1],['G4',2],['E4',6]] },
    { bass:'G2', n:[['D5',6],['D5',2],['B4',4]] },
    { bass:'C3', n:[['C5',6],['C5',2],['G4',4]] },
    { bass:'F2', n:[['A4',6],['A4',2],['C5',2],['B4',1],['A4',1]] },
    { bass:'C3', n:[['G4',3],['A4',1],['G4',2],['E4',6]] },
    { bass:'F2', n:[['A4',6],['A4',2],['C5',2],['B4',1],['A4',1]] },
    { bass:'C3', n:[['G4',3],['A4',1],['G4',2],['E4',6]] },
    { bass:'G2', n:[['D5',6],['D5',2],['F5',2],['D5',1],['B4',1]] },
    { bass:'C3', n:[['C5',6],['E5',6]] },
    { bass:'C3', n:[['C5',2],['G4',2],['E4',2],['G4',3],['F4',1],['D4',2],['C4',8]] }
  ]},
  { name:'징글벨', beat:0.26, phrases:[
    { bass:'C3', n:[['E4',2],['E4',2],['E4',4]] },
    { bass:'C3', n:[['E4',2],['E4',2],['E4',4]] },
    { bass:'C3', n:[['E4',2],['G4',2],['C4',3],['D4',1],['E4',8]] },
    { bass:'F2', n:[['F4',2],['F4',2],['F4',3],['F4',1]] },
    { bass:'C3', n:[['F4',2],['E4',2],['E4',2],['E4',1],['E4',1]] },
    { bass:'G2', n:[['E4',2],['D4',2],['D4',2],['E4',2]] },
    { bass:'G2', n:[['D4',4],['G4',4]] }
  ]}
];

var ac = null, master = null, wet = null, timers = [], playing = false;
function audioInit(){
  if (ac) return true;
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return false;
  ac = new AC();
  master = ac.createGain();
  master.gain.value = 0.0001;
  master.connect(ac.destination);
  /* 되울림 — 공간감. 컨볼루션 없이 지연 한 개로 가볍게 */
  var d = ac.createDelay(1.2); d.delayTime.value = 0.31;
  var fb = ac.createGain(); fb.gain.value = 0.33;
  var lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600;
  wet = ac.createGain(); wet.gain.value = 0.34;
  d.connect(lp); lp.connect(fb); fb.connect(d);
  d.connect(wet); wet.connect(master);
  audioInit.delay = d;
  return true;
}
/* 오르골 — 기본음 위에 배음 몇 개, 빠르게 올라가 길게 사라집니다 */
function pluck(freq, at, dur, vol){
  var parts = [[1, 1], [2, 0.42], [3.01, 0.18], [4.2, 0.08]];
  for (var i = 0; i < parts.length; i++){
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine';
    o.frequency.value = freq * parts[i][0];
    var peak = vol * parts[i][1];
    var dec = dur * (1 - i * 0.14);
    g.gain.setValueAtTime(0.0001, at);
    g.gain.linearRampToValueAtTime(peak, at + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, at + Math.max(0.12, dec));
    o.connect(g);
    g.connect(master);
    if (i < 2 && audioInit.delay) g.connect(audioInit.delay);
    o.start(at);
    o.stop(at + dur + 0.25);
  }
}
function lowBell(freq, at, dur){
  var o = ac.createOscillator(), g = ac.createGain();
  o.type = 'triangle'; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, at);
  g.gain.linearRampToValueAtTime(0.085, at + 0.05);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g); g.connect(master);
  o.start(at); o.stop(at + dur + 0.2);
}
function schedule(){
  var s = SONGS[+S.song] || SONGS[0];
  var t = ac.currentTime + 0.12, total = 0;
  s.phrases.forEach(function(ph){
    var pb = 0;
    ph.n.forEach(function(nt){ pb += nt[1]; });
    if (F[ph.bass]) lowBell(F[ph.bass], t + total, pb * s.beat * 0.95);
    ph.n.forEach(function(nt){
      var d = nt[1] * s.beat;
      pluck(F[nt[0]], t + total, d * 1.9, 0.17);
      total += d;
    });
  });
  timers.push(setTimeout(function(){ if (playing) schedule(); }, (total + 1.6) * 1000));
}
function musicOn(){
  if (!audioInit()){ toast('이 기기에서는 소리를 만들 수 없어요'); return; }
  if (ac.state === 'suspended') ac.resume();
  playing = true;
  master.gain.cancelScheduledValues(ac.currentTime);
  master.gain.setValueAtTime(Math.max(0.0001, master.gain.value), ac.currentTime);
  master.gain.linearRampToValueAtTime(0.5, ac.currentTime + 1.6);   /* 서서히 들어오게 */
  schedule();
  $('bMusic').setAttribute('aria-pressed', 'true');
}
function musicOff(){
  playing = false;
  timers.forEach(clearTimeout); timers = [];
  if (ac){
    master.gain.cancelScheduledValues(ac.currentTime);
    master.gain.setValueAtTime(master.gain.value, ac.currentTime);
    master.gain.linearRampToValueAtTime(0.0001, ac.currentTime + 0.9);
  }
  $('bMusic').setAttribute('aria-pressed', 'false');
}

/* ═══════════ 알림 ═══════════ */
var tTimer = 0;
function toast(m){
  var t = $('toast'); t.textContent = m; t.classList.add('on');
  clearTimeout(tTimer);
  tTimer = setTimeout(function(){ t.classList.remove('on'); }, 2200);
}

/* ═══════════ 카드 열기 ═══════════ */
var opened = false;
function openCard(){
  if (opened) return;
  opened = true;
  card.classList.add('open');
  /* 덮개가 열리는 동안 글이 먼저 떠오르기 시작합니다 */
  setTimeout(replayMessage, 420);
  musicOn();                       /* 누른 뒤라 소리를 낼 수 있습니다 */
  setTimeout(function(){ $('ui').classList.add('show');
    setTimeout(function(){ $('ui').classList.remove('show'); }, 2600); }, 1800);
}
$('hit').addEventListener('click', openCard);
document.addEventListener('keydown', function(e){
  if (!opened && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); openCard(); }
});

/* ═══════════ 조작 ═══════════ */
$('bMusic').addEventListener('click', function(){ playing ? musicOff() : musicOn(); });
$('bReplay').addEventListener('click', replayMessage);
$('bEdit').addEventListener('click', function(){
  ['iTo','iBody','iFrom'].forEach(function(id){ $(id).value = S[id.slice(1).toLowerCase()]; });
  $('iTo').value = S.to; $('iBody').value = S.body; $('iFrom').value = S.from;
  $('iFont').value = S.font; $('iSong').value = S.song; $('iMood').value = S.mood;
  $('panel').classList.add('on');
});
$('pClose').addEventListener('click', function(){ $('panel').classList.remove('on'); });
$('pApply').addEventListener('click', function(){
  var moodChanged = S.mood !== $('iMood').value;
  var songChanged = S.song !== $('iSong').value;
  S.to   = $('iTo').value.trim()   || DEFAULT.to;
  S.body = $('iBody').value.trim() || DEFAULT.body;
  S.from = $('iFrom').value.trim();
  S.font = $('iFont').value;
  S.song = $('iSong').value;
  S.mood = $('iMood').value;
  writeStore();
  paintMessage();
  if (moodChanged) buildSprites();
  buildScene();                      /* 글 길이가 바뀌면 트리 자리도 다시 */
  if (songChanged && playing){ musicOff(); setTimeout(musicOn, 950); }
  $('panel').classList.remove('on');
  replayMessage();
  toast('카드에 담았어요');
});
$('bLink').addEventListener('click', function(){
  var p = new URLSearchParams();
  ['to','body','from','font','song','mood'].forEach(function(k){ p.set(k, S[k]); });
  var url = location.origin + location.pathname + '#' + p.toString();
  function done(){ toast('링크를 복사했어요'); }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(done, function(){ fallback(url, done); });
  } else fallback(url, done);
  function fallback(text, cb){
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); cb(); }catch(e){ toast('복사가 막혀 있어요'); }
    document.body.removeChild(ta);
  }
});

/* ═══════════ 멈춤과 재개 ═══════════ */
function start(){ if (running) return; running = true; last = performance.now(); raf = requestAnimationFrame(frame); }
function stop(){ running = false; cancelAnimationFrame(raf); }
document.addEventListener('visibilitychange', function(){
  if (document.hidden){ stop(); if (playing && ac) ac.suspend(); }
  else { start(); if (playing && ac) ac.resume(); }
});
var rz = 0;
window.addEventListener('resize', function(){
  clearTimeout(rz);
  rz = setTimeout(resize, 160);
});

/* ═══════════ 시작 ═══════════ */
buildSprites();
paintMessage();
resize();
start();

})();
</script>
