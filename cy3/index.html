<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>라이어 게임</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:
    radial-gradient(circle at top,#30245c,#11121b 45%,#08090e);
    color:#fff;
    font-family:
    -apple-system,BlinkMacSystemFont,
    "Noto Sans KR",sans-serif;
}

.app{
    width:100%;
    max-width:520px;
    min-height:100vh;
    margin:auto;
    padding:20px;
}

.screen{
    display:none;
    min-height:calc(100vh - 40px);
    flex-direction:column;
    justify-content:center;
}

.screen.active{display:flex}

.logo{
    text-align:center;
    font-size:65px;
    margin-bottom:10px;
}

h1{
    text-align:center;
    font-size:36px;
    margin:0 0 10px;
}

h2{
    text-align:center;
    font-size:28px;
    margin:0 0 12px;
}

.subtitle{
    text-align:center;
    color:#a7a9b9;
    line-height:1.7;
    margin-bottom:28px;
}

.card{
    background:#191b27;
    border:1px solid #35394d;
    border-radius:22px;
    padding:20px;
    margin-bottom:15px;
}

label{
    display:block;
    color:#aeb1c1;
    font-size:14px;
    margin-bottom:8px;
}

input{
    width:100%;
    padding:16px;
    border-radius:14px;
    border:1px solid #3b4055;
    background:#0e1017;
    color:white;
    font-size:17px;
    outline:none;
}

input:focus{
    border-color:#8268ff;
}

.primary{
    width:100%;
    border:0;
    border-radius:15px;
    padding:17px;
    background:linear-gradient(135deg,#7255ff,#aa4ff2);
    color:white;
    font-size:18px;
    font-weight:800;
}

.secondary{
    width:100%;
    border:1px solid #3b4055;
    border-radius:15px;
    padding:15px;
    background:#1a1d29;
    color:white;
    font-size:16px;
    margin-top:10px;
}

button:disabled{
    opacity:.4;
}

.error{
    text-align:center;
    color:#ff637e;
    min-height:22px;
    margin-top:10px;
}

.notice{
    background:#211e35;
    border:1px solid #403866;
    border-radius:14px;
    padding:13px;
    color:#c4bedb;
    font-size:13px;
    line-height:1.6;
}

.room-code{
    text-align:center;
    font-size:44px;
    font-weight:900;
    letter-spacing:8px;
    color:#c3b4ff;
    margin:18px 0;
}

.copy{
    width:100%;
    border:1px solid #514b76;
    border-radius:12px;
    padding:13px;
    background:#28233e;
    color:#ddd6ff;
}

.players{
    display:grid;
    gap:9px;
    margin-top:15px;
}

.player{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px;
    border-radius:14px;
    background:#131620;
    border:1px solid #2c3041;
}

.avatar{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#30265c;
    display:flex;
    align-items:center;
    justify-content:center;
}

.host{
    margin-left:auto;
    color:#a99aff;
    font-size:12px;
}

.count{
    text-align:center;
    color:#9297a8;
    margin-top:12px;
    font-size:14px;
}

.role-card{
    text-align:center;
    background:#171923;
    border:1px solid #383d52;
    border-radius:25px;
    padding:35px 20px;
}

.role-icon{
    font-size:65px;
}

.role-title{
    font-size:34px;
    font-weight:900;
    margin-top:10px;
}

.citizen{color:#63e5a2}
.liar{color:#ff607c}

.word{
    font-size:42px;
    font-weight:900;
    color:#bdaaff;
    margin:20px 0;
}

.small{
    color:#999eaf;
    line-height:1.7;
    font-size:14px;
}

.timer{
    text-align:center;
    font-size:76px;
    font-weight:900;
    margin:25px 0 30px;
}

.timer.warning{
    color:#ff607b;
    animation:pulse .5s infinite alternate;
}

@keyframes pulse{
    from{transform:scale(1)}
    to{transform:scale(1.07)}
}

.vote{
    width:100%;
    text-align:left;
    padding:17px;
    border-radius:14px;
    border:1px solid #353a4d;
    background:#181b27;
    color:white;
    font-size:17px;
    margin-bottom:9px;
}

.vote.selected{
    background:#6248ba;
    border-color:#a18cff;
}

.result{
    text-align:center;
    background:#181b27;
    border:1px solid #393e52;
    border-radius:25px;
    padding:35px 20px;
}

.result-icon{
    font-size:72px;
}

.result-title{
    font-size:31px;
    font-weight:900;
    margin:14px 0 20px;
}

.success{color:#63e5a2}
.failure{color:#ff637d}

.result-line{
    margin:10px 0;
    color:#c6c9d5;
}

.result-word{
    color:#bdaaff;
    font-size:25px;
    font-weight:900;
    margin:20px 0;
}

#fireworksCanvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:99999;
}
</style>
</head>

<body>

<canvas id="fireworksCanvas"></canvas>

<div class="app">

<!-- HOME -->
<section id="home" class="screen active">

    <div class="logo">🕵️</div>

    <h1>라이어 게임</h1>

    <p class="subtitle">
        로그인 없이 바로 시작하세요!<br>
        친구들과 최대 9명까지 플레이할 수 있어요.
    </p>

    <div class="card">

        <label>내 이름</label>

        <input
            id="name"
            maxlength="10"
            placeholder="예: 철수"
            autocomplete="off"
        >

        <button
            class="primary"
            style="margin-top:15px"
            onclick="createRoom()"
        >
            방 만들기
        </button>

        <button
            class="secondary"
            onclick="show('join')"
        >
            방 참가하기
        </button>

    </div>

    <div class="notice">
        🔒 회원가입이나 로그인은 필요 없습니다.
    </div>

    <div id="homeError" class="error"></div>

</section>


<!-- JOIN -->
<section id="join" class="screen">

    <div class="logo">🚪</div>

    <h2>방 참가하기</h2>

    <p class="subtitle">
        친구에게 받은 방 코드를 입력하세요.
    </p>

    <div class="card">

        <label>내 이름</label>

        <input
            id="joinName"
            maxlength="10"
            placeholder="예: 영희"
        >

        <label style="margin-top:15px">
            방 코드
        </label>

        <input
            id="joinCode"
            maxlength="6"
            inputmode="numeric"
            placeholder="123456"
        >

        <button
            class="primary"
            style="margin-top:15px"
            onclick="joinRoom()"
        >
            참가하기
        </button>

        <button
            class="secondary"
            onclick="show('home')"
        >
            돌아가기
        </button>

    </div>

    <div id="joinError" class="error"></div>

</section>


<!-- LOBBY -->
<section id="lobby" class="screen">

    <div class="logo">🎮</div>

    <h2>게임 대기실</h2>

    <div class="card">

        <div class="small" style="text-align:center">
            친구에게 아래 코드를 알려주세요.
        </div>

        <div id="roomCode" class="room-code">
            ------
        </div>

        <button class="copy" onclick="copyCode()">
            📋 방 코드 복사
        </button>

    </div>

    <div class="card">

        <b>참가자</b>

        <div id="players" class="players"></div>

        <div id="count" class="count">
            0 / 9명
        </div>

    </div>

    <button
        id="start"
        class="primary"
        onclick="startGame()"
    >
        게임 시작
    </button>

    <button
        class="secondary"
        onclick="leaveRoom()"
    >
        방 나가기
    </button>

</section>


<!-- ROLE -->
<section id="role" class="screen">

    <h2>내 역할</h2>

    <p class="subtitle">
        다른 사람에게 보여주지 마세요.
    </p>

    <div class="role-card">

        <div id="roleIcon" class="role-icon">
            🎯
        </div>

        <div id="roleTitle" class="role-title citizen">
            시민
        </div>

        <div id="word" class="word"></div>

        <div id="description" class="small"></div>

    </div>

    <button
        id="ready"
        class="primary"
        style="margin-top:20px"
        onclick="ready()"
    >
        확인 완료
    </button>

</section>


<!-- DISCUSSION -->
<section id="discussion" class="screen">

    <div class="logo">💬</div>

    <h2>토론 시간</h2>

    <p class="subtitle">
        서로 질문하면서 라이어를 찾아보세요!
    </p>

    <div id="timer" class="timer">
        120
    </div>

    <button
        id="voteMove"
        class="primary"
        onclick="goVote()"
    >
        투표하기
    </button>

    <div class="small" style="text-align:center;margin-top:15px">
        시간이 끝나면 자동으로 투표합니다.
    </div>

</section>


<!-- VOTE -->
<section id="vote" class="screen">

    <div class="logo">🗳️</div>

    <h2>라이어 투표</h2>

    <p class="subtitle">
        라이어라고 생각하는 사람을 선택하세요.
    </p>

    <div id="voteList"></div>

    <button
        id="submitVote"
        class="primary"
        disabled
        onclick="submitVote()"
    >
        투표하기
    </button>

    <div
        id="voteStatus"
        class="small"
        style="text-align:center;margin-top:15px"
    ></div>

</section>


<!-- RESULT -->
<section id="result" class="screen">

    <div class="result">

        <div id="resultIcon" class="result-icon">
            🎉
        </div>

        <div id="resultTitle" class="result-title">
            결과
        </div>

        <div id="resultText"></div>

    </div>

    <button
        id="again"
        class="primary"
        style="margin-top:20px"
        onclick="again()"
    >
        한 판 더 하기
    </button>

    <button
        class="secondary"
        onclick="leaveRoom()"
    >
        방 나가기
    </button>

</section>

</div>


<script type="module">

import {
    initializeApp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    set,
    get,
    update,
    remove,
    onValue
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


/* =================================================
   Firebase 설정
   ================================================= */

const firebaseConfig = {

    apiKey:
        "여기에_API_KEY",

    authDomain:
        "여기에.firebaseapp.com",

    databaseURL:
        "https://여기에-default-rtdb.firebaseio.com",

    projectId:
        "여기에_PROJECT_ID",

    storageBucket:
        "여기에.firebasestorage.app",

    messagingSenderId:
        "여기에_MESSAGING_SENDER_ID",

    appId:
        "여기에_APP_ID"
};


const app =
    initializeApp(firebaseConfig);

const db =
    getDatabase(app);


/* =================================================
   로그인 대신 브라우저별 랜덤 ID
   ================================================= */

let myId =
    localStorage.getItem("liarPlayerId");


if (!myId){

    myId =
        crypto.randomUUID();

    localStorage.setItem(
        "liarPlayerId",
        myId
    );

}


/* =================================================
   게임 상태
   ================================================= */

let roomId = null;

let myName = "";

let roomData = null;

let unsubscribe = null;

let timer = null;

let selectedVote = null;

let fireworksPlayed = false;


/* =================================================
   제시어
   ================================================= */

const words = [

    "사과",
    "피자",
    "치킨",
    "라면",
    "김치",
    "떡볶이",
    "삼겹살",
    "햄버거",

    "강아지",
    "고양이",
    "사자",
    "호랑이",
    "펭귄",
    "판다",
    "기린",
    "코끼리",

    "학교",
    "공원",
    "병원",
    "공항",
    "영화관",
    "카페",
    "바다",
    "놀이공원",

    "휴대폰",
    "컴퓨터",
    "카메라",
    "시계",
    "가방",
    "우산",
    "안경",
    "책",

    "축구",
    "농구",
    "야구",
    "수영",
    "여행",
    "생일",
    "시험",
    "크리스마스"

];


/* =================================================
   화면
   ================================================= */

window.show = function(id){

    document
        .querySelectorAll(".screen")
        .forEach(x =>
            x.classList.remove("active")
        );

    document
        .getElementById(id)
        .classList.add("active");

};


/* =================================================
   방 코드
   ================================================= */

function makeCode(){

    return String(
        Math.floor(
            100000 +
            Math.random()*900000
        )
    );

}


/* =================================================
   방 만들기
   ================================================= */

window.createRoom = async function(){

    const name =
        document
        .getElementById("name")
        .value
        .trim();

    const error =
        document.getElementById(
            "homeError"
        );

    error.textContent = "";


    if(!name){

        error.textContent =
            "이름을 입력해주세요.";

        return;

    }


    let code;

    let exists = true;


    while(exists){

        code = makeCode();

        const snap =
            await get(
                ref(db,`rooms/${code}`)
            );

        exists =
            snap.exists();

    }


    roomId = code;

    myName = name;


    await set(
        ref(db,`rooms/${roomId}`),
        {

            host:myId,

            status:"lobby",

            word:"",

            liar:"",

            endTime:0,

            result:null,

            players:{

                [myId]:{

                    name:myName,

                    ready:false,

                    vote:null

                }

            }

        }
    );


    enterLobby();

};


/* =================================================
   방 참가
   ================================================= */

window.joinRoom = async function(){

    const name =
        document
        .getElementById("joinName")
        .value
        .trim();

    const code =
        document
        .getElementById("joinCode")
        .value
        .trim();

    const error =
        document.getElementById(
            "joinError"
        );

    error.textContent = "";


    if(!name){

        error.textContent =
            "이름을 입력해주세요.";

        return;

    }


    if(!/^\d{6}$/.test(code)){

        error.textContent =
            "6자리 방 코드를 입력해주세요.";

        return;

    }


    const snap =
        await get(
            ref(db,`rooms/${code}`)
        );


    if(!snap.exists()){

        error.textContent =
            "존재하지 않는 방입니다.";

        return;

    }


    const room =
        snap.val();


    if(room.status !== "lobby"){

        error.textContent =
            "이미 게임이 시작되었습니다.";

        return;

    }


    const players =
        room.players || {};


    if(
        Object.keys(players).length >= 9
    ){

        error.textContent =
            "방이 가득 찼습니다.";

        return;

    }


    const duplicate =
        Object.values(players)
        .some(p => p.name === name);


    if(duplicate){

        error.textContent =
            "이미 사용 중인 이름입니다.";

        return;

    }


    roomId = code;

    myName = name;


    await set(
        ref(
            db,
            `rooms/${roomId}/players/${myId}`
        ),
        {

            name:name,

            ready:false,

            vote:null

        }
    );


    enterLobby();

};


/* =================================================
   로비
   ================================================= */

function enterLobby(){

    show("lobby");


    document
        .getElementById("roomCode")
        .textContent = roomId;


    if(unsubscribe)
        unsubscribe();


    unsubscribe =
        onValue(
            ref(db,`rooms/${roomId}`),
            snapshot => {

                if(!snapshot.exists()){

                    alert("방이 종료되었습니다.");

                    cleanup();

                    show("home");

                    return;

                }


                roomData =
                    snapshot.val();

                updateGame();

            }
        );

}


/* =================================================
   게임 상태 업데이트
   ================================================= */

function updateGame(){

    const room = roomData;


    if(room.status === "lobby"){

        renderLobby();

    }

    else if(room.status === "role"){

        renderRole();

    }

    else if(room.status === "discussion"){

        renderDiscussion();

    }

    else if(room.status === "vote"){

        renderVote();

    }

    else if(room.status === "result"){

        renderResult();

    }

}


/* =================================================
   로비 렌더
   ================================================= */

function renderLobby(){

    show("lobby");


    const players =
        roomData.players || {};


    const list =
        document.getElementById(
            "players"
        );


    list.innerHTML = "";


    const avatars = [
        "😎","😈","🤓",
        "🥳","😺","🐶",
        "👽","🤠","🦊"
    ];


    Object.entries(players)
    .forEach(([id,p],index)=>{

        const div =
            document.createElement("div");

        div.className =
            "player";


        div.innerHTML = `

            <div class="avatar">
                ${avatars[index]}
            </div>

            <div>
                ${safe(p.name)}
            </div>

            ${
                id === roomData.host
                ? `<div class="host">방장</div>`
                : ""
            }

        `;


        list.appendChild(div);

    });


    const number =
        Object.keys(players).length;


    document
        .getElementById("count")
        .textContent =
        `${number} / 9명`;


    const start =
        document.getElementById("start");


    if(myId === roomData.host){

        start.style.display =
            "block";

        start.disabled =
            number < 3;

        start.textContent =
            number < 3
            ? "게임 시작 (최소 3명)"
            : "게임 시작";

    }

    else{

        start.style.display =
            "none";

    }

}


/* =================================================
   방 코드 복사
   ================================================= */

window.copyCode = function(){

    navigator.clipboard
    ?.writeText(roomId);

    alert(
        "방 코드가 복사되었습니다!\n\n"
        + roomId
    );

};


/* =================================================
   게임 시작
   ================================================= */

window.startGame = async function(){

    if(myId !== roomData.host)
        return;


    const players =
        roomData.players || {};


    const ids =
        Object.keys(players);


    if(ids.length < 3){

        alert("최소 3명이 필요합니다.");

        return;

    }


    const word =
        words[
            Math.floor(
                Math.random()*words.length
            )
        ];


    const liar =
        ids[
            Math.floor(
                Math.random()*ids.length
            )
        ];


    const changes = {

        status:"role",

        word:word,

        liar:liar,

        endTime:0,

        result:null

    };


    ids.forEach(id=>{

        changes[
            `players/${id}/ready`
        ] = false;

        changes[
            `players/${id}/vote`
        ] = null;

    });


    await update(
        ref(db,`rooms/${roomId}`),
        changes
    );

};


/* =================================================
   역할
   ================================================= */

function renderRole(){

    show("role");


    const liar =
        myId === roomData.liar;


    const icon =
        document.getElementById(
            "roleIcon"
        );

    const title =
        document.getElementById(
            "roleTitle"
        );

    const word =
        document.getElementById(
            "word"
        );

    const desc =
        document.getElementById(
            "description"
        );


    if(liar){

        icon.textContent = "🤫";

        title.textContent = "라이어";

        title.className =
            "role-title liar";

        word.textContent =
            "제시어를 모릅니다";

        desc.innerHTML =
            `
            다른 사람들의 말을 듣고<br>
            제시어를 추리하세요.
            <br><br>
            <b style="color:#ff637d">
            라이어라는 사실을 들키지 마세요!
            </b>
            `;

    }

    else{

        icon.textContent = "🎯";

        title.textContent = "시민";

        title.className =
            "role-title citizen";

        word.textContent =
            roomData.word;

        desc.innerHTML =
            `
            이 단어가 제시어입니다.<br>
            제시어 자체를 직접 말하면 안 됩니다.
            `;

    }


    const readyButton =
        document.getElementById("ready");


    const me =
        roomData.players[myId];


    if(me && me.ready){

        readyButton.disabled = true;

        readyButton.textContent =
            "다른 플레이어를 기다리는 중...";

    }

    else{

        readyButton.disabled = false;

        readyButton.textContent =
            "확인 완료";

    }

}


/* =================================================
   역할 확인
   ================================================= */

window.ready = async function(){

    await set(
        ref(
            db,
            `rooms/${roomId}/players/${myId}/ready`
        ),
        true
    );


    if(myId !== roomData.host)
        return;


    checkReady();

};


async function checkReady(){

    const snap =
        await get(
            ref(db,`rooms/${roomId}`)
        );


    if(!snap.exists())
        return;


    const room =
        snap.val();


    const players =
        room.players || {};


    const allReady =
        Object.values(players)
        .every(p => p.ready === true);


    if(!allReady)
        return;


    await update(
        ref(db,`rooms/${roomId}`),
        {

            status:"discussion",

            endTime:
                Date.now() + 120000

        }
    );

}


/* =================================================
   토론
   ================================================= */

function renderDiscussion(){

    show("discussion");


    if(timer)
        clearInterval(timer);


    timer =
        setInterval(()=>{

            const remain =
                Math.max(
                    0,
                    Math.ceil(
                        (
                            roomData.endTime -
                            Date.now()
                        ) / 1000
                    )
                );


            const timerElement =
                document.getElementById(
                    "timer"
                );


            timerElement.textContent =
                remain;


            if(remain <= 10){

                timerElement
                .classList
                .add("warning");

            }


            if(remain <= 0){

                clearInterval(timer);

                if(
                    myId === roomData.host
                ){

                    update(
                        ref(
                            db,
                            `rooms/${roomId}`
                        ),
                        {status:"vote"}
                    );

                }

            }

        },250);

}


/* =================================================
   투표로 이동
   ================================================= */

window.goVote = function(){

    if(myId !== roomData.host)
        return;


    if(timer)
        clearInterval(timer);


    update(
        ref(db,`rooms/${roomId}`),
        {status:"vote"}
    );

};


/* =================================================
   투표
   ================================================= */

function renderVote(){

    show("vote");


    selectedVote = null;


    document
        .getElementById("submitVote")
        .disabled = true;


    document
        .getElementById("voteStatus")
        .textContent =
        "투표할 사람을 선택하세요.";


    const list =
        document.getElementById(
            "voteList"
        );


    list.innerHTML = "";


    Object.entries(
        roomData.players || {}
    )
    .forEach(([id,p])=>{

        if(id === myId)
            return;


        const button =
            document.createElement("button");


        button.className = "vote";

        button.textContent = p.name;


        button.onclick = ()=>{

            document
                .querySelectorAll(".vote")
                .forEach(b =>
                    b.classList.remove(
                        "selected"
                    )
                );


            button.classList.add(
                "selected"
            );


            selectedVote = id;


            document
                .getElementById("submitVote")
                .disabled = false;

        };


        list.appendChild(button);

    });


    checkVotesLater();

}


/* =================================================
   투표 제출
   ================================================= */

window.submitVote = async function(){

    if(!selectedVote)
        return;


    await set(
        ref(
            db,
            `rooms/${roomId}/players/${myId}/vote`
        ),
        selectedVote
    );


    document
        .getElementById("submitVote")
        .disabled = true;


    document
        .getElementById("voteStatus")
        .textContent =
        "투표 완료! 다른 사람을 기다리는 중...";


    checkVotesLater();

};


/* =================================================
   모든 투표 확인
   ================================================= */

async function checkVotesLater(){

    if(myId !== roomData.host)
        return;


    const players =
        roomData.players || {};


    const allVoted =
        Object.values(players)
        .every(
            p =>
                p.vote !== null &&
                p.vote !== undefined
        );


    if(allVoted){

        calculateResult();

    }

}


/* =================================================
   결과 계산
   ================================================= */

async function calculateResult(){

    const players =
        roomData.players || {};


    const votes = {};


    Object.values(players)
    .forEach(p=>{

        if(!p.vote)
            return;


        votes[p.vote] =
            (votes[p.vote] || 0) + 1;

    });


    let selected = null;

    let max = 0;

    let tie = false;


    Object.entries(votes)
    .forEach(([id,count])=>{

        if(count > max){

            selected = id;

            max = count;

            tie = false;

        }

        else if(count === max){

            tie = true;

        }

    });


    /*
    동률이면 실패
    */

    const success =
        !tie &&
        selected === roomData.liar;


    await update(
        ref(db,`rooms/${roomId}`),
        {

            status:"result",

            result:{

                voted:selected,

                success:success

            }

        }
    );

}


/* =================================================
   결과
   ================================================= */

function renderResult(){

    show("result");


    const result =
        roomData.result;


    const liar =
        roomData.players[
            roomData.liar
        ];


    const voted =
        result.voted
        ? roomData.players[
            result.voted
        ]
        : null;


    const icon =
        document.getElementById(
            "resultIcon"
        );


    const title =
        document.getElementById(
            "resultTitle"
        );


    const text =
        document.getElementById(
            "resultText"
        );


    if(result.success){

        icon.textContent = "🎉";

        title.textContent =
            "라이어를 잡았습니다!";

        title.className =
            "result-title success";


        text.innerHTML = `

            <div class="result-line">
                투표 결과:
                <b>${safe(
                    voted?.name || "없음"
                )}</b>
            </div>

            <div class="result-line">
                진짜 라이어:
                <b>${safe(
                    liar?.name || "알 수 없음"
                )}</b>
            </div>

            <div class="result-word">
                제시어: ${safe(roomData.word)}
            </div>

            <div class="small">
                🎊 시민팀 승리!
            </div>

        `;


        if(!fireworksPlayed){

            fireworksPlayed = true;

            setTimeout(
                rainbowFireworks,
                50
            );

        }

    }

    else{

        icon.textContent = "😈";

        title.textContent =
            "라이어 승리!";

        title.className =
            "result-title failure";


        text.innerHTML = `

            <div class="result-line">
                투표 결과:
                <b>${safe(
                    voted?.name || "동률/없음"
                )}</b>
            </div>

            <div class="result-line">
                진짜 라이어:
                <b>${safe(
                    liar?.name || "알 수 없음"
                )}</b>
            </div>

            <div class="result-word">
                제시어: ${safe(roomData.word)}
            </div>

            <div class="small">
                😈 라이어가 살아남았습니다!
            </div>

        `;

    }

}


/* =================================================
   다시하기
   ================================================= */

window.again = async function(){

    if(myId !== roomData.host){

        alert(
            "방장만 다시 시작할 수 있습니다."
        );

        return;

    }


    fireworksPlayed = false;


    const players =
        roomData.players || {};


    const changes = {

        status:"lobby",

        word:"",

        liar:"",

        endTime:0,

        result:null

    };


    Object.keys(players)
    .forEach(id=>{

        changes[
            `players/${id}/ready`
        ] = false;

        changes[
            `players/${id}/vote`
        ] = null;

    });


    await update(
        ref(db,`rooms/${roomId}`),
        changes
    );

};


/* =================================================
   나가기
   ================================================= */

window.leaveRoom = async function(){

    if(!roomId)
        return;


    const snap =
        await get(
            ref(db,`rooms/${roomId}`)
        );


    if(snap.exists()){

        const room =
            snap.val();


        if(room.host === myId){

            await remove(
                ref(db,`rooms/${roomId}`)
            );

        }

        else{

            await remove(
                ref(
                    db,
                    `rooms/${roomId}/players/${myId}`
                )
            );

        }

    }


    cleanup();

    show("home");

};


/* =================================================
   정리
   ================================================= */

function cleanup(){

    if(unsubscribe){

        unsubscribe();

        unsubscribe = null;

    }


    if(timer){

        clearInterval(timer);

        timer = null;

    }


    roomId = null;

    roomData = null;

    selectedVote = null;

    fireworksPlayed = false;

}


/* =================================================
   HTML 안전 처리
   ================================================= */

function safe(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =================================================
   🌈 0.4초 무지개 폭죽
   ================================================= */

function rainbowFireworks(){

    const canvas =
        document.getElementById(
            "fireworksCanvas"
        );


    const ctx =
        canvas.getContext("2d");


    const width =
        window.innerWidth;

    const height =
        window.innerHeight;


    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    canvas.width =
        width*dpr;

    canvas.height =
        height*dpr;


    canvas.style.width =
        width+"px";

    canvas.style.height =
        height+"px";


    ctx.setTransform(
        dpr,0,0,dpr,0,0
    );


    const colors = [

        "#ff1744",
        "#ff6d00",
        "#ffd600",
        "#00e676",
        "#00b0ff",
        "#2979ff",
        "#7c4dff",
        "#f50057"

    ];


    const particles = [];


    for(let b=0;b<7;b++){

        const x =
            width *
            (.08 +
            Math.random()*.84);


        const y =
            height *
            (.12 +
            Math.random()*.48);


        for(let i=0;i<32;i++){

            const angle =
                Math.PI*2*
                i/32;


            const speed =
                3+
                Math.random()*5;


            particles.push({

                x:x,

                y:y,

                vx:
                    Math.cos(angle)*
                    speed,

                vy:
                    Math.sin(angle)*
                    speed,

                color:
                    colors[
                        Math.floor(
                            Math.random()*
                            colors.length
                        )
                    ],

                size:
                    2+
                    Math.random()*2.5

            });

        }

    }


    const start =
        performance.now();


    function animate(now){

        const progress =
            Math.min(
                (now-start)/400,
                1
            );


        ctx.clearRect(
            0,0,width,height
        );


        particles.forEach(p=>{

            p.x += p.vx;

            p.y += p.vy;

            p.vx *= .955;

            p.vy *= .955;

            p.vy += .09;


            ctx.globalAlpha =
                1-progress;


            ctx.fillStyle =
                p.color;


            ctx.shadowBlur = 12;

            ctx.shadowColor =
                p.color;


            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                p.size,
                0,
                Math.PI*2
            );

            ctx.fill();

        });


        ctx.globalAlpha = 1;


        if(progress < 1){

            requestAnimationFrame(
                animate
            );

        }

        else{

            ctx.clearRect(
                0,0,width,height
            );

        }

    }


    requestAnimationFrame(
        animate
    );

}

</script>
