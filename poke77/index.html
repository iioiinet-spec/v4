<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포켓몬 점프맵 + 쉼터</title>
<style>
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background:#222;
    font-family:'Apple SD Gothic Neo','Malgun Gothic',-apple-system,BlinkMacSystemFont,sans-serif;
  }
  .split{
    display:flex; width:100%; height:100%;
  }
  .pane{
    flex:1 1 50%;
    min-width:0;
    height:100%;
    position:relative;
    border:0;
  }
  .pane iframe{
    width:100%; height:100%; border:0; display:block;
  }
  .divider{
    width:4px; flex:0 0 4px; background:linear-gradient(180deg,#FFD8B8,#FF9EC4);
  }
  .label{
    position:absolute; top:6px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,.45); color:#fff; font-size:11px; font-weight:700;
    padding:3px 10px; border-radius:10px; z-index:50; pointer-events:none;
    font-family:'Apple SD Gothic Neo','Malgun Gothic',-apple-system,BlinkMacSystemFont,sans-serif;
  }
</style>
</head>
<body>

<div class="split">
  <div class="pane">
    <div class="label">🏝️ 포켓몬 바닷가 점프맵</div>
    <iframe src="pokemon_jumpmap.html" title="점프맵"></iframe>
  </div>
  <div class="divider"></div>
  <div class="pane">
    <div class="label">🏠 포켓몬 쉼터</div>
    <iframe src="pokemon_shelter.html" title="쉼터"></iframe>
  </div>
</div>

</body>
</html>
