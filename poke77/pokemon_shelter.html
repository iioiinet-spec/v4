<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포켓몬 쉼터</title>
<style>
  :root{
    --wall:#FFE1EC;
    --wall2:#FFD0E0;
    --floor:#8FD8A0;
    --floor2:#6FC080;
    --panel:#FFFDF8;
    --ink:#4A3B4A;
    --ink-soft:#8A7488;
    --pink:#FF9EC4;
    --pink-dark:#FF7AAE;
    --sky:#BFE3F0;
    --sky-dark:#8FCBE0;
    --mint:#BDEDD3;
    --mint-dark:#8FDBB0;
    --sun:#FFE49C;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--wall);
    font-family:'Apple SD Gothic Neo','Malgun Gothic',-apple-system,BlinkMacSystemFont,sans-serif;
    font-weight:700; color:var(--ink);
    overflow:hidden;
  }
  .page{ display:flex; flex-direction:column; height:100%; padding:10px; gap:8px; }
  .header{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--panel); border-radius:16px; padding:8px 14px;
    box-shadow:0 4px 0 rgba(180,120,150,.15);
    flex:0 0 auto;
  }
  .title{ font-size:16px; color:#C2447A; white-space:nowrap; }
  .coins{
    display:flex; align-items:center; gap:4px; background:var(--sun);
    padding:4px 10px; border-radius:14px; font-size:12px; box-shadow:0 2px 0 #E8C66E;
  }

  .layout{ display:flex; gap:8px; flex:1; min-height:0; }

  .scene{
    position:relative; flex:1; border-radius:18px; overflow:hidden; cursor:pointer;
    background:linear-gradient(180deg, var(--wall) 0%, var(--wall2) 55%, var(--floor) 55%, var(--floor2) 100%);
    box-shadow:0 4px 0 rgba(180,120,150,.15);
    user-select:none;
  }
  .rug{
    position:absolute; left:8%; right:8%; bottom:6%; height:30%;
    background:radial-gradient(ellipse at center, #FFF3D6, #FFE2A8);
    border-radius:50%; opacity:.7;
  }
  .bowl{
    position:absolute; left:6%; bottom:8%; width:36px; height:18px;
    background:linear-gradient(180deg,#E97AA0,#C24E78);
    border-radius:0 0 18px 18px; box-shadow:inset 0 3px 4px rgba(0,0,0,.25);
  }
  .bowl::before{ content:""; position:absolute; top:-4px; left:-2px; right:-2px; height:6px; background:#F5A8C0; border-radius:50%; }
  .bed{
    position:absolute; right:6%; bottom:8%; width:56px; height:24px;
    background:radial-gradient(ellipse at center, #C9A8E0, #A87ACB);
    border-radius:50%; box-shadow:inset 0 4px 6px rgba(0,0,0,.3);
  }
  .cloud{ position:absolute; background:#fff; border-radius:50px; opacity:.85; }
  .cloud::before,.cloud::after{ content:""; position:absolute; background:#fff; border-radius:50%; }
  .cloud.c1{ width:44px;height:14px; top:16px; left:14%; }
  .cloud.c1::before{ width:22px;height:22px; top:-11px; left:5px; }
  .cloud.c1::after{ width:17px;height:17px; top:-8px; left:22px; }

  .mon-wrap{
    position:absolute; bottom:14%; left:50%; transform:translateX(-50%);
    transition:left 1.6s ease-in-out, bottom 1s ease;
    display:flex; flex-direction:column; align-items:center; z-index:5;
  }
  .mon-wrap.selected .ring{ opacity:1; }
  .ring{
    position:absolute; bottom:-6px; width:46px; height:12px; border-radius:50%;
    background:radial-gradient(ellipse at center, rgba(255,158,196,.7), transparent 70%);
    opacity:0; transition:opacity .3s ease;
  }
  .mon-img{
    width:64px; height:64px; image-rendering:pixelated; image-rendering:-moz-crisp-edges;
    filter:drop-shadow(0 4px 3px rgba(0,0,0,.25));
    animation:idleBob 1.8s ease-in-out infinite;
  }
  .mon-img.play{ animation:playBob .35s ease-in-out infinite; }
  .mon-img.run{ animation:runBob .22s ease-in-out infinite; }
  .mon-img.sleep{ animation:none; opacity:.85; transform:rotate(90deg) scale(.9); }
  .mon-img.eat{ animation:eatBob .3s ease-in-out infinite; }
  @keyframes idleBob{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);} }
  @keyframes playBob{ 0%,100%{transform:translateY(0) rotate(0deg);} 50%{transform:translateY(-14px) rotate(-8deg);} }
  @keyframes runBob{ 0%,100%{transform:translateY(0) scaleX(1.05);} 50%{transform:translateY(-8px) scaleX(.95);} }
  @keyframes eatBob{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(3px);} }

  .zzz{ position:absolute; top:-4px; right:-10px; font-size:14px; opacity:0; pointer-events:none; }
  .zzz.show{ animation:floatZ 1.8s ease-in infinite; }
  @keyframes floatZ{ 0%{opacity:0; transform:translateY(0) scale(.7);} 20%{opacity:1;} 100%{opacity:0; transform:translateY(-22px) scale(1.2);} }

  .name-tag{
    font-size:9px; color:var(--ink-soft); margin-top:2px; background:rgba(255,255,255,.8);
    padding:1px 6px; border-radius:8px;
  }
  .bubble{
    position:absolute; bottom:100%; left:50%; margin-bottom:6px; transform:translateX(-50%) scale(.85);
    background:#fff; padding:4px 10px; border-radius:12px; font-size:10px; color:var(--ink);
    box-shadow:0 3px 6px rgba(0,0,0,.15); opacity:0; transition:opacity .2s ease, transform .2s ease;
    white-space:nowrap; pointer-events:none;
  }
  .bubble.show{ opacity:1; transform:translateX(-50%) scale(1); }

  .hint{
    position:absolute; left:8px; bottom:8px; font-size:9px; color:rgba(0,0,0,.4);
    background:rgba(255,255,255,.6); padding:3px 8px; border-radius:10px; pointer-events:none;
  }

  .sidebar{ width:112px; flex:0 0 auto; display:flex; flex-direction:column; gap:8px; overflow-y:auto; }
  .panel{ background:var(--panel); border-radius:14px; padding:8px; box-shadow:0 4px 0 rgba(180,120,150,.15); }
  .panel-title{ font-size:10px; color:var(--ink-soft); margin-bottom:6px; text-align:center; }

  .mon-list{ display:flex; flex-direction:column; gap:4px; }
  .mon-pick{
    display:flex; align-items:center; gap:4px; padding:3px 5px; border-radius:10px;
    background:rgba(255,158,196,.08); border:1.5px solid transparent; font-size:9px; color:var(--ink-soft);
    cursor:pointer;
  }
  .mon-pick img{ width:20px; height:20px; image-rendering:pixelated; }
  .mon-pick.active{ border-color:var(--pink); color:#C2447A; background:rgba(255,158,196,.2); }

  .actions{ display:grid; grid-template-columns:1fr 1fr; gap:5px; }
  .actions button{
    font-family:inherit; font-size:10px; color:var(--ink); border:none; border-radius:10px;
    padding:6px 2px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px;
    box-shadow:0 3px 0 rgba(0,0,0,.12);
  }
  .actions button .ico{ font-size:15px; }
  .actions button:active{ transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.12); }
  .btn-feed{ background:#FFD8B8; box-shadow:0 3px 0 #FFB88C; }
  .btn-play{ background:var(--sky); box-shadow:0 3px 0 var(--sky-dark); }
  .btn-run{ background:var(--mint); box-shadow:0 3px 0 var(--mint-dark); }
  .btn-rest{ background:#D9C8F0; box-shadow:0 3px 0 #B79EDD; grid-column:1/-1; }

  .happy-track{ height:8px; border-radius:6px; background:#F0E0E8; overflow:hidden; box-shadow:inset 0 1px 2px rgba(0,0,0,.1); margin-top:5px; }
  .happy-fill{ height:100%; border-radius:6px; background:linear-gradient(90deg,#FF9EC4,#FF7AAE); transition:width .5s ease; }
</style>
</head>
<body>

<div class="page">
  <div class="header">
    <div class="title">🏠 포켓몬 쉼터</div>
    <div class="coins">💗 <span id="avgHappy">70</span>%</div>
  </div>

  <div class="layout">
    <div class="scene" id="scene">
      <div class="cloud c1"></div>
      <div class="rug"></div>
      <div class="bowl"></div>
      <div class="bed"></div>
      <div id="monLayer"></div>
      <div class="hint">화면을 클릭하면 선택한 포켓몬이 그 자리로 가요</div>
    </div>

    <div class="sidebar">
      <div class="panel">
        <div class="panel-title">누구를 돌볼까요?</div>
        <div class="mon-list" id="monPicker"></div>
      </div>
      <div class="panel">
        <div class="panel-title" id="selName">피카츄</div>
        <div class="happy-track"><div class="happy-fill" id="happyFill" style="width:70%"></div></div>
        <div class="actions" style="margin-top:8px;">
          <button class="btn-feed" onclick="feed()"><span class="ico">🍓</span>먹기</button>
          <button class="btn-play" onclick="play()"><span class="ico">🧸</span>놀기</button>
          <button class="btn-run" onclick="run_()"><span class="ico">🏃</span>뛰기</button>
          <button class="btn-rest" onclick="rest()"><span class="ico">💤</span>쉬기/자기</button>
        </div>
      </div>
    </div>
  </div>
</div>

  const el = (id)=> document.getElementById(id);
  const scene = el('scene');
  const monLayer = el('monLayer');

  function clamp(v){ return Math.max(0, Math.min(100, v)); }

  function floorRange(){
    const half = scene.clientWidth/2;
    return { minX: -half + 40, maxX: half - 40 };
  }

  function buildMon(def, index){
    const wrap = document.createElement('div');
    wrap.className = 'mon-wrap';
    wrap.id = 'wrap-' + def.id;
    const r = floorRange();
    const startX = r.minX + (index+1) * (r.maxX-r.minX)/(MONS.length+1);
    wrap.style.left = `calc(50% + ${startX}px)`;
    wrap.innerHTML = `
      <div class="bubble" id="bubble-${def.id}"></div>
      <img class="mon-img idle" id="img-${def.id}" src="${def.img}" alt="${def.name}">
      <div class="zzz" id="zzz-${def.id}">💤</div>
      <div class="name-tag">${def.name}</div>
      <div class="ring"></div>
    `;
    monLayer.appendChild(wrap);
    wrap.addEventListener('click', (e)=>{ e.stopPropagation(); select(def.id); });
    state[def.id] = { def, wrap, imgEl: wrap.querySelector('.mon-img'), x:startX, happiness:70, busy:false, sleeping:false };
  }

  function buildPicker(){
    MONS.forEach(def=>{
      const item = document.createElement('div');
      item.className = 'mon-pick';
      item.id = 'pick-' + def.id;
      item.innerHTML = `<img src="${def.img}">${def.name}`;
      item.addEventListener('click', ()=> select(def.id));
      monPicker.appendChild(item);
    });
  }

  function select(id){
    selectedId = id;
    Object.keys(state).forEach(k=>{
      state[k].wrap.classList.toggle('selected', k===id);
      const p = el('pick-'+k);
      if(p) p.classList.toggle('active', k===id);
    });
    el('selName').textContent = state[id].def.name;
    renderHappy();
  }

  function renderHappy(){
    const s = state[selectedId];
    el('happyFill').style.width = s.happiness + '%';
    const avg = Object.values(state).reduce((a,b)=>a+b.happiness,0) / Object.values(state).length;
    el('avgHappy').textContent = Math.round(avg);
  }

  function say(id, text, ms){
    const b = el('bubble-'+id);
    b.textContent = text;
    b.classList.add('show');
    clearTimeout(b._t);
    b._t = setTimeout(()=> b.classList.remove('show'), ms || 1400);
  }

  function setPose(id, pose, duration){
    const s = state[id];
    s.imgEl.className = 'mon-img ' + pose;
    clearTimeout(s._poseT);
    if(duration){
      s._poseT = setTimeout(()=>{ s.imgEl.className = 'mon-img idle'; }, duration);
    }
  }

  function goTo(id, targetX, mode, onDone){
    const s = state[id];
    if(s.sleeping && mode !== 'wake') return;
    const r = floorRange();
    const clamped = Math.max(r.minX, Math.min(r.maxX, targetX));
    const dist = Math.abs(clamped - s.x);
    const speed = mode === 'run' ? 240 : 80;
    const dur = Math.max(0.4, dist/speed);
    setPose(id, mode === 'run' ? 'run' : 'idle');
    s.wrap.style.transition = `left ${dur}s ease-in-out`;
    s.x = clamped;
    s.wrap.style.left = `calc(50% + ${clamped}px)`;
    s.busy = true;
    clearTimeout(s._moveT);
    s._moveT = setTimeout(()=>{
      s.busy = false;
      setPose(id, 'idle');
      if(onDone) onDone();
    }, dur*1000);
  }

  window.feed = function(){
    const s = state[selectedId];
    if(s.sleeping || s.busy) return;
    s.happiness = clamp(s.happiness + 20);
    renderHappy();
    goTo(selectedId, -scene.clientWidth/2 + 60, 'walk', ()=>{
      setPose(selectedId, 'eat', 1200);
      say(selectedId, '냠냠! 맛있어요!', 1300);
    });
  };

  window.play = function(){
    const s = state[selectedId];
    if(s.sleeping || s.busy) return;
    s.happiness = clamp(s.happiness + 15);
    renderHappy();
    setPose(selectedId, 'play', 1400);
    say(selectedId, '신난다!', 1300);
  };

  window.run_ = function(){
    const s = state[selectedId];
    if(s.sleeping || s.busy) return;
    s.happiness = clamp(s.happiness + 10);
    renderHappy();
    const r = floorRange();
    say(selectedId, '슝~!', 900);
    goTo(selectedId, r.minX + Math.random()*(r.maxX-r.minX), 'run', ()=>{
      goTo(selectedId, r.minX + Math.random()*(r.maxX-r.minX), 'run');
    });
  };

  window.rest = function(){
    const s = state[selectedId];
    if(s.busy) return;
    if(s.sleeping){
      s.sleeping = false;
      el('zzz-'+selectedId).classList.remove('show');
      setPose(selectedId, 'idle');
      say(selectedId, '잘 잤다!', 1200);
      renderHappy();
      return;
    }
    s.happiness = clamp(s.happiness + 12);
    renderHappy();
    const bedX = scene.clientWidth/2 - 70;
    goTo(selectedId, bedX, 'walk', ()=>{
      s.sleeping = true;
      setPose(selectedId, 'sleep');
      el('zzz-'+selectedId).classList.add('show');
      say(selectedId, '쿨쿨...', 1200);
    });
  };

  scene.addEventListener('click', (e)=>{
    const s = state[selectedId];
    if(s.sleeping || s.busy) return;
    const rect = scene.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    const targetX = clickX - rect.width/2;
    goTo(selectedId, targetX, 'walk', ()=>{ say(selectedId, '여기 왔어요!', 900); });
  });

  function ambientWander(){
    const delay = 3500 + Math.random()*4000;
    setTimeout(()=>{
      Object.keys(state).forEach(id=>{
        const s = state[id];
        if(!s.busy && !s.sleeping && Math.random() < 0.5){
          const r = floorRange();
          goTo(id, r.minX + Math.random()*(r.maxX-r.minX), 'walk');
        }
      });
      ambientWander();
    }, delay);
  }

  setInterval(()=>{
    Object.values(state).forEach(s=>{
      if(!s.sleeping) s.happiness = clamp(s.happiness - 1);
    });
    renderHappy();
  }, 5000);

  window.addEventListener('load', ()=>{
    MONS.forEach((def,i)=> buildMon(def, i));
    buildPicker();
    select(MONS[0].id);
    ambientWander();
  });
})();
</script>
</body>
</html>
