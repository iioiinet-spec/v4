<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>심해의 방 - 공포 게임</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #050505;
            color: #d1d1d1;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            width: 100%;
            max-width: 600px;
            height: 450px;
            background-color: #0b0b0e;
            border: 2px solid #222;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }
        .glitch {
            animation: glitchEffect 0.15s infinite;
        }
        @keyframes glitchEffect {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }
        #text-box {
            font-size: 1.1rem;
            line-height: 1.6;
            height: 200px;
            overflow-y: auto;
            border-bottom: 1px dashed #333;
            padding-bottom: 15px;
        }
        #choices-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            background-color: #15151a;
            color: #a0a0a0;
            border: 1px solid #333;
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }
        button:hover {
            background-color: #2b0000;
            color: #ff4d4d;
            border-color: #ff4d4d;
        }
        #stats {
            font-size: 0.85rem;
            color: #666;
            display: flex;
            justify-content: space-between;
        }
        /* 점프스케어 효과 */
        #jumpscare {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        #jumpscare img, #jumpscare h1 {
            color: #ff0000;
            font-size: 3rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="jumpscare">
            <h1 class="glitch">"거기 누구야?"</h1>
        </div>
        
        <div>
            <div id="stats">
                <span id="location-name">장소: ???</span>
                <span id="sanity">정신력: 100%</span>
            </div>
        </div>

        <div id="text-box">
            눈을 떠보니 차갑고 축축한 방 안이다. 유일한 빛은 문틈 새어 나오는 희미한 가로등 불빛뿐이다. 머리가 지끈거린다. 내가 왜 여기에 있는 거지?
        </div>

        <div id="choices-box">
            <button onclick="nextStage(1)">방 안을 더듬어 주변을 조사한다.</button>
            <button onclick="nextStage(2)">철컥거리는 낡은 철문으로 다가간다.</button>
        </div>
    </div>

    <script>
        let sanity = 100;
        const textBox = document.getElementById("text-box");
        const choicesBox = document.getElementById("choices-box");
        const locationName = document.getElementById("location-name");
        const sanityDisplay = document.getElementById("sanity");
        const container = document.getElementById("game-container");
        const jumpscare = document.getElementById("jumpscare");

        function updateSanity(amount) {
            sanity += amount;
            if (sanity < 0) sanity = 0;
            if (sanity > 100) sanity = 100;
            sanityDisplay.innerText = `정신력: ${sanity}%`;
            
            if (sanity <= 30) {
                sanityDisplay.style.color = "#ff4d4d";
                container.classList.add("glitch");
            } else {
                sanityDisplay.style.color = "#666";
                container.classList.remove("glitch");
            }
        }

        function triggerJumpscare(callback) {
            jumpscare.style.display = "flex";
            setTimeout(() => {
                jumpscare.style.display = "none";
                callback();
            }, 800);
        }

        function nextStage(stage) {
            if (stage === 1) {
                locationName.innerText = "장소: 방 구석";
                textBox.innerHTML = "바닥을 더듬자 손에 끈적한 액체가 묻어난다. 피 냄새...? 그 순간, 어둠 속에서 낮게 킥킥거리는 숨소리가 들려온다. 내 바로 뒤에서.";
                updateSanity(-20);
                choicesBox.innerHTML = `
                    <button onclick="nextStage(3)">뒤를 돌아본다.</button>
                    <button onclick="nextStage(4)">비명을 지르며 문을 향해 뛴다.</button>
                `;
            } else if (stage === 2) {
                locationName.innerText = "장소: 녹슨 철문 앞";
                textBox.innerHTML = "문고리를 잡고 흔들어보았다. 잠겨있지 않다. 문 너머는 한치 앞도 보이지 않는 복도다. 차갑고 기분 나쁜 바람이 문틈으로 불어온다.";
                updateSanity(-10);
                choicesBox.innerHTML = `
                    <button onclick="nextStage(5)">조심스럽게 문을 열고 복도로 나간다.</button>
                    <button onclick="nextStage(1)">다시 방 안으로 물러난다.</button>
                `;
            } else if (stage === 3) {
                triggerJumpscare(() => {
                    locationName.innerText = "장소: ???";
                    textBox.innerHTML = "형체를 알아볼 수 없는 무언가가 내 코앞까지 다가와 있었다. 눈동자가 없는 얼굴로 나를 응시하고 있다... 암전.";
                    updateSanity(-50);
                    choicesBox.innerHTML = `
                        <button onclick="resetGame()">다시 눈을 뜬다...</button>
                    `;
                });
            } else if (stage === 4) {
                locationName.innerText = "장소: 복도 입구";
                textBox.innerHTML = "숨을 몰아쉬며 문을 박차고 나왔다. 뒤에서 무언가가 쾅 하고 문을 내리치는 소리가 들렸다. 살았다... 하지만 이 복도는 끝이 보이지 않는다.";
                updateSanity(-15);
                choicesBox.innerHTML = `
                    <button onclick="nextStage(6)">희미한 불빛이 보이는 왼쪽으로 간다.</button>
                    <button onclick="nextStage(7)">완전한 어둠 속의 오른쪽으로 간다.</button>
                `;
            } else if (stage === 5) {
                locationName.innerText = "장소: 어두운 복도";
                textBox.innerHTML = "발걸음을 죽이고 복도에 발을 디뎠다. 삐그덕거리는 바닥 소리가 유난히 크게 울린다. 저 멀리 복도 끝에 누군가 서서 벽을 보고 서 있다.";
                updateSanity(-20);
                choicesBox.innerHTML = `
                    <button onclick="nextStage(6)">천천히 다가가 말을 건다.</button>
                    <button onclick="nextStage(7)">조용히 뒤돌아 방으로 도망친다.</button>
                `;
            } else if (stage === 6) {
                triggerJumpscare(() => {
                    locationName.innerText = "BAD END: 붙잡힘";
                    textBox.innerHTML = "그 존재가 갑자기 180도 목을 꺾어 나를 바라보며 달려들었다. 도망칠 수 없다. <br><br><strong>[배드 엔딩: 영원한 감금]</strong>";
                    choicesBox.innerHTML = `
                        <button onclick="resetGame()">처음부터 다시 시작하기</button>
                    `;
                });
            } else if (stage === 7) {
                locationName.innerText = "TRUE END: 탈출?";
                textBox.innerHTML = "어둠을 더듬으며 맹렬히 달려간 끝에, 비상구의 초록빛 불빛이 눈에 들어왔다. 힘껏 문을 밀치자 차가운 밤공기가 폐 속으로 밀려들어왔다. 살아남았다... 적어도 지금은.<br><br><strong>[트루 엔딩: 탈출 성공]</strong>";
                choicesBox.innerHTML = `
                    <button onclick="resetGame()">다시 악몽 속으로...</button>
                `;
            }
        }

        function resetGame() {
            sanity = 100;
            updateSanity(0);
            locationName.innerText = "장소: ???";
            textBox.innerHTML = "눈을 떠보니 차갑고 축축한 방 안이다. 유일한 빛은 문틈 새어 나오는 희미한 가로등 불빛뿐이다. 머리가 지끈거린다. 내가 왜 여기에 있는 거지?";
            choicesBox.innerHTML = `
                <button onclick="nextStage(1)">방 안을 더듬어 주변을 조사한다.</button>
                <button onclick="nextStage(2)">철컥거리는 낡은 철문으로 다가간다.</button>
            `;
        }
    </script>
</body>
</html>
