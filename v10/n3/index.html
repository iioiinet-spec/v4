
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영어 단어 공부</title>

<style>
* { box-sizing:border-box; }

body {
    margin:0;
    padding:20px;
    min-height:100vh;
    background:linear-gradient(135deg,#dbeafe,#fce7f3);
    font-family:Arial,sans-serif;
}

.container {
    max-width:700px;
    margin:20px auto;
    padding:25px;
    background:white;
    border-radius:22px;
    box-shadow:0 8px 25px #0002;
    text-align:center;
}

h1 { color:#2563eb; }

button {
    border:0;
    border-radius:12px;
    padding:13px 18px;
    margin:6px;
    background:#2563eb;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover { background:#1d4ed8; }

.menu button { background:#16a34a; }

.word-list {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
    gap:10px;
    margin:20px 0;
}

.word-item {
    background:#eff6ff;
    padding:14px 8px;
    border-radius:12px;
}

.word-item strong {
    display:block;
    color:#2563eb;
    font-size:20px;
    margin-bottom:6px;
}

.word-item span {
    color:#475569;
    font-size:16px;
}

.quiz {
    background:#eff6ff;
    border-radius:18px;
    padding:25px;
    margin-top:20px;
}

.question {
    font-size:36px;
    font-weight:bold;
    color:#2563eb;
    margin:25px 0;
}

input {
    width:100%;
    padding:15px;
    border:2px solid #cbd5e1;
    border-radius:12px;
    font-size:20px;
    text-align:center;
    margin:12px 0;
}

input:focus {
    outline:none;
    border-color:#2563eb;
}

.result {
    font-size:19px;
    font-weight:bold;
    min-height:30px;
    margin:15px;
}

.progress {
    color:#64748b;
    font-weight:bold;
}

.hidden {
    display:none !important;
}
</style>
</head>

<body>

<div class="container">

<h1>📚 나의 영어 단어장</h1>
<p>영어 단어 25개를 재미있게 공부해 봐요!</p>

<div id="listScreen">

<div class="menu">
<button onclick="startQuiz('ko')">✏️ 뜻 쓰기</button>
<button onclick="startQuiz('en')">✏️ 영어 쓰기</button>
</div>

<h2>📖 전체 단어 25개</h2>
<div class="word-list" id="wordList"></div>

</div>

<div id="quizScreen" class="hidden">

<h2 id="quizTitle"></h2>
<div class="progress" id="progress"></div>

<div class="quiz">

<div class="question" id="question"></div>

<input
    id="answer"
    type="text"
    placeholder="정답을 입력하세요"
    onkeydown="if(event.key === 'Enter') checkAnswer()"
>

<button onclick="checkAnswer()">정답 확인</button>

<div class="result" id="result"></div>

<button onclick="nextQuestion()">다음 문제 ➡</button>

</div>

<button onclick="showList()">📖 단어 목록으로</button>

</div>

</div>

<script>

// ✏️ 여기만 고치세요! 단어 목록

const words = [
{en:'apple',ko:'사과',ex:'I eat an apple.'},
{en:'banana',ko:'바나나',ex:'I like bananas.'},
{en:'book',ko:'책',ex:'This is my book.'},
{en:'cat',ko:'고양이',ex:'I have a cat.'},
{en:'dog',ko:'강아지',ex:'The dog is cute.'},
{en:'egg',ko:'달걀',ex:'I eat an egg.'},
{en:'flower',ko:'꽃',ex:'This flower is beautiful.'},
{en:'grape',ko:'포도',ex:'I like grapes.'},
{en:'house',ko:'집',ex:'This is my house.'},
{en:'ice',ko:'얼음',ex:'The ice is cold.'},
{en:'juice',ko:'주스',ex:'I drink juice.'},
{en:'kite',ko:'연',ex:'I fly a kite.'},
{en:'lion',ko:'사자',ex:'The lion is strong.'},
{en:'moon',ko:'달',ex:'The moon is bright.'},
{en:'nose',ko:'코',ex:'This is my nose.'},
{en:'orange',ko:'오렌지',ex:'I eat an orange.'},
{en:'pencil',ko:'연필',ex:'I have a pencil.'},
{en:'queen',ko:'여왕',ex:'The queen is kind.'},
{en:'rabbit',ko:'토끼',ex:'The rabbit can jump.'},
{en:'sun',ko:'태양',ex:'The sun is hot.'},
{en:'school',ko:'학교',ex:'I go to school.'},
{en:'tree',ko:'나무',ex:'The tree is tall.'},
{en:'water',ko:'물',ex:'I drink water.'},
{en:'yellow',ko:'노란색',ex:'The sun is yellow.'},
{en:'zebra',ko:'얼룩말',ex:'The zebra has stripes.'}
];

let quizType = 'ko';
let currentWord = null;
let usedIndexes = [];
let questionCount = 0;
let answered = false;
let nextTimer = null;

// 단어 목록 만들기

function makeList() {
    const list = document.getElementById('wordList');
    list.innerHTML = '';

    words.forEach((word,index) => {
        const item = document.createElement('div');
        item.className = 'word-item';

        const english = document.createElement('strong');
        english.textContent = `${index+1}. ${word.en}`;

        const korean = document.createElement('span');
        korean.textContent = word.ko;

        item.appendChild(english);
        item.appendChild(korean);
        list.appendChild(item);
    });
}

// 공부 시작

function startQuiz(type) {
    clearTimeout(nextTimer);

    quizType = type;
    usedIndexes = [];
    questionCount = 0;

    document.getElementById('listScreen').classList.add('hidden');
    document.getElementById('quizScreen').classList.remove('hidden');

    document.getElementById('quizTitle').textContent =
        type === 'ko' ? '✏️ 뜻 쓰기' : '✏️ 영어 쓰기';

    nextQuestion();
}

// 다음 문제

function nextQuestion() {
    clearTimeout(nextTimer);

    if (usedIndexes.length === words.length) {
        usedIndexes = [];
    }

    const available = words
        .map((word,index) => index)
        .filter(index => !usedIndexes.includes(index));

    const randomIndex =
        available[Math.floor(Math.random()*available.length)];

    usedIndexes.push(randomIndex);

    currentWord = words[randomIndex];

    questionCount++;
    answered = false;

    document.getElementById('progress').textContent =
        `문제 ${questionCount} / ${words.length}`;

    document.getElementById('question').textContent =
        quizType === 'ko' ? currentWord.en : currentWord.ko;

    document.getElementById('answer').value = '';

    document.getElementById('result').textContent = '';

    document.getElementById('answer').placeholder =
        quizType === 'ko'
        ? '한글 뜻을 입력하세요'
        : '영어 단어를 입력하세요';

    document.getElementById('answer').focus();
}

// 정답 확인

function checkAnswer() {

    if (answered) return;

    const answer = document
        .getElementById('answer')
        .value.trim().toLowerCase();

    const correct = quizType === 'ko'
        ? currentWord.ko
        : currentWord.en.toLowerCase();

    const result = document.getElementById('result');

    if (answer === correct.toLowerCase()) {

        answered = true;

        result.textContent =
            '🎉 정답이에요! 다음 문제로 이동합니다!';

        result.style.color = '#16a34a';

        // 1초 후 자동으로 다음 문제

        nextTimer = setTimeout(() => {
            nextQuestion();
        }, 1000);

    } else {

        // 틀리면 다시 입력할 수 있어요.

        result.textContent =
            '❌ 틀렸어요! 다시 도전해 보세요!';

        result.style.color = '#dc2626';

        document.getElementById('answer').focus();
    }
}

// 목록으로 돌아가기

function showList() {
    clearTimeout(nextTimer);

    document.getElementById('quizScreen').classList.add('hidden');
    document.getElementById('listScreen').classList.remove('hidden');
}

// 처음 실행

makeList();

</script>

</body>
</html>
