<!DOCTYPE html>
<html lang="ko" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일본어 단어장 & 퀴즈</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Noto Serif KR -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* 배경색: 선명한 시안 Blue */
            --bg-color: #00ccff;
            /* 카드 배경색: 깔끔한 흰색 */
            --card-bg: #ffffff;
            /* 글자색: 선명한 검은색 */
            --text-color: #000000;
            /* 포인트 색상: 다크 차콜 3e3737 */
            --accent-color: #3e3737;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Noto Serif KR', serif;
        }

        /* 모서리 둥글기 0px 디자인 강제 적용 */
        *, ::before, ::after {
            border-radius: 0px !important;
        }

        /* 커스텀 테마 클래스 */
        .theme-card {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 2px solid var(--accent-color);
        }

        .theme-btn {
            background-color: var(--accent-color);
            color: #ffffff;
            border: 2px solid var(--accent-color);
            transition: all 0.15s ease-in-out;
        }

        .theme-btn:hover {
            background-color: #000000;
            border-color: #000000;
        }

        .theme-btn-outline {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 2px solid var(--accent-color);
            transition: all 0.15s ease-in-out;
        }

        .theme-btn-outline:hover {
            background-color: var(--accent-color);
            color: #ffffff;
        }

        /* 3D 카드 플립 효과 */
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }

        /* 퀴즈 선택지 상태 스타일 */
        .quiz-choice-correct {
            background-color: #2e7d32 !important;
            color: #ffffff !important;
            border-color: #2e7d32 !important;
        }

        .quiz-choice-wrong {
            background-color: #d32f2f !important;
            color: #ffffff !important;
            border-color: #d32f2f !important;
        }

        .quiz-choice-dimmed {
            opacity: 0.35;
            cursor: not-allowed;
        }
    </style>
</head>
<body class="h-full min-h-screen flex flex-col font-serif">

    <!-- 토스트 메시지 (알림 창) -->
    <div id="toast-message" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 hidden bg-black text-white px-6 py-3 font-bold border-2 border-white shadow-2xl transition-all duration-300 text-sm sm:text-base">
        <!-- 메시지가 여기에 동적으로 삽입됩니다 -->
    </div>

    <!-- 네비게이션 헤더 -->
    <header class="theme-card border-b-4 border-black sticky top-0 z-40 bg-white">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-black text-white flex items-center justify-center font-black text-xl border-2 border-black">
                    日
                </div>
                <div>
                    <h1 class="text-lg font-black tracking-tight leading-none text-black">일한 단어장</h1>
                    <p class="text-xs font-semibold text-slate-600">Noto Serif KR 스페셜 에디션</p>
                </div>
            </div>

            <!-- 탭 이동 버튼 -->
            <nav class="flex space-x-1 sm:space-x-2">
                <button onclick="switchTab('flashcard')" id="nav-flashcard" class="px-3 py-1.5 text-xs sm:text-sm font-bold theme-btn">
                    <i class="fa-solid fa-clone mr-1"></i> 플래시카드
                </button>
                <button onclick="switchTab('quiz')" id="nav-quiz" class="px-3 py-1.5 text-xs sm:text-sm font-bold theme-btn-outline">
                    <i class="fa-solid fa-graduation-cap mr-1"></i> 퀴즈
                </button>
                <button onclick="switchTab('list')" id="nav-list" class="px-3 py-1.5 text-xs sm:text-sm font-bold theme-btn-outline">
                    <i class="fa-solid fa-list mr-1"></i> 단어 목록
                </button>
            </nav>
        </div>
    </header>

    <!-- 메인 컨텐츠 영역 -->
    <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-8 flex flex-col">

        <!-- 1. 플래시카드 탭 -->
        <div id="tab-flashcard" class="flex-1 flex flex-col items-center justify-center max-w-lg mx-auto w-full">
            <div class="w-full flex justify-between items-center mb-3 text-sm font-bold px-1 text-black">
                <span id="fc-counter">카드 1 / 15</span>
                <button onclick="shuffleCards()" class="theme-btn-outline px-3 py-1 text-xs font-bold flex items-center">
                    <i class="fa-solid fa-shuffle mr-1.5"></i> 섞기
                </button>
            </div>

            <!-- 플래시카드 박스 -->
            <div class="w-full h-80 sm:h-96 perspective-1000 cursor-pointer" onclick="flipCard()">
                <div id="flashcard-inner" class="relative w-full h-full duration-500 transform-style-3d shadow-2xl">
                    
                    <!-- 전면 (일본어) -->
                    <div class="absolute inset-0 w-full h-full theme-card p-6 flex flex-col justify-between backface-hidden">
                        <div class="flex justify-between items-center">
                            <span class="text-xs font-black uppercase tracking-wider px-2.5 py-1 bg-black text-white">일본어</span>
                            <!-- TTS 음성 재생 버튼 -->
                            <button onclick="event.stopPropagation(); speakWord(currentWords[currentCardIndex].en)" class="w-11 h-11 bg-black text-white hover:bg-slate-800 flex items-center justify-center text-lg transition" title="발음 듣기">
                                <i class="fa-solid fa-volume-high"></i>
                            </button>
                        </div>
                        <div class="text-center my-auto">
                            <h2 id="fc-front-text" class="text-4xl sm:text-5xl font-black mb-3 leading-tight">こんにちは</h2>
                            <p class="text-xs font-bold text-slate-500 mt-2"><i class="fa-solid fa-rotate mr-1"></i> 카드를 클릭하면 뜻이 보입니다</p>
                        </div>
                        <div class="text-center text-xs font-bold text-slate-400">
                            FLASHCARD FRONT
                        </div>
                    </div>

                    <!-- 후면 (한국어) -->
                    <div class="absolute inset-0 w-full h-full bg-slate-900 text-white border-2 border-black p-6 flex flex-col justify-between backface-hidden rotate-y-180">
                        <div class="flex justify-between items-center">
                            <span class="text-xs font-black uppercase tracking-wider px-2.5 py-1 bg-white text-black">한국어 뜻</span>
                            <button onclick="event.stopPropagation(); speakWord(currentWords[currentCardIndex].en)" class="w-11 h-11 bg-white text-black hover:bg-slate-200 flex items-center justify-center text-lg transition" title="발음 듣기">
                                <i class="fa-solid fa-volume-high"></i>
                            </button>
                        </div>
                        <div class="text-center my-auto">
                            <h2 id="fc-back-text" class="text-4xl sm:text-5xl font-black mb-3">안녕</h2>
                        </div>
                        <div class="text-center text-xs font-bold text-slate-400">
                            카드를 다시 클릭하면 일본어로 돌아갑니다
                        </div>
                    </div>

                </div>
            </div>

            <!-- 카드 이동 컨트롤 -->
            <div class="flex items-center justify-between w-full mt-6">
                <button onclick="prevCard()" class="px-6 py-3 theme-btn-outline font-black text-sm flex items-center space-x-2">
                    <i class="fa-solid fa-arrow-left"></i> <span>이전 카드</span>
                </button>
                <button onclick="nextCard()" class="px-6 py-3 theme-btn font-black text-sm flex items-center space-x-2">
                    <span>다음 카드</span> <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </div>

        <!-- 2. 4지 선다 퀴즈 탭 -->
        <div id="tab-quiz" class="hidden flex-1 flex flex-col max-w-xl mx-auto w-full my-auto">
            <div class="theme-card p-6 sm:p-8 shadow-2xl">
                
                <!-- 점수 및 상태 바 -->
                <div class="flex justify-between items-center mb-4 text-sm font-bold border-b-2 border-black pb-3">
                    <span id="quiz-question-num" class="text-black">문제 1 / 15</span>
                    <div class="flex items-center space-x-4">
                        <span class="text-emerald-700"><i class="fa-solid fa-circle-check mr-1"></i> 맞음: <span id="quiz-correct-cnt">0</span></span>
                        <span class="text-rose-700"><i class="fa-solid fa-circle-xmark mr-1"></i> 틀림: <span id="quiz-wrong-cnt">0</span></span>
                    </div>
                </div>

                <!-- 질문 제시 카드 -->
                <div class="text-center py-6 bg-slate-100 border-2 border-black mb-6">
                    <span class="text-xs font-bold text-slate-600 block mb-1">이 단어의 뜻은?</span>
                    <div class="flex items-center justify-center space-x-3">
                        <h2 id="quiz-word" class="text-3xl sm:text-4xl font-black text-black">こんにちは</h2>
                        <button onclick="speakWord(quizCurrentWord.en)" class="w-9 h-9 bg-black text-white hover:bg-slate-800 flex items-center justify-center text-sm transition" title="발음 듣기">
                            <i class="fa-solid fa-volume-high"></i>
                        </button>
                    </div>
                </div>

                <!-- 4개 보기 버튼 그리드 -->
                <div id="quiz-options-container" class="grid grid-cols-1 gap-3 mb-6">
                    <!-- 스크립트로 4개 보기 버튼 생성 -->
                </div>

                <!-- 다음 문제 버튼 -->
                <button id="quiz-next-btn" onclick="nextQuizQuestion()" class="w-full py-3.5 theme-btn font-black text-base hidden flex items-center justify-center space-x-2">
                    <span>다음 문제로 이동</span> <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>
        </div>

        <!-- 3. 단어 목록 탭 -->
        <div id="tab-list" class="hidden flex-1 flex flex-col w-full">
            <div class="theme-card p-6 shadow-2xl flex-1 flex flex-col">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                    <div>
                        <h2 class="text-xl font-black text-black">전체 단어장</h2>
                        <p class="text-xs font-bold text-slate-600">등록된 15개 필수 어휘 데이터</p>
                    </div>
                    <div class="relative w-full sm:w-64">
                        <input type="text" id="search-input" oninput="filterWords()" placeholder="검색어 입력..." class="w-full px-3 py-2 bg-slate-50 border-2 border-black text-sm font-bold focus:outline-none focus:bg-white">
                    </div>
                </div>

                <div class="overflow-x-auto border-2 border-black">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-black text-white text-xs font-black uppercase">
                                <th class="p-3 border-b-2 border-black">#</th>
                                <th class="p-3 border-b-2 border-black">일본어 (en)</th>
                                <th class="p-3 border-b-2 border-black">한국어 (ko)</th>
                                <th class="p-3 border-b-2 border-black text-right">음성 듣기</th>
                            </tr>
                        </thead>
                        <tbody id="word-table-body" class="divide-y-2 divide-slate-200 text-sm font-bold bg-white">
                            <!-- 스크립트로 데이터 동적 삽입 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <!-- 스크립트 영역 -->
    <script>
        // 원본 단어 데이터
        const WORDS = [
          { en:'こんにちは', ko:'안녕', ex:'' },
          { en:'ありがとうございます', ko:'감사합니다', ex:'' },
          { en:'韓国人です', ko:'한국인 입니다', ex:'' },
          { en:'すいません', ko:'죄송합니다', ex:'' },
          { en:'はい', ko:'네', ex:'' },
          { en:'いいえ', ko:'아니오', ex:'' },
          { en:'おやすみなさい', ko:'안녕히 주무세요', ex:'' },
          { en:'おいしい', ko:'맛있다', ex:'' },
          { en:'いい', ko:'좋다', ex:'' },
          { en:'私は', ko:'저는', ex:'' },
          { en:'日', ko:'1', ex:'' },
          { en:'歯', ko:'2', ex:'' },
          { en:'三.', ko:'3', ex:'' },
          { en:'四', ko:'4', ex:'' },
          { en:'オー', ko:'5', ex:'' },
        ];

        // 상태 변수
        let currentWords = [...WORDS];
        let currentCardIndex = 0;
        let isFlipped = false;

        // 퀴즈 상태 변수
        let quizPool = [];
        let quizIndex = 0;
        let quizCurrentWord = null;
        let quizCorrectCnt = 0;
        let quizWrongCnt = 0;
        let isQuizAnswered = false;

        // 토스트 메시지 안내
        function showToast(msg) {
            const toast = document.getElementById('toast-message');
            toast.textContent = msg;
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }

        // 음성 합성 (Web Speech API) - 느린 속도로 일본어 발음 출력
        function speakWord(text) {
            if (!('speechSynthesis' in window)) {
                showToast("이 브라우저는 소리를 지원하지 않아요");
                return;
            }

            try {
                window.speechSynthesis.cancel(); // 이전 음성 취소
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ja-JP';
                utterance.rate = 0.85; // 조금 느린 속도

                // 예외 처리 핸들러
                utterance.onerror = function() {
                    showToast("이 브라우저는 소리를 지원하지 않아요");
                };

                window.speechSynthesis.speak(utterance);
            } catch (e) {
                showToast("이 브라우저는 소리를 지원하지 않아요");
            }
        }

        // 탭 전환 Logic
        function switchTab(tabId) {
            ['flashcard', 'quiz', 'list'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                const navBtn = document.getElementById(`nav-${t}`);
                navBtn.className = 'px-3 py-1.5 text-xs sm:text-sm font-bold theme-btn-outline';
            });

            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
            document.getElementById(`nav-${tabId}`).className = 'px-3 py-1.5 text-xs sm:text-sm font-bold theme-btn';

            if (tabId === 'list') {
                renderWordTable(WORDS);
            } else if (tabId === 'quiz') {
                startNewQuizSession();
            }
        }

        // --- 플래시카드 기능 ---
        function updateFlashcard() {
            const card = currentWords[currentCardIndex];
            document.getElementById('fc-front-text').textContent = card.en;
            document.getElementById('fc-back-text').textContent = card.ko;
            document.getElementById('fc-counter').textContent = `카드 ${currentCardIndex + 1} / ${currentWords.length}`;
            
            if (isFlipped) {
                flipCard(true);
            }
        }

        function flipCard(forceReset = false) {
            const inner = document.getElementById('flashcard-inner');
            if (forceReset) {
                isFlipped = false;
                inner.style.transform = 'rotateY(0deg)';
                return;
            }
            isFlipped = !isFlipped;
            inner.style.transform = isFlipped ? 'rotateY(180deg)' : 'rotateY(0deg)';
        }

        function nextCard() {
            currentCardIndex = (currentCardIndex + 1) % currentWords.length;
            updateFlashcard();
        }

        function prevCard() {
            currentCardIndex = (currentCardIndex - 1 + currentWords.length) % currentWords.length;
            updateFlashcard();
        }

        function shuffleCards() {
            currentWords = [...WORDS].sort(() => Math.random() - 0.5);
            currentCardIndex = 0;
            updateFlashcard();
            showToast("순서를 무작위로 섞었습니다!");
        }

        // --- 4지선다 퀴즈 기능 ---
        function startNewQuizSession() {
            quizPool = [...WORDS].sort(() => Math.random() - 0.5);
            quizIndex = 0;
            quizCorrectCnt = 0;
            quizWrongCnt = 0;
            document.getElementById('quiz-correct-cnt').textContent = '0';
            document.getElementById('quiz-wrong-cnt').textContent = '0';
            loadQuizQuestion();
        }

        function loadQuizQuestion() {
            isQuizAnswered = false;
            document.getElementById('quiz-next-btn').classList.add('hidden');
            
            if (quizIndex >= quizPool.length) {
                quizIndex = 0;
                quizPool = [...WORDS].sort(() => Math.random() - 0.5);
            }

            quizCurrentWord = quizPool[quizIndex];
            document.getElementById('quiz-question-num').textContent = `문제 ${quizIndex + 1} / ${quizPool.length}`;
            document.getElementById('quiz-word').textContent = quizCurrentWord.en;

            // 오답 3개 무작위 선택
            const otherWords = WORDS.filter(w => w.ko !== quizCurrentWord.ko);
            const wrongChoices = otherWords.sort(() => Math.random() - 0.5).slice(0, 3);
            
            // 정답 1개 + 오답 3개 섞기
            const allChoices = [quizCurrentWord, ...wrongChoices].sort(() => Math.random() - 0.5);

            const container = document.getElementById('quiz-options-container');
            container.innerHTML = '';

            allChoices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = 'w-full p-4 bg-white border-2 border-black font-bold text-base text-left transition flex items-center justify-between hover:bg-slate-100';
                btn.innerHTML = `<span>${choice.ko}</span> <i class="fa-regular fa-circle text-xs text-slate-400"></i>`;
                btn.onclick = () => handleQuizSelect(btn, choice.ko === quizCurrentWord.ko);
                container.appendChild(btn);
            });
        }

        function handleQuizSelect(selectedBtn, isCorrect) {
            if (isQuizAnswered) return;
            isQuizAnswered = true;

            const container = document.getElementById('quiz-options-container');
            const buttons = container.querySelectorAll('button');

            buttons.forEach(btn => {
                btn.disabled = true;
                const choiceText = btn.querySelector('span').textContent;
                
                if (choiceText === quizCurrentWord.ko) {
                    btn.classList.add('quiz-choice-correct');
                } else {
                    btn.classList.add('quiz-choice-dimmed');
                }
            });

            if (isCorrect) {
                quizCorrectCnt++;
                document.getElementById('quiz-correct-cnt').textContent = quizCorrectCnt;
            } else {
                quizWrongCnt++;
                selectedBtn.classList.remove('quiz-choice-dimmed');
                selectedBtn.classList.add('quiz-choice-wrong');
                document.getElementById('quiz-wrong-cnt').textContent = quizWrongCnt;
            }

            document.getElementById('quiz-next-btn').classList.remove('hidden');
        }

        function nextQuizQuestion() {
            quizIndex++;
            loadQuizQuestion();
        }

        // --- 단어 목록 기능 ---
        function renderWordTable(data) {
            const tbody = document.getElementById('word-table-body');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-slate-500">검색 결과가 없습니다.</td></tr>`;
                return;
            }

            data.forEach((word, idx) => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50 border-b border-slate-200';
                tr.innerHTML = `
                    <td class="p-3 text-slate-400 font-bold">${idx + 1}</td>
                    <td class="p-3 font-black text-black text-base">${word.en}</td>
                    <td class="p-3 text-slate-800">${word.ko}</td>
                    <td class="p-3 text-right">
                        <button onclick="speakWord('${word.en}')" class="w-8 h-8 bg-black text-white hover:bg-slate-800 inline-flex items-center justify-center transition" title="발음 듣기">
                            <i class="fa-solid fa-volume-high text-xs"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filterWords() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = WORDS.filter(w => 
                w.en.toLowerCase().includes(query) || w.ko.toLowerCase().includes(query)
            );
            renderWordTable(filtered);
        }

        // 페이지 초기화
        window.onload = function() {
            updateFlashcard();
        };
    </script>
</body>
</html>
