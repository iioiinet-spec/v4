<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>미니게임 모음</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#e8f1ee;--ink:#1f2a44;--card:#fff;--mute:#5d6b82;--a:#3e7cb1;--b:#f25c7a;--c:#ffc93c;--line:#c9d9d4}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17202e;--ink:#eef3f8;--card:#223046;--mute:#9fb0c6;--line:#34445e}}
:root[data-theme="dark"]{--bg:#17202e;--ink:#eef3f8;--card:#223046;--mute:#9fb0c6;--line:#34445e}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;min-height:100vh;display:flex;justify-content:center}
main{width:100%;max-width:420px;padding:20px 16px 32px}
h1{font-size:30px;margin:8px 0 4px;font-weight:400}
.sub{color:var(--mute);margin:0 0 20px;font-size:16px}
.menu{display:grid;gap:12px}
.pick{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:14px 16px;cursor:pointer;box-shadow:4px 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.pick:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.pick:focus-visible,.btn:focus-visible,.hole:focus-visible,#rbox:focus-visible{outline:3px solid var(--a);outline-offset:3px}
.ico{font-size:34px;width:52px;height:52px;display:grid;place-items:center;border-radius:14px;flex:none}
.pick b{font-weight:400;font-size:20px;display:block}
.pick span.d{color:var(--mute);font-size:14px}
.pick small{margin-left:auto;color:var(--mute);font-size:14px;white-space:nowrap}
.bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.btn{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:8px 14px;cursor:pointer;font-size:16px}
.btn.main{background:var(--c);color:#1f2a44}
.stat{display:flex;gap:16px;font-size:18px;margin-bottom:10px;min-height:28px}
.stat em{font-style:normal;color:var(--mute)}
.msg{min-height:24px;margin:10px 0 0;font-size:17px;text-align:center}
#rbox{display:grid;place-items:center;text-align:center;height:300px;border:2px solid var(--ink);border-radius:20px;font-size:26px;line-height:1.4;padding:16px;cursor:pointer;user-select:none;background:var(--a);color:#fff}
#rbox.wait{background:var(--b)}#rbox.go{background:#2fa36b}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.hole{aspect-ratio:1;font-size:46px;border:2px solid var(--ink);border-radius:50%;background:#8a6a4f;cursor:pointer;display:grid;place-items:center;padding:0;font-family:inherit;box-shadow:inset 0 -10px 0 rgba(0,0,0,.25)}
.hole span{transform:scale(0);transition:transform .1s}
.hole.up span{transform:scale(1)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.card{aspect-ratio:1;font-size:32px;border:2px solid var(--ink);border-radius:14px;background:var(--a);color:#fff;cursor:pointer;padding:0;font-family:inherit;display:grid;place-items:center}
.card.on{background:var(--card);color:var(--ink)}.card.ok{background:var(--c)}
.pad{display:grid;grid-template-columns:repeat(3,56px);gap:6px;justify-content:center;margin-top:10px}
.pad .btn{padding:10px 0;touch-action:manipulation}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0;font:inherit;font-size:22px;letter-spacing:4px;padding:8px 12px;border:2px solid var(--ink);border-radius:12px;background:var(--card);color:var(--ink)}
.log{list-style:none;padding:0;margin:8px 0 14px;display:grid;gap:6px}
.log li{display:flex;justify-content:space-between;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:6px 12px;font-size:18px}
.b2048{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:var(--line);padding:8px;border-radius:16px;border:2px solid var(--ink);touch-action:none}
.t{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:24px;color:#1f2a44;background:var(--card)}
.mgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.cell{aspect-ratio:1;border:2px solid var(--ink);border-radius:8px;background:var(--a);font:inherit;font-size:18px;padding:0;cursor:pointer;color:var(--ink);touch-action:manipulation}
.cell.o{background:var(--card);border-color:var(--line);cursor:default}.cell.x{background:var(--b)}
.word{font-size:44px;text-align:center;margin:26px 0 14px;min-height:60px}
.big{display:grid;place-items:center;font-size:56px;height:120px;margin:0}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.opts .btn{padding:16px 0;font-size:24px}
.card.bad{background:var(--b)}
.intro{background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:18px;box-shadow:4px 4px 0 var(--ink)}
.intro h2{font-size:26px;margin:0 0 6px;font-weight:400}
.intro dl{margin:0}.intro dt{color:var(--mute);font-size:14px;margin-top:14px}
.intro dd{margin:3px 0 0;font-size:17px;line-height:1.55}
.intro .btn{margin-top:20px;width:100%;padding:12px;font-size:18px}
canvas{display:block;width:100%;height:auto;border:2px solid var(--ink);border-radius:20px;background:var(--card);touch-action:none}

/* 릴스형 피드 */
html,body{height:100%;overflow:hidden}
html{height:100dvh}
body{display:block;min-height:0}
#feed{height:100%;overflow:hidden;touch-action:none;position:relative}
#track{height:100%;transition:transform .5s cubic-bezier(.22,.9,.28,1),opacity .12s;will-change:transform}
#feed.fx #track{opacity:0}
@media(prefers-reduced-motion:reduce){#track{transition:none}}
.slide{height:100%;display:flex;flex-direction:column;align-items:center;padding:12px 16px 8px}
.slide>*{width:100%;max-width:420px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--mute);font-size:15px;flex:none}
.top .ttl{color:var(--ink);font-size:20px;flex:1;text-align:center}
.top .tr{display:flex;align-items:center;gap:6px;font-size:14px;white-space:nowrap}
.btn.sm{padding:5px 10px;font-size:14px;border-radius:10px}
.body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;padding:8px 0}
.bw{margin:auto 0;width:100%}
.hint{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--mute);font-size:13px;padding-top:6px}
.ph{text-align:center;font-size:22px;color:var(--mute)}.phi{font-size:64px}
canvas{width:auto;max-width:100%;max-height:44dvh;margin:0 auto}
.grid,.grid4,.mgrid,.b2048{width:min(100%,44dvh);margin-left:auto;margin-right:auto}
</style>
</head>
<body>
<div id="feed"><div id="track"></div></div>
<script>
window.addEventListener("error",function(e){var b=document.getElementById("err");if(!b){b=document.createElement("div");b.id="err";b.style.cssText="position:fixed;left:8px;right:8px;bottom:8px;z-index:9;background:#b3261e;color:#fff;font:12px/1.4 sans-serif;padding:6px 10px;border-radius:8px;word-break:break-all";document.body.appendChild(b)}b.textContent="오류(v12): "+e.message+" ("+(e.lineno||"?")+"줄)"});
(function(){
var $=function(s){return document.querySelector(s)||document.createElement("div")};

function paintBest(){}
function record(k,v,lowerBetter){var b=best[k];if(b==null||(lowerBetter?v<b:v>b)){best[k]=v;save();paintBest();return true}return false}
var stop=function(){};
var HELP={
react:{t:"번개 반응",i:"⚡",g:"화면이 초록색으로 바뀌는 순간 최대한 빨리 터치해서 반응속도를 재요.",h:"시작 화면을 터치하면 빨간 화면(기다리세요)으로 바뀌어요. 잠시 뒤 초록색 「지금!」이 뜨면 바로 터치하세요. 키보드는 엔터로도 할 수 있어요.",r:"빨간 화면에서 먼저 누르면 실패라서 처음부터 다시 해야 해요. 기다리는 시간은 1.5~4초 사이에서 매번 달라요.",k:"가장 빠른 시간(ms)이 최고 기록이에요. 낮을수록 좋아요."},
whack:{t:"두더지 잡기",i:"🐹",g:"20초 동안 두더지를 최대한 많이 잡아요.",h:"시작 버튼을 누르면 3×3 구멍 중 한 곳에서 🐹가 튀어나와요. 그 구멍을 재빨리 터치하거나 클릭하세요.",r:"두더지는 잠깐 보였다가 스스로 숨어요. 놓쳐도 감점은 없지만, 많이 잡을수록 숨는 속도가 점점 빨라져요.",k:"잡은 마릿수가 많을수록 좋은 기록이에요."},
dodge:{t:"운석 피하기",i:"☄️",g:"떨어지는 운석을 피하며 최대한 오래 살아남아요.",h:"시작 후 게임판을 손가락으로 끌거나 마우스로 움직이면 🚀가 따라와요. 손가락에 가려지지 않도록 로켓은 손가락 조금 위에 나타나요. 키보드는 방향키로 움직여요.",r:"운석에 닿으면 바로 끝나요. 시간이 지날수록 운석이 더 자주, 더 빠르게 떨어져요.",k:"버틴 시간(초)이 길수록 좋은 기록이에요."},
memo:{t:"카드 짝 맞추기",i:"🃏",g:"같은 그림 8쌍을 가장 적은 시도로 모두 찾아요.",h:"카드를 한 장씩 눌러 뒤집어요. 두 장을 뒤집을 때마다 시도가 1번 늘어나요.",r:"그림이 같으면 노란색으로 고정되고, 다르면 0.7초 뒤에 다시 뒤집혀요. 어떤 카드가 어디 있었는지 기억하는 게 핵심이에요. 「다시 섞기」는 언제든 쓸 수 있고, 기록은 8쌍을 모두 맞췄을 때만 저장돼요.",k:"시도 횟수가 적을수록 좋은 기록이에요."},
snake:{t:"스네이크",i:"🐍",g:"먹이(🍎)를 먹으며 뱀을 최대한 길게 키워요.",h:"시작을 누르면 뱀이 오른쪽으로 움직여요. 방향키, 게임판 위 스와이프, 아래의 ▲◀▼▶ 버튼 중 편한 방법으로 방향을 바꾸세요.",r:"벽이나 자기 몸에 부딪히면 끝나요. 진행 방향의 반대로는 바로 꺾을 수 없어요. 먹이를 먹을수록 점점 빨라져요.",k:"먹은 먹이 개수가 많을수록 좋은 기록이에요."},
brick:{t:"벽돌깨기",i:"🧱",g:"공을 튕겨서 벽돌을 최대한 많이 깨요. 벽돌 하나에 1점이에요.",h:"시작 후 게임판을 끌거나 마우스를 움직여 아래쪽 막대를 좌우로 옮겨요. 막대로 공을 받아 위로 튕겨 보내세요.",r:"막대 가장자리에 맞힐수록 공이 더 비스듬하게 날아가요. 공을 놓치면 목숨이 1개 줄고, 목숨은 3개예요. 벽돌을 모두 깨면 새 벽돌이 채워지고 공은 점점 빨라져요.",k:"점수가 높을수록 좋은 기록이에요."},
g2048:{t:"2048",i:"🔢",g:"같은 숫자 타일을 합쳐서 점수를 최대한 높여요.",h:"방향키를 누르거나 판 위에서 스와이프하면 모든 타일이 그 방향으로 밀려요.",r:"같은 숫자 두 개가 부딪히면 하나로 합쳐지고, 합쳐진 숫자만큼 점수가 올라요. 움직일 때마다 2나 4 타일이 새로 생겨요. 빈칸이 없고 더 합칠 수도 없으면 끝나요.",k:"점수가 높을수록 좋은 기록이에요. 움직일 때마다 자동으로 저장돼요."},
mine:{t:"지뢰찾기",i:"💣",g:"지뢰 10개를 피해서 안전한 칸 54개를 모두 열어요.",h:"칸을 터치하면 열려요. 지뢰라고 생각하는 칸은 「모드」 버튼을 눌러 깃발 모드로 바꾼 뒤 터치하세요. PC에서는 우클릭으로도 깃발을 꽂을 수 있어요.",r:"칸에 적힌 숫자는 주변 8칸에 있는 지뢰 개수예요. 빈 칸을 열면 주변이 한꺼번에 열려요. 첫 번째로 연 칸은 항상 안전하고, 타이머는 그때부터 시작해요. 지뢰를 열면 실패예요.",k:"클리어 시간이 짧을수록 좋은 기록이에요."},
typing:{t:"타자 연습",i:"⌨️",g:"30초 안에 단어를 최대한 많이, 정확하게 입력해요.",h:"시작을 누르면 입력창이 열리고 단어가 나와요. 같은 단어를 입력하면 엔터 없이 바로 다음 단어로 넘어가요.",r:"오타가 있으면 넘어가지 않으니 지우고 다시 입력하세요. 단어는 2~5글자 정도의 일상 단어예요.",k:"맞힌 단어 수가 많을수록 좋은 기록이에요."},
color:{t:"색깔 맞히기",i:"🎨",g:"20초 동안 글자의 「뜻」이 아니라 「색」을 맞혀요.",h:"가운데 큰 글자는 색 이름이지만 다른 색으로 칠해져 있어요. 예를 들어 파란색으로 쓴 「빨강」이 나오면 「파랑」 버튼을 누르는 거예요.",r:"맞히면 +1점, 틀리면 -1점이에요(0점 아래로는 내려가지 않아요). 글자의 뜻과 색은 항상 서로 달라요.",k:"점수가 높을수록 좋은 기록이에요."},
order:{t:"숫자 순서 터치",i:"👆",g:"1부터 16까지 순서대로 가장 빨리 눌러요.",h:"시작을 누르면 16칸에 숫자가 섞여 나타나고 타이머가 돌아가요. 위쪽 「다음」에 표시된 숫자를 찾아 차례대로 누르세요.",r:"순서가 틀리면 칸이 잠깐 빨갛게 깜빡일 뿐 패널티는 없지만, 시간은 계속 흘러요. 맞힌 칸은 노란색으로 바뀌어요.",k:"완료 시간이 짧을수록 좋은 기록이에요."},
rps:{t:"가위바위보 연승",i:"✌️",g:"컴퓨터를 이기며 연승을 최대한 쌓아요.",h:"✌️(가위), ✊(바위), 🖐️(보) 중 하나를 터치하면 컴퓨터도 동시에 하나를 내요.",r:"가위는 보를, 바위는 가위를, 보는 바위를 이겨요. 비기면 다시 하고, 이기면 연승이 1 늘어나요. 지면 바로 끝나요. 컴퓨터는 무작위로 내요.",k:"연승 수가 많을수록 좋은 기록이에요."},
runner:{t:"점프 러너",i:"🏃",g:"선인장을 뛰어넘으며 최대한 멀리 달려요.",h:"시작하면 자동으로 달려요. 게임판을 터치하거나 클릭하면 점프하고, 키보드는 ↑ 키로 점프해요. (스페이스바는 다음 게임으로 넘어가는 키예요.)",r:"땅에 있을 때만 점프할 수 있어요(공중 점프는 안 돼요). 선인장에 닿으면 끝나요. 시간이 지날수록 속도가 빨라지고 선인장 간격이 좁아져요.",k:"달린 거리(m)가 길수록 좋은 기록이에요."}
};
/* 게임이 쓰는 타이머·프레임을 전부 기록해 두었다가, 게임을 떠나거나 새로 시작할 때 한꺼번에 끊어요 */
var ST=window.setTimeout.bind(window),SI=window.setInterval.bind(window);

var REG={r:[],t:[],i:[]};

window.requestAnimationFrame=function(f){return keep(REG.r,_r(f))};

function killAll(){REG.r.forEach(_cr);REG.t.forEach(_ct);REG.i.forEach(_ci);REG={r:[],t:[],i:[]}}

var ORDER=Object.keys(HELP),slides=[],cur=-1,N=ORDER.length,track,feed,busy=false,pend=null,sup=false,page=0;
function bodyOf(i){return slides[i].querySelector(".bw")}

  function render(){var h="";g.forEach(function(v){h+='<div class="t"'+(v?' style="background:hsl('+(Math.log2(v)*34%360)+',75%,72%)"':'')+'>'+(v||"")+'</div>'});bd.innerHTML=h;$("#gs").textContent=score}
  function can(){for(var i=0;i<16;i++){if(!g[i])return true;if(i%4<3&&g[i]===g[i+1])return true;if(i<12&&g[i]===g[i+4])return true}return false}
  function line(i,d){var a=[];for(var j=0;j<4;j++)a.push(d===0?i*4+j:d===1?i*4+3-j:d===2?j*4+i:(3-j)*4+i);return a}
  function mv(d){if(dead)return;var moved=false;
    for(var i=0;i<4;i++){var idx=line(i,d),vals=idx.map(function(k){return g[k]}).filter(Boolean),out=[];
      for(var j=0;j<vals.length;j++){if(vals[j]===vals[j+1]){out.push(vals[j]*2);score+=vals[j]*2;j++}else out.push(vals[j])}
      while(out.length<4)out.push(0);
      idx.forEach(function(k,j){if(g[k]!==out[j]){moved=true;g[k]=out[j]}})}
    if(!moved)return;add();render();record("g2048",score,false);upd();
    if(!can()){dead=true;$("#gm").textContent="더 움직일 수 없어요! "+score+"점"}}
  var K={ArrowLeft:0,ArrowRight:1,ArrowUp:2,ArrowDown:3};
  function kd(e){if(K[e.key]!==undefined){e.preventDefault();mv(K[e.key])}}
  window.addEventListener("keydown",kd);
  bd.addEventListener("pointerdown",function(e){sx=e.clientX;sy=e.clientY});
  bd.addEventListener("pointerup",function(e){var dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;
    if(Math.abs(dx)>Math.abs(dy))mv(dx>0?1:0);else mv(dy>0?3:2)});
  $("#gr").onclick=function(){stop();games.g2048(el,upd)};
  add();add();render();
  stop=function(){window.removeEventListener("keydown",kd)};upd();
};
/* 지뢰찾기 */
games.mine=function(el,upd){
  var R=8,M=10,N=64,mine=[],num=[],st=[],first=true,over=false,t=0,iv,fm=false,opened=0,flags=0,h="";
  for(var i=0;i<N;i++){st.push(0);h+='<button class="cell" aria-label="칸"></button>'}
  el.innerHTML='<div class="stat"><div><em>지뢰</em> <b id="mr">10</b></div><div><em>시간</em> <b id="mt">0</b>초</div></div><div class="mgrid">'+h+'</div><p class="msg" id="mm">칸을 눌러 열고, 지뢰를 피하세요</p><p style="text-align:center"><button class="btn" id="mf">모드: 열기</button> <button class="btn main" id="mn">새 게임</button></p>';
  var cs=el.querySelectorAll(".cell");
  function nb(i){var r=[],x=i%R,y=Math.floor(i/R);for(var dy=-1;dy<=1;dy++)for(var dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;var a=x+dx,b=y+dy;if(a>=0&&b>=0&&a<R&&b<R)r.push(b*R+a)}return r}
  function place(av){var c=0;while(c<M){var k=Math.floor(Math.random()*N);if(k===av||mine[k])continue;mine[k]=true;c++}
    for(var i=0;i<N;i++)num[i]=nb(i).filter(function(k){return mine[k]}).length}
  var NC=["","#2f6fd6","#2fa36b","#e5384f","#6a3fb5","#b5651d","#0e9aa7","#555","#777"];
  function paint(i){var b=cs[i];if(st[i]===1){b.className="cell o";b.textContent=num[i]||"";b.style.color=NC[num[i]]}else{b.className="cell";b.textContent=st[i]===2?"🚩":""}}
  function reveal(i){var s=[i];while(s.length){var k=s.pop();if(st[k]!==0)continue;st[k]=1;opened++;paint(k);if(!num[k])nb(k).forEach(function(n){if(st[n]===0)s.push(n)})}}
  function act(i,flag){if(over)return;
    if(flag||fm){if(st[i]===1)return;st[i]=st[i]===2?0:2;flags+=st[i]===2?1:-1;paint(i);$("#mr").textContent=M-flags;return}
    if(st[i]!==0)return;
    if(first){first=false;place(i);iv=setInterval(function(){t++;$("#mt").textContent=t},1000)}
    if(mine[i]){over=true;clearInterval(iv);for(var k=0;k<N;k++)if(mine[k]){cs[k].className="cell x";cs[k].textContent="💣"}$("#mm").textContent="💥 지뢰를 밟았어요!";return}
    reveal(i);
    if(opened===N-M){over=true;clearInterval(iv);var nb2=record("mine",t,true);upd();$("#mm").textContent=t+"초 만에 성공! "+(nb2?"새 기록이에요!":"")}}
  cs.forEach(function(b,i){b.addEventListener("click",function(){act(i,false)});b.addEventListener("contextmenu",function(e){e.preventDefault();act(i,true)})});
  $("#mf").onclick=function(){fm=!fm;this.textContent="모드: "+(fm?"깃발 🚩":"열기")};
  $("#mn").onclick=function(){stop();games.mine(el,upd)};
  stop=function(){clearInterval(iv)};upd();
};
/* 타자 연습 */
games.typing=function(el,upd){
  var W="하늘 바다 구름 나무 햇살 바람 사과 기차 노을 고양이 강아지 도서관 비행기 자전거 컴퓨터 키보드 초콜릿 아이스크림 무지개 별똥별 여행 휴가 영화관 운동장 학교 커피 우산 거울 시계 달빛 호수 겨울 여름 오렌지 수박 피아노 기타 선풍기 눈사람".split(" ");
  el.innerHTML='<div class="stat"><div><em>맞힌 단어</em> <b id="ys">0</b></div><div><em>남은 시간</em> <b id="yt">30</b></div></div><div class="word" id="yw">준비!</div><div class="row"><input id="yi" style="letter-spacing:0" placeholder="여기에 입력" autocomplete="off" disabled aria-label="입력"></div><p class="msg" id="ym">시작을 누르고 보이는 단어를 입력하세요</p><p style="text-align:center"><button class="btn main" id="yg">시작</button></p>';
  var inp=$("#yi"),score=0,left=30,cur="",run=false,iv;
  function next(){var w;do{w=W[Math.floor(Math.random()*W.length)]}while(w===cur);cur=w;$("#yw").textContent=w;inp.value=""}
  function end(){run=false;clearInterval(iv);inp.disabled=true;$("#yw").textContent="끝!";var nb=record("typing",score,false);upd();$("#ym").textContent=score+"개 입력! "+(nb?"새 기록이에요!":"");$("#yg").textContent="다시 하기";$("#yg").disabled=false}
  function chk(){if(run&&inp.value.trim()===cur){score++;$("#ys").textContent=score;next()}}
  inp.addEventListener("input",chk);inp.addEventListener("keydown",function(e){if(e.key==="Enter")chk()});
  $("#yg").onclick=function(){score=0;left=30;run=true;$("#ys").textContent=0;$("#yt").textContent=30;$("#ym").textContent="";inp.disabled=false;inp.focus();cur="";next();this.disabled=true;
    iv=setInterval(function(){left--;$("#yt").textContent=left;if(left<=0)end()},1000)};
  stop=function(){run=false;clearInterval(iv)};upd();
};
/* 색깔 맞히기 */
games.color=function(el,upd){
  var C=[["빨강","#e5384f"],["파랑","#2f6fd6"],["초록","#2fa36b"],["노랑","#e0a800"]],b="";
  C.forEach(function(c,i){b+='<button class="btn" data-i="'+i+'">'+c[0]+'</button>'});
  el.innerHTML='<div class="stat"><div><em>점수</em> <b id="cs">0</b></div><div><em>남은 시간</em> <b id="ct">20</b></div></div><div class="word big" id="cw">?</div><p class="msg" id="cm">글자의 "뜻"이 아니라 "색"을 고르세요</p><div class="opts">'+b+'</div><p style="text-align:center;margin-top:14px"><button class="btn main" id="cg">시작</button></p>';
  var score=0,left=20,ink=0,run=false,iv;
  function next(){var w=Math.floor(Math.random()*4);do{ink=Math.floor(Math.random()*4)}while(ink===w);var e=$("#cw");e.textContent=C[w][0];e.style.color=C[ink][1]}
  function end(){run=false;clearInterval(iv);$("#cw").textContent="끝!";$("#cw").style.color="";var nb=record("color",score,false);upd();$("#cm").textContent=score+"점! "+(nb?"새 기록이에요!":"");$("#cg").textContent="다시 하기";$("#cg").disabled=false}
  el.querySelectorAll(".opts .btn").forEach(function(x){x.addEventListener("pointerdown",function(e){e.preventDefault();if(!run)return;
    if(+x.dataset.i===ink){score++;$("#cm").textContent=""}else{score=Math.max(0,score-1);$("#cm").textContent="아쉬워요, -1"}
    $("#cs").textContent=score;next()})});
  $("#cg").onclick=function(){score=0;left=20;run=true;$("#cs").textContent=0;$("#ct").textContent=20;$("#cm").textContent="";this.disabled=true;next();
    iv=setInterval(function(){left--;$("#ct").textContent=left;if(left<=0)end()},1000)};
  stop=function(){run=false;clearInterval(iv)};upd();
};
/* 숫자 순서 터치 */
games.order=function(el,upd){
  var h="";for(var i=0;i<16;i++)h+='<button class="card" disabled aria-label="숫자 칸"></button>';
  el.innerHTML='<div class="stat"><div><em>다음</em> <b id="on">-</b></div><div><em>시간</em> <b id="ot">0.0</b>초</div></div><div class="grid4">'+h+'</div><p class="msg" id="om">1부터 16까지 순서대로 누르세요</p><p style="text-align:center"><button class="btn main" id="og">시작</button></p>';
  var cs=el.querySelectorAll(".card"),nx=1,t0=0,iv;
  cs.forEach(function(b){b.addEventListener("pointerdown",function(e){e.preventDefault();if(!iv||b.disabled)return;
    if(+b.textContent===nx){b.classList.add("ok");b.disabled=true;nx++;$("#on").textContent=nx>16?"-":nx;
      if(nx>16){clearInterval(iv);iv=0;var ms=Math.round(performance.now()-t0);var nb=record("order",ms,true);upd();$("#ot").textContent=(ms/1000).toFixed(1);$("#om").textContent=(ms/1000).toFixed(1)+"초! "+(nb?"새 기록이에요!":"");$("#og").disabled=false;$("#og").textContent="다시 하기"}}
    else{b.classList.add("bad");setTimeout(function(){b.classList.remove("bad")},150)}})});
  $("#og").onclick=function(){var n=[];for(var i=1;i<=16;i++)n.push(i);n.sort(function(){return Math.random()-.5});
    cs.forEach(function(b,i){b.textContent=n[i];b.className="card on";b.disabled=false});nx=1;$("#on").textContent=1;$("#om").textContent="";this.disabled=true;t0=performance.now();
    iv=setInterval(function(){$("#ot").textContent=((performance.now()-t0)/1000).toFixed(1)},100)};
  stop=function(){clearInterval(iv)};upd();
};
/* 가위바위보 연승 */
games.rps=function(el,upd){
  var E=["✌️","✊","🖐️"],N=["가위","바위","보"],streak=0,over=false;
  el.innerHTML='<div class="stat"><div><em>연승</em> <b id="rs">0</b></div></div><div class="big" id="rv">❔</div><p class="msg" id="rm">컴퓨터를 이겨서 연승을 쌓으세요</p><div class="opts" style="grid-template-columns:repeat(3,1fr)"><button class="btn" data-i="0" aria-label="가위">✌️</button><button class="btn" data-i="1" aria-label="바위">✊</button><button class="btn" data-i="2" aria-label="보">🖐️</button></div><p style="text-align:center;margin-top:14px"><button class="btn main" id="rr" hidden>다시 하기</button></p>';
  el.querySelectorAll(".opts .btn").forEach(function(b){b.addEventListener("click",function(){if(over)return;
    var me=+b.dataset.i,cp=Math.floor(Math.random()*3),r=$("#rv");r.textContent=E[me]+" vs "+E[cp];
    if(me===cp){$("#rm").textContent="비겼어요, 다시!";return}
    if((me+2)%3===cp){streak++;$("#rs").textContent=streak;$("#rm").textContent="이겼어요! 컴퓨터는 "+N[cp]}
    else{over=true;var nb=record("rps",streak,false);upd();$("#rm").textContent="졌어요! "+streak+"연승 "+(nb?"· 새 기록이에요!":"");$("#rr").hidden=false}})});
  $("#rr").onclick=function(){streak=0;over=false;$("#rs").textContent=0;$("#rv").textContent="❔";$("#rm").textContent="컴퓨터를 이겨서 연승을 쌓으세요";this.hidden=true};
  stop=function(){};upd();
};
/* 점프 러너 */
games.runner=function(el,upd){
  el.innerHTML='<div class="stat"><div><em>거리</em> <b id="ud">0</b>m</div></div><canvas id="uc" width="360" height="200"></canvas><p class="msg" id="um">화면을 터치하거나 ↑ 키로 점프하세요</p><p style="text-align:center"><button class="btn main" id="ug">시작</button></p>';
  var cv=$("#uc"),cx=cv.getContext("2d"),W=360,gy=150,y=gy,vy=0,obs=[],t=0,nx=1,run=false,raf,last,ink="#1f2a44";
  function draw(){cx.clearRect(0,0,W,200);cx.strokeStyle=ink;cx.lineWidth=2;cx.beginPath();cx.moveTo(0,gy+18);cx.lineTo(W,gy+18);cx.stroke();
    cx.font="30px serif";cx.textAlign="center";cx.textBaseline="middle";cx.fillText("🌵".repeat(0),0,0);
    obs.forEach(function(o){cx.fillText("🌵",o.x,gy)});cx.fillText("🏃",50,y)}
  function end(){run=false;draw();var d=Math.floor(t*12),nb=record("runner",d,false);upd();$("#um").textContent=d+"m 달렸어요! "+(nb?"새 기록이에요!":"");$("#ug").textContent="다시 하기";$("#ug").disabled=false}
  function frame(ts){if(!run)return;var dt=Math.min(.04,(ts-last)/1000);last=ts;t+=dt;var sp=220+t*8;
    vy+=1500*dt;y+=vy*dt;if(y>=gy){y=gy;vy=0}
    nx-=dt;if(nx<=0){obs.push({x:W+20});nx=Math.max(.75,1.6-t*.015)+Math.random()*.7}
    for(var i=obs.length-1;i>=0;i--){var o=obs[i];o.x-=sp*dt;if(o.x<-30)obs.splice(i,1);else if(Math.abs(o.x-50)<22&&y>gy-24){end();return}}
    $("#ud").textContent=Math.floor(t*12);draw();raf=requestAnimationFrame(frame)}
  function jump(){if(run&&y>=gy)vy=-560}
  function kd(e){if(e.key==="ArrowUp"){e.preventDefault();jump()}}
  window.addEventListener("keydown",kd);cv.addEventListener("pointerdown",function(e){e.preventDefault();jump()});
  $("#ug").onclick=function(){ink=getComputedStyle(document.documentElement).getPropertyValue("--ink").trim()||ink;obs=[];t=0;nx=1;y=gy;vy=0;run=true;$("#um").textContent="";this.disabled=true;last=performance.now();raf=requestAnimationFrame(frame)};
  draw();
  stop=function(){run=false;cancelAnimationFrame(raf);window.removeEventListener("keydown",kd)};upd();
};
load();init();
})();
</script>
