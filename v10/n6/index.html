<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"> <!-- 문서의 문자 인코딩을 UTF-8로 설정합니다 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 모바일 화면 크기에 맞게 반응형으로 설정합니다 -->
    <title>영어 단어 카드</title> <!-- 웹페이지의 제목을 설정합니다 -->
    
    <!-- 구글 폰트(Jua, Nanum Pen Script)를 불러옵니다 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Pen+Script&display=swap" rel="stylesheet">

    <style>
        /* ==========================================
        무드: 핑크빛 네온사인 불빛 아래 펼쳐진 아기자기한 단어장
        ========================================== */
        :root {
            --bg-color: #c738c2;       /* 배경 색상 */
            --card-color: #ff00dd;     /* 카드 및 박스 배경 색상 */
            --text-color: #ffffff;     /* 글자 색상 */
            --point-color: #2f6be0;    /* 버튼 및 강조 포인트 색상 */
        }

        /* 전체 페이지의 기본 스타일을 설정합니다 */
        body {
            font-family: 'Jua', sans-serif; /* 한글은 주아 폰트를 적용합니다 */
            background-color: var(--bg-color); /* 변수로 지정된 배경색을 사용합니다 */
            display: flex; /* 요소를 정렬하기 위해 플렉스박스를 사용합니다 */
            flex-direction: column; /* 세로 방향으로 정렬합니다 */
            align-items: center; /* 가로 가운데 정렬합니다 */
            justify-content: center; /* 세로 가운데 정렬합니다 */
            min-height: 100vh; /* 화면 전체 높이를 사용합니다 */
            margin: 0; /* 기본 여백을 없앱니다 */
            color: var(--text-color); /* 기본 글자 색상을 지정합니다 */
        }

        /* 단어 카드가 들어갈 전체 컨테이너 스타일입니다 */
        .container {
            text-align: center; /* 텍스트를 가운데로 정렬합니다 */
        }

        /* 단어 카드 박스의 3D 효과와 크기를 설정합니다 */
        .card {
            width: 320px; /* 카드의 너비를 설정합니다 */
            height: 200px; /* 카드의 높이를 설정합니다 */
            perspective: 1000px; /* 3D 입체감을 위한 원근감을 부여합니다 */
            cursor: pointer; /* 마우스 올렸을 때 손가락 모양으로 바꿉니다 */
            margin-bottom: 20px; /* 카드 아래쪽 여백을 줍니다 */
        }

        /* 카드가 뒤집히는 동작을 담당하는 내부 요소입니다 */
        .card-inner {
            position: relative; /* 위치를 기준에 맞게 설정합니다 */
            width: 100%; /* 너비를 꽉 채웁니다 */
            height: 100%; /* 높이를 꽉 채웁니다 */
            text-align: center; /* 글자를 가운데 정렬합니다 */
            transition: transform 0.6s; /* 뒤집힐 때 0.6s 동안 부드럽게 움직입니다 */
            transform-style: preserve-3d; /* 3D 공간을 유지합니다 */
            border-radius: 36px; /* 모서리를 둥글게 36px로 만듭니다 */
            box-shadow: 0 8px 16px rgba(0,0,0,0.2); /* 그림자를 넣습니다 */
        }

        /* 카드가 뒤집혔을 때의 회전 효과입니다 */
        .card.flipped .card-inner {
            transform: rotateY(180deg); /* Y축 기준으로 180도 회전합니다 */
        }

        /* 앞면과 뒷면의 공통 스타일입니다 */
        .card-front, .card-back {
            position: absolute; /* 카드가 겹쳐지도록 절대 위치를 줍니다 */
            width: 100%; /* 너비를 꽉 채웁니다 */
            height: 100%; /* 높이를 꽉 채웁니다 */
            backface-visibility: hidden; /* 뒤집혔을 때 뒷면이 보이게 숨깁니다 */
            display: flex; /* 내용을 정렬하기 위해 플렉스박스를 씁니다 */
            flex-direction: column; /* 세로 방향으로 정렬합니다 */
            align-items: center; /* 가로 가운데 정렬합니다 */
            justify-content: center; /* 세로 가운데 정렬합니다 */
            border-radius: 36px; /* 모서리를 둥글게 36px로 합니다 */
            padding: 20px; /* 내부 여백을 줍니다 */
            box-sizing: border-box; /* 패딩이 크기에 포함되도록 합니다 */
            background-color: var(--card-color); /* 카드 배경색 변수를 적용합니다 */
            color: var(--text-color); /* 글자색 변수를 적용합니다 */
        }

        /* 카드 앞면의 영어 단어 스타일입니다 */
        .card-front {
            font-family: 'Nanum Pen Script', cursive; /* 영문은 나눔손글씨 폰트를 적용합니다 */
            font-size: 52px; /* 영문 단어 크기를 키웁니다 */
        }

        /* 카드 뒷면의 스타일입니다 */
        .card-back {
            transform: rotateY(180deg); /* 미리 180도 돌려놓습니다 */
        }

        /* 뒷면의 뜻 글자 크기입니다 */
        .meaning {
            font-size: 32px; /* 뜻 글씨 크기입니다 */
            margin-bottom: 10px; /* 아래쪽 여백을 줍니다 */
        }

        /* 뒷면의 예문 글자 크기입니다 */
        .example {
            font-family: 'Nanum Pen Script', cursive; /* 예문의 영문도 나눔손글씨를 적용합니다 */
            font-size: 26px; /* 예문 글씨 크기입니다 */
            opacity: 0.95; /* 선명함을 유지합니다 */
        }

        /* 버튼과 진도 표시가 있는 영역입니다 */
        .controls {
            display: flex; /* 가로로 정렬합니다 */
            align-items: center; /* 세로 가운데 정렬합니다 */
            gap: 15px; /* 요소들 사이 간격을 줍니다 */
        }

        /* 버튼 스타일입니다 */
        button {
            padding: 10px 20px; /* 버튼 안쪽 여백입니다 */
            font-family: 'Jua', sans-serif; /* 주아 폰트를 적용합니다 */
            font-size: 18px; /* 글자 크기입니다 */
            cursor: pointer; /* 손가락 모양 커서입니다 */
            border: none; /* 테두리를 없앱니다 */
            background-color: var(--point-color); /* 포인트 색상 변수를 사용합니다 */
            color: var(--text-color); /* 글자색입니다 */
            border-radius: 18px; /* 모서리를 둥글게 합니다 */
            box-shadow: 0 4px 6px rgba(0,0,0,0.15); /* 그림자를 넣습니다 */
            transition: transform 0.1s, opacity 0.2s; /* 부드러운 효과를 줍니다 */
        }

        /* 버튼에 마우스를 올렸을 때 스타일입니다 */
        button:hover {
            opacity: 0.9; /* 살짝 투명하게 해줍니다 */
        }

        /* 버튼을 누를 때 효과입니다 */
        button:active {
            transform: scale(0.95);
        }

        /* 진도 표시 스타일입니다 */
        .progress {
            font-size: 20px; /* 글자 크기입니다 */
            color: var(--text-color); /* 글자색입니다 */
        }

        /* 스피커 버튼 스타일입니다 */
        .speak-btn {
            background: none; /* 배경을 없앱니다 */
            border: none; /* 테두리를 없앱니다 */
            font-size: 28px; /* 스피커 아이콘 크기입니다 */
            cursor: pointer; /* 손가락 모양 커서입니다 */
            margin-top: 8px; /* 위쪽 여백을 줍니다 */
            padding: 0; /* 여백을 없앱니다 */
        }

        /* 퀴즈 전체 상자 스타일입니다 */
        .quiz-container {
            margin-top: 25px; /* 위쪽 여백을 줍니다 */
            background-color: var(--card-color); /* 카드와 같은 배경색을 줍니다 */
            padding: 15px 20px; /* 안쪽 여백을 줍니다 */
            border-radius: 36px; /* 모서리를 둥글게 36px로 합니다 */
            box-shadow: 0 8px 16px rgba(0,0,0,0.2); /* 그림자를 넣습니다 */
            width: 320px; /* 카드의 너비와 맞춥니다 */
            box-sizing: border-box; /* 패딩을 크기에 포함합니다 */
            text-align: center; /* 가운데 정렬합니다 */
        }

        /* 퀴즈 질문 스타일입니다 */
        .quiz-question {
            font-size: 18px; /* 글자 크기입니다 */
            margin-bottom: 12px; /* 아래쪽 여백입니다 */
            color: var(--text-color); /* 글자 색상입니다 */
        }

        /* 보기 버튼들을 담는 공간입니다 */
        .quiz-options {
            display: grid; /* 격자 모양으로 정렬합니다 */
            grid-template-columns: 1fr 1fr; /* 2열로 나눕니다 */
            gap: 10px; /* 버튼 사이 간격입니다 */
            margin-bottom: 12px; /* 아래쪽 여백입니다 */
        }

        /* 보기 버튼 하나하나의 스타일입니다 */
        .quiz-btn {
            padding: 10px; /* 안쪽 여백입니다 */
            font-family: 'Jua', sans-serif; /* 주아 폰트를 적용합니다 */
            font-size: 16px; /* 글자 크기입니다 */
            background-color: var(--point-color); /* 포인트 색상 변수를 사용합니다 */
            color: var(--text-color); /* 글자 색상입니다 */
            border: none; /* 테두리를 없앱니다 */
            border-radius: 16px; /* 모서리를 둥글게 합니다 */
            cursor: pointer; /* 손가락 모양 커서입니다 */
        }

        /* 정답을 맞혔을 때 초록색 스타일입니다 */
        .quiz-btn.correct {
            background-color: #2ecc71 !important; /* 초록색 배경입니다 */
        }

        /* 오답을 골랐을 때 흐려지는 스타일입니다 */
        .quiz-btn.wrong {
            opacity: 0.4 !important; /* 투명하게 만듭니다 */
        }

        /* 점수판 스타일입니다 */
        .quiz-score {
            font-size: 16px; /* 글자 크기입니다 */
            color: var(--text-color); /* 글자 색상입니다 */
        }
    </style>
</head>
<body>

    <!-- 화면에 보여질 전체 구조입니다 -->
    <div class="container">
        <!-- 단어 카드 본체입니다 (클릭하면 뒤집힙니다) -->
        <div class="card" id="wordCard" onclick="toggleCard()">
            <div class="card-inner">
                <!-- 카드의 앞면 (영어 단어) -->
                <div class="card-front" id="cardFront">apple</div>
                <!-- 카드의 뒷면 (뜻, 예문, 스피커 버튼) -->
                <div class="card-back">
                    <div class="meaning" id="cardMeaning">사과</div>
                    <div class="example" id="cardExample">I eat apple.</div>
                    <!-- 스피커 버튼입니다 (이벤트가 카드로 전달되지 않게 막아줍니다) -->
                    <button class="speak-btn" onclick="speakWord(event)">🔊</button>
                </div>
            </div>
        </div>

        <!-- 이전, 다음 버튼과 진도 표시가 있는 상자입니다 -->
        <div class="controls">
            <button onclick="prevCard()">이전</button> <!-- 이전 버튼을 누르면 이전 단어로 갑니다 -->
            <div class="progress" id="progressText">1 / 10</div> <!-- 현재 진도를 보여줍니다 -->
            <button onclick="nextCard()">다음</button> <!-- 다음 버튼을 누르면 다음 단어로 갑니다 -->
        </div>

        <!-- 퀴즈 영역입니다 -->
        <div class="quiz-container" id="quizContainer">
            <div class="quiz-question" id="quizQuestion">이 단어의 뜻은?</div> <!-- 퀴즈 질문입니다 -->
            <div class="quiz-options" id="quizOptions"></div> <!-- 보기 4개가 들어갈 공간입니다 -->
            <div class="quiz-score" id="quizScore">맞은 개수: 0 | 틀린 개수: 0</div> <!-- 점수 표시입니다 -->
        </div>
    </div>

    <script>
        // ==========================================
        // [여기를 고치세요] 단어 목록을 수정하는 곳입니다.
        // 형식: { en: '영어', ko: '뜻', ex: '예문' }
        // ==========================================
        const words = [
            { en:'apple', ko:'사과', ex:'I eat apple.' },
            { en:'banana', ko:'바나나', ex:'I eat banana.' },
            { en:'orange', ko:'오렌지', ex:'I eat orange.' },
            { en:'pig', ko:'돼지', ex:'I eat the pig.' },
            { en:'earth', ko:'지구', ex:'Earth is earth.' },
            { en:'face', ko:'얼굴', ex:'Your face, my face.' },
            { en:'yellow', ko:'노랑', ex:'Pikachu is yellow.' },
            { en:'bomb', ko:'폭탄', ex:'The bomb exploded.' },
            { en:'meteorite', ko:'운석', ex:'A meteorite falls to earth.' },
            { en:'cow', ko:'소', ex:'I eat cow' }
        ];

        let currentIndex = 0; // 현재 보고 있는 단어의 번호(0부터 시작)를 저장합니다

        // 화면에 현재 단어의 정보를 보여주는 함수입니다
        function updateCard() {
            const current = words[currentIndex]; // 현재 단어 데이터를 가져옵니다
            document.getElementById('cardFront').innerText = current.en; // 앞면에 영어 단어를 넣습니다
            document.getElementById('cardMeaning').innerText = current.ko; // 뒷면에 뜻을 넣습니다
            document.getElementById('cardExample').innerText = current.ex; // 뒷면에 예문을 넣습니다
            document.getElementById('progressText').innerText = `${currentIndex + 1} / ${words.length}`; // 진도를 표시합니다
            
            // 단어가 바뀔 때 카드가 뒤집혀 있다면 앞면으로 다시 돌려놓습니다
            document.getElementById('wordCard').classList.remove('flipped');
            generateQuiz(); // 카드가 바뀔 때마다 퀴즈도 새로 만들어줍니다
        }

        // 카드를 클릭했을 때 뒤집거나 원래대로 돌리는 함수입니다
        function toggleCard() {
            const card = document.getElementById('wordCard');
            card.classList.toggle('flipped'); // 'flipped' 클래스를 넣었다 뺐다 합니다
        }

        // 다음 버튼을 눌렀을 때 실행되는 함수입니다
        function nextCard() {
            if (currentIndex < words.length - 1) {
                currentIndex++; // 다음 단어로 번호를 1 증가시킵니다
                updateCard(); // 화면을 업데이트합니다
            } else {
                alert('마지막 단어입니다!'); // 마지막 단어일 때 안내창을 띄웁니다
            }
        }

        // 이전 버튼을 눌렀을 때 실행되는 함수입니다
        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--; // 이전 단어로 번호를 1 감소시킵니다
                updateCard(); // 화면을 업데이트합니다
            } else {
                alert('첫 번째 단어입니다!'); // 첫 번째 단어일 때 안내창을 띄웁니다
            }
        }

        // 영어 단어를 소리로 읽어주는 함수입니다
        function speakWord(event) {
            event.stopPropagation(); // 버튼을 누를 때 카드가 뒤집히는 동작을 막습니다

            // 브라우저가 음성 기능을 지원하는지 확인합니다
            if (!('speechSynthesis' in window)) {
                alert('이 브라우저는 소리를 지원하지 않아요');
                return;
            }

            const current = words[currentIndex]; // 현재 단어 정보를 가져옵니다
            const utterance = new SpeechSynthesisUtterance(current.en); // 읽을 영어 단어를 설정합니다
            utterance.lang = 'en-US'; // 영어 발음으로 설정합니다
            utterance.rate = 0.8; // 말하는 속도를 조금 느리게(0.8배속) 설정합니다

            window.speechSynthesis.cancel(); // 이전에 말하던 내용이 있으면 멈춥니다
            window.speechSynthesis.speak(utterance); // 소리로 읽어줍니다
        }

        let correctCount = 0; // 맞은 개수를 저장합니다
        let wrongCount = 0; // 틀린 개수를 저장합니다
        let isAnswered = false; // 이미 정답을 골랐는지 확인하는 변수입니다

        // 현재 단어에 대한 4지선다 퀴즈를 만드는 함수입니다
        function generateQuiz() {
            isAnswered = false; // 풀기 전 상태로 초기화합니다
            const currentWord = words[currentIndex];
            const optionsContainer = document.getElementById('quizOptions');
            optionsContainer.innerHTML = ''; // 이전 보기들을 지웁니다

            // 현재 단어의 뜻(정답)을 포함합니다
            let choices = [currentWord.ko];

            // 전체 단어 중 정답이 아닌 것들만 골라냅니다
            let otherWords = words.filter(w => w.ko !== currentWord.ko);
            // 무작위로 섞어줍니다
            otherWords.sort(() => Math.random() - 0.5);

            // 오답 3개를 골라 목록에 추가합니다
            for (let i = 0; i < 3 && i < otherWords.length; i++) {
                choices.push(otherWords[i].ko);
            }

            // 보기 4개를 무작위로 다시 섞어줍니다
            choices.sort(() => Math.random() - 0.5);

            // 화면에 4개의 보기 버튼을 생성합니다
            choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = 'quiz-btn';
                btn.innerText = choice;
                // 버튼을 누를 때 정답인지 확인하는 함수를 연결합니다
                btn.onclick = () => checkAnswer(choice, currentWord.ko, btn);
                optionsContainer.appendChild(btn);
            });
        }

        // 사용자가 보기를 골랐을 때 정답 여부를 확인하는 함수입니다
        function checkAnswer(selected, correct, clickedBtn) {
            if (isAnswered) return; // 이미 골랐다면 중복 클릭을 막습니다
            isAnswered = true;

            const allBtns = document.querySelectorAll('.quiz-btn');

            if (selected === correct) {
                clickedBtn.classList.add('correct'); // 정답이면 초록색으로 바꿉니다
                correctCount++; // 맞은 개수를 1 증가시킵니다
            } else {
                clickedBtn.classList.add('wrong'); // 틀리면 흐리게 만듭니다
                wrongCount++; // 틀린 개수를 1 증가시킵니다
                // 정답 버튼도 찾아내어 초록색으로 표시해줍니다
                allBtns.forEach(btn => {
                    if (btn.innerText === correct) {
                        btn.classList.add('correct');
                    }
                });
            }

            // 점수 판에 맞은 개수와 틀린 개수를 업데이트합니다
            document.getElementById('quizScore').innerText = `맞은 개수: ${correctCount} | 틀린 개수: ${wrongCount}`;
        }

        // 웹페이지가 처음 열릴 때 첫 번째 단어를 보여줍니다
        updateCard();
    </script>
</body>
</html>
