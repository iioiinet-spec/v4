<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카페 키우기 타이쿤 - 리얼 시네마틱 갤럭시</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Malgun Gothic', sans-serif;
        }
        body {
            /* 현실적인 우주 깊은 밤의 성운 배경 */
            background: radial-gradient(circle at 50% 50%, #1a103c 0%, #080314 70%, #020005 100%);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            overflow-x: hidden;
        }
        .game-container {
            width: 100%;
            max-width: 600px;
            background: rgba(15, 12, 30, 0.9);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(110, 64, 201, 0.4);
            text-align: center;
            border: 1px solid rgba(179, 136, 255, 0.3);
        }
        h1 {
            font-size: 24px;
            color: #00e5ff;
            margin-bottom: 3px;
            text-shadow: 0 0 15px rgba(0, 229, 255, 0.6);
            letter-spacing: 1px;
        }
        .prestige-info {
            font-size: 12px;
            color: #ff79c6;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .level-badge {
            display: inline-block;
            background: linear-gradient(135deg, #4a148c, #7b1fa2);
            color: white;
            padding: 5px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(123, 31, 162, 0.5);
            border: 1px solid #ba68c8;
        }
        
        /* 현실감 있는 시네마틱 우주선 뷰포트 (창문 모양) */
        .cafe-display-box {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            align-items: center;
        }
        .cafe-card {
            flex: 1;
            background: linear-gradient(145deg, #1f1b2c, #130f1d);
            border: 1px solid #4a3b6c;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            text-align: left;
        }
        .cafe-image-container {
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, #22123f 0%, #05020a 100%);
            border: 3px solid #7c4dff;
            border-radius: 50% / 40%; /* 둥근 우주선 관측창(포탈) 형태 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 20px rgba(124, 77, 255, 0.8), 0 0 15px rgba(0, 229, 255, 0.3);
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }
        
        /* 고화질 CSS 실사 느낌의 그래픽 심볼 */
        .space-visual {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffb300, #ff5722);
            box-shadow: 0 0 15px #ff5722, inset -5px -5px 15px rgba(0,0,0,0.6);
            margin-bottom: 8px;
            animation: cinematicPulse 4s ease-in-out infinite alternate;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }
        @keyframes cinematicPulse {
            0% { transform: scale(1) rotate(0deg); filter: brightness(1); }
            100% { transform: scale(1.05) rotate(5deg); filter: brightness(1.2); }
        }

        .cafe-img-label {
            font-size: 10px;
            font-weight: bold;
            color: #00e5ff;
            background: rgba(0, 0, 0, 0.7);
            padding: 2px 8px;
            border-radius: 10px;
            border: 1px solid rgba(0, 229, 255, 0.4);
            letter-spacing: -0.5px;
        }

        .cafe-title {
            font-size: 17px;
            font-weight: bold;
            color: #ffeb3b;
            margin-bottom: 4px;
        }
        .cafe-desc {
            font-size: 11px;
            color: #d1c4e9;
            margin-bottom: 6px;
            line-height: 1.3;
        }
        .menu-list {
            font-size: 10px;
            color: #00e5ff;
            background: #0b0714;
            padding: 6px 8px;
            border-radius: 6px;
            font-weight: bold;
            border: 1px solid #311b92;
        }

        .stats-box {
            display: flex;
            justify-content: space-around;
            background: #19122c;
            border: 1px solid #512da8;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: inset 0 0 10px rgba(81, 45, 168, 0.3);
        }
        .stat-item {
            font-size: 13px;
            font-weight: bold;
            color: #ffeb3b;
        }
        .click-btn {
            width: 100%;
            background: linear-gradient(145deg, #00b0ff, #0077c2);
            color: white;
            border: none;
            padding: 16px;
            font-size: 17px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 176, 255, 0.4), 0 4px 0 #01579b;
            transition: all 0.05s ease;
            margin-bottom: 12px;
        }
        .click-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 8px rgba(0, 176, 255, 0.4), 0 0 0 #01579b;
        }
        .click-btn.fever {
            background: linear-gradient(145deg, #ffea00, #ff6f00);
            color: #1a1a2e;
            box-shadow: 0 6px 25px rgba(255, 234, 0, 0.7), 0 4px 0 #e65100;
        }

        .section-title {
            font-size: 13px;
            font-weight: bold;
            color: #b388ff;
            margin: 10px 0 6px 0;
            text-align: left;
            border-bottom: 2px solid #4a3b6c;
            padding-bottom: 3px;
        }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
            margin-bottom: 10px;
        }
        .sub-btn {
            background: linear-gradient(145deg, #7c4dff, #512da8);
            color: #fff;
            border: none;
            padding: 10px 5px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(124, 77, 255, 0.3), 0 2px 0 #311b92;
        }
        .sub-btn:active { transform: translateY(2px); box-shadow: none; }
        .sub-btn:disabled { background: #221e30; color: #615a75; box-shadow: none; cursor: not-allowed; }

        .upgrade-btn {
            width: 100%;
            background: linear-gradient(145deg, #00e676, #00c853);
            color: #0b0714;
            border: none;
            padding: 13px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 230, 118, 0.4), 0 3px 0 #009624;
            margin-bottom: 8px;
        }
        .upgrade-btn:active { transform: translateY(3px); box-shadow: none; }
        .upgrade-btn:disabled { background: #221e30; color: #615a75; box-shadow: none; cursor: not-allowed; }

        .prestige-btn {
            width: 100%;
            background: linear-gradient(145deg, #ff4081, #c51162);
            color: white;
            border: none;
            padding: 10px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 64, 129, 0.3), 0 3px 0 #880e4f;
        }

        .message-log {
            margin-top: 12px;
            font-size: 12px;
            font-weight: bold;
            color: #00e676;
            background: #0b0714;
            border: 1px dashed #7c4dff;
            padding: 10px;
            border-radius: 8px;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .vip-banner {
            display: none;
            background: linear-gradient(135deg, #ff1744, #b71c1c);
            color: white;
            padding: 8px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 12px;
            cursor: pointer;
            box-shadow: 0 0 15px #ff1744;
            animation: pulseVip 0.7s infinite alternate;
        }
        @keyframes pulseVip {
            0% { transform: scale(1); }
            100% { transform: scale(1.02); }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>🌌 시네마틱 갤럭시 카페</h1>
        <div id="prestigeInfo" class="prestige-info">⭐ 우주 차원 버프: +0% | 외계 디저트 개발: 0/11단계</div>
        <div id="levelBadge" class="level-badge">Level 1: 행성 개척 자판기</div>

        <div id="vipBanner" class="vip-banner" onclick="claimVip()">😈 [외계 마왕 VIP 강림!] 클릭해서 어둠의 막대한 보너스 획득! 😈</div>

        <!-- 실사 느낌의 우주선 관측창 뷰포트 -->
        <div class="cafe-display-box">
            <div class="cafe-card">
                <div id="cafeTitle" class="cafe-title">행성 개척 자판기</div>
                <div id="cafeDesc" class="cafe-desc">외계 행성 모래사장에 놓인 자판기와 낡은 테이블.</div>
                <div id="menuList" class="menu-list">판매 메뉴: 우주 믹스커피, 플라스마 온수</div>
            </div>
            <div class="cafe-image-container">
                <div id="spaceVisual" class="space-visual">🪐</div>
                <div id="cafeImgLabel" class="cafe-img-label">관측창 뷰</div>
            </div>
        </div>

        <div class="stats-box">
            <div class="stat-item">💰 우주 재화: <span id="money">0</span> 코인</div>
            <div class="stat-item">⚡ 초당 수입: <span id="eps">0</span> 코인/초</div>
        </div>

        <button id="clickBtn" class="click-btn" onclick="makeCoffee()">☕ 외계인 손님에게 커피 판매! (+<span id="clickPower">10</span>)</button>

        <div class="section-title">🛠️ 경영 및 성간 디저트 합성</div>
        <div class="action-grid">
            <button id="hireBtn" class="sub-btn" onclick="hireStaff()">👽 외계인알바<br>(<span id="hireCost">50</span>)</button>
            <button id="menuResearchBtn" class="sub-btn" onclick="researchMenu()">🪐 성간연구<br>(<span id="researchCost">150</span>)</button>
            <button id="gachaBtn" class="sub-btn" onclick="gachaDessert()">🌠 외계디저트<br>(<span id="gachaCost">500</span>)</button>
        </div>

        <button id="upgradeBtn" class="upgrade-btn" onclick="upgradeLevel()">⬆️ 우주선 웜홀 진화! (필요: <span id="upgradeCost">100</span>코인)</button>
        <button class="prestige-btn" onclick="doPrestige()">🔄 우주 차원 환생 (수익 영구 배증)</button>

        <div id="messageLog" class="message-log">실사형 우주 관측창을 통해 광활한 은하계를 항해해 보세요!</div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq, type, duration) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        const levels = [
            { level: 1, name: "행성 개척 자판기", desc: "외계 행성 모래사장에 놓인 자판기와 낡은 테이블.", menu: "우주 믹스커피, 플라스마 온수", cost: 100, power: 10, symbol: "🏜️", label: "황량한 행성" },
            { level: 2, name: "운석 테이크아웃 포탈", desc: "떠돌이 운석 기지 벽면에 뚫린 은하수 창구.", menu: "블랙홀 아메리카노, 에스프레소", cost: 500, power: 25, symbol: "☄️", label: "운석 기지" },
            { level: 3, name: "스타더스트 아담한 돔 카페", desc: "유리 돔 안에 지어진 포근한 우주 정거장 카페.", menu: "안드로메다 라떼, 초코 문케이크", cost: 2000, power: 70, symbol: "🌐", label: "유리 돔 카페" },
            { level: 4, name: "네온 사이버 베이커리", desc: "빛나는 네온사인이 감싸는 사이버펑크 외곽 매장.", menu: "플라즈마 샌드위치, 크루아상 에이드", cost: 8000, power: 200, symbol: "🏙️", label: "사이버 도시" },
            { level: 5, name: "반중력 로스터리 정거장", desc: "무중력 상태에서 원두를 볶아내는 최첨단 연구소.", menu: "싱글오리진 네뷸라, 콜드브루 크리스탈", cost: 30000, power: 550, symbol: "🛰️", label: "로스터리 위성" },
            { level: 6, name: "우주 정거장 2층 테라스", desc: "지구가 내려다보이는 우주 정거장의 테라스 구역.", menu: "초신성 팬케이크, 아포가토 플레어", cost: 120000, power: 1500, symbol: "🪐", label: "토성 테라스" },
            { level: 7, name: "은하계 아카이브 북카페", desc: "고대 우주 지식과 홀로그램 책장이 가득한 공간.", menu: "스타더스트 허브티, 유기농 스콘", cost: 500000, power: 4000, symbol: "📖", label: "은하 도서관" },
            { level: 8, name: "루프탑 성운 야경 카페", desc: "형형색색의 오색 성운을 감상하는 최고급 루프탑.", menu: "논알콜 갤럭틱 칵테일, 은하수 빙수", cost: 2000000, power: 10000, symbol: "🌌", label: "오색 성운" },
            { level: 9, name: "메가 코어 프랜차이즈 본사", desc: "은하계 무역 중심지에 세워진 거대 메가 코어 빌딩.", menu: "자체 굿즈, 시즌 한정 프라페, 프리미엄 혜성 디저트", cost: 10000000, power: 25000, symbol: "🏢", label: "메가 코어사" },
            { level: 10, name: "인터스텔라 글로벌 브랜드", desc: "여러 은하계를 연결하는 초대형 성간 항해 사옥.", menu: "멀버스 프리미엄 찻잎, 한정판 블랙홀 원두", cost: 50000000, power: 70000, symbol: "🌍", label: "인터스텔라 타워" },
            { level: 11, name: "성간 우주 항해 카페 - 갤럭시 오아시스", desc: "시공간을 자유롭게 넘나드는 궁극의 우주선 카페!", menu: "오로라 코어 에이드, 신들의 블랙홀 커피", cost: 0, power: 200000, symbol: "🚀", label: "갤럭시 호" }
        ];

        const dessertList = [
            "1단계: 달콤 촉촉 외계인 초코 머핀",
            "2단계: 부드러운 성운 조각 케이크",
            "3단계: 바삭바삭 문스톤 버터 쿠키",
            "4단계: 겹겹이 고소한 플라즈마 크루아상",
            "5단계: 상큼달콤 초신성 타르트",
            "6단계: 폭신폭신 무중력 팬케이크",
            "7단계: 진한 풍미의 블랙홀 치즈케이크",
            "8단계: 시원하고 달콤한 은하수 빙수",
            "9단계: 프리미엄 크리스탈 마카롱 6종",
            "10단계: 황금빛 다이아몬드 코어 케이크",
            "11단계: 마왕이 탐내는 '오로라 갤럭틱 디저트'"
        ];

        let currentLevelIndex = 0;
        let money = 0;
        let staffCount = 0;
        let staffCost = 50;
        let researchCount = 0;
        let researchCost = 150;
        let dessertLevel = 0;
        let gachaCost = 500;
        let prestigeLevel = 0;
        
        let isFeverTime = false;
        let feverTimer = 0;
        let vipActive = false;

        function getMultiplier() {
            return 1 + (prestigeLevel * 0.5) + (dessertLevel * 0.25);
        }

        function getEarningsPerSecond() {
            return Math.floor(staffCount * (4 + researchCount * 4) * getMultiplier());
        }

        function updateUI() {
            const current = levels[currentLevelIndex];
            
            document.getElementById("prestigeInfo").innerText = `⭐ 우주 차원 버프: +${prestigeLevel * 50}% | 외계 디저트: ${dessertLevel}/11단계`;
            document.getElementById("levelBadge").innerText = `Level ${current.level}: ${current.name}`;
            document.getElementById("cafeTitle").innerText = current.name;
            document.getElementById("cafeDesc").innerText = current.desc;
            document.getElementById("menuList").innerText = `판매 메뉴: ${current.menu}`;
            
            document.getElementById("spaceVisual").innerText = current.symbol;
            document.getElementById("cafeImgLabel").innerText = current.label;

            document.getElementById("money").innerText = Math.floor(money).toLocaleString();
            
            let basePower = (current.power + (researchCount * 10)) * getMultiplier();
            let finalPower = isFeverTime ? basePower * 5 : basePower;
            document.getElementById("clickPower").innerText = Math.floor(finalPower).toLocaleString();
            document.getElementById("eps").innerText = getEarningsPerSecond().toLocaleString();

            document.getElementById("hireCost").innerText = staffCost.toLocaleString();
            document.getElementById("researchCost").innerText = researchCost.toLocaleString();
            document.getElementById("gachaCost").innerText = dessertLevel < 11 ? gachaCost.toLocaleString() : "MAX";

            document.getElementById("hireBtn").disabled = money < staffCost;
            document.getElementById("menuResearchBtn").disabled = money < researchCost;
            document.getElementById("gachaBtn").disabled = money < gachaCost || dessertLevel >= 11;

            const upgradeBtn = document.getElementById("upgradeBtn");
            if (currentLevelIndex < levels.length - 1) {
                document.getElementById("upgradeCost").innerText = levels[currentLevelIndex + 1].cost.toLocaleString();
                upgradeBtn.disabled = money < levels[currentLevelIndex + 1].cost;
            } else {
                upgradeBtn.innerText = "🎉 은하계 항해 마스터 완료!";
                upgradeBtn.disabled = true;
            }
        }

        function makeCoffee() {
            playSound(587.33, 'sine', 0.1);
            const current = levels[currentLevelIndex];
            let basePower = (current.power + (researchCount * 10)) * getMultiplier();
            let finalPower = isFeverTime ? basePower * 5 : basePower;
            money += finalPower;
            
            if (!isFeverTime && Math.random() < 0.05) {
                triggerFeverTime();
            }

            const alienDialogues = [
                "👽 '이 지구식 커피, 아주 신비로운 맛이군!'",
                "🛸 '외계 행성 검문소를 통과할 원동력이 생겼다!'",
                "✨ '블랙홀보다 진한 풍미가 느껴지는군!'",
                "👾 '내 촉수가 이 커피 맛에 반해버렸어!'"
            ];
            let msg = alienDialogues[Math.floor(Math.random() * alienDialogues.length)];
            if (isFeverTime) msg = "🔥 [초신성 피버타임 폭발!] " + msg;

            document.getElementById("messageLog").innerText = msg + ` (+${Math.floor(finalPower).toLocaleString()} 코인)`;
            updateUI();
        }

        function triggerFeverTime() {
            isFeverTime = true;
            feverTimer = 10;
            document.getElementById("clickBtn").classList.add("fever");
            document.getElementById("messageLog").innerText = "🌟 초신성 폭발! 10초 동안 클릭 수익 5배 폭등!";
            
            let feverInterval = setInterval(() => {
                feverTimer--;
                if (feverTimer <= 0) {
                    isFeverTime = false;
                    document.getElementById("clickBtn").classList.remove("fever");
                    document.getElementById("messageLog").innerText = "☕ 피버 타임 종료!";
                    clearInterval(feverInterval);
                    updateUI();
                }
            }, 1000);
        }

        setInterval(() => {
            if (!vipActive && Math.random() < 0.4) {
                vipActive = true;
                document.getElementById("vipBanner").style.display = "block";
            }
        }, 15000);

        function claimVip() {
            playSound(880, 'triangle', 0.15);
            let bonus = Math.floor(((levels[currentLevelIndex].power + (researchCount * 10)) * 30) * getMultiplier());
            money += bonus;
            vipActive = false;
            document.getElementById("vipBanner").style.display = "none";
            document.getElementById("messageLog").innerText = `😈 [외계 마왕 강림!] 어둠의 통치자가 암흑 보너스 +${bonus.toLocaleString()} 코인을 던져주고 떠났습니다!`;
            updateUI();
        }

        function hireStaff() {
            if (money >= staffCost) {
                playSound(440, 'sine', 0.1);
                money -= staffCost;
                staffCount++;
                staffCost = Math.floor(staffCost * 1.4);
                document.getElementById("messageLog").innerText = `👽 유능한 외계인 알바생 영입 완료! (총 ${staffCount}명 근무 중)`;
                updateUI();
            }
        }

        function researchMenu() {
            if (money >= researchCost) {
                playSound(523.25, 'sine', 0.1);
                money -= researchCost;
                researchCount++;
                researchCost = Math.floor(researchCost * 1.55);
                document.getElementById("messageLog").innerText = `🪐 성간 커피 과학 연구 성공! 생산 효율 대폭 증가!`;
                updateUI();
            }
        }

        function gachaDessert() {
            if (money >= gachaCost && dessertLevel < 11) {
                playSound(659.25, 'square', 0.15);
                money -= gachaCost;
                dessertLevel++;
                gachaCost = Math.floor(gachaCost * 2.2);
                let acquired = dessertList[dessertLevel - 1];
                document.getElementById("messageLog").innerText = `🌠 [외계 디저트 개발 완료!] ${acquired} (모든 수익 영구 증가!)`;
                updateUI();
            }
        }

        function upgradeLevel() {
            if (currentLevelIndex < levels.length - 1) {
                const nextCost = levels[currentLevelIndex + 1].cost;
                if (money >= nextCost) {
                    playSound(783.99, 'sine', 0.2);
                    money -= nextCost;
                    currentLevelIndex++;
                    document.getElementById("messageLog").innerText = `🌟 웜홀을 통과하여 [${levels[currentLevelIndex].name}] (으)로 진화했습니다!`;
                    updateUI();
                }
            }
        }

        function doPrestige() {
            if (confirm("우주 차원 환생을 진행하시겠습니까? 코인과 레벨이 초기화되지만, 영구적인 차원 버프를 획득하고 새로운 은하계에서 시작합니다!")) {
                playSound(1046.50, 'triangle', 0.3);
                prestigeLevel++;
                currentLevelIndex = 0;
                money = 0;
                staffCount = 0;
                staffCost = 50;
                researchCount = 0;
                researchCost = 150;
                document.getElementById("messageLog").innerText = `🔄 차원 이동 성공! 은하계 마스터 레벨 ${prestigeLevel} 달성!`;
                updateUI();
            }
        }

        setInterval(function() {
            let eps = getEarningsPerSecond();
            if (eps > 0) {
                money += eps;
                updateUI();
            }
        }, 1000);

        updateUI();
    </script>
</body>
</html>
