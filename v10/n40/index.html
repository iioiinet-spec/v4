<!DOCTYPE html>
<html lang="ko">
<head>
    <!-- 문서의 문자셋을 UTF-8로 설정하여 한글이 깨지지 않게 합니다 -->
    <meta charset="UTF-8">
    <!-- 모바일 기기 화면 크기에 맞게 반응하도록 뷰포트를 설정합니다 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 웹페이지의 제목을 설정합니다 -->
    <title>영어 단어 카드 학습기</title>
    <!-- 구글 폰트(Noto Serif KR)를 불러오는 링크 태그입니다 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
    <!-- 디자인(CSS)을 지정하는 스타일 태그 시작입니다 -->
    <style>
        /* CSS 변수를 정의하는 `:root` 시작입니다. 색상을 한눈에 관리할 수 있습니다 */
        :root {
            --bg-color: #f5f3ee;      /* 전체 배경 색상 */
            --card-color: #ffffff;    /* 카드 배경 색상 */
            --text-color: #1d1b18;    /* 기본 글자 색상 */
            --point-color: #8a2f26;   /* 강조 포인트 색상 */
        }

        /* 전체 페이지의 기본 글꼴(본명조)과 정렬, 배경색을 지정합니다 */
        body {
            font-family: 'Noto Serif KR', serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* 메인 제목의 색상과 크기를 설정합니다 */
        h1 {
            color: var(--text-color);
            margin-bottom: 20px;
            font-weight: 700;
        }

        /* 카드가 뒤집히는 3D 효과를 주기 위한 원근법 설정입니다 */
        .card-container {
            perspective: 1000px;
            width: 360px;
            height: 220px;
            margin-bottom: 20px;
        }

        /* 실제 카드의 크기와 3D 애니메이션 속성을 설정합니다 */
        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            cursor: pointer;
        }

        /* 카드가 뒤집혔을 때(flipped 클래스가 있을 때) 180도 회전시킵니다 */
        .card.flipped {
            transform: rotateY(180deg);
        }

        /* 카드 앞면과 뒷면의 공통 디자인 속성입니다 (모서리 둥글기 0px 적용) */
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 0px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 20px;
            box-sizing: border-box;
            border: 1px solid #e2ddd5;
        }

        /* 카드 앞면의 배경색과 글자 크기를 설정합니다 */
        .card-front {
            background-color: var(--card-color);
            color: var(--text-color);
            font-size: 28px;
            font-weight: bold;
            text-align: center;
        }

        /* 카드 뒷면의 배경색과 글자 정렬을 설정합니다 (기본적으로 180도 뒤집혀 있음) */
        .card-back {
            background-color: var(--card-color);
            color: var(--text-color);
            transform: rotateY(180deg);
            text-align: center;
        }

        /* 뒷면의 뜻 글자 크기를 설정합니다 */
        .card-back .meaning {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
            line-height: 1.4;
            color: var(--text-color);
        }

        /* 뒷면의 예문 글자 크기와 색상을 설정합니다 */
        .card-back .example {
            font-size: 15px;
            opacity: 0.8;
            font-style: italic;
            color: var(--text-color);
        }

        /* 버튼들을 감싸는 영역의 정렬을 설정합니다 */
        .button-group {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 15px;
        }

        /* 이전, 다음 버튼의 디자인과 마우스 효과를 설정합니다 (모서리 0px, 포인트 색상 적용) */
        button {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background-color: var(--point-color);
            color: white;
            border: none;
            border-radius: 0px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: opacity 0.2s;
            font-family: 'Noto Serif KR', serif;
        }

        /* 버튼에 마우스를 올렸을 때 투명도를 살짝 조절합니다 */
        button:hover {
            opacity: 0.85;
        }

        /* 진도 표시(예: 3 / 20)의 글자 크기와 색상을 설정합니다 */
        #progress {
            font-size: 18px;
            font-weight: bold;
            color: var(--text-color);
        }

        /* 스피커 버튼의 디자인과 위치를 설정합니다 */
        .speaker-btn {
            margin-top: 15px;
            padding: 6px 14px;
            font-size: 14px;
            background-color: var(--bg-color);
            color: var(--point-color);
            border: 1px solid var(--point-color);
            border-radius: 0px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            font-family: 'Noto Serif KR', serif;
        }

        /* 스피커 버튼에 마우스를 올렸을 때 색상이 바뀌게 합니다 */
        .speaker-btn:hover {
            background-color: var(--point-color);
            color: white;
        }

        /* 퀴즈 영역의 전체적인 배치와 크기를 설정합니다 */
        .quiz-container {
            margin-top: 20px;
            background-color: var(--card-color);
            padding: 15px 25px;
            border-radius: 0px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            text-align: center;
            width: 360px;
            box-sizing: border-box;
            border: 1px solid #e2ddd5;
        }

        /* 퀴즈 질문의 글자 크기와 색상을 설정합니다 */
        .quiz-question {
            font-size: 16px;
            font-weight: bold;
            color: var(--text-color);
            margin-bottom: 10px;
        }

        /* 4개의 보기 버튼을 2x2 그리드 모양으로 배치합니다 */
        .quiz-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
        }

        /* 퀴즈 보기 버튼의 기본 디자인을 설정합니다 */
        .quiz-btn {
            padding: 8px 10px;
            font-size: 13px;
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid #dcd6cb;
            border-radius: 0px;
            cursor: pointer;
            transition: background-color 0.2s;
            font-family: 'Noto Serif KR', serif;
        }

        /* 보기 버튼에 마우스를 올렸을 때 색상이 바뀌게 합니다 */
        .quiz-btn:hover {
            background-color: #eae5dc;
        }

        /* 정답을 맞혔을 때 버튼을 포인트 색상으로 바꿉니다 */
        .quiz-btn.correct {
            background-color: var(--point-color) !important;
            color: white !important;
            border-color: var(--point-color) !important;
        }

        /* 오답을 골랐을 때 버튼을 흐리게(투명하게) 만듭니다 */
        .quiz-btn.wrong {
            opacity: 0.3;
        }

        /* 맞은 개수와 틀린 개수 점수의 글자 크기를 설정합니다 */
        .quiz-score {
            font-size: 14px;
            color: var(--text-color);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- 화면에 표시될 메인 제목입니다 -->
    <h1>영어 단어 카드</h1>

    <!-- 카드가 움직이는 공간을 감싸는 상자입니다 -->
    <div class="card-container">
        <!-- 클릭하면 뒤집히는 카드 상자입니다 -->
        <div class="card" id="wordCard" onclick="flipCard()">
            <!-- 카드의 앞면 (영어 단어 표시) -->
            <div class="card-face card-front" id="cardFront">apple</div>
            <!-- 카드의 뒷면 (뜻과 예문 표시) -->
            <div class="card-face card-back">
                <div class="meaning" id="cardMeaning">사과</div>
                <div class="example" id="cardExample">I eat an apple.</div>
                <!-- 스피커 버튼: 누르면 영어 단어를 읽어줍니다. 이벤트 버블링을 막아 카드가 뒤집히는 것을 방지합니다 -->
                <button class="speaker-btn" onclick="event.stopPropagation(); speakWord()">🔊 듣기</button>
            </div>
        </div>
    </div>

    <!-- 이전/다음 버튼과 진도 표시를 담고 있는 영역입니다 -->
    <div class="button-group">
        <button onclick="prevCard()">이전</button>
        <span id="progress">1 / 10</span>
        <button onclick="nextCard()">다음</button>
    </div>

    <!-- 단어 뜻 퀴즈를 표시하는 영역입니다 -->
    <div class="quiz-container">
        <!-- 퀴즈 안내 질문입니다 -->
        <div class="quiz-question">이 단어의 뜻은?</div>
        <!-- 4개의 보기 버튼이 들어갈 자리입니다 -->
        <div class="quiz-options" id="quizOptions"></div>
        <!-- 정답과 오답 개수를 세어 보여주는 영역입니다 -->
        <div class="quiz-score">맞은 개수: <span id="correctCount">0</span> | 틀린 개수: <span id="wrongCount">0</span></div>
    </div>

    <!-- 자바스크립트 코드 시작입니다 -->
    <script>
        // ==========================================
        // [여기만 고치세요] 단어 목록을 수정하거나 추가할 수 있습니다.
        // 형식: { en: '영어', ko: '뜻', ex: '예문' }
        // ==========================================
        const wordList = [
            { en:'Alleviates', ko:'(고통·문제 등을) 완화하다, 줄여주다', ex:'This medicine alleviates pain.' },
            { en:'Crucial', ko:'중대한, 결정적인', ex:'It is a crucial decision.' },
            { en:'Ambiguous', ko:'모호한, 애매한', ex:'His answer was ambiguous.' },
            { en:'Acknowledge', ko:'(사실·권위 등을) 인정하다, (감사를) 표하다', ex:'I acknowledge my mistake.' },
            { en:'Substantial', ko:'상당한', ex:'We made substantial progress.' },
            { en:'Reluctant', ko:'꺼리는, 마지못해 하는', ex:'She is reluctant to leave.' },
            { en:'Imply', ko:'암시하다, 은근히 나타내다', ex:'Her smile implied agreement.' },
            { en:'Diverse', ko:'다양한, 다른', ex:'They have diverse interests.' },
            { en:'Implement', ko:'(계획·정책 등을) 시행하다, 실행하다', ex:'We will implement the plan.' },
            { en:'Tackle', ko:'(문제·어려움을) 다루다, 해결하려 들다', ex:'We must tackle this issue.' }
        ];

        // 현재 보고 있는 카드의 번호를 저장하는 변수입니다 (처음엔 0번 카드)
        let currentIndex = 0;

        // 카드가 뒤집힌 상태인지 확인하는 변수입니다 (거짓 = 앞면)
        let isFlipped = false;

        // 맞은 개수와 틀린 개수를 저장하는 변수입니다
        let correctScore = 0;
        let wrongScore = 0;
        // 사용자가 퀴즈를 풀었는지 확인하는 변수입니다
        let isAnswered = false;

        // 화면의 HTML 요소들을 자바스크립트에서 조작하기 위해 가져옵니다
        const wordCard = document.getElementById('wordCard');
        const cardFront = document.getElementById('cardFront');
        const cardMeaning = document.getElementById('cardMeaning');
        const cardExample = document.getElementById('cardExample');
        const progress = document.getElementById('progress');
        const quizOptions = document.getElementById('quizOptions');
        const correctCount = document.getElementById('correctCount');
        const wrongCount = document.getElementById('wrongCount');

        // 화면에 현재 단어 정보를 그려주는 함수입니다
        function updateCard() {
            // 만약 카드가 뒤집혀 있다면 먼저 앞면으로 돌려줍니다
            if (isFlipped) {
                wordCard.classList.remove('flipped');
                isFlipped = false;
            }

            // 현재 번호에 맞는 영어 단어, 뜻, 예문을 화면에 넣습니다
            cardFront.textContent = wordList[currentIndex].en;
            cardMeaning.textContent = wordList[currentIndex].ko;
            cardExample.textContent = wordList[currentIndex].ex;

            // 전체 단어 개수 중에서 현재 몇 번째인지 진도 표시를 업데이트합니다
            progress.textContent = (currentIndex + 1) + ' / ' + wordList.length;
            
            // 카드가 바뀔 때 퀴즈도 새로고침합니다
            loadQuiz();
        }

        // 카드를 클릭했을 때 앞뒤로 뒤집는 함수입니다
        function flipCard() {
            // 뒤집힘 상태를 반대로 바꿉니다 (참 <-> 거짓)
            isFlipped = !isFlipped;
            // HTML 카드 상자에 'flipped' 클래스를 붙였다 뗐다 합니다
            wordCard.classList.toggle('flipped');
        }

        // '이전' 버튼을 눌렀을 때 실행되는 함수입니다
        function prevCard() {
            // 첫 번째 카드보다 앞으로 갈 수 없으므로, 맨 앞이면 맨 뒤로 보냅니다
            currentIndex = (currentIndex - 1 + wordList.length) % wordList.length;
            // 카드를 새로고침합니다
            updateCard();
        }

        // '다음' 버튼을 눌렀을 때 실행되는 함수입니다
        function nextCard() {
            // 마지막 카드보다 뒤로 갈 수 없으므로, 맨 뒤면 맨 앞으로 보냅니다
            currentIndex = (currentIndex + 1) % wordList.length;
            // 카드를 새로고침합니다
            updateCard();
        }

        // 브라우저의 음성 기능(speechSynthesis)을 이용해 현재 영어 단어 읽어주는 함수입니다
        function speakWord() {
            // 브라우저가 음성 기능을 지원하는지 확인합니다
            if ('speechSynthesis' in window) {
                // 읽어줄 텍스트로 현재 단어의 영어(en)를 가져옵니다
                const textToSpeak = wordList[currentIndex].en;
                
                // 읽기 요청(Utterance)을 생성합니다
                const speech = new SpeechSynthesisUtterance(textToSpeak);
                
                // 언어를 영어(미국)로 설정합니다
                speech.lang = 'en-US';
                
                // 말하기 속도를 기본값보다 조금 느리게(0.8배속) 설정합니다
                speech.rate = 0.8;
                
                // 브라우저 음성 재생을 실행합니다
                window.speechSynthesis.speak(speech);
            } else {
                // 음성 기능을 지원하지 않는 브라우저일 경우 안내 창을 띄웁니다
                alert("이 브라우저는 소리를 지원하지 않아요.");
            }
        }

        // 퀴즈 보기를 무작위로 섞어주는 함수입니다
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // 퀴즈를 생성하고 화면에 보여주는 함수입니다
        function loadQuiz() {
            isAnswered = false;
            quizOptions.innerHTML = '';

            // 현재 단어의 뜻을 정답으로 설정합니다
            const currentKo = wordList[currentIndex].ko;
            
            // 현재 단어가 아닌 다른 단어들의 뜻 중에서 오답 3개를 골라냅니다
            const wrongOptions = wordList
                .filter((_, index) => index !== currentIndex)
                .map(item => item.ko);
            shuffleArray(wrongOptions);
            const selectedWrong = wrongOptions.slice(0, 3);

            // 정답과 오답 3개를 합쳐서 총 4개의 보기를 만듭니다
            let options = [currentKo, ...selectedWrong];
            shuffleArray(options);

            // 4개의 보기 버튼을 화면에 동적으로 생성합니다
            options.forEach(optionText => {
                const btn = document.createElement('button');
                btn.textContent = optionText;
                btn.className = 'quiz-btn';
                // 버튼을 누르면 정답인지 확인하는 함수를 실행합니다
                btn.onclick = () => checkAnswer(optionText, currentKo, btn);
                quizOptions.appendChild(btn);
            });
        }

        // 사용자가 고른 답이 맞는지 검사하는 함수입니다
        function checkAnswer(selected, correct, clickedBtn) {
            // 이미 답을 골랐다면 중복 클릭을 막습니다
            if (isAnswered) return;
            isAnswered = true;

            // 모든 보기 버튼을 가져옵니다
            const buttons = quizOptions.getElementsByClassName('quiz-btn');

            if (selected === correct) {
                // 정답을 맞힌 경우: 맞은 개수를 1 올리고 초록색으로 표시합니다
                clickedBtn.classList.add('correct');
                correctScore++;
                correctCount.textContent = correctScore;
            } else {
                // 틀린 경우: 틀린 개수를 1 올리고, 고른 버튼은 흐리게 만들며 정답 버튼은 초록색으로 찾아줍니다
                clickedBtn.classList.add('wrong');
                wrongScore++;
                wrongCount.textContent = wrongScore;

                for (let btn of buttons) {
                    if (btn.textContent === correct) {
                        btn.classList.add('correct');
                    }
                }
            }
        }

        // 웹페이지가 처음 열렸을 때 첫 번째 카드와 퀴즈를 보여줍니다
        updateCard();
    </script>
</body>
</html>
