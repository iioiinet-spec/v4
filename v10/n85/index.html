<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>무지개 그림판</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    * {
      font-family: 'Pretendard', sans-serif;
      touch-action: none; /* 터치 드래그 시 스크롤 방지 */
    }
    .color-btn {
      transition: all 0.2s ease;
    }
    .color-btn:hover {
      transform: translateY(-2px);
    }
    .color-btn.active {
      ring-4: rgba(99, 102, 241, 0.6);
      transform: scale(1.1);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center p-3 md:p-6 select-none">

  <!-- 헤더 영역 -->
  <header class="text-center mb-4">
    <h1 class="text-3xl md:text-4xl font-extrabold bg-gradient-to-r from-red-500 via-yellow-400 via-green-400 to-purple-500 bg-clip-text text-transparent drop-shadow">
      🌈 무지개 그림판
    </h1>
    <p class="text-slate-400 text-sm mt-1">
      키보드 숫자키 <span class="bg-slate-800 text-yellow-400 font-bold px-1.5 py-0.5 rounded border border-slate-700">1</span> ~ <span class="bg-slate-800 text-purple-400 font-bold px-1.5 py-0.5 rounded border border-slate-700">7</span> 로 무지개 색상을 빠르게 바꿀 수 있어요!
    </p>
  </header>

  <!-- 메인 콘테이너 -->
  <div class="w-full max-w-4xl bg-slate-800/80 backdrop-blur border border-slate-700 rounded-2xl p-4 shadow-2xl flex flex-col gap-4">

    <!-- 툴바 영역 -->
    <div class="flex flex-wrap items-center justify-between gap-3 bg-slate-900/60 p-3 rounded-xl border border-slate-700/50">
      
      <!-- 색상 팔레트 (1~7) -->
      <div class="flex flex-wrap items-center gap-2" id="palette">
        <!-- JS로 무지개 버튼 생성 -->
      </div>

      <!-- 보조 도구 (지우개, 크기, 지우기, 저장) -->
      <div class="flex items-center flex-wrap gap-3">
        <!-- 브러시 크기 -->
        <div class="flex items-center gap-2 bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">
          <i class="fa-solid fa-paint-brush text-slate-400 text-xs"></i>
          <input type="range" id="brushSize" min="1" max="50" value="8" class="w-20 md:w-28 accent-indigo-500 cursor-pointer">
          <span id="sizeValue" class="text-xs font-mono text-slate-300 w-6 text-right">8px</span>
        </div>

        <!-- 지우개 버튼 -->
        <button id="eraserBtn" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-sm font-medium transition active:scale-95">
          <i class="fa-solid fa-eraser text-pink-400"></i>
          <span>지우개</span>
        </button>

        <!-- 전체 지우기 -->
        <button id="clearBtn" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-red-950/40 hover:bg-red-900/60 border border-red-800/50 text-red-300 text-sm font-medium transition active:scale-95">
          <i class="fa-solid fa-trash-can"></i>
          <span>모두 지우기</span>
        </button>

        <!-- 저장하기 -->
        <button id="saveBtn" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium transition active:scale-95 shadow-md">
          <i class="fa-solid fa-download"></i>
          <span>저장</span>
        </button>
      </div>
    </div>

    <!-- 캔버스 영역 -->
    <div class="relative w-full aspect-[4/3] sm:aspect-[16/10] bg-white rounded-xl overflow-hidden shadow-inner cursor-crosshair">
      <canvas id="canvas" class="w-full h-full block"></canvas>
    </div>

    <!-- 하단 가이드 및 이력 -->
    <footer class="flex justify-between items-center text-xs text-slate-400 px-1">
      <div>
        현재 색상: <span id="currentColorName" class="font-bold text-red-400">1. 빨간색</span>
      </div>
      <div class="hidden sm:block">
        팁: 숫자키 1~7로 색상 선택 | 지우개 모드 시 바탕색으로 지워집니다
      </div>
    </footer>
  </div>

  <script>
    // 무지개 색상 정의 (1~7)
    const RAINBOW_COLORS = [
      { key: '1', name: '빨간색', hex: '#FF0000', labelBg: 'bg-red-500' },
      { key: '2', name: '주황색', hex: '#FF7F00', labelBg: 'bg-orange-500' },
      { key: '3', name: '노랑색', hex: '#FFFF00', labelBg: 'bg-yellow-400' },
      { key: '4', name: '초록색', hex: '#00FF00', labelBg: 'bg-green-500' },
      { key: '5', name: '파랑색', hex: '#0000FF', labelBg: 'bg-blue-500' },
      { key: '6', name: '남색',   hex: '#4B0082', labelBg: 'bg-indigo-900' },
      { key: '7', name: '보라색', hex: '#8B00FF', labelBg: 'bg-purple-600' }
    ];

    // 요소 참조
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const paletteEl = document.getElementById('palette');
    const brushSizeInput = document.getElementById('brushSize');
    const sizeValueEl = document.getElementById('sizeValue');
    const eraserBtn = document.getElementById('eraserBtn');
    const clearBtn = document.getElementById('clearBtn');
    const saveBtn = document.getElementById('saveBtn');
    const currentColorNameEl = document.getElementById('currentColorName');

    // 상태 변수
    let isDrawing = false;
    let currentColor = RAINBOW_COLORS[0].hex;
    let currentColorIndex = 0;
    let currentSize = parseInt(brushSizeInput.value, 10);
    let isEraser = false;
    let lastX = 0;
    let lastY = 0;

    // 캔버스 크기 맞춤 처리
    function resizeCanvas() {
      // 현재 캔버스 내용을 임시 저장하여 크기 변경 시 유지
      const tempCanvas = document.createElement('canvas');
      const tempCtx = tempCanvas.getContext('2d');
      tempCanvas.width = canvas.width;
      tempCanvas.height = canvas.height;
      tempCtx.drawImage(canvas, 0, 0);

      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;

      // 흰색 배경 채우기
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 기존 복사본 다시 그리기
      ctx.drawImage(tempCanvas, 0, 0);
    }

    // 팔레트 버튼 생성
    function initPalette() {
      paletteEl.innerHTML = '';
      RAINBOW_COLORS.forEach((color, index) => {
        const btn = document.createElement('button');
        btn.className = `color-btn relative w-9 h-9 md:w-10 md:h-10 rounded-full border-2 border-slate-700 flex items-center justify-center shadow-md font-bold text-xs transition-all ${index === 0 ? 'ring-4 ring-indigo-400 ring-offset-2 ring-offset-slate-900 scale-110' : ''}`;
        btn.style.backgroundColor = color.hex;
        btn.dataset.index = index;

        // 노란색 등 밝은 색상의 경우 글자색 검은색 처리
        const textColor = (index === 2 || index === 3) ? 'text-slate-900' : 'text-white';

        btn.innerHTML = `
          <span class="bg-black/40 ${textColor} px-1.5 py-0.5 rounded-full text-[10px] font-mono border border-white/20">
            ${color.key}
          </span>
        `;

        btn.addEventListener('click', () => selectColor(index));
        paletteEl.appendChild(btn);
      });
    }

    // 색상 선택 함수
    function selectColor(index) {
      isEraser = false;
      eraserBtn.classList.remove('bg-pink-600', 'text-white');
      eraserBtn.classList.add('bg-slate-800', 'text-slate-100');

      currentColorIndex = index;
      currentColor = RAINBOW_COLORS[index].hex;

      // UI 팔레트 선택 상태 업데이트
      const buttons = paletteEl.querySelectorAll('.color-btn');
      buttons.forEach((btn, i) => {
        if (i === index) {
          btn.classList.add('ring-4', 'ring-indigo-400', 'ring-offset-2', 'ring-offset-slate-900', 'scale-110');
        } else {
          btn.classList.remove('ring-4', 'ring-indigo-400', 'ring-offset-2', 'ring-offset-slate-900', 'scale-110');
        }
      });

      // 현재 색상 이름 텍스트 표시
      currentColorNameEl.textContent = `${RAINBOW_COLORS[index].key}. ${RAINBOW_COLORS[index].name}`;
      currentColorNameEl.style.color = RAINBOW_COLORS[index].hex === '#FFFF00' ? '#EAB308' : RAINBOW_COLORS[index].hex;
    }

    // 좌표 계산 (마우스 및 터치 지원)
    function getCoordinates(e) {
      const rect = canvas.getBoundingClientRect();
      let clientX = e.clientX;
      let clientY = e.clientY;

      if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      }

      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    // 드로잉 시작
    function startDrawing(e) {
      isDrawing = true;
      const coords = getCoordinates(e);
      lastX = coords.x;
      lastY = coords.y;

      // 점 찍기 지원
      draw(e);
    }

    // 그리기 실행
    function draw(e) {
      if (!isDrawing) return;
      e.preventDefault();

      const coords = getCoordinates(e);

      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(coords.x, coords.y);

      ctx.strokeStyle = isEraser ? '#FFFFFF' : currentColor;
      ctx.lineWidth = currentSize;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      ctx.stroke();

      lastX = coords.x;
      lastY = coords.y;
    }

    // 드로잉 종료
    function stopDrawing() {
      isDrawing = false;
      ctx.beginPath();
    }

    // 지우개 토글
    function toggleEraser() {
      isEraser = !isEraser;
      if (isEraser) {
        eraserBtn.classList.remove('bg-slate-800');
        eraserBtn.classList.add('bg-pink-600', 'text-white');
        currentColorNameEl.textContent = '🧹 지우개 모드';
        currentColorNameEl.style.color = '#F472B6';
        
        // 팔레트 강조 해제
        const buttons = paletteEl.querySelectorAll('.color-btn');
        buttons.forEach(btn => btn.classList.remove('ring-4', 'ring-indigo-400', 'ring-offset-2', 'ring-offset-slate-900', 'scale-110'));
      } else {
        selectColor(currentColorIndex);
      }
    }

    // 캔버스 모두 지우기
    function clearCanvas() {
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // 이미지 저장
    function saveImage() {
      const link = document.createElement('a');
      link.download = `무지개_그림_${new Date().toISOString().slice(0, 10)}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    // 이벤트 리스너 등록
    function initEvents() {
      // 마우스 이벤트
      canvas.addEventListener('mousedown', startDrawing);
      canvas.addEventListener('mousemove', draw);
      canvas.addEventListener('mouseup', stopDrawing);
      canvas.addEventListener('mouseleave', stopDrawing);

      // 터치 이벤트 (모바일)
      canvas.addEventListener('touchstart', startDrawing);
      canvas.addEventListener('touchmove', draw);
      canvas.addEventListener('touchend', stopDrawing);

      // 키보드 이벤트 (1~7 색상 선택)
      window.addEventListener('keydown', (e) => {
        // 숫자 키 1~7 확인 (키패드 포함)
        const key = e.key;
        if (key >= '1' && key <= '7') {
          const index = parseInt(key, 10) - 1;
          selectColor(index);
        } else if (key.toLowerCase() === 'e') {
          toggleEraser();
        } else if (key.toLowerCase() === 'c') {
          clearCanvas();
        }
      });

      // 브러시 크기 조절
      brushSizeInput.addEventListener('input', (e) => {
        currentSize = e.target.value;
        sizeValueEl.textContent = `${currentSize}px`;
      });

      // 버튼 기능 연결
      eraserBtn.addEventListener('click', toggleEraser);
      clearBtn.addEventListener('click', clearCanvas);
      saveBtn.addEventListener('click', saveImage);

      // 윈도우 리사이즈
      window.addEventListener('resize', resizeCanvas);
    }

    // 초기화 함수 실행
    window.onload = function() {
      initPalette();
      resizeCanvas();
      initEvents();
    };
  </script>
</body>
</html>
