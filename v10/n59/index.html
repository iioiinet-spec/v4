<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 영어 단어 학습장</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --border-color: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        header p {
            color: #6b7280;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        /* 탭 메뉴 스타일 */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: #e5e7eb;
            color: #4b5563;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--primary-color);
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* 단어 입력 폼 */
        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input, select {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
        }

        button.btn {
            padding: 10px 20px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button.btn:hover {
            background-color: var(--primary-hover);
        }

        /* 단어 목록 테이블 */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #f9fafb;
            font-weight: 600;
        }

        .delete-btn {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .delete-btn:hover {
            background-color: #dc2626;
        }

        /* 플래시카드 & 퀴즈 모드 */
        .quiz-container {
            text-align: center;
            padding: 30px;
        }

        .flashcard {
            background: #f8fafc;
            border: 2px dashed var(--primary-color);
            border-radius: 12px;
            padding: 40px;
            margin: 20px 0;
            cursor: pointer;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .flashcard h2 {
            font-size: 2rem;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .flashcard p {
            color: #6b7280;
            font-size: 1.1rem;
        }

        .quiz-input-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .result-message {
            font-weight: bold;
            margin-top: 15px;
            font-size: 1.1rem;
        }

        .empty-state {
            text-align: center;
            color: #9ca3af;
            padding: 30px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>📚 영단어 학습장</h1>
        <p>나만의 단어를 등록하고 플래시카드와 퀴즈로 학습하세요!</p>
    </header>

    <!-- 탭 버튼 -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('list')">단어 관리</button>
        <button class="tab-btn" onclick="switchTab('flashcard')">플래시카드</button>
        <button class="tab-btn" onclick="switchTab('quiz')">뜻 맞추기 퀴즈</button>
    </div>

    <!-- 1. 단어 관리 탭 -->
    <div id="list-tab" class="tab-content active">
        <div class="card">
            <h3>새 단어 추가하기</h3>
            <div class="form-group" style="margin-top: 15px;">
                <input type="text" id="wordInput" placeholder="영어 단어 (예: Apple)">
                <input type="text" id="meaningInput" placeholder="뜻 (예: 사과)">
                <button class="btn" onclick="addWord()">추가</button>
            </div>
        </div>

        <div class="card">
            <h3>등록된 단어 목록 (<span id="wordCount">0</span>개)</h3>
            <div class="table-responsive" style="margin-top: 15px;">
                <table>
                    <thead>
                        <tr>
                            <th>단어</th>
                            <th>뜻</th>
                            <th>관리</th>
                        </tr>
                    </thead>
                    <tbody id="wordTableBody">
                        <!-- 동적 생성 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 2. 플래시카드 탭 -->
    <div id="flashcard-tab" class="tab-content">
        <div class="card quiz-container">
            <h3>🎴 플래시카드 학습</h3>
            <p style="font-size: 0.9rem; color: #6b7280; margin-top: 5px;">카드를 클릭하면 뜻이 나타납니다.</p>
            
            <div class="flashcard" onclick="flipCard()" id="flashcardElement">
                <h2 id="cardWord">단어가 없습니다.</h2>
                <p id="cardMeaning">단어를 먼저 추가해주세요!</p>
            </div>

            <div>
                <button class="btn" onclick="prevCard()">이전 카드</button>
                <button class="btn" onclick="nextCard()">다음 카드</button>
            </div>
        </div>
    </div>

    <!-- 3. 퀴즈 탭 -->
    <div id="quiz-tab" class="tab-content">
        <div class="card quiz-container">
            <h3>✍️ 뜻 맞추기 퀴즈</h3>
            <div style="margin: 25px 0;">
                <p style="font-size: 1rem; color: #6b7280;">다음 단어의 뜻은?</p>
                <h2 id="quizWord" style="font-size: 2.2rem; color: var(--primary-color); margin-top: 10px;">-</h2>
            </div>

            <div class="quiz-input-group">
                <input type="text" id="quizAnswerInput" placeholder="뜻을 입력하세요" onkeypress="if(event.key === 'Enter') checkQuiz()">
                <button class="btn" onclick="checkQuiz()">정답 확인</button>
            </div>
            <div id="quizResult" class="result-message"></div>
            <div style="margin-top: 20px;">
                <button class="btn" style="background-color: #6b7280;" onclick="loadQuiz()">다음 문제</button>
            </div>
        </div>
    </div>
</div>

<script>
    // 데이터 저장소 (로컬 스토리지 활용)
    let words = JSON.parse(localStorage.getItem('vocab_words')) || [
        { word: 'Apple', meaning: '사과' },
        { word: 'Banana', meaning: '바나나' },
        { word: 'Developer', meaning: '개발자' }
    ];

    let currentCardIndex = 0;
    let isFlipped = false;
    let currentQuizWord = null;

    // 초기 실행
    window.onload = function() {
        updateWordList();
    };

    // 탭 전환 함수
    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

        if (tabName === 'list') {
            document.querySelector('.tabs button:nth-child(1)').classList.add('active');
            document.getElementById('list-tab').classList.add('active');
            updateWordList();
        } else if (tabName === 'flashcard') {
            document.querySelector('.tabs button:nth-child(2)').classList.add('active');
            document.getElementById('flashcard-tab').classList.add('active');
            initFlashcard();
        } else if (tabName === 'quiz') {
            document.querySelector('.tabs button:nth-child(3)').classList.add('active');
            document.getElementById('quiz-tab').classList.add('active');
            loadQuiz();
        }
    }

    // 단어 추가
    function addWord() {
        const wordInput = document.getElementById('wordInput');
        const meaningInput = document.getElementById('meaningInput');
        const word = wordInput.value.trim();
        const meaning = meaningInput.value.trim();

        if (!word || !meaning) {
            alert('단어와 뜻을 모두 입력해주세요!');
            return;
        }

        words.push({ word, meaning });
        saveAndRefresh();

        wordInput.value = '';
        meaningInput.value = '';
        wordInput.focus();
    }

    // 단어 삭제
    function deleteWord(index) {
        words.splice(index, 1);
        saveAndRefresh();
    }

    // 로컬 스토리지 저장 및 UI 업데이트
    function saveAndRefresh() {
        localStorage.setItem('vocab_words', JSON.stringify(words));
        updateWordList();
    }

    // 단어 목록 화면 갱신
    function updateWordList() {
        const tbody = document.getElementById('wordTableBody');
        const countSpan = document.getElementById('wordCount');
        tbody.innerHTML = '';
        countSpan.textContent = words.length;

        if (words.length === 0) {
            tbody.innerHTML = `<tr><td colspan="3" class="empty-state">등록된 단어가 없습니다. 단어를 추가해보세요!</td></tr>`;
            return;
        }

        words.forEach((item, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <strong><td>${escapeHtml(item.word)}</td></strong>
                <td>${escapeHtml(item.meaning)}</td>
                <td><button class="delete-btn" onclick="deleteWord(${index})">삭제</button></td>
            `;
            tbody.appendChild(tr);
        });
    }

    // 플래시카드 초기화 및 조작
    function initFlashcard() {
        currentCardIndex = 0;
        isFlipped = false;
        renderFlashcard();
    }

    function renderFlashcard() {
        const wordEl = document.getElementById('cardWord');
        const meaningEl = document.getElementById('cardMeaning');

        if (words.length === 0) {
            wordEl.textContent = "단어가 없습니다.";
            meaningEl.textContent = "단어 관리 탭에서 단어를 추가해주세요!";
            return;
        }

        if (currentCardIndex >= words.length) currentCardIndex = 0;
        if (currentCardIndex < 0) currentCardIndex = words.length - 1;

        const current = words[currentCardIndex];
        if (!isFlipped) {
            wordEl.textContent = current.word;
            meaningEl.textContent = "(카드를 클릭해 뜻 확인)";
        } else {
            wordEl.textContent = current.word;
            meaningEl.textContent = current.meaning;
        }
    }

    function flipCard() {
        if (words.length === 0) return;
        isFlipped = !isFlipped;
        renderFlashcard();
    }

    function nextCard() {
        if (words.length === 0) return;
        currentCardIndex++;
        isFlipped = false;
        renderFlashcard();
    }

    function prevCard() {
        if (words.length === 0) return;
        currentCardIndex--;
        isFlipped = false;
        renderFlashcard();
    }

    // 퀴즈 기능
    function loadQuiz() {
        const quizWordEl = document.getElementById('quizWord');
        const answerInput = document.getElementById('quizAnswerInput');
        const resultEl = document.getElementById('quizResult');

        answerInput.value = '';
        resultEl.textContent = '';

        if (words.length === 0) {
            quizWordEl.textContent = "단어가 없습니다.";
            answerInput.disabled = true;
            return;
        }

        answerInput.disabled = false;
        const randomIndex = Math.floor(Math.random() * words.length);
        currentQuizWord = words[randomIndex];
        quizWordEl.textContent = currentQuizWord.word;
        answerInput.focus();
    }

    function checkQuiz() {
        if (!currentQuizWord) return;
        const answerInput = document.getElementById('quizAnswerInput');
        const resultEl = document.getElementById('quizResult');
        const userAns = answerInput.value.trim();

        if (!userAns) {
            alert('정답을 입력해주세요!');
            return;
        }

        // 띄어쓰기나 대소문자 무시 비교 또는 포함 여부 확인 가능
        if (userAns === currentQuizWord.meaning.trim()) {
            resultEl.style.color = '#10b981';
            resultEl.textContent = "🎉 정답입니다! 대단해요!";
        } else {
            resultEl.style.color = '#ef4444';
            resultEl.textContent = `❌ 틀렸습니다. 정답은 '${currentQuizWord.meaning}' 입니다.`;
        }
    }

    // XSS 방지용 간단한 헬퍼
    function escapeHtml(str) {
        return str.replace(/[&<>'"]/g, 
            tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
        );
    }
</script>

</body>
</html>
