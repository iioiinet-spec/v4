<!DOCTYPE html> <!-- HTML 문서의 시작을 알립니다 -->
<html lang="ko"> <!-- 웹사이트의 언어를 한국어로 설정합니다 -->
<head> <!-- 웹사이트의 설정과 디자인을 담당하는 머리말입니다 -->
    <meta charset="UTF-8"> <!-- 글자가 깨지지 않도록 유니코드(UTF-8)로 설정합니다 -->
    <title>영어 단어 카드</title> <!-- 브라우저 탭에 보일 제목입니다 -->
    <!-- 구글 폰트 Noto Serif KR(본명조)을 불러오는 링크 태그입니다 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
    <style> <!-- 웹사이트의 모양과 색상을 꾸미는 CSS 시작입니다 -->
        :root { /* 색상 값을 한곳에서 관리하기 위한 변수 모음입니다 */
            --bg-color: #1f3b32;       /* 배경색: 깊고 차분한 숲속 같은 짙은 초록색 */
            --card-color: #27463c;     /* 카드색: 배경보다 살짝 밝은 초록색 카드 */
            --text-color: #f2f0e4;     /* 글자색: 눈이 편안한 아이보리 계열의 밝은 색 */
            --point-color: #ffe08a;    /* 포인트색: 따뜻한 느낌을 주는 부드러운 노란색 */
            --sub-text: #c2d1c7;       /* 보조글자색: 은은하게 가라앉은 초록빛 회색 */
        }

        body { /* 웹페이지 전체의 기본 스타일입니다 */
            font-family: 'Noto Serif KR', serif; /* 한글과 영어 모두 본명조 폰트를 적용합니다 */
            background-color: var(--bg-color); /* 배경색 변수를 적용합니다 */
            color: var(--text-color); /* 기본 글자색 변수를 적용합니다 */
            text-align: center; /* 모든 글자를 가운데로 정렬합니다 */
            margin-top: 50px; /* 위쪽 여백을 50픽셀 줍니다 */
        }

        h1 { /* 페이지 제목의 디자인입니다 */
            color: var(--point-color); /* 제목 글자색에 포인트 색상을 줍니다 */
            margin-bottom: 30px; /* 제목 아래 여백을 줍니다 */
        }

        /* 처음 모드 선택 화면 디자인입니다 */
        .mode-selection {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-top: 80px;
        }
        .mode-btn {
            background-color: var(--card-color);
            color: var(--point-color);
            border: 1px solid var(--point-color);
            padding: 20px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 280px;
            font-family: 'Noto Serif KR', serif;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: background-color 0.2s, color 0.2s;
        }
        .mode-btn:hover {
            background-color: var(--point-color);
            color: var(--bg-color);
        }

        /* 기능 실행 화면과 뒤로 가기 버튼 디자인입니다 */
        .app-screen {
            display: none; /* 평소에는 숨겨둡니다 */
        }
        .back-mode-btn {
            background-color: transparent;
            color: var(--sub-text);
            border: 1px solid var(--sub-text);
            padding: 8px 16px;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Noto Serif KR', serif;
            margin-bottom: 20px;
        }
        .back-mode-btn:hover {
            color: var(--text-color);
            border-color: var(--text-color);
        }

        .card-container { /* 단어 카드가 들어갈 틀의 크기와 성질입니다 */
            perspective: 1000px; /* 카드가 입체적으로 뒤집히는 원근감을 줍니다 */
            width: 320px; /* 틀의 가로 길이를 320픽셀로 합니다 */
            height: 200px; /* 틀의 세로 길이를 200픽셀로 합니다 */
            margin: 0 auto 20px auto; /* 카드를 화면 정가운데에 오게 합니다 */
            cursor: pointer; /* 마우스를 올리면 손가락 모양으로 바꿉니다 */
        }
        .card { /* 진짜 단어 카드 본체의 움직임 설정입니다 */
            width: 100%; /* 틀의 가로를 꽉 채웁니다 */
            height: 100%; /* 틀의 세로를 꽉 채웁니다 */
            position: relative; /* 위치를 자유롭게 조절할 수 있게 합니다 */
            transform-style: preserve-3d; /* 카드 앞뒷면이 3차원으로 겹치게 합니다 */
            transition: transform 0.6s; /* 카드가 뒤집힐 때 0.6초 동안 부드럽게 움직입니다 */
        }
        .card.flipped { /* 카드가 뒤집혔을 때의 상태입니다 */
            transform: rotateY(180deg); /* 카드를 Y축 기준으로 180도 회전시킵니다 */
        }
        .card-face { /* 카드의 앞면과 뒷면 공통 디자인입니다 */
            position: absolute; /* 글자나 배경이 겹치도록 절대 위치로 둡니다 */
            width: 100%; /* 너비를 꽉 채웁니다 */
            height: 100%; /* 높이를 꽉 채웁니다 */
            backface-visibility: hidden; /* 뒷면이 돌아서 보일 때 안 보이게 숨깁니다 */
            display: flex; /* 내부 글자를 정렬하기 쉽게 플렉스 박스로 만듭니다 */
            flex-direction: column; /* 글자를 위에서 아래로 쌓이게 합니다 */
            justify-content: center; /* 위아래 가운데 정렬을 합니다 */
            align-items: center; /* 좌우 가운데 정렬을 합니다 */
            border-radius: 10px; /* 카드의 모서리를 10픽셀 둥글게 합니다 */
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); /* 카드에 깊이감 있는 그림자를 넣습니다 */
            box-sizing: border-box; /* 테두리가 크기에 포함되게 합니다 */
            padding: 20px; /* 안쪽 여백을 줍니다 */
        }
        .card-front { /* 카드의 앞면(영어 단어) 디자인입니다 */
            background-color: var(--card-color); /* 카드색 변수를 적용합니다 */
            color: var(--point-color); /* 앞면 단어 글자색을 포인트 색상으로 합니다 */
            font-size: 26px; /* 단어가 길어질 수 있어 글자 크기를 알맞게 조절합니다 */
            font-weight: bold; /* 글자를 두껍게 합니다 */
            border: 1px solid rgba(255, 224, 138, 0.3); /* 은은한 포인트 테두리를 줍니다 */
            text-align: center; /* 글자가 길면 가운데 정렬합니다 */
        }
        .card-back { /* 카드의 뒷면(뜻과 예문) 디자인입니다 */
            background-color: var(--card-color); /* 카드색 변수를 적용합니다 */
            color: var(--text-color); /* 기본 글자색 변수를 적용합니다 */
            transform: rotateY(180deg); /* 뒷면은 미리 반대로 뒤집어 둡니다 */
            border: 1px solid rgba(255, 224, 138, 0.3); /* 은은한 포인트 테두리를 줍니다 */
        }
        .meaning { /* 뜻 글자의 디자인입니다 */
            font-size: 22px; /* 뜻 글자 크기입니다 */
            font-weight: bold; /* 뜻 글자를 두껍게 합니다 */
            margin-bottom: 10px; /* 아래쪽 여백을 줍니다 */
            color: var(--point-color); /* 뜻 글자색을 포인트 색상으로 합니다 */
        }
        .example { /* 예문 글자의 디자인입니다 */
            font-size: 15px; /* 예문 글자 크기입니다 */
            color: var(--sub-text); /* 보조 글자색 변수를 적용합니다 */
            margin-bottom: 15px; /* 아래쪽 여백을 줍니다 */
        }
        .speaker-btn { /* 스피커 버튼의 디자인입니다 */
            background-color: transparent; /* 배경을 투명하게 합니다 */
            color: var(--point-color); /* 글씨 색을 포인트 색상으로 합니다 */
            border: 1px solid var(--point-color); /* 테두리를 포인트 색상으로 줍니다 */
            padding: 6px 12px; /* 안쪽 여백을 줍니다 */
            font-size: 14px; /* 글자 크기입니다 */
            border-radius: 6px; /* 모서리를 둥글게 합니다 */
            cursor: pointer; /* 마우스를 올리면 손가락 모양으로 바꿉니다 */
            font-family: 'Noto Serif KR', serif; /* 본명조 폰트를 적용합니다 */
        }
        .speaker-btn:hover { /* 스피커 버튼에 마우스를 올렸을 때입니다 */
            background-color: var(--point-color); /* 배경을 포인트 색상으로 채웁니다 */
            color: var(--bg-color); /* 글자 색을 배경색으로 반전시킵니다 */
        }
        .controls { /* 버튼들이 있는 공간입니다 */
            margin-top: 20px; /* 위쪽 여백을 줍니다 */
        }
        button { /* 이전/다음 버튼의 디자인입니다 */
            background-color: var(--card-color); /* 카드 색상 배경입니다 */
            color: var(--text-color); /* 글자 색은 기본 텍스트 색입니다 */
            border: 1px solid var(--sub-text); /* 테두리를 은은하게 넣습니다 */
            padding: 10px 20px; /* 버튼 안쪽 여백을 줍니다 */
            font-size: 16px; /* 글자 크기입니다 */
            border-radius: 6px; /* 모서리를 둥글게 합니다 */
            cursor: pointer; /* 마우스를 올리면 손가락 모양으로 바꿉니다 */
            margin: 0 10px; /* 좌우 버튼 사이에 간격을 줍니다 */
            font-family: 'Noto Serif KR', serif; /* 본명조 폰트를 적용합니다 */
        }
        button:hover { /* 버튼에 마우스를 올렸을 때입니다 */
            border-color: var(--point-color); /* 테두리가 포인트 색으로 변합니다 */
            color: var(--point-color); /* 글자 색이 포인트 색으로 변합니다 */
        }
        .progress { /* 현재 몇 번째 단어인지 알려주는 글자입니다 */
            font-size: 18px; /* 글자 크기입니다 */
            font-weight: bold; /* 글자를 두껍게 합니다 */
            color: var(--sub-text); /* 보조 글자색 변수를 적용합니다 */
            margin-bottom: 15px; /* 아래쪽 여백을 줍니다 */
        }
        /* 퀴즈 영역 디자인입니다 */
        .quiz-container {
            margin-top: 20px;
            background-color: var(--card-color);
            width: 320px;
            margin-left: auto;
            margin-right: auto;
            padding: 20px;
            border-radius: 10px; /* 모서리를 10픽셀 둥글게 합니다 */
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            box-sizing: border-box;
            border: 1px solid rgba(255, 224, 138, 0.3);
        }
        .quiz-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--text-color);
            margin-bottom: 15px;
        }
        .quiz-btn {
            display: block;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-color);
            border: 1px solid rgba(255, 224, 138, 0.2);
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            font-family: 'Noto Serif KR', serif;
            transition: background-color 0.2s;
        }
        .quiz-btn:hover:not(:disabled) {
            background-color: rgba(255, 224, 138, 0.1);
            color: var(--point-color);
            border-color: var(--point-color);
        }
        .quiz-btn.correct {
            background-color: #27ae60 !important;
            color: white !important;
            border-color: #27ae60 !important;
        }
        .quiz-btn.incorrect {
            opacity: 0.4;
        }
        .score-board {
            margin-top: 15px;
            font-size: 14px;
            color: var(--sub-text);
            font-weight: bold;
        }
        /* 타이핑 퀴즈 입력창 스타일입니다 */
        .quiz-input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid rgba(255, 224, 138, 0.3);
            border-radius: 6px;
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-color);
            box-sizing: border-box;
            text-align: center;
            font-family: 'Noto Serif KR', serif;
            margin-bottom: 10px;
        }
        .quiz-input:focus {
            outline: none;
            border-color: var(--point-color);
        }
    </style> <!-- CSS 디자인 꾸미기가 끝났습니다 -->
</head>
<body> <!-- 웹사이트의 알맹이(몸통) 시작입니다 -->
    <!-- 무드: 고요한 서재에서 클래식한 만년필로 차분히 단어장을 넘기는 밤 -->

    <h1>나만의 영어 단어 카드</h1> <!-- 제목을 화면에 보여줍니다 -->

    <!-- 처음 화면: 모드 선택 버튼 영역 -->
    <div id="modeSelection" class="mode-selection">
        <button class="mode-btn" onclick="switchMode('study')">단어 외우기</button>
        <button class="mode-btn" onclick="switchMode('quizMeaning')">단어 퀴즈 (뜻 맞추기)</button>
        <button class="mode-btn" onclick="switchMode('quizSpelling')">단어 퀴즈 (스펠링 쓰기)</button>
    </div>

    <!-- 단어 외우기 화면 -->
    <div id="studyScreen" class="app-screen">
        <button class="back-mode-btn" onclick="switchMode('menu')">← 메뉴로 돌아가기</button>
        <div id="progressText" class="progress">1 / 30</div> <!-- 현재 진도를 보여주는 칸입니다 -->
        <div class="card-container" onclick="flipCard()"> <!-- 카드를 누르면 뒤집는 함수가 실행됩니다 -->
            <div id="card" class="card"> <!-- 카드의 앞면과 뒷면을 담고 있는 상자입니다 -->
                <div class="card-face card-front" id="frontWord">potential</div> <!-- 앞면: 영어 단어가 들어갑니다 -->
                <div class="card-face card-back"> <!-- 뒷면: 뜻과 예문이 들어갑니다 -->
                    <div class="meaning" id="backMeaning">가능성이 있는</div> <!-- 뜻이 들어갈 자리입니다 -->
                    <div class="example" id="backExample"></div> <!-- 예문이 들어갈 자리입니다 -->
                    <button class="speaker-btn" onclick="speakWord(event)">🔊 소리 듣기</button> <!-- 카드를 읽어주는 스피커 버튼입니다 -->
                </div>
            </div>
        </div>
        <div class="controls"> <!-- 버튼들이 있는 공간입니다 -->
            <button onclick="prevCard()">이전</button> <!-- 누르면 이전 단어로 가는 버튼입니다 -->
            <button onclick="nextCard()">다음</button> <!-- 누르면 다음 단어로 가는 버튼입니다 -->
        </div>
    </div>

    <!-- 단어 퀴즈 화면 -->
    <div id="quizScreen" class="app-screen">
        <button class="back-mode-btn" onclick="switchMode('menu')">← 메뉴로 돌아가기</button>
        <div class="card-container"> <!-- 퀴즈 모드에서 보여줄 카드 컨테이너입니다 -->
            <div id="cardQuiz" class="card">
                <div class="card-face card-front" id="frontWordQuiz">potential</div>
                <div class="card-face card-back">
                    <div class="meaning" id="backMeaningQuiz">가능성이 있는</div>
                    <div class="example" id="backExampleQuiz"></div>
                    <button class="speaker-btn" onclick="speakQuizWord(event)">🔊 소리 듣기</button>
                </div>
            </div>
        </div>
        <div class="quiz-container">
            <div class="quiz-title" id="quizTitleText">이 단어의 뜻은?</div>
            <div id="quizContentArea"></div>
            <div class="score-board" id="scoreBoard">맞은 개수: 0 | 틀린 개수: 0</div>
        </div>
    </div>

    <script> // 자바스크립트(동작 기능)의 시작입니다
        // [여기만 고치세요] 단어 목록 배열입니다. 원하시는 단어를 추가하거나 수정하세요!
        const words = [ // 단어장 목록 상자를 만듭니다
            { en:'potential', ko:'가능성이 있는', ex:'' },
            { en:'religion', ko:'종교', ex:'' },
            { en:'unreasonable', ko:'불합리한', ex:'' },
            { en:'offend', ko:'화나게 하다', ex:'' },
            { en:'institution', ko:'기관', ex:'' },
            { en:'infect', ko:'병을 옮기다', ex:'' },
            { en:'unite', ko:'연합하다', ex:'' },
            { en:'consider', ko:'잘 생각하다', ex:'' },
            { en:'region', ko:'지역', ex:'' },
            { en:'victim', ko:'희생자', ex:'' },
            { en:'reform', ko:'개혁하다', ex:'' },
            { en:'perspective', ko:'관점', ex:'' },
            { en:'insert', ko:'넣다', ex:'' },
            { en:'guilty', ko:'죄를 범한', ex:'' },
            { en:'internal', ko:'내부의', ex:'' },
            { en:'moderate', ko:'보통의', ex:'' },
            { en:'continuous', ko:'계속되는', ex:'' },
            { en:'pronounce', ko:'발음하다', ex:'' },
            { en:'ceremony', ko:'의식', ex:'' },
            { en:'register', ko:'등록하다', ex:'' },
            { en:'diligent', ko:'부지런한', ex:'' },
            { en:'particular', ko:'특별한', ex:'' },
            { en:'claim', ko:'주장하다', ex:'' },
            { en:'endure', ko:'견디다', ex:'' },
            { en:'desperate', ko:'자포자기한', ex:'' },
            { en:'oppose', ko:'반대하다', ex:'' },
            { en:'turn ... into ~', ko:'...을 ~로 바꾸다', ex:'' },
            { en:'look back on', ko:'되돌아보다', ex:'' },
            { en:'turn in', ko:'..을 제출하다', ex:'' },
            { en:'come across', ko:'우연히 마주치다', ex:'' }
        ]; // 단어 목록 상자를 닫습니다

        let currentIndex = 0; // 현재 몇 번째 단어를 보고 있는지 기억하는 변수입니다
        let correctCount = 0; // 맞은 개수를 기억하는 변수입니다
        let incorrectCount = 0; // 틀린 개수를 기억하는 변수입니다
        let isAnswered = false; // 현재 퀴즈를 풀었는지 여부를 저장합니다
        let currentQuizMode = 'meaning'; // 현재 퀴즈 모드 ('meaning' 또는 'spelling')
        let quizList = []; // 퀴즈용으로 순서가 섞인 단어 목록을 저장할 변수입니다

        const modeSelectionElement = document.getElementById('modeSelection');
        const studyScreenElement = document.getElementById('studyScreen');
        const quizScreenElement = document.getElementById('quizScreen');

        const cardElement = document.getElementById('card'); // HTML에서 카드 상자를 찾아옵니다
        const frontWordElement = document.getElementById('frontWord'); // 앞면 단어 글자 자리를 찾아옵니다
        const backMeaningElement = document.getElementById('backMeaning'); // 뒷면 뜻 글자 자리를 찾아옵니다
        const backExampleElement = document.getElementById('backExample'); // 뒷면 예문 글자 자리를 찾아옵니다
        const progressTextElement = document.getElementById('progressText'); // 진도 표시 글자 자리를 찾아옵니다

        const cardQuizElement = document.getElementById('cardQuiz');
        const frontWordQuizElement = document.getElementById('frontWordQuiz');
        const backMeaningQuizElement = document.getElementById('backMeaningQuiz');
        const backExampleQuizElement = document.getElementById('backExampleQuiz');
        const quizTitleTextElement = document.getElementById('quizTitleText');
        const quizContentAreaElement = document.getElementById('quizContentArea'); // 퀴즈 내용(보기 또는 입력창)이 들어갈 자리입니다
        const scoreBoardElement = document.getElementById('scoreBoard'); // 점수판 글자 자리를 찾아옵니다

        // 선택한 모드에 따라 화면을 전환하는 함수입니다
        function switchMode(mode) {
            modeSelectionElement.style.display = 'none';
            studyScreenElement.style.display = 'none';
            quizScreenElement.style.display = 'none';

            if (mode === 'study') {
                studyScreenElement.style.display = 'block';
                updateCard();
            } else if (mode === 'quizMeaning' || mode === 'quizSpelling') {
                currentQuizMode = (mode === 'quizMeaning') ? 'meaning' : 'spelling';
                quizScreenElement.style.display = 'block';
                
                // [추가] 퀴즈 모드 진입 시 점수와 진행 상태를 초기화합니다
                correctCount = 0;
                incorrectCount = 0;
                scoreBoardElement.textContent = `맞은 개수: ${correctCount} | 틀린 개수: ${incorrectCount}`;

                // 퀴즈 순서를 무작위로 섞고 첫 번째 문제부터 시작합니다
                quizList = [...words].sort(() => Math.random() - 0.5);
                currentIndex = 0; 

                updateQuizCard();
                updateQuiz();
            } else {
                modeSelectionElement.style.display = 'flex';
            }
        }

        function updateCard() { // 화면에 단어와 진도를 새로고침해주는 함수입니다
            const current = words[currentIndex]; // 현재 번호에 맞는 단어 데이터를 가져옵니다
            frontWordElement.textContent = current.en; // 앞면에 영어 단어를 씁니다
            backMeaningElement.textContent = current.ko; // 뒷면에 뜻을 씁니다
            backExampleElement.textContent = current.ex; // 뒷면에 예문을 씁니다
            progressTextElement.textContent = `${currentIndex + 1} / ${words.length}`; // 진도 표시를 업데이트합니다
            cardElement.classList.remove('flipped'); // 카드가 바뀔 때는 항상 앞면이 보이게 뒤집힘을 해제합니다
        }

        function updateQuizCard() {
            // 섞인 목록(quizList)에서 현재 단어를 가져옵니다
            const current = quizList[currentIndex];
            
            if (currentQuizMode === 'meaning') {
                // 뜻 맞추기 퀴즈: 카드 앞면에 영단어만 보여줌
                frontWordQuizElement.textContent = current.en;
            } else {
                // 스펠링 쓰기 퀴즈: 카드 앞면에 뜻만 보여줌
                frontWordQuizElement.textContent = current.ko;
            }

            backMeaningQuizElement.textContent = current.ko;
            backExampleQuizElement.textContent = current.ex;
            cardQuizElement.classList.remove('flipped');
        }

        function flipCard() { // 카드를 누르면 뒤집고 원래대로 돌리는 함수입니다
            cardElement.classList.toggle('flipped'); // flipped 클래스를 넣거나 빼서 카드를 뒤집습니다
        }

        function nextCard() { // 다음 버튼을 누르면 실행되는 함수입니다
            if (currentIndex < words.length - 1) { // 마지막 단어가 아니라면
                currentIndex++; // 번호를 1 증가시킵니다
                updateCard(); // 바뀐 카드를 화면에 보여줍니다
            } else { // 마지막 단어라면
                alert('마지막 단어입니다!'); // 알림창을 띄워줍니다
            }
        }

        function prevCard() { // 이전 버튼을 누르면 실행되는 함수입니다
            if (currentIndex > 0) { // 첫 번째 단어가 아니라면
                currentIndex--; // 번호를 1 감소시킵니다
                updateCard(); // 바뀐 카드를 화면에 보여줍니다
            } else { // 첫 번째 단어라면
                alert('첫 번째 단어입니다!'); // 알림창을 띄워줍니다
            }
        }

        function speakWord(event) { // 스피커 버튼을 누르면 단어를 읽어주는 함수입니다
            event.stopPropagation(); // 버튼을 눌러도 카드가 뒤집히지 않게 막습니다
            playSpeech(words[currentIndex].en);
        }

        function speakQuizWord(event) {
            event.stopPropagation();
            // 퀴즈 모드에서는 quizList의 현재 단어를 읽어줍니다
            playSpeech(quizList[currentIndex].en);
        }

        function playSpeech(text) {
            // 브라우저가 음성 기능을 지원하는지 확인합니다
            if (!('speechSynthesis' in window)) {
                alert('이 브라우저는 소리를 지원하지 않아요');
                return;
            }

            const utterance = new SpeechSynthesisUtterance(text); // 읽을 단어를 설정합니다
            utterance.lang = 'en-US'; // 미국 영어 발음으로 설정합니다
            utterance.rate = 0.8; // 말하는 속도를 조금 느리게(0.8배속) 설정합니다

            window.speechSynthesis.cancel(); // 이전에 말하던 내용이 있다면 취소하고 바로 읽습니다
            window.speechSynthesis.speak(utterance); // 소리로 읽어줍니다
        }

        function updateQuiz() { // 퀴즈를 생성하고 화면에 그려주는 함수입니다
            isAnswered = false; // 새로운 퀴즈이므로 풀리지 않은 상태로 설정합니다
            quizContentAreaElement.innerHTML = ''; // 기존 퀴즈 내용 초기화

            // quizList에서 현재 단어를 가져옵니다
            const currentWord = quizList[currentIndex];

            if (currentQuizMode === 'meaning') {
                quizTitleTextElement.textContent = '이 단어의 뜻은?';

                // 뜻 맞추기 (4지선다)
                const correctAnswer = currentWord.ko;
                let wrongOptions = words
                    .filter(w => w.ko !== correctAnswer)
                    .map(w => w.ko);
                
                wrongOptions.sort(() => Math.random() - 0.5);
                
                let options = [correctAnswer, wrongOptions[0], wrongOptions[1], wrongOptions[2]];
                if (words.length < 4) {
                    options = words.map(w => w.ko);
                }
                options.sort(() => Math.random() - 0.5);

                options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'quiz-btn';
                    btn.textContent = opt;
                    btn.onclick = () => checkMeaningAnswer(opt, correctAnswer, btn);
                    quizContentAreaElement.appendChild(btn);
                });

            } else {
                quizTitleTextElement.textContent = '이 뜻에 해당하는 영단어를 쓰세요';

                // 스펠링 쓰기 (타자 입력)
                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'quiz-input';
                input.placeholder = '영단어를 입력하세요';
                input.autocomplete = 'off';

                const submitBtn = document.createElement('button');
                submitBtn.className = 'quiz-btn';
                submitBtn.textContent = '정답 제출';

                input.onkeydown = (e) => {
                    if (e.key === 'Enter') {
                        checkSpellingAnswer(input.value.trim(), currentWord.en);
                    }
                };

                submitBtn.onclick = () => {
                    checkSpellingAnswer(input.value.trim(), currentWord.en);
                };

                quizContentAreaElement.appendChild(input);
                quizContentAreaElement.appendChild(submitBtn);

                // 입력창에 바로 포커스를 줍니다
                setTimeout(() => input.focus(), 50);
            }
        }

        function checkMeaningAnswer(selected, correct, clickedBtn) { // 뜻 맞추기 정답 확인 함수입니다
            if (isAnswered) return;
            isAnswered = true;

            const allButtons = quizContentAreaElement.querySelectorAll('.quiz-btn');

            if (selected === correct) {
                correctCount++;
                clickedBtn.classList.add('correct');
            } else {
                incorrectCount++;
                clickedBtn.classList.add('incorrect');
                allButtons.forEach(btn => {
                    if (btn.textContent === correct) {
                        btn.classList.add('correct');
                    }
                });
            }

            allButtons.forEach(btn => btn.disabled = true);
            scoreBoardElement.textContent = `맞은 개수: ${correctCount} | 틀린 개수: ${incorrectCount}`;

            setTimeout(() => {
                currentIndex = (currentIndex + 1) % quizList.length;
                updateQuizCard();
                updateQuiz();
            }, 1200);
        }

        function checkSpellingAnswer(userAnswer, correctSpelling) { // 스펠링 쓰기 정답 확인 함수입니다
            if (isAnswered) return;
            isAnswered = true;

            const input = quizContentAreaElement.querySelector('input');
            const submitBtn = quizContentAreaElement.querySelector('button');
            if (input) input.disabled = true;
            if (submitBtn) submitBtn.disabled = true;

            // 대소문자 구분 없이 비교
            if (userAnswer.toLowerCase() === correctSpelling.toLowerCase()) {
                correctCount++;
                if (input) {
                    input.style.backgroundColor = '#27ae60';
                    input.style.color = 'white';
                }
            } else {
                incorrectCount++;
                if (input) {
                    input.style.backgroundColor = '#c0392b';
                    input.style.color = 'white';
                    input.value = `${userAnswer} (정답: ${correctSpelling})`;
                }
            }

            scoreBoardElement.textContent = `맞은 개수: ${correctCount} | 틀린 개수: ${incorrectCount}`;

            setTimeout(() => {
                currentIndex = (currentIndex + 1) % quizList.length;
                updateQuizCard();
                updateQuiz();
            }, 1500);
        }
    </script> <!-- 자바스크립트가 끝났습니다 -->
