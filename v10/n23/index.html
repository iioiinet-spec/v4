<!DOCTYPE html> <!-- 이 문서는 HTML5 라는 뜻이에요 -->
<html lang="ko"> <!-- 한국어 문서라고 알려줘요 -->
<head> <!-- 화면에 안 보이는 설정을 넣는 곳이에요 -->
  <meta charset="UTF-8"> <!-- 한글이 깨지지 않게 해줘요 -->
  <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- 휴대폰에서도 크기가 알맞게 보여요 -->
  <title>영어 단어 카드</title> <!-- 브라우저 탭에 보이는 이름이에요 -->
  <link rel="preconnect" href="https://fonts.googleapis.com"> <!-- 구글 폰트 서버와 미리 연결해서 빨리 불러와요 -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> <!-- 글꼴 파일을 받는 서버와도 미리 연결해요 -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet"> <!-- 본명조(Noto Serif KR) 글꼴을 불러와요 -->
  <style> /* 여기부터 꾸미기(CSS)예요 */
    :root { /* 색깔을 한곳에 모아 둔 곳이에요 (색을 바꾸고 싶으면 여기만 고치세요) */
      --bg: #9706db; /* 화면 전체 배경색이에요 (진한 보라색) */
      --card: #924f9c; /* 카드와 보기 버튼의 바탕색이에요 (자주빛 보라색) */
      --text: #dbe4ff; /* 기본 글자색이에요 (아주 연한 하늘색) */
      --accent: #00e2e6; /* 포인트 색이에요 (밝은 청록색, 테두리·버튼·제목에 써요) */
      --ink: #2b0a3d; /* 청록색·초록색 버튼 위에 쓰는 진한 글자색이에요 (읽기 쉽게 해줘요) */
      --right: #3ddc84; /* 정답일 때 보이는 초록색이에요 */
      --shadow: rgba(0, 0, 0, 0.35); /* 그림자 색이에요 (반투명한 검정색) */
    } /* 색깔 모음 끝 */
    * { box-sizing: border-box; } /* 크기를 잴 때 테두리까지 함께 계산해요 */
    body { /* 화면 전체를 꾸며요 */
      margin: 0; /* 바깥 여백을 없애요 */
      min-height: 100vh; /* 화면 높이만큼은 꼭 채워요 */
      display: flex; /* 안에 있는 것들을 줄 세워요 */
      flex-direction: column; /* 위에서 아래로 차곡차곡 쌓아요 */
      align-items: center; /* 가로로 가운데에 놓아요 */
      justify-content: center; /* 세로로 가운데에 놓아요 */
      gap: 20px; /* 물건 사이에 틈을 만들어요 */
      background: var(--bg); /* 배경색은 :root의 --bg를 가져다 써요 */
      font-family: 'Noto Serif KR', serif; /* 한글과 영어 모두 본명조(Noto Serif KR) 글꼴이에요 */
      color: var(--text); /* 글자색은 :root의 --text를 가져다 써요 */
    } /* 화면 꾸미기 끝 */
    h1 { margin: 0; font-size: 26px; font-weight: 700; color: var(--accent); } /* 제목은 청록색으로 크고 굵게 해요 */
    .card { /* 카드 상자를 꾸며요 */
      position: relative; /* 스피커 버튼을 카드 안에 놓을 때 기준이 돼요 */
      width: min(90vw, 340px); /* 폭은 화면의 90%, 하지만 340px을 넘지 않아요 */
      height: 220px; /* 높이는 220px이에요 */
      perspective: 800px; /* 뒤집을 때 입체감이 나게 해요 */
      cursor: pointer; /* 마우스를 올리면 손가락 모양이 돼요 */
    } /* 카드 상자 끝 */
    .inner { /* 실제로 빙글 도는 부분이에요 */
      position: relative; /* 앞면·뒷면을 겹쳐 놓을 기준이에요 */
      width: 100%; /* 카드 상자만큼 넓어요 */
      height: 100%; /* 카드 상자만큼 높아요 */
      transition: transform 0.5s; /* 0.5초 동안 부드럽게 돌아요 */
      transform-style: preserve-3d; /* 3D 모양을 그대로 유지해요 */
    } /* 도는 부분 끝 */
    .card.flipped .inner { transform: rotateY(180deg); } /* flipped가 붙으면 반 바퀴 돌아요 */
    .face { /* 앞면과 뒷면이 같이 쓰는 꾸미기예요 */
      position: absolute; /* 두 면을 같은 자리에 겹쳐요 */
      inset: 0; /* 네 방향 끝까지 꽉 채워요 */
      display: flex; /* 안의 글자를 줄 세워요 */
      flex-direction: column; /* 위에서 아래로 쌓아요 */
      align-items: center; /* 가로 가운데로 놓아요 */
      justify-content: center; /* 세로 가운데로 놓아요 */
      padding: 16px; /* 안쪽에 여백을 줘요 */
      text-align: center; /* 글자를 가운데로 맞춰요 */
      background: var(--card); /* 앞면·뒷면 모두 카드색이에요 */
      color: var(--text); /* 카드 안 기본 글자색이에요 */
      border: 2px solid var(--accent); /* 청록색 테두리로 배경과 또렷하게 구분해요 */
      border-radius: 0px; /* 모서리를 둥글리지 않고 직각으로 해요 */
      box-shadow: 6px 6px 0 var(--shadow); /* 번지지 않는 또렷한 그림자를 오른쪽 아래에 넣어요 */
      backface-visibility: hidden; /* 돌아서 뒤쪽이 보이면 숨겨요 */
      -webkit-backface-visibility: hidden; /* 사파리 브라우저용 같은 설정이에요 */
    } /* 공통 꾸미기 끝 */
    .front { font-size: 40px; font-weight: 700; } /* 앞면은 큰 글자에 굵게 해요 */
    .back { transform: rotateY(180deg); } /* 뒷면은 미리 뒤집어 둬요 */
    .ko { margin: 0 0 12px; font-size: 32px; font-weight: 700; color: var(--accent); } /* 한국어 뜻은 크고 굵은 청록색이에요 */
    .ex { margin: 0; font-size: 19px; } /* 영어 예문은 조금 작게 해요 */
    .hint { margin: 0; font-size: 14px; color: var(--text); opacity: 0.8; } /* 안내 글자는 작고 살짝 흐리게 해요 */
    .bar { /* 버튼과 진도가 있는 줄이에요 */
      display: flex; /* 가로로 나란히 놓아요 */
      align-items: center; /* 세로로 가운데 맞춰요 */
      gap: 16px; /* 사이에 틈을 만들어요 */
    } /* 버튼 줄 꾸미기 끝 */
    button { /* 버튼을 꾸며요 */
      padding: 10px 18px; /* 버튼 안쪽 여백이에요 */
      font-family: inherit; /* 버튼도 본문과 같은 글꼴을 써요 */
      font-size: 16px; /* 글자 크기예요 */
      font-weight: 700; /* 글자를 굵게 해요 */
      border: none; /* 테두리를 없애요 */
      border-radius: 12px; /* 모서리를 둥글게 해요 */
      background: var(--accent); /* 버튼은 청록색이에요 */
      color: var(--ink); /* 청록색 위에서는 진한 글자색이 잘 보여요 */
      cursor: pointer; /* 손가락 모양으로 바뀌어요 */
    } /* 버튼 꾸미기 끝 */
    button:disabled { background: var(--card); color: var(--text); opacity: 0.45; cursor: not-allowed; } /* 누를 수 없을 땐 카드색으로 흐리게 바뀌어요 */
    #progress { min-width: 70px; text-align: center; font-weight: 700; } /* 진도 글자는 굵고 가운데에 놓아요 */
    .speak { /* 소리 버튼을 꾸며요 */
      position: absolute; /* 카드 위에 겹쳐서 놓아요 */
      top: 10px; /* 카드 위쪽에서 10px 떨어져요 */
      right: 10px; /* 카드 오른쪽에서 10px 떨어져요 */
      z-index: 2; /* 카드 앞면·뒷면보다 위에 보이게 해요 */
      padding: 6px 10px; /* 안쪽 여백을 작게 줄여요 */
      font-size: 18px; /* 스피커 그림 크기예요 */
      box-shadow: 0 2px 6px var(--shadow); /* 살짝 그림자를 넣어요 (바탕색은 기본 청록색 버튼을 따라가요) */
    } /* 소리 버튼 꾸미기 끝 */
    .quiz { width: min(90vw, 340px); text-align: center; } /* 퀴즈 상자는 카드와 같은 폭이에요 */
    .quiz-title { margin: 0 0 10px; font-size: 19px; font-weight: 700; color: var(--accent); } /* 퀴즈 질문은 청록색으로 굵게 해요 */
    .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } /* 보기 4개를 2줄 2칸으로 놓아요 */
    .choice { padding: 12px 8px; background: var(--card); color: var(--text); border: 2px solid var(--accent); word-break: keep-all; } /* 보기 버튼은 카드색 바탕에 청록색 테두리예요 */
    .choice.right { background: var(--right); color: var(--ink); border-color: var(--right); opacity: 1; } /* 정답은 초록색이고 흐려지지 않아요 */
    .choice.dim { background: var(--card); color: var(--text); border-color: var(--accent); opacity: 0.35; } /* 오답은 흐리게 보여요 */
    .score { margin: 12px 0 0; font-weight: 700; } /* 점수 글자예요 */
  </style> <!-- 꾸미기 끝 -->
</head> <!-- 설정 끝 -->
<body> <!-- 화면에 보이는 것들이 들어가는 곳이에요 -->
  <h1>영어 단어 카드</h1> <!-- 맨 위 제목이에요 -->
  <div class="card" id="card" role="button" tabindex="0" aria-label="카드 뒤집기"> <!-- 눌러서 뒤집는 카드 상자예요 -->
    <div class="inner"> <!-- 빙글 도는 부분이에요 -->
      <div class="face front" id="front"></div> <!-- 앞면: 영어 단어가 들어가요 -->
      <div class="face back"> <!-- 뒷면: 뜻과 예문이 들어가요 -->
        <p class="ko" id="ko"></p> <!-- 한국어 뜻이 들어가요 -->
        <p class="ex" id="ex"></p> <!-- 영어 예문이 들어가요 -->
      </div> <!-- 뒷면 끝 -->
    </div> <!-- 도는 부분 끝 -->
    <button class="speak" id="speak" aria-label="영어 단어 듣기" title="소리 듣기">🔊</button> <!-- 누르면 영어 단어를 읽어주는 스피커 버튼이에요 -->
  </div> <!-- 카드 상자 끝 -->
  <p class="hint">카드를 누르면 뒤집혀요!</p> <!-- 사용법을 알려주는 글이에요 -->
  <div class="bar"> <!-- 버튼 줄이에요 -->
    <button id="prev">◀ 이전</button> <!-- 앞 카드로 가는 버튼이에요 -->
    <span id="progress">1 / 120</span> <!-- 지금 몇 번째인지 보여줘요 -->
    <button id="next">다음 ▶</button> <!-- 다음 카드로 가는 버튼이에요 -->
  </div> <!-- 버튼 줄 끝 -->
  <div class="quiz"> <!-- 퀴즈 상자예요 -->
    <p class="quiz-title">이 단어의 뜻은?</p> <!-- 퀴즈 질문이에요 -->
    <div class="choices" id="choices"></div> <!-- 보기 버튼 4개가 들어갈 자리예요 -->
    <p class="score" id="score">맞은 개수: 0 / 틀린 개수: 0</p> <!-- 맞은 개수와 틀린 개수를 보여줘요 -->

      { en:'lose', ko:'잃어버리다', ex:'I do not want to lose my key.' }, // 81번: 잃어버리다
      { en:'enjoy', ko:'즐기다', ex:'I enjoy swimming.' }, // 82번: 즐기다
      { en:'worry', ko:'걱정하다', ex:'Do not worry about it.' }, // 83번: 걱정하다
      { en:'decide', ko:'결정하다', ex:'We must decide today.' }, // 84번: 결정하다
      { en:'share', ko:'나누다', ex:'Share your snack with me.' }, // 85번: 나누다
      { en:'arrive', ko:'도착하다', ex:'The bus arrives at eight.' }, // 86번: 도착하다
      { en:'important', ko:'중요한', ex:'Sleep is important for health.' }, // 87번: 중요한
      { en:'difficult', ko:'어려운', ex:'This math problem is difficult.' }, // 88번: 어려운
      { en:'easy', ko:'쉬운', ex:'The test was very easy.' }, // 89번: 쉬운
      { en:'beautiful', ko:'아름다운', ex:'The sea is beautiful.' }, // 90번: 아름다운
      { en:'busy', ko:'바쁜', ex:'My mother is busy today.' }, // 91번: 바쁜
      { en:'tired', ko:'피곤한', ex:'I am tired after the game.' }, // 92번: 피곤한
      { en:'hungry', ko:'배고픈', ex:'I am hungry now.' }, // 93번: 배고픈
      { en:'angry', ko:'화난', ex:'He was angry at the news.' }, // 94번: 화난
      { en:'sad', ko:'슬픈', ex:'She felt sad about the movie.' }, // 95번: 슬픈
      { en:'kind', ko:'친절한', ex:'She is kind to everyone.' }, // 96번: 친절한
      { en:'smart', ko:'똑똑한', ex:'He is a smart student.' }, // 97번: 똑똑한
      { en:'funny', ko:'웃긴', ex:'The story was funny.' }, // 98번: 웃긴
      { en:'interesting', ko:'흥미로운', ex:'This book is interesting.' }, // 99번: 흥미로운
      { en:'popular', ko:'인기 있는', ex:'This singer is popular in Korea.' }, // 100번: 인기 있는
      { en:'favorite', ko:'가장 좋아하는', ex:'Blue is my favorite color.' }, // 101번: 가장 좋아하는
      { en:'different', ko:'다른', ex:'Every person is different.' }, // 102번: 다른
      { en:'same', ko:'같은', ex:'We have the same bag.' }, // 103번: 같은
      { en:'new', ko:'새로운', ex:'I bought a new phone.' }, // 104번: 새로운
      { en:'old', ko:'오래된', ex:'This is an old house.' }, // 105번: 오래된
      { en:'fast', ko:'빠른', ex:'A cheetah is very fast.' }, // 106번: 빠른
      { en:'weather', ko:'날씨', ex:'The weather is nice today.' }, // 107번: 날씨
      { en:'season', ko:'계절', ex:'Winter is a cold season.' }, // 108번: 계절
      { en:'city', ko:'도시', ex:'Seoul is a big city.' }, // 109번: 도시
      { en:'country', ko:'나라', ex:'Korea is a small country.' }, // 110번: 나라
      { en:'world', ko:'세계', ex:'I want to travel around the world.' }, // 111번: 세계
      { en:'music', ko:'음악', ex:'She loves classical music.' }, // 112번: 음악
      { en:'movie', ko:'영화', ex:'We watched a movie last night.' }, // 113번: 영화
      { en:'story', ko:'이야기', ex:'Grandpa told me a funny story.' }, // 114번: 이야기
      { en:'idea', ko:'생각, 아이디어', ex:'That is a good idea.' }, // 115번: 생각, 아이디어
      { en:'problem', ko:'문제', ex:'I can solve this problem.' }, // 116번: 문제
      { en:'dream', ko:'꿈', ex:'My dream is to be a doctor.' }, // 117번: 꿈
      { en:'future', ko:'미래', ex:'I think about my future.' }, // 118번: 미래
      { en:'health', ko:'건강', ex:'Good food is good for your health.' }, // 119번: 건강
      { en:'money', ko:'돈', ex:'I save money every week.' } // 120번: 돈
    ]; // 단어 목록 끝 (여기까지만 고치면 돼요)

    let index = 0; // 지금 몇 번째 카드인지 기억해요 (0부터 시작)
    const card = document.getElementById('card'); // 카드 상자를 찾아와요
    const frontEl = document.getElementById('front'); // 앞면 칸을 찾아와요
    const koEl = document.getElementById('ko'); // 뜻 칸을 찾아와요
    const exEl = document.getElementById('ex'); // 예문 칸을 찾아와요
    const progressEl = document.getElementById('progress'); // 진도 칸을 찾아와요
    const prevBtn = document.getElementById('prev'); // 이전 버튼을 찾아와요
    const nextBtn = document.getElementById('next'); // 다음 버튼을 찾아와요

    function render() { // 화면을 지금 카드로 바꾸는 함수예요
      const w = words[index]; // 지금 단어 하나를 꺼내요
      frontEl.textContent = w.en; // 앞면에 영어 단어를 써요
      setTimeout(function () { // 카드가 돌아가는 동안 잠깐 기다려요 (정답이 먼저 보이지 않게)
        koEl.textContent = w.ko; // 뒷면에 한국어 뜻을 써요
        exEl.textContent = w.ex; // 뒷면에 예문을 써요
      }, 250); // 0.25초 기다려요
      progressEl.textContent = (index + 1) + ' / ' + words.length; // "3 / 20" 처럼 진도를 써요
      prevBtn.disabled = (index === 0); // 첫 카드이면 이전 버튼을 꺼요
      nextBtn.disabled = (index === words.length - 1); // 마지막 카드이면 다음 버튼을 꺼요
      makeQuiz(); // 퀴즈도 지금 카드에 맞게 새로 만들어요
    } // render 함수 끝

    function flip() { // 카드를 뒤집는 함수예요
      card.classList.toggle('flipped'); // flipped 이름표를 붙였다 뗐다 해요
    } // flip 함수 끝

    function go(step) { // 카드를 옮기는 함수예요 (+1은 다음, -1은 이전)
      index = index + step; // 카드 번호를 바꿔요
      card.classList.remove('flipped'); // 새 카드는 앞면부터 보여줘요
      render(); // 화면을 새 카드로 바꿔요
    } // go 함수 끝

    card.addEventListener('click', flip); // 카드를 누르면 뒤집어요
    card.addEventListener('keydown', function (e) { // 키보드를 눌렀을 때를 지켜봐요
      if (e.key === 'Enter' || e.key === ' ') { // 엔터나 스페이스바이면
        e.preventDefault(); // 화면이 아래로 내려가지 않게 막아요
        flip(); // 카드를 뒤집어요
      } // if 끝
    }); // 키보드 지켜보기 끝
    prevBtn.addEventListener('click', function () { go(-1); }); // 이전 버튼을 누르면 한 장 뒤로 가요
    nextBtn.addEventListener('click', function () { go(1); }); // 다음 버튼을 누르면 한 장 앞으로 가요
    document.addEventListener('keydown', function (e) { // 화살표 키도 쓸 수 있게 해요
      if (e.key === 'ArrowLeft') prevBtn.click(); // 왼쪽 화살표는 이전 버튼과 같아요
      if (e.key === 'ArrowRight') nextBtn.click(); // 오른쪽 화살표는 다음 버튼과 같아요
    }); // 화살표 키 끝

    const speakBtn = document.getElementById('speak'); // 스피커 버튼을 찾아와요

    function speak() { // 지금 영어 단어를 소리로 읽어주는 함수예요
      if (!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)) { // 이 브라우저에 음성 기능이 없으면
        alert('이 브라우저는 소리를 지원하지 않아요'); // 안내 글을 보여줘요
        return; // 여기서 멈춰요
      } // if 끝
      window.speechSynthesis.cancel(); // 읽던 소리가 있으면 먼저 멈춰요
      const utter = new SpeechSynthesisUtterance(words[index].en); // 지금 영어 단어를 읽을 준비를 해요
      utter.lang = 'en-US'; // 영어(미국) 발음으로 읽어요
      utter.rate = 0.8; // 보통(1)보다 조금 느리게 읽어요
      window.speechSynthesis.speak(utter); // 소리를 내요
    } // speak 함수 끝

    speakBtn.addEventListener('click', function (e) { // 스피커 버튼을 누르면
      e.stopPropagation(); // 카드가 같이 뒤집히지 않게 막아요
      speak(); // 단어를 읽어줘요
    }); // 스피커 클릭 끝
    speakBtn.addEventListener('keydown', function (e) { // 스피커 버튼에서 키를 누르면
      if (e.key === 'Enter' || e.key === ' ') e.stopPropagation(); // 엔터·스페이스가 카드까지 가서 뒤집지 않게 막아요
    }); // 스피커 키보드 끝

    const choicesEl = document.getElementById('choices'); // 보기 버튼이 들어갈 자리를 찾아와요
    const scoreEl = document.getElementById('score'); // 점수 글자 칸을 찾아와요
    let answered = false; // 이번 퀴즈를 이미 풀었는지 기억해요
    let correctCount = 0; // 맞힌 개수예요
    let wrongCount = 0; // 틀린 개수예요

    function shuffle(list) { // 목록을 마구 섞어서 돌려주는 함수예요
      const a = list.slice(); // 원래 목록은 그대로 두고 복사본을 만들어요
      for (let i = a.length - 1; i > 0; i--) { // 뒤에서부터 하나씩 살펴봐요
        const j = Math.floor(Math.random() * (i + 1)); // 0부터 i 사이에서 번호를 하나 뽑아요
        const t = a[i]; // 한 칸의 내용을 잠깐 따로 들고 있어요
        a[i] = a[j]; // 뽑은 칸의 내용을 가져와요
        a[j] = t; // 따로 들고 있던 내용을 뽑은 칸에 넣어요
      } // for 끝
      return a; // 섞은 목록을 돌려줘요
    } // shuffle 함수 끝

    function makeQuiz() { // 지금 카드에 맞는 퀴즈를 만드는 함수예요
      const correct = words[index].ko; // 정답은 지금 단어의 뜻이에요
      const allKo = Array.from(new Set(words.map(function (x) { return x.ko; }))); // 모든 단어의 뜻을 모으고 같은 것은 하나만 남겨요
      const wrongs = shuffle(allKo.filter(function (k) { return k !== correct; })).slice(0, 3); // 정답이 아닌 뜻을 섞어서 3개 골라요
      const options = shuffle([correct].concat(wrongs)); // 정답과 오답을 합쳐서 한 번 더 섞어요
      answered = false; // 아직 안 풀었다고 표시해요
      choicesEl.innerHTML = ''; // 이전 보기 버튼을 모두 지워요
      options.forEach(function (text) { // 보기를 하나씩 만들어요
        const b = document.createElement('button'); // 새 버튼을 만들어요
        b.className = 'choice'; // 꾸미기 이름표를 붙여요
        b.textContent = text; // 버튼에 뜻을 써요
        b.addEventListener('click', function () { checkAnswer(text, correct); }); // 누르면 채점해요
        choicesEl.appendChild(b); // 버튼을 화면에 붙여요
      }); // 보기 만들기 끝
    } // makeQuiz 함수 끝

    function checkAnswer(text, correct) { // 보기를 눌렀을 때 채점하는 함수예요
      if (answered) return; // 이미 풀었으면 아무것도 하지 않아요
      answered = true; // 풀었다고 표시해요
      if (text === correct) { // 고른 것이 정답이면
        correctCount = correctCount + 1; // 맞은 개수를 1 늘려요
      } else { // 고른 것이 틀렸으면
        wrongCount = wrongCount + 1; // 틀린 개수를 1 늘려요
      } // if 끝
      Array.from(choicesEl.children).forEach(function (b) { // 보기 버튼을 하나씩 살펴봐요
        b.classList.add(b.textContent === correct ? 'right' : 'dim'); // 정답은 초록색, 나머지는 흐리게 해요
        b.disabled = true; // 더 못 누르게 막아요
      }); // 버튼 살펴보기 끝
      scoreEl.textContent = '맞은 개수: ' + correctCount + ' / 틀린 개수: ' + wrongCount; // 점수를 새로 써요
    } // checkAnswer 함수 끝

    render(); // 처음 화면에 첫 번째 카드를 보여줘요
  </script> <!-- 움직이는 코드 끝 -->
</body> <!-- 화면 끝 -->
</html> <!-- 문서 끝 -->
