<!DOCTYPE html> <!-- 문서의 형식을 HTML5로 지정합니다 -->
<html lang="ko"> <!-- 웹페이지의 언어를 한국어로 설정합니다 -->
<head> <!-- 웹페이지의 설정 정보를 담는 영역입니다 -->
    <meta charset="UTF-8"> <!-- 한글이 깨지지 않도록 인코딩 방식을 설정합니다 -->
    <title>초장문 영어 단어 카드 & 퀴즈</title> <!-- 브라우저 탭에 표시될 제목입니다 -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Jua&display=swap" rel="stylesheet"> <!-- 구글 폰트(한글: Jua, 영어: Fredoka)를 불러옵니다 -->
    <style> <!-- 디자인을 꾸미는 CSS 스타일을 시작합니다 -->
        :root {
            --bg-color: #fff0f6;      /* 웹페이지 전체 배경색입니다 */
            --card-bg: #ffffff;       /* 단어 카드와 퀴즈 상자의 배경색입니다 */
            --text-color: #5b3a52;    /* 글자 기본 색상입니다 */
            --accent-color: #ff6fa5;  /* 버튼과 강조에 사용되는 포인트 색상입니다 */
        } /* CSS 변수 설정이 끝납니다 */

        body { font-family: 'Jua', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: var(--bg-color); color: var(--text-color); } /* 화면 전체를 가운데 정렬하고 배경색을 지정합니다 */
        .card-container { perspective: 1000px; width: 480px; height: 340px; margin-bottom: 15px; cursor: pointer; } /* 단어와 발음이 길어져 카드의 높이를 넉넉하게 조정합니다 */
        .card { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s; } /* 카드 전체의 크기와 뒤집기 애니메이션을 설정합니다 */
        .card.flipped { transform: rotateY(180deg); } /* 카드가 뒤집혔을 때 180도 회전시킵니다 */
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 28px; box-shadow: 0 6px 16px rgba(91,58,82,0.1); background-color: var(--card-bg); padding: 25px; box-sizing: border-box; text-align: center; } /* 모서리가 28px 둥근 카드 앞면과 뒷면의 공통 모양을 설정합니다 */
        .card-back { transform: rotateY(180deg); } /* 뒷면의 기본 회전 상태를 지정합니다 */
        .word { font-family: 'Fredoka', sans-serif; font-size: 18px; font-weight: 600; color: var(--text-color); margin-bottom: 6px; word-break: break-all; } /* 영어 단어에 Fredoka 폰트를 적용하고 줄바꿈을 허용합니다 */
        .pronunciation { font-family: 'Fredoka', sans-serif; font-size: 13px; color: #8c6883; margin-bottom: 8px; font-style: italic; word-break: break-all; } /* 발음 빈칸에 들어갈 글자의 폰트와 색상을 설정합니다 */
        .meaning { font-family: 'Jua', sans-serif; font-size: 18px; color: var(--text-color); margin-bottom: 6px; word-break: keep-all; } /* 뜻 글자에 주아 폰트와 크기를 설정합니다 */
        .example { font-family: 'Fredoka', sans-serif; font-size: 13px; color: var(--text-color); margin-bottom: 3px; word-break: break-word; } /* 예문 영어 글자에 Fredoka 폰트를 적용합니다 */
        .example-ko { font-family: 'Jua', sans-serif; font-size: 12px; color: var(--text-color); opacity: 0.8; margin-bottom: 8px; word-break: keep-all; } /* 예문 해석 글자의 폰트와 투명도를 설정합니다 */
        .controls { display: flex; gap: 15px; align-items: center; margin-bottom: 15px; } /* 버튼과 진도 표시를 나란히 배치합니다 */
        button { padding: 8px 18px; font-size: 15px; cursor: pointer; border: none; border-radius: 28px; background-color: var(--accent-color); color: white; font-weight: bold; font-family: 'Jua', sans-serif; box-shadow: 0 4px 10px rgba(255,111,165,0.3); } /* 버튼의 모양과 포인트를 꾸밉니다 */
        button:hover { opacity: 0.9; } /* 마우스를 올렸을 때 버튼 투명도를 조절합니다 */
        .speaker-btn { font-size: 12px; padding: 4px 10px; margin-top: 2px; } /* 스피커 버튼 모양을 꾸밉니다 */
        #progress { font-size: 17px; font-weight: bold; color: var(--text-color); } /* 진도 표시 글자의 크기와 색상을 지정합니다 */
        .quiz-container { background: var(--card-bg); padding: 12px 20px; border-radius: 28px; width: 450px; box-shadow: 0 6px 16px rgba(91,58,82,0.1); text-align: center; } /* 퀴즈 전체 상자 모양과 둥글기를 꾸밉니다 */
        .quiz-title { font-size: 15px; font-weight: bold; color: var(--text-color); margin-bottom: 8px; } /* 퀴즈 질문 제목의 글자 크기와 색상을 지정합니다 */
        .quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } /* 보기 버튼 4개를 2줄 2칸으로 나란히 배치합니다 */
        .quiz-btn { padding: 8px; font-size: 13px; background-color: var(--bg-color); color: var(--text-color); border: none; border-radius: 28px; cursor: pointer; font-weight: bold; box-shadow: none; } /* 보기 버튼의 모양을 꾸밉니다 */
        .quiz-btn:hover { background-color: #ffd1e3; } /* 마우스를 올릴 때 보기 버튼 색상을 바꿉니다 */
        .quiz-btn.correct { background-color: #ff6fa5 !important; color: white; } /* 정답을 맞혔을 때 포인트 색상으로 표시합니다 */
        .quiz-btn.wrong { opacity: 0.3; } /* 틀린 보기일 때 투명하게 흐리게 만듭니다 */
        .quiz-score { margin-top: 10px; font-size: 14px; font-weight: bold; color: var(--text-color); } /* 맞은 개수와 틀린 개수를 보여주는 글자 모양입니다 */
    </style> <!-- CSS 스타일이 끝납니다 -->
</head> <!-- 헤드 영역이 끝납니다 -->
<body> <!-- 웹페이지에 실제로 보일 내용을 시작합니다 -->
    <div class="card-container" onclick="flipCard()"> <!-- 카드를 감싸는 상자이며 누르면 뒤집힙니다 -->
        <div class="card" id="card"> <!-- 실제로 뒤집히는 카드 요소입니다 -->
            <div class="card-face" id="card-front"> <!-- 카드의 앞면입니다 -->
                <div class="word" id="front-word">영어단어</div> <!-- 앞면에 표시될 영어 단어입니다 -->
                <div style="font-size: 12px; opacity: 0.7; margin-top: 10px;">(눌러서 뜻과 예문 보기)</div> <!-- 안내 문구입니다 -->
            </div> <!-- 앞면이 끝납니다 -->
            <div class="card-face card-back" id="card-back"> <!-- 카드의 뒷면입니다 -->
                <div class="word" id="back-word">영어단어</div> <!-- 뒷면에 다시 표시될 영어 단어입니다 -->
                <div class="pronunciation" id="back-pronunciation"></div> <!-- 발음이 비어있는 빈칸 자리입니다 -->
                <div class="meaning" id="back-meaning">뜻</div> <!-- 뒷면에 표시될 뜻입니다 -->
                <div class="example" id="back-example">예문</div> <!-- 뒷면에 표시될 예문입니다 -->
                <div class="example-ko" id="back-example-ko"></div> <!-- 예문 해석 자리를 비워둡니다 -->
                <button class="speaker-btn" onclick="event.stopPropagation(); speakWord()">🔊 발음 듣기</button> <!-- 단어를 소리로 읽어주는 버튼입니다 -->
            </div> <!-- 뒷면이 끝납니다 -->
        </div> <!-- 카드 요소가 끝납니다 -->
    </div> <!-- 카드 상자가 끝납니다 -->
    <div class="controls"> <!-- 버튼과 진도를 감싸는 상자입니다 -->
        <button onclick="prevCard()">이전</button> <!-- 이전 단어로 가는 버튼입니다 -->
        <span id="progress">1 / 10</span> <!-- 현재 진도를 보여주는 글자입니다 -->
        <button onclick="nextCard()">다음</button> <!-- 다음 단어로 가는 버튼입니다 -->
    </div> <!-- 컨트롤 상자가 끝납니다 -->
    <div class="quiz-container"> <!-- 퀴즈 전체를 감싸는 상자입니다 -->
        <div class="quiz-title">이 단어의 뜻은 무엇일까요?</div> <!-- 퀴즈 안내 질문입니다 -->
        <div class="quiz-options" id="quiz-options"></div> <!-- 정답과 오답 보기 4개가 들어갈 자리입니다 -->
        <div class="quiz-score" id="quiz-score">맞은 개수: 0 | 틀린 개수: 0</div> <!-- 맞고 틀린 횟수를 세어주는 글자입니다 -->
    </div> <!-- 퀴즈 상자가 끝납니다 -->
    <script> <!-- 자바스크립트 동작 코드를 시작합니다 -->
        // [여기만 고치세요] 단어 목록을 추가하거나 수정할 수 있습니다
        const WORDS = [
            { 
                en: 'Pneumonoultramicroscopicsilicovolcanoconiosis', 
                pr: '', 
                ko: '규산 먼지 흡입과 관련된 폐 질환 (진폐증)', 
                ex: 'The miner suffered from pneumonoultramicroscopicsilicovolcanoconiosis after years underground.' 
            }, // 첫 번째 단어와 예문
            { 
                en: 'Hippopotomonstrosesquippedaliophobia', 
                pr: '', 
                ko: '긴 단어에 대한 공포를 뜻하는 비공식 표현', 
                ex: 'People with hippopotomonstrosesquippedaliophobia hate reading lengthy medical textbooks.' 
            }, // 두 번째 단어와 예문
            { 
                en: 'Supercalifragilisticexpialidocious', 
                pr: '', 
                ko: '환상적인, 아주 멋진', 
                ex: 'She felt supercalifragilisticexpialidocious when she won the grand prize.' 
            }, // 세 번째 단어와 예문
            { 
                en: 'Pseudopseudohypoparathyroidism', 
                pr: '', 
                ko: '특정 유전성 부갑상선 기능 저하 유사 증상', 
                ex: 'The geneticist explained the complex symptoms of pseudopseudohypoparathyroidism.' 
            }, // 네 번째 단어와 예문
            { 
                en: 'Eellogofusciouhipoppokunurious', 
                pr: '', 
                ko: '매우 훌륭한, 아주 좋은', 
                ex: 'He used an eellogofusciouhipoppokunurious description to praise her artwork.' 
            }, // 다섯 번째 단어와 예문
            { 
                en: 'Floccinaucinihilipilification', 
                pr: '', 
                ko: '어떤 것을 가치 없다고 여기는 습관이나 행위', 
                ex: 'His constant floccinaucinihilipilification of other people\'s work made him unpopular.' 
            }, // 여섯 번째 단어와 예문
            { 
                en: 'Antidisestablishmentarianism', 
                pr: '', 
                ko: '영국 국교회의 국교 지위 폐지에 반대하는 입장', 
                ex: 'Historians study 19th-century political movements like antidisestablishmentarianism.' 
            }, // 일곱 번째 단어와 예문
            { 
                en: 'Honorificabilitudinitatibus', 
                pr: '', 
                ko: '영광스러움을 누릴 수 있는 상태', 
                ex: 'This rare word is famously found in Shakespeare\'s play Love\'s Labour\'s Lost.' 
            }, // 여덟 번째 단어와 예문
            { 
                en: 'Electroencephalographically', 
                pr: '', 
                ko: '뇌파 검사와 관련된 방식으로', 
                ex: 'The patient\'s brain activity was monitored electroencephalographically during sleep.' 
            }, // 아홉 번째 단어와 예문
            { 
                en: 'Radioimmunoelectrophoresis', 
                pr: '', 
                ko: '방사면역전기영동법 (단백질 분석 검사 기법)', 
                ex: 'The laboratory used radioimmunoelectrophoresis to analyze serum proteins.' 
            }  // 열 번째 단어와 예문
        ]; // 단어 목록 배열이 끝납니다
        let currentIndex = 0; // 현재 보고 있는 단어의 번호입니다 (0부터 시작)
        let isFlipped = false; // 카드가 뒤집혀 있는지 상태를 저장합니다
        let correctCount = 0; // 맞은 개수를 세어주는 변수입니다
        let wrongCount = 0; // 틀린 개수를 세어주는 변수입니다
        let isAnswered = false; // 정답을 이미 골랐는지 상태를 저장합니다
        const cardElement = document.getElementById('card'); // HTML에서 카드 요소를 찾아옵니다
        const frontWord = document.getElementById('front-word'); // 앞면 단어 요소를 찾아옵니다
        const backWord = document.getElementById('back-word'); // 뒷면 단어 요소를 찾아옵니다
        const backPronunciation = document.getElementById('back-pronunciation'); // 뒷면 발음 요소를 찾아옵니다
        const backMeaning = document.getElementById('back-meaning'); // 뒷면 뜻 요소를 찾아옵니다
        const backExample = document.getElementById('back-example'); // 뒷면 예문 요소를 찾아옵니다
        const backExampleKo = document.getElementById('back-example-ko'); // 뒷면 예문 해석 요소를 찾아옵니다
        const progressElement = document.getElementById('progress'); // 진도 표시 요소를 찾아옵니다
        const quizOptionsElement = document.getElementById('quiz-options'); // HTML에서 보기 버튼 영역을 찾아옵니다
        const quizScoreElement = document.getElementById('quiz-score'); // HTML에서 점수 표시 영역을 찾아옵니다
        function updateCard() { // 화면의 단어와 진도를 최신 상태로 바꿔주는 함수입니다
            frontWord.textContent = WORDS[currentIndex].en; // 현재 영어 단어를 앞면에 넣습니다
            backWord.textContent = WORDS[currentIndex].en; // 현재 영어 단어를 뒷면에 넣습니다
            backPronunciation.textContent = WORDS[currentIndex].pr; // 현재 발음 빈칸을 뒷면에 넣습니다
            backMeaning.textContent = WORDS[currentIndex].ko; // 현재 뜻을 뒷면에 넣습니다
            backExample.textContent = '"' + WORDS[currentIndex].ex + '"'; // 현재 예문을 뒷면에 넣습니다
            backExampleKo.textContent = ''; // 예문 해석 자리를 비워둡니다
            progressElement.textContent = (currentIndex + 1) + ' / ' + WORDS.length; // 진도 표시를 업데이트합니다
            generateQuiz(); // 단어가 바뀔 때마다 새로운 퀴즈를 만들어냅니다
        } // updateCard 함수가 끝납니다
        function flipCard() { // 카드를 뒤집거나 원래대로 돌리는 함수입니다
            isFlipped = !isFlipped; // 뒤집힘 상태를 반대로 바꿉니다
            if (isFlipped) { // 만약 뒤집힌 상태라면
                cardElement.classList.add('flipped'); // 카드에 flipped 클래스를 더해 회전시킵니다
            } else { // 뒤집힌 상태가 아니라면
                cardElement.classList.remove('flipped'); // flipped 클래스를 없애 원래대로 돌립니다
            } // if-else 조건문이 끝납니다
        } // flipCard 함수가 끝납니다
        function nextCard() { // 다음 단어로 넘어가는 함수입니다
            if (isFlipped) { flipCard(); } // 만약 뒤집혀 있다면 앞면으로 돌려놓습니다
            currentIndex = (currentIndex + 1) % WORDS.length; // 다음 번호로 이동하며 마지막이면 처음으로 갑니다
            setTimeout(updateCard, 200); // 카드가 돌아가는 중간에 글자가 바뀌지 않도록 살짝 기다렸다가 내용을 바꿉니다
        } // nextCard 함수가 끝납니다
        function prevCard() { // 이전 단어로 돌아가는 함수입니다
            if (isFlipped) { flipCard(); } // 만약 뒤집혀 있다면 앞면으로 돌려놓습니다
            currentIndex = (currentIndex - 1 + WORDS.length) % WORDS.length; // 이전 번호로 이동하며 첫번째면 마지막으로 갑니다
            setTimeout(updateCard, 200); // 카드가 돌아가는 중간에 글자가 바뀌지 않도록 살짝 기다렸다가 내용을 바꿉니다
        } // prevCard 함수가 끝납니다
        function speakWord() { // 영어 단어를 소리로 읽어주는 함수입니다
            if ('speechSynthesis' in window) { // 브라우저가 음성 기능을 지원하는지 확인합니다
                const text = WORDS[currentIndex].en; // 현재 단어를 가져옵니다
                const utterance = new SpeechSynthesisUtterance(text); // 읽어줄 내용을 만듭니다
                utterance.lang = 'en-US'; // 영어 발음으로 설정합니다
                utterance.rate = 0.8; // 초등학생도 듣기 좋게 조금 느린 속도(0.8배속)로 설정합니다
                window.speechSynthesis.speak(utterance); // 소리를 재생합니다
            } else { // 브라우저가 음성 기능을 지원하지 않는다면
                alert('이 브라우저는 소리를 지원하지 않아요'); // 지원하지 않는다는 알림창을 띄웁니다
            } // if-else 조건문이 끝납니다
        } // speakWord 함수가 끝납니다
        function generateQuiz() { // 퀴즈 보기 4개를 무작위로 만들어주는 함수입니다
            isAnswered = false; // 정답 선택 상태를 초기화합니다
            quizOptionsElement.innerHTML = ''; // 이전 보기 버튼들을 깨끗이 지웁니다
            const currentKo = WORDS[currentIndex].ko; // 현재 단어의 진짜 뜻을 가져옵니다
            let options = [currentKo]; // 보기 배열에 정답을 먼저 넣습니다
            while (options.length < 4) { // 보기가 4개가 될 때까지 반복합니다
                const randomWord = WORDS[Math.floor(Math.random() * WORDS.length)]; // 단어 목록에서 무작위로 하나를 뽑습니다
                if (!options.includes(randomWord.ko)) { // 아직 보기 안에 없는 뜻이라면
                    options.push(randomWord.ko); // 오답 보기로 추가합니다
                } // if 조건문이 끝납니다
            } // while 반복문이 끝납니다
            options.sort(() => Math.random() - 0.5); // 4개의 보기를 무작위로 섞어줍니다
            options.forEach(optionText => { // 4개의 보기 각각에 대해 버튼을 만듭니다
                const btn = document.createElement('button'); // 버튼 요소를 새로 만듭니다
                btn.className = 'quiz-btn'; // 버튼에 디자인 클래스를 넣습니다
                btn.textContent = optionText; // 버튼 글자에 뜻을 넣습니다
                btn.onclick = () => checkAnswer(optionText, currentKo, btn); // 버튼을 누르면 정답을 확인하는 함수를 연결합니다
                quizOptionsElement.appendChild(btn); // 만든 버튼을 화면에 추가합니다
            }); // forEach 반복문이 끝납니다
        } // generateQuiz 함수가 끝납니다
        function checkAnswer(selected, correct, clickedBtn) { // 사용자가 고른 답이 맞았는지 확인하는 함수입니다
            if (isAnswered) return; // 이미 답을 골랐다면 중복해서 누르지 못하게 막습니다
            isAnswered = true; // 답을 골랐다고 상태를 바꿉니다
            const allButtons = quizOptionsElement.getElementsByTagName('button'); // 모든 보기 버튼을 가져옵니다
            for (let btn of allButtons) { // 모든 버튼을 확인합니다
                if (btn.textContent === correct) { // 진짜 정답인 버튼이라면
                    btn.classList.add('correct'); // 초록색으로 표시합니다
                } else if (btn === clickedBtn) { // 내가 누른 버튼이 오답이라면
                    btn.classList.add('wrong'); // 흐리게 표시합니다
                } else { // 나머지 안 누른 오답 버튼들도
                    btn.classList.add('wrong'); // 흐리게 표시합니다
                } // if-else 조건문이 끝납니다
            } // for 반복문이 끝납니다
            if (selected === correct) { // 고른 답이 정답과 같다면
                correctCount++; // 맞은 개수를 1 증가시킵니다
            } else { // 틀렸다면
                wrongCount++; // 틀린 개수를 1 증가시킵니다
            } // if-else 조건문이 끝납니다
            quizScoreElement.textContent = '맞은 개수: ' + correctCount + ' | 틀린 개수: ' + wrongCount; // 점수판 글자를 업데이트합니다
        } // checkAnswer 함수가 끝납니다
        updateCard(); // 웹페이지가 처음 켜졌을 때 첫 단어를 화면에 보여줍니다
    </script> <!-- 자바스크립트 코드가 끝납니다 -->
</body> <!-- 웹페이지 몸체가 끝납니다 -->
</html> <!-- HTML 문서가 끝납니다 -->
