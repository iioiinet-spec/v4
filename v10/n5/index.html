<!DOCTYPE html>

<head>

<title>Word Quest · 영어 단어학습장</title>
<style>
:root{
  --paper:#fbf6e9;--line:#dfe5f3;--margin:#e98a82;--ink:#22305c;--soft:#667099;--card:#fffef8;
  --edge:#22305c;--shade:#22305c;--accent:#3b5bdb;--accent-ink:#fff;--hl:#ffe88a;--lvtxt:#3a2f00;

}

    --ok:#4cd39a;--ok-bg:#16382d;--bad:#ff7a73;--bad-bg:#42201f}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--ink);line-height:1.5;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Segoe UI",Roboto,sans-serif;
  background:repeating-linear-gradient(to bottom,transparent 0 31px,var(--line) 31px 32px),var(--paper);
  background-attachment:fixed}
body::before{content:"";position:fixed;top:0;bottom:0;left:calc(50% - 372px);width:2px;background:var(--margin);opacity:.45;pointer-events:none}
@media(max-width:780px){body::before{left:10px}}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
 
.hdr{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:10px max(16px,calc(50% - 344px));
  background:var(--paper);background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(6px)}
.logo{border:0;background:none;font-weight:800;font-size:18px;cursor:pointer;padding:4px 0;white-space:nowrap}
.lvl{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.lv{font-weight:800;background:var(--hl);color:var(--lvtxt);padding:1px 9px;border-radius:999px;font-size:13px;border:2px solid var(--edge);white-space:nowrap}
.xpbar{flex:1;min-width:40px;height:10px;border-radius:99px;background:var(--line);border:2px solid var(--edge);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--accent);transition:width .4s}
.xpn{font-size:12px;color:var(--soft);white-space:nowrap}
@media(max-width:440px){.xpn{display:none}.logo span{display:none}}
.icon{border:0;background:none;font-size:20px;cursor:pointer;padding:4px 8px;border-radius:10px;line-height:1}
.icon:hover{background:var(--line)}
 
.wrap{max-width:720px;margin:0 auto;padding:8px 16px 64px}
.card{background:var(--card);border:2px solid var(--edge);border-radius:18px;box-shadow:4px 4px 0 var(--shade);padding:20px}
.btn{border:2px solid var(--edge);background:var(--card);border-radius:14px;padding:11px 16px;cursor:pointer;font-weight:700;
  box-shadow:0 3px 0 var(--shade);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.small{padding:6px 12px;font-size:14px;border-radius:12px}
.btn.danger{color:var(--bad)}
.row2{display:flex;gap:10px;margin-top:16px}
.row2 .btn{flex:1}
.pos{font-size:14px;color:var(--soft);font-style:italic}
.tiny{text-align:center;color:var(--soft);font-size:13px;margin-top:12px}
mark{background:var(--hl);color:inherit;border-radius:4px;padding:0 3px}
 
/* home */
.hero{margin:12px 0 16px}
.hero h1{font-size:clamp(26px,6vw,34px);font-weight:800;letter-spacing:-.5px}
.hero p{color:var(--soft)}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.stat{background:var(--card);border:2px solid var(--edge);border-radius:14px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--soft)}
.today{margin-bottom:8px;position:relative}
.today .tag{position:absolute;top:-12px;left:14px;background:var(--hl);color:var(--lvtxt);font-size:12px;font-weight:800;padding:2px 10px;border-radius:99px;border:2px solid var(--edge)}
.today .tw{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.today .tw b{font-size:26px}
.today small{display:block;color:var(--soft);margin-top:4px}
.sec{margin:22px 0 10px;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--edge);background:var(--card);border-radius:99px;padding:5px 12px;cursor:pointer;font-weight:700;font-size:14px}
.chip small{color:var(--soft);margin-left:4px;font-weight:600}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.chip.on small{color:inherit;opacity:.8}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:16px;cursor:pointer;
  background:var(--card);border:2px solid var(--edge);border-radius:18px;box-shadow:4px 4px 0 var(--shade);transition:transform .1s,box-shadow .1s}
.mode:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--shade)}
.mode:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--shade)}
.mode .ico{font-size:30px}
.mode b{font-size:17px}
.mode small{color:var(--soft)}
 
/* quiz */
.qtop{display:flex;align-items:center;gap:12px;margin:8px 0}
.prog{flex:1;height:12px;border-radius:99px;background:var(--line);border:2px solid var(--edge);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);transition:width .3s}
.hearts{letter-spacing:1px;font-size:15px;white-space:nowrap}
.cnt{font-weight:700;font-size:14px;color:var(--soft)}
.qstats{display:flex;justify-content:space-between;color:var(--soft);font-size:14px;margin-bottom:12px}
.qcard{text-align:center;padding:28px 20px}
.word{font-size:clamp(34px,9vw,52px);font-weight:800;letter-spacing:-.5px;word-break:break-word}
.mean{font-size:clamp(24px,6vw,32px);font-weight:800;word-break:keep-all}
.blank{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:26px;letter-spacing:4px;margin:14px 0;color:var(--accent);word-break:break-all}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;cursor:pointer;font-weight:700;
  background:var(--card);border:2px solid var(--edge);border-radius:14px;box-shadow:0 3px 0 var(--shade)}
.opt b{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--line);font-size:14px;flex:none}
.opt:hover{border-color:var(--accent)}
.opts.locked{pointer-events:none}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);animation:pop .3s}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);animation:shake .35s}
.opts.locked .opt:not(.ok):not(.bad){opacity:.55}
#ans{width:100%;margin-top:6px;padding:12px 14px;font-size:20px;text-align:center;border:2px solid var(--edge);border-radius:14px;background:var(--card);outline:none}
#ans:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.fb{margin-top:16px;padding:16px;border-radius:16px;border:2px solid;animation:pop .25s}
.fb.ok{background:var(--ok-bg);border-color:var(--ok)}
.fb.bad{background:var(--bad-bg);border-color:var(--bad)}
.fbh{font-weight:800;font-size:18px;margin-bottom:4px}
.fbe{margin-top:6px}
.fbe small{display:block;color:var(--soft)}
.fb .btn{width:100%;margin-top:12px}
 
/* flash */
.flipwrap{perspective:1200px;margin-top:8px}
.flipcard{position:relative;min-height:320px;padding:0;cursor:pointer;transform-style:preserve-3d;transition:transform .5s}
.flipcard.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;overflow:auto;border-radius:16px;background:var(--card)}
.face.back{transform:rotateY(180deg)}
.face .tip{color:var(--soft);position:absolute;bottom:12px}
.face .favb{position:absolute;top:10px;right:10px}
.face .ex{color:var(--soft);margin-top:6px}
.face .ex em{display:block;font-style:normal;font-size:14px}

.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.col{display:grid;gap:10px;align-content:start}
.tile{min-height:56px;padding:8px 10px;cursor:pointer;font-weight:700;text-align:center;word-break:keep-all;
  background:var(--card);border:2px solid var(--edge);border-radius:14px;box-shadow:0 3px 0 var(--shade);transition:transform .1s,opacity .3s}
.tile.sel{background:var(--accent);color:var(--accent-ink);transform:translateY(-2px)}
.tile.done{background:var(--ok-bg);border-color:var(--ok);opacity:.4;pointer-events:none;text-decoration:line-through}
.tile.shake{border-color:var(--bad);background:var(--bad-bg);animation:shake .35s}
 
/* result */
.result{text-align:center}
.result .big{font-size:56px}
.result h2{font-size:26px;margin:4px 0}
.stars{font-size:34px;color:#f3b61f;letter-spacing:6px}
.result p{color:var(--soft)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin:16px 0}
.stats div{background:var(--paper);border-radius:12px;padding:10px 4px}
.stats b{display:block;font-size:20px}
.stats span{font-size:12px;color:var(--soft)}
.result h3{text-align:left;margin:16px 0 6px;font-size:15px}
.misslist,.booklist{list-style:none;margin:0;padding:0;display:grid;gap:8px;text-align:left}
.misslist li{display:flex;align-items:center;gap:8px;background:var(--bad-bg);border-radius:12px;padding:6px 6px 6px 12px}
.misslist li span{flex:1;color:var(--soft)}
 
/* book */
.pagehead{display:flex;align-items:center;gap:12px;margin:8px 0 14px}
.pagehead h2{font-size:22px}
details.add{margin-bottom:14px;padding:14px 18px}
details.add summary{cursor:pointer;font-weight:800}
details.add form{margin-top:12px;display:grid;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}.stats4{grid-template-columns:repeat(2,1fr)}}
label{display:grid;gap:3px;font-size:13px;color:var(--soft);font-weight:700}
label input,label select,.search{padding:9px 12px;border:2px solid var(--edge);border-radius:12px;background:var(--card);font-size:16px;outline:none;width:100%}
label input:focus,.search:focus{border-color:var(--accent)}
.search{margin:12px 0}
.booklist li{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;background:var(--card);border:2px solid var(--edge);border-radius:14px;padding:8px 8px 8px 14px}
.booklist .rw{font-size:18px}
.booklist .rw .pos{margin-left:4px}
.booklist .dots{margin-left:8px;font-size:11px;color:var(--ok);letter-spacing:1px}
.booklist .rm{grid-column:1}
.booklist .ra{grid-row:1/span 3;grid-column:2;display:flex}
.booklist .re{grid-column:1;color:var(--soft);font-size:13px}
.booklist .empty{display:block;text-align:center;color:var(--soft);padding:24px;background:none;border-style:dashed}
.foot{text-align:center;margin-top:24px}
 
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:10px 18px;
  border-radius:99px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
 
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

var $=function(s){return document.querySelector(s);};

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function key(w){return w.w.toLowerCase();}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function allWords(){return BUILTIN.concat(save.custom.map(function(c){return {w:c.w,m:c.m,p:c.p||'',e:c.e||'',k:'',lv:0,custom:true};}));}
function prog(k){return save.progress[k]||(save.progress[k]={b:0,c:0,x:0});}
function box(w){var p=save.progress[key(w)];return p?p.b:0;}
function poolFor(f){
  var a=allWords();
  if(f==='1'||f==='2'||f==='3')return a.filter(function(w){return String(w.lv)===f;});
  if(f==='custom')return a.filter(function(w){return w.custom;});
  if(f==='wrong')return a.filter(function(w){return save.wrong[key(w)];});
  if(f==='fav')return a.filter(function(w){return save.fav[key(w)];});
  return a;
}
function pickWords(pool,n){
  return shuffle(pool.map(function(w){return {w:w,s:box(w)+Math.random()*1.6};}).sort(function(a,b){return a.s-b.s;}).slice(0,n).map(function(o){return o.w;}));
}
function hl(sentence,word){
  var m=new RegExp('\\b'+word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\w*','i').exec(sentence);
  if(!m)return esc(sentence);
  return esc(sentence.slice(0,m.index))+'<mark>'+esc(m[0])+'</mark>'+esc(sentence.slice(m.index+m[0].length));
}
function fmt(sec){return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');}

/* ───────── 소리 ───────── */
var ac;
function beep(freqs,dur){
  if(!save.sound)return;dur=dur||.12;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    var t=ac.currentTime;
    freqs.forEach(function(f,i){
      var o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t+i*dur);g.gain.exponentialRampToValueAtTime(.15,t+i*dur+.02);g.gain.exponentialRampToValueAtTime(.0001,t+i*dur+dur);
      o.connect(g);g.connect(ac.destination);o.start(t+i*dur);o.stop(t+i*dur+dur+.02);
    });
  }catch(e){}
}
function speak(text,force){
  if(!force&&!save.sound)return;
  try{
    if(!('speechSynthesis' in window))return;
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.9;speechSynthesis.speak(u);
  }catch(e){}
}

/* ───────── 퀴즈 (4지선다 / 스펠링) ───────── */
function makeMC(w,dir){
  var others=allWords().filter(function(x){return key(x)!==key(w)&&x.m!==w.m;});
  var same=shuffle(others.filter(function(x){return w.p&&x.p===w.p;}));
  var rest=shuffle(others.filter(function(x){return !w.p||x.p!==w.p;}));
  var d=same.concat(rest).slice(0,3);
  return {w:w,dir:dir,opts:shuffle([w].concat(d))};
}
function startQuiz(mode,pool){
  var n=Math.min(10,pool.length),ws=pickWords(pool,n);
  Q={mode:mode,i:0,lives:5,score:0,combo:0,maxCombo:0,ok:0,miss:[],locked:false,hints:0,
     qs:ws.map(function(w){return mode==='mc'?makeMC(w,Math.random()<.5?'en2ko':'ko2en'):{w:w};})};
  screen='quiz';renderQ();
}
function heartsHtml(){return '❤️'.repeat(Math.max(0,Q.lives))+'🤍'.repeat(5-Math.max(0,Q.lives));}
function qStatsHtml(){

}

          '<div class="qstats" id="qs">'+qStatsHtml()+'</div>';

    var prompt=q.dir==='en2ko'
      ?'<div class="word">'+esc(q.w.w)+'</div><div class="pos">'+esc(q.w.p)+' <button class="icon" data-act="say" data-w="'+esc(q.w.w)+'" aria-label="발음 듣기">🔊</button></div>'

      '<div class="blank" id="blank">'+blankStr(q.w.w,0)+'</div>'+
      '<form id="typeForm" autocomplete="off"><input id="ans" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="영어로 입력 후 Enter">'+
      '<div class="row2"><button type="button" class="btn" data-act="hint">💡 힌트</button><button type="button" class="btn" data-act="pass">패스</button><button type="submit" class="btn primary">확인</button></div></form></div><div id="fb"></div>';
  }
  view.innerHTML=top+body;
  keyHandler=onQuizKey;
  if(Q.mode==='type'){var a=$('#ans');if(a)a.focus({preventScroll:true});}
}
function onQuizKey(e){
  if(!Q)return;
  if(Q.locked){if(e.key==='Enter'||e.key===' '){e.preventDefault();goNext();}return;}
  if(Q.mode==='mc'&&/^[1-4]$/.test(e.key))answerMC(+e.key-1);
}
function answerMC(i){
  if(!Q||Q.locked||Q.mode!=='mc')return;
  var q=Q.qs[Q.i];if(!q.opts[i])return;

}
function submitTyping(){

function afterAnswer(correct,pts,typed){
  var q=Q.qs[Q.i],w=q.w,k=key(w),p=prog(k),gain=0;

function goNext(){

function finishQuiz(){

  var perfect=Q.miss.length===0&&Q.ok===Q.qs.length,over=Q.lives<=0;

    stars:over?0:acc>=90?3:acc>=70?2:1,

/* ───────── 플래시카드 ───────── */

   '</div></div>'+
   '<div class="row2"><button class="btn" data-act="unknown">😵 몰라요</button><button class="btn primary" data-act="known">😎 알아요</button></div>'+
   '<div class="tiny">Space 뒤집기 · ← 몰라요 · → 알아요</div>';
  keyHandler=onFlashKey;

function flipCard(){var c=$('#fc');if(c)c.classList.toggle('on');}
function onFlashKey(e){
  if(e.key===' '||e.key==='Enter'){e.preventDefault();flipCard();}
  else if(e.key==='ArrowLeft'||e.key==='1')markFlash(false);
  else if(e.key==='ArrowRight'||e.key==='2')markFlash(true);
}
function markFlash(known){
  if(!F||F.i>=F.deck.length)return;
  var w=F.deck[F.i],k=key(w),p=prog(k);
  if(known){F.known++;p.c++;p.b=Math.max(p.b,1);F.xp+=2;addXP(2);}
  else{
    F.unknown++;p.x++;p.b=0;save.wrong[k]=1;F.xp+=1;addXP(1);
    if(!F.re.has(k)){F.re.add(k);F.deck.push(w);F.unknownWords.push(w);}
  }
  persist();F.i++;renderFlash();
}
function finishFlash(){
  save.played++;persist();
  var total=F.known+F.unknown,acc=total?Math.round(F.known/total*100):0;
  renderResult({emoji:'📇',title:'카드 학습 완료!',sub:'모르는 카드는 한 번 더 보여 줬어요.',stars:acc>=80?3:acc>=50?2:1,
    stats:[['알아요',F.known],['몰라요',F.unknown],['획득 XP','+'+F.xp]],miss:F.unknownWords});
}

function startMatch(pool){
  var n=Math.min(6,pool.length),ws=pickWords(pool,n);
  M={ws:ws,left:shuffle(ws),right:shuffle(ws),sel:null,done:new Set(),miss:0,missed:new Set(),t0:Date.now(),timer:null};
  screen='match';renderMatch();keyHandler=null;
  M.timer=setInterval(function(){var el=$('#mt');if(el)el.textContent='⏱ '+fmt(Math.floor((Date.now()-M.t0)/1000));},500);
}
function renderMatch(){
  function mk(arr,side){return arr.map(function(w){
    return '<button class="tile'+(M.done.has(key(w))?' done':'')+'" data-act="tile" data-side="'+side+'" data-k="'+esc(key(w))+'">'+esc(side==='l'?w.w:w.m)+'</button>';
  }).join('');}
  view.innerHTML=
   '<div class="qtop"><button class="btn small" data-act="home" aria-label="그만하기">✕</button><div class="prog"><i id="mp" style="width:0%"></i></div></div>'+
   '<div class="qstats"><span id="mt">⏱ 0:00</span><span id="mm">실수 0</span><span id="md">0 / '+M.ws.length+'</span></div>'+
   '<div class="matchgrid"><div class="col">'+mk(M.left,'l')+'</div><div class="col">'+mk(M.right,'r')+'</div></div>'+
   '<div class="tiny">왼쪽 영어 단어와 오른쪽 뜻을 차례로 눌러 짝을 맞춰요</div>';
}
function tileClick(el){
  if(!M||el.classList.contains('done'))return;
  var side=el.dataset.side;
  if(!M.sel){M.sel=el;el.classList.add('sel');return;}
  if(M.sel===el){el.classList.remove('sel');M.sel=null;return;}
  if(M.sel.dataset.side===side){M.sel.classList.remove('sel');M.sel=el;el.classList.add('sel');return;}
  var a=M.sel,b=el;M.sel=null;a.classList.remove('sel');
  if(a.dataset.k===b.dataset.k){
    a.classList.add('done');b.classList.add('done');M.done.add(a.dataset.k);
    beep([660,880]);
    var w=M.ws.filter(function(x){return key(x)===a.dataset.k;})[0];if(w)speak(w.w);
    $('#md').textContent=M.done.size+' / '+M.ws.length;$('#mp').style.width=(M.done.size/M.ws.length*100)+'%';
    if(M.done.size===M.ws.length)setTimeout(finishMatch,500);
  }else{
    M.miss++;M.missed.add(a.dataset.k);M.missed.add(b.dataset.k);
    a.classList.add('shake');b.classList.add('shake');
    setTimeout(function(){a.classList.remove('shake');b.classList.remove('shake');},400);
    $('#mm').textContent='실수 '+M.miss;beep([240,170],.16);
  }
}
function finishMatch(){
  if(!M||screen!=='match')return;
  stopTimers();
  var sec=Math.floor((Date.now()-M.t0)/1000),n=M.ws.length;
  var xp=n*4+Math.max(0,20-M.miss*3-Math.floor(sec/10));
  M.ws.forEach(function(w){var k=key(w);if(!M.missed.has(k)){var p=prog(k);p.c++;p.b=Math.min(3,p.b+1);if(p.b>=3)delete save.wrong[k];}});
  save.played++;addXP(xp);
  renderResult({emoji:M.miss===0?'🏆':'🧩',title:M.miss===0?'실수 없이 완성!':'짝 맞추기 완료!',sub:fmt(sec)+' 만에 모든 짝을 맞췄어요.',
    stars:M.miss===0?3:M.miss<=2?2:1,stats:[['걸린 시간',fmt(sec)],['실수',M.miss],['획득 XP','+'+xp]],miss:[]});
}
 
/* ───────── 단어장 ───────── */
function renderBook(){
  stopTimers();keyHandler=null;screen='book';
  var chips=FILTERS.map(function(f){
    return '<button class="chip'+(save.filter===f[0]?' on':'')+'" data-act="filter" data-v="'+f[0]+'">'+f[1]+'<small>'+poolFor(f[0]).length+'</small></button>';
  }).join('');
  view.innerHTML=
   '<div class="pagehead"><button class="btn small" data-act="home">← 홈</button><h2>📚 단어장</h2></div>'+
   '<details class="card add"><summary>➕ 내 단어 추가하기</summary><form id="addForm" autocomplete="off">'+
     '<div class="grid2"><label>영어 단어<input name="w" required maxlength="40" autocapitalize="off"></label><label>뜻 (한국어)<input name="m" required maxlength="60"></label></div>'+
     '<div class="grid2"><label>품사<select name="p"><option value="n.">n. 명사</option><option value="v.">v. 동사</option><option value="adj.">adj. 형용사</option><option value="adv.">adv. 부사</option><option value="">기타</option></select></label>'+
     '<label>예문 (선택)<input name="e" maxlength="160"></label></div>'+
     '<button class="btn primary" type="submit">추가하기</button></form></details>'+
   '<div class="chips">'+chips+'</div>'+
   '<input id="bookSearch" class="search" type="search" placeholder="🔍 단어나 뜻 검색" value="'+esc(bookQuery)+'">'+
   '<ul id="bookList" class="booklist"></ul>'+
   '<div class="foot"><button class="btn small danger" data-act="reset">학습 기록 초기화</button></div>';
  renderBookList();
}
function renderBookList(){
  var q=bookQuery.trim().toLowerCase();
  var list=poolFor(save.filter).filter(function(w){return !q||w.w.toLowerCase().indexOf(q)>-1||w.m.indexOf(q)>-1;})
    .sort(function(a,b){return a.w.localeCompare(b.w);});
  var el=$('#bookList');if(!el)return;
  if(!list.length){el.innerHTML='<li class="empty">표시할 단어가 없어요</li>';return;}
  el.innerHTML=list.map(function(w){
    var k=key(w),b=box(w);
    return '<li><div class="rw"><b>'+esc(w.w)+'</b><span class="pos">'+esc(w.p)+'</span><span class="dots" title="숙련도">'+'●'.repeat(b)+'○'.repeat(3-b)+'</span></div>'+
      '<div class="rm">'+esc(w.m)+'</div>'+(w.e?'<div class="re">'+hl(w.e,w.w)+'</div>':'')+
      '<div class="ra"><button class="icon" data-act="say" data-w="'+esc(w.w)+'" aria-label="발음 듣기">🔊</button>'+
      '<button class="icon" data-act="fav" data-k="'+esc(k)+'" aria-label="즐겨찾기">'+(save.fav[k]?'⭐':'☆')+'</button>'+
      (w.custom?'<button class="icon" data-act="del" data-k="'+esc(k)+'" aria-label="삭제">🗑️</button>':'')+'</div></li>';
  }).join('');
}
function addWord(form){
  var fe=form.elements,w=fe.w.value.trim(),m=fe.m.value.trim(),p=fe.p.value,e=fe.e.value.trim();
  if(!w||!m)return;
  if(allWords().some(function(x){return key(x)===w.toLowerCase();})){toast('이미 있는 단어예요');return;}
  save.custom.push({w:w,m:m,p:p,e:e});persist();
  toast('✏️ "'+w+'" 추가했어요!');form.reset();renderBookList();fe.w.focus();
  var chipsOn=view.querySelectorAll('.chip small');
  if(chipsOn.length)renderBookChipsCount();
}
function renderBookChipsCount(){
  view.querySelectorAll('.chip').forEach(function(c){var s=c.querySelector('small');if(s)s.textContent=poolFor(c.dataset.v).length;});
}
function toggleFav(k,el){
  if(save.fav[k])delete save.fav[k];else save.fav[k]=1;
  persist();
  if(el)el.textContent=save.fav[k]?'⭐':'☆';
  if(screen==='book'){if(save.filter==='fav')renderBookList();renderBookChipsCount();}
}
function deleteCustom(k){
  var ok=true;try{ok=window.confirm('이 단어를 삭제할까요?');}catch(e){}
  if(!ok)return;
  save.custom=save.custom.filter(function(c){return c.w.toLowerCase()!==k;});
  delete save.progress[k];delete save.wrong[k];delete save.fav[k];persist();
  renderBookList();renderBookChipsCount();
}
function resetAll(){
  var ok=true;try{ok=window.confirm('XP, 숙련도, 오답노트, 즐겨찾기를 모두 초기화할까요?\n(내가 추가한 단어는 유지돼요)');}catch(e){}
  if(!ok)return;
  save.xp=0;save.bestCombo=0;save.played=0;save.progress={};save.wrong={};save.fav={};persist();
  renderHeader();renderBook();toast('학습 기록을 초기화했어요');
}
 
/* ───────── 이벤트 ───────── */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var d=t.dataset;
  switch(d.act){
    case 'home':renderHome();break;
    case 'book':renderBook();break;
    case 'sound':save.sound=!save.sound;persist();renderHeader();toast(save.sound?'소리를 켰어요':'소리를 껐어요');break;
    case 'filter':save.filter=d.v;persist();if(screen==='book')renderBook();else renderHome();break;
    case 'mode':start(d.v);break;
    case 'opt':answerMC(+d.i);break;
    case 'next':goNext();break;
    case 'hint':giveHint();break;
    case 'pass':passQ();break;
    case 'flip':flipCard();break;
    case 'known':markFlash(true);break;
    case 'unknown':markFlash(false);break;
    case 'tile':tileClick(t);break;
    case 'say':speak(d.w,true);break;
    case 'fav':toggleFav(d.k,t);break;
    case 'del':deleteCustom(d.k);break;
    case 'retry':start(lastMode);break;
    case 'reviewMiss':if(lastMiss.length){lastMode='flash';startFlash(shuffle(lastMiss));}break;
    case 'reset':resetAll();break;
  }
});
document.addEventListener('submit',function(e){
  e.preventDefault();
  if(e.target.id==='typeForm')submitTyping();
  else if(e.target.id==='addForm')addWord(e.target);
});
document.addEventListener('input',function(e){
  if(e.target.id==='bookSearch'){bookQuery=e.target.value;renderBookList();}
});
document.addEventListener('keydown',function(e){
  if(e.repeat||e.ctrlKey||e.metaKey||e.altKey)return;
  if(keyHandler)keyHandler(e);
});
 
/* ───────── 시작 ───────── */
load();
if(!FILTERS.some(function(f){return f[0]===save.filter;}))save.filter='all';
renderHeader();
renderHome();
})();
</script>
</body>
</html>
