<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- 문자의 인코딩 방식을 UTF-8로 지정하여 한글이 깨지지 않게 합니다. -->
  <meta charset="UTF-8">
  <!-- 모바일 및 다양한 기기 화면 크기에 맞게 웹페이지 비율을 조절합니다. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 웹 브라우저 탭에 표시될 제목을 지정합니다. -->
  <title>영어 단어장 & 퀴즈</title>

  <!-- Google Fonts에서 한글 폰트 Jua와 영어 폰트 Fredoka를 불러오는 링크입니다. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Jua&display=swap" rel="stylesheet">

  <style>
    /* 디자인에 사용할 색상 변수 모음 */
    :root {
      --bg-color: #ff00a2; /* 전체 배경색: 분홍색 */
      --card-bg: #ffffff; /* 카드 배경색: 하얀색 */
      --text-color: #000000; /* 기본 글자색: 검은색 */
      --point-color: #00ffe1; /* 포인트 강조색: 청록색 */
      --glitch-red: #ff0055; /* 글리치 잔상 색상 1: 빨간색 */
      --glitch-blue: #00ffff; /* 글리치 잔상 색상 2: 파란색 */
      --correct-color: #28a745; /* 정답 표시 색상: 초록색 */
    }

    /* 전체 화면 기본 스타일 지정 */
    body {
      background-color: var(--bg-color); /* 배경에 분홍색 적용 */
      color: var(--text-color); /* 기본 글자색 지정 */
      font-family: 'Jua', sans-serif; /* 기본 한글 폰트로 Jua 적용 */
      margin: 0; /* 기본 여백 제거 */
      padding: 20px; /* 전체 테두리 내부 여백 설정 */
      display: flex; /* 화면 중앙 정렬을 위한 플렉스 박스 설정 */
      flex-direction: column; /* 요소들을 세로 방향으로 정렬 */
      align-items: center; /* 가로 방향 중앙 정렬 */
      justify-content: center; /* 세로 방향 중앙 정렬 */
      min-height: 100vh; /* 화면 전체 높이를 사용 */
      box-sizing: border-box; /* 박스 크기에 패딩과 테두리를 포함 */
    }

    /* 영어 단어에 적용할 폰트 지정 */
    .en-text {
      font-family: 'Fredoka', sans-serif; /* 영어 글씨체로 Fredoka 적용 */
    }

    /* 메인 컨테이너 스타일 지정 */
    .container {
      width: 100%; /* 전체 너비 사용 */
      max-width: 400px; /* 최대 너비를 400px로 제한 */
      display: flex; /* 세로 정렬을 위한 플렉스 상자 설정 */
      flex-direction: column; /* 요소들을 세로로 정렬 */
      align-items: center; /* 중앙 정렬 */
    }

    /* 진도 표시 텍스트 스타일 지정 */
    .progress {
      font-size: 20px; /* 글자 크기 지정 */
      font-weight: bold; /* 글자 두께를 두껍게 설정 */
      margin-bottom: 15px; /* 아래쪽 요소와의 간격 설정 */
    }

    /* 단어 카드 외부 3D 회전 틀 스타일 지정 */
    .card-container {
      width: 100%; /* 카드 너비를 컨테이너에 맞춤 */
      height: 220px; /* 카드의 높이 지정 */
      perspective: 1000px; /* 카드가 뒤집어질 때 입체감을 주는 시점 설정 */
      cursor: pointer; /* 마우스를 올렸을 때 손가락 모양으로 변경 */
    }

    /* 실질적인 카드 내부 요소 스타일 지정 */
    .card {
      width: 100%; /* 카드 내부 너비 설정 */
      height: 100%; /* 카드 내부 높이 설정 */
      position: relative; /* 뒤집힘 효과 및 글리치 배치를 위한 기준점 지정 */
      transform-style: preserve-3d; /* 카드 앞뒤 면을 3D 공간으로 유지 */
      transition: transform 0.6s; /* 카드가 뒤집어지는 애니메이션 시간 설정 (0.6초) */
      background-color: var(--card-bg); /* 카드의 배경색을 하얀색으로 지정 */
      border-radius: 28px; /* 카드 모서리를 둥글게(28px) 설정 */
      border: 4px solid var(--text-color); /* 검은색 두꺼운 테두리 추가 */
      box-shadow: 6px 6px 0px var(--text-color); /* 입체감을 주는 검은색 그림자 설정 */
      animation: glitch-anim 2s infinite linear alternate-reverse; /* 계속 지직거리는 효과 적용 */
    }

    /* 카드가 뒤집혔을 때 적용할 클래스 지정 */
    .card.flipped {
      transform: rotateY(180deg); /* Y축을 기준으로 180도 회전 */
    }

    /* 카드의 앞면과 뒷면 공통 스타일 지정 */
    .card-face {
      position: absolute; /* 카드 내부에서 전체 영역을 채우도록 위치 지정 */
      width: 100%; /* 전체 너비 채우기 */
      height: 100%; /* 전체 높이 채우기 */
      backface-visibility: hidden; /* 뒷면일 때 반대쪽 면을 숨김 처리 */
      display: flex; /* 내용 중앙 정렬을 위한 플렉스 설정 */
      flex-direction: column; /* 내용을 세로로 정렬 */
      justify-content: center; /* 세로 중앙 정렬 */
      align-items: center; /* 가로 중앙 정렬 */
      padding: 20px; /* 카드 내부 여백 설정 */
      box-sizing: border-box; /* 박스 크기에 패딩 포함 */
      text-align: center; /* 텍스트 가운데 정렬 */
    }

    /* 카드 앞면 내용 스타일 */
    .card-front h2 {
      font-size: 36px; /* 영어 단어 글자 크기 */
      margin: 0; /* 여백 제거 */
    }

    /* 카드 뒷면 내용 스타일 */
    .card-back {
      transform: rotateY(180deg); /* 뒷면 글자가 뒤집혀 보이지 않도록 미리 180도 회전 */
    }

    /* 뒷면의 한글 뜻 글자 스타일 */
    .card-back .ko-meaning {
      font-size: 28px; /* 글자 크기 지정 */
      font-weight: bold; /* 글자 두께 설정 */
      margin-bottom: 10px; /* 아래쪽 예문과의 간격 지정 */
    }

    /* 뒷면의 영어 예문 글자 스타일 */
    .card-back .example {
      font-size: 18px; /* 예문 글자 크기 지정 */
      color: #333333; /* 조금 어두운 글자색 지정 */
    }

    /* 이전 / 다음 이동 버튼 영역 스타일 */
    .nav-buttons {
      display: flex; /* 버튼을 가로로 정렬하기 위한 플렉스 설정 */
      justify-content: space-between; /* 양쪽 끝으로 버튼 배치 */
      width: 100%; /* 전체 너비 사용 */
      margin-top: 15px; /* 카드와의 간격 설정 */
    }

    /* 공통 버튼 스타일 지정 */
    button {
      font-family: 'Jua', sans-serif; /* 버튼에도 한글 Jua 폰트 적용 */
      background-color: var(--point-color); /* 버튼 배경에 포인트 청록색 적용 */
      color: var(--text-color); /* 버튼 글자색을 검은색으로 설정 */
      border: 3px solid var(--text-color); /* 검은색 테두리 설정 */
      border-radius: 14px; /* 버튼 모서리를 둥글게 설정 */
      padding: 10px 20px; /* 버튼 내부 여백 설정 */
      font-size: 16px; /* 글자 크기 설정 */
      cursor: pointer; /* 마우스 올렸을 때 손가락 모양 표시 */
      transition: transform 0.1s; /* 클릭할 때 살짝 눌리는 애니메이션 설정 */
    }

    /* 버튼을 누르고 있을 때의 스타일 지정 */
    button:active {
      transform: scale(0.95); /* 버튼이 살짝 작아지는 효과 */
    }

    /* 퀴즈 영역 전체 스타일 지정 */
    .quiz-container {
      width: 100%; /* 전체 너비 사용 */
      margin-top: 25px; /* 상단 버튼들과의 간격 설정 */
      background-color: var(--card-bg); /* 배경을 하얀색으로 설정 */
      border: 4px solid var(--text-color); /* 검은색 두꺼운 테두리 설정 */
      border-radius: 28px; /* 모서리를 둥글게 설정 */
      padding: 15px; /* 내부 여백 설정 */
      box-sizing: border-box; /* 패딩을 전체 크기에 포함 */
      box-shadow: 6px 6px 0px var(--text-color); /* 검은색 그림자 효과 설정 */
    }

    /* 퀴즈 제목 스타일 지정 */
    .quiz-title {
      font-size: 18px; /* 글자 크기 지정 */
      font-weight: bold; /* 두꺼운 글자체 설정 */
      text-align: center; /* 가운데 정렬 */
      margin-bottom: 10px; /* 보기 버튼들과의 간격 지정 */
    }

    /* 퀴즈 보기 버튼 목록 레이아웃 스타일 지정 */
    .quiz-options {
      display: grid; /* 바둑판식 격자 레이아웃 설정 */
      grid-template-columns: 1fr 1fr; /* 2열로 동일하게 분할 */
      gap: 10px; /* 버튼 사이의 간격 설정 */
    }

    /* 퀴즈 보기 버튼 개별 스타일 지정 */
    .quiz-btn {
      width: 100%; /* 격자 칸 전체 너비 채우기 */
      padding: 10px; /* 내부 여백 설정 */
      font-size: 15px; /* 보기 글자 크기 설정 */
      background-color: #ffffff; /* 기본 하얀색 배경 설정 */
    }

    /* 정답을 맞혔을 때 버튼 스타일 지정 */
    .quiz-btn.correct {
      background-color: var(--correct-color) !important; /* 초록색 배경 강제 적용 */
      color: #ffffff !important; /* 글자색을 하얀색으로 변경 */
    }

    /* 틀렸거나 선택되지 않은 다른 오답 버튼 스타일 지정 */
    .quiz-btn.dimmed {
      opacity: 0.3; /* 버튼을 투명하고 흐리게 변경 */
    }

    /* 정답/오답 개수 점수판 스타일 지정 */
    .score-board {
      text-align: center; /* 가운데 정렬 */
      margin-top: 10px; /* 보기 버튼들과의 간격 설정 */
      font-size: 16px; /* 글자 크기 지정 */
      font-weight: bold; /* 두꺼운 글자체 설정 */
    }

    /* 글리치(지직거리는) 애니메이션 키프레임 정의 */
    @keyframes glitch-anim {
      0% {
        transform: translate(0); /* 원래 위치 */
      }
      20% {
        transform: translate(-3px, 3px); /* 왼쪽 아래로 살짝 이동 */
        box-shadow: 6px 6px 0px var(--text-color), -3px 0 var(--glitch-red), 3px 0 var(--glitch-blue); /* 빨강, 파랑 잔상 추가 */
      }
      40% {
        transform: translate(-2px, -2px); /* 왼쪽 위로 살짝 이동 */
        box-shadow: 6px 6px 0px var(--text-color); /* 잔상 제거 */
      }
      60% {
        transform: translate(3px, 1px); /* 오른쪽 아래로 살짝 이동 */
        box-shadow: 6px 6px 0px var(--text-color), 3px 0 var(--glitch-red), -3px 0 var(--glitch-blue); /* 잔상 추가 */
      }
      80% {
        transform: translate(1px, -2px); /* 오른쪽 위로 살짝 이동 */
      }
      100% {
        transform: translate(0); /* 원래 위치로 복귀 */
      }
    }
  </style>
</head>
<body>

  <!-- 화면 중앙 전체 컨테이너 시작 -->
  <div class="container">
    
    <!-- 진도를 표시해 주는 텍스트 부분 (예: 1 / 10) -->
    <div class="progress" id="progress">1 / 10</div>

    <!-- 클릭 시 뒤집어지는 단어 카드 부분 -->
    <div class="card-container" id="cardContainer">
      <div class="card" id="card">
        <!-- 카드의 앞면 (영어 단어 표시) -->
        <div class="card-face card-front">
          <h2 class="en-text" id="enWord">apple</h2>
        </div>
        <!-- 카드의 뒷면 (한글 뜻과 영어 예문 표시) -->
        <div class="card-face card-back">
          <div class="ko-meaning" id="koMeaning">사과</div>
          <div class="example en-text" id="exText">I eat apple.</div>
        </div>
      </div>
    </div>

    <!-- 이전 / 다음 단어로 넘어가는 버튼 목록 -->
    <div class="nav-buttons">
      <button id="prevBtn">이전</button>
      <button id="nextBtn">다음</button>
    </div>

    <!-- 하단 "이 단어의 뜻은?" 퀴즈 영역 -->
    <div class="quiz-container">
      <div class="quiz-title">이 단어의 뜻은?</div>
      <!-- 4개의 뜻 보기가 들어가는 구역 -->
      <div class="quiz-options" id="quizOptions"></div>
      <!-- 맞은 개수와 틀린 개수를 보여주는 점수판 -->
      <div class="score-board" id="scoreBoard">맞음: 0 | 틀림: 0</div>
    </div>

  </div>
  <!-- 화면 컨테이너 끝 -->

  <script>
    // ==========================================
    // [여기만 고치세요] 단어 목록 데이터 배열입니다.
    // ==========================================
    const WORDS = [
      { en:'apple', ko:'사과', ex:'I eat apple.' },
      { en:'banana', ko:'바나나', ex:'I eat banana.' },
      { en:'orange', ko:'오렌지', ex:'I eat orange.' },
      { en:'pig', ko:'돼지', ex:'I eat the pig.' },
      { en:'earth', ko:'지구', ex:'Earth is earth.' },
      { en:'face', ko:'얼굴', ex:'Your face, my face.' },
      { en:'yellow', ko:'노랑', ex:'Pikachu is yellow.' },
      { en:'bomb', ko:'폭탄', ex:'The bomb exploded.' },
      { en:'meteorite', ko:'운석', ex:'A meteorite falls to earth.' },
      { en:'cow', ko:'소', ex:'I eat cow' },
    ];

    // 현재 보고 있는 단어의 위치 번호 (0부터 시작합니다)
    let currentIndex = 0;

    // 맞은 개수 저장 변수
    let correctCount = 0;

    // 틀린 개수 저장 변수
    let wrongCount = 0;

    // 현재 퀴즈에서 이미 정답/오답을 선택했는지 확인하는 변수
    let isQuizAnswered = false;

    // HTML 태그들을 자바스크립트 변수로 가져옵니다.
    const card = document.getElementById('card'); // 카드 전체 태그
    const cardContainer = document.getElementById('cardContainer'); // 카드 감싸는 태그
    const enWord = document.getElementById('enWord'); // 앞면 영어 글자 태그
    const koMeaning = document.getElementById('koMeaning'); // 뒷면 한글 뜻 태그
    const exText = document.getElementById('exText'); // 뒷면 예문 태그
    const progress = document.getElementById('progress'); // 진도 표시 태그
    const prevBtn = document.getElementById('prevBtn'); // 이전 버튼 태그
    const nextBtn = document.getElementById('nextBtn'); // 다음 버튼 태그
    const quizOptions = document.getElementById('quizOptions'); // 퀴즈 보기 들어갈 영역 태그
    const scoreBoard = document.getElementById('scoreBoard'); // 점수판 태그

    // 카드를 클릭했을 때 뒤집히도록 이벤트를 등록합니다.
    cardContainer.addEventListener('click', function() {
      card.classList.toggle('flipped'); // flipped 클래스를 넣었다 뺐다 합니다.
    });

    // 화면에 현재 단어 정보를 업데이트해 주는 함수입니다.
    function updateCard() {
      card.classList.remove('flipped'); // 새 단어로 바뀔 때는 앞면이 보이도록 초기화합니다.
      
      const currentWord = WORDS[currentIndex]; // 현재 번호의 단어 객체를 가져옵니다.
      enWord.textContent = currentWord.en; // 영어 단어를 채워 넣습니다.
      koMeaning.textContent = currentWord.ko; // 한글 뜻을 채워 넣습니다.
      exText.textContent = currentWord.ex; // 영어 예문을 채워 넣습니다.
      
      // 진도 표시를 업데이트합니다 (예: 1 / 10).
      progress.textContent = (currentIndex + 1) + ' / ' + WORDS.length;

      // 새 단어로 바뀔 때 하단 퀴즈도 새로 만듭니다.
      renderQuiz();
    }

    // 퀴즈 보기를 생성하고 화면에 그려주는 함수입니다.
    function renderQuiz() {
      quizOptions.innerHTML = ''; // 기존에 생성되었던 퀴즈 보기 버튼들을 지웁니다.
      isQuizAnswered = false; // 선택 여부를 안 한 상태로 초기화합니다.

      const currentWord = WORDS[currentIndex]; // 현재 단어를 가져옵니다.
      
      // 정답을 제외한 나머지 다른 단어들의 뜻만 골라내어 배열로 만듭니다.
      const otherMeanings = WORDS
        .filter(function(item, idx) { return idx !== currentIndex; }) // 현재 단어가 아닌 것만 걸러냄
        .map(function(item) { return item.ko; }); // 한글 뜻만 뽑아냄

      // 다른 뜻 배열을 무작위로 섞습니다.
      otherMeanings.sort(function() { return Math.random() - 0.5; });

      // 무작위로 섞인 다른 뜻 중 상위 3개를 오답으로 가져옵니다.
      const wrongOptions = otherMeanings.slice(0, 3);

      // 정답 1개와 오답 3개를 합친 4개짜리 보기 배열을 만듭니다.
      const options = [currentWord.ko, ...wrongOptions];

      // 4개의 보기를 다시 무작위로 섞습니다.
      options.sort(function() { return Math.random() - 0.5; });

      // 보기 4개를 반복하면서 버튼 태그를 만들어 화면에 추가합니다.
      options.forEach(function(optionText) {
        const btn = document.createElement('button'); // 새 버튼을 만듭니다.
        btn.classList.add('quiz-btn'); // 퀴즈 버튼 전용 클래스를 추가합니다.
        btn.textContent = optionText; // 보기 한글 뜻 글자를 적습니다.
        
        // 보기 버튼을 클릭했을 때 정답/오답을 판별하는 이벤트를 붙입니다.
        btn.addEventListener('click', function() {
          checkAnswer(btn, optionText, currentWord.ko);
        });

        quizOptions.appendChild(btn); // 만든 버튼을 퀴즈 구역 안에 추가합니다.
      });
    }

    // 퀴즈 정답 여부를 판별하고 점수를 올려주는 함수입니다.
    function checkAnswer(selectedBtn, selectedText, correctText) {
      if (isQuizAnswered) return; // 이미 답변을 한 퀴즈라면 아무 동작도 하지 않습니다.
      isQuizAnswered = true; // 답변을 완료했음을 표시합니다.

      const allBtns = quizOptions.querySelectorAll('.quiz-btn'); // 모든 보기 버튼을 가져옵니다.

      // 선택한 뜻이 정답과 같은지 확인합니다.
      if (selectedText === correctText) {
        correctCount++; // 맞은 개수 1 증가
        selectedBtn.classList.add('correct'); // 클릭한 버튼에 초록색 배경 추가
        
        // 정답이 아닌 나머지 버튼들을 흐리게 만듭니다.
        allBtns.forEach(function(btn) {
          if (btn !== selectedBtn) {
            btn.classList.add('dimmed');
          }
        });
      } else {
        wrongCount++; // 틀린 개수 1 증가
        
        // 정답 버튼을 찾아서 초록색으로 표시하고, 나머지 버튼들은 모두 흐리게 만듭니다.
        allBtns.forEach(function(btn) {
          if (btn.textContent === correctText) {
            btn.classList.add('correct'); // 진짜 정답 버튼에 초록색 표시
          } else {
            btn.classList.add('dimmed'); // 오답 버튼들은 흐리게 표시
          }
        });
      }

      // 점수판 글자를 갱신합니다.
      scoreBoard.textContent = '맞음: ' + correctCount + ' | 틀림: ' + wrongCount;
    }

    // '이전' 버튼을 눌렀을 때 작동하는 함수입니다.
    prevBtn.addEventListener('click', function() {
      if (currentIndex > 0) { // 맨 첫 번째 단어가 아닐 때만 작동합니다.
        currentIndex--; // 앞 단어 번호로 1 감소
        updateCard(); // 카드를 갱신합니다.
      }
    });

    // '다음' 버튼을 눌렀을 때 작동하는 함수입니다.
    nextBtn.addEventListener('click', function() {
      if (currentIndex < WORDS.length - 1) { // 맨 마지막 단어가 아닐 때만 작동합니다.
        currentIndex++; // 다음 단어 번호로 1 증가
        updateCard(); // 카드를 갱신합니다.
      }
    });

    // 프로그램이 처음 시작될 때 첫 번째 단어를 화면에 그려줍니다.
    updateCard();
  </script>

</body>
</html>
