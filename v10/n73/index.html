<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>안전한 곳 (Safe Place - Massive Extended)</title>
    <style>
        body {
            background-color: #0d0b10;
            color: #d1c4d1;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* CRT 모니터 스캔라인 효과 */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 21, 0) 50%, rgba(0, 0, 0, 0.35) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            z-index: 999;
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
        }

        .game-container {
            width: 700px;
            background-color: #16121a;
            border: 2px dashed #4a334a;
            padding: 35px;
            box-shadow: 0 0 30px rgba(74, 51, 74, 0.4);
            text-align: center;
            position: relative;
        }

        h1 {
            font-size: 1.1rem;
            color: #d68787;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .dialogue-box {
            min-height: 130px;
            font-size: 0.95rem;
            line-height: 1.7;
            margin-bottom: 30px;
            white-space: pre-wrap;
            color: #ebdceb;
            text-align: left;
            background: #110e14;
            padding: 18px;
            border: 1px solid #2e202e;
        }

        .choices-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 220px;
            overflow-y: auto;
        }

        button {
            background-color: #201724;
            color: #ebdceb;
            border: 1px solid #573c57;
            padding: 10px 14px;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
        }

        button:hover {
            background-color: #3b2840;
            color: #ffffff;
            border-color: #d68787;
            padding-left: 18px;
        }

        .strobe {
            animation: flash 0.12s infinite;
        }

        @keyframes flash {
            0% { background-color: #0d0b10; }
            50% { background-color: #33121b; }
            100% { background-color: #0d0b10; }
        }
    </style>
</head>
<body>

<div class="game-container" id="container">
    <h1 id="game-title">안전한 곳</h1>
    <div class="dialogue-box" id="dialogue">눈꺼풀이 무겁다. 어디선가 낡은 오르골 소리가 들려온다.\n'착한 아이는 눈을 감고 있어야 해.'</div>
    <div class="choices-box" id="choices">
        <button onclick="changeScene(1)">1. 눈을 뜬다</button>
        <button onclick="changeScene(2)">2. 계속 눈을 감고 본체한다</button>
    </div>
</div>

<script>
    const scenes = {
        0: {
            title: "안전한 곳",
            text: "눈꺼풀이 무겁다. 어디선가 낡은 오르골 소리가 들려온다.\n'착한 아이는 눈을 감고 있어야 해.'",
            choices: [
                { text: "1. 눈을 뜬다", next: 1 },
                { text: "2. 계속 눈을 감고 본체한다", next: 2 }
            ]
        },
        1: {
            title: "기억의 조각",
            text: "여기가 어디지...? 벽에는 빛바랜 유치원 벽지가 붙어있고, 모서리에 낡은 분홍색 곰인형 하나가 눈을 깜빡이지 않은 채 나를 바라보고 있다.\n내 손목엔 지난번에 엄마가 붙여준 반창고가 그대로 붙어있다.",
            choices: [
                { text: "1. 곰인형의 눈을 가까이서 들여다본다", next: 3 },
                { text: "2. 방 구석에 놓인 알록달록한 블록 장난감을 만져본다", next: 4 },
                { text: "3. 조용히 방 문을 열고 복도로 나간다", next: 5 },
                { text: "4. 방 구석에 놓인 낡은 일기장을 집어 든다", next: 20 }
            ]
        },
        2: {
            title: "어두운 침묵",
            text: "눈을 감고 숨죽여 기다리자, 머리 쓰다듬는 손길이 느껴진다.\n차가운 손이다. 엄마의 손이 아니야. 손톱이 피부를 아프게 파고든다.\n'착하네, 우리 애기… 영원히 이렇게 있을까?'",
            choices: [
                { text: "1. 비명을 지르며 눈을 확 뜬다", next: 1 },
                { text: "2. 그 손에 감동한 듯 미소를 짓는다", next: 12 },
                { text: "3. 손을 꽉 붙잡고 누구냐고 묻는다", next: 21 }
            ]
        },
        3: {
            title: "곰인형의 비밀",
            text: "인형의 까만 플라스틱 눈을 만지자, 인형 안에서 삐걱거리는 소리와 함께 낡은 녹음기 음성 같은 목소리가 흘러나온다.\n'도망쳐… 문을 잠그기 전에 어서 그 방에서 나가야 해.'",
            choices: [
                { text: "1. 인형의 배를 뜯어 뱃속을 확인한다", next: 6 },
                { text: "2. 겁을 먹고 서둘러 문을 연다", next: 5 },
                { text: "3. 인형에게 사과하며 품에 꼭 안는다", next: 22 }
            ]
        },
        4: {
            title: "알록달록한 기억",
            text: "빨강, 파랑, 노란색 블록을 집어 들자 모양이 이상하다. 블록마다 알파벳이 아니라 '거짓말쟁이', '나쁜 아이', '잊어버려' 같은 단어들이 삐뚤빼뚤 적혀 있다.",
            choices: [
                { text: "1. 블록을 와르르 무너뜨린다", next: 7 },
                { text: "2. 블록으로 탑을 바르게 쌓아 올린다", next: 8 },
                { text: "3. '나쁜 아이' 블록을 창밖으로 던진다", next: 23 }
            ]
        },
        5: {
            title: "끝없는 복도",
            text: "방 문을 나서자 끝이 보이지 않을 정도로 길고 어두운 복도가 나타난다. 사방의 벽에는 수많은 가족 사진들이 걸려 있는데, 사진 속 모든 사람들의 얼굴이 검게 지워져 있다.",
            choices: [
                { text: "1. 사진 속 지워진 얼굴들을 하나씩 만져본다", next: 9 },
                { text: "2. 복도 끝에 있는 하얀 문을 향해 걸어간다", next: 10 },
                { text: "3. 복도 바닥에 엎드려 기어간다", next: 24 }
            ]
        },
        6: {
            title: "찢어진 솜",
            text: "인형의 뜯어진 틈새로 쏟아져 나온 것은 솜이 아니라 낡은 열쇠와 핏자국이 묻은 바늘들이었다.\n내 손가락 끝에서 피가 흘러내리지만, 아프기는커녕 온몸이 따뜻해진다.",
            choices: [
                { text: "1. 바늘을 내 팔에 꾹 찔러본다", next: 13 },
                { text: "2. 열쇠를 집어 들고 바닥의 비밀 패널을 찾는다", next: 14 }
            ]
        },
        7: {
            title: "와르르 무너지는 세계",
            text: "블록을 무너지게 만들자 세상의 색채가 순식간에 회색빛으로 바뀐다.\n벽지가 뜯어지며 그 뒤에 숨겨져 있던 차가운 콘크리트 벽이 드러난다.",
            choices: [
                { text: "1. 벽을 긁으며 밖으로 나갈 구멍을 찾는다", next: 11 },
                { text: "2. 주저앉아 울기 시작한다", next: 15 }
            ]
        },
        8: {
            title: "규칙의 완성",
            text: "완벽하게 네모난 탑을 완성하자, 어디선가 엄마의 칭찬하는 목소리가 들린다.\n'그래, 우리 아이는 이렇게 말을 잘 들어야 예쁘지.'",
            choices: [
                { text: "1. 안도하며 바닥에 엎드린다", next: 16 }
            ]
        },
        9: {
            title: "지워진 기억",
            text: "가족 사진의 얼굴을 만지는 순간, 내 기억 속의 부모님 얼굴도 순식간에 하얗게 지워져 버린다.\n내가 누구였더라? 내 이름이 뭐였지…?",
            choices: [
                { text: "1. 거울을 찾아 달려간다", next: 17 }
            ]
        },
        10: {
            title: "하얀 문",
            text: "하얀 문을 열자 눈이 부시도록 환한 빛이 쏟아진다. 하지만 그 빛 속에서 엄마의 목소리가 들려온다.\n'어디 가니? 밥 먹을 시간이야. 다시 돌아와.'",
            choices: [
                { text: "1. 뒤돌아보지 않고 빛 속으로 뛰어든다", next: 18 },
                { text: "2. 발걸음을 멈추고 집 안으로 돌아간다", next: 19 }
            ]
        },
        // --- 새로 추가된 깊은 분기들 (20 ~ 34) ---
        20: {
            title: "낡은 일기장",
            text: "일기장을 펼치자 첫 장부터 마지막 장까지 온통 '나는 나쁜 아이입니다'라는 문장만 수백 번 반복되어 적혀 있다.\n가장 마지막 페이지에는 오늘 날짜와 함께 내 이름이 적혀 있다.",
            choices: [
                { text: "1. 내 이름이 적힌 페이지를 찢어 입에 넣는다", next: 25 },
                { text: "2. 일기장을 불에 태우려 라이터를 찾는다", next: 26 }
            ]
        },
        21: {
            title: "차가운 손의 정체",
            text: "손을 꽉 붙잡자, 어둠 속에서 거울처럼 똑 닮은 내 얼굴을 한 형체가 서서히 모습을 드러낸다.\n'네가 도망치면, 내가 대신 이 집에 남아야 해.'",
            choices: [
                { text: "1. 그 형체와 자리를 바꾼다", next: 27 },
                { text: "2. 형체를 밀쳐내고 도망친다", next: 5 }
            ]
        },
        22: {
            title: "인형의 품",
            text: "곰인형을 꼭 안자 인형의 몸속에서 따뜻한 온기가 전해져 온다.\n인형이 내 귀에 조용히 속삭인다. '이제 바깥 세상은 너무 추워. 여기서 눈 감고 자자.'",
            choices: [
                { text: "1. 인형의 품에 안긴 채 영원히 눈을 감는다", next: 28 },
                { text: "2. 고개를 저으며 인형을 밀어낸다", next: 1 }
            ]
        },
        23: {
            title: "창밖의 풍경",
            text: "창문을 열자 바깥은 진짜 세상이 아니라, 거대한 거울로 둘러싸인 또 다른 방들의 연속이었다.\n하늘에는 구름 대신 수십 개의 거대한 눈동자가 떠서 나를 내려다보고 있다.",
            choices: [
                { text: "1. 창틀을 넘어 거울 조각 위로 뛰어내린다", next: 29 },
                { text: "2. 창문을 닫고 커튼을 쳐버린다", next: 1 }
            ]
        },
        24: {
            title: "낮은 기어감",
            text: "복도 바닥을 낮게 기어가자 벽에 가려져 보이지 않던 작은 개구멍이 눈에 띈다.\n그 안쪽에서 달콤한 딸기 시럽 냄새와 함께 어린아이의 울음소리가 들린다.",
            choices: [
                { text: "1. 개구멍 안으로 기어들어간다", next: 30 },
                { text: "2. 무시하고 계속 복도를 지난다", next: 10 }
            ]
        },
        25: {
            title: "글자의 맛",
            text: "종이를 씹어 삼키자 목구멍이 타들어 가는 것처럼 아프다.\n하지만 동시에 머릿속을 짓누르던 죄책감이 씻겨 내려가는 듯한 기묘한 쾌감이 느껴진다.",
            choices: [
                { text: "1. 일기장 전체를 뜯어 먹기 시작한다", next: 31 }
            ]
        },
        26: {
            title: "작은 불꽃",
            text: "주머니 속에서 발견한 성냥을 켜자 낡은 일기장이 순식간에 불타오른다.\n방 안의 벽지가 불길에 타들어가며 그 뒤에 숨겨진 진짜 바깥 세상의 공기가 스며든다.",
            choices: [
                { text: "1. 불길 속으로 과감히 걸어 들어간다", next: 32 }
            ]
        },
        27: {
            title: "[엔딩 J: 그림자의 대속]",
            text: "내 자리를 대신한 그림자 형체는 환하게 웃으며 방 밖으로 나간다.\n나는 이 어두운 방에 남겨진 껍데기가 되어 영원히 누군가의 기억을 대신 짊어진다.\n\n(Bad Ending - 역할 교체)",
            isEnd: true,
            choices: [{ text: "처음부터 다시 시작하기", next: 0 }]
        },
        28: {
            title: "[엔딩 K: 솜인형의 안식]",
            text: "더 이상 슬퍼할 힘조차 남지 않은 아이는 곰인형과 하나가 되어 침대 위에서 움직이지 않는 인형이 되었다.\n가장 평화롭고, 가장 슬픈 동화의 결말.\n\n(Bad Ending - 영원한 동화)",
            isEnd: true,
            choices: [{ text: "처음부터 다시 시작하기", next: 0 }]
        },
        29: {
            title: "[엔딩 L: 거울의 미로]",
            text: "거울 조각 위로 뛰어내린 순간, 수천 개의 거울 속으로 내 모습이 산산조각 나며 분열된다.\n어디가 진짜 나인지 이제는 그 누구도 알 수 없다.\n\n(Bad Ending - 파편화)",
            isEnd: true,
            choices: [{ text: "처음부터 다시 시작하기", next: 0 }]
        },
        30: {
            title: "[엔딩 M: 지하의 보물]",
            text: "개구멍 너머에는 어른들이 숨겨둔 진짜 어린 시절의 추억 상자가 놓여 있었다.\n비록 상처투성이지만, 그 상자 안에는 진짜 내 웃음소리가 담겨 있었다.\n\n(Secret Ending - 진짜 기억)",
            isEnd: true,
            choices: [{ text: "처음부터 다시 시작하기", next: 0 }]
        },
        31: {
            title: "[엔딩 N: 침묵의 내면화]",
            text: "과거의 모든 규칙과 낙인을 스스로 삼켜버린 아이는 더 이상 말을 잃어버렸다.\n완벽하게 순종적이며, 감정이 메말라버린 빈공간.\n\n(Bad Ending - 공허)",
            isEnd: true,
            choices: [{ text: "처음부터 다시 시작하기", next: 0 }]
        },
        32: {
            title: "[엔딩 O: 화염 속의 해방]",
            text: "과거를 태운 불길 속에서 뜨겁지만 시원한 바람이 불어온다.\n집이 무너져 내리는 잔해 속에서 비로소 과거의 매듭을 끊고 세상 밖으로 걸어 나간다.\n\n(Alternate True Ending - 정화와 탈출)",
            isEnd: true,
            choices: [{ text: "다시 시작하기", next: 0 }]
        },
        // --- 기존 엔딩들 (A ~ I) ---
        11: {
            title: "[엔딩 A: 균열 속으로]",
            text: "벽을 뚫고 나아가려 했지만, 그곳엔 또 다른 방, 또 다른 곰인형이 놓여 있을 뿐이다.\n도망칠 곳은 어디에도 없다. 나는 이 끝없는 순환 속에 갇혔다.\n\n(Bad Ending - 무한 회귀)",
            isEnd: true,
            choices: [{ text: "처음부터 다시 시작하기", next: 0 }]
        },
        12: {
            title: "[엔딩 B: 완벽한 순종]",
            text: "차가운 손길을 기꺼이 받아들이자 내 몸이 점점 굳어지며 인형의 재질로 변해간다.\n이제 아프지도 않고, 아무 생각도 들지 않는다. 나는 영원히 가장 착한 아이가 되었다.\n\n(Bad Ending - 인형화)",
            isEnd: true,
            choices: [{ text: "처음부터 다시 시작하기", next: 0 }]
        },
        13: {
            title: "[엔딩 C: 스스로 거둔 상처]",
            text: "바늘로 내 몸을 찌를 때마다 가슴속의 무거운 짐들이 흘러내리는 기분이 든다.\n아픔을 통해 비로소 내가 살아있음을 느낀다. 슬프지만 이것이 나의 유일한 해방 방식이다.\n\n(Bittersweet Ending - 자가 치유)",
            isEnd: true,
            choices: [{ text: "처음부터 다시 시작하기", next: 0 }]
        },

    function changeScene(sceneId) {
        const currentScene = scenes[sceneId];
        const titleEl = document.getElementById("game-title");
        const dialogueEl = document.getElementById("dialogue");
        const choicesEl = document.getElementById("choices");
        const containerEl = document.getElementById("container");

        titleEl.innerText = currentScene.title;
        dialogueEl.innerText = currentScene.text;
        choicesEl.innerHTML = "";

        // 엔딩 구간에 진입하면 화면이 반짝이는 스트로브 효과 부여
        if (currentScene.isEnd) {
            containerEl.classList.add("strobe");
        } else {
            containerEl.classList.remove("strobe");
        }

        currentScene.choices.forEach(choice => {
            const btn = document.createElement("button");
            btn.innerText = choice.text;
            btn.onclick = () => changeScene(choice.next);
            choicesEl.appendChild(btn);
        });
    }
</script>
