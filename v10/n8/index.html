    <!-- Web Audio Synthesizer Logic -->
    <script>
        class BClassSoundEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
                this.bgmTimer = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            toggleSound() {
                this.enabled = !this.enabled;
                if (!this.enabled && this.bgmTimer) {
                    clearInterval(this.bgmTimer);
                    this.bgmTimer = null;
                } else if (this.enabled) {
                    this.startFunnyBGM();
                }
                return this.enabled;
            }

            // 8-Bit Weird BGM
            startFunnyBGM() {
                if (!this.enabled) return;
                this.init();
                if (this.bgmTimer) clearInterval(this.bgmTimer);

                const notes = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 329.63, 261.63];
                let idx = 0;

                this.bgmTimer = setInterval(() => {
                    if (!this.enabled || !this.ctx) return;
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = (idx % 2 === 0) ? 'triangle' : 'square';
                    osc.frequency.setValueAtTime(notes[idx % notes.length], now);

                    gain.gain.setValueAtTime(0.04, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(now);
                    osc.stop(now + 0.18);

                    idx++;
                }, 220);
            }

            // SFX: Funny Fail / Boing
            playBoing() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.3);

                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.3);
            }

            // SFX: Tuba Shock (Dun Dun Dun)
            playTubaShock() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                const freqs = [110, 103, 98];

                freqs.forEach((f, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(f, now + i * 0.15);
                    gain.gain.setValueAtTime(0.25, now + i * 0.15);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.15 + 0.25);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + i * 0.15);
                    osc.stop(now + i * 0.15 + 0.25);
                });
            }

            // SFX: Victory / High Cheer
            playVictory() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50];

                notes.forEach((f, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(f, now + i * 0.1);
                    gain.gain.setValueAtTime(0.15, now + i * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.2);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + i * 0.1);
                    osc.stop(now + i * 0.1 + 0.2);
                });
            }
        }

                    bad_gameover: {
                        isEnding: true,
                        emoji: '💀',
                        location: '엔딩: 병맛 멘탈 붕괴',
                        text: '【게임 오버: 멘탈 / 체력 붕괴】\n학교의 이상한 기운을 견디지 못하고 정신을 잃었습니다... 눈을 뜨니 다음 날 아침 8시 반 조회 시간이었습니다!'
                    }
                };

                this.initUI();
            }

            initUI() {
                // Sound Toggle Button
                document.getElementById('sound-btn').addEventListener('click', () => {
                    const active = this.sound.toggleSound();
                    document.getElementById('sound-btn').textContent = active ? '🔊 사운드 ON' : '🔇 사운드 OFF';
                });

                // Choice Button Events
                document.getElementById('choice-1').addEventListener('click', () => this.makeChoice(1));
                document.getElementById('choice-2').addEventListener('click', () => this.makeChoice(2));

                this.renderNode('start');
            }

            makeChoice(optionNum) {
                const node = this.storyNodes[this.currentStep];
                if (node.isEnding) {
                    // Reset Game if on ending screen
                    this.resetGame();
                    return;
                }

                const choice = optionNum === 1 ? node.c1 : node.c2;

                // Apply Stat Changes
                this.hp = Math.max(0, Math.min(100, this.hp + choice.hp));
                this.sanity = Math.max(0, Math.min(100, this.sanity + choice.sanity));
                this.crazy = Math.max(0, this.crazy + choice.crazy);

                // Play Audio Effects
                if (choice.crazy >= 25) {
                    this.sound.playTubaShock();
                    this.triggerScreenEffect('shake');
                } else {
                    this.sound.playBoing();
                    this.triggerScreenEffect('flash');
                }

                // Check Fail / Game Over State
                if (this.hp <= 0 || this.sanity <= 0) {
                    this.renderNode('bad_gameover');
                } else {
                    this.renderNode(choice.next);
                }
            }

            triggerScreenEffect(type) {
                const app = document.getElementById('game-app');
                const flash = document.getElementById('flash-overlay');

                if (type === 'shake') {
                    app.classList.add('shake');
                    setTimeout(() => app.classList.remove('shake'), 300);
                } else if (type === 'flash') {
                    flash.classList.add('flash-white');
                    flash.style.opacity = '1';
                    setTimeout(() => {
                        flash.classList.remove('flash-white');
                        flash.style.opacity = '0';
                    }, 250);
                }
            }

            renderNode(nodeId) {
                this.currentStep = nodeId;
                const node = this.storyNodes[nodeId];

                // Update Stats Display
                document.getElementById('hp-val').textContent = this.hp;
                document.getElementById('sanity-val').textContent = this.sanity;
                document.getElementById('crazy-val').textContent = this.crazy;

                // Update Story Display
                document.getElementById('scene-emoji').textContent = node.emoji;
                document.getElementById('scene-location').textContent = node.location;
                document.getElementById('scene-text').innerText = node.text;

                const btn1 = document.getElementById('choice-1');
                const btn2 = document.getElementById('choice-2');

                if (node.isEnding) {
                    this.sound.playVictory();
                    btn1.textContent = '🔄 처음부터 다시 도전하기';
                    btn1.className = 'col-span-1 sm:col-span-2 py-4 px-4 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-slate-950 font-bold text-xl rounded-2xl shadow-lg transition text-center';
                    btn2.classList.add('hidden');
                } else {
                    btn1.textContent = `[1] ${node.c1.text}`;
                    btn2.textContent = `[2] ${node.c2.text}`;
                    btn1.className = 'py-4 px-4 bg-gradient-to-r from-purple-900 to-indigo-900 hover:from-purple-800 hover:to-indigo-800 border-2 border-purple-500/60 rounded-2xl text-purple-200 font-bold text-base sm:text-lg shadow-lg hover:scale-[1.02] active:scale-95 transition flex items-center justify-center text-center';
                    btn2.className = 'py-4 px-4 bg-gradient-to-r from-pink-900 to-rose-900 hover:from-pink-800 hover:to-rose-800 border-2 border-pink-500/60 rounded-2xl text-pink-200 font-bold text-base sm:text-lg shadow-lg hover:scale-[1.02] active:scale-95 transition flex items-center justify-center text-center';
                    btn2.classList.remove('hidden');
                }
            }

            resetGame() {
                this.hp = 100;
                this.sanity = 100;
                this.crazy = 0;
                this.renderNode('start');
            }
        }

        // Initialize Game Engine on Load
        window.onload = () => {
            window.gameInstance = new FunnyHorrorGame();
        };
    </script>
</body>
</html>
