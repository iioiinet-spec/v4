<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dex AI Wallpaper Widget</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .mono-font { font-family: 'JetBrains Mono', monospace; }

        /* Wallpaper Engine Style: Simulated Desktop Background */
        .desktop-wallpaper {
            background: radial-gradient(circle at 50% 30%, #1c1c1e 0%, #0a0a0c 70%, #000000 100%);
        }

        /* Ambient Breathing & Idle Animation for Cat Widget */
        @keyframes desktopBreath {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-4px) scale(1.01); }
        }
        .cat-widget-idle {
            animation: desktopBreath 4s infinite ease-in-out;
        }

        /* Glowing Pulse when Listening or Speaking */
        @keyframes cyberGlow {
            0%, 100% { filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.25)); }
            50% { filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.6)); }
        }
        .active-glow {
            animation: cyberGlow 2s infinite ease-in-out;
        }

        /* Glassmorphism Effect - Cute & Soft */
        .glass-panel {
            background: rgba(22, 22, 26, 0.8);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
    </style>
</head>
<body class="desktop-wallpaper text-neutral-100 h-screen w-screen overflow-hidden flex flex-col justify-between select-none relative">

    <!-- Simulated Windows Desktop Icons / Wallpaper Background Layer -->
    <div class="absolute inset-0 p-8 grid grid-cols-4 sm:grid-cols-8 gap-6 pointer-events-none opacity-30 z-0">
        <div class="flex flex-col items-center space-y-1.5 w-20 text-center">
            <i class="fa-solid fa-gamepad text-2xl text-neutral-400"></i>
            <span class="text-[11px] text-neutral-300 truncate w-full">League of Legends</span>
        </div>
        <div class="flex flex-col items-center space-y-1.5 w-20 text-center">
            <i class="fa-brands fa-discord text-2xl text-indigo-400"></i>
            <span class="text-[11px] text-neutral-300 truncate w-full">Discord</span>
        </div>
        <div class="flex flex-col items-center space-y-1.5 w-20 text-center">
            <i class="fa-solid fa-code text-2xl text-neutral-400"></i>
            <span class="text-[11px] text-neutral-300 truncate w-full">VS Code</span>
        </div>
        <div class="flex flex-col items-center space-y-1.5 w-20 text-center">
            <i class="fa-solid fa-folder text-2xl text-amber-400"></i>
            <span class="text-[11px] text-neutral-300 truncate w-full">Projects</span>
        </div>
    </div>

    <!-- Wallpaper Engine Mode Header (Minimal & Transparent) -->
    <header class="w-full p-6 flex justify-between items-center z-20 pointer-events-auto">
        <div class="flex items-center space-x-3 glass-panel px-4 py-2 rounded-2xl shadow-lg">
            <div id="status-dot" class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></div>
            <span class="mono-font text-xs font-bold tracking-wider text-neutral-200">DEX_WALLPAPER_ENGINE // v2.6</span>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="toggleVoiceMode()" id="mic-top-btn" class="glass-panel px-4 py-2 rounded-2xl hover:bg-neutral-800 transition flex items-center space-x-2 text-xs font-semibold cursor-pointer">
                <i class="fa-solid fa-microphone text-emerald-400" id="mic-top-icon"></i>
                <span id="mic-top-text">음성 인식 켜짐</span>
            </button>
            <button onclick="toggleWidgetPanel()" class="glass-panel px-4 py-2 rounded-2xl hover:bg-neutral-800 transition text-xs font-semibold cursor-pointer shadow-md">
                <i class="fa-solid fa-sliders mr-1 text-emerald-400"></i> 컨트롤 센터
            </button>
        </div>
    </header>

    <!-- Center/Bottom Right: Wallpaper Engine Overlay Cat Widget (Dex) -->
    <div class="absolute bottom-10 right-10 z-30 flex flex-col items-end space-y-3">
        
        <!-- Speech Bubble / Chat Dialogue Box (Ultra Clean & Cute) -->
        <div id="speech-bubble" class="glass-panel max-w-xs p-3.5 rounded-3xl shadow-2xl transition-all duration-300 transform translate-y-1 opacity-95">
            <div class="flex items-center justify-between mb-1">
                <span class="mono-font text-[9px] text-neutral-400 font-bold">DEX // AI COMPANION</span>
                <span id="dex-mode-badge" class="text-[9px] bg-neutral-800 text-emerald-400 px-2 py-0.5 rounded-full font-semibold">대기중</span>
            </div>
            <p id="bubble-text" class="text-xs text-neutral-200 leading-snug">
                "안녕! 바탕화면 배경에서 대기 중이야. '덱스쳐'라고 먼저 부르고 말씀해 주세요!"
            </p>
        </div>

        <!-- The 3D/Dynamic Desktop Cat Widget (Wallpaper Engine Style) -->
        <div id="cat-widget-container" class="relative group cursor-pointer cat-widget-idle active-glow transition-transform duration-300 hover:scale-105" onclick="quickInteract()">
            
            <!-- Glow background effect -->
            <div class="absolute inset-0 bg-white/5 rounded-full blur-xl group-hover:bg-white/10 transition"></div>

            <!-- Monochrome Cyber Cat SVG with Sunglasses & 'DEX' Clothes -->
            <svg viewBox="0 0 200 200" class="w-40 h-40 drop-shadow-2xl relative z-10" id="dex-svg">
                <!-- Cat Ears -->
                <polygon points="45,60 25,10 75,40" fill="#121214" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
                <polygon points="155,60 175,10 125,40" fill="#121214" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
                <polygon points="50,55 37,25 70,42" fill="#2d2d30"/>
                <polygon points="150,55 163,25 130,42" fill="#2d2d30"/>

                <!-- Cat Head -->
                <path d="M 40,70 Q 100,40 160,70 Q 180,120 150,160 Q 100,180 50,160 Q 20,120 40,70 Z" fill="#121214" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/>

                <!-- Whiskers -->
                <line x1="20" y1="120" x2="60" y2="125" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
                <line x1="18" y1="135" x2="58" y2="135" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
                <line x1="180" y1="120" x2="140" y2="125" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
                <line x1="182" y1="135" x2="142" y2="135" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

                <!-- Nose & Mouth -->
                <polygon points="100,132 93,123 107,123" fill="#ffffff"/>
                <path d="M 100,132 Q 90,145 85,138 M 100,132 Q 110,145 115,138" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

                <!-- Sunglasses (Cool Style) -->
                <path d="M 45,85 L 95,85 L 95,115 L 45,115 Z" fill="#000000" stroke="#ffffff" stroke-width="4" rx="5"/>
                <path d="M 105,85 L 155,85 L 155,115 L 105,115 Z" fill="#000000" stroke="#ffffff" stroke-width="4" rx="5"/>
                <line x1="95" y1="95" x2="105" y2="95" stroke="#ffffff" stroke-width="4"/>
                <line x1="52" y1="90" x2="70" y2="105" stroke="#737373" stroke-width="3" stroke-linecap="round"/>
                <line x1="112" y1="90" x2="130" y2="105" stroke="#737373" stroke-width="3" stroke-linecap="round"/>

                <!-- Clothes / Body Collar with 'DEX' -->
                <path d="M 60,165 Q 100,150 140,165 L 160,200 L 40,200 Z" fill="#1c1c1e" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
                <text x="100" y="190" text-anchor="middle" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-weight="bold" font-size="20" letter-spacing="3">DEX</text>
            </svg>

            <!-- Floating audio waves indicator badge -->
            <div id="audio-wave-badge" class="absolute -top-3 left-1/2 transform -translate-x-1/2 glass-panel px-3 py-0.5 rounded-full text-[9px] mono-font text-emerald-400 flex items-center space-x-1 shadow-lg">
                <i class="fa-solid fa-wave-square animate-pulse"></i>
                <span>LISTENING</span>
            </div>
        </div>

    </div>

    <!-- Collapsible Control Center / Chat Panel (Hidden by default, toggled via button) -->
    <div id="control-panel" class="absolute inset-y-0 right-0 w-full sm:w-96 glass-panel border-l border-white/10 z-40 transform translate-x-full transition-transform duration-300 flex flex-col shadow-2xl">
        <div class="p-4 border-b border-white/10 flex justify-between items-center bg-black/40">
            <h2 class="font-bold mono-font text-xs flex items-center">
                <i class="fa-solid fa-terminal mr-2 text-emerald-400"></i> DEX CONTROL CENTER
            </h2>
            <button onclick="toggleWidgetPanel()" class="text-neutral-400 hover:text-white px-2 py-1"><i class="fa-solid fa-xmark text-base"></i></button>
        </div>

        <!-- Quick Command Buttons -->
        <div class="p-4 border-b border-white/10 bg-black/20">
            <p class="text-[11px] font-semibold text-neutral-400 mb-2">빠른 명령어 실행:</p>
            <div class="grid grid-cols-2 gap-2 text-xs">
                <button onclick="executeCommand('덱스쳐 롤 켜줘')" class="p-2 bg-neutral-900/80 hover:bg-neutral-800 rounded-xl border border-white/10 text-left transition">
                    🎮 롤 켜기
                </button>
                <button onclick="executeCommand('덱스쳐 네이버 열어줘')" class="p-2 bg-neutral-900/80 hover:bg-neutral-800 rounded-xl border border-white/10 text-left transition">
                    🌐 네이버 열기
                </button>
                <button onclick="executeCommand('덱스쳐 디코 방 들어가줘')" class="p-2 bg-neutral-900/80 hover:bg-neutral-800 rounded-xl border border-white/10 text-left transition">
                    💬 디코 방 입장
                </button>
                <button onclick="executeCommand('덱스쳐 이제 가줘')" class="p-2 bg-neutral-900/80 hover:bg-neutral-800 rounded-xl border border-white/10 text-left transition text-amber-400">
                    🌙 재우기 (이제가)
                </button>
            </div>
            <div class="mt-2">
                <button onclick="executeCommand('덱스쳐 나와')" class="w-full p-2 bg-neutral-900/80 hover:bg-neutral-800 rounded-xl border border-white/10 text-center transition text-emerald-400 font-semibold text-xs">
                    ⚡ 덱스쳐 나와 (깨우기)
                </button>
            </div>
        </div>

        <!-- Chat History Stream -->
        <div id="chat-stream" class="flex-1 p-4 overflow-y-auto space-y-3 text-xs">
            <div class="bg-neutral-900/60 p-3 rounded-xl border border-white/5">
                <p class="font-bold text-neutral-400 mb-1">DEX SYSTEM</p>
                <p class="text-neutral-200">바탕화면 오버레이 모드가 활성화되었습니다. "덱스쳐"를 부른 후 말씀해 주세요!</p>
            </div>
        </div>

        <!-- Text Input Form -->
        <div class="p-4 bg-black/40 border-t border-white/10">
            <form onsubmit="handleFormSubmit(event)" class="flex space-x-2">
                <input type="text" id="chat-input" placeholder="덱스에게 말 걸기 (예: 덱스쳐 구글에서 날씨 검색해줘)..." class="flex-1 bg-black/50 border border-white/10 rounded-xl px-3 py-2 text-xs text-neutral-200 focus:outline-none focus:border-white/30">
                <button type="submit" class="bg-white text-black font-bold px-4 py-2 rounded-xl text-xs hover:bg-neutral-200 transition">전송</button>
            </form>
        </div>
    </div>

    <!-- Active App / Simulation Floating Toast Notification -->
    <div id="toast-notification" class="fixed top-20 left-1/2 transform -translate-x-1/2 -translate-y-20 opacity-0 transition-all duration-300 glass-panel px-5 py-3 rounded-2xl shadow-2xl z-50 flex items-center space-x-3">
        <i id="toast-icon" class="fa-solid fa-gamepad text-emerald-400 text-lg"></i>
        <div>
            <p id="toast-title" class="text-xs font-bold mono-font">SYSTEM NOTIFICATION</p>
            <p id="toast-desc" class="text-xs text-neutral-300">작업이 성공적으로 수행되었습니다.</p>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        let isAwake = true;
        let isListening = true;
        let recognition = null;
        const synth = window.speechSynthesis;

        const bubbleText = document.getElementById('bubble-text');
        const dexModeBadge = document.getElementById('dex-mode-badge');
        const catWidgetContainer = document.getElementById('cat-widget-container');
        const dexSvg = document.getElementById('dex-svg');
        const audioWaveBadge = document.getElementById('audio-wave-badge');
        const statusDot = document.getElementById('status-dot');
        const micTopIcon = document.getElementById('mic-top-icon');
        const micTopText = document.getElementById('mic-top-text');
        const chatStream = document.getElementById('chat-stream');
        const controlPanel = document.getElementById('control-panel');
        const toastNotification = document.getElementById('toast-notification');

        // Initialize Web Speech API (STT)
        function initSpeech() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                showToast("음성 미지원", "브라우저가 음성 인식을 지원하지 않습니다.", "fa-triangle-exclamation");
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'ko-KR';
            recognition.continuous = true;
            recognition.interimResults = false;

            recognition.onresult = (event) => {
                const transcript = event.results[event.results.length - 1][0].transcript.trim();
                console.log("Heard:", transcript);
                
                if (isAwake) {
                    if (transcript.includes('덱스쳐')) {
                        addChatLog(transcript, true);
                        processCommand(transcript);
                    } else {
                        console.log("Ignored (Wake word '덱스쳐' missing):", transcript);
                    }
                } else {
                    if (transcript.includes('덱스쳐 나와') || transcript.includes('일어나')) {
                        addChatLog(transcript, true);
                        processCommand(transcript);
                    }
                }
            };

            recognition.onerror = (e) => console.log("Speech error:", e.error);

            recognition.onend = () => {
                if (isListening) {
                    try { recognition.start(); } catch(e){}
                }
            };

            try { recognition.start(); } catch(e){}
        }

        // Toggle Voice Mode manually
        function toggleVoiceMode() {
            if (!recognition) return;
            if (isListening) {
                isListening = false;
                recognition.stop();
                micTopIcon.className = "fa-solid fa-microphone-slash text-neutral-500";
                micTopText.innerText = "음성 끔";
                audioWaveBadge.classList.add('hidden');
                showToast("음성 중지", "마이크 입력이 꺼졌습니다.", "fa-microphone-slash");
            } else {
                isListening = true;
                try { recognition.start(); } catch(e){}
                micTopIcon.className = "fa-solid fa-microphone text-emerald-400";
                micTopText.innerText = "음성 인식 켜짐";
                audioWaveBadge.classList.remove('hidden');
                showToast("음성 켜짐", "Dex가 마이크 소리를 듣고 있습니다.", "fa-microphone");
            }
        }

        // Toggle Control Center Panel
        function toggleWidgetPanel() {
            controlPanel.classList.toggle('translate-x-full');
        }

        // Quick click on cat widget
        function quickInteract() {
            if (!isAwake) {
                executeCommand("덱스쳐 나와");
                return;
            }
            const greetings = [
                "부르셨나요? 무엇을 도와드릴까요?",
                "바탕화면에서 대기 중입니다. 원하시는 사이트나 대화를 말씀해 주세요.",
                "편하게 말씀해 주시면 바로 처리해 드릴게요.",
                "오늘도 멋진 하루 보내세요!"
            ];
            const randomMsg = greetings[Math.floor(Math.random() * greetings.length)];
            setDexSpeech(randomMsg);
            speak(randomMsg);
        }

        // Speak using TTS with friendly human-like tone
        function speak(text) {
            if (!synth) return;
            synth.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ko-KR';
            utterance.pitch = 0.95;
            utterance.rate = 1.0;
            synth.speak(utterance);
        }

        // Set Dex speech bubble text
        function setDexSpeech(text) {
            bubbleText.innerText = `"${text}"`;
            catWidgetContainer.classList.add('scale-105');
            setTimeout(() => catWidgetContainer.classList.remove('scale-105'), 300);
        }

        // Korean to English dictionary mapping for common site names
        const siteEnglishMap = {
            "구글": "google",
            "네이버": "naver",
            "유튜브": "youtube",
            "깃허브": "github",
            "넷플릭스": "netflix",
            "다음": "daum",
            "나무위키": "namu.wiki",
            "쿠팡": "coupang",
            "트위치": "twitch",
            "디스코드": "discord",
            "챗지피티": "chatgpt",
            "인스타그램": "instagram",
            "트위터": "twitter",
            "엑스": "twitter",
            "롤": "op.gg"
        };

        function translateSiteToDomain(koName) {
            let clean = koName.replace(/사이트|홈페이지|웹사이트|열어줘|들어가줘|이동해줘|으로|로|ㄱㄱ|가자/g, '').trim();
            if (siteEnglishMap[clean]) {
                if (siteEnglishMap[clean].includes('.')) return siteEnglishMap[clean];
                return siteEnglishMap[clean] + ".com";
            }
            if (clean.includes('.')) {
                return clean.startsWith('http') ? clean : clean;
            }
            return clean.toLowerCase().replace(/[^a-z0-9]/g, '') + ".com";
        }

        // Process Command with AI and Routing
        async function executeCommand(input) {
            const query = input.toLowerCase();

            // 1. Sleep / Wake Commands
            if (query.includes('이제 가줘') || query.includes('이제가') || query.includes('저리가')) {
                sleepDex();
                return;
            }

            if (query.includes('덱스쳐 나와') || query.includes('일어나')) {
                wakeDex();
                return;
            }

            if (!isAwake) {
                console.log("Dex is sleeping.");
                return;
            }

            // 2. Search command (Only when '검색' or '찾아줘' is explicitly included)
            if (query.includes('검색') || query.includes('찾아줘')) {
                handleSearchCommand(input);
                return;
            }

            // 3. Visit Site command (When explicit action words or abbreviation like 'ㄱㄱ', '열어줘', etc., are included)
            if (query.includes('열어줘') || query.includes('들어가줘') || query.includes('이동해줘') || query.includes('ㄱㄱ') || query.includes('가자') || query.includes('사이트')) {
                handleVisitSiteCommand(input);
                return;
            }

            // 4. Short casual site check using AI if it's just a single noun like "쿠팡 ㄱㄱ" or just "쿠팡"
            let cleanText = query.replace('덱스쳐', '').trim();
            if (cleanText.split(' ').length <= 2 && (siteEnglishMap[cleanText] || cleanText.length < 15)) {
                handleVisitSiteCommand(input);
                return;
            }

            // 5. General AI Conversational response (without search engine redirection)
            await handleGeminiResponse(input);
        }

        // Handle Site Visitation with www. and .com mapping and abbreviation support
        function handleVisitSiteCommand(rawText) {
            let text = rawText.replace('덱스쳐', '').trim();
            let targetSiteKo = text.replace(/열어줘|들어가줘|이동해줘|사이트|웹페이지|ㄱㄱ|가자/g, '').trim();
            
            let englishDomain = translateSiteToDomain(targetSiteKo);
            let finalUrl = "";
            let displayTitle = "";

            if (englishDomain.startsWith('http')) {
                finalUrl = englishDomain;
                displayTitle = englishDomain;
            } else if (englishDomain.includes('.')) {
                finalUrl = `https://www.${englishDomain}`;
                displayTitle = `www.${englishDomain}`;
            } else {
                finalUrl = `https://www.${englishDomain}.com`;
                displayTitle = `www.${englishDomain}.com`;
            }

            const msg = `${displayTitle} 사이트로 이동합니다!`;
            setDexSpeech(msg);
            speak(msg);
            showToast("웹사이트 이동", `${displayTitle} 열리는 중`, "fa-globe");
            window.open(finalUrl, '_blank');
            addChatLog(`Dex: ${msg}`, false);
        }

        // Handle Search Command (Default browser is Google)
        function handleSearchCommand(rawText) {
            let text = rawText.replace('덱스쳐', '').trim();
            let searchEngine = 'https://www.google.com/search?q=';
            let engineName = '구글';

            if (text.includes('네이버')) {
                searchEngine = 'https://search.naver.com/search.naver?query=';
                engineName = '네이버';
            } else if (text.includes('유튜브')) {
                searchEngine = 'https://www.youtube.com/results?search_query=';
                engineName = '유튜브';
            }

            let keyword = text.replace(/구글에서|네이버에서|유튜브에서|구글|네이버|유튜브|검색해줘|검색|찾아줘/g, '').trim();
            if (!keyword) keyword = text.replace(/검색해줘|검색|찾아줘/g, '').trim();

            const searchUrl = searchEngine + encodeURIComponent(keyword);
            const msg = `${engineName}에서 '${keyword}' 검색 결과를 열어드립니다.`;
            setDexSpeech(msg);
            speak(msg);
            showToast("웹 검색", `${keyword} 검색 중...`, "fa-magnifying-glass");
            window.open(searchUrl, '_blank');
            addChatLog(`Dex: ${msg}`, false);
        }

        // Gemini AI Real Conversational Response for General Chat
        async function handleGeminiResponse(userPrompt) {
            const cleanPrompt = userPrompt.replace('덱스쳐', '').trim();
            setDexSpeech("생각 중이에요...");

            const systemPrompt = "당신은 윈도우 바탕화면에서 함께 대화하는 친근하고 센스 있는 AI 비서 덱스입니다. 고양이 말투나 냥을 절대 쓰지 말고, 자연스럽고 정중하면서도 친근한 인간형 말투로 짧고 명확하게 답변해 주세요.";
            const apiKey = "";
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            const payload = {
                contents: [{ parts: [{ text: cleanPrompt }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] }
            };

            let reply = "말씀하신 내용을 잘 확인했어요. 무엇을 도와드릴까요?";
            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                const candidate = result.candidates?.[0];
                if (candidate && candidate.content?.parts?.[0]?.text) {
                    reply = candidate.content.parts[0].text.trim();
                }
            } catch (err) {
                console.log("API connection fallback:", err);
            }

            setDexSpeech(reply);
            speak(reply);
            addChatLog(`Dex: ${reply}`, false);
        }

        function processCommand(input) {
            executeCommand(input);
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const inputEl = document.getElementById('chat-input');
            const val = inputEl.value.trim();
            if (!val) return;
            inputEl.value = '';
            addChatLog(val, true);
            executeCommand(val.startsWith('덱스쳐') ? val : '덱스쳐 ' + val);
        }

        // Sleep Dex
        function sleepDex() {
            isAwake = false;
            statusDot.className = "w-2.5 h-2.5 rounded-full bg-amber-500";
            dexModeBadge.innerText = "취침중";
            dexModeBadge.className = "text-[9px] bg-neutral-800 text-amber-400 px-2 py-0.5 rounded-full font-semibold";
            audioWaveBadge.classList.add('hidden');
            catWidgetContainer.style.opacity = "0.35";
            dexSvg.classList.remove('cat-widget-idle');

            const msg = "휴식 모드로 전환할게요. 다시 필요하시면 '덱스쳐 나와'라고 불러주세요.";
            setDexSpeech(msg);
            speak(msg);
            showToast("Dex 절전 모드", "백그라운드 슬립 상태로 전환됨", "fa-moon");
        }

        // Wake Dex
        function wakeDex() {
            isAwake = true;
            statusDot.className = "w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse";
            dexModeBadge.innerText = "대기중";
            dexModeBadge.className = "text-[9px] bg-neutral-800 text-emerald-400 px-2 py-0.5 rounded-full font-semibold";
            if (isListening) audioWaveBadge.classList.remove('hidden');
            catWidgetContainer.style.opacity = "1";
            dexSvg.classList.add('cat-widget-idle');

            const msg = "대기 모드로 돌아왔어요! 어떤 이야기를 나눌까요?";
            setDexSpeech(msg);
            speak(msg);
            showToast("Dex 기상", "Dex 위젯이 활성화되었습니다.", "fa-bolt");
        }

        // UI Helpers
        function addChatLog(text, isUser) {
            const div = document.createElement('div');
            div.className = `p-2.5 rounded-xl border ${isUser ? 'bg-neutral-900/80 border-white/10 ml-4' : 'bg-black/50 border-white/5 mr-4'}`;
            div.innerHTML = `
                <p class="font-bold text-[9px] text-neutral-400 mb-0.5">${isUser ? 'YOU' : 'DEX'}</p>
                <p class="text-neutral-200 text-[11px]">${escapeHtml(text)}</p>
            `;
            chatStream.appendChild(div);
            chatStream.scrollTop = chatStream.scrollHeight;
        }

        let toastTimer;
        function showToast(title, desc, iconClass) {
            document.getElementById('toast-title').innerText = title;
            document.getElementById('toast-desc').innerText = desc;
            document.getElementById('toast-icon').className = `fa-solid ${iconClass} text-emerald-400 text-sm`;

            toastNotification.classList.remove('-translate-y-20', 'opacity-0');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toastNotification.classList.add('-translate-y-20', 'opacity-0');
            }, 3500);
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        window.onload = () => {
            initSpeech();
        };
    </script>
</body>
</html>
