            generateQuiz(); // 단어가 바뀔 때마다 새로운 퀴즈를 만들어 줍니다
        } // updateCard 함수를 끝냅니다
        function flipCard() { // 카드를 마우스로 누르면 실행되는 함수입니다
            if (isFlipped) { // 만약 카드가 이미 뒤집혀 있는 상태라면
                cardContent.textContent = words[currentIndex].en; // 다시 영어 단어를 보여줍니다
                isFlipped = false; // 앞면 상태로 바꿔줍니다
            } else { // 만약 카드가 앞면(영어) 상태라면
                cardContent.innerHTML = words[currentIndex].ko + '<br><br><span style="font-size:18px; color:var(--sub-text); font-weight:normal;">' + words[currentIndex].ex + '</span>'; // 한국어 뜻과 예문을 보여줍니다
                isFlipped = true; // 뒷면 상태로 바꿔줍니다
            } // 조건문을 끝냅니다
        } // flipCard 함수를 끝냅니다
        function toggleCheck() { // 체크박스를 누를 때 실행되는 함수입니다
            words[currentIndex].memorized = memorizedCheck.checked; // 현재 단어의 외움 상태를 저장합니다
            updateCardStyle(); // 카드 색상을 외운 상태로 바꿔줍니다
        } // toggleCheck 함수를 끝냅니다
        function updateCardStyle() { // 체크 여부에 따라 카드와 상자 색을 바꿔주는 함수입니다
            if (words[currentIndex].memorized) { // 다 외운 단어라면
                wordCard.classList.add('checked-card'); // 카드를 민트빛으로 바꿔줍니다
                checkContainer.classList.add('checked-card'); // 체크 상자도 민트빛으로 바꿔줍니다
            } else { // 아직 안 외운 단어라면
                wordCard.classList.remove('checked-card'); // 원래 색으로 되돌립니다
                checkContainer.classList.remove('checked-card'); // 원래 색으로 되돌립니다
            } // 조건문을 끝냅니다
        } // updateCardStyle 함수를 끝냅니다
        function speakWord(event) { // 스피커 버튼을 누르면 발음을 읽어주는 함수입니다
            event.stopPropagation(); // 버튼을 누를 때 카드가 뒤집히는 것을 막아줍니다
            if (!window.speechSynthesis) { // 브라우저가 음성 기능을 지원하는지 확인합니다
                alert('이 브라우저는 소리를 지원하지 않아요'); // 지원하지 않으면 안내창을 띄웁니다
                return; // 함수를 여기서 끝냅니다
            } // 조건문을 끝냅니다
            const utterance = new SpeechSynthesisUtterance(words[currentIndex].en); // 현재 영어 단어를 읽을 준비를 합니다
            utterance.lang = 'en-US'; // 영어 발음으로 설정합니다
            utterance.rate = 0.8; // 말하는 속도를 조금 느리게 설정합니다
            window.speechSynthesis.speak(utterance); // 소리를 내어 읽습니다
        } // speakWord 함수를 끝냅니다
        function generateQuiz() { // 4개의 보기를 만들고 퀴즈를 세팅하는 함수입니다
            isAnswered = false; // 아직 문제를 풀지 않은 상태로 초기화합니다
            quizTitle.textContent = '❓ 이 단어의 뜻은? (맞음: ' + correctCount + ' | 틀림: ' + wrongCount + ')'; // 현재 점수를 함께 보여줍니다
            quizOptions.innerHTML = ''; // 이전 보기들을 깨끗하게 지웁니다
            let currentKo = words[currentIndex].ko; // 현재 단어의 정답 뜻을 가져옵니다
            let options = [currentKo]; // 보기 목록에 정답을 먼저 넣습니다
            while (options.length < 4) { // 보기가 4개가 될 때까지 반복합니다
                let randomWord = words[Math.floor(Math.random() * words.length)]; // 전체 단어 중 무작위로 하나를 뽑습니다
                if (!options.includes(randomWord.ko)) { // 뽑은 단어의 뜻이 아직 보기 목록에 없다면
                    options.push(randomWord.ko); // 보기 목록에 추가합니다
                } // 조건문을 끝냅니다
            } // 반복문을 끝냅니다
            options.sort(() => Math.random() - 0.5); // 4개의 보기가 무작위 순서로 섞이도록 합니다
            for (let i = 0; i < options.length; i++) { // 4개의 보기 버튼을 하나씩 화면에 만듭니다
                let btn = document.createElement('button'); // 새로운 버튼 요소를 만듭니다
                btn.className = 'quiz-btn'; // 보기 버튼 디자인 클래스를 적용합니다
                btn.textContent = options[i]; // 버튼에 뜻 글자를 적어줍니다
                btn.onclick = function() { checkAnswer(options[i], btn); }; // 버튼을 누르면 정답을 확인하는 함수가 실행되게 합니다
                quizOptions.appendChild(btn); // 퀴즈 상자 안에 버튼을 쏙 집어넣습니다
            } // 반복문을 끝냅니다
        } // generateQuiz 함수를 끝냅니다
        function checkAnswer(selectedKo, clickedBtn) { // 사용자가 고른 보기가 정답인지 확인하는 함수입니다
            if (isAnswered) return; // 이미 문제를 풀었다면 중복해서 누르지 못하게 막습니다
            isAnswered = true; // 문제를 푼 상태로 바꿔줍니다
            let currentKo = words[currentIndex].ko; // 진짜 정답 뜻을 가져옵니다
            let allBtns = quizOptions.getElementsByTagName('button'); // 모든 보기 버튼들을 가져옵니다
            if (selectedKo === currentKo) { // 고른 뜻이 정답과 같다면
                correctCount++; // 맞은 개수를 1 늘립니다
                clickedBtn.classList.add('correct'); // 누른 버튼을 초록색으로 바꿉니다
            } else { // 틀렸다면
                wrongCount++; // 틀린 개수를 1 늘립니다
                clickedBtn.classList.add('wrong'); // 누른 버튼을 흐리게 만듭니다
                for (let i = 0; i < allBtns.length; i++) { // 진짜 정답이 적힌 버튼을 찾아냅니다
                    if (allBtns[i].textContent === currentKo) {
                        allBtns[i].classList.add('correct'); // 진짜 정답 버튼도 초록색으로 살짝 보여줍니다
                    } // 조건문을 끝냅니다
                } // 반복문을 끝냅니다
            } // 조건문을 끝냅니다
            quizTitle.textContent = '❓ 이 단어의 뜻은? (맞음: ' + correctCount + ' | 틀림: ' + wrongCount + ')'; // 점수판 글자를 최신으로 갱신합니다
        } // checkAnswer 함수를 끝냅니다
        function nextCard() { // 다음 버튼을 누르면 실행되는 함수입니다
            if (currentIndex < words.length - 1) { // 마지막 단어가 아니라면
                currentIndex++; // 번호를 1 늘려서 다음 단어로 갑니다
                updateCard(); // 바뀐 단어를 화면에 반영합니다
            } // 조건문을 끝냅니다
        } // nextCard 함수를 끝냅니다
        function prevCard() { // 이전 버튼을 누르면 실행되는 함수입니다
            if (currentIndex > 0) { // 첫 번째 단어가 아니라면
                currentIndex--; // 번호를 1 줄여서 이전 단어로 갑니다
                updateCard(); // 바뀐 단어를 화면에 반영합니다
            } // 조건문을 끝냅니다
        } // prevCard 함수를 끝냅니다
        updateCard(); // 프로그램이 처음 켜질 때 첫 번째 단어를 화면에 띄워줍니다
    </script> <!-- 자바스크립트 코드를 끝냅니다 -->
</body> <!-- 웹페이지 몸통 영역을 끝냅니다 -->
</html> <!-- HTML 문서를 완전히 끝냅니다 -->
