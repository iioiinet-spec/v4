
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영어 단어장</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #e8e5ff, #ffe6f0, #fff4dc);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  color: #51465f;
}

.container {
  width: 100%;
  max-width: 520px;
  background: white;
  border-radius: 28px;
  padding: 30px;
  text-align: center;
  box-shadow: 0 12px 35px #8c79a633;
}

h1 { color: #8d70c7; margin-bottom: 8px; }

.subtitle { color: #aaa0b5; margin-bottom: 20px; }

.coin-box {
  display: inline-block;
  background: #fff0c9;
  color: #a57616;
  padding: 12px 22px;
  border-radius: 20px;
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 20px;
}

.progress-text { font-weight: bold; margin-bottom: 10px; }

.progress-bg {
  height: 10px;
  background: #eee8f7;
  border-radius: 20px;
  overflow: hidden;
  margin-bottom: 25px;
}

.progress {
  height: 100%;
  width: 5%;
  background: linear-gradient(90deg, #a98be8, #f2a8c7);
  transition: width 0.3s;
}

.card {
  height: 240px;
  perspective: 1000px;
  cursor: pointer;
  margin-bottom: 25px;
}

.card-inner {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.6s;
}

.card.flipped .card-inner { transform: rotateY(180deg); }

.card-front, .card-back {
  position: absolute;
  width: 100%;
  height: 100%;
  border-radius: 24px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  backface-visibility: hidden;
  padding: 20px;
}

.card-front { background: linear-gradient(135deg, #eee6ff, #ffe8f1); }

.card-back {
  background: linear-gradient(135deg, #fff0dc, #ffe3ed);
  transform: rotateY(180deg);
}

.word { font-size: 42px; font-weight: bold; color: #7959b6; }

.meaning { font-size: 30px; font-weight: bold; color: #d477a3; margin-bottom: 15px; }

.example { font-size: 16px; color: #74677c; }

.hint { margin-top: 12px; color: #a99bb5; font-size: 13px; }

button {
  border: none;
  border-radius: 15px;
  padding: 13px 18px;
  margin: 5px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
}

button:hover { transform: translateY(-2px); filter: brightness(1.04); }

.primary { background: #a78be0; color: white; }
.secondary { background: #f9dce9; color: #9d6283; }
.song { background: #ffe5b9; color: #9a7036; }

.controls {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 5px;
}

.status {
  color: #a99bb5;
  font-size: 13px;
  min-height: 20px;
  margin-top: 15px;
}

.coin-notice {
  color: #c58c25;
  font-weight: bold;
  min-height: 22px;
  margin-bottom: 8px;
}
</style>
</head>

<body>
<div class="container">

  <h1>✨ 영어 단어장 ✨</h1>
  <div class="subtitle">즐겁게 배우는 나만의 영어 공부</div>

  <div class="coin-box">🪙 보유 코인: <span id="coins">0</span></div>

  <div class="progress-text" id="progressText">1 / 20</div>
  <div class="progress-bg">
    <div class="progress" id="progress"></div>
  </div>

  <div class="coin-notice" id="coinNotice"></div>

  <div class="card" id="card" onclick="flipCard()">
    <div class="card-inner">
      <div class="card-front">
        <div class="word" id="english">apple</div>
        <div class="hint">카드를 클릭해서 뜻을 확인하세요</div>
      </div>
      <div class="card-back">
        <div class="meaning" id="korean">사과</div>
        <div class="example" id="example">I eat an apple.</div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="secondary" onclick="speakWord()">🔊 발음 듣기</button>
    <button class="song" onclick="playSong()">🎵 노래로 외우기</button>
    <button class="secondary" onclick="stopSong()">⏹ 정지</button>
  </div>

  <div class="controls" style="margin-top:15px;">
    <button class="secondary" onclick="prevWord()">◀ 이전</button>
    <button class="primary" onclick="flipCard()">카드 뒤집기</button>
    <button class="primary" onclick="nextWord()">다음 ▶</button>
  </div>

  <div class="status" id="status">단어를 공부하고 코인을 모아 보세요!</div>
</div>

<script>
// =====================================
// 단어 목록: 여기만 고치세요!
// =====================================
const words = [
  {en:"apple", ko:"사과", ex:"I eat an apple."},
  {en:"banana", ko:"바나나", ex:"I like bananas."},
  {en:"school", ko:"학교", ex:"I go to school."},
  {en:"friend", ko:"친구", ex:"You are my friend."},
  {en:"happy", ko:"행복한", ex:"I am happy."},
  {en:"beautiful", ko:"아름다운", ex:"It is beautiful."},
  {en:"water", ko:"물", ex:"I drink water."},
  {en:"family", ko:"가족", ex:"I love my family."},
  {en:"book", ko:"책", ex:"I read a book."},
  {en:"computer", ko:"컴퓨터", ex:"I use a computer."},
  {en:"animal", ko:"동물", ex:"I like animals."},
  {en:"music", ko:"음악", ex:"I listen to music."},
  {en:"beautifully", ko:"아름답게", ex:"She sings beautifully."},
  {en:"teacher", ko:"선생님", ex:"My teacher is kind."},
  {en:"summer", ko:"여름", ex:"Summer is hot."},
  {en:"winter", ko:"겨울", ex:"Winter is cold."},
  {en:"flower", ko:"꽃", ex:"This flower is pretty."},
  {en:"chocolate", ko:"초콜릿", ex:"I love chocolate."},
  {en:"animal", ko:"동물", ex:"The animal is cute."},
  {en:"dream", ko:"꿈", ex:"Follow your dream."}
];

// 게임 데이터
let current = 0;
let coins = Number(localStorage.getItem("wordCoins")) || 0;

// 코인을 받은 단어 기록
let earnedWords = JSON.parse(localStorage.getItem("earnedWords") || "[]");

let songStopped = false;
let songPlaying = false;

// 코인 화면 업데이트
function updateCoins() {
  document.getElementById("coins").textContent = coins;
  localStorage.setItem("wordCoins", coins);
  localStorage.setItem("earnedWords", JSON.stringify(earnedWords));
}

// 단어 공부 보상
function earnCoin() {
  // 이미 보상을 받은 단어인지 확인
  if (earnedWords.includes(current)) {
    document.getElementById("coinNotice").textContent =
      "이미 보상을 받은 단어예요!";
    return;
  }

  // 코인 10개 지급
  coins += 10;

  // 보상 기록 저장
  earnedWords.push(current);

  updateCoins();

  document.getElementById("coinNotice").textContent =
    "🎉 단어 공부 완료! +10 코인!";
}

// 음성 읽기
function speak(text, lang) {
  if (!("speechSynthesis" in window)) return;

  speechSynthesis.cancel();

  const msg = new SpeechSynthesisUtterance(text);
  msg.lang = lang;
  msg.rate = 0.85;
  msg.pitch = 1.15;

  speechSynthesis.speak(msg);
}

// 영어 발음 듣기
function speakWord() {
  speak(words[current].en, "en-US");
  document.getElementById("status").textContent = "영어 발음을 듣고 있어요!";
}

// 카드 뒤집기
function flipCard() {
  const card = document.getElementById("card");
  const wasFlipped = card.classList.contains("flipped");

  card.classList.toggle("flipped");

  // 처음으로 뜻을 확인했을 때 코인 지급
  if (!wasFlipped) {
    earnCoin();
  }
}

// 화면 업데이트
function showWord() {
  const word = words[current];

  document.getElementById("english").textContent = word.en;
  document.getElementById("korean").textContent = word.ko;
  document.getElementById("example").textContent = word.ex;

  document.getElementById("progressText").textContent =
    `${current + 1} / ${words.length}`;

  document.getElementById("progress").style.width =
    `${((current + 1) / words.length) * 100}%`;

  document.getElementById("card").classList.remove("flipped");

  document.getElementById("coinNotice").textContent =
    earnedWords.includes(current) ? "이미 공부한 단어예요!" : "";

  document.getElementById("status").textContent = "새로운 단어를 공부해 보세요!";
}

// 이전 단어
function prevWord() {
  if (current > 0) {
    current--;
    showWord();
  }
}

// 다음 단어
function nextWord() {
  current = (current + 1) % words.length;
  showWord();
}

// 멜로디 재생
async function melody() {
  const audio = new (window.AudioContext || window.webkitAudioContext)();
  const notes = [523, 659, 784, 659, 523, 587, 659];

  for (const frequency of notes) {
    if (songStopped) break;

    const oscillator = audio.createOscillator();
    const gain = audio.createGain();

    oscillator.frequency.value = frequency;
    oscillator.type = "sine";
    gain.gain.value = 0.12;

    oscillator.connect(gain);
    gain.connect(audio.destination);

    oscillator.start();
    oscillator.stop(audio.currentTime + 0.18);

    await new Promise(resolve => setTimeout(resolve, 200));
  }

  await audio.close();
}

// 노래풍 단어 학습
async function playSong() {
  if (songPlaying) return;

  songPlaying = true;
  songStopped = false;

  const word = words[current];

  // 노래 학습도 단어 보상 대상
  earnCoin();

  document.getElementById("status").textContent = "🎵 단어 공부 시작!";

  try {
    await melody();

    if (!songStopped) {
      speak(word.en, "en-US");
      await waitForSpeech();
    }

    if (!songStopped) await melody();

    if (!songStopped) {
      speak(word.ko, "ko-KR");
      await waitForSpeech();
    }

    if (!songStopped) await melody();

    if (!songStopped) {
      speak(word.ex, "en-US");
      await waitForSpeech();
    }
  } catch (error) {
    document.getElementById("status").textContent = "음성 재생에 문제가 생겼어요.";
  }

  songPlaying = false;

  if (!songStopped) {
    document.getElementById("status").textContent = "🎉 단어 공부 완료!";
  }
}

// 음성 재생 대기
function waitForSpeech() {
  return new Promise(resolve => {
    if (!speechSynthesis.speaking) {
      resolve();
      return;
    }

    const check = setInterval(() => {
      if (!speechSynthesis.speaking || songStopped) {
        clearInterval(check);
        resolve();
      }
    }, 100);
  });
}

// 노래 정지
function stopSong() {
  songStopped = true;
  songPlaying = false;
  speechSynthesis.cancel();

  document.getElementById("status").textContent = "노래를 정지했어요.";
}

// 처음 화면 표시
showWord();
updateCoins();
</script>
</body>
</html>
