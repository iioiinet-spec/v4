<title>단어몽 키우기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one-screen app — fixed HUD on top, swapping scene/quiz panel in the middle, tab bar at the bottom. */
:root{
  --bg:#141a2e;      /* deep blueberry night */
  --panel:#1e2743;
  --panel-2:#2a3557;
  --ink:#eef2ff;
  --ink-dim:#95a2c7;
  --mint:#4ee0a6;    /* primary accent / correct */
  --amber:#ffc14d;   /* coins */
  --coral:#ff6b7a;   /* wrong */
  --violet:#a78bfa;  /* exp */
  --line:rgba(255,255,255,.11);
  --display:'Jua',system-ui,sans-serif;
  --word:'Fredoka','Jua',system-ui,sans-serif;
  --body:'Noto Sans KR',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:
    radial-gradient(900px 500px at 15% -10%, #27325a 0%, transparent 60%),
    radial-gradient(700px 500px at 100% 0%, #2b2350 0%, transparent 55%),
    var(--bg);
  color:var(--ink);
  font-family:var(--body);
  font-size:15px;
  line-height:1.6;
  -webkit-text-size-adjust:100%;
}
*{box-sizing:border-box}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:3px solid var(--mint);outline-offset:2px;border-radius:8px}

.app{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:14px 96px;display:flex;flex-direction:column;gap:14px}

/* ---------- HUD ---------- */
.hud{
  display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;
  background:linear-gradient(180deg,#222c4d,#1b2440);
  border:1px solid var(--line);border-radius:18px;padding:12px 14px;
}
.avatar-chip{
  width:46px;height:46px;border-radius:14px;flex:none;
  background:radial-gradient(circle at 50% 35%,#3a4878,#232e52);
  display:grid;place-items:center;border:1px solid var(--line)
}
.avatar-chip svg{width:34px;height:34px}
.hud-main{min-width:0}
.hud-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.lv{font-family:var(--display);font-size:18px;color:var(--mint)}
.pet-name{font-family:var(--display);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.form-tag{font-size:11px;color:var(--ink-dim);letter-spacing:.06em}
.bar{height:10px;border-radius:99px;background:#121a33;border:1px solid var(--line);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--mint));border-radius:99px;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.exp-txt{font-size:11px;color:var(--ink-dim);margin-top:3px;font-variant-numeric:tabular-nums}
.coins{
  font-family:var(--word);font-weight:600;font-size:16px;color:var(--amber);
  display:flex;align-items:center;gap:6px;background:#121a33;border:1px solid var(--line);
  border-radius:99px;padding:6px 12px;font-variant-numeric:tabular-nums;white-space:nowrap
}
.coins::before{content:"";width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a8,var(--amber));box-shadow:0 0 0 1px #8a6417 inset}

/* ---------- panels ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px}
h2.sec{font-family:var(--display);font-size:20px;margin:0 0 4px;text-wrap:balance}
p.sub{margin:0 0 14px;color:var(--ink-dim);font-size:13px}

/* ---------- home / scene ---------- */
.scene{
  position:relative;border-radius:18px;overflow:hidden;
  background:linear-gradient(180deg,#2d3a6b 0%,#1d2648 100%);
  aspect-ratio:16/10;max-width:100%;border:1px solid var(--line)
}
.scene svg{position:absolute;inset:0;width:100%;height:100%}
.stage-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;margin-top:12px}
.stage-card{
  text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:16px;padding:12px;
  display:flex;flex-direction:column;gap:8px;transition:transform .15s,border-color .15s;min-width:0
}
.stage-card:hover{transform:translateY(-2px);border-color:var(--mint)}
.stage-card[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.stage-card .no{font-family:var(--word);font-weight:600;font-size:12px;color:var(--ink-dim);letter-spacing:.08em}
.stage-card .ttl{font-family:var(--display);font-size:16px}
.mini{height:7px;border-radius:99px;background:#121a33;overflow:hidden}
.mini>i{display:block;height:100%;background:var(--mint);border-radius:99px;transition:width .4s}
.mini-txt{font-size:11px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
.badge-clear{font-size:11px;color:var(--amber);font-family:var(--display)}

/* ---------- quiz ---------- */
.quiz-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.chip{font-size:12px;background:var(--panel-2);border:1px solid var(--line);border-radius:99px;padding:4px 11px;color:var(--ink-dim)}
.chip.mode{color:var(--violet);border-color:rgba(167,139,250,.4)}
.combo{font-family:var(--word);font-weight:600;color:var(--amber);font-size:13px}
.prompt{
  text-align:center;padding:22px 14px;border-radius:18px;margin-bottom:14px;
  background:linear-gradient(180deg,#26325a,#1c2647);border:1px solid var(--line)
}
.prompt .big{font-family:var(--word);font-weight:600;font-size:clamp(30px,8vw,46px);letter-spacing:.01em;line-height:1.2;word-break:break-word}
.prompt .big.ko{font-family:var(--display);font-size:clamp(26px,7vw,38px)}
.prompt .hint{color:var(--ink-dim);font-size:13px;margin-top:6px}
.speak-btn{margin-top:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:99px;padding:8px 16px;font-size:13px;display:inline-flex;gap:7px;align-items:center}
.speak-btn:hover{border-color:var(--mint)}

.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:430px){.choices{grid-template-columns:1fr}}
.choice{
  background:var(--panel-2);border:2px solid transparent;border-radius:14px;padding:14px 12px;text-align:center;
  font-size:16px;font-family:var(--display);transition:transform .12s,background .15s,border-color .15s;min-width:0;word-break:keep-all
}
.choice:hover:not(:disabled){transform:translateY(-2px);border-color:var(--violet)}
.choice:disabled{cursor:default}
.choice.right{background:rgba(78,224,166,.18);border-color:var(--mint);color:var(--mint)}
.choice.wrong{background:rgba(255,107,122,.16);border-color:var(--coral);color:var(--coral)}
.choice .idx{font-family:var(--word);font-size:11px;color:var(--ink-dim);display:block}

/* spelling */
.slots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:14px;min-height:50px}
.slot{
  width:38px;height:48px;border-radius:10px;background:#121a33;border:1px dashed var(--line);
  display:grid;place-items:center;font-family:var(--word);font-weight:600;font-size:22px
}
.slot.filled{background:var(--panel-2);border-style:solid;border-color:var(--violet)}
.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tile{
  width:44px;height:50px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);
  font-family:var(--word);font-weight:600;font-size:22px;transition:transform .12s
}
.tile:hover:not(:disabled){transform:translateY(-3px);border-color:var(--mint)}
.tile:disabled{opacity:.25;cursor:default}
.row-btns{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:11px 20px;font-family:var(--display);font-size:15px}
.btn:hover{border-color:var(--mint)}
.btn.primary{background:linear-gradient(180deg,#4ee0a6,#2fb985);color:#0d2a20;border-color:transparent}
.btn.ghost{color:var(--ink-dim)}

.feedback{text-align:center;font-family:var(--display);font-size:17px;min-height:30px;margin-top:12px}
.feedback.ok{color:var(--mint)}
.feedback.no{color:var(--coral)}
.gain{font-family:var(--word);font-weight:600;font-size:13px;color:var(--amber);display:block;margin-top:2px}

/* ---------- puzzle ---------- */
.puzzle-wrap{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:5/4;border:1px solid var(--line);margin-top:12px}
.puzzle-wrap svg{position:absolute;inset:0;width:100%;height:100%}
.tiles-cover{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(4,1fr)}
.cover{background:#1b2440;border:1px solid rgba(255,255,255,.07);transition:opacity .5s,transform .5s}
.cover.gone{opacity:0;transform:scale(.6) rotate(8deg);pointer-events:none}

/* ---------- shop ---------- */
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.item{background:var(--panel-2);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.item svg{width:52px;height:52px}
.item .nm{font-family:var(--display);font-size:14px}
.item .pr{font-family:var(--word);font-weight:600;font-size:13px;color:var(--amber);font-variant-numeric:tabular-nums}
.item .act{width:100%;border-radius:10px;padding:7px;background:#121a33;border:1px solid var(--line);font-size:13px}
.item .act:hover:not(:disabled){border-color:var(--mint)}
.item .act:disabled{opacity:.5;cursor:default}
.item.owned{border-color:var(--mint)}

/* ---------- wrong note ---------- */
.note-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.note-row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:0}
.note-row .en{font-family:var(--word);font-weight:600;font-size:17px}
.note-row .ko{color:var(--ink-dim);font-size:13px;text-align:right;min-width:0}
.empty{color:var(--ink-dim);text-align:center;padding:26px 10px;font-size:14px}

/* ---------- tab bar ---------- */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:rgba(20,26,46,.93);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:8px 10px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));
  display:flex;gap:6px;justify-content:center
}
.tab{flex:1;max-width:150px;border-radius:14px;padding:8px 4px;text-align:center;font-family:var(--display);font-size:13px;color:var(--ink-dim);line-height:1.3}
.tab span{display:block;font-size:17px;line-height:1}
.tab[aria-current="true"]{background:var(--panel-2);color:var(--mint)}

footer{text-align:center;color:var(--ink-dim);font-size:12px;padding-top:6px;line-height:1.8}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));
  background:var(--panel-2);border:1px solid var(--mint);color:var(--mint);border-radius:99px;
  padding:10px 20px;font-family:var(--display);font-size:14px;z-index:30;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;max-width:90vw;text-align:center
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.bobbing{animation:bob 2.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes pop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.popping{animation:pop .35s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <div class="hud">
    <div class="avatar-chip" id="hudAvatar"></div>
    <div class="hud-main">
      <div class="hud-top">
        <span class="lv" id="hudLv">Lv.1</span>
        <span class="pet-name">단어몽</span>
        <span class="form-tag" id="hudForm">씨앗몽</span>
      </div>
      <div class="bar"><i id="hudBar" style="width:0%"></i></div>
      <div class="exp-txt" id="hudExp">EXP 0 / 100</div>
    </div>
    <div class="coins" id="hudCoins">0</div>
  </div>

  <main id="view"></main>

  <footer>
    세영코딩연구소 &nbsp;저자 : 컴퓨터공학박사 KIM<br>
    교육과정 기본 영단어 200개 · 10 스테이지
  </footer>
</div>

<nav class="tabs" id="tabs">
  <button class="tab" data-tab="home"><span>🏠</span>모험</button>
  <button class="tab" data-tab="puzzle"><span>🧩</span>퍼즐</button>
  <button class="tab" data-tab="note"><span>📕</span>오답노트</button>
  <button class="tab" data-tab="shop"><span>🎁</span>상점</button>
</nav>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   단어몽 키우기 — 교육과정 기본 영단어 200
   세영코딩연구소  저자 : 컴퓨터공학박사 KIM

  { title:"가족과 사람", hue:330, words:[

  { title:"움직임 동사", hue:185, words:[

    ["run","달리다"],["walk","걷다"],["jump","뛰어오르다"],["sing","노래하다"],["dance","춤추다"],

    ["excited","신이 난"],["bored","지루한"],["proud","자랑스러운"],["kind","친절한"],["brave","용감한"],

    ["heavy","무거운"],["light","가벼운, 빛"],["fast","빠른"],["slow","느린"],["hot","뜨거운"],

const SHOP = [
  {id:"hat",   name:"탐험가 모자", price:120},
  {id:"scarf", name:"무지개 목도리", price:150},

const EXP_PER_LV = 100, EXP_GAIN = 12, COIN_GAIN = 5;
const KEY = "danmong_save_v1";

let S = {
  exp:0, coins:0,
  pieces:STAGES.map(()=>[]),   // 스테이지별 공개된 퍼즐 조각 index
  cleared:[],                  // 클리어한 스테이지 번호
  note:{},                     // 오답 단어 -> 남은 복습 횟수
  owned:[]
};

/* ---------- 저장 / 불러오기 ---------- */
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const d = JSON.parse(raw); if(d && typeof d.exp === "number") S = Object.assign(S, d); }
  }catch(e){}
  if(!Array.isArray(S.pieces) || S.pieces.length !== STAGES.length) S.pieces = STAGES.map(()=>[]);
}

/* ---------- 레벨 계산 ---------- */
const level = () => Math.floor(S.exp / EXP_PER_LV) + 1;
const formIndex = () => { let f=0; FORMS.forEach((x,i)=>{ if(level() >= x.lv) f=i; }); return f; };

/* ---------- 캐릭터 SVG : 하늘색 강아지 "단어몽" ---------- */
const PET = {
  blue:"#a5d5f3", blueD:"#78b7e4", blueL:"#c9e8fb", inner:"#8fc5e9",
  cream:"#f8fcff", ink:"#2c3a55", blush:"#ffa6c0",
  leaf:"#6ccf9b", leafD:"#43b47c", petal:"#ffc2da", pollen:"#ffd86b"
};

function flowerSVG(x, y, color){
  let s = "";
  for(let i = 0; i < 5; i++){
    const a = i * 72 * Math.PI / 180;
    s += `<circle cx="${(x + Math.cos(a)*3.5).toFixed(1)}" cy="${(y + Math.sin(a)*3.5).toFixed(1)}" r="2.9" fill="${color}"/>`;
  }
  return s + `<circle cx="${x}" cy="${y}" r="2.1" fill="${PET.pollen}"/>`;
}

function petSVG(form, opts){
  const o = opts || {}, P = PET;
  let g = "";

  /* 빛무리 (최종 진화) */
  if(form >= 4) g += `<circle cx="50" cy="50" r="46" fill="#ffe9a8" opacity=".12"/>`;

  /* 바닥 그림자 */
  g += `<ellipse cx="50" cy="93" rx="27" ry="5" fill="#13306b" opacity=".18"/>`;

  /* 날개 (4단계 이상) */
  if(form >= 3) g += `
    <path d="M34 52 C 23 34 8 28 3 35 C -2 43 6 55 15 61 C 22 66 31 61 34 56 Z" fill="#f4faff" stroke="#b6d9f4" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M66 52 C 77 34 92 28 97 35 C 102 43 94 55 85 61 C 78 66 69 61 66 56 Z" fill="#f4faff" stroke="#b6d9f4" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M9 38 q 9 7 15 15 M16 34 q 7 8 11 15 M91 38 q -9 7 -15 15 M84 34 q -7 8 -11 15"
          stroke="#cfe6f8" stroke-width="1.2" fill="none" stroke-linecap="round"/>`;

  /* 꼬리 */
  g += `<circle cx="79" cy="73" r="8" fill="${P.blueD}"/><circle cx="86" cy="67" r="6" fill="${P.blue}"/>`;

  /* 늘어진 귀 */
  g += `<ellipse cx="23" cy="56" rx="9.5" ry="18.5" transform="rotate(-10 23 56)" fill="${P.blueD}"/>
        <ellipse cx="77" cy="56" rx="9.5" ry="18.5" transform="rotate(10 77 56)" fill="${P.blueD}"/>
        <ellipse cx="24" cy="59" rx="4.8" ry="11" transform="rotate(-10 24 59)" fill="${P.inner}"/>
        <ellipse cx="76" cy="59" rx="4.8" ry="11" transform="rotate(10 76 59)" fill="${P.inner}"/>`;

  /* 몸통 · 배 · 발 */
  g += `<ellipse cx="50" cy="70" rx="25" ry="21" fill="${P.blue}"/>
        <ellipse cx="50" cy="75" rx="15" ry="12" fill="${P.cream}" opacity=".75"/>
        <ellipse cx="38" cy="88" rx="8" ry="5.5" fill="${P.blueL}"/>
        <ellipse cx="62" cy="88" rx="8" ry="5.5" fill="${P.blueL}"/>`;

  /* 복슬복슬 가슴털 (3단계 이상) */
  if(form >= 2) g += `<g fill="${P.cream}" opacity=".95">
      <circle cx="28" cy="66" r="7"/><circle cx="38" cy="73" r="8"/>
      <circle cx="50" cy="76" r="8.5"/><circle cx="62" cy="73" r="8"/><circle cx="72" cy="66" r="7"/></g>`;

  /* 머리 */
  g += `<circle cx="50" cy="44" r="27" fill="${P.blue}"/>`;

  /* 주둥이 · 눈 · 코 · 입 · 볼 */
  g += `<ellipse cx="50" cy="59" rx="11.5" ry="8" fill="${P.cream}" opacity=".95"/>`;
  g += `<ellipse cx="38" cy="47" rx="6.4" ry="7.6" fill="${P.ink}"/><ellipse cx="62" cy="47" rx="6.4" ry="7.6" fill="${P.ink}"/>
        <circle cx="36" cy="44" r="2.5" fill="#fff"/><circle cx="60" cy="44" r="2.5" fill="#fff"/>
        <circle cx="40" cy="50" r="1.2" fill="#fff" opacity=".8"/><circle cx="64" cy="50" r="1.2" fill="#fff" opacity=".8"/>`;
  g += `<ellipse cx="50" cy="55" rx="3.2" ry="2.4" fill="${P.ink}"/>
        <path d="M43.5 58.5 q 6.5 6 13 0" stroke="${P.ink}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
  g += `<ellipse cx="29" cy="57" rx="5.5" ry="3.9" fill="${P.blush}" opacity=".6"/>
        <ellipse cx="71" cy="57" rx="5.5" ry="3.9" fill="${P.blush}" opacity=".6"/>`;

  /* 이마의 'word' 뱃지 */
  g += `<path d="M47 36 l 3 4 l 3 -4 z" fill="#ffffff"/>
        <rect x="38.5" y="24" width="23" height="13" rx="6.5" fill="#ffffff" stroke="#9fc6e4" stroke-width="1.1"/>
        <text x="50" y="33" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="8" fill="#5f87ad">word</text>`;

  /* 머리 장식 — 단계별 진화 */
  if(form === 1){
    g += `<path d="M50 20 v -7" stroke="${P.leafD}" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M50 15 C 55 6 63 4 68 5 C 65 14 57 18 50 15 Z" fill="${P.leaf}"/>
          <path d="M50 17 C 46 10 39 8 35 10 C 38 17 44 20 50 17 Z" fill="${P.leafD}"/>`;
  }
  if(form === 2 || form === 3){
    g += `<path d="M33 25 C 28 16 32 10 37 9 C 39 16 38 22 33 25 Z" fill="${P.leafD}"/>
          <path d="M67 25 C 72 16 68 10 63 9 C 61 16 62 22 67 25 Z" fill="${P.leaf}"/>
          <path d="M50 16 v -6" stroke="${P.leafD}" stroke-width="2.2" stroke-linecap="round"/>`;
    g += flowerSVG(32, 26, P.petal) + flowerSVG(50, 13, "#ffffff") + flowerSVG(68, 26, P.petal);
  }
  if(form >= 4){
    g += `<g fill="${P.leaf}"><circle cx="50" cy="13" r="12"/><circle cx="35" cy="20" r="9.5"/>
            <circle cx="65" cy="20" r="9.5"/><circle cx="42" cy="6" r="7.5"/><circle cx="59" cy="6" r="7.5"/></g>
          <g fill="${P.leafD}" opacity=".55"><circle cx="38" cy="15" r="5"/><circle cx="62" cy="14" r="4.5"/></g>
          <rect x="40" y="10" width="13" height="5" rx="2.5" fill="#ffd86b"/>
          <rect x="55" y="17" width="11" height="4.5" rx="2.2" fill="#ff9bb6"/>
          <rect x="31" y="22" width="10" height="4.5" rx="2.2" fill="#8fd7ff"/>
          <circle cx="14" cy="34" r="2.2" fill="#ffe9a8"/><circle cx="88" cy="36" r="1.9" fill="#ffe9a8"/>
          <circle cx="80" cy="18" r="1.5" fill="#ffe9a8"/><circle cx="20" cy="18" r="1.5" fill="#ffe9a8"/>`;
  }

  /* 상점 아이템 */
  if(o.hat)   g += `<path d="M34 20 q 16 -17 32 0 z" fill="#5b6ee0"/><rect x="27" y="18" width="46" height="6" rx="3" fill="#4455c4"/>`;
  if(o.scarf) g += `<path d="M31 65 q 19 11 38 0 l 2 8 q -21 12 -42 0 z" fill="#ff7a9c"/>
                    <rect x="62" y="70" width="8" height="17" rx="3.5" fill="#ffb84d" transform="rotate(12 66 78)"/>`;

  return `<svg viewBox="0 0 100 100" role="img" aria-label="단어몽 ${FORMS[form].name}">${g}</svg>`;
}

/* ---------- 방 꾸미기 장면 ---------- */
function roomSVG(){
  const f = formIndex(), own = S.owned;
  let extra = "";
  if(own.includes("rug"))   extra += `<ellipse cx="200" cy="200" rx="95" ry="26" fill="#8b5cf6" opacity=".45"/>`;
  if(own.includes("plant")) extra += `<rect x="36" y="178" width="30" height="26" rx="5" fill="#c97b4a"/><path d="M51 178 q -22 -16 -16 -40 q 18 6 16 40 z" fill="#45c986"/><path d="M51 178 q 22 -14 18 -36 q -18 6 -18 36 z" fill="#2ea86c"/>`;
  if(own.includes("lamp"))  extra += `<rect x="332" y="150" width="6" height="56" fill="#6b7aa8"/><path d="M315 150 l 20 -28 l 20 28 z" fill="#ffd166"/><circle cx="335" cy="150" r="34" fill="#ffd166" opacity=".16"/>`;
  if(own.includes("ball"))  extra += `<circle cx="300" cy="60" r="16" fill="#ff6b7a"/><circle cx="330" cy="46" r="12" fill="#4ee0a6"/><circle cx="276" cy="44" r="10" fill="#ffc14d"/>
                                      <path d="M300 76 q 4 30 -6 50 M330 58 q 2 26 -8 44 M276 54 q 6 24 0 40" stroke="#ffffff" stroke-width="1.2" fill="none" opacity=".45"/>`;

    <rect width="400" height="250" fill="url(#rg)"/>

/* ---------- 퍼즐 일러스트 (스테이지별) ---------- */

  const h = STAGES[si].hue;
  return `<svg viewBox="0 0 250 200" role="img" aria-label="${STAGES[si].title} 숨은 그림">
    <defs><linearGradient id="pg${si}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="hsl(${h} 62% 58%)"/><stop offset="1" stop-color="hsl(${(h+40)%360} 55% 34%)"/></linearGradient></defs>

    <path d="M0 150 q 62 -52 125 -8 q 62 44 125 -14 L250 200 L0 200 Z" fill="hsl(${h} 45% 24%)"/>

    <text x="125" y="112" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="26" fill="#fff" opacity=".95">STAGE ${si+1}</text>
    <text x="125" y="136" text-anchor="middle" font-family="Jua, sans-serif" font-size="17" fill="#fff" opacity=".85">${STAGES[si].title}</text>
  </svg>`;
}

/* ---------- 유틸 ---------- */
const $ = s => document.querySelector(s);
const shuffle = a => { const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; };
let toastT;
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove("show"), 1900);
}
function speak(word){
  try{
    if(!("speechSynthesis" in window)) return false;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(word);
    u.lang = "en-US"; u.rate = .85;
    speechSynthesis.speak(u);
    return true;
  }catch(e){ return false; }
}
const canSpeak = () => typeof window !== "undefined" && "speechSynthesis" in window;

/* ---------- HUD ---------- */
function renderHUD(){
  const lv = level(), f = formIndex();
  const inLv = S.exp % EXP_PER_LV;
  $("#hudLv").textContent = "Lv." + lv;
  $("#hudForm").textContent = FORMS[f].name;
  $("#hudBar").style.width = (inLv / EXP_PER_LV * 100) + "%";
  $("#hudExp").textContent = `EXP ${inLv} / ${EXP_PER_LV}`;
  $("#hudCoins").textContent = S.coins;
  $("#hudAvatar").innerHTML = petSVG(f, {});
}

/* ---------- 화면 전환 ---------- */
let tab = "home";
function setTab(t){
  tab = t;
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-current", String(b.dataset.tab === t)));
  render();
}
document.querySelectorAll(".tab").forEach(b=> b.addEventListener("click", ()=>setTab(b.dataset.tab)));

function render(){
  renderHUD();
  if(quiz.on){ renderQuiz(); return; }
  if(tab === "home")   return renderHome();
  if(tab === "puzzle") return renderPuzzle();
  if(tab === "note")   return renderNote();
  if(tab === "shop")   return renderShop();
}

/* ---------- 홈 ---------- */
function renderHome(){
  const unlocked = si => si === 0 || S.cleared.includes(si-1);
  const cards = STAGES.map((s,si)=>{
    const done = S.pieces[si].length, total = s.words.length, ok = unlocked(si);
    return `<button class="stage-card" ${ok?"":"disabled"} data-stage="${si}">
      <span class="no">STAGE ${String(si+1).padStart(2,"0")}</span>
      <span class="ttl">${s.title}</span>
      <span class="mini"><i style="width:${done/total*100}%"></i></span>
      <span class="mini-txt">${done} / ${total} 단어${S.cleared.includes(si)?' <span class="badge-clear">클리어</span>':""}</span>
      ${ok?"":'<span class="mini-txt">이전 스테이지를 끝내면 열려요</span>'}
    </button>`;
  }).join("");

  $("#view").innerHTML = `
    <section class="panel">
      <h2 class="sec">단어몽의 방</h2>
      <p class="sub">단어를 맞히면 단어몽이 자라고, 코인으로 방을 꾸밀 수 있어요.</p>
      <div class="scene">${roomSVG()}</div>
    </section>
    <section class="panel" style="margin-top:14px">
      <h2 class="sec">모험 스테이지</h2>
      <p class="sub">한 스테이지는 단어 20개. 모두 맞히면 숨은 그림이 완성됩니다.</p>
      <div class="stage-grid">${cards}</div>
    </section>`;
  document.querySelectorAll(".stage-card:not([disabled])").forEach(b=>
    b.addEventListener("click", ()=> startStage(+b.dataset.stage)));
}

/* ---------- 퀴즈 엔진 ---------- */
const quiz = { on:false, stage:null, queue:[], cur:null, mode:0, combo:0, picked:null, built:[], pool:[], qIndex:0, isNote:false, right:0, wrong:0 };

function startStage(si){
  quiz.on = true; quiz.isNote = false; quiz.stage = si;
  quiz.queue = shuffle(STAGES[si].words.map(w=>({en:w[0],ko:w[1],stage:si})));
  quiz.combo = 0; quiz.qIndex = 0; quiz.right = 0; quiz.wrong = 0;
  nextQ();
}
function startNote(){
  const list = Object.keys(S.note).map(en => ALL.find(w=>w.en===en)).filter(Boolean);
  if(!list.length){ toast("오답노트가 비었어요!"); return; }
  quiz.on = true; quiz.isNote = true; quiz.stage = null;
  quiz.queue = shuffle(list);
  quiz.combo = 0; quiz.qIndex = 0; quiz.right = 0; quiz.wrong = 0;
  nextQ();
}
function endQuiz(){ quiz.on = false; quiz.cur = null; save(); render(); }

function nextQ(){
  if(!quiz.queue.length){ finishRound(); return; }
  quiz.cur = quiz.queue.shift();
  quiz.picked = null; quiz.built = [];
  const modes = canSpeak() ? 3 : 2;
  quiz.mode = quiz.qIndex % modes;          // 0 뜻 맞추기 · 1 스펠링 · 2 듣기
  quiz.qIndex++;
  if(quiz.mode !== 1){
    const wrongs = shuffle(ALL.filter(w=>w.ko !== quiz.cur.ko)).slice(0,3);
    quiz.pool = shuffle([quiz.cur, ...wrongs]);
  }else{
    quiz.pool = shuffle(quiz.cur.en.split("").map((ch,i)=>({ch,i})));
  }
  render();
  if(quiz.mode === 2) setTimeout(()=>speak(quiz.cur.en), 320);
}

function grade(correct){
  if(correct){
    quiz.combo++; quiz.right++;
    const bonus = Math.min(quiz.combo - 1, 5) * 2;
    S.exp += EXP_GAIN + bonus;
    S.coins += COIN_GAIN + bonus;
    if(quiz.isNote){
      const n = (S.note[quiz.cur.en] || 2) - 1;
      if(n <= 0) delete S.note[quiz.cur.en]; else S.note[quiz.cur.en] = n;
    }else{
      const si = quiz.stage, arr = S.pieces[si];
      if(arr.length < STAGES[si].words.length) arr.push(arr.length);
    }
  }else{
    quiz.combo = 0; quiz.wrong++;
    S.note[quiz.cur.en] = Math.max(S.note[quiz.cur.en] || 0, 2);
    quiz.queue.push(quiz.cur);   // 틀린 단어는 이번 라운드 안에서 다시 출제
  }
  save();
}

function finishRound(){
  const si = quiz.stage, wasNote = quiz.isNote, r = quiz.right, w = quiz.wrong;
  if(!wasNote && !S.cleared.includes(si)){ S.cleared.push(si); S.coins += 100; }
  quiz.on = false; save(); renderHUD();
  $("#view").innerHTML = `
    <section class="panel" style="text-align:center">
      <h2 class="sec">${wasNote ? "오답노트 복습 완료!" : `STAGE ${si+1} 클리어!`}</h2>
      <p class="sub">${wasNote ? "틀렸던 단어를 모두 다시 맞혔어요." : "숨은 그림이 완성되었습니다. 보너스 100코인 획득!"}</p>
      <div style="width:140px;margin:0 auto" class="popping">${petSVG(formIndex(),{hat:S.owned.includes("hat"),scarf:S.owned.includes("scarf")})}</div>
      <p style="font-family:var(--word);font-weight:600;font-size:15px;margin:10px 0 0">
        맞힌 횟수 ${r} · 틀린 횟수 ${w}
      </p>
      ${!wasNote ? `<div class="puzzle-wrap" style="max-width:420px;margin:14px auto 0">${puzzleSVG(si)}</div>` : ""}
      <div class="row-btns">
        <button class="btn primary" id="toHome">모험으로 돌아가기</button>
        ${w > 0 ? '<button class="btn" id="toNote">오답노트 복습</button>' : ""}
      </div>
    </section>`;
  $("#toHome").addEventListener("click", ()=>{ setTab("home"); });
  const tn = $("#toNote"); if(tn) tn.addEventListener("click", startNote);
}

function renderQuiz(){
  const c = quiz.cur;
  const modeName = ["뜻 맞추기","스펠링 조합","듣고 맞추기"][quiz.mode];
  const left = quiz.queue.length + 1;
  let bodyHTML = "";

  if(quiz.mode === 0){
    bodyHTML = `
      <div class="prompt">
        <div class="big">${c.en}</div>
        ${canSpeak() ? `<button class="speak-btn" id="sp">🔊 발음 듣기</button>` : ""}
      </div>
      <div class="choices">${quiz.pool.map((w,i)=>
        `<button class="choice" data-ko="${w.ko}"><span class="idx">${i+1}</span>${w.ko}</button>`).join("")}</div>`;
  }else if(quiz.mode === 1){
    const letters = c.en.split("");
    bodyHTML = `
      <div class="prompt">
        <div class="big ko">${c.ko}</div>
        <div class="hint">첫 글자는 <b>${c.en[0]}</b> · ${letters.length}글자</div>
        ${canSpeak() ? `<button class="speak-btn" id="sp">🔊 발음 듣기</button>` : ""}
      </div>
      <div class="slots">${letters.map((_,i)=>{
        const f = quiz.built[i];
        return `<div class="slot ${f!==undefined?"filled":""}">${f!==undefined?quiz.pool[f].ch:""}</div>`;
      }).join("")}</div>
      <div class="tiles">${quiz.pool.map((t,i)=>
        `<button class="tile" data-i="${i}" ${quiz.built.includes(i)?"disabled":""}>${t.ch}</button>`).join("")}</div>
      <div class="row-btns">
        <button class="btn ghost" id="undo">← 지우기</button>
        <button class="btn primary" id="submit" ${quiz.built.length !== letters.length ? "disabled" : ""}>확인</button>
      </div>`;
  }else{
    bodyHTML = `
      <div class="prompt">
        <div class="big">🔊 ? ? ?</div>
        <div class="hint">소리를 듣고 뜻을 고르세요</div>
        <button class="speak-btn" id="sp">🔊 다시 듣기</button>
      </div>
      <div class="choices">${quiz.pool.map((w,i)=>
        `<button class="choice" data-ko="${w.ko}"><span class="idx">${i+1}</span>${w.ko}</button>`).join("")}</div>`;
  }

  $("#view").innerHTML = `
    <section class="panel">
      <div class="quiz-top">
        <span class="chip">${quiz.isNote ? "오답노트" : "STAGE " + (quiz.stage+1) + " · " + STAGES[quiz.stage].title}</span>
        <span class="chip mode">${modeName}</span>
        <span class="chip">남은 문제 ${left}</span>
        ${quiz.combo > 1 ? `<span class="combo">🔥 ${quiz.combo} 연속!</span>` : ""}
      </div>
      ${bodyHTML}
      <div class="feedback" id="fb"></div>
      <div class="row-btns"><button class="btn ghost" id="quit">그만두기</button></div>
    </section>`;

  const sp = $("#sp"); if(sp) sp.addEventListener("click", ()=>speak(c.en));
  $("#quit").addEventListener("click", endQuiz);

  if(quiz.mode === 1){
    document.querySelectorAll(".tile").forEach(b=> b.addEventListener("click", ()=>{
      if(quiz.built.length >= c.en.length) return;
      quiz.built.push(+b.dataset.i); renderQuiz();
    }));
    $("#undo").addEventListener("click", ()=>{ quiz.built.pop(); renderQuiz(); });
    $("#submit").addEventListener("click", ()=>{
      const made = quiz.built.map(i=>quiz.pool[i].ch).join("");
      answer(made.toLowerCase() === c.en.toLowerCase(), null);
    });
  }else{
    document.querySelectorAll(".choice").forEach(b=> b.addEventListener("click", ()=>
      answer(b.dataset.ko === c.ko, b)));
  }
}

function answer(correct, btn){
  const c = quiz.cur;
  document.querySelectorAll(".choice,.tile,#submit,#undo").forEach(b=> b.disabled = true);
  if(btn){
    btn.classList.add(correct ? "right" : "wrong");
    if(!correct) document.querySelectorAll(".choice").forEach(b=>{ if(b.dataset.ko === c.ko) b.classList.add("right"); });
  }
  const bonus = correct ? Math.min(quiz.combo, 5) * 2 : 0;
  grade(correct);
  const fb = $("#fb");
  fb.className = "feedback " + (correct ? "ok" : "no");
  fb.innerHTML = correct
    ? `정답! <b>${c.en}</b> = ${c.ko}<span class="gain">+${EXP_GAIN + bonus} EXP · +${COIN_GAIN + bonus} 코인</span>`
    : `아쉬워요 · <b>${c.en}</b> = ${c.ko}<span class="gain">오답노트에 저장했어요</span>`;
  renderHUD();
  setTimeout(nextQ, correct ? 850 : 1500);
}

document.addEventListener("keydown", e=>{
  if(!quiz.on || quiz.mode === 1) return;
  const n = parseInt(e.key, 10);
  if(n >= 1 && n <= 4){
    const b = document.querySelectorAll(".choice")[n-1];
    if(b && !b.disabled) b.click();
  }
});

/* ---------- 퍼즐 ---------- */
function renderPuzzle(){
  const cards = STAGES.map((s,si)=>{
    const done = S.pieces[si].length, total = s.words.length;
    const covers = Array.from({length:20}, (_,i)=>
      `<div class="cover ${i < done ? "gone" : ""}"></div>`).join("");
    return `<section class="panel" style="margin-bottom:12px">
      <h2 class="sec">STAGE ${si+1} · ${s.title}</h2>
      <p class="sub">조각 ${done} / ${total}${done===total?" · 완성!":""}</p>
      <div class="puzzle-wrap">${puzzleSVG(si)}<div class="tiles-cover">${covers}</div></div>
    </section>`;
  }).join("");
  $("#view").innerHTML = `
    <section class="panel">
      <h2 class="sec">숨은 그림 보관함</h2>
      <p class="sub">단어 하나를 맞힐 때마다 조각이 한 개씩 벗겨집니다.</p>
    </section>${cards}`;
}

/* ---------- 오답노트 ---------- */
function renderNote(){
  const list = Object.keys(S.note);
  $("#view").innerHTML = `
    <section class="panel">
      <h2 class="sec">오답노트</h2>
      <p class="sub">틀린 단어는 여기로 모입니다. 두 번 연속 맞히면 사라져요.</p>
      ${list.length ? `
        <div class="row-btns" style="justify-content:flex-start;margin:0 0 4px">
          <button class="btn primary" id="go">${list.length}개 복습 시작</button>
        </div>
        <div class="note-list">${list.map(en=>{
          const w = ALL.find(x=>x.en===en) || {ko:""};
          return `<div class="note-row"><span class="en">${en}</span><span class="ko">${w.ko} · 남은 복습 ${S.note[en]}회</span></div>`;
        }).join("")}</div>`
      : `<div class="empty">아직 틀린 단어가 없어요.<br>모험 스테이지에서 도전해 보세요!</div>`}
    </section>`;
  const g = $("#go"); if(g) g.addEventListener("click", startNote);
}

/* ---------- 상점 ---------- */
function renderShop(){
  const icon = id => ({
    hat:   `<svg viewBox="0 0 60 60"><path d="M10 38 q 20 -26 40 0 z" fill="#5b6ee0"/><rect x="6" y="36" width="48" height="7" rx="3.5" fill="#4455c4"/></svg>`,
    scarf: `<svg viewBox="0 0 60 60"><path d="M12 22 q 18 12 36 0 l 3 10 q -21 13 -42 0 z" fill="#ff7a9c"/><rect x="40" y="30" width="9" height="20" rx="4" fill="#ffb84d" transform="rotate(12 44 40)"/></svg>`,
    plant: `<svg viewBox="0 0 60 60"><rect x="20" y="36" width="20" height="18" rx="4" fill="#c97b4a"/><path d="M30 36 q -16 -12 -11 -28 q 13 5 11 28z" fill="#45c986"/><path d="M30 36 q 16 -10 13 -26 q -13 5 -13 26z" fill="#2ea86c"/></svg>`,
    lamp:  `<svg viewBox="0 0 60 60"><path d="M14 28 l 16 -20 l 16 20 z" fill="#ffd166"/><rect x="27" y="28" width="6" height="24" fill="#6b7aa8"/><rect x="18" y="50" width="24" height="5" rx="2.5" fill="#6b7aa8"/></svg>`,
    ball:  `<svg viewBox="0 0 60 60"><circle cx="20" cy="20" r="12" fill="#ff6b7a"/><circle cx="42" cy="26" r="9" fill="#4ee0a6"/><path d="M20 32 q 3 16 -2 24 M42 35 q 1 12 -4 21" stroke="#fff" stroke-width="1.4" fill="none" opacity=".6"/></svg>`,
    rug:   `<svg viewBox="0 0 60 60"><ellipse cx="30" cy="34" rx="25" ry="13" fill="#8b5cf6"/><ellipse cx="30" cy="34" rx="15" ry="7" fill="#a78bfa"/></svg>`
  })[id];

  $("#view").innerHTML = `
    <section class="panel">
      <h2 class="sec">꾸미기 상점</h2>
      <p class="sub">단어를 맞혀 모은 코인으로 단어몽과 방을 꾸며 보세요.</p>
      <div class="shop-grid">${SHOP.map(it=>{
        const owned = S.owned.includes(it.id), can = S.coins >= it.price;
        return `<div class="item ${owned?"owned":""}">
          ${icon(it.id)}
          <span class="nm">${it.name}</span>
          <span class="pr">${it.price} 코인</span>
          <button class="act" data-id="${it.id}" ${owned||!can?"disabled":""}>
            ${owned ? "보유 중" : (can ? "구매하기" : "코인 부족")}
          </button>
        </div>`;
      }).join("")}</div>
    </section>`;
  document.querySelectorAll(".item .act").forEach(b=> b.addEventListener("click", ()=>{
    const it = SHOP.find(x=>x.id === b.dataset.id);
    if(S.coins < it.price || S.owned.includes(it.id)) return;
    S.coins -= it.price; S.owned.push(it.id); save();
    toast(`${it.name} 획득!`);
    renderShop(); renderHUD();
  }));
}

/* ---------- 시작 ---------- */
function start(){
  load();
  setTab("home");
}
if(window.claude && window.claude.hot){
  window.claude.hot.snapshot(()=>({ tab, S }));
  window.claude.hot.ready ? window.claude.hot.ready(start) : start();
}else{
  start();
}
</script>
