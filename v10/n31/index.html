<!-- index.html -->
<!DOCTYPE html> <!-- 이 문서가 HTML5 표준 문서임을 선언합니다. -->
<html lang="ko"> <!-- 문서의 언어를 한국어로 설정합니다. -->
<head> <!-- 문서의 정보와 설정이 들어가는 머리글 태그입니다. -->
  <meta charset="UTF-8"> <!-- 문자 인코딩을 UTF-8로 설정하여 한글 깨짐을 방지합니다. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 모바일 화면 크기에 맞추는 설정입니다. -->
  <title>영어 단어장</title> <!-- 브라우저 탭에 표시될 제목입니다. -->
  
  <!-- 구글 폰트 Jua(한글)와 Fredoka(영어)를 불러오는 링크 태그입니다. -->
  <link rel="preconnect" href="https://fonts.googleapis.com"> <!-- 구글 폰트 서버 연결 준비를 합니다. -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> <!-- 폰트 파일 다운로드를 미리 준비합니다. -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Jua&display=swap" rel="stylesheet"> <!-- Jua, Fredoka 폰트를 불러옵니다. -->

  <style> /* CSS 스타일시트 시작 태그입니다. */
    :root { /* 프로젝트 전체에서 사용할 CSS 변수들을 정의합니다. */
      --bg-color: #00d5ff; /* 전체 배경색 변수입니다 (시원한 하늘색). */
      --card-bg: #ffffff; /* 카드 배경색 변수입니다 (깔끔한 하얀색). */
      --text-color: #000000; /* 기본 글자색 변수입니다 (검은색). */
      --point-color: #ff0000; /* 포인트 강조 색상 변수입니다 (빨간색). */
      --card-radius: 36px; /* 카드 모서리의 둥글기 값 변수입니다. */
    } /* CSS 변수 정의 끝입니다. */

    body { /* 화면 전체의 모양을 설정합니다. */
      font-family: 'Fredoka', 'Jua', sans-serif; /* 영오는 Fredoka, 한글은 Jua 폰트를 적용합니다. */
      background-color: var(--bg-color); /* 화면 배경색을 CSS 변수값으로 설정합니다. */
      color: var(--text-color); /* 기본 글자색을 CSS 변수값으로 설정합니다. */
      display: flex; /* 요소를 정렬하기 위해 플렉스박스 레이아웃을 씁니다. */
      flex-direction: column; /* 요소들을 위에서 아래로 세로 배치합니다. */
      align-items: center; /* 요소들을 가운데로 정렬합니다. */
      justify-content: center; /* 세로 기준 가운데로 정렬합니다. */
      min-height: 100vh; /* 최소 높이를 화면 전체 높이로 만듭니다. */
      margin: 0; /* 여백을 없애서 화면에 딱 맞게 만듭니다. */
    } /* body 스타일 끝입니다. */

    .container { /* 전체 내용을 감싸는 상자의 스타일입니다. */
      width: 320px; /* 상자의 넓이를 320픽셀로 고정합니다. */
      text-align: center; /* 안의 모든 글자를 가운데로 정렬합니다. */
    } /* container 스타일 끝입니다. */

    .progress { /* 진도 표시 "1 / 10" 의 스타일입니다. */
      font-size: 20px; /* 글자 크기를 20픽셀로 만듭니다. */
      font-weight: bold; /* 글자를 두껍게 만듭니다. */
      margin-bottom: 15px; /* 아래쪽 상자와 간격을 15픽셀 둡니다. */
    } /* progress 스타일 끝입니다. */

    .card { /* 단어 카드의 스타일입니다. */
      width: 100%; /* 너비를 부모 상자에 100% 맞춥니다. */
      height: 200px; /* 카드의 높이를 200픽셀로 고정합니다. */
      background-color: var(--card-bg); /* 카드의 배경색을 CSS 변수로 설정합니다. */
      border-radius: var(--card-radius); /* 카드 모서리를 CSS 변수값(36px)만큼 둥글게 만듭니다. */
      box-shadow: 0 8px 16px rgba(0,0,0,0.15); /* 카드에 부드러운 그림자를 만듭니다. */
      display: flex; /* 카드 내부 요소를 정렬하기 위해 씁니다. */
      flex-direction: column; /* 내부 요소들을 세로로 정렬합니다. */
      align-items: center; /* 세로 줄의 가운데로 정렬합니다. */
      justify-content: center; /* 가로 줄의 가운데로 정렬합니다. */
      cursor: pointer; /* 마우스를 올리면 손가락 모양으로 바꿉니다. */
      margin-bottom: 20px; /* 아래 버튼들과 간격을 20픽셀 둡니다. */
      padding: 20px; /* 카드 안쪽에 20픽셀 여백을 둡니다. */
      box-sizing: border-box; /* 패딩이 포함된 크기를 일정하게 유지합니다. */
      position: relative; /* 스피커 버튼의 기준 위치가 됩니다. */
    } /* card 스타일 끝입니다. */

    .speaker-btn { /* 스피커 버튼의 스타일입니다. */
      position: absolute; /* 카드 안에서 원하는 곳에 딱 붙입니다. */
      top: 15px; /* 위에서 15픽셀 떨어진 곳에 놓습니다. */
      right: 15px; /* 오른쪽에서 15픽셀 떨어진 곳에 놓습니다. */
      background: none; /* 배경색을 없앱니다. */
      border: none; /* 테두리를 없앱니다. */
      font-size: 24px; /* 스피커 아이콘 크기를 24픽셀로 만듭니다. */
      cursor: pointer; /* 마우스를 올리면 손가락 모양으로 만듭니다. */
    } /* speaker-btn 스타일 끝입니다. */

    .word-en { /* 영어 단어의 스타일입니다. */
      font-size: 32px; /* 글자 크기를 크게 32픽셀로 만듭니다. */
      font-weight: bold; /* 글자를 두껍게 만듭니다. */
      color: var(--point-color); /* 강조용 색상(빨간색) 변수를 적용합니다. */
    } /* word-en 스타일 끝입니다. */

    .word-ko { /* 한글 뜻의 스타일입니다. */
      font-size: 24px; /* 글자 크기를 24픽셀로 만듭니다. */
      font-weight: bold; /* 글자를 두껍게 만듭니다. */
      margin-top: 10px; /* 위 단어와의 간격을 10픽셀 둡니다. */
      display: none; /* 처음에는 화면에 보이지 않게 숨깁니다. */
    } /* word-ko 스타일 끝입니다. */

    .word-ex { /* 예문의 스타일입니다. */
      font-size: 16px; /* 글자 크기를 16픽셀로 만듭니다. */
      color: var(--text-color); /* 검은색 글자색 변수를 사용합니다. */
      margin-top: 10px; /* 위 뜻과의 간격을 10픽셀 둡니다. */
      display: none; /* 처음에는 화면에 보이지 않게 숨깁니다. */
    } /* word-ex 스타일 끝입니다. */

    .buttons { /* 버튼들을 모아둔 상자의 스타일입니다. */
      display: flex; /* 버튼을 가로로 정렬합니다. */
      justify-content: space-between; /* 양 끝으로 나란히 넓게 벌립니다. */
    } /* buttons 스타일 끝입니다. */

    .btn { /* 이동 버튼들의 공통 스타일입니다. */
      padding: 10px 20px; /* 버튼 안쪽에 여백을 만듭니다. */
      font-size: 16px; /* 글자 크기를 16픽셀로 만듭니다. */
      font-family: inherit; /* 부모 상자의 폰트를 그대로 물려받아 사용합니다. */
      font-weight: bold; /* 글자를 두껍게 만듭니다. */
      background-color: var(--card-bg); /* 버튼 배경색을 하얀색으로 칠합니다. */
      color: var(--text-color); /* 버튼 글자색을 검은색으로 칠합니다. */
      border: none; /* 테두리를 없앱니다. */
      border-radius: var(--card-radius); /* 모서리를 둥글게(36px) 처리합니다. */
      cursor: pointer; /* 마우스를 올리면 손가락 모양으로 만듭니다. */
      box-shadow: 0 4px 8px rgba(0,0,0,0.1); /* 버튼에 연한 그림자를 부여합니다. */
    } /* btn 스타일 끝입니다. */

    .list-container { /* 복습 단어장의 전체 감싸기 상자 스타일입니다. */
      margin-top: 30px; /* 위 카드 영역과의 간격을 30픽셀 둡니다. */
      background-color: var(--card-bg); /* 하얀색 배경으로 깔아줍니다. */
      border-radius: var(--card-radius); /* 모서리를 카드처럼 둥글게 만들어줍니다. */
      padding: 15px; /* 안쪽에 15픽셀 여백을 만들어 줍니다. */
      box-shadow: 0 4px 8px rgba(0,0,0,0.1); /* 은은한 그림자를 줍니다. */
    } /* list-container 스타일 끝입니다. */

    .list-title { /* 단어장 제목 글자 스타일입니다. */
      font-size: 18px; /* 글자 크기를 18픽셀로 만듭니다. */
      font-weight: bold; /* 글자를 두껍게 표시합니다. */
      margin-bottom: 10px; /* 아래 목록과의 간격을 10픽셀 둡니다. */
      color: var(--point-color); /* 제목 글자색을 빨간색으로 포인트 줍니다. */
    } /* list-title 스타일 끝입니다. */

    .word-list { /* 단어 목록 상자의 스타일입니다. */
      max-height: 120px; /* 높이가 120픽셀을 넘지 않게 고정합니다. */
      overflow-y: auto; /* 목록이 길어지면 위아래 스크롤을 만듭니다. */
      text-align: left; /* 글자들을 왼쪽으로 깔끔하게 정렬합니다. */
    } /* word-list 스타일 끝입니다. */

    .word-item { /* 단어 목록 안의 개별 항목 스타일입니다. */
      padding: 5px 0; /* 위아래로 5픽셀의 간격을 둡니다. */
      border-bottom: 1px solid #eee; /* 단어 사이에 연한 분리선을 넣습니다. */
      font-size: 14px; /* 글자 크기를 작고 깔끔하게 14픽셀로 합니다. */
    } /* word-item 스타일 끝입니다. */

    .quiz-container { /* 퀴즈 영역 전체 상자 스타일입니다. */
      margin-top: 20px; /* 위 단어장 영역과의 간격을 20픽셀 둡니다. */
      background-color: var(--card-bg); /* 배경을 깔끔한 흰색으로 설정합니다. */
      border-radius: var(--card-radius); /* 모서리를 둥글게 36픽셀로 정합니다. */
      padding: 15px; /* 상자 안쪽에 15픽셀 여백을 넣습니다. */
      box-shadow: 0 4px 8px rgba(0,0,0,0.1); /* 은은한 그림자 효과를 줍니다. */
    } /* quiz-container 스타일 끝입니다. */

    .quiz-title { /* 퀴즈 질문의 스타일입니다. */
      font-size: 16px; /* 질문 글자 크기를 16픽셀로 정합니다. */
      font-weight: bold; /* 질문을 두껍게 강조합니다. */
      margin-bottom: 10px; /* 아래 보기 버튼과의 간격을 10픽셀 둡니다. */
    } /* quiz-title 스타일 끝입니다. */

    .quiz-options { /* 퀴즈 보기 버튼들을 세로로 배치하는 상자 스타일입니다. */
      display: flex; /* 보기 버튼들을 정리하기 위해 플렉스를 씁니다. */
      flex-direction: column; /* 보기들을 위에서 아래로 세로 정렬합니다. */
      gap: 8px; /* 버튼 사이의 간격을 8픽셀로 균일하게 띱니다. */
    } /* quiz-options 스타일 끝입니다. */

    .option-btn { /* 퀴즈 보기 버튼 개별 스타일입니다. */
      padding: 8px; /* 버튼 안쪽에 여백을 줍니다. */
      border: 1px solid #ddd; /* 바깥에 연한 회색 테두리를 그립니다. */
      border-radius: var(--card-radius); /* 모서리를 둥글게 만듭니다. */
      background-color: var(--card-bg); /* 배경을 하얗게 채웁니다. */
      font-family: inherit; /* 기본 글꼴을 상위 요소와 맞춥니다. */
      font-size: 14px; /* 보기 글자 크기를 14픽셀로 맞춥니다. */
      cursor: pointer; /* 마우스를 올리면 클릭 손가락으로 변경합니다. */
    } /* option-btn 스타일 끝입니다. */

    .option-btn.correct { /* 맞았을 때 버튼 스타일입니다. */
      background-color: #28a745; /* 배경을 싱그러운 초록색으로 바꿉니다. */
      color: white; /* 글자색을 깔끔하게 하얀색으로 변경합니다. */
      border-color: #28a745; /* 테두리도 초록색으로 변경합니다. */
    } /* option-btn.correct 스타일 끝입니다. */

    .option-btn.faded { /* 틀렸을 때나 선택 안 되었을 때 흐려지는 스타일입니다. */
      opacity: 0.3; /* 투명도를 0.3으로 낮춰 흐릿하게 표시합니다. */
    } /* option-btn.faded 스타일 끝입니다. */

    .score-board { /* 맞은 개수와 틀린 개수를 알려주는 점수판 스타일입니다. */
      margin-top: 10px; /* 질문 버튼과의 간격을 10픽셀 만듭니다. */
      font-size: 14px; /* 점수판 글자 크기를 14픽셀로 둡니다. */
      font-weight: bold; /* 점수를 강조하기 위해 두껍게 처리합니다. */
    } /* score-board 스타일 끝입니다. */
  </style> <!-- CSS 스타일시트 끝 태그입니다. -->
</head> <!-- 머리글 끝 태그입니다. -->
<body> <!-- 화면에 실제로 보이는 내용 시작 태그입니다. -->

  <div class="container"> <!-- 전체를 가운데 정렬해줄 상자입니다. -->
    
    <div class="progress" id="progress">1 / 10</div> <!-- 진도를 알려주는 글자 상자입니다. -->

    <div class="card" id="card" onclick="flipCard()"> <!-- 단어가 적힐 카드 상자입니다. 클릭하면 뒤집힙니다. -->
      <button class="speaker-btn" onclick="speakWord(event)">🔊</button> <!-- 소리를 들려주는 스피커 버튼입니다. -->
      <div class="word-en" id="word-en">apple</div> <!-- 영어 단어가 보이는 영역입니다. -->
      <div class="word-ko" id="word-ko">사과</div> <!-- 한글 뜻이 보이는 영역입니다. -->
      <div class="word-ex" id="word-ex">I eat an apple.</div> <!-- 예문이 보이는 영역입니다. -->
    </div> <!-- 카드 상자 끝입니다. -->

    <div class="buttons"> <!-- 이전, 다음 버튼을 나란히 놓는 상자입니다. -->
      <button class="btn" onclick="prevCard()">이전</button> <!-- 클릭하면 이전 단어로 넘어가는 버튼입니다. -->
      <button class="btn" onclick="nextCard()">다음</button> <!-- 클릭하면 다음 단어로 넘어가는 버튼입니다. -->
    </div> <!-- 버튼 상자 끝입니다. -->

    <!-- 복습용 소형 단어장 영역입니다. -->
    <div class="list-container"> <!-- 단어장 전체 상자입니다. -->
      <div class="list-title">📖 단어장 목록</div> <!-- 단어장 제목 표시입니다. -->
      <div class="word-list" id="word-list"></div> <!-- 단어 항목들이 모여서 출력될 상자입니다. -->
    </div> <!-- 소형 단어장 영역 끝입니다. -->

    <!-- 퀴즈 기능이 들어갈 영역 상자입니다. -->
    <div class="quiz-container"> <!-- 퀴즈 전체 영역 상자입니다. -->
      <div class="quiz-title">이 단어의 뜻은?</div> <!-- 퀴즈 질문 문구입니다. -->
      <div class="quiz-options" id="quiz-options"></div> <!-- 보기 버튼 4개가 출력될 위치입니다. -->
      <div class="score-board" id="score-board">맞음: 0 | 틀림: 0</div> <!-- 정답/오답 스코어가 표시되는 영역입니다. -->
    </div> <!-- 퀴즈 영역 끝입니다. -->

  </div> <!-- container 상자 끝입니다. -->

  <script> /* 자바스크립트 코드 시작 태그입니다. */

    // ==========================================
    // ★ [여기만 고치세요] 단어 목록을 수정하는 곳입니다.
    // ==========================================
    const WORDS = [ /* 단어 데이터를 담고 있는 배열 상자입니다. */
      { en:'apple', ko:'사과', ex:'I eat apple.' }, /* 첫 번째 단어 세트입니다. */
      { en:'banana', ko:'바나나', ex:'I eat banana.' }, /* 두 번째 단어 세트입니다. */
      { en:'orange', ko:'오렌지', ex:'I eat orange.' }, /* 세 번째 단어 세트입니다. */
      { en:'pig', ko:'돼지', ex:'I eat the pig.' }, /* 네 번째 단어 세트입니다. */
      { en:'emergency', ko:'긴급상황', ex:'This is an emergency' }, /* 다섯 번째 단어 세트입니다. */
      { en:'face', ko:'얼굴', ex:'Your face, my face.' }, /* 여섯 번째 단어 세트입니다. */
      { en:'small', ko:'냄새', ex:'It smalls good' }, /* 일곱 번째 단어 세트입니다. */
      { en:'popcorn', ko:'팝콘', ex:'I want some popcorn' }, /* 여덟 번째 단어 세트입니다. */
      { en:'meteorite', ko:'운석', ex:'A meteorite falls to earth.' }, /* 아홉 번째 단어 세트입니다. */
      { en:'cow', ko:'소', ex:'I eat cow' }, /* 열 번째 단어 세트입니다. */
    ]; // 단어 목록 끝입니다.

    let currentIndex = 0; // 현재 보고 있는 단어의 번호를 저장합니다. (0부터 시작)
    let isFlipped = false; // 카드가 뒤집혔는지 아닌지 상태를 기억합니다.
    let correctCount = 0; // 맞춘 개수를 누적해서 세는 변수입니다.
    let wrongCount = 0; // 틀린 개수를 누적해서 세는 변수입니다.

    // HTML 태그들을 자바스크립트 변수로 가져옵니다.
    const progressEl = document.getElementById('progress'); // 진도 표시 태그를 가져옵니다.
    const wordEnEl = document.getElementById('word-en'); // 영어 단어 표시 태그를 가져옵니다.
    const wordKoEl = document.getElementById('word-ko'); // 한글 뜻 표시 태그를 가져옵니다.
    const wordExEl = document.getElementById('word-ex'); // 예문 표시 태그를 가져옵니다.
    const wordListEl = document.getElementById('word-list'); // 단어장 목록 영역을 가져옵니다.
    const quizOptionsEl = document.getElementById('quiz-options'); // 퀴즈 보기들이 들어갈 영역을 가져옵니다.
    const scoreBoardEl = document.getElementById('score-board'); // 점수판 표시 영역을 가져옵니다.

    // 화면에 현재 단어 정보를 보여주는 함수입니다.
    function showCard() { // showCard 함수 시작입니다.
      const currentWord = WORDS[currentIndex]; // 현재 순서의 단어 객체를 꺼내옵니다.
      wordEnEl.textContent = currentWord.en; // 영어 단어를 화면에 씁니다.
      wordKoEl.textContent = currentWord.ko; // 한글 뜻을 화면에 씁니다.
      wordExEl.textContent = currentWord.ex; // 예문을 화면에 씁니다.
      
      // 진도 표시를 "현재번호 / 전체개수" 형식으로 업데이트합니다.
      progressEl.textContent = (currentIndex + 1) + ' / ' + WORDS.length; // 진도를 계산해 넣습니다.

      // 카드를 뒤집히지 않은 처음 상태(앞면)로 초기화합니다.
      isFlipped = false; // 상태를 '안 뒤집힘'으로 바꿉니다.
      wordKoEl.style.display = 'none'; // 한글 뜻을 다시 숨깁니다.
      wordExEl.style.display = 'none'; // 예문을 다시 숨깁니다.

      // 카드가 바뀔 때마다 퀴즈도 새로운 문제로 만듭니다.
      renderQuiz(); // 퀴즈 출제 함수를 부릅니다.
    } // showCard 함수 끝입니다.

    // 카드를 클릭했을 때 뒤집어주는 함수입니다.
    function flipCard() { // flipCard 함수 시작입니다.
      isFlipped = !isFlipped; // 뒤집힘 상태를 반대로 뒤집습니다. (참->거짓, 거짓->참)
      
      if (isFlipped) { // 만약 카드가 뒤집힌 상태라면
        wordKoEl.style.display = 'block'; // 한글 뜻을 화면에 보여줍니다.
        wordExEl.style.display = 'block'; // 예문을 화면에 보여줍니다.
      } else { // 카드가 안 뒤집힌 앞면 상태라면
        wordKoEl.style.display = 'none'; // 한글 뜻을 다시 숨깁니다.
        wordExEl.style.display = 'none'; // 예문을 다시 숨깁니다.
      } // 조건문 끝입니다.
    } // flipCard 함수 끝입니다.

    // 스피커 버튼을 클릭했을 때 단어를 읽어주는 함수입니다.
    function speakWord(event) { // speakWord 함수 시작입니다.
      event.stopPropagation(); // 스피커를 누를 때 카드가 뒤집히지 않게 클릭 이벤트 전달을 막습니다.
      
      const currentWord = WORDS[currentIndex]; // 현재 단어를 가져옵니다.
      const utterance = new SpeechSynthesisUtterance(currentWord.en); // 읽을 영어 단어를 음성 객체로 생성합니다.
      
      utterance.lang = 'en-US'; // 읽기 언어를 미국 영어로 설정합니다.
      utterance.rate = 0.8; // 말하기 속도를 조금 느리게(0.8) 설정합니다.
      
      window.speechSynthesis.cancel(); // 혹시 이전에 말하던 음성이 있다면 멈춥니다.
      window.speechSynthesis.speak(utterance); // 설정한 단어를 소리로 읽어줍니다.
    } // speakWord 함수 끝입니다.

    // 다음 버튼을 눌렀을 때 실행되는 함수입니다.
    function nextCard() { // nextCard 함수 시작입니다.
      currentIndex = currentIndex + 1; // 단어 번호를 1 올려줍니다.
      if (currentIndex >= WORDS.length) { // 만약 마지막 단어를 넘어가면
        currentIndex = 0; // 다시 첫 번째 단어로 돌아갑니다.
      } // 조건문 끝입니다.
      showCard(); // 새 단어를 화면에 그려줍니다.
    } // nextCard 함수 끝입니다.

    // 이전 버튼을 눌렀을 때 실행되는 함수입니다.
    function prevCard() { // prevCard 함수 시작입니다.
      currentIndex = currentIndex - 1; // 단어 번호를 1 줄여줍니다.
      if (currentIndex < 0) { // 만약 첫 번째 단어보다 작아지면
        currentIndex = WORDS.length - 1; // 가장 마지막 단어로 이동합니다.
      } // 조건문 끝입니다.
      showCard(); // 새 단어를 화면에 그려줍니다.
    } // prevCard 함수 끝입니다.

    // 하단 복습용 단어장에 모든 단어를 뿌려주는 함수입니다.
    function renderWordList() { // renderWordList 함수 시작입니다.
      wordListEl.innerHTML = ''; // 기존 목록 내용을 깨끗하게 비웁니다.
      WORDS.forEach(function(item, idx) { // 모든 단어를 하나씩 순회하며 꺼냅니다.
        const div = document.createElement('div'); // 새로운 단어 항목 상자를 만듭니다.
        div.className = 'word-item'; // 단어 항목용 클래스 이름을 부여합니다.
        // 번호, 영어, 한글 뜻을 보기 좋게 조립해 글자로 넣습니다.
        div.textContent = (idx + 1) + '. ' + item.en + ' : ' + item.ko; // 텍스트 합성 후 대입합니다.
        wordListEl.appendChild(div); // 만든 항목 상자를 전체 목록에 붙여 넣습니다.
      }); // 순회 반복문 끝입니다.
    } // renderWordList 함수 끝입니다.

    // 퀴즈 옵션 보기 4개와 정답을 생성해 화면에 그려주는 함수입니다.
    function renderQuiz() { // renderQuiz 함수 시작입니다.
      quizOptionsEl.innerHTML = ''; // 이전 문제의 보기 버튼들을 비웁니다.
      const currentWord = WORDS[currentIndex]; // 현재 정답 단어를 지정합니다.
      
      // 오답 보기를 모으기 위해 정답 단어를 제외한 다른 단어들만 필터링합니다.
      const otherWords = WORDS.filter(function(item) { // filter로 단어를 걸러냅니다.
        return item.en !== currentWord.en; // 현재 영어 단어와 다른 것만 남깁니다.
      }); // 필터 끝입니다.

      // 오답 목록을 무작위로 섞어줍니다.
      otherWords.sort(function() { // 배열 섞기 정렬 함수를 호출합니다.
        return Math.random() - 0.5; // 무작위로 순서를 바꿉니다.
      }); // 정렬 끝입니다.

      // 오답 목록에서 상위 3개를 가져와 보기 목록으로 만듭니다.
      const wrongAnswers = otherWords.slice(0, 3).map(function(item) { // 3개를 잘라내 뜻만 뽑습니다.
        return item.ko; // 한글 뜻만 반환합니다.
      }); // 맵핑 끝입니다.

      // 정답 1개와 오답 3개를 합쳐서 보기 4개 배열로 조립합니다.
      const options = [currentWord.ko, ...wrongAnswers]; // 총 4개의 보기가 들어갑니다.

      // 보기 4개를 무작위로 다시 섞어서 정답의 위치가 매번 바뀌게 만듭니다.
      options.sort(function() { // 배열을 또 한 번 섞어 줍니다.
        return Math.random() - 0.5; // 무작위 정렬을 수행합니다.
      }); // 정렬 끝입니다.

      // 보기 4개를 각각 버튼 태그로 만들어서 화면에 배치합니다.
      options.forEach(function(optionText) { // 4개의 보기를 하나씩 순회합니다.
        const btn = document.createElement('button'); // 새 보기 버튼을 만듭니다.
        btn.className = 'option-btn'; // 보기 버튼 전용 스타일 클래스를 넣습니다.
        btn.textContent = optionText; // 버튼 표면에 한글 뜻 보기를 적습니다.
        
        // 보기 버튼을 눌렀을 때 정답 체크 함수를 실행시킵니다.
        btn.onclick = function() { // 클릭할 때 일어날 일들을 정의합니다.
          checkAnswer(btn, optionText, currentWord.ko); // 정답 확인 함수를 호출합니다.
        }; // 클릭 이벤트 연결 끝입니다.
        
        quizOptionsEl.appendChild(btn); // 만든 보기 버튼을 퀴즈 상자에 붙입니다.
      }); // 반복문 끝입니다.
    } // renderQuiz 함수 끝입니다.

    // 사용자가 퀴즈 보기를 클릭했을 때 정답/오답을 판단하는 함수입니다.
    function checkAnswer(selectedBtn, selectedOption, correctOption) { // checkAnswer 시작입니다.
      const allBtns = quizOptionsEl.querySelectorAll('.option-btn'); // 모든 보기 버튼들을 전부 가져옵니다.
      
      // 이미 클릭해서 답을 맞춘 문제라면 다시 누르지 못하게 버튼 전체를 막습니다.
      allBtns.forEach(function(btn) { // 모든 보기 버튼을 순회합니다.
        btn.disabled = true; // 클릭 불가능(비활성화) 상태로 만듭니다.
      }); // 반복문 끝입니다.

      if (selectedOption === correctOption) { // 클릭한 보기가 정답 한글 뜻과 일치하면
        correctCount = correctCount + 1; // 맞은 개수를 1개 늘립니다.
        selectedBtn.classList.add('correct'); // 클릭한 버튼을 초록색 스타일로 만듭니다.
        
        // 정답 이외의 남은 세 개 버튼들을 흐릿하게 만듭니다.
        allBtns.forEach(function(btn) { // 전체 버튼을 둘러봅니다.
          if (btn !== selectedBtn) { // 정답 버튼이 아니라면
            btn.classList.add('faded'); // 투명도를 줘서 흐리게 변경합니다.
          } // 조건 끝입니다.
        }); // 반복문 끝입니다.

      } else { // 선택한 보기가 틀린 오답일 경우
        wrongCount = wrongCount + 1; // 틀린 개수를 1개 늘립니다.
        
        // 정답 버튼만 찾아서 초록색으로 돋보이게 표시해주고 나머지는 전부 흐리게 만듭니다.
        allBtns.forEach(function(btn) { // 보기 버튼들을 모두 확인합니다.
          if (btn.textContent === correctOption) { // 진짜 정답 버튼이라면
            btn.classList.add('correct'); // 초록색 배경을 붙여서 정답임을 알려줍니다.
          } else { // 오답 버튼들이라면
            btn.classList.add('faded'); // 전부 흐릿한 투명 상태로 지정합니다.
          } // 조건문 끝입니다.
        }); // 반복문 끝입니다.
      } // 정답/오답 조건 판단 끝입니다.

      // 바뀐 정답 / 틀린 개수를 화면 스코어보드에 새로 업데이트합니다.
      scoreBoardEl.textContent = '맞음: ' + correctCount + ' | 틀림: ' + wrongCount; // 점수를 글자로 적어줍니다.
    } // checkAnswer 함수 끝입니다.

    // 처음 프로그램이 켜지면 화면에 첫 번째 단어 카드와 복습 단어장을 출력해 줍니다.
    showCard(); // 첫 단어와 퀴즈를 준비시킵니다.
    renderWordList(); // 하단 소형 단어장 목록을 출력해 줍니다.

  </script> <!-- 자바스크립트 코드 끝 태그입니다. -->
</body> <!-- 화면 영역 끝 태그입니다. -->
</html> <!-- HTML 전체 끝 태그입니다. -->
