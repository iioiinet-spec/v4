```html
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>영어 단어 카드</title>

  <!-- Google Fonts에서 Noto Serif KR 글꼴을 가져옵니다. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    /* 사용할 색을 한곳에 모아둡니다. */
    :root {
      --background: #fbf5e4; /* 전체 배경 색입니다. */
      --card: #ffffff; /* 카드 배경 색입니다. */
      --text: #1d1b18; /* 기본 글자 색입니다. */
      --point: #8a2f26; /* 강조할 때 사용할 색입니다. */
      --soft-point: #f1ddd8; /* 포인트를 연하게 사용할 색입니다. */
      --line: #eadfd0; /* 테두리에 사용할 색입니다. */
    }

    /* 모든 요소의 크기 계산 방법을 정합니다. */
    * {
      box-sizing: border-box;
    }

    /* 페이지 전체의 모양을 정합니다. */
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--background);
      color: var(--text);
      font-family: 'Noto Serif KR', serif;
    }

    /* 카드 전체를 감싸는 공간입니다. */
    .container {
      width: 90%;
      max-width: 500px;
      text-align: center;
      padding: 40px 0;
    }

    /* 작은 장식 글자입니다. */
    .small-title {
      margin-bottom: 8px;
      color: var(--point);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    /* 제목의 모양을 정합니다. */
    h1 {
      margin: 0 0 24px;
      color: var(--text);
      font-size: 34px;
      font-weight: 700;
    }

    /* 단어 카드가 놓이는 공간입니다. */
    .card {
      width: 100%;
      height: 300px;
      perspective: 1000px;
      cursor: pointer;
    }

    /* 실제로 뒤집히는 카드입니다. */
    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.6s ease;
      transform-style: preserve-3d;
    }

    /* 카드가 뒤집혔을 때의 모습입니다. */
    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    /* 카드 앞면과 뒷면의 공통 모양입니다. */
    .card-front,
    .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--card);
      color: var(--text);
      box-shadow: 0 12px 30px rgba(80, 50, 40, 0.08);
      backface-visibility: hidden;
    }

    /* 카드 위쪽의 작은 장식입니다. */
    .card-front::before {
      content: '✦';
      position: absolute;
      top: 20px;
      left: 24px;
      color: var(--point);
      font-size: 18px;
    }

    /* 카드 아래쪽의 작은 장식입니다. */
    .card-front::after {
      content: '✦';
      position: absolute;
      bottom: 20px;
      right: 24px;
      color: var(--point);
      font-size: 18px;
    }

    /* 영어 단어의 모양입니다. */
    .word {
      font-size: 56px;
      font-weight: 700;
      color: var(--point);
      letter-spacing: -1px;
    }

    /* 카드를 눌러보라는 안내 글입니다. */
    .card-front p {
      margin-top: 18px;
      padding: 7px 14px;
      border-radius: 20px;
      background: var(--soft-point);
      color: var(--point);
      font-size: 16px;
    }

    /* 뜻의 모양입니다. */
    .meaning {
      font-size: 38px;
      font-weight: 700;
      margin-bottom: 18px;
      color: var(--point);
    }

    /* 예문의 모양입니다. */
    .example {
      max-width: 90%;
      font-size: 22px;
      line-height: 1.6;
      color: var(--text);
    }

    /* 뒷면을 반대 방향으로 돌려놓습니다. */
    .card-back {
      transform: rotateY(180deg);
    }

    /* 진도 표시의 모양입니다. */
    .progress {
      display: inline-block;
      margin: 22px 0 16px;
      padding: 6px 15px;
      border-radius: 20px;
      background: var(--soft-point);
      color: var(--point);
      font-size: 17px;
      font-weight: 700;
    }

    /* 버튼을 감싸는 공간입니다. */
    .buttons {
      display: flex;
      gap: 10px;
    }

    /* 이전과 다음 버튼의 모양입니다. */
    button {
      flex: 1;
      padding: 13px;
      border: 1px solid var(--point);
      border-radius: 10px;
      background: var(--card);
      color: var(--point);
      font-family: 'Noto Serif KR', serif;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
    }

    /* 버튼에 마우스를 올렸을 때의 모습입니다. */
    button:hover:not(:disabled) {
      background: var(--point);
      color: var(--card);
      transform: translateY(-2px);
    }

    /* 버튼을 눌렀을 때의 모습입니다. */
    button:active:not(:disabled) {
      transform: translateY(0);
    }

    /* 사용할 수 없는 버튼의 모습입니다. */
    button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* ========================= */
    /* 여기부터 퀴즈 기능입니다. */
    /* ========================= */

    /* 퀴즈 전체 공간입니다. */
    .quiz {
      margin-top: 26px;
    }

    /* 퀴즈 질문의 모양입니다. */
    .quiz-question {
      margin-bottom: 12px;
      color: var(--text);
      font-size: 20px;
      font-weight: 700;
    }

    /* 퀴즈 보기를 2열로 배치합니다. */
    .quiz-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    /* 퀴즈 보기 버튼의 모양입니다. */
    .quiz-option {
      width: 100%;
      padding: 12px 8px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--card);
      color: var(--text);
      font-family: 'Noto Serif KR', serif;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s ease;
    }

    /* 퀴즈 보기 버튼에 마우스를 올렸을 때입니다. */
    .quiz-option:hover:not(:disabled) {
      border-color: var(--point);
      transform: translateY(-1px);
    }

    /* 정답을 선택했을 때 초록색으로 표시합니다. */
    .quiz-option.correct {
      border-color: #4f8a5b;
      background: #dff0e2;
      color: #35643e;
      opacity: 1;
    }

    /* 오답을 선택했을 때 흐리게 표시합니다. */
    .quiz-option.wrong {
      opacity: 0.35;
    }

    /* 답을 고른 뒤에는 보기 버튼을 누를 수 없게 합니다. */
    .quiz-option:disabled {
      cursor: default;
    }

    /* 퀴즈 점수의 모양입니다. */
    .quiz-score {
      margin-top: 12px;
      color: var(--text);
      font-size: 15px;
    }

    /* 점수 숫자를 강조합니다. */
    .quiz-score span {
      color: var(--point);
      font-weight: 700;
    }

    /* 작은 화면에서는 글자를 조금 줄입니다. */
    @media (max-width: 480px) {
      h1 {
        font-size: 30px;
      }

      .word {
        font-size: 46px;
      }

      .meaning {
        font-size: 32px;
      }

      .example {
        font-size: 19px;
      }

      .quiz-question {
        font-size: 18px;
      }

      .quiz-option {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <!-- 영어 단어 카드 전체입니다. -->
  <div class="container">

    <!-- 제목 위의 작은 장식 글자입니다. -->
    <div class="small-title">VOCABULARY</div>

    <!-- 페이지 제목입니다. -->
    <h1>영어 단어 카드</h1>

    <!-- 단어를 보여주는 카드입니다. -->
    <div class="card" id="card">

      <!-- 앞면과 뒷면을 함께 움직이는 부분입니다. -->
      <div class="card-inner">

        <!-- 카드 앞면입니다. -->
        <div class="card-front">

          <!-- 영어 단어가 표시됩니다. -->
          <div class="word" id="word"></div>

          <!-- 카드를 눌러보라는 안내입니다. -->
          <p>카드를 눌러 뜻을 확인하세요.</p>

        </div>

        <!-- 카드 뒷면입니다. -->
        <div class="card-back">

          <!-- 단어의 뜻이 표시됩니다. -->
          <div class="meaning" id="meaning"></div>

          <!-- 단어의 예문이 표시됩니다. -->
          <div class="example" id="example"></div>

        </div>
      </div>
    </div>

    <!-- 현재 단어의 위치를 보여줍니다. -->
    <div class="progress" id="progress"></div>

    <!-- 단어 뜻을 맞히는 퀴즈입니다. -->
    <div class="quiz">

      <!-- 퀴즈 질문입니다. -->
      <div class="quiz-question">이 단어의 뜻은?</div>

      <!-- 퀴즈 보기 버튼이 들어가는 곳입니다. -->
      <div class="quiz-options" id="quizOptions"></div>

      <!-- 현재까지의 점수를 보여줍니다. -->
      <div class="quiz-score">
        맞음 <span id="correctCount">0</span>
        ·
        틀림 <span id="wrongCount">0</span>
      </div>

    </div>

    <!-- 이전과 다음 버튼입니다. -->
    <div class="buttons">

      <!-- 이전 단어 버튼입니다. -->
      <button id="prevButton">← 이전</button>

      <!-- 다음 단어 버튼입니다. -->
      <button id="nextButton">다음 →</button>

    </div>
  </div>

  <script>
    // ============================================================
    // 단어 목록입니다. 단어를 바꾸려면 여기만 고치세요.
    // ============================================================
    const WORDS = [
      { en:'arrive', ko:'도착하다', ex:'I arrive at school at 8.' },
      { en:'borrow', ko:'빌리다', ex:'Can I borrow your pencil?' },
      { en:'choose', ko:'선택하다', ex:'I choose the blue shirt.' },
      { en:'decide', ko:'결정하다', ex:'I decide to study English.' },
      { en:'different', ko:'다른', ex:'My idea is different.' },
      { en:'enough', ko:'충분한', ex:'I have enough time.' },
      { en:'favorite', ko:'가장 좋아하는', ex:'Pizza is my favorite food.' },
      { en:'healthy', ko:'건강한', ex:'Fruit is healthy food.' },
      { en:'important', ko:'중요한', ex:'Sleep is important for us.' },
      { en:'invite', ko:'초대하다', ex:'I invite my friend to my party.' },
      { en:'popular', ko:'인기 있는', ex:'This song is very popular.' },
      { en:'prepare', ko:'준비하다', ex:'I prepare for the test.' },
      { en:'promise', ko:'약속하다', ex:'I promise to help you.' },
      { en:'remember', ko:'기억하다', ex:'I remember your name.' },
      { en:'receive', ko:'받다', ex:'I receive a gift from my friend.' },
      { en:'agree', ko:'동의하다', ex:'I agree with you.' },
      { en:'answer', ko:'대답하다', ex:'Please answer my question.' },
      { en:'believe', ko:'믿다', ex:'I believe in you.' },
      { en:'carry', ko:'나르다', ex:'I carry my bag to school.' },
      { en:'catch', ko:'잡다', ex:'I catch the ball.' },
      { en:'change', ko:'바꾸다', ex:'I change my plan.' },
      { en:'check', ko:'확인하다', ex:'Please check your answer.' },
      { en:'collect', ko:'모으다', ex:'I collect cute stickers.' },
      { en:'continue', ko:'계속하다', ex:'I continue my work.' },
      { en:'create', ko:'만들다', ex:'I create a new game.' },
      { en:'discover', ko:'발견하다', ex:'I discover something new.' },
      { en:'enjoy', ko:'즐기다', ex:'I enjoy playing soccer.' },
      { en:'explain', ko:'설명하다', ex:'Can you explain this problem?' },
      { en:'finish', ko:'끝내다', ex:'I finish my homework.' },
      { en:'follow', ko:'따라가다', ex:'I follow my teacher.' },
      { en:'forget', ko:'잊다', ex:"Don't forget your homework." },
      { en:'happen', ko:'일어나다', ex:'What happened yesterday?' },
      { en:'hope', ko:'바라다', ex:'I hope you are happy.' },
      { en:'improve', ko:'향상시키다', ex:'I want to improve my English.' },
      { en:'join', ko:'참여하다', ex:'I join the school club.' },
      { en:'learn', ko:'배우다', ex:'I learn English every day.' },
      { en:'lend', ko:'빌려주다', ex:'Can you lend me your pen?' },
      { en:'meet', ko:'만나다', ex:'I meet my friend after school.' },
      { en:'notice', ko:'알아차리다', ex:'I notice a small mistake.' },
      { en:'practice', ko:'연습하다', ex:'I practice English every day.' },
      { en:'protect', ko:'보호하다', ex:'We protect our environment.' },
      { en:'reach', ko:'도달하다', ex:'I reach the station at 7.' },
      { en:'return', ko:'돌아오다', ex:'I return home at five.' },
      { en:'share', ko:'공유하다', ex:'I share my food with my friend.' },
      { en:'solve', ko:'해결하다', ex:'I solve the math problem.' },
      { en:'spend', ko:'쓰다, 보내다', ex:'I spend time with my family.' },
      { en:'understand', ko:'이해하다', ex:'I understand the question.' },
      { en:'visit', ko:'방문하다', ex:'I visit my grandmother.' },
      { en:'wait', ko:'기다리다', ex:'I wait for the bus.' },
      { en:'win', ko:'이기다', ex:'Our team can win the game.' }
    ];

    // 현재 보고 있는 단어의 번호입니다.
    let currentIndex = 0;

    // 지금까지 맞힌 개수입니다.
    let correctCount = 0;

    // 지금까지 틀린 개수입니다.
    let wrongCount = 0;

    // 단어 카드를 가져옵니다.
    const card = document.getElementById('card');

    // 영어 단어를 보여주는 곳을 가져옵니다.
    const wordElement = document.getElementById('word');

    // 뜻을 보여주는 곳을 가져옵니다.
    const meaningElement = document.getElementById('meaning');

    // 예문을 보여주는 곳을 가져옵니다.
    const exampleElement = document.getElementById('example');

    // 진도를 보여주는 곳을 가져옵니다.
    const progressElement = document.getElementById('progress');

    // 이전 버튼을 가져옵니다.
    const prevButton = document.getElementById('prevButton');

    // 다음 버튼을 가져옵니다.
    const nextButton = document.getElementById('nextButton');

    // 퀴즈 보기들이 들어갈 곳을 가져옵니다.
    const quizOptions = document.getElementById('quizOptions');

    // 맞은 개수를 보여주는 곳을 가져옵니다.
    const correctCountElement = document.getElementById('correctCount');

    // 틀린 개수를 보여주는 곳을 가져옵니다.
    const wrongCountElement = document.getElementById('wrongCount');

    // 현재 단어를 화면에 보여주는 함수입니다.
    function showWord() {
      const currentWord = WORDS[currentIndex];

      wordElement.textContent = currentWord.en;
      meaningElement.textContent = currentWord.ko;
      exampleElement.textContent = currentWord.ex;
      progressElement.textContent = `${currentIndex + 1} / ${WORDS.length}`;

      card.classList.remove('flipped');

      prevButton.disabled = currentIndex === 0;
      nextButton.disabled = currentIndex === WORDS.length - 1;

      // 단어가 바뀌면 새로운 퀴즈를 만듭니다.
      makeQuiz();
    }

    // 현재 단어의 퀴즈를 만드는 함수입니다.
    function makeQuiz() {

      // 현재 단어를 가져옵니다.
      const currentWord = WORDS[currentIndex];

      // 현재 단어를 제외한 단어들을 가져옵니다.
      const otherWords = WORDS.filter(function (word, index) {
        return index !== currentIndex;
      });

      // 다른 단어들을 무작위로 섞습니다.
      const shuffledWords = [...otherWords].sort(function () {
        return Math.random() - 0.5;
      });

      // 오답 3개를 가져옵니다.
      const wrongWords = shuffledWords.slice(0, 3);

      // 정답 1개와 오답 3개를 합칩니다.
      const choices = [currentWord, ...wrongWords];

      // 보기 순서를 다시 무작위로 섞습니다.
      choices.sort(function () {
        return Math.random() - 0.5;
      });

      // 이전 퀴즈 보기를 지웁니다.
      quizOptions.innerHTML = '';

      // 보기마다 버튼을 만듭니다.
      choices.forEach(function (choice) {

        // 새로운 버튼을 만듭니다.
        const button = document.createElement('button');

        // 퀴즈 버튼용 클래스를 붙입니다.
        button.className = 'quiz-option';

        // 버튼에 뜻을 표시합니다.
        button.textContent = choice.ko;

        // 버튼을 눌렀을 때 실행합니다.
        button.addEventListener('click', function () {

          // 모든 보기 버튼을 가져옵니다.
          const allButtons = quizOptions.querySelectorAll('.quiz-option');

          // 모든 보기 버튼을 다시 누르지 못하게 합니다.
          allButtons.forEach(function (item) {
            item.disabled = true;
          });

          // 정답을 선택했는지 확인합니다.
          if (choice.en === currentWord.en) {

            // 선택한 정답을 초록색으로 표시합니다.
            button.classList.add('correct');

            // 맞은 개수를 하나 늘립니다.
            correctCount++;

          } else {

            // 선택한 오답을 흐리게 표시합니다.
            button.classList.add('wrong');

            // 실제 정답을 초록색으로 표시합니다.
            allButtons.forEach(function (item) {
              if (item.textContent === currentWord.ko) {
                item.classList.add('correct');
              }
            });

            // 틀린 개수를 하나 늘립니다.
            wrongCount++;
          }

          // 맞은 개수를 화면에 표시합니다.
          correctCountElement.textContent = correctCount;

          // 틀린 개수를 화면에 표시합니다.
          wrongCountElement.textContent = wrongCount;
        });

        // 만든 버튼을 퀴즈 영역에 넣습니다.
        quizOptions.appendChild(button);
      });
    }

    // 카드를 누르면 앞면과 뒷면이 바뀝니다.
    card.addEventListener('click', function () {
      card.classList.toggle('flipped');
    });

    // 이전 버튼을 누르면 실행됩니다.
    prevButton.addEventListener('click', function () {
      if (currentIndex > 0) {
        currentIndex--;
        showWord();
      }
    });

    // 다음 버튼을 누르면 실행됩니다.
    nextButton.addEventListener('click', function () {
      if (currentIndex < WORDS.length - 1) {
        currentIndex++;
        showWord();
      }
    });

    // 페이지가 처음 열릴 때 첫 번째 단어를 보여줍니다.
    showWord();
  </script>
</body>
</html>
