<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>영어 단어장 플래시카드</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #a8c0ff 0%, #3f2b96 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app-container {
      background-color: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 420px;
      padding: 30px 20px;
      text-align: center;
      position: relative;
    }

    .title {
      color: #333333;
      font-size: 24px;
      margin-bottom: 10px;
    }

    .progress {
      font-size: 16px;
      color: #666666;
      margin-bottom: 20px;
      font-weight: bold;
    }

    .card-container {
      perspective: 1000px;
      width: 100%;
      height: 280px;
      margin-bottom: 25px;
      cursor: pointer;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 15px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 25px 20px;
      border: 2px solid #e0e0e0;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      overflow-y: auto;
    }

    .card-front {
      background-color: #f8f9fa;
      color: #2b2d42;
    }

    .card-back {
      background-color: #eef2ff;
      color: #1d3557;
      transform: rotateY(180deg);
    }

    .speaker-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background-color: #ffffff;
      border: 2px solid #4361ee;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s, background-color 0.2s;
      z-index: 10;
    }

    .speaker-btn:hover {
      background-color: #e8edff;
      transform: scale(1.1);
    }

    .speaker-btn:active {
      transform: scale(0.95);
    }

    .word-en {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 10px;
      word-break: break-all;
      line-height: 1.2;
      max-width: 100%;
    }

    .hint {
      font-size: 13px;
      color: #888888;
      margin-top: 5px;
    }

    .word-ko {
      font-size: 20px;
      font-weight: bold;
      color: #ef233c;
      margin-bottom: 10px;
      word-break: keep-all;
      line-height: 1.4;
      max-width: 100%;
    }

    .word-ex {
      font-size: 14px;
      color: #4a5568;
      font-style: italic;
      word-break: keep-all;
      margin-top: 5px;
      display: none;
    }

    .nav-buttons {
      display: flex;
      justify-content: space-between;
      gap: 15px;
    }

    .btn {
      flex: 1;
      padding: 12px 0;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background-color: #4361ee;
      color: #ffffff;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn:hover {
      background-color: #3a0ca3;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
      transform: none;
    }

    .quiz-container {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid #e0e0e0;
      text-align: center;
    }

    .quiz-title {
      font-size: 16px;
      font-weight: bold;
      color: #333;
      margin-bottom: 12px;
    }

    .quiz-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 15px;
    }

    .quiz-btn {
      padding: 10px 8px;
      font-size: 13px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      background-color: #ffffff;
      color: #333;
      cursor: pointer;
      word-break: keep-all;
      transition: all 0.2s;
    }

    .quiz-btn:hover:not(:disabled) {
      border-color: #4361ee;
      background-color: #f8f9fa;
    }

    .quiz-score {
      font-size: 14px;
      color: #666;
      font-weight: bold;
    }

    /* 알림 메시지 모달 토스트 */
    .toast {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(0,0,0,0.8);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      display: none;
      z-index: 100;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <h1 class="title">매일 영어 단어장</h1>
    <div class="progress" id="progress">1 / 10</div>

    <div class="card-container" id="cardContainer">
      <div class="card" id="card">
        <div class="card-face card-front">
          <button class="speaker-btn" id="speakerBtn" title="발음 듣기">🔊</button>
          <div class="word-en" id="wordEn">happy</div>
          <div class="hint">💡 카드를 누르면 뜻이 보여요!</div>
        </div>
        <div class="card-face card-back">
          <div class="word-ko" id="wordKo">행복</div>
          <div class="word-ex" id="wordEx"></div>
        </div>
      </div>
    </div>

    <div class="nav-buttons">
      <button class="btn" id="prevBtn">이전</button>
      <button class="btn" id="nextBtn">다음</button>
    </div>

    <div class="quiz-container">
      <div class="quiz-title">이 단어의 뜻은?</div>
      <div class="quiz-options" id="quizOptions"></div>
      <div class="quiz-score">
        맞은 개수: <span id="correctCount" style="color: #2e7d32;">0</span> | 
        틀린 개수: <span id="wrongCount" style="color: #c62828;">0</span>
      </div>
    </div>

    <div id="toast" class="toast"></div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const WORDS = [
        { en:'happy', ko:'행복', ex:'' },
        { en:'sad', ko:'슬픔', ex:'' },
        { en:'angry', ko:'화남', ex:'' },
        { en:'pass', ko:'통과', ex:'' },
        { en:'industry', ko:'산업', ex:'' },
        { en:'factory', ko:'공장', ex:'' },
        { en:'human', ko:'사람', ex:'' },
        { en:'Pneumonoultramicroscopicsilicovolcanoconiosis', ko:'폐 질환의 일종', ex:'' },
        { en:'Supercalifragilisticexpialidocious', ko:'매우 매우 좋은', ex:'' },
        { en:'thyroparathyroidectomized', ko:'갑상선 및 부갑상선 절제', ex:'' }
      ];

      let currentIndex = 0;
      let currentUtterance = null;

      let correctCount = 0;
      let wrongCount = 0;

      const card = document.getElementById('card');
      const cardContainer = document.getElementById('cardContainer');
      const wordEnElement = document.getElementById('wordEn');
      const wordKoElement = document.getElementById('wordKo');
      const wordExElement = document.getElementById('wordEx');
      const progressElement = document.getElementById('progress');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const speakerBtn = document.getElementById('speakerBtn');
      const quizOptionsElement = document.getElementById('quizOptions');
      const correctCountElement = document.getElementById('correctCount');
      const wrongCountElement = document.getElementById('wrongCount');
      const toastElement = document.getElementById('toast');

      function showToast(message) {
        if (!toastElement) return;
        toastElement.textContent = message;
        toastElement.style.display = 'block';
        setTimeout(() => {
          toastElement.style.display = 'none';
        }, 2000);
      }

      function renderQuiz() {
        if (!quizOptionsElement) return;
        quizOptionsElement.innerHTML = '';
        const currentWord = WORDS[currentIndex];

        // 현재 단어를 제외한 다른 오답 선택지 추출
        const otherWords = WORDS.filter((_, idx) => idx !== currentIndex);
        const shuffledOthers = [...otherWords].sort(() => 0.5 - Math.random());
        const wrongChoices = shuffledOthers.slice(0, 3).map(w => w.ko);

        // 정답과 오답을 랜덤 믹스
        const choices = [currentWord.ko, ...wrongChoices].sort(() => 0.5 - Math.random());

        choices.forEach(choice => {
          const btn = document.createElement('button');
          btn.className = 'quiz-btn';
          btn.textContent = choice;

          btn.addEventListener('click', () => {
            const allBtns = quizOptionsElement.querySelectorAll('.quiz-btn');
            
            allBtns.forEach(b => {
              b.disabled = true;
              if (b.textContent === currentWord.ko) {
                b.style.backgroundColor = '#4CAF50';
                b.style.color = '#ffffff';
                b.style.borderColor = '#4CAF50';
              } else {
                b.style.opacity = '0.3';
              }
            });

            if (choice === currentWord.ko) {
              correctCount++;
              correctCountElement.textContent = correctCount;
            } else {
              wrongCount++;
              wrongCountElement.textContent = wrongCount;
            }
          });

          quizOptionsElement.appendChild(btn);
        });
      }

      function adjustFontSize(element, text, defaultSize) {
        if (text.length > 30) {
          element.style.fontSize = (defaultSize * 0.55) + 'px';
        } else if (text.length > 15) {
          element.style.fontSize = (defaultSize * 0.75) + 'px';
        } else {
          element.style.fontSize = defaultSize + 'px';
        }
      }

      function updateCard() {
        card.classList.remove('flipped');
        
        setTimeout(() => {
          const currentWord = WORDS[currentIndex];
          
          wordEnElement.textContent = currentWord.en;
          adjustFontSize(wordEnElement, currentWord.en, 28);

          wordKoElement.textContent = currentWord.ko;
          adjustFontSize(wordKoElement, currentWord.ko, 20);

          if (currentWord.ex && currentWord.ex.trim() !== '') {
            wordExElement.textContent = currentWord.ex;
            wordExElement.style.display = 'block';
          } else {
            wordExElement.textContent = '';
            wordExElement.style.display = 'none';
          }

          progressElement.textContent = `${currentIndex + 1} / ${WORDS.length}`;
          
          prevBtn.disabled = (currentIndex === 0);
          nextBtn.disabled = (currentIndex === WORDS.length - 1);

          renderQuiz();
        }, 150);
      }

      function speakWord(event) {
        event.stopPropagation();

        if (!('speechSynthesis' in window)) {
          showToast('이 브라우저는 소리를 지원하지 않아요');
          return;
        }

        try {
          window.speechSynthesis.cancel();

          const wordText = WORDS[currentIndex].en;
          currentUtterance = new SpeechSynthesisUtterance(wordText);
          currentUtterance.lang = 'en-US';
          currentUtterance.rate = 0.8;

          currentUtterance.onerror = function() {
            window.speechSynthesis.cancel();
          };

          window.speechSynthesis.speak(currentUtterance);
        } catch (e) {
          console.error('Speech Synthesis Error:', e);
        }
      }

      speakerBtn.addEventListener('click', speakWord);

      cardContainer.addEventListener('click', () => {
        card.classList.toggle('flipped');
      });

      prevBtn.addEventListener('click', () => {
        if (currentIndex > 0) {
          currentIndex--;
          updateCard();
        }
      });

      nextBtn.addEventListener('click', () => {
        if (currentIndex < WORDS.length - 1) {
          currentIndex++;
          updateCard();
        }
      });

      // 최초 실행
      updateCard();
    });
  </script>
</body>
</html>
