<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏠 부동산 타이쿤 & 뽑기</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Jua&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #1a1a2e;
            --card-bg: #16213e;
            --accent-color: #ff4a5a;
            --gold-color: #ffd700;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Jua', 'Fredoka', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .header-status {
            width: 100%;
            max-width: 500px;
            background: #0f3460;
            padding: 16px 24px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            border: 2px solid rgba(255, 215, 0, 0.3);
        }

        .money-display {
            font-size: 1.4rem;
            color: var(--gold-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
            border: 3px solid rgba(255,255,255,0.08);
            text-align: center;
        }

        /* 탭 버튼 */
        .tab-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 20px;
        }

        .tab-btn {
            padding: 10px 4px;
            background: #0f3460;
            border: none;
            color: #fff;
            font-size: 0.95rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--accent-color);
            font-weight: bold;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* 클릭 돈벌기 영역 */
        .click-area {
            background: radial-gradient(circle, #0f3460 0%, #16213e 100%);
            border-radius: 50%;
            width: 170px;
            height: 170px;
            margin: 16px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4.8rem;
            cursor: pointer;
            border: 4px solid var(--gold-color);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
            transition: transform 0.05s;
        }

        .click-area:active {
            transform: scale(0.92);
        }

        /* 업그레이드 리스트 */
        .upgrade-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 380px;
            overflow-y: auto;
        }

        .upgrade-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: left;
        }

        .upgrade-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .upgrade-icon {
            font-size: 2.2rem;
        }

        .upgrade-title {
            font-size: 1.05rem;
            color: #fff;
        }

        .upgrade-desc {
            font-size: 0.85rem;
            color: #a0a5c0;
        }

        .btn-upgrade {
            background: #ff7b54;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .btn-upgrade:disabled {
            background: #4a4e69;
            cursor: not-allowed;
            opacity: 0.6;
        }

        /* 뽑기 영역 */
        .gacha-machine {
            width: 150px;
            height: 150px;
            margin: 0 auto 16px;
            background: radial-gradient(circle, #0f3460 0%, #16213e 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 5px solid var(--gold-color);
            font-size: 4rem;
        }

        .shake {
            animation: gachaShake 0.6s infinite;
        }

        @keyframes gachaShake {
            0% { transform: rotate(0deg) scale(1); }
            20% { transform: rotate(-12deg) scale(1.05); }
            40% { transform: rotate(12deg) scale(1.05); }
            60% { transform: rotate(-12deg) scale(1.05); }
            80% { transform: rotate(12deg) scale(1.05); }
            100% { transform: rotate(0deg) scale(1); }
        }

        .btn-action {
            background: linear-gradient(135deg, #ff4a5a, #ff7b54);
            color: white;
            border: none;
            padding: 14px 30px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 74, 90, 0.4);
            transition: all 0.2s ease;
            width: 100%;
            margin-top: 10px;
        }

        .btn-action:disabled {
            background: #4a4e69;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* 결과 카드 */
        .result-card {
            display: none;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 16px;
            margin-top: 16px;
            border: 2px solid transparent;
        }

        /* 등급 스타일 */
        .grade-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .grade-UR { background: #ffe600; color: #000; box-shadow: 0 0 10px #ffe600; }
        .grade-SSR { background: #ff0055; color: #fff; box-shadow: 0 0 10px #ff0055; }
        .grade-SR { background: #a855f7; color: #fff; }
        .grade-R { background: #3b82f6; color: #fff; }
        .grade-N { background: #6b7280; color: #fff; }

        /* 가방(인벤토리) GRID */
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            max-height: 380px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .inv-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }

        .inv-item.locked {
            opacity: 0.3;
            filter: grayscale(1);
        }

        .inv-emoji {
            font-size: 2.3rem;
            margin-bottom: 4px;
        }

        .inv-name {
            font-size: 0.9rem;
            margin-bottom: 4px;
        }

        /* float 클릭 텍스트 효과 */
        .floating-text {
            position: absolute;
            color: var(--gold-color);
            font-weight: bold;
            font-size: 1.4rem;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-40px); }
        }
    </style>
</head>
<body>

    <div class="header-status">
        <div>소지금</div>
        <div class="money-display">💰 <span id="money">0</span> 원</div>
    </div>

    <div class="container">
        <!-- 탭 메뉴 -->
        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchTab(event, 'clicker')">🔨 일하기</button>
            <button class="tab-btn" onclick="switchTab(event, 'upgrade')">⚡ 강화</button>
            <button class="tab-btn" onclick="switchTab(event, 'gacha')">🎁 뽑기</button>
            <button class="tab-btn" onclick="switchTab(event, 'inventory')">🎒 가방</button>
        </div>

        <!-- Tab 1: 클릭 돈벌기 -->
        <div id="clicker" class="tab-content active">
            <h2>노동으로 돈 벌기</h2>
            <p style="color: #a0a5c0; margin-top: 6px;">열심히 클릭해서 건축 자금을 모으세요!</p>
            <div class="click-area" id="clickTarget" onclick="clickMoney(event)">
                ⛏️
            </div>
            <p>클릭당 <strong id="clickValueText">+200,000원</strong> 획득!</p>
            <p style="font-size: 0.85rem; color: #8d99ae; margin-top: 4px;">초당 자동 수입: <span id="cpsText">0</span>원/초</p>
        </div>

        <!-- Tab 2: 업그레이드 -->
        <div id="upgrade" class="tab-content">
            <h2>수입 강화 및 자동화</h2>
            <p style="color: #a0a5c0; margin-bottom: 16px; font-size: 0.9rem;">도구를 업그레이드하거나 알바생을 고용하세요.</p>
            <div class="upgrade-list" id="upgradeList">
                <!-- 자바스크립트로 동적 생성 -->
            </div>
        </div>

        <!-- Tab 3: 집 뽑기 -->
        <div id="gacha" class="tab-content">
            <h2>부동산 랜덤 뽑기</h2>
            <p style="color: #a0a5c0; margin-top: 6px; margin-bottom: 16px;">1회 뽑기 비용: <strong>5,000,000원</strong></p>

            <div class="gacha-machine" id="gachaBox">
                <span id="gachaIcon">🎁</span>
            </div>

            <button class="btn-action" id="drawBtn" onclick="drawHouse()">5,000,000원에 뽑기</button>

            <div class="result-card" id="resultCard">
                <div class="grade-badge" id="gradeBadge">등급</div>
                <div style="font-size: 3rem;" id="houseEmoji">🏠</div>
                <div style="font-size: 1.3rem; margin: 4px 0;" id="houseName">집 이름</div>
                <div style="font-size: 0.85rem; color: #b8c1ec;" id="houseDesc">설명</div>
            </div>
        </div>

        <!-- Tab 4: 내 가방 -->
        <div id="inventory" class="tab-content">
            <h2>수집한 집 목록 (<span id="collectedCount">0</span>/<span id="totalHouseCount">0</span>)</h2>
            <p style="color: #a0a5c0; margin-bottom: 16px; font-size: 0.85rem;">중복 획득 시 50% 가격으로 자동 판매됩니다.</p>
            <div class="inventory-grid" id="invGrid">
                <!-- 자바스크립트로 동적 생성 -->
            </div>
        </div>
    </div>

    <script>
        // 기본 스탯 데이터
        let money = 2000000;
        let clickPower = 200000;
        const DRAW_COST = 5000000;
        let ownedHouses = new Set();

        // 업그레이드 항목 데이터
        const upgrades = [
            { id: 'click1', name: '단단한 장갑', icon: '🧤', type: 'click', power: 100000, level: 0, cost: 500000, costMultiplier: 1.5, desc: '클릭 수입 +100,000원' },
            { id: 'click2', name: '강철 곡괭이', icon: '⛏️', type: 'click', power: 500000, level: 0, cost: 3000000, costMultiplier: 1.6, desc: '클릭 수입 +500,000원' },
            { id: 'auto1', name: '일용직 알바 고용', icon: '👷', type: 'auto', power: 50000, level: 0, cost: 1000000, costMultiplier: 1.4, desc: '초당 자동 수입 +50,000원' },
            { id: 'auto2', name: '자동 굴착 로봇', icon: '🤖', type: 'auto', power: 300000, level: 0, cost: 8000000, costMultiplier: 1.5, desc: '초당 자동 수입 +300,000원' }
        ];

        // 총 20종 집 데이터 베이스
        const houses = [
            // UR ( 신급 - 총 3종, 총확률 5% )
            { id: 1, grade: 'UR', name: '공중 부유 천상 궁전', emoji: '🏰', desc: '구름 위에 떠 있는 초현실 대저택.', prob: 2, sellPrice: 50000000 },
            { id: 2, grade: 'UR', name: '해저 아틀란티스 빌라', emoji: '🔱', desc: '창밖으로 인어가 헤엄치는 해저 저택.', prob: 1.5, sellPrice: 45000000 },
            { id: 3, grade: 'UR', name: '우주 궤도 정거장 펜트하우스', emoji: '🪐', desc: '지구를 한눈에 내려다보는 무중력 대저택.', prob: 1.5, sellPrice: 60000000 },

            // SSR ( 전설 - 총 4종 (+1추가), 총확률 10% )
            { id: 4, grade: 'SSR', name: '超화려 펜트하우스', emoji: '🏢', desc: '도시 야경이 한눈에 보이는 100층 높이 펜트하우스.', prob: 2.5, sellPrice: 20000000 },
            { id: 5, grade: 'SSR', name: 'SF 우주선 하우스', emoji: '🛸', desc: '우주 탐사가 가능한 미래형 주택.', prob: 2.5, sellPrice: 20000000 },
            { id: 6, grade: 'SSR', name: '용암 리조트 대저택', emoji: '🌋', desc: '화산 지열을 최대로 활용한 프라이빗 대저택.', prob: 2.5, sellPrice: 25000000 },
            { id: 7, grade: 'SSR', name: '고딕 양식 고성 저택', emoji: '🏰', desc: '수백 년의 역사를 간직한 웅장하고 신비로운 고성.', prob: 2.5, sellPrice: 28000000 },

            // SR ( 희귀 - 총 3종, 총확률 20% )
            { id: 8, grade: 'SR', name: '풀장 있는 프라이빗 리조트', emoji: '🏊‍♂️', desc: '사계절 온수 풀을 이용할 수 있는 저택.', prob: 7, sellPrice: 10000000 },
            { id: 9, grade: 'SR', name: '숲속 울창한 통나무집', emoji: '🏡', desc: '힐링 감성이 가득한 고급 목조 저택.', prob: 7, sellPrice: 8000000 },
            { id: 10, grade: 'SR', name: '버섯 요정 마을 주택', emoji: '🍄', desc: '동화 속 신비로운 이끼와 버섯 모양 주택.', prob: 6, sellPrice: 9000000 },

            // R ( 고급 - 총 5종 (+2추가), 총확률 35% )
            { id: 11, grade: 'R', name: '신축 테라스 아파트', emoji: '🏢', desc: '역세권 3분 거리! 깔끔한 신축 아파트.', prob: 7, sellPrice: 5000000 },
            { id: 12, grade: 'R', name: '감성 한옥 다락방', emoji: '🏯', desc: '고즈넉한 마당과 툇마루가 돋보이는 한옥.', prob: 7, sellPrice: 4000000 },
            { id: 13, grade: 'R', name: '플로팅 하우스보트', emoji: '⛵', desc: '강 위를 여유롭게 떠다니는 감성 주택.', prob: 7, sellPrice: 4500000 },
            { id: 14, grade: 'R', name: '감성 모로칸 리조트', emoji: '🕌', desc: '이국적인 인테리어와 수영장이 돋보이는 저택.', prob: 7, sellPrice: 4800000 },
            { id: 15, grade: 'R', name: '숲속 트리하우스', emoji: '🌲', desc: '거대한 나무 위에 지어진 아늑한 자연 속 집.', prob: 7, sellPrice: 4200000 },

            // N ( 일반 - 총 5종 (+2추가), 총확률 30% )
            { id: 16, grade: 'N', name: '소박한 원룸 옥탑방', emoji: '🏠', desc: '여름엔 덥고 겨울엔 춥지만 감성 있는 옥탑방.', prob: 6, sellPrice: 2000000 },
            { id: 17, grade: 'N', name: '종이 상자 아지트', emoji: '📦', desc: '친환경(?) 이동식 스위트룸.', prob: 6, sellPrice: 1000000 },
            { id: 18, grade: 'N', name: '캠핑 텐트 스위트룸', emoji: '⛺', desc: '자연과 하나 되는 아늑한 야외 텐트.', prob: 6, sellPrice: 1500000 },
            { id: 19, grade: 'N', name: '캠핑 트레일러 하우스', emoji: '🚐', desc: '어디든 이동할 수 있는 미니 캠핑 카라반.', prob: 6, sellPrice: 1800000 },
            { id: 20, grade: 'N', name: '프리미엄 흙집 다락방', emoji: '🛖', desc: '자연 친화적 황토로 지어진 소박하고 아늑한 방.', prob: 6, sellPrice: 1200000 }
        ];

        function getCPS() {
            return upgrades
                .filter(u => u.type === 'auto')
                .reduce((total, u) => total + (u.power * u.level), 0);
        }

        function updateUI() {
            document.getElementById('money').textContent = Math.floor(money).toLocaleString();
            document.getElementById('clickValueText').textContent = `+${clickPower.toLocaleString()}원`;
            document.getElementById('cpsText').textContent = getCPS().toLocaleString();
            document.getElementById('collectedCount').textContent = ownedHouses.size;
            document.getElementById('totalHouseCount').textContent = houses.length;
            renderUpgrades();
            renderInventory();
        }

        function switchTab(evt, tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            evt.currentTarget.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        function clickMoney(e) {
            money += clickPower;
            updateUI();

            const floatText = document.createElement('div');
            floatText.className = 'floating-text';
            floatText.textContent = `+${clickPower.toLocaleString()}원`;
            floatText.style.left = `${e.clientX - 40}px`;
            floatText.style.top = `${e.clientY - 20}px`;
            document.body.appendChild(floatText);

            setTimeout(() => floatText.remove(), 800);
        }

        function buyUpgrade(index) {
            const up = upgrades[index];
            if (money >= up.cost) {
                money -= up.cost;
                up.level++;
                up.cost = Math.floor(up.cost * up.costMultiplier);

                if (up.type === 'click') {
                    clickPower += up.power;
                }

                updateUI();
            }
        }

        function renderUpgrades() {
            const list = document.getElementById('upgradeList');
            list.innerHTML = '';

            upgrades.forEach((up, idx) => {
                const item = document.createElement('div');
                item.className = 'upgrade-item';
                const canAfford = money >= up.cost;

                item.innerHTML = `
                    <div class="upgrade-info">
                        <div class="upgrade-icon">${up.icon}</div>
                        <div>
                            <div class="upgrade-title">${up.name} <span style="color:#ffd700; font-size:0.9rem;">(Lv.${up.level})</span></div>
                            <div class="upgrade-desc">${up.desc}</div>
                        </div>
                    </div>
                    <button class="btn-upgrade" ${canAfford ? '' : 'disabled'} onclick="buyUpgrade(${idx})">
                        ${up.cost.toLocaleString()}원
                    </button>
                `;
                list.appendChild(item);
            });
        }

        function getRandomHouse() {
            const rand = Math.random() * 100;
            let cumulative = 0;
            
            for (let house of houses) {
                cumulative += house.prob;
                if (rand <= cumulative) return house;
            }
            return houses[houses.length - 1];
        }

        let isSpinning = false;
        function drawHouse() {
            if (isSpinning) return;
            if (money < DRAW_COST) {
                alert('돈이 부족합니다! [🔨 일하기] 또는 [⚡ 강화]를 통해 돈을 더 모으세요.');
                return;
            }

            money -= DRAW_COST;
            updateUI();
            isSpinning = true;

            const gachaBox = document.getElementById('gachaBox');
            const gachaIcon = document.getElementById('gachaIcon');
            const drawBtn = document.getElementById('drawBtn');
            const resultCard = document.getElementById('resultCard');

            drawBtn.disabled = true;
            resultCard.style.display = 'none';
            gachaBox.classList.add('shake');
            gachaIcon.textContent = '🎰';

            setTimeout(() => {
                gachaBox.classList.remove('shake');
                
                const house = getRandomHouse();
                const isDuplicate = ownedHouses.has(house.id);
                
                ownedHouses.add(house.id);

                const badge = document.getElementById('gradeBadge');
                badge.textContent = `[${house.grade}]`;
                badge.className = `grade-badge grade-${house.grade}`;

                document.getElementById('houseEmoji').textContent = house.emoji;
                
                if (isDuplicate) {
                    money += house.sellPrice;
                    document.getElementById('houseName').textContent = `${house.name} (중복!)`;
                    document.getElementById('houseDesc').textContent = `이미 보유한 집입니다. 중복 판매되어 +${house.sellPrice.toLocaleString()}원 환급!`;
                } else {
                    document.getElementById('houseName').textContent = house.name;
                    document.getElementById('houseDesc').textContent = `${house.desc} (가방에 추가됨!)`;
                }

                resultCard.style.borderColor = getGradeColor(house.grade);
                resultCard.style.display = 'block';
                gachaIcon.textContent = house.emoji;

                drawBtn.disabled = false;
                isSpinning = false;
                updateUI();
            }, 1000);
        }

        function renderInventory() {
            const grid = document.getElementById('invGrid');
            grid.innerHTML = '';

            houses.forEach(house => {
                const isOwned = ownedHouses.has(house.id);
                const item = document.createElement('div');
                item.className = `inv-item ${isOwned ? '' : 'locked'}`;

                item.innerHTML = `
                    <div class="grade-badge grade-${house.grade}">${house.grade}</div>
                    <div class="inv-emoji">${isOwned ? house.emoji : '❓'}</div>
                    <div class="inv-name">${isOwned ? house.name : '미획득'}</div>
                `;
                grid.appendChild(item);
            });
        }

        function getGradeColor(grade) {
            switch(grade) {
                case 'UR': return '#ffe600';
                case 'SSR': return '#ff0055';
                case 'SR': return '#a855f7';
                case 'R': return '#3b82f6';
                default: return '#6b7280';
            }
        }

        setInterval(() => {
            const cps = getCPS();
            if (cps > 0) {
                money += cps;
                updateUI();
            }
        }, 1000);

        updateUI();
    </script>
</body>
</html>
