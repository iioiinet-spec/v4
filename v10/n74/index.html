<!DOCTYPE html> <!-- HTML5 문서 선언 -->
<html lang="ko"> <!-- 문서 언어를 한국어로 설정 -->
<head> <!-- 문서 설정 시작 -->
  <meta charset="UTF-8"> <!-- 한글 인코딩 설정 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 모바일 화면 대응 -->
  <title>영어 단어 카드</title> <!-- 브라우저 제목 설정 -->

  <!-- 나눔손글씨 폰트 추가 -->
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">

  <style> /* CSS 스타일 시작 */
    :root {
      --배경색: #151414;        /* 화면 전체 배경 */
      --카드색상: #ffffff;      /* 카드 및 컨테이너 배경 */
      --글자색: #000000;        /* 기본 글자색 */
      --포인트색: #000000;      /* 강조 및 테두리 색 */
      --보조글자색: #555555;    /* 부가 설명 및 회색 텍스트 */
    }

    * { box-sizing: border-box; } /* 모든 요소의 크기 계산 통일 */

    body { /* 전체 페이지 스타일 */
      margin: 0; /* 기본 바깥 여백 제거 */
      min-height: 100vh; /* 화면 높이 전체 사용 */
      display: flex; /* 중앙 정렬을 위한 플렉스 설정 */
      justify-content: center; /* 가로 중앙 정렬 */
      align-items: center; /* 세로 중앙 정렬 */
      background: var(--배경색); /* 다크 배경 */
      font-family: 'Nanum Pen Script', cursive, Arial, sans-serif; /* 나눔손글씨 적용 */
      color: var(--글자색); /* 기본 글자색 설정 */
      padding: 20px 0; /* 상하 여백 추가 */
    } /* 전체 페이지 스타일 끝 */

    .container { /* 카드 전체 영역 */
      width: 90%; /* 화면 너비의 90% 사용 */
      max-width: 480px; /* 최대 너비 제한 */
      text-align: center; /* 내부 텍스트 중앙 정렬 */
    } /* 카드 전체 영역 끝 */

    h1 { /* 제목 스타일 */
      font-size: 38px; /* 손글씨 크기 감안하여 확대 */
      margin-bottom: 10px; /* 아래쪽 여백 */
      color: #ffffff; /* 다크 모드용 흰색 제목 */
    } /* 제목 스타일 끝 */

    .description { /* 안내 문구 스타일 */
      color: #a1a1aa; /* 어두운 배경에 맞는 밝은 회색 */
      margin-bottom: 30px; /* 아래쪽 여백 */
      font-size: 20px;
    } /* 안내 문구 스타일 끝 */

    .progress-info { /* 진도 표시 영역 */
      display: flex; /* 가로 방향 배치 */
      justify-content: space-between; /* 양쪽 끝으로 배치 */
      margin-bottom: 10px; /* 아래쪽 여백 */
      font-size: 18px; /* 글자 크기 */
      font-weight: bold; /* 글자 굵게 */
      color: #ffffff;
    } /* 진도 표시 영역 끝 */

    .progress-bar { /* 진행률 배경 막대 */
      height: 8px; /* 막대 높이 */
      background: #27272a; /* 막대 배경색 */
      border-radius: 20px; /* 둥근 모서리 */
      overflow: hidden; /* 내부 넘침 숨김 */
      margin-bottom: 25px; /* 아래쪽 여백 */
    } /* 진행률 배경 막대 끝 */

    .progress-fill { /* 실제 진행률 막대 */
      height: 100%; /* 부모 높이만큼 채우기 */
      width: 0%; /* 초기 진행률 */
      background: #ffffff; /* 흰색 진행률 */
      transition: width 0.3s; /* 부드러운 진행 애니메이션 */
    } /* 실제 진행률 막대 끝 */

    .card { /* 영어 단어 카드 */
      width: 100%; /* 부모 너비에 맞춤 */
      min-height: 270px; /* 카드 최소 높이 */
      background: var(--카드색상); /* 흰색 배경 */
      border-radius: 36px; /* 둥근 모서리 36px 적용 */
      box-shadow: 0 10px 30px rgba(0,0,0,0.3); /* 그림자 진하게 수정 */
      display: flex; /* 내부 요소 배치 */
      flex-direction: column; /* 세로 방향 정렬 */
      justify-content: center; /* 세로 중앙 정렬 */
      align-items: center; /* 가로 중앙 정렬 */
      padding: 30px; /* 내부 여백 */
      cursor: pointer; /* 마우스 포인터 변경 */
      transition: transform 0.2s; /* 변환 애니메이션 */
      user-select: none; /* 텍스트 선택 방지 */
    } /* 영어 단어 카드 끝 */

    .card:active { transform: scale(0.98); } /* 클릭할 때 살짝 축소 */

    .card-label { /* 카드 안내 문구 */
      font-size: 16px; /* 작은 글자 크기 */
      color: var(--보조글자색); /* 연한 회색 */
      margin-bottom: 20px; /* 아래쪽 여백 */
    } /* 카드 안내 문구 끝 */

    .word { /* 영어 단어 */
      font-size: 52px; /* 손글씨 감안하여 크기 조정 */
      font-weight: bold; /* 굵은 글씨 */
      color: var(--포인트색); /* 포인트색 */
      margin-bottom: 15px; /* 아래쪽 여백 */
    } /* 영어 단어 끝 */

    .meaning { /* 한국어 뜻 */
      font-size: 38px; /* 뜻 글자 크기 */
      font-weight: bold; /* 굵은 글씨 */
      margin-bottom: 20px; /* 아래쪽 여백 */
      color: var(--글자색);
    } /* 한국어 뜻 끝 */

    .example { /* 영어 예문 */
      font-size: 24px; /* 예문 글자 크기 */
      color: var(--보조글자색); /* 회색 글자색 */
      line-height: 1.4; /* 줄 간격 */
    } /* 영어 예문 끝 */

    .hidden { display: none; } /* 요소 숨기기 */

    .hint { /* 카드 클릭 안내 */
      font-size: 18px; /* 작은 글씨 */
      color: #a1a1aa; /* 연한 회색 */
      margin-top: 15px; /* 위쪽 여백 */
    } /* 카드 클릭 안내 끝 */

    .speak-btn { /* 스피커 버튼 스타일 */
      width: 100%;
      background: var(--카드색상);
      color: var(--글자색);
      font-size: 20px;
      padding: 12px;
      border-radius: 36px; /* 카드와 통일감 있게 둥글게 */
      border: 2px solid var(--포인트색);
      cursor: pointer;
      margin-top: 15px;
      font-weight: bold;
      transition: background 0.2s;
      font-family: inherit;
    }
    .speak-btn:hover { background: #f4f4f5; }

    /* 퀴즈 스타일 추가 */
    .quiz-container { margin-top: 20px; background: var(--카드색상); padding: 20px; border-radius: 36px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); text-align: left; }
    .quiz-title { font-size: 20px; font-weight: bold; margin-bottom: 6px; color: var(--글자색); }
    .quiz-score { font-size: 18px; color: var(--보조글자색); margin-bottom: 12px; }
    .quiz-choices { display: flex; flex-direction: column; gap: 8px; }
    .quiz-btn { padding: 12px; border: 2px solid #e4e4e7; border-radius: 20px; background: #fafafa; font-size: 20px; text-align: left; cursor: pointer; transition: 0.2s; color: var(--글자색); font-family: inherit; }
    .quiz-btn:hover:not(:disabled) { background: #f4f4f5; }
    .quiz-btn.correct { background: #dcfce7 !important; border-color: #22c55e !important; color: #166534; font-weight: bold; }
    .quiz-btn.wrong { background: #fee2e2 !important; border-color: #ef4444 !important; color: #991b1b; opacity: 0.6; }
    .quiz-btn:disabled { cursor: default; }

    .buttons { /* 버튼 영역 */
      display: flex; /* 가로 방향 배치 */
      gap: 12px; /* 버튼 사이 간격 */
      margin-top: 20px; /* 위쪽 여백 */
    } /* 버튼 영역 끝 */

    button { /* 공통 버튼 스타일 */
      flex: 1; /* 동일한 너비로 설정 */
      padding: 15px; /* 내부 여백 */
      border: 2px solid var(--포인트색); /* 테두리 추가 */
      border-radius: 24px; /* 둥근 모서리 */
      font-size: 20px; /* 글자 크기 */
      font-weight: bold; /* 글자 굵게 */
      cursor: pointer; /* 클릭 가능한 커서 */
      font-family: inherit;
    } /* 공통 버튼 스타일 끝 */

    .prev { /* 이전 버튼 */
      background: var(--카드색상); /* 흰색 배경 */
      color: var(--글자색); /* 진한 회색 글자 */
    } /* 이전 버튼 끝 */

    .next { /* 다음 버튼 */
      background: var(--포인트색); /* 검은색 배경 */
      color: #ffffff; /* 흰색 글자 */
    } /* 다음 버튼 끝 */

    button:disabled { /* 비활성화 버튼 */
      opacity: 0.35; /* 투명도 낮추기 */
      cursor: not-allowed; /* 클릭 불가 표시 */
    } /* 비활성화 버튼 끝 */

  </style> <!-- CSS 스타일 끝 -->
</head> <!-- 문서 설정 끝 -->

<body> <!-- 화면 본문 시작 -->

  <main class="container"> <!-- 전체 콘텐츠 영역 -->

    <h1>📚 영어 단어 카드</h1> <!-- 메인 제목 -->
    <p class="description">카드를 클릭해서 영어 단어를 학습하세요!</p> <!-- 사용 안내 -->

    <div class="progress-info"> <!-- 진도 정보 영역 -->
      <span id="progressText">1 / 20</span> <!-- 현재 학습 번호 -->
      <span id="percentText">5%</span> <!-- 전체 진행률 -->
    </div> <!-- 진도 정보 영역 끝 -->

    <div class="progress-bar"> <!-- 진행률 배경 -->
      <div class="progress-fill" id="progressFill"></div> <!-- 실제 진행률 -->
    </div> <!-- 진행률 배경 끝 -->

    <div class="card" id="flashcard" onclick="flipCard()"> <!-- 클릭하면 카드 뒤집기 -->
      <div class="card-label" id="cardLabel">ENGLISH WORD</div> <!-- 카드 앞뒤 안내 -->
      <div class="word" id="word">apple</div> <!-- 영어 단어 표시 -->
      <div class="meaning hidden" id="meaning">사과</div> <!-- 한국어 뜻 표시 -->
      <div class="example hidden" id="example">I eat an apple.</div> <!-- 영어 예문 표시 -->
    </div> <!-- 카드 끝 -->

    <button class="speak-btn" id="speakBtn" onclick="speakWord()">🔊 소리내어 읽기</button>
    <div id="supportMsg" style="font-size: 16px; color: #ef4444; margin-top: 8px; display: none;">이 브라우저는 소리를 지원하지 않아요</div>

    <p class="hint">👆 카드를 클릭하면 뜻과 예문이 나타납니다.</p> <!-- 클릭 안내 -->

    <!-- 퀴즈 영역 추가 -->
    <div class="quiz-container">
      <div class="quiz-title">🎯 이 단어의 뜻은?</div>
      <div class="quiz-score">맞은 개수: <span id="correctCount">0</span> | 틀린 개수: <span id="wrongCount">0</span></div>
      <div class="quiz-choices" id="quizChoices"></div>
    </div>

    <div class="buttons"> <!-- 이전 및 다음 버튼 영역 -->
      <button class="prev" id="prevBtn" onclick="previousWord()">← 이전</button> <!-- 이전 단어 이동 -->
      <button class="next" id="nextBtn" onclick="nextWord()">다음 →</button> <!-- 다음 단어 이동 -->
    </div> <!-- 버튼 영역 끝 -->

  </main> <!-- 전체 콘텐츠 영역 끝 -->

  <script> // 자바스크립트 시작

    // ========================================== // 단어 목록 영역
    // 여기만 고치세요! 원하는 영어 단어를 추가하거나 수정하세요. // 수정 안내
    // 형식: { en:'apple', ko:'사과', ex:'I eat an apple.' } // 데이터 형식 안내
    // ========================================== // 단어 목록 구분선

    // 여기만 고치세요! 영어 단어 목록입니다.
    const WORDS = [
      { en:'accomplish', ko:'성취하다', ex:'I want to accomplish my goals.' },
      { en:'capable', ko:'할 수 있는, 유능한', ex:'She is capable of doing great things.' },
      { en:'hazy', ko:'흐릿한, 뿌연', ex:'The mountains looked hazy in the distance.' },
      { en:'nike', ko:'나이키', ex:'Nike is a popular sportswear brand.' },
      { en:'adidas', ko:'아디다스', ex:'He bought a new pair of Adidas shoes.' },
      { en:'mercedes-benz', ko:'메르세데스 벤츠', ex:'Mercedes-Benz makes luxury cars.' },
      { en:'puma', ko:'푸마', ex:'Puma makes sports shoes and clothing.' },
      { en:'samsung', ko:'삼성', ex:'Samsung is a well-known technology company.' },
      { en:'apple', ko:'애플', ex:'Apple makes popular smartphones and computers.' },
      { en:'nvidia', ko:'엔비디아', ex:'NVIDIA develops powerful graphics processors.' },
    ];

    let currentIndex = 0; // 현재 단어의 위치
    let isFlipped = false; // 카드가 뒤집혔는지 확인

    const wordEl = document.getElementById('word'); // 영어 단어 요소 가져오기
    const meaningEl = document.getElementById('meaning'); // 한국어 뜻 요소 가져오기
    const exampleEl = document.getElementById('example'); // 예문 요소 가져오기
    const cardLabelEl = document.getElementById('cardLabel'); // 카드 안내 요소 가져오기
    const progressTextEl = document.getElementById('progressText'); // 진도 표시 요소 가져오기
    const percentTextEl = document.getElementById('percentText'); // 퍼센트 표시 요소 가져오기
    const progressFillEl = document.getElementById('progressFill'); // 진행률 막대 가져오기
    const prevBtn = document.getElementById('prevBtn'); // 이전 버튼 가져오기
    const nextBtn = document.getElementById('nextBtn'); // 다음 버튼 가져오기
    const speakBtn = document.getElementById('speakBtn'); // 스피커 버튼 가져오기
    const supportMsg = document.getElementById('supportMsg'); // 미지원 안내 메시지 가져오기

    const quizChoicesEl = document.getElementById('quizChoices'); // 퀴즈 보기 영역 가져오기
    const correctCountEl = document.getElementById('correctCount'); // 맞은 개수 요소 가져오기
    const wrongCountEl = document.getElementById('wrongCount'); // 틀린 개수 요소 가져오기

    let correctCount = 0; // 맞은 개수 변수
    let wrongCount = 0; // 틀린 개수 변수
    let isAnswered = false; // 현재 단어 퀴즈 풀이 여부

    // 브라우저 음성 지원 여부 확인
    if (!('speechSynthesis' in window)) {
      speakBtn.disabled = true;
      supportMsg.style.display = 'block';
    }

    function renderCard() { // 현재 단어를 화면에 표시하는 함수
      const word = WORDS[currentIndex]; // 현재 단어 데이터 가져오기

      wordEl.textContent = word.en; // 영어 단어 표시
      meaningEl.textContent = word.ko; // 한국어 뜻 표시
      exampleEl.textContent = word.ex; // 영어 예문 표시

      isFlipped = false; // 카드 상태를 앞면으로 초기화
      isAnswered = false; // 퀴즈 풀이 상태 초기화

      wordEl.classList.remove('hidden'); // 영어 단어 보이기
      meaningEl.classList.add('hidden'); // 뜻 숨기기
      exampleEl.classList.add('hidden'); // 예문 숨기기

      cardLabelEl.textContent = 'ENGLISH WORD'; // 앞면 안내 표시

      progressTextEl.textContent = `${currentIndex + 1} / ${WORDS.length}`; // 현재 진도 표시

      const percent = Math.round(((currentIndex + 1) / WORDS.length) * 100); // 진행률 계산

      percentTextEl.textContent = `${percent}%`; // 진행률 퍼센트 표시
      progressFillEl.style.width = `${percent}%`; // 진행률 막대 너비 변경

      prevBtn.disabled = currentIndex === 0; // 첫 번째 단어면 이전 버튼 비활성화
      nextBtn.disabled = currentIndex === WORDS.length - 1; // 마지막 단어면 다음 버튼 비활성화

      generateQuiz(); // 새로운 퀴즈 보기 생성
    } // 단어 표시 함수 끝

    function flipCard() { // 카드를 뒤집는 함수
      isFlipped = !isFlipped; // 카드 상태 반전

      if (isFlipped) { // 카드가 뒷면이면
        wordEl.classList.add('hidden'); // 영어 단어 숨기기
        meaningEl.classList.remove('hidden'); // 한국어 뜻 보이기
        exampleEl.classList.remove('hidden'); // 영어 예문 보이기
        cardLabelEl.textContent = 'MEANING & EXAMPLE'; // 뒷면 안내 표시
      } else { // 카드가 앞면이면
        wordEl.classList.remove('hidden'); // 영어 단어 보이기
        meaningEl.classList.add('hidden'); // 한국어 뜻 숨기기
        exampleEl.classList.add('hidden'); // 예문 숨기기
        cardLabelEl.textContent = 'ENGLISH WORD'; // 앞면 안내 표시
      } // 카드 상태 조건문 끝
    } // 카드 뒤집기 함수 끝

    function speakWord() { // 영어 단어와 예문을 소리로 읽어주는 함수
      if (!('speechSynthesis' in window)) return;

      window.speechSynthesis.cancel(); // 이전 재생 중인 음성 취소

      const currentWordData = WORDS[currentIndex];
      const textToSpeak = `${currentWordData.en}. Example: ${currentWordData.ex}`;

      const utterance = new SpeechSynthesisUtterance(textToSpeak);
      utterance.lang = 'en-US';
      utterance.rate = 0.8; // 속도를 조금 느리게 설정

      window.speechSynthesis.speak(utterance);
    } // 음성 읽기 함수 끝

    function generateQuiz() { // 퀴즈 보기를 무작위로 생성하는 함수
      const currentWord = WORDS[currentIndex];
      const correctMeaning = currentWord.ko;

      // 다른 단어들의 뜻 중에서 오답 3개 추출
      let wrongMeanings = WORDS.filter(w => w.ko !== correctMeaning).map(w => w.ko);
      wrongMeanings.sort(() => Math.random() - 0.5); // 무작위 섞기

      let choices = [correctMeaning, ...wrongMeanings.slice(0, 3)];
      choices.sort(() => Math.random() - 0.5); // 정답과 오답을 다시 섞기

      quizChoicesEl.innerHTML = '';
      choices.forEach(meaning => {
        const btn = document.createElement('button');
        btn.className = 'quiz-btn';
        btn.textContent = meaning;
        btn.onclick = () => checkAnswer(meaning, correctMeaning, btn);
        quizChoicesEl.appendChild(btn);
      });
    }

    function checkAnswer(selected, correct, clickedBtn) { // 정답을 체크하는 함수
      if (isAnswered) return;
      isAnswered = true;

      const buttons = quizChoicesEl.getElementsByClassName('quiz-btn');
      for (let btn of buttons) {
        btn.disabled = true; // 모든 보기 버튼 비활성화
        if (btn.textContent === correct) {
          btn.classList.add('correct'); // 정답은 초록색
        } else if (btn === clickedBtn && selected !== correct) {
          btn.classList.add('wrong'); // 내가 누른 오답은 빨갛고 흐리게
        }
      }

      if (selected === correct) {
        correctCount++;
        correctCountEl.textContent = correctCount;
      } else {
        wrongCount++;
        wrongCountEl.textContent = wrongCount;
      }
    }

    function previousWord() { // 이전 단어로 이동하는 함수
      if (currentIndex > 0) { // 첫 번째 단어가 아니라면
        currentIndex--; // 인덱스를 하나 감소
        renderCard(); // 화면 업데이트
      } // 조건문 끝
    } // 이전 단어 함수 끝

    function nextWord() { // 다음 단어로 이동하는 함수
      if (currentIndex < WORDS.length - 1) { // 마지막 단어가 아니라면
        currentIndex++; // 인덱스를 하나 증가
        renderCard(); // 화면 업데이트
      } // 조건문 끝
    } // 다음 단어 함수 끝

    renderCard(); // 페이지가 열리면 첫 번째 단어 표시

  </script> <!-- 자바스크립트 끝 -->

</body> <!-- 화면 본문 끝 -->
</html> <!-- HTML 문서 끝 -->
