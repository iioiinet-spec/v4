<!-- 문서 종류를 HTML5로 설정합니다. -->
<!DOCTYPE html>
<!-- 언어를 한국어로 설정합니다. -->
<html lang="ko">
<!-- 문서의 헤더(설정) 영역 시작입니다. -->
<head>
  <!-- 글자 인코딩을 UTF-8로 설정하여 한글이 깨지지 않게 합니다. -->
  <meta charset="UTF-8">
  <!-- 모바일 및 다양한 기기 화면 크기에 맞게 조절합니다. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 브라우저 탭에 표시될 제목입니다. -->
  <title>영어 단어 카드</title>
  <!-- CSS 스타일링 시작 영역입니다. -->
  <style>
    /* 모든 요소의 여백과 상자 크기 계산 방식을 기본값으로 정리합니다. */
    * {
      /* 바깥 여백을 0으로 만듭니다. */
      margin: 0;
      /* 안쪽 여백을 0으로 만듭니다. */
      padding: 0;
      /* 패딩과 테두리를 너비에 포함시킵니다. */
      box-sizing: border-box;
    }

    /* 전체 화면 배경과 기본 글꼴을 설정합니다. */
    body {
      /* 기본 글꼴을 정하고 깔끔한 고딕체를 사용합니다. */
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      /* 화면 배경을 연한 하늘색 그라데이션으로 만듭니다. */
      background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
      /* 정중앙 배치를 위해 플렉스 박스를 사용합니다. */
      display: flex;
      /* 수직 방향 중앙에 배치합니다. */
      justify-content: center;
      /* 수평 방향 중앙에 배치합니다. */
      align-items: center;
      /* 화면의 최소 높이를 전체 화면 크기로 맞춥니다. */
      min-height: 100vh;
      /* 내용이 넘치지 않게 숨깁니다. */
      overflow: hidden;
    }

    /* 카드가 들어갈 전체 컨테이너 스타일입니다. */
    .app-container {
      /* 흰색 배경을 줍니다. */
      background-color: #ffffff;
      /* 안쪽 여백을 30픽셀 줍니다. */
      padding: 30px;
      /* 모서리를 동글동글하게 만듭니다. */
      border-radius: 20px;
      /* 상자 주변에 부드러운 그림자를 만듭니다. */
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      /* 가로 최대 크기를 400픽셀로 제한합니다. */
      max-width: 400px;
      /* 가로 크기를 화면의 90%로 만듭니다. */
      width: 90%;
      /* 텍스트를 가운데 정렬합니다. */
      text-align: center;
    }

    /* 제목 스타일입니다. */
    h1 {
      /* 글자 색상을 어두운 회색으로 만듭니다. */
      color: #333333;
      /* 아래쪽 여백을 10픽셀 줍니다. */
      margin-bottom: 10px;
      /* 글자 크기를 24픽셀로 정합니다. */
      font-size: 24px;
    }

    /* 진도(진행률) 표시 텍스트 스타일입니다. */
    .progress-text {
      /* 글자 색상을 밝은 회색으로 만듭니다. */
      color: #666666;
      /* 글자 크기를 16픽셀로 정합니다. */
      font-size: 16px;
      /* 아래쪽 여백을 20픽셀 줍니다. */
      margin-bottom: 20px;
      /* 글자를 약간 두껍게 만듭니다. */
      font-weight: bold;
    }

    /* 3D 카드가 회전할 영역 스타일입니다. */
    .card-container {
      /* 카드의 가로 너비를 100%로 설정합니다. */
      width: 100%;
      /* 카드의 세로 높이를 220픽셀로 설정합니다. */
      height: 220px;
      /* 3D 원근감을 만들어 줍니다. */
      perspective: 1000px;
      /* 아래쪽 여백을 20픽셀 줍니다. */
      margin-bottom: 20px;
      /* 마우스 커서를 손가락 모양으로 바꿉니다. */
      cursor: pointer;
    }

    /* 실제 회전하는 카드 본체 스타일입니다. */
    .flashcard {
      /* 너비를 부모 요소에 맞춥니다. */
      width: 100%;
      /* 높이를 부모 요소에 맞춥니다. */
      height: 100%;
      /* 자식 요소의 위치를 이 기준으로 잡습니다. */
      position: relative;
      /* 3D 효과를 자식 요소에도 유지합니다. */
      transform-style: preserve-3d;
      /* 카드가 뒤집힐 때 0.6초 동안 부드럽게 움직이게 합니다. */
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* 카드가 뒤집혔을 때 180도 회전시키는 클래스입니다. */
    .flashcard.flipped {
      /* Y축 기준으로 180도 회전시킵니다. */
      transform: rotateY(180deg);
    }

    /* 카드의 앞면과 뒷면 공통 스타일입니다. */
    .card-face {
      /* 부모 크기에 맞춰 절대 위치로 배치합니다. */
      position: absolute;
      /* 상단에 맞춥니다. */
      top: 0;
      /* 좌측에 맞춥니다. */
      left: 0;
      /* 너비를 100%로 설정합니다. */
      width: 100%;
      /* 높이를 100%로 설정합니다. */
      height: 100%;
      /* 뒷면이 보일 때 반대편 내용을 숨깁니다. */
      backface-visibility: hidden;
      /* 웹킷 기반 브라우저용 뒷면 숨김 속성입니다. */
      -webkit-backface-visibility: hidden;
      /* 모서리를 둥글게 만듭니다. */
      border-radius: 15px;
      /* 안쪽 여백을 20픽셀 줍니다. */
      padding: 20px;
      /* 내용을 정중앙에 모으기 위해 플렉스를 씁니다. */
      display: flex;
      /* 내용들을 세로로 정렬합니다. */
      flex-direction: column;
      /* 세로 중앙 정렬합니다. */
      justify-content: center;
      /* 가로 중앙 정렬합니다. */
      align-items: center;
      /* 부드러운 외곽 테두리를 줍니다. */
      border: 2px solid #e1e8ed;
    }

    /* 카드 앞면 전용 스타일입니다. */
    .card-front {
      /* 앞면 배경을 아주 옅은 보라색으로 정합니다. */
      background-color: #f8f9fe;
      /* 앞면 글자 색상을 정합니다. */
      color: #2d3748;
    }

    /* 카드 앞면의 영어 단어 글자 스타일입니다. */
    .card-front .word {
      /* 기본 글자 크기를 28픽셀로 설정합니다. */
      font-size: 28px;
      /* 글씨를 두껍게 변경합니다. */
      font-weight: bold;
      /* 아래쪽에 약간 여백을 줍니다. */
      margin-bottom: 10px;
      /* 단어가 상자 밖으로 넘치면 깨지지 않게 줄바꿈합니다. */
      word-break: break-word;
      /* 단어가 너무 길어질 경우 대비하여 긴 단어 자동 분할을 허용합니다. */
      overflow-wrap: anywhere;
      /* 최대 높이 내에서 깔끔하게 맞춰지도록 설정합니다. */
      max-width: 100%;
    }

    /* 카드 앞면 하단 안내 텍스트 스타일입니다. */
    .card-front .hint {
      /* 글자 크기를 작게 12픽셀로 정합니다. */
      font-size: 12px;
      /* 연한 회색 글자색으로 정합니다. */
      color: #a0aec0;
    }

    /* 카드 뒷면 전용 스타일입니다. */
    .card-back {
      /* 뒷면 배경을 예쁜 연두색으로 정합니다. */
      background-color: #f0fff4;
      /* 뒷면 글자 색상을 정합니다. */
      color: #22543d;
      /* 처음에는 180도 돌려 놓아 뒤집혔을 때 정상으로 보이게 합니다. */
      transform: rotateY(180deg);
    }

    /* 카드 뒷면의 한글 뜻 스타일입니다. */
    .card-back .meaning {
      /* 글자 크기를 26픽셀로 크게 지정합니다. */
      font-size: 26px;
      /* 두꺼운 글씨로 만듭니다. */
      font-weight: bold;
      /* 아래쪽 여백을 12픽셀 줍니다. */
      margin-bottom: 12px;
    }

    /* 카드 뒷면의 예문 스타일입니다. */
    .card-back .example {
      /* 글자 크기를 15픽셀로 설정합니다. */
      font-size: 15px;
      /* 예문 글자 색상을 약간 어두운 이끼색으로 정합니다. */
      color: #38a169;
      /* 예문을 기울임꼴로 바꿉니다. */
      font-style: italic;
      /* 줄 간격을 넓혀 읽기 쉽게 만듭니다. */
      line-height: 1.4;
      /* 예문 텍스트도 깨지지 않게 줄바꿈되게 합니다. */
      word-break: break-word;
    }

    /* 소리 듣기 버튼 전용 스타일입니다. */
    .audio-btn {
      /* 아래쪽 여백을 15픽셀 줍니다. */
      margin-bottom: 15px;
      /* 배경을 민트/청록색 계열로 바꿉니다. */
      background-color: #00b894;
      /* 너비를 100%로 꽉 채웁니다. */
      width: 100%;
    }

    /* 소리 듣기 버튼에 마우스를 올렸을 때 스타일입니다. */
    .audio-btn:hover {
      /* 조금 더 진한 녹색으로 바꿉니다. */
      background-color: #00a187;
    }

    /* 버튼들을 모아놓는 하단 영역 스타일입니다. */
    .button-group {
      /* 버튼들을 옆으로 나란히 배치합니다. */
      display: flex;
      /* 버튼 사이에 동일한 간격을 만듭니다. */
      justify-content: space-between;
      /* 버튼 사이의 간격을 15픽셀로 띕니다. */
      gap: 15px;
    }

    /* 이전/다음 및 음성 버튼 공통 스타일입니다. */
    button {
      /* 버튼이 남은 공간을 반씩 똑같이 채웁니다. */
      flex: 1;
      /* 안쪽 여백을 위아래 12픽셀로 설정합니다. */
      padding: 12px;
      /* 글자 크기를 16픽셀로 만듭니다. */
      font-size: 16px;
      /* 버튼 글씨를 두껍게 만듭니다. */
      font-weight: bold;
      /* 글자 색상을 흰색으로 정합니다. */
      color: #ffffff;
      /* 기본 버튼 배경을 보라색으로 만듭니다. */
      background-color: #6c5ce7;
      /* 기본 테두리를 없앱니다. */
      border: none;
      /* 버튼 모서리를 동글동글하게 깎습니다. */
      border-radius: 10px;
      /* 마우스를 올리면 손가락 모양으로 변경합니다. */
      cursor: pointer;
      /* 버튼 누르는 느낌을 부드럽게 해줍니다. */
      transition: background-color 0.2s, transform 0.1s;
    }

    /* 버튼에 마우스를 올렸을 때의 변화 스타일입니다. */
    button:hover {
      /* 버튼 색상을 약간 더 어두운 보라색으로 바꿉니다. */
      background-color: #5b4bc4;
    }

    /* 버튼을 마우스로 클릭하고 있을 때 스타일입니다. */
    button:active {
      /* 버튼이 작아지는 효과를 줘서 눌린 느낌을 줍니다. */
      transform: scale(0.96);
    }

    /* 버튼이 비활성화되었을 때 스타일입니다. */
    button:disabled {
      /* 연한 회색으로 배경을 변경합니다. */
      background-color: #cbd5e0;
      /* 마우스 커서를 금지 모양으로 바꿉니다. */
      cursor: not-allowed;
      /* 크기 변형을 취소합니다. */
      transform: none;
    }
  </style>
</head>
<!-- 화면에 실제로 보이는 본문 시작 영역입니다. -->
<body>

  <!-- 모든 앱 요소를 감싸는 큰 상자입니다. -->
  <div class="app-container">
    <!-- 화면 맨 위에 나올 메인 제목입니다. -->
    <h1>영어 단어장</h1>
    <!-- 몇 번째 단어인지 표시할 텍스트입니다. -->
    <div class="progress-text" id="progress">1 / 30</div>

    <!-- 클릭하면 뒤집히는 카드 영역입니다. -->
    <div class="card-container" id="cardContainer">
      <!-- 실제 앞뒤가 회전할 카드 본체입니다. -->
      <div class="flashcard" id="flashcard">
        <!-- 단어 카드의 앞면 영역입니다. -->
        <div class="card-face card-front">
          <!-- 영어 단어가 출력될 글자 상자입니다. -->
          <div class="word" id="word">apple</div>
          <!-- 카드 뒤집기 안내 메시지입니다. -->
          <div class="hint">클릭해서 뜻 확인하기 👆</div>
        </div>
        <!-- 단어 카드의 뒷면 영역입니다. -->
        <div class="card-face card-back">
          <!-- 한글 뜻이 출력될 글자 상자입니다. -->
          <div class="meaning" id="meaning">사과</div>
          <!-- 영어 예문이 출력될 글자 상자입니다. -->
          <div class="example" id="example">I eat a fresh apple.</div>
        </div>
      </div>
    </div>

    <!-- 발음을 들려주는 소리 재생 버튼입니다. -->
    <button class="audio-btn" id="speakBtn">🔊 발음 듣기</button>

    <!-- 이전/다음 버튼이 모여있는 상자입니다. -->
    <div class="button-group">
      <!-- 이전 단어로 이동하는 버튼입니다. -->
      <button id="prevBtn">이전</button>
      <!-- 다음 단어로 이동하는 버튼입니다. -->
      <button id="nextBtn">다음</button>
    </div>
  </div>

  <!-- 동적 동작을 담당하는 자바스크립트 작성 영역입니다. -->
  <script>
    // ==========================================
    // [여기만 고치세요] 초장문 긴 영어 단어 모음집!
    // ==========================================
    const words = [
      { en: 'Pneumonoultramicroscopicsilicovolcanoconiosis', ko: '진폐증 (화산재 먼지로 인한 폐 질환)', ex: 'It is a 45-letter lung disease caused by inhaling very fine ash and dust.' }, // 1번째 초장문 단어 (45글자)
      { en: 'Supercalifragilisticexpialidocious', ko: '수퍼칼리프래질리스틱엑스피알리도셔스 (기분이 아주 좋을 때 쓰는 신나는 표현)', ex: 'Mary Poppins taught us this fun and magical word.' }, // 2번째 초장문 단어 (34글자)
      { en: 'Hippopotomonstrosesquippedaliophobia', ko: '진짜 긴 단어 공포증 (긴 단어를 무서워하는 증상)', ex: 'Ironically, this huge word means fear of long words.' }, // 3번째 초장문 단어 (36글자)
      { en: 'Antidisestablishmentarianism', ko: '국교 폐지 반대론', ex: 'This classic long word relates to church and state history.' }, // 4번째 초장문 단어 (28글자)
      { en: 'Floccinaucinihilipilification', ko: '무가치하게 여김 / 하찮게 봄', ex: 'It is the act of estimating something as completely worthless.' }, // 5번째 초장문 단어 (29글자)
      { en: 'Incomprehensibilities', ko: '이해할 수 없는 것들', ex: 'We were amazed by the incomprehensibilities of the deep universe.' }, // 6번째 초장문 단어 (21글자)
      { en: 'Honorificabilitudinitatibus', ko: '영예를 얻을 수 있는 상태 (셰익스피어 작품에 등장)', ex: 'Shakespeare used this long latinate word in his play.' }, // 7번째 초장문 단어 (27글자)
      { en: 'Thyroparathyroidectomized', ko: '갑상선 상피소체 적출 수술을 받은', ex: 'A surgical term referring to the removal of thyroid glands.' }, // 8번째 초장문 단어 (25글자)
      { en: 'Dichlorodifluoromethane', ko: '디클로로디플루오로메탄 (냉매 가스 종)', ex: 'This chemical compound was widely used in refrigerators.' }, // 9번째 초장문 단어 (23글자)
      { en: 'Psychoneuroimmunology', ko: '정신 신경 면역학', ex: 'It study how the mind and immunity affect health together.' } // 10번째 초장문 단어 (21글자)
    ];

    // 현재 보고 있는 단어의 번호를 기억하는 변수예요. (0부터 시작해요)
    let currentIndex = 0;

    // HTML 태그들을 자바스크립트로 조작하기 위해 가져옵니다.
    const wordEl = document.getElementById('word');
    const meaningEl = document.getElementById('meaning');
    const exampleEl = document.getElementById('example');
    const progressEl = document.getElementById('progress');
    const flashcard = document.getElementById('flashcard');
    const cardContainer = document.getElementById('cardContainer');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const speakBtn = document.getElementById('speakBtn'); // 발음 버튼을 가져옵니다.

    // 영어 단어를 소리로 읽어주는 함수입니다.
    function speakWord(text) {
      // 기존에 읽고 있던 소리가 있다면 멈춥니다.
      window.speechSynthesis.cancel();
      // 음성 읽기 기능을 위한 객체를 새로 만듭니다.
      const utterance = new SpeechSynthesisUtterance(text);
      // 소리 언어를 미국 영어(en-US)로 설정합니다.
      utterance.lang = 'en-US';
      // 소리 읽기 속도를 적절하게 조절합니다. (1.0이 기본)
      utterance.rate = 0.8; // 긴 단어라 조금천천히 읽도록 설정합니다.
      // 설정된 목소리로 단어를 읽어줍니다.
      window.speechSynthesis.speak(utterance);
    }

    // 화면에 현재 단어 정보를 보여주는 함수입니다.
    function updateCard() {
      // 카드가 뒤집혀 있다면 먼저 앞면으로 원상복구 시킵니다.
      flashcard.classList.remove('flipped');

      // 카드가 뒤집어지는 애니메이션 시간에 맞춰 글자를 바꿉니다.
      setTimeout(() => {
        // 현재 위치의 단어 객체를 가져옵니다.
        const currentData = words[currentIndex];
        // 영어 단어 글자를 바꿉니다.
        wordEl.textContent = currentData.en;

        // 글자 길이에 맞춰 글자 크기를 세밀하게 자동 조정합니다.
        if (currentData.en.length > 30) {
          wordEl.style.fontSize = '15px'; // 30글자 넘는 엄청 긴 단어
        } else if (currentData.en.length > 20) {
          wordEl.style.fontSize = '18px'; // 20글자 넘는 긴 단어
        } else {
          wordEl.style.fontSize = '26px'; // 보통 크기
        }

        // 한글 뜻 글자를 바꿉니다.
        meaningEl.textContent = currentData.ko;
        // 예문 글자를 바꿉니다.
        exampleEl.textContent = currentData.ex;
        // 진행률(예: 1 / 10) 글자를 바꿉니다.
        progressEl.textContent = `${currentIndex + 1} / ${words.length}`;

        // 첫 번째 단어라면 '이전' 버튼을 누르지 못하게 막습니다.
        prevBtn.disabled = currentIndex === 0;
        // 마지막 단어라면 '다음' 버튼을 누르지 못하게 막습니다.
        nextBtn.disabled = currentIndex === words.length - 1;
      }, 150); // 0.15초 뒤에 글자를 바꿉니다.
    }

    // 카드를 클릭했을 때 실행할 이벤트를 등록합니다.
    cardContainer.addEventListener('click', () => {
      // 'flipped' 클래스를 껐다 켰다 해서 카드를 뒤집습니다.
      flashcard.classList.toggle('flipped');
    });

    // '발음 듣기' 버튼을 클릭했을 때 실행할 이벤트를 등록합니다.
    speakBtn.addEventListener('click', () => {
      // 현재 단어를 가져옵니다.
      const currentWord = words[currentIndex].en;
      // 단어를 읽어주는 함수를 실행합니다.
      speakWord(currentWord);
    });

    // '이전' 버튼을 클릭했을 때 실행할 이벤트를 등록합니다.
    prevBtn.addEventListener('click', () => {
      // 현재 단어 위치가 0보다 클 때만 동작합니다.
      if (currentIndex > 0) {
        // 단어 위치를 1 감소시킵니다.
        currentIndex--;
        // 화면 카드 내용을 새 단어로 업데이트합니다.
        updateCard();
      }
    });

    // '다음' 버튼을 클릭했을 때 실행할 이벤트를 등록합니다.
    nextBtn.addEventListener('click', () => {
      // 현재 단어 위치가 마지막 단어 위치보다 작을 때만 동작합니다.
      if (currentIndex < words.length - 1) {
        // 단어 위치를 1 증가시킵니다.
        currentIndex++;
        // 화면 카드 내용을 새 단어로 업데이트합니다.
        updateCard();
      }
    });

    // 웹페이지가 처음 켜졌을 때 첫 번째 단어 카드를 보여줍니다.
    updateCard();
  </script>
</body>
</html>
