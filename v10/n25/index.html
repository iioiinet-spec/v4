<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>궁극의 대장간 강화 RPG - 무기 판매 에디션</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #0f0f17;
            color: #e0e0e0;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }
        .game-wrapper {
            display: grid;
            grid-template-columns: 290px 400px 290px;
            gap: 15px;
            max-width: 1020px;
            width: 100%;
        }
        .panel {
            background: #1a1a26;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #28283d;
        }
        h2 {
            color: #ffcc00;
            font-size: 16px;
            margin-top: 0;
            border-bottom: 2px solid #28283d;
            padding-bottom: 6px;
        }
        .center-panel {
            text-align: center;
        }
        .weapon-display {
            font-size: 24px;
            font-weight: bold;
            margin: 15px 0;
            padding: 15px;
            background: #232336;
            border-radius: 10px;
            border: 2px solid #3d3d6b;
            transition: 0.2s;
        }
        .shake {
            animation: shake 0.3s ease-in-out;
        }
        @keyframes shake {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-10px, 0); }
            40% { transform: translate(10px, 0); }
            60% { transform: translate(-5px, 0); }
            80% { transform: translate(5px, 0); }
            100% { transform: translate(0, 0); }
        }
        .btn {
            background-color: #ff5722;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
            transition: 0.2s;
        }
        .btn:hover:not(:disabled) { background-color: #f4511e; }
        .btn:active:not(:disabled) { transform: scale(0.98); }
        .btn:disabled {
            background-color: #444455;
            color: #888899;
            cursor: not-allowed;
        }
        .btn-secondary { background-color: #3f51b5; }
        .btn-secondary:hover:not(:disabled) { background-color: #303f9f; }
        .btn-danger { background-color: #d32f2f; }
        .btn-danger:hover:not(:disabled) { background-color: #b71c1c; }
        .btn-exchange { background-color: #009688; }
        .btn-exchange:hover:not(:disabled) { background-color: #00796b; }
        .btn-totem { background-color: #e91e63; }
        .btn-totem:hover:not(:disabled) { background-color: #c2185b; }
        .btn-sell { background-color: #ffb300; color: #12121a; }
        .btn-sell:hover:not(:disabled) { background-color: #ffa000; }
        .stats-box {
            font-size: 13px;
            color: #b0b0d0;
            background: #13131c;
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 12px;
            text-align: left;
            line-height: 1.4;
        }
        .log-box {
            background: #0f0f17;
            border: 1px solid #28283d;
            height: 110px;
            overflow-y: auto;
            padding: 8px;
            font-size: 11px;
            text-align: left;
            border-radius: 6px;
            margin-top: 8px;
            line-height: 1.3;
        }
        .resource-bar {
            display: flex;
            justify-content: space-between;
            background: #13131c;
            padding: 8px 10px;
            border-radius: 6px;
            margin-bottom: 12px;
            font-weight: bold;
            font-size: 12px;
        }
        .gold { color: #ffd700; }
        .scroll { color: #00bcd4; }
        .shard { color: #ab47bc; }
        .diamond { color: #00e5ff; }
    </style>
</head>
<body>

<div class="game-wrapper">
    <!-- 왼쪽 패널: 상점 및 환전소 -->
    <div class="panel">
        <h2>🛒 대장간 상점</h2>
        <div class="stats-box">
            망치: <span id="hammerName" style="color:#ff9800;">일반 망치</span><br>
            보호권: <span id="shieldCount">0</span>장 | 포인트: <span id="skillPoints" style="color:#4caf50;">0</span>P
        </div>
        <button class="btn btn-secondary" onclick="buyScroll()">주문서 구매 (500G)</button>
        <button class="btn btn-secondary" onclick="buyShield()">보호권 구매 (2000G)</button>
        <button class="btn btn-secondary" onclick="buyHammer()">황금 망치 (+5%) (5000G)</button>
        <button class="btn btn-danger" onclick="toggleHardcore()">💀 저주받은 무기 모드</button>

        <h2>🏛️ 환전소</h2>
        <div class="stats-box">
            다이아 보유: <span id="diamondVal" style="color:#00e5ff;">0</span>개
        </div>
        <button class="btn btn-exchange" onclick="exchangeGoldToDia()">골드 ➡ 다이아 교환 (10,000G)</button>
        <button class="btn btn-exchange" onclick="exchangeDiaToGold()">다이아 ➡ 골드 교환 (1다이아)</button>
    </div>

    <!-- 중앙 패널: 메인 강화 화면 -->
    <div class="panel center-panel">
        <h2>🔨 궁극의 대장간</h2>
        
        <div class="resource-bar">
            <span class="gold">🪙 <span id="goldVal">1000</span>G</span>
            <span class="scroll">📜 <span id="scrollVal">5</span>장</span>
            <span class="shard">💎 <span id="shardVal">0</span>개</span>
        </div>

        <div class="stats-box" style="text-align: center; font-size: 12px; color: #ffeb3b;" id="envInfo">
            날씨: 맑음 (성공률 +0%) | 대장장이: 평온
        </div>

        <div class="weapon-display" id="weaponBox">
            낡은 철제 검 (+0)
        </div>

        <div class="stats-box" id="infoBox">
            성공 확률: 100%<br>
            필요 비용: 100 골드 + 주문서 1장<br>
            패널티: 없음 (안전 구간)
        </div>

        <button class="btn" id="upgradeBtn" onclick="upgrade()">망치로 강화하기! 🔨</button>
        <button class="btn btn-sell" onclick="sellWeapon()">💰 무기 판매하기 (가격 확인)</button>
        <button class="btn" style="background-color: #e91e63; margin-top: 5px;" onclick="salvage()">파편 분해 (파편->주문서)</button>

        <div class="log-box" id="logBox">
            [시스템] 대장간에 오신 것을 환영합니다! 강화를 시작해 보세요.
        </div>
    </div>

    <!-- 오른쪽 패널: 토템 상점 및 모험 -->
    <div class="panel">
        <h2>🗿 토템 상점</h2>
        <div class="stats-box" id="totemStatus" style="color: #ff4081;">
            장착된 토템: 없음
        </div>
        <button class="btn btn-totem" onclick="buyTotem('luck', 5)">행운의 토템 (성공률+10% / 5다이아)</button>
        <button class="btn btn-totem" onclick="buyTotem('shield', 8)">수호의 토템 (파괴방지+15% / 8다이아)</button>
        <button class="btn btn-totem" onclick="buyTotem('wealth', 10)">황금의 토템 (던전골드 2배 / 10다이아)</button>

        <h2>⚔️ 모험 및 특수</h2>
        <div class="flex-row" style="display: flex; gap: 5px;">
            <button class="btn" id="dungeonBtn" onclick="runDungeon()" style="font-size:12px;">고블린 동굴</button>
            <button class="btn" id="bossBtn" style="background-color: #8bc34a; font-size:12px;" onclick="runBoss()">보스 레이드</button>
        </div>
        <button class="btn" style="background-color: #9c27b0;" onclick="startTimedAttack()">⏱️ 타임어택 (30초)</button>
        <button class="btn" style="background-color: #795548;" onclick="claimSubsidy()">💰 개발자 지원금</button>
    </div>
</div>

<script>
    let gold = 1000;
    let scrolls = 5;
    let shards = 0;
    let diamonds = 0;
    let level = 0;
    let weaponName = "낡은 철제 검";
    let prefix = "";
    let shields = 0;
    let bsLevel = 1;
    let bsExp = 0;
    let hammerType = 0;
    let combo = 0;
    let skillDestLevel = 0;
    let skillCostLevel = 0;
    let skillPoints = 0;
    let isHardcore = false;
    let subsidyUsed = false;
    let equippedTotem = "none";

    let timedAttackActive = false;
    let timedScore = 0;

    let weatherList = [
        {name: "맑음", bonus: 0},
        {name: "폭우", bonus: -5},
        {name: "황금빛 노을", bonus: 10},
        {name: "안개", bonus: -3}
    ];
    let currentWeather = weatherList[0];
    let blacksmithMood = 0;

    setInterval(() => {
        currentWeather = weatherList[Math.floor(Math.random() * weatherList.length)];
        blacksmithMood = Math.floor(Math.random() * 11) - 5;
        updateEnvDisplay();
    }, 30000);

    let dungeonCooldown = 0;
    let bossCooldown = 0;
    const COOLDOWN_TIME = 60 * 60 * 1000;

    function log(msg) {
        let box = document.getElementById("logBox");
        box.innerHTML += `<br>` + msg;
        box.scrollTop = box.scrollHeight;
    }

    function updateEnvDisplay() {
        let moodText = blacksmithMood > 0 ? `기분 좋음 (+${blacksmithMood}%)` : blacksmithMood < 0 ? `기분 나쁨 (${blacksmithMood}%)` : `평온함 (0%)`;
        document.getElementById("envInfo").innerHTML = `날씨: ${currentWeather.name} (${currentWeather.bonus}%) | 대장장이: ${moodText}`;
    }

    function getChance() {
        if (isHardcore) return 90;
        let base = 100;
        if (level >= 3) base = 80 - (level - 3) * 7;
        if (base < 10) base = 10;
        
        let totemBonus = (equippedTotem === 'luck') ? 10 : 0;
        let total = base + (hammerType * 5) + ((bsLevel - 1) * 2) + currentWeather.bonus + blacksmithMood + (combo * 2) + totemBonus;
        return Math.min(99, Math.max(5, total));
    }

    // 무기 판매 가격 계산 함수
    function calculateWeaponPrice() {
        let basePrice = 200;
        // 단계가 높을수록 가격이 기하급수적으로 상승
        let levelMultiplier = Math.pow(1.8, level) * 100;
        
        // 접두사 가치 부여
        let prefixBonus = 1;
        if (prefix === "광기의") prefixBonus = 1.5;
        if (prefix === "빛나는") prefixBonus = 1.8;
        if (prefix === "칠흑의") prefixBonus = 2.0;
        if (prefix === "고대의") prefixBonus = 2.5;
        if (prefix === "축복받은") prefixBonus = 3.0;
        if (prefix === "화염의") prefixBonus = 2.2;

        let totalPrice = Math.floor((basePrice + levelMultiplier) * prefixBonus);
        return totalPrice;
    }

    function sellWeapon() {
        if (level === 0 && !prefix) {
            log("⚠️ 기본 낡은 철제 검(+0)은 판매할 수 없습니다!");
            return;
        }

        let sellPrice = calculateWeaponPrice();
        gold += sellPrice;
        log(`💰 무기를 상점에 판매하여 <span style="color:#ffd700;">${sellPrice.toLocaleString()} 골드</span>를 획득했습니다! 새 무기가 지급됩니다.`);

        // 무기 초기화 및 기본 검 지급
        level = 0;
        prefix = "";
        combo = 0;
        isHardcore = false;
        updateUI();
    }

    function upgrade() {
        let cost = Math.max(10, Math.floor((100 + (level * 50)) * (1 - skillCostLevel * 0.05)));
        if (!timedAttackActive && (gold < cost || scrolls < 1)) {
            log("⚠️ 골드나 강화 주문서가 부족합니다!");
            return;
        }

        if (!timedAttackActive) {
            gold -= cost;
            scrolls -= 1;
            bsExp += 1;
            if (bsExp >= bsLevel * 10) {
                bsExp = 0;
                bsLevel++;
                skillPoints += 1;
                log(`🎉 대장장이 숙련도가 레벨 ${bsLevel}이 되었습니다! (스킬 포인트 +1)`);
            }
        }

        let weaponBox = document.getElementById("weaponBox");
        weaponBox.classList.add("shake");
        setTimeout(() => weaponBox.classList.remove("shake"), 300);

        let chance = getChance();
        let roll = Math.random() * 100;

        if (roll <= chance) {
            level++;
            combo++;
            log(`🎉 강화 성공! 무기가 +${level} 단계가 되었습니다.`);
            
            if (Math.random() < 0.25) {
                let prefixes = ["광기의", "빛나는", "칠흑의", "고대의", "축복받은", "화염의"];
                prefix = prefixes[Math.floor(Math.random() * prefixes.length)];
                log(`✨ 돌연변이 발생! 무기에 [<span style="color:#ffeb3b;">${prefix}</span>] 접두사가 붙었습니다!`);
            }
            if (timedAttackActive) timedScore++;
        } else {
            combo = 0;
            if (isHardcore) {
                log("💀 저주받은 무기 실패! 즉시 영구 삭제되었습니다!");
                level = 0;
                prefix = "";
                isHardcore = false;
            } else if (level <= 3) {
                log("😅 실패했지만 안전 구간이라 단계가 유지됩니다.");
            } else if (level <= 6) {
                log("⚠️ 강화 실패! 단계가 유지됩니다.");
            } else if (level <= 9) {
                if (shields > 0) {
                    shields--;
                    log("🛡️ 보호권이 발동하여 단계 하락을 막아냈습니다!");
                } else {
                    level--;
                    log("💥 강화 실패로 단계가 하락했습니다 (-1).");
                }
            } else {
                let totemShieldBonus = (equippedTotem === 'shield') ? 0.15 : 0;
                let destChanceReduction = (skillDestLevel * 0.05) + totemShieldBonus;

                if (Math.random() < 0.3) {
                    log("🌙 앗! 파괴되었지만... 알고 보니 꿈이었습니다! 무기가 보존되고 골드를 얻습니다.");
                    gold += 500;
                } else if (shields > 0) {
                    shields--;
                    log("🛡️ 보호권이 발동하여 무기 파괴를 막아냈습니다!");
                } else if (Math.random() < destChanceReduction) {
                    log("✨ 토템 및 특성 효과 발동! 파괴 위기에서 무기가 겨우 살아남았습니다.");
                } else {
                    log("🔥 앗! 강화 실패로 무기가 완전히 파괴되었습니다! (파편 획득)");
                    shards += level * 2;
                    level = 0;
                    prefix = "";
                }
            }
        }
        updateUI();
    }

    function exchangeGoldToDia() {
        if (gold >= 10000) {
            gold -= 10000;
            diamonds += 1;
            log("🏛️ 환전 완료: 10,000 골드를 다이아몬드 1개로 교환했습니다.");
            updateUI();
        } else { log("⚠️ 골드가 부족합니다 (최소 10,000 골드 필요)."); }
    }

    function exchangeDiaToGold() {
        if (diamonds >= 1) {
            diamonds -= 1;
            gold += 8000;
            log("🏛️ 환전 완료: 다이아몬드 1개를 8,000 골드로 교환했습니다.");
            updateUI();
        } else { log("⚠️ 다이아몬드가 부족합니다."); }
    }

    function buyTotem(type, costDia) {
        if (diamonds >= costDia) {
            diamonds -= costDia;
            equippedTotem = type;
            let totemNames = { 'luck': '행운의 토템', 'shield': '수호의 토템', 'wealth': '황금의 토템' };
            log(`🗿 [<span style="color:#ff4081;">${totemNames[type]}</span>]을(를) 구매 및 장착했습니다!`);
            updateUI();
        } else { log("⚠️ 다이아몬드가 부족합니다!"); }
    }

    function toggleHardcore() {
        isHardcore = !isHardcore;
        if (isHardcore) {
            log("💀 [하드코어] 저주받은 무기 모드 활성화! 확률이 90% 고정되지만 실패 시 소멸합니다.");
        } else {
            log("🛡️ 저주받은 무기 모드가 해제되었습니다.");
        }
        updateUI();
    }

    function buyScroll() {
        if (gold >= 500) {
            gold -= 500;
            scrolls += 3;
            log("📜 강화 주문서 3장을 구매했습니다.");
            updateUI();
        } else { log("⚠️ 골드가 부족합니다."); }
    }

    function buyShield() {
        if (gold >= 2000) {
            gold -= 2000;
            shields += 1;
            log("🛡️ 파괴/하락 방어 보호권을 구매했습니다.");
            updateUI();
        } else { log("⚠️ 골드가 부족합니다."); }
    }

    function buyHammer() {
        if (gold >= 5000 && hammerType === 0) {
            gold -= 5000;
            hammerType = 1;
            document.getElementById("hammerName").innerText = "황금 망치 (+5% 성공률)";
            log("✨ 황금 망치로 업그레이드했습니다!");
            updateUI();
        } else { log("⚠️ 골드가 부족하거나 이미 업그레이드되었습니다."); }
    }

    function runDungeon() {
        let now = Date.now();
        if (now < dungeonCooldown) {
            log("⏳ 던전은 1시간에 한 번만 입장할 수 있습니다!");
            return;
        }
        dungeonCooldown = now + COOLDOWN_TIME;
        let wealthMultiplier = (equippedTotem === 'wealth') ? 2 : 1;
        let reward = (300 + (level * 50)) * wealthMultiplier;
        gold += reward;
        log(`⚔️ 던전을 클리어하여 ${reward} 골드를 획득했습니다!`);
        updateUI();
    }

    function runBoss() {
        let now = Date.now();
        if (now < bossCooldown) {
            log("⏳ 보스 레이드는 1시간에 한 번만 도전할 수 있습니다!");
            return;
        }
        if (level < 5) {
            log("⚠️ 무기 강화 단계가 +5 이상이어야 보스 레이드에 도전할 수 있습니다!");
            return;
        }
        bossCooldown = now + COOLDOWN_TIME;
        let wealthMultiplier = (equippedTotem === 'wealth') ? 2 : 1;
        let reward = (1500 + (level * 200)) * wealthMultiplier;
        gold += reward;
        scrolls += 2;
        log(`🐉 보스를 무찌르고 보상(${reward} 골드, 주문서 2장)을 획득했습니다!`);
        updateUI();
    }

    function salvage() {
        if (shards >= 10) {
            shards -= 10;
            scrolls += 5;
            log("💎 파편 10개를 모아 주문서 5장으로 교환했습니다!");
            updateUI();
        } else { log("⚠️ 파편이 부족합니다 (최소 10개 필요)."); }
    }

    function startTimedAttack() {
        if (timedAttackActive) return;
        timedAttackActive = true;
        timedScore = 0;
        let timeLeft = 30;
        log("⏱️ 타임어택 스피드런 시작! 30초 동안 무료로 무한 강화하세요!");
        
        let timerBox = document.getElementById("infoBox");
        let tInterval = setInterval(() => {
            timeLeft--;
            timerBox.innerHTML = `🔥 타임어택 진행중! 남은 시간: ${timeLeft}초<br>성공 횟수 점수: ${timedScore}점`;
            if (timeLeft <= 0) {
                clearInterval(tInterval);
                timedAttackActive = false;
                let bonusGold = timedScore * 200;
                gold += bonusGold;
                log(`⏱️ 타임어택 종료! 총 ${timedScore}회 성공하여 보상 ${bonusGold} 골드를 획득했습니다!`);
                updateUI();
            }
        }, 1000);
    }

    function claimSubsidy() {
        if (subsidyUsed) {
            log("⚠️ 개발자 지원금은 파산당했을 때 1회만 받을 수 있습니다!");
            return;
        }
        if (gold < 100) {
            subsidyUsed = true;
            gold += 1500;
            scrolls += 3;
            log("💰 [개발자 지원금] 파산 위기의 대장장이에게 구호 자금이 지급되었습니다!");
            updateUI();
        } else { log("⚠️ 골드가 남아있을 때는 지원금을 받을 수 없습니다."); }
    }

    setInterval(() => {
        let now = Date.now();
        let dungeonBtn = document.getElementById("dungeonBtn");
        if (now < dungeonCooldown) {
            let left = Math.ceil((dungeonCooldown - now) / 1000);
            dungeonBtn.innerText = `고블린 (${Math.floor(left/60)}분 ${left%60}초)`;
            dungeonBtn.disabled = true;
        } else {
            dungeonBtn.innerText = `고블린 동굴`;
            dungeonBtn.disabled = false;
        }

        let bossBtn = document.getElementById("bossBtn");
        if (now < bossCooldown) {
            let left = Math.ceil((bossCooldown - now) / 1000);
            bossBtn.innerText = `보스 (${Math.floor(left/60)}분 ${left%60}초)`;
            bossBtn.disabled = true;
        } else {
            bossBtn.innerText = `보스 레이드`;
            bossBtn.disabled = false;
        }
    }, 1000);

    function updateUI() {
        document.getElementById("goldVal").innerText = gold;
        document.getElementById("scrollVal").innerText = scrolls;
        document.getElementById("shardVal").innerText = shards;
        document.getElementById("diamondVal").innerText = diamonds;
        document.getElementById("shieldCount").innerText = shields;
        
        let totemNames = { 'none': '없음', 'luck': '행운의 토템', 'shield': '수호의 토템', 'wealth': '황금의 토템' };
        document.getElementById("totemStatus").innerText = `장착된 토템: ${totemNames[equippedTotem]}`;
        
        let titleName = level >= 10 ? "광휘의 성검" : level >= 5 ? "강철 대검" : "낡은 철제 검";
        weaponName = `${prefix ? '['+prefix+'] ' : ''}${titleName} (+${level})`;
        document.getElementById("weaponBox").innerText = weaponName;

        let penaltyText = isHardcore ? "💀 실패 시 즉시 영구 삭제!" : level <= 3 ? "없음 (안전)" : level <= 6 ? "단계 유지" : level <= 9 ? "단계 하락" : "🔥 파괴 위험";
        let cost = Math.max(10, Math.floor((100 + (level * 50)) * (1 - skillCostLevel * 0.05)));
        let currentSellPrice = calculateWeaponPrice();
        
        if (!timedAttackActive) {
            document.getElementById("infoBox").innerHTML = `
                성공 확률: ${getChance()}% ${isHardcore ? '<span style="color:red;">(하드코어)</span>' : ''}<br>
                필요 비용: ${cost} 골드 + 주문서 1장<br>
                패널티: ${penaltyText}<br>
                <span style="color:#ffb300;">현재 무기 판매가: ${currentSellPrice.toLocaleString()} G</span>
            `;
        }
    }
</script>

</body>
</html>
