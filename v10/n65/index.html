<!DOCTYPE html>
<html lang="ko">
<head>
    <!-- 문서의 형식을 정의합니다 -->
    <meta charset="UTF-8">
    <!-- 모바일 기기 화면 크기에 맞게 조절합니다 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- [무드: 노을이 진 가을 저녁, 따뜻한 주황빛 감성이 물씬 풍기는 풍경] -->
    <!-- 구글 폰트(Fredoka, Jua)를 불러옵니다 -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Jua&display=swap" rel="stylesheet">
    <!-- 웹페이지의 제목을 설정합니다 -->
    <title>영어 단어 카드</title>
    <!-- 스타일을 꾸미는 CSS 시작입니다 -->
    <style>
        /* CSS 변수를 설정하여 색상을 관리합니다 */
        :root {
            /* 배경 색상입니다 */
            --bg-color: #e08300;
            /* 카드 및 상자 배경 색상입니다 */
            --card-bg: #ffffff;
            /* 기본 글자 색상입니다 */
            --text-color: #000000;
            /* 버튼 등 강조 포인트 색상입니다 */
            --accent-color: #003cb3;
        }
        /* 전체 페이지의 기본 모양과 폰트를 설정합니다 */
        body { font-family: 'Fredoka', 'Jua', sans-serif; background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        /* 단어 카드의 크기와 하얀색 상자 모양을 만듭니다 */
        .card { width: 320px; height: 180px; background-color: var(--card-bg); border-radius: 36px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; font-size: 26px; font-weight: bold; margin-bottom: 15px; text-align: center; padding: 20px; box-sizing: border-box; }
        /* 버튼들을 감싸는 상자입니다 */
        .buttons { display: flex; gap: 15px; margin-bottom: 10px; }
        /* 버튼의 기본 모양입니다 */
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; border: none; border-radius: 8px; background-color: var(--accent-color); color: white; font-family: 'Jua', sans-serif; }
        /* 버튼에 마우스를 올렸을 때의 모양입니다 */
        button:hover { opacity: 0.9; }
        /* 진도 표시 글씨의 모양입니다 */
        .progress { font-size: 18px; color: var(--text-color); margin-bottom: 15px; font-family: 'Jua', sans-serif; }
        /* 예문 글씨의 모양입니다 */
        .example { font-size: 14px; color: #444; margin-top: 10px; font-weight: normal; }
        /* 스피커 버튼의 모양을 꾸밉니다 */
        .speaker-btn { background: none; border: none; font-size: 22px; cursor: pointer; margin-top: 10px; padding: 0; }
        /* 퀴즈 영역 전체의 모양과 여백을 정합니다 */
        .quiz-container { background-color: var(--card-bg); padding: 15px 20px; border-radius: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 320px; box-sizing: border-box; text-align: center; }
        /* 퀴즈 안내 질문 글씨의 모양을 정합니다 */
        .quiz-title { font-weight: bold; margin-bottom: 10px; font-size: 15px; color: var(--text-color); font-family: 'Jua', sans-serif; }
        /* 4개의 보기 버튼을 나란히 배치하는 상자입니다 */
        .quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        /* 퀴즈 보기 버튼 개별의 모양을 정합니다 */
        .quiz-btn { background-color: #e0e0e0; color: var(--text-color); font-size: 14px; padding: 8px; border-radius: 6px; font-family: 'Jua', sans-serif; }
        /* 퀴즈 보기 버튼에 마우스를 올렸을 때 색상입니다 */
        .quiz-btn:hover { background-color: #d0d0d0; }
        /* 정답 버튼을 초록색으로 표시합니다 */
        .quiz-btn.correct { background-color: #4CAF50 !important; color: white; }
        /* 오답 버튼을 흐리게 표시합니다 */
        .quiz-btn.wrong { opacity: 0.4; }
        /* 맞은 개수와 틀린 개수를 보여주는 점수판입니다 */
        .score-board { margin-top: 10px; font-size: 14px; color: var(--text-color); font-weight: bold; font-family: 'Jua', sans-serif; }
    </style>
</head>
<body>
    <!-- 단어가 적히는 카드 상자입니다 -->
    <div class="card" id="wordCard" onclick="flipCard()">
        <!-- 단어 글씨가 들어가는 곳입니다 -->
        <span id="wordText">arrive</span>
        <!-- 원어민 발음을 들려주는 스피커 버튼입니다 -->
        <button class="speaker-btn" onclick="speakWord(event)">🔊</button>
    </div>
    <!-- 버튼들을 감싸는 영역입니다 -->
    <div class="buttons">
        <!-- 이전 단어로 가는 버튼입니다 -->
        <button onclick="prevCard()">이전</button>
        <!-- 다음 단어로 가는 버튼입니다 -->
        <button onclick="nextCard()">다음</button>
    </div>
    <!-- 현재 진도를 보여주는 곳입니다 -->
    <div class="progress" id="progressText">1 / 15</div>
    <!-- 단어 뜻을 맞추는 퀴즈 영역 상자입니다 -->
    <div class="quiz-container">
        <!-- 퀴즈 안내 질문 글씨입니다 -->
        <div class="quiz-title">이 단어의 뜻은?</div>
        <!-- 4개의 보기 버튼이 들어갈 공간입니다 -->
        <div class="quiz-options" id="quizOptions"></div>
        <!-- 맞은 개수와 틀린 개수를 보여주는 점수판입니다 -->
        <div class="score-board" id="scoreBoard">맞은 개수: 0 | 틀린 개수: 0</div>
    </div>
    <!-- 자바스크립트 코드가 시작되는 곳입니다 -->
    <script>
        // [여기만 고치세요] 단어 목록 배열입니다
        const words = [
            { en: 'arrive', ko: '도착하다', ex: 'I will arrive soon.' },
            { en: 'borrow', ko: '빌리다', ex: 'Can I borrow a pen?' },
            { en: 'choose', ko: '선택하다', ex: 'Choose one you like.' },
            { en: 'decide', ko: '결정하다', ex: 'Decide what to do.' },
            { en: 'different', ko: '다른', ex: 'They are different.' },
            { en: 'enough', ko: '충분한', ex: 'I have enough time.' },
            { en: 'favorite', ko: '가장 좋아하는', ex: 'This is my favorite.' },
            { en: 'healthy', ko: '건강한', ex: 'Eat healthy food.' },
            { en: 'important', ko: '중요한', ex: 'It is very important.' },
            { en: 'invite', ko: '초대하다', ex: 'I want to invite you.' },
            { en: 'popular', ko: '인기 있는', ex: 'This game is popular.' },
            { en: 'prepare', ko: '준비하다', ex: 'Prepare for the test.' },
            { en: 'promise', ko: '약속하다', ex: 'Keep your promise.' },
            { en: 'remember', ko: '기억하다', ex: 'Remember my name.' },
            { en: 'receive', ko: '받다', ex: 'I receive a gift.' }
        ];
        // 현재 보고 있는 단어의 번호입니다
        let currentIndex = 0;
        // 카드가 뒤집혔는지 확인하는 상태 변수입니다
        let isFlipped = false;
        // 맞은 개수를 세는 변수입니다
        let correctCount = 0;
        // 틀린 개수를 세는 변수입니다
        let wrongCount = 0;
        // 현재 퀴즈를 이미 풀었는지 확인하는 변수입니다
        let hasAnswered = false;
        // 화면의 단어와 진도를 바꿔주는 함수입니다
        function updateCard() {
            // 현재 단어 데이터를 가져옵니다
            const currentWord = words[currentIndex];
            // 단어 글씨 요소를 가져옵니다
            const wordText = document.getElementById('wordText');
            // 진도 표시 요소를 가져옵니다
            const progressText = document.getElementById('progressText');
            // 카드가 뒤집힌 상태라면 뜻과 예문을 보여줍니다
            if (isFlipped) {
                wordText.innerHTML = `${currentWord.ko}<div class="example">${currentWord.ex}</div>`;
            } else {
                // 앞면 상태라면 영어 단어만 보여줍니다
                wordText.innerHTML = currentWord.en;
            }
            // 현재 진도를 화면에 글자로 적어줍니다
            progressText.innerText = `${currentIndex + 1} / ${words.length}`;
        }
        // 카드를 클릭했을 때 뒤집는 함수입니다
        function flipCard() {
            // 뒤집힘 상태를 반대로 바꿉니다
            isFlipped = !isFlipped;
            // 화면을 새로고침하여 바뀐 내용을 보여줍니다
            updateCard();
        }
        // 이전 버튼을 눌렀을 때 실행되는 함수입니다
        function prevCard() {
            // 이전 번호로 이동하고 첫 번째에서 누르면 마지막으로 갑니다
            currentIndex = (currentIndex - 1 + words.length) % words.length;
            // 카드를 다시 앞면으로 돌립니다
            isFlipped = false;
            // 화면을 새로고침합니다
            updateCard();
            // 새로운 단어에 맞는 퀴즈를 다시 만들어줍니다
            updateQuiz();
        }
        // 다음 버튼을 눌렀을 때 실행되는 함수입니다
        function nextCard() {
            // 다음 번호로 이동하고 마지막에서 누르면 첫 번째로 갑니다
            currentIndex = (currentIndex + 1) % words.length;
            // 카드를 다시 앞면으로 돌립니다
            isFlipped = false;
            // 화면을 새로고침합니다
            updateCard();
            // 새로운 단어에 맞는 퀴즈를 다시 만들어줍니다
            updateQuiz();
        }
        // 스피커 버튼을 눌렀을 때 단어를 읽어주는 함수입니다
        function speakWord(event) {
            // 버튼을 누를 때 카드 전체가 뒤집히는 것을 막습니다
            event.stopPropagation();
            // 브라우저가 음성 재생을 지원하는지 확인합니다
            if ('speechSynthesis' in window) {
                // 현재 단어의 영어 텍스트를 가져옵니다
                const text = words[currentIndex].en;
                // 음성으로 읽어줄 설정을 만듭니다
                const utterance = new SpeechSynthesisUtterance(text);
                // 언어를 영어로 설정합니다
                utterance.lang = 'en-US';
                // 말하는 속도를 조금 느리게 조절합니다
                utterance.rate = 0.8;
                // 브라우저 음성 기능을 실행해 소리를 냅니다
                window.speechSynthesis.speak(utterance);
            } else {
                // 음성 기능을 지원하지 않으면 알림창을 띄웁니다
                alert("이 브라우저는 소리를 지원하지 않아요");
            }
        }
        // 단어에 맞는 퀴즈 보기 4개를 무작위로 만들어주는 함수입니다
        function updateQuiz() {
            // 이번 문제의 정답 뜻을 가져옵니다
            const correctKo = words[currentIndex].ko;
            // 보기 버튼들이 들어갈 자리를 찾습니다
            const quizOptionsEl = document.getElementById('quizOptions');
            // 이전 보기들을 깨끗이 지웁니다
            quizOptionsEl.innerHTML = '';
            // 아직 이번 문제를 풀지 않은 상태로 초기화합니다
            hasAnswered = false;
            // 정답이 아닌 다른 단어들의 뜻을 모읍니다
            const otherMeanings = words.filter(w => w.ko !== correctKo).map(w => w.ko);
            // 다른 뜻들을 무작위로 섞습니다
            otherMeanings.sort(() => Math.random() - 0.5);
            // 오답 3개를 골라냅니다
            const wrongOptions = otherMeanings.slice(0, 3);
            // 정답 하나와 오답 3개를 합칩니다
            const options = [correctKo, ...wrongOptions];
            // 4개의 보기를 무작위로 섞습니다
            options.sort(() => Math.random() - 0.5);
            // 4개의 보기 버튼을 각각 화면에 만들어줍니다
            options.forEach(optionText => {
                const btn = document.createElement('button');
                btn.className = 'quiz-btn';
                btn.innerText = optionText;
                btn.onclick = () => checkQuizAnswer(btn, optionText, correctKo);
                quizOptionsEl.appendChild(btn);
            });
        }
        // 퀴즈 보기를 눌렀을 때 정답인지 확인하고 점수를 올리는 함수입니다
        function checkQuizAnswer(clickedBtn, selectedText, correctText) {
            // 이미 문제를 풀었다면 중복으로 점수가 올라가지 않게 막습니다
            if (hasAnswered) return;
            hasAnswered = true;
            // 모든 보기 버튼을 가져옵니다
            const allButtons = document.querySelectorAll('.quiz-btn');
            // 정답 버튼은 초록색으로, 틀린 보기들은 흐리게 만듭니다
            allButtons.forEach(btn => {
                if (btn.innerText === correctText) {
                    btn.classList.add('correct');
                } else if (btn === clickedBtn) {
                    btn.classList.add('wrong');
                } else {
                    btn.classList.add('wrong');
                }
            });
            // 누른 보기가 정답과 같다면 맞은 개수를 늘립니다
            if (selectedText === correctText) {
                correctCount++;
            } else {
                // 틀렸다면 틀린 개수를 늘립니다
                wrongCount++;
            }
            // 점수판 글씨를 최신 상태로 바꿔줍니다
            document.getElementById('scoreBoard').innerText = `맞은 개수: ${correctCount} | 틀린 개수: ${wrongCount}`;
        }
        // 웹페이지가 처음 켜졌을 때 카드를 화면에 그려줍니다
        updateCard();
        updateQuiz();
    </script>
</body>
</html>
