<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 화면 크기를 모바일과 태블릿에 맞게 자동으로 조절합니다 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다이아몬드 럭셔리 중학 영단어 수첩</title>
    <!-- 구글 폰트에서 우아한 나눔손글씨와 깔끔한 가구체를 불러옵니다 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
    <style>
        /* :root 변수에 다이아몬드 수첩 디자인에 사용될 색상을 정의하고 한국어 주석을 달아둡니다 */
        :root {
            --배경색: #0b0f19;          /* 다이아몬드 밤하늘을 연상시키는 깊은 딥 네이비 배경색 */
            --수첩색상: #131b2e;        /* 고급 다이아몬드 가죽 질감의 묵직한 표지 색상 */
            --종이색상: #f8fafc;        /* 은은하게 빛나는 플래티넘 미색 노트 페이지 종이 배경색 */
            --글자색: #1e293b;          /* 종이 위에서 선명하게 읽히는 딥 네이비 글자 색상 */
            --포인트색: #d4af37;        /* 반짝이는 다이아몬드 골드 포인트 색상 */
            --보조포인트: #38bdf8;      /* 다이아몬드 빛 반사를 연상시키는 아이스 블루 광채 색상 */
            --테두리색: #cbd5e1;        /* 종이 테두리 및 은은한 줄무늬 색상 */
            --그림자색: rgba(0, 0, 0, 0.6); /* 입체감과 보석 같은 깊이를 주는 그림자 색상 */
        }

        /* 웹페이지 전체의 기본 정렬과 다이아몬드 패턴 배경 스타일을 지정합니다 */
        body {
            margin: 0;
            padding: 20px;
            background-color: var(--배경색);
            /* 다이아몬드/마름모 패턴을 배경에 세련되게 연출합니다 */
            background-image: linear-gradient(30deg, rgba(212, 175, 55, 0.05) 12%, transparent 12.5%, transparent 87%, rgba(212, 175, 55, 0.05) 87.5%, rgba(212, 175, 55, 0.05)),
                              linear-gradient(150deg, rgba(212, 175, 55, 0.05) 12%, transparent 12.5%, transparent 87%, rgba(212, 175, 55, 0.05) 87.5%, rgba(212, 175, 55, 0.05)),
                              radial-gradient(rgba(56, 189, 248, 0.08) 1px, transparent 1px);
            background-size: 40px 70px;
            color: var(--종이색상);
            font-family: 'Nanum Pen Script', cursive, sans-serif;
            font-size: 26px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* 다이아몬드 수첩 전체 레이아웃을 감싸는 외곽 상자입니다 */
        .notebook-container {
            width: 100%;
            max-width: 480px;
            background-color: var(--수첩색상);
            border-radius: 22px; /* 카드 모서리 둥글기 22px 적용 */
            padding: 25px 20px;
            box-sizing: border-box;
            box-shadow: 0 20px 40px var(--그림자색), inset 0 0 25px rgba(212, 175, 55, 0.2);
            border: 3px solid var(--포인트색); /* 다이아몬드 골드 테두리 장식 */
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            position: relative;
        }

        /* 수첩 상단에 다이아몬드 보석을 품은 듯한 리본 장식입니다 */
        .notebook-container::before {
            content: '💎';
            position: absolute;
            top: -16px;
            left: 35px;
            font-size: 20px;
            background: linear-gradient(135deg, #131b2e, #1e293b);
            padding: 0 6px;
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(212, 175, 55, 0.5);
        }

        /* 다이아몬드 럭셔리 감성을 담은 상단 제목 스타일입니다 */
        h1 {
            margin: 0;
            font-size: 38px;
            color: var(--포인트색);
            text-align: center;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8), 0 0 10px rgba(212, 175, 55, 0.4);
            letter-spacing: 1px;
        }

        /* 현재 진도 표시 (예: 1 / 67) 글자 스타일입니다 */
        .progress-indicator {
            font-size: 22px;
            color: #94a3b8;
            font-weight: bold;
        }

        /* 3D 카드가 뒤집히는 공간을 만들어 주는 상자입니다 */
        .card-container {
            width: 100%;
            height: 220px;
            perspective: 1000px;
            cursor: pointer;
        }

        /* 카드 앞면과 뒷면을 회전시키는 본체입니다 */
        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s ease;
            border-radius: 22px; /* 카드 모서리 둥글기 22px 적용 */
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        /* 카드가 뒤집혔을 때 작동하는 회전 각도 클래스입니다 */
        .card.is-flipped {
            transform: rotateY(180deg);
        }

        /* 카드 앞면과 뒷면의 공통 디자인입니다 */
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: var(--종이색상);
            /* 다이아몬드 노트 페이지의 정돈된 줄무늬 질감입니다 */
            background-image: linear-gradient(var(--테두리색) 1px, transparent 1px);
            background-size: 100% 30px;
            border-radius: 22px; /* 카드 모서리 둥글기 22px 적용 */
            padding: 20px;
            box-sizing: border-box;
            border: 2px solid var(--포인트색);
            color: var(--글자색);
        }

        /* 카드 뒷면은 미리 180도 뒤집어 놓습니다 */
        .card-back {
            transform: rotateY(180deg);
            text-align: center;
        }

        /* 영어 단어 폰트와 크기를 지정합니다 */
        .en-word {
            font-family: 'Gaegu', cursive, sans-serif;
            font-size: 44px;
            font-weight: 700;
            color: #0f172a;
            margin: 0;
        }

        /* 한국어 뜻 글자 크기입니다 */
        .ko-word {
            font-size: 30px;
            margin: 5px 0;
            font-weight: bold;
            color: #0f172a;
        }

        /* 예문 글자 크기입니다 */
        .ex-sentence {
            font-size: 19px;
            color: #475569;
            margin-top: 8px;
            font-style: italic;
        }

        /* 발음 듣기 스피커 버튼 스타일입니다 */
        .speaker-btn {
            background-color: var(--포인트색);
            color: #0f172a;
            border: none;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s, background-color 0.2s;
        }

        .speaker-btn:hover {
            transform: scale(1.1);
            background-color: #e6c55c;
        }

        /* 이전, 다음 버튼을 감싸는 영역입니다 */
        .nav-buttons {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        /* 공통 버튼 디자인입니다 */
        button {
            flex: 1;
            padding: 8px;
            font-family: 'Nanum Pen Script', cursive, sans-serif;
            font-size: 24px;
            background-color: var(--포인트색);
            color: #0f172a;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            font-weight: bold;
            transition: opacity 0.2s, transform 0.1s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:active {
            transform: scale(0.98);
        }

        /* 퀴즈 영역 전체 상자입니다 */
        .quiz-box {
            width: 100%;
            background-color: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 12px;
            box-sizing: border-box;
            border: 2px dashed rgba(212, 175, 55, 0.4);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* 퀴즈 질문 문구입니다 */
        .quiz-title {
            font-size: 20px;
            text-align: center;
            margin: 0;
            font-weight: bold;
            color: var(--포인트색);
        }

        /* 4개 보기 버튼을 배치하는 격자 구조입니다 */
        .quiz-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        /* 개별 보기 버튼 스타일입니다 */
        .quiz-btn {
            background-color: var(--종이색상);
            color: var(--글자색);
            border: 1px solid var(--포인트색);
            font-size: 19px;
            padding: 5px;
            border-radius: 10px;
            box-shadow: none;
            font-weight: normal;
        }

        /* 정답을 맞혔을 때 변하는 다이아몬드 초록색 스타일입니다 */
        .quiz-btn.correct {
            background-color: #10b981 !important;
            color: #ffffff !important;
            border-color: #059669 !important;
        }

        /* 오답일 때 흐려지는 스타일입니다 */
        .quiz-btn.wrong {
            opacity: 0.3;
        }

        /* 맞은 개수와 틀린 개수를 보여주는 점수판입니다 */
        .score-board {
            font-size: 19px;
            text-align: center;
            color: #94a3b8;
            margin: 0;
        }

        /* 브라우저가 음성을 지원하지 않을 때 뜨는 안내 메시지입니다 */
        .alert-box {
            font-size: 16px;
            color: #f87171;
            text-align: center;
            min-height: 18px;
            margin: 0;
        }
    </style>
</head>
<body>

    <!-- 다이아몬드 수첩 형태의 전체 메인 화면 상자 -->
    <div class="notebook-container">
        <!-- 수첩 상단 다이아몬드 감성의 제목 -->
        <h1>다이아몬드 중학 영단어</h1>

        <!-- 현재 진도 표시 (예: 1 / 67) -->
        <div id="progress" class="progress-indicator">1 / 67</div>

        <!-- 단어 카드 영역 (누르면 뒤집힘) -->
        <div class="card-container" id="cardContainer">
            <div class="card" id="card">
                <!-- 카드 앞면: 영어 단어 및 발음 듣기 버튼 -->
                <div class="card-face card-front">
                    <div id="enWord" class="en-word"></div>
                    <button class="speaker-btn" id="speakerBtn" title="발음 듣기">🔊</button>
                </div>
                <!-- 카드 뒷면: 한국어 뜻 및 예문 -->
                <div class="card-face card-back">
                    <div id="koWord" class="ko-word"></div>
                    <div id="exSentence" class="ex-sentence"></div>
                </div>
            </div>
        </div>

        <!-- 이전 / 다음 이동 버튼 영역 -->
        <div class="nav-buttons">
            <button id="prevBtn">이전 단어</button>
            <button id="nextBtn">다음 단어</button>
        </div>

        <!-- 하단 4지선다 퀴즈 영역 -->
        <div class="quiz-box">
            <div class="quiz-title">이 단어의 뜻은?</div>
            <div class="quiz-options" id="quizOptions"></div>
        </div>

        <!-- 정오답 점수 기록판 -->
        <div class="score-board" id="scoreBoard">맞은 개수: 0 | 틀린 개수: 0</div>

        <!-- 음성 미지원 안내 메시지 -->
        <div class="alert-box" id="alertBox"></div>
    </div>

    <script>
        // 여기만 고치세요: 중학교에서 가장 많이 사용하는 필수 영어 단어 67개 목록입니다.
        const WORDS = [
            { en: 'about', ko: '~에 대하여', ex: 'We talked about the movie.' },
            { en: 'above', ko: '~보다 위에', ex: 'The plane is above the clouds.' },
            { en: 'accept', ko: '수락하다', ex: 'I accept your offer.' },
            { en: 'across', ko: '가로질러', ex: 'She walked across the street.' },
            { en: 'act', ko: '행동하다', ex: 'Act naturally during the play.' },
            { en: 'add', ko: '더하다', ex: 'Add some sugar to the tea.' },
            { en: 'afraid', ko: '두려워하는', ex: 'Do not be afraid of mistakes.' },
            { en: 'after', ko: '~후에', ex: 'We will eat dinner after class.' },
            { en: 'again', ko: '다시', ex: 'Please say it again.' },
            { en: 'age', ko: '나이', ex: 'What is your age?' },
            { en: 'agree', ko: '동의하다', ex: 'I agree with your plan.' },
            { en: 'air', ko: '공기', ex: 'Fresh air is good for health.' },
            { en: 'allow', ko: '허락하다', ex: 'Dogs are not allowed here.' },
            { en: 'almost', ko: '거의', ex: 'I am almost finished.' },
            { en: 'alone', ko: '혼자의', ex: 'She lives alone in the city.' },
            { en: 'already', ko: '이미', ex: 'I have already eaten lunch.' },
            { en: 'always', ko: '항상', ex: 'He is always on time.' },
            { en: 'among', ko: '~의 사이에', ex: 'He was happy among friends.' },
            { en: 'anger', ko: '분노', ex: 'He tried to control his anger.' },
            { en: 'answer', ko: '대답하다', ex: 'Please answer the phone.' },
            { en: 'any', ko: '어떤, 무슨', ex: 'Do you have any questions?' },
            { en: 'area', ko: '지역', ex: 'This area is very quiet.' },
            { en: 'arrive', ko: '도착하다', ex: 'We arrived home safely.' },
            { en: 'ask', ko: '묻다, 요청하다', ex: 'Ask me anything.' },
            { en: 'attack', ko: '공격하다', ex: 'The cat will attack the toy.' },
            { en: 'available', ko: '이용 가능한', ex: 'Is this seat available?' },
            { en: 'avoid', ko: '피하다', ex: 'Try to avoid heavy traffic.' },
            { en: 'bad', ko: '나쁜', ex: 'Eating too much candy is bad.' },
            { en: 'balance', ko: '균형', ex: 'Keep your balance on the bike.' },
            { en: 'base', ko: '기초', ex: 'Build a strong base for learning.' },
            { en: 'beat', ko: '이기다, 치다', ex: 'Our team can beat them.' },
            { en: 'become', ko: '~가 되다', ex: 'She wants to become a doctor.' },
            { en: 'begin', ko: '시작하다', ex: 'The movie will begin soon.' },
            { en: 'believe', ko: '믿다', ex: 'I believe in your dream.' },
            { en: 'benefit', ko: '이익', ex: 'Reading books brings many benefits.' },
            { en: 'better', ko: '더 나은', ex: 'Tomorrow will be better.' },
            { en: 'beyond', ko: '~를 넘어서', ex: 'Look beyond the mountains.' },
            { en: 'bit', ko: '조금', ex: 'Wait a bit, please.' },
            { en: 'board', ko: '판, 탑승하다', ex: 'Look at the blackboard.' },
            { en: 'body', ko: '몸', ex: 'Exercise keeps your body strong.' },
            { en: 'born', ko: '태어난', ex: 'I was born in Seoul.' },
            { en: 'both', ko: '양쪽 모두', ex: 'Both answers are correct.' },
            { en: 'bottom', ko: '맨 아래', ex: 'Write your name at the bottom.' },
            { en: 'box', ko: '상자', ex: 'Put the toys in the box.' },
            { en: 'break', ko: '깨다, 휴식', ex: 'Take a short break.' },
            { en: 'bright', ko: '밝은', ex: 'The sun is very bright today.' },
            { en: 'bring', ko: '가져오다', ex: 'Bring your umbrella with you.' },
            { en: 'brother', ko: '형제', ex: 'I have an older brother.' },
            { en: 'build', ko: '짓다, 세우다', ex: 'They build a sandcastle.' },
            { en: 'burn', ko: '타다, 태우다', ex: 'Wood burns easily.' },
            { en: 'business', ko: '사업, 일', ex: 'He runs a small business.' },
            { en: 'busy', ko: '바쁜', ex: 'Mom is busy cooking dinner.' },
            { en: 'buy', ko: '사다', ex: 'I want to buy a new book.' },
            { en: 'call', ko: '전화하다, 부르다', ex: 'Call me later.' },
            { en: 'camera', ko: '카메라', ex: 'Take a picture with the camera.' },
            { en: 'camp', ko: '캠프, 야영하다', ex: 'We went to summer camp.' },
            { en: 'can', ko: '~할 수 있다', ex: 'I can speak English.' },
            { en: 'capital', ko: '수도, 대문자', ex: 'Seoul is the capital of Korea.' },
            { en: 'card', ko: '카드', ex: 'I wrote a birthday card.' },
            { en: 'care', ko: '돌보다, 걱정', ex: 'Take care of your pet.' },
            { en: 'carry', ko: '나르다, 들다', ex: 'Can you carry this bag?' },
            { en: 'case', ko: '경우, 상자', ex: 'In this case, try again.' },
            { en: 'catch', ko: '잡다', ex: 'Catch the ball.' },
            { en: 'cause', ko: '원인, 야기하다', ex: 'What caused the fire?' },
            { en: 'center', ko: '중심', ex: 'The park is in the center of town.' },
            { en: 'chance', ko: '기회', ex: 'This is your second chance.' },
            { en: 'change', ko: '바꾸다, 변화', ex: 'People can change their habits.' }
        ];

        // 현재 보고 있는 단어의 번호 (0부터 시작)
        let currentIndex = 0;
        // 맞은 퀴즈 정답 개수
        let correctCount = 0;
        // 틀린 퀴즈 오답 개수
        let wrongCount = 0;
        // 보기를 이미 눌렀는지 판별하여 중복 클릭을 막는 상태 변수
        let isAnswered = false;

        // 화면에 요소를 조작하기 위해 HTML DOM 객체들을 가져옵니다
        const cardContainer = document.getElementById('cardContainer');
        const card = document.getElementById('card');
        const enWordEl = document.getElementById('enWord');
        const koWordEl = document.getElementById('koWord');
        const exSentenceEl = document.getElementById('exSentence');
        const progressEl = document.getElementById('progress');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const speakerBtn = document.getElementById('speakerBtn');
        const quizOptionsEl = document.getElementById('quizOptions');
        const scoreBoardEl = document.getElementById('scoreBoard');
        const alertBoxEl = document.getElementById('alertBox');

        // 현재 지정된 번호의 단어를 화면에 보여주는 함수입니다
        function showWord(index) {
            // 카드를 누르기 전 앞면 상태로 되돌립니다
            card.classList.remove('is-flipped');
            
            // 현재 단어 데이터 객체를 가져옵니다
            const currentItem = WORDS[index];
            
            // 앞면 영어 단어를 채워 넣습니다
            enWordEl.textContent = currentItem.en;
            // 뒷면 한국어 뜻을 채워 넣습니다
            koWordEl.textContent = currentItem.ko;
            // 뒷면 예문을 채워 넣습니다
            exSentenceEl.textContent = currentItem.ex;
            
            // 현재 진도를 "현재 번호 / 전체 개수" 형식으로 표시합니다
            progressEl.textContent = (index + 1) + ' / ' + WORDS.length;

            // 새로운 단어에 맞추어 4지선다 퀴즈를 생성합니다
            createQuiz();
        }

        // 단어 카드를 클릭하면 3D로 앞뒤가 뒤집히는 이벤트입니다
        cardContainer.addEventListener('click', function() {
            card.classList.toggle('is-flipped');
        });

        // 이전 버튼을 눌렀을 때 앞 단어로 이동하는 이벤트입니다
        prevBtn.addEventListener('click', function(event) {
            event.stopPropagation(); // 카드 뒤집기 동작 중복 실행 방지
            if (currentIndex > 0) {
                currentIndex--;
                showWord(currentIndex);
            }
        });

        // 다음 버튼을 눌렀을 때 뒷 단어로 이동하는 이벤트입니다
        nextBtn.addEventListener('click', function(event) {
            event.stopPropagation(); // 카드 뒤집기 동작 중복 실행 방지
            if (currentIndex < WORDS.length - 1) {
                currentIndex++;
                showWord(currentIndex);
            }
        });

        // 스피커 버튼을 눌렀을 때 브라우저 음성 기능으로 단어를 읽어주는 이벤트입니다
        speakerBtn.addEventListener('click', function(event) {
            event.stopPropagation(); // 카드 뒤집기 동작 중복 실행 방지
            
            // 브라우저가 음성 합성(speechSynthesis)을 지원하는지 확인합니다
            if ('speechSynthesis' in window) {
                const textToSpeak = WORDS[currentIndex].en;
                const utterance = new SpeechSynthesisUtterance(textToSpeak);
                utterance.lang = 'en-US'; // 영어 발음 설정
                utterance.rate = 0.75;    // 초등학생도 잘 들을 수 있게 속도를 살짝 느리게 조절
                window.speechSynthesis.speak(utterance);
            } else {
                // 지원하지 않는 경우 화면에 안내 문구를 띄워줍니다
                alertBoxEl.textContent = '이 브라우저는 소리를 지원하지 않아요';
            }
        });

        // 현재 단어 뜻 1개와 다른 단어 뜻 오답 3개를 섞어 4지선다 퀴즈를 만드는 함수입니다
        function createQuiz() {
            isAnswered = false; // 풀이 상태 초기화
            quizOptionsEl.innerHTML = ''; // 기존 보기 버튼 초기화

            const currentItem = WORDS[currentIndex];
            const correctAnswer = currentItem.ko;

            // 오답을 고르기 위해 정답과 다른 뜻을 가진 단어들을 모읍니다
            let wrongChoices = [];
            for (let i = 0; i < WORDS.length; i++) {
                if (WORDS[i].ko !== correctAnswer) {
                    wrongChoices.push(WORDS[i].ko);
                }
            }

            // 오답 목록을 무작위로 섞습니다
            wrongChoices.sort(function() {
                return Math.random() - 0.5;
            });

            // 정답 1개와 무작위 오답 3개를 합쳐서 4개 보기를 구성합니다
            let choices = [correctAnswer, wrongChoices[0], wrongChoices[1], wrongChoices[2]];

            // 4개 보기의 순서도 무작위로 섞어줍니다
            choices.sort(function() {
                return Math.random() - 0.5;
            });

            // 4개의 보기 버튼을 화면에 동적으로 생성합니다
            for (let i = 0; i < choices.length; i++) {
                const btn = document.createElement('button');
                btn.textContent = choices[i];
                btn.className = 'quiz-btn';

                // 보기 버튼을 클릭했을 때 정오답을 판별하는 이벤트입니다
                btn.addEventListener('click', function(event) {
                    event.stopPropagation(); // 카드 뒤집기 방지
                    if (isAnswered) return; // 이미 골랐다면 무시
                    isAnswered = true;

                    // 사용자가 고른 보기가 정답일 때
                    if (choices[i] === correctAnswer) {
                        btn.classList.add('correct');
                        correctCount++;
                    } else {
                        // 틀렸을 때 고른 것은 흐리게 하고 진짜 정답 버튼은 다이아몬드 초록색으로 표시
                        btn.classList.add('wrong');
                        wrongCount++;

                        const allBtns = quizOptionsEl.getElementsByTagName('button');
                        for (let j = 0; j < allBtns.length; j++) {
                            if (allBtns[j].textContent === correctAnswer) {
                                allBtns[j].classList.add('correct');
                            }
                        }
                    }

                    // 점수판 글자를 업데이트합니다
                    scoreBoardEl.textContent = '맞은 개수: ' + correctCount + ' | 틀린 개수: ' + wrongCount;
                });

                quizOptionsEl.appendChild(btn);
            }
        }

        // 웹페이지가 처음 실행될 때 첫 번째 단어를 화면에 띄워줍니다
        showWord(currentIndex);
    </script>
</body>
</html>
