<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WORD DECK · 나만의 영어 단어 학습장</title>
<meta name="description" content="카드로 외우고 퀴즈로 확인하는 나만의 영어 단어장">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="WORD DECK">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Gowun+Dodum&family=Jua&family=Gaegu:wght@400;700&family=Do+Hyeon&family=Nanum+Pen+Script&family=Noto+Serif+KR:wght@400;700&family=Orbitron:wght@600&display=swap" rel="stylesheet">
<style>
/* ===================================================================
   WORD DECK — 세영코딩연구소 샘플 앱
   테마를 고르면 앱 전체가 그 무드로 바뀝니다. (JS가 아래 변수를 갈아끼움)
   =================================================================== */
:root{
  box-sizing:border-box;
  --bg:#eef1f7;          /* 전체 배경 */
  --surface:#ffffff;     /* 카드·패널 */
  --ink:#171f2e;         /* 글자 */
  --sub:#7b879f;         /* 흐린 글자 */
  --point:#3b61e8;       /* 포인트 */
  --line:#dde3ee;        /* 경계선 */
  --radius:20px;
  --shadow:0 12px 28px rgba(25,40,80,.10);
  --pattern:none;
  --font:'Gowun Dodum', system-ui, sans-serif;
  --word:'Fredoka', sans-serif;
  --ui:'Gowun Dodum', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-custom="1"]){
    --bg:#0f1420; --surface:#1a2231; --ink:#e9eef8; --sub:#8e9bb5;
    --point:#7d9bff; --line:#2a3447; --shadow:0 12px 28px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]:not([data-custom="1"]){
  --bg:#0f1420; --surface:#1a2231; --ink:#e9eef8; --sub:#8e9bb5;
  --point:#7d9bff; --line:#2a3447; --shadow:0 12px 28px rgba(0,0,0,.45);
}
*,*::before,*::after{ box-sizing:inherit; }
html{ -webkit-text-size-adjust:100%; height:100%; overscroll-behavior-y:none; }
body{
  margin:0; min-height:100%; background:var(--bg); background-image:var(--pattern);
  color:var(--ink); font-family:var(--font); line-height:1.65;
  -webkit-tap-highlight-color:transparent;
  transition:background-color .4s ease, color .4s ease;
  padding-top:env(safe-area-inset-top, 0px);
}
button,input,select,textarea{ font-family:inherit; color:inherit; font-size:inherit; }
button{ touch-action:manipulation; }
:focus-visible{ outline:3px solid var(--point); outline-offset:2px; border-radius:6px; }

.app{ width:min(760px, 100%); margin-inline:auto; padding:0 16px 120px;
  padding-bottom:calc(104px + env(safe-area-inset-bottom, 0px)); }

/* 상단 바 */
.appbar{ display:flex; align-items:center; gap:12px; padding:16px 2px 12px; }
.logo{ font-family:var(--word); font-weight:700; font-size:17px; letter-spacing:.06em; }
.logo b{ color:var(--point); }
.appbar .stat{ margin-left:auto; display:flex; gap:8px; align-items:center; font-size:12.5px; color:var(--sub); }
.pill{ background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:5px 12px; }
.pill b{ color:var(--ink); }

/* 진도 */
.progress{ display:flex; align-items:center; gap:10px; font-size:12px; color:var(--sub); margin-bottom:16px; }
.progress .bar{ flex:1; height:7px; border-radius:99px; background:color-mix(in srgb, var(--sub) 25%, transparent); overflow:hidden; }
.progress .bar i{ display:block; height:100%; background:var(--point); border-radius:99px; transition:width .35s ease; }

/* 카드 */
.cardbox{ perspective:1400px; }
.flip{ position:relative; width:100%; min-height:300px; cursor:pointer;
  transform-style:preserve-3d; transition:transform .6s cubic-bezier(.2,.8,.2,1); }
.flip.on{ transform:rotateY(180deg); }
.face{ position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:12px; padding:30px 22px; text-align:center; border:1px solid var(--line); }
.face.back{ transform:rotateY(180deg); }
.face p{ margin:0; }
.word{ font-family:var(--word); font-weight:600; font-size:clamp(38px,9vw,62px); line-height:1.05; }
.tagline{ font-size:11.5px; letter-spacing:.18em; color:var(--sub); }
.mean{ font-size:clamp(24px,5.4vw,34px); font-weight:600; color:var(--point); }
.sent{ font-family:var(--word); font-size:15.5px; color:var(--sub); max-width:32ch; line-height:1.6; }
.known-mark{ position:absolute; top:14px; right:16px; font-size:19px; opacity:.25; }
.known-mark.on{ opacity:1; }

.row{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:18px; }
.btn{ cursor:pointer; border:1px solid var(--line); background:var(--surface); color:var(--ink);
  border-radius:999px; padding:11px 20px; font-size:14px; min-height:44px; box-shadow:var(--shadow); }
.btn:hover{ border-color:var(--point); color:var(--point); }
.btn.main{ background:var(--point); border-color:var(--point); color:var(--bg); font-weight:600; }
.btn.main:hover{ color:var(--bg); opacity:.92; }
.btn.ghost{ box-shadow:none; background:transparent; }
.btn.sm{ padding:7px 14px; font-size:12.5px; min-height:36px; box-shadow:none; }
.btn[aria-pressed="true"]{ border-color:var(--point); color:var(--point); font-weight:600; }
.btn.danger:hover{ border-color:#e05252; color:#e05252; }

/* 패널 */
.panel{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px 18px; margin-top:16px; box-shadow:var(--shadow); }
.panel h3{ margin:0 0 4px; font-size:15px; }
.panel p.hint{ margin:0 0 12px; font-size:12.5px; color:var(--sub); }
.label{ font-size:11px; letter-spacing:.14em; color:var(--sub); margin:0 0 8px; }

/* 퀴즈 */
.qhead{ text-align:center; margin-bottom:16px; }
.qhead .qn{ font-size:12px; letter-spacing:.14em; color:var(--sub); }
.qhead .qq{ font-family:var(--word); font-weight:600; font-size:clamp(32px,7vw,50px); margin:6px 0 0; }
.qhead .qq.ko{ font-family:var(--font); font-size:clamp(26px,6vw,40px); }
.opts{ display:grid; gap:10px; }
@media (min-width:560px){ .opts{ grid-template-columns:1fr 1fr; } }
.opt{ cursor:pointer; border:1px solid var(--line); background:var(--surface); color:var(--ink);
  border-radius:14px; padding:15px 16px; font-size:15.5px; text-align:left; min-height:52px;
  box-shadow:var(--shadow); transition:transform .12s; }
.opt:hover{ transform:translateY(-1px); border-color:var(--point); }
.opt[data-s="o"]{ border-color:var(--point); background:color-mix(in srgb, var(--point) 16%, var(--surface)); font-weight:600; }
.opt[data-s="x"]{ opacity:.4; text-decoration:line-through; }
.opt .en{ font-family:var(--word); }
.result{ text-align:center; padding:18px 0; }
.result .big{ font-family:var(--word); font-weight:700; font-size:clamp(44px,10vw,70px); color:var(--point); line-height:1; }
.wrongs{ list-style:none; margin:14px 0 0; padding:0; display:grid; gap:8px; text-align:left; }
.wrongs li{ display:flex; gap:10px; align-items:baseline; border-bottom:1px dashed var(--line); padding-bottom:6px; font-size:14.5px; }
.wrongs li b{ font-family:var(--word); font-weight:600; }
.wrongs li span{ color:var(--sub); margin-left:auto; font-size:13px; }

/* 단어 목록 */
.wlist{ list-style:none; margin:0; padding:0; display:grid; gap:8px; }
.witem{ display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center;
  border-bottom:1px dashed var(--line); padding:8px 2px; }
.witem .star{ border:none; background:transparent; cursor:pointer; font-size:17px; opacity:.28; padding:0; }
.witem .star[aria-pressed="true"]{ opacity:1; }
.witem .en{ font-family:var(--word); font-weight:600; font-size:17px; }
.witem .ko{ font-size:13.5px; color:var(--sub); }
.witem .del{ border:none; background:transparent; color:var(--sub); cursor:pointer; font-size:12.5px; }
.witem .del:hover{ color:#e05252; }
.form{ display:grid; gap:8px; margin-top:14px; }
.form .three{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
input[type="text"], textarea, select{
  border:1px solid var(--line); background:var(--bg); color:var(--ink);
  border-radius:12px; padding:11px 13px; width:100%; font-size:15px; }
textarea{ min-height:110px; resize:vertical; line-height:1.6; }
input[type="color"]{ border:1px solid var(--line); background:var(--bg); border-radius:12px;
  padding:3px; width:100%; height:42px; }
input[type="range"]{ width:100%; accent-color:var(--point); }
code.out{ display:block; white-space:pre-wrap; word-break:break-word; font-size:12.5px;
  background:var(--bg); border:1px dashed var(--line); border-radius:12px; padding:12px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace; line-height:1.65; margin-top:10px; }

/* 테마 덱 */
.deck{ display:grid; gap:12px; }
@media (min-width:600px){ .deck{ grid-template-columns:1fr 1fr; } }
.tcard{ border:1px solid var(--line); background:var(--surface); border-radius:16px; padding:14px 16px;
  box-shadow:var(--shadow); }
.tcard[data-active="true"]{ border-color:var(--point); box-shadow:0 0 0 3px color-mix(in srgb, var(--point) 22%, transparent); }
.tcard header{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.tcard h4{ margin:0; font-size:15px; }
.mine{ font-size:10.5px; font-weight:600; padding:2px 8px; border-radius:999px;
  background:color-mix(in srgb, var(--point) 18%, transparent); color:var(--point); }
.chips{ display:inline-flex; gap:4px; margin-left:auto; }
.chips i{ width:14px; height:14px; border-radius:5px; border:1px solid var(--line); display:block; }
.tcard p.d{ margin:0 0 10px; font-size:12.5px; color:var(--sub); line-height:1.55; }
.tcard details{ margin-top:9px; }
.tcard summary{ cursor:pointer; font-size:12px; color:var(--sub); }
.tcard pre{ margin:8px 0 0; white-space:pre-wrap; word-break:break-word; font-size:12px;
  background:var(--bg); border-radius:10px; padding:10px 12px; font-family:var(--font); line-height:1.6; }
.acts{ display:flex; gap:6px; flex-wrap:wrap; }

/* 질감 */
[data-skin="jelly"] .face,[data-skin="jelly"] .opt,[data-skin="jelly"] .panel{
  box-shadow:0 8px 0 color-mix(in srgb, var(--point) 22%, transparent); }
[data-skin="neon"] .face,[data-skin="neon"] .opt{
  box-shadow:0 0 26px color-mix(in srgb, var(--point) 35%, transparent); }
[data-skin="neon"] .word,[data-skin="neon"] .result .big{
  text-shadow:0 0 20px color-mix(in srgb, var(--point) 60%, transparent); }
[data-skin="paper"] .face{ border-style:dashed; }
[data-skin="paper"] .opt{ border-style:dashed; }
[data-skin="mono"] .face,[data-skin="mono"] .opt,[data-skin="mono"] .panel,[data-skin="mono"] .btn{ box-shadow:none; }

/* 탭 바 */
.tabbar{ position:fixed; left:0; right:0; bottom:0; z-index:50; display:flex;
  background:color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter:blur(12px);
  border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom, 0px); }
.tabbar button{ flex:1; border:none; background:transparent; cursor:pointer; padding:11px 4px 13px;
  color:var(--sub); font-size:11.5px; display:grid; gap:3px; justify-items:center; }
.tabbar button em{ font-style:normal; font-size:19px; line-height:1; }
.tabbar button[aria-selected="true"]{ color:var(--point); font-weight:600;
  box-shadow:inset 0 3px 0 var(--point); }

.install{ position:fixed; right:12px; top:calc(10px + env(safe-area-inset-top, 0px)); z-index:60;
  border:1px solid var(--line); background:var(--surface); color:var(--sub); border-radius:999px;
  padding:7px 14px; font-size:12.5px; cursor:pointer; box-shadow:var(--shadow); }
.install[hidden]{ display:none; }
.howto{ position:fixed; z-index:70; left:50%; transform:translateX(-50%);
  bottom:calc(86px + env(safe-area-inset-bottom, 0px)); width:min(320px,88vw);
  background:var(--ink); color:var(--bg); border-radius:14px; padding:14px 16px; font-size:13.5px; }
.howto b{ display:block; margin-bottom:4px; }
.howto button{ border:none; background:transparent; color:var(--point); cursor:pointer; padding:6px 0 0; }

footer.credit{ text-align:center; font-size:11.5px; color:var(--sub); padding:22px 0 6px; line-height:1.8; }

#toast{ position:fixed; left:50%; transform:translateX(-50%) translateY(16px);
  bottom:calc(86px + env(safe-area-inset-bottom, 0px)); z-index:80; background:var(--ink);
  color:var(--bg); padding:10px 18px; border-radius:999px; font-size:13.5px;
  opacity:0; pointer-events:none; transition:opacity .22s, transform .22s; }
#toast[data-show="true"]{ opacity:1; transform:translateX(-50%) translateY(0); }
@media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
@media (display-mode:standalone){ .app{ padding-top:4px; } }
</style>
</head>
<body>

<button class="install" id="installBtn" type="button" hidden>앱으로 설치</button>

<div class="app">
  <div class="appbar">
    <div class="logo">WORD <b>DECK</b></div>
    <div class="stat">
      <span class="pill" id="starStat">⭐ 0</span>
      <span class="pill" id="countStat">0 단어</span>
    </div>
  </div>
  <main id="view"></main>
  <footer class="credit">
    <p style="margin:0"><b>세영코딩연구소</b>　저자 : 컴퓨터공학박사 KIM</p>
    <p style="margin:0">바이브 코딩 샘플 — 나만의 영어 단어 학습장</p>
  </footer>
</div>

<nav class="tabbar" id="tabbar" aria-label="메뉴"></nav>
<div id="toast" role="status" aria-live="polite"></div>

      desc:'AI가 처음 만들어 주는 기본 화면. 밝을 때와 어두울 때를 자동으로 따라갑니다.',

  /* =========================================================

  var STORE = 'seyoung-word-deck-v1';
  var db = null;
  try{ var raw = localStorage.getItem(STORE); if (raw) db = JSON.parse(raw); }catch(e){}
  if (!db || !db.words || !db.words.length){
    db = { words:toWords(SET_ELEM), themeId:'auto', custom:[], rate:0.85, dir:'en2ko', onlyNew:false };

  /* =========================================================
     4. 도구
     ========================================================= */
  var $ = function(id){ return document.getElementById(id); };
  var view = $('view');
  function el(tag, cls, text){
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }
  function btn(cls, text, fn){
    var b = el('button', cls, text);
    b.type = 'button';
    if (fn) b.addEventListener('click', fn);
    return b;
  }
  function toast(m){
    var t = $('toast'); t.textContent = m; t.setAttribute('data-show','true');
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ t.setAttribute('data-show','false'); }, 2000);
  }
  function copyText(text, ok){
    function fb(){
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); toast(ok); }catch(e){ toast('복사가 막혀 있어요'); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ toast(ok); }, fb);
    } else { fb(); }
  }
  function speak(word){
    if (!('speechSynthesis' in window)){ toast('이 브라우저는 소리를 지원하지 않아요'); return; }
    try{
      var u = new SpeechSynthesisUtterance(word);
      u.lang = 'en-US'; u.rate = db.rate;
      speechSynthesis.cancel(); speechSynthesis.speak(u);
    }catch(e){ toast('소리를 낼 수 없는 환경이에요'); }
  }
  function allThemes(){ return THEMES.concat(db.custom); }
  function findTheme(id){
    var r = null;
    allThemes().forEach(function(t){ if (t.id === id) r = t; });
    return r;
  }

  /* =========================================================
     5. 테마 적용 — 앱 전체가 바뀝니다
     ========================================================= */
  var VARS = ['bg','surface','ink','sub','point','line'];
  function applyThemeObject(t){
    var r = document.documentElement;
    if (!t || t.auto){
      r.removeAttribute('data-custom');
      VARS.forEach(function(k){ r.style.removeProperty('--' + k); });
      ['radius','font','word','pattern'].forEach(function(k){ r.style.removeProperty('--' + k); });
      r.removeAttribute('data-skin');
      return;
    }
    r.setAttribute('data-custom','1');
    VARS.forEach(function(k){ r.style.setProperty('--' + k, t[k]); });
    r.style.setProperty('--radius', t.radius + 'px');
    r.style.setProperty('--font', t.font);
    r.style.setProperty('--word', t.word);
    r.style.setProperty('--pattern', t.pattern || 'none');
    r.setAttribute('data-skin', t.skin || 'plain');
  }
  function applyTheme(id, quiet){
    var th = findTheme(id);
    if (!th) return;
    db.themeId = id;
    applyThemeObject(th.auto ? null : th.t);
    save();
    if (!quiet) toast('"' + th.name + '" 테마를 입혔어요');
  }

  /* =========================================================

  var idx = 0, flipped = false;

  function deck(){
    if (db.onlyNew){
      var left = db.words.filter(function(w){ return !w.known; });
      if (left.length) return left;
    }
    return db.words;
  }
  function header(){
    $('starStat').textContent = '⭐ ' + db.words.filter(function(w){ return w.known; }).length;
    $('countStat').textContent = db.words.length + ' 단어';
  }

  function viewCards(){
    var list = deck();

      view.appendChild(emptyBox('단어가 하나도 없어요', '아래 "단어" 탭에서 내 단어를 넣어보세요.'));

    }
    if (idx >= list.length) idx = 0;

    var pr = el('div','progress');

    var bar = el('span','bar');

    view.appendChild(pr);

    var box = el('div','cardbox');

    flip.setAttribute('role','button');
    flip.setAttribute('aria-label','카드 뒤집기');

    var front = el('div','face');
    var mark = el('span','known-mark' + (w.known ? ' on' : ''), '⭐');
    front.appendChild(mark);
    front.appendChild(el('p','word', w.en));
    front.appendChild(el('p','tagline','TAP TO FLIP'));
    flip.appendChild(front);

    var back = el('div','face back');
    back.appendChild(el('p','mean', w.ko));
    if (w.ex) back.appendChild(el('p','sent', w.ex));
    back.appendChild(el('p','tagline','다시 누르면 영어'));
    flip.appendChild(back);

    function doFlip(){ flipped = !flipped; flip.classList.toggle('on'); }
    flip.addEventListener('click', doFlip);
    flip.addEventListener('keydown', function(ev){
      if (ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); doFlip(); }
    });
    box.appendChild(flip);
    view.appendChild(box);

    var row = el('div','row');
    row.appendChild(btn('btn','이전', function(){
      idx = (idx - 1 + list.length) % list.length; flipped = false; render();
    }));
    row.appendChild(btn('btn main','🔊 발음 듣기', function(){ speak(w.en); }));
    row.appendChild(btn('btn','다음', function(){
      idx = (idx + 1) % list.length; flipped = false; render();
    }));
    view.appendChild(row);

    var row2 = el('div','row');
    var know = btn('btn sm', w.known ? '⭐ 외운 단어' : '☆ 외웠어요', function(){
      w.known = !w.known; save(); header(); render();
    });

    row2.appendChild(know);
    row2.appendChild(btn('btn sm','🔀 섞기', function(){
      for (var i = db.words.length - 1; i > 0; i--){
        var j = Math.floor(Math.random() * (i + 1));
        var t = db.words[i]; db.words[i] = db.words[j]; db.words[j] = t;
      }
      idx = 0; flipped = false; save(); render(); toast('순서를 섞었어요');
    }));
    var only = btn('btn sm', '👀 안 외운 것만', function(){
      db.onlyNew = !db.onlyNew; idx = 0; flipped = false; save(); render();

      toast(db.rate < 0.8 ? '느린 발음으로 바꿨어요' : '보통 속도로 바꿨어요');
    });

  function emptyBox(title, sub){

  /* =========================================================

  var quiz = null;

  function startQuiz(pool){
    var src = (pool && pool.length) ? pool.slice() : db.words.slice();
    if (src.length < 4){ toast('단어가 4개 이상 있어야 퀴즈를 낼 수 있어요'); return; }
    for (var i = src.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = src[i]; src[i] = src[j]; src[j] = t;
    }
    quiz = { list:src.slice(0, Math.min(10, src.length)), at:0, right:0, wrong:[], locked:false };
    render();
  }

  function viewQuiz(){
    if (!quiz){
      var p = el('div','panel');
      p.appendChild(el('h3','', '퀴즈로 확인하기'));
      p.appendChild(el('p','hint','보기 네 개 중에서 고르는 10문제입니다. 방향을 고르고 시작하세요.'));
      var row = el('div','row');
      row.style.justifyContent = 'flex-start';
      var a = btn('btn sm','영어 → 뜻', function(){ db.dir = 'en2ko'; save(); render(); });
      a.setAttribute('aria-pressed', db.dir === 'en2ko' ? 'true' : 'false');

      b.setAttribute('aria-pressed', db.dir === 'ko2en' ? 'true' : 'false');
      row.appendChild(a); row.appendChild(b);
      p.appendChild(row);
      var row2 = el('div','row');
      row2.style.justifyContent = 'flex-start';

      var left = db.words.filter(function(w){ return !w.known; });

      p.appendChild(row2);
      view.appendChild(p);
      return;
    }

    if (quiz.at >= quiz.list.length){
      var r = el('div','panel');
      var res = el('div','result');
      res.appendChild(el('p','label','점수'));
      res.appendChild(el('p','big', quiz.right + ' / ' + quiz.list.length));
      var msg = quiz.right === quiz.list.length ? '전부 맞혔어요. 대단해요!'
        : (quiz.right >= quiz.list.length * 0.7 ? '잘했어요. 틀린 것만 다시 볼까요?' : '괜찮아요. 한 번 더 하면 올라갑니다.');
      res.appendChild(el('p','hint', msg));
      r.appendChild(res);
      if (quiz.wrong.length){
        r.appendChild(el('p','label','틀린 단어'));
        var ul = el('ul','wrongs');
        quiz.wrong.forEach(function(w){
          var li = el('li');
          li.appendChild(el('b', null, w.en));
          li.appendChild(el('span', null, w.ko));
          ul.appendChild(li);
        });
        r.appendChild(ul);
      }
      var row = el('div','row');
      if (quiz.wrong.length){
        row.appendChild(btn('btn main','틀린 것만 다시', function(){ startQuiz(quiz.wrong); }));
      }
      row.appendChild(btn('btn','처음으로', function(){ quiz = null; render(); }));
      r.appendChild(row);
      view.appendChild(r);
      return;
    }

    var q = quiz.list[quiz.at];
    var head = el('div','qhead');
    head.appendChild(el('p','qn', (quiz.at + 1) + ' / ' + quiz.list.length));
    var ask = el('p','qq' + (db.dir === 'ko2en' ? ' ko' : ''), db.dir === 'en2ko' ? q.en : q.ko);
    head.appendChild(ask);
    view.appendChild(head);

    if (db.dir === 'en2ko'){
      var r2 = el('div','row');
      r2.appendChild(btn('btn sm','🔊 들어보기', function(){ speak(q.en); }));
      view.appendChild(r2);
    }

    var answer = db.dir === 'en2ko' ? q.ko : q.en;
    var pool = db.words.filter(function(w){ return (db.dir === 'en2ko' ? w.ko : w.en) !== answer; });
    var picks = [answer];
    var guard = 0;
    while (picks.length < 4 && pool.length && guard < 200){
      var c = pool[Math.floor(Math.random() * pool.length)];
      var v = db.dir === 'en2ko' ? c.ko : c.en;
      if (picks.indexOf(v) === -1) picks.push(v);
      guard++;
    }
    for (var i = picks.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = picks[i]; picks[i] = picks[j]; picks[j] = t;
    }

    var opts = el('div','opts');
    opts.style.marginTop = '16px';
    picks.forEach(function(v){
      var o = btn('opt' + (db.dir === 'ko2en' ? ' en' : ''), v, function(){
        if (quiz.locked) return;
        quiz.locked = true;
        Array.prototype.forEach.call(opts.children, function(x){
          x.setAttribute('data-s', x.textContent === answer ? 'o' : 'x');
        });
        if (v === answer){ quiz.right++; toast('정답이에요'); }
        else { quiz.wrong.push(q); toast('정답은 ' + answer); }
        setTimeout(function(){
          quiz.at++; quiz.locked = false; render();
        }, 850);
      });
      opts.appendChild(o);
    });
    view.appendChild(opts);

    var pr = el('div','progress');
    pr.style.marginTop = '18px';
    pr.appendChild(el('span', null, '맞은 개수 ' + quiz.right));
    var bar = el('span','bar');
    var fi = el('i');
    fi.style.width = Math.round(quiz.at / quiz.list.length * 100) + '%';
    bar.appendChild(fi);
    pr.appendChild(bar);
    view.appendChild(pr);
  }

    tr.style.justifyContent = 'flex-start';
    tr.appendChild(btn('btn','초등 기본 24개', function(){
      db.words = toWords(SET_ELEM); idx = 0; save(); header(); render(); toast('초등 기본 세트를 불러왔어요');
    }));
    tr.appendChild(btn('btn','중학 기본 24개', function(){
      db.words = toWords(SET_MID); idx = 0; save(); header(); render(); toast('중학 기본 세트를 불러왔어요');
    }));
    tr.appendChild(btn('btn','별 표시 모두 지우기', function(){
      db.words.forEach(function(w){ w.known = false; });
      save(); header(); render(); toast('별을 모두 지웠어요');
    }));
    tool.appendChild(tr);

    var codeText = 'const WORDS = [\n' + db.words.map(function(w){
      return "  { en:'" + w.en.replace(/'/g,'') + "', ko:'" + w.ko.replace(/'/g,'') +
             "', ex:'" + (w.ex || '').replace(/'/g,'') + "' },";
    }).join('\n') + '\n];';
    var code = el('code','out', codeText);
    tool.appendChild(code);
    var cr = el('div','row');
    cr.style.justifyContent = 'flex-start';
    cr.appendChild(btn('btn main','이 코드 복사하기', function(){
      copyText(codeText, '코드를 복사했어요. 내 index.html에 붙여넣어 보세요');
    }));
    tool.appendChild(cr);
    view.appendChild(tool);
  }

  /* =========================================================
     9. 테마 모드 — 학생이 직접 프롬프트를 추가합니다
     ========================================================= */
  var maker = {
    name:'', bg:'#101528', surface:'#1b2340', ink:'#eaeefb', sub:'#8d9ac4',
    point:'#7be0c8', line:'#2a3560', radius:18,
    font:"'Gowun Dodum', sans-serif", word:"'Fredoka', sans-serif", skin:'plain'
  };

  function makerPrompt(){
    return '방금 만든 영어 단어장의 디자인만 바꿔줘. 기능과 단어는 그대로 유지해.\n' +
      '무드: ' + (maker.name || '(여기에 떠오르는 장면을 한 줄로)') + '\n' +
      '- 배경 ' + maker.bg + ', 카드 ' + maker.surface + ', 글자 ' + maker.ink + ', 포인트 ' + maker.point + '\n' +
      '- 한글은 구글 폰트 ' + (FONT_LABEL[maker.font] || '') + ', 영어는 ' + (FONT_LABEL[maker.word] || '') + ' 적용 (link 태그 포함)\n' +
      '- 카드 모서리 ' + maker.radius + 'px, ' + SKIN_TEXT[maker.skin] + '\n' +
      '- 색은 전부 :root의 CSS 변수로 빼고, 변수마다 한국어 주석을 달아줘\n' +
      '바뀐 부분만 보여주고 어디에 붙여넣는지도 알려줘.';
  }
  function makerTheme(){
    return { bg:maker.bg, surface:maker.surface, ink:maker.ink, sub:maker.sub,
      point:maker.point, line:maker.line, radius:maker.radius,
      font:maker.font, word:maker.word, skin:maker.skin, pattern:'none' };
  }

  function viewThemes(){
    var head = el('div','panel');
    head.appendChild(el('h3', null, '테마 고르기'));
    head.appendChild(el('p','hint','프롬프트를 누르면 앱 전체가 그 무드로 바뀝니다. 마음에 드는 게 없으면 아래에서 직접 만들어 덱에 추가하세요.'));
    view.appendChild(head);

    var deckBox = el('div','deck');
    deckBox.style.marginTop = '14px';
    allThemes().forEach(function(t){
      var c = el('div','tcard');
      c.setAttribute('data-active', t.id === db.themeId ? 'true' : 'false');
      var h = el('header');
      h.appendChild(el('h4', null, t.name));
      if (t.mine) h.appendChild(el('span','mine','내 프롬프트'));
      var chips = el('span','chips');
      var cc = t.auto ? ['#eef1f7','#ffffff','#3b61e8'] : [t.t.bg, t.t.surface, t.t.point];
      cc.forEach(function(x){ var i = el('i'); i.style.background = x; chips.appendChild(i); });
      h.appendChild(chips);
      c.appendChild(h);
      c.appendChild(el('p','d', t.desc));

      var acts = el('div','acts');
      acts.appendChild(btn('btn sm main','이 테마 입히기', function(){ applyTheme(t.id); render(); }));
      acts.appendChild(btn('btn sm','프롬프트 복사', function(){
        copyText(t.prompt, '프롬프트를 복사했어요. AI에게 그대로 보내보세요');
      }));
      if (t.mine){
        acts.appendChild(btn('btn sm danger','삭제', function(){
          db.custom = db.custom.filter(function(x){ return x.id !== t.id; });
          if (db.themeId === t.id) applyTheme('auto', true);
          save(); render(); toast('지웠어요');
        }));
      }
      c.appendChild(acts);

      var det = document.createElement('details');
      det.appendChild(el('summary', null, '프롬프트 전문 보기'));
      det.appendChild(el('pre', null, t.prompt));
      c.appendChild(det);
      deckBox.appendChild(c);
    });
    view.appendChild(deckBox);

    /* 만들기 */
    var mk = el('div','panel');
    mk.appendChild(el('h3', null, '새 프롬프트 만들기'));
    mk.appendChild(el('p','hint','값을 바꾸면 화면이 바로 바뀝니다. 마음에 들면 덱에 추가하세요.'));

    var form = el('div','form');

    var nameF = el('div');
    nameF.appendChild(el('p','label','프롬프트 이름 (어떤 장면인지)'));
    var nameI = document.createElement('input');
    nameI.type = 'text'; nameI.value = maker.name;
    nameI.placeholder = '예: 새벽 도서관, 여름 바다, 우주 정거장';
    nameI.setAttribute('aria-label','프롬프트 이름');
    nameI.addEventListener('input', function(){ maker.name = this.value; refreshPrompt(); });
    nameF.appendChild(nameI);
    form.appendChild(nameF);

    var colors = el('div','three');
    [['bg','배경색'],['surface','카드 색'],['ink','글자색'],['point','포인트색']].forEach(function(c){
      var f = el('div');
      f.appendChild(el('p','label', c[1]));
      var i = document.createElement('input');
      i.type = 'color'; i.value = maker[c[0]];
      i.setAttribute('aria-label', c[1]);
      i.addEventListener('input', function(){
        maker[c[0]] = this.value;
        if (c[0] === 'surface') maker.line = this.value;
        if (c[0] === 'ink') maker.sub = this.value + '99';
        livePreview();
      });
      f.appendChild(i);
      colors.appendChild(f);
    });
    form.appendChild(colors);

    var fonts = el('div','three');
    [['font','한글 폰트'],['word','영어 폰트']].forEach(function(c){
      var f = el('div');
      f.appendChild(el('p','label', c[1]));
      var sel = document.createElement('select');
      sel.setAttribute('aria-label', c[1]);
      FONTS.forEach(function(ff){
        var o = document.createElement('option');
        o.value = ff[0]; o.textContent = ff[1];
        if (maker[c[0]] === ff[0]) o.selected = true;
        sel.appendChild(o);
      });
      sel.addEventListener('change', function(){ maker[c[0]] = this.value; livePreview(); });
      f.appendChild(sel);
      fonts.appendChild(f);
    });
    form.appendChild(fonts);

    var last = el('div','three');
    var rf = el('div');
    rf.appendChild(el('p','label','카드 모서리 ' + maker.radius + 'px'));
    var rr = document.createElement('input');
    rr.type = 'range'; rr.min = '0'; rr.max = '34'; rr.value = maker.radius;
    rr.setAttribute('aria-label','카드 모서리 둥글기');
    rr.addEventListener('input', function(){
      maker.radius = Number(this.value);
      rf.firstChild.textContent = '카드 모서리 ' + maker.radius + 'px';
      livePreview();
    });
    rf.appendChild(rr);
    last.appendChild(rf);

    var sf = el('div');
    sf.appendChild(el('p','label','질감'));
    var ss = document.createElement('select');
    ss.setAttribute('aria-label','질감');
    SKINS.forEach(function(s){
      var o = document.createElement('option');
      o.value = s[0]; o.textContent = s[1];
      if (maker.skin === s[0]) o.selected = true;
      ss.appendChild(o);
    });
    ss.addEventListener('change', function(){ maker.skin = this.value; livePreview(); });
    sf.appendChild(ss);
    last.appendChild(sf);
    form.appendChild(last);

    mk.appendChild(form);

    mk.appendChild(el('p','label','AI에게 보낼 프롬프트'));
    var pre = el('code','out', makerPrompt());
    pre.id = 'makerPrompt';
    mk.appendChild(pre);

    var row = el('div','row');
    row.style.justifyContent = 'flex-start';
    row.appendChild(btn('btn main','덱에 추가하고 입히기', function(){
      if (!maker.name.trim()){ toast('프롬프트 이름을 적어주세요'); nameI.focus(); return; }
      var id = 'mine-' + Date.now();
      db.custom.push({
        id:id, name:maker.name.trim(), mine:true,
        desc:'내가 만든 프롬프트입니다. 복사해서 AI에게 그대로 보내보세요.',
        prompt:makerPrompt(), t:makerTheme()
      });
      applyTheme(id, true);
      save(); render();
      toast('"' + maker.name.trim() + '" 테마를 덱에 넣었어요');
    }));
    row.appendChild(btn('btn','프롬프트 복사', function(){
      copyText(makerPrompt(), '프롬프트를 복사했어요');
    }));
    row.appendChild(btn('btn','되돌리기', function(){
      applyTheme(db.themeId, true); render(); toast('원래 테마로 되돌렸어요');
    }));
    mk.appendChild(row);
    view.appendChild(mk);

    function livePreview(){
      applyThemeObject(makerTheme());
      refreshPrompt();
    }
    function refreshPrompt(){
      var n = $('makerPrompt');
      if (n) n.textContent = makerPrompt();
    }
  }

  /* =========================================================
     10. 탭과 렌더
     ========================================================= */
  var TABS = [
    { id:'cards', name:'카드', icon:'🗂', fn:viewCards },
    { id:'quiz',  name:'퀴즈', icon:'✏️', fn:viewQuiz },
    { id:'words', name:'단어', icon:'📝', fn:viewWords },
    { id:'theme', name:'테마', icon:'🎨', fn:viewThemes }
  ];
  var tab = 'cards';
  var tabbar = $('tabbar');
  TABS.forEach(function(t){
    var b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('role','tab');
    b.setAttribute('data-tab', t.id);
    b.appendChild(el('em', null, t.icon));
    b.appendChild(el('span', null, t.name));
    b.addEventListener('click', function(){
      tab = t.id;
      if (t.id !== 'quiz') quiz = quiz;
      render();
      window.scrollTo({ top:0, behavior:'smooth' });
    });
    tabbar.appendChild(b);
  });

  function render(){
    view.textContent = '';
    header();
    Array.prototype.forEach.call(tabbar.children, function(b){
      b.setAttribute('aria-selected', b.getAttribute('data-tab') === tab ? 'true' : 'false');
    });
    var t = TABS.filter(function(x){ return x.id === tab; })[0] || TABS[0];
    t.fn();
  }

  applyTheme(db.themeId || 'auto', true);
  render();
})();
</script>
