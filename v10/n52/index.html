if(boss){const b=boss;if(b.warn>0){b.warn-=dt;if((b.warn*4|0)%2==0&&rnd()<.1)snd(180,.2,'square',.05)}
else if(b.dead>0){b.dead-=dt;b.bt-=dt;if(b.bt<=0){b.bt=.1;boom(b.x+(rnd()-.5)*50,b.y+(rnd()-.5)*20,2);snd(90,.3,'sawtooth',.08,-40)}shake=.4;if(b.dead<=0){boom(b.x,b.y,3);flash=1;score+=20000*D.m;fin();if(noMiss){score+=30000*D.m;say('NO MISS BONUS!')}S='clear';cT=3.5;boss=null;return}}
else{b.t+=dt;b.f=M.max(0,b.f-dt);if(b.in<2){b.in+=dt;b.y=-40+110*cl(b.in/2,0,1);if(b.in>=2)setPhase(0)}
else{b.x=120+M.sin(b.t*.5)*(50+b.ph*8);b.y=70+M.sin(b.t*.9)*10;for(const e of b.em)runEm(e,b.x,b.y+8,dt);
if(b.hp<=0){if(b.ph>=D.ph.length-1){b.dead=2.2;clearB(1);lasers.length=0}else setPhase(b.ph+1)}}}}
// lasers
for(let i=lasers.length-1;i>=0;i--){const l=lasers[i];l.t+=dt;if(l.t>.9&&l.t<1.6){l.f-=dt;while(l.f<=0){l.f+=.035;fireB(l.x,l.y,l.a,SP(200),l.c,0)}}if(l.t>1.6)lasers.splice(i,1)}
// enemy bullets
const gr2=GR*GR;
for(let i=0;i<bmax;i++)if(ba[i]){if(bac[i]){const q=1+bac[i]*dt;bvx[i]*=q;bvy[i]*=q}
const x=bx[i]+=bvx[i]*dt,y=by[i]+=bvy[i]*dt;if(x<-8||x>W+8||y<-8||y>H+8){ba[i]=0;continue}
const ex=x-P.x,ey=y-P.y,d2=ex*ex+ey*ey,hr=HR[bk[i]%3]+PR;
if(d2<hr*hr){if(P.inv<=0){playerHit()}}
else if(!bgz[i]&&d2<gr2&&P.inv<=0){bgz[i]=1;graze++;score+=(10+chain)*1;if(graze%3==0)pt(P.x,P.y,ex*3,ey*3,.2,'#fff',1,0);if(graze%4==0)snd(1500,.03,'square',.015)}}
// player bullets
const tg=[...en];if(boss&&boss.in>=2&&boss.ph>=0&&!boss.dead)tg.push(boss);
for(const p of PB)if(p.a){if(p.h){let n=null,nd=1e9;for(const e of tg){const q=(e.x-p.x)**2+(e.y-p.y)**2;if(q<nd){nd=q;n=e}}if(n){const a=M.atan2(n.y-p.y,n.x-p.x),k=M.min(1,dt*6);p.vx+=(M.cos(a)*260-p.vx)*k;p.vy+=(M.sin(a)*260-p.vy)*k}if(rnd()<.5)pt(p.x,p.y+2,0,20,.25,'#fb8',1,1)}
p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.y<-8||p.y>H||p.x<-8||p.x>W+8){p.a=0;continue}
for(const e of tg){const bw=e===boss?24:e.d.w,bh=e===boss?14:e.d.h;if(M.abs(e.x-p.x)<bw&&M.abs(e.y-p.y)<bh){e.hp-=p.d;e.f=.06;p.a=0;pt(p.x,p.y,(rnd()-.5)*60,(rnd()-.5)*60,.15,'#ff8',1,0);if(e===boss)score+=2;break}}}
// items
for(let i=items.length-1;i>=0;i--){const it=items[i];it.y+=45*dt;const d=(it.x-P.x)**2+(it.y-P.y)**2;if(d<900){it.x+=(P.x-it.x)*dt*6;it.y+=(P.y-it.y)*dt*6}
if(d<150){const t=it.t;if(t==0){pow=M.min(4,pow+1);say('POWER UP')}else if(t==1){bombs=M.min(6,bombs+1);say('BOMB +1')}else if(t==2){wep=(wep+1)%3;say(WN[wep])}else if(t==3){score+=500*D.m|0}else{lives++;say('1UP')}snd(800,.12,'square',.06,500);items.splice(i,1)}else if(it.y>H+10)items.splice(i,1)}
// particles / rings
for(const p of PT)if(p.l>0){p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.97;p.vy*=.97}
for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.r+=(r.m-r.r)*dt*5+dt*20;if(r.r>=r.m-1)rings.splice(i,1)}
if(P.inv>0||1){if(rnd()<.8)pt(P.x+(rnd()-.5)*3,P.y+6,0,60,.2,rnd()<.5?'#fa0':'#f60',1,0)}}
/* ---------- render ---------- */
function tx(s,x,y,c,sz,al){g.font='bold '+(sz||8)+'px monospace';g.textAlign=al||'left';g.fillStyle=c||'#fff';g.fillText(s,x,y)}
function bg(){const C=SC[stage];g.fillStyle=C.b;g.fillRect(0,0,W,H);g.fillStyle=C.s;
for(let i=0;i<50;i++){const l=1+i%3;g.globalAlpha=.3+l*.2;g.fillRect(hs(i)*W|0,(hs(i+9)*H+scroll*10*l)%H|0,1,l>2?2:1)}g.globalAlpha=1;
if(stage==0){for(let l=0;l<2;l++)for(let i=0;i<10;i++){const w=16+hs(i+l*7)*18|0,hh=30+hs(i*3+l)*50|0,x=(i*26+l*13)%W-4,y=((hs(i+l*50)*H*2+scroll*(25+l*30))%(H+80))-60|0;g.fillStyle=l?'#14123a':'#0d0c28';g.fillRect(x,y,w,hh);g.fillStyle=l?'#0ff':'#f0a';g.fillRect(x,y,w,1);g.fillStyle='rgba(0,255,255,.15)';g.fillRect(x+(w>>1),y,1,hh);g.fillStyle='#ff8';g.fillRect(x+3,y+6,2,2);g.fillRect(x+w-5,y+14,2,2)}}
else if(stage==1){const py=((scroll*4)%(H+240))-120;g.fillStyle='#2a3a6a';g.beginPath();g.arc(170,py,60,0,TAU);g.fill();g.fillStyle='#1a244a';g.beginPath();g.arc(184,py+8,50,0,TAU);g.fill();g.strokeStyle='#6a8';g.beginPath();g.ellipse(170,py,95,14,-.3,0,TAU);g.stroke();
for(let i=0;i<8;i++){g.fillStyle='#445';g.fillRect(hs(i+4)*W|0,((hs(i)*H+scroll*(40+i*6))%(H+20))-10|0,3+i%3*2,2+i%2*3)}}
else{for(let i=0;i<9;i++){const x=hs(i)*W+M.sin(scroll*.4+i)*20,y=((hs(i+3)*H+scroll*(15+i*3))%(H+60))-30,r=14+hs(i+6)*20;g.fillStyle=i%2?'#2a0a3a':'#0f2a1e';g.beginPath();g.arc(x,y,r,0,TAU);g.fill();g.fillStyle=i%2?'#a3f':'#4f8';g.fillRect(x|0,y|0,2,2)}}}
function drawBoss(b){const x=b.x|0,y=b.y|0,C=BCOL[stage],f=b.f>0;const c=i=>f?'#fff':C[i];
g.fillStyle=c(0);g.fillRect(x-30,y-4,60,6);g.fillStyle=c(1);g.fillRect(x-30,y-8,6,14);g.fillRect(x+24,y-8,6,14);g.fillRect(x-16,y-14,32,26);g.fillStyle=c(0);g.fillRect(x-12,y-10,24,18);g.fillStyle=c(2);g.fillRect(x-22,y+6,4,8);g.fillRect(x+18,y+6,4,8);g.fillRect(x-10,y-12,20,2);
g.fillStyle=(b.t*6|0)%2?'#fff':DCOL[4];g.fillRect(x-4,y-4,8,8);g.fillStyle='#000';g.fillRect(x-1,y-1,2,2)}
function world(){
for(const it of items){g.fillStyle=IC[it.t];g.fillRect(it.x-4|0,it.y-4|0,9,9);g.fillStyle='#000';g.fillRect(it.x-3|0,it.y-3|0,7,7);tx(IL[it.t],it.x|0,(it.y|0)-3,IC[it.t],7,'center')}
for(const e of en){const im=e.f>0?e.d.wh:e.d.im;g.drawImage(im,e.x-im.width/2|0,e.y-im.height/2|0)}
if(boss){drawBoss(boss);if(boss.warn>0){tx('WARNING',120,150,(boss.warn*5|0)%2?'#f33':'#fd3',20,'center');tx(BN_[stage],120,175,'#fff',9,'center')}}
g.lineWidth=1;for(const l of lasers)if(l.t<.9){g.strokeStyle=(l.t*12|0)%2?'rgba(255,80,110,.8)':'rgba(255,80,110,.25)';g.beginPath();g.moveTo(l.x,l.y);g.lineTo(l.x+M.cos(l.a)*500,l.y+M.sin(l.a)*500);g.stroke()}
g.globalCompositeOperation='lighter';
for(const p of PB)if(p.a){if(p.h){g.fillStyle='#fb6';g.fillRect(p.x-1|0,p.y-2|0,3,5);g.fillStyle='#fff';g.fillRect(p.x|0,p.y-1|0,1,2)}else{g.fillStyle=wep==1?'#fe6':'#6df';g.fillRect(p.x-1|0,p.y-4|0,2,7);g.fillStyle='#fff';g.fillRect(p.x|0,p.y-3|0,1,3)}}
g.globalCompositeOperation='source-over';
for(const p of PT)if(p.l>0&&p.k){g.globalAlpha=p.l/p.m*.6;g.fillStyle=p.c;g.fillRect(p.x|0,p.y|0,p.z,p.z)}g.globalAlpha=1;
for(let i=0;i<bmax;i++)if(ba[i]){const s=BS[bk[i]],o=s.width>>1;g.drawImage(s,bx[i]-o|0,by[i]-o|0)}
if(S!='over'&&(P.inv<=0||(P.inv*14|0)%2)){g.drawImage(PL,P.x-6|0,P.y-5|0);g.fillStyle=(scroll*30|0)%2?'#fa0':'#ff6';g.fillRect(P.x-1|0,P.y+5|0,2,3+(scroll*40|0)%3)}
if(foc&&S!='over'){g.strokeStyle='rgba(255,255,255,.35)';g.beginPath();g.arc(P.x,P.y,GR,0,TAU);g.stroke();g.fillStyle='#f03';g.fillRect(P.x-1|0,P.y-1|0,3,3);g.fillStyle='#fff';g.fillRect(P.x|0,P.y|0,1,1)}
g.globalCompositeOperation='lighter';
for(const p of PT)if(p.l>0&&!p.k){g.globalAlpha=p.l/p.m;g.fillStyle=p.c;g.fillRect(p.x|0,p.y|0,p.z,p.z)}g.globalAlpha=1;
for(const r of rings){g.globalAlpha=1-r.r/r.m;g.strokeStyle=r.c;g.lineWidth=2;g.beginPath();g.arc(r.x,r.y,r.r,0,TAU);g.stroke()}g.globalAlpha=1;g.lineWidth=1;g.globalCompositeOperation='source-over'}
function hud(){tx('SCORE '+String(score).padStart(8,'0'),4,3,'#fff',8);tx('HI '+String(M.max(hi,score)).padStart(8,'0'),W-4,3,'#fd3',8,'right');
tx('GRAZE '+graze,4,13,'#8ff',7);if(chain>1)tx('CHAIN '+chain,W-4,13,'#fa3',7,'right');
tx(DF[diff].n,120,13,DCOL[diff],7,'center');
for(let i=0;i<M.min(lives,8);i++){g.fillStyle='#4cf';g.fillRect(4+i*8,H-12,6,6);g.fillStyle='#fff';g.fillRect(6+i*8,H-11,2,2)}
for(let i=0;i<bombs;i++){g.fillStyle='#fd3';g.fillRect(4+i*8,H-22,6,6);g.fillStyle='#f63';g.fillRect(5+i*8,H-21,4,4)}
tx(WN[wep]+' LV'+(pow+1),120,H-10,'#fff',7,'center');tx('ST'+(stage+1),W-4,H-10,'#aaa',7,'right');
if(boss&&boss.in>=2&&!boss.dead){const w=200,f=cl(boss.hp/boss.mhp,0,1);g.fillStyle='#222';g.fillRect(20,24,w,5);g.fillStyle=BCOL[stage][2];g.fillRect(20,24,w*f|0,5);g.fillStyle='#fff';for(let i=1;i<D.ph.length;i++)g.fillRect(20+w*i/D.ph.length|0,23,1,7);tx(BN_[stage]+'  P'+(boss.ph+1)+'/'+D.ph.length,20,31,'#fff',7)}
if(msgT>0)tx(msg,120,70,'#fff',10,'center');
if('ontouchstart'in window){tx('[B]',W-4,H-24,'#fd3',9,'right');tx('[W]',4,H-24,'#8ff',9)}}
function render(){g.save();if(shake>0&&S=='play')g.translate((rnd()-.5)*shake*14|0,(rnd()-.5)*shake*14|0);bg();if(S!='menu')world();g.restore();
if(flash>0){g.globalAlpha=flash*.6;g.fillStyle='#fff';g.fillRect(0,0,W,H);g.globalAlpha=1}
if(S=='menu'){g.fillStyle='rgba(0,0,0,.45)';g.fillRect(0,0,W,H);tx('BULLET',120,40,'#f36',30,'center');tx('HELL',120,74,'#fd3',30,'center');tx('VERTICAL SHMUP / ULTRA',120,112,'#8ff',8,'center');
tx('DIFFICULTY  < >',120,140,'#aaa',8,'center');for(let i=0;i<5;i++)tx((i==diff?'> ':'  ')+DF[i].n,120,154+i*13,i==diff?DCOL[i]:'#667',10,'center');
tx('STAGE ^v  '+(stage+1)+'. '+SN[stage],120,232,'#fff',9,'center');tx('HI '+hi,120,250,'#fd3',8,'center');
tx((scroll*2|0)%2?'PRESS ENTER / TAP CENTER':'',120,280,'#fff',9,'center');
['WASD/ARROW  MOVE   SHIFT  FOCUS','SPACE  BOMB   1/2/3  WEAPON','ESC  PAUSE   M/N  MUSIC/SFX','TOUCH: DRAG  [B] BOMB  [W] WEAPON'].forEach((s,i)=>tx(s,120,310+i*12,'#889',7,'center'))}
else{hud();if(S=='pause'){g.fillStyle='rgba(0,0,0,.6)';g.fillRect(0,0,W,H);tx('PAUSE',120,170,'#fff',20,'center');tx('ESC RESUME / Q MENU',120,200,'#aaa',8,'center')}
if(S=='clear'){g.fillStyle='rgba(0,0,0,.5)';g.fillRect(0,0,W,H);tx('STAGE '+(stage+1)+' CLEAR',120,150,'#5f8',16,'center');tx('SCORE '+score,120,185,'#fff',10,'center');tx('GRAZE '+graze+'  MAX CHAIN '+maxCh,120,200,'#8ff',8,'center')}
if(S=='over'||S=='win'){g.fillStyle='rgba(0,0,0,.7)';g.fillRect(0,0,W,H);tx(S=='win'?'ALL CLEAR!':'GAME OVER',120,100,S=='win'?'#5f8':'#f36',20,'center');
['SCORE  '+score+(newHi?'  NEW!':''),'HI     '+hi,'KILLS  '+kills,'GRAZE  '+graze,'MAX CHAIN '+maxCh,DF[diff].n].forEach((s,i)=>tx(s,120,140+i*14,i==5?DCOL[diff]:'#fff',9,'center'));
tx('ENTER / TAP TOP : RETRY',120,250,'#fd3',8,'center');tx('ESC / TAP BOTTOM : MENU',120,266,'#aaa',8,'center')}}}
let lt=0;(function loop(ts){const dt=M.min((ts-lt)/1000||0,.05);lt=ts;
if(S=='play')update(dt);else{scroll+=dt;if(S=='clear'){cT-=dt;if(cT<=0){if(stage<2){stage++;beginStage();S='play'}else{fin();S='win'}}}}
render();requestAnimationFrame(loop)})(0);
</script></html>
