        body {
            font-family: 'Jua', 'Gowun Dodum', sans-serif;
            background-color: #05040a;
            color: #f3f4f6;
            overflow-x: hidden;
            user-select: none;

        /* CRT Scanline Overlay */
        .scanlines {
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.45) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
        }

        /* Animation Keyframes */
        .shake-screen {
            animation: shake 0.3s infinite;
        }

        @keyframes shake {
            0% { transform: translate(3px, 3px) rotate(0deg); }
            20% { transform: translate(-3px, -3px) rotate(-1deg); }
            40% { transform: translate(-4px, 0px) rotate(1deg); }
            60% { transform: translate(4px, 2px) rotate(0deg); }
            80% { transform: translate(1px, -3px) rotate(1deg); }
            100% { transform: translate(-2px, 2px) rotate(-1deg); }
        }

        .flash-white {
            animation: flash 0.25s ease-out;
        }

        @keyframes flash {
            0% { background-color: rgba(255, 255, 255, 0.9); }
            100% { background-color: transparent; }
        }

        .b-class-glow {
            text-shadow: 0 0 12px #ec4899, 0 0 24px #a855f7;

        /**
         * Web Audio Synthesizer Engine
         */
        class BClassAudioEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
                this.bgmTimer = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            toggleSound() {
                this.enabled = !this.enabled;
                if (!this.enabled && this.bgmTimer) {
                    clearInterval(this.bgmTimer);
                    this.bgmTimer = null;
                } else if (this.enabled) {
                    this.startEerieBGM();
                }
                return this.enabled;
            }

            startEerieBGM() {
                if (!this.enabled) return;
                this.init();
                if (this.bgmTimer) clearInterval(this.bgmTimer);

                const notes = [130.81, 146.83, 164.81, 155.56, 130.81, 174.61, 123.47, 110.00];
                let idx = 0;

                this.bgmTimer = setInterval(() => {
                    if (!this.enabled || !this.ctx) return;
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = (idx % 3 === 0) ? 'sawtooth' : 'triangle';
                    osc.frequency.setValueAtTime(notes[idx % notes.length], now);

                    gain.gain.setValueAtTime(0.04, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(now);
                    osc.stop(now + 0.22);

                    idx++;
                }, 240);
            }

            playBoing() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(140, now);
                osc.frequency.exponentialRampToValueAtTime(700, now + 0.35);

                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.35);
            }

            playShock() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                const freqs = [120, 110, 90, 70];

                freqs.forEach((f, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(f, now + i * 0.12);
                    gain.gain.setValueAtTime(0.25, now + i * 0.12);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.12 + 0.2);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + i * 0.12);
                    osc.stop(now + i * 0.12 + 0.2);
                });
            }

            playVictory() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];

                notes.forEach((f, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(f, now + i * 0.09);
                    gain.gain.setValueAtTime(0.12, now + i * 0.09);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.09 + 0.18);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + i * 0.09);
                    osc.stop(now + i * 0.09 + 0.18);
                });
            }

            playClick() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(450, now);
                osc.frequency.exponentialRampToValueAtTime(150, now + 0.05);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.05);
            }
        }

            initUI() {
                // Sound Toggle Button
                document.getElementById('sound-btn').addEventListener('click', () => {
                    const active = this.sound.toggleSound();
                    document.getElementById('sound-btn').textContent = active ? '🔊 사운드 ON' : '🔇 사운드 OFF';
                });

                // Top Restart Button
                document.getElementById('restart-top-btn').addEventListener('click', () => {
                    if (confirm("처음부터 다시 시작하시겠습니까?")) {
                        this.resetGame();
                    }
                });

                // Choice Buttons Events
                document.getElementById('choice-1').addEventListener('click', () => this.makeChoice(1));
                document.getElementById('choice-2').addEventListener('click', () => this.makeChoice(2));

                // Minigame Button Event
                document.getElementById('minigame-btn').addEventListener('click', () => this.handleMinigameClick());

                // Spacebar Support for Minigame & Keyboard 1,2
                window.addEventListener('keydown', (e) => {
                    const minigameBox = document.getElementById('minigame-container');
                    if (!minigameBox.classList.contains('hidden') && e.code === 'Space') {
                        e.preventDefault();
                        this.handleMinigameClick();
                    } else if (minigameBox.classList.contains('hidden')) {
                        if (e.code === 'Digit1' || e.code === 'Numpad1') this.makeChoice(1);
                        if (e.code === 'Digit2' || e.code === 'Numpad2') this.makeChoice(2);
                    }
                });

                this.renderNode('start');
            }

            makeChoice(optionNum) {
                const node = this.storyNodes[this.currentStep];
                if (node.isEnding) {
                    this.resetGame();
                    return;
                }

                const choice = optionNum === 1 ? node.c1 : node.c2;

                // Add Item to Inventory if available
                if (choice.item && !this.inventory.includes(choice.item)) {
                    this.inventory.push(choice.item);
                }

                // Update Stats
                this.hp = Math.max(0, Math.min(100, this.hp + (choice.hp || 0)));
                this.sanity = Math.max(0, Math.min(100, this.sanity + (choice.sanity || 0)));
                this.crazy = Math.max(0, this.crazy + (choice.crazy || 0));

                // Audio and Visual Screen Effects
                if ((choice.crazy || 0) >= 25) {
                    this.sound.playShock();
                    this.triggerEffect('shake');
                } else {
                    this.sound.playBoing();
                    this.triggerEffect('flash');
                }

                // Check Failure Game Over
                if (this.hp <= 0 || this.sanity <= 0) {
                    this.renderNode('bad_stat_ending');
                } else {
                    this.renderNode(choice.next);
                }
            }

            startMinigame(node) {
                this.minigameCount = 0;
                this.minigameTarget = node.mTarget || 10;
                this.minigameSuccessNext = node.mSuccess;
                this.minigameFailNext = node.mFail;

                const box = document.getElementById('minigame-container');
                const title = document.getElementById('minigame-title');
                const desc = document.getElementById('minigame-desc');
                const btn = document.getElementById('minigame-btn');
                const bar = document.getElementById('minigame-bar');

                title.textContent = node.mTitle;
                desc.textContent = node.mDesc;
                btn.textContent = `👉 연타하기! (0/${this.minigameTarget})`;
                bar.style.width = '0%';
                box.classList.remove('hidden');

                // Hide standard choice buttons during minigame
                document.getElementById('choice-container').classList.add('hidden');

                let timeLeft = node.mTime || 5;
                if (this.minigameTimer) clearInterval(this.minigameTimer);

                this.minigameTimer = setInterval(() => {
                    timeLeft -= 0.1;
                    if (timeLeft <= 0) {
                        clearInterval(this.minigameTimer);
                        this.sound.playShock();
                        box.classList.add('hidden');
                        document.getElementById('choice-container').classList.remove('hidden');
                        this.renderNode(this.minigameFailNext);
                    }
                }, 100);
            }

            handleMinigameClick() {
                this.sound.playClick();
                this.minigameCount += 1;
                const bar = document.getElementById('minigame-bar');
                const btn = document.getElementById('minigame-btn');

                const pct = Math.min(100, (this.minigameCount / this.minigameTarget) * 100);
                bar.style.width = `${pct}%`;
                btn.textContent = `👉 연타하기! (${this.minigameCount}/${this.minigameTarget})`;

                if (this.minigameCount >= this.minigameTarget) {
                    if (this.minigameTimer) clearInterval(this.minigameTimer);
                    this.sound.playVictory();
                    document.getElementById('minigame-container').classList.add('hidden');
                    document.getElementById('choice-container').classList.remove('hidden');
                    this.renderNode(this.minigameSuccessNext);
                }
            }

            triggerEffect(type) {
                const app = document.getElementById('game-app');
                const flash = document.getElementById('flash-overlay');

                if (type === 'shake') {
                    app.classList.add('shake-screen');
                    setTimeout(() => app.classList.remove('shake-screen'), 300);
                } else if (type === 'flash') {
                    flash.classList.add('flash-white');
                    flash.style.opacity = '1';
                    setTimeout(() => {
                        flash.classList.remove('flash-white');
                        flash.style.opacity = '0';
                    }, 250);
                }
            }

            renderInventory() {
                const list = document.getElementById('inventory-list');
                list.innerHTML = '';
                if (this.inventory.length === 0) {
                    list.innerHTML = '<span class="bg-slate-800 border border-slate-700 px-2 py-0.5 rounded text-slate-500">비어 있음</span>';
                } else {
                    this.inventory.forEach(item => {
                        const span = document.createElement('span');
                        span.className = 'bg-purple-950 border border-purple-500/50 px-2 py-0.5 rounded text-purple-200 font-pixel text-xs';
                        span.textContent = item;
                        list.appendChild(span);
                    });
                }
            }

            renderNode(nodeId) {
                this.currentStep = nodeId;
                const node = this.storyNodes[nodeId];

                // Update Stats
                document.getElementById('hp-val').textContent = this.hp;
                document.getElementById('sanity-val').textContent = this.sanity;
                document.getElementById('crazy-val').textContent = this.crazy;

                // Update Inventory UI
                this.renderInventory();

                // Update Story Display
                document.getElementById('scene-avatar').textContent = node.avatar || '🏫';
                document.getElementById('scene-location').textContent = node.location || '';
                document.getElementById('scene-text').innerText = node.text || '';

                const btn1 = document.getElementById('choice-1');
                const btn2 = document.getElementById('choice-2');

                if (node.isMinigame) {
                    this.startMinigame(node);
                    return;
                }

                document.getElementById('minigame-container').classList.add('hidden');
                document.getElementById('choice-container').classList.remove('hidden');

                if (node.isEnding) {
                    this.sound.playVictory();
                    btn1.textContent = '🔄 처음부터 다시 도전하기';
                    btn1.className = 'col-span-1 sm:col-span-2 py-4 px-4 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 font-bold text-lg rounded-2xl shadow-lg transition text-center font-pixel';
                    btn2.classList.add('hidden');
                } else {
                    btn1.textContent = `[1] ${node.c1.text}`;
                    btn2.textContent = `[2] ${node.c2.text}`;
                    btn1.className = 'py-3.5 px-4 bg-gradient-to-r from-purple-900 to-indigo-900 hover:from-purple-800 hover:to-indigo-800 border-2 border-purple-500/60 rounded-2xl text-purple-200 font-bold text-sm sm:text-base shadow-lg hover:scale-[1.01] active:scale-95 transition flex items-center justify-center text-center';
                    btn2.className = 'py-3.5 px-4 bg-gradient-to-r from-pink-900 to-rose-900 hover:from-pink-800 hover:to-rose-800 border-2 border-pink-500/60 rounded-2xl text-pink-200 font-bold text-sm sm:text-base shadow-lg hover:scale-[1.01] active:scale-95 transition flex items-center justify-center text-center';
                    btn2.classList.remove('hidden');
                }
            }

            resetGame() {
                this.hp = 100;
                this.sanity = 100;
                this.crazy = 0;
                this.inventory = [];
                this.renderNode('start');
            }
        }

        // Initialize Game Engine on Window Load
        window.onload = () => {
            window.gameInstance2 = new FunnyHorrorGameSeason2();
        };
    </script>
</body>
</html>
