<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>귀여운 영단어장</title>
  <!-- 구글 폰트 불러오기 -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Jua&display=swap" rel="stylesheet">
  
  <style>
    /* 색깔을 한곳에서 쉽게 바꿀 수 있게 모아요 */
    :root {
      --bg-color: #eef4ff; /* 전체 배경의 연한 하늘색이에요 */
      --card-color: #ffffff; /* 단어 카드의 하얀색이에요 */
      --text-color: #16243d; /* 기본 글자의 진한 남색이에요 */
      --point-color: #2f6be0; /* 중요한 버튼과 글자의 파란색이에요 */
      --sub-color: #8295b5; /* 설명 글자의 부드러운 회색이에요 */
      --soft-color: #dce8ff; /* 메뉴 버튼의 연한 파란색이에요 */
      --line-color: #dce5f2; /* 입력 칸과 구분선의 색이에요 */
      --danger-color: #e87979; /* 삭제 버튼의 부드러운 빨간색이에요 */
      --shadow-color: #2f6be01a; /* 카드의 연한 그림자 색이에요 */
    }

    /* 모든 크기를 계산하기 쉽게 만들어요 */
    * {
      box-sizing: border-box;
    }

    /* 페이지 전체의 모습을 꾸며요 */
    body {
      margin: 0;
      padding: 20px;
      background: var(--bg-color);
      font-family: 'Jua', sans-serif;
      color: var(--text-color);
    }

    /* 전체 내용을 가운데에 놓아요 */
    .container {
      max-width: 500px;
      margin: 20px auto;
      text-align: center;
    }

    /* 제목을 귀엽고 크게 만들어요 */
    h1 {
      font-size: 32px;
      margin-bottom: 8px;
      color: var(--text-color);
    }

    /* 영어 단어는 프레도카를 사용해요 */
    .front,
    .example,
    .word-item strong,
    input {
      font-family: 'Fredoka', 'Jua', sans-serif;
    }

    /* 제목 아래 설명을 꾸며요 */
    .subtitle {
      color: var(--sub-color);
      margin-bottom: 25px;
      font-size: 17px;
    }

    /* 메뉴 버튼을 나란히 놓아요 */
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    /* 메뉴 버튼 모양이에요 */
    .tabs button {
      flex: 1;
      padding: 14px 5px;
      border: 0;
      border-radius: 18px;
      background: var(--soft-color);
      color: var(--point-color);
      font-family: 'Jua', sans-serif;
      font-size: 16px;
      cursor: pointer;
    }

    /* 선택한 메뉴를 파란색으로 만들어요 */
    .tabs button.active {
      background: var(--point-color);
      color: var(--card-color);
    }

    /* 오늘 날짜를 보여줘요 */
    .date {
      color: var(--sub-color);
      margin: 15px 0;
      font-size: 15px;
    }

    /* 공부 진도를 꾸며요 */
    .progress {
      font-size: 21px;
      font-weight: bold;
      margin: 20px 0;
    }

    /* 카드가 입체적으로 뒤집히게 해요 */
    .card {
      height: 280px;
      perspective: 1000px;
      cursor: pointer;
      position: relative;
    }

    /* 카드 앞면과 뒷면을 담아요 */
    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transition: transform 0.6s;
      transform-style: preserve-3d;
    }

    /* 카드를 뒤집어요 */
    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    /* 카드 양쪽 면의 공통 모양이에요 */
    .front,
    .back {
      position: absolute;
      width: 100%;
      height: 100%;
      padding: 25px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-radius: 36px;
      background: var(--card-color);
      box-shadow: 0 12px 30px var(--shadow-color);
      backface-visibility: hidden;
    }

    /* 카드 앞면의 영어 단어를 꾸며요 */
    .front {
      font-size: 43px;
      font-weight: bold;
      color: var(--point-color);
    }

    /* 카드 뒷면을 반대로 돌려요 */
    .back {
      transform: rotateY(180deg);
    }

    /* 한글 뜻을 크게 보여줘요 */
    .meaning {
      font-size: 32px;
      font-weight: bold;
      color: var(--point-color);
      margin-bottom: 15px;
    }

    /* 영어 예문을 읽기 좋게 만들어요 */
    .example {
      font-size: 19px;
      line-height: 1.6;
      color: var(--text-color);
      text-align: center;
    }

    /* 발음 듣기 버튼 스타일 */
    .audio-btn {
      position: absolute;
      top: 18px;
      right: 18px;
      background: var(--soft-color);
      color: var(--point-color);
      border: none;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      font-size: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 10;
      transition: 0.2s;
    }

    .audio-btn:hover {
      background: var(--point-color);
      color: var(--card-color);
    }

    /* 카드 사용 방법을 보여줘요 */
    .hint {
      color: var(--sub-color);
      font-size: 14px;
      margin: 15px 0;
    }

    /* 이전과 다음 버튼을 나란히 놓아요 */
    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    /* 버튼 위에 손가락 모양을 보여줘요 */
    button {
      cursor: pointer;
      font-family: 'Jua', sans-serif;
    }

    /* 주요 버튼을 꾸며요 */
    .buttons button,
    .save-btn {
      flex: 1;
      padding: 15px;
      border: 0;
      border-radius: 18px;
      background: var(--point-color);
      color: var(--card-color);
      font-size: 17px;
      font-weight: bold;
      transition: 0.2s;
    }

    /* 버튼을 누를 때 살짝 진하게 만들어요 */
    .buttons button:hover,
    .save-btn:hover {
      filter: brightness(0.92);
    }

    /* 누를 수 없는 버튼을 꾸며요 */
    button:disabled {
      background: var(--soft-color);
      color: var(--sub-color);
      cursor: not-allowed;
    }

    /* 입력 상자와 목록 상자를 꾸며요 */
    .panel {
      background: var(--card-color);
      padding: 22px;
      margin-top: 20px;
      border-radius: 28px;
      box-shadow: 0 8px 25px var(--shadow-color);
      text-align: left;
    }

    /* 입력 상자 제목을 꾸며요 */
    .panel h2 {
      font-size: 22px;
      margin-top: 0;
      text-align: center;
    }

    /* 단어를 입력하는 칸이에요 */
    input {
      width: 100%;
      padding: 14px;
      margin: 7px 0;
      border: 2px solid var(--line-color);
      border-radius: 15px;
      font-size: 16px;
      color: var(--text-color);
      outline: none;
    }

    /* 입력 칸을 누르면 테두리를 파랗게 만들어요 */
    input:focus {
      border-color: var(--point-color);
    }

    /* 단어 저장 버튼을 꾸며요 */
    .save-btn {
      width: 100%;
      margin-top: 10px;
    }

    /* 내 단어 목록을 왼쪽으로 정렬해요 */
    .word-list {
      margin-top: 15px;
      text-align: left;
    }

    /* 단어 한 개의 모양이에요 */
    .word-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 13px;
      border-bottom: 1px solid var(--line-color);
      gap: 8px;
    }

    /* 영어 단어를 파란색으로 만들어요 */
    .word-item strong {
      color: var(--point-color);
      font-size: 17px;
    }

    /* 삭제 버튼을 꾸며요 */
    .delete-btn {
      border: 0;
      background: #ffe9e9;
      color: var(--danger-color);
      padding: 9px 12px;
      border-radius: 12px;
      cursor: pointer;
    }

    /* 단어가 없을 때 안내 글씨를 보여줘요 */
    .empty {
      color: var(--sub-color);
      padding: 20px;
      text-align: center;
    }

    /* 필요 없는 화면을 숨겨요 */
    .hidden {
      display: none !important;
    }

    /* 휴대폰 화면에서도 예쁘게 보여줘요 */
    @media (max-width: 400px) {
      h1 {
        font-size: 27px;
      }

      .front {
        font-size: 36px;
      }

      .card {
        height: 260px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>✨ 꼬마 영단어장</h1>
    <div class="subtitle">매일매일 즐겁게 영어 단어를 외워보세요!</div>

    <!-- 메뉴 버튼 -->
    <div class="tabs">
      <button id="tab-study" class="active" onclick="switchTab('study')">📖 단어 공부하기</button>
      <button id="tab-manage" onclick="switchTab('manage')">✏️ 단어 관리하기</button>
    </div>

    <!-- [1] 공부하기 화면 -->
    <div id="study-screen">
      <div class="date" id="current-date"></div>
      <div class="progress" id="progress-text">1 / 5</div>

      <!-- 플래시 카드 -->
      <div class="card" id="flash-card">
        <!-- 스피커(발음듣기) 버튼 추가 -->
        <button class="audio-btn" id="audio-btn" onclick="playPronunciation(event)" title="발음 듣기">🔊</button>
        <div class="card-inner">
          <div class="front" id="card-front">Apple</div>
          <div class="back">
            <div class="meaning" id="card-meaning">사과</div>
            <div class="example" id="card-example">I ate a sweet apple.</div>
          </div>
        </div>
      </div>

      <div class="hint">💡 카드를 누르면 뒤집히고, 스피커 버튼을 누르면 발음이 나와요!</div>

      <!-- 이전/다음 버튼 -->
      <div class="buttons">
        <button id="prev-btn">이전 단어</button>
        <button id="next-btn">다음 단어</button>
      </div>
    </div>

    <!-- [2] 단어 관리하기 화면 -->
    <div id="manage-screen" class="hidden">
      <div class="panel">
        <h2>새 단어 추가하기</h2>
        <input type="text" id="input-word" placeholder="영어 단어 (예: Banana)">
        <input type="text" id="input-meaning" placeholder="한글 뜻 (예: 바나나)">
        <input type="text" id="input-example" placeholder="영어 예문 (예: This banana is yellow.)">
        <button class="save-btn" id="save-word-btn">단어 저장하기</button>
      </div>

      <div class="panel">
        <h2>내 단어 목록</h2>
        <div class="word-list" id="word-list-container">
          <!-- 단어 목록이 자바스크립트로 여기에 들어갑니다 -->
        </div>
      </div>
    </div>
  </div>

  <script>
    // 기본 단어 데이터 로드 또는 초기화
    let words = [
      { word: "Apple", meaning: "사과", example: "I ate a sweet apple." },
      { word: "Banana", meaning: "바나나", example: "This banana is yellow." },
      { word: "Cat", meaning: "고양이", example: "The cute cat is sleeping." },
      { word: "Dog", meaning: "강아지", example: "My dog loves to run." },
      { word: "Happy", meaning: "행복한", example: "I am so happy today!" }
    ];

    try {
      const savedWords = localStorage.getItem('myWords');
      if (savedWords) {
        words = JSON.parse(savedWords);
      }
    } catch (e) {
      console.error("Local storage load error:", e);
    }

    let currentIndex = 0;
    let isFlipped = false;

    // 오늘 날짜 표시
    function displayDate() {
      const dateEl = document.getElementById('current-date');
      if (dateEl) {
        const today = new Date();
        const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
        dateEl.innerText = today.toLocaleDateString('ko-KR', options);
      }
    }

    // 화면 전환 (탭)
    window.switchTab = function(tabName) {
      const studyScreen = document.getElementById('study-screen');
      const manageScreen = document.getElementById('manage-screen');
      const tabStudy = document.getElementById('tab-study');
      const tabManage = document.getElementById('tab-manage');

      if (tabName === 'study') {
        studyScreen.classList.remove('hidden');
        manageScreen.classList.add('hidden');
        tabStudy.classList.add('active');
        tabManage.classList.remove('active');
        updateCard();
      } else {
        studyScreen.classList.add('hidden');
        manageScreen.classList.remove('hidden');
        tabStudy.classList.remove('active');
        tabManage.classList.add('active');
        renderWordList();
      }
    };

    // 카드 내용 업데이트
    function updateCard() {
      const cardFront = document.getElementById('card-front');
      const cardMeaning = document.getElementById('card-meaning');
      const cardExample = document.getElementById('card-example');
      const progressText = document.getElementById('progress-text');
      const prevBtn = document.getElementById('prev-btn');
      const nextBtn = document.getElementById('next-btn');
      const flashCard = document.getElementById('flash-card');

      if (words.length === 0) {
        cardFront.innerText = "단어가 없어요!";
        cardMeaning.innerText = "단어를 추가해주세요.";
        cardExample.innerText = "";
        progressText.innerText = "0 / 0";
        prevBtn.disabled = true;
        nextBtn.disabled = true;
        return;
      }

      if (currentIndex >= words.length) currentIndex = 0;
      if (currentIndex < 0) currentIndex = words.length - 1;

      const current = words[currentIndex];
      cardFront.innerText = current.word;
      cardMeaning.innerText = current.meaning;
      cardExample.innerText = current.example;
      progressText.innerText = `${currentIndex + 1} / ${words.length}`;

      prevBtn.disabled = currentIndex === 0;
      nextBtn.disabled = currentIndex === words.length - 1;

      isFlipped = false;
      flashCard.classList.remove('flipped');
    }

    // 카드 뒤집기
    function flipCard(event) {
      // 스피커 버튼을 클릭한 경우는 카드가 뒤집히지 않도록 예외 처리
      if (event && event.target.closest('#audio-btn')) return;
      if (words.length === 0) return;

      isFlipped = !isFlipped;
      const card = document.getElementById('flash-card');
      if (isFlipped) {
        card.classList.add('flipped');
      } else {
        card.classList.remove('flipped');
      }
    }

    // 영어 발음 읽어주기 (SpeechSynthesis API)
    function playPronunciation(event) {
      event.stopPropagation(); // 카드 뒤집기 이벤트가 동시 실행되지 않도록 막음
      if (words.length === 0) return;

      const currentWord = words[currentIndex].word;
      
      // 브라우저 지원 여부 확인
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // 이전 발음이 남아있다면 취소
        const utterance = new SpeechSynthesisUtterance(currentWord);
        utterance.lang = 'en-US'; // 미국 영어 발음
        utterance.rate = 0.9; // 조금 천천히 읽어주기
        window.speechSynthesis.speak(utterance);
      } else {
        alert('이 브라우저는 음성 재생을 지원하지 않습니다.');
      }
    }

    // 이전 단어
    function prevCard() {
      if (currentIndex > 0) {
        currentIndex--;
        updateCard();
      }
    }

    // 다음 단어
    function nextCard() {
      if (currentIndex < words.length - 1) {
        currentIndex++;
        updateCard();
      }
    }

    // 단어 추가하기
    function addWord() {
      const wordInput = document.getElementById('input-word');
      const meaningInput = document.getElementById('input-meaning');
      const exampleInput = document.getElementById('input-example');

      if (!wordInput.value.trim() || !meaningInput.value.trim()) {
        alert('영어 단어와 한글 뜻을 모두 입력해주세요!');
        return;
      }

      words.push({
        word: wordInput.value.trim(),
        meaning: meaningInput.value.trim(),
        example: exampleInput.value.trim() || '예문이 없습니다.'
      });

      try {
        localStorage.setItem('myWords', JSON.stringify(words));
      } catch (e) {
        console.error("Local storage save error:", e);
      }

      wordInput.value = '';
      meaningInput.value = '';
      exampleInput.value = '';

      alert('단어가 성공적으로 추가되었습니다! 🎉');
      renderWordList();
    }

    // 단어 목록 렌더링
    function renderWordList() {
      const container = document.getElementById('word-list-container');
      if (!container) return;

      if (words.length === 0) {
        container.innerHTML = '<div class="empty">저장된 단어가 없습니다.</div>';
        return;
      }

      let html = '';
      words.forEach((item, index) => {
        html += `
          <div class="word-item">
            <div>
              <strong>${item.word}</strong>: ${item.meaning}
            </div>
            <button class="delete-btn" onclick="deleteWord(${index})">삭제</button>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    // 단어 삭제하기
    window.deleteWord = function(index) {
      words.splice(index, 1);
      try {
        localStorage.setItem('myWords', JSON.stringify(words));
      } catch (e) {
        console.error("Local storage delete error:", e);
      }
      renderWordList();
      if (currentIndex >= words.length) {
        currentIndex = Math.max(0, words.length - 1);
      }
    };

    // 이벤트 리스너 연결
    document.addEventListener('DOMContentLoaded', function() {
      displayDate();
      updateCard();

      // 카드 클릭 이벤트
      const flashCard = document.getElementById('flash-card');
      if (flashCard) {
        flashCard.addEventListener('click', flipCard);
      }

      // 이전/다음 버튼 이벤트
      const prevBtn = document.getElementById('prev-btn');
      if (prevBtn) {
        prevBtn.addEventListener('click', prevCard);
      }

      const nextBtn = document.getElementById('next-btn');
      if (nextBtn) {
        nextBtn.addEventListener('click', nextCard);
      }

      // 저장 버튼 이벤트
      const saveBtn = document.getElementById('save-word-btn');
      if (saveBtn) {
        saveBtn.addEventListener('click', addWord);
      }
    });
  </script>

</body>
</html>
