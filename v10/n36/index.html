<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>영어 단어 카드</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Jua&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #dc8fcd;
      --card-color: #ffffff;
      --text-color: #005eff;
      --point-color: #2f6be0;
    }

    body {
      font-family: 'Fredoka', 'Jua', sans-serif;
      background-color: var(--bg-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    .card-container {
      width: 380px;
      height: 260px;
      perspective: 1000px;
      cursor: pointer;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s;
      border-radius: 36px;
      box-shadow: 0 12px 24px rgba(0,0,0,0.12);
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-radius: 36px;
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
      overflow-y: auto;
    }

    .card-front {
      background-color: var(--card-color);
      color: var(--text-color);
    }

    .card-front .word {
      font-size: 24px;
      font-weight: 600;
      color: var(--point-color);
      word-break: break-all;
      font-family: 'Fredoka', sans-serif;
    }

    .card-back {
      background-color: var(--point-color);
      color: #ffffff;
      transform: rotateY(180deg);
    }

    .card-back .meaning {
      font-size: 18px;
      font-family: 'Jua', sans-serif;
      font-weight: bold;
      margin-bottom: 8px;
      word-break: keep-all;
    }

    .card-back .example {
      font-size: 14px;
      font-family: 'Fredoka', 'Jua', sans-serif;
      opacity: 0.95;
      word-break: keep-all;
    }

    .speak-btn {
      margin-top: 15px;
      padding: 6px 16px;
      font-size: 14px;
      font-family: 'Jua', sans-serif;
      border: 2px solid var(--point-color);
      border-radius: 20px;
      background-color: var(--card-color);
      color: var(--point-color);
      cursor: pointer;
      transition: all 0.2s;
    }

    .speak-btn:hover {
      background-color: var(--point-color);
      color: #ffffff;
    }

    .controls {
      margin-top: 25px;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .btn {
      padding: 10px 22px;
      font-size: 16px;
      font-family: 'Jua', sans-serif;
      border: none;
      border-radius: 18px;
      background-color: var(--card-color);
      color: var(--point-color);
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
    }

    .btn:hover {
      background-color: #f8f9fa;
      transform: scale(1.05);
    }

    .progress {
      font-size: 18px;
      font-weight: bold;
      font-family: 'Fredoka', sans-serif;
      color: var(--card-color);
      text-shadow: 0 2px 4px rgba(0,0,0,0.15);
    }

    .quiz-container {
      margin-top: 20px;
      background: var(--card-color);
      padding: 18px 22px;
      border-radius: 24px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      width: 380px;
      box-sizing: border-box;
      text-align: center;
    }

    .quiz-question {
      font-weight: bold;
      font-size: 16px;
      font-family: 'Jua', sans-serif;
      margin-bottom: 12px;
      color: var(--text-color);
    }

    .quiz-choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    .choice-btn {
      padding: 10px;
      font-size: 14px;
      font-family: 'Jua', sans-serif;
      border: 2px solid #eef2f7;
      border-radius: 12px;
      background: #fdfefe;
      color: #333;
      cursor: pointer;
      transition: all 0.2s;
    }

    .choice-btn:hover {
      background: #f0f4f8;
      border-color: var(--point-color);
    }

    .choice-btn.correct {
      background-color: #4caf50 !important;
      color: white !important;
      border-color: #4caf50 !important;
    }

    .choice-btn.incorrect {
      opacity: 0.4;
      background-color: #f1f1f1 !important;
    }

    .quiz-score {
      font-size: 14px;
      font-family: 'Fredoka', sans-serif;
      color: #555;
    }
  </style>
</head>
<body>

  <div class="card-container" onclick="flipCard()">
    <div class="card" id="card">
      <div class="card-face card-front">
        <div class="word" id="word">word</div>
        <button class="speak-btn" onclick="event.stopPropagation(); speakWord();">🔊 읽기</button>
      </div>
      <div class="card-face card-back">
        <div class="meaning" id="meaning">뜻</div>
        <div class="example" id="example">예문</div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="btn" onclick="prevCard()">이전</button>
    <span class="progress" id="progress">1 / 10</span>
    <button class="btn" onclick="nextCard()">다음</button>
  </div>

  <div class="quiz-container">
    <div class="quiz-question">이 단어의 뜻은?</div>
    <div class="quiz-choices" id="quiz-choices"></div>
    <div class="quiz-score" id="quiz-score">맞은 개수: 0 | 틀린 개수: 0</div>
  </div>

  <script>
    const wordList = [
      { en: 'happy', ko: '행복', ex: '' },
      { en: 'sad', ko: '슬픔', ex: '' },
      { en: 'angry', ko: '화남', ex: '' },
      { en: 'pass', ko: '통과', ex: '' },
      { en: 'industry', ko: '산업', ex: '' },
      { en: 'factory', ko: '공장', ex: '' },
      { en: 'human', ko: '사람', ex: '' },
      { en: 'Pneumonoultramicroscopicsilicovolcanoconiosis', ko: '폐에 발생하는 실리카 먼지로 인한 질병을 의미하며, 옥스퍼드 영어사전과 메리엄-웹스터 사전에 정식 등재되어 있습니다.', ex: '' },
      { en: 'Supercalifragilisticexpialidocious', ko: '영화 메리 포핀스에서 유명해진 단어로, 일상에서 재미있게 사용할 수 있는 긴 단어입니다.', ex: '' },
      { en: 'thyroparathyroidectomized', ko: '갑상선과 부갑상선을 모두 절제한 상태를 의미하는 의학 용어', ex: '' },
    ];

    let currentIndex = 0;
    let correctCount = 0;
    let incorrectCount = 0;
    let answered = false;

    const cardElement = document.getElementById('card');
    const wordElement = document.getElementById('word');
    const meaningElement = document.getElementById('meaning');
    const exampleElement = document.getElementById('example');
    const progressElement = document.getElementById('progress');

    function updateCard() {
      cardElement.classList.remove('flipped');

      setTimeout(() => {
        const currentData = wordList[currentIndex];

        wordElement.textContent = currentData.en;
        meaningElement.textContent = currentData.ko;
        
        if (currentData.ex && currentData.ex.trim() !== '') {
          exampleElement.textContent = currentData.ex;
          exampleElement.style.display = 'block';
        } else {
          exampleElement.textContent = '';
          exampleElement.style.display = 'none';
        }

        progressElement.textContent = `${currentIndex + 1} / ${wordList.length}`;
      }, 150);

      initQuiz();
    }

    function flipCard() {
      cardElement.classList.toggle('flipped');
    }

    function prevCard() {
      if (currentIndex > 0) {
        currentIndex--;
        updateCard();
      }
    }

    function nextCard() {
      if (currentIndex < wordList.length - 1) {
        currentIndex++;
        updateCard();
      }
    }

    function speakWord() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(wordList[currentIndex].en);
        utterance.lang = 'en-US';
        utterance.rate = 0.8;
        window.speechSynthesis.speak(utterance);
      } else {
        alert("이 브라우저는 소리를 지원하지 않아요");
      }
    }

    function initQuiz() {
      answered = false;
      const choicesContainer = document.getElementById('quiz-choices');
      choicesContainer.innerHTML = '';

      const currentWord = wordList[currentIndex];
      const correctMeaning = currentWord.ko;

      let wrongMeanings = wordList
        .filter(w => w.ko !== correctMeaning)
        .map(w => w.ko);
      
      wrongMeanings.sort(() => Math.random() - 0.5);
      let choices = [correctMeaning, ...wrongMeanings.slice(0, 3)];
      
      choices.sort(() => Math.random() - 0.5);

      choices.forEach(meaning => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.textContent = meaning;
        btn.onclick = () => checkAnswer(btn, meaning === correctMeaning);
        choicesContainer.appendChild(btn);
      });
    }

    function checkAnswer(selectedBtn, isCorrect) {
      if (answered) return;
      answered = true;

      const buttons = document.querySelectorAll('.choice-btn');
      buttons.forEach(b => {
        if (b.textContent === wordList[currentIndex].ko) {
          b.classList.add('correct');
        } else {
          b.classList.add('incorrect');
        }
      });

      if (isCorrect) {
        correctCount++;
      } else {
        incorrectCount++;
      }

      document.getElementById('quiz-score').textContent = `맞은 개수: ${correctCount} | 틀린 개수: ${incorrectCount}`;
    }

    updateCard();
  </script>
</body>
</html>
