<!DOCTYPE html> <!-- 이 문서는 HTML5 웹 표준 문서임을 브라우저에 알려줍니다 -->
<html lang="ko"> <!-- 웹페이지의 기본 언어를 한국어로 설정합니다 -->
<head>
    <meta charset="UTF-8"> <!-- 텍스트가 깨지지 않도록 UTF-8 인코딩을 사용합니다 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 모바일 기기에서도 화면이 알맞게 나오도록 설정합니다 -->
    <title>알록달록 영어 단어 쿵짝 퀴즈! 🐾</title> <!-- 브라우저 탭에 표시될 게임 제목입니다 -->
    <!-- 구글 폰트에서 동글동글하고 귀여운 'Jua' 글꼴을 가져와서 적용합니다 -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        /* CSS 시작: 게임의 알록달록하고 멋진 디자인을 꾸며줍니다 */
        * {
            box-sizing: border-box; /* 크기 계산을 편하게 하기 위해 테두리를 포함시킵니다 */
            font-family: 'Jua', sans-serif; /* 모든 글자에 귀여운  Jua 폰트를 적용합니다 */
            user-select: none; /* 드래그로 글자가 선택되지 않게 막아줍니다 */
        }
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%); /* 배경을 예쁜 분홍-노랑 그라데이션으로 채웁니다 */
            margin: 0; /* 기본 여백을 없앱니다 */
            padding: 10px; /* 사방에 약간의 여백을 줍니다 */
            display: flex; /* 요소를 정렬하기 위해 플렉스박스를 씁니다 */
            flex-direction: column; /* 세로 방향으로 쌓습니다 */
            align-items: center; /* 가로 중앙 정렬합니다 */
            justify-content: center; /* 세로 중앙 정렬합니다 */
            min-height: 100vh; /* 화면 전체 높이를 최소로 채웁니다 */
            overflow-x: hidden; /* 가로 스크롤이 생기지 않게 막습니다 */
        }
        .game-wrapper {
            width: 100%; /* 너비를 꽉 채웁니다 */
            max-width: 480px; /* 최대 너비를 480픽셀로 제한하여 스마트폰 크기로 맞춥니다 */
            background: #ffffff; /* 하얀색 배경 상자입니다 */
            border-radius: 30px; /* 상자 모서리를 아주 둥글게 만듭니다 */
            box-shadow: 0 15px 35px rgba(0,0,0,0.2); /* 입체적인 그림자를 넣어 떠 있는 느낌을 줍니다 */
            padding: 20px; /* 안쪽 여백을 넉넉히 줍니다 */
            display: flex; /* 내부 요소 정렬을 위한 설정입니다 */
            flex-direction: column; /* 세로 정렬입니다 */
            align-items: center; /* 가운데 정렬입니다 */
            position: relative; /* 자식 요소 위치 기준이 됩니다 */
            border: 6px solid #ff6b6b; /* 귀여운 빨간 테두리를 두릅니다 */
        }
        .header {
            display: flex; /* 상단 점수와 진도를 나란히 배치합니다 */
            justify-content: space-between; /* 양 끝으로 정렬합니다 */
            width: 100%; /* 너비를 꽉 채웁니다 */
            margin-bottom: 15px; /* 아래쪽 여백을 줍니다 */
            font-size: 18px; /* 글자 크기입니다 */
            color: #555; /* 회색빛 글자색입니다 */
        }
        .badge {
            background: #ffeaa7; /* 노란색 배경입니다 */
            padding: 5px 12px; /* 안쪽 여백입니다 */
            border-radius: 20px; /* 둥근 알약 모양으로 만듭니다 */
            border: 3px solid #fdcb6e; /* 테두리 선입니다 */
            color: #d35400; /* 진한 주황색 글씨입니다 */
        }
        .mascot-container {
            display: flex; /* 마스코트와 말풍선을 나란히 둡니다 */
            align-items: center; /* 세로 가운데 정렬입니다 */
            margin-bottom: 15px; /* 아래 여백입니다 */
            background: #f0f3f4; /* 연한 회색 배경입니다 */
            padding: 8px 15px; /* 안쪽 여백입니다 */
            border-radius: 20px; /* 둥글게 만듭니다 */
            width: 100%; /* 너비를 꽉 채웁니다 */
        }
        .mascot-avatar {
            font-size: 36px; /* 마스코트 이모지 크기를 키웁니다 */
            animation: bounce 1s infinite alternate; /* 둥실둥실 움직이는 애니메이션을 넣습니다 */
            margin-right: 10px; /* 오른쪽 간격입니다 */
        }
        @keyframes bounce {
            0% { transform: translateY(0); } /* 처음 위치 */
            100% { transform: translateY(-6px); } /* 위로 살짝 뜬 위치 */
        }
        .mascot-speech {
            font-size: 15px; /* 말풍선 글자 크기입니다 */
            color: #2c3e50; /* 글자 색상입니다 */
            background: #ffffff; /* 하얀 말풍선 배경입니다 */
            padding: 6px 12px; /* 내부 여백입니다 */
            border-radius: 12px; /* 모서리를 둥글게 합니다 */
            flex-grow: 1; /* 남은 공간을 채웁니다 */
            border: 2px dashed #bdc3c7; /* 점선 테두리입니다 */
        }
        /* 3D 카드 뒤집기 영역 스타일 */
        .card-scene {
            width: 100%; /* 너비를 꽉 채웁니다 */
            height: 200px; /* 카드의 높이를 지정합니다 */
            perspective: 1000px; /* 3D 효과를 위한 원근법 설정입니다 */
            cursor: pointer; /* 마우스 올릴 때 손가락 모양으로 바꿉니다 */
            margin-bottom: 20px; /* 아래 여백입니다 */
        }
        .card {
            width: 100%; /* 카드의 너비를 채웁니다 */
            height: 100%; /* 카드의 높이를 채웁니다 */
            position: relative; /* 겹치기 배치를 위한 기준입니다 */
            transform-style: preserve-3d; /* 3D 공간 속성을 유지합니다 */
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* 통통 튀는 듯한 부드러운 뒤집기 효과입니다 */
            border-radius: 20px; /* 둥근 모서리입니다 */
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); /* 입체 그림자입니다 */
        }
        .card.is-flipped {
            transform: rotateY(180deg); /* 뒤집혔을 때 180도 회전합니다 */
        }
        .card-face {
            position: absolute; /* 앞면과 뒷면을 정확히 겹칩니다 */
            width: 100%; /* 면의 너비입니다 */
            height: 100%; /* 면의 높이입니다 */
            backface-visibility: hidden; /* 뒷면이 보일 때 반대쪽은 숨깁니다 */
            display: flex; /* 내용물 정렬용 플렉스박스입니다 */
            flex-direction: column; /* 세로 정렬입니다 */
            align-items: center; /* 가로 가운데 정렬입니다 */
            justify-content: center; /* 세로 가운데 정렬입니다 */
            border-radius: 20px; /* 둥글게 만듭니다 */
            padding: 20px; /* 여백입니다 */
            border: 4px dashed rgba(255,255,255,0.6); /* 하얀색 점선 테두리입니다 */
        }
        .card-front {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); /* 시원한 하늘색 그라데이션입니다 */
            color: white; /* 글자 색상을 하얗게 합니다 */
        }
        .card-back {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); /* 싱그러운 초록색 그라데이션입니다 */
            color: white; /* 글자 색상을 하얗게 합니다 */
            transform: rotateY(180deg); /* 미리 뒤집어 놓습니다 */
        }
        .card-word {
            font-size: 38px; /* 영어 단어 글자 크기를 크게 합니다 */
            font-weight: bold; /* 굵게 표시합니다 */
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2); /* 글자에 입체감을 줍니다 */
            margin-bottom: 5px; /* 아래 여백입니다 */
        }
        .card-hint {
            font-size: 14px; /* 힌트 글자 크기입니다 */
            opacity: 0.9; /* 살짝 투명하게 합니다 */
        }
        .card-meaning {
            font-size: 28px; /* 뜻 글자 크기입니다 */
            font-weight: bold; /* 굵게 표시합니다 */
            margin-bottom: 8px; /* 아래 여백입니다 */
        }
        .card-example {
            font-size: 15px; /* 예문 글자 크기입니다 */
            font-style: italic; /* 기울임꼴로 만듭니다 */
            text-align: center; /* 가운데 정렬합니다 */
        }
        /* 조작 버튼 영역 스타일 */
        .controls {
            display: flex; /* 버튼들을 나란히 배치합니다 */
            gap: 10px; /* 버튼 사이 간격입니다 */
            width: 100%; /* 너비를 꽉 채웁니다 */
            margin-bottom: 15px; /* 아래 여백입니다 */
        }
        .btn {
            flex: 1; /* 버튼들이 공간을 똑같이 나누어 가집니다 */
            padding: 12px; /* 안쪽 여백입니다 */
            font-size: 18px; /* 글자 크기입니다 */
            border: none; /* 테두리를 없앱니다 */
            border-radius: 15px; /* 둥근 모서리입니다 */
            cursor: pointer; /* 손가락 모양 커서입니다 */
            color: white; /* 하얀 글씨입니다 */
            box-shadow: 0 5px 0 rgba(0,0,0,0.15); /* 입체적인 버튼 그림자입니다 */
            transition: transform 0.1s, box-shadow 0.1s; /* 누를 때 반응하는 효과입니다 */
        }
        .btn:active {
            transform: translateY(4px); /* 누를 때 아래로 살짝 내려갑니다 */
            box-shadow: 0 1px 0 rgba(0,0,0,0.15); /* 그림자가 줄어듭니다 */
        }
        .btn-prev { background: #ff7675; } /* 이전 버튼 색상 (빨강 계열) */
        .btn-flip { background: #a29bfe; } /* 뒤집기 버튼 색상 (보라 계열) */
        .btn-next { background: #55efc4; color: #2d3436; } /* 다음 버튼 색상 (민트 계열) */

        /* 퀴즈 모드 전환 버튼 */
        .btn-quiz-mode {
            width: 100%; /* 너비를 꽉 채웁니다 */
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); /* 노랑-주황 그라데이션입니다 */
            color: #2d3436; /* 진한 회색 글씨입니다 */
            font-size: 20px; /* 글자 크기입니다 */
            padding: 14px; /* 안쪽 여백입니다 */
            border: none; /* 테두리 없음입니다 */
            border-radius: 15px; /* 모서리를 둥글게 합니다 */
            cursor: pointer; /* 손가락 커서입니다 */
            box-shadow: 0 5px 0 rgba(0,0,0,0.15); /* 입체 그림자입니다 */
            font-weight: bold; /* 굵은 글씨입니다 */
            margin-top: 5px; /* 위 여백입니다 */
        }
        .btn-quiz-mode:active {
            transform: translateY(4px); /* 누를 때 내려갑니다 */
            box-shadow: 0 1px 0 rgba(0,0,0,0.15); /* 그림자가 줄어듭니다 */
        }

        /* 퀴즈 컨테이너 스타일 */
        .quiz-box {
            display: none; /* 평소에는 숨겨둡니다 */
            width: 100%; /* 너비를 채웁니다 */
            flex-direction: column; /* 세로 정렬입니다 */
            align-items: center; /* 가운데 정렬입니다 */
        }
        .quiz-question {
            font-size: 22px; /* 퀴즈 질문 글자 크기입니다 */
            color: #2d3436; /* 글자 색상입니다 */
            margin-bottom: 15px; /* 아래 여백입니다 */
            text-align: center; /* 가운데 정렬합니다 */
        }
        .quiz-options {
            display: grid; /* 보기들을 격자로 정렬합니다 */
            grid-template-columns: 1fr 1fr; /* 2열로 배치합니다 */
            gap: 10px; /* 보기 사이 간격입니다 */
            width: 100%; /* 너비를 채웁니다 */
            margin-bottom: 15px; /* 아래 여백입니다 */
        }
        .quiz-option-btn {
            background: #74b9ff; /* 파란색 보기 버튼입니다 */
            color: white; /* 하얀 글씨입니다 */
            border: none; /* 테두리 없음입니다 */
            padding: 15px 10px; /* 안쪽 여백입니다 */
            font-size: 18px; /* 글자 크기입니다 */
            border-radius: 15px; /* 모서리를 둥글게 합니다 */
            cursor: pointer; /* 손가락 커서입니다 */
            box-shadow: 0 4px 0 rgba(0,0,0,0.15); /* 입체 그림자입니다 */
            transition: all 0.1s; /* 부드러운 변화 효과입니다 */
        }
        .quiz-option-btn:hover {
            background: #0984e3; /* 마우스 올렸을 때 진해집니다 */
        }
        .quiz-option-btn:active {
            transform: translateY(3px); /* 누를 때 내려갑니다 */
            box-shadow: 0 1px 0 rgba(0,0,0,0.15); /* 그림자가 줄어듭니다 */
        }

        /* 컨페티(폭죽 가루)가 날릴 캔버스 영역 설정 */
        #confetti-canvas {
            position: fixed; /* 화면 전체에 고정시킵니다 */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* 마우스 클릭이 투과되도록 합니다 */
            z-index: 999; /* 맨 위에 표시되도록 순서를 높입니다 */
        }
    </style>
</head>
<body>
    <!-- 축하 폭죽 애니메이션을 그려줄 캔버스 요소입니다 -->
    <canvas id="confetti-canvas"></canvas>

    <div class="game-wrapper"> <!-- 게임 전체를 감싸는 메인 상자입니다 -->
        <!-- 상단 헤더: 콤보 점수와 현재 진도를 보여줍니다 -->
        <div class="header">
            <div class="badge" id="scoreBadge">🔥 콤보: 0</div>
            <div class="badge" id="progressBadge">진도: 1 / 10</div>
        </div>

        <!-- 마스코트 안내 영역: 귀여운 캐릭터가 대사를 쳐줍니다 -->
        <div class="mascot-container">
            <div class="mascot-avatar" id="mascotEmoji">🐶</div>
            <div class="mascot-speech" id="mascotText">안녕! 오늘도 즐겁게 단어를 외워보자! 카드를 눌러봐!</div>
        </div>

        <!-- [모드 1] 단어 카드 학습 화면 -->
        <div id="studyView" style="width: 100%;">
            <!-- 3D 카드 뒤집기 상자입니다 -->
            <div class="card-scene" onclick="flipCard()">
                <div class="card" id="cardElement">
                    <!-- 카드의 앞면 (영어 단어) -->
                    <div class="card-face card-front">
                        <div class="card-word" id="cardEn">Apple</div>
                        <div class="card-hint">👆 카드를 누르면 뜻이 보여요!</div>
                    </div>
                    <!-- 카드의 뒷면 (뜻과 예문) -->
                    <div class="card-face card-back">
                        <div class="card-meaning" id="cardKo">사과</div>
                        <div class="card-example" id="cardEx">"I eat an apple."</div>
                    </div>
                </div>
            </div>

            <!-- 하단 조작 버튼들 -->
            <div class="controls">
                <button class="btn btn-prev" onclick="prevCard()">◀ 이전</button>
                <button class="btn btn-flip" onclick="flipCard()">뒤집기 🔄</button>
                <button class="btn btn-next" onclick="nextCard()">다음 ▶</button>
            </div>
        </div>

        <!-- [모드 2] 퀴즈 챌린지 화면 -->
        <div id="quizView" class="quiz-box">
            <div class="quiz-question" id="quizQuestionText">다음 단어의 뜻은 무엇일까요?</div>
            <div class="quiz-options">
                <button class="quiz-option-btn" onclick="checkAnswer(0)" id="opt0">보기 1</button>
                <button class="quiz-option-btn" onclick="checkAnswer(1)" id="opt1">보기 2</button>
                <button class="quiz-option-btn" onclick="checkAnswer(2)" id="opt2">보기 3</button>
                <button class="quiz-option-btn" onclick="checkAnswer(3)" id="opt3">보기 4</button>
            </div>
        </div>

        <!-- 모드 전환 버튼 -->
        <button class="btn-quiz-mode" id="modeSwitchBtn" onclick="toggleGameMode()">🎮 단어 퀴즈 풀기 도전!</button>
    </div>

    <!-- 외부 라이브러리 없이 순수 자바스크립트로 구현된 게임 로직입니다 -->
    <script>
        // // [여기만 고치세요] 초등학생 영어 단어 목록 배열입니다. 영어(en), 뜻(ko), 예문(ex)을 자유롭게 수정하거나 추가할 수 있습니다!
        const vocabList = [
            { en: 'Apple', ko: '사과', ex: 'I like eating a sweet red apple.' },
            { en: 'Banana', ko: '바나나', ex: 'Monkeys love to eat delicious bananas.' },
            { en: 'Cat', ko: '고양이', ex: 'The fluffy cat is sleeping on the bed.' },
            { en: 'Dog', ko: '강아지', ex: 'A cute brown dog is barking happily.' },
            { en: 'Elephant', ko: '코끼리', ex: 'The big elephant has a very long nose.' },
            { en: 'Flower', ko: '꽃', ex: 'A pretty yellow flower blooms in the garden.' },
            { en: 'Guitar', ko: '기타', ex: 'My brother plays the guitar very well.' },
            { en: 'House', ko: '집', ex: 'Our cozy house has a big blue door.' },
            { en: 'Ice cream', ko: '아이스크림', ex: 'We love eating cold strawberry ice cream.' },
            { en: 'Jungle', ko: '정글', ex: 'Many wild animals live in the deep jungle.' }
        ];

        let currentIndex = 0; // 현재 보고 있는 카드의 번호(인덱스)입니다.
        let isFlipped = false; // 카드가 뒤집혀 있는지 여부를 저장합니다 (거짓=앞면, 참=뒷면).
        let comboScore = 0; // 연속으로 맞춘 콤보 점수입니다.
        let isQuizMode = false; // 현재 퀴즈 모드인지 여부를 저장합니다.
        let currentQuizCorrectIndex = 0; // 퀴즈 정답이 위치한 보기 번호입니다.

        // HTML 요소들을 자바스크립트 변수로 안전하게 불러옵니다.
        const cardElement = document.getElementById('cardElement');
        const cardEn = document.getElementById('cardEn');
        const cardKo = document.getElementById('cardKo');
        const cardEx = document.getElementById('cardEx');
        const progressBadge = document.getElementById('progressBadge');
        const scoreBadge = document.getElementById('scoreBadge');
        const mascotEmoji = document.getElementById('mascotEmoji');
        const mascotText = document.getElementById('mascotText');
        const studyView = document.getElementById('studyView');
        const quizView = document.getElementById('quizView');
        const modeSwitchBtn = document.getElementById('modeSwitchBtn');
        const quizQuestionText = document.getElementById('quizQuestionText');
        const optButtons = [
            document.getElementById('opt0'),
            document.getElementById('opt1'),
            document.getElementById('opt2'),
            document.getElementById('opt3')
        ];

        // --- 웹 오디오 API를 이용한 재미있는 효과음 생성기 ---
        let audioCtx = null; // 오디오 컨텍스트 변수입니다.

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)(); // 브라우저 오디오 시스템을 켭니다.
            }
        }

        // 팝 소리 (버튼 클릭이나 카드 뒤집을 때)
        function playPopSound() {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch (e) { /* 오류 무시 */ }
        }

        // 정답 축하 멜로디 소리
        function playSuccessSound() {
            try {
                initAudio();
                const notes = [523.25, 659.25, 783.99, 1046.50]; // 도, 미, 솔, 높은도 음계입니다
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.08);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.08 + 0.2);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + idx * 0.08);
                    osc.stop(audioCtx.currentTime + idx * 0.08 + 0.2);
                });
            } catch (e) { /* 오류 무시 */ }
        }

        // 오답 삐익 소리
        function playErrorSound() {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } catch (e) { /* 오류 무시 */ }
        }

        // --- 컨페티(폭죽 가루) 효과 시스템 ---
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function triggerConfetti() {
            particles = [];
            const colors = ['#ff7675', '#74b9ff', '#55efc4', '#ffeaa7', '#a29bfe', '#fd79a8'];
            for (let i = 0; i < 70; i++) { // 70개의 조각을 생성합니다
                particles.push({
                    x: window.innerWidth / 2,
                    y: window.innerHeight / 2,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.7) * 12 - 3,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rotation: Math.random() * 360,
                    vRot: (Math.random() - 0.5) * 10
                });
            }
            animateConfetti();
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.4; // 중력 효과를 줍니다
                p.rotation += p.vRot;

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate((p.rotation * Math.PI) / 180);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                ctx.restore();

                if (p.y > canvas.height) {
                    particles.splice(index, 1);
                }
            });
            if (particles.length > 0) {
                requestAnimationFrame(animateConfetti);
            }
        }

        // --- 학습 모드 함수들 ---
        function updateStudyView() {
            const item = vocabList[currentIndex];
            cardEn.textContent = item.en;
            cardKo.textContent = item.ko;
            cardEx.textContent = `"${item.ex}"`;
            progressBadge.textContent = `진도: ${currentIndex + 1} / ${vocabList.length}`;
        }

        function flipCard() {
            playPopSound();
            isFlipped = !isFlipped;
            if (isFlipped) {
                cardElement.classList.add('is-flipped');
                setMascot('😎', '와우! 뜻과 예문을 완벽하게 외워볼까요?');
            } else {
                cardElement.classList.remove('is-flipped');
                setMascot('🐶', '단어를 보고 뜻을 먼저 맞춰보세요!');
            }
        }

        function nextCard() {
            playPopSound();
            currentIndex = (currentIndex + 1) % vocabList.length;
            resetCardFace();
            updateStudyView();
            setMascot('🎉', '다음 단어로 넘어왔어요! 힘내세요!');
        }

        function prevCard() {
            playPopSound();
            currentIndex = (currentIndex - 1 + vocabList.length) % vocabList.length;
            resetCardFace();
            updateStudyView();
            setMascot('🔍', '이전 단어를 다시 복습해봐요.');
        }

        function resetCardFace() {
            isFlipped = false;
            cardElement.classList.remove('is-flipped');
        }

        // --- 퀴즈 모드 함수들 ---
        function toggleGameMode() {
            playPopSound();
            isQuizMode = !isQuizMode;
            if (isQuizMode) {
                studyView.style.display = 'none';
                quizView.style.display = 'flex';
                modeSwitchBtn.textContent = '📖 단어 카드 학습으로 돌아가기';
                setMascot('🎯', '퀴즈 모드 시작! 정답을 맞춰 콤보를 올려보세요!');
                loadNewQuiz();
            } else {
                quizView.style.display = 'none';
                studyView.style.display = 'block';
                modeSwitchBtn.textContent = '🎮 단어 퀴즈 풀기 도전!';
                setMascot('👋', '다시 카드로 단어를 익혀봐요!');
                updateStudyView();
            }
        }

        function loadNewQuiz() {
            // 무작위로 정답 단어를 선택합니다
            currentIndex = Math.floor(Math.random() * vocabList.length);
            const correctItem = vocabList[currentIndex];

            quizQuestionText.textContent = `"${correctItem.en}" 의 뜻은 무엇일까요?`;

            // 정답 위치를 0~3 중 무작위로 정합니다
            currentQuizCorrectIndex = Math.floor(Math.random() * 4);

            // 오답 보기들을 채우기 위해 전체 목록을 복사해 섞습니다
            let optionsPool = [...vocabList].filter(item => item.ko !== correctItem.ko);
            optionsPool.sort(() => Math.random() - 0.5);

            let poolIndex = 0;
            for (let i = 0; i < 4; i++) {
                if (i === currentQuizCorrectIndex) {
                    optButtons[i].textContent = correctItem.ko;
                } else {
                    optButtons[i].textContent = optionsPool[poolIndex].ko;
                    poolIndex++;
                }
            }
        }

        function checkAnswer(selectedIndex) {
            if (selectedIndex === currentQuizCorrectIndex) {
                // 정답인 경우
                comboScore++;
                playSuccessSound();
                triggerConfetti();
                scoreBadge.textContent = `🔥 콤보: ${comboScore}`;
                setMascot('🥳', `정답이에요! 훌륭합니다! (콤보 +1)`);
                setTimeout(loadNewQuiz, 1000); // 1초 뒤 새 퀴즈를 불러옵니다
            } else {
                // 오답인 경우
                comboScore = 0;
                playErrorSound();
                scoreBadge.textContent = `🔥 콤보: ${comboScore}`;
                setMascot('💦', `아쉬워요! 정답은 "${vocabList[currentIndex].ko}" 였답니다.`);
                setTimeout(loadNewQuiz, 1500); // 1.5초 뒤 새 퀴즈를 불러옵니다
            }
        }

        function setMascot(emoji, text) {
            mascotEmoji.textContent = emoji;
            mascotText.textContent = text;
        }

        // 페이지가 처음 실행될 때 초기 화면을 세팅합니다
        window.onload = function() {
            updateStudyView();
        };
    </script>
</body>
</html>
