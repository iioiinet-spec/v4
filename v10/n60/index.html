<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- 문자 인코딩을 UTF-8로 설정합니다 -->
  <meta charset="UTF-8">
  <!-- 모바일 및 다양한 기기에서 화면 크기를 자동으로 맞춥니다 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>영어 단어 카드 및 퀴즈</title>
  
  <!-- 구글 폰트 불러오기 (영어: Gaegu, 한글: Nanum Pen Script) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">

  <style>
    /* 색상 및 기본 설정을 CSS 변수(:root)로 지정합니다 */
    :root {
      --bg-color: #3d81ff;       /* 전체 화면 배경색 (파란색) */
      --card-bg: #b30000;        /* 카드 배경색 (빨간색) */
      --text-color: #050e1f;     /* 기본 글자색 (어두운 파란색) */
      --point-color: #399354;    /* 포인트 및 강조 색상 (초록색) */
      --card-radius: 25px;       /* 카드 모서리 둥글기 */
    }

    /* 화면 전체의 기본 배경색과 글꼴, 가운데 정렬 스타일입니다 */
    body {
      font-family: 'Nanum Pen Script', cursive; /* 한글 기본 폰트 적용 */
      background-color: var(--bg-color);        /* 배경색 변수 사용 */
      color: var(--text-color);                 /* 글자색 변수 사용 */
      display: flex;                            /* 요소를 세로 방향 가운데 정렬 */
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px 0;
      box-sizing: border-box;
    }

    /* 영어 글꼴 적용 클래스 */
    .en-font {
      font-family: 'Gaegu', cursive;
    }

    /* 단어 카드가 들어갈 전체 틀입니다 */
    .card-container {
      width: 320px;
      height: 220px;
      perspective: 1000px;
      cursor: pointer;
    }

    /* 뒤집히는 단어 카드의 기본 스타일입니다 */
    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s;
      border-radius: var(--card-radius);        /* 25px 모서리 둥글기 적용 */
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    /* 카드가 클릭되면 180도 뒤집어집니다 */
    .card.flipped {
      transform: rotateY(180deg);
    }

    /* 카드의 앞면과 뒷면 공통 스타일입니다 */
    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: var(--card-radius);        /* 25px 모서리 둥글기 적용 */
      padding: 20px;
      box-sizing: border-box;
      background-color: var(--card-bg);         /* 카드 배경색 변수 사용 */
      color: #ffffff;                           /* 카드 안 글자는 잘 보이도록 흰색 지정 */
    }

    /* 카드 앞면 영어 단어 스타일입니다 */
    .card-front h2 {
      font-size: 42px;
      margin: 0;
    }

    /* 카드 뒷면 스타일 설정입니다 */
    .card-back {
      transform: rotateY(180deg);
    }

    /* 카드 뒷면 뜻 스타일입니다 */
    .card-back h3 {
      font-size: 32px;
      margin: 0 0 10px 0;
    }

    /* 카드 뒷면 예문 스타일입니다 */
    .card-back p {
      font-size: 22px;
      margin: 0;
      text-align: center;
    }

    /* 스피커 버튼 스타일입니다 */
    .speaker-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #ffffff;
      z-index: 10;
    }

    /* 진도(몇 번째 단어인지) 표시 스타일입니다 */
    .progress {
      margin-top: 15px;
      font-size: 26px;
      font-weight: bold;
      color: var(--text-color);
    }

    /* 이전/다음 버튼 상자 스타일입니다 */
    .controls {
      margin-top: 10px;
      display: flex;
      gap: 15px;
    }

    /* 버튼 기본 스타일입니다 */
    button.nav-btn {
      padding: 8px 20px;
      font-size: 22px;
      font-family: 'Nanum Pen Script', cursive;
      border: none;
      border-radius: 12px;
      background-color: var(--text-color);
      color: #ffffff;
      cursor: pointer;
    }

    /* 퀴즈 영역 전체 틀 스타일입니다 */
    .quiz-container {
      margin-top: 25px;
      width: 320px;
      background-color: #ffffff;
      padding: 15px;
      border-radius: var(--card-radius);
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
      box-sizing: border-box;
    }

    /* 퀴즈 제목 스타일입니다 */
    .quiz-title {
      font-size: 26px;
      margin: 0 0 10px 0;
      color: var(--text-color);
    }

    /* 퀴즈 보기 버튼들을 세로로 정렬하는 상자입니다 */
    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* 퀴즈 보기 버튼 스타일입니다 */
    .quiz-btn {
      padding: 8px;
      font-size: 22px;
      font-family: 'Nanum Pen Script', cursive;
      border: 2px solid var(--text-color);
      border-radius: 10px;
      background-color: #ffffff;
      color: var(--text-color);
      cursor: pointer;
    }

    /* 정답일 때 초록색 스타일입니다 */
    .quiz-btn.correct {
      background-color: var(--point-color);
      color: #ffffff;
      border-color: var(--point-color);
    }

    /* 오답일 때 흐리게 만드는 스타일입니다 */
    .quiz-btn.wrong {
      opacity: 0.3;
    }

    /* 맞은 개수와 틀린 개수 표시 스타일입니다 */
    .quiz-score {
      margin-top: 12px;
      font-size: 22px;
      color: var(--text-color);
    }

    /* 에러 발생 시 화면 전체에 표시할 스타일입니다 */
    #error-display {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #ff3333;
      color: #ffffff;
      font-size: 28px;
      padding: 30px;
      box-sizing: border-box;
      z-index: 9999;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <!-- 자바스크립트 에러 발생 시 노출되는 화면입니다 -->

  <!-- 무드 한 줄 요약: 푸른 하늘 아래 강렬하게 빛나는 빨간 장미 한 송이 -->

  </div>

  <!-- 이전, 다음 단어로 넘어가는 버튼입니다 -->

    <button class="nav-btn" id="prevBtn">이전</button>
    <button class="nav-btn" id="nextBtn">다음</button>

    <div class="quiz-title">이 단어의 뜻은?</div>
    <div class="quiz-options" id="quizOptions"></div>
    <div class="quiz-score">
      맞음: <span id="correctCount">0</span> | 틀림: <span id="wrongCount">0</span>

      const errBox = document.getElementById('error-display');

      { en: 'jump', ko: '뛰다', ex: 'Jump over the box.' },

      { en: 'piano', ko: '피아노', ex: 'She plays the piano well.' },
      { en: 'ring', ko: '반지', ex: 'A gold ring sparkles.' },
      { en: 'ship', ko: '배, 선박', ex: 'The ship sails the sea.' },
      { en: 'toy', ko: '장난감', ex: 'Play with your toys.' },
      { en: 'uncle', ko: '삼촌', ex: 'My uncle visits us.' },
      { en: 'voice', ko: '목소리', ex: 'Her voice is clear.' },
      { en: 'wall', ko: '벽', ex: 'Hang the clock on the wall.' },
      { en: 'yard', ko: '마당', ex: 'Children play in the yard.' },
      { en: 'box', ko: '상자', ex: 'Pack toys in the box.' },
      { en: 'city', ko: '도시', ex: 'Seoul is a big city.' },
      { en: 'dance', ko: '춤추다', ex: 'Let us dance to music.' },
      { en: 'farm', ko: '농장', ex: 'Cows live on the farm.' }
    ];
    // ==========================================

    // 변수 설정 (현재 단어 번호, 맞은/틀린 횟수, 퀴즈 정답 선택 여부)
    let currentIndex = 0;
    let correctCount = 0;
    let wrongCount = 0;
    let quizAnswered = false;

    // HTML 요소들을 자바스크립트로 끌어옵니다
    const cardContainer = document.getElementById('cardContainer');
    const card = document.getElementById('card');
    const wordEn = document.getElementById('wordEn');
    const wordKo = document.getElementById('wordKo');
    const wordEx = document.getElementById('wordEx');
    const progress = document.getElementById('progress');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const speakerBtn = document.getElementById('speakerBtn');
    const quizOptions = document.getElementById('quizOptions');
    const correctCountEl = document.getElementById('correctCount');
    const wrongCountEl = document.getElementById('wrongCount');

    // 영어 단어를 소리로 읽어주는 함수입니다
    function speakWord(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // 이전에 읽던 소리를 멈춥니다
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US'; // 미국 영어 음성 설정
        utterance.rate = 0.8;    // 천천히 읽기 (속도 0.8)
        window.speechSynthesis.speak(utterance);
      } else {
        alert("이 브라우저는 소리를 지원하지 않아요");
      }
    }

    // 배열 순서를 랜덤으로 섞어주는 함수입니다
    function shuffleArray(array) {
      const arr = array.slice();
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // 퀴즈 보기를 생성하고 나타내는 함수입니다
    function renderQuiz() {
      quizOptions.innerHTML = '';
      quizAnswered = false;
      const currentWord = words[currentIndex];

      // 다른 단어들 중 오답 3개를 뽑아옵니다
      const otherWords = words.filter((_, idx) => idx !== currentIndex);
      const shuffledOthers = shuffleArray(otherWords).slice(0, 3);

      // 정답 1개와 오답 3개를 모아 4개 보기를 만듭니다
      const options = shuffleArray([currentWord, ...shuffledOthers]);

      // 화면에 보기 버튼 4개를 출력합니다
      options.forEach(option => {
        const btn = document.createElement('button');
        btn.className = 'quiz-btn';
        btn.textContent = option.ko;

        btn.addEventListener('click', function() {
          if (quizAnswered) return; // 이미 답을 골랐으면 눌리지 않습니다
          quizAnswered = true;

          const allBtns = quizOptions.querySelectorAll('.quiz-btn');
          if (option.ko === currentWord.ko) {
            btn.classList.add('correct');
            correctCount++;
            correctCountEl.textContent = correctCount;
          } else {
            btn.classList.add('wrong');
            wrongCount++;
            wrongCountEl.textContent = wrongCount;
            // 정답 버튼을 초록색으로 알려줍니다
            allBtns.forEach(b => {
              if (b.textContent === currentWord.ko) {
                b.classList.add('correct');
              }
            });
          }

          // 선택하지 않은 다른 보기들을 흐리게 처리합니다
          allBtns.forEach(b => {
            if (!b.classList.contains('correct')) {
              b.classList.add('wrong');
            }
          });
        });

        quizOptions.appendChild(btn);
      });
    }

    // 카드 내용 업데이트 함수입니다
    function updateCard() {
      card.classList.remove('flipped');
      wordEn.textContent = words[currentIndex].en;
      wordKo.textContent = words[currentIndex].ko;
      wordEx.textContent = words[currentIndex].ex;
      progress.textContent = (currentIndex + 1) + ' / ' + words.length;

      // 새 단어가 나오면 퀴즈도 다시 생성합니다
      renderQuiz();
    }

    // 스피커 버튼 클릭 이벤트 설정입니다
    speakerBtn.addEventListener('click', function(e) {
      e.stopPropagation(); // 카드가 뒤집히지 않도록 막습니다
      speakWord(words[currentIndex].en);
    });

    // 카드 뒤집기 클릭 이벤트 설정입니다
    cardContainer.addEventListener('click', function() {
      card.classList.toggle('flipped');
    });

    // 이전 버튼 이벤트입니다
    prevBtn.addEventListener('click', function() {
      if (currentIndex > 0) {
        currentIndex--;
        updateCard();
      }
    });

    // 다음 버튼 이벤트입니다
    nextBtn.addEventListener('click', function() {
      if (currentIndex < words.length - 1) {
        currentIndex++;
        updateCard();
      }
    });

    // 처음 화면에 첫 번째 단어와 퀴즈를 표시합니다
    updateCard();
  </script>
</body>
</html>
