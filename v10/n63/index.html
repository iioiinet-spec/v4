<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>영어 단어 카드</title>
  <!-- 구글 폰트(나눔손글씨 펜, 개구) 불러오기 -->
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
  <style>
    /* 색상과 폰트 정보를 담고 있는 변수 모음입니다 */
    :root {
      --bg-color: #3d81ff;       /* 배경 색상 */
      --card-color: #b30000;     /* 카드 배경 색상 */
      --text-color: #050e1f;     /* 글자 색상 */
      --point-color: #399354;    /* 포인트 색상 */
    }

    /* 배경 애니메이션 키프레임 정의입니다 */
    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* 카드 네온 빛 애니메이션 키프레임 정의입니다 */
    @keyframes neonGlow {
      0% { box-shadow: 0 10px 25px rgba(0,0,0,0.3), 0 0 15px rgba(255,215,0,0.4); }
      50% { box-shadow: 0 15px 35px rgba(0,0,0,0.4), 0 0 30px rgba(255,215,0,0.8); }
      100% { box-shadow: 0 10px 25px rgba(0,0,0,0.3), 0 0 15px rgba(255,215,0,0.4); }
    }

    /* 화면 전체를 중앙 정렬하고 화려한 그라데이션 배경을 적용합니다 */
    body {
      font-family: 'Nanum Pen Script', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(-45deg, #3d81ff, #7b2cbf, #ff007f, #399354);
      background-size: 400% 400%;
      animation: gradientBG 10s ease infinite;
    }

    /* 단어 카드의 전체 크기와 3D 효과를 설정합니다 */
    .card-container {
      width: 320px;
      height: 220px;
      perspective: 1000px;
      cursor: pointer;
    }

    /* 카드가 뒤집힐 때 애니메이션을 담당하는 상자입니다 */
    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
    }

    /* 카드에 'flipped' 클래스가 붙으면 180도 뒤집힙니다 */
    .card.flipped {
      transform: rotateY(180deg);
    }

    /* 카드의 앞면과 뒷면 공통 스타일입니다 (입체적 테두리 및 빛 효과 추가) */
    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 36px; /* 카드 모서리 둥글기 36px 적용 */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
      background: linear-gradient(135deg, #d90429, #b30000, #780000); /* 카드에 부드러운 입체 그라데이션 적용 */
      border: 3px solid rgba(255, 255, 255, 0.4);
      animation: neonGlow 3s infinite ease-in-out;
    }

    /* 카드 앞면/뒷면 공통 글자 색상 및 폰트 적용입니다 */
    .card-face, .quiz-btn, button {
      color: #ffffff;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }

    /* 영어 단어에 Gaegu 폰트와 화려한 글로우 효과를 적용합니다 */
    .word {
      font-family: 'Gaegu', cursive;
      font-size: 48px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px #ff007f;
    }

    /* 뒷면 한글 뜻 글자 크기 및 효과입니다 */
    .meaning {
      font-size: 38px;
      font-weight: bold;
      margin-bottom: 10px;
      color: #ffd700;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
    }

    /* 뒷면 예문 글자 크기입니다 */
    .example {
      font-family: 'Gaegu', cursive;
      font-size: 22px;
    }

    /* 스피커 버튼 스타일입니다 */
    .speaker-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    /* 스피커 버튼에 마우스를 올렸을 때 효과입니다 */
    .speaker-btn:hover {
      transform: scale(1.15) rotate(10deg);
      background: rgba(255, 255, 255, 0.4);
    }

    /* 조작 버튼과 진도 표시 영역 스타일입니다 */
    .controls {
      margin-top: 25px;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    /* 이전/다음 버튼 스타일입니다 (화려한 네온 스타일) */
    button {
      padding: 10px 24px;
      font-family: 'Nanum Pen Script', sans-serif;
      font-size: 24px;
      border: 2px solid rgba(255,255,255,0.6);
      border-radius: 16px;
      background: linear-gradient(135deg, #2ec4b6, #399354);
      color: #ffffff;
      cursor: pointer;
      box-shadow: 0 6px 12px rgba(0,0,0,0.2);
      transition: all 0.2s ease;
    }

    /* 버튼에 마우스를 올렸을 때 효과입니다 */
    button:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }

    /* 진도 표시 글자 스타일입니다 */
    .progress {
      font-size: 26px;
      font-weight: bold;
      color: #ffffff;
      text-shadow: 0 0 8px rgba(0, 0, 0, 0.5);
    }

    /* 퀴즈 영역 스타일입니다 */
    .quiz-container {
      margin-top: 25px;
      text-align: center;
      width: 320px;
      background: rgba(0, 0, 0, 0.25);
      padding: 15px;
      border-radius: 24px;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    /* 퀴즈 질문 글자 스타일입니다 */
    .quiz-question {
      font-size: 24px;
      font-weight: bold;
      color: #ffffff;
      margin-top: 0;
      margin-bottom: 12px;
      text-shadow: 0 0 5px rgba(0,0,0,0.5);
    }

    /* 퀴즈 보기 버튼 배치 스타일입니다 */
    .quiz-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    /* 퀴즈 보기 개별 버튼 스타일입니다 */
    .quiz-btn {
      padding: 12px;
      font-family: 'Nanum Pen Script', sans-serif;
      font-size: 22px;
      background: rgba(255, 255, 255, 0.9);
      color: var(--text-color);
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
      transition: all 0.2s ease;
      text-shadow: none;
    }

    /* 퀴즈 보기 버튼에 마우스를 올렸을 때 효과입니다 */
    .quiz-btn:hover {
      background-color: #ffffff;
      transform: translateY(-2px);
    }

    /* 정답 버튼 스타일입니다 */
    .quiz-btn.correct {
      background: linear-gradient(135deg, #2ec4b6, #399354) !important;
      color: white !important;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
      transform: scale(1.05);
    }

    /* 오답 버튼 스타일(흐리게)입니다 */
    .quiz-btn.dimmed {
      opacity: 0.35;
      cursor: default;
      transform: none;
    }

    /* 퀴즈 점수판 스타일입니다 */
    .quiz-score {
      margin-top: 15px;
      font-size: 20px;
      color: #ffffff;
      text-shadow: 0 0 5px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <!-- 단어 카드 영역입니다 -->
  <div class="card-container" id="cardContainer">
    <div class="card" id="card">
      <!-- 앞면: 영어 단어와 스피커 버튼이 보입니다 -->
      <div class="card-face card-front">
        <button class="speaker-btn" id="speakerBtn">🔊</button>
        <div class="word" id="wordFront"></div>
      </div>
      <!-- 뒷면: 뜻과 예문이 보입니다 -->
      <div class="card-face card-back">
        <div class="meaning" id="meaningBack"></div>
        <div class="example" id="exampleBack"></div>
      </div>
    </div>
  </div>

  <!-- 조작 영역: 이전 버튼, 진도 표시, 다음 버튼입니다 -->
  <div class="controls">
    <button id="prevBtn">이전</button>
    <span class="progress" id="progress">1 / 10</span>
    <button id="nextBtn">다음</button>
  </div>

  <!-- 퀴즈 영역입니다 -->
  <div class="quiz-container">
    <p class="quiz-question">이 단어의 뜻은?</p>
    <div class="quiz-options" id="quizOptions"></div>
    <div class="quiz-score">
      맞은 개수: <span id="correctScore">0</span> | 틀린 개수: <span id="wrongScore">0</span>
    </div>
  </div>

  <script>
    // ==========================================
    // 👇 [여기만 고치세요] 단어 목록을 추가하거나 수정하세요!
    // ==========================================
    const words = [
      { en:'computer', ko:'컴퓨터', ex:'' },
      { en:'soccer', ko:'축구', ex:'' },
      { en:'kinball', ko:'킨볼', ex:'' },
      { en:'beeswarmsimulator', ko:'벌뗴시뮬레이터', ex:'' },
      { en:'porcelain', ko:'도자기 꿀뜨게', ex:'' },
      { en:'이즈쿠', ko:'izuku', ex:'' },
      { en:'sun', ko:'태양', ex:'' },
      { en:'earth', ko:'지구', ex:'' },
      { en:'apple', ko:'사과', ex:'' },
      { en:'naruto', ko:'나루토', ex:'' }
    ];
    // ==========================================

    // 현재 보고 있는 단어의 번호(위치)와 점수를 저장하는 변수입니다
    let currentIndex = 0;
    let correctCount = 0;
    let wrongCount = 0;

    // HTML 요소들을 자바스크립트로 가져옵니다
    const card = document.getElementById('card');
    const cardContainer = document.getElementById('cardContainer');
    const wordFront = document.getElementById('wordFront');
    const meaningBack = document.getElementById('meaningBack');
    const exampleBack = document.getElementById('exampleBack');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const progress = document.getElementById('progress');
    const speakerBtn = document.getElementById('speakerBtn');
    const quizOptions = document.getElementById('quizOptions');
    const correctScore = document.getElementById('correctScore');
    const wrongScore = document.getElementById('wrongScore');

    // 퀴즈 보기를 생성하는 함수입니다
    function renderQuiz() {
      quizOptions.innerHTML = '';
      const current = words[currentIndex];
      
      // 정답 외의 다른 뜻들을 가져옵니다
      const otherMeanings = words
        .filter(w => w.ko !== current.ko)
        .map(w => w.ko);

      // 랜덤으로 섞는 함수입니다
      const shuffle = (array) => array.sort(() => Math.random() - 0.5);

      // 오답 3개를 무작위로 뽑고 정답을 포함시켜 섞습니다
      const wrongChoices = shuffle(otherMeanings).slice(0, 3);
      const choices = shuffle([current.ko, ...wrongChoices]);

      let answered = false;

      choices.forEach(meaning => {
        const btn = document.createElement('button');
        btn.className = 'quiz-btn';
        btn.textContent = meaning;

        btn.addEventListener('click', () => {
          if (answered) return; // 이미 답을 선택했다면 클릭 방지
          answered = true;

          const allBtns = quizOptions.querySelectorAll('.quiz-btn');
          
          if (meaning === current.ko) {
            correctCount++;
            correctScore.textContent = correctCount;
          } else {
            wrongCount++;
            wrongScore.textContent = wrongCount;
          }

          // 정답 버튼은 강조 색상, 나머지는 흐리게 처리
          allBtns.forEach(b => {
            if (b.textContent === current.ko) {
              b.classList.add('correct');
            } else {
              b.classList.add('dimmed');
            }
          });
        });

        quizOptions.appendChild(btn);
      });
    }

    // 화면에 현재 단어 정보를 뿌려주는 함수입니다
    function updateCard() {
      // 카드가 뒤집혀 있다면 다시 앞면으로 돌려놓습니다
      card.classList.remove('flipped');
      
      // 약간의 시간을 두어 카드가 돌아간 뒤 내용을 바꿉니다
      setTimeout(() => {
        // 현재 위치의 단어 정보를 가져옵니다
        const currentWord = words[currentIndex];
        // 앞면 영어 단어를 바꿉니다
        wordFront.textContent = currentWord.en;
        // 뒷면 한글 뜻을 바꿉니다
        meaningBack.textContent = currentWord.ko;
        // 뒷면 예문을 바꿉니다 (예문이 없으면 빈칸으로 둡니다)
        exampleBack.textContent = currentWord.ex;
        // 진도 표시를 업데이트합니다 (예: "1 / 10")
        progress.textContent = `${currentIndex + 1} / ${words.length}`;
        
        // 퀴즈도 함께 갱신합니다
        renderQuiz();
      }, 150);
    }

    // 카드를 클릭하면 뒤집히는 기능을 추가합니다
    cardContainer.addEventListener('click', () => {
      card.classList.toggle('flipped');
    });

    // 스피커 버튼 클릭 시 음성 재생 기능
    speakerBtn.addEventListener('click', (e) => {
      e.stopPropagation(); // 카드가 뒤집히는 기본 동작을 막음
      if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(words[currentIndex].en);
        utterance.lang = 'en-US';
        utterance.rate = 0.8; // 말하는 속도를 조금 느리게 설정
        window.speechSynthesis.speak(utterance);
      } else {
        alert('이 브라우저는 소리를 지원하지 않아요');
      }
    });

    // '이전' 버튼을 눌렀을 때 작동하는 기능입니다
    prevBtn.addEventListener('click', () => {
      // 첫 번째 단어가 아니면 이전 단어로 이동합니다
      if (currentIndex > 0) {
        currentIndex--;
        updateCard();
      }
    });

    // '다음' 버튼을 눌렀을 때 작동하는 기능입니다
    nextBtn.addEventListener('click', () => {
      // 마지막 단어가 아니면 다음 단어로 이동합니다
      if (currentIndex < words.length - 1) {
        currentIndex++;
        updateCard();
      }
    });

    // 페이지가 처음 켜졌을 때 첫 번째 단어를 보여줍니다
    updateCard();
  </script>
</body>
</html>
