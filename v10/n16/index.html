<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>영어 단어장</title>

  <!-- 구글 폰트(Nanum Pen Script)를 가져오는 링크입니다 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">

  <style>
    /* [여기부터 CSS 스타일 시작] */

    /* 색상과 디자인 요소를 한곳에서 관리하는 CSS 변수입니다 */
    :root {
      --bg-color: #02faff;        /* 화면 전체 배경색 (밝은 민트/시안) */
      --card-bg: #f9f9b1;         /* 카드 배경색 (연한 노랑) */
      --text-color: #000000;      /* 기본 글자색 (검정) */
      --point-color: #ff0000;     /* 포인트 색상 (빨강) */
      --card-radius: 0px;         /* 카드 모서리 둥글기 (각진 모양) */
      --font-family: 'Nanum Pen Script', cursive; /* 적용할 나눔손글씨 폰트 */
    }

    /* 전체 화면을 중앙으로 정렬하고 배경색과 폰트를 지정합니다 */
    body {
      font-family: var(--font-family); /* 설정한 폰트를 적용합니다 */
      background-color: var(--bg-color); /* 배경색을 적용합니다 */
      color: var(--text-color); /* 글자색을 적용합니다 */
      display: flex; /* 요소를 중앙에 배치하기 위해 씁니다 */
      flex-direction: column; /* 요소들을 위에서 아래로 세로 배치합니다 */
      align-items: center; /* 가로 중앙 정렬합니다 */
      justify-content: center; /* 세로 중앙 정렬합니다 */
      min-height: 100vh; /* 화면의 전체 높이를 사용합니다 */
      margin: 0; /* 화면 여백을 없앱니다 */
      padding: 20px 0; /* 위아래 여백을 줍니다 */
      box-sizing: border-box; /* 패딩을 전체 크기에 포함합니다 */
      font-size: 24px; /* 손글씨 폰트가 잘 보이도록 기본 글자 크기를 키웁니다 */
    }

    /* 진행률(3 / 20) 표시 글자 스타일입니다 */
    .progress {
      font-size: 28px; /* 글자 크기를 지정합니다 */
      font-weight: bold; /* 글자를 두껍게 합니다 */
      margin-bottom: 10px; /* 아래쪽에 여백을 줍니다 */
    }

    /* 맞은 개수와 틀린 개수를 보여주는 스타일입니다 */
    .score-board {
      font-size: 24px; /* 글자 크기를 지정합니다 */
      margin-bottom: 15px; /* 아래쪽에 여백을 줍니다 */
      color: var(--text-color); /* 글자색을 지정합니다 */
    }

    /* 카드 입체감(3D)을 표현하기 위한 상자입니다 */
    .card-container {
      width: 320px; /* 상자의 가로 크기입니다 */
      height: 220px; /* 상자의 세로 크기입니다 */
      perspective: 1000px; /* 3D 뒤집기 효과를 부드럽게 만들어 줍니다 */
      cursor: pointer; /* 마우스 손가락 모양으로 바꿉니다 */
    }

    /* 실제 움직이고 뒤집히는 카드 스타일입니다 */
    .card {
      width: 100%; /* 상자 가로에 가득 채웁니다 */
      height: 100%; /* 상자 세로에 가득 채웁니다 */
      position: relative; /* 위치 기준을 카드로 잡습니다 */
      transform-style: preserve-3d; /* 앞면과 뒷면을 3D 공간에 만듭니다 */
      transition: transform 0.6s; /* 카드가 0.6초 동안 부드럽게 뒤집힙니다 */
      border-radius: var(--card-radius); /* 각진 모서리로 만듭니다 */
      border: 3px solid var(--text-color); /* 검정 테두리를 그려줍니다 */
    }

    /* flipped 클래스가 붙으면 카드가 180도 뒤집힙니다 */
    .card.flipped {
      transform: rotateY(180deg); /* Y축 기준으로 180도 회전합니다 */
    }

    /* 카드의 앞면과 뒷면 공통 스타일입니다 */
    .card-front, .card-back {
      position: absolute; /* 카드 안에서 완전히 겹치게 배치합니다 */
      width: 100%; /* 카드에 가득 채웁니다 */
      height: 100%; /* 카드에 가득 채웁니다 */
      backface-visibility: hidden; /* 뒤집혔을 때 반대면이 보이지 않게 합니다 */
      display: flex; /* 글자를 중앙에 배치하기 위해 씁니다 */
      flex-direction: column; /* 내용을 세로로 배치합니다 */
      align-items: center; /* 가로 중앙 정렬합니다 */
      justify-content: center; /* 세로 중앙 정렬합니다 */
      padding: 20px; /* 안쪽 여백을 줍니다 */
      box-sizing: border-box; /* 여백 때문에 크기가 커지지 않게 합니다 */
      background-color: var(--card-bg); /* 연한 노랑 카드 배경색을 적용합니다 */
      border-radius: var(--card-radius); /* 각진 모서리를 적용합니다 */
      word-break: break-word; /* 글자가 카드를 넘어가면 줄바꿈합니다 */
    }

    /* 카드의 앞면 스타일입니다 */
    .card-front {
      font-size: 30px; /* 영단어 글자 크기를 키웁니다 */
      font-weight: bold; /* 글자를 두껍게 만듭니다 */
    }

    /* 카드의 뒷면 스타일입니다 */
    .card-back {
      transform: rotateY(180deg); /* 미리 180도 돌려놓아 뒤집었을 때 보이게 합니다 */
    }

    /* 뒷면의 한글 뜻 글자 스타일입니다 */
    .card-back .meaning {
      font-size: 28px; /* 뜻 글자 크기입니다 */
      font-weight: bold; /* 글자를 두껍게 만듭니다 */
      color: var(--point-color); /* 포인트 색상(빨강)으로 강조합니다 */
      margin-bottom: 10px; /* 아래쪽 예문과의 간격을 줍니다 */
    }

    /* 뒷면의 영어 예문 글자 스타일입니다 */
    .card-back .example {
      font-size: 22px; /* 예문 글자 크기입니다 */
      color: var(--text-color); /* 기본 글자색(검정)을 사용합니다 */
      text-align: center; /* 예문을 가운데 정렬합니다 */
    }

    /* 소리를 읽어주는 스피커 버튼 스타일입니다 */
    .speaker-btn {
      margin-top: 10px; /* 단어 아래쪽에 간격을 둡니다 */
      padding: 5px 12px; /* 버튼 안쪽 여백입니다 */
      font-size: 20px; /* 버튼 글자 크기입니다 */
      font-family: var(--font-family); /* 폰트를 동일하게 적용합니다 */
      background-color: var(--card-bg); /* 배경색을 카드와 맞춥니다 */
      border: 2px solid var(--text-color); /* 테두리를 그려줍니다 */
      border-radius: var(--card-radius); /* 모서리를 각지게 만듭니다 */
      cursor: pointer; /* 마우스 손가락 모양으로 바꿉니다 */
    }

    /* 스피커 버튼에 마우스를 올렸을 때 반전 효과입니다 */
    .speaker-btn:hover {
      background-color: var(--text-color); /* 배경색을 검정으로 만듭니다 */
      color: var(--card-bg); /* 글자를 연한 노랑으로 바꿉니다 */
    }

    /* 이전/다음 버튼을 모아두는 상자 스타일입니다 */
    .buttons {
      margin-top: 20px; /* 카드와의 간격을 줍니다 */
      display: flex; /* 버튼들을 가로로 나란히 만듭니다 */
      gap: 20px; /* 버튼과 버튼 사이의 간격입니다 */
    }

    /* 이전/다음 버튼 공통 스타일입니다 */
    .buttons button {
      padding: 8px 24px; /* 버튼 안쪽 여백입니다 */
      font-size: 24px; /* 버튼 글자 크기입니다 */
      font-family: var(--font-family); /* 폰트를 지정합니다 */
      background-color: var(--card-bg); /* 버튼 배경색을 설정합니다 */
      color: var(--text-color); /* 버튼 글자색을 설정합니다 */
      border: 2px solid var(--text-color); /* 버튼 테두리를 그려줍니다 */
      border-radius: var(--card-radius); /* 버튼 모서리를 각지게 만듭니다 */
      cursor: pointer; /* 마우스 손가락 모양으로 바꿉니다 */
    }

    /* 이전/다음 버튼에 마우스를 올렸을 때 효과입니다 */
    .buttons button:hover {
      background-color: var(--text-color); /* 배경색을 검정으로 바꿉니다 */
      color: var(--card-bg); /* 글자색을 노랑으로 바꿉니다 */
    }

    /* 4지선다 퀴즈를 담는 상자 스타일입니다 */
    .quiz-container {
      margin-top: 25px; /* 버튼 영역 아래에 간격을 줍니다 */
      width: 320px; /* 카드와 동일하게 가로 크기를 맞춥니다 */
      text-align: center; /* 정렬을 가운데로 정합니다 */
    }

    /* 퀴즈 제목 글자 스타일입니다 */
    .quiz-title {
      font-size: 26px; /* 제목 글자 크기입니다 */
      font-weight: bold; /* 글자를 두껍게 합니다 */
      margin-bottom: 10px; /* 선택지 버튼들과의 간격입니다 */
    }

    /* 4개 선택지 버튼들을 모아두는 곳입니다 */
    .options {
      display: flex; /* 버튼을 가로/세로로 정렬하기 위해 씁니다 */
      flex-direction: column; /* 선택지 버튼들을 세로로 쌓습니다 */
      gap: 8px; /* 버튼 간격입니다 */
    }

    /* 각 퀴즈 선택지 버튼 스타일입니다 */
    .option-btn {
      padding: 10px; /* 버튼 안쪽 여백입니다 */
      font-size: 22px; /* 버튼 글자 크기입니다 */
      font-family: var(--font-family); /* 폰트를 적용합니다 */
      background-color: var(--card-bg); /* 배경색을 정합니다 */
      color: var(--text-color); /* 글자색을 정합니다 */
      border: 2px solid var(--text-color); /* 테두리를 그립니다 */
      border-radius: var(--card-radius); /* 모서리를 각지게 만듭니다 */
      cursor: pointer; /* 마우스 손가락 모양으로 바꿉니다 */
    }

    /* 정답을 맞혔을 때 버튼 스타일입니다 */
    .option-btn.correct {
      background-color: #28a745 !important; /* 정답은 초록색 배경으로 바꿉니다 */
      color: #ffffff !important; /* 글자색을 하얗게 바꿉니다 */
    }

    /* 틀렸을 때 또는 클릭 후 오답 버튼 스타일입니다 */
    .option-btn.wrong {
      opacity: 0.4; /* 흐리게 표시합니다 */
    }
    /* [여기까지 CSS 스타일 끝] */
  </style>
</head>
<body>

  <!-- 현재 카드 위치 표시입니다 (예: 1 / 25) -->
  <div class="progress" id="progress">1 / 25</div>

  <!-- 맞은 개수와 틀린 개수를 보여주는 표시판입니다 -->
  <div class="score-board" id="scoreBoard">정답: 0개 | 오답: 0개</div>

  <!-- 누르면 뒤집히는 영어 단어 카드 전체 상자입니다 -->
  <div class="card-container" id="cardContainer">
    <div class="card" id="card">
      <!-- 카드의 앞면 (영어 단어 및 스피커) -->
      <div class="card-front">
        <div id="englishWord">apple</div>
        <!-- 누르면 소리가 나는 스피커 버튼입니다 -->
        <button class="speaker-btn" id="speakerBtn" onclick="speakWord(event)">🔊 읽기</button>
      </div>
      <!-- 카드의 뒷면 (한국어 뜻 및 예문) -->
      <div class="card-back">
        <div class="meaning" id="koreanMeaning">사과</div>
        <div class="example" id="englishExample">I eat an apple.</div>
      </div>
    </div>
  </div>

  <!-- 이전/다음 카드로 이동하는 버튼들입니다 -->
  <div class="buttons">
    <button id="prevBtn">이전</button>
    <button id="nextBtn">다음</button>
  </div>

  <!-- 단어 뜻 맞추기 퀴즈 영역입니다 -->
  <div class="quiz-container">
    <div class="quiz-title">이 단어의 뜻은?</div>
    <!-- 4지선다 보기 버튼들이 들어갈 공간입니다 -->
    <div class="options" id="quizOptions"></div>
  </div>

  <script>
    // ==========================================
    // ⭐ [여기만 고치세요] 단어 목록 배열입니다.
    // ==========================================
    const WORDS = [
      { en: 'apple', ko: '사과', ex: '' },
      { en: 'poop', ko: '똥', ex: 'I like poop' },
      { en: 'Pneumonoultramicroscopicsilicovolcanoconiosis', ko: '진폐증', ex: '' },
      { en: 'Supercalifragilisticexpialidocious', ko: '놀랍도록 좋은', ex: '' },
      { en: 'diarrhea', ko: '설사', ex: 'I love diarrhea' },
      { en: 'United Kingdom of Great Britain and Northern Ireland', ko: '영국', ex: '' },
      { en: 'Taumatawhakatangihangakoauauotamateaturipukakapikimaungahoronukupokaiwhenuakitanatahu', ko: '타우마타와카탕이항아코아우아우오타마테아투리푸카카피키마웅아호로누쿠포카이웨누아키타나타후', ex: '' },
      { en: 'Defenestration', ko: '창밖으로 던져버리는 행위', ex: '' },
      { en: 'Absquatulate', ko: '황급히 그 자리에서 떠나다', ex: '' },
      { en: 'Gobbledygook', ko: '횡설수설이나 전문 용어 남발', ex: '' },
      { en: 'Borborygmus', ko: '장음', ex: '' },
      { en: 'Overmorrow', ko: '모레', ex: '' },
      { en: 'Serendipity', ko: '뜻밖의 발견', ex: '' },
      { en: 'Petrichor', ko: '비가 내린 뒤 마른 땅에서 나는 좋은 흙내음', ex: '' },
      { en: 'Liminal', ko: '시작과 끝의 중간에 위치한 모호한 상태', ex: '' },
      { en: 'Nebulous', ko: '흐릿한, 모호한, 성운(눈구름) 모양의', ex: '' },
      { en: 'Ethereal', ko: '천상계의, 우아한, 이 세상 것 같지 않은 여린 아름다움', ex: '' },
      { en: 'Luminescent', ko: '(열을 내지 않고) 은은하게 빛나는', ex: '' },
      { en: 'Butthole', ko: '똥꼬', ex: '' },
      { en: 'poop', ko: '똥', ex: '' },
      { en: 'poop', ko: '똥', ex: '' },
      { en: 'poop', ko: '똥', ex: '' },
      { en: 'poop', ko: '똥', ex: '' },
      { en: 'poop', ko: '똥', ex: '' },
      { en: 'poop', ko: '똥', ex: '' }
    ];

    // 현재 보고 있는 단어의 번호(인덱스)입니다
    let currentIndex = 0;

    // 맞은 개수와 틀린 개수를 저장하는 변수입니다
    let correctCount = 0;
    let wrongCount = 0;

    // HTML 태그들을 자바스크립트로 가져옵니다
    const cardContainer = document.getElementById('cardContainer');
    const card = document.getElementById('card');
    const progressText = document.getElementById('progress');
    const englishWordText = document.getElementById('englishWord');
    const koreanMeaningText = document.getElementById('koreanMeaning');
    const englishExampleText = document.getElementById('englishExample');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const quizOptionsContainer = document.getElementById('quizOptions');
    const scoreBoardText = document.getElementById('scoreBoard');

    // 카드를 클릭했을 때 뒤집히는 동작입니다
    cardContainer.addEventListener('click', function () {
      card.classList.toggle('flipped');
    });

    // 화면에 현재 단어 정보를 뿌려주는 함수입니다
    function updateCard() {
      // 카드가 뒤집혀 있다면 다시 앞면으로 원상복구 합니다
      card.classList.remove('flipped');

      // 현재 선택된 단어 정보입니다
      const currentWord = WORDS[currentIndex];

      // 앞면과 뒷면의 내용을 채워넣습니다
      englishWordText.textContent = currentWord.en;
      koreanMeaningText.textContent = currentWord.ko;
      englishExampleText.textContent = currentWord.ex || '';

      // 진도율 표시를 업데이트합니다 (예: 1 / 25)
      progressText.textContent = `${currentIndex + 1} / ${WORDS.length}`;

      // 카드가 바뀔 때마다 해당 단어로 퀴즈도 새로 만듭니다
      renderQuiz();
    }

    // 이전 버튼을 눌렀을 때 실행되는 함수입니다
    prevBtn.addEventListener('click', function () {
      if (currentIndex > 0) {
        currentIndex--;
        updateCard();
      }
    });

    // 다음 버튼을 눌렀을 때 실행되는 함수입니다
    nextBtn.addEventListener('click', function () {
      if (currentIndex < WORDS.length - 1) {
        currentIndex++;
        updateCard();
      }
    });

    // 영어 단어를 목소리로 읽어주는 함수입니다
    function speakWord(event) {
      // 스피커 버튼 클릭 시 카드가 뒤집히지 않게 이벤트를 막아줍니다
      event.stopPropagation();

      // 브라우저가 음성 합성(Speech) 기능을 지원하는지 확인합니다
      if ('speechSynthesis' in window) {
        const textToSpeak = WORDS[currentIndex].en;
        const utterance = new SpeechSynthesisUtterance(textToSpeak);
        
        // 언어를 영어로 설정합니다
        utterance.lang = 'en-US';
        // 말하는 속도를 조금 느리게 설정합니다 (0.8배속)
        utterance.rate = 0.8;

        // 음성을 재생합니다
        window.speechSynthesis.speak(utterance);
      } else {
        // 음성 기능을 지원하지 않을 때 경고창을 띄웁니다
        alert("이 브라우저는 소리를 지원하지 않아요");
      }
    }

    // 배열 항목을 무작위로 섞어주는 함수입니다
    function shuffleArray(array) {
      return array.sort(() => Math.random() - 0.5);
    }

    // 퀴즈 4지선다 옵션을 생성하는 함수입니다
    function renderQuiz() {
      // 퀴즈 보기 상자를 깨끗이 비웁니다
      quizOptionsContainer.innerHTML = '';

      // 현재 정답 단어 정보입니다
      const correctAnswer = WORDS[currentIndex];

      // 정답을 제외한 나머지 오답 후보 목록을 만듭니다
      const otherWords = WORDS.filter((_, idx) => idx !== currentIndex);

      // 오답 후보 배열을 랜덤으로 섞습니다
      const shuffledOthers = shuffleArray([...otherWords]);

      // 오답 3개를 뽑아 정답과 함께 4개짜리 보기 배열을 만듭니다
      const optionsData = [
        correctAnswer,
        ...shuffledOthers.slice(0, 3)
      ];

      // 보기 4개를 최종적으로 섞어 정답 위치를 무작위로 만듭니다
      const finalOptions = shuffleArray(optionsData);

      // 보기 4개의 버튼을 만들어 화면에 부착합니다
      finalOptions.forEach(option => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = option.ko;

        // 선택지 버튼을 클릭했을 때의 동작입니다
        btn.addEventListener('click', function () {
          // 이미 답변 선택이 끝난 상태면 클릭하지 못하게 막습니다
          const allBtns = quizOptionsContainer.querySelectorAll('.option-btn');
          let alreadyAnswered = false;
          allBtns.forEach(b => {
            if (b.classList.contains('correct') || b.classList.contains('wrong')) {
              alreadyAnswered = true;
            }
          });
          if (alreadyAnswered) return;

          // 클릭한 옵션이 정답인 경우입니다
          if (option.ko === correctAnswer.ko) {
            btn.classList.add('correct');
            correctCount++; // 맞은 개수 1 증가
          } else { // 클릭한 옵션이 오답인 경우입니다
            btn.classList.add('wrong');
            wrongCount++; // 틀린 개수 1 증가

            // 정답에 해당하는 버튼을 찾아서 초록색으로 표시해 줍니다
            allBtns.forEach(b => {
              if (b.textContent === correctAnswer.ko) {
                b.classList.add('correct');
              }
            });
          }

          // 선택하지 않은 나머지 오답 버튼들도 흐리게 처리합니다
          allBtns.forEach(b => {
            if (!b.classList.contains('correct')) {
              b.classList.add('wrong');
            }
          });

          // 맞은 개수와 틀린 개수를 화면에 갱신합니다
          scoreBoardText.textContent = `정답: ${correctCount}개 | 오답: ${wrongCount}개`;
        });

        quizOptionsContainer.appendChild(btn);
      });
    }

    // 프로그램이 시작될 때 첫 번째 카드를 보여줍니다
    updateCard();
  </script>
</body>
</html>
