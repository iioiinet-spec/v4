<!DOCTYPE html>
<html lang="ko">
<head>
    <!-- 문서의 문자셋을 UTF-8로 설정하여 한글이 깨지지 않게 합니다 -->
    <meta charset="UTF-8">
    <!-- 모바일 기기 화면 크기에 맞게 반응형으로 표시되도록 설정합니다 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 브라우저 탭에 표시될 제목을 지정합니다 -->
    <title>초등 영단어 카드와 퀴즈</title>
    <!-- 구글 폰트 Jua(한글용)와 Fredoka(영문용)를 불러옵니다 -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Jua&display=swap" rel="stylesheet">
    <!-- 화면 디자인을 꾸미기 위한 CSS 스타일을 작성합니다 -->
    <style>
        /* :root를 사용하여 색상들을 CSS 변수로 정의합니다 */
        :root {
            --bg-color: #fff0f6;     /* 배경 색상 (연한 분홍빛) */
            --card-color: #ffffff;   /* 카드 앞면 배경 색상 (순백색) */
            --text-color: #5b3a52;   /* 기본 글자 색상 (진한 퍼플브라운) */
            --point-color: #ff6fa5;  /* 강조 및 버튼 포인트 색상 (화사한 핑크) */
            --sub-card-bg: #4a90e2;  /* 카드 뒷면 배경 색상 (시원한 파란색) */
        }

        /* 웹페이지 전체의 기본 글꼴, 배경색, 정렬 방식을 지정합니다 */
        body {
            font-family: 'Jua', 'Fredoka', sans-serif; /* 한글은 주아, 영문은 Fredoka 폰트를 적용합니다 */
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }

        /* 단어 카드가 놓일 공간(컨테이너)의 3D 효과 설정을 합니다 */
        .card-container {
            perspective: 1000px;
            width: 320px;
            height: 200px;
            margin-bottom: 15px;
            cursor: pointer;
        }

        /* 카드 전체의 크기와 뒤집히는 애니메이션 효과를 설정합니다 */
        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            border-radius: 28px; /* 카드 모서리 둥글기를 28px로 적용합니다 */
            box-shadow: 0 8px 20px rgba(255, 111, 165, 0.15);
        }

        /* 카드가 뒤집혔을 때 회전하도록 클래스를 정의합니다 */
        .card.is-flipped {
            transform: rotateY(180deg);
        }

        /* 카드의 앞면과 뒷면 공통 디자인을 설정합니다 */
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 28px; /* 카드 모서리 둥글기를 28px로 적용합니다 */
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        /* 카드의 앞면 색상과 글자 크기를 설정합니다 */
        .card-front {
            background-color: var(--card-color); /* 앞면 배경색을 순백색으로 지정합니다 */
            color: var(--text-color);
            font-family: 'Fredoka', 'Jua', sans-serif; /* 영어 단어에 Fredoka 폰트 적용 */
            font-size: 36px;
            font-weight: 600;
        }

        /* 카드의 뒷면 색상과 내용 정렬을 설정합니다 */
        .card-back {
            background-color: var(--sub-card-bg); /* 뒷면 색상은 시원한 파란색 변수를 사용합니다 */
            color: white;
            transform: rotateY(180deg);
        }

        /* 뒷면의 단어 뜻 글자 크기를 키웁니다 */
        .card-back .meaning {
            font-size: 28px;
            font-weight: normal;
            margin-bottom: 8px;
        }

        /* 뒷면의 예문 글자 크기를 알맞게 조절합니다 */
        .card-back .example {
            font-size: 16px;
            opacity: 0.95;
        }

        /* 진도 표시(몇 번 / 총 몇 개)의 글자 모양을 꾸밉니다 */
        .progress {
            font-size: 20px;
            color: var(--text-color);
            margin-bottom: 10px;
        }

        /* 버튼들을 감싸는 영역을 정렬합니다 */
        .button-group {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        /* 이전, 다음 버튼의 디자인을 꾸밉니다 */
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 16px;
            background-color: var(--point-color);
            color: white;
            box-shadow: 0 4px 10px rgba(255, 111, 165, 0.3);
            transition: transform 0.1s, background-color 0.2s;
            font-family: 'Jua', sans-serif;
        }

        /* 마우스를 올렸을 때 버튼 색상을 바꿉니다 */
        button:hover {
            opacity: 0.9;
        }

        /* 스피커 버튼 디자인 설정 */
        .speaker-btn {
            background-color: white;
            color: #2b7de9;
            margin-top: 12px;
            padding: 6px 14px;
            font-size: 14px;
            border-radius: 12px;
        }

        /* 단어 뜻 퀴즈 상자 영역의 디자인을 꾸밉니다 */
        .quiz-container {
            text-align: center;
            background: var(--card-color);
            padding: 15px;
            border-radius: 28px; /* 카드 모서리 둥글기를 28px로 맞춤 */
            box-shadow: 0 8px 20px rgba(255, 111, 165, 0.1);
            width: 320px;
            box-sizing: border-box;
        }

        /* 퀴즈 안내 질문 글자를 꾸밉니다 */
        .quiz-question {
            font-size: 16px;
            margin-bottom: 10px;
            color: var(--text-color);
        }

        /* 퀴즈 보기 버튼들을 2열 격자로 배치합니다 */
        .quiz-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
        }

        /* 퀴즈 보기 버튼 개별 디자인을 꾸밉니다 */
        .quiz-btn {
            padding: 8px;
            font-size: 14px;
            background-color: var(--bg-color);
            color: var(--text-color);
            box-shadow: none;
            border-radius: 12px;
        }

        /* 퀴즈 보기 버튼에 마우스를 올렸을 때 */
        .quiz-btn:hover {
            background-color: #ffd6e0;
        }

        /* 정답 버튼을 강조합니다 */
        .quiz-btn.correct {
            background-color: #4cd137 !important;
            color: white;
        }

        /* 틀린 버튼을 흐리게 만듭니다 */
        .quiz-btn.wrong {
            opacity: 0.4;
        }

        /* 맞은 개수와 틀린 개수를 보여주는 점수판 글자를 꾸밉니다 */
        .quiz-score {
            font-size: 14px;
            color: var(--text-color);
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <!-- 현재 몇 번째 단어인지 보여주는 진도 표시 영역입니다 -->
    <div id="progress" class="progress">1 / 10</div>

    <!-- 카드를 클릭하면 뒤집히도록 만든 카드 컨테이너입니다 -->
    <div class="card-container" onclick="flipCard()">
        <div id="card" class="card">
            <!-- 카드의 앞면 (영어 단어가 표시됨) -->
            <div id="cardFront" class="card-front card-face">no</div>
            <!-- 카드의 뒷면 (뜻과 예문, 소리 듣기 버튼이 표시됨) -->
            <div class="card-back card-face">
                <div id="cardMeaning" class="meaning">아니</div>
                <div id="cardExample" class="example">say no more(게임이름)</div>
                <!-- 소리를 들려주는 버튼입니다 (클릭 시 카드가 뒤집히는 동작이 겹치지 않게 막아둠) -->
                <button class="speaker-btn" onclick="event.stopPropagation(); playVoice();">🔊 소리 듣기</button>
            </div>
        </div>
    </div>

    <!-- 이전 버튼과 다음 버튼이 들어있는 영역입니다 -->
    <div class="button-group">
        <button onclick="prevCard()">이전</button>
        <button onclick="nextCard()">다음</button>
    </div>

    <!-- 단어 뜻을 맞추는 퀴즈 영역입니다 -->
    <div class="quiz-container">
        <div class="quiz-question">이 단어의 뜻은?</div>
        <!-- 4개의 보기 버튼이 들어갈 공간입니다 -->
        <div id="quizOptions" class="quiz-options"></div>
        <!-- 맞은 개수와 틀린 개수를 실시간으로 보여주는 공간입니다 -->
        <div id="quizScore" class="quiz-score">맞은 개수: 0 | 틀린 개수: 0</div>
    </div>

    <!-- 동작을 제어하기 위한 자바스크립트 코드를 작성합니다 -->
    <script>
        // ==========================================
        // [여기만 고치세요] 단어 목록을 수정하거나 추가할 수 있습니다.
        // 형식: { en: '영어단어', ko: '뜻', ex: '예문' }
        // ==========================================
        const words = [
          { en:'no', ko:'아니', ex:'say no more(게임이름)' },
          { en:'wow', ko:'와', ex:'wow Jesus' },
          { en:'Hallelujah', ko:'하나님을 찬양하라', ex:'Hallelujah Hallelujah' },
          { en:'Teknolojia', ko:'테크놀로지아!!!!!!!!!!!!!', ex:'What is this its teknolojia' },
          { en:'bad', ko:'나빠', ex:'' },
          { en:'bad', ko:'침대', ex:'' },
          { en:'cap', ko:'모자', ex:'' },
          { en:'gun', ko:'총', ex:'' },
          { en:'bus', ko:'버스', ex:'' },
          { en:'return', ko:'다시', ex:'' },
        ];

        // 현재 보고 있는 단어의 번호(인덱스)를 기억하는 변수입니다 (처음엔 0번지)
        let currentIndex = 0;
        // 퀴즈에서 맞은 개수를 세는 변수입니다
        let correctCount = 0;
        // 퀴즈에서 틀린 개수를 세는 변수입니다
        let wrongCount = 0;
        // 현재 단어의 퀴즈를 이미 풀었는지 확인하는 변수입니다
        let quizAnswered = false;

        // 화면에 현재 단어 정보와 진도, 퀴즈를 업데이트해주는 함수입니다
        function updateCard() {
            // 현재 순서의 단어 데이터를 가져옵니다
            const current = words[currentIndex];
            // 앞면에 영어 단어를 넣습니다
            document.getElementById('cardFront').innerText = current.en;
            // 뒷면에 뜻을 넣습니다
            document.getElementById('cardMeaning').innerText = current.ko;
            // 뒷면에 예문을 넣습니다
            document.getElementById('cardExample').innerText = current.ex;
            // 진도 표시 글자를 '현재번호 / 전체개수' 형태로 바꿉니다
            document.getElementById('progress').innerText = `${currentIndex + 1} / ${words.length}`;
            // 단어가 바뀔 때마다 퀴즈 보기들도 새로 만들어줍니다
            updateQuiz();
        }

        // 카드를 클릭했을 때 앞뒤로 뒤집어주는 함수입니다
        function flipCard() {
            // 카드 태그에 'is-flipped' 효과를 껐다 켰다(toggle) 합니다
            document.getElementById('card').classList.toggle('is-flipped');
        }

        // '다음' 버튼을 눌렀을 때 다음 단어로 넘어가는 함수입니다
        function nextCard() {
            // 카드가 뒤집혀 있다면 먼저 앞면으로 돌려놓습니다
            document.getElementById('card').classList.remove('is-flipped');
            // 다음 번호로 이동합니다 (마지막 단어면 처음으로 돌아갑니다)
            currentIndex = (currentIndex + 1) % words.length;
            // 바뀐 단어 정보를 화면에 다시 그립니다
            updateCard();
        }

        // '이전' 버튼을 눌렀을 때 이전 단어로 돌아가는 함수입니다
        function prevCard() {
            // 카드가 뒤집혀 있다면 먼저 앞면으로 돌려놓습니다
            document.getElementById('card').classList.remove('is-flipped');
            // 이전 번호로 이동합니다 (첫 단어면 맨 마지막 단어로 갑니다)
            currentIndex = (currentIndex - 1 + words.length) % words.length;
            // 바뀐 단어 정보를 화면에 다시 그립니다
            updateCard();
        }

        // 브라우저 내장 음성 기능을 이용해 영어 단어를 조금 느리게 읽어주는 함수입니다
        function playVoice() {
            // 브라우저가 음성 합성 기능을 지원하는지 확인합니다
            if ('speechSynthesis' in window) {
                const currentWord = words[currentIndex].en; // 현재 단어 가져오기
                const utterance = new SpeechSynthesisUtterance(currentWord);
                utterance.lang = 'en-US'; // 영어 발음 설정
                utterance.rate = 0.7;     // 말하는 속도를 조금 느리게 설정
                window.speechSynthesis.speak(utterance);
            } else {
                // 지원하지 않는 브라우저일 경우 안내 문구를 띄웁니다
                alert("이 브라우저는 소리를 지원하지 않아요");
            }
        }

        // 퀴즈 보기를 생성하고 섞어주는 함수입니다
        function updateQuiz() {
            quizAnswered = false; // 새로운 단어이므로 퀴즈 안 푼 상태로 초기화합니다
            const current = words[currentIndex];
            const correctKo = current.ko; // 정답 뜻
            
            // 다른 단어의 뜻 중에서 오답 3개 추출하기
            let wrongOptions = words.filter(w => w.ko !== correctKo).map(w => w.ko);
            wrongOptions.sort(() => Math.random() - 0.5);
            
            // 정답 1개와 오답 3개를 합친 후 무작위로 섞기
            let options = [correctKo, ...wrongOptions.slice(0, 3)];
            options.sort(() => Math.random() - 0.5);

            // HTML 보기 버튼 영역을 비우고 새로 채우기
            const optionsContainer = document.getElementById('quizOptions');
            optionsContainer.innerHTML = '';

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'quiz-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, correctKo, btn);
                optionsContainer.appendChild(btn);
            });
        }

        // 퀴즈 보기를 눌렀을 때 정답인지 확인하고 점수를 올리는 함수입니다
        function checkAnswer(selected, correct, btn) {
            if (quizAnswered) return; // 이미 풀었다면 중복 클릭 방지
            quizAnswered = true; // 풀었다고 표시

            const buttons = document.querySelectorAll('.quiz-btn');
            if (selected === correct) {
                correctCount++; // 맞은 개수 1 증가
                btn.classList.add('correct'); // 정답 버튼은 초록색
            } else {
                wrongCount++; // 틀린 개수 1 증가
                btn.classList.add('wrong'); // 누른 오답 버튼은 흐리게
                // 진짜 정답 버튼도 찾아내어 초록색으로 표시
                buttons.forEach(b => {
                    if (b.innerText === correct) {
                        b.classList.add('correct');
                    }
                });
            }
            // 점수판 글자 업데이트
            document.getElementById('quizScore').innerText = `맞은 개수: ${correctCount} | 틀린 개수: ${wrongCount}`;
        }

        // 웹페이지가 처음 열렸을 때 첫 번째 단어와 퀴즈를 화면에 보여줍니다
        updateCard();
    </script>
</body>
</html>
