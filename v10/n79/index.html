<!DOCTYPE html>
<!-- 이 문서는 최신 웹 표준 형식으로 만들어진 웹 페이지입니다 -->
<html lang="ko">
<!-- 한국어로 구성된 웹 페이지임을 컴퓨터에 알려줍니다 -->
<head>
  <!-- 글자가 깨지지 않도록 약속된 UTF-8 방식으로 설정합니다 -->
  <meta charset="UTF-8">
  <!-- 스마트폰과 태블릿 화면에서도 알맞은 크기로 보이게 조절합니다 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 웹 브라우저 탭 위에 보일 제목입니다 -->
  <title>단계별 단어 카드 놀이</title>
  <!-- 여기서부터는 화면을 예쁘게 색칠하고 꾸미는 CSS 공간입니다 -->
  <style>
    /* 화면 전체의 기본 바탕과 위치를 정리합니다 */
    body {
      /* 눈이 피로하지 않도록 부드러운 하늘색 바탕을 칠합니다 */
      background-color: #f0f4f8;
      /* 읽기 편하고 깔끔한 기본 고딕 글씨체로 맞춥니다 */
      font-family: sans-serif;
      /* 모든 상자들을 가지런히 정리하는 도구를 켭니다 */
      display: flex;
      /* 상자들을 위에서 아래로 차곡차곡 쌓습니다 */
      flex-direction: column;
      /* 모든 내용물을 화면 가로 한가운데로 모읍니다 */
      align-items: center;
      /* 위쪽 벽과 적당히 떨어지게 여백을 줍니다 */
      padding: 30px 15px;
      /* 바깥쪽의 불필요한 빈틈을 없앱니다 */
      margin: 0;
      /* 마우스로 글자를 잘못 긁지 않도록 막습니다 */
      user-select: none;
    }

    /* 1단계부터 5단계까지 고르는 버튼들이 모여있는 상자입니다 */
    .stage-container {
      /* 버튼들을 옆으로 나란히 줄 세웁니다 */
      display: flex;
      /* 여러 단계 버튼 사이를 8픽셀씩 띄웁니다 */
      gap: 8px;
      /* 화면이 좁으면 다음 줄로 자연스럽게 넘어가게 합니다 */
      flex-wrap: wrap;
      /* 버튼들을 가운데로 옹기종기 모아줍니다 */
      justify-content: center;
      /* 아래쪽 카드와 떨어지도록 20픽셀 빈틈을 둡니다 */
      margin-bottom: 20px;
      /* 너무 넓어지지 않게 최대 너비를 360픽셀로 제한합니다 */
      max-width: 360px;
    }

    /* 각 단계를 고르는 둥근 단추 꾸미기입니다 */
    .stage-btn {
      /* 위아래 8픽셀 좌우 14픽셀만큼 폭을 줍니다 */
      padding: 8px 14px;
      /* 14픽셀 크기의 알맞은 글씨로 만듭니다 */
      font-size: 14px;
      /* 글자를 굵게 만들어 잘 보이게 합니다 */
      font-weight: bold;
      /* 테두리 선을 2픽셀 두께로 만듭니다 */
      border: 2px solid #cbd5e1;
      /* 모서리를 둥글게 20픽셀로 깎습니다 */
      border-radius: 20px;
      /* 기본 바탕은 깨끗한 흰색으로 칠합니다 */
      background-color: #ffffff;
      /* 글자 색을 차분한 회색으로 만듭니다 */
      color: #4a5568;
      /* 마우스를 올리면 손가락 모양으로 바꿉니다 */
      cursor: pointer;
      /* 색이 바뀔 때 0.2초 동안 부드럽게 변합니다 */
      transition: all 0.2s;
    }

    /* 지금 선택되어 공부 중인 활성화된 단계 단추 모양입니다 */
    .stage-btn.active {
      /* 파란색 바탕을 칠해 눈에 쏙 들어오게 합니다 */
      background-color: #3182ce;
      /* 글자 색을 흰색으로 바꿔 밝게 보여줍니다 */
      color: #ffffff;
      /* 테두리도 같은 파란색으로 맞춥니다 */
      border-color: #3182ce;
    }

    /* 현재 단계 안에서 몇 번째 카드인지 알려주는 글자 상자입니다 */
    .progress-box {
      /* 글씨를 큼직하게 18픽셀로 키웁니다 */
      font-size: 18px;
      /* 숫자를 진하고 두껍게 만듭니다 */
      font-weight: bold;
      /* 눈이 편안한 남회색을 칠합니다 */
      color: #334155;
      /* 카드와 닿지 않도록 아래에 15픽셀 공간을 둡니다 */
      margin-bottom: 15px;
    }

    /* 3D로 카드가 휙 돌아가는 효과를 주기 위한 바깥 겉상자입니다 */
    .card-wrap {
      /* 카드의 가로 길이를 320픽셀로 넉넉하게 줍니다 */
      width: 320px;
      /* 카드의 세로 길이를 220픽셀로 정합니다 */
      height: 220px;
      /* 입체감을 살리기 위해 1000픽셀 거리감을 줍니다 */
      perspective: 1000px;
      /* 손가락 커서로 바꿔 누를 수 있음을 알려줍니다 */
      cursor: pointer;
    }

    /* 실제로 앞뒤로 회전 운동을 하는 진짜 카드 알맹이입니다 */
    .card-inner {
      /* 겉상자 가로 크기를 전부 가득 채웁니다 */
      width: 100%;
      /* 겉상자 세로 크기도 전부 가득 채웁니다 */
      height: 100%;
      /* 위치 배치를 위해 기준점으로 삼습니다 */
      position: relative;
      /* 돌아갈 때 0.5초 동안 부드럽게 회전합니다 */
      transition: transform 0.5s;
      /* 앞면과 뒷면이 3차원 공간에서 함께 돌아가게 지킵니다 */
      transform-style: preserve-3d;
    }

    /* 카드가 뒤집혔을 때 작동하는 모양입니다 */
    .card-inner.flipped {
      /* 세로축을 중심으로 180도 반 바퀴 빙글 돌립니다 */
      transform: rotateY(180deg);
    }

    /* 카드의 앞면과 뒷면이 함께 공유하는 공통 모양입니다 */
    .face {
      /* 상자 안에서 딱 붙어 있도록 위치를 잡습니다 */
      position: absolute;
      /* 가로 크기를 빈틈없이 100% 채웁니다 */
      width: 100%;
      /* 세로 크기를 빈틈없이 100% 채웁니다 */
      height: 100%;
      /* 카드 모서리를 둥글둥글하게 16픽셀로 깎습니다 */
      border-radius: 16px;
      /* 글자들을 가운데로 쏙 모으기 위해 켭니다 */
      display: flex;
      /* 글자들을 위아래로 쌓아 올립니다 */
      flex-direction: column;
      /* 가로 가운데로 줄을 똑바르게 맞춥니다 */
      align-items: center;
      /* 세로 높이도 가운데로 균형을 맞춥니다 */
      justify-content: center;
      /* 글자가 벽에 닿지 않도록 안쪽에 공간을 둡니다 */
      padding: 20px;
      /* 상자가 커지지 않고 정해진 크기를 유지합니다 */
      box-sizing: border-box;
      /* 카드 아래에 부드러운 그림자를 넣어 띄워줍니다 */
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      /* 뒷면이 보일 때는 반대쪽 면을 보이지 않게 숨깁니다 */
      backface-visibility: hidden;
    }

    /* 영어 단어가 크게 적힌 앞면 카드 꾸미기입니다 */
    .front {
      /* 바탕을 새하얀 흰색으로 칠합니다 */
      background-color: #ffffff;
      /* 겉에 옅은 회색 테두리를 2픽셀 두릅니다 */
      border: 2px solid #e2e8f0;
      /* 영어 단어를 시원한 파란색으로 칠합니다 */
      color: #2b6cb0;
    }

    /* 우리말 뜻과 예문이 적힌 뒷면 카드 꾸미기입니다 */
    .back {
      /* 따뜻하고 은은한 미색 바탕을 칠합니다 */
      background-color: #fffdf5;
      /* 연한 주황빛 테두리를 2픽셀 두릅니다 */
      border: 2px solid #fed7aa;
      /* 차분한 짙은 회색 글자 색을 줍니다 */
      color: #1e293b;
      /* 뒷면은 처음에 숨어있도록 180도 미리 돌려둡니다 */
      transform: rotateY(180deg);
    }

    /* 앞면에 나오는 큼직한 영어 단어 글자입니다 */
    .word-text {
      /* 한눈에 시원하게 보이도록 34픽셀로 키웁니다 */
      font-size: 34px;
      /* 글자를 아주 굵고 또렷하게 만듭니다 */
      font-weight: bold;
    }

    /* 뒤집어보라고 알려주는 친절한 작은 안내 글입니다 */
    .hint-text {
      /* 작고 아담한 13픽셀 크기로 정합니다 */
      font-size: 13px;
      /* 옅은 회색으로 은은하게 칠합니다 */
      color: #94a3b8;
      /* 단어 아래로 12픽셀 떨어지게 거리를 둡니다 */
      margin-top: 12px;
    }

    /* 뒷면에 나오는 우리말 뜻 글자입니다 */
    .meaning-text {
      /* 뜻이 잘 보이도록 26픽셀 크기로 만듭니다 */
      font-size: 26px;
      /* 글자를 두껍고 튼튼하게 만듭니다 */
      font-weight: bold;
      /* 예문과 겹치지 않게 아래쪽에 12픽셀 틈을 둡니다 */
      margin-bottom: 12px;
    }

    /* 뒷면에 나오는 영어 예문 문장입니다 */
    .example-text {
      /* 문장을 읽기 편하도록 15픽셀로 맞춥니다 */
      font-size: 15px;
      /* 부드러운 회색으로 칠합니다 */
      color: #475569;
      /* 문장을 보기 좋게 가운데로 모아줍니다 */
      text-align: center;
      /* 줄 간격을 넓혀 읽기 쉽게 만듭니다 */
      line-height: 1.4;
    }

    /* 소리 듣기와 넘김 버튼들이 나란히 들어가는 상자입니다 */
    .btn-group {
      /* 버튼들을 옆으로 나란히 줄 세웁니다 */
      display: flex;
      /* 버튼들 사이에 12픽셀씩 거리를 둡니다 */
      gap: 12px;
      /* 카드 아래쪽에 20픽셀 빈틈을 둡니다 */
      margin-top: 20px;
    }

    /* 하단 버튼들이 함께 쓰는 기본 모양입니다 */
    button {
      /* 안쪽 여백을 넉넉하게 위아래 10픽셀, 좌우 18픽셀 둡니다 */
      padding: 10px 18px;
      /* 글자 크기를 15픽셀로 맞춥니다 */
      font-size: 15px;
      /* 글씨를 두껍게 만들어 눈에 띄게 합니다 */
      font-weight: bold;
      /* 딱딱한 테두리를 없앱니다 */
      border: none;
      /* 모서리를 둥글게 8픽셀로 깎습니다 */
      border-radius: 8px;
      /* 손가락 커서로 바꿉니다 */
      cursor: pointer;
    }

    /* 영어 발음을 소리로 들려주는 초록빛 버튼입니다 */
    .sound-btn {
      /* 싱그러운 초록색으로 칠합니다 */
      background-color: #10b981;
      /* 글자 색을 깨끗한 흰색으로 만듭니다 */
      color: #ffffff;
    }

    /* 이전과 다음으로 넘어가는 남회색 버튼입니다 */
    .nav-btn {
      /* 차분한 남회색으로 바탕을 칠합니다 */
      background-color: #475569;
      /* 글자 색을 흰색으로 만듭니다 */
      color: #ffffff;
    }

    /* 첫 단어이거나 마지막 단어일 때 비활성화된 버튼 모양입니다 */
    button:disabled {
      /* 연하고 힘없는 회색으로 색을 바꿉니다 */
      background-color: #cbd5e1;
      /* 누를 수 없음을 알리는 금지 커서로 바꿉니다 */
      cursor: not-allowed;
    }
  <!-- 꾸미기(CSS) 공간이 끝납니다 -->
  </style>
</head>
<!-- 여기서부터는 눈에 보이는 구조 뼈대(HTML) 공간입니다 -->
<body>

  <!-- 1단계부터 5단계를 누를 수 있는 단추들을 담는 상자입니다 -->
  <div id="stageContainer" class="stage-container"></div>

  <!-- 현재 단계에서 몇 번째 단어인지 숫자를 보여주는 곳입니다 -->
  <div id="progress" class="progress-box">1 / 10</div>

  <!-- 누르면 카드를 휙 뒤집어주는 바깥 상자입니다 -->
  <div class="card-wrap" onclick="flipCard()">
    <!-- 실제로 회전하는 카드 몸통 상자입니다 -->
    <div id="cardInner" class="card-inner">
      <!-- 카드의 앞면입니다 -->
      <div class="face front">
        <!-- 영어 단어가 쏙 들어갈 자리입니다 -->
        <div id="wordFront" class="word-text"></div>
        <!-- 뒤집기 안내 글씨입니다 -->
        <div class="hint-text">눌러서 뒤집기</div>
      </div>
      <!-- 카드의 뒷면입니다 -->
      <div class="face back">
        <!-- 우리말 뜻이 들어갈 자리입니다 -->
        <div id="meaningBack" class="meaning-text"></div>
        <!-- 영어 예문이 들어갈 자리입니다 -->
        <div id="exampleBack" class="example-text"></div>
      </div>
    </div>
  </div>

  <!-- 넘김 버튼과 소리 버튼이 모여있는 상자입니다 -->
  <div class="btn-group">
    <!-- 이전 단어로 넘어가는 버튼입니다 -->
    <button id="prevBtn" class="nav-btn" onclick="goPrev()">이전</button>
    <!-- 단어와 예문 소리를 귀로 듣는 버튼입니다 -->
    <button class="sound-btn" onclick="speakCurrent()">소리 듣기 🔊</button>
    <!-- 다음 단어로 넘어가는 버튼입니다 -->
    <button id="nextBtn" class="nav-btn" onclick="goNext()">다음</button>
  </div>

          { en: 'egg', ko: '달걀', ex: 'Eat one egg.' },
          { en: 'banana', ko: '바나나', ex: 'Yellow sweet banana.' },
          { en: 'bear', ko: '곰', ex: 'A big brown bear.' },
          { en: 'duck', ko: '오리', ex: 'The duck says quack.' },
          { en: 'pig', ko: '돼지', ex: 'The pink pig is cute.' }
        ]
      }
    ];
    // ==========================================

    // 지금 공부하고 있는 단계 번호입니다 (0은 1단계를 뜻해요)
    let currentStageIndex = 0;

    // 현재 단계에서 몇 번째 단어를 보고 있는지 세는 번호입니다 (0은 1번째를 뜻해요)
    let currentWordIndex = 0;

    // 카드가 뒤집혀 있는지 똑바로 있는지 확인하는 스위치입니다
    let isFlipped = false;

    // 단계 버튼들이 들어갈 상자를 찾아옵니다
    const stageContainerEl = document.getElementById('stageContainer');
    // 몇 번째 단어인지 숫자를 보여줄 상자를 찾아옵니다
    const progressEl = document.getElementById('progress');
    // 빙글 회전하는 카드 상자를 찾아옵니다
    const cardInnerEl = document.getElementById('cardInner');
    // 카드의 앞면 단어 글자 자리를 찾아옵니다
    const wordFrontEl = document.getElementById('wordFront');
    // 카드의 뒷면 뜻 글자 자리를 찾아옵니다
    const meaningBackEl = document.getElementById('meaningBack');
    // 카드의 뒷면 예문 글자 자리를 찾아옵니다
    const exampleBackEl = document.getElementById('exampleBack');
    // 이전 버튼을 찾아옵니다
    const prevBtnEl = document.getElementById('prevBtn');
    // 다음 버튼을 찾아옵니다
    const nextBtnEl = document.getElementById('nextBtn');

    // 화면 위에 1단계부터 5단계까지 단추들을 차례대로 만들어주는 일꾼입니다
    function initStages() {
      // 상자 안을 깨끗하게 비웁니다
      stageContainerEl.innerHTML = '';

      // 단계 목록을 하나씩 돌면서 단추를 만듭니다
      stageList.forEach((stage, index) => {
        // 새로운 단추 요소를 만듭니다
        const btn = document.createElement('button');
        // 단추에 공통 스타일 이름을 붙여줍니다
        btn.className = 'stage-btn';
        // 단추 안에 "1단계", "2단계" 같은 글씨를 넣습니다
        btn.textContent = stage.stageName;

        // 만약 지금 선택된 단계라면 파란색으로 칠해지도록 클래스를 붙여줍니다
        if (index === currentStageIndex) {
          btn.classList.add('active');
        }

        // 단추를 누르면 해당 단계로 이동하는 심부름을 맡깁니다
        btn.onclick = () => selectStage(index);

        // 완성된 단추를 화면 상자 안에 집어넣습니다
        stageContainerEl.appendChild(btn);
      });
    }

    // 다른 단계를 눌렀을 때 그 단계로 슝 바꿔주는 일꾼입니다
    function selectStage(index) {
      // 단계 번호를 새로 누른 번호로 바꿉니다
      currentStageIndex = index;
      // 새로운 단계에서는 첫 번째 단어(0번)부터 공부를 시작합니다
      currentWordIndex = 0;
      // 단계 단추들의 파란 불(활성화)을 알맞게 다시 켭니다
      initStages();
      // 바뀐 단계의 첫 카드를 화면에 그려줍니다
      updateCard();
    }

    // 현재 선택된 단계와 번호에 맞는 단어를 카드에 쏙 넣어주는 일꾼입니다
    function updateCard() {
      // 카드가 뒤집혀 있었다면 앞면으로 다시 똑바로 펴둡니다
      cardInnerEl.classList.remove('flipped');
      // 뒤집힘 스위치를 끕니다
      isFlipped = false;

      // 현재 단계의 단어 목록을 꺼내옵니다
      const currentWordList = stageList[currentStageIndex].words;
      // 그중 지금 번호에 딱 맞는 단어 1개를 꺼냅니다
      const item = currentWordList[currentWordIndex];

      // 카드 앞면에 영어 단어를 씁니다
      wordFrontEl.textContent = item.en;
      // 카드 뒷면에 우리말 뜻을 씁니다
      meaningBackEl.textContent = item.ko;
      // 카드 뒷면에 영어 예문을 씁니다
      exampleBackEl.textContent = item.ex;

      // 진도 표시에 "1 / 10" 처럼 현재 단계의 진도를 적어줍니다
      progressEl.textContent = (currentWordIndex + 1) + ' / ' + currentWordList.length;

      // 단계의 맨 첫 번째 단어일 때는 이전 버튼을 못 누르게 잠급니다
      prevBtnEl.disabled = (currentWordIndex === 0);
      // 단계의 맨 마지막 단어일 때는 다음 버튼을 못 누르게 잠급니다
      nextBtnEl.disabled = (currentWordIndex === currentWordList.length - 1);
    }

    // 카드를 손가락으로 누르면 앞뒤로 휙 뒤집어주는 일꾼입니다
    function flipCard() {
      // 뒤집힘 스위치를 반대로 껐다 켰다 바꿉니다
      isFlipped = !isFlipped;
      // 스위치가 켜졌는지 꺼졌는지에 따라 모습을 바꿉니다
      if (isFlipped) {
        // 뒤집힌 모습을 카드에 입혀줍니다
        cardInnerEl.classList.add('flipped');
      } else {
        // 뒤집힌 모습을 카드에서 벗겨냅니다
        cardInnerEl.classList.remove('flipped');
      }
    }

    // 영어 원어민 소리를 예쁘게 들려주는 소리 일꾼입니다
    function speakCurrent() {
      // 컴퓨터에 목소리 기능이 준비되어 있는지 확인합니다
      if ('speechSynthesis' in window) {
        // 먼저 나오던 소리가 남아있다면 깨끗하게 멈춥니다
        window.speechSynthesis.cancel();

        // 지금 보고 있는 단어 정보를 가져옵니다
        const item = stageList[currentStageIndex].words[currentWordIndex];
        // 앞면일 때는 단어만, 뒷면일 때는 예문까지 다정하게 읽어줍니다
        const textToSpeak = isFlipped ? (item.en + '. ' + item.ex) : item.en;

        // 읽어줄 문장을 소리 주머니에 쏙 담습니다
        const utterance = new SpeechSynthesisUtterance(textToSpeak);
        // 목소리 언어를 미국 영어로 설정합니다
        utterance.lang = 'en-US';
        // 어린이가 듣기 편하도록 살짝 천천히 0.85배 속도로 말합니다
        utterance.rate = 0.85;

        // 컴퓨터가 영어 소리를 또박또박 읽어줍니다
        window.speechSynthesis.speak(utterance);
      }
    }

    // '이전' 버튼을 눌렀을 때 앞 카드로 돌아가는 일꾼입니다
    function goPrev() {
      // 첫 카드가 아닐 때만 번호를 하나 뺍니다
      if (currentWordIndex > 0) {
        // 번호를 1개 줄입니다
        currentWordIndex--;
        // 줄어든 번호의 카드를 화면에 보여줍니다
        updateCard();
      }
    }

    // '다음' 버튼을 눌렀을 때 뒤 카드로 넘어가는 일꾼입니다
    function goNext() {
      // 현재 단계의 단어 목록을 가져옵니다
      const currentWordList = stageList[currentStageIndex].words;
      // 마지막 카드가 아닐 때만 번호를 하나 더합니다
      if (currentWordIndex < currentWordList.length - 1) {
        // 번호를 1개 늘립니다
        currentWordIndex++;
        // 늘어난 번호의 카드를 화면에 보여줍니다
        updateCard();
      }
    }

    // 화면이 열리면 단계 단추들을 먼저 쪼르르 만듭니다
    initStages();
    // 1단계의 첫 번째 카드를 화면에 바로 보여줍니다
    updateCard();
  <!-- 동작(JavaScript) 공간이 끝납니다 -->
  </script>
<!-- 뼈대(HTML) 공간이 끝납니다 -->
</body>
