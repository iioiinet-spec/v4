<!DOCTYPE html>
<!-- 웹 브라우저에게 이 문서가 HTML5 표준 문서라고 알려주는 줄입니다. -->
<html lang="ko">
<!-- 한국어로 만들어진 웹 페이지의 시작 부분입니다. -->
<head>
  <!-- 웹 페이지에 대한 기본 정보(설정)를 담는 곳입니다. -->
  <meta charset="UTF-8">
  <!-- 한글이 화면에 깨지지 않고 잘 보이도록 글자 형태를 설정합니다. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 스마트폰이나 태블릿 화면 크기에 맞춰 크기가 자동으로 바뀌게 합니다. -->
  <title>초등 필수 영어 단어장</title>
  <!-- 웹 브라우저 맨 위 탭에 나타나는 제목입니다. -->
  <style>
    /* 웹 페이지를 예쁘게 꾸며주는 CSS 스타일 시작 부분입니다. */
    * {
      /* 화면에 나오는 모든 요소들을 한 번에 선택합니다. */
      box-sizing: border-box;
      /* 상자 크기에 안쪽 여백과 테두리를 포함해 크기 계산을 편하게 합니다. */
      margin: 0;
      /* 바깥쪽 기본 빈 공간을 없앱니다. */
      padding: 0;
      /* 안쪽 기본 빈 공간을 없앱니다. */
      font-family: 'Pretendard', sans-serif;
      /* 글자 모양을 깔끔한 고딕 계열 글꼴로 정합니다. */
    }

    body {
      /* 웹 페이지 전체 배경과 전체적인 위치를 정합니다. */
      background-color: #f0fdf4;
      /* 배경색을 눈이 편안한 연한 초록빛으로 채웁니다. */
      display: flex;
      /* 화면 안의 내용들을 가운데로 모으기 위해 유연한 상자 모드를 켭니다. */
      flex-direction: column;
      /* 내용들을 위에서 아래로 세로 방향으로 쌓습니다. */
      align-items: center;
      /* 가로 방향의 가운데에 내용들을 맞춥니다. */
      justify-content: center;
      /* 세로 방향의 가운데에 내용들을 맞춥니다. */
      min-height: 100vh;
      /* 스마트폰이나 모니터 높이를 가득 채우도록 높이를 정합니다. */
      padding: 20px;
      /* 화면 가장자리에 너무 붙지 않게 안쪽 공간을 줍니다. */
    }

    .container {
      /* 단어 카드와 퀴즈 상자를 모아두는 전체 상자입니다. */
      width: 100%;
      /* 스마트폰 화면 너비에 꽉 차게 만듭니다. */
      max-width: 380px;
      /* 컴퓨터 큰 화면에서도 너무 커지지 않게 가로 최대 길이를 제한합니다. */
      text-align: center;
      /* 상자 안의 모든 글자들을 가운데로 정렬합니다. */
    }

    .progress-text {
      /* 몇 번째 단어를 보고 있는지 알려주는 숫자 글자입니다. */
      font-size: 20px;
      /* 숫자가 잘 보이도록 글자 크기를 20픽셀로 정합니다. */
      font-weight: bold;
      /* 중요한 정보이므로 숫자를 굵게 만듭니다. */
      color: #166534;
      /* 짙은 초록색을 입혀 눈에 잘 띄게 합니다. */
      margin-bottom: 15px;
      /* 아래에 있는 카드와 15픽셀 정도 거리를 벌립니다. */
    }

    .mode-toggle-wrap {
      /* 학습 모드와 테스트 모드를 바꿀 수 있는 전환 버튼 상자입니다. */
      display: flex;
      /* 두 모드 단추를 나란히 배치합니다. */
      background-color: #dcfce7;
      /* 연한 초록빛 배경으로 알약 모양 바닥을 깝니다. */
      padding: 4px;
      /* 테두리와 안쪽 단추 사이에 4픽셀 틈을 줍니다. */
      border-radius: 999px;
      /* 양 끝을 완전히 동그랗게 알약 모양으로 굴립니다. */
      margin-bottom: 16px;
      /* 카드 액자와 떨어지도록 아래 여백을 둡니다. */
    }

    .mode-btn {
      /* 모드 전환 각각의 단추 스타일입니다. */
      flex: 1;
      /* 두 단추가 똑같이 절반씩 너비를 나눠 가집니다. */
      padding: 8px 0;
      /* 위아래 8픽셀씩 눌리기 좋게 여백을 줍니다. */
      border: none;
      /* 지저분한 테두리를 없앱니다. */
      border-radius: 999px;
      /* 선택된 단추가 둥글게 보이도록 굴려줍니다. */
      background: transparent;
      /* 기본 상태에서는 투명하게 바닥 색이 보이게 합니다. */
      font-size: 14px;
      /* 단추 안 글씨를 읽기 좋은 크기로 정합니다. */
      font-weight: bold;
      /* 단추 글자를 두껍게 만들어 또렷하게 합니다. */
      color: #15803d;
      /* 차분한 짙은 초록색 글씨를 입힙니다. */
      cursor: pointer;
      /* 손가락 모양 커서로 바꿉니다. */
      transition: all 0.25s ease;
      /* 모드가 바뀔 때 색이 부드럽게 넘어가도록 만듭니다. */
    }

    .mode-btn.active {
      /* 현재 켜져 있는 모드 단추에 주는 스타일입니다. */
      background-color: #16a34a;
      /* 짙고 선명한 초록색으로 단추를 칠합니다. */
      color: #ffffff;
      /* 글자 색을 새하얗게 바꾸어 눈에 띄게 합니다. */
      box-shadow: 0 2px 6px rgba(22, 163, 74, 0.3);
      /* 단추 아래에 포근한 초록 그림자를 넣습니다. */
    }

    .card-wrap {
      /* 3차원으로 카드가 뒤집히는 효과를 보여주기 위한 바깥 액자입니다. */
      width: 100%;
      /* 가로 길이를 상자에 가득 채웁니다. */
      height: 250px;
      /* 카드의 높이를 250픽셀로 알맞게 잡습니다. */
      perspective: 1000px;
      /* 카드가 실제로 눈앞에서 뒤집히는 것처럼 깊이감을 줍니다. */
      cursor: pointer;
      /* 마우스를 올렸을 때 손가락 모양으로 바꿔 누를 수 있음을 알려줍니다. */
    }

    .card {
      /* 실제로 빙글빙글 돌아가는 진짜 카드 판입니다. */
      width: 100%;
      /* 액자의 가로 너비를 그대로 가져옵니다. */
      height: 100%;
      /* 액자의 세로 높이를 그대로 가져옵니다. */
      position: relative;
      /* 앞면과 뒷면 종이를 같은 자리에 포개기 위해 위치 기준을 잡습니다. */
      transition: transform 0.6s;
      /* 카드가 뒤집힐 때 0.6초 동안 부드럽게 돌아가게 합니다. */
      transform-style: preserve-3d;
      /* 앞면과 뒷면이 평평해지지 않고 3차원 입체 모양을 유지하게 합니다. */
    }

    .card.flipped {
      /* 자바스크립트가 카드를 눌렀을 때 덧붙여주는 돌아가기 클래스입니다. */
      transform: rotateY(180deg);
      /* 카드를 세로축 기준으로 180도 완전히 휙 뒤집습니다. */
    }

    .card-face {
      /* 카드의 앞면과 뒷면이 똑같이 가질 공통 스타일입니다. */
      position: absolute;
      /* 앞면과 뒷면을 같은 자리에 딱 겹쳐놓습니다. */
      width: 100%;
      /* 카드 판과 크기를 똑같게 맞춥니다. */
      height: 100%;
      /* 카드 판 높이와 똑같게 맞춥니다. */
      backface-visibility: hidden;
      /* 뒤쪽으로 숨겨진 면은 반대편에서 보이지 않게 가려줍니다. */
      border-radius: 20px;
      /* 네 모서리를 둥글둥글하게 깎아서 부드러운 느낌을 줍니다. */
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      /* 카드 뒤로 은은한 그림자를 넣어 바닥에서 떠 있는 느낌을 줍니다. */
      display: flex;
      /* 카드 안의 글씨들을 가운데에 가지런히 놓기 위한 설정입니다. */
      flex-direction: column;
      /* 글자들을 위아래 방향으로 차례대로 줄세웁니다. */
      align-items: center;
      /* 가로 가운데에 글씨를 맞춥니다. */
      justify-content: center;
      /* 세로 가운데에 글씨를 맞춥니다. */
      padding: 20px;
      /* 카드 테두리에 글자가 닿지 않도록 안쪽에 여백을 줍니다. */
    }

    .card-front {
      /* 카드의 앞면의 스타일입니다. */
      background-color: #ffffff;
      /* 앞면의 종이 배경을 하얀색으로 칠합니다. */
      border: 3px solid #86efac;
      /* 테두리에 산뜻한 연초록색 굵은 선을 그립니다. */
    }

    .card-back {
      /* 카드의 뒷면의 스타일입니다. */
      background-color: #fef9c3;
      /* 뒷면의 종이 배경을 따뜻한 연노란색으로 칠합니다. */
      border: 3px solid #fde047;
      /* 테두리에 귀여운 노란색 굵은 선을 그립니다. */
      transform: rotateY(180deg);
      /* 뒷면 글씨는 처음부터 180도 돌려두어야 뒤집었을 때 똑바로 보입니다. */
    }

    .word-audio-row {
      /* 단어와 스피커 버튼을 양옆으로 예쁘게 묶어주는 줄 상자입니다. */
      display: flex;
      /* 가로 나란히 배치를 켭니다. */
      align-items: center;
      /* 세로 가운데로 나란히 맞춥니다. */
      justify-content: center;
      /* 가로 가운데로 모아줍니다. */
      gap: 12px;
      /* 단어와 스피커 버튼 사이를 12픽셀 띄웁니다. */
      margin-bottom: 12px;
      /* 아래 설명 글자와 겹치지 않게 공간을 둡니다. */
    }

    .english-word {
      /* 앞면에 나오는 영어 단어 글자 스타일입니다. */
      font-size: 38px;
      /* 단어가 시원하고 크게 보이도록 글자 크기를 키웁니다. */
      font-weight: 800;
      /* 아주 두껍고 튼튼한 글씨체로 표시합니다. */
      color: #15803d;
      /* 숲처럼 진한 초록색으로 글씨 색을 줍니다. */
      min-height: 48px;
      /* 물음표로 바뀌어도 높낮이가 흔들리지 않게 기본 높이를 줍니다. */
      display: flex;
      /* 글자를 박스 가운데 정렬합니다. */
      align-items: center;
      /* 글자를 세로 가운데로 맞춥니다. */
    }

    .speaker-btn {
      /* 소리를 들려주는 동그란 스피커 버튼 스타일입니다. */
      background-color: #dcfce7;
      /* 연한 풀빛 초록색으로 버튼 안을 채웁니다. */
      border: 2px solid #86efac;
      /* 테두리에 깔끔한 초록 선을 둘러줍니다. */
      width: 44px;
      /* 버튼의 가로 길이를 44픽셀로 맞춥니다. */
      height: 44px;
      /* 버튼의 세로 높이를 44픽셀로 맞춥니다. */
      border-radius: 50%;
      /* 완벽한 동그라미 모양으로 만듭니다. */
      cursor: pointer;
      /* 마우스를 올리면 손가락 모양으로 바꿉니다. */
      font-size: 20px;
      /* 스피커 아이콘 크기를 보기 좋게 키웁니다. */
      display: flex;
      /* 스피커 이모지를 가운데 놓기 위한 설정입니다. */
      align-items: center;
      /* 이모지를 세로 가운데로 맞춥니다. */
      justify-content: center;
      /* 이모지를 가로 가운데로 맞춥니다. */
      transition: transform 0.2s;
      /* 누를 때 부드럽게 크기가 줄어들게 합니다. */
    }

    .speaker-btn:hover {
      /* 마우스를 스피커 버튼 위에 살포시 올렸을 때의 변화입니다. */
      background-color: #bbf7d0;
      /* 색깔이 조금 더 진해져 눌림을 준비합니다. */
    }

    .speaker-btn:active {
      /* 스피커 버튼을 꾹 눌렀을 때 순간적인 모양입니다. */
      transform: scale(0.9);
      /* 진짜 단추를 누르는 것처럼 살짝 쏙 들어갑니다. */
    }

    .card-hint {
      /* 누르면 뒤집힌다는 것을 알려주는 힌트 글자입니다. */
      font-size: 13px;
      /* 눈에 덜 띄도록 글자 크기를 작게 만듭니다. */
      color: #86efac;
      /* 흐릿한 연초록색으로 칠해 은은하게 보이게 합니다. */
    }

    .korean-meaning {
      /* 뒷면에 나오는 우리말 뜻 글자 스타일입니다. */
      font-size: 26px;
      /* 한눈에 뜻을 알아볼 수 있게 큰 크기로 씁니다. */
      font-weight: bold;
      /* 글자를 두껍게 만들어 눈에 쏙 들어오게 합니다. */
      color: #854d0e;
      /* 다정한 갈색으로 글씨 색을 입힙니다. */
      margin-bottom: 12px;
      /* 아래 예문 문장과 겹치지 않게 공간을 띄웁니다. */
    }

    .english-example {
      /* 뒷면에 나오는 영어 예문 문장 스타일입니다. */
      font-size: 15px;
      /* 문장을 편하게 읽을 수 있는 알맞은 크기로 정합니다. */
      color: #713f12;
      /* 차분한 진한 갈색으로 글씨를 나타냅니다. */
      line-height: 1.4;
      /* 두 줄이 되어도 읽기 편하게 위아래 줄 간격을 벌립니다. */
      word-break: keep-all;
      /* 단어 중간이 잘려 다음 줄로 넘어가지 않게 단어 단위로 줄을 바꿉니다. */
    }

    .quiz-box {
      /* 단어 스펠링을 맞춰보는 테스트 전체 상자입니다. */
      margin-top: 18px;
      /* 카드 아래에 적당히 띄워 자리 잡습니다. */
      background-color: #ffffff;
      /* 깨끗한 흰색 배경으로 만듭니다. */
      padding: 16px;
      /* 상자 안쪽에 여유 있게 공간을 줍니다. */
      border-radius: 18px;
      /* 모서리를 둥글게 깎아줍니다. */
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
      /* 부드러운 그림자를 넣어 입체감을 줍니다. */
    }

    .quiz-title {
      /* 테스트 칸의 제목 안내 글자입니다. */
      font-size: 14px;
      /* 눈에 쏙 들어오는 적당한 크기입니다. */
      font-weight: bold;
      /* 글자를 두껍게 만듭니다. */
      color: #15803d;
      /* 짙은 초록색으로 칠해줍니다. */
      margin-bottom: 10px;
      /* 입력창과의 거리를 벌립니다. */
    }

    .quiz-hint-meaning {
      /* 테스트 모드일 때 뜻을 보고 단어를 맞출 수 있게 보여주는 뜻 힌트 글자입니다. */
      font-size: 16px;
      /* 한눈에 또렷하게 보이도록 크기를 잡습니다. */
      font-weight: 800;
      /* 굵은 글씨체로 맞춥니다. */
      color: #854d0e;
      /* 따뜻한 진갈색으로 뜻을 칠합니다. */
      margin-bottom: 12px;
      /* 입력칸과 닿지 않게 아래 여백을 줍니다. */
      background-color: #fef9c3;
      /* 귀여운 연노란색 배경 상자를 깝니다. */
      padding: 8px;
      /* 글자 둘레에 안쪽 공간을 줍니다. */
      border-radius: 10px;
      /* 모서리를 둥글게 다듬습니다. */
    }

    .quiz-input-group {
      /* 입력창과 확인 버튼을 나란히 놓는 상자입니다. */
      display: flex;
      /* 가로로 나란히 배치합니다. */
      gap: 8px;
      /* 입력창과 버튼 사이를 8픽셀 띄웁니다. */
    }

    .quiz-input {
      /* 아이가 영어 단어를 직접 입력하는 칸입니다. */
      flex: 1;
      /* 가로 빈자리를 꽉 채우도록 넓힙니다. */
      padding: 10px 12px;
      /* 글자 쓸 때 답답하지 않게 안쪽 공간을 줍니다. */
      font-size: 16px;
      /* 글씨를 보기 편한 크기로 키웁니다. */
      border: 2px solid #bbf7d0;
      /* 연한 초록색 테두리를 둘러줍니다. */
      border-radius: 10px;
      /* 모서리를 부드럽게 다듬습니다. */
      outline: none;
      /* 클릭했을 때 못생긴 기본 파란 선을 없앱니다. */

      border: none;

    .quiz-result {

      /* 결과 글자 크기입니다. */

      /* 결과를 똑똑히 보도록 두껍게 만듭니다. */

      min-height: 20px;

      /* 이전과 다음 버튼을 나란히 놓는 상자입니다. */
      display: flex;

      justify-content: space-between;
      /* 양쪽 끝으로 버튼 두 개를 나누어 배치합니다. */
      gap: 16px;
      /* 버튼 사이가 달라붙지 않게 16픽셀만큼 간격을 둡니다. */
      margin-top: 18px;
      /* 퀴즈 상자와 버튼 사이에 위쪽 공간을 줍니다. */
    }

    .btn {
      /* 버튼 두 개에 모두 쓰이는 공통 디자인입니다. */
      flex: 1;
      /* 두 버튼이 똑같은 너비를 나눠 갖도록 만듭니다. */
      padding: 14px 0;
      /* 손가락으로 누르기 좋게 위아래를 도톰하게 만듭니다. */
      font-size: 17px;
      /* 버튼 안의 글씨를 보기 좋은 크기로 정합니다. */
      font-weight: bold;
      /* 버튼 속 글자를 굵게 만들어 또렷하게 합니다. */
      color: #ffffff;
      /* 버튼 안의 글자 색깔을 하얀색으로 칠합니다. */
      background-color: #22c55e;
      /* 버튼 배경을 밝고 산뜻한 초록색으로 칠합니다. */
      border: none;
      /* 지저분한 테두리 선을 없앱니다. */
      border-radius: 14px;
      /* 버튼 모서리를 둥글게 다듬어 귀엽게 만듭니다. */
      cursor: pointer;
      /* 손가락 모양 커서로 바뀌어 누르고 싶게 만듭니다. */
      box-shadow: 0 4px 10px rgba(34, 197, 94, 0.3);
      /* 버튼 아래에 부드러운 초록빛 그림자를 넣습니다. */
    }

    .btn:active {
      /* 버튼을 꾹 눌렀을 때 순간적으로 실행되는 효과입니다. */
      transform: scale(0.96);
      /* 진짜 버튼을 누른 것처럼 크기가 살짝 작아집니다. */
    }
  </style>
  <!-- 꾸미기 스타일 설정이 끝나는 부분입니다. -->
</head>
<!-- 머리말 설정 영역이 닫히는 곳입니다. -->
<body>
  <!-- 화면에 실제로 나타나는 모든 뼈대를 적는 몸통 시작 부분입니다. -->
  <div class="container">
    <!-- 단어장 전체 내용을 하나로 감싸주는 커다란 상자입니다. -->

    <div class="progress-text" id="progressText">1 / 20</div>
    <!-- 몇 번째 단어인지 숫자를 표시하며, 자바스크립트가 숫자를 바꿔줍니다. -->

    <div class="mode-toggle-wrap">
      <!-- 학습 모드와 테스트 모드를 선택하는 알약 스위치 상자입니다. -->
      <button class="mode-btn active" id="studyModeBtn">📖 단어 공부</button>
      <!-- 단어를 보면서 편하게 외우는 공부 모드 버튼입니다. -->
      <button class="mode-btn" id="testModeBtn">✏️ 시험 보기</button>
      <!-- 단어를 숨기고 스스로 철자를 맞추는 테스트 모드 버튼입니다. -->
    </div>

    <div class="card-wrap" id="cardWrap">
      <!-- 카드를 감싸는 상자로, 이곳을 터치하거나 클릭하면 카드가 뒤집힙니다. -->
      <div class="card" id="card">
        <!-- 뒤집히는 동작을 직접 보여주는 카드 알맹이 상자입니다. -->

        <div class="card-face card-front">
          <!-- 카드 앞쪽 흰색 면을 담당하는 상자입니다. -->
          <div class="word-audio-row">
            <!-- 영어 단어와 스피커 단추를 나란히 묶어주는 상자입니다. -->
            <div class="english-word" id="frontWord">apple</div>
            <!-- 화면 앞면에 큰 영어 단어 또는 숨김 기호를 띄우는 글자 자리입니다. -->
            <button class="speaker-btn" id="speakerBtn" title="단어 발음 듣기">🔊</button>
            <!-- 누르면 영어 단어를 읽어주는 스피커 단추입니다. -->
          </div>
          <div class="card-hint" id="cardHint">카드를 탭하면 뒤집혀요!</div>
          <!-- 카드를 눌러보도록 도와주거나 시험 중임을 안내하는 글입니다. -->
        </div>

        <div class="card-face card-back">
          <!-- 뒤집혔을 때 보여줄 노란색 뒷면을 담당하는 상자입니다. -->
          <div class="korean-meaning" id="backMeaning">사과</div>
          <!-- 단어의 한글 뜻을 커다랗게 보여주는 글자 자리입니다. -->
          <div class="english-example" id="backExample">I eat an apple.</div>
          <!-- 쉬운 영어 예문 한 문장을 보여주는 자리입니다. -->
        </div>

      </div>
    </div>

    <div class="quiz-box">
      <!-- 단어를 직접 써보는 퀴즈 상자입니다. -->
      <div class="quiz-title">✏️ 단어 테스트 : 철자를 적어보세요!</div>
      <!-- 테스트를 시작하라는 친절한 제목입니다. -->
      <div class="quiz-hint-meaning" id="quizHintMeaning">뜻: 사과</div>
      <!-- 테스트 모드일 때 뜻을 보고 단어를 유추할 수 있도록 띄워주는 뜻 자리입니다. -->
      <div class="quiz-input-group">
        <!-- 입력칸과 확인 버튼을 묶어주는 줄입니다. -->
        <input type="text" class="quiz-input" id="quizInput" placeholder="영어 단어 입력" autocomplete="off">
        <!-- 아이가 직접 타이핑하는 입력창입니다. -->
        <button class="quiz-btn" id="checkBtn">확인</button>
        <!-- 정답을 맞춰보는 버튼입니다. -->
      </div>
      <div class="quiz-result" id="quizResult"></div>
      <!-- 정답인지 틀렸는지 칭찬과 안내 메시지를 보여주는 자리입니다. -->
    </div>

    <div class="button-group">
      <!-- 이전과 다음 버튼을 묶어주는 줄입니다. -->
      <button class="btn" id="prevBtn">◀ 이전</button>
      <!-- 지난 단어로 되돌아가는 초록색 버튼입니다. -->
      <button class="btn" id="nextBtn">다음 ▶</button>
      <!-- 새로운 단어로 앞으로 넘어가는 초록색 버튼입니다. -->
    </div>

  </div>
  <!-- 전체 감싸는 상자가 끝나는 곳입니다. -->

  <script>
    /* 웹 페이지가 똑똑하게 움직이도록 만들어주는 자바스크립트 시작 부분입니다. */

    /* ======================================================== */
    /* [여기만 고치세요] 공부하고 싶은 단어를 아래 목록에 자유롭게 적어주세요! */
    /* ======================================================== */
    const wordList = [
      // 초등학교 3학년 교육과정에 맞춘 필수 영어 단어 20개 모음입니다.
      { en: 'apple', ko: '사과', ex: 'I eat an apple.' },
      // 1번 단어: 과일 사과
      { en: 'book', ko: '책', ex: 'I read a fun book.' },
      // 2번 단어: 읽는 책
      { en: 'cat', ko: '고양이', ex: 'The cat is cute.' },
      // 3번 단어: 귀여운 고양이
      { en: 'dog', ko: '강아지', ex: 'I walk with my dog.' },
      // 4번 단어: 씩씩한 강아지
      { en: 'school', ko: '학교', ex: 'I go to school.' },
      // 5번 단어: 매일 가는 학교
      { en: 'pencil', ko: '연필', ex: 'I have a pencil.' },
      // 6번 단어: 필통 속 연필
      { en: 'desk', ko: '책상', ex: 'Sit at your desk.' },
      // 7번 단어: 공부하는 책상
      { en: 'chair', ko: '의자', ex: 'This is my chair.' },
      // 8번 단어: 편안한 의자
      { en: 'friend', ko: '친구', ex: 'You are my friend.' },
      // 9번 단어: 친한 친구
      { en: 'happy', ko: '행복한 / 기쁜', ex: 'I am so happy.' },
      // 10번 단어: 기분이 좋은 상태
      { en: 'water', ko: '물', ex: 'Drink some water.' },
      // 11번 단어: 시원한 물
      { en: 'milk', ko: '우유', ex: 'I drink milk.' },
      // 12번 단어: 고소한 우유
      { en: 'sun', ko: '해 / 태양', ex: 'The sun is big.' },
      // 13번 단어: 하늘의 맑은 해
      { en: 'bird', ko: '새', ex: 'The bird can fly.' },
      // 14번 단어: 날아다니는 새
      { en: 'color', ko: '색깔', ex: 'What color is it?' },
      // 15번 단어: 알록달록한 색깔
      { en: 'red', ko: '빨간색', ex: 'I like red.' },
      // 16번 단어: 밝은 빨간색
      { en: 'blue', ko: '파란색', ex: 'The sky is blue.' },
      // 17번 단어: 시원한 파란색
      { en: 'jump', ko: '뛰다', ex: 'I can jump high.' },
      // 18번 단어: 높이 뛰어오르는 동작
      { en: 'sing', ko: '노래하다', ex: 'Let us sing together.' },
      // 19번 단어: 즐겁게 부르는 노래
      { en: 'good', ko: '좋은', ex: 'Have a good day.' }
      // 20번 단어: 기분 좋고 착한 느낌
    ];
    // 단어 목록 상자가 여기서 끝납니다.

    let currentIndex = 0;
    // 지금 화면에 몇 번째 단어가 나와 있는지 기억해두는 번호표 변수입니다. (0번이 첫 번째)

    let isTestMode = false;
    // 지금이 '공부 모드'인지 아니면 단어를 가린 '시험 모드'인지 기억하는 스위치 변수입니다.

    const card = document.getElementById('card');
    // 뒤집히는 카드 HTML 상자를 자바스크립트로 데려옵니다.
    const cardWrap = document.getElementById('cardWrap');
    // 사용자가 누를 수 있는 카드 바깥 액자 HTML 상자를 데려옵니다.
    const frontWord = document.getElementById('frontWord');
    // 앞면에 영어 단어를 적어 넣을 글자 자리를 데려옵니다.
    const backMeaning = document.getElementById('backMeaning');
    // 뒷면에 우리말 뜻을 적어 넣을 글자 자리를 데려옵니다.
    const backExample = document.getElementById('backExample');
    // 뒷면에 영어 예문을 적어 넣을 글자 자리를 데려옵니다.
    const cardHint = document.getElementById('cardHint');
    // 카드 앞면 아래쪽 도움말 글자 자리를 데려옵니다.
    const progressText = document.getElementById('progressText');
    // 위쪽에 '1 / 20'처럼 숫자를 보여주는 자리를 데려옵니다.
    const prevBtn = document.getElementById('prevBtn');
    // 이전으로 가는 버튼을 데려옵니다.
    const nextBtn = document.getElementById('nextBtn');
    // 다음으로 넘어가는 버튼을 데려옵니다.
    const speakerBtn = document.getElementById('speakerBtn');
    // 스피커 모양 소리 재생 버튼을 데려옵니다.
    const quizInput = document.getElementById('quizInput');
    // 퀴즈 답을 적는 입력창을 데려옵니다.
    const checkBtn = document.getElementById('checkBtn');
    // 퀴즈 정답 확인 버튼을 데려옵니다.
    const quizResult = document.getElementById('quizResult');
    // 퀴즈 결과를 보여줄 텍스트 상자를 데려옵니다.
    const quizHintMeaning = document.getElementById('quizHintMeaning');
    // 퀴즈 상자 안에서 우리말 뜻을 보여주는 힌트 글자 자리를 데려옵니다.
    const studyModeBtn = document.getElementById('studyModeBtn');
    // 상단 단어 공부 모드 선택 버튼을 데려옵니다.
    const testModeBtn = document.getElementById('testModeBtn');
    // 상단 시험 보기 모드 선택 버튼을 데려옵니다.

    function playWordAudio(text) {
      // 컴퓨터나 휴대폰의 목소리 기능(TTS)으로 영어를 읽어주는 함수입니다.
      if (!('speechSynthesis' in window)) {
        // 브라우저에 음성 읽기 기능이 지원되지 않는지 확인합니다.
        alert('이 브라우저는 소리 재생 기능을 지원하지 않습니다.');
        // 지원되지 않으면 안내 창을 띄웁니다.
        return;
        // 함수 실행을 즉시 멈춥니다.
      }
      window.speechSynthesis.cancel();
      // 이전에 말하고 있던 소리가 남아 있다면 깔끔하게 취소합니다.
      const utterance = new SpeechSynthesisUtterance(text);
      // 읽어줄 영어 글자를 목소리 편지봉투에 담아 준비합니다.
      utterance.lang = 'en-US';
      // 미국식 정확한 영어 발음으로 소리가 나도록 언어를 맞춥니다.
      utterance.rate = 0.85;
      // 초등학생 친구들이 잘 알아들을 수 있게 목소리 속도를 살짝 또박또박 느리게 조절합니다.
      window.speechSynthesis.speak(utterance);
      // 목소리 기계가 영어 단어를 신나고 또렷하게 읽어줍니다.
    }

    function checkAnswer() {
      // 입력창에 적은 스펠링이 정답인지 검사하는 채점 함수입니다.
      const userAnswer = quizInput.value.trim().toLowerCase();
      // 아이가 쓴 글자에서 빈 여백을 없애고 소문자로 깨끗하게 다듬습니다.
      const correctAnswer = wordList[currentIndex].en.toLowerCase();
      // 현재 단어의 진짜 정답 단어도 소문자로 똑같이 맞춥니다.

      if (userAnswer === '') {
        // 아무것도 쓰지 않고 버튼을 눌렀을 때의 확인입니다.
        quizResult.textContent = '단어를 먼저 입력해주세요! ✍️';
        // 먼저 단어를 쓰라고 친절히 안내합니다.
        quizResult.style.color = '#ca8a04';
        // 주의를 환기하는 노란빛 주황색 글씨로 보여줍니다.
        return;
        // 검사를 멈춥니다.
      }

      if (userAnswer === correctAnswer) {
        // 정답과 아이가 쓴 글자가 정확히 똑같을 때입니다.
        quizResult.textContent = '🎉 딩동댕! 정답이에요! 참 잘했어요!';
        // 기분 좋은 칭찬 메시지를 띄웁니다.
        quizResult.style.color = '#16a34a';
        // 밝은 초록색 글씨로 축하해줍니다.
        if (isTestMode) {
          // 시험 모드일 때 정답을 맞히면 숨겨뒀던 영어 단어를 멋지게 공개해줍니다.
          frontWord.textContent = wordList[currentIndex].en;
        }
      } else {
        // 철자가 틀렸을 때입니다.
        quizResult.textContent = '❌ 아쉬워요! 다시 한번 확인해볼까요?';
        // 다시 도전해보라고 따뜻하게 응원합니다.
        quizResult.style.color = '#dc2626';
        // 눈에 띄는 빨간색 글씨로 알려줍니다.
      }
    }

    function showCard() {
      // 번호표 숫자에 맞는 단어를 화면에 예쁘게 그려주는 함수입니다.
      card.classList.remove('flipped');
      // 새로운 단어로 바뀔 때는 카드가 앞면을 보도록 뒤집힌 것을 원래대로 돌려놓습니다.

      const currentItem = wordList[currentIndex];
      // 지금 순서 번호표에 해당하는 단어 묶음을 상자에서 쏙 꺼내옵니다.

      if (isTestMode) {
        // 시험 모드일 때는 단어를 보지 못하게 가려줍니다.
        frontWord.textContent = '❓ ❓ ❓';
        // 카드 앞면의 영어 단어 대신 물음표를 띄워 가려놓습니다.
        cardHint.textContent = '정답을 맞히면 단어가 보여요!';
        // 시험 중임을 알려주는 안내 글로 바꿉니다.
      } else {
        // 공부 모드일 때는 원래대로 영어 단어를 환하게 보여줍니다.
        frontWord.textContent = currentItem.en;
        // 꺼내온 영어 단어를 앞면 글자 자리에 쏙 넣어줍니다.
        cardHint.textContent = '카드를 탭하면 뒤집혀요!';
        // 뒤집을 수 있다는 도움말을 보여줍니다.
      }

      quizHintMeaning.textContent = '뜻: ' + currentItem.ko;
      // 단어가 가려져도 무슨 단어인지 알 수 있게 퀴즈 칸에 우리말 뜻을 띄워줍니다.

      backMeaning.textContent = currentItem.ko;
      // 꺼내온 한글 뜻을 뒷면 첫 번째 줄에 쏙 넣어줍니다.
      backExample.textContent = currentItem.ex;
      // 꺼내온 영어 예문 문장을 뒷면 두 번째 줄에 쏙 넣어줍니다.

      progressText.textContent = (currentIndex + 1) + ' / ' + wordList.length;
      // 번호표는 0부터 시작하므로 1을 더해서 '1 / 20' 형태로 글자를 만들어 보여줍니다.

      quizInput.value = '';
      // 새 단어로 넘어가면 퀴즈 입력창을 깨끗하게 비워줍니다.
      quizResult.textContent = '';
      // 이전 단어의 정답/오답 결과 글씨도 싹 지워줍니다.
    }

    studyModeBtn.addEventListener('click', function () {
      // '단어 공부' 버튼을 눌렀을 때 실행됩니다.
      isTestMode = false;
      // 테스트 모드 스위치를 끕니다.
      studyModeBtn.classList.add('active');
      // 공부 버튼을 활성화된 초록색으로 켭니다.
      testModeBtn.classList.remove('active');
      // 시험 버튼의 초록색 활성화를 끕니다.
      showCard();
      // 바뀐 모드에 맞춰 카드를 다시 보여줍니다.
    });

    testModeBtn.addEventListener('click', function () {
      // '시험 보기' 버튼을 눌렀을 때 실행됩니다.
      isTestMode = true;
      // 테스트 모드 스위치를 켭니다.
      testModeBtn.classList.add('active');
      // 시험 버튼을 활성화된 초록색으로 켭니다.
      studyModeBtn.classList.remove('active');
      // 공부 버튼의 초록색 활성화를 끕니다.
      showCard();
      // 단어를 가린 채로 카드를 다시 보여줍니다.
      quizInput.focus();
      // 아이가 바로 답을 칠 수 있게 입력창에 커서를 놓아줍니다.
    });

    cardWrap.addEventListener('click', function (event) {
      // 사용자가 카드 액자를 콕 누르면 실행되는 상호작용 규칙입니다.
      if (event.target === speakerBtn || speakerBtn.contains(event.target)) {
        // 만약 카드가 아니라 스피커 단추를 콕 누른 거라면 카드가 뒤집히지 않게 제외합니다.
        return;
        // 뒤집히지 않고 함수를 바로 빠져나갑니다.
      }
      if (isTestMode && quizResult.textContent.indexOf('정답') === -1) {
        // 시험 모드인데 아직 정답을 맞히지 않았다면 미리 뒤집어보지 못하게 막습니다.
        alert('단어 시험 중이에요! 정답을 맞히고 확인해보세요 😊');
        // 친절한 안내 문구를 띄웁니다.
        return;
        // 뒤집기를 멈춥니다.
      }
      card.classList.toggle('flipped');
      // 조건이 맞을 때 카드를 앞뒤로 시원하게 뒤집어줍니다.
    });

    speakerBtn.addEventListener('click', function (event) {
      // 스피커 단추를 눌렀을 때 실행되는 동작입니다.
      event.stopPropagation();
      // 카드가 뒤집히는 클릭 신호가 번지지 않게 싹 막아줍니다.
      playWordAudio(wordList[currentIndex].en);
      // 지금 보고 있는 영어 단어를 스피커로 또박또박 들려줍니다.
    });

    checkBtn.addEventListener('click', function () {
      // '확인' 버튼을 클릭했을 때 정답을 확인합니다.
      checkAnswer();
      // 채점 함수를 실행합니다.
    });

    quizInput.addEventListener('keydown', function (event) {
      // 입력창에서 키보드를 눌렀을 때 실행되는 감지 규칙입니다.
      if (event.key === 'Enter') {
        // 엔터키를 톡 쳤을 때 마우스로 확인을 누른 것과 똑같이 채점합니다.
        checkAnswer();
        // 채점 함수를 실행합니다.
      }
    });

    prevBtn.addEventListener('click', function () {
      // '이전' 버튼을 눌렀을 때 실행되는 상호작용 규칙입니다.
      if (currentIndex > 0) {
        // 첫 번째 단어가 아닐 때만 앞 번호로 갈 수 있도록 확인합니다.
        currentIndex = currentIndex - 1;
        // 번호표를 1만큼 줄여서 지난 단어로 돌아갑니다.
        showCard();
        // 바뀐 번호표에 맞는 단어를 화면에 다시 그려줍니다.
      }
    });

    nextBtn.addEventListener('click', function () {
      // '다음' 버튼을 눌렀을 때 실행되는 상호작용 규칙입니다.
      if (currentIndex < wordList.length - 1) {
        // 맨 마지막 단어가 아닐 때만 다음 번호로 갈 수 있도록 확인합니다.
        currentIndex = currentIndex + 1;
        // 번호표를 1만큼 늘려서 다음 단어로 넘어갑니다.
        showCard();
        // 바뀐 번호표에 맞는 새 단어를 화면에 다시 그려줍니다.
      }
    });

    showCard();
    // 웹 페이지가 처음 열리자마자 1번 단어가 보이도록 함수를 실행합니다.
  </script>
  <!-- 자바스크립트 명령어가 끝나는 부분입니다. -->
</body>
<!-- 몸통 영역이 끝나는 곳입니다. -->
