<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>호텔 타이쿤</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: HUD strip on top; left = lit cross-section tower on a live day/night sky, right = tabbed management panel; stacks on phones. One committed night-lobby look: navy ink, brass accent. */
:root{
  --bg:#0d111e; --panel:#151b2e; --panel2:#1c2440; --line:#2b3558;
  --fg:#e8ebf4; --muted:#8e99bb;
  --brass:#d9aa4b; --brass-ink:#2b1d07;
  --good:#58c9a0; --bad:#ee6b60; --warn:#f0b24a;
  --std:#8fb0e6; --dlx:#b6a6f0; --ste:#efc46a; --fac:#6fd9d2;
  --font-display:"Black Han Sans","Noto Sans KR",system-ui,sans-serif;
  --font-body:"Noto Sans KR",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.5;
  padding-block:14px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

/* HUD */
.hud{display:grid;grid-template-columns:auto 1fr auto;gap:12px 20px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand h1{margin:0;font:400 22px/1.1 var(--font-display);letter-spacing:.02em;color:var(--brass)}
.hname{background:transparent;border:0;border-bottom:1px dashed var(--line);color:var(--muted);font:inherit;font-size:12px;padding:1px 0;width:12em;max-width:100%}
.stats{margin:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 16px}
.stats div{min-width:0}
.stats dt{font-size:11px;color:var(--muted);letter-spacing:.06em}
.stats dd{margin:0;font-weight:700;font-size:16px;white-space:nowrap}
.stats small{font-weight:400;color:var(--muted);font-size:11px}
.pos{color:var(--good)} .neg{color:var(--bad)}
.stars{background:linear-gradient(90deg,var(--brass) var(--pct,0%),#3a4572 var(--pct,0%));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:1px}
.ctrl{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.ctrl button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:12px;font-weight:500}
.ctrl button[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:var(--brass-ink);font-weight:700}
.ctrl .ghost{background:transparent;color:var(--muted)}
.clock{grid-column:1/-1;display:flex;gap:10px;align-items:baseline;font-size:13px;color:var(--muted);margin-top:-4px}
.clock b{color:var(--fg);font-size:14px}

/* Layout */
.layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
.stage{min-width:0;display:flex;flex-direction:column;gap:10px}
.banner{background:#3a2f12;border:1px solid var(--brass-d,#8a6b25);color:#f3dca0;border-radius:8px;padding:7px 12px;font-size:13px}

/* Scene */
.scene{position:relative;border-radius:10px;overflow:hidden;background:linear-gradient(var(--sky1,#4a90d9),var(--sky2,#bfe0f5));border:1px solid var(--line)}
.scene::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:var(--night,0);
  background-image:radial-gradient(1.4px 1.4px at 18px 26px,#fff,transparent),radial-gradient(1px 1px at 70px 70px,#cfd8ff,transparent),radial-gradient(1.3px 1.3px at 120px 18px,#fff,transparent),radial-gradient(1px 1px at 150px 96px,#fff,transparent),radial-gradient(1.2px 1.2px at 44px 108px,#dfe6ff,transparent);
  background-size:170px 130px}
.orb{position:absolute;width:30px;height:30px;border-radius:50%;pointer-events:none;box-shadow:0 0 24px 6px var(--orbglow,rgba(255,215,122,.5));background:var(--orbc,#ffd77a)}
.scroll{position:relative;z-index:1;max-height:min(76vh,760px);overflow-y:auto;overscroll-behavior:contain;padding-top:18px}
.tower{max-width:540px;margin:0 auto;background:linear-gradient(#242d50,#1a2140);border:2px solid #3a4572;border-bottom:0;border-radius:10px 10px 0 0;padding:12px 12px 0;position:relative}
.sign{display:flex;justify-content:center;margin:-34px 0 10px}
.sign span{background:#10152a;border:2px solid var(--brass);border-radius:6px;padding:3px 16px;font:400 18px/1.4 var(--font-display);letter-spacing:.08em;color:var(--brass);text-shadow:0 0 10px rgba(217,170,75,.7);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.expand{width:100%;background:transparent;border:1px dashed #4b5a92;color:var(--muted);border-radius:6px;padding:8px;font-size:13px;margin-bottom:6px}
.expand:not(:disabled):hover{color:var(--fg);border-color:var(--brass)}
.expand:disabled{opacity:.5;cursor:not-allowed}
.floor{display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;padding:6px 0;border-top:1px solid #2f3a64;align-items:stretch}
.fl{font:400 13px/1 var(--font-display);color:var(--muted);align-self:center;text-align:center;letter-spacing:.04em}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.slot{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:4px;min-height:68px;padding:6px 6px 7px;text-align:left;background:#18203d;border:1px solid #34406a;border-radius:5px;min-width:0}
.slot .n{font-weight:700;font-size:12px;color:var(--tc,var(--fg));overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .m{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .bar{height:4px;background:rgba(0,0,0,.28);border-radius:2px;overflow:hidden}
.slot .bar b{display:block;height:100%;background:var(--brass-ink)}
.slot.t-standard{--tc:var(--std)} .slot.t-deluxe{--tc:var(--dlx)} .slot.t-suite{--tc:var(--ste)}
.slot.fac{--tc:var(--fac);background:linear-gradient(#14403f,#102e33);border-color:#2c7b78}
.slot.empty{background:transparent;border-style:dashed;border-color:#40508a;color:#6d7bab;align-items:center;justify-content:center;font-size:20px}
.slot.empty:hover{border-color:var(--brass);color:var(--brass)}
.slot.occ{background:linear-gradient(#f6d687,#d49c47);border-color:#f6d687}
.slot.occ .n,.slot.occ .m{color:var(--brass-ink)}
.slot.dirty{background:repeating-linear-gradient(135deg,#2a2f4a 0 6px,#232845 6px 12px)}
.slot.dirty .m{color:var(--warn)}
.slot.sel{outline:2px solid var(--brass);outline-offset:2px}
.lobby{display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;padding:10px 0 12px;border-top:2px solid #3a4572;align-items:center}
.desk{display:flex;flex-direction:column;gap:6px;min-width:0}
.desk .t{font-size:12px;color:var(--muted)}
.queue{display:flex;flex-wrap:wrap;gap:5px;min-height:20px;align-items:flex-end}
.pax{display:inline-block;width:12px;height:20px;border-radius:6px 6px 2px 2px;background:var(--std);position:relative}
.pax::before{content:"";position:absolute;left:2px;top:-6px;width:8px;height:8px;border-radius:50%;background:inherit}
.pax.t1{background:var(--dlx)} .pax.t2{background:var(--ste)}
.pax.late{box-shadow:0 0 0 2px var(--bad)}
.ground{height:14px;background:#0a0e1b;position:relative;z-index:1}

/* Panel */
.side{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}
.tabs button{background:transparent;border:0;padding:10px 4px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;font-weight:500}
.tabs button[aria-selected="true"]{color:var(--brass);border-bottom-color:var(--brass);font-weight:700}
.panel{padding:14px 16px 16px;max-height:min(76vh,760px);overflow-y:auto}
.panel h3{margin:0 0 10px;font:400 18px/1.3 var(--font-display);letter-spacing:.02em;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.panel h3 small{font:500 12px var(--font-body);color:var(--muted)}
.muted{color:var(--muted);font-size:12.5px;margin:6px 0 0}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;background:var(--panel2);border-radius:8px}
.opt b{display:block;font-size:14px}
.opt span{display:block;font-size:12px;color:var(--muted)}
.opt em{display:block;font-style:normal;font-size:12px;color:#b9c3e6;margin-top:2px}
.btn{background:var(--brass);color:var(--brass-ink);border:0;border-radius:6px;padding:7px 12px;font-weight:700;font-size:13px;white-space:nowrap}
.btn:disabled{background:#2c3556;color:#6d7bab;cursor:not-allowed}
.btn.alt{background:transparent;border:1px solid var(--line);color:var(--fg);font-weight:500}
.btn.alt:disabled{color:#6d7bab}
.btn.danger{background:var(--bad);color:#2a0b08}
.kv{list-style:none;margin:0 0 12px;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kv li{background:var(--panel2);border-radius:8px;padding:8px 10px;min-width:0}
.kv span{display:block;font-size:11px;color:var(--muted)}
.kv b{font-size:15px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.card{background:var(--panel2);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px}
.card .line{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.card .line span:first-child{color:var(--muted)}
.staff{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;background:var(--panel2);border-radius:8px;margin-bottom:8px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:transparent;font-weight:700}
.stepper button:disabled{opacity:.35;cursor:not-allowed}
.stepper output{min-width:1.5em;text-align:center;font-weight:700}
.goal{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px;background:var(--panel2);border-radius:8px;margin-bottom:8px}
.goal i{width:18px;height:18px;border-radius:50%;border:2px solid #4b5a92;display:block}
.goal.done i{background:var(--good);border-color:var(--good)}
.goal.done b{color:var(--muted);text-decoration:line-through}
.goal span{font-size:12px;color:var(--muted)}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.log li{font-size:13px;padding:7px 10px;background:var(--panel2);border-radius:6px;display:grid;grid-template-columns:48px minmax(0,1fr);gap:8px}
.log li time{color:var(--muted);font-size:11.5px;padding-top:1px}
.log li.good{color:#b9ecd8} .log li.bad{color:#f6b6af} .log li.warn{color:#f5d596}
.spark{width:100%;height:auto;display:block}
.spark .zero{stroke:var(--line);stroke-dasharray:3 3;fill:none}
.spark .area{fill:var(--brass);opacity:.16}
.spark .ln{fill:none;stroke:var(--brass);stroke-width:2}
.spark .dot{fill:var(--brass)}
.sect{margin:14px 0 6px;font-size:12px;color:var(--muted);letter-spacing:.06em}

.toast{position:fixed;left:50%;transform:translate(-50%,20px);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:#10152a;border:1px solid var(--brass);color:var(--fg);padding:9px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;max-width:calc(100% - 32px);font-size:13px}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{border-color:var(--bad)} .toast.good{border-color:var(--good)}
.over{position:fixed;inset:0;z-index:30;background:rgba(6,9,18,.86);display:flex;align-items:center;justify-content:center;padding:24px}
.over[hidden]{display:none}
.over div{background:var(--panel);border:1px solid var(--brass);border-radius:12px;padding:24px;max-width:380px;text-align:center}
.over h2{margin:0 0 8px;font:400 24px var(--font-display);color:var(--brass)}
.over p{margin:0 0 16px;color:var(--muted)}

@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  .hud{grid-template-columns:1fr}
  .ctrl{justify-content:flex-start}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .panel{max-height:none}
}
@media (max-width:440px){
  .slot{padding:5px 4px 6px;min-height:62px}
  .slot .n{font-size:11px}
  .slot .m{font-size:9.5px}
  .floor,.lobby{grid-template-columns:26px minmax(0,1fr);gap:5px}
  .tower{padding-left:8px;padding-right:8px}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

<div class="wrap">
  <header class="hud">
    <div class="brand">
      <h1>호텔 타이쿤</h1>
      <input id="hname" class="hname" maxlength="14" aria-label="호텔 이름" spellcheck="false">
    </div>
    <dl class="stats">
      <div><dt>자금</dt><dd id="sMoney">-</dd></div>
      <div><dt>평점</dt><dd><span class="stars" id="sStars">★★★★★</span> <span id="sRep"></span></dd></div>
      <div><dt>투숙률</dt><dd id="sOcc">-</dd></div>
      <div><dt>오늘 수입</dt><dd id="sDay">-</dd></div>
    </dl>
    <div class="ctrl" role="group" aria-label="게임 속도">
      <button data-act="speed" data-v="0" aria-pressed="false">정지</button>
      <button data-act="speed" data-v="1" aria-pressed="false">1×</button>
      <button data-act="speed" data-v="2" aria-pressed="true">2×</button>
      <button data-act="speed" data-v="4" aria-pressed="false">4×</button>
      <button class="ghost" data-act="newgame" id="bNew">새 게임</button>
    </div>
    <div class="clock"><b id="clkDay">-</b><span id="clkTime"></span></div>
  </header>

  <main class="layout">
    <section class="stage">
      <div id="banner" class="banner" hidden></div>
      <div class="scene" id="scene">
        <i class="orb" id="orb"></i>
        <div class="scroll" id="scroll"><div class="tower" id="tower"></div><div class="ground"></div></div>
      </div>
    </section>
    <aside class="side">
      <div class="tabs" role="tablist" aria-label="관리 메뉴">
        <button role="tab" data-act="tab" data-tab="build" aria-selected="true">건설</button>
        <button role="tab" data-act="tab" data-tab="staff" aria-selected="false">직원</button>
        <button role="tab" data-act="tab" data-tab="goals" aria-selected="false">목표</button>
        <button role="tab" data-act="tab" data-tab="log" aria-selected="false">기록</button>
      </div>
      <div class="panel" id="panel"></div>
    </aside>
  </main>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="over" class="over" hidden>
  <div>
    <h2>파산했습니다</h2>
    <p>자금이 바닥나 호텔 문을 닫게 되었습니다. 객실을 늘리기 전에 고정비를 먼저 따져 보세요.</p>
    <button class="btn" data-act="restart">새로 시작하기</button>
  </div>
</div>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var SAVE_KEY='hotel-tycoon-save-v1';
var DAY_TICKS=12, MAXF=8, SLOTS=4;
var HF=[0.6,0.8,1.0,1.2,1.6,1.8,1.6,1.2,0.8,0.3,0.1,0.2];
var DOW=['월','화','수','목','금','토','일'];

var ROOMS={
  standard:{name:'스탠다드',cost:800,price:80,tier:0,upkeep:6,desc:'아늑한 기본 객실'},
  deluxe:{name:'디럭스',cost:2000,price:190,tier:1,upkeep:12,desc:'넓은 침실과 시티뷰'},
  suite:{name:'스위트',cost:5000,price:420,tier:2,upkeep:26,desc:'거실이 딸린 최고급 객실'}
};
var FACS={
  restaurant:{name:'레스토랑',cost:4000,per:16,upkeep:30,sat:0.35,minFloors:1,desc:'투숙객의 식음료 매출'},
  spa:{name:'스파',cost:9000,per:28,upkeep:55,sat:0.5,minFloors:2,desc:'2층 이상에서 건설 가능'},
  bar:{name:'루프탑 바',cost:16000,per:40,upkeep:85,sat:0.6,minFloors:4,desc:'4층 이상에서 건설 가능'}
};
var STAFF={
  clean:{name:'객실 청소',wage:20,max:10,desc:'한 명이 2시간마다 객실 1개를 청소합니다'},
  desk:{name:'프런트',wage:28,max:5,desc:'한 명이 체크인 처리를 2건씩 더 맡습니다'},
  mkt:{name:'마케팅',wage:45,max:3,desc:'한 명당 손님 유입이 20% 늘어납니다'}
};
var EVENTS={
  festival:{name:'지역 축제',days:3,mult:1.7,msg:'인근에서 축제가 열려 손님이 몰립니다.'},
  rain:{name:'장마철',days:2,mult:0.7,msg:'장마가 시작되어 손님이 줄었습니다.'}
};
var GOALS=[
  {id:'dlx',name:'첫 디럭스룸 건설',reward:300,test:function(){return all().some(function(s){return s.type==='deluxe'})}},
  {id:'star3',name:'평점 3.0 달성',reward:500,test:function(){return S.rep>=3},prog:function(){return S.rep.toFixed(1)+' / 3.0'}},
  {id:'f5',name:'5층까지 증축',reward:800,test:function(){return S.floors.length>=5},prog:function(){return S.floors.length+' / 5층'}},
  {id:'spa',name:'스파 오픈',reward:600,test:function(){return all().some(function(s){return s.type==='spa'})}},
  {id:'g100',name:'누적 투숙객 100명',reward:700,test:function(){return S.st.guests>=100},prog:function(){return S.st.guests+' / 100명'}},
  {id:'cash',name:'보유 자금 5,000만원',reward:1000,test:function(){return S.money>=50000}},
  {id:'bar',name:'루프탑 바 오픈',reward:1500,test:function(){return all().some(function(s){return s.type==='bar'})}},
  {id:'star5',name:'5성 호텔 (평점 4.5 이상)',reward:3000,test:function(){return S.rep>=4.5},prog:function(){return S.rep.toFixed(1)+' / 4.5'}}
];

function newState(){
  var mk=function(t){return {type:t,lvl:1,guest:null,dirty:false}};
  return {v:1,name:'해오름 호텔',day:1,tick:0,money:3000,rep:2.0,speed:2,
    floors:[[mk('standard'),mk('standard'),null,null]],
    staff:{clean:1,desk:0,mkt:0},queue:[],
    st:{guests:0,lost:0,income:0,dayIn:0,hist:[]},
    event:null,log:[{d:1,m:'호텔이 문을 열었습니다. 스탠다드룸 2개와 청소 직원 1명으로 시작합니다.',k:''}],
    goals:{},lostLogDay:0,over:false};
}
function load(){
  try{var r=localStorage.getItem(SAVE_KEY);if(!r)return null;var o=JSON.parse(r);
    if(!o||o.v!==1||!Array.isArray(o.floors)||!o.staff||!o.st)return null;return o}catch(e){return null}
}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}}

var S=load()||newState();
var ui={sel:null,tab:'build',confirm:null,pressing:false,pending:false,cache:{}};
var timer=null,toastT=null,confT=null;

/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fl(n){return n===4?'F':n+'F'}
function fmt(n){
  var w=Math.round(n)*1000,a=Math.abs(w),s;
  if(a>=1e8)s=(a/1e8).toFixed(2).replace(/\.?0+$/,'')+'억';
  else if(a>=1e4)s=Math.round(a/1e4).toLocaleString('ko-KR')+'만';
  else s=a.toLocaleString('ko-KR');
  return (w<0?'-':'')+'₩'+s;
}
function all(){var a=[];S.floors.forEach(function(fl){fl.forEach(function(sl){if(sl)a.push(sl)})});return a}
function isRoom(sl){return !!ROOMS[sl.type]}
function def(sl){return ROOMS[sl.type]||FACS[sl.type]}
function priceOf(sl){return ROOMS[sl.type].price*(1+0.35*(sl.lvl-1))}
function hourOf(t){return (6+t*2)%24}
function hourLabel(h){return (h<12?'오전 ':'오후 ')+(h%12===0?12:h%12)+'시'}
function addRep(d){S.rep=Math.max(0.5,Math.min(5,S.rep+d))}
function inc(x){S.money+=x;S.st.dayIn+=x;S.st.income+=x}
function log(m,k){S.log.unshift({d:S.day,m:m,k:k||''});if(S.log.length>80)S.log.length=80}
function facSat(){
  var seen={},t=0;
  all().forEach(function(sl){var f=FACS[sl.type];if(f&&!seen[sl.type]){seen[sl.type]=1;t+=f.sat}});
  return Math.min(1.2,t);
}
function costsPerDay(){
  var w=0,k;for(k in STAFF)w+=STAFF[k].wage*S.staff[k];
  var u=0;all().forEach(function(sl){var d=def(sl);u+=d.upkeep*(ROOMS[sl.type]?(1+0.2*(sl.lvl-1)):1)});
  return {wages:w,upkeep:u,total:w+u};
}
function floorCost(){return 600+900*S.floors.length}
function maxTier(){var m=0;all().forEach(function(sl){if(isRoom(sl))m=Math.max(m,ROOMS[sl.type].tier)});return m}
function tierOf(type){return ROOMS[type].tier}
function freeRoom(tier){
  var a=all();
  for(var i=0;i<a.length;i++){var sl=a[i];if(isRoom(sl)&&tierOf(sl.type)===tier&&!sl.guest&&!sl.dirty)return sl}
  return null;
}
function toast(m,k){
  var el=$('toast');el.textContent=m;el.className='toast show '+(k||'');
  clearTimeout(toastT);toastT=setTimeout(function(){el.className='toast'},2600);
}

/* ---------- simulation ---------- */
function demand(){
  var built=all().length;
  var wk=((S.day-1)%7)>=5?1.25:1;
  var ev=S.event?EVENTS[S.event.key].mult:1;
  return 0.2*HF[S.tick]*(0.5+S.rep*0.4)*(1+0.06*built)*(1+0.2*S.staff.mkt)*wk*ev;
}
function newGuest(forceTier){
  var r=Math.random(),ps=0.05+0.04*S.rep,pd=0.25+0.03*S.rep;
  var tier=forceTier!=null?forceTier:(r<ps?2:(r<ps+pd?1:0));
  tier=Math.min(tier,maxTier());
  return {tier:tier,wait:0,nights:1+Math.floor(Math.random()*3),down:false};
}
function checkout(sl){
  var g=sl.guest,R=ROOMS[sl.type];
  var s=3.0+(sl.lvl-1)*0.35+R.tier*0.2+facSat()-(g.down?0.7:0)-g.wait*0.15+(Math.random()-0.5)*0.9;
  s=Math.max(1,Math.min(5,s));
  S.rep+=(s-S.rep)*0.06;
  S.rep=Math.max(0.5,Math.min(5,S.rep));
  S.st.guests++;
  sl.guest=null;sl.dirty=true;
  if(s>=4.6&&Math.random()<0.3)log('투숙객 후기: "다음에도 꼭 올게요." ★'+s.toFixed(1),'good');
  else if(s<=2.3&&Math.random()<0.5)log('불만 후기가 올라왔습니다. 시설 개선이 필요합니다. ★'+s.toFixed(1),'bad');
}
function step(){
  if(S.over)return;
  var a=all(),rooms=a.filter(isRoom),facs=a.filter(function(x){return !!FACS[x.type]});
  var inhouse=0,i;
  rooms.forEach(function(sl){
    if(!sl.guest)return;
    inhouse++;inc(priceOf(sl)/DAY_TICKS);
    sl.guest.left--;
    if(sl.guest.left<=0)checkout(sl);
  });
  facs.forEach(function(f){inc(inhouse*FACS[f.type].per/DAY_TICKS*0.8)});

  var cap=S.staff.clean+(S.tick%4===0?1:0);
  var dirty=rooms.filter(function(r){return r.dirty});
  for(i=0;i<dirty.length&&cap>0;i++,cap--)dirty[i].dirty=false;

  var lam=demand(),n=Math.floor(lam)+(Math.random()<lam-Math.floor(lam)?1:0);
  if(rooms.length>0){for(i=0;i<n;i++)S.queue.push(newGuest())}

  var desk=2+S.staff.desk*2,keep=[],lostNow=0;
  S.queue.forEach(function(g){
    var placed=false;
    if(desk>0){
      var room=freeRoom(g.tier);
      if(!room&&g.tier>0&&Math.random()<0.8){
        for(var t=g.tier-1;t>=0&&!room;t--)room=freeRoom(t);
        if(room)g.down=true;
      }
      if(room){
        var tot=g.nights*DAY_TICKS;
        room.guest={left:tot,total:tot,down:g.down,wait:g.wait};
        desk--;placed=true;
      }
    }
    if(!placed){
      g.wait++;
      if(g.wait>=3){S.st.lost++;lostNow++;addRep(-0.008)}else keep.push(g);
    }
  });
  S.queue=keep;
  if(lostNow>0&&S.lostLogDay!==S.day){S.lostLogDay=S.day;log('빈 객실이 없어 손님을 돌려보냈습니다. 객실을 늘려 보세요.','warn')}

  S.tick++;
  if(S.tick>=DAY_TICKS)endDay();
  checkGoals();
  renderAll();
}
function endDay(){
  var c=costsPerDay();
  S.money-=c.total;
  var net=S.st.dayIn-c.total;
  S.st.hist.push(Math.round(net));if(S.st.hist.length>14)S.st.hist.shift();
  log(S.day+'일차 결산 · 수입 '+fmt(S.st.dayIn)+' · 지출 '+fmt(c.total)+' · 순익 '+fmt(net),net>=0?'good':'bad');
  S.st.dayIn=0;S.day++;S.tick=0;
  if(S.event){
    S.event.left--;
    if(S.event.left<=0){log(EVENTS[S.event.key].name+'이(가) 끝났습니다.','');S.event=null}
  }
  rollEvent();
  if(S.money<-2000){S.over=true;clearTimeout(timer)}
  save();
}
function rollEvent(){
  if(S.event||Math.random()>0.14||all().filter(isRoom).length===0)return;
  var r=Math.random();
  if(r<0.35){S.event={key:'festival',left:EVENTS.festival.days};log(EVENTS.festival.msg,'good');toast('이벤트 · 지역 축제','good')}
  else if(r<0.6){S.event={key:'rain',left:EVENTS.rain.days};log(EVENTS.rain.msg,'warn');toast('이벤트 · 장마철','bad')}
  else if(r<0.85){
    for(var i=0;i<6;i++){var g=newGuest(0);g.nights=2;S.queue.push(g)}
    log('단체 투어객 6명이 로비에 도착했습니다.','good');toast('단체 투어객이 도착했어요','good');
  }else{
    if(S.rep>=3.2){addRep(0.25);log('호텔 평가단이 다녀갔습니다. 좋은 평가를 받아 평점이 올랐습니다.','good');toast('평가단 방문 · 평점 상승','good')}
    else{addRep(-0.15);log('호텔 평가단이 다녀갔습니다. 기대에 못 미쳐 평점이 내려갔습니다.','bad');toast('평가단 방문 · 평점 하락','bad')}
  }
}
function checkGoals(){
  var done=0;
  GOALS.forEach(function(g){
    if(S.goals[g.id]){done++;return}
    if(g.test()){S.goals[g.id]=true;done++;S.money+=g.reward;log('목표 달성 · '+g.name+' (보상 '+fmt(g.reward)+')','good');toast('목표 달성 · '+g.name,'good')}
  });
  if(done===GOALS.length&&!S.goals._all){S.goals._all=true;log('모든 목표를 달성했습니다. 당신의 호텔은 전설이 되었습니다.','good')}
}

/* ---------- actions ---------- */
function selSlot(){return ui.sel?S.floors[ui.sel.f][ui.sel.s]:null}
function doBuild(type){
  if(!ui.sel||selSlot())return;
  var d=ROOMS[type]||FACS[type];if(!d)return;
  if(FACS[type]&&(all().some(function(s){return s.type===type})||S.floors.length<d.minFloors))return;
  if(S.money<d.cost){toast('자금이 부족합니다','bad');return}
  S.money-=d.cost;
  S.floors[ui.sel.f][ui.sel.s]={type:type,lvl:1,guest:null,dirty:false};
  log(fl(ui.sel.f+1)+'에 '+d.name+(ROOMS[type]?'룸':'')+'을(를) 지었습니다. ('+fmt(d.cost)+')','');
  checkGoals();afterAction();
}
function doUpgrade(){
  var sl=selSlot();if(!sl||!ROOMS[sl.type]||sl.lvl>=3||sl.guest)return;
  var cost=Math.round(ROOMS[sl.type].cost*0.7*sl.lvl);
  if(S.money<cost){toast('자금이 부족합니다','bad');return}
  S.money-=cost;sl.lvl++;
  log(ROOMS[sl.type].name+'룸을 Lv'+sl.lvl+'로 리모델링했습니다. ('+fmt(cost)+')','');
  afterAction();
}
function doDemolish(){
  var sl=selSlot();if(!sl||sl.guest)return;
  if(ui.confirm!=='demolish'){ui.confirm='demolish';clearTimeout(confT);confT=setTimeout(function(){ui.confirm=null;renderAll(true)},3500);renderAll(true);return}
  var d=def(sl),ref=Math.round(d.cost*0.5);
  S.money+=ref;S.floors[ui.sel.f][ui.sel.s]=null;ui.confirm=null;
  log(d.name+'을(를) 철거하고 '+fmt(ref)+'을 돌려받았습니다.','warn');
  afterAction();
}
function doExpand(){
  if(S.floors.length>=MAXF)return;
  var c=floorCost();if(S.money<c){toast('자금이 부족합니다','bad');return}
  S.money-=c;S.floors.push([null,null,null,null]);
  log(fl(S.floors.length)+'을 증축했습니다. ('+fmt(c)+')','');
  checkGoals();afterAction();
}
function doStaff(k,d){
  var st=STAFF[k];if(!st)return;
  var n=S.staff[k]+d;if(n<0||n>st.max)return;
  S.staff[k]=n;log(st.name+' 직원을 '+(d>0?'고용':'해고')+'했습니다. (현재 '+n+'명)','');
  afterAction();
}
function afterAction(){save();renderAll(true)}
function setSpeed(v){S.speed=v;schedule();renderHud();save()}
function schedule(){
  clearTimeout(timer);
  if(S.speed===0||S.over)return;
  timer=setTimeout(function(){step();schedule()},900/S.speed);
}
function newGame(){
  S=newState();ui.sel=null;ui.confirm=null;ui.tab='build';ui.cache={};
  $('over').hidden=true;$('hname').value=S.name;
  save();schedule();renderAll(true);$('scroll').scrollTop=1e5;
}

/* ---------- render ---------- */
function skyAt(h){
  var K=[[0,'#0a1030','#1b2550'],[5,'#0f1a40','#2a3868'],[7,'#5c7fc0','#f2b48a'],[10,'#4a90d9','#bfe0f5'],[16,'#4a90d9','#cfe6f5'],[18.5,'#5a4a8a','#f08a5d'],[21,'#10163a','#232c5a'],[24,'#0a1030','#1b2550']];
  var i=0;while(i<K.length-2&&h>=K[i+1][0])i++;
  var a=K[i],b=K[i+1],t=(h-a[0])/(b[0]-a[0]);t=Math.max(0,Math.min(1,t));
  function mix(x,y){
    var px=parseInt(x.slice(1),16),py=parseInt(y.slice(1),16),o='#',c;
    for(c=16;c>=0;c-=8){var v=Math.round(((px>>c)&255)*(1-t)+((py>>c)&255)*t);o+=('0'+v.toString(16)).slice(-2)}
    return o;
  }
  return {top:mix(a[1],b[1]),bot:mix(a[2],b[2])};
}
function renderSky(){
  var h=hourOf(S.tick),sc=$('scene'),sk=skyAt(h);
  sc.style.setProperty('--sky1',sk.top);sc.style.setProperty('--sky2',sk.bot);
  var night=(h>=21||h<5)?1:((h>=19||h<7)?0.5:0);
  sc.style.setProperty('--night',night);
  var isDay=h>=6&&h<18,q=isDay?(h-6)/12:(((h-18+24)%24)/12);
  var o=$('orb');
  o.style.left=(8+q*80)+'%';o.style.top=(70-56*Math.sin(Math.PI*q))+'px';
  o.style.setProperty('--orbc',isDay?'#ffd77a':'#e4eaff');
  o.style.setProperty('--orbglow',isDay?'rgba(255,215,122,.5)':'rgba(200,215,255,.35)');
}
function renderHud(){
  var a=all(),rooms=a.filter(isRoom),occ=rooms.filter(function(r){return r.guest}).length;
  $('sMoney').textContent=fmt(S.money);
  $('sMoney').className=S.money<0?'neg':'';
  $('sStars').style.setProperty('--pct',(S.rep/5*100)+'%');
  $('sRep').textContent=S.rep.toFixed(1);
  $('sOcc').textContent=rooms.length?(occ+'/'+rooms.length+'실 · '+Math.round(occ/rooms.length*100)+'%'):'-';
  var c=costsPerDay();
  $('sDay').innerHTML=esc(fmt(S.st.dayIn))+' <small>/ 고정비 '+esc(fmt(c.total))+'</small>';
  $('clkDay').textContent=S.day+'일차 · '+DOW[(S.day-1)%7]+'요일';
  $('clkTime').textContent=hourLabel(hourOf(S.tick))+(((S.day-1)%7)>=5?' · 주말 수요 증가':'');
  var bs=document.querySelectorAll('[data-act="speed"]');
  for(var i=0;i<bs.length;i++)bs[i].setAttribute('aria-pressed',String(Number(bs[i].dataset.v)===S.speed));
  var ban=$('banner');
  if(S.event){ban.hidden=false;ban.textContent='진행 중: '+EVENTS[S.event.key].name+' · 앞으로 '+S.event.left+'일 · 손님 유입 ×'+EVENTS[S.event.key].mult}
  else ban.hidden=true;
  $('bNew').textContent=ui.confirm==='new'?'정말 새로 시작?':'새 게임';
  var tabs=document.querySelectorAll('[data-act="tab"]');
  for(i=0;i<tabs.length;i++)tabs[i].setAttribute('aria-selected',String(tabs[i].dataset.tab===ui.tab));
}
function slotHTML(f,s){
  var sl=S.floors[f][s],sel=ui.sel&&ui.sel.f===f&&ui.sel.s===s?' sel':'';
  var key=' data-act="sel" data-f="'+f+'" data-s="'+s+'"';
  if(!sl)return '<button class="slot empty'+sel+'"'+key+' aria-label="'+fl(f+1)+' '+(s+1)+'번 칸 빈 칸 건설">+</button>';
  var d=def(sl),label=fl(f+1)+' '+(s+1)+'번 칸 '+d.name;
  if(FACS[sl.type]){
    return '<button class="slot fac'+sel+'"'+key+' aria-label="'+label+'"><span class="n">'+d.name+'</span><span class="m">운영 중</span></button>';
  }
  var cls='slot t-'+sl.type+sel,m,bar='';
  if(sl.guest){
    cls+=' occ';
    m='Lv'+sl.lvl+' · 투숙 중';
    bar='<i class="bar"><b style="width:'+Math.max(4,Math.round(sl.guest.left/sl.guest.total*100))+'%"></b></i>';
  }else if(sl.dirty){cls+=' dirty';m='청소 대기'}
  else m='Lv'+sl.lvl+' · 공실';
  return '<button class="'+cls+'"'+key+' aria-label="'+label+' '+m+'"><span class="n">'+d.name+'</span><span class="m">'+m+'</span>'+bar+'</button>';
}
function towerHTML(){
  var h='<div class="sign"><span>'+esc(S.name||'호텔')+'</span></div>';
  if(S.floors.length<MAXF){
    var c=floorCost();
    h+='<button class="expand" data-act="expand"'+(S.money<c?' disabled':'')+'>＋ '+fl(S.floors.length+1)+' 증축 · '+fmt(c)+'</button>';
  }
  for(var f=S.floors.length-1;f>=0;f--){
    h+='<div class="floor"><span class="fl">'+fl(f+1)+'</span><div class="slots">';
    for(var s=0;s<SLOTS;s++)h+=slotHTML(f,s);
    h+='</div></div>';
  }
  var q=S.queue,pax='';
  q.slice(0,16).forEach(function(g){pax+='<i class="pax t'+g.tier+(g.wait>=2?' late':'')+'"></i>'});
  h+='<div class="lobby"><span class="fl">로비</span><div class="desk"><div class="t">프런트 '+(1+S.staff.desk)+'명 · 대기 손님 '+q.length+'명'+(q.length>16?' (일부만 표시)':'')+'</div><div class="queue">'+(pax||'<span class="t">지금은 기다리는 손님이 없습니다</span>')+'</div></div></div>';
  return h;
}
function spark(h){
  if(h.length<2)return '<p class="muted">2일 이상 운영하면 일별 순익 추이가 표시됩니다.</p>';
  var W=280,H=60,P=6,mn=Math.min.apply(null,h.concat([0])),mx=Math.max.apply(null,h.concat([0])),rng=(mx-mn)||1;
  var x=function(i){return P+i*(W-2*P)/(h.length-1)},y=function(v){return P+(mx-v)*(H-2*P)/rng};
  var pts=h.map(function(v,i){return x(i).toFixed(1)+','+y(v).toFixed(1)}).join(' ');
  var z=y(0).toFixed(1),last=h.length-1;
  return '<svg viewBox="0 0 '+W+' '+H+'" class="spark" role="img" aria-label="최근 일별 순익 추이"><line x1="'+P+'" x2="'+(W-P)+'" y1="'+z+'" y2="'+z+'" class="zero"/><polygon points="'+P+','+z+' '+pts+' '+x(last).toFixed(1)+','+z+'" class="area"/><polyline points="'+pts+'" class="ln"/><circle cx="'+x(last).toFixed(1)+'" cy="'+y(h[last]).toFixed(1)+'" r="3.5" class="dot"/></svg>';
}
function optRow(k,d,isFac){
  var dis='',meta;
  if(isFac){
    var owned=all().some(function(s){return s.type===k});
    meta='투숙객 1인당 하루 '+fmt(d.per*0.8)+' · 만족도 +'+d.sat+' · 하루 유지비 '+fmt(d.upkeep);
    if(owned)dis=' disabled';else if(S.floors.length<d.minFloors)dis=' disabled';
    else if(S.money<d.cost)dis=' disabled';
    var note=owned?'이미 보유 중':(S.floors.length<d.minFloors?fl(d.minFloors)+'까지 증축하면 열립니다':'');
    return '<div class="opt"><div><b>'+d.name+'</b><span>'+d.desc+'</span><em>'+meta+(note?' · '+note:'')+'</em></div><button class="btn" data-act="build" data-type="'+k+'"'+dis+'>'+fmt(d.cost)+'</button></div>';
  }
  if(S.money<d.cost)dis=' disabled';
  meta='1박 '+fmt(d.price)+' · 하루 유지비 '+fmt(d.upkeep);
  return '<div class="opt"><div><b>'+d.name+'룸</b><span>'+d.desc+'</span><em>'+meta+'</em></div><button class="btn" data-act="build" data-type="'+k+'"'+dis+'>'+fmt(d.cost)+'</button></div>';
}
function panelBuild(){
  var h='',sl=selSlot();
  if(!ui.sel){
    var a=all(),cnt={standard:0,deluxe:0,suite:0},rooms=0;
    a.forEach(function(s){if(ROOMS[s.type]){cnt[s.type]++;rooms++}});
    var facs=a.length-rooms,sf=0,k;for(k in S.staff)sf+=S.staff[k];
    h+='<h3>호텔 현황</h3><ul class="kv">'
      +'<li><span>객실</span><b>'+rooms+'실</b></li>'
      +'<li><span>부대시설</span><b>'+facs+'곳</b></li>'
      +'<li><span>직원</span><b>'+sf+'명</b></li>'
      +'<li><span>누적 투숙객</span><b>'+S.st.guests+'명</b></li>'
      +'<li><span>놓친 손님</span><b>'+S.st.lost+'명</b></li>'
      +'<li><span>누적 수입</span><b>'+fmt(S.st.income)+'</b></li></ul>'
      +'<div class="sect">최근 일별 순익</div>'+spark(S.st.hist)
      +'<p class="muted">건물에서 빈 칸(+)을 눌러 객실이나 시설을 지으세요. 지어 둔 칸을 누르면 리모델링과 철거를 할 수 있습니다.</p>';
    return h;
  }
  var title=fl(ui.sel.f+1)+' · '+(ui.sel.s+1)+'번 칸';
  if(!sl){
    h+='<h3>'+title+'<small>빈 칸</small></h3><div class="opts">';
    Object.keys(ROOMS).forEach(function(k){h+=optRow(k,ROOMS[k],false)});
    Object.keys(FACS).forEach(function(k){h+=optRow(k,FACS[k],true)});
    h+='</div>';
    return h;
  }
  var d=def(sl),isR=!!ROOMS[sl.type];
  h+='<h3>'+title+'<small>'+d.name+(isR?'룸':'')+'</small></h3><div class="card">';
  if(isR){
    var st=sl.guest?('투숙 중 · 남은 '+Math.ceil(sl.guest.left/DAY_TICKS)+'박'):(sl.dirty?'청소 대기':'공실');
    h+='<div class="line"><span>상태</span><b>'+st+'</b></div>'
      +'<div class="line"><span>등급</span><b>Lv'+sl.lvl+' / 3</b></div>'
      +'<div class="line"><span>1박 요금</span><b>'+fmt(priceOf(sl))+'</b></div>'
      +'<div class="line"><span>하루 유지비</span><b>'+fmt(d.upkeep*(1+0.2*(sl.lvl-1)))+'</b></div>';
  }else{
    h+='<div class="line"><span>상태</span><b>운영 중</b></div>'
      +'<div class="line"><span>투숙객 1인당 하루 매출</span><b>'+fmt(d.per*0.8)+'</b></div>'
      +'<div class="line"><span>만족도 보너스</span><b>+'+d.sat+'</b></div>'
      +'<div class="line"><span>하루 유지비</span><b>'+fmt(d.upkeep)+'</b></div>';
  }
  h+='</div><div class="row">';
  if(isR&&sl.lvl<3){
    var uc=Math.round(d.cost*0.7*sl.lvl);
    h+='<button class="btn" data-act="upgrade"'+((sl.guest||S.money<uc)?' disabled':'')+'>Lv'+(sl.lvl+1)+' 리모델링 '+fmt(uc)+'</button>';
  }
  var cf=ui.confirm==='demolish';
  h+='<button class="btn '+(cf?'danger':'alt')+'" data-act="demolish"'+(sl.guest?' disabled':'')+'>'+(cf?'정말 철거 (환급 '+fmt(Math.round(d.cost*0.5))+')':'철거')+'</button>';
  h+='<button class="btn alt" data-act="desel">닫기</button></div>';
  if(sl.guest)h+='<p class="muted">투숙객이 있는 동안에는 리모델링과 철거를 할 수 없습니다.</p>';
  else if(isR)h+='<p class="muted">리모델링하면 요금과 투숙객 만족도가 함께 올라갑니다. 등급은 Lv3까지입니다.</p>';
  return h;
}
function panelStaff(){
  var c=costsPerDay(),h='<h3>직원</h3>';
  Object.keys(STAFF).forEach(function(k){
    var st=STAFF[k],n=S.staff[k];
    h+='<div class="staff"><div><b>'+st.name+'</b><span class="muted" style="display:block;margin:0">'+st.desc+'</span><span class="muted" style="display:block;margin:2px 0 0">일급 '+fmt(st.wage)+' · 최대 '+st.max+'명</span></div>'
      +'<div class="stepper"><button data-act="fire" data-k="'+k+'"'+(n<=0?' disabled':'')+' aria-label="'+st.name+' 해고">−</button><output>'+n+'</output><button data-act="hire" data-k="'+k+'"'+(n>=st.max?' disabled':'')+' aria-label="'+st.name+' 고용">＋</button></div></div>';
  });
  h+='<div class="card"><div class="line"><span>하루 인건비</span><b>'+fmt(c.wages)+'</b></div><div class="line"><span>하루 시설 유지비</span><b>'+fmt(c.upkeep)+'</b></div><div class="line"><span>하루 고정비 합계</span><b>'+fmt(c.total)+'</b></div></div>'
    +'<p class="muted">직원이 없어도 사장님이 4번에 한 번씩 객실 1개를 직접 청소합니다.</p>';
  return h;
}
function panelGoals(){
  var h='<h3>목표</h3>';
  GOALS.forEach(function(g){
    var d=!!S.goals[g.id];
    h+='<div class="goal'+(d?' done':'')+'"><i></i><div><b>'+g.name+'</b>'+(!d&&g.prog?'<span style="display:block">'+g.prog()+'</span>':'')+'</div><span>'+(d?'완료':'보상 '+fmt(g.reward))+'</span></div>';
  });
  return h;
}
function panelLog(){
  var h='<h3>기록</h3><ul class="log">';
  S.log.slice(0,50).forEach(function(e){h+='<li class="'+e.k+'"><time>'+e.d+'일차</time><span>'+esc(e.m)+'</span></li>'});
  return h+'</ul>';
}
function panelHTML(){
  if(ui.tab==='staff')return panelStaff();
  if(ui.tab==='goals')return panelGoals();
  if(ui.tab==='log')return panelLog();
  return panelBuild();
}
function focusKey(el){
  if(!el||!el.dataset||!el.dataset.act)return null;
  var d=el.dataset;return [d.act,d.f||'',d.s||'',d.type||d.k||d.tab||''].join('|');
}
function renderAll(force){
  if(ui.pressing&&!force){ui.pending=true;return}
  ui.pending=false;
  renderHud();renderSky();
  var ae=document.activeElement,fk=null;
  if(ae&&(ae.closest('#tower')||ae.closest('#panel')))fk=focusKey(ae);
  var th=towerHTML();
  if(ui.cache.tower!==th){ui.cache.tower=th;$('tower').innerHTML=th}
  var ph=ui.tab+'|'+panelHTML();
  if(ui.cache.panel!==ph){ui.cache.panel=ph;$('panel').innerHTML=ph.slice(ph.indexOf('|')+1)}
  if(fk){
    var els=document.querySelectorAll('#tower [data-act],#panel [data-act]');
    for(var i=0;i<els.length;i++){if(focusKey(els[i])===fk){if(document.activeElement!==els[i])els[i].focus({preventScroll:true});break}}
  }
  $('over').hidden=!S.over;
}

/* ---------- events ---------- */
document.addEventListener('pointerdown',function(){ui.pressing=true});
function release(){setTimeout(function(){ui.pressing=false;if(ui.pending)renderAll()},60)}
document.addEventListener('pointerup',release);
document.addEventListener('pointercancel',release);

document.addEventListener('click',function(e){
  var t=e.target.closest?e.target.closest('[data-act]'):null;
  if(!t||t.disabled)return;
  var d=t.dataset,act=d.act;
  if(act!=='demolish'&&ui.confirm==='demolish')ui.confirm=null;
  if(act!=='newgame'&&ui.confirm==='new')ui.confirm=null;
  switch(act){
    case 'sel':
      var f=Number(d.f),s=Number(d.s);
      if(ui.sel&&ui.sel.f===f&&ui.sel.s===s)ui.sel=null;else ui.sel={f:f,s:s};
      ui.tab='build';renderAll(true);
      if(ui.sel&&window.innerWidth<=860){var p=$('panel');if(p.scrollIntoView)p.scrollIntoView({block:'nearest',behavior:'smooth'})}
      break;
    case 'desel':ui.sel=null;renderAll(true);break;
    case 'tab':ui.tab=d.tab;renderAll(true);break;
    case 'build':doBuild(d.type);break;
    case 'upgrade':doUpgrade();break;
    case 'demolish':doDemolish();break;
    case 'expand':doExpand();break;
    case 'hire':doStaff(d.k,1);break;
    case 'fire':doStaff(d.k,-1);break;
    case 'speed':setSpeed(Number(d.v));renderAll(true);break;
    case 'newgame':
      if(ui.confirm==='new'){newGame()}
      else{ui.confirm='new';clearTimeout(confT);confT=setTimeout(function(){ui.confirm=null;renderHud()},3500);renderHud()}
      break;
    case 'restart':newGame();break;
  }
});
$('hname').addEventListener('input',function(e){
  S.name=e.target.value.slice(0,14);
  ui.cache.tower=null;
  var sp=document.querySelector('.sign span');if(sp)sp.textContent=S.name||'호텔';
  save();
});

/* ---------- boot ---------- */
$('hname').value=S.name;
renderAll(true);
$('scroll').scrollTop=1e5;
if(S.over)$('over').hidden=false;else schedule();
})();
</script>

</body></html>
