<!DOCTYPE html>
<html lang="ko">
<head>
    <!-- 문서의 문자 인코딩을 UTF-8로 설정합니다 -->
    <meta charset="UTF-8">
    <!-- 모바일 및 다양한 기기 화면 크기에 맞게 뷰포트를 설정합니다 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 웹브라우저 탭에 표시될 제목입니다 -->
    <title>D-Day 및 시간표</title>
    
    <!-- 구글 폰트 IBM Plex Sans KR 및 IBM Plex Mono 불러오기 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- CSS 스타일 시작: 화면의 모양과 디자인을 정의합니다 -->
    <style>
        /* CSS 변수 기본 설정 (낮 모드 기본값) */
        :root {
            --bg-color: #00b8e6;      /* 배경 색상 */
            --bg-gradient: none;      /* 배경 그라데이션 */
            --card-color: #005dd6;    /* 칸 및 카드 배경 색상 */
            --text-color: #111111;    /* 기본 글자 색상 */
            --point-color: #111111;   /* 강조 포인트 색상 */
            --header-text: #ffffff;   /* 표 헤더 글자 색상 */
            --radius: 28px;           /* 모서리 둥글기 */
            --main-font: 'IBM Plex Sans KR', sans-serif; /* 기본 폰트 */
            --border-color: rgba(17, 17, 17, 0.15); /* 셀 테두리 색상 */
        }

        /* 야간 모드 (밤의 초원) 테마 스타일 */
        body.dark-mode {
            --bg-color: #0a192f;
            /* 별빛 가득한 밤의 초원 감성 그라데이션 */
            --bg-gradient: linear-gradient(180deg, #020c1b 0%, #0a192f 50%, #172a45 100%);
            --card-color: rgba(16, 30, 54, 0.85);
            --text-color: #e6f1ff;
            --point-color: #64ffda;
            --header-text: #0a192f;
            --border-color: rgba(100, 255, 218, 0.2);
        }

        /* Windows XP 배경 테마 스타일 */
        body.xp-mode {
            --bg-color: #3a6ea5;
            --bg-gradient: linear-gradient(180deg, #3a82e4 0%, #70a9ff 45%, #52b043 45%, #2a8019 100%);
            --card-color: #ece9d8;
            --text-color: #000000;
            --point-color: #0055ea;
            --header-text: #ffffff;
            --radius: 8px;
            --border-color: #7f9db9;
        }

        /* 궁서체 글꼴 모드 적용 스타일 */
        body.gungsuh-font {
            --main-font: 'Gungsuh', 'GungsuhChe', '궁서', '궁서체', serif !important;
        }

        /* IBM ThinkPad (레트로 폰트 & 빨간 포인트) 스타일 */
        body.thinkpad-font {
            --main-font: 'IBM Plex Mono', 'Courier New', monospace !important;
            --point-color: #e60012 !important; /* ThinkPad 트랙포인트 레트로 레드 */
        }

        /* 전체 페이지 기본 스타일 */
        body {
            font-family: var(--main-font);
            background-color: var(--bg-color);
            background: var(--bg-gradient, var(--bg-color));
            background-attachment: fixed;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        /* 상단 컨트롤 버튼 바 스타일 */
        .control-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            z-index: 100;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* 버튼 공통 디자인 */
        .btn {
            background-color: var(--card-color);
            color: var(--text-color);
            border: 2px solid var(--point-color);
            padding: 10px 18px;
            border-radius: 20px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .btn:hover {
            transform: scale(1.05);
        }

        /* D-Day 카드 박스 영역 스타일 */
        .dday-card {
            background-color: var(--card-color);
            padding: 25px 40px;
            border-radius: var(--radius);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            text-align: center;
            margin-bottom: 30px;
            width: 100%;
            max-width: 650px;
            box-sizing: border-box;
            backdrop-filter: blur(5px);
        }

        /* D-Day 목표 이름 스타일 */
        .dday-title {
            font-size: 1.4rem;
            color: var(--text-color);
            margin-bottom: 10px;
            font-weight: 500;
        }

        /* D-Day 남은 날짜 큰 글자 스타일 */
        .dday-count {
            font-size: 3rem;
            font-weight: 700;
            color: var(--point-color);
        }

        /* 시간표 카드 박스 영역 스타일 */
        .timetable-card {
            background-color: var(--card-color);
            padding: 25px;
            border-radius: var(--radius);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 650px;
            box-sizing: border-box;
            backdrop-filter: blur(5px);
        }

        /* 시간표 제목 스타일 */
        .timetable-title {
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
            color: var(--text-color);
            font-weight: 700;
        }

        /* 표(Table) 기본 틀 스타일 */
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            border-radius: 12px;
            overflow: hidden;
        }

        /* 표의 셀과 헤더 공통 테두리 및 여백 */
        th, td {
            padding: 12px;
            border: 1px solid var(--border-color);
        }

        /* 표 상단 헤더(요일 및 시간) 스타일 */
        th {
            background-color: var(--point-color);
            color: var(--header-text);
            font-weight: 600;
        }

        /* 표 내부 셀(칸) 색상 */
        td {
            background-color: var(--card-color);
            color: var(--text-color);
        }

        /* 마우스 올렸을 때 행 배경 변화 효과 */
        tr:hover td {
            background-color: rgba(255, 255, 255, 0.15);
        }

        /* 현재 교시 강조 테두리 스타일 */
        .current-period {
            border: 3px solid #ff4757 !important;
            background-color: rgba(255, 71, 87, 0.25) !important;
            font-weight: bold;
        }

        /* 주말 안내 메시지 스타일 */
        .weekend-notice {
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: #ff4757;
            margin-bottom: 15px;
        }

        /* 랜덤 움직이는 '삼성' 스타일 (맑은 고딕 고정) */
        #floating-samsung {
            position: fixed;
            font-family: '맑은 고딕', 'Malgun Gothic', sans-serif !important;
            font-weight: bold;
            font-size: 22px;
            color: var(--text-color);
            pointer-events: none;
            z-index: 9999;
            transition: all 1s ease-in-out;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }

        /* 1분 방치시 나타나는 일시중지 화면 오버레이 스타일 */
        #pause-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        /* 방치 모드 활성화 상태 */
        #pause-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* 일시중지 텍스트 디자인 */
        .pause-text {
            font-size: 3.5rem;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 4px;
            margin-bottom: 15px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        /* 방치 해제 안내 서브 텍스트 */
        .pause-subtext {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.7);
        }

        /* 시작 시 10초간 출력되는 오버레이 스타일 */
        #start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20000;
            opacity: 1;
            transition: opacity 1s ease;
        }

        /* 시작 문구 사라짐 애니메이션용 클래스 */
        #start-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* '새로운시작' 텍스트 디자인 */
        .start-text {
            font-size: 4rem;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 6px;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.8);
            animation: pulseText 2s infinite alternate;
        }

        /* '공짜' 서브 텍스트 디자인 */
        .start-badge {
            font-size: 1.8rem;
            font-weight: bold;
            color: #ffeb3b;
            margin-top: 10px;
            letter-spacing: 4px;
            text-shadow: 0 0 15px rgba(255, 235, 59, 0.6);
        }

        @keyframes pulseText {
            from { transform: scale(0.98); opacity: 0.8; }
            to { transform: scale(1.03); opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- 시작 시 10초간 표시되는 안내 오버레이 -->
    <div id="start-overlay">
        <div class="start-text">새로운시작</div>
        <div class="start-badge">(공짜)</div>
    </div>

    <!-- 화면에서 랜덤하게 움직일 '삼성' 텍스트 -->
    <div id="floating-samsung">삼성</div>

    <!-- 1분 방치시 표시되는 일시중지 화면 -->
    <div id="pause-overlay">
        <div class="pause-text">일시중지</div>
        <div class="pause-subtext">마우스를 움직이거나 키를 누르면 다시 시작됩니다</div>
    </div>

    <!-- 상단 버튼 제어 영역 -->
    <div class="control-bar">
        <button class="btn" onclick="toggleDarkMode()">야간 모드 (밤의 초원)</button>
        <button class="btn" id="fontBtn" onclick="toggleFont()">글꼴: 기본</button>
        <button class="btn" onclick="toggleXpMode()">Win XP 테마</button>
    </div>

    <!-- D-Day 정보가 출력될 HTML 카드 영역입니다 -->
    <div class="dday-card">
        <!-- 목표 이름이 표시되는 곳입니다 -->
        <div class="dday-title" id="targetNameDisplay">목표 로딩 중...</div>
        <!-- D-Day 남은 날짜가 표시되는 곳입니다 -->
        <div class="dday-count" id="ddayDisplay">D-Day</div>
    </div>

    <!-- 시간표가 출력될 HTML 카드 영역입니다 -->
    <div class="timetable-card">
        <h2 class="timetable-title">주간 시간표</h2>
        <!-- 자바스크립트에 의해 시간표가 동적으로 생성되어 삽입될 테이블 태그입니다 -->
        <table id="timetable"></table>
    </div>

    <!-- 자바스크립트 코드 시작 -->
    <script>
        // ==========================================
        // 👇 [여기만 고치세요] 설정 값 모음
        // ==========================================
        
        // 1. 화면 최상단 전체 제목 상수입니다
        const TITLE  = '겔s20살';

        // 2. D-Day 목표 이름과 목표 날짜 객체 상수입니다
        const TARGET = { label:'겔s20살', date:'2030-12-21' };

        // 3. 요일 목록 배열 상수입니다 (월~금)
        const DAYS   = ['월','화','수','목','금'];

        // 4. 시간대별 수업 교시 및 과목 데이터 배열 상수입니다
        const PERIODS = [
          { time:'09:05', subjects:['컴퓨터', '컴퓨터', '컴퓨터', '컴퓨터', '컴퓨터'] },
          { time:'10:00', subjects:['컴퓨터', '컴퓨터', '컴퓨터', '컴퓨터', '컴퓨터'] },
          { time:'10:55', subjects:['컴퓨터', '컴퓨터', '컴퓨터', '컴퓨터', '컴퓨터'] },
          { time:'11:50', subjects:['컴퓨터', '컴퓨터', '컴퓨터', '컴퓨터', '컴퓨터'] },
          { time:'14:30', subjects:['컴퓨터', '컴퓨터', '컴퓨터', '컴퓨터', '컴퓨터'] },
        ];

        // ==========================================
        // 👆 [여기만 고치세요] 수정 영역 끝
        // ==========================================


        // 야간 모드 토글 함수
        function toggleDarkMode() {
            document.body.classList.remove('xp-mode');
            document.body.classList.toggle('dark-mode');
        }

        // 글꼴 토글 순환 함수 (기본 -> 궁서체 -> IBM ThinkPad -> 기본)
        let fontState = 0; // 0: 기본, 1: 궁서체, 2: ThinkPad
        function toggleFont() {
            fontState = (fontState + 1) % 3;
            const fontBtn = document.getElementById('fontBtn');

            document.body.classList.remove('gungsuh-font', 'thinkpad-font');

            if (fontState === 0) {
                fontBtn.innerText = "글꼴: 기본";
            } else if (fontState === 1) {
                document.body.classList.add('gungsuh-font');
                fontBtn.innerText = "글꼴: 궁서체";
            } else if (fontState === 2) {
                document.body.classList.add('thinkpad-font');
                fontBtn.innerText = "글꼴: IBM ThinkPad";
            }
        }

        // Win XP 테마 토글 함수
        function toggleXpMode() {
            document.body.classList.remove('dark-mode');
            document.body.classList.toggle('xp-mode');
        }

        // D-Day 날짜를 계산하고 화면에 출력하는 함수입니다
        function calculateDday() {
            const today = new Date();
            const targetDate = new Date(TARGET.date);

            today.setHours(0, 0, 0, 0);
            targetDate.setHours(0, 0, 0, 0);

            const differenceInTime = targetDate.getTime() - today.getTime();
            const differenceInDays = Math.ceil(differenceInTime / (1000 * 3600 * 24));

            document.getElementById("targetNameDisplay").innerText = TARGET.label;

            if (differenceInDays > 0) {
                document.getElementById("ddayDisplay").innerText = "D-" + differenceInDays;
            } else if (differenceInDays === 0) {
                document.getElementById("ddayDisplay").innerText = "D-DAY!";
            } else {
                document.getElementById("ddayDisplay").innerText = "D+" + Math.abs(differenceInDays);
            }
        }

        // 시간표 테이블 HTML을 동적으로 생성하고 화면에 출력하는 함수입니다
        function renderTimetable() {
            const tableElement = document.getElementById("timetable");

            let tableHTML = `<tr><th>시간</th>`;
            DAYS.forEach(day => {
                tableHTML += `<th>${day}</th>`;
            });
            tableHTML += `</tr>`;

            PERIODS.forEach(period => {
                tableHTML += `<tr>`;
                tableHTML += `<td>${period.time}</td>`;
                period.subjects.forEach(subject => {
                    tableHTML += `<td>${subject}</td>`;
                });
                tableHTML += `</tr>`;
            });

            tableElement.innerHTML = tableHTML;
        }

        // 현재 시간과 요일에 따라 교시를 강조하고 주말을 체크하는 함수입니다
        function updateTimetableHighlight() {
            const now = new Date();
            const dayOfWeek = now.getDay(); // 0: 일요일, 6: 토요일
            const timetableCard = document.querySelector('.timetable-card');
            
            let noticeEl = document.getElementById('weekendNotice');
            if (!noticeEl) {
                noticeEl = document.createElement('div');
                noticeEl.id = 'weekendNotice';
                noticeEl.className = 'weekend-notice';
                timetableCard.insertBefore(noticeEl, document.getElementById('timetable'));
            }

            // 주말 체크 (토요일 또는 일요일)
            if (dayOfWeek === 0 || dayOfWeek === 6) {
                noticeEl.innerText = "오늘은 쉬는 날";
                return;
            } else {
                noticeEl.innerText = "";
            }

            const currentMinutes = now.getHours() * 60 + now.getMinutes();
            const colIndex = dayOfWeek; // 월(1) ~ 금(5)

            const rows = document.querySelectorAll('#timetable tr');
            rows.forEach((row, rIndex) => {
                if (rIndex === 0) return;
                const cells = row.querySelectorAll('td');
                cells.forEach(cell => cell.classList.remove('current-period'));

                const timeStr = PERIODS[rIndex - 1].time;
                const [sh, sm] = timeStr.split(':').map(Number);
                const startMin = sh * 60 + sm;
                const endMin = startMin + 50; // 각 교시 50분 기준

                if (currentMinutes >= startMin && currentMinutes < endMin) {
                    if (cells[colIndex]) {
                        cells[colIndex].classList.add('current-period');
                    }
                }
            });
        }

        // 1분 방치 타이머 관련 감지 로직
        let idleTimer;
        const pauseOverlay = document.getElementById('pause-overlay');

        function resetIdleTimer() {
            // 활동 감지시 방치 화면 해제
            if (pauseOverlay.classList.contains('active')) {
                pauseOverlay.classList.remove('active');
            }
            // 기존 타이머 취소 후 1분(60초) 뒤 일시중지 타이머 다시 설정
            clearTimeout(idleTimer);
            idleTimer = setTimeout(() => {
                pauseOverlay.classList.add('active');
            }, 60000); // 60,000ms = 1분
        }

        // 사용자 입력 이벤트 수신기 등록 (마우스 이동, 클릭, 키보드, 터치)
        window.addEventListener('mousemove', resetIdleTimer);
        window.addEventListener('mousedown', resetIdleTimer);
        window.addEventListener('keydown', resetIdleTimer);
        window.addEventListener('touchstart', resetIdleTimer);
        window.addEventListener('scroll', resetIdleTimer);

        // 최초 방치 타이머 가동
        resetIdleTimer();

        // 페이지 로드 시 10초간 "새로운시작 (공짜)" 출력 후 제거하는 타이머
        window.addEventListener('DOMContentLoaded', () => {
            const startOverlay = document.getElementById('start-overlay');
            setTimeout(() => {
                if (startOverlay) {
                    startOverlay.classList.add('hidden');
                    // 애니메이션 끝난 후 완전 제거 (1초 후)
                    setTimeout(() => startOverlay.remove(), 1000);
                }
            }, 10000); // 10,000ms = 10초
        });

        // 페이지 로드 시 최초 실행
        calculateDday();
        renderTimetable();
        updateTimetableHighlight();

        // 1분(60000ms)마다 D-Day 및 시간표 강조 자동 갱신
        setInterval(() => {
            calculateDday();
            updateTimetableHighlight();
        }, 60000);

        // 1초마다 '삼성' 글자가 화면 내에서 랜덤한 위치로 이동
        setInterval(() => {
            const samsung = document.getElementById('floating-samsung');
            if (samsung) {
                const maxX = window.innerWidth - 80;
                const maxY = window.innerHeight - 50;
                const randomX = Math.floor(Math.random() * Math.max(0, maxX));
                const randomY = Math.floor(Math.random() * Math.max(0, maxY));
                samsung.style.left = randomX + 'px';
                samsung.style.top = randomY + 'px';
            }
        }, 1000);
    </script>
