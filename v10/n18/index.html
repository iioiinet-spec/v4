<!DOCTYPE html> <!-- 이 문서는 HTML5 웹 문서라는 것을 알려줍니다 -->
<html lang="ko"> <!-- 웹 문서의 언어를 한국어로 설정합니다 -->
<head> <!-- 웹페이지의 보이지 않는 설정 정보를 담는 곳입니다 -->
  <meta charset="UTF-8"> <!-- 글자가 깨지지 않도록 UTF-8 인코딩을 지정합니다 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 모바일 화면에서도 크기가 알맞게 나오도록 합니다 -->
  <title>단어장</title> <!-- 웹 브라우저 탭에 표시될 제목입니다 -->
  <link rel="preconnect" href="https://fonts.googleapis.com"> <!-- 구글 폰트 서버와 미리 연결을 준비합니다 -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> <!-- 폰트 파일 서버와 보안 연결을 준비합니다 -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet"> <!-- 구글 본명조 폰트를 불러옵니다 -->
  <style> <!-- 웹페이지의 디자인을 꾸미는 CSS 스타일 시작입니다 -->
    :root { /* 색상과 디자인 값을 변수로 모아두는 곳입니다 */
      --bg-color: #02faff; /* 배경 색상 (청록색) */
      --card-bg: #ffffff; /* 카드 및 상자 배경 색상 (하얀색) */
      --text-color: #000000; /* 글자 및 테두리 색상 (검은색) */
      --point-color: #0008ff; /* 버튼 강조 색상 (파란색) */
      --correct-color: #28a745; /* 정답 표시 색상 (초록색) */
      --wrong-color: #dc3545; /* 오답 표시 색상 (빨간색) */
      --card-radius: 0px; /* 카드와 버튼 모서리 둥글기 (직각 0px) */
      --font-family: 'Noto Serif KR', serif; /* 사용할 본명조 폰트 이름입니다 */
    } /* 변수 설정의 끝입니다 */
    body { /* 화면 전체의 기본 모양과 정렬을 정합니다 */
      font-family: var(--font-family); /* 본명조 폰트를 전체에 적용합니다 */
      background-color: var(--bg-color); /* 배경색을 변수에서 가져와 칠합니다 */
      color: var(--text-color); /* 기본 글자색을 변수에서 가져와 칠합니다 */
      display: flex; /* 요소들을 정렬하기 위해 플렉스를 씁니다 */
      flex-direction: column; /* 세로 방향으로 정렬합니다 */
      align-items: center; /* 가로 가운데 정렬을 합니다 */
      justify-content: center; /* 세로 가운데 정렬을 합니다 */
      min-height: 100vh; /* 화면 전체 높이를 채웁니다 */
      margin: 0; /* 바깥 여백을 없앱니다 */
      padding: 20px; /* 안쪽 여백을 줍니다 */
      box-sizing: border-box; /* 크기 계산이 편하도록 설정합니다 */
    } /* 본문 스타일 끝입니다 */
    .container { /* 전체 내용을 감싸는 상자입니다 */
      width: 100%; /* 너비를 가득 채웁니다 */
      max-width: 400px; /* 최대 너비를 400픽셀로 제한합니다 */
      text-align: center; /* 글자를 가운데로 정렬합니다 */
    } /* 상자 스타일 끝입니다 */
    .progress { /* 진도 표시 글자 스타일입니다 */
      font-size: 1.2rem; /* 글자 크기를 키웁니다 */
      font-weight: bold; /* 글자를 두껍게 만듭니다 */
      margin-bottom: 10px; /* 아래 카드와의 간격을 줍니다 */
    } /* 진도 스타일 끝입니다 */
    .card { /* 단어 카드의 전체 모양입니다 */
      width: 100%; /* 너비를 꽉 채웁니다 */
      height: 220px; /* 높이를 220픽셀로 고정합니다 */
      background-color: var(--card-bg); /* 배경색을 하얀색으로 칠합니다 */
      border: 2px solid var(--text-color); /* 검은색 테두리를 2픽셀 줍니다 */
      border-radius: var(--card-radius); /* 모서리를 0픽셀 직각으로 만듭니다 */
      display: flex; /* 내부 내용을 정렬합니다 */
      flex-direction: column; /* 세로로 정렬합니다 */
      justify-content: center; /* 세로 가운데 정렬합니다 */
      align-items: center; /* 가로 가운데 정렬합니다 */
      cursor: pointer; /* 마우스 커서를 손가락 모양으로 바꿉니다 */
      padding: 20px; /* 안쪽 여백을 줍니다 */
      box-sizing: border-box; /* 크기 계산을 맞춥니다 */
      position: relative; /* 버튼 위치를 잡기 위한 기준이 됩니다 */
    } /* 카드 스타일 끝입니다 */
    .audio-btns { /* 소리 듣기 버튼들을 모아둔 상자입니다 */
      position: absolute; /* 카드 안에서 위치를 고정합니다 */
      top: 10px; /* 위쪽에서 10픽셀 뗍니다 */
      right: 10px; /* 오른쪽에서 10픽셀 뗍니다 */
      display: flex; /* 버튼을 가로로 정렬합니다 */
      gap: 5px; /* 버튼 사이 간격을 줍니다 */
    } /* 소리 버튼 상자 끝입니다 */
    .icon-btn { /* 개별 소리 버튼 모양입니다 */
      background: none; /* 배경을 없앱니다 */
      border: 1px solid var(--text-color); /* 얇은 테두리를 줍니다 */
      border-radius: var(--card-radius); /* 모서리를 직각으로 합니다 */
      cursor: pointer; /* 손가락 커서를 만듭니다 */
      padding: 4px 8px; /* 안쪽 여백을 줍니다 */
      font-size: 0.9rem; /* 글자 크기를 정합니다 */
      font-family: var(--font-family); /* 폰트를 적용합니다 */
    } /* 소리 버튼 스타일 끝입니다 */
    .word { /* 카드 앞면 단어 글자 모양입니다 */
      font-size: 2rem; /* 단어 글자를 크게 만듭니다 */
      font-weight: bold; /* 두껍게 만듭니다 */
    } /* 단어 스타일 끝입니다 */
    .meaning, .example { /* 카드 뒷면 뜻과 예문을 숨기는 기본 설정입니다 */
      display: none; /* 화면에서 보이지 않게 감춥니다 */
    } /* 뒷면 숨기기 끝입니다 */
    .meaning { /* 뜻 글자 모양입니다 */
      font-size: 1.5rem; /* 크기를 정합니다 */
      font-weight: bold; /* 두껍게 합니다 */
      margin-bottom: 10px; /* 아래 예문과 간격을 줍니다 */
    } /* 뜻 스타일 끝입니다 */
    .example { /* 예문 글자 모양입니다 */
      font-size: 1rem; /* 크기를 정합니다 */
      color: #555555; /* 회색으로 글자색을 줍니다 */
    } /* 예문 스타일 끝입니다 */
    .card.flipped .word { /* 카드가 뒤집혔을 때 앞면 단어를 숨깁니다 */
      display: none; /* 화면에서 감춥니다 */
    } /* 앞면 숨김 끝입니다 */
    .card.flipped .meaning, 
    .card.flipped .example { /* 카드가 뒤집혔을 때 뒷면 뜻과 예문을 보여줍니다 */
      display: block; /* 화면에 나타나게 합니다 */
    } /* 뒷면 표시 끝입니다 */
    .controls { /* 이전, 다음 버튼 상자 모양입니다 */
      margin-top: 15px; /* 카드와 간격을 줍니다 */
      display: flex; /* 버튼을 가로로 정렬합니다 */
      justify-content: space-between; /* 양 끝으로 배치합니다 */
      gap: 10px; /* 사이 간격을 줍니다 */
    } /* 이동 버튼 상자 끝입니다 */
    .nav-btn { /* 이전, 다음 버튼 개별 모양입니다 */
      flex: 1; /* 크기를 똑같이 나누어 가집니다 */
      padding: 10px; /* 안쪽 여백을 줍니다 */
      background-color: var(--point-color); /* 파란색 배경을 칠합니다 */
      color: #ffffff; /* 글자를 하얀색으로 합니다 */
      border: none; /* 테두리를 없앱니다 */
      border-radius: var(--card-radius); /* 직각 모서리로 만듭니다 */
      font-size: 1rem; /* 글자 크기를 정합니다 */
      font-weight: bold; /* 두껍게 만듭니다 */
      cursor: pointer; /* 손가락 커서를 만듭니다 */
      font-family: var(--font-family); /* 폰트를 적용합니다 */
    } /* 이동 버튼 스타일 끝입니다 */
    .quiz-section { /* 퀴즈 상자 전체 모양입니다 */
      margin-top: 25px; /* 위쪽과 간격을 줍니다 */
      background-color: var(--card-bg); /* 하얀색 배경을 칠합니다 */
      border: 2px solid var(--text-color); /* 검은색 테두리를 줍니다 */
      border-radius: var(--card-radius); /* 직각 모서리로 만듭니다 */
      padding: 15px; /* 안쪽 여백을 줍니다 */
      box-sizing: border-box; /* 크기 계산을 맞춥니다 */
    } /* 퀴즈 상자 끝입니다 */
    .quiz-title { /* 퀴즈 질문 제목 모양입니다 */
      font-size: 1.1rem; /* 크기를 정합니다 */
      font-weight: bold; /* 두껍게 만듭니다 */
      margin-bottom: 10px; /* 아래 보기와 간격을 줍니다 */
    } /* 퀴즈 질문 끝입니다 */
    .quiz-options { /* 보기 버튼 4개를 배치하는 모양입니다 */
      display: grid; /* 격자 모양으로 정렬합니다 */
      grid-template-columns: 1fr 1fr; /* 2줄 2칸으로 나눕니다 */
      gap: 8px; /* 버튼 사이 간격을 줍니다 */
    } /* 보기 배치 끝입니다 */
    .option-btn { /* 보기 버튼 개별 모양입니다 */
      padding: 10px; /* 안쪽 여백을 줍니다 */
      background-color: #ffffff; /* 하얀색 배경을 줍니다 */
      border: 1px solid var(--text-color); /* 검은색 얇은 테두리를 줍니다 */
      border-radius: var(--card-radius); /* 직각 모서리로 만듭니다 */
      cursor: pointer; /* 손가락 커서를 만듭니다 */
      font-size: 0.95rem; /* 글자 크기를 정합니다 */
      font-family: var(--font-family); /* 폰트를 적용합니다 */
    } /* 보기 버튼 끝입니다 */
    .option-btn.correct { /* 정답을 맞혔을 때의 초록색 모양입니다 */
      background-color: var(--correct-color); /* 초록색 배경을 칠합니다 */
      color: #ffffff; /* 하얀색 글자로 바꿉니다 */
      border-color: var(--correct-color); /* 테두리도 초록색으로 합니다 */
    } /* 정답 스타일 끝입니다 */
    .option-btn.wrong { /* 오답을 골랐을 때의 빨간색 모양입니다 */
      background-color: var(--wrong-color); /* 빨간색 배경을 칠합니다 */
      color: #ffffff; /* 하얀색 글자로 바꿉니다 */
      border-color: var(--wrong-color); /* 테두리도 빨간색으로 합니다 */
    } /* 오답 스타일 끝입니다 */
    .quiz-score { /* 점수판 글자 모양입니다 */
      margin-top: 10px; /* 위 보기와 간격을 줍니다 */
      font-weight: bold; /* 두껍게 만듭니다 */
      font-size: 0.9rem; /* 크기를 정합니다 */
    } /* 점수판 끝입니다 */
  </style> <!-- 스타일 정의 끝입니다 -->
</head> <!-- 머리글 설정 끝입니다 -->
<body> <!-- 화면에 실제로 보여지는 본문 시작입니다 -->
  <div class="container"> <!-- 전체 화면을 가운데 정렬해 주는 상자입니다 -->
    <div class="progress" id="progress">1 / 20</div> <!-- 현재 몇 번째 단어인지 보여주는 곳입니다 -->
    <div class="card" id="card" onclick="flipCard()"> <!-- 누르면 뒤집히는 단어 카드입니다 -->
      <div class="audio-btns"> <!-- 발음 소리 듣기 버튼들을 모아둔 곳입니다 -->
        <button class="icon-btn" onclick="speakWord(event, 1)">🔊</button> <!-- 일반 속도로 읽어주는 버튼입니다 -->
        <button class="icon-btn" onclick="speakWord(event, 0.6)">🐢</button> <!-- 느린 속도로 읽어주는 거북이 버튼입니다 -->
      </div> <!-- 발음 버튼 모음 끝입니다 -->
      <div class="word" id="word">いち</div> <!-- 앞면에 보이는 단어 글자입니다 -->
      <div class="meaning" id="meaning">1</div> <!-- 뒷면에 보이는 뜻 글자입니다 -->
      <div class="example" id="example"></div> <!-- 뒷면에 보이는 예문 글자입니다 -->
    </div> <!-- 단어 카드 끝입니다 -->
    <div class="controls"> <!-- 이전, 다음 이동 버튼 상자입니다 -->
      <button class="nav-btn" onclick="prevCard()">이전</button> <!-- 이전 단어로 가는 버튼입니다 -->
      <button class="nav-btn" onclick="nextCard()">다음</button> <!-- 다음 단어로 가는 버튼입니다 -->
    </div> <!-- 이동 버튼 상자 끝입니다 -->
    <div class="quiz-section"> <!-- 퀴즈 전체를 감싸는 상자입니다 -->
      <div class="quiz-title">이 단어의 뜻은?</div> <!-- 퀴즈 질문 제목입니다 -->
      <div class="quiz-options" id="quizOptions"></div> <!-- 퀴즈 보기 4개가 들어갈 곳입니다 -->
      <div class="quiz-score" id="quizScore">맞힘: 0 | 틀림: 0</div> <!-- 맞은 개수와 틀린 개수 점수판입니다 -->
    </div> <!-- 퀴즈 상자 끝입니다 -->
  </div> <!-- 전체 컨테이너 상자 끝입니다 -->
  <script> <!-- 자바스크립트 동작 코드 시작입니다 -->
    // ==========================================
    // [여기만 고치세요] 단어 목록 데이터입니다.
    // ==========================================
    const WORDS = [ // 단어 정보를 담고 있는 배열입니다
      { en:'いち', ko:'1', ex:'' }, // 1번 단어 정보입니다
      { en:'に', ko:'2', ex:'' }, // 2번 단어 정보입니다
      { en:'さん', ko:'3', ex:'' }, // 3번 단어 정보입니다
      { en:'よん', ko:'4', ex:'' }, // 4번 단어 정보입니다
      { en:'ご', ko:'5', ex:'' }, // 5번 단어 정보입니다
      { en:'ろく', ko:'6', ex:'' }, // 6번 단어 정보입니다
      { en:'なな', ko:'7', ex:'' }, // 7번 단어 정보입니다
      { en:'はち', ko:'8', ex:'' }, // 8번 단어 정보입니다
      { en:'きゅう', ko:'9', ex:'' }, // 9번 단어 정보입니다
      { en:'じゅう', ko:'10', ex:'' }, // 10번 단어 정보입니다
      { en:'じゅういち', ko:'11', ex:'' }, // 11번 단어 정보입니다
      { en:'じゅうに', ko:'12', ex:'' }, // 12번 단어 정보입니다
      { en:'じゅうさん', ko:'13', ex:'' }, // 13번 단어 정보입니다
      { en:'じゅうよん', ko:'14', ex:'' }, // 14번 단어 정보입니다
      { en:'じゅうご', ko:'15', ex:'' }, // 15번 단어 정보입니다
      { en:'じゅうろく', ko:'16', ex:'' }, // 16번 단어 정보입니다
      { en:'じゅうなな', ko:'17', ex:'' }, // 17번 단어 정보입니다
      { en:'じゅうはち', ko:'18', ex:'' }, // 18번 단어 정보입니다
      { en:'じゅうきゅう', ko:'19', ex:'' }, // 19번 단어 정보입니다
      { en:'にじゅう', ko:'20', ex:'' }, // 20번 단어 정보입니다
    ]; // 단어 배열 끝입니다
    let currentIndex = 0; // 현재 보고 있는 단어의 번호입니다
    let correctCount = 0; // 퀴즈 맞힌 개수입니다
    let wrongCount = 0; // 퀴즈 틀린 개수입니다
    let quizAnswered = false; // 현재 퀴즈를 풀었는지 확인하는 변수입니다
    function renderCard() { // 카드의 내용과 진도, 퀴즈를 화면에 그려주는 함수입니다
      const currentWord = WORDS[currentIndex]; // 현재 단어 데이터를 가져옵니다
      document.getElementById('word').innerText = currentWord.en; // 앞면에 단어를 넣습니다
      document.getElementById('meaning').innerText = currentWord.ko; // 뒷면에 뜻을 넣습니다
      document.getElementById('example').innerText = currentWord.ex; // 뒷면에 예문을 넣습니다
      document.getElementById('progress').innerText = (currentIndex + 1) + ' / ' + WORDS.length; // 진도 표시를 갱신합니다
      document.getElementById('card').classList.remove('flipped'); // 카드를 앞면으로 돌립니다
      quizAnswered = false; // 퀴즈 풀기 상태를 초기화합니다
      renderQuiz(); // 퀴즈 보기를 새로 만듭니다
    } // renderCard 함수 끝입니다
    function flipCard() { // 카드를 누르면 뒤집어주는 함수입니다
      document.getElementById('card').classList.toggle('flipped'); // 뒤집기 효과 클래스를 켜고 끕니다
    } // flipCard 함수 끝입니다
    function prevCard() { // 이전 버튼을 누르면 실행되는 함수입니다
      if (currentIndex > 0) { // 첫 번째 단어가 아닐 때만 실행합니다
        currentIndex--; // 번호를 1 뺍니다
        renderCard(); // 화면을 새로 그립니다
      } // 조건문 끝입니다
    } // prevCard 함수 끝입니다
    function nextCard() { // 다음 버튼을 누르면 실행되는 함수입니다
      if (currentIndex < WORDS.length - 1) { // 마지막 단어가 아닐 때만 실행합니다
        currentIndex++; // 번호를 1 더합니다
        renderCard(); // 화면을 새로 그립니다
      } // 조건문 끝입니다
    } // nextCard 함수 끝입니다
    function speakWord(event, rate) { // 음성으로 단어를 읽어주는 함수입니다
      event.stopPropagation(); // 버튼을 눌러도 카드가 뒤집히지 않게 막습니다
      if ('speechSynthesis' in window) { // 브라우저가 음성 기능을 지원하는지 확인합니다
        window.speechSynthesis.cancel(); // 재생 중인 소리를 멈춥니다
        const text = WORDS[currentIndex].en; // 읽을 단어를 가져옵니다
        const utterance = new SpeechSynthesisUtterance(text); // 음성 객체를 만듭니다
        utterance.rate = rate; // 말하는 속도를 설정합니다
        window.speechSynthesis.speak(utterance); // 소리를 재생합니다
      } else { // 음성을 지원하지 않는 브라우저일 때입니다
        alert('이 브라우저는 소리를 지원하지 않아요'); // 안내 경고창을 띄웁니다
      } // 조건문 끝입니다
    } // speakWord 함수 끝입니다
    function renderQuiz() { // 퀴즈 보기 4개를 무작위로 만들어주는 함수입니다
      const optionsContainer = document.getElementById('quizOptions'); // 보기가 들어갈 자리를 가져옵니다
      optionsContainer.innerHTML = ''; // 이전 보기 버튼들을 비웁니다
      const currentWord = WORDS[currentIndex]; // 현재 단어 데이터를 가져옵니다
      const wrongCandidates = WORDS.filter((_, idx) => idx !== currentIndex); // 정답을 제외한 나머지 단어들을 모읍니다
      wrongCandidates.sort(() => Math.random() - 0.5); // 오답들을 섞습니다
      const selectedWrongs = wrongCandidates.slice(0, 3); // 오답 3개를 고릅니다
      const quizList = [currentWord, ...selectedWrongs]; // 정답과 오답을 합칩니다
      quizList.sort(() => Math.random() - 0.5); // 보기 4개를 섞습니다
      quizList.forEach(item => { // 보기 4개를 각각 버튼으로 만듭니다
        const btn = document.createElement('button'); // 새 버튼을 생성합니다
        btn.className = 'option-btn'; // 클래스 이름을 부여합니다
        btn.innerText = item.ko; // 뜻을 버튼 글자로 넣습니다
        btn.onclick = () => checkAnswer(btn, item.ko === currentWord.ko); // 클릭 시 정답 확인 함수를 연결합니다
        optionsContainer.appendChild(btn); // 보기 상자에 버튼을 넣습니다
      }); // forEach 끝입니다
    } // renderQuiz 함수 끝입니다
    function checkAnswer(selectedBtn, isCorrect) { // 정답을 확인하고 1초 뒤 다음 카드로 자동 이동하는 함수입니다
      if (quizAnswered) return; // 이미 풀었다면 무시합니다
      quizAnswered = true; // 풀었다고 표시합니다
      if (isCorrect) { // 정답인 경우입니다
        selectedBtn.classList.add('correct'); // 초록색으로 바꿉니다
        correctCount++; // 맞힌 개수를 올립니다
      } else { // 오답인 경우입니다
        selectedBtn.classList.add('wrong'); // 빨간색으로 바꿉니다
        wrongCount++; // 틀린 개수를 올립니다
      } // 조건문 끝입니다
      document.getElementById('quizScore').innerText = '맞힘: ' + correctCount + ' | 틀림: ' + wrongCount; // 점수판을 갱신합니다
      setTimeout(() => { // 정답/오답 확인 후 1초(1000ms) 뒤 다음 문제로 자동 넘어가게 합니다
        if (currentIndex < WORDS.length - 1) { // 마지막 단어가 아닐 경우 다음 단어로 이동합니다
          nextCard(); // 다음 카드로 넘어갑니다
        } // 조건문 끝입니다
      }, 1000); // 타임아웃 시간 설정 끝입니다
    } // checkAnswer 함수 끝입니다
    renderCard(); // 처음 실행할 때 첫 번째 단어와 퀴즈를 화면에 보여줍니다
  </script> <!-- 자바스크립트 끝입니다 -->
</body> <!-- 본문 끝입니다 -->
</html> <!-- 문서 끝입니다 -->
