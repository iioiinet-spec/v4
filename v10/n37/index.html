<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>중학 수학 인터랙티브 학습장</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --secondary-color: #f5f7fa;
            --text-color: #333;
            --accent-color: #ff6b6b;
            --border-color: #dcdde1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        }

        body {
            background-color: var(--secondary-color);
            color: var(--text-color);
            line-height: 1.7;
            padding: 20px;
        }

        .container {
            max-width: 1050px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--secondary-color);
            padding-bottom: 20px;
        }

        header h1 {
            color: var(--primary-color);
            font-size: 2rem;
            margin-bottom: 10px;
        }

        /* 상단 학년 선택 바 */
        .selector-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            background: var(--secondary-color);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .selector-bar select {
            padding: 8px 15px;
            font-size: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            outline: none;
            background: #fff;
        }

        .selector-bar button {
            padding: 8px 20px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .selector-bar button:hover {
            background-color: #357abd;
        }

        /* 메인 콘텐츠 레이아웃 */
        .main-content {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        /* 사이드바 (단원 목록) */
        .sidebar {
            background: #fafbfc;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            max-height: 550px;
            overflow-y: auto;
        }

        .sidebar h3 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #2c3e50;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .unit-item {
            padding: 10px 12px;
            margin-bottom: 8px;
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .unit-item:hover {
            background-color: #ebf3fc;
            border-color: var(--primary-color);
        }

        .unit-item.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .unit-item .chapter-num {
            font-size: 0.85rem;
            opacity: 0.8;
            display: block;
            margin-bottom: 3px;
        }

        .unit-item .chapter-title {
            font-size: 0.95rem;
            font-weight: bold;
        }

        /* 학습 내용 영역 */
        .content-panel {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 25px;
        }

        .content-panel h2 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 1.5rem;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 10px;
        }

        .section-box {
            margin-bottom: 25px;
        }

        .section-box h4 {
            color: var(--primary-color);
            font-size: 1.1rem;
            margin-bottom: 8px;
        }

        /* 형광펜 하이라이트 효과 */
        .highlight {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0) 60%, #fff3b0 40%);
            font-weight: bold;
            padding: 0 3px;
        }

        .formula-box {
            background: #f8f9fa;
            border-left: 4px solid var(--primary-color);
            padding: 12px 15px;
            margin: 10px 0;
            font-size: 1.05rem;
            font-weight: 500;
        }

        /* 진짜 수학 분수 스타일링 */
        .fraction {
            display: inline-flex;
            flex-direction: column;
            vertical-align: middle;
            text-align: center;
            font-size: 0.9em;
            padding: 0 2px;
        }

        .fraction .numerator {
            border-bottom: 1px solid #333;
            padding-bottom: 1px;
        }

        .fraction .denominator {
            padding-top: 1px;
        }

        /* 루트 기호 스타일링 */
        .sqrt {
            border-top: 1.5px solid #333;
            padding-top: 0px;
            padding-left: 2px;
            padding-right: 2px;
            display: inline-block;
        }
        .radical {
            font-size: 1.1em;
            margin-right: -2px;
        }

        /* 난이도 버튼 스타일 */
        .difficulty-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .diff-btn {
            padding: 6px 15px;
            border: 1px solid var(--border-color);
            background: #fff;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .diff-btn.active-diff {
            background-color: #2c3e50;
            color: white;
            border-color: #2c3e50;
        }

        /* 예제 문제 영역 */
        .quiz-box {
            background: #fff9f9;
            border: 1px solid #ffccd5;
            padding: 15px;
            border-radius: 6px;
            margin-top: 10px;
        }

        .quiz-box p {
            font-weight: bold;
            margin-bottom: 10px;
        }

        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 10px;
        }

        .quiz-options label {
            cursor: pointer;
            padding: 6px 10px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .quiz-options label:hover {
            background: #ffe3e6;
        }

        .quiz-btn {
            padding: 6px 15px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .quiz-result {
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>📚 중학 수학 인터랙티브 학습장</h1>
        <p>중 1 ~ 중 3 전 교육과정 완벽 수록! 난이도별 예제 문제로 실력을 다져보세요.</p>
    </header>

    <!-- 학년/학기 선택 바 -->
    <div class="selector-bar">
        <label for="grade-select"><strong>학년 선택:</strong></label>
        <select id="grade-select">
            <option value="1">중학교 1학년</option>
            <option value="2">중학교 2학년</option>
            <option value="3">중학교 3학년</option>
        </select>

        <label for="semester-select"><strong>학기 선택:</strong></label>
        <select id="semester-select">
            <option value="1">1학기</option>
            <option value="2">2학기</option>
        </select>

        <button onclick="changeGradeSemester()">학기 변경 적용</button>
    </div>

    <!-- 메인 콘텐츠 -->
    <div class="main-content">
        <!-- 단원 목록 사이드바 -->
        <div class="sidebar">
            <h3>단원 목록</h3>
            <div id="unit-list">
                <!-- 자바스크립트로 동적 생성 -->
            </div>
        </div>

        <!-- 상세 개념 및 문제 영역 -->
        <div class="content-panel" id="content-panel">
            <h2>단원을 선택해주세요</h2>
            <p>왼쪽 단원 목록에서 공부할 소단원을 클릭하면 <span class="highlight">핵심 개념</span>과 <span class="highlight">공식</span>, 난이도별 예제 문제가 나타납니다.</p>
        </div>
    </div>
</div>

<script>
    // 분수 생성 헬퍼
    function f(num, den) {
        return `<span class="fraction"><span class="numerator">${num}</span><span class="denominator">${den}</span></span>`;
    }
    // 루트 생성 헬퍼 (예: rt("2") -> √2)
    function rt(content) {
        return `<span class="radical">√</span><span class="sqrt">${content}</span>`;
    }

    // 전 학년 단원 및 난이도별 문제 데이터베이스

                    high: { q: "72에 가장 작은 자연수 x를 곱하여 어떤 자연수의 제곱이 되게 할 때, x의 값은?", options: ["2", "3", "5", "6"], answer: 0, exp: "72를 소인수분해하면 2³ × 3² 입니다. 지수를 짝수로 만들기 위해 2를 곱해야 합니다." }

                    mid: { q: "두 수 12와 18의 최대공약수는?", options: ["2", "3", "6", "9"], answer: 2, exp: "12와 18의 최대공약수는 6입니다." },
                    high: { q: "두 자연수 A와 12의 최대공약수가 6, 최소공배수가 36일 때, A의 값은?", options: ["12", "18", "24", "30"], answer: 1, exp: "(A × 12) = 6 × 36 이므로 A = 18 입니다." }

                    mid: { q: "다음 중 식을 잘못 나타낸 것은?", options: ["a × 3 = 3a", "x × (-1) = -x", "a ÷ 2 = " + f("a", "2"), "1 × x = 1x"], answer: 3, exp: "1과 문자의 곱에서 1은 생략하므로 x가 되어야 합니다." },
                    high: { q: "일차식 2(3x - 1) - 3(x - 2) 를 간단히 한 것은?", options: ["3x + 4", "3x + 8", "9x + 4", "3x - 8"], answer: 0, exp: "6x - 2 - 3x + 6 = 3x + 4 입니다." }
                }
            },
            {
                id: 106, unit: "III. 문자와 식", title: "2. 일차방정식의 풀이",

                    high: { q: "이차방정식 2x² - 4x - 1 = 0 의 해를 근의 공식으로 구하면?", options: ["x = " + f("2 ± " + rt("6"), "2"), "x = " + f("1 ± " + rt("3"), "2"), "x = 2 ± " + rt("3"), "x = " + f("-2 ± " + rt("6"), "2")], answer: 0, exp: "공식에 대입하면 x = " + f("4 ± " + rt("16 - 4(2)(-1)"), "4") + " = " + f("4 ± " + rt("24"), "4") + " = " + f("2 ± " + rt("6"), "2") + " 입니다." }
                }
            },
            {
                id: 305, unit: "IV. 이차함수", title: "1. 이차함수와 그래프",
                concept: "y = ax² + bx + c 포물선 그래프의 성질을 배웁니다.",
                formula: "💡 핵심 공식: y = a(x - p)² + q 의 꼭짓점은 (p, q)",
                quizzes: {
                    low: { q: "이차함수 y = x²의 그래프의 꼭짓점 좌표는?", options: ["(0, 0)", "(1, 1)", "(0, 1)", "(1, 0)"], answer: 0, exp: "기본형 그래프의 꼭짓점은 원점 (0,0)입니다." },
                    mid: { q: "이차함수 y = (x - 2)² + 3 의 꼭짓점 좌표는?", options: ["(2, 3)", "(-2, 3)", "(2, -3)", "(-2, -3)"], answer: 0, exp: "표준형에서 (p, q)가 꼭짓점이므로 (2, 3)입니다." },
                    high: { q: "이차함수 y = -2x² + 4x + 1 의 최댓값은?", options: ["1", "2", "3", "4"], answer: 2, exp: "완전제곱식으로 고치면 y = -2(x-1)² + 3 이므로 최댓값은 3입니다." }
                }
            }
        ],
        "3-2": [
            {
                id: 306, unit: "V. 삼각비", title: "1. 삼각비",
                concept: "직각삼각형에서의 삼각비(sin, cos, tan)와 특수각의 값을 배웁니다.",
                formula: "💡 핵심 공식: sin A = " + f("높이", "빗변") + ", cos A = " + f("밑변", "빗변"),
                quizzes: {
                    low: { q: "직각삼각형에서 sin 30°의 값은?", options: [f("1", "2"), f(rt("3"), "2"), f(rt("3"), "3"), "1"], answer: 0, exp: "특수각에 의해 sin 30° = 1/2 입니다." },
                    mid: { q: "tan 45°의 값은?", options: ["0", f("1", "2"), "1", rt("2")], answer: 2, exp: "tan 45°는 1입니다." },
                    high: { q: "직각삼각형에서 cos A = " + f("3", "5") + " 일 때, tan A의 값은?", options: [f("3", "4"), f("4", "3"), f("4", "5"), f("5", "3")], answer: 1, exp: "밑변이 3, 빗변이 5이므로 높이는 4입니다. 따라서 tan A = 4/3 입니다." }
                }
            },
            {
                id: 307, unit: "VI. 원의 성질", title: "1. 원과 직선",
                concept: "원주각의 성질과 접선 사이의 관계를 학습합니다.",
                formula: "💡 핵심 공식: 원주각 = " + f("1", "2") + " × (중심각)",
                quizzes: {
                    low: { q: "중심각이 80°일 때, 그 호에 대한 원주각의 크기는?", options: ["40°", "80°", "160°", "90°"], answer: 0, exp: "원주각은 중심각의 절반이므로 40°입니다." },
                    mid: { q: "한 원에서 반원에 대한 원주각의 크기는 항상 얼마인가?", options: ["45°", "90°", "180°", "360°"], answer: 1, exp: "반원의 중심각이 180°이므로 원주각은 항상 90°입니다." },
                    high: { q: "원 외부의 한 점 P에서 원에 은 두 접선의 길이가 같을 때, 접선의 길이가 5cm이면 다른 접선의 길이는?", options: ["2.5cm", "5cm", "10cm", "알 수 없다"], answer: 1, exp: "한 점에서 원에 그은 두 접선의 길이는 서로 같으므로 5cm입니다." }
                }
            },
            {
                id: 308, unit: "VII. 통계", title: "1. 대푯값과 산포도",
                concept: "대푯값(평균, 중앙값, 최빈값)과 산포도(분산, 표준편차)를 구합니다.",
                formula: "💡 핵심 공식: (분산) = " + f("편차제곱의 합", "전체 도수"),
                quizzes: {
                    low: { q: "자료 {2, 3, 4, 5, 6} 의 평균은?", options: ["3", "4", "5", "6"], answer: 1, exp: "모든 값을 더해 5로 나누면 4입니다." },
                    mid: { q: "자료 {1, 2, 3, 4, 100} 의 중앙값은?", options: ["3", "4", "22", "100"], answer: 0, exp: "크기 순서대로 나열했을 때 한가운데 있는 값은 3입니다." },
                    high: { q: "변량 {2, 4, 6, 8, 10}의 표준편차는? (단, 분산은 8)", options: ["2", "2" + rt("2"), "4", "8"], answer: 1, exp: "표준편차는 분산에 루트를 씌운 것이므로 √8 = 2√2 입니다." }
                }
            }
        ]
    };

    // 현재 선택된 단원의 데이터와 난이도 상태 저장 변수
    let currentItem = null;
    let currentDiff = 'mid'; // 기본값 중급

    function changeGradeSemester() {
        const grade = document.getElementById('grade-select').value;
        const semester = document.getElementById('semester-select').value;
        const key = `${grade}-${semester}`;

        const unitListEl = document.getElementById('unit-list');
        unitListEl.innerHTML = '';

        const units = mathData[key];

        if (!units || units.length === 0) {
            unitListEl.innerHTML = '<p style="color:#888; font-size:0.9rem;">등록된 단원이 없습니다.</p>';
            document.getElementById('content-panel').innerHTML = `<h2>준비 중</h2><p>해당 학기의 상세 콘텐츠를 준비 중입니다.</p>`;
            return;
        }

        units.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'unit-item';
            if (index === 0) div.classList.add('active');
            div.innerHTML = `
                <span class="chapter-num">${item.unit}</span>
                <span class="chapter-title">${item.title}</span>
            `;
            div.onclick = () => {
                document.querySelectorAll('.unit-item').forEach(el => el.classList.remove('active'));
                div.classList.add('active');
                currentItem = item;
                currentDiff = 'mid'; // 단원 바뀔 때 기본 중급으로 초기화
                renderContent(item, currentDiff);
            };
            unitListEl.appendChild(div);
        });

        currentItem = units[0];
        currentDiff = 'mid';
        renderContent(units[0], currentDiff);
    }

    // 콘텐츠 렌더링 함수 (난이도 선택 바 포함)
    function renderContent(item, diff) {
        currentItem = item;
        currentDiff = diff;
        const quiz = item.quizzes[diff];

        const panel = document.getElementById('content-panel');
        panel.innerHTML = `
            <h2>${item.title}</h2>
            <div class="section-box">
                <h4>📌 대단원: ${item.unit}</h4>
                <p><strong>소단원:</strong> ${item.title}</p>
            </div>
            <div class="section-box">
                <h4>💡 핵심 개념 및 상세 설명</h4>
                <p>${item.concept}</p>
            </div>
            <div class="section-box">
                <h4>📐 주요 공식 및 활용</h4>
                <div class="formula-box">${item.formula}</div>
            </div>
            <div class="section-box">
                <h4>✍️ 난이도별 실전 예제 문제</h4>
                <div class="difficulty-bar">
                    <button class="diff-btn ${diff === 'low' ? 'active-diff' : ''}" onclick="switchDifficulty('low')">🟢 하급 문제</button>
                    <button class="diff-btn ${diff === 'mid' ? 'active-diff' : ''}" onclick="switchDifficulty('mid')">🟡 중급 문제</button>
                    <button class="diff-btn ${diff === 'high' ? 'active-diff' : ''}" onclick="switchDifficulty('high')">🔴 상급 문제</button>
                </div>
                <div class="quiz-box">
                    <p>Q. ${quiz.q}</p>
                    <div class="quiz-options" id="options-${item.id}">
                        ${quiz.options.map((opt, idx) => `
                            <label><input type="radio" name="quiz-${item.id}" value="${idx}"> ${idx + 1}. ${opt}</label>
                        `).join('')}
                    </div>
                    <button class="quiz-btn" onclick="checkAnswer(${item.id}, ${quiz.answer}, \`${quiz.exp}\`)">정답 확인</button>
                    <div class="quiz-result" id="result-${item.id}"></div>
                </div>
            </div>
        `;
    }

    // 난이도 변경 버튼 클릭 함수
    function switchDifficulty(diff) {
        if (currentItem) {
            renderContent(currentItem, diff);
        }
    }

    // 정답 확인 함수
    function checkAnswer(id, correctIdx, explanation) {
        const radios = document.getElementsByName(`quiz-${id}`);
        let selected = -1;
        for (let i = 0; i < radios.length; i++) {
            if (radios[i].checked) {
                selected = parseInt(radios[i].value);
                break;
            }
        }

        const resultEl = document.getElementById(`result-${id}`);
        if (selected === -1) {
            resultEl.style.color = 'orange';
            resultEl.innerText = '정답을 선택해주세요!';
            return;
        }

        if (selected === correctIdx) {
            resultEl.style.color = 'green';
            resultEl.innerText = `🎉 정답입니다! \n해설: ${explanation}`;
        } else {
            resultEl.style.color = 'red';
            resultEl.innerText = `❌ 틀렸습니다. 다시 생각해 보세요!\n해설: ${explanation}`;
        }
    }

    // 페이지 로드 시 기본 중1-1 실행
    window.onload = function() {
        changeGradeSemester();
    };
</script>
