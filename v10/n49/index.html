<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로페셔널 영어 단어장</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

    <div class="max-w-3xl mx-auto px-4 py-8">
        <!-- 헤더 -->
        <header class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-indigo-600 mb-2">🚀 프로페셔널 영어 단어장</h1>
            <p class="text-slate-500 text-sm">단어 관리, 플래시카드 학습, 4지선다 퀴즈 및 발음 듣기 기능을 제공합니다.</p>
        </header>

        <!-- 탭 네비게이션 -->
        <div class="flex flex-wrap justify-center gap-2 mb-6">
            <button onclick="switchTab('list')" id="btn-list" class="px-4 py-2 rounded-xl font-semibold bg-indigo-600 text-white shadow-md transition text-sm">단어 관리</button>
            <button onclick="switchTab('study')" id="btn-study" class="px-4 py-2 rounded-xl font-semibold bg-white text-slate-600 border border-slate-200 shadow-sm transition text-sm">플래시카드</button>
            <button onclick="switchTab('quiz')" id="btn-quiz" class="px-4 py-2 rounded-xl font-semibold bg-white text-slate-600 border border-slate-200 shadow-sm transition text-sm">암기 퀴즈</button>
            <button onclick="switchTab('data')" id="btn-data" class="px-4 py-2 rounded-xl font-semibold bg-white text-slate-600 border border-slate-200 shadow-sm transition text-sm">데이터 백업</button>
        </div>

        <!-- 1. 단어 관리 탭 -->
        <div id="tab-list" class="space-y-6">
            <!-- 단어 입력 폼 -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <h2 class="text-lg font-bold mb-4 text-slate-700">새 단어 추가하기</h2>
                <form id="word-form" onsubmit="addWord(event)" class="space-y-4">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 mb-1">영단어</label>
                            <input type="text" id="english" required placeholder="예: meticulous" class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 mb-1">뜻</label>
                            <input type="text" id="meaning" required placeholder="예: 꼼꼼한, 세심한" class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">예문 (선택)</label>
                        <input type="text" id="example" placeholder="예: He is meticulous about details." class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition shadow-md">단어 저장</button>
                </form>
            </div>

            <!-- 단어 목록 및 검색 -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <div class="flex flex-col sm:flex-row justify-between items-center mb-4 gap-3">
                    <h2 class="text-lg font-bold text-slate-700">단어 목록 (<span id="word-count">0</span>개)</h2>
                    <input type="text" id="search" oninput="renderWords()" placeholder="단어 또는 뜻 검색..." class="px-4 py-1.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 w-full sm:w-56">
                </div>
                <div id="word-list" class="divide-y divide-slate-100 max-h-[400px] overflow-y-auto pr-1">
                    <!-- 동적 렌더링 -->
                </div>
            </div>
        </div>

        <!-- 2. 플래시카드 학습 탭 -->
        <div id="tab-study" class="hidden space-y-6">
            <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-100 text-center min-h-[350px] flex flex-col justify-between">
                <div class="flex justify-between items-center text-xs text-slate-400 font-medium">
                    <span id="card-progress">0 / 0</span>
                    <button onclick="speakCurrentWord()" class="bg-indigo-50 text-indigo-600 px-3 py-1 rounded-lg font-bold hover:bg-indigo-100 transition">🔊 발음 듣기</button>
                </div>
                
                <!-- 플래시카드 본체 -->
                <div onclick="flipCard()" id="flashcard" class="my-6 p-8 bg-indigo-50/50 border-2 border-dashed border-indigo-200 rounded-2xl cursor-pointer min-h-[160px] flex flex-col items-center justify-center transition transform hover:scale-[1.01]">
                    <p id="card-front" class="text-3xl font-bold text-indigo-900 mb-2">등록된 단어가 없습니다</p>
                    <p id="card-back" class="text-lg text-slate-600 hidden font-medium mt-2"></p>
                    <p id="card-example" class="text-xs text-slate-400 italic hidden mt-3"></p>
                </div>

                <div class="flex justify-center gap-3">
                    <button onclick="prevCard()" class="px-5 py-2.5 bg-slate-100 text-slate-700 rounded-xl font-semibold hover:bg-slate-200 transition">이전</button>
                    <button onclick="toggleMasterStatus()" id="master-btn" class="px-5 py-2.5 bg-emerald-50 text-emerald-600 rounded-xl font-semibold hover:bg-emerald-100 transition">암기 완료 체크</button>
                    <button onclick="nextCard()" class="px-5 py-2.5 bg-indigo-600 text-white rounded-xl font-semibold hover:bg-indigo-700 transition shadow-md">다음</button>
                </div>
            </div>
        </div>

        <!-- 3. 암기 퀴즈 탭 -->
        <div id="tab-quiz" class="hidden space-y-6">
            <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-100 text-center">
                <div id="quiz-area">
                    <h2 class="text-xl font-bold text-slate-700 mb-4">뜻 맞추기 퀴즈</h2>
                    <div id="quiz-content" class="mb-6">
                        <p class="text-sm text-slate-400 mb-2">다음 단어의 뜻은 무엇일까요?</p>
                        <p id="quiz-word" class="text-3xl font-extrabold text-indigo-600 mb-6">-</p>
                        <div id="quiz-options" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <!-- 선택지 버튼들 -->
                        </div>
                    </div>
                    <div id="quiz-result" class="text-lg font-bold mb-4 hidden"></div>
                    <button onclick="startQuiz()" id="quiz-restart-btn" class="px-6 py-2.5 bg-indigo-600 text-white rounded-xl font-semibold hover:bg-indigo-700 transition shadow-md">퀴즈 시작 / 재시작</button>
                </div>
            </div>
        </div>

        <!-- 4. 데이터 백업 탭 -->
        <div id="tab-data" class="hidden space-y-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-4">
                <h2 class="text-lg font-bold text-slate-700">데이터 내보내기 / 가져오기</h2>
                <p class="text-sm text-slate-500">작성한 단어장을 파일로 백업하거나 다른 기기에서 불러올 수 있습니다.</p>
                <div class="flex gap-4 pt-2">
                    <button onclick="exportData()" class="px-5 py-2.5 bg-slate-800 text-white rounded-xl font-semibold hover:bg-slate-700 transition text-sm">데이터 백업 (JSON)</button>
                    <label class="px-5 py-2.5 bg-indigo-50 text-indigo-600 rounded-xl font-semibold hover:bg-indigo-100 transition text-sm cursor-pointer">
                        데이터 복구
                        <input type="file" accept=".json" onchange="importData(event)" class="hidden">
                    </label>
                </div>
            </div>
        </div>
    </div>

    <!-- 스크립트 로직 -->
    <script>
        let words = JSON.parse(localStorage.getItem('my_words_pro')) || [
            { id: 1, english: 'meticulous', meaning: '꼼꼼한, 세심한', example: 'He is meticulous about details.', mastered: false },
            { id: 2, english: 'pragmatic', meaning: '실용적인', example: 'We need a pragmatic approach.', mastered: false },
            { id: 3, english: 'ambiguous', meaning: '모호한, 애매한', example: 'His answer was rather ambiguous.', mastered: false }
        ];

        let currentTab = 'list';
        let currentIndex = 0;
        let isFlipped = false;
        let quizCurrent = null;

        function saveToStorage() {
            localStorage.setItem('my_words_pro', JSON.stringify(words));
        }

        function switchTab(tab) {
            currentTab = tab;
            const tabs = ['list', 'study', 'quiz', 'data'];
            tabs.forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`btn-${t}`).className = "px-4 py-2 rounded-xl font-semibold bg-white text-slate-600 border border-slate-200 shadow-sm transition text-sm";
            });

            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            document.getElementById(`btn-${tab}`).className = "px-4 py-2 rounded-xl font-semibold bg-indigo-600 text-white shadow-md transition text-sm";

            if (tab === 'study') initStudy();
            if (tab === 'quiz') startQuiz();
            if (tab === 'list') renderWords();
        }

        function addWord(e) {
            e.preventDefault();
            const english = document.getElementById('english').value.trim();
            const meaning = document.getElementById('meaning').value.trim();
            const example = document.getElementById('example').value.trim();

            words.push({ id: Date.now(), english, meaning, example, mastered: false });
            saveToStorage();
            document.getElementById('word-form').reset();
            renderWords();
        }

        function deleteWord(id) {
            words = words.filter(w => w.id !== id);
            saveToStorage();
            renderWords();
        }

        function toggleMaster(id) {
            const word = words.find(w => w.id === id);
            if (word) {
                word.mastered = !word.mastered;
                saveToStorage();
                renderWords();
            }
        }

        function renderWords() {
            const listEl = document.getElementById('word-list');
            const countEl = document.getElementById('word-count');
            const searchKeyword = document.getElementById('search').value.toLowerCase();

            const filtered = words.filter(w => 
                w.english.toLowerCase().includes(searchKeyword) || 
                w.meaning.includes(searchKeyword)
            );

            countEl.textContent = words.length;

            if (filtered.length === 0) {
                listEl.innerHTML = `<p class="text-center text-slate-400 py-6 text-sm">검색 결과가 없거나 저장된 단어가 없습니다.</p>`;
                return;
            }

            listEl.innerHTML = filtered.map(w => `
                <div class="py-3 flex items-center justify-between group">
                    <div class="flex items-start gap-3">
                        <input type="checkbox" ${w.mastered ? 'checked' : ''} onchange="toggleMaster(${w.id})" class="mt-1.5 w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500 cursor-pointer">
                        <div>
                            <div class="flex items-baseline gap-2">
                                <span class="font-bold ${w.mastered ? 'line-through text-slate-400' : 'text-slate-800'}">${w.english}</span>
                                <span class="text-sm text-slate-500">${w.meaning}</span>
                            </div>
                            ${w.example ? `<p class="text-xs text-slate-400 mt-0.5 italic">"${w.example}"</p>` : ''}
                        </div>
                    </div>
                    <button onclick="deleteWord(${w.id})" class="text-slate-300 hover:text-red-500 font-bold px-2 py-1 text-sm transition">삭제</button>
                </div>
            `).join('');
        }

        // 플래시카드 로직
        function initStudy() {
            currentIndex = 0;
            isFlipped = false;
            updateCardUI();
        }

        function updateCardUI() {
            const frontEl = document.getElementById('card-front');
            const backEl = document.getElementById('card-back');
            const exampleEl = document.getElementById('card-example');
            const progressEl = document.getElementById('card-progress');
            const masterBtn = document.getElementById('master-btn');

            if (words.length === 0) {
                frontEl.textContent = "등록된 단어가 없습니다.";
                backEl.textContent = "";
                exampleEl.classList.add('hidden');
                progressEl.textContent = "0 / 0";
                return;
            }

            progressEl.textContent = `${currentIndex + 1} / ${words.length}`;
            const current = words[currentIndex];

            masterBtn.textContent = current.mastered ? "✔️ 암기 완료됨" : "암기 완료 체크";
            masterBtn.className = current.mastered 
                ? "px-5 py-2.5 bg-emerald-600 text-white rounded-xl font-semibold hover:bg-emerald-700 transition" 
                : "px-5 py-2.5 bg-emerald-50 text-emerald-600 rounded-xl font-semibold hover:bg-emerald-100 transition";

            frontEl.textContent = current.english;

            if (!isFlipped) {
                backEl.classList.add('hidden');
                exampleEl.classList.add('hidden');
            } else {
                backEl.textContent = current.meaning;
                backEl.classList.remove('hidden');
                if (current.example) {
                    exampleEl.textContent = `[예문] ${current.example}`;
                    exampleEl.classList.remove('hidden');
                } else {
                    exampleEl.classList.add('hidden');
                }
            }
        }

        function flipCard() {
            if (words.length === 0) return;
            isFlipped = !isFlipped;
            updateCardUI();
        }

        function nextCard() {
            if (words.length === 0) return;
            isFlipped = false;
            currentIndex = (currentIndex + 1) % words.length;
            updateCardUI();
        }

        function prevCard() {
            if (words.length === 0) return;
            isFlipped = false;
            currentIndex = (currentIndex - 1 + words.length) % words.length;
            updateCardUI();
        }

        function toggleMasterStatus() {
            if (words.length === 0) return;
            words[currentIndex].mastered = !words[currentIndex].mastered;
            saveToStorage();
            updateCardUI();
        }

        function speakCurrentWord() {
            if (words.length === 0) return;
            const text = words[currentIndex].english;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            window.speechSynthesis.speak(utterance);
        }

        // 퀴즈 로직
        function startQuiz() {
            if (words.length < 4) {
                document.getElementById('quiz-word').textContent = "단어가 4개 이상 필요합니다!";
                document.getElementById('quiz-options').innerHTML = "";
                document.getElementById('quiz-result').classList.add('hidden');
                return;
            }

            document.getElementById('quiz-result').classList.add('hidden');
            // 랜덤 단어 선택
            quizCurrent = words[Math.floor(Math.random() * words.length)];
            document.getElementById('quiz-word').textContent = quizCurrent.english;

            // 오답 3개 + 정답 1개 섞기
            let options = [quizCurrent.meaning];
            while (options.length < 4) {
                let randomWord = words[Math.floor(Math.random() * words.length)];
                if (!options.includes(randomWord.meaning)) {
                    options.push(randomWord.meaning);
                }
            }
            options.sort(() => Math.random() - 0.5);

            const optionsEl = document.getElementById('quiz-options');
            optionsEl.innerHTML = options.map(opt => `
                <button onclick="checkQuiz('${opt.replace(/'/g, "\\'")}')" class="p-4 bg-slate-50 border border-slate-200 rounded-xl font-medium text-slate-700 hover:bg-indigo-50 hover:border-indigo-200 transition text-sm">
                    ${opt}
                </button>
            `).join('');
        }

        function checkQuiz(selectedMeaning) {
            const resultEl = document.getElementById('quiz-result');
            resultEl.classList.remove('hidden');
            if (selectedMeaning === quizCurrent.meaning) {
                resultEl.textContent = "🎉 정답입니다!";
                resultEl.className = "text-lg font-bold mb-4 text-emerald-600";
            } else {
                resultEl.textContent = `❌ 틀렸습니다! 정답은 '${quizCurrent.meaning}' 입니다.`;
                resultEl.className = "text-lg font-bold mb-4 text-rose-500";
            }
            setTimeout(startQuiz, 1500); // 1.5초 후 다음 퀴즈
        }

        // 백업 및 복구 로직
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(words));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "my_english_words.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        words = imported;
                        saveToStorage();
                        renderWords();
                        alert("성공적으로 데이터를 불러왔습니다!");
                    } else {
                        alert("올바르지 않은 파일 형식입니다.");
                    }
                } catch (err) {
                    alert("파일을 파싱하는 중 오류가 발생했습니다.");
                }
            };
            reader.readAsText(file);
        }

        // 초기 실행
        renderWords();
    </script>
</body>
</html>
