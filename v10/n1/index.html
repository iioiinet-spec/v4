<!DOCTYPE html>
<!-- HTML 문서 시작 -->
<html lang="ko">
<!-- 문서 언어를 한국어로 지정 -->
<head>
  <!-- 문자의 인코딩을 UTF-8로 설정 -->
  <meta charset="UTF-8">
  <!-- 화면 크기에 맞게 반응형 페이지로 설정 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 웹페이지 제목 설정 -->
  <title>우주 영어 단어장 & 퀴즈 아케이드</title>
  <!-- 구글 폰트(나눔손글씨 펜, 개구) 불러오기 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
  <!-- CSS 스타일 시작 -->
  <style>
    /* CSS 변수 선언 영역 */
    :root {
      --bg-color: #080a14; /* 전체 배경색 (어두운 우주) */
      --card-bg: #121630; /* 단어 카드 및 상자 배경색 */
      --text-color: #dbe4ff; /* 기본 글자색 (밝은 파란빛 흰색) */
      --point-color: #4ef0c8; /* 포인트 강조 색상 (민트) */
      --button-bg: #1d234a; /* 버튼 기본 배경색 */
      --button-hover: #2d3875; /* 버튼 마우스 올렸을 때 색상 */
      --card-radius: 14px; /* 카드 모서리 둥글기 */
      --accent-yellow: #ffd166; /* 보조 포인트 색상 (노랑) */
      --accent-pink: #ff6b8b; /* 보조 포인트 색상 (분홍) */
    }

    /* 화면 전체의 기본 모양 정하기 */
    * {
      box-sizing: border-box; /* 패딩 포함 크기 계산 */
    }

    body {
      background-color: var(--bg-color); /* 전체 배경색 적용 */
      color: var(--text-color); /* 기본 글자색 적용 */
      font-family: 'Nanum Pen Script', cursive; /* 기본 글꼴로 나눔손글씨 펜 지정 */
      display: flex; /* 화면 가운데 정렬을 위한 레이아웃 설정 */
      flex-direction: column; /* 요소들을 위에서 아래로 배치 */
      align-items: center; /* 가로 가운데 정렬 */
      justify-content: flex-start; /* 상단부터 시작 */
      min-height: 100vh; /* 화면 높이를 전체 크기로 설정 */
      margin: 0; /* 창 테두리 여백 제거 */
      padding: 15px; /* 내부 여백 설정 */
      overflow-x: hidden; /* 가로 스크롤 방지 */
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(78, 240, 200, 0.08) 0%, transparent 25%),
        radial-gradient(circle at 85% 80%, rgba(255, 107, 139, 0.08) 0%, transparent 25%);
    }

    /* 영어 글자 전용 글꼴 클래스 */
    .en-text {
      font-family: 'Gaegu', cursive; /* 영어 글꼴로 개구 지정 */
    }

    /* 상단 대시보드 (레벨 및 경험치 표시) */
    .dashboard {
      width: 100%;
      max-width: 380px;
      background: var(--card-bg);
      border: 2px solid var(--point-color);
      border-radius: var(--card-radius);
      padding: 10px 15px;
      margin-bottom: 15px;
      box-shadow: 0 0 15px rgba(78, 240, 200, 0.15);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .dash-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.4rem;
    }

    .level-badge {
      background: var(--point-color);
      color: var(--bg-color);
      padding: 2px 10px;
      border-radius: 12px;
      font-weight: bold;
      font-family: 'Gaegu', cursive;
    }

    .streak-badge {
      color: var(--accent-yellow);
      font-size: 1.3rem;
    }

    /* 경험치 바 */
    .exp-bar-bg {
      width: 100%;
      height: 12px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid rgba(78, 240, 200, 0.3);
    }

    .exp-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--point-color), var(--accent-yellow));
      transition: width 0.4s ease;
    }

    /* 상단 제목 스타일 */
    h1 {
      color: var(--point-color); /* 포인트 민트색 사용 */
      font-size: 2.5rem; /* 제목 글자 크기 */
      margin: 5px 0 15px 0; /* 위아래 여백 */
      text-shadow: 0 0 12px rgba(78, 240, 200, 0.4); /* 글자 빛나는 효과 */
      text-align: center;
    }

    /* 메뉴 버튼들을 감싸는 상자 */
    .menu-container {
      display: flex;
      gap: 10px;
      margin-bottom: 15px; /* 아래쪽 여백 */
    }

    /* 일반 버튼 모양 정의 */
    button {
      background-color: var(--button-bg); /* 버튼 배경색 */
      color: var(--point-color); /* 버튼 글자색 */
      border: 2px solid var(--point-color); /* 테두리 민트색 */
      padding: 8px 16px; /* 버튼 안쪽 여백 */
      font-size: 1.4rem; /* 버튼 글자 크기 */
      border-radius: var(--card-radius); /* 모서리 둥글기 */
      cursor: pointer; /* 마우스 올리면 손가락 모양으로 변경 */
      font-family: 'Nanum Pen Script', cursive; /* 버튼 글꼴 지정 */
      transition: all 0.2s; /* 부드러운 애니메이션 효과 */
      user-select: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    /* 버튼에 마우스 올렸을 때 모양 */
    button:hover {
      background-color: var(--button-hover); /* 마우스 올렸을 때 배경색 */
      transform: translateY(-2px); /* 약간 위로 떠오르는 효과 */
      box-shadow: 0 4px 10px rgba(78, 240, 200, 0.2);
    }

    button:active {
      transform: translateY(0);
    }

    button.active-tab {
      background-color: var(--point-color);
      color: var(--bg-color);
      font-weight: bold;
    }

    /* 3D 효과를 위한 카드의 겉 틀 */
    .card-container {
      width: 320px; /* 카드 가로 크기 */
      height: 220px; /* 카드 세로 크기 */
      perspective: 1000px; /* 3D 뒤집기 효과 입체감 설정 */
      margin-bottom: 15px; /* 아래쪽 여백 */
    }

    /* 실제 뒤집히는 카드 상자 */
    .card {
      width: 100%; /* 너비 100% */
      height: 100%; /* 높이 100% */
      position: relative; /* 위치 기준점 설정 */
      transform-style: preserve-3d; /* 3D 효과 유지 */
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); /* 카드 뒤집히는 시간 */
      cursor: pointer; /* 마우스 올리면 손가락 모양 */
    }

    /* 카드가 뒤집혔을 때 동작 */
    .card.flipped {
      transform: rotateY(180deg); /* Y축 기준 180도 회전 */
    }

    /* 카드의 앞면과 뒷면 공통 스타일 */
    .card-front, .card-back {
      position: absolute; /* 카드 전체에 채우기 */
      width: 100%; /* 너비 100% */
      height: 100%; /* 높이 100% */
      backface-visibility: hidden; /* 뒤집혔을 때 반대면 숨기기 */
      background-color: var(--card-bg); /* 카드 배경색 */
      border: 2px solid var(--point-color); /* 카드 테두리 민트색 */
      border-radius: var(--card-radius); /* 카드 모서리 둥글기 */
      display: flex; /* 내용 정렬 레이아웃 */
      flex-direction: column; /* 세로 방향 배치 */
      align-items: center; /* 가로 가운데 정렬 */
      justify-content: center; /* 세로 가운데 정렬 */
      box-shadow: 0 8px 20px rgba(0,0,0,0.5), inset 0 0 15px rgba(78, 240, 200, 0.05); /* 카드 그림자 및 네온 효과 */
      box-sizing: border-box; /* 패딩 포함 크기 계산 */
      padding: 20px; /* 안쪽 여백 */
    }

    /* 카드 뒷면 개별 스타일 */
    .card-back {
      transform: rotateY(180deg); /* 시작할 때 미리 180도 뒤집어두기 */
      border-color: var(--accent-yellow);
    }

    /* 카드 안의 영어 단어 글자 */
    .word-text {
      font-size: 3.2rem; /* 단어 글자 크기 */
      color: var(--point-color); /* 민트색 적용 */
      margin-bottom: 5px; /* 아래쪽 여백 */
      font-family: 'Gaegu', cursive; /* 영어 글꼴 개구 적용 */
      text-shadow: 0 0 10px rgba(78, 240, 200, 0.3);
    }

    /* 뒤집기 안내 메시지 */
    .flip-hint {
      font-size: 1.1rem;
      color: rgba(219, 228, 255, 0.5);
      position: absolute;
      bottom: 10px;
    }

    /* 카드 안의 한글 뜻 글자 */
    .meaning-text {
      font-size: 2.4rem; /* 뜻 글자 크기 */
      color: var(--accent-yellow); /* 노란색 글자 */
    }

    /* 카드 안의 예문 글자 */
    .example-text {
      font-size: 1.4rem; /* 예문 글자 크기 */
      color: #a0aed0; /* 밝은 회색 계열 */
      margin-top: 10px; /* 위쪽 여백 */
      text-align: center;
    }

    /* 카드 내부 음성 출력 스피커 버튼 */
    .speaker-btn {
      position: absolute; /* 카드 구석에 고정 배치 */
      top: 12px; /* 위쪽 위치 */
      right: 12px; /* 오른쪽 위치 */
      background: rgba(78, 240, 200, 0.1); /* 배경 투명 민트 */
      border: 1px solid var(--point-color); /* 테두리 */
      font-size: 1.3rem; /* 아이콘 크기 */
      cursor: pointer; /* 마우스 커서 손가락 모양 */
      padding: 6px 10px; /* 여백 */
      border-radius: 50%;
    }

    .speaker-btn:hover {
      background: var(--point-color);
      color: var(--bg-color);
    }

    /* 이전/다음 버튼과 진도 표시를 담는 하단 조작 상자 */
    .controls {
      display: flex; /* 가로로 요소 배치 */
      align-items: center; /* 세로 중앙 정렬 */
      gap: 15px; /* 요소들 간격 */
    }

    /* 진도 표시 텍스트 */
    .progress {
      font-size: 1.6rem; /* 진도 글자 크기 */
      color: var(--text-color); /* 기본 글자색 */
      font-family: 'Gaegu', cursive; /* 숫자 표시용 개구 폰트 */
    }

    /* 퀴즈 전체 화면 영역 */
    .quiz-container {
      display: none; /* 기본적으로 숨겨두기 */
      width: 320px; /* 퀴즈 상자 가로 크기 */
      background-color: var(--card-bg); /* 배경색 */
      border: 2px solid var(--point-color); /* 테두리 */
      border-radius: var(--card-radius); /* 모서리 둥글기 */
      padding: 20px; /* 안쪽 여백 */
      box-shadow: 0 8px 20px rgba(0,0,0,0.5); /* 그림자 효과 */
      box-sizing: border-box; /* 패딩 포함 계산 */
      text-align: center; /* 텍스트 가운데 정렬 */
      position: relative;
    }

    /* 퀴즈 문제 질문 텍스트 */
    .quiz-question {
      font-size: 2.1rem; /* 문제 글자 크기 */
      margin-bottom: 20px; /* 아래쪽 여백 */
      word-break: keep-all; /* 단어 단위로 줄바꿈 */
      line-height: 1.3;
    }

    /* 퀴즈 보기 버튼들을 쌓아두는 상자 */
    .quiz-options {
      display: flex; /* 요소 배치 */
      flex-direction: column; /* 세로로 늘어서기 */
      gap: 10px; /* 보기 버튼 사이 간격 */
    }

    /* OX 퀴즈용 가로 배치 상자 */
    .quiz-options.ox-layout {
      flex-direction: row;
      justify-content: center;
    }

    .quiz-options.ox-layout button {
      flex: 1;
      font-size: 2.2rem;
      padding: 12px;
    }

    /* 퀴즈 주관식 입력창 */
    .quiz-input {
      width: 100%; /* 입력창 너비 */
      padding: 10px; /* 안쪽 여백 */
      font-size: 1.8rem; /* 글자 크기 */
      border-radius: var(--card-radius); /* 모서리 둥글기 */
      border: 2px solid var(--point-color); /* 민트색 테두리 */
      background-color: var(--bg-color); /* 어두운 배경색 */
      color: var(--text-color); /* 글자색 */
      text-align: center; /* 입력 텍스트 가운데 정렬 */
      font-family: 'Gaegu', cursive; /* 개구 글꼴 사용 */
      margin-bottom: 10px; /* 아래쪽 여백 */
      outline: none;
    }

    .quiz-input:focus {
      box-shadow: 0 0 10px rgba(78, 240, 200, 0.5);
    }

    /* 퀴즈 정답/오답 결과 텍스트 */
    .quiz-result {
      margin-top: 15px; /* 위쪽 여백 */
      font-size: 1.8rem; /* 결과 글자 크기 */
      min-height: 35px; /* 고정 높이 */
      font-weight: bold;
    }

    /* 폭죽/파티클 애니메이션 용 Canvas */
    #particle-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 999;
    }

    /* 맞췄을 때 튀어오르는 애니메이션 */
    @keyframes bounce {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    .bounce-effect {
      animation: bounce 0.4s ease;
    }

    /* 틀렸을 때 흔들리는 애니메이션 */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    .shake-effect {
      animation: shake 0.4s ease;
    }
  </style>
  <!-- CSS 스타일 끝 -->
</head>
<body>

  <!-- 파티클 캔버스 레이어 -->
  <canvas id="particle-canvas"></canvas>

  <!-- 상단 게이머 대시보드 -->
  <div class="dashboard">
    <div class="dash-header">
      <div>
        <span>단계: </span>
        <span class="level-badge" id="user-level">LV.1 탐험가</span>
      </div>
      <div class="streak-badge" id="user-score">점수: 0</div>
    </div>
    <div class="exp-bar-bg">
      <div class="exp-bar-fill" id="exp-fill"></div>
    </div>
  </div>

  <!-- 웹페이지 최상단 제목 -->
  <h1 class="en-text">🚀 Space Word Arcade</h1>

  <!-- 학습 모드 / 퀴즈 모드 전환 버튼 상자 -->
  <div class="menu-container">
    <!-- 단어장으로 돌아오는 버튼 -->
    <button id="btn-mode-study" class="active-tab" onclick="showStudyMode()">📖 단어장 카드</button>
    <!-- 퀴즈 게임을 시작하는 버튼 -->
    <button id="btn-mode-quiz" onclick="startQuizMode()">🎮 퀴즈 서바이벌</button>
  </div>

  <!-- [1] 단어 학습 모드 화면 영역 -->
  <div id="study-section">
    <!-- 단어 카드를 감싸는 상자 -->
    <div class="card-container">
      <!-- 클릭하면 뒤집히는 실제 카드 -->
      <div class="card" id="flashcard" onclick="flipCard()">
        <!-- 카드의 앞면 (영어 단어 표시) -->
        <div class="card-front">
          <!-- 영어 단어를 들려주는 스피커 버튼 -->
          <button class="speaker-btn" onclick="speakWord(event)">🔊</button>
          <!-- 영어 단어가 출력되는 곳 -->
          <div class="word-text" id="word-en">cat</div>
          <div class="flip-hint">👆 터치해서 뒤집기</div>
        </div>
        <!-- 카드의 뒷면 (한글 뜻과 예문 표시) -->
        <div class="card-back">
          <!-- 한글 뜻이 출력되는 곳 -->
          <div class="meaning-text" id="word-ko">고양이</div>
          <!-- 예문이 출력되는 곳 -->
          <div class="example-text" id="word-ex"></div>
          <div class="flip-hint">👆 터치해서 뒤집기</div>
        </div>
      </div>
    </div>

    <!-- 하단 이전/다음 조작 버튼 상자 -->
    <div class="controls">
      <!-- 이전 단어 보기 버튼 -->
      <button onclick="prevWord()">◀ 이전</button>
      <!-- 현재 진도 표시 (예: 1 / 50) -->
      <div class="progress" id="progress-text">1 / 50</div>
      <!-- 다음 단어 보기 버튼 -->
      <button onclick="nextWord()">다음 ▶</button>
    </div>
  </div>

  <!-- [2] 퀴즈 게임 모드 화면 영역 -->
  <div id="quiz-section" class="quiz-container">
    <!-- 퀴즈 문제 문장이 나오는 영역 -->
    <div class="quiz-question" id="quiz-question-text">문제가 여기에 나옵니다.</div>
    <!-- 퀴즈 선택지 보기들이 배치되는 영역 -->
    <div class="quiz-options" id="quiz-options-container"></div>
    <!-- 퀴즈 정답 여부(정답입니다! 등)를 보여주는 영역 -->
    <div class="quiz-result" id="quiz-result-text"></div>
    <!-- 다음 문제로 넘어가기 버튼 -->
    <button id="next-quiz-btn" style="margin-top: 10px; display: none; width: 100%;" onclick="generateNextQuiz()">다음 문제 도전 ➔</button>
  </div>

  <!-- 자바스크립트 코드 시작 -->
  <script>
    // ==========================================
    // [여기만 고치세요] 단어 목록 데이터 배열
    // ==========================================
    const WORDS = [
      { en:'cat', ko:'고양이', ex:'The cat is sleeping.' },
      { en:'dog', ko:'강아지', ex:'The dog barks happy.' },
      { en:'elephant', ko:'코끼리', ex:'Elephants are big.' },
      { en:'rabbit', ko:'토끼', ex:'The rabbit jumps fast.' },
      { en:'fox', ko:'여우', ex:'The red fox runs.' },
      { en:'monkey', ko:'원숭이', ex:'Monkeys love bananas.' },
      { en:'sheep', ko:'양', ex:'Soft white sheep.' },
      { en:'horse', ko:'말', ex:'Ride a strong horse.' },
      { en:'pig', ko:'돼지', ex:'The pig is cute.' },
      { en:'cow', ko:'소', ex:'The cow gives milk.' },
      { en:'mouse', ko:'쥐', ex:'A tiny little mouse.' },
      { en:'bear', ko:'곰', ex:'The bear likes honey.' },

      { en:'panda', ko:'판다', ex:'Pandas eat bamboo.' },
      { en:'deer', ko:'사슴', ex:'The deer is gentle.' },
      { en:'penguin', ko:'펭귄', ex:'Penguins swim well.' },
      { en:'chicken', ko:'닭', ex:'The chicken lays eggs.' },
      { en:'koala', ko:'코알라', ex:'Koalas sleep on trees.' },
      { en:'polar bear', ko:'북극곰', ex:'Polar bear lives in ice.' },
      { en:'raccoon', ko:'너구리', ex:'Clever little raccoon.' },
      { en:'wolf', ko:'늑대', ex:'The wolf howls at night.' },
      { en:'goat', ko:'염소', ex:'Goats eat fresh grass.' },
      { en:'rhino', ko:'코뿔소', ex:'Strong horn rhino.' },
      { en:'giraffe', ko:'기린', ex:'Giraffe has a long neck.' },
      { en:'zebra', ko:'얼룩말', ex:'Black and white zebra.' },
      { en:'duck', ko:'오리', ex:'Ducks swim in the pond.' },
      { en:'cheetah', ko:'치타', ex:'Fastest running cheetah.' },
      { en:'leopard', ko:'표범', ex:'The leopard can climb.' },
      { en:'kangaroo', ko:'캥거루', ex:'Kangaroo can hop high.' },
      { en:'hippo', ko:'하마', ex:'Hippos love cold water.' },
      { en:'gorilla', ko:'고릴라', ex:'Big black gorilla.' },
      { en:'chimpanzee', ko:'침팬지', ex:'Chimpanzee is smart.' },
      { en:'Sloth', ko:'나무늘보', ex:'The sloth is so slow.' },
      { en:'camel', ko:'낙타', ex:'Camel walks in desert.' },
      { en:'capybara', ko:'카피바라', ex:'Friendly capybara.' },
      { en:'otter', ko:'수달', ex:'Otter plays in river.' },
      { en:'hamster', ko:'햄스터', ex:'Cute little hamster.' },
      { en:'reindeer', ko:'순록', ex:'Reindeer pulls sleigh.' },
      { en:'buffalo', ko:'버팔로', ex:'Wild strong buffalo.' },
      { en:'school', ko:'학교', ex:'I go to school.' },
      { en:'class room', ko:'교실', ex:'Our class room is clean.' },
      { en:'I', ko:'나는', ex:'I love reading books.' },
      { en:'You', ko:'너는', ex:'You are my best friend.' },
      { en:'He', ko:'그는', ex:'He is playing soccer.' },
      { en:'She', ko:'그녀는', ex:'She sings very well.' },
      { en:'It', ko:'그것은', ex:'It is a nice day.' },
      { en:'We', ko:'우리는', ex:'We learn together.' },
      { en:'They', ko:'그들은,그것들은', ex:'They are happy now.' },
      { en:'You', ko:'너희들은', ex:'You are all great.' },
    ];

    // 게임 상태 변수들
    let currentIndex = 0;
    let currentQuizAnswer = "";
    let score = 0;
    let exp = 0;
    let level = 1;
    let streak = 0;

    // HTML 요소 가져오기
    const flashcard = document.getElementById('flashcard');
    const wordEn = document.getElementById('word-en');
    const wordKo = document.getElementById('word-ko');
    const wordEx = document.getElementById('word-ex');
    const progressText = document.getElementById('progress-text');
    const studySection = document.getElementById('study-section');
    const quizSection = document.getElementById('quiz-section');
    const userScoreText = document.getElementById('user-score');
    const userLevelText = document.getElementById('user-level');
    const expFill = document.getElementById('exp-fill');

    // 1. 웹 오디오 소리 효과 (외부 파일 없이 내장 Synth 사용)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'correct') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.2); // A5
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
      } else if (type === 'wrong') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, audioCtx.currentTime); // A3
        osc.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 0.3); // A2
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      } else if (type === 'levelUp') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, audioCtx.currentTime);
        osc.frequency.setValueAtTime(554.37, audioCtx.currentTime + 0.1);
        osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.2);
        osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
      }
    }

    // 2. 파티클 폭죽 애니메이션
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function createParticles(x, y) {
      const colors = ['#4ef0c8', '#ffd166', '#ff6b8b', '#ffffff'];
      for (let i = 0; i < 35; i++) {
        particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 10,
          vy: (Math.random() - 0.5) * 10 - 3,
          color: colors[Math.floor(Math.random() * colors.length)],
          radius: Math.random() * 4 + 2,
          alpha: 1,
          decay: Math.random() * 0.02 + 0.015
        });
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.15; // 중력
        p.alpha -= p.decay;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fill();

        if (p.alpha <= 0) {
          particles.splice(i, 1);
        }
      }
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // 단어 카드를 화면에 출력하는 함수
    function updateCard() {
      flashcard.classList.remove('flipped');
      const current = WORDS[currentIndex];
      wordEn.innerText = current.en;
      wordKo.innerText = current.ko;
      wordEx.innerText = current.ex ? `"${current.ex}"` : '';
      progressText.innerText = `${currentIndex + 1} / ${WORDS.length}`;
    }

    // 카드를 클릭하면 뒤집어주는 함수
    function flipCard() {
      flashcard.classList.toggle('flipped');
    }

    // 다음 단어로 이동하는 함수
    function nextWord() {
      currentIndex = (currentIndex + 1) % WORDS.length;
      updateCard();
    }

    // 이전 단어로 이동하는 함수
    function prevWord() {
      currentIndex = (currentIndex - 1 + WORDS.length) % WORDS.length;
      updateCard();
    }

    // 음성으로 영어 단어를 읽어주는 함수
    function speakWord(event) {
      event.stopPropagation(); // 카드 뒤집기 방지
      
      if ('speechSynthesis' in window) {
        const text = WORDS[currentIndex].en;
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.8; // 조금 느리게 읽기
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utterance);
      } else {
        alert("이 브라우저는 소리를 지원하지 않아요");
      }
    }

    // 경험치 및 레벨 상승 시스템
    function addEXP(amount) {
      exp += amount;
      score += amount * 10;
      userScoreText.innerText = `점수: ${score}`;

      if (exp >= 100) {
        exp -= 100;
        level += 1;
        playSound('levelUp');
        createParticles(window.innerWidth / 2, window.innerHeight / 2);
        const titles = ['탐험가', '대원', '마스터', '정복자', '영웅'];
        const titleName = titles[Math.min(level - 1, titles.length - 1)];
        userLevelText.innerText = `LV.${level} ${titleName}`;
      }
      expFill.style.width = `${exp}%`;
    }

    // 학습 모드 탭 전환
    function showStudyMode() {
      studySection.style.display = 'block';
      quizSection.style.display = 'none';
      document.getElementById('btn-mode-study').classList.add('active-tab');
      document.getElementById('btn-mode-quiz').classList.remove('active-tab');
    }

    // 퀴즈 모드 탭 전환
    function startQuizMode() {
      studySection.style.display = 'none';
      quizSection.style.display = 'block';
      document.getElementById('btn-mode-study').classList.remove('active-tab');
      document.getElementById('btn-mode-quiz').classList.add('active-tab');
      generateNextQuiz();
    }

    function getRandomInt(max) {
      return Math.floor(Math.random() * max);
    }

    // 퀴즈 문제 생성
    function generateNextQuiz() {
      document.getElementById('quiz-result-text').innerText = '';
      document.getElementById('next-quiz-btn').style.display = 'none';
      quizSection.classList.remove('bounce-effect', 'shake-effect');
      
      const optionsContainer = document.getElementById('quiz-options-container');
      optionsContainer.innerHTML = '';
      optionsContainer.className = 'quiz-options';

      const quizType = getRandomInt(3); // 0: OX, 1: 번역, 2: 객관식
      const targetWord = WORDS[getRandomInt(WORDS.length)];

      if (quizType === 0) {
        // [OX 퀴즈]
        optionsContainer.classList.add('ox-layout');
        const isCorrectPair = Math.random() < 0.5;
        let displayKo = targetWord.ko;
        
        if (!isCorrectPair) {
          let randomWord = WORDS[getRandomInt(WORDS.length)];
          while (randomWord.en === targetWord.en) {
            randomWord = WORDS[getRandomInt(WORDS.length)];
          }
          displayKo = randomWord.ko;
        }

        document.getElementById('quiz-question-text').innerText = `[OX 퀴즈]\n'${targetWord.en}'은(는) '${displayKo}'일까요?`;
        currentQuizAnswer = isCorrectPair ? 'O' : 'X';

        ['O', 'X'].forEach(choice => {
          const btn = document.createElement('button');
          btn.innerText = choice;
          btn.onclick = () => checkQuizAnswer(choice, btn);
          optionsContainer.appendChild(btn);
        });

      } else if (quizType === 1) {
        // [주관식 번역 퀴즈]
        document.getElementById('quiz-question-text').innerText = `[단어 맞추기]\n'${targetWord.en}'의 한글 뜻은?`;
        currentQuizAnswer = targetWord.ko;

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'quiz-input';
        input.id = 'quiz-user-input';
        input.placeholder = '뜻을 입력하세요';
        
        const submitBtn = document.createElement('button');
        submitBtn.innerText = '정답 확인';
        submitBtn.style.width = '100%';
        submitBtn.onclick = () => {
          const userVal = document.getElementById('quiz-user-input').value.trim();
          checkQuizAnswer(userVal, submitBtn);
        };

        input.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') submitBtn.click();
        });

        optionsContainer.appendChild(input);
        optionsContainer.appendChild(submitBtn);
        setTimeout(() => input.focus(), 100);

      } else {
        // [3지선다 객관식 퀴즈]
        document.getElementById('quiz-question-text').innerText = `[선택형 퀴즈]\n'${targetWord.en}'의 올바른 뜻은?`;
        currentQuizAnswer = targetWord.ko;

        let choices = [targetWord.ko];
        while (choices.length < 3) {
          const randKo = WORDS[getRandomInt(WORDS.length)].ko;
          if (!choices.includes(randKo)) {
            choices.push(randKo);
          }
        }
        
        choices.sort(() => Math.random() - 0.5);

        choices.forEach((choice, idx) => {
          const btn = document.createElement('button');
          btn.innerText = `${idx + 1}) ${choice}`;
          btn.onclick = () => checkQuizAnswer(choice, btn);
          optionsContainer.appendChild(btn);
        });
      }
    }

    // 채점 및 게임 효과 함수
    function checkQuizAnswer(userAnswer, element) {
      const resultText = document.getElementById('quiz-result-text');
      const isCorrect = userAnswer.replace(/\s+/g, '') === currentQuizAnswer.replace(/\s+/g, '');

      // 클릭 가능한 버튼 중복 누름 방지
      const btns = document.querySelectorAll('#quiz-options-container button');
      btns.forEach(b => b.disabled = true);

      if (isCorrect) {
        streak++;
        playSound('correct');
        resultText.innerText = `🎉 정답입니다! (+30 EXP)`;
        resultText.style.color = "var(--point-color)";
        
        quizSection.classList.add('bounce-effect');
        
        // 클릭된 버튼 부근에서 폭죽 파티클 발동
        const rect = element.getBoundingClientRect();
        createParticles(rect.left + rect.width / 2, rect.top + rect.height / 2);

        addEXP(30);
      } else {
        streak = 0;
        playSound('wrong');
        resultText.innerText = `❌ 아쉬워요! 정답은 '${currentQuizAnswer}'`;
        resultText.style.color = "var(--accent-pink)";
        quizSection.classList.add('shake-effect');
      }

      document.getElementById('next-quiz-btn').style.display = 'inline-block';
    }

    // 초기 실행
    updateCard();
  </script>
