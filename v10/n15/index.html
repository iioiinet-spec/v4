        body {
            font-family: 'Jua', 'Comic Sans MS', cursive, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            overflow-x: hidden;
            background-color: #fef08a; /* Bright sunny yellow */
        }

        .b-game-font {
            font-family: 'Gamja Flower', cursive;
        }

        /* Goofy button animations */
        .btn-bounce {
            transition: transform 0.05s ease, box-shadow 0.05s ease;
        }
        .btn-bounce:active {
            transform: scale(0.92) rotate(-2deg);
        }

        /* Slap shaking animation */
        @keyframes slapShake {
            0% { transform: scale(1) rotate(0deg); }
            20% { transform: scale(1.15) rotate(-12deg) translate(-10px, -5px); }
            40% { transform: scale(0.9) rotate(10deg) translate(10px, 5px); }
            60% { transform: scale(1.08) rotate(-6deg); }
            80% { transform: scale(0.98) rotate(3deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        /* Swing weapon animation */
        @keyframes weaponSwing {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.4) rotate(-60deg); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.4) rotate(15deg); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1) rotate(35deg); }
        }

        .animate-weapon {
            animation: weaponSwing 0.22s cubic-bezier(0.17, 0.89, 0.32, 1.28) forwards;
        }

        .screen-shake {
            animation: screenShake 0.2s ease-in-out;
        }

        /* Floating slap popup text */
        .slap-popup {
            position: absolute;
            pointer-events: none;
            font-weight: 900;
            text-shadow: 2px 2px 0px #000, -2px -2px 0px #000, 2px -2px 0px #000, -2px 2px 0px #000;
            animation: floatUp 0.7s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
            z-index: 50;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.7) rotate(-5deg); }
            50% { opacity: 1; transform: translateY(-40px) scale(1.3) rotate(8deg); }
            100% { opacity: 0; transform: translateY(-80px) scale(1) rotate(0deg); }
        }

        /* Custom Scrollbar for upgrades list */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #fef08a;
        }
        ::-webkit-scrollbar-thumb {
            background: #facc15;
            border-radius: 4px;
            border: 2px solid #000;
        }
    </style>
</head>

        /* -------------------------------------------------------------------------- */
        /* AUDIO SYNTHESIZER (Web Audio API)                                          */
        /* -------------------------------------------------------------------------- */
        class SoundEffects {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playSlap() {
                this.init();
                if (this.ctx.state === 'suspended') this.ctx.resume();
                
                // Slap Noise Burst
                const bufferSize = this.ctx.sampleRate * 0.08;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const output = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = Math.random() * 2 - 1;
                }

                const whiteNoise = this.ctx.createBufferSource();
                whiteNoise.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'highpass';
                filter.frequency.value = 800;

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(1, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);

                whiteNoise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);

                whiteNoise.start();

                // Low thud frequency tone
                const osc = this.ctx.createOscillator();
                const oscGain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.08);
                oscGain.gain.setValueAtTime(0.8, this.ctx.currentTime);
                oscGain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);

                osc.connect(oscGain);
                oscGain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            }

            playCoin() {
                this.init();
                if (this.ctx.state === 'suspended') this.ctx.resume();

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(987.77, this.ctx.currentTime); // B5
                osc.frequency.setValueAtTime(1318.51, this.ctx.currentTime + 0.06); // E6

                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.25);
            }

            playBgmLoop() {
                this.init();
                if (this.ctx.state === 'suspended') this.ctx.resume();

                // Simple silly synthesized melody loop
                if (this.bgmInterval) clearInterval(this.bgmInterval);

                const notes = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63];
                let noteIdx = 0;

                this.bgmInterval = setInterval(() => {
                    if (!gameState.bgmActive) return;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = notes[noteIdx % notes.length];
                    gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.18);
                    
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.2);

                    noteIdx++;
                }, 250);
            }

            stopBgm() {
                if (this.bgmInterval) clearInterval(this.bgmInterval);
            }
        }

        const sound = new SoundEffects();

        /* -------------------------------------------------------------------------- */
        /* DOM ELEMENTS                                                               */
        /* -------------------------------------------------------------------------- */
        const goldDisplay = document.getElementById('goldDisplay');
        const gpsDisplay = document.getElementById('gpsDisplay');
        const zombieName = document.getElementById('zombieName');
        const zombieLevelTag = document.getElementById('zombieLevelTag');
        const hpBar = document.getElementById('hpBar');
        const hpText = document.getElementById('hpText');
        const zombieAvatar = document.getElementById('zombieAvatar');
        const zombieClickArea = document.getElementById('zombieClickArea');
        const totalSlapsDisplay = document.getElementById('totalSlaps');
        const rebirthMultDisplay = document.getElementById('rebirthMult');
        const shopContent = document.getElementById('shopContent');
        const memeMarquee = document.getElementById('memeMarquee');

        const tabPowerBtn = document.getElementById('tabPowerBtn');
        const tabMinionBtn = document.getElementById('tabMinionBtn');
        const tabAchieveBtn = document.getElementById('tabAchieveBtn');
        const rebirthBtn = document.getElementById('rebirthBtn');
        const resetDataBtn = document.getElementById('resetDataBtn');
        const bgmToggleBtn = document.getElementById('bgmToggleBtn');

        const modalOverlay = document.getElementById('modalOverlay');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');
        const modalCloseBtn = document.getElementById('modalCloseBtn');

        let activeTab = 'power'; // 'power' | 'minion' | 'achieve'

        /* -------------------------------------------------------------------------- */
        /* CORE GAME LOGIC & FUNCTIONS                                                */
        /* -------------------------------------------------------------------------- */

        function initGame() {
            loadGame();
            renderZombie();
            updateUI();
            renderShop();

            // Auto loop for Passive Gold (GPS)
            setInterval(() => {
                const totalGps = calculateGPS();
                if (totalGps > 0) {
                    addGold(totalGps / 10);
                }
            }, 100);

            // Auto Save Loop every 10 seconds
            setInterval(saveGame, 10000);

            // Rotate Meme Marquee Text
            setInterval(() => {
                const randQuote = memeQuotes[Math.floor(Math.random() * memeQuotes.length)];
                memeMarquee.textContent = randQuote;
            }, 7000);
        }

        function calculateSlapDamage() {
            let basePower = 0;
            gameState.weapons.forEach(w => {
                basePower += w.level * w.powerAdd;
            });
            return Math.max(1, Math.floor(basePower * gameState.rebirthMultiplier));
        }

        function calculateGPS() {
            let totalGps = 0;
            gameState.minions.forEach(m => {
                totalGps += m.count * m.gps;
            });
            return Math.floor(totalGps * gameState.rebirthMultiplier);
        }

        function addGold(amount) {
            gameState.gold += amount;
            updateUI();
            checkAchievements();
        }

        function slapZombie(e) {
            sound.playSlap();

            const damage = calculateSlapDamage();
            gameState.currentZombieHp -= damage;
            gameState.totalSlaps++;
            addGold(damage);

            // Animation & Visual Feedback for Zombie
            zombieAvatar.classList.remove('animate-slap');
            void zombieAvatar.offsetWidth;
            zombieAvatar.classList.add('animate-slap');

            // Show Visual Weapon Animation over the hit location
            spawnWeaponVisual(e);

            // Chance of Crit Screen Shake
            if (Math.random() < 0.25) {
                document.body.classList.remove('screen-shake');
                void document.body.offsetWidth;
                document.body.classList.add('screen-shake');
            }

            // Spawn floating text popup
            spawnSlapText(e, damage);

            // Check if Zombie Defeated
            if (gameState.currentZombieHp <= 0) {
                sound.playCoin();
                const currentData = zombies[gameState.currentZombieIndex];
                addGold(currentData.goldReward * (gameState.currentZombieIndex + 1));
                
                // Dramatic Defeat Effect
                zombieAvatar.style.transform = 'scale(0.2) rotate(720deg)';
                zombieAvatar.style.opacity = '0';

                setTimeout(() => {
                    // Advance Zombie and exponentially scale HP
                    gameState.currentZombieIndex = (gameState.currentZombieIndex + 1) % zombies.length;
                    const nextZombie = zombies[gameState.currentZombieIndex];
                    const multiplier = Math.pow(2.2, Math.floor(gameState.totalSlaps / 300));
                    gameState.maxZombieHp = Math.floor(nextZombie.baseHp * multiplier);
                    gameState.currentZombieHp = gameState.maxZombieHp;

                    zombieAvatar.style.transform = 'scale(1) rotate(0deg)';
                    zombieAvatar.style.opacity = '1';
                    renderZombie();
                    updateUI();
                }, 400);

                showModal('💥 좀비 퇴치 성공!', `[${currentData.name}]을(를) 엄청난 난타 끝에 때려눕혔습니다! 대량의 골드를 보상으로 받습니다.`);
            }

            updateUI();
        }

        // Render distinct weapon smack graphic over click location
        function spawnWeaponVisual(e) {
            const equippedWp = gameState.weapons[gameState.equippedWeaponIndex] || gameState.weapons[0];
            const weaponElem = document.createElement('div');
            weaponElem.className = 'absolute pointer-events-none text-6xl md:text-8xl z-40 animate-weapon drop-shadow-[0_4px_8px_rgba(0,0,0,0.5)]';
            weaponElem.textContent = equippedWp.visual;

            const rect = zombieClickArea.getBoundingClientRect();
            let x = rect.width / 2;
            let y = rect.height / 2;

            if (e && e.clientX) {
                x = e.clientX - rect.left;
                y = e.clientY - rect.top;
            }

            weaponElem.style.left = `${x}px`;
            weaponElem.style.top = `${y}px`;

            zombieClickArea.appendChild(weaponElem);

            setTimeout(() => {
                weaponElem.remove();
            }, 250);
        }

        function spawnSlapText(e, damage) {
            const popup = document.createElement('div');
            popup.className = 'slap-popup text-yellow-300 text-2xl md:text-4xl';

            const slapWords = ['찰싹!', '떍!', '악!', '찰지구나!', '퍽!', '따끔!', '크리티컬!'];
            const word = slapWords[Math.floor(Math.random() * slapWords.length)];

            popup.innerHTML = `${word}<br><span class="text-white text-lg md:text-xl">+${damage}G</span>`;

            const rect = zombieClickArea.getBoundingClientRect();
            let x = rect.width / 2;
            let y = rect.height / 2;

            if (e && e.clientX) {
                x = e.clientX - rect.left;
                y = e.clientY - rect.top;
            }

            popup.style.left = `${x - 30}px`;
            popup.style.top = `${y - 40}px`;

            zombieClickArea.appendChild(popup);

            setTimeout(() => {
                popup.remove();
            }, 700);
        }

        function renderZombie() {
            const z = zombies[gameState.currentZombieIndex];
            zombieName.textContent = z.name;
            zombieLevelTag.textContent = `Lv.${gameState.currentZombieIndex + 1}`;
            zombieAvatar.innerHTML = z.svg;
        }

        function updateUI() {
            goldDisplay.textContent = `${Math.floor(gameState.gold).toLocaleString()} G`;
            gpsDisplay.textContent = `+${calculateGPS().toLocaleString()} G/초`;
            totalSlapsDisplay.textContent = gameState.totalSlaps.toLocaleString();
            rebirthMultDisplay.textContent = gameState.rebirthMultiplier.toFixed(1);

            // Health Bar
            const percent = Math.max(0, (gameState.currentZombieHp / gameState.maxZombieHp) * 100);
            hpBar.style.width = `${percent}%`;
            hpText.textContent = `${Math.ceil(gameState.currentZombieHp).toLocaleString()} / ${gameState.maxZombieHp.toLocaleString()}`;

            // Refresh shop button active states
            updateShopButtons();
        }

        /* -------------------------------------------------------------------------- */
        /* SHOP & UPGRADES SYSTEM                                                     */
        /* -------------------------------------------------------------------------- */

        function renderShop() {
            shopContent.innerHTML = '';

            if (activeTab === 'power') {
                gameState.weapons.forEach((w, idx) => {
                    const cost = Math.floor(w.baseCost * Math.pow(1.35, w.level));
                    const canAfford = gameState.gold >= cost;

                    const card = document.createElement('div');
                    card.className = `p-3 rounded-2xl border-3 border-black bg-white flex items-center justify-between shadow-[3px_3px_0px_0px_rgba(0,0,0,1)] ${!canAfford ? 'opacity-70' : ''}`;
                    card.innerHTML = `
                        <div class="flex items-center gap-3">
                            <span class="text-3xl">${w.icon}</span>
                            <div>
                                <div class="font-black text-sm md:text-base">${w.name} <span class="text-xs bg-yellow-300 px-1.5 py-0.5 rounded-md border border-black">Lv.${w.level}</span></div>
                                <div class="text-xs text-gray-600 font-bold">뺨 대미지 +${w.powerAdd}</div>
                            </div>
                        </div>
                        <button onclick="buyWeapon(${idx})" class="btn-bounce bg-emerald-400 hover:bg-emerald-500 font-black px-3 py-1.5 rounded-xl border-2 border-black text-xs md:text-sm ${!canAfford ? 'bg-gray-300 hover:bg-gray-300 text-gray-500 cursor-not-allowed' : ''}">
                            강화<br><span class="text-[10px] md:text-xs font-normal">${cost.toLocaleString()}G</span>
                        </button>
                    `;
                    shopContent.appendChild(card);
                });
            } else if (activeTab === 'minion') {
                gameState.minions.forEach((m, idx) => {
                    const cost = Math.floor(m.baseCost * Math.pow(1.25, m.count));
                    const canAfford = gameState.gold >= cost;

                    const card = document.createElement('div');
                    card.className = `p-3 rounded-2xl border-3 border-black bg-white flex items-center justify-between shadow-[3px_3px_0px_0px_rgba(0,0,0,1)] ${!canAfford ? 'opacity-70' : ''}`;
                    card.innerHTML = `
                        <div class="flex items-center gap-3">
                            <span class="text-3xl">${m.icon}</span>
                            <div>
                                <div class="font-black text-sm md:text-base">${m.name} <span class="text-xs bg-cyan-300 px-1.5 py-0.5 rounded-md border border-black">${m.count}개</span></div>
                                <div class="text-xs text-emerald-600 font-bold">+${m.gps} G/초</div>
                            </div>
                        </div>
                        <button onclick="buyMinion(${idx})" class="btn-bounce bg-cyan-400 hover:bg-cyan-500 font-black px-3 py-1.5 rounded-xl border-2 border-black text-xs md:text-sm ${!canAfford ? 'bg-gray-300 hover:bg-gray-300 text-gray-500 cursor-not-allowed' : ''}">
                            구매<br><span class="text-[10px] md:text-xs font-normal">${cost.toLocaleString()}G</span>
                        </button>
                    `;
                    shopContent.appendChild(card);
                });
            } else if (activeTab === 'achieve') {
                gameState.achievements.forEach(a => {
                    const card = document.createElement('div');
                    card.className = `p-3 rounded-2xl border-3 border-black ${a.unlocked ? 'bg-amber-200' : 'bg-gray-100 opacity-60'} flex items-center justify-between shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]`;
                    card.innerHTML = `
                        <div>
                            <div class="font-black text-sm md:text-base">${a.unlocked ? '🏆 ' : '🔒 '}${a.title}</div>
                            <div class="text-xs text-gray-600 font-bold">${a.desc}</div>
                        </div>
                        <div class="text-xs font-black ${a.unlocked ? 'text-emerald-700' : 'text-gray-400'}">
                            ${a.unlocked ? '완료! (+' + a.reward + 'G)' : '미달성'}
                        </div>
                    `;
                    shopContent.appendChild(card);
                });
            }
        }

        function updateShopButtons() {
            // Re-render shop content to update costs & affordability states
            renderShop();
        }

        window.buyWeapon = function(index) {
            const w = gameState.weapons[index];
            const cost = Math.floor(w.baseCost * Math.pow(1.35, w.level));
            if (gameState.gold >= cost) {
                gameState.gold -= cost;
                w.level++;
                gameState.equippedWeaponIndex = index; // Equip highest upgraded weapon
                sound.playCoin();
                updateUI();
                renderShop();
            }
        };

        window.buyMinion = function(index) {
            const m = gameState.minions[index];
            const cost = Math.floor(m.baseCost * Math.pow(1.25, m.count));
            if (gameState.gold >= cost) {
                gameState.gold -= cost;
                m.count++;
                sound.playCoin();
                updateUI();
                renderShop();
            }
        };

        function checkAchievements() {
            gameState.achievements.forEach(a => {
                if (!a.unlocked) {
                    if (a.id === 'slap_10' && gameState.totalSlaps >= 10) unlockAchieve(a);
                    if (a.id === 'slap_100' && gameState.totalSlaps >= 100) unlockAchieve(a);
                    if (a.id === 'slap_1000' && gameState.totalSlaps >= 1000) unlockAchieve(a);
                    if (a.id === 'gold_10k' && gameState.gold >= 10000) unlockAchieve(a);
                    if (a.id === 'boss_defeat' && gameState.currentZombieIndex === 4 && gameState.currentZombieHp <= 0) unlockAchieve(a);
                }
            });
        }

        function unlockAchieve(a) {
            a.unlocked = true;
            addGold(a.reward);
            showModal('🏆 업적 달성!', `[${a.title}] 업적을 달성하여 보상 ${a.reward} Gold를 얻었습니다!`);
        }

        /* -------------------------------------------------------------------------- */
        /* PRESTIGE / REBIRTH SYSTEM                                                  */
        /* -------------------------------------------------------------------------- */

        function triggerRebirth() {
            const minSlapsReq = 200;
            if (gameState.totalSlaps < minSlapsReq) {
                showModal('🌀 영혼 환생 불가', `환생을 하려면 최소 뺨을 ${minSlapsReq}번 이상 때려야 합니다! (현재: ${gameState.totalSlaps}회)`);
                return;
            }

            const addedMultiplier = parseFloat((gameState.totalSlaps / 200).toFixed(1));
            
            gameState.gold = 0;
            gameState.slapPowerLevel = 1;
            gameState.rebirthCount++;
            gameState.rebirthMultiplier += addedMultiplier;
            gameState.currentZombieIndex = 0;

            // Reset weapon levels & minion counts
            gameState.weapons.forEach((w, i) => w.level = i === 0 ? 1 : 0);
            gameState.minions.forEach(m => m.count = 0);

            const z = zombies[0];
            gameState.maxZombieHp = z.baseHp;
            gameState.currentZombieHp = z.baseHp;

            saveGame();
            renderZombie();
            updateUI();
            renderShop();

            showModal('✨ 영혼 환생 성공!', `모든 장비와 골드가 초기화되지만, 뺨 대미지 배율이 x${gameState.rebirthMultiplier.toFixed(1)} 배로 대폭 증가했습니다!`);
        }

        /* -------------------------------------------------------------------------- */
        /* MODAL & AUDIO TOGGLES                                                      */
        /* -------------------------------------------------------------------------- */

        function showModal(title, text) {
            modalTitle.textContent = title;
            modalBody.textContent = text;
            modalOverlay.classList.remove('hidden');
            modalOverlay.classList.add('flex');
        }

        modalCloseBtn.addEventListener('click', () => {
            modalOverlay.classList.add('hidden');
            modalOverlay.classList.remove('flex');
        });

        bgmToggleBtn.addEventListener('click', () => {
            gameState.bgmActive = !gameState.bgmActive;
            if (gameState.bgmActive) {
                bgmToggleBtn.textContent = '🎵 BGM 끄기';
                sound.playBgmLoop();
            } else {
                bgmToggleBtn.textContent = '🎵 BGM 켜기';
                sound.stopBgm();
            }
        });

        /* -------------------------------------------------------------------------- */
        /* TAB NAVIGATION                                                             */
        /* -------------------------------------------------------------------------- */

        tabPowerBtn.addEventListener('click', () => {
            activeTab = 'power';
            tabPowerBtn.className = "flex-1 bg-yellow-400 text-black border-2 border-black rounded-xl py-2 font-black text-sm shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]";
            tabMinionBtn.className = "flex-1 bg-white text-gray-700 border-2 border-black rounded-xl py-2 font-black text-sm shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]";
            tabAchieveBtn.className = "flex-1 bg-white text-gray-700 border-2 border-black rounded-xl py-2 font-black text-sm shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]";
            renderShop();
        });

        tabMinionBtn.addEventListener('click', () => {
            activeTab = 'minion';
            tabMinionBtn.className = "flex-1 bg-cyan-400 text-black border-2 border-black rounded-xl py-2 font-black text-sm shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]";
            tabPowerBtn.className = "flex-1 bg-white text-gray-700 border-2 border-black rounded-xl py-2 font-black text-sm shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]";
            tabAchieveBtn.className = "flex-1 bg-white text-gray-700 border-2 border-black rounded-xl py-2 font-black text-sm shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]";
            renderShop();
        });

        tabAchieveBtn.addEventListener('click', () => {
            activeTab = 'achieve';
            tabAchieveBtn.className = "flex-1 bg-purple-400 text-black border-2 border-black rounded-xl py-2 font-black text-sm shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]";
            tabPowerBtn.className = "flex-1 bg-white text-gray-700 border-2 border-black rounded-xl py-2 font-black text-sm shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]";
            tabMinionBtn.className = "flex-1 bg-white text-gray-700 border-2 border-black rounded-xl py-2 font-black text-sm shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]";
            renderShop();
        });

        zombieClickArea.addEventListener('click', (e) => slapZombie(e));
        rebirthBtn.addEventListener('click', triggerRebirth);

        resetDataBtn.addEventListener('click', () => {
            if (confirm('정말로 저장된 게임 데이터를 초기화하시겠습니까?')) {
                localStorage.removeItem('zombie_slap_tycoon_save');
                location.reload();
            }
        });

        /* -------------------------------------------------------------------------- */
        /* SAVE & LOAD SYSTEM                                                         */
        /* -------------------------------------------------------------------------- */

        function saveGame() {
            localStorage.setItem('zombie_slap_tycoon_save', JSON.stringify(gameState));
        }

        function loadGame() {
            const saved = localStorage.getItem('zombie_slap_tycoon_save');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    gameState.gold = parsed.gold || 0;
                    gameState.totalSlaps = parsed.totalSlaps || 0;
                    gameState.rebirthCount = parsed.rebirthCount || 0;
                    gameState.rebirthMultiplier = parsed.rebirthMultiplier || 1.0;
                    gameState.currentZombieIndex = parsed.currentZombieIndex || 0;

                    if (parsed.weapons) {
                        parsed.weapons.forEach((w, idx) => {
                            if (gameState.weapons[idx]) gameState.weapons[idx].level = w.level;
                        });
                    }

                    if (parsed.minions) {
                        parsed.minions.forEach((m, idx) => {
                            if (gameState.minions[idx]) gameState.minions[idx].count = m.count;
                        });
                    }

                    if (parsed.achievements) {
                        parsed.achievements.forEach((a, idx) => {
                            if (gameState.achievements[idx]) gameState.achievements[idx].unlocked = a.unlocked;
                        });
                    }

                    const z = zombies[gameState.currentZombieIndex];
                    gameState.maxZombieHp = Math.floor(z.baseHp * Math.pow(1.5, Math.floor(gameState.totalSlaps / 50)));
                    gameState.currentZombieHp = gameState.maxZombieHp;

                } catch (e) {
                    console.error("Save load error", e);
                }
            }
        }

        // Start game on window load
        window.onload = function() {
            initGame();
        };
    </script>
</body>
</html>
