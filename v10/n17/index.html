<!DOCTYPE html>
<!-- HTML 문서 종류를 정의해요 -->
<html lang="ko">
<!-- 문서의 기본 설정과 제목, 스타일을 담는 곳이에요 -->
<head>
  <!-- 글자가 깨지지 않도록 UTF-8로 설정해요 -->
  <meta charset="UTF-8">
  <!-- 스마트폰에서도 화면 크기가 딱 맞게 보이도록 설정해요 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 홈페이지의 웹브라우저 탭 제목이에요 -->
  <title>영어 단어장</title>
  
  <!-- 구글 폰트(Noto Serif KR)를 인터넷에서 불러와요 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">

  <!-- 화면을 예쁘게 꾸미는 CSS 디자인 코드 시작이에요 -->
  <style>
    /* 웹페이지 전체에서 사용할 색상 변수를 정해요 */
    :root {
      --bg-color: #02faff; /* 배경 색상 (밝은 하늘색) */
      --card-bg: #ffffff; /* 카드 및 버튼 배경 색상 (흰색) */
      --text-color: #000000; /* 기본 글자 색상 (검은색) */
      --point-color: #0008ff; /* 포인트 색상 (파란색) */
      --correct-color: #28a745; /* 퀴즈 정답 버튼 색상 (초록색) */
      --wrong-color: #dc3545; /* 퀴즈 오답 버튼 색상 (빨간색) */
    }

    /* 모든 요소의 크기 계산 방식과 글꼴을 통일해요 */
    * {
      box-sizing: border-box; /* 패딩과 테두리를 전체 크기에 포함해요 */
      font-family: 'Noto Serif KR', serif; /* 명조체 글꼴을 적용해요 */
    }

    /* 웹페이지 전체의 바탕 화면 스타일이에요 */
    body {
      background-color: var(--bg-color); /* 배경색을 변수에서 가져와요 */
      color: var(--text-color); /* 글자색을 변수에서 가져와요 */
      display: flex; /* 화면 중앙 정렬을 위해 플렉스 박스를 써요 */
      flex-direction: column; /* 요소들을 위에서 아래로 세로 배치해요 */
      align-items: center; /* 가로 가운데 정렬해요 */
      justify-content: center; /* 세로 가운데 정렬해요 */
      min-height: 100vh; /* 화면 전체 높이를 다 써요 */
      margin: 0; /* 테두리 여백을 없애요 */
      padding: 20px; /* 안쪽 여백을 줘요 */
    }

    /* 단어장 전체를 감싸는 컨테이너 상자예요 */
    .container {
      width: 100%; /* 너비를 100%로 설정해요 */
      max-width: 400px; /* 최대 너비를 400px로 제한해요 */
      text-align: center; /* 글자들을 가운데 정렬해요 */
    }

    /* 진도 표시 "1 / 30" 스타일이에요 */
    .progress {
      font-size: 1.2rem; /* 글자 크기를 살짝 크게 해요 */
      font-weight: bold; /* 글자를 굵게 해요 */
      margin-bottom: 15px; /* 아래쪽에 여백을 줘요 */
    }

    /* 단어 카드가 뒤집히도록 3D 공간을 만들어줘요 */
    .card-container {
      perspective: 1000px; /* 3D 입체감을 느끼게 해줘요 */
      width: 100%; /* 너비를 꽉 채워요 */
      height: 200px; /* 카드의 높이예요 */
      margin-bottom: 15px; /* 아래쪽에 여백을 줘요 */
      cursor: pointer; /* 마우스를 올리면 손가락 모양으로 바뀌어요 */
    }

    /* 실제로 움직이고 뒤집히는 카드 상자예요 */
    .card {
      width: 100%; /* 너비를 꽉 채워요 */
      height: 100%; /* 높이를 꽉 채워요 */
      position: relative; /* 앞면과 뒷면을 부모 안에 위치시켜요 */
      transform-style: preserve-3d; /* 3D 효과를 유지해요 */
      transition: transform 0.6s; /* 0.6초 동안 부드럽게 뒤집혀요 */
      border: 2px solid var(--text-color); /* 검은색 테두리를 그려요 */
      border-radius: 0px; /* 모서리 둥글기를 0px로 각지게 만들어요 */
    }

    /* JS에서 flipped 클래스를 붙이면 카드가 180도 뒤집혀요 */
    .card.flipped {
      transform: rotateY(180deg); /* Y축을 기준으로 180도 회전해요 */
    }

    /* 카드의 앞면과 뒷면 공통 스타일이에요 */
    .card-face {
      position: absolute; /* 카드 안에 딱 겹쳐서 놓아요 */
      width: 100%; /* 너비를 꽉 채워요 */
      height: 100%; /* 높이를 꽉 채워요 */
      backface-visibility: hidden; /* 뒤집혔을 때 반대면이 안 보이게 해요 */
      background-color: var(--card-bg); /* 흰색 배경을 써요 */
      display: flex; /* 내용물을 가운데 정렬하기 위해 써요 */
      flex-direction: column; /* 내용물을 세로로 나열해요 */
      align-items: center; /* 가로 가운데 정렬해요 */
      justify-content: center; /* 세로 가운데 정렬해요 */
      padding: 20px; /* 안쪽 여백을 줘요 */
      border-radius: 0px; /* 모서리 둥글기를 0px로 맞춰요 */
    }

    /* 단어 카드의 앞면 스타일이에요 */
    .card-front {
      color: var(--text-color); /* 글자색을 적용해요 */
    }

    /* 영어 단어 글자 스타일이에요 */
    .word-en {
      font-size: 2rem; /* 큰 글씨로 보여줘요 */
      font-weight: bold; /* 글씨를 굵게 해요 */
    }

    /* 단어 카드의 뒷면 스타일이에요 */
    .card-back {
      transform: rotateY(180deg); /* 처음부터 뒤집어 놓아서 미리 숨겨둬요 */
      color: var(--text-color); /* 글자색을 적용해요 */
    }

    /* 뜻 한글 글자 스타일이에요 */
    .word-ko {
      font-size: 1.5rem; /* 영어보다는 약간 작게 해요 */
      font-weight: bold; /* 굵게 표시해요 */
      margin-bottom: 10px; /* 아래쪽에 여백을 줘요 */
    }

    /* 예문 글자 스타일이에요 */
    .word-ex {
      font-size: 0.95rem; /* 예문은 작게 보여줘요 */
      color: var(--point-color); /* 포인트 파란색으로 예문을 써요 */
    }

    /* 버튼들을 모아두는 상자 스타일이에요 */
    .controls {
      display: flex; /* 버튼을 가로로 나열해요 */
      justify-content: space-between; /* 버튼 사이에 간격을 넓게 띄워요 */
      margin-bottom: 15px; /* 아래쪽에 여백을 줘요 */
    }

    /* 버튼 기본 모양 스타일이에요 */
    button {
      background-color: var(--card-bg); /* 흰색 배경을 써요 */
      color: var(--text-color); /* 검은색 글자를 써요 */
      border: 2px solid var(--text-color); /* 검은색 테두리를 쳐요 */
      border-radius: 0px; /* 모서리 둥글기를 0px로 각지게 해요 */
      padding: 10px 15px; /* 안쪽 여백을 줘요 */
      font-size: 1rem; /* 글자 크기를 정해요 */
      font-weight: bold; /* 글씨를 굵게 해요 */
      cursor: pointer; /* 마우스를 올리면 손가락 모양이 돼요 */
    }

    /* 버튼에 마우스를 올렸을 때 효과예요 */
    button:hover {
      background-color: var(--point-color); /* 포인트 파란색으로 변해요 */
      color: var(--card-bg); /* 글자색이 흰색으로 바뀌어요 */
    }

    /* 소리 재생 관련 버튼들을 감싸는 상자예요 */
    .tts-controls {
      display: flex; /* 가로로 배치해요 */
      justify-content: center; /* 가운데 모아줘요 */
      gap: 10px; /* 버튼 사이에 10px 간격을 줘요 */
      margin-bottom: 20px; /* 아래쪽에 여백을 줘요 */
    }

    /* 퀴즈 전체를 감싸는 영역 스타일이에요 */
    .quiz-container {
      background-color: var(--card-bg); /* 흰색 배경을 써요 */
      border: 2px solid var(--text-color); /* 테두리를 그려요 */
      border-radius: 0px; /* 모서리를 0px로 각지게 해요 */
      padding: 15px; /* 안쪽 여백을 줘요 */
      margin-top: 10px; /* 위쪽에 여백을 줘요 */
    }

    /* 퀴즈 질문 제목 스타일이에요 */
    .quiz-title {
      font-weight: bold; /* 글씨를 굵게 해요 */
      margin-bottom: 10px; /* 아래쪽에 여백을 줘요 */
    }

    /* 퀴즈 보기 버튼 4개를 담는 그리드 상자예요 */
    .quiz-options {
      display: grid; /* 바둑판 배열을 써요 */
      grid-template-columns: 1fr 1fr; /* 2열로 똑같이 나눠요 */
      gap: 8px; /* 버튼 사이 간격을 줘요 */
      margin-bottom: 10px; /* 아래쪽에 여백을 줘요 */
    }

    /* 퀴즈 보기 버튼 개별 스타일이에요 */
    .quiz-btn {
      width: 100%; /* 넓이를 꽉 채워요 */
      padding: 8px; /* 안쪽 여백을 줘요 */
      font-size: 0.9rem; /* 글씨 크기를 조절해요 */
    }

    /* 정답을 맞혔을 때 버튼 색상이에요 */
    .quiz-btn.correct {
      background-color: var(--correct-color) !important; /* 초록색으로 바꿔요 */
      color: #ffffff !important; /* 글자는 흰색으로 해요 */
    }

    /* 오답을 선택했을 때 버튼 색상이에요 */
    .quiz-btn.wrong {
      background-color: var(--wrong-color) !important; /* 빨간색으로 바꿔요 */
      color: #ffffff !important; /* 글자는 흰색으로 해요 */
    }

    /* 정답/오답 맞힌 개수를 보여주는 점수판 스타일이에요 */
    .quiz-score {
      font-size: 0.9rem; /* 글씨 크기를 살짝 작게 해요 */
      font-weight: bold; /* 글씨를 굵게 해요 */
    }
  </style>
</head>
<!-- 눈에 보이는 실제 화면 내용이 들어가는 곳이에요 -->
<body>

  <!-- 전체를 담는 큰 상자예요 -->
  <div class="container">
    <!-- "1 / 30" 처럼 순서를 보여주는 곳이에요 -->
    <div class="progress" id="progress">1 / 30</div>

    <!-- 클릭하면 뒤집히는 카드 상자예요 -->
    <div class="card-container" id="cardContainer">
      <div class="card" id="card">
        <!-- 카드의 앞면 (영어 단어) -->
        <div class="card-face card-front">
          <div class="word-en" id="wordEn">Apple</div>
        </div>
        <!-- 카드의 뒷면 (한글 뜻과 예문) -->
        <div class="card-face card-back">
          <div class="word-ko" id="wordKo">사과</div>
          <div class="word-ex" id="wordEx">I eat an apple.</div>
        </div>
      </div>
    </div>

    <!-- 스피커와 속도 조절 버튼들이에요 -->
    <div class="tts-controls">
      <!-- 기본 속도로 읽어주는 스피커 버튼이에요 -->
      <button id="speakNormalBtn">🔊</button>
      <!-- 거북이 모양 느린 속도 버튼이에요 -->
      <button id="speakSlowBtn">🐢🔊</button>
    </div>

    <!-- 이전/다음 카드로 넘어가는 버튼들이에요 -->
    <div class="controls">
      <button id="prevBtn">이전</button>
      <button id="nextBtn">다음</button>
    </div>

    <!-- 4지선다 단어 퀴즈 상자예요 -->
    <div class="quiz-container">
      <div class="quiz-title">이 단어의 뜻은?</div>
      <!-- 4개의 보기 버튼이 들어가는 곳이에요 -->
      <div class="quiz-options" id="quizOptions"></div>
      <!-- 맞춘 개수와 틀린 개수를 보여줘요 -->
      <div class="quiz-score" id="quizScore">맞음: 0 | 틀림: 0</div>
    </div>
  </div>

  <!-- 자바스크립트 동작 코드가 시작되는 곳이에요 -->
  <script>
    // ==========================================
    // ⭐ 여기만 고치세요! (단어 데이터 목록) ⭐
    // ==========================================
    const WORDS = [
      { en:'January', ko:'1월', ex:'' },
      { en:'February', ko:'2월', ex:'' },
      { en:'March', ko:'3월', ex:'' },
      { en:'April', ko:'4월', ex:'' },
      { en:'May', ko:'5월', ex:'' },
      { en:'June', ko:'6월', ex:'' },
      { en:'July', ko:'7월', ex:'' },
      { en:'August', ko:'8월', ex:'' },
      { en:'September', ko:'9월', ex:'' },
      { en:'October', ko:'10월', ex:'' },
      { en:'November', ko:'11월', ex:'' },
      { en:'December', ko:'12월', ex:'' },
      { en:'Monday', ko:'월요일', ex:'' },
      { en:'Tuesday', ko:'화요일', ex:'' },
      { en:'Wednesday', ko:'수요일', ex:'' },
      { en:'Thursday', ko:'목요일', ex:'' },
      { en:'Friday', ko:'금요일', ex:'' },
      { en:'Saturday', ko:'토요일', ex:'' },
      { en:'Sunday', ko:'일요일', ex:'' },
      { en:'second', ko:'초', ex:'' },
      { en:'minute', ko:'분', ex:'' },
      { en:'hour', ko:'시간', ex:'' },
      { en:'day', ko:'하루', ex:'' },
      { en:'week', ko:'일주일', ex:'' },
      { en:'month', ko:'한 달', ex:'' },
      { en:'year', ko:'1년', ex:'' },
      { en:'decade', ko:'10년', ex:'' },
      { en:'century', ko:'100년(1세기)', ex:'' },
      { en:'millennium', ko:'1000년', ex:'' },
      { en:'end', ko:'끝', ex:'' },
    ];
    // ==========================================

    // 현재 몇 번째 단어를 보고 있는지 저장하는 변수예요 (0부터 시작해요)
    let currentIndex = 0;
    // 퀴즈에서 맞힌 개수를 저장해요
    let correctCount = 0;
    // 퀴즈에서 틀린 개수를 저장해요
    let wrongCount = 0;

    // HTML 요소들을 자바스크립트로 가져와서 변수에 담아요
    const progressEl = document.getElementById('progress'); // 진도 표시 태그
    const cardContainer = document.getElementById('cardContainer'); // 카드 전체 상자 태그
    const cardEl = document.getElementById('card'); // 움직이는 카드 태그
    const wordEnEl = document.getElementById('wordEn'); // 영어 단어 태그
    const wordKoEl = document.getElementById('wordKo'); // 한글 뜻 태그
    const wordExEl = document.getElementById('wordEx'); // 예문 태그
    const prevBtn = document.getElementById('prevBtn'); // 이전 버튼 태그
    const nextBtn = document.getElementById('nextBtn'); // 다음 버튼 태그
    const speakNormalBtn = document.getElementById('speakNormalBtn'); // 일반 소리 버튼 태그
    const speakSlowBtn = document.getElementById('speakSlowBtn'); // 거북이 소리 버튼 태그
    const quizOptionsEl = document.getElementById('quizOptions'); // 퀴즈 보기 상자 태그
    const quizScoreEl = document.getElementById('quizScore'); // 퀴즈 점수판 태그

    // 화면에 현재 단어 정보를 보여주는 함수예요
    function updateCard() {
      // 카드가 뒤집혀 있다면 다시 앞면으로 돌려놓아요
      cardEl.classList.remove('flipped');

      // 현재 순서의 단어 객체를 가져와요
      const currentWord = WORDS[currentIndex];

      // 글자들을 현재 단어 내용으로 바꿔줘요
      wordEnEl.textContent = currentWord.en;
      wordKoEl.textContent = currentWord.ko;
      wordExEl.textContent = currentWord.ex;

      // 진도 표시를 계산해서 바꿔줘요 (예: "1 / 30")
      progressEl.textContent = `${currentIndex + 1} / ${WORDS.length}`;

      // 카드가 바뀌었으니 새로운 퀴즈 문제도 새로 만들어줘요
      renderQuiz();
    }

    // 영어 단어를 목소리로 읽어주는 함수예요 (속도 선택 가능)
    function speakWord(speed) {
      // 웹 브라우저가 음성 합성(speechSynthesis)을 지원하는지 확인해요
      if ('speechSynthesis' in window) {
        // 이전에 읽고 있던 소리가 있다면 멈춰요
        window.speechSynthesis.cancel();

        // 읽을 영어 단어를 가져와서 음성 객체를 만들어줘요
        const utterance = new SpeechSynthesisUtterance(WORDS[currentIndex].en);
        // 언어를 미국 영어로 설정해요
        utterance.lang = 'en-US';
        // 말하는 속도를 설정해요 (일반: 1.0, 느리게: 0.6)
        utterance.rate = speed;

        // 브라우저가 소리를 읽어주게 명령해요
        window.speechSynthesis.speak(utterance);
      } else {
        // 소리 기능을 지원하지 않는 옛날 브라우저일 때 알림창을 띄워요
        alert("이 브라우저는 소리를 지원하지 않아요");
      }
    }

    // 퀴즈 문제를 만들어 화면에 보여주는 함수예요
    function renderQuiz() {
      // 보기 버튼을 담는 곳을 일단 깨끗이 비워요
      quizOptionsEl.innerHTML = '';

      // 현재 단어의 진짜 정답 뜻을 가져와요
      const correctMeaning = WORDS[currentIndex].ko;

      // 전체 단어들 중에서 오답으로 쓸 다른 뜻들을 뽑아내요
      const otherMeanings = WORDS
        .filter(item => item.ko !== correctMeaning) // 정답이 아닌 단어만 골라내요
        .map(item => item.ko); // 뜻 글자만 뽑아내요

      // 오답 순서를 무작위로 섞어요
      otherMeanings.sort(() => Math.random() - 0.5);

      // 무작위로 섞인 오답 중 앞에 3개만 가져와요
      const wrongChoices = otherMeanings.slice(0, 3);

      // 정답 1개와 오답 3개를 합쳐서 보기 4개 목록을 만들어줘요
      const choices = [correctMeaning, ...wrongChoices];

      // 보기 4개의 순서도 마구 섞어줘요
      choices.sort(() => Math.random() - 0.5);

      // 4개의 보기를 하나씩 버튼으로 만들어서 화면에 붙여요
      choices.forEach(choiceText => {
        const btn = document.createElement('button'); // 새 버튼 태그를 만들어줘요
        btn.classList.add('quiz-btn'); // CSS 디자인용 클래스를 붙여줘요
        btn.textContent = choiceText; // 보기 글자를 버튼에 넣어줘요

        // 보기 버튼을 눌렀을 때 정답인지 확인하는 클릭 이벤트를 달아줘요
        btn.addEventListener('click', function() {
          // 한 번 누르면 다른 보기 버튼을 못 누르게 전부 막아요
          const allBtns = quizOptionsEl.querySelectorAll('.quiz-btn');
          allBtns.forEach(b => b.disabled = true);

          // 눌른 보기가 정답과 일치하는지 비교해요
          if (choiceText === correctMeaning) {
            btn.classList.add('correct'); // 초록색으로 바꿔줘요
            correctCount++; // 맞힌 개수를 1개 올려요
          } else {
            btn.classList.add('wrong'); // 빨간색으로 바꿔줘요
            wrongCount++; // 틀린 개수를 1개 올려요

            // 틀렸을 때는 어떤 게 진짜 정답이었는지 초록색으로 표시해 줘요
            allBtns.forEach(b => {
              if (b.textContent === correctMeaning) {
                b.classList.add('correct');
              }
            });
          }

          // 점수판 내용을 새로 갱신해요
          quizScoreEl.textContent = `맞음: ${correctCount} | 틀림: ${wrongCount}`;
        });

        // 만든 보기 버튼을 화면 상자에 집어넣어요
        quizOptionsEl.appendChild(btn);
      });
    }

    // 카드를 클릭하면 뒤집히도록 이벤트를 걸어줘요
    cardContainer.addEventListener('click', function() {
      cardEl.classList.toggle('flipped'); // flipped 클래스를 붙였다 뗐다 해요
    });

    // 이전 버튼을 눌렀을 때 실행되는 코드예요
    prevBtn.addEventListener('click', function() {
      // 첫 번째 단어가 아니면 하나 전 단어로 돌아가요
      if (currentIndex > 0) {
        currentIndex--;
        updateCard(); // 화면을 바뀐 단어로 새로 그려요
      }
    });

    // 다음 버튼을 눌렀을 때 실행되는 코드예요
    nextBtn.addEventListener('click', function() {
      // 마지막 단어가 아니면 다음 단어로 넘어가요
      if (currentIndex < WORDS.length - 1) {
        currentIndex++;
        updateCard(); // 화면을 바뀐 단어로 새로 그려요
      }
    });

    // 일반 속도 소리 버튼(🔊)을 클릭했을 때 동작해요
    speakNormalBtn.addEventListener('click', function(e) {
      e.stopPropagation(); // 카드가 뒤집히지 않게 클릭 이벤트를 멈춰요
      speakWord(1.0); // 일반 속도(1.0)로 읽어줘요
    });

    // 거북이 속도 소리 버튼(🐢🔊)을 클릭했을 때 동작해요
    speakSlowBtn.addEventListener('click', function(e) {
      e.stopPropagation(); // 카드가 뒤집히지 않게 클릭 이벤트를 멈춰요
      speakWord(0.6); // 느린 속도(0.6)로 읽어줘요
    });

    // 웹페이지가 맨 처음 열렸을 때 첫 번째 단어와 퀴즈를 화면에 세팅해요
    updateCard();
  </script>
</body>
</html>
