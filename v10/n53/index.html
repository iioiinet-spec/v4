<!DOCTYPE html> <!-- 이 문서가 HTML5 표준 형식임을 브라우저에 알려줍니다. -->
<html lang="ko"> <!-- 문서의 기본 언어를 한국어(ko)로 설정합니다. -->
<head> <!-- 웹페이지의 정보와 설정(제목, 스타일 등)을 담는 구역입니다. -->
  <meta charset="UTF-8"> <!-- 글자가 깨지지 않도록 문자 인코딩을 UTF-8로 설정합니다. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 모바일 기기에서도 화면 크기에 맞게 자동으로 조절되도록 합니다. -->
  <title>영어 단어 카드 & 퀴즈</title> <!-- 브라우저 탭 상단에 표시될 웹페이지 제목입니다. -->
  <!-- 구글 폰트(Jua, Fredoka) 불러오기 -->
  <link rel="preconnect" href="https://fonts.googleapis.com"> <!-- 구글 폰트 서버 연결 미리 준비 -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> <!-- 폰트 자원 교차 출처 준비 -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Jua&display=swap" rel="stylesheet"> <!-- Jua(한글)와 Fredoka(영어) 폰트 불러오기 -->
  <style> /* 웹페이지의 디자인(모양, 색상, 배치 등)을 정의하는 공간입니다. */
    :root {
      --bg-color: #3e65ac; /* 메인 전체 배경색 (파란색 계열) */
      --card-bg: #f50505; /* 카드 바탕색 (선명한 빨간색) */
      --text-color: #16243d; /* 기본 글자색 (어두운 남색) */
      --point-color: #2f6be0; /* 포인트 강조 및 버튼 색상 (밝은 파란색) */
      --card-text-color: #ffffff; /* 카드 내부 글자색 (하얀색) */
      --container-bg: #ffffff; /* 중앙 메인 컨테이너 배경색 (하얀색) */
      --border-radius-card: 22px; /* 카드 모서리 둥글기 크기 */
      --border-radius-container: 24px; /* 메인 박스 모서리 둥글기 크기 */
      --font-en: 'Fredoka', sans-serif; /* 영어 단어 전용 구글 폰트 */
      --font-ko: 'Jua', sans-serif; /* 한글 및 기본 글꼴 전용 구글 폰트 */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; } /* 모든 태그의 여백을 없애고 크기 계산을 정확하게 만듭니다. */
    body { font-family: var(--font-ko); display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: var(--bg-color); color: var(--text-color); } /* 무드: 시원한 하늘 아래 펼쳐진 강렬한 레드 카드의 신나는 단어 게임장 */
    .container { width: 340px; background-color: var(--container-bg); padding: 25px; border-radius: var(--border-radius-container); box-shadow: 0 12px 24px rgba(0,0,0,0.25); text-align: center; } /* 단어장 전체를 감싸는 흰색 박스 스타일입니다. */
    .progress { font-size: 18px; font-weight: bold; color: var(--point-color); margin-bottom: 15px; font-family: var(--font-en); } /* 상단 진도율(예: 1 / 50) 글자 스타일입니다. */
    .card-container { perspective: 1000px; width: 100%; height: 210px; cursor: pointer; } /* 3D 효과를 주기 위한 입체감 설정입니다. */
    .card { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s; border-radius: var(--border-radius-card); } /* 실제 단어 카드의 모양과 뒤집어지는 애니메이션 시간(0.6초)입니다. */
    .card.flipped { transform: rotateY(180deg); } /* 카드가 뒤집혔을 때 Y축 기준으로 180도 회전시킵니다. */
    .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; border-radius: var(--border-radius-card); padding: 15px; background-color: var(--card-bg); color: var(--card-text-color); box-shadow: 0 6px 12px rgba(0,0,0,0.15); } /* 카드 앞면과 뒷면의 공통 모양입니다. */
    .card-front { background-color: var(--card-bg); } /* 카드 앞면(영어 단어)의 배경색입니다. */
    .card-back { background-color: var(--card-bg); transform: rotateY(180deg); } /* 카드 뒷면(뜻, 예문)의 배경색과 미리 뒤집어둔 상태 설정입니다. */
    .en-word { font-family: var(--font-en); font-size: 32px; font-weight: 700; letter-spacing: 1px; } /* 영어 단어 글자 크기와 폰트 설정입니다. */
    .ko-word { font-family: var(--font-ko); font-size: 26px; font-weight: bold; margin-bottom: 8px; color: #ffeb3b; } /* 한글 뜻 글자 크기와 포인트 노란색 설정입니다. */
    .ex-sentence { font-family: var(--font-en); font-size: 15px; color: #ffffff; opacity: 0.9; } /* 예문 글자 크기와 스타일 설정입니다. */
    .btn-container { display: flex; justify-content: space-between; margin-top: 18px; } /* 이전, 다음 버튼을 양쪽에 나누어 배치합니다. */
    button.nav-btn { font-family: var(--font-ko); padding: 10px 22px; font-size: 16px; border: none; background-color: var(--point-color); color: white; border-radius: 12px; cursor: pointer; transition: background-color 0.2s, transform 0.1s; } /* 이동 버튼의 배경색, 글자색, 모양 설정입니다. */
    button.nav-btn:hover { background-color: #1e52b7; } /* 마우스를 버튼 위에 올렸을 때 더 진한 파란색으로 변경합니다. */
    button.nav-btn:active { transform: scale(0.96); } /* 버튼을 누를 때 튀어 나오는 효과입니다. */

    /* 퀴즈 구역 스타일 */
    .quiz-container { margin-top: 20px; padding-top: 15px; border-top: 2px dashed #e0e0e0; } /* 퀴즈 상단 점선 구분선과 여백입니다. */
    .quiz-title { font-family: var(--font-ko); font-size: 17px; font-weight: bold; margin-bottom: 12px; color: var(--text-color); } /* 퀴즈 질문 제목 스타일입니다. */
    .quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } /* 보기 버튼 4개를 2개씩 2줄로 배치합니다. */
    .quiz-btn { font-family: var(--font-ko); padding: 10px; border: 2px solid #e2e8f0; border-radius: 10px; background-color: #f8fafc; color: var(--text-color); cursor: pointer; font-size: 15px; transition: all 0.2s; } /* 보기 버튼 스타일입니다. */
    .quiz-btn:hover { border-color: var(--point-color); background-color: #edf2f7; } /* 마우스 hover 시 테두리 색상 변경입니다. */
    .quiz-btn.correct { background-color: #4caf50 !important; color: white !important; border-color: #4caf50 !important; } /* 정답 시 초록색으로 변경되는 스타일입니다. */
    .quiz-btn.dimmed { opacity: 0.4; cursor: default; } /* 선택 완료 후 다른 보기들을 흐리게 만드는 스타일입니다. */
    .quiz-score { margin-top: 12px; font-family: var(--font-ko); font-size: 15px; font-weight: bold; color: var(--text-color); } /* 맞은 개수/틀린 개수 텍스트 스타일입니다. */
  </style> <!-- 스타일 정의 끝 -->
</head> <!-- 헤더 구역 끝 -->
<body> <!-- 웹페이지에 실제로 눈으로 보이는 요소들을 넣는 구역입니다. -->

  <div class="container"> <!-- 전체 단어장을 담는 메인 상자 시작 -->
    <div class="progress" id="progress">1 / 50</div> <!-- 현재 단어 위치와 전체 단어 수를 보여주는 구역 -->

    <div class="card-container" id="cardContainer"> <!-- 클릭 이벤트를 받을 카드 영역 -->
      <div class="card" id="card"> <!-- 3D로 회전할 실제 카드 시작 -->
        <div class="card-face card-front"> <!-- 카드 앞면 구역 -->
          <div class="en-word" id="enText">apple</div> <!-- 영어 단어가 들어갈 위치 -->
        </div> <!-- 카드 앞면 끝 -->
        <div class="card-face card-back"> <!-- 카드 뒷면 구역 -->
          <div class="ko-word" id="koText">사과</div> <!-- 한글 뜻이 들어갈 위치 -->
          <div class="ex-sentence" id="exText">I eat an apple.</div> <!-- 예문이 들어갈 위치 -->
        </div> <!-- 카드 뒷면 끝 -->
      </div> <!-- 카드 끝 -->
    </div> <!-- 카드 영역 끝 -->

    <div class="btn-container"> <!-- 이전, 다음 버튼을 감싸는 구역 -->
      <button class="nav-btn" id="prevBtn">이전</button> <!-- 이전 단어로 이동하는 버튼 -->
      <button class="nav-btn" id="nextBtn">다음</button> <!-- 다음 단어로 이동하는 버튼 -->
    </div> <!-- 버튼 구역 끝 -->

    <!-- 퀴즈 구역 시작 -->
    <div class="quiz-container"> <!-- 퀴즈 전체를 감싸는 상자 -->
      <p class="quiz-title">이 단어의 뜻은?</p> <!-- 퀴즈 질문 제목 -->
      <div class="quiz-options" id="quizOptions"></div> <!-- 보기 버튼 4개가 생성될 위치 -->
      <div class="quiz-score"> <!-- 맞은 개수와 틀린 개수를 보여주는 구역 -->
        맞음: <span id="correctCount">0</span>개 | 틀림: <span id="incorrectCount">0</span>개 <!-- 점수 표시 -->
      </div> <!-- 점수 구역 끝 -->
    </div> <!-- 퀴즈 구역 끝 -->

  </div> <!-- 메인 상자 끝 -->

  <script> /* 웹페이지에 동적인 기능(버튼 클릭, 카드 뒤집기, 퀴즈 등)을 넣는 자바스크립트 구역입니다. */

    // ==========================================
    // [여기만 고치세요] 단어 목록 배열
    // en: 영어단어, ko: 한국어뜻, ex: 예문
    // ==========================================
    const words = [
      { en: 'apple', ko: '사과', ex: 'I eat an apple.' },
      { en: 'book', ko: '책', ex: 'She reads a book.' },
      { en: 'cat', ko: '고양이', ex: 'The cat is sleeping.' },
      { en: 'dog', ko: '개', ex: 'The dog barks loud.' },
      { en: 'elephant', ko: '코끼리', ex: 'An elephant is big.' },
      { en: 'friend', ko: '친구', ex: 'He is my best friend.' },
      { en: 'game', ko: '게임', ex: 'We play a fun game.' },
      { en: 'house', ko: '집', ex: 'This is my house.' },
      { en: 'ice', ko: '얼음', ex: 'Ice is very cold.' },
      { en: 'juice', ko: '주스', ex: 'I drink orange juice.' },
      { en: 'king', ko: '왕', ex: 'The king wears a crown.' },
      { en: 'lion', ko: '사자', ex: 'The lion is strong.' },
      { en: 'mother', ko: '엄마', ex: 'My mother loves me.' },
      { en: 'night', ko: '밤', ex: 'Good night, sleep well.' },
      { en: 'orange', ko: '오렌지', ex: 'An orange is sweet.' },
      { en: 'pencil', ko: '연필', ex: 'I write with a pencil.' },
      { en: 'queen', ko: '여왕', ex: 'The queen is kind.' },
      { en: 'rabbit', ko: '토끼', ex: 'A rabbit can jump high.' },
      { en: 'school', ko: '학교', ex: 'I go to school.' },
      { en: 'teacher', ko: '선생님', ex: 'The teacher teaches us.' },
      { en: 'umbrella', ko: '우산', ex: 'Bring an umbrella today.' },
      { en: 'voice', ko: '목소리', ex: 'She has a nice voice.' },
      { en: 'water', ko: '물', ex: 'Drink plenty of water.' },
      { en: 'yellow', ko: '노란색', ex: 'The banana is yellow.' },
      { en: 'zoo', ko: '동물원', ex: 'We visit the zoo.' },
      { en: 'bird', ko: '새', ex: 'The bird sings in the tree.' },
      { en: 'car', ko: '자동차', ex: 'My dad drives a red car.' },
      { en: 'door', ko: '문', ex: 'Please open the door.' },
      { en: 'egg', ko: '계란', ex: 'I eat an egg for breakfast.' },
      { en: 'fish', ko: '물고기', ex: 'The fish swims fast.' },
      { en: 'green', ko: '초록색', ex: 'The grass is green.' },
      { en: 'hand', ko: '손', ex: 'Wash your hands clean.' },
      { en: 'island', ko: '섬', ex: 'They live on an island.' },
      { en: 'jump', ko: '뛰다', ex: 'I can jump very high.' },
      { en: 'kite', ko: '연', ex: 'He flies a kite.' },
      { en: 'lemon', ko: '레몬', ex: 'A lemon is sour.' },
      { en: 'milk', ko: '우유', ex: 'I drink milk every day.' },
      { en: 'nest', ko: '둥지', ex: 'The bird is in its nest.' },
      { en: 'ocean', ko: '바다', ex: 'The ocean is vast and deep.' },
      { en: 'park', ko: '공원', ex: 'Let us play in the park.' },
      { en: 'rain', ko: '비', ex: 'Rain falls from the sky.' },
      { en: 'sun', ko: '태양', ex: 'The sun shines bright.' },
      { en: 'tree', ko: '나무', ex: 'The tree is very tall.' },
      { en: 'star', ko: '별', ex: 'Look at the bright star.' },
      { en: 'train', ko: '기차', ex: 'The train is coming now.' },
      { en: 'window', ko: '창문', ex: 'Look outside the window.' },
      { en: 'winter', ko: '겨울', ex: 'Snow falls in winter.' },
      { en: 'music', ko: '음악', ex: 'I like listening to music.' },
      { en: 'smile', ko: '미소', ex: 'She has a lovely smile.' },
      { en: 'family', ko: '가족', ex: 'I love my family.' }
    ];

    // 필요한 태그(요소)들을 자바스크립트로 가져옵니다.
    const cardContainer = document.getElementById('cardContainer'); // 카드 감싸는 상자 가져오기
    const card = document.getElementById('card'); // 카드 전체 태그 가져오기
    const enText = document.getElementById('enText'); // 영어 단어 텍스트 태그 가져오기
    const koText = document.getElementById('koText'); // 한글 뜻 텍스트 태그 가져오기
    const exText = document.getElementById('exText'); // 예문 텍스트 태그 가져오기
    const progress = document.getElementById('progress'); // 진도 표시 텍스트 태그 가져오기
    const prevBtn = document.getElementById('prevBtn'); // 이전 버튼 가져오기
    const nextBtn = document.getElementById('nextBtn'); // 다음 버튼 가져오기

    let currentIndex = 0; // 현재 몇 번째 단어를 보고 있는지 저장하는 변수 (0부터 시작)
    let isFlipped = false; // 카드가 뒤집혔는지 확인하는 변수 (거짓 = 앞면, 참 = 뒷면)
    let correctScore = 0; // 맞은 개수를 저장하는 변수
    let incorrectScore = 0; // 틀린 개수를 저장하는 변수
    let isQuizAnswered = false; // 현재 단어에서 퀴즈 응답을 마쳤는지 확인하는 변수

    // 카드의 내용을 화면에 새로 그려주는 함수
    function updateCard() {
      card.classList.remove('flipped'); // 카드를 앞면 상태로 돌림
      isFlipped = false; // 뒤집힘 상태 변수를 거짓으로 바꿈
      isQuizAnswered = false; // 퀴즈 응답 상태를 초기화
      enText.textContent = words[currentIndex].en; // 현재 단어의 영어 글자 채우기
      koText.textContent = words[currentIndex].ko; // 현재 단어의 한국어 뜻 채우기
      exText.textContent = words[currentIndex].ex; // 현재 단어의 예문 채우기
      progress.textContent = `${currentIndex + 1} / ${words.length}`; // 현재 번호 / 전체 개수 표시
      renderQuiz(); // 카드 내용이 바뀔 때 퀴즈도 새로 생성함
    }

    // 퀴즈 옵션 버튼 4개를 만들고 배치하는 함수
    function renderQuiz() {
      const optionsContainer = document.getElementById('quizOptions'); // 보기 버튼을 담을 태그 가져오기
      optionsContainer.innerHTML = ''; // 기존 보기 버튼들을 깨끗이 비움
      const currentWord = words[currentIndex]; // 현재 정답 단어 객체 가져오기

      // 다른 단어들에서 뜻만 모아 오답 목록 배열 만들기
      let otherMeanings = words.filter((_, idx) => idx !== currentIndex).map(w => w.ko);
      // 오답 목록을 무작위로 섞음
      otherMeanings.sort(() => Math.random() - 0.5);
      // 오답 중 상위 3개를 뽑음
      let options = otherMeanings.slice(0, 3);
      // 정답 뜻을 배열에 추가함
      options.push(currentWord.ko);
      // 정답과 오답이 섞이도록 전체 보기를 다시 무작위로 섞음
      options.sort(() => Math.random() - 0.5);

      // 보기 4개를 각각 버튼 태그로 만들어서 화면에 붙임
      options.forEach(optionText => {
        const btn = document.createElement('button'); // 새 버튼 태그 생성
        btn.className = 'quiz-btn'; // 버튼에 스타일 클래스 적용
        btn.textContent = optionText; // 버튼 글자에 뜻 넣기
        // 버튼 클릭 이벤트 추가
        btn.addEventListener('click', () => handleQuizClick(btn, optionText === currentWord.ko));
        optionsContainer.appendChild(btn); // 생성한 버튼을 퀴즈 상자에 추가
      });
    }

    // 퀴즈 보기를 클릭했을 때 실행되는 함수
    function handleQuizClick(selectedBtn, isCorrect) {
      if (isQuizAnswered) return; // 이미 응답했다면 더 이상 클릭되지 않게 막음
      isQuizAnswered = true; // 응답했음을 표시함

      const allBtns = document.querySelectorAll('.quiz-btn'); // 모든 보기 버튼 가져오기
      allBtns.forEach(btn => {
        if (btn.textContent === words[currentIndex].ko) {
          btn.classList.add('correct'); // 정답 버튼은 항상 초록색으로 표시
        } else {
          btn.classList.add('dimmed'); // 정답이 아닌 버튼들은 흐리게 표시
        }
      });

      if (isCorrect) {
        correctScore++; // 정답이면 맞은 개수 1 증가
        document.getElementById('correctCount').textContent = correctScore; // 맞은 개수 화면 업데이트
      } else {
        incorrectScore++; // 오답이면 틀린 개수 1 증가
        document.getElementById('incorrectCount').textContent = incorrectScore; // 틀린 개수 화면 업데이트
      }
    }

    // 카드를 클릭했을 때 뒤집히는 동작 설정
    cardContainer.addEventListener('click', () => {
      isFlipped = !isFlipped; // 뒤집힘 상태를 반대로 바꿈
      card.classList.toggle('flipped'); // 카드 태그에 flipped 클래스를 넣었다 뺐다 함
    });

    // 이전 버튼을 눌렀을 때 동작 설정
    prevBtn.addEventListener('click', () => {
      if (currentIndex > 0) { // 첫 번째 단어가 아닐 때만 이전으로 이동
        currentIndex--; // 단어 번호를 1 감소
        updateCard(); // 화면 변경
      }
    });

    // 다음 버튼을 눌렀을 때 동작 설정
    nextBtn.addEventListener('click', () => {
      if (currentIndex < words.length - 1) { // 마지막 단어가 아닐 때만 다음으로 이동
        currentIndex++; // 단어 번호를 1 증가
        updateCard(); // 화면 변경
      }
    });

    // 처음 웹페이지가 열렸을 때 첫 번째 단어와 퀴즈를 세팅함
    updateCard();
  </script> <!-- 자바스크립트 구역 끝 -->
</body> <!-- 본문 구역 끝 -->
</html> <!-- HTML 문서 끝 -->
