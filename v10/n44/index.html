<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>중등 1학년 필수 영단어 & 단어 배틀 & 상점</title>
    <!-- 구글 폰트: 필기체(Caveat), 배달의민족 도현체(Do Hyeon), 기본 폰트(Poppins) -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Do+Hyeon&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            --card-bg: #fdfbf7;
            --text-main: #222222;
            --point-color: #64748b;
        }

        body {
            font-family: 'Do Hyeon', 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: var(--bg-gradient);
            color: var(--text-main);
            overflow: hidden;
            transition: background 1s ease;
            position: relative;
        }

        /* ☁️🕊️ 리얼 하늘 애니메이션 레이어 */
        .sky-animation-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: -1;
            display: none;
        }

        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 200px;
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.05));
            animation: moveClouds linear infinite;
        }
        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 50%;
        }
        .c-1 { width: 220px; height: 70px; top: 10%; animation-duration: 32s; opacity: 0.9; }
        .c-1::before { width: 90px; height: 90px; top: -45px; left: 30px; }
        .c-1::after { width: 110px; height: 110px; top: -60px; left: 95px; }

        .c-2 { width: 160px; height: 50px; top: 35%; animation-duration: 22s; animation-delay: -7s; opacity: 0.7; }
        .c-2::before { width: 60px; height: 60px; top: -30px; left: 20px; }
        .c-2::after { width: 80px; height: 80px; top: -45px; left: 65px; }

        .c-3 { width: 280px; height: 90px; top: 70%; animation-duration: 45s; animation-delay: -15s; opacity: 0.8; }
        .c-3::before { width: 110px; height: 110px; top: -60px; left: 40px; }
        .c-3::after { width: 140px; height: 140px; top: -80px; left: 120px; }

        @keyframes moveClouds {
            0% { transform: translateX(-350px); }
            100% { transform: translateX(calc(100vw + 350px)); }
        }

        .sky-bird {
            position: absolute;
            font-size: 26px;
            animation: flySkyBirds linear infinite;
            opacity: 0.9;
        }
        .sb-1 { top: 20%; animation-duration: 20s; animation-delay: -2s; }
        .sb-2 { top: 50%; animation-duration: 28s; animation-delay: -10s; font-size: 20px; }
        .sb-3 { top: 15%; animation-duration: 24s; animation-delay: -16s; font-size: 18px; }

        @keyframes flySkyBirds {
            0% { transform: translateX(-60px) translateY(0); }
            50% { transform: translateX(50vw) translateY(-40px); }
            100% { transform: translateX(calc(100vw + 60px)) translateY(15px); }
        }

        /* 🎃 할로윈 테마 애니메이션 레이어 */
        .halloween-animation-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: -1;
            display: none;
        }
        .halloween-moon {
            position: absolute;
            top: 40px;
            right: 60px;
            width: 90px;
            height: 90px;
            background: #fef08a;
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(254, 240, 138, 0.6);
        }
        .floating-ghost {
            position: absolute;
            font-size: 30px;
            animation: floatGhost ease-in-out infinite;
        }
        .hg-1 { top: 20%; left: 10%; animation-duration: 4s; }
        .hg-2 { top: 60%; right: 15%; animation-duration: 5s; animation-delay: -2s; }
        
        @keyframes floatGhost {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        /* 👼✨ 천국 (Heaven) 테마 레이어 */
        .heaven-animation-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: -1;
            display: none;
        }
        .heaven-ray {
            position: absolute;
            top: -100px;
            left: 20%;
            width: 300px;
            height: 150vh;
            background: linear-gradient(to bottom, rgba(255, 255, 220, 0.8) 0%, rgba(255, 215, 0, 0.2) 50%, transparent 100%);
            transform: rotate(25deg);
            filter: blur(40px);
            animation: raySway 6s ease-in-out infinite alternate;
        }
        .heaven-ray-2 {
            position: absolute;
            top: -100px;
            left: 55%;
            width: 400px;
            height: 150vh;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.9) 0%, rgba(254, 240, 138, 0.3) 50%, transparent 100%);
            transform: rotate(-15deg);
            filter: blur(50px);
            animation: raySway2 8s ease-in-out infinite alternate;
        }
        @keyframes raySway {
            0% { transform: rotate(25deg) scaleX(0.9); opacity: 0.6; }
            100% { transform: rotate(30deg) scaleX(1.3); opacity: 1; }
        }
        @keyframes raySway2 {
            0% { transform: rotate(-15deg) scaleX(1.1); opacity: 0.5; }
            100% { transform: rotate(-20deg) scaleX(0.8); opacity: 0.9; }
        }
        .heaven-cloud-sea {
            position: absolute;
            bottom: -50px;
            left: -50px;
            right: -50px;
            height: 250px;
            background: radial-gradient(ellipse at center, rgba(255,255,255,0.9) 0%, rgba(255,248,220,0.6) 50%, transparent 70%);
            filter: blur(20px);
            animation: cloudSeaFloat 10s ease-in-out infinite alternate;
        }
        @keyframes cloudSeaFloat {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-15px) scale(1.03); }
        }
        .heaven-particle {
            position: absolute;
            font-size: 24px;
            animation: heavenFall linear infinite;
            filter: drop-shadow(0 0 8px rgba(255,215,0,0.8));
        }
        .hp-1 { left: 10%; animation-duration: 8s; animation-delay: 0s; }
        .hp-2 { left: 30%; animation-duration: 11s; animation-delay: -4s; font-size: 18px; }
        .hp-3 { left: 55%; animation-duration: 7s; animation-delay: -2s; font-size: 28px; }
        .hp-4 { left: 75%; animation-duration: 10s; animation-delay: -6s; font-size: 20px; }
        .hp-5 { left: 90%; animation-duration: 9s; animation-delay: -3s; }

        @keyframes heavenFall {
            0% { transform: translateY(-50px) translateX(0) rotate(0deg); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(105vh) translateX(50px) rotate(360deg); opacity: 0; }
        }

        /* 화면 흔들림(Shake) 효과 */
        @keyframes screenShake {
            0% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-10px, 5px) rotate(-2deg); }
            40% { transform: translate(10px, -5px) rotate(2deg); }
            60% { transform: translate(-7px, -3px) rotate(-1deg); }
            80% { transform: translate(7px, 3px) rotate(1deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        .shake {
            animation: screenShake 0.4s ease-in-out;
        }

        /* 폭죽 효과 */
        .firework {
            position: fixed;
            font-size: 24px;
            z-index: 9999;
            pointer-events: none;
            animation: fireworkAnim 0.8s ease-out forwards;
        }
        @keyframes fireworkAnim {
            0% { transform: scale(0.2) translateY(0); opacity: 1; }
            100% { transform: scale(1.8) translateY(-80px); opacity: 0; }
        }

        /* 상단 정보 및 탭 영역 */
        .top-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            z-index: 10;
        }

        .coin-board {
            background-color: rgba(255, 255, 255, 0.85);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 18px;
            border: 2px solid var(--point-color);
            display: flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .mode-tabs {
            display: flex;
            gap: 6px;
        }
        .mode-tabs button {
            background-color: #cbd5e1;
            color: #334155;
            border: none;
            padding: 6px 10px;
            border-radius: 20px;
            font-family: 'Do Hyeon', sans-serif;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .mode-tabs button.active {
            background-color: var(--point-color);
            color: #ffffff;
        }

        /* 메인 카드 영역 */
        .container {
            width: 360px;
            height: 240px;
            margin-bottom: 20px;
            z-index: 10;
        }

        .card-container {
            perspective: 1000px;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
        }
        .card.flipped {
            transform: rotateY(180deg);
        }
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            background-color: var(--card-bg);
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }
        
        .card-front {
            font-family: 'Caveat', cursive;
            font-size: 52px;
            font-weight: 700;
        }
        
        .card-back {
            transform: rotateY(180deg);
            padding: 24px;
            box-sizing: border-box;
            text-align: center;
        }
        .card-back span {
            font-family: 'Do Hyeon', sans-serif;
            font-size: 32px;
            color: var(--point-color);
        }
        .card-back p {
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            margin-top: 10px;
            color: #555555;
        }

        /* 퀴즈 및 배틀 박스 스타일 */
        .quiz-box {
            width: 100%;
            height: 100%;
            background-color: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            justify-content: space-between;
            border: 2px solid rgba(255, 255, 255, 0.8);
            text-align: center;
        }
        .quiz-question {
            font-size: 15px;
            color: var(--point-color);
        }
        .quiz-sentence {
            font-family: 'Poppins', sans-serif;
            font-size: 16px;
            font-weight: 600;
            color: #222222;
            margin: 10px 0;
            padding: 0 5px;
        }
        .quiz-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .quiz-option-btn {
            background-color: #f1f5f9;
            border: 1px solid #cbd5e1;
            color: #222222;
            padding: 8px;
            font-family: 'Do Hyeon', sans-serif;
            font-size: 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .quiz-option-btn:hover {
            background-color: var(--point-color);
            border-color: var(--point-color);
            color: #ffffff;
        }

        /* 단어 배틀 전용 스타일 */
        .battle-timer {
            font-size: 20px;
            font-weight: bold;
            color: #ef4444;
            margin-bottom: 5px;
        }
        .battle-input {
            width: 80%;
            padding: 10px;
            font-family: 'Do Hyeon', sans-serif;
            font-size: 18px;
            text-align: center;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            outline: none;
            margin-top: 5px;
        }
        .battle-input:focus {
            border-color: var(--point-color);
        }

        /* 상점 모드 스타일 */
        .shop-box {
            width: 100%;
            height: 100%;
            background-color: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-sizing: border-box;
            border: 2px solid rgba(255, 255, 255, 0.8);
            overflow-y: auto;
        }
        .shop-title {
            font-size: 18px;
            text-align: center;
            margin-bottom: 10px;
            color: var(--point-color);
        }
        .shop-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .shop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.75);
            padding: 6px 10px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            font-size: 14px;
        }
        .shop-item button {
            padding: 4px 10px;
            font-family: 'Do Hyeon', sans-serif;
            font-size: 13px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .buy-btn { background-color: #f59e0b; color: white; }
        .apply-btn { background-color: #10b981; color: white; }
        .applied-btn { background-color: #94a3b8; color: white; cursor: default; }

        /* 하단 컨트롤 영역 */
        .controls {
            display: flex;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }
        button.ctrl-btn {
            padding: 8px 18px;
            font-family: 'Do Hyeon', sans-serif;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            background-color: #cbd5e1;
            color: #334155;
            transition: all 0.2s;
        }
        button.ctrl-btn:hover {
            background-color: var(--point-color);
            color: #ffffff;
        }
        #progress {
            font-size: 16px;
            font-weight: 600;
            color: #334155;
        }

        /* 🪙 코인 떨어지는 효과 */
        .falling-coin {
            position: fixed;
            top: -30px;
            font-size: 24px;
            z-index: 9999;
            animation: fallCoin 1.2s ease-in forwards;
            pointer-events: none;
        }
        @keyframes fallCoin {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- ☁️🕊️ 리얼 하늘 애니메이션 레이어 -->
    <div id="skyLayer" class="sky-animation-layer">
        <div class="cloud c-1"></div>
        <div class="cloud c-2"></div>
        <div class="cloud c-3"></div>
        <div class="sky-bird sb-1">🕊️</div>
        <div class="sky-bird sb-2">🦅</div>
        <div class="sky-bird sb-3">🕊️</div>
    </div>

    <!-- 🎃 할로윈 테마 애니메이션 레이어 -->
    <div id="halloweenLayer" class="halloween-animation-layer">
        <div class="halloween-moon"></div>
        <div class="floating-ghost hg-1">👻</div>
        <div class="floating-ghost hg-2">🎃</div>
    </div>

    <!-- 👼✨ 천국 (Heaven) 테마 레이어 -->
    <div id="heavenLayer" class="heaven-animation-layer">
        <div class="heaven-ray"></div>
        <div class="heaven-ray-2"></div>
        <div class="heaven-cloud-sea"></div>
        <div class="heaven-particle hp-1">🪶</div>
        <div class="heaven-particle hp-2">✨</div>
        <div class="heaven-particle hp-3">🕊️</div>
        <div class="heaven-particle hp-4">✨</div>
        <div class="heaven-particle hp-5">🪶</div>
    </div>

    <!-- 상단 정보 및 탭 영역 -->
    <div class="top-header">
        <div class="coin-board">🪙 <span id="coinCount">0</span> 코인</div>
        <div class="mode-tabs">
            <button id="tabStudy" class="active" onclick="switchMode('study')">📖 학습</button>
            <button id="tabQuiz" onclick="switchMode('quiz')">✍️ 단어</button>
            <button id="tabSentence" onclick="switchMode('sentence')">📝 문장</button>
            <button id="tabBattle" onclick="switchMode('battle')">⚔️ 배틀</button>
            <button id="tabShop" onclick="switchMode('shop')">🛒 상점</button>
        </div>
    </div>

    <!-- 메인 컨테이너 -->
    <div class="container" id="mainContainer">
        <!-- 학습 모드 플래시카드 -->
        <div id="studyModeView" class="card-container" onclick="flipCard()">
            <div class="card" id="card">
                <div class="card-face card-front" id="wordEn">abandon</div>
                <div class="card-face card-back">
                    <span id="wordKo">포기하다, 버리다</span>
                    <p id="wordEx">He had to abandon his car.</p>
                    <button onclick="event.stopPropagation(); speakWord()" style="margin-top: 10px; padding: 6px 14px; font-family: 'Do Hyeon', sans-serif; font-size: 15px; background-color: var(--point-color); color: white; border: none; border-radius: 8px; cursor: pointer;">🔊 발음 듣기</button>
                </div>
            </div>
        </div>

        <!-- 단어 퀴즈 모드 -->
        <div id="quizModeView" class="quiz-box" style="display: none;">
            <div>
                <div class="quiz-question">다음 단어의 알맞은 뜻은? (+5코인)</div>
                <div class="quiz-word" id="quizTargetWord" style="font-family: 'Caveat', cursive; font-size: 40px; margin: 5px 0;">abandon</div>
            </div>
            <div class="quiz-options" id="quizOptionsContainer"></div>
        </div>

        <!-- 문장 퀴즈 모드 -->
        <div id="sentenceModeView" class="quiz-box" style="display: none;">
            <div>
                <div class="quiz-question">빈칸에 들어갈 알맞은 단어는? (+25코인)</div>
                <div class="quiz-sentence" id="sentenceTarget">He had to _____ his car.</div>
            </div>
            <div class="quiz-options" id="sentenceOptionsContainer"></div>
        </div>

        <!-- ⚔️ 단어 배틀 게임 모드 -->
        <div id="battleModeView" class="quiz-box" style="display: none;">
            <div>
                <div class="battle-timer" id="battleTimer">⏱️ 10초</div>
                <div class="quiz-question" id="battlePrompt">이 단어의 뜻을 입력하세요 (+5코인)</div>
                <div class="quiz-word" id="battleTargetWord" style="font-family: 'Caveat', cursive; font-size: 36px; margin: 2px 0;">abandon</div>
            </div>
            <div style="display: flex; justify-content: center;">
                <input type="text" id="battleInput" class="battle-input" placeholder="정답 입력 후 엔터!" onkeydown="checkBattleInput(event)">
            </div>
        </div>

        <!-- 상점 모드 -->
        <div id="shopModeView" class="shop-box" style="display: none;">
            <div class="shop-title">🎨 테마 꾸미기 상점</div>
            <div class="shop-list" id="shopListContainer"></div>
        </div>
    </div>

    <!-- 하단 컨트롤 영역 -->
    <div class="controls">
        <button class="ctrl-btn" onclick="prevStep()">이전</button>
        <span id="progress">1 / 30</span>
        <button class="ctrl-btn" onclick="nextStep()">다음</button>
    </div>

    <script>
        const baseWords = [
            { en: 'abandon', ko: ['포기하다', '버리다'], ex: 'He had to abandon his car.' },
            { en: 'absolute', ko: ['절대적인'], ex: 'I have absolute trust in you.' },
            { en: 'accompany', ko: ['동행하다', '함께 가다'], ex: 'I will accompany you.' },
            { en: 'achieve', ko: ['성취하다', '달성하다', '이루다'], ex: 'Work hard to achieve your goals.' },
            { en: 'admire', ko: ['존경하다', '감탄하다'], ex: 'I admire her courage.' },
            { en: 'advantage', ko: ['유리한 점', '장점', '이점'], ex: 'This gives us an advantage.' },
            { en: 'affect', ko: ['영향을 미치다', '영향을 주다'], ex: 'Weather affects our mood.' },
            { en: 'ancient', ko: ['고대의', '아주 옛날의', '고대'], ex: 'They found ancient ruins.' },
            { en: 'anxious', ko: ['걱정하는', '불안해하는', '초조한'], ex: 'She is anxious about the test.' },
            { en: 'appoint', ko: ['임명하다', '정하다', '지정하다'], ex: 'They appointed him as manager.' },
            { en: 'approve', ko: ['찬성하다', '승인하다'], ex: 'My parents approved my plan.' },
            { en: 'artificial', ko: ['인공의', '인조의'], ex: 'This flower is artificial.' },
            { en: 'assemble', ko: ['모으다', '조립하다', '모이다'], ex: 'Workers assemble computers.' },
            { en: 'atmosphere', ko: ['대기', '분위기'], ex: 'The atmosphere is cozy.' },
            { en: 'available', ko: ['구할 수 있는', '이용 가능한', '시간이 있는'], ex: 'Is this seat available?' },
            { en: 'barrier', ko: ['장벽', '장애물'], ex: 'Language is a communication barrier.' },
            { en: 'benefit', ko: ['혜택', '이익', '이점'], ex: 'Reading brings many benefits.' },
            { en: 'brilliant', ko: ['눈부신', '영리한', '명석한'], ex: 'She came up with a brilliant idea.' },
            { en: 'calculate', ko: ['계산하다'], ex: 'Can you calculate the cost?' },
            { en: 'cancel', ko: ['취소하다'], ex: 'They had to cancel the flight.' },
            { en: 'category', ko: ['범주', '부류', '종류'], ex: 'Sort books by category.' },
            { en: 'challenge', ko: ['도전', '난제'], ex: 'Life is full of challenges.' },
            { en: 'characteristic', ko: ['특징', '특성'], ex: 'Generosity is his characteristic.' },
            { en: 'circulate', ko: ['순환하다', '돌다', '유통되다'], ex: 'Blood circulates through the body.' },
            { en: 'collapse', ko: ['붕괴하다', '무너지다', '쓰러지다'], ex: 'The old bridge might collapse.' },
            { en: 'combine', ko: ['결합하다', '합치다'], ex: 'Combine flour and water.' },
            { en: 'comfort', ko: ['안락', '위로', '편안함'], ex: 'Home is a place of comfort.' },
            { en: 'common', ko: ['공통의', '흔한', '일반적인'], ex: 'They share a common interest.' },
            { en: 'compare', ko: ['비교하다'], ex: 'Compare the two products.' },
            { en: 'complex', ko: ['복잡한', '단지'], ex: 'This is a complex problem.' }
        ];

        const themes = [
            { id: 'default', name: '맑은 하늘 (기본)', price: 0, bg: 'linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%)', card: '#fdfbf7', point: '#64748b', sky: false, halloween: false, heaven: false },
            { id: 'pink', name: '🌸 파스텔 핑크', price: 20, bg: 'linear-gradient(135deg, #fce7f3 0%, #fbcfe8 100%)', card: '#fffdfd', point: '#db2777', sky: false, halloween: false, heaven: false },
            { id: 'mint', name: '🌿 민트 초코', price: 40, bg: 'linear-gradient(135deg, #ccfbf1 0%, #99f6e4 100%)', card: '#f0fdf4', point: '#0d9488', sky: false, halloween: false, heaven: false },
            { id: 'lavender', name: '💜 몽환 라벤더', price: 60, bg: 'linear-gradient(135deg, #ede9fe 0%, #ddd6fe 100%)', card: '#fcf8ff', point: '#7c3aed', sky: false, halloween: false, heaven: false },
            { id: 'dark', name: '🌙 다크 나이트', price: 100, bg: 'linear-gradient(135deg, #1e293b 0%, #0f172a 100%)', card: '#334155', point: '#38bdf8', sky: false, halloween: false, heaven: false },
            { id: 'live_sky', name: '☁️🕊️ 리얼 하늘 (스페셜)', price: 500, bg: 'linear-gradient(to bottom, #1d4ed8 0%, #60a5fa 50%, #e0f2fe 100%)', card: '#ffffff', point: '#1e40af', sky: true, halloween: false, heaven: false },
            { id: 'halloween', name: '🎃 오싹오싹 할로윈 (스페셜)', price: 700, bg: 'linear-gradient(135deg, #2e1065 0%, #4c1d95 50%, #1f1d2b 100%)', card: '#2d1b4e', point: '#f97316', sky: false, halloween: true, heaven: false },
            { id: 'heaven', name: '👼✨ 초호화 궁극의 천국 (레전드)', price: 1000, bg: 'linear-gradient(135deg, #fffbeb 0%, #fef08a 35%, #fbcfe8 70%, #c084fc 100%)', card: '#ffffff', point: '#d97706', sky: false, halloween: false, heaven: true }
        ];

        let coins = parseInt(localStorage.getItem('english_coins')) || 0;
        let ownedThemes = JSON.parse(localStorage.getItem('english_owned')) || ['default'];
        let currentThemeId = localStorage.getItem('english_theme') || 'default';

        let words = [...baseWords];
        let currentIndex = 0;
        let currentMode = 'study'; 
        let score = 0;

        let battleTimerInterval = null;
        let timeLeft = 10;
        let currentBattleTarget = null;
        let isMeaningToEng = true;

        const wordEnEl = document.getElementById('wordEn');
        const wordKoEl = document.getElementById('wordKo');
        const wordExEl = document.getElementById('wordEx');
        const cardEl = document.getElementById('card');
        const progressEl = document.getElementById('progress');
        const coinCountEl = document.getElementById('coinCount');
        const skyLayer = document.getElementById('skyLayer');
        const halloweenLayer = document.getElementById('halloweenLayer');
        const heavenLayer = document.getElementById('heavenLayer');
        const mainContainer = document.getElementById('mainContainer');
        
        const studyModeView = document.getElementById('studyModeView');
        const quizModeView = document.getElementById('quizModeView');
        const sentenceModeView = document.getElementById('sentenceModeView');
        const battleModeView = document.getElementById('battleModeView');
        const shopModeView = document.getElementById('shopModeView');
        
        const tabStudy = document.getElementById('tabStudy');
        const tabQuiz = document.getElementById('tabQuiz');
        const tabSentence = document.getElementById('tabSentence');
        const tabBattle = document.getElementById('tabBattle');
        const tabShop = document.getElementById('tabShop');
        
        const quizTargetWord = document.getElementById('quizTargetWord');
        const quizOptionsContainer = document.getElementById('quizOptionsContainer');
        const sentenceTarget = document.getElementById('sentenceTarget');
        const sentenceOptionsContainer = document.getElementById('sentenceOptionsContainer');
        
        const battleTimerEl = document.getElementById('battleTimer');
        const battlePromptEl = document.getElementById('battlePrompt');
        const battleTargetWordEl = document.getElementById('battleTargetWord');
        const battleInputEl = document.getElementById('battleInput');
        const shopListContainer = document.getElementById('shopListContainer');

        coinCountEl.textContent = coins;
        applyTheme(currentThemeId);

        // ⌨️ [이스터에그 수정 완료] 천국 또는 하늘 테마일 때 'm' 키를 누르면 무조건 10,000코인 지급!
        window.addEventListener('keydown', (event) => {
            if (event.key === 'm' || event.key === 'M') {
                // 단어 배틀 입력창에 글을 치는 중일 때만 제외하고 언제든 작동
                if (document.activeElement === battleInputEl) return;

                if (currentThemeId === 'live_sky' || currentThemeId === 'heaven') {
                    coins += 10000;
                    localStorage.setItem('english_coins', coins);
                    coinCountEl.textContent = coins;

                    triggerShakeAndFireworks();
                    alert('✨ 천국/하늘 테마 비밀 이스터에그 발동!\n🪙 코인 +10,000개 획득!!');
                }
            }
        });

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function switchMode(mode) {
            clearInterval(battleTimerInterval);
            currentMode = mode;
            cardEl.classList.remove('flipped');
            
            tabStudy.classList.remove('active');
            tabQuiz.classList.remove('active');
            tabSentence.classList.remove('active');
            tabBattle.classList.remove('active');
            tabShop.classList.remove('active');
            
            studyModeView.style.display = 'none';
            quizModeView.style.display = 'none';
            sentenceModeView.style.display = 'none';
            battleModeView.style.display = 'none';
            shopModeView.style.display = 'none';

            if (mode === 'study') {
                tabStudy.classList.add('active');
                studyModeView.style.display = 'block';
                updateCard();
            } else if (mode === 'quiz') {
                shuffleArray(words);
                currentIndex = 0;
                score = 0;
                tabQuiz.classList.add('active');
                quizModeView.style.display = 'flex';
                updateQuiz();
            } else if (mode === 'sentence') {
                shuffleArray(words);
                currentIndex = 0;
                score = 0;
                tabSentence.classList.add('active');
                sentenceModeView.style.display = 'flex';
                updateSentenceQuiz();
            } else if (mode === 'battle') {
                tabBattle.classList.add('active');
                battleModeView.style.display = 'flex';
                startBattleRound();
            } else if (mode === 'shop') {
                tabShop.classList.add('active');
                shopModeView.style.display = 'flex';
                renderShop();
            }
        }

        function updateCard() {
            wordEnEl.textContent = words[currentIndex].en;
            wordKoEl.textContent = words[currentIndex].ko[0];
            wordExEl.textContent = words[currentIndex].ex;
            progressEl.textContent = (currentIndex + 1) + ' / ' + words.length;
        }

        function updateQuiz() {
            progressEl.textContent = (currentIndex + 1) + ' / ' + words.length;
            const currentWord = words[currentIndex];
            quizTargetWord.textContent = currentWord.en;

            let options = [currentWord.ko[0]];
            while (options.length < 4) {
                const randomWord = baseWords[Math.floor(Math.random() * baseWords.length)];
                if (!options.includes(randomWord.ko[0])) {
                    options.push(randomWord.ko[0]);
                }
            }
            options.sort(() => Math.random() - 0.5);

            quizOptionsContainer.innerHTML = '';
            options.forEach(option => {
                const btn = document.createElement('button');
                btn.className = 'quiz-option-btn';
                btn.textContent = option;
                btn.onclick = () => {
                    const isCorrect = currentWord.ko.some(k => k === option);
                    checkWordAnswer(isCorrect, currentWord.ko[0]);
                };
                quizOptionsContainer.appendChild(btn);
            });
        }

        function updateSentenceQuiz() {
            progressEl.textContent = (currentIndex + 1) + ' / ' + words.length;
            const currentWord = words[currentIndex];
            
            let sentence = currentWord.ex;
            let regex = new RegExp(currentWord.en, 'gi');
            let blankSentence = sentence.replace(regex, '_____');
            sentenceTarget.textContent = blankSentence;

            let options = [currentWord.en];
            while (options.length < 4) {
                const randomWord = baseWords[Math.floor(Math.random() * baseWords.length)];
                if (!options.includes(randomWord.en)) {
                    options.push(randomWord.en);
                }
            }
            options.sort(() => Math.random() - 0.5);

            sentenceOptionsContainer.innerHTML = '';
            options.forEach(option => {
                const btn = document.createElement('button');
                btn.className = 'quiz-option-btn';
                btn.textContent = option;
                btn.onclick = () => checkSentenceAnswer(option, currentWord.en);
                sentenceOptionsContainer.appendChild(btn);
            });
        }

        function startBattleRound() {
            clearInterval(battleTimerInterval);
            timeLeft = 10;
            battleTimerEl.textContent = `⏱️ ${timeLeft}초`;
            battleInputEl.value = '';

            currentBattleTarget = baseWords[Math.floor(Math.random() * baseWords.length)];
            isMeaningToEng = Math.random() < 0.5;

            if (isMeaningToEng) {
                battlePromptEl.textContent = "뜻을 보고 알맞은 영단어를 입력하세요! (+5코인)";
                battleTargetWordEl.textContent = currentBattleTarget.ko.join(', ');
            } else {
                battlePromptEl.textContent = "영단어를 보고 알맞은 뜻을 입력하세요! (+5코인)";
                battleTargetWordEl.textContent = currentBattleTarget.en;
            }

            battleInputEl.focus();

            battleTimerInterval = setInterval(() => {
                timeLeft--;
                battleTimerEl.textContent = `⏱️ ${timeLeft}초`;
                if (timeLeft <= 0) {
                    clearInterval(battleTimerInterval);
                    triggerShake();
                    alert(`⏱️ 시간 초과! 정답은 [${isMeaningToEng ? currentBattleTarget.en : currentBattleTarget.ko[0]}] 입니다.`);
                    startBattleRound();
                }
            }, 1000);
        }

        function triggerShakeAndFireworks() {
            mainContainer.classList.add('shake');
            setTimeout(() => mainContainer.classList.remove('shake'), 400);

            for (let i = 0; i < 8; i++) {
                setTimeout(() => {
                    const fw = document.createElement('div');
                    fw.className = 'firework';
                    fw.textContent = ['🎆', '🎇', '✨', '🎉', '💥'][Math.floor(Math.random() * 5)];
                    fw.style.left = (window.innerWidth / 2 + (Math.random() - 0.5) * 250) + 'px';
                    fw.style.top = (window.innerHeight / 2 + (Math.random() - 0.5) * 200) + 'px';
                    document.body.appendChild(fw);
                    setTimeout(() => fw.remove(), 800);
                }, i * 60);
            }
        }

        function triggerShake() {
            mainContainer.classList.add('shake');
            setTimeout(() => mainContainer.classList.remove('shake'), 400);
        }

        function checkBattleInput(event) {
            if (event.key === 'Enter') {
                const userVal = battleInputEl.value.trim().toLowerCase();
                if (!userVal) return;

                let isCorrect = false;

                if (isMeaningToEng) {
                    if (userVal === currentBattleTarget.en.toLowerCase()) {
                        isCorrect = true;
                    }
                } else {
                    isCorrect = currentBattleTarget.ko.some(meaning => {
                        const cleanMeaning = meaning.toLowerCase().replace(/,/g, '').trim();
                        return cleanMeaning.includes(userVal) || userVal.includes(cleanMeaning);
                    });
                }

                if (isCorrect) {
                    clearInterval(battleTimerInterval);
                    triggerCoinDrop(5);
                    triggerShakeAndFireworks();
                    alert('🔥 정답! 폭죽 폭발! 🪙 코인 +5 획득!');
                    startBattleRound();
                } else {
                    triggerShake();
                    alert(`❌ 오답입니다! 정답은 [${isMeaningToEng ? currentBattleTarget.en : currentBattleTarget.ko.join(', ')}] 입니다.`);
                    battleInputEl.value = '';
                    battleInputEl.focus();
                }
            }
        }

        function triggerCoinDrop(amount) {
            coins += amount;
            localStorage.setItem('english_coins', coins);
            coinCountEl.textContent = coins;

            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    const coin = document.createElement('div');
                    coin.className = 'falling-coin';
                    coin.textContent = '🪙';
                    coin.style.left = Math.random() * window.innerWidth + 'px';
                    coin.style.animationDuration = (0.8 + Math.random() * 0.6) + 's';
                    document.body.appendChild(coin);
                    setTimeout(() => coin.remove(), 1500);
                }, i * 120);
            }
        }

        function checkWordAnswer(isCorrect, correctStr) {
            if (isCorrect) {
                score++;
                triggerCoinDrop(5);
                alert('🎉 정답입니다! 🪙 코인 +5 획득!');
            } else {
                alert(`❌ 틀렸습니다! 정답은 [${correctStr}] 입니다.`);
            }

            if (currentIndex < words.length - 1) {
                currentIndex++;
                updateQuiz();
            } else {
                alert(`🏆 단어 퀴즈 완료!\n총 ${words.length}문제 중 ${score}개 맞춤!`);
                switchMode('study');
            }
        }

        function checkSentenceAnswer(selected, correct) {
            if (selected.toLowerCase() === correct.toLowerCase()) {
                score++;
                triggerCoinDrop(25);
                alert('🎉 정답입니다! 대박! 🪙 코인 +25 획득!');
            } else {
                alert(`❌ 틀렸습니다! 빈칸의 정답은 [${correct}] 입니다.`);
            }

            if (currentIndex < words.length - 1) {
                currentIndex++;
                updateSentenceQuiz();
            } else {
                alert(`🏆 문장 퀴즈 완료!\n총 ${words.length}문제 중 ${score}개 맞춤!`);
                switchMode('study');
            }
        }

        function renderShop() {
            shopListContainer.innerHTML = '';
            themes.forEach(theme => {
                const isOwned = ownedThemes.includes(theme.id);
                const isCurrent = currentThemeId === theme.id;

                const item = document.createElement('div');
                item.className = 'shop-item';
                
                let btnHTML = '';
                if (isCurrent) {
                    btnHTML = `<button class="applied-btn" disabled>사용 중</button>`;
                } else if (isOwned) {
                    btnHTML = `<button class="apply-btn" onclick="selectTheme('${theme.id}')">적용</button>`;
                } else {
                    btnHTML = `<button class="buy-btn" onclick="buyTheme('${theme.id}', ${theme.price})">🪙 ${theme.price}</button>`;
                }

                item.innerHTML = `<span>${theme.name}</span>${btnHTML}`;
                shopListContainer.appendChild(item);
            });
        }

        function buyTheme(id, price) {
            if (coins >= price) {
                coins -= price;
                ownedThemes.push(id);
                localStorage.setItem('english_coins', coins);
                localStorage.setItem('english_owned', JSON.stringify(ownedThemes));
                coinCountEl.textContent = coins;
                selectTheme(id);
                alert('🎉 테마를 성공적으로 구매했습니다!');
            } else {
                alert('😢 코인이 부족해요! 단어 배틀이나 문장 퀴즈를 풀어서 코인을 모아보세요!');
            }
        }

        function selectTheme(id) {
            currentThemeId = id;
            localStorage.setItem('english_theme', id);
            applyTheme(id);
            renderShop();
        }

        function applyTheme(id) {
            const theme = themes.find(t => t.id === id) || themes[0];
            const root = document.documentElement;
            root.style.setProperty('--bg-gradient', theme.bg);
            root.style.setProperty('--card-bg', theme.card);
            root.style.setProperty('--point-color', theme.point);
            
            if (id === 'dark' || id === 'halloween') {
                root.style.setProperty('--text-main', '#f8fafc');
            } else {
                root.style.setProperty('--text-main', '#222222');
            }

            if (theme.sky) {
                skyLayer.style.display = 'block';
            } else {
                skyLayer.style.display = 'none';
            }

            if (theme.halloween) {
                halloweenLayer.style.display = 'block';
            } else {
                halloweenLayer.style.display = 'none';
            }

            if (theme.heaven) {
                heavenLayer.style.display = 'block';
            } else {
                heavenLayer.style.display = 'none';
            }
        }

        function flipCard() {
            cardEl.classList.toggle('flipped');
        }

        function prevStep() {
            if (currentMode === 'shop' || currentMode === 'battle') return;
            cardEl.classList.remove('flipped');
            currentIndex = (currentIndex - 1 + words.length) % words.length;
            if (currentMode === 'study') updateCard();
            else if (currentMode === 'quiz') updateQuiz();
            else if (currentMode === 'sentence') updateSentenceQuiz();
        }

        function nextStep() {
            if (currentMode === 'shop' || currentMode === 'battle') return;
            cardEl.classList.remove('flipped');
            currentIndex = (currentIndex + 1) % words.length;
            if (currentMode === 'study') updateCard();
            else if (currentMode === 'quiz') updateQuiz();
            else if (currentMode === 'sentence') updateSentenceQuiz();
        }

        function speakWord() {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(words[currentIndex].en);
                utterance.lang = 'en-US';
                utterance.rate = 0.8;
                window.speechSynthesis.speak(utterance);
            } else {
                alert('이 브라우저는 음성 출력을 지원하지 않습니다.');
            }
        }

        updateCard();
    </script>
</body>
</html>
