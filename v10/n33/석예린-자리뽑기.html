<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>스마트 자리 배치도 프로그램</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --seat-boy: #dbeafe;
            --seat-girl: #fce7f3;
            --seat-empty: #e5e7eb;
            --seat-fixed: #fef3c7;
            --seat-excluded: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2rem;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 440px 1fr;
            gap: 20px;
        }

        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .card h2 {
            font-size: 1.25rem;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .row-col-inputs {
            display: flex;
            gap: 10px;
        }

        /* 명단 관리 바 */
        .class-manager {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }
        .class-manager select {
            flex: 2;
        }
        .class-manager button {
            flex: 1;
            padding: 10px;
            font-size: 0.9rem;
        }

        /* 학생 명단 동적 입력 영역 스크롤바 */
        #student-list-container {
            max-height: 240px;
            overflow-y: auto;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            padding: 10px;
            background: #f9fafb;
            margin-bottom: 15px;
        }

        .student-row {
            display: flex;
            gap: 6px;
            align-items: center;
            margin-bottom: 8px;
        }

        .student-row span {
            font-size: 0.85rem;
            font-weight: bold;
            color: #4b5563;
            width: 25px;
            text-align: right;
        }

        .student-row input[type="text"] {
            flex: 2;
        }

        .student-row select {
            flex: 1;
        }

        /* 제외 체크박스 스타일 */
        .exclude-label {
            display: flex;
            align-items: center;
            gap: 3px;
            font-size: 0.75rem;
            color: #dc2626;
            cursor: pointer;
            white-space: nowrap;
            font-weight: normal;
        }
        .student-row input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .btn-success {
            background-color: #10b981;
        }
        .btn-success:hover {
            background-color: #059669;
        }

        .btn-danger {
            background-color: #ef4444;
        }
        .btn-danger:hover {
            background-color: #dc2626;
        }

        .btn-secondary {
            background-color: #6b7280;
        }
        .btn-secondary:hover {
            background-color: #4b5563;
        }

        /* 칠판 스타일 */
        .blackboard-container {
            text-align: center;
            margin-bottom: 20px;
        }

        .blackboard {
            background: #1e293b;
            color: white;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            letter-spacing: 5px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
            display: inline-block;
            width: 60%;
        }

        /* 좌석 배치 그리드 */
        .seat-grid {
            display: grid;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .seat {
            background: var(--seat-empty);
            border: 2px dashed #9ca3af;
            border-radius: 8px;
            height: 70px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
            padding: 4px;
            text-align: center;
        }

        .seat.boy {
            background: var(--seat-boy);
            border: 2px solid #3b82f6;
            color: #1e40af;
        }

        .seat.girl {
            background: var(--seat-girl);
            border: 2px solid #ec4899;
            color: #9d174d;
        }

        .seat.fixed {
            background: var(--seat-fixed);
            border: 2px solid #f59e0b;
            color: #92400e;
        }

        .seat.excluded {
            background: var(--seat-excluded);
            border: 2px dashed #4b5563;
            color: #f3f4f6;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .legend {
            display: flex;
            gap: 15px;
            justify-content: center;
            font-size: 0.85rem;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 4px;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        /* 인쇄 스타일 설정 */
        @media print {
            body {
                background: white;
                padding: 0;
            }
            header, .no-print, .card:not(#result-card) {
                display: none !important;
            }
            .card#result-card {
                box-shadow: none;
                border: none;
                padding: 0;
            }
            .seat {
                border: 1px solid #000 !important;
                print-color-adjust: exact;
                -webkit-print-color-adjust: exact;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header class="no-print">
        <h1>🏫 스마트 자리 배치도 프로그램</h1>
        <p>원하는 이름으로 여러 개의 명단 파일을 자유롭게 만들고 관리해보세요!</p>
    </header>

    <div class="main-grid">
        <!-- 설정 및 입력 패널 -->
        <div class="no-print">
            <div class="card">
                <h2>1. 교실 규격 설정</h2>
                <div class="row-col-inputs">
                    <div class="form-group" style="flex:1;">
                        <label for="rows">행 수 (세로)</label>
                        <input type="number" id="rows" value="5" min="1" max="10" onchange="initGrid()">
                    </div>
                    <div class="form-group" style="flex:1;">
                        <label for="cols">열 수 (가로)</label>
                        <input type="number" id="cols" value="6" min="1" max="10" onchange="initGrid()">
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>2. 다중 명단 파일 관리</h2>
                <div class="form-group">
                    <label>저장된 명단 불러오기</label>
                    <div class="class-manager">
                        <select id="saved-class-select" onchange="loadClassData()">
                            <!-- 동적 로드 -->
                        </select>
                        <button class="btn-danger" onclick="deleteClassData()">파일 삭제</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="class-name-input">새로운 명단 파일 이름 (ex. 1학년3반, 영어동아리)</label>
                    <div style="display: flex; gap: 8px;">
                        <input type="text" id="class-name-input" placeholder="이름을 입력하세요">
                        <button class="btn-success" onclick="saveNewClassData()" style="width: 140px; padding: 8px;">새로 저장</button>
                    </div>
                </div>

                <hr style="margin: 15px 0; border:0; border-top:1px solid #e5e7eb;">

                <div class="form-group">
                    <label for="student-count">전체 학생 수</label>
                    <input type="number" id="student-count" value="10" min="1" max="60" oninput="generateStudentInputs()">
                </div>
                
                <label>학생별 정보 및 제외 체크 (체크 시 자리 추첨 제외)</label>
                <div id="student-list-container">
                    <!-- 동적 생성 영역 -->
                </div>

                <div class="form-group">
                    <label for="gender-rule">짝꿍 성별 조합 규칙 (2인 1조 기준)</label>
                    <select id="gender-rule">
                        <option value="random">상관없음 (랜덤)</option>
                        <option value="mixed">남녀 짝꿍 우선 배치</option>
                        <option value="same">동성 짝꿍 우선 배치</option>
                    </select>
                </div>
            </div>

            <div class="card">
                <h2>3. 특수 좌석 설정</h2>
                <p style="font-size:0.85rem; color:#6b7280; margin-bottom:10px;">
                    우측 미리보기 창의 좌석을 클릭하여 <strong>[고정석(노란색)]</strong> 또는 <strong>[제외석(회색)]</strong>으로 지정할 수 있습니다.
                </p>
                <div class="form-group">
                    <label>현재 클릭 모드</label>
                    <select id="click-mode">
                        <option value="fixed">고정석 지정 (클릭 시 해당 자리 고정)</option>
                        <option value="excluded">제외석 지정 (클릭 시 공석 처리)</option>
                        <option value="normal">일반 좌석으로 초기화</option>
                    </select>
                </div>
                <button onclick="startDrawing()">🎲 자리 뽑기 시작!</button>
            </div>
        </div>

        <!-- 결과 및 미리보기 패널 -->
        <div>
            <div class="card" id="result-card">
                <h2>교실 자리 배치 결과</h2>
                
                <div class="blackboard-container">
                    <div class="blackboard">칠 판 (FRONT)</div>
                </div>

                <div class="legend">
                    <div class="legend-item"><div class="legend-color" style="background:var(--seat-boy)"></div>남학생</div>
                    <div class="legend-item"><div class="legend-color" style="background:var(--seat-girl)"></div>여학생</div>
                    <div class="legend-item"><div class="legend-color" style="background:var(--seat-fixed)"></div>고정석</div>
                    <div class="legend-item"><div class="legend-color" style="background:var(--seat-excluded)"></div>제외석</div>
                </div>

                <div id="seat-container" class="seat-grid">
                    <!-- 자리가 동적으로 생성됩니다 -->
                </div>

                <div class="action-buttons no-print" style="margin-top: 20px;">
                    <button class="btn-secondary" onclick="window.print()">🖨️ 자리 배치도 인쇄하기</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let gridData = []; 
    let rows = 5;
    let cols = 6;

    window.onload = function() {
        initGrid();
        updateClassSelectOptions();
        
        let classes = JSON.parse(localStorage.getItem('seat_classes')) || {};
        if(Object.keys(classes).length === 0) {
            // 초기 기본 파일 생성
            document.getElementById('class-name-input').value = '3반';
            document.getElementById('student-count').value = '10';
            generateStudentInputsCustom([
                {name: "김철수", gender: "남", excluded: false}, 
                {name: "이영희", gender: "여", excluded: false},
                {name: "박민수", gender: "남", excluded: false}, 
                {name: "정수진", gender: "여", excluded: false},
                {name: "강호동", gender: "남", excluded: true},  
                {name: "유재석", gender: "남", excluded: false},
                {name: "신동엽", gender: "남", excluded: false}, 
                {name: "아이유", gender: "여", excluded: false},
                {name: "손흥민", gender: "남", excluded: false}, 
                {name: "김연아", gender: "여", excluded: false}
            ]);
            saveNewClassData();
        } else {
            // 가장 첫 번째 파일 자동 로드
            const firstKey = Object.keys(classes)[0];
            document.getElementById('saved-class-select').value = firstKey;
            loadClassData();
        }
    };

    function initGrid() {
        rows = parseInt(document.getElementById('rows').value);
        cols = parseInt(document.getElementById('cols').value);
        
        const container = document.getElementById('seat-container');
        container.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
        container.innerHTML = '';

        gridData = [];

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const seatIndex = r * cols + c;
                gridData.push({
                    id: seatIndex,
                    row: r,
                    col: c,
                    status: 'normal', 
                    student: null
                });

                const seatEl = document.createElement('div');
                seatEl.className = 'seat';
                seatEl.id = `seat-${r}-${c}`;
                seatEl.innerHTML = `<span>${r+1}행 ${c+1}열</span><span style="font-size:0.75rem; color:#6b7280;">(빈자리)</span>`;
                seatEl.onclick = () => handleSeatClick(r, c);
                container.appendChild(seatEl);
            }
        }
    }

    function generateStudentInputs() {
        const count = parseInt(document.getElementById('student-count').value) || 0;
        const listContainer = document.getElementById('student-list-container');
        listContainer.innerHTML = '';

        for (let i = 0; i < count; i++) {
            const rowDiv = document.createElement('div');
            rowDiv.className = 'student-row';

            rowDiv.innerHTML = `
                <span>${i+1}</span>
                <input type="text" class="st-name" value="학생${i+1}" placeholder="이름 입력">
                <select class="st-gender">
                    <option value="남">남</option>
                    <option value="여">여</option>
                </select>
                <label class="exclude-label">
                    <input type="checkbox" class="st-exclude"> 제외
                </label>
            `;
            listContainer.appendChild(rowDiv);
        }
    }

    function generateStudentInputsCustom(students) {
        document.getElementById('student-count').value = students.length;
        const listContainer = document.getElementById('student-list-container');
        listContainer.innerHTML = '';

        students.forEach((st, i) => {
            const rowDiv = document.createElement('div');
            rowDiv.className = 'student-row';

            rowDiv.innerHTML = `
                <span>${i+1}</span>
                <input type="text" class="st-name" value="${st.name}" placeholder="이름 입력">
                <select class="st-gender">
                    <option value="남" ${st.gender === '남' ? 'selected' : ''}>남</option>
                    <option value="여" ${st.gender === '여' ? 'selected' : ''}>여</option>
                </select>
                <label class="exclude-label">
                    <input type="checkbox" class="st-exclude" ${st.excluded ? 'checked' : ''}> 제외
                </label>
            `;
            listContainer.appendChild(rowDiv);
        });
    }

    // --- 사용자가 원하는 이름으로 여러 개 파일 관리 시스템 ---
    function saveNewClassData() {
        const className = document.getElementById('class-name-input').value.trim();
        if(!className) {
            alert("저장할 명단 파일 이름(ex. 1학년3반 등)을 입력해주세요!");
            return;
        }

        const nameInputs = document.querySelectorAll('.st-name');
        const genderSelects = document.querySelectorAll('.st-gender');
        const excludeCheckboxes = document.querySelectorAll('.st-exclude');

        let students = [];
        for (let i = 0; i < nameInputs.length; i++) {
            students.push({
                name: nameInputs[i].value.trim() || `학생${i+1}`,
                gender: genderSelects[i].value,
                excluded: excludeCheckboxes[i].checked
            });
        }

        let classes = JSON.parse(localStorage.getItem('seat_classes')) || {};
        classes[className] = students; // 새로운 이름으로 키 생성/덮어쓰기
        localStorage.setItem('seat_classes', JSON.stringify(classes));

        updateClassSelectOptions();
        document.getElementById('saved-class-select').value = className;
        alert(`📁 '${className}' 명단 파일이 안전하게 저장되었습니다!`);
    }

    function updateClassSelectOptions() {
        let classes = JSON.parse(localStorage.getItem('seat_classes')) || {};
        const select = document.getElementById('saved-class-select');
        select.innerHTML = '';

        const keys = Object.keys(classes);
        if(keys.length === 0) {
            select.innerHTML = '<option value="">저장된 파일 없음</option>';
            return;
        }

        keys.forEach(className => {
            const opt = document.createElement('option');
            opt.value = className;
            const activeCount = classes[className].filter(s => !s.excluded).length;
            opt.textContent = `${className} (배치 대상 ${activeCount}명)`;
            select.appendChild(opt);
        });
    }

    function loadClassData() {
        const selectedClass = document.getElementById('saved-class-select').value;
        if(!selectedClass) return;

        let classes = JSON.parse(localStorage.getItem('seat_classes')) || {};
        let students = classes[selectedClass];
        if(students) {
            document.getElementById('class-name-input').value = selectedClass;
            generateStudentInputsCustom(students);
        }
    }

    function deleteClassData() {
        const selectedClass = document.getElementById('saved-class-select').value;
        if(!selectedClass) {
            alert("삭제할 명단 파일을 선택해주세요.");
            return;
        }

        if(confirm(`정말 '${selectedClass}' 명단 파일을 삭제하시겠습니까?`)) {
            let classes = JSON.parse(localStorage.getItem('seat_classes')) || {};
            delete classes[selectedClass];
            localStorage.setItem('seat_classes', JSON.stringify(classes));
            updateClassSelectOptions();
            
            const remainingKeys = Object.keys(classes);
            if(remainingKeys.length > 0) {
                document.getElementById('saved-class-select').value = remainingKeys[0];
                loadClassData();
            } else {
                document.getElementById('class-name-input').value = '';
                document.getElementById('student-list-container').innerHTML = '';
            }
        }
    }

    function handleSeatClick(r, c) {
        const mode = document.getElementById('click-mode').value;
        const index = r * cols + c;
        const seatObj = gridData[index];

        if (mode === 'fixed') {
            seatObj.status = seatObj.status === 'fixed' ? 'normal' : 'fixed';
            if(seatObj.status === 'fixed') {
                const nameInput = prompt("이 자리에 고정할 학생 이름을 입력하세요:", "");
                if(nameInput) {
                    seatObj.student = { name: nameInput, gender: '고정' };
                } else {
                    seatObj.status = 'normal';
                }
            } else {
                seatObj.student = null;
            }
        } else if (mode === 'excluded') {
            seatObj.status = seatObj.status === 'excluded' ? 'normal' : 'excluded';
            seatObj.student = seatObj.status === 'excluded' ? { name: '제외됨', gender: 'exc' } : null;
        } else {
            seatObj.status = 'normal';
            seatObj.student = null;
        }

        renderGrid();
    }

    function renderGrid() {
        gridData.forEach(seat => {
            const el = document.getElementById(`seat-${seat.row}-${seat.col}`);
            el.className = 'seat';
            
            if (seat.status === 'excluded') {
                el.classList.add('excluded');
                el.innerHTML = `<span>제외석</span>`;
            } else if (seat.status === 'fixed') {
                el.classList.add('fixed');
                el.innerHTML = `<span>고정석</span><strong>${seat.student.name}</strong>`;
            } else if (seat.student) {
                if (seat.student.gender === '남') {
                    el.classList.add('boy');
                } else if (seat.student.gender === '여') {
                    el.classList.add('girl');
                }
                el.innerHTML = `<span>${seat.row+1}-${seat.col+1}</span><strong>${seat.student.name}</strong>`;
            } else {
                el.innerHTML = `<span>${seat.row+1}행 ${seat.col+1}열</span><span style="font-size:0.75rem; color:#6b7280;">(빈자리)</span>`;
            }
        });
    }

    function startDrawing() {
        const nameInputs = document.querySelectorAll('.st-name');
        const genderSelects = document.querySelectorAll('.st-gender');
        const excludeCheckboxes = document.querySelectorAll('.st-exclude');

        let students = [];
        for (let i = 0; i < nameInputs.length; i++) {
            const name = nameInputs[i].value.trim();
            const gender = genderSelects[i].value;
            const isExcluded = excludeCheckboxes[i].checked;

            if (name && !isExcluded) {
                students.push({ name, gender });
            }
        }

        if (students.length === 0) {
            alert("배치할 수 있는 학생이 없습니다! (모두 제외되었거나 명단이 비어있습니다.)");
            return;
        }

        let fixedStudentsNames = gridData.filter(s => s.status === 'fixed' && s.student).map(s => s.student.name);
        let availableStudents = students.filter(st => !fixedStudentsNames.includes(st.name));
        let availableSeats = gridData.filter(s => s.status === 'normal');

        if (availableStudents.length > availableSeats.length) {
            alert(`배치할 학생 수(${availableStudents.length}명)가 일반 좌석 수(${availableSeats.length}개)보다 많습니다! 행/열을 늘려주세요.`);
            return;
        }

        // 카운트다운 애니메이션
        let count = 3;
        let interval = setInterval(() => {
            if (count > 0) {
                shuffleTemporary(availableStudents);
                assignRandomly(availableStudents, availableSeats);
                renderGrid();
                count--;
            } else {
                clearInterval(interval);
                finalAssign(availableStudents, availableSeats);
                renderGrid();
                alert("🎉 자리 뽑기가 완료되었습니다!");
            }
        }, 400);
    }

    function shuffleTemporary(array) {
        for (let i = array.length - 1; i > 0; i--) {
            let j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function assignRandomly(students, seats) {
        let tempStudents = [...students];
        shuffleTemporary(tempStudents);
        seats.forEach(s => s.student = null);
        tempStudents.forEach((st, idx) => {
            if (seats[idx]) seats[idx].student = st;
        });
    }

    (function() {
        window.finalAssign = function(students, seats) {
            const rule = document.getElementById('gender-rule').value;
            let boys = students.filter(s => s.gender === '남');
            let girls = students.filter(s => s.gender === '여');
            
            shuffleTemporary(boys);
            shuffleTemporary(girls);

            seats.forEach(s => s.student = null);

            if (rule === 'mixed') {
                let combined = [];
                let maxLength = Math.max(boys.length, girls.length);
                for(let i=0; i<maxLength; i++) {
                    if(i < boys.length) combined.push(boys[i]);
                    if(i < girls.length) combined.push(girls[i]);
                }
                combined.forEach((st, idx) => {
                    if(seats[idx]) seats[idx].student = st;
                });
            } else {
                let combined = [...boys, ...girls];
                if(rule === 'random') {
                    shuffleTemporary(combined);
                }
                combined.forEach((st, idx) => {
                    if(seats[idx]) seats[idx].student = st;
                });
            }
        }
    })();
</script>
