<!DOCTYPE html> <!-- 이 문서는 HTML5 웹페이지임을 알려줍니다 -->
<html lang="ko"> <!-- 웹페이지의 주 사용 언어가 한국어임을 설정합니다 -->
<head>
    <meta charset="UTF-8"> <!-- 한글이 깨지지 않도록 글자 방식을 설정합니다 -->
    <title>나만의 영어 단어장</title> <!-- 웹 브라우저 탭에 표시되는 제목입니다 -->
    <!-- 구글 폰트(Jua, Fredoka)를 불러오는 코드입니다 -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Jua&display=swap" rel="stylesheet">
    <style>
        /* 색상과 폰트 설정을 한눈에 관리하는 변수모음입니다 */
        :root {
            --bg-color: #1d62e2;     /* 전체 배경 색상 */
            --card-color: #ffffff;   /* 카드 배경 색상 */
            --text-color: #16243d;   /* 기본 글자 색상 */
            --point-color: #2f6be0;  /* 포인트 강조 색상 */
        }

        /* 웹페이지 전체 배경과 폰트를 지정합니다 (한글은 주아체, 영어는 프레도카체) */
        body { font-family: 'Jua', 'Fredoka', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background-color: var(--bg-color); margin: 0; padding: 20px; box-sizing: border-box; }
        /* 현재 몇 번째 단어인지 알려주는 글자 색상입니다 */
        #progress { font-size: 22px; font-weight: bold; margin-bottom: 20px; color: #ffffff; }
        /* 카드가 입체적으로 움직일 수 있는 공간입니다 */
        .card-container { perspective: 1000px; width: 320px; height: 240px; margin-bottom: 20px; cursor: pointer; }
        /* 뒤집히는 효과를 주는 카드 상자이며 모서리를 17px로 둥글게 만듭니다 */
        .card { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s; border-radius: 17px; box-shadow: 0 6px 12px rgba(0,0,0,0.15); }
        /* 카드가 뒤집혔을 때 회전하는 각도를 설정합니다 */
        .card.is-flipped { transform: rotateY(180deg); }
        /* 카드 앞면과 뒷면의 모양과 디자인을 설정합니다 */
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 17px; background: var(--card-color); padding: 20px; box-sizing: border-box; text-align: center; border: 2px solid #e1e8ed; }
        /* 카드 뒷면은 미리 180도 돌려두어 숨겨둡니다 */
        .card-back { transform: rotateY(180deg); background: #f0f4ff; border-color: #c7d7fe; }
        /* 카드 앞면에 있는 영어 단어 글자 모양과 색상입니다 */
        .word-en { font-family: 'Fredoka', sans-serif; font-size: 36px; font-weight: 700; color: var(--point-color); margin-bottom: 8px; }
        /* 카드 뒷면에 있는 한글 뜻 글자 색상입니다 */
        .word-ko { font-size: 26px; font-weight: bold; color: var(--text-color); margin-bottom: 8px; }
        /* 카드 뒷면에 있는 영어 예문 글자 색상입니다 */
        .word-ex { font-family: 'Fredoka', sans-serif; font-size: 15px; color: #475569; font-style: italic; margin-bottom: 8px; }
        /* 음성 재생 버튼을 이쁘게 꾸며주는 디자인입니다 */
        .speak-btn { background-color: #e0f2fe; color: #0284c7; border: 1px solid #bae6fd; padding: 6px 14px; font-size: 14px; border-radius: 8px; cursor: pointer; transition: 0.2s; font-family: 'Jua', sans-serif; }
        /* 음성 버튼에 마우스를 올렸을 때 색상 변화입니다 */
        .speak-btn:hover { background-color: #bae6fd; color: #0369a1; }
        /* 이전, 다음 버튼들을 나란히 배치하기 위한 상자입니다 */
        .btn-container { display: flex; gap: 15px; }
        /* 버튼의 모양, 크기, 색상을 이쁘게 꾸밉니다 */
        button { padding: 12px 24px; font-size: 18px; font-weight: bold; cursor: pointer; border: none; border-radius: 12px; background-color: var(--card-color); color: var(--point-color); box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: background 0.2s; font-family: 'Jua', sans-serif; }
        /* 마우스를 버튼 위에 올렸을 때 색상 변화입니다 */
        button:hover { background-color: #f8fafc; }
        /* 퀴즈 전체를 감싸는 상자입니다 */
        .quiz-container { margin-top: 25px; width: 320px; text-align: center; background: var(--card-color); padding: 15px; border-radius: 17px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: 2px solid #e1e8ed; }
        /* 퀴즈 문제 안내 글자입니다 */
        .quiz-title { font-size: 16px; font-weight: bold; margin-bottom: 10px; color: var(--text-color); }
        /* 퀴즈 보기 4개를 세로로 정렬해 주는 상자입니다 */
        .quiz-options { display: flex; flex-direction: column; gap: 8px; }
        /* 퀴즈 보기 버튼 모양입니다 */
        .quiz-btn { padding: 10px; font-size: 16px; background-color: #f8fafc; color: var(--text-color); border: 1px solid #cbd5e1; border-radius: 10px; cursor: pointer; transition: 0.2s; }
        /* 보기 버튼에 마우스를 올렸을 때 색상입니다 */
        .quiz-btn:hover { background-color: #f1f5f9; }
        /* 정답을 맞혔을 때 변하는 초록색 스타일입니다 */
        .quiz-btn.correct { background-color: #22c55e !important; color: white !important; border-color: #16a34a !important; }
        /* 오답을 골랐을 때 흐려지는 스타일입니다 */
        .quiz-btn.wrong { background-color: #94a3b8 !important; color: #f1f5f9 !important; opacity: 0.5; }
        /* 맞은 개수와 틀린 개수를 보여주는 점수판 글자입니다 */
        .quiz-score { margin-top: 10px; font-size: 14px; font-weight: bold; color: #ffffff; }
    </style>
</head>
<body>
    <!-- 현재 진도를 보여주는 글자 상자입니다 -->
    <div id="progress">1 / 30</div>
    
    <!-- 카드를 감싸고 있는 상자이며, 누르면 카드가 뒤집힙니다 -->
    <div class="card-container" onclick="flipCard()">
        <!-- 실제 뒤집히는 카드 본체입니다 -->
        <div class="card" id="cardElement">
            <!-- 카드의 앞면: 영어 단어가 보입니다 -->
            <div class="card-face card-front">
                <div class="word-en" id="frontEn">symbol</div>
                <button class="speak-btn" onclick="speakText(document.getElementById('frontEn').textContent, event)">🔊 발음 듣기</button>
            </div>
            <!-- 카드의 뒷면: 뜻과 예문이 보입니다 -->
            <div class="card-face card-back">
                <div class="word-ko" id="backKo">상징</div>
                <!-- 음성 재생을 위해 영어 단어를 숨겨서 보관하는 공간입니다 -->
                <div id="backEnForSpeech" style="display:none;"></div>
                <div class="word-ex" id="backEx">A dove is a symbol of peace.</div>
                <button class="speak-btn" onclick="speakText(document.getElementById('backEnForSpeech').textContent + '. ' + document.getElementById('backEx').textContent, event)">🔊 단어+예문 듣기</button>
            </div>
        </div>
    </div>

    <!-- 이전/다음 이동 버튼들이 들어있는 상자입니다 -->
    <div class="btn-container">
        <button onclick="prevCard()">이전</button>
        <button onclick="nextCard()">다음</button>
    </div>

    <!-- 퀴즈와 점수가 나타나는 상자입니다 -->
    <div class="quiz-container">
        <div class="quiz-title">이 단어의 뜻은?</div>
        <div class="quiz-options">
            <button class="quiz-btn" onclick="checkAnswer(0)" id="quizBtn0">보기 1</button>
            <button class="quiz-btn" onclick="checkAnswer(1)" id="quizBtn1">보기 2</button>
            <button class="quiz-btn" onclick="checkAnswer(2)" id="quizBtn2">보기 3</button>
            <button class="quiz-btn" onclick="checkAnswer(3)" id="quizBtn3">보기 4</button>
        </div>
        <div class="quiz-score" id="quizScore">맞은 개수: 0 | 틀린 개수: 0</div>
    </div>

    <script>
        // ==========================================
        // [여기만 고치세요] 단어 목록을 수정하는 곳입니다!
        // ==========================================
        const words = [
            { en: 'symbol', ko: '상징', ex: 'A dove is a symbol of peace.' },
            { en: 'effect', ko: '결과 (효과)', ex: 'The medicine had a good effect.' },
            { en: 'door', ko: '문', ex: 'Please open the door.' },
            { en: 'egg', ko: '달걀', ex: 'I eat a boiled egg.' },
            { en: 'cell', ko: '세포', ex: 'All living things have cells.' },
            { en: 'apple', ko: '사과', ex: 'I eat an apple.' },
            { en: 'expensive', ko: '비싼', ex: 'This car is very expensive.' },
            { en: 'banana', ko: '바나나', ex: 'Monkeys like bananas.' },
            { en: 'orange', ko: '오렌지', ex: 'I like orange juice.' },
            { en: 'grape', ko: '포도', ex: 'Grapes are sweet.' },
            { en: 'pepsi', ko: '펩시', ex: 'He is drinking Pepsi.' },
            { en: 'coca cola', ko: '코카 콜라', ex: 'I like Coca Cola.' },
            { en: 'strange', ko: '이상한', ex: 'I heard a strange noise.' },
            { en: 'marble', ko: '구슬', ex: 'I play with glass marbles.' },
            { en: 'should', ko: '~하는 게 좋다', ex: 'You should study hard.' },
            { en: 'sailor', ko: '항해사 (선원)', ex: 'The sailor works on a ship.' },
            { en: 'fire', ko: '불', ex: 'Fire is hot.' },
            { en: 'water', ko: '물', ex: 'Please give me some water.' },
            { en: 'porridge', ko: '죽', ex: 'She eats warm porridge.' },
            { en: 'piece', ko: '작품 (조각)', ex: 'This is a piece of art.' },
            { en: 'firefighter', ko: '소방관', ex: 'The firefighter puts out fires.' },
            { en: 'police officer', ko: '경찰관', ex: 'The police officer helps people.' },
            { en: 'remember', ko: '기억하다', ex: 'I remember your name.' },
            { en: 'cause', ko: '원인이 되다', ex: 'Rain causes plants to grow.' },
            { en: 'because', ko: '~ 때문에', ex: 'I am happy because of you.' },
            { en: 'of', ko: '~의', ex: 'This is a map of Korea.' },
            { en: 'for', ko: '~ 동안 (~를 위해)', ex: 'I slept for eight hours.' },
            { en: 'doctor', ko: '의사', ex: 'The doctor helps sick people.' },
            { en: 'pencil', ko: '연필', ex: 'I write with a pencil.' },
            { en: 'eraser', ko: '지우개', ex: 'I need an eraser.' }
        ];

        // 현재 보여지는 단어의 순서 번호를 기억합니다 (0부터 시작해요)
        let currentIndex = 0;

        // 카드가 뒤집혀 있는지 상태를 저장합니다 (거짓=앞면, 참=뒷면)
        let isFlipped = false;

        // 퀴즈 맞은 개수와 틀린 개수를 저장하는 변수입니다
        let correctCount = 0;
        let wrongCount = 0;
        // 현재 퀴즈의 정답 뜻을 기억하는 변수입니다
        let currentCorrectKo = '';
        // 중복 클릭을 막아주는 상태 변수입니다
        let isAnswered = false;

        // 화면에서 글자를 바꿀 대상 요소들을 미리 찾아둡니다
        const progressEl = document.getElementById('progress');
        const cardElement = document.getElementById('cardElement');
        const frontEn = document.getElementById('frontEn');
        const backKo = document.getElementById('backKo');
        const backEx = document.getElementById('backEx');
        const backEnForSpeech = document.getElementById('backEnForSpeech');

        // 현재 단어와 진도 글자를 화면에 업데이트해주는 함수입니다
        function updateCard() {
            // 현재 순서의 단어 데이터를 가져옵니다
            const currentWord = words[currentIndex];
            
            // 앞면 칸에 영어 단어를 쏙 집어넣습니다
            frontEn.textContent = currentWord.en;
            
            // 뒷면 칸에 한글 뜻을 쏙 집어넣습니다
            backKo.textContent = currentWord.ko;

            // 뒷면 음성 재생을 위해 영어 단어를 숨겨진 칸에 넣어둡니다
            backEnForSpeech.textContent = currentWord.en;
            
            // 뒷면 칸에 예문 글자를 쏙 집어넣습니다
            backEx.textContent = currentWord.ex;
            
            // 진도 표시 칸에 현재 번호와 전체 개수를 보여줍니다 (예: 1 / 30)
            progressEl.textContent = (currentIndex + 1) + ' / ' + words.length;

            // 카드가 바뀔 때마다 새로운 퀴즈 문제도 함께 만들어줍니다
            makeQuiz();
        }

        // 카드를 클릭했을 때 앞뒤로 돌려주는 함수입니다
        function flipCard() {
            // 뒤집힘 상태를 반대로 바꿉니다 (앞면이면 뒷면으로, 뒷면이면 앞면으로)
            isFlipped = !isFlipped;
            
            // 상태에 맞춰 CSS 클래스를 추가하거나 빼서 카드를 회전시킵니다
            if (isFlipped) {
                cardElement.classList.add('is-flipped');
            } else {
                cardElement.classList.remove('is-flipped');
            }
        }

        // '이전' 버튼을 눌렀을 때 실행되는 함수입니다
        function prevCard() {
            // 만약 카드가 뒤집혀 있다면 먼저 앞면으로 돌려놓습니다
            if (isFlipped) { flipCard(); }
            
            // 첫 번째 단어가 아니라면 이전 번호로 이동합니다
            if (currentIndex > 0) {
                currentIndex = currentIndex - 1;
            } else {
                // 첫 번째 단어에서 누르면 마지막 단어로 이동합니다
                currentIndex = words.length - 1;
            }
            
            // 바뀐 단어를 화면에 다시 그려줍니다
            updateCard();
        }

        // '다음' 버튼을 눌렀을 때 실행되는 함수입니다
        function nextCard() {
            // 만약 카드가 뒤집혀 있다면 먼저 앞면으로 돌려놓습니다
            if (isFlipped) { flipCard(); }
            
            // 마지막 단어가 아니라면 다음 번호로 이동합니다
            if (currentIndex < words.length - 1) {
                currentIndex = currentIndex + 1;
            } else {
                // 마지막 단어에서 누르면 다시 처음 단어로 돌아갑니다
                currentIndex = 0;
            }
            
            // 바뀐 단어를 화면에 다시 그려줍니다
            updateCard();
        }

        // 브라우저의 말하기 기능을 사용해 영어를 읽어주는 함수입니다
        function speakText(text, event) {
            // 버튼을 누를 때 카드가 뒤집히는 충돌을 막아줍니다
            event.stopPropagation();
            
            // 만약 브라우저가 음성 읽기를 지원하지 않으면 안내를 띄웁니다
            if (!('speechSynthesis' in window)) {
                alert('이 브라우저는 음성 재생을 지원하지 않아요.');
                return;
            }

            // 이미 읽고 있는 내용이 있다면 멈추고 새로 읽습니다
            window.speechSynthesis.cancel();

            // 읽어줄 내용과 설정을 만듭니다
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US'; // 미국 영어 발음으로 설정합니다
            utterance.rate = 0.9;     // 초등학생이 듣기 좋게 약간 천천히 읽어줍니다
            
            // 소리를 재생합니다
            window.speechSynthesis.speak(utterance);
        }

        // 퀴즈 보기 4개를 무작위로 섞어서 만들어주는 함수입니다
        function makeQuiz() {
            isAnswered = false;
            const currentWord = words[currentIndex];
            currentCorrectKo = currentWord.ko;

            // 오답 후보들(현재 단어 제외)을 모아서 무작위로 3개 뽑습니다
            let otherWords = words.filter(w => w.ko !== currentCorrectKo);
            otherWords.sort(() => Math.random() - 0.5);
            let choices = [currentCorrectKo, otherWords[0].ko, otherWords[1].ko, otherWords[2].ko];

            // 4개의 보기를 무작위로 다시 섞어줍니다
            choices.sort(() => Math.random() - 0.5);

            // 화면의 4개 버튼에 각각 뜻을 넣어주고 색상 초기화를 합니다
            for (let i = 0; i < 4; i++) {
                const btn = document.getElementById('quizBtn' + i);
                btn.textContent = choices[i];
                btn.className = 'quiz-btn';
            }
        }

        // 보기를 클릭했을 때 정답인지 확인하는 함수입니다
        function checkAnswer(index) {
            if (isAnswered) return; // 이미 골랐다면 중지합니다
            isAnswered = true;

            const selectedText = document.getElementById('quizBtn' + index).textContent;

            // 4개의 버튼을 돌면서 정답과 오답을 판별합니다
            for (let i = 0; i < 4; i++) {
                const btn = document.getElementById('quizBtn' + i);
                if (btn.textContent === currentCorrectKo) {
                    btn.classList.add('correct'); // 정답은 초록색
                } else if (i === index) {
                    btn.classList.add('wrong'); // 내가 고른 오답은 흐리게
                }
            }

            // 맞은 개수와 틀린 개수를 올리고 점수판에 반영합니다
            if (selectedText === currentCorrectKo) {
                correctCount = correctCount + 1;
            } else {
                wrongCount = wrongCount + 1;
            }
            document.getElementById('quizScore').textContent = '맞은 개수: ' + correctCount + ' | 틀린 개수: ' + wrongCount;
        }

        // 웹페이지가 처음 켜졌을 때 첫 번째 단어를 화면에 보여줍니다
        updateCard();
    </script>
</body>
</html>
