
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"> <!-- 한글이 깨지지 않도록 설정 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 모바일 화면 설정 -->
  <title>영어 단어 공부방</title> <!-- 웹사이트 제목 -->

  <style>
    /* 모든 요소의 크기 계산 방법 설정 */
    * { box-sizing: border-box; }

    /* 페이지 전체 디자인 */
    body {
      margin: 0; /* 바깥 여백 제거 */
      padding: 20px; /* 화면 가장자리 여백 */
      min-height: 100vh; /* 화면 높이만큼 채우기 */
      font-family: Arial, sans-serif; /* 글꼴 설정 */
      background: linear-gradient(135deg, #667eea, #764ba2); /* 배경 색상 */
      color: #333; /* 기본 글자 색상 */
    }

    /* 앱 전체를 감싸는 상자 */
    .app {
      max-width: 750px; /* 최대 너비 설정 */
      margin: 20px auto; /* 가운데 정렬 */
      padding: 25px; /* 안쪽 여백 */
      background: white; /* 흰색 배경 */
      border-radius: 24px; /* 둥근 모서리 */
      box-shadow: 0 12px 35px #2224; /* 그림자 */
    }

    /* 제목 디자인 */
    h1 {
      text-align: center; /* 가운데 정렬 */
      color: #4f46e5; /* 글자 색상 */
      margin-top: 0; /* 위쪽 여백 제거 */
    }

    /* 각 기능의 제목 */
    h2 {
      color: #4338ca; /* 제목 색상 */
      font-size: 22px; /* 글자 크기 */
    }

    /* 설명 문장 */
    .description {
      color: #777; /* 회색 글자 */
      text-align: center; /* 가운데 정렬 */
      line-height: 1.6; /* 줄 간격 */
    }

    /* 기능별 구역 */
    .section {
      margin-top: 30px; /* 위쪽 여백 */
      padding: 20px; /* 안쪽 여백 */
      border-radius: 18px; /* 둥근 모서리 */
      background: #f8faff; /* 연한 배경 */
      border: 1px solid #e5e7eb; /* 테두리 */
    }

    /* 진도 숫자 */
    .progress-text {
      text-align: center; /* 가운데 정렬 */
      font-size: 18px; /* 글자 크기 */
      font-weight: bold; /* 굵은 글씨 */
      margin: 15px 0 10px; /* 바깥 여백 */
    }

    /* 진도 막대 바깥 */
    .progress-bg {
      height: 10px; /* 높이 */
      background: #e5e7eb; /* 배경 색상 */
      border-radius: 20px; /* 둥근 모서리 */
      overflow: hidden; /* 넘치는 부분 숨기기 */
    }

    /* 진도 막대 */
    .progress-bar {
      height: 100%; /* 부모 높이에 맞춤 */
      width: 5%; /* 처음 너비 */
      background: linear-gradient(90deg, #6366f1, #a855f7); /* 막대 색상 */
      transition: width 0.3s; /* 움직임 효과 */
    }

    /* 카드 공간 */
    .card-area {
      perspective: 1000px; /* 3D 효과 */
      margin: 25px 0; /* 위아래 여백 */
    }

    /* 단어 카드 */
    .card {
      position: relative; /* 앞면과 뒷면 배치 기준 */
      width: 100%; /* 너비 */
      height: 270px; /* 높이 */
      transform-style: preserve-3d; /* 3D 유지 */
      transition: transform 0.6s; /* 뒤집기 애니메이션 */
      cursor: pointer; /* 마우스 커서 */
    }

    /* 카드가 뒤집힌 상태 */
    .card.flipped {
      transform: rotateY(180deg); /* 뒤집기 */
    }

    /* 카드 앞면과 뒷면 공통 */
    .card-face {
      position: absolute; /* 겹쳐서 배치 */
      inset: 0; /* 상하좌우 모두 맞추기 */
      display: flex; /* 내부 정렬 */
      flex-direction: column; /* 세로 배치 */
      justify-content: center; /* 세로 가운데 */
      align-items: center; /* 가로 가운데 */
      padding: 20px; /* 안쪽 여백 */
      border-radius: 20px; /* 둥근 모서리 */
      backface-visibility: hidden; /* 뒷면 숨기기 */
      text-align: center; /* 가운데 정렬 */
      box-shadow: 0 6px 18px #0002; /* 그림자 */
    }

    /* 카드 앞면 색상 */
    .front {
      background: linear-gradient(135deg, #dbeafe, #e0e7ff); /* 배경 */
      color: #3730a3; /* 글자 */
    }

    /* 영어 단어 글씨 */
    .word {
      font-size: 38px; /* 글자 크기 */
      font-weight: bold; /* 굵은 글씨 */
      margin-bottom: 15px; /* 아래 여백 */
      word-break: break-word; /* 긴 단어 줄바꿈 */
    }

    /* 카드 뒷면 색상 */
    .back {
      background: linear-gradient(135deg, #fef3c7, #ffedd5); /* 배경 */
      color: #92400e; /* 글자 */
      transform: rotateY(180deg); /* 뒷면 방향 */
      gap: 12px; /* 요소 사이 간격 */
    }

    /* 한국어 뜻 */
    .meaning {
      font-size: 28px; /* 글자 크기 */
      font-weight: bold; /* 굵은 글씨 */
    }

    /* 영어 예문 */
    .example {
      font-size: 19px; /* 글자 크기 */
      line-height: 1.5; /* 줄 간격 */
    }

    /* 버튼 공통 디자인 */
    button {
      border: none; /* 테두리 제거 */
      border-radius: 12px; /* 둥근 모서리 */
      padding: 12px 17px; /* 안쪽 여백 */
      background: #4f46e5; /* 배경 색상 */
      color: white; /* 글자 색상 */
      font-size: 15px; /* 글자 크기 */
      font-weight: bold; /* 굵은 글씨 */
      cursor: pointer; /* 마우스 커서 */
      transition: 0.2s; /* 부드러운 효과 */
    }

    /* 버튼에 마우스를 올렸을 때 */
    button:hover {
      background: #3730a3; /* 배경 색상 변경 */
    }

    /* 사용할 수 없는 버튼 */
    button:disabled {
      background: #aaa; /* 회색 표시 */
      cursor: not-allowed; /* 사용 불가 표시 */
    }

    /* 이전/다음 버튼 영역 */
    .navigation {
      display: flex; /* 가로 정렬 */
      gap: 12px; /* 사이 간격 */
    }

    /* 이전/다음 버튼 너비 */
    .navigation button {
      flex: 1; /* 같은 크기로 설정 */
    }

    /* 발음 버튼 */
    .speak-btn {
      background: #0d9488; /* 초록색 배경 */
    }

    /* 발음 버튼에 마우스를 올렸을 때 */
    .speak-btn:hover {
      background: #0f766e; /* 진한 초록색 */
    }

    /* 입력 칸 */
    input {
      width: 100%; /* 전체 너비 */
      padding: 14px; /* 안쪽 여백 */
      margin: 10px 0; /* 위아래 여백 */
      border: 2px solid #ddd; /* 테두리 */
      border-radius: 12px; /* 둥근 모서리 */
      font-size: 16px; /* 글자 크기 */
      outline: none; /* 기본 테두리 효과 제거 */
    }

    /* 입력 칸을 클릭했을 때 */
    input:focus {
      border-color: #6366f1; /* 테두리 색상 변경 */
    }

    /* 결과 안내 글씨 */
    .result {
      min-height: 25px; /* 높이 유지 */
      font-weight: bold; /* 굵은 글씨 */
      margin-top: 12px; /* 위쪽 여백 */
    }

    /* 도전 과제 단어 카드 */
    .challenge-card {
      background: white; /* 흰색 배경 */
      padding: 15px; /* 안쪽 여백 */
      margin: 12px 0; /* 위아래 여백 */
      border-radius: 14px; /* 둥근 모서리 */
      border: 1px solid #ddd; /* 테두리 */
    }

    /* 도전 과제 영어 단어 */
    .challenge-word {
      font-size: 22px; /* 글자 크기 */
      font-weight: bold; /* 굵은 글씨 */
      color: #4338ca; /* 글자 색상 */
    }

    /* 도전 과제 진행 숫자 */
    .challenge-status {
      font-weight: bold; /* 굵은 글씨 */
      color: #0f766e; /* 초록색 */
    }

    /* 작은 안내 글씨 */
    .small {
      font-size: 13px; /* 작은 글자 */
      color: #777; /* 회색 */
      line-height: 1.5; /* 줄 간격 */
    }

    /* 화면이 좁을 때 */
    @media (max-width: 500px) {
      .app {
        padding: 16px; /* 앱 여백 줄이기 */
      }

      .word {
        font-size: 30px; /* 단어 글자 줄이기 */
      }

      .section {
        padding: 15px; /* 구역 여백 줄이기 */
      }
    }
  </style>
</head>

<body>
  <!-- 앱 전체 상자 -->
  <main class="app">

    <!-- 앱 제목 -->
    <h1>📚 영어 단어 공부방</h1>

    <!-- 앱 설명 -->
    <p class="description">단어를 외우고, 발음을 듣고, 테스트에 도전해 보세요!</p>

    <!-- 첫 번째 기능: 단어 카드 -->
    <section class="section">

      <!-- 기능 제목 -->
      <h2>🃏 영어 단어 카드</h2>

      <!-- 현재 진도 -->
      <div class="progress-text" id="progressText">1 / 20</div>

      <!-- 진도 막대 -->
      <div class="progress-bg">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <!-- 카드 공간 -->
      <div class="card-area">

        <!-- 클릭하면 뒤집히는 카드 -->
        <div class="card" id="card" onclick="flipCard()">

          <!-- 카드 앞면 -->
          <div class="card-face front">

            <!-- 영어 단어 -->
            <div class="word" id="word">achieve</div>

            <!-- 단어 발음 듣기 버튼 -->
            <button class="speak-btn" onclick="event.stopPropagation(); speakWord()">🔊 단어 발음 듣기</button>

            <!-- 카드 안내 -->
            <p>카드를 누르면 뜻과 예문이 나와요!</p>
          </div>

          <!-- 카드 뒷면 -->
          <div class="card-face back">

            <!-- 한국어 뜻 -->
            <div class="meaning" id="meaning">달성하다</div>

            <!-- 영어 예문 -->
            <div class="example" id="example">I can achieve my dream.</div>

            <!-- 예문 발음 듣기 버튼 -->
            <button class="speak-btn" onclick="event.stopPropagation(); speakSentence()">🗣️ 문장 발음 듣기</button>

            <!-- 카드 안내 -->
            <p>카드를 누르면 앞면으로 돌아가요!</p>
          </div>
        </div>
      </div>

      <!-- 이전/다음 버튼 -->
      <div class="navigation">

        <!-- 이전 단어 버튼 -->
        <button id="prevBtn" onclick="previousWord()">⬅ 이전</button>

        <!-- 다음 단어 버튼 -->
        <button id="nextBtn" onclick="nextWord()">다음 ➡</button>
      </div>
    </section>

    <!-- 두 번째 기능: 영어 문장 받아쓰기 -->
    <section class="section">

      <!-- 기능 제목 -->
      <h2>🎧 영어 문장 받아쓰기 테스트</h2>

      <!-- 테스트 설명 -->
      <p>영어 문장을 듣고 들리는 문장을 영어로 입력해 보세요!</p>

      <!-- 문장 듣기 버튼 -->
      <button class="speak-btn" onclick="playTestSentence()">🔊 문제 듣기</button>

      <!-- 다시 듣기 안내 -->
      <p class="small">소리를 여러 번 들어도 괜찮아요.</p>

      <!-- 정답 입력 칸 -->
      <input id="dictationInput" type="text" placeholder="들은 영어 문장을 입력하세요">

      <!-- 정답 확인 버튼 -->
      <button onclick="checkDictation()">정답 확인하기</button>

      <!-- 테스트 결과 -->
      <div class="result" id="dictationResult"></div>

      <!-- 다음 문제 버튼 -->
      <button onclick="newDictation()">다음 문제 ➡</button>
    </section>

    <!-- 세 번째 기능: 하루 2개 단어 도전 과제 -->
    <section class="section">

      <!-- 기능 제목 -->
      <h2>🏆 하루 2개 단어 도전 과제</h2>

      <!-- 도전 과제 설명 -->
      <p>영어 단어를 보고 한국어 뜻을 입력해 보세요!</p>

      <!-- 오늘의 날짜 -->
      <p id="todayText" class="small"></p>

      <!-- 도전 과제 진행 상황 -->
      <p class="challenge-status" id="challengeStatus">0 / 2 완료</p>

      <!-- 도전 과제 단어들이 들어갈 곳 -->
      <div id="challengeList"></div>

      <!-- 도전 과제 완료 메시지 -->
      <div class="result" id="challengeResult"></div>
    </section>

    <!-- 마지막 안내 -->
    <p class="description">⭐ 매일 2개씩 공부하면 영어 실력이 쑥쑥!</p>
  </main>

  <script>
    // ==========================================
    // 📌 여기만 고치세요! 영어 단어 목록
    // ==========================================

    // 영어 단어와 뜻, 예문을 배열에 저장
    const words = [
      { en: 'achieve', ko: '달성하다', ex: 'I can achieve my dream.' }, // 1번
      { en: 'adventure', ko: '모험', ex: 'Life is an adventure.' }, // 2번
      { en: 'ancient', ko: '고대의', ex: 'This is an ancient building.' }, // 3번
      { en: 'careful', ko: '조심하는', ex: 'Be careful on the road.' }, // 4번
      { en: 'comfortable', ko: '편안한', ex: 'This chair is comfortable.' }, // 5번
      { en: 'decide', ko: '결정하다', ex: 'I decide to study.' }, // 6번
      { en: 'different', ko: '다른', ex: 'We are different.' }, // 7번
      { en: 'environment', ko: '환경', ex: 'We protect the environment.' }, // 8번
      { en: 'experience', ko: '경험', ex: 'It was a great experience.' }, // 9번
      { en: 'favorite', ko: '가장 좋아하는', ex: 'Soccer is my favorite sport.' }, // 10번
      { en: 'imagine', ko: '상상하다', ex: 'Imagine a beautiful world.' }, // 11번
      { en: 'important', ko: '중요한', ex: 'English is important.' }, // 12번
      { en: 'information', ko: '정보', ex: 'I need more information.' }, // 13번
      { en: 'knowledge', ko: '지식', ex: 'Reading gives us knowledge.' }, // 14번
      { en: 'possible', ko: '가능한', ex: 'Anything is possible.' }, // 15번
      { en: 'prepare', ko: '준비하다', ex: 'I prepare for the test.' }, // 16번
      { en: 'protect', ko: '보호하다', ex: 'We protect animals.' }, // 17번
      { en: 'remember', ko: '기억하다', ex: 'I remember your name.' }, // 18번
      { en: 'solution', ko: '해결책', ex: 'We found a solution.' }, // 19번
      { en: 'wonderful', ko: '멋진', ex: 'Today is a wonderful day.' } // 20번
    ];

    // ==========================================
    // 기본 설정과 변수
    // ==========================================

    // 현재 카드 번호를 저장
    let currentIndex = 0;

    // 현재 받아쓰기 문제 번호를 저장
    let dictationIndex = Math.floor(Math.random() * words.length);

    // HTML 요소를 가져오기
    const card = document.getElementById('card');

    // 단어 표시 요소 가져오기
    const wordElement = document.getElementById('word');

    // 뜻 표시 요소 가져오기
    const meaningElement = document.getElementById('meaning');

    // 예문 표시 요소 가져오기
    const exampleElement = document.getElementById('example');

    // 진도 표시 요소 가져오기
    const progressText = document.getElementById('progressText');

    // 진도 막대 가져오기
    const progressBar = document.getElementById('progressBar');

    // 이전 버튼 가져오기
    const prevBtn = document.getElementById('prevBtn');

    // 다음 버튼 가져오기
    const nextBtn = document.getElementById('nextBtn');

    // ==========================================
    // 단어 카드 기능
    // ==========================================

    // 카드를 뒤집는 함수
    function flipCard() {
      card.classList.toggle('flipped'); // 뒤집기 효과 켜고 끄기
    }

    // 현재 단어를 화면에 표시하는 함수
    function showWord() {
      const word = words[currentIndex]; // 현재 단어 가져오기

      wordElement.textContent = word.en; // 영어 단어 표시
      meaningElement.textContent = word.ko; // 한국어 뜻 표시
      exampleElement.textContent = word.ex; // 예문 표시

      progressText.textContent = `${currentIndex + 1} / ${words.length}`; // 진도 숫자 표시

      const progress = ((currentIndex + 1) / words.length) * 100; // 진도 계산
      progressBar.style.width = `${progress}%`; // 진도 막대 변경

      card.classList.remove('flipped'); // 새 카드는 앞면부터 표시

      prevBtn.disabled = currentIndex === 0; // 첫 단어면 이전 버튼 비활성화
      nextBtn.disabled = currentIndex === words.length - 1; // 마지막이면 다음 버튼 비활성화
    }

    // 영어 단어를 소리 내어 읽는 함수
    function speakWord() {
      window.speechSynthesis.cancel(); // 이전 발음 멈추기

      const speech = new SpeechSynthesisUtterance(words[currentIndex].en); // 단어 읽기 준비
      speech.lang = 'en-US'; // 미국식 영어 설정
      speech.rate = 0.85; // 천천히 읽기
      window.speechSynthesis.speak(speech); // 발음 재생
    }

    // 영어 예문을 소리 내어 읽는 함수
    function speakSentence() {
      window.speechSynthesis.cancel(); // 이전 발음 멈추기

      const speech = new SpeechSynthesisUtterance(words[currentIndex].ex); // 문장 읽기 준비
      speech.lang = 'en-US'; // 미국식 영어 설정
      speech.rate = 0.85; // 천천히 읽기
      window.speechSynthesis.speak(speech); // 발음 재생
    }

    // 이전 단어로 이동하는 함수
    function previousWord() {
      if (currentIndex > 0) { // 첫 단어가 아니라면
        currentIndex--; // 번호 하나 줄이기
        window.speechSynthesis.cancel(); // 발음 멈추기
        showWord(); // 화면 바꾸기
      }
    }

    // 다음 단어로 이동하는 함수
    function nextWord() {
      if (currentIndex < words.length - 1) { // 마지막 단어가 아니라면
        currentIndex++; // 번호 하나 늘리기
        window.speechSynthesis.cancel(); // 발음 멈추기
        showWord(); // 화면 바꾸기
      }
    }

    // ==========================================
    // 영어 문장 받아쓰기 테스트
    // ==========================================

    // 현재 받아쓰기 문제의 문장을 읽어주는 함수
    function playTestSentence() {
      window.speechSynthesis.cancel(); // 이전 소리 멈추기

      const sentence = words[dictationIndex].ex; // 문제 문장 가져오기
      const speech = new SpeechSynthesisUtterance(sentence); // 음성 만들기
      speech.lang = 'en-US'; // 영어 발음 설정
      speech.rate = 0.8; // 조금 느리게 읽기
      window.speechSynthesis.speak(speech); // 문장 읽기
    }

    // 받아쓰기 정답을 확인하는 함수
    function checkDictation() {
      const answer = document.getElementById('dictationInput').value.trim(); // 입력한 답 가져오기
      const correct = words[dictationIndex].ex; // 정답 문장 가져오기
      const result = document.getElementById('dictationResult'); // 결과 표시 칸 가져오기

      if (answer.toLowerCase() === correct.toLowerCase()) { // 대소문자를 구분하지 않고 비교
        result.textContent = '🎉 정답이에요! 정말 잘했어요!'; // 정답 메시지
        result.style.color = '#059669'; // 초록색으로 표시
      } else { // 답이 틀렸다면
        result.textContent = '❌ 다시 들어보고 도전해 보세요!'; // 오답 메시지
        result.style.color = '#dc2626'; // 빨간색으로 표시
      }
    }

    // 새로운 받아쓰기 문제를 만드는 함수
    function newDictation() {
      let newIndex = dictationIndex; // 현재 문제 번호 저장

      while (words.length > 1 && newIndex === dictationIndex) { // 같은 문제가 나오지 않게 하기
        newIndex = Math.floor(Math.random() * words.length); // 새로운 번호 뽑기
      }

      dictationIndex = newIndex; // 새 문제 번호 저장
      document.getElementById('dictationInput').value = ''; // 입력 칸 비우기
      document.getElementById('dictationResult').textContent = ''; // 결과 지우기
      window.speechSynthesis.cancel(); // 이전 발음 멈추기
      playTestSentence(); // 새 문제 읽어주기
    }

    // ==========================================
    // 하루 2개 단어 뜻 맞히기 도전 과제
    // ==========================================

    // 오늘 날짜를 문자열로 만드는 함수
    function getTodayKey() {
      const today = new Date(); // 오늘 날짜 가져오기
      const year = today.getFullYear(); // 연도 가져오기
      const month = String(today.getMonth() + 1).padStart(2, '0'); // 월 가져오기
      const day = String(today.getDate()).padStart(2, '0'); // 날짜 가져오기
      return `${year}-${month}-${day}`; // 날짜를 하나의 문자열로 만들기
    }

    // 오늘 날짜에 맞는 저장 이름 만들기
    const challengeKey = 'englishChallenge-' + getTodayKey();

    // 오늘의 도전 과제 기록 가져오기
    let challengeData = JSON.parse(localStorage.getItem(challengeKey) || 'null');

    // 오늘 기록이 없다면 새로 만들기
    if (!challengeData) {
      const shuffled = [...words].sort(() => Math.random() - 0.5); // 단어 순서를 섞기

      challengeData = {
        indexes: shuffled.slice(0, Math.min(2, words.length)).map(word => words.indexOf(word)), // 단어 2개 고르기
        completed: [] // 완료한 문제 번호 저장
      };

      localStorage.setItem(challengeKey, JSON.stringify(challengeData)); // 오늘 기록 저장
    }

    // 도전 과제 화면을 만드는 함수
    function showChallenge() {
      const list = document.getElementById('challengeList'); // 단어 목록 영역 가져오기
      const status = document.getElementById('challengeStatus'); // 진행 상황 가져오기
      const result = document.getElementById('challengeResult'); // 완료 메시지 가져오기

      list.innerHTML = ''; // 기존 화면 비우기

      document.getElementById('todayText').textContent = '📅 오늘 날짜: ' + getTodayKey(); // 날짜 표시

      challengeData.indexes.forEach((wordIndex, challengeNumber) => { // 도전 단어 2개 반복하기
        const word = words[wordIndex]; // 도전 단어 가져오기
        const done = challengeData.completed.includes(challengeNumber); // 완료 여부 확인

        const box = document.createElement('div'); // 단어 상자 만들기
        box.className = 'challenge-card'; // 상자 디자인 적용

        const title = document.createElement('div'); // 영어 단어 표시 만들기
        title.className = 'challenge-word'; // 단어 디자인 적용
        title.textContent = `${challengeNumber + 1}. ${word.en}`; // 영어 단어 표시
        box.appendChild(title); // 상자에 단어 넣기

        if (done) { // 이미 정답을 맞혔다면
          const message = document.createElement('p'); // 완료 안내 만들기
          message.textContent = '✅ 완료! 뜻: ' + word.ko; // 정답 표시
          message.style.color = '#059669'; // 초록색 표시
          box.appendChild(message); // 상자에 완료 안내 넣기
        } else { // 아직 정답을 맞히지 않았다면
          const input = document.createElement('input'); // 입력 칸 만들기
          input.type = 'text'; // 글자 입력 형식
          input.placeholder = '한국어 뜻을 입력하세요'; // 안내 문구
          input.id = 'challengeInput' + challengeNumber; // 입력 칸 고유 이름
          box.appendChild(input); // 상자에 입력 칸 넣기

          const button = document.createElement('button'); // 확인 버튼 만들기
          button.textContent = '뜻 확인하기'; // 버튼 글자
          button.onclick = () => checkChallenge(challengeNumber); // 확인 함수 연결
          box.appendChild(button); // 상자에 버튼 넣기
        }

        list.appendChild(box); // 화면에 단어 상자 추가
      });

      status.textContent = `${challengeData.completed.length} / ${challengeData.indexes.length} 완료`; // 진행 상황 표시

      if (challengeData.completed.length === challengeData.indexes.length) { // 모두 완료했다면
        result.textContent = '🏆 오늘의 도전 과제 성공! 내일 또 도전해요!'; // 성공 메시지
        result.style.color = '#059669'; // 초록색 표시
      } else { // 아직 남은 문제가 있다면
        result.textContent = '두 문제를 모두 맞혀 보세요!'; // 도전 안내
        result.style.color = '#4f46e5'; // 보라색 표시
      }
    }

    // 도전 과제 정답을 확인하는 함수
    function checkChallenge(number) {
      const wordIndex = challengeData.indexes[number]; // 문제 단어 번호 가져오기
      const correct = words[wordIndex].ko; // 정답 뜻 가져오기
      const input = document.getElementById('challengeInput' + number); // 입력 칸 가져오기
      const answer = input.value.trim().replace(/\s+/g, ' '); // 입력한 답의 앞뒤 공백 정리

      if (answer === correct) { // 정답과 입력한 뜻이 같다면
        challengeData.completed.push(number); // 완료 목록에 추가
        localStorage.setItem(challengeKey, JSON.stringify(challengeData)); // 완료 기록 저장
        showChallenge(); // 화면 다시 그리기
      } else { // 정답이 아니라면
        alert('아직 정답이 아니에요! 다시 생각해 보세요.'); // 다시 도전 안내
      }
    }

    // ==========================================
    // 처음 화면 실행
    // ==========================================

    // 첫 번째 단어 카드 보여주기
    showWord();

    // 오늘의 도전 과제 보여주기
    showChallenge();
  </script>
</body>
</html>
