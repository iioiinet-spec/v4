<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>포켓몬 키우기 - 아파트 거실 HQ 디럭스</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      user-select: none;
    }

    body {
      background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
    }

    .game-container {
      background-color: #ffffff;
      width: 100%;
      max-width: 480px;
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
      border: 3px solid #ffffff;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* 포켓몬 선택 화면 (모달) */
    .select-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      padding: 15px 10px;
      z-index: 100;
      overflow-y: auto;
    }

    .select-modal.hidden {
      display: none;
    }

    .select-title {
      font-size: 18px;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 12px;
    }

    .pokemon-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
    }

    .option-card {
      border: 2px solid #e1e8ed;
      border-radius: 12px;
      padding: 8px 4px;
      cursor: pointer;
      transition: all 0.2s ease;
      background-color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .option-card:hover {
      border-color: #3498db;
      transform: translateY(-4px);
      box-shadow: 0 4px 10px rgba(52, 152, 219, 0.2);
    }

    .option-card img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      image-rendering: pixelated;
    }

    .option-name {
      font-size: 12px;
      font-weight: bold;
      margin-top: 4px;
      color: #2c3e50;
    }

    /* 상단 영역 */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .level-title {
      font-size: 17px;
      font-weight: bold;
      color: #2c3e50;
    }

    .reset-btn {
      background-color: #ff6b6b;
      color: #ffffff;
      border: none;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .reset-btn:hover {
      background-color: #ee5253;
    }

    /* 경험치/부화 진행도 바 */
    .exp-container {
      margin-bottom: 12px;
      text-align: left;
    }

    .exp-label {
      font-size: 11px;
      color: #7f8c8d;
      margin-bottom: 3px;
      display: flex;
      justify-content: space-between;
      font-weight: bold;
    }

    .exp-bar-bg {
      background-color: #ecf0f1;
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
    }

    .exp-bar-fill {
      background-color: #3498db;
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }

    /* 🏠 아파트 거실 배경 무대 🏠 */
    .pokemon-stage {
      position: relative;
      height: 220px;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      margin-bottom: 12px;
      border: 2px solid #dcdde1;
      overflow: hidden;
      background: linear-gradient(to bottom, #fdfbf7 0%, #f3eee7 70%, #dcd3c8 70%, #c4b49e 73%, #deb887 73%, #c69c6d 100%);
    }

    .living-room-window {
      position: absolute;
      top: 15px;
      left: 18px;
      width: 90px;
      height: 70px;
      border: 4px solid #ffffff;
      background: linear-gradient(to bottom, #87ceeb, #e0f6ff);
      box-shadow: inset 0 0 8px rgba(0,0,0,0.1);
      display: flex;
      border-radius: 4px;
    }
    .living-room-window::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 2px;
      background: white;
    }
    .living-room-window::after {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      width: 2px;
      height: 100%;
      background: white;
    }

    .sofa {
      position: absolute;
      bottom: 60px;
      right: 15px;
      width: 85px;
      height: 40px;
      background-color: #a55eea;
      border-radius: 10px 10px 5px 5px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .sofa::before {
      content: '';
      position: absolute;
      top: -12px;
      left: 0;
      width: 100%;
      height: 16px;
      background-color: #8854d0;
      border-radius: 8px 8px 0 0;
    }

    .rug {
      position: absolute;
      bottom: 10px;
      width: 250px;
      height: 40px;
      background: radial-gradient(ellipse at center, #f7b731 0%, #eb3b5a 100%);
      border-radius: 50%;
      opacity: 0.85;
    }

    .speech-bubble {
      position: absolute;
      top: 10px;
      background: rgba(255, 255, 255, 0.95);
      border: 2px solid #2c3e50;
      border-radius: 12px;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: bold;
      color: #2c3e50;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      z-index: 10;
      max-width: 85%;
    }

    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 6px 6px 0;
      border-style: solid;
      border-color: #2c3e50 transparent;
      display: block;
      width: 0;
    }

    .pokemon-wrapper {
      position: relative;
      bottom: 20px;
      z-index: 5;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.1s;
      cursor: pointer;
    }

    .pokemon-img {
      width: 96px;
      height: 96px;
      object-fit: contain;
      image-rendering: pixelated;
    }

    .sick-filter {
      filter: grayscale(80%) opacity(0.7);
    }

    .status-text {
      position: absolute;
      bottom: 5px;
      right: 10px;
      font-size: 11px;
      font-weight: bold;
      color: #fff;
      background: rgba(0,0,0,0.5);
      padding: 2px 8px;
      border-radius: 10px;
      z-index: 6;
    }

    /* 알 및 포켓몬 애니메이션 모션 */
    .anim-egg-shake {
      animation: actEggShake 0.5s ease-in-out infinite alternate;
    }
    .anim-run {
      animation: actRun 1.2s ease-in-out infinite alternate;
    }
    .anim-jump {
      animation: actJump 0.6s ease-in-out;
    }
    .anim-roll {
      animation: actRoll 0.8s linear;
    }
    .anim-double-jump {
      animation: actDoubleJumpSpin 1.2s ease-in-out;
    }

    @keyframes actEggShake {
      0% { transform: rotate(-12deg) translateY(0); }
      50% { transform: rotate(12deg) translateY(-8px); }
      100% { transform: rotate(-12deg) translateY(0); }
    }

    @keyframes actRun {
      0% { transform: translateX(-110px) scaleX(1); }
      49% { transform: translateX(110px) scaleX(1); }
      50% { transform: translateX(110px) scaleX(-1); }
      100% { transform: translateX(-110px) scaleX(-1); }
    }

    @keyframes actJump {
      0% { transform: translateY(0); }
      50% { transform: translateY(-70px); }
      100% { transform: translateY(0); }
    }

    @keyframes actRoll {
      0% { transform: translateX(-60px) rotate(0deg); }
      100% { transform: translateX(60px) rotate(720deg); }
    }

    @keyframes actDoubleJumpSpin {
      0% { transform: translateY(0) rotate(0deg); }
      30% { transform: translateY(-50px) rotate(180deg); }
      50% { transform: translateY(-30px) rotate(360deg); }
      80% { transform: translateY(-100px) rotate(540deg); }
      100% { transform: translateY(0) rotate(720deg); }
    }

    /* 진화/부화 overlay */
    .evolution-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(255, 255, 255, 0.95);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      font-weight: bold;
      color: #2980b9;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
      z-index: 20;
    }

    .evolution-overlay.active {
      opacity: 1;
    }

    /* 게이지 상태창 */
    .stats-container {
      background-color: #f8fafc;
      padding: 10px;
      border-radius: 12px;
      margin-bottom: 10px;
      border: 1px solid #edf2f7;
    }

    .stat-row {
      display: flex;
      align-items: center;
      margin-bottom: 5px;
    }

    .stat-row:last-child {
      margin-bottom: 0;
    }

    .stat-label {
      width: 55px;
      font-size: 11px;
      font-weight: bold;
      color: #4a5568;
      text-align: left;
    }

    .bar-bg {
      flex: 1;
      background-color: #e2e8f0;
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
      margin-left: 8px;
    }

    .bar-fill {
      height: 100%;
      width: 70%;
      border-radius: 5px;
      transition: width 0.4s ease, background-color 0.4s ease;
    }

    /* 컨트롤 버튼 */
    .actions-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 8px;
    }

    .btn {
      background-color: #edf2f7;
      border: 1px solid #cbd5e0;
      padding: 8px 2px;
      font-size: 11px;
      font-weight: bold;
      color: #2d3748;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.1s ease;
    }

    .btn:hover {
      background-color: #e2e8f0;
    }

    .btn:active {
      transform: translateY(2px);
    }

    .btn-action {
      background-color: #e3f2fd;
      border-color: #90caf9;
      color: #1565c0;
    }

    .btn-egg-touch {
      grid-column: span 4;
      background-color: #fff3e0;
      border-color: #ffe0b2;
      color: #e65100;
      font-size: 13px;
      padding: 10px;
    }

    .btn-heal {
      background-color: #ffebee;
      border-color: #ffcdd2;
      color: #c62828;
      grid-column: span 4;
      display: none;
    }

    /* 동작 버튼 */
    .motion-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 8px;
    }

    .btn-motion {
      background-color: #f3e5f5;
      border-color: #ce93d8;
      color: #6a1b9a;
      font-size: 10px;
    }

    /* 가위바위보 패널 */
    .rsp-panel {
      background-color: #ebf8ff;
      border: 1px solid #bee3f8;
      border-radius: 10px;
      padding: 8px;
    }

    .rsp-title {
      font-size: 11px;
      font-weight: bold;
      color: #2b6cb0;
      margin-bottom: 5px;
    }

    .rsp-btn-group {
      display: flex;
      justify-content: space-around;
    }

    .rsp-btn {
      background-color: #ffffff;
      border: 1px solid #90cdf4;
      padding: 4px 12px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 11px;
      color: #2b6cb0;
      cursor: pointer;
    }

    .rsp-btn:hover {
      background-color: #bee3f8;
    }

    .disabled-area {
      opacity: 0.5;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <!-- 포켓몬 선택 모달 -->
    <div id="select-modal" class="select-modal">
      <div class="select-title">어떤 포켓몬의 알을 품으시겠습니까?</div>
      <div id="pokemon-options" class="pokemon-options">
        <!-- 스크립트 생성 -->
      </div>
    </div>

    <!-- 상단 바 -->
    <div class="top-bar">
      <div id="stage-title" class="level-title">포켓몬 알 (부화 대기 중)</div>
      <button class="reset-btn" onclick="confirmReset()">기록 초기화</button>
    </div>

    <!-- 경험치 / 부화 진행도 바 -->
    <div class="exp-container">
      <div class="exp-label">
        <span id="exp-title-label">알 부화 진행도</span>
        <span id="exp-text">0 / 100</span>
      </div>
      <div class="exp-bar-bg">
        <div id="exp-bar" class="exp-bar-fill"></div>
      </div>
    </div>

    <!-- 🏠 아파트 거실 포켓몬 무대 🏠 -->
    <div class="pokemon-stage">
      <div class="living-room-window"></div>
      <div class="sofa"></div>
      <div class="rug"></div>

      <div id="evolution-overlay" class="evolution-overlay">✨ 알이 깨어나고 있습니다! ✨</div>
      <div id="speech-bubble" class="speech-bubble">알을 쓰다듬어서 따뜻하게 해주세요!</div>
      
      <div id="pokemon-wrapper" class="pokemon-wrapper" onclick="handlePetClick()">
        <img id="pokemon-img" class="pokemon-img" src="" alt="포켓몬">
      </div>

      <div id="status-text" class="status-text">상태: 알</div>
    </div>

    <!-- 상태 게이지 -->
    <div id="stats-container" class="stats-container disabled-area">
      <div class="stat-row">
        <span class="stat-label">포만감</span>
        <div class="bar-bg"><div id="fullness-bar" class="bar-fill"></div></div>
      </div>
      <div class="stat-row">
        <span class="stat-label">행복도</span>
        <div class="bar-bg"><div id="happiness-bar" class="bar-fill"></div></div>
      </div>
      <div class="stat-row">
        <span class="stat-label">청결도</span>
        <div class="bar-bg"><div id="cleanliness-bar" class="bar-fill"></div></div>
      </div>
      <div class="stat-row">
        <span class="stat-label">에너지</span>
        <div class="bar-bg"><div id="energy-bar" class="bar-fill"></div></div>
      </div>
    </div>

    <!-- 케어 버튼 -->
    <div id="actions-grid" class="actions-grid">
      <button id="egg-touch-btn" class="btn btn-egg-touch" onclick="touchEgg()">🥚 알 어루만지기 (+온도 상승)</button>
      <button class="btn btn-action care-btn" onclick="feed()">🥣 밥주기</button>
      <button class="btn btn-action care-btn" onclick="clean()">🚿 씻기기</button>
      <button class="btn btn-action care-btn" onclick="sleep()">💤 휴식하기</button>
      <button class="btn btn-action care-btn" onclick="triggerMotion('jump')">🎾 놀아주기</button>
      <button id="heal-btn" class="btn btn-heal" onclick="heal()">💊 치료하기 (병 치료)</button>
    </div>

    <!-- 동작 버튼 -->
    <div id="motion-grid" class="motion-grid disabled-area">
      <button class="btn btn-motion" onclick="triggerMotion('run')">🏃 뛰기</button>
      <button class="btn btn-motion" onclick="triggerMotion('jump')">⬆️ 점프</button>
      <button class="btn btn-motion" onclick="triggerMotion('roll')">🌀 구르기</button>
      <button class="btn btn-motion" onclick="triggerMotion('doubleJump')">💫 2단점프 회전</button>
    </div>

    <!-- 가위바위보 패널 -->
    <div id="rsp-panel" class="rsp-panel disabled-area">
      <div class="rsp-title">🎮 미니게임 : 가위바위보 (행복도 & EXP 상승)</div>
      <div class="rsp-btn-group">
        <button class="rsp-btn" onclick="playRSP('가위')">가위</button>
        <button class="rsp-btn" onclick="playRSP('바위')">바위</button>
        <button class="rsp-btn" onclick="playRSP('보')">보</button>
      </div>
    </div>
  </div>

  <script>
    // 🎨 고화질 입체 포켓몬 알 벡터 SVG 데이터
    const EGG_SPRITE = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 240'><defs><radialGradient id='eggGlow' cx='35%' cy='30%' r='65%'><stop offset='0%' stop-color='%23ffffff'/><stop offset='40%' stop-color='%23fffbeb'/><stop offset='85%' stop-color='%23e0d6b8'/><stop offset='100%' stop-color='%23b8a682'/></radialGradient><radialGradient id='shadowGrad' cx='50%' cy='50%' r='50%'><stop offset='0%' stop-color='rgba(0,0,0,0.35)'/><stop offset='100%' stop-color='rgba(0,0,0,0)'/></radialGradient></defs><ellipse cx='100' cy='220' rx='65' ry='12' fill='url(%23shadowGrad)'/><path d='M 100 20 C 150 20, 175 90, 175 145 C 175 190, 145 215, 100 215 C 55 215, 25 190, 25 145 C 25 90, 50 20, 100 20 Z' fill='url(%23eggGlow)' stroke='%23705d42' stroke-width='4'/><ellipse cx='70' cy='75' rx='14' ry='18' fill='%2338a169' opacity='0.85' transform='rotate(-15, 70, 75)'/><ellipse cx='132' cy='115' rx='18' ry='24' fill='%2338a169' opacity='0.85' transform='rotate(20, 132, 115)'/><ellipse cx='78' cy='165' rx='16' ry='20' fill='%2338a169' opacity='0.85' transform='rotate(-10, 78, 165)'/><path d='M 60 40 Q 80 28, 105 32' fill='none' stroke='%23ffffff' stroke-width='5' stroke-linecap='round' opacity='0.75'/></svg>";

    // Audio Context
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
    }

    function playSound(type) {
      initAudio();
      if (!audioCtx) return;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'click') {
        osc.frequency.setValueAtTime(400, now);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
        osc.start(now);
        osc.stop(now + 0.05);
      } else if (type === 'egg') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(350, now);
        osc.frequency.exponentialRampToValueAtTime(550, now + 0.12);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
        osc.start(now);
        osc.stop(now + 0.12);
      } else if (type === 'feed') {
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
      } else if (type === 'motion') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(250, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.25);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
      } else if (type === 'win') {
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.1);
        osc.frequency.setValueAtTime(783.99, now + 0.2);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
        osc.start(now);
        osc.stop(now + 0.35);
      } else if (type === 'hatch') {
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.setValueAtTime(450, now + 0.15);
        osc.frequency.setValueAtTime(600, now + 0.3);
        osc.frequency.setValueAtTime(850, now + 0.45);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
        osc.start(now);
        osc.stop(now + 0.6);
      } else if (type === 'levelup') {
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.setValueAtTime(554.37, now + 0.1);
        osc.frequency.setValueAtTime(659.25, now + 0.2);
        osc.frequency.setValueAtTime(880, now + 0.3);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
        osc.start(now);
        osc.stop(now + 0.5);
      } else if (type === 'heal') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(900, now + 0.2);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.start(now);
        osc.stop(now + 0.2);
      }
    }

    // -----------------------------------------------------------------
    // 12종 포켓몬 데이터베이스
    // -----------------------------------------------------------------
    const POKEMON_TREES = [
      [
        { name: "파이리", sprite: "https://play.pokemonshowdown.com/sprites/ani/charmander.gif" },
        { name: "리자드", sprite: "https://play.pokemonshowdown.com/sprites/ani/charmeleon.gif" },
        { name: "리자몽", sprite: "https://play.pokemonshowdown.com/sprites/ani/charizard.gif" }
      ],
      [
        { name: "피츄",   sprite: "https://play.pokemonshowdown.com/sprites/ani/pichu.gif" },
        { name: "피카츄", sprite: "https://play.pokemonshowdown.com/sprites/ani/pikachu.gif" },
        { name: "라이츄", sprite: "https://play.pokemonshowdown.com/sprites/ani/raichu.gif" }
      ],
      [
        { name: "꼬부기", sprite: "https://play.pokemonshowdown.com/sprites/ani/squirtle.gif" },
        { name: "어니부기", sprite: "https://play.pokemonshowdown.com/sprites/ani/wartortle.gif" },
        { name: "거북왕", sprite: "https://play.pokemonshowdown.com/sprites/ani/blastoise.gif" }
      ],
      [
        { name: "이상해씨", sprite: "https://play.pokemonshowdown.com/sprites/ani/bulbasaur.gif" },
        { name: "이상해풀", sprite: "https://play.pokemonshowdown.com/sprites/ani/ivysaur.gif" },
        { name: "이상해꽃", sprite: "https://play.pokemonshowdown.com/sprites/ani/venusaur.gif" }
      ],
      [
        { name: "치코리타", sprite: "https://play.pokemonshowdown.com/sprites/ani/chikorita.gif" },
        { name: "베이리프", sprite: "https://play.pokemonshowdown.com/sprites/ani/bayleef.gif" },
        { name: "메가니움", sprite: "https://play.pokemonshowdown.com/sprites/ani/meganium.gif" }
      ],
      [
        { name: "브케인", sprite: "https://play.pokemonshowdown.com/sprites/ani/cyndaquil.gif" },
        { name: "마그케인", sprite: "https://play.pokemonshowdown.com/sprites/ani/quilava.gif" },
        { name: "블레이범", sprite: "https://play.pokemonshowdown.com/sprites/ani/typhlosion.gif" }
      ],
      [
        { name: "리아코", sprite: "https://play.pokemonshowdown.com/sprites/ani/totodile.gif" },
        { name: "엘리게이", sprite: "https://play.pokemonshowdown.com/sprites/ani/croconaw.gif" },
        { name: "장크로다일", sprite: "https://play.pokemonshowdown.com/sprites/ani/feraligatr.gif" }
      ],
      [
        { name: "아차모", sprite: "https://play.pokemonshowdown.com/sprites/ani/torchic.gif" },
        { name: "영치코", sprite: "https://play.pokemonshowdown.com/sprites/ani/combusken.gif" },
        { name: "번치코", sprite: "https://play.pokemonshowdown.com/sprites/ani/blaziken.gif" }
      ],
      [
        { name: "팽도리", sprite: "https://play.pokemonshowdown.com/sprites/ani/piplup.gif" },
        { name: "팽태자", sprite: "https://play.pokemonshowdown.com/sprites/ani/prinplup.gif" },
        { name: "엠페르트", sprite: "https://play.pokemonshowdown.com/sprites/ani/empoleon.gif" }
      ],
      [
        { name: "랄토스", sprite: "https://play.pokemonshowdown.com/sprites/ani/ralts.gif" },
        { name: "킬리아", sprite: "https://play.pokemonshowdown.com/sprites/ani/kirlia.gif" },
        { name: "가디안", sprite: "https://play.pokemonshowdown.com/sprites/ani/gardevoir.gif" }
      ],
      [
        { name: "메리프", sprite: "https://play.pokemonshowdown.com/sprites/ani/mareep.gif" },
        { name: "보송송", sprite: "https://play.pokemonshowdown.com/sprites/ani/flaaffy.gif" },
        { name: "전룡",   sprite: "https://play.pokemonshowdown.com/sprites/ani/ampharos.gif" }
      ],
      [
        { name: "루리리", sprite: "https://play.pokemonshowdown.com/sprites/ani/azurill.gif" },
        { name: "마릴",   sprite: "https://play.pokemonshowdown.com/sprites/ani/marill.gif" },
        { name: "마릴리", sprite: "https://play.pokemonshowdown.com/sprites/ani/azumarill.gif" }
      ]
    ];

    const DEFAULT_DATA = {
      typeIndex: null,
      isHatched: false,
      hatchProgress: 0,
      fullness: 80,
      happiness: 80,
      cleanliness: 80,
      energy: 80,
      exp: 0,
      level: 1,
      isSick: false
    };

    let gameState = { ...DEFAULT_DATA };

    function renderSelectOptions() {
      const container = document.getElementById("pokemon-options");
      container.innerHTML = "";

      POKEMON_TREES.forEach((tree, idx) => {
        const firstForm = tree[0];
        const card = document.createElement("div");
        card.className = "option-card";
        card.onclick = () => selectPokemon(idx);
        card.innerHTML = `
          <img src="${firstForm.sprite}" alt="${firstForm.name}">
          <div class="option-name">${firstForm.name}</div>
        `;
        container.appendChild(card);
      });
    }

    function saveData() {
      localStorage.setItem('pokemon_egg_apartment_hq_save', JSON.stringify(gameState));
    }

    function loadData() {
      const saved = localStorage.getItem('pokemon_egg_apartment_hq_save');
      if (saved) {
        try {
          gameState = JSON.parse(saved);
        } catch (e) {
          gameState = { ...DEFAULT_DATA };
        }
      }
    }

    function confirmReset() {
      playSound('click');
      if (confirm("모든 저장 기록을 삭제하고 알부터 다시 키우시겠습니까?")) {
        localStorage.removeItem('pokemon_egg_apartment_hq_save');
        gameState = { ...DEFAULT_DATA };
        document.getElementById("select-modal").classList.remove("hidden");
        showSpeech("초기화되었습니다. 품을 알을 선택해주세요!");
        updateUI();
      }
    }

    function selectPokemon(idx) {
      playSound('click');
      gameState = { ...DEFAULT_DATA, typeIndex: idx };
      document.getElementById("select-modal").classList.add("hidden");
      showSpeech("소중한 알을 얻었습니다! 따뜻하게 어루만져 주세요!");
      updateUI();
    }

    function clamp(val) {
      return Math.min(100, Math.max(0, val));
    }

    function getStatusText() {
      if (!gameState.isHatched) return "상태: 알 (부화 필요)";
      if (gameState.isSick) return "상태: 아픔 🤒";
      const avg = (gameState.fullness + gameState.happiness + gameState.cleanliness + gameState.energy) / 4;
      if (avg >= 70) return "상태: 최고 😄";
      if (avg >= 30) return "상태: 보통 🙂";
      return "상태: 나쁨 🙁";
    }

    function getBarColor(val) {
      if (val > 50) return "#2ecc71";
      if (val > 20) return "#f39c12";
      return "#e74c3c";
    }

    function handlePetClick() {
      if (!gameState.isHatched) {
        touchEgg();
      }
    }

    function touchEgg() {
      if (gameState.isHatched) return;
      playSound('egg');

      const wrapper = document.getElementById("pokemon-wrapper");
      wrapper.className = "pokemon-wrapper anim-egg-shake";
      setTimeout(() => wrapper.className = "pokemon-wrapper", 500);

      gameState.hatchProgress += 12;
      showSpeech("알을 어루만져서 온도가 올랐습니다! 🐣");

      if (gameState.hatchProgress >= 100) {
        gameState.hatchProgress = 100;
        hatchEgg();
      }

      updateUI();
    }

    function hatchEgg() {
      playSound('hatch');
      const overlay = document.getElementById("evolution-overlay");
      overlay.innerText = "✨ 축하합니다! 알에서 포켓몬이 부화했습니다! ✨";
      overlay.classList.add("active");

      setTimeout(() => {
        overlay.classList.remove("active");
        gameState.isHatched = true;
        const tree = POKEMON_TREES[gameState.typeIndex];
        showSpeech(`귀여운 ${tree[0].name}(이)가 태어났습니다!`);
        updateUI();
      }, 1500);
    }

    function updateUI() {
      if (gameState.typeIndex === null) {
        document.getElementById("select-modal").classList.remove("hidden");
        return;
      }

      const imgElem = document.getElementById("pokemon-img");
      const eggTouchBtn = document.getElementById("egg-touch-btn");
      const careBtns = document.querySelectorAll(".care-btn");
      const statsContainer = document.getElementById("stats-container");
      const motionGrid = document.getElementById("motion-grid");
      const rspPanel = document.getElementById("rsp-panel");

      if (!gameState.isHatched) {
        // 알 상태
        document.getElementById("stage-title").innerText = "포켓몬 알 (부화 대기 중)";
        document.getElementById("exp-title-label").innerText = "알 부화 진행도";
        document.getElementById("exp-bar").style.width = gameState.hatchProgress + "%";
        document.getElementById("exp-bar").style.backgroundColor = "#f39c12";
        document.getElementById("exp-text").innerText = `${gameState.hatchProgress} / 100`;
        
        imgElem.src = EGG_SPRITE;

        eggTouchBtn.style.display = "block";
        careBtns.forEach(btn => btn.style.display = "none");
        statsContainer.classList.add("disabled-area");
        motionGrid.classList.add("disabled-area");
        rspPanel.classList.add("disabled-area");
      } else {
        // 부화 후
        const tree = POKEMON_TREES[gameState.typeIndex];
        const stageIdx = Math.min(gameState.level - 1, tree.length - 1);
        const currentStage = tree[stageIdx];

        document.getElementById("stage-title").innerText = `${currentStage.name} (Lv.${gameState.level})`;
        document.getElementById("exp-title-label").innerText = "경험치 (EXP)";
        document.getElementById("exp-bar").style.width = gameState.exp + "%";
        document.getElementById("exp-bar").style.backgroundColor = "#3498db";
        document.getElementById("exp-text").innerText = `${gameState.exp} / 100`;

        if (imgElem.src !== currentStage.sprite) {
          imgElem.src = currentStage.sprite;
        }

        eggTouchBtn.style.display = "none";
        careBtns.forEach(btn => btn.style.display = "block");
        statsContainer.classList.remove("disabled-area");
        motionGrid.classList.remove("disabled-area");
        rspPanel.classList.remove("disabled-area");

        updateBar("fullness-bar", gameState.fullness);
        updateBar("happiness-bar", gameState.happiness);
        updateBar("cleanliness-bar", gameState.cleanliness);
        updateBar("energy-bar", gameState.energy);
      }

      document.getElementById("status-text").innerText = getStatusText();

      const healBtn = document.getElementById("heal-btn");
      if (gameState.isSick && gameState.isHatched) {
        imgElem.classList.add("sick-filter");
        healBtn.style.display = "block";
      } else {
        imgElem.classList.remove("sick-filter");
        healBtn.style.display = "none";
      }

      saveData();
    }

    function updateBar(id, val) {
      const bar = document.getElementById(id);
      bar.style.width = val + "%";
      bar.style.backgroundColor = getBarColor(val);
    }

    function showSpeech(text) {
      document.getElementById("speech-bubble").innerText = text;
    }

    function triggerMotion(type) {
      if (!gameState.isHatched) return;
      if (gameState.isSick) return showSpeech("아파서 움직일 수가 없어요...");
      if (gameState.energy < 10) return showSpeech("기력이 부족해요!");

      const wrapper = document.getElementById("pokemon-wrapper");
      wrapper.className = "pokemon-wrapper";
      void wrapper.offsetWidth;

      playSound('motion');

      if (type === 'run') {
        wrapper.classList.add("anim-run");
        showSpeech("거실을 신나게 달립니다! 🏃");
        gameState.energy = clamp(gameState.energy - 8);
        gameState.happiness = clamp(gameState.happiness + 10);
        addExp(8);
      } else if (type === 'jump') {
        wrapper.classList.add("anim-jump");
        showSpeech("높이 높이 점프! ⬆️");
        gameState.energy = clamp(gameState.energy - 5);
        gameState.happiness = clamp(gameState.happiness + 8);
        addExp(6);
      } else if (type === 'roll') {
        wrapper.classList.add("anim-roll");
        showSpeech("바닥을 데굴데굴 구릅니다! 🌀");
        gameState.energy = clamp(gameState.energy - 7);
        gameState.happiness = clamp(gameState.happiness + 12);
        addExp(9);
      } else if (type === 'doubleJump') {
        wrapper.classList.add("anim-double-jump");
        showSpeech("멋진 2단점프 회전! 💫");
        gameState.energy = clamp(gameState.energy - 12);
        gameState.happiness = clamp(gameState.happiness + 18);
        addExp(15);
      }

      setTimeout(() => {
        wrapper.className = "pokemon-wrapper";
      }, 1300);

      updateUI();
    }

    function addExp(amount) {
      if (!gameState.isHatched || gameState.isSick) return;

      gameState.exp += amount;
      if (gameState.exp >= 100) {
        gameState.exp -= 100;
        gameState.level++;
        triggerEvolution();
      }
    }

    function triggerEvolution() {
      playSound('levelup');
      const overlay = document.getElementById("evolution-overlay");
      overlay.innerText = "✨ 진화하는 중... ✨";
      overlay.classList.add("active");

      setTimeout(() => {
        overlay.classList.remove("active");
        const tree = POKEMON_TREES[gameState.typeIndex];
        const stageIdx = Math.min(gameState.level - 1, tree.length - 1);
        const newStage = tree[stageIdx];
        showSpeech(`🎉 축하합니다! ${newStage.name}(으)로 진화했습니다!`);
        updateUI();
      }, 1200);
    }

    function feed() {
      if (!gameState.isHatched) return;
      playSound('feed');
      if (gameState.isSick) return showSpeech("아파서 입맛이 없어요.");
      gameState.fullness = clamp(gameState.fullness + 25);
      gameState.happiness = clamp(gameState.happiness + 5);
      showSpeech("밥을 맛있게 먹었어요! 🥣");
      addExp(10);
      updateUI();
    }

    function clean() {
      if (!gameState.isHatched) return;
      playSound('click');
      if (gameState.isSick) return showSpeech("아플 땐 치료부터 해야해요!");
      gameState.cleanliness = clamp(gameState.cleanliness + 35);
      gameState.happiness = clamp(gameState.happiness + 5);

      showSpeech("깨끗하게 목욕을 마쳤어요! 🚿");
      addExp(10);
      updateUI();
    }

    function sleep() {
      if (!gameState.isHatched) return;
      playSound('click');
      if (gameState.isSick) return showSpeech("아파서 편히 잘 수 없어요.");
      gameState.energy = clamp(gameState.energy + 40);
      gameState.fullness = clamp(gameState.fullness - 10);

      showSpeech("소파 옆에서 기력을 회복했습니다! 💤");
      addExp(10);
      updateUI();
    }

    function heal() {
      if (!gameState.isHatched) return;
      playSound('heal');
      if (!gameState.isSick) return;
      gameState.isSick = false;

      gameState.fullness = Math.max(gameState.fullness, 30);
      gameState.happiness = Math.max(gameState.happiness, 30);
      gameState.cleanliness = Math.max(gameState.cleanliness, 30);
      gameState.energy = Math.max(gameState.energy, 30);

      showSpeech("치료를 받아 병이 다 나았습니다! 💊");
      updateUI();
    }

    function playRSP(userChoice) {
      if (!gameState.isHatched) return;
      if (gameState.isSick) return showSpeech("아파서 놀 수 없어요.");
      if (gameState.energy < 10) return showSpeech("기력이 모자라요!");

      const choices = ['가위', '바위', '보'];
      const petChoice = choices[Math.floor(Math.random() * 3)];

      gameState.energy = clamp(gameState.energy - 10);
      gameState.fullness = clamp(gameState.fullness - 5);

      let resultText = `나:${userChoice} vs 펫:${petChoice} 👉 `;

      if (userChoice === petChoice) {
        playSound('click');
        resultText += "비겼습니다!";
        gameState.happiness = clamp(gameState.happiness + 10);
        addExp(5);
      } else if (
        (userChoice === '가위' && petChoice === '보') ||
        (userChoice === '바위' && petChoice === '가위') ||
        (userChoice === '보' && petChoice === '바위')
      ) {
        playSound('win');
        resultText += "이겼습니다! (행복+25, EXP+15)";
        gameState.happiness = clamp(gameState.happiness + 25);
        addExp(15);
      } else {
        playSound('click');
        resultText += "졌어요... (행복+5, EXP+5)";
        gameState.happiness = clamp(gameState.happiness + 5);
        addExp(5);
      }

      showSpeech(resultText);
      updateUI();
    }

    // 타이머 루프 (4초)
    setInterval(() => {
      if (gameState.typeIndex === null) return;

      if (!gameState.isHatched) {
        gameState.hatchProgress = Math.min(100, gameState.hatchProgress + 2);
        if (gameState.hatchProgress >= 100) {
          hatchEgg();
        }
      } else {
        gameState.fullness = clamp(gameState.fullness - 2);
        gameState.happiness = clamp(gameState.happiness - 2);
        gameState.cleanliness = clamp(gameState.cleanliness - 2);
        gameState.energy = clamp(gameState.energy - 2);

        if ((gameState.fullness === 0 || gameState.happiness === 0 || gameState.cleanliness === 0 || gameState.energy === 0) && !gameState.isSick) {
          gameState.isSick = true;
          showSpeech("포켓몬이 병에 걸렸어요! 치료해주세요!");
        }
      }

      updateUI();
    }, 4000);

    // 실행 초기화
    renderSelectOptions();
    loadData();
    updateUI();
  </script>
</body>
</html>
