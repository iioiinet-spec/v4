<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#e7efe9">
<meta name="format-detection" content="telephone=no">
<title>나의 찰떡인 패션 찾기</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<style>
/* =========================================================
   0. 기본 설정
   ========================================================= */
*, *::before, *::after { box-sizing: border-box; }

:root{
  --bg:        #e7efe9;
  --bg-deep:   #d7e6dc;
  --paper:     #fdfbf7;
  --paper-back:#f2ece0;

  --ink:       #2f2822;
  --ink-mid:   #5f5347;
  --ink-soft:  #8a7d70;

  --line:      #ece3d6;
  --line-soft: #f4ede2;

  --rose:      #cf7c8d;
  --rose-deep: #b25f74;
  --rose-tint: #fbeef1;

  --clay:      #6d4b39;
  --clay-deep: #4c3325;

  --radius-lg: 26px;
  --radius-md: 16px;

  --shadow-card:
    0 1px 2px rgba(47,40,34,.05),
    0 14px 30px -12px rgba(47,40,34,.20),
    0 36px 64px -28px rgba(47,40,34,.24);

  --ease: cubic-bezier(.22,.61,.36,1);
}

html, body{ height:100%; margin:0; }

body{
  font-family:"Pretendard Variable", Pretendard, -apple-system,
              BlinkMacSystemFont, "Apple SD Gothic Neo",
              "Noto Sans KR", "Malgun Gothic", sans-serif;
  color:var(--ink);
  background-color:var(--bg);
  background-image:
    radial-gradient(rgba(109,75,57,.13) 1.1px, transparent 1.1px),
    radial-gradient(120% 80% at 50% 0%, rgba(255,255,255,.75), transparent 60%),
    linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
  background-size: 22px 22px, 100% 100%, 100% 100%;
  background-attachment: fixed;

  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
}

button{
  font-family:inherit;
  touch-action:manipulation;
  -webkit-user-select:none;
  user-select:none;
}

/* =========================================================
   1. 앱 / 화면 전환
   ========================================================= */
.app{
  position:relative;
  width:100%;
  height:100vh;
  height:100dvh;           /* 모바일 주소창 대응 */
  overflow:hidden;
}

.screen{
  position:absolute;
  inset:0;

  display:flex;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;

  padding:
    calc(env(safe-area-inset-top) + 24px)
    calc(env(safe-area-inset-right) + 18px)
    calc(env(safe-area-inset-bottom) + 28px)
    calc(env(safe-area-inset-left) + 18px);

  opacity:0;
  visibility:hidden;
  transform:translateY(14px) scale(.985);
  transition:
    opacity .4s var(--ease),
    transform .4s var(--ease),
    visibility .4s var(--ease);
}

.screen.active{
  opacity:1;
  visibility:visible;
  transform:none;
}

/* =========================================================
   2. 카드(종이)
   ========================================================= */
.sheet{
  position:relative;
  width:min(100%, 540px);
  margin:auto;              /* 내용이 길어도 잘리지 않는 중앙 정렬 */
}

/* 뒤에 겹친 종이 */
.sheet::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:0;

  background:var(--paper-back);
  border-radius:var(--radius-lg);
  transform:rotate(-1.6deg);
  box-shadow:0 20px 44px -22px rgba(47,40,34,.45);
}

.card{
  position:relative;
  z-index:1;

  padding:34px 26px 30px;

  background:var(--paper);
  border:1px solid rgba(109,75,57,.10);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-card);
  overflow:hidden;
}

/* 상단 포인트 라인 */
.card::before{
  content:"";
  position:absolute;
  top:0; left:0; right:0;
  height:3px;
  background:linear-gradient(90deg, var(--rose) 0%, #e0a48f 55%, #d9c39a 100%);
}

/* =========================================================
   3. 공통 텍스트
   ========================================================= */
.kicker{
  display:flex;
  align-items:center;
  gap:8px;

  color:var(--rose-deep);
  font-size:11px;
  font-weight:700;
  letter-spacing:.22em;
  text-transform:uppercase;
}

.kicker::before{
  content:"";
  width:16px; height:1.5px;
  background:currentColor;
  border-radius:2px;
}

.kicker.center{ justify-content:center; }

/* =========================================================
   4. 시작 화면
   ========================================================= */
.start{ text-align:center; }

.start .kicker{ justify-content:center; margin-bottom:20px; }

.start h1{
  margin:0 0 16px;
  color:var(--ink);
  font-size:clamp(30px, 8.4vw, 44px);
  font-weight:800;
  line-height:1.24;
  letter-spacing:-.035em;
}

.start h1 .accent{
  position:relative;
  color:var(--rose-deep);
  white-space:nowrap;
}

.start h1 .accent::after{
  content:"";
  position:absolute;
  left:-2px; right:-2px; bottom:.08em;
  height:.3em;
  background:var(--rose-tint);
  border-radius:3px;
  z-index:-1;
}

.lead{
  margin:0 auto 26px;
  max-width:22em;
  color:var(--ink-soft);
  font-size:15px;
  font-weight:500;
  line-height:1.75;
  word-break:keep-all;
}

.meta-row{
  display:flex;
  justify-content:center;
  align-items:stretch;
  gap:0;
  margin:0 auto 28px;
  padding:14px 6px;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}

.meta{
  flex:1;
  text-align:center;
}

.meta + .meta{ border-left:1px solid var(--line); }

.meta b{
  display:block;
  color:var(--ink);
  font-size:17px;
  font-weight:800;
  letter-spacing:-.01em;
}

.meta span{
  display:block;
  margin-top:3px;
  color:var(--ink-soft);
  font-size:11.5px;
  font-weight:600;
  letter-spacing:.02em;
}

/* =========================================================
   5. 버튼
   ========================================================= */
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;

  width:100%;
  min-height:54px;
  padding:16px 26px;

  border:0;
  border-radius:999px;

  background:linear-gradient(180deg, #7a5541 0%, var(--clay) 100%);
  color:#fff;

  font-size:16px;
  font-weight:700;
  letter-spacing:-.01em;

  cursor:pointer;
  box-shadow:
    0 1px 0 rgba(255,255,255,.18) inset,
    0 10px 22px -10px rgba(76,51,37,.75);

  transition:transform .18s var(--ease), box-shadow .18s var(--ease), filter .18s var(--ease);
}

.btn:active{
  transform:translateY(2px) scale(.99);
  box-shadow:0 4px 12px -8px rgba(76,51,37,.7);
}

.btn.ghost{
  background:transparent;
  color:var(--clay);
  border:1.5px solid var(--line);
  box-shadow:none;
}

.btn.ghost:active{ background:var(--line-soft); }

.btn-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

@media (hover:hover){
  .btn:hover{ filter:brightness(1.06); transform:translateY(-2px); }
  .btn.ghost:hover{ border-color:var(--rose); color:var(--rose-deep); }
}

/* =========================================================
   6. 질문 화면
   ========================================================= */
.q-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

.back-btn{
  display:inline-flex;
  align-items:center;
  gap:5px;

  min-height:34px;
  padding:6px 12px 6px 9px;

  border:1px solid var(--line);
  border-radius:999px;
  background:#fff;
  color:var(--ink-mid);

  font-size:12.5px;
  font-weight:700;
  cursor:pointer;
  transition:opacity .2s var(--ease), border-color .2s var(--ease);
}

.back-btn:disabled{ opacity:.35; cursor:default; }
.back-btn:not(:disabled):active{ border-color:var(--rose); color:var(--rose-deep); }

.counter{
  color:var(--ink-soft);
  font-size:12.5px;
  font-weight:700;
  letter-spacing:.04em;
  font-variant-numeric:tabular-nums;
}

.counter b{
  color:var(--rose-deep);
  font-size:15px;
  font-weight:800;
}

.track{
  position:relative;
  width:100%;
  height:6px;
  margin-bottom:26px;
  border-radius:999px;
  background:#ece5db;
  overflow:hidden;
}

.bar{
  width:0%;
  height:100%;
  border-radius:inherit;
  background:linear-gradient(90deg, #e0a48f, var(--rose));
  transition:width .45s var(--ease);
}

.q-body{
  animation:qin .38s var(--ease) both;
}

@keyframes qin{
  from{ opacity:0; transform:translateY(10px); }
  to  { opacity:1; transform:none; }
}

.q-title{
  min-height:2.5em;
  margin:11px 0 20px;
  color:var(--ink);
  font-size:clamp(19px, 5.2vw, 23px);
  font-weight:800;
  line-height:1.5;
  letter-spacing:-.03em;
  word-break:keep-all;
}

.answers{
  display:grid;
  gap:11px;
}

.answer{
  display:flex;
  align-items:center;
  gap:13px;

  width:100%;
  min-height:64px;
  padding:15px 16px;

  border:1.5px solid var(--line);
  border-radius:var(--radius-md);
  background:#fff;
  color:var(--ink);

  font-size:15px;
  font-weight:600;
  line-height:1.5;
  letter-spacing:-.02em;
  text-align:left;
  word-break:keep-all;

  cursor:pointer;
  transition:
    border-color .2s var(--ease),
    background .2s var(--ease),
    transform .16s var(--ease),
    box-shadow .2s var(--ease);
}

.badge{
  flex:0 0 auto;
  display:grid;
  place-items:center;

  width:30px; height:30px;

  border-radius:50%;
  background:var(--line-soft);
  color:var(--ink-mid);

  font-size:13px;
  font-weight:800;
  letter-spacing:0;

  transition:background .2s var(--ease), color .2s var(--ease), transform .2s var(--ease);
}

.answer:active{ transform:scale(.985); }

.answer.picked{
  border-color:var(--rose);
  background:var(--rose-tint);
  box-shadow:0 8px 20px -12px rgba(178,95,116,.85);
}

.answer.picked .badge{
  background:var(--rose);
  color:#fff;
  transform:scale(1.06);
}

@media (hover:hover){
  .answer:hover{
    border-color:var(--rose);
    background:var(--rose-tint);
    transform:translateY(-2px);
    box-shadow:0 10px 22px -14px rgba(178,95,116,.8);
  }
  .answer:hover .badge{ background:var(--rose); color:#fff; }
}

.hint{
  margin:16px 0 0;
  color:var(--ink-soft);
  font-size:11.5px;
  font-weight:600;
  text-align:center;
  letter-spacing:.01em;
}

/* =========================================================
   7. 결과 화면
   ========================================================= */
.result{ text-align:center; }

.emoji-wrap{
  display:grid;
  place-items:center;
  width:92px; height:92px;
  margin:6px auto 18px;

  border-radius:50%;
  background:radial-gradient(circle at 32% 28%, #fff, var(--rose-tint) 72%);
  box-shadow:
    0 1px 0 rgba(255,255,255,.9) inset,
    0 14px 28px -14px rgba(178,95,116,.6);

  font-size:46px;
  line-height:1;
  animation:pop .5s var(--ease) both;
}

@keyframes pop{
  from{ opacity:0; transform:scale(.72); }
  to  { opacity:1; transform:none; }
}

.r-name{
  margin:0 0 12px;
  color:var(--ink);
  font-size:clamp(25px, 7vw, 34px);
  font-weight:800;
  line-height:1.28;
  letter-spacing:-.035em;
  word-break:keep-all;
}

.r-name .num{
  display:block;
  margin-bottom:6px;
  color:var(--rose-deep);
  font-size:13px;
  font-weight:800;
  letter-spacing:.16em;
}

.tags{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:6px;
  margin-bottom:18px;
}

.tag{
  padding:6px 13px;
  border-radius:999px;
  background:var(--rose-tint);
  color:var(--rose-deep);
  font-size:12.5px;
  font-weight:700;
  letter-spacing:-.01em;
}

.r-desc{
  margin:0 auto 22px;
  max-width:26em;
  color:var(--ink-mid);
  font-size:14.5px;
  font-weight:500;
  line-height:1.8;
  letter-spacing:-.01em;
  word-break:keep-all;
}

.ratio{
  margin:0 0 24px;
  padding:16px 16px 14px;
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  background:#fffdf9;
}

.ratio-head{
  display:flex;
  justify-content:space-between;
  margin-bottom:9px;
  font-size:12px;
  font-weight:700;
  letter-spacing:-.01em;
}

.ratio-head .a{ color:var(--clay); }
.ratio-head .b{ color:var(--rose-deep); }

.ratio-track{
  display:flex;
  height:9px;
  border-radius:999px;
  overflow:hidden;
  background:#efe8dd;
}

.ratio-a{
  background:linear-gradient(90deg, #8a6349, var(--clay));
  transition:width .7s var(--ease);
}

.ratio-b{
  flex:1;
  background:linear-gradient(90deg, var(--rose), #e0a48f);
}

/* 전체 유형 보기 */
.types{
  margin:22px 0 0;
  border-top:1px solid var(--line);
  padding-top:16px;
  text-align:left;
}

.types summary{
  list-style:none;
  cursor:pointer;

  display:flex;
  align-items:center;
  justify-content:space-between;

  color:var(--ink-mid);
  font-size:13px;
  font-weight:700;
  letter-spacing:-.01em;
}

.types summary::-webkit-details-marker{ display:none; }

.types summary::after{
  content:"+";
  color:var(--rose-deep);
  font-size:17px;
  font-weight:700;
  line-height:1;
}

.types[open] summary::after{ content:"−"; }

.type-list{
  margin:14px 0 0;
  padding:0;
  list-style:none;
  display:grid;
  gap:8px;
}

.type-list li{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 12px;
  border-radius:12px;
  background:#faf6ef;
  color:var(--ink-mid);
  font-size:12.5px;
  font-weight:600;
  letter-spacing:-.01em;
}

.type-list li.on{
  background:var(--rose-tint);
  color:var(--rose-deep);
  font-weight:800;
}

.type-list .ico{ font-size:16px; line-height:1; }

/* =========================================================
   8. 토스트
   ========================================================= */
.toast{
  position:fixed;
  left:50%;
  bottom:calc(env(safe-area-inset-bottom) + 26px);
  z-index:50;

  padding:11px 20px;

  border-radius:999px;
  background:rgba(47,40,34,.92);
  color:#fff;

  font-size:13px;
  font-weight:600;
  white-space:nowrap;

  opacity:0;
  transform:translate(-50%, 12px);
  pointer-events:none;
  transition:opacity .3s var(--ease), transform .3s var(--ease);
}

.toast.show{
  opacity:1;
  transform:translate(-50%, 0);
}

/* =========================================================
   9. 화면 크기 대응
   ========================================================= */
@media (max-width:400px){
  .card{ padding:28px 20px 26px; }
  .sheet::before{ transform:rotate(-1.2deg); }
  .answer{ font-size:14.5px; min-height:60px; padding:14px; gap:11px; }
  .badge{ width:27px; height:27px; font-size:12px; }
  .emoji-wrap{ width:80px; height:80px; font-size:40px; }
}

@media (min-width:600px){
  .card{ padding:44px 40px 38px; }
  .lead{ font-size:16px; }
  .answer{ font-size:16px; padding:17px 18px; }
}

/* 가로 모드 등 세로 공간이 좁을 때 */
@media (max-height:620px){
  .screen{ align-items:flex-start; }
  .q-title{ min-height:0; margin:10px 0 16px; }
  .emoji-wrap{ width:70px; height:70px; font-size:36px; margin-bottom:14px; }
}

@media (prefers-reduced-motion:reduce){
  *{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
}
</style>
</head>

<body>

<main class="app">

  <!-- ================= 시작 화면 ================= -->
  <section class="screen active" id="startScreen">
    <div class="sheet">
      <div class="card">
        <div class="start">
          <p class="kicker">Style Finder</p>

          <h1>나의 찰떡인<br><span class="accent">패션 찾기</span></h1>

          <p class="lead">
            15개의 질문으로 알아보는<br>
            나에게 가장 잘 어울리는 패션 스타일
          </p>

          <div class="meta-row">
            <div class="meta"><b>15</b><span>문항</span></div>
            <div class="meta"><b>1분</b><span>소요 시간</span></div>
            <div class="meta"><b>6</b><span>유형</span></div>
          </div>

          <button class="btn" id="startButton">테스트 시작하기</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ================= 질문 화면 ================= -->
  <section class="screen" id="questionScreen">
    <div class="sheet">
      <div class="card">

        <div class="q-top">
          <button class="back-btn" id="backButton" type="button">← 이전</button>
          <span class="counter" id="counter"><b>01</b> / 15</span>
        </div>

        <div class="track"><div class="bar" id="progressBar"></div></div>

        <div class="q-body" id="qBody">
          <p class="kicker">Question</p>
          <h2 class="q-title" id="questionText"></h2>

          <div class="answers">
            <button class="answer" id="answerA" type="button">
              <span class="badge">A</span>
              <span class="answer-text" id="answerAText"></span>
            </button>

            <button class="answer" id="answerB" type="button">
              <span class="badge">B</span>
              <span class="answer-text" id="answerBText"></span>
            </button>
          </div>
        </div>

        <p class="hint">더 끌리는 쪽을 직감으로 선택해 주세요</p>

      </div>
    </div>
  </section>

  <!-- ================= 결과 화면 ================= -->
  <section class="screen" id="resultScreen">
    <div class="sheet">
      <div class="card">
        <div class="result">

          <p class="kicker center">Your Result</p>

          <div class="emoji-wrap" id="resultEmoji">👗</div>

          <h2 class="r-name">
            <span class="num" id="resultNum"></span>
            <span id="resultName"></span>
          </h2>

          <div class="tags" id="resultTags"></div>

          <p class="r-desc" id="resultDescription"></p>

          <div class="ratio">
            <div class="ratio-head">
              <span class="a" id="ratioA">A 0</span>
              <span class="b" id="ratioB">B 0</span>
            </div>
            <div class="ratio-track">
              <div class="ratio-a" id="ratioBarA" style="width:50%"></div>
              <div class="ratio-b"></div>
            </div>
          </div>

          <div class="btn-row">
            <button class="btn ghost" id="shareButton" type="button">결과 공유</button>
            <button class="btn" id="restartButton" type="button">다시 하기</button>
          </div>

          <details class="types">
            <summary>6가지 유형 전체 보기</summary>
            <ul class="type-list" id="typeList"></ul>
          </details>

        </div>
      </div>
    </div>
  </section>

</main>

<div class="toast" id="toast"></div>


<!-- ================= 데이터(JSON) ================= -->
<script type="application/json" id="quizData">
{
  "questions": [
    { "q": "평소 옷을 고를 때 더 중요한 것은?", "a": "편하고 활동하기 좋은 옷", "b": "조금 불편해도 예뻐 보이는 옷" },
    { "q": "가장 자주 손이 가는 색은?", "a": "블랙·화이트·그레이 같은 무채색", "b": "포인트가 되는 컬러" },
    { "q": "상의를 고른다면?", "a": "깔끔하게 떨어지는 기본 티셔츠", "b": "디자인이나 디테일이 있는 상의" },

<script>
(function () {
  "use strict";

  var DATA      = JSON.parse(document.getElementById("quizData").textContent);
  var QUESTIONS = DATA.questions;
  var RESULTS   = DATA.results;
  var LABELS    = DATA.labels;
  var TOTAL     = QUESTIONS.length;

  var el = function (id) { return document.getElementById(id); };

  var screens = {
    start:    el("startScreen"),
    question: el("questionScreen"),
    result:   el("resultScreen")
  };

  var qBody       = el("qBody");
  var counter     = el("counter");
  var progressBar = el("progressBar");
  var questionText= el("questionText");
  var answerA     = el("answerA");
  var answerB     = el("answerB");
  var answerAText = el("answerAText");
  var answerBText = el("answerBText");
  var backButton  = el("backButton");
  var toast       = el("toast");

  var index   = 0;
  var history = [];   // "A" / "B" 기록 → 이전 버튼 지원
  var locked  = false;

  /* ---------- 화면 전환 ---------- */
  function showScreen(name) {
    Object.keys(screens).forEach(function (key) {
      screens[key].classList.toggle("active", key === name);
    });
    screens[name].scrollTop = 0;
  }

  /* ---------- 숫자 두 자리 ---------- */
  function pad(n) { return n < 10 ? "0" + n : String(n); }

  /* ---------- 질문 렌더링 ---------- */
  function renderQuestion(animate) {
    var item = QUESTIONS[index];

    questionText.textContent = item.q;
    answerAText.textContent  = item.a;
    answerBText.textContent  = item.b;

    counter.innerHTML = "";
    var strong = document.createElement("b");
    strong.textContent = pad(index + 1);
    counter.appendChild(strong);
    counter.appendChild(document.createTextNode(" / " + TOTAL));

    progressBar.style.width = (index / TOTAL) * 100 + "%";

    backButton.disabled = (index === 0);

    answerA.classList.remove("picked");
    answerB.classList.remove("picked");

    if (animate !== false) {
      qBody.style.animation = "none";
      void qBody.offsetWidth;          // 리플로우 강제 → 애니메이션 재실행
      qBody.style.animation = "";
    }
  }

  /* ---------- 답변 선택 ---------- */
  function selectAnswer(choice) {
    if (locked) { return; }
    locked = true;

    (choice === "A" ? answerA : answerB).classList.add("picked");

    if (navigator.vibrate) { navigator.vibrate(12); }

    history.push(choice);

    setTimeout(function () {
      index++;

      if (index < TOTAL) {
        renderQuestion(true);
        locked = false;
      } else {
        progressBar.style.width = "100%";
        setTimeout(function () {
          showResult();
          locked = false;
        }, 420);
      }
    }, 220);
  }

  /* ---------- 이전 문항 ---------- */
  function goBack() {
    if (locked || index === 0) { return; }
    index--;
    history.pop();
    renderQuestion(true);
  }

  /* ---------- 결과 계산 ---------- */
  function countA() {
    return history.filter(function (v) { return v === "A"; }).length;
  }

  function findResult(score) {
    for (var i = 0; i < RESULTS.length; i++) {
      if (score >= RESULTS[i].min && score <= RESULTS[i].max) { return RESULTS[i]; }
    }
    return RESULTS[RESULTS.length - 1];
  }

  var currentResult = null;

  /* ---------- 결과 표시 ---------- */
  function showResult() {
    var a = countA();
    var b = TOTAL - a;
    var r = findResult(a);
    currentResult = r;

    el("resultEmoji").textContent      = r.emoji;
    el("resultNum").textContent        = r.num;
    el("resultName").textContent       = r.name;
    el("resultDescription").textContent= r.desc;

    var tags = el("resultTags");
    tags.textContent = "";
    r.tags.forEach(function (t) {
      var span = document.createElement("span");
      span.className = "tag";
      span.textContent = t;
      tags.appendChild(span);
    });

    el("ratioA").textContent = "A " + a + "개";
    el("ratioB").textContent = "B " + b + "개";
    el("ratioBarA").style.width = (a / TOTAL) * 100 + "%";

    var list = el("typeList");
    list.textContent = "";
    RESULTS.forEach(function (item) {
      var li = document.createElement("li");
      if (item.name === r.name) { li.className = "on"; }

      var ico = document.createElement("span");
      ico.className = "ico";
      ico.textContent = item.emoji;

      var txt = document.createElement("span");
      txt.textContent = item.name + " · " + item.tags.join(", ");

      li.appendChild(ico);
      li.appendChild(txt);
      list.appendChild(li);
    });

    showScreen("result");
  }

  /* ---------- 토스트 ---------- */
  var toastTimer = null;
  function showToast(message) {
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toast.classList.remove("show");
    }, 1900);
  }

  /* ---------- 공유 ---------- */
  function shareResult() {
    if (!currentResult) { return; }

    var text = LABELS.shareLead + " " + currentResult.emoji + " " +
               currentResult.name + "!\n" + LABELS.shareTitle;

    if (navigator.share) {
      navigator.share({ title: LABELS.shareTitle, text: text }).catch(function () {});
      return;
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        showToast(LABELS.copied);
      }).catch(function () {
        showToast(LABELS.copyFail);
      });
      return;
    }

    showToast(LABELS.copyFail);
  }

  /* ---------- 초기화 ---------- */
  function resetQuiz() {
    index = 0;
    history = [];
    locked = false;
    progressBar.style.width = "0%";
  }

  /* ---------- 이벤트 ---------- */
  el("startButton").addEventListener("click", function () {
    resetQuiz();
    renderQuestion(false);
    showScreen("question");
  });

  answerA.addEventListener("click", function () { selectAnswer("A"); });
  answerB.addEventListener("click", function () { selectAnswer("B"); });
  backButton.addEventListener("click", goBack);
  el("shareButton").addEventListener("click", shareResult);

  el("restartButton").addEventListener("click", function () {
    resetQuiz();
    showScreen("start");
  });

  /* 키보드 지원 (A / B / 1 / 2 / ← ) */
  document.addEventListener("keydown", function (e) {
    if (!screens.question.classList.contains("active")) { return; }

    var key = e.key.toLowerCase();
    if (key === "a" || key === "1") { selectAnswer("A"); }
    else if (key === "b" || key === "2") { selectAnswer("B"); }
    else if (key === "backspace") { e.preventDefault(); goBack(); }
  });

  /* 첫 문항 미리 렌더링 */
  renderQuestion(false);
})();
</script>
