<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#f7f2e8">

  <title>🌏 당신이 살고 싶은 도시는?</title>

  <style>
    /* =========================================================
       기본 설정
    ========================================================= */

    :root {
      --bg: #f7f2e8;
      --bg-soft: #eee8dc;
      --text: #111827;
      --muted: #697386;
      --white: #ffffff;
      --border: #e8e2d8;

      --accent: #4054d8;

      --shadow:
        0 10px 35px rgba(25, 32, 45, 0.07);

      --radius: 24px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      width: 100%;
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100dvh;

      background:
        radial-gradient(
          circle at 10% 10%,
          rgba(255,255,255,0.8),
          transparent 28%
        ),
        radial-gradient(
          circle at 90% 85%,
          rgba(255,255,255,0.7),
          transparent 30%
        ),
        var(--bg);

      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        "Apple SD Gothic Neo",
        "Malgun Gothic",
        sans-serif;

      -webkit-font-smoothing: antialiased;
    }

    button {
      font: inherit;
    }

    button,
    a {
      -webkit-user-select: none;
      user-select: none;
    }


    /* =========================================================
       앱
    ========================================================= */

    .app {
      width: 100%;
      min-height: 100dvh;

      display: flex;
      justify-content: center;
    }

    .app-shell {
      position: relative;

      width: 100%;
      max-width: 760px;
      min-height: 100dvh;

      padding:
        max(20px, env(safe-area-inset-top))
        20px
        max(24px, env(safe-area-inset-bottom))
        20px;

      display: flex;
      align-items: center;
      justify-content: center;
    }


    /* =========================================================
       화면
    ========================================================= */

    .screen {
      display: none;

      width: 100%;

      animation: screenIn 0.38s ease both;
    }

    .screen.active {
      display: block;
    }

    @keyframes screenIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }


    /* =========================================================
       공통 카드
    ========================================================= */

    .main-card {
      width: 100%;

      padding: clamp(28px, 6vw, 54px);

      background: rgba(255,255,255,0.88);

      border: 1px solid rgba(255,255,255,0.95);

      border-radius: var(--radius);

      box-shadow: var(--shadow);

      backdrop-filter: blur(8px);
    }


    /* =========================================================
       시작 화면
    ========================================================= */

    .start-card {
      min-height: 620px;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      text-align: center;
    }

    .start-globe {
      width: 86px;
      height: 86px;

      margin-bottom: 28px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: #edf0ff;

      font-size: 48px;

      box-shadow:
        0 12px 30px rgba(64,84,216,0.12);
    }

    .eyebrow {
      margin-bottom: 14px;

      color: var(--accent);

      font-size: 12px;
      font-weight: 900;

      letter-spacing: 2px;
    }

    .start-title {
      margin: 0;

      color: var(--text);

      font-size: clamp(34px, 8vw, 58px);

      line-height: 1.12;

      letter-spacing: -3px;

      font-weight: 900;
    }

    .start-title .highlight {
      display: block;

      margin-top: 8px;

      color: var(--accent);
    }

    .start-subtitle {
      max-width: 430px;

      margin: 25px 0 38px;

      color: var(--muted);

      font-size: 16px;

      line-height: 1.75;

      font-weight: 500;

      word-break: keep-all;
    }

    .start-meta {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 8px;

      margin-bottom: 20px;

      color: #8a909d;

      font-size: 13px;
      font-weight: 700;
    }

    .start-meta-dot {
      width: 4px;
      height: 4px;

      border-radius: 50%;

      background: #b9bec8;
    }


    /* =========================================================
       메인 버튼
    ========================================================= */

    .primary-button {
      width: 100%;
      max-width: 340px;

      min-height: 58px;

      padding: 15px 24px;

      border: 0;
      border-radius: 16px;

      background: var(--accent);

      color: white;

      font-size: 16px;
      font-weight: 900;

      cursor: pointer;

      box-shadow:
        0 8px 20px color-mix(
          in srgb,
          var(--accent) 25%,
          transparent
        );

      transition:
        transform 0.18s ease,
        filter 0.18s ease;
    }

    .primary-button:hover {
      filter: brightness(1.06);

      transform: translateY(-2px);
    }

    .primary-button:active {
      transform: scale(0.97);
    }


    /* =========================================================
       질문 화면
    ========================================================= */

    .question-card {
      padding:
        clamp(22px, 5vw, 42px);
    }

    .progress-header {
      display: flex;

      align-items: center;
      justify-content: space-between;

      margin-bottom: 11px;
    }

    .progress-number {
      color: var(--text);

      font-size: 14px;
      font-weight: 900;
    }

    .progress-percent {
      color: var(--muted);

      font-size: 13px;
      font-weight: 800;
    }

    .progress-track {
      width: 100%;
      height: 8px;

      overflow: hidden;

      border-radius: 999px;

      background: #e9e5dc;
    }

    .progress-bar {
      width: 0;
      height: 100%;

      border-radius: inherit;

      background: var(--accent);

      transition:
        width 0.4s ease;

      box-shadow:
        0 0 15px color-mix(
          in srgb,
          var(--accent) 35%,
          transparent
        );
    }

    .question-category {
      margin-top: 40px;
      margin-bottom: 12px;

      color: var(--accent);

      font-size: 12px;
      font-weight: 900;

      letter-spacing: 2px;
    }

    .question-title {
      margin: 0 0 34px;

      color: var(--text);

      font-size: clamp(25px, 6vw, 36px);

      line-height: 1.42;

      letter-spacing: -1.5px;

      font-weight: 900;

      word-break: keep-all;
    }

    .answer-list {
      display: grid;
      gap: 13px;
    }

    .answer-card {
      position: relative;

      width: 100%;
      min-height: 88px;

      padding: 19px 20px;

      display: flex;
      align-items: center;

      border: 1px solid var(--border);
      border-radius: 18px;

      background: #ffffff;

      color: var(--text);

      text-align: left;

      cursor: pointer;

      box-shadow:
        0 4px 15px rgba(20, 30, 45, 0.035);

      transition:
        transform 0.18s ease,
        border-color 0.18s ease,
        box-shadow 0.18s ease,
        background 0.18s ease;
    }

    .answer-card:hover {
      transform: translateY(-2px);

      border-color: var(--accent);

      box-shadow:
        0 9px 25px rgba(20,30,45,0.08);
    }

    .answer-card:active {
      transform: scale(0.975);
    }

    .answer-card.selected {
      border-color: var(--accent);

      background:
        color-mix(
          in srgb,
          var(--accent) 7%,
          white
        );

      animation: answerClick 0.3s ease;
    }

    @keyframes answerClick {
      0% {
        transform: scale(1);
      }

      45% {
        transform: scale(0.97);
      }

      100% {
        transform: scale(1);
      }
    }

    .answer-letter {
      flex: 0 0 auto;

      width: 38px;
      height: 38px;

      margin-right: 15px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: #f1f2f5;

      color: #626978;

      font-size: 13px;
      font-weight: 900;

      transition:
        background 0.2s ease,
        color 0.2s ease;
    }

    .answer-card.selected .answer-letter {
      background: var(--accent);

      color: white;
    }

    .answer-text {
      color: #222936;

      font-size: 16px;

      line-height: 1.5;

      font-weight: 700;

      word-break: keep-all;
    }

    .answer-arrow {
      margin-left: auto;
      padding-left: 12px;

      color: #b1b6c0;

      font-size: 20px;

      transition:
        transform 0.2s ease,
        color 0.2s ease;
    }

    .answer-card:hover .answer-arrow {
      color: var(--accent);

      transform: translateX(3px);
    }


    /* =========================================================
       결과 화면
    ========================================================= */

    .result-card {
      overflow: hidden;

      padding: 0;
    }

    .result-hero {
      position: relative;

      padding:
        46px
        clamp(24px, 6vw, 54px)
        38px;

      background:
        linear-gradient(
          145deg,
          var(--result-color),
          color-mix(
            in srgb,
            var(--result-color) 72%,
            #ffffff
          )
        );

      color: white;

      text-align: center;
    }

    .result-hero::before {
      content: "";

      position: absolute;

      width: 220px;
      height: 220px;

      right: -80px;
      top: -100px;

      border-radius: 50%;

      background: rgba(255,255,255,0.13);
    }

    .result-hero::after {
      content: "";

      position: absolute;

      width: 150px;
      height: 150px;

      left: -75px;
      bottom: -90px;

      border-radius: 50%;

      background: rgba(255,255,255,0.10);
    }

    .result-small-title {
      position: relative;
      z-index: 1;

      margin-bottom: 26px;

      font-size: 14px;
      font-weight: 800;

      letter-spacing: 1px;

      opacity: 0.9;
    }

    .result-emoji {
      position: relative;
      z-index: 1;

      margin-bottom: 8px;

      font-size: 67px;

      line-height: 1;

      filter:
        drop-shadow(
          0 7px 10px rgba(0,0,0,0.12)
        );
    }

    .result-city {
      position: relative;
      z-index: 1;

      margin: 0;

      color: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: clamp(39px, 11vw, 70px);

      line-height: 1;

      letter-spacing: 1px;

      font-weight: 950;
    }

    .result-subtitle {
      position: relative;
      z-index: 1;

      margin: 20px auto 0;

      max-width: 480px;

      font-size: 15px;

      line-height: 1.6;

      font-weight: 700;

      word-break: keep-all;
    }


    /* =========================================================
       결과 본문
    ========================================================= */

    .result-body {
      padding:
        30px
        clamp(22px, 6vw, 54px)
        35px;
    }

    .result-description {
      margin: 0 0 28px;

      color: #3f4755;

      font-size: 15px;

      line-height: 1.8;

      font-weight: 600;

      word-break: keep-all;
    }

    .result-section {
      margin-top: 25px;
    }

    .section-label {
      margin-bottom: 11px;

      color: var(--result-color);

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 12px;

      font-weight: 900;

      letter-spacing: 1.5px;
    }

    .keyword-list {
      display: flex;

      flex-wrap: wrap;

      gap: 7px;
    }

    .keyword {
      padding: 8px 12px;

      border-radius: 999px;

      background:
        color-mix(
          in srgb,
          var(--result-color) 9%,
          white
        );

      color: var(--result-color);

      font-size: 13px;

      font-weight: 800;
    }

    .life-text {
      margin: 0;

      color: #505867;

      font-size: 14px;

      line-height: 1.75;

      font-weight: 600;

      word-break: keep-all;
    }

    .day-card {
      padding: 17px;

      border-radius: 16px;

      background: #f8f6f1;

      color: #4a5260;

      font-size: 14px;

      line-height: 1.75;

      font-weight: 600;

      word-break: keep-all;
    }

    .one-line {
      margin: 28px 0 0;

      padding: 18px 17px;

      border-left:
        4px solid var(--result-color);

      background: #faf8f4;

      color: #252b35;

      font-size: 15px;

      line-height: 1.6;

      font-weight: 900;

      word-break: keep-all;
    }


    /* =========================================================
       결과 버튼
    ========================================================= */

    .result-actions {
      display: grid;

      gap: 10px;

      margin-top: 30px;
    }

    .secondary-button {
      width: 100%;

      min-height: 54px;

      padding: 13px 20px;

      border:
        1px solid var(--border);

      border-radius: 15px;

      background: white;

      color: #343b48;

      font-size: 15px;

      font-weight: 900;

      cursor: pointer;

      transition:
        transform 0.18s ease,
        background 0.18s ease,
        border-color 0.18s ease;
    }

    .secondary-button:hover {
      background: #f8f7f4;

      border-color: #cfd3da;

      transform: translateY(-1px);
    }

    .secondary-button:active {
      transform: scale(0.98);
    }

    .share-button {
      background: var(--result-color);

      border-color: var(--result-color);

      color: white;
    }

    .share-button:hover {
      background: var(--result-color);

      filter: brightness(1.05);
    }


    /* =========================================================
       작은 공유 알림
    ========================================================= */

    .toast {
      position: fixed;

      left: 50%;
      bottom: 25px;

      z-index: 100;

      min-width: 220px;

      padding: 13px 17px;

      border-radius: 12px;

      background: #111827;

      color: white;

      text-align: center;

      font-size: 13px;
      font-weight: 800;

      box-shadow:
        0 10px 30px rgba(0,0,0,0.18);

      transform:
        translate(-50%, 20px);

      opacity: 0;
      visibility: hidden;

      transition:
        opacity 0.25s ease,
        transform 0.25s ease,
        visibility 0.25s ease;
    }

    .toast.show {
      opacity: 1;
      visibility: visible;

      transform:
        translate(-50%, 0);
    }


    /* =========================================================
       모바일
    ========================================================= */

    @media (max-width: 600px) {

      .app-shell {
        padding:
          max(12px, env(safe-area-inset-top))
          12px
          max(18px, env(safe-area-inset-bottom))
          12px;
      }

      .main-card {
        border-radius: 21px;
      }

      .start-card {
        min-height: 590px;

        padding: 30px 22px;
      }

      .start-globe {
        width: 74px;
        height: 74px;

        font-size: 41px;
      }

      .start-title {
        font-size: 37px;

        letter-spacing: -2.5px;
      }

      .start-subtitle {
        font-size: 14px;
      }

      .question-card {
        padding: 22px 18px;
      }

      .question-category {
        margin-top: 30px;
      }

      .question-title {
        font-size: 24px;

        margin-bottom: 26px;
      }

      .answer-card {
        min-height: 82px;

        padding: 16px;
      }

      .answer-text {
        font-size: 15px;
      }

      .result-hero {
        padding:
          37px
          20px
          32px;
      }

      .result-emoji {
        font-size: 57px;
      }

      .result-city {
        font-size: 44px;
      }

      .result-body {
        padding:
          25px
          19px
          27px;
      }
    }


    /* =========================================================
       모션 감소 설정
    ========================================================= */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;

        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>


<body>

  <div class="app">

    <div class="app-shell">


      <!-- =====================================================
           시작 화면
      ===================================================== -->

      <section
        class="screen active"
        id="startScreen"
      >

        <div class="main-card start-card">

          <div class="start-globe">
            🌏
          </div>

          <div class="eyebrow">
            CITY PERSONALITY TEST
          </div>

          <h1 class="start-title">
            당신이 살고 싶은
            <span class="highlight">
              도시는?
            </span>
          </h1>

          <p class="start-subtitle">
            당신의 선택으로 알아보는<br>
            나와 가장 잘 맞는 도시
          </p>

          <div class="start-meta">
            <span>총 15문제</span>
            <span class="start-meta-dot"></span>
            <span>약 2분</span>
          </div>

          <button
            class="primary-button"
            id="startButton"
          >
            테스트 시작하기
          </button>

        </div>

      </section>


      <!-- =====================================================
           질문 화면
      ===================================================== -->

      <section
        class="screen"
        id="questionScreen"
      >

        <div class="main-card question-card">

          <div class="progress-header">

            <span
              class="progress-number"
              id="progressNumber"
            >
              1 / 15
            </span>

            <span
              class="progress-percent"
              id="progressPercent"
            >
              0%
            </span>

          </div>

          <div class="progress-track">

            <div
              class="progress-bar"
              id="progressBar"
            ></div>

          </div>


          <div class="question-category">
            QUESTION
          </div>

          <h2
            class="question-title"
            id="questionTitle"
          >
          </h2>


          <div
            class="answer-list"
            id="answerList"
          >

            <button
              class="answer-card"
              id="answerA"
              type="button"
            >

              <span class="answer-letter">
                A
              </span>

              <span
                class="answer-text"
                id="answerAText"
              ></span>

              <span class="answer-arrow">
                →
              </span>

            </button>


            <button
              class="answer-card"
              id="answerB"
              type="button"
            >

              <span class="answer-letter">
                B
              </span>

              <span
                class="answer-text"
                id="answerBText"
              ></span>

              <span class="answer-arrow">
                →
              </span>

            </button>

          </div>

        </div>

      </section>


      <!-- =====================================================
           결과 화면
      ===================================================== -->

      <section
        class="screen"
        id="resultScreen"
      >

        <div
          class="main-card result-card"
          id="resultCard"
        >

          <!-- 결과 상단 -->

          <div
            class="result-hero"
            id="resultHero"
          >

            <div class="result-small-title">
              당신이 살고 싶은 도시는?
            </div>

            <div
              class="result-emoji"
              id="resultEmoji"
            >
              🌃
            </div>

            <h2
              class="result-city"
              id="resultCity"
            >
              NEW YORK
            </h2>

            <p
              class="result-subtitle"
              id="resultSubtitle"
            >
              당신은 뉴욕과 가장 잘 어울려요.
            </p>

          </div>


          <!-- 결과 본문 -->

          <div class="result-body">

            <p
              class="result-description"
              id="resultDescription"
            ></p>


            <!-- 키워드 -->

            <div class="result-section">

              <div class="section-label">
                #KEYWORD
              </div>

              <div
                class="keyword-list"
                id="keywordList"
              ></div>

            </div>


            <!-- 라이프스타일 -->

            <div class="result-section">

              <div class="section-label">
                #YOUR LIFE
              </div>

              <p
                class="life-text"
                id="lifeText"
              ></p>

            </div>


            <!-- 도시에서의 하루 -->

            <div class="result-section">

              <div class="section-label">
                #A DAY IN YOUR CITY
              </div>

              <div
                class="day-card"
                id="dayText"
              ></div>

            </div>


            <!-- 한 줄 -->

            <p
              class="one-line"
              id="oneLine"
            ></p>


            <!-- 버튼 -->

            <div class="result-actions">

              <button
                class="primary-button"
                id="restartButton"
              >
                다시 테스트하기
              </button>

              <button
                class="secondary-button share-button"
                id="shareButton"
              >
                결과 공유하기
              </button>

            </div>

          </div>

        </div>

      </section>


    </div>

  </div>


  <!-- 공유 알림 -->

  <div
    class="toast"
    id="toast"
    role="status"
    aria-live="polite"
  ></div>


  <script>
    /* =========================================================
       도시 데이터

       color:
       결과 화면의 포인트 컬러

       description:
       도시 성향 설명

       keywords:
       결과 키워드

       life:
       잘 맞는 라이프스타일

       day:
       추천하는 도시에서의 하루

       oneLine:
       한 줄 코멘트
    ========================================================= */

    const cities = {

      newyork: {
        key: "newyork",

        emoji: "🌃",

        city: "NEW YORK",

        korean: "뉴욕",

        color: "#3157C8",

          screenElement.classList.remove("active");

        });

      screen.classList.add("active");

    /* =========================================================

    function renderQuestion() {

      const item =
        questions[currentQuestion];

      /*
       * 문제 번호
       */

      progressNumber.textContent =
        `${currentQuestion + 1} / ${questions.length}`;


      /*
       * 현재 문제까지의 진행률
       *
       * 첫 화면에서는 0%
       * 1번 답변 후에는 1/15
       */

      const progress =
        (currentQuestion / questions.length) * 100;

      progressBar.style.width =
        `${progress}%`;

      progressPercent.textContent =
        `${Math.round(progress)}%`;


      /*
       * 질문
       */

      questionTitle.textContent =
        item.question;


      /*
       * 선택지
       */

      answerAText.textContent =
        item.A.text;

      answerBText.textContent =
        item.B.text;


      /*
       * 버튼 상태 초기화
       */

      answerA.classList.remove("selected");

      answerB.classList.remove("selected");

      answerA.disabled = false;

      answerB.disabled = false;

      isAnswering = false;

    }

    ========================================================= */

    function selectAnswer(answer) {

      /*
       * 중복 클릭 방지
       */

      if (isAnswering) {
        return;
      }

      isAnswering = true;


      const item =
        questions[currentQuestion];

      const selected =
        item[answer];


      /*
       * 선택 애니메이션
       */

      const selectedButton =
        answer === "A"
          ? answerA
          : answerB;

      selectedButton.classList.add("selected");


      /*
       * 버튼 잠금
       */

      answerA.disabled = true;

      answerB.disabled = true;


      /*
       * 해당 도시 점수 +1
       */

      scores[selected.score] += 1;


      /*
       * 마지막 선택 도시 기록
       *
       * 동점 발생 시 이 도시를 우선
       */

      lastSelectedCity =
        selected.score;


      /*
       * 진행률 증가
       */

      const answeredCount =
        currentQuestion + 1;

      const progress =
        (answeredCount / questions.length) * 100;

      progressBar.style.width =
        `${progress}%`;

      progressPercent.textContent =
        `${Math.round(progress)}%`;


      /*
       * 마지막 문제라면 결과로 이동
       */

      if (
        currentQuestion ===
        questions.length - 1
      ) {

        setTimeout(
          function() {

            finalCity =
              calculateResult();

            renderResult(finalCity);

            showScreen(resultScreen);

          },
          400
        );

        return;
      }


      /*
       * 다음 문제
       */

      setTimeout(
        function() {

          currentQuestion++;

          renderQuestion();

        },
        400
      );

    }


    /* =========================================================
       결과 계산

       기본:
       가장 높은 점수의 도시

       동점:
       마지막으로 선택한 답변의 도시 우선
    ========================================================= */

    function calculateResult() {

      const cityKeys =
        Object.keys(scores);

      let highestScore =
        -1;

      let winners = [];


      /*
       * 최고점 찾기
       */

      cityKeys.forEach(
        function(cityKey) {

          const score =
            scores[cityKey];

          if (score > highestScore) {

            highestScore = score;

            winners = [cityKey];

          } else if (
            score === highestScore
          ) {

            winners.push(cityKey);

          }

        }
      );


      /*
       * 동점이 아니면 최고점 도시
       */

      if (winners.length === 1) {
        return winners[0];
      }


      /*
       * 동점이면 마지막 선택 도시 우선
       */

      if (
        lastSelectedCity &&
        winners.includes(lastSelectedCity)
      ) {

        return lastSelectedCity;

      }


      /*
       * 이론적으로 발생할 경우
       * 첫 번째 도시를 반환
       */

      return winners[0];

    }


    /* =========================================================
       결과 렌더링
    ========================================================= */

    function renderResult(cityKey) {

      const city =
        cities[cityKey];


      /*
       * 도시별 컬러
       */

      setAccentColor(city.color);

      resultHero.style
        .setProperty(
          "--result-color",
          city.color
        );

      resultCard.style
        .setProperty(
          "--result-color",
          city.color
        );


      /*
       * 결과 내용
       */

      resultEmoji.textContent =
        city.emoji;

      resultCity.textContent =
        city.city;

      resultSubtitle.textContent =
        `“당신은 ${city.korean}과 가장 잘 어울려요.”`;

      resultDescription.textContent =
        city.description;


      /*
       * 키워드
       */

      keywordList.innerHTML = "";

      city.keywords.forEach(
        function(keyword) {

          const element =
            document.createElement("span");

          element.className =
            "keyword";

          element.textContent =
            keyword;

          keywordList.appendChild(
            element
          );

        }
      );


      /*
       * 라이프스타일
       */

      lifeText.textContent =
        city.life;


      /*
       * 하루
       */

      dayText.textContent =
        city.day;


      /*
       * 한 줄
       */

      oneLine.textContent =
        city.oneLine;

    }


    /* =========================================================
       공유용 텍스트
    ========================================================= */

    function createShareText() {

      const city =
        cities[finalCity];

      return (
        `🌏 당신이 살고 싶은 도시는?\n\n` +
        `${city.emoji} ${city.city}\n` +
        `“당신은 ${city.korean}과 가장 잘 어울려요.”\n\n` +
        `${city.description}\n\n` +
        `#KEYWORD\n` +
        `${city.keywords.join(" · ")}\n\n` +
        `#YOUR LIFE\n` +
        `${city.life}\n\n` +
        `${city.oneLine}`
      );

    }


    /* =========================================================
       Toast
    ========================================================= */

    let toastTimer = null;

    function showToast(message) {

      toast.textContent =
        message;

      toast.classList.add("show");

      clearTimeout(toastTimer);

      toastTimer =
        setTimeout(
          function() {

            toast.classList.remove("show");

          },
          2200
        );

    }


    /* =========================================================
       클립보드 복사
    ========================================================= */

    async function copyResult() {

      const text =
        createShareText();


      /*
       * 최신 Clipboard API
       */

      if (
        navigator.clipboard &&
        window.isSecureContext
      ) {

        try {

          await navigator.clipboard.writeText(
            text
          );

          showToast(
            "결과가 클립보드에 복사됐어요 ✨"
          );

          return;

        } catch (error) {

          /*
           * 아래 fallback으로 진행
           */

        }

      }


      /*
       * 구형 브라우저 fallback
       */

      const textarea =
        document.createElement("textarea");

      textarea.value = text;

      textarea.style.position = "fixed";

      textarea.style.left = "-9999px";

      document.body.appendChild(textarea);

      textarea.focus();

      textarea.select();


      try {

        document.execCommand("copy");

        showToast(
          "결과가 클립보드에 복사됐어요 ✨"
        );

      } catch (error) {

        showToast(
          "공유 기능을 사용할 수 없어요."
        );

      }


      document.body.removeChild(textarea);

    }


    /* =========================================================
       결과 공유
    ========================================================= */

    async function shareResult() {

      const city =
        cities[finalCity];

      const text =
        createShareText();


      /*
       * Web Share API 지원 브라우저
       */

      if (
        navigator.share
      ) {

        try {

          await navigator.share({

            title:
              "🌏 당신이 살고 싶은 도시는?",

            text:
              text

          });

          return;

        } catch (error) {

          /*
           * 사용자가 공유창을 닫은 경우에는
           * 별도 메시지를 표시하지 않음
           */

          if (
            error &&
            error.name === "AbortError"
          ) {

            return;

          }

          /*
           * 공유 실패 시 복사
           */

        }

      }


      /*
       * Web Share API 미지원
       */

      await copyResult();

    }


    /* =========================================================
       다시 테스트
    ========================================================= */

    function restartTest() {

      currentQuestion = 0;

      scores = createScores();

      lastSelectedCity = null;

      finalCity = null;

      setAccentColor("#4054d8");

      progressBar.style.width =
        "0%";

      progressPercent.textContent =
        "0%";

      showScreen(startScreen);

    }


    /* =========================================================
       이벤트
    ========================================================= */

    startButton.addEventListener(
      "click",
      startTest
    );


    answerA.addEventListener(
      "click",
      function() {

        selectAnswer("A");

      }
    );


    answerB.addEventListener(
      "click",
      function() {

        selectAnswer("B");

      }
    );


    restartButton.addEventListener(
      "click",
      restartTest
    );


    shareButton.addEventListener(
      "click",
      shareResult
    );


    /* =========================================================
       초기화
    ========================================================= */

    setAccentColor("#4054d8");

  </script>

</body>
