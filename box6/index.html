<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>찰흙맨 대소동 — CLAY GUY BRAWL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1a110a; --paper:#e9d7b4; --banana:#dcb733; --duck:#d98a1c;
    --bubble:#d44a76; --mint:#2fae7a; --sky:#4d8fb8; --clay:#d97a5c;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--sky);
    font-family:'Jua',"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);
    -webkit-user-select:none;user-select:none;}
  canvas{display:block;}

  #hud{position:fixed;inset:0;pointer-events:none;padding:18px;display:flex;flex-direction:column;}
  .panel{background:var(--paper);border:4px solid var(--ink);border-radius:16px;
    box-shadow:6px 6px 0 var(--ink);padding:10px 16px;}
  #topbar{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;}
  #timer{font-family:'Black Han Sans',sans-serif;font-size:30px;line-height:1;letter-spacing:1px;}
  #timer small{display:block;font-family:'Jua',sans-serif;font-size:13px;opacity:.7;letter-spacing:0;}
  #lives{display:flex;gap:7px;align-items:center;}
  .clay-life{width:26px;height:26px;background:var(--clay);border:4px solid var(--ink);
    border-radius:60% 40% 55% 45%/50% 60% 40% 50%;transition:.2s;}
  .clay-life.gone{background:#9c9484;opacity:.35;transform:rotate(24deg) scale(.75);}
  #style{font-size:19px;}
  #style b{font-family:'Black Han Sans',sans-serif;font-size:26px;color:var(--bubble);}
  #mapinfo{font-size:15px;line-height:1.4;display:none;}
  #mapinfo b{font-family:'Black Han Sans',sans-serif;font-size:22px;}

  #board{position:absolute;right:18px;top:18px;padding:10px 14px;min-width:196px;}
  #board h4{font-family:'Black Han Sans',sans-serif;font-size:15px;letter-spacing:1px;
    margin-bottom:6px;opacity:.75;}
  .brow{display:flex;align-items:center;gap:8px;font-size:15px;line-height:1.9;}
  .bdot{width:14px;height:14px;border:3px solid var(--ink);border-radius:50%;flex:none;}
  .bname{flex:1;white-space:nowrap;}
  .bstate{font-size:13px;opacity:.8;}
  .brow.me .bname{font-weight:bold;text-decoration:underline;}
  .brow.ko{opacity:.45;}

  #event{margin:0 auto;margin-top:12vh;text-align:center;font-family:'Black Han Sans',sans-serif;
    font-size:clamp(26px,5vw,52px);color:#f0e4cd;letter-spacing:2px;
    text-shadow:5px 5px 0 var(--ink),-3px -3px 0 var(--ink),3px -3px 0 var(--ink),-3px 3px 0 var(--ink);
    opacity:0;transform:scale(.6) rotate(-6deg);}
  #event.pop{animation:pop 2.6s ease-out forwards;}
  @keyframes pop{
    0%{opacity:0;transform:scale(.4) rotate(-14deg);}
    12%{opacity:1;transform:scale(1.12) rotate(3deg);}
    22%{transform:scale(1) rotate(-2deg);}
    78%{opacity:1;transform:scale(1) rotate(-2deg);}
    100%{opacity:0;transform:scale(.9) translateY(-30px);}}

  #toast{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);display:flex;
    flex-direction:column;align-items:center;gap:8px;}
  .yell{font-family:'Black Han Sans',sans-serif;font-size:clamp(20px,3vw,34px);color:var(--banana);
    text-shadow:4px 4px 0 var(--ink);animation:yell 1.3s ease-out forwards;}
  @keyframes yell{
    0%{opacity:0;transform:translateY(20px) rotate(-8deg) scale(.7);}
    20%{opacity:1;transform:translateY(0) rotate(4deg) scale(1.1);}
    100%{opacity:0;transform:translateY(-70px) rotate(-3deg) scale(1);}}

  #keys{position:absolute;left:18px;bottom:18px;font-size:15px;line-height:1.8;}
  #keys kbd{display:inline-block;min-width:26px;text-align:center;background:#f6ecd6;
    border:3px solid var(--ink);border-radius:6px;box-shadow:3px 3px 0 var(--ink);
    padding:1px 6px;font-family:'Jua',sans-serif;margin-right:3px;}
  #compass{position:absolute;right:18px;bottom:18px;width:132px;height:132px;padding:0;
    border-radius:50%;overflow:hidden;}
  #compass canvas{width:100%;height:100%;}
  #bright{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);pointer-events:auto;
    cursor:pointer;font-family:'Jua',sans-serif;font-size:15px;padding:7px 16px;color:var(--ink);
    background:var(--paper);border:4px solid var(--ink);border-radius:999px;
    box-shadow:4px 4px 0 var(--ink);}
  #bright:active{transform:translateX(-50%) translate(4px,4px);box-shadow:0 0 0 var(--ink);}

  .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;text-align:center;padding:18px;overflow:auto;
    background:radial-gradient(circle at 50% 40%, #c9ab74 0%, #a87a92 45%, #4d7fa5 100%);}
  .screen.hidden{display:none;}
  .title{font-family:'Black Han Sans',sans-serif;line-height:.95;color:#f0e4cd;
    font-size:clamp(32px,6.5vw,74px);letter-spacing:2px;
    text-shadow:8px 8px 0 var(--ink),-4px -4px 0 var(--ink),4px -4px 0 var(--ink),-4px 4px 0 var(--ink);
    transform:rotate(-3deg);}
  .title em{display:block;font-style:normal;font-size:.42em;color:var(--banana);transform:rotate(2deg);}
  .desc{max-width:640px;font-size:16px;line-height:1.55;}
  .sect{font-family:'Black Han Sans',sans-serif;font-size:20px;color:#f0e4cd;letter-spacing:2px;
    text-shadow:4px 4px 0 var(--ink);margin-top:4px;}
  .btn{pointer-events:auto;cursor:pointer;font-family:'Black Han Sans',sans-serif;font-size:26px;
    padding:13px 40px;border:5px solid var(--ink);border-radius:999px;background:var(--banana);
    box-shadow:8px 8px 0 var(--ink);transition:transform .08s, box-shadow .08s;}
  .btn:hover{transform:translate(3px,3px);box-shadow:4px 4px 0 var(--ink);}
  .btn:active{transform:translate(8px,8px);box-shadow:0 0 0 var(--ink);}
  .btn:focus-visible{outline:4px dashed var(--bubble);outline-offset:6px;}

  #mapPicker{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;}
  .mcard{cursor:pointer;width:240px;background:var(--paper);border:4px solid var(--ink);
    border-radius:18px;box-shadow:6px 6px 0 var(--ink);padding:10px;transition:transform .1s;}
  .mcard:hover{transform:translateY(-4px);}
  .mcard.sel{background:#f6ecd6;border-color:var(--bubble);box-shadow:6px 6px 0 var(--bubble);
    transform:translateY(-6px) rotate(-1deg);}
  .mprev{position:relative;height:96px;border-radius:12px;overflow:hidden;
    border:3px solid var(--ink);background:#8fa9bd;}
  .mprev i{position:absolute;display:block;}
  .mname{font-family:'Black Han Sans',sans-serif;font-size:19px;margin-top:6px;}
  .mtag{font-size:13.5px;opacity:.85;line-height:1.4;}

  #picker{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:1000px;}
  .pick{cursor:pointer;width:160px;background:var(--paper);border:4px solid var(--ink);
    border-radius:18px;box-shadow:6px 6px 0 var(--ink);padding:10px 8px 12px;
    transition:transform .1s, box-shadow .1s;}
  .pick:hover{transform:translateY(-4px);}
  .pick.sel{background:#f6ecd6;box-shadow:6px 6px 0 var(--bubble);border-color:var(--bubble);
    transform:translateY(-6px) rotate(-1.5deg);}
  .fig{position:relative;height:96px;margin-bottom:4px;}
  .fig i{position:absolute;display:block;border:3px solid var(--ink);}
  .pname{font-family:'Black Han Sans',sans-serif;font-size:19px;}
  .ptag{font-size:13px;line-height:1.4;opacity:.85;margin-top:2px;}
  .pstat{font-size:11.5px;opacity:.7;margin-top:4px;}

  .stat{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;}
  .stat .panel{min-width:140px;}
  .stat b{display:block;font-family:'Black Han Sans',sans-serif;font-size:34px;line-height:1.1;}
  #overTitle{font-family:'Black Han Sans',sans-serif;font-size:clamp(34px,7vw,74px);color:#f0e4cd;
    text-shadow:7px 7px 0 var(--ink);transform:rotate(-2deg);}
  #rank{font-size:20px;background:#f6ecd6;border:4px solid var(--ink);border-radius:14px;
    box-shadow:6px 6px 0 var(--ink);padding:10px 22px;}
  #finalBoard{font-size:15px;line-height:1.85;}
  @media (prefers-reduced-motion: reduce){ #event.pop,.yell{animation-duration:.01ms;} }
</style>
</head>
<body>

<div id="hud">
  <div id="topbar">
    <div class="panel" id="timer">0.0초<small>버틴 시간</small></div>
    <div class="panel"><div id="lives"></div></div>
    <div class="panel" id="style">굴욕 점수 <b id="styleVal">0</b></div>
    <div class="panel" id="mapinfo"><span id="layerWrap">내 층 <b id="myLayer">4</b> · </span>남은 발판 <b id="tileLeft">0</b></div>
  </div>
  <div class="panel" id="board"><h4>찰흙 5인방</h4><div id="boardRows"></div></div>
  <div id="event"></div>
  <div id="toast"></div>
  <div id="keys" class="panel">
    <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 이동 · <kbd>Shift</kbd> 전력질주</div>
    <div><kbd>Space</kbd> 점프 · 공중에서 한 번 더 누르면 <b>엉뚱한 포즈</b></div>
    <div><kbd>마우스 드래그</kbd> 또는 <kbd>←</kbd><kbd>→</kbd> 카메라 · <kbd>B</kbd> 밝기</div>
  </div>
  <div id="compass" class="panel"><canvas id="mapCanvas" width="264" height="264"></canvas></div>
  <button id="bright" title="화면 밝기 (B키)">밝기: 보통</button>
</div>

<div class="screen" id="startScreen">
  <h1 class="title">찰흙맨 대소동<em>CLAY GUY BRAWL</em></h1>
  <div class="sect">맵 고르기</div>
  <div id="mapPicker"></div>
  <div class="sect">캐릭터 고르기 — 나머지 넷은 알아서 논다</div>
  <div id="picker"></div>
  <button class="btn" id="startBtn">시작</button>
</div>

<div class="screen hidden" id="overScreen">
  <div id="overTitle">떨어졌다!</div>
  <div class="stat">
    <div class="panel">버틴 시간<b id="finalTime">0.0</b>초</div>
    <div class="panel">굴욕 점수<b id="finalStyle">0</b>점</div>
    <div class="panel">최고 기록<b id="bestTime">0.0</b>초</div>
  </div>
  <div class="panel" id="finalBoard"></div>
  <div id="rank">평가 준비 중</div>
  <button class="btn" id="retryBtn">다시 주무르기</button>
</div>

<script>
window.addEventListener('error', function(e){
  var d = document.createElement('div');
  d.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99;background:#1a110a;'+
    'color:#dcb733;font:14px/1.6 monospace;padding:14px;white-space:pre-wrap;';
  d.textContent = '문제가 생겼습니다\n' + (e.message || e.type) +
    '\n' + (e.filename || '') + (e.lineno ? ' : ' + e.lineno + '행' : '');
  document.body.appendChild(d);
});
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
<script>
/* =========================================================================
   찰흙맨 대소동 v5 — 맵 2종 + 캐릭터 5종
   · 캐릭터 = 물리 바디 11개 + 관절 10개짜리 액티브 래그돌
   · 맵 A 바나나 광장: 회전 장애물이 가득한 원형 경기장
   · 맵 B 육각형 붕괴: 밟으면 사라지는 육각 발판 4층 (폴가이즈 헥사곤 방식)
   ========================================================================= */

if(typeof THREE === 'undefined' || typeof CANNON === 'undefined'){
  document.getElementById('startScreen').innerHTML =
    '<h1 class="title">라이브러리를 못 불러왔습니다</h1>' +
    '<p class="desc">Three.js와 Cannon.js를 CDN에서 받아오지 못했습니다. ' +
    '인터넷 연결을 확인하거나, 두 파일을 내려받아 같은 폴더에 두고 script 경로를 바꿔주세요.</p>';
  throw new Error('THREE 또는 CANNON 로딩 실패');
}

const V3 = THREE.Vector3;
const clamp = (v,a,b)=>Math.min(b,Math.max(a,v));
const lerp  = (a,b,t)=>a+(b-a)*t;
const rand  = (a,b)=>a+Math.random()*(b-a);
const COL = {banana:0xe0be33, bananaTip:0x7a5c37, duck:0xdf9026, beak:0xd94f33, ring:0x2fae7a};

const STYLES = [
  { id:'dough', name:'반죽맨', tag:'가장 평범한 반죽. 뭐든 무난하다.',
    scale:1.00, width:1.00, limb:1.00, massMul:1.0, stiff:1.00, speed:1.00, jump:1.00,
    skin:0xdb9a72, shirt:0xd44a76, pants:0x4265cf, hair:0x59341f, head:'tuft' },
  { id:'noodle', name:'국수다리', tag:'팔다리가 길고 제일 흐물거린다. 발이 자꾸 꼬인다.',
    scale:1.05, width:0.80, limb:1.55, massMul:0.8, stiff:0.62, speed:1.15, jump:1.05,
    skin:0xd9b78a, shirt:0x74bb42, pants:0x279e93, hair:0x23150f, head:'strand' },
  { id:'chonk', name:'떡대', tag:'무겁고 굼뜨지만 웬만해선 밀리지 않는다.',
    scale:1.12, width:1.65, limb:0.78, massMul:2.1, stiff:1.35, speed:0.84, jump:0.88,
    skin:0xd98559, shirt:0xd99903, pants:0x82371c, hair:0x2f1d13, head:'mustache' },
  { id:'bean', name:'콩알', tag:'작고 빠르지만 툭 치면 저 멀리 날아간다.',
    scale:0.74, width:1.15, limb:0.92, massMul:0.55, stiff:1.10, speed:1.28, jump:1.28,
    skin:0xd9aabb, shirt:0x9670d9, pants:0x5840d4, hair:0x3e266d, head:'cap' },
  { id:'alien', name:'우주찰흙', tag:'머리가 크고 몸이 가벼워 붕붕 뜬다.',
    scale:0.96, width:0.92, limb:1.10, massMul:0.7, stiff:0.82, speed:1.02, jump:1.45,
    skin:0x69c471, shirt:0x0097b6, pants:0x006496, hair:0x255946, head:'antenna' }
];

// ---------------------------------------------------------------- 셋업
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x5aa8d8);
scene.fog = new THREE.Fog(0x86bcd8, 85, 250);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 700);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.85;
document.body.appendChild(renderer.domElement);

const hemi = new THREE.HemisphereLight(0xd8ecff, 0xc79ab0, 0.45);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffeec4, 0.78);
sun.castShadow = true; sun.shadow.mapSize.set(2048,2048);
const shc = sun.shadow.camera;
shc.left=-38; shc.right=38; shc.top=38; shc.bottom=-38; shc.near=1; shc.far=160;
const sunTarget = new THREE.Object3D(); scene.add(sunTarget);
sun.target = sunTarget; scene.add(sun);
const amb = new THREE.AmbientLight(0xffffff, 0.12);
scene.add(amb);

(function clouds(){
  const m = new THREE.MeshBasicMaterial({color:0xd7e6ef});
  for(let i=0;i<24;i++){
    const g = new THREE.Group();
    for(let j=0;j<4;j++){
      const s = new THREE.Mesh(new THREE.SphereGeometry(rand(4,8),8,7), m);
      s.position.set(rand(-9,9), rand(-1,1), rand(-4,4)); g.add(s);
    }
    const a = Math.random()*Math.PI*2, r = rand(95,190);
    g.position.set(Math.cos(a)*r, rand(24,60), Math.sin(a)*r);
    scene.add(g);
  }
})();

const world = new CANNON.World();
world.gravity.set(0,-34,0);
world.broadphase = new CANNON.SAPBroadphase(world);
world.allowSleep = false;
world.solver.iterations = 12;
world.defaultContactMaterial.friction = 0.2;
world.defaultContactMaterial.restitution = 0.2;

const matGround = new CANNON.Material('ground');
const matCtrl   = new CANNON.Material('ctrl');
const matClay   = new CANNON.Material('clay');
const matBouncy = new CANNON.Material('bouncy');
/* cannon.js는 마찰을 임펄스 상한으로 처리해서 흔한 값(0.2~0.5)이면 프레임마다 속도를
   크게 깎아버린다. 조종체는 속도를 직접 제어하므로 마찰을 거의 0으로 둔다. */
world.addContactMaterial(new CANNON.ContactMaterial(matGround, matCtrl,   {friction:0.004, restitution:0.02}));
world.addContactMaterial(new CANNON.ContactMaterial(matGround, matClay,   {friction:0.10, restitution:0.05}));
world.addContactMaterial(new CANNON.ContactMaterial(matBouncy, matCtrl,   {friction:0.02, restitution:1.3}));
world.addContactMaterial(new CANNON.ContactMaterial(matBouncy, matClay,   {friction:0.1,  restitution:0.8}));
world.addContactMaterial(new CANNON.ContactMaterial(matBouncy, matGround, {friction:0.1,  restitution:0.75}));

const G_WORLD = 1, G_CLAY = 2, G_CTRL = 4;   // 찰흙 파츠끼리·조종체와는 통과

let actx = null;
function audioReady(){ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); }
function boing(f0=520, f1=90, dur=0.28, type='sine', vol=0.16){
  if(!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, actx.currentTime);
  o.frequency.exponentialRampToValueAtTime(Math.max(30,f1), actx.currentTime+dur);
  g.gain.setValueAtTime(vol, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+dur);
  o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+dur+0.02);
}

/* ===================================================================
   맵 공용 뼈대 — 맵을 갈아끼울 수 있도록 모든 물체를 등록해 둔다
   =================================================================== */
const arenaBodies = [], arenaMeshes = [];
const hazards = [], pads = [], plateaus = [], balls = [], debris = [];
const tiles = [], fallingTiles = [];
let currentMap = null;

function aBody(b){ b.collisionFilterMask = -1; world.addBody(b); arenaBodies.push(b); return b; }
function aMesh(m){ scene.add(m); arenaMeshes.push(m); return m; }
function clearArena(){
  arenaBodies.forEach(b=>world.remove(b));
  arenaMeshes.forEach(m=>scene.remove(m));
  arenaBodies.length = 0; arenaMeshes.length = 0;
  hazards.length = 0; pads.length = 0; plateaus.length = 0; balls.length = 0;
  tiles.length = 0; fallingTiles.length = 0;
  debris.forEach(d=>{ scene.remove(d.mesh); world.remove(d.body); }); debris.length = 0;
}
const box = (x,y,z)=> new CANNON.Box(new CANNON.Vec3(x,y,z));
function checkerTexture(rep){
  const c = document.createElement('canvas'); c.width=c.height=512;
  const x = c.getContext('2d'); const n=8, s=512/n;
  for(let i=0;i<n;i++) for(let j=0;j<n;j++){
    x.fillStyle = (i+j)%2 ? '#e8d2a6' : '#e0a6bf'; x.fillRect(i*s,j*s,s,s);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep,rep);
  return t;
}
function markHazard(b, name, power){ b.isHazard = true; b.hazardName = name; b.hazardPower = power||1; }
function difficulty(){ return 1 + Math.min(gameTime/45, 1.2); }

/* ---------------------------------------------------------------- 장애물 부품 */
function bananaMesh(len){
  const g = new THREE.Group();
  const matY = new THREE.MeshStandardMaterial({color:COL.banana, roughness:.55});
  const matT = new THREE.MeshStandardMaterial({color:COL.bananaTip, roughness:.85});
  for(let i=0;i<=20;i++){
    const t = i/20;
    const r = 0.32 + 0.95*Math.pow(Math.sin(Math.PI*t), 0.7);
    const m = new THREE.Mesh(new THREE.SphereGeometry(r,14,12), (t<0.05||t>0.95)?matT:matY);
    m.position.set(4 + t*len, 2.4*Math.sin(Math.PI*t) - 0.8, 0);

function arenaSpawn(){
  let bx = 28, bz = 0, best = -1;
  for(let i=0;i<24;i++){
    const a = Math.random()*Math.PI*2, r = rand(24, 32);
    const x = Math.cos(a)*r, z = Math.sin(a)*r;
    let near = 1e9;
    for(let j=0;j<hazards.length;j++){
      const h = hazards[j];
      if(h.x === undefined) continue;
      near = Math.min(near, Math.hypot(x-h.x, z-h.z));
    }
    near = Math.min(near, Math.abs(Math.hypot(x,z) - 20));
    if(near > best){ best = near; bx = x; bz = z; }
    if(best > 9) break;
  }
  return {x:bx, y:6, z:bz};
}
/* AI: 목표 지점으로 걸어가되 장애물과 가장자리는 피한다. 똑똑하진 않다. */
function arenaAI(g, dt){
  const a = g.ai, p = g.ctrl.position;
  a.timer -= dt; a.jumpCd -= dt;
  if(a.timer <= 0 || Math.hypot(a.target.x-p.x, a.target.z-p.z) < 4){
    const s = arenaSpawn(); a.target.set(s.x, 0, s.z); a.timer = rand(4, 9);
  }
  let dx = a.target.x - p.x, dz = a.target.z - p.z;
  const dl = Math.hypot(dx, dz) || 1; dx /= dl; dz /= dl;
  for(let i=0;i<hazards.length;i++){
    const h = hazards[i];
    if(h.x === undefined) continue;
    const ox = p.x-h.x, oz = p.z-h.z, d = Math.hypot(ox, oz);
    const danger = (h.danger || 4) + 3;
    if(d < danger && d > 0.01){
      const w = (danger-d)/danger * 2.2;
      dx += ox/d*w; dz += oz/d*w;
    }
  }
  const rc = Math.hypot(p.x, p.z);
  if(rc < 21){ const w = (21-rc)/21*2.6; dx += (p.x/(rc||1))*w; dz += (p.z/(rc||1))*w; }
  if(rc > 38){ const w = (rc-38)/8*3.5; dx -= (p.x/rc)*w; dz -= (p.z/rc)*w; }
  const l2 = Math.hypot(dx, dz) || 1;
  let jump = false;
  if(a.jumpCd <= 0 && g.grounded){ a.jumpCd = rand(2.5, 6); jump = Math.random() < 0.7; }
  applyMove(g, dx/l2, dz/l2, rc < 24, jump, dt);
}

/* ---------------------------------------------------------------- 맵 B: 육각형 붕괴
   폴가이즈 헥사곤처럼, 밟으면 잠깐 뒤 사라지는 육각 발판이 4층으로 쌓여 있다.
   아래층으로 계속 떨어지다가 맨 아래까지 뚫리면 탈락.                        */
const HEX_R = 2.45, HEX_RINGS = 4, HEX_LAYERS = 5, LAYER_H = 4.4;
const HEX_TOP = (HEX_LAYERS-1)*LAYER_H;
const HEX_SPAN = HEX_RINGS*Math.sqrt(3)*HEX_R + HEX_R;
const LAYER_COLORS = [0x5aa8d8, 0x2fae7a, 0xd99903, 0xd44a76, 0x9670d9];   // 아래→위
let hexGeo = null, hexDangerMat = null, hexSafeMat = null, hexLayerMats = null;

function hexCells(rings){
  const list = [], N = rings === undefined ? HEX_RINGS : rings;
  for(let q=-N;q<=N;q++){
    for(let r=Math.max(-N,-q-N); r<=Math.min(N,-q+N); r++) list.push({q, r});
  }
  return list;
}
function axialXZ(q, r, R){ return {x: R*Math.sqrt(3)*(q + r/2), z: R*1.5*r}; }
const HDIR = [[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];

function ensureTileAssets(){
  if(hexGeo) return;
  hexGeo = new THREE.CylinderGeometry(1, 1, 0.5, 6);
  hexDangerMat = new THREE.MeshStandardMaterial({color:0xd94f33, roughness:.6, emissive:0x3a1008});
  hexSafeMat = new THREE.MeshStandardMaterial({color:0x7ff0e0, roughness:.25,
    emissive:0x2ba79a, emissiveIntensity:1.1});
  hexLayerMats = LAYER_COLORS.map(c=>new THREE.MeshStandardMaterial({color:c, roughness:.85}));
}
/* 발판 하나. opts: {R 반경, colorIdx 색, layer 층, safe 사라지지 않는 안전 발판,
   regrow 무너진 뒤 다시 자라기까지의 초} */
function makeTile(cx, cz, y, opts){
  opts = opts || {};
  ensureTileAssets();
  const R = opts.R || HEX_R, vr = R - 0.09;
  const body = new CANNON.Body({mass:0, material:matGround});
  const sh = new CANNON.Cylinder(vr*0.93, vr*0.93, 0.5, 6);
  const q = new CANNON.Quaternion(); q.setFromAxisAngle(new CANNON.Vec3(1,0,0), -Math.PI/2);
  body.addShape(sh, new CANNON.Vec3(0,0,0), q);
  body.position.set(cx, y, cz);
  const t = {body, mesh:null, x:cx, y, z:cz, vr,
    layer: opts.layer || 0, colorIdx: opts.colorIdx || 0,
    safe: !!opts.safe, regrow: opts.regrow || 0,
    alive:true, dying:false, timer:0, deadTimer:0, pop:0, phase:rand(0,6.3)};
  body.tile = t;
  aBody(body);
  const mesh = new THREE.Mesh(hexGeo, t.safe ? hexSafeMat : hexLayerMats[t.colorIdx % hexLayerMats.length]);
  mesh.scale.set(vr, t.safe ? 1.5 : 1, vr);
  mesh.position.set(cx, y, cz);
  mesh.castShadow = true; mesh.receiveShadow = true;
  aMesh(mesh); t.mesh = mesh;
  if(t.safe){
    const halo = new THREE.Mesh(new THREE.TorusGeometry(vr*0.55, 0.09, 6, 18),
      new THREE.MeshStandardMaterial({color:0x8ffff0, emissive:0x3fd8c4, emissiveIntensity:1.4, roughness:.3}));
    halo.rotation.x = Math.PI/2; halo.position.set(cx, y + 1.5, cz);
    aMesh(halo); t.halo = halo;
  }
  tiles.push(t);
  return t;
}
function reviveTile(t){
  t.dying = false; t.timer = 0; t.deadTimer = 0;
  if(!t.alive){
    t.alive = true;
    t.body.collisionFilterMask = -1;
    if(world.bodies.indexOf(t.body) < 0) world.addBody(t.body);
    if(arenaBodies.indexOf(t.body) < 0) arenaBodies.push(t.body);
  }
  t.mesh.position.set(t.x, t.y, t.z);
  t.mesh.rotation.set(0,0,0);
  t.mesh.material = t.safe ? hexSafeMat : hexLayerMats[t.colorIdx % hexLayerMats.length];
  if(!t.mesh.parent) scene.add(t.mesh);
  if(arenaMeshes.indexOf(t.mesh) < 0) arenaMeshes.push(t.mesh);
  for(let i=fallingTiles.length-1;i>=0;i--) if(fallingTiles[i].t === t) fallingTiles.splice(i,1);
  t.pop = 0.4;
}
function killTile(t){
  t.alive = false;
  if(world.bodies.indexOf(t.body) >= 0) world.remove(t.body);
  const bi = arenaBodies.indexOf(t.body); if(bi >= 0) arenaBodies.splice(bi, 1);
  fallingTiles.push({mesh:t.mesh, t, vy:0, sx:rand(-2,2), sz:rand(-2,2), life:3.0});
  t.deadTimer = t.regrow;
}
function aliveTiles(layer){
  const out = [];
  for(let i=0;i<tiles.length;i++){
    const t = tiles[i];
    if(t.alive && (layer === undefined || t.layer === layer)) out.push(t);
  }
  return out;
}
function nearestTile(x, z, y){
  let best = null, bd = 1e9;
  for(let i=0;i<tiles.length;i++){
    const t = tiles[i];
    if(!t.alive || (y !== undefined && Math.abs(t.y - y) > 4)) continue;
    const d = (t.x-x)*(t.x-x) + (t.z-z)*(t.z-z);
    if(d < bd){ bd = d; best = t; }
  }
  return best ? {tile:best, dist:Math.sqrt(bd)} : null;
}
function startTileFall(t){
  if(!t.alive || t.dying || t.safe) return;     // 빛나는 안전 발판은 무너지지 않는다
  t.dying = true; t.timer = 1.15;
  t.mesh.material = hexDangerMat;
}
let tileClock = 0;
function updateTiles(dt){
  tileClock += dt;
  for(let i=0;i<tiles.length;i++){
    const t = tiles[i];
    if(t.pop > 0){       // 다시 자라날 때 뿅 하고 커지는 연출
      t.pop = Math.max(0, t.pop - dt);
      const k = 1 - t.pop/0.4;
      t.mesh.scale.set(t.vr*k, (t.safe?1.5:1)*Math.max(0.05,k), t.vr*k);
    }
    if(t.safe){
      t.mesh.position.y = t.y + Math.sin(tileClock*2 + t.phase)*0.07;
      if(t.halo){
        t.halo.position.y = t.y + 1.5 + Math.sin(tileClock*1.6 + t.phase)*0.22;
        t.halo.rotation.z += dt*1.4;
      }
      continue;
    }
    if(t.alive && t.dying){
      t.timer -= dt;
      t.mesh.position.x = t.x + Math.sin(t.timer*38)*0.05;
      t.mesh.position.z = t.z + Math.cos(t.timer*33)*0.05;
      if(t.timer <= 0) killTile(t);
    } else if(!t.alive && t.regrow > 0){
      t.deadTimer -= dt;
      if(t.deadTimer <= 0){
        // 누가 그 자리에 서 있으면 조금 더 기다린다
        let blocked = false;
        for(let j=0;j<guys.length;j++){
          const q = guys[j].D.pelvis.position;
          if(Math.abs(q.y - t.y) < 3 && Math.hypot(q.x-t.x, q.z-t.z) < 1.7){ blocked = true; break; }
        }
        if(blocked) t.deadTimer = 1.0; else reviveTile(t);
      }
    }
  }
  for(let i=fallingTiles.length-1;i>=0;i--){
    const f = fallingTiles[i];
    f.vy -= 40*dt; f.life -= dt;
    f.mesh.position.y += f.vy*dt;
    f.mesh.rotation.x += f.sx*dt; f.mesh.rotation.z += f.sz*dt;
    if(f.life <= 0){
      scene.remove(f.mesh);
      if(!(f.t && f.t.regrow)){
        const mi = arenaMeshes.indexOf(f.mesh); if(mi >= 0) arenaMeshes.splice(mi, 1);
      }
      fallingTiles.splice(i,1);
    }
  }
  if(playing && currentMap.regenAt && aliveTiles().length < currentMap.regenAt) currentMap.reset(true);
}
/* 발판 고르기: filter를 통과한 살아있는 발판 중 이웃이 많은(=길이 이어지는) 곳 */
function pickTileNear(g, filter, minD, maxD, fwdBias){
  const p = g.ctrl.position;
  const vx = Math.sin(g.faceAngle), vz = Math.cos(g.faceAngle);
  let best = null, bs = -1e9;
  for(let i=0;i<14;i++){
    const t = tiles[Math.floor(Math.random()*tiles.length)];
    if(!t.alive || t.dying || !filter(t)) continue;
    const dx = t.x-p.x, dz = t.z-p.z, d = Math.hypot(dx, dz);
    if(d < minD || d > maxD) continue;
    let neigh = 0;
    for(let j=0;j<tiles.length;j++){
      const o = tiles[j];
      if(o.alive && !o.dying && Math.abs(o.y-t.y) < 2 &&
         Math.hypot(o.x-t.x, o.z-t.z) < t.vr*2.3) neigh++;
    }
    const score = neigh*1.3 + (fwdBias ? (dx*vx+dz*vz)/d*fwdBias : 0)
                  + (t.safe ? 2.2 : 0) - d*0.14;
    if(score > bs){ bs = score; best = t; }
  }
  return best;
}

/* ---------------------------------------------------------------- 맵 B: 육각형 붕괴 */
function buildHexMap(){
  ensureTileAssets();
  const cells = hexCells();
  for(let L=0; L<HEX_LAYERS; L++){
    cells.forEach(c=>{
      const w = axialXZ(c.q, c.r, HEX_R);
      makeTile(w.x, w.z, L*LAYER_H, {layer:L, colorIdx:L});
    });
  }
  for(let L=0; L<HEX_LAYERS; L++){
    const ring = new THREE.Mesh(new THREE.TorusGeometry(HEX_SPAN+0.5, 0.14, 6, 64),
      new THREE.MeshStandardMaterial({color:0x2a1a12, roughness:.9}));
    ring.rotation.x = Math.PI/2; ring.position.y = L*LAYER_H - 0.3; aMesh(ring);
  }
  const abyss = new THREE.Mesh(new THREE.CylinderGeometry(HEX_SPAN*2.2, HEX_SPAN*0.6, 30, 28),
    new THREE.MeshStandardMaterial({color:0x2b3b4a, roughness:1}));
  abyss.position.y = -22; aMesh(abyss);
}
function hexReset(announce){
  tiles.forEach(t=>reviveTile(t));
  fallingTiles.forEach(f=>scene.remove(f.mesh)); fallingTiles.length = 0;
  if(announce){ banner('육각 발판 재생성!'); boing(240, 900, 0.5, 'triangle', 0.16); }
}
function hexSpawn(){
  for(let L=HEX_LAYERS-1; L>=0; L--){
    const list = aliveTiles(L).filter(t=>!t.dying);
    if(list.length > 6){
      const t = list[Math.floor(Math.random()*list.length)];
      return {x:t.x, y:L*LAYER_H + 2.2, z:t.z};
    }
  }
  return {x:0, y:HEX_TOP+3, z:0};
}
function tileLayerOf(y){ return clamp(Math.round(y/LAYER_H), 0, HEX_LAYERS-1); }
function hexAI(g, dt){
  const a = g.ai, p = g.ctrl.position;
  a.timer -= dt; a.jumpCd -= dt;
  const layer = tileLayerOf(p.y - 0.4);
  if(a.timer <= 0 || !a.tile || !a.tile.alive || a.tile.layer !== layer ||
     Math.hypot(a.tile.x-p.x, a.tile.z-p.z) < 1.5){
    a.tile = pickTileNear(g, t=>t.layer === layer, 2.5, 14, 0);
    a.timer = rand(1.1, 2.4);
  }
  let dx = 0, dz = 0;
  if(a.tile){ dx = a.tile.x - p.x; dz = a.tile.z - p.z; }
  else { dx = -p.x; dz = -p.z; }
  const dl = Math.hypot(dx, dz) || 1; dx/=dl; dz/=dl;
  for(let i=0;i<tiles.length;i++){
    const t = tiles[i];
    if(!t.dying || !t.alive || t.layer !== layer) continue;
    const ox = p.x-t.x, oz = p.z-t.z, d = Math.hypot(ox, oz);
    if(d < HEX_R*1.5 && d > 0.01){ const w = (HEX_R*1.5-d)/(HEX_R*1.5)*2.4; dx += ox/d*w; dz += oz/d*w; }
  }
  const rc = Math.hypot(p.x, p.z);
  if(rc > HEX_SPAN-2){ const w = (rc-(HEX_SPAN-2))/2*3.5; dx -= (p.x/rc)*w; dz -= (p.z/rc)*w; }
  const l2 = Math.hypot(dx, dz) || 1;
  let jump = false;
  if(a.jumpCd <= 0 && g.grounded){ a.jumpCd = rand(3, 7); jump = Math.random() < 0.35; }
  applyMove(g, dx/l2, dz/l2, false, jump, dt);
}

/* ---------------------------------------------------------------- 맵 C: 갈래 고가도로
   허브에서 뻗어나간 육각 고가도로 6줄기가 중간에서 두 갈래로 갈라졌다 다시 만나고,
   바깥 순환로로 이어진다. 밟은 발판은 무너지지만 7초 뒤 다시 자라고,
   빛나는 안전 발판은 절대 무너지지 않는다.                                        */
const BR_R = 2.8, BR_Y = 13, BR_RING = 8, BR_REGROW = 7;
const BR_SPAN = BR_RING*Math.sqrt(3)*BR_R + BR_R*2;
function buildBridgeMap(){
  ensureTileAssets();
  const seen = {};
  const put = (q, r, opts)=>{
    const key = q + ',' + r;
    if(seen[key]) return;
    seen[key] = 1;
    const w = axialXZ(q, r, BR_R);
    makeTile(w.x, w.z, BR_Y, Object.assign({R:BR_R, regrow:BR_REGROW, colorIdx:2}, opts));
  };
  // 중앙 허브 (전부 안전 발판)
  hexCells(1).forEach(c=>put(c.q, c.r, {safe:true, colorIdx:4}));

  for(let d=0; d<6; d++){
    const dir = HDIR[d], perp = HDIR[(d+2)%6];
    // 곧게 뻗은 구간
    [2,3,7,8].forEach(i=>put(dir[0]*i, dir[1]*i, {colorIdx:(d%2)?1:2}));
    // 두 갈래로 갈라지는 구간 (가운데는 비어 있어 반드시 한쪽을 골라야 한다)
    for(let i=3;i<=7;i++){
      [1,-1].forEach(sgn=>{
        const q = dir[0]*i + perp[0]*sgn, r = dir[1]*i + perp[1]*sgn;
        const isEnd = (i===3 || i===7);
        put(q, r, {safe:isEnd, colorIdx:isEnd?4:((d%2)?0:3)});
      });
    }
  }
  // 바깥 순환로 — 2차선(육각 링 두 겹). 여섯 걸음마다 안전 발판
  [BR_RING-1, BR_RING].forEach((RG, lane)=>{
    let cq = HDIR[4][0]*RG, cr = HDIR[4][1]*RG, n = lane*3;
    for(let d=0; d<6; d++){
      for(let k=0; k<RG; k++){
        put(cq, cr, {safe:(n % 6 === 0), colorIdx:(n%6===0)?4:(lane?0:1)});
        cq += HDIR[d][0]; cr += HDIR[d][1]; n++;
      }
    }
  });
  // 안전 발판 아래로 내려가는 다리 기둥
  const pillarMat = new THREE.MeshStandardMaterial({color:0x4a5a68, roughness:.95});
  tiles.forEach(t=>{
    if(!t.safe) return;
    const pil = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.6, BR_Y+16, 8), pillarMat);
    pil.position.set(t.x, BR_Y - (BR_Y+16)/2, t.z);
    pil.castShadow = true; aMesh(pil);
  });
  const abyss = new THREE.Mesh(new THREE.CylinderGeometry(BR_SPAN*2.4, BR_SPAN*0.5, 30, 28),
    new THREE.MeshStandardMaterial({color:0x2b3b4a, roughness:1}));
  abyss.position.y = -24; aMesh(abyss);
}
function bridgeReset(announce){
  tiles.forEach(t=>reviveTile(t));
  fallingTiles.forEach(f=>scene.remove(f.mesh)); fallingTiles.length = 0;
  if(announce){ banner('고가도로 복구!'); boing(240, 900, 0.5, 'triangle', 0.16); }
}
function bridgeSpawn(){
  const safe = tiles.filter(t=>t.safe);
  const t = safe.length ? safe[Math.floor(Math.random()*safe.length)] : null;
  return t ? {x:t.x, y:BR_Y + 2.4, z:t.z} : {x:0, y:BR_Y+3, z:0};
}
function bridgeAI(g, dt){
  const a = g.ai, p = g.ctrl.position;
  a.timer -= dt; a.jumpCd -= dt;
  if(a.timer <= 0 || !a.tile || !a.tile.alive ||
     Math.hypot(a.tile.x-p.x, a.tile.z-p.z) < 1.8){
    a.tile = pickTileNear(g, ()=>true, 3.2, 7.6, 3.5);
    a.timer = rand(1.2, 2.6);
  }
  let dx, dz;
  if(a.tile){ dx = a.tile.x - p.x; dz = a.tile.z - p.z; }
  else { dx = -p.x; dz = -p.z; }
  let dl = Math.hypot(dx, dz) || 1; dx/=dl; dz/=dl;
  let throttle = 1;
  // 지금 밟고 있는 발판 중심으로 살짝 당겨 길 가운데로 붙는다
  const home = nearestTile(p.x, p.z, p.y);
  if(home && home.dist > 0.5){
    const hx = (home.tile.x-p.x)/home.dist, hz = (home.tile.z-p.z)/home.dist;
    const w = clamp((home.dist - 0.5)/BR_R, 0, 1) * 1.5;
    dx += hx*w; dz += hz*w;
    dl = Math.hypot(dx, dz) || 1; dx/=dl; dz/=dl;
  }
  // 앞이 허공이면 속도를 줄이고 발판 쪽으로 방향을 튼다
  const probe = nearestTile(p.x + dx*3.4, p.z + dz*3.4, p.y);
  if(!probe || probe.dist > BR_R*0.9){
    throttle = 0.42;
    if(home && home.dist > 0.3){
      dx = (home.tile.x - p.x); dz = (home.tile.z - p.z);
      dl = Math.hypot(dx, dz) || 1; dx/=dl; dz/=dl;
    }
  }
  // 무너지는 중인 발판 피하기
  for(let i=0;i<tiles.length;i++){
    const t = tiles[i];
    if(!t.dying || !t.alive) continue;
    const ox = p.x-t.x, oz = p.z-t.z, d = Math.hypot(ox, oz);
    if(d < BR_R*1.4 && d > 0.01){ const w = (BR_R*1.4-d)/(BR_R*1.4)*2.0; dx += ox/d*w; dz += oz/d*w; }
  }
  const l2 = Math.hypot(dx, dz) || 1;
  let jump = false;
  if(a.jumpCd <= 0 && g.grounded){ a.jumpCd = rand(3, 8); jump = Math.random() < 0.3; }
  applyMove(g, dx/l2*throttle, dz/l2*throttle, false, jump, dt);
}

/* ===================================================================
   찰흙 캐릭터
   =================================================================== */
function clayGeo(geo, amt){
  amt = (amt === undefined) ? 0.09 : amt;
  const p = geo.attributes.position;
  const h = (x,y,z)=>{ const n = Math.sin(x*127.1 + y*311.7 + z*74.7)*43758.5453; return n - Math.floor(n); };
  for(let i=0;i<p.count;i++){
    const x=p.getX(i), y=p.getY(i), z=p.getZ(i);
    const f = 1 + (h(x,y,z)-0.5)*amt*2;
    p.setXYZ(i, x*f, y*f, z*f);
  }
  p.needsUpdate = true; geo.computeVertexNormals();
  return geo;
}
const blobGeo = clayGeo(new THREE.SphereGeometry(1, 11, 9));
function clayMat(color, shiny){
  return new THREE.MeshStandardMaterial({color, roughness: shiny?0.45:0.78, metalness:0.02, flatShading:true});
}
const outlineMat = new THREE.MeshBasicMaterial({color:0x2a1a12, side:THREE.BackSide});
function blob(color, sx, sy, sz, outline){
  const m = new THREE.Mesh(blobGeo, clayMat(color));
  m.scale.set(sx, sy, sz); m.castShadow = true;
  m.userData.base = new THREE.Vector3(sx, sy, sz);
  if(outline){ const o = new THREE.Mesh(blobGeo, outlineMat); o.scale.setScalar(1.09); m.add(o); }
  return m;
}

    const cap = blob(C.hair, headR*1.0, headR*0.55, headR*1.0);

  }
  if(C.head === 'tuft'){
    const t = new THREE.Mesh(clayGeo(new THREE.ConeGeometry(headR*0.28, headR*0.9, 6), .15), hairMat);
    t.position.set(headR*0.18, headR*1.2, 0); t.rotation.z = -0.5; M.head.add(t);
  }
  if(C.head === 'strand'){
    for(let i=0;i<4;i++){
      const t = new THREE.Mesh(clayGeo(new THREE.ConeGeometry(headR*0.16, headR*1.5, 5), .2), hairMat);
      t.position.set(Math.cos(i*1.7)*headR*0.4, headR*1.3, Math.sin(i*1.7)*headR*0.4);
      t.rotation.z = Math.cos(i)*0.6; t.rotation.x = Math.sin(i)*0.6; M.head.add(t);
    }
  }
  if(C.head === 'mustache'){
    const m2 = new THREE.Mesh(clayGeo(new THREE.BoxGeometry(headR*0.9, headR*0.22, headR*0.2), .25), hairMat);
    m2.position.set(0, -headR*0.16, headR*0.86); M.head.add(m2);
  }
  if(C.head === 'cap'){
    const brim = blob(C.hair, headR*1.15, headR*0.14, headR*1.15);
    brim.position.y = headR*0.62; M.head.add(brim);
    const cone = new THREE.Mesh(clayGeo(new THREE.ConeGeometry(headR*0.95, headR*1.3, 9), .1), hairMat);
    cone.position.y = headR*1.25; M.head.add(cone);
    const ball = blob(0xd9b32e, headR*0.22, headR*0.22, headR*0.22);
    ball.position.y = headR*1.95; M.head.add(ball);
  }
  if(C.head === 'antenna'){
    [-1,1].forEach(sgn=>{
      const stalk = new THREE.Mesh(clayGeo(new THREE.CylinderGeometry(headR*0.07, headR*0.07, headR*0.9, 6), .2), hairMat);
      stalk.position.set(sgn*headR*0.4, headR*1.1, 0); stalk.rotation.z = -sgn*0.35; M.head.add(stalk);
      const ball = blob(0xd9b32e, headR*0.2, headR*0.2, headR*0.2);
      ball.position.set(sgn*headR*0.72, headR*1.5, 0); M.head.add(ball);
    });
  }
  Object.keys(M).forEach(k=>scene.add(M[k]));

  g.ring = new THREE.Mesh(new THREE.TorusGeometry(0.55*s, 0.07*s, 6, 22),
    new THREE.MeshBasicMaterial({color:C.shirt}));
  g.ring.rotation.x = Math.PI/2; scene.add(g.ring);

  g.ctrl = new CANNON.Body({mass:6*mm, material:matCtrl, shape:new CANNON.Sphere(ctrlR),
    linearDamping:0, angularDamping:0.9,
    collisionFilterGroup:G_CTRL, collisionFilterMask:-1});
  g.ctrl.fixedRotation = true; g.ctrl.updateMassProperties();
  g.ctrl.guy = g;
  g.ctrl.position.set(0, 4, 0);
  world.addBody(g.ctrl);
  g.ctrl.addEventListener('collide', e=>onGuyCollide(g, e));
  return g;
}

// ---- 액티브 래그돌 제어(PD) ------------------------------------------
function pdPull(body, tx, ty, tz, k, d, maxF){
  const m = body.mass;
  let fx = (tx - body.position.x)*k*m - body.velocity.x*d*m;
  let fy = (ty - body.position.y)*k*m - body.velocity.y*d*m;
  let fz = (tz - body.position.z)*k*m - body.velocity.z*d*m;
  const mag = Math.sqrt(fx*fx+fy*fy+fz*fz);
  if(mag > maxF){ const s = maxF/mag; fx*=s; fy*=s; fz*=s; }
  body.force.x += fx; body.force.y += fy; body.force.z += fz;
}
const _q = new CANNON.Quaternion(), _qi = new CANNON.Quaternion(), _qd = new CANNON.Quaternion();
const _axis = new CANNON.Vec3(0,1,0);
function alignTo(body, yaw, k, d){
  _q.setFromAxisAngle(_axis, yaw);
  body.quaternion.conjugate(_qi);
  _q.mult(_qi, _qd); _qd.normalize();
  let angle = 2*Math.acos(clamp(_qd.w, -1, 1));
  const s = Math.sqrt(Math.max(1e-9, 1-_qd.w*_qd.w));
  const ax = _qd.x/s, ay = _qd.y/s, az = _qd.z/s;
  if(angle > Math.PI) angle -= 2*Math.PI;
  const m = body.mass;
  body.torque.x += (ax*angle*k - body.angularVelocity.x*d)*m;
  body.torque.y += (ay*angle*k - body.angularVelocity.y*d)*m;
  body.torque.z += (az*angle*k - body.angularVelocity.z*d)*m;
}
function driveGuy(g, dt){
  if(g.koTimer > 0) return;
  const D = g.D, dim = g.dim, st = g.style;
  const r = g.standRamp * st.stiff;
  const C = g.ctrl.position;
  const hx = C.x, hy = C.y + dim.hipOff, hz = C.z;
  const sp = g.moveSpeed;
  g.wobT += dt;
  g.walkPhase += dt * (2.0 + sp*1.15);
  const sw = Math.sin(g.walkPhase);
  const stride = clamp(sp*0.045, 0.08, 0.5) * st.limb;
  const yaw = g.faceAngle;
  const fwd = {x:Math.sin(yaw), z:Math.cos(yaw)};
  const side = {x:Math.cos(yaw), z:-Math.sin(yaw)};
  const T = g.wobT;
  const nz = (f,p,a)=> Math.sin(T*f+p)*a + Math.sin(T*f*1.7+p*2.3)*a*0.5;

  pdPull(D.pelvis, hx + nz(2.1,0,0.05), hy + Math.sin(g.walkPhase*2)*0.05 + nz(3.3,1,0.04),
                   hz + nz(1.7,2,0.05), 240*r, 17, 800);
  alignTo(D.pelvis, yaw, 8*r, 2.0);
  pdPull(D.chest, hx + side.x*sw*0.13 + nz(1.9,0.7,0.10),
                  hy + dim.chestUp + nz(2.7,1.3,0.05),
                  hz + side.z*sw*0.13 + nz(2.3,2.1,0.10), 140*r, 12, 600);
  alignTo(D.chest, yaw, 5.5*r, 1.6);
  pdPull(D.head, hx + side.x*sw*0.18 + nz(1.5,0.4,0.14),
                 hy + dim.headUp + nz(3.1,2.6,0.06),
                 hz + side.z*sw*0.18 + nz(1.3,1.9,0.14), 95*r, 9, 320);
  const feet = [[D.shinL,-1,sw],[D.shinR,1,-sw]];
  feet.forEach(a=>{
    const leg = a[0], s2 = a[1], ph = a[2];
    const lift = Math.max(0, ph) * 0.34 * clamp(sp*0.12, 0.15, 1) * st.limb;
    const fx2 = hx + side.x*(dim.legX*s2*1.4) + fwd.x*(ph*stride) + nz(2.9, s2*2, 0.06);
    const fz2 = hz + side.z*(dim.legX*s2*1.4) + fwd.z*(ph*stride) + nz(2.5, s2*3, 0.06);
    pdPull(leg, fx2, hy - dim.footDrop + lift, fz2, 80*r, 10, 240);
    alignTo(leg, yaw, 2.2*r, 0.9);
  });
  [[D.thighL,-1],[D.thighR,1]].forEach(a=>{
    const leg = a[0], s2 = a[1];
    pdPull(leg, hx + side.x*dim.legX*s2, hy - dim.footDrop*0.45, hz + side.z*dim.legX*s2, 28*r, 6, 110);
  });
  const hands = [[D.armLL,-1,-sw],[D.armLR,1,sw]];
  hands.forEach(a=>{
    const arm = a[0], s2 = a[1], ph = a[2];
    const px = hx + side.x*(dim.shoulderX*1.5*s2) + fwd.x*(ph*stride*1.8) + nz(3.7, s2*1.4, 0.12);
    const pz = hz + side.z*(dim.shoulderX*1.5*s2) + fwd.z*(ph*stride*1.8) + nz(3.1, s2*2.7, 0.12);
    const py = hy + dim.chestUp*0.2 + (g.poseTimer>0 ? dim.headUp*1.1 : 0) + (g.grounded?0:0.5) + nz(2.2, s2, 0.10);
    pdPull(arm, px, py, pz, (g.poseTimer>0?85:26)*r, 6, 170);
  });
  g.standRamp = Math.min(1, g.standRamp + dt*1.6);
  g.spasmTimer -= dt;
  if(g.spasmTimer <= 0){
    g.spasmTimer = rand(2.5, 6);
    const list = [D.armUL, D.armUR, D.armLL, D.armLR, D.thighL, D.thighR, D.head, D.chest];
    const b = list[Math.floor(Math.random()*list.length)];
    b.applyImpulse(new CANNON.Vec3(rand(-4,4), rand(1,5), rand(-4,4)), new CANNON.Vec3(0,0,0));
    b.angularVelocity.set(rand(-10,10), rand(-10,10), rand(-10,10));
  }
}
function moldGuyAt(g, x, groundY, z){
  const D = g.D, dim = g.dim;
  const set = (b, ox, oy)=>{
    b.position.set(x+ox, groundY+oy, z);
    b.velocity.set(0,0,0); b.angularVelocity.set(0,0,0);
    b.quaternion.set(0,0,0,1); b.force.set(0,0,0); b.torque.set(0,0,0);
  };
  const base = dim.pelvisC;
  set(D.pelvis, 0, base);
  set(D.chest,  0, base + dim.chestUp);
  set(D.head,   0, base + dim.headUp);
  set(D.armUL, -dim.shoulderX, base + dim.chestUp*0.75);
  set(D.armUR,  dim.shoulderX, base + dim.chestUp*0.75);
  set(D.armLL, -dim.shoulderX, base + dim.chestUp*0.2);
  set(D.armLR,  dim.shoulderX, base + dim.chestUp*0.2);
  set(D.thighL,-dim.legX, dim.thighC);
  set(D.thighR, dim.legX, dim.thighC);
  set(D.shinL, -dim.legX, dim.shinC);
  set(D.shinR,  dim.legX, dim.shinC);
  g.standRamp = 0.25;
}
function knockOutGuy(g, impulse){
  if(g.koTimer > 0) return;
  g.koTimer = 2.5; g.standRamp = 0; g.knockdowns++;
  if(impulse) g.D.chest.applyImpulse(impulse, new CANNON.Vec3(0,0.1,0));
  g.bodies.forEach(b=>b.angularVelocity.set(rand(-10,10), rand(-10,10), rand(-10,10)));
  g.ctrlRemovePending = true;   // 충돌 콜백 도중엔 바디를 못 지운다
}
function recoverGuy(g){
  g.koTimer = 0; g.ctrlRemovePending = false;
  const p = g.D.pelvis.position;
  g.ctrl.position.set(p.x, Math.max(p.y - g.dim.hipOff, g.dim.ctrlR) + 0.3, p.z);
  g.ctrl.velocity.set(0,0,0);
  if(world.bodies.indexOf(g.ctrl) < 0) world.addBody(g.ctrl);
  g.standRamp = 0; g.koCooldown = 0.9;
}
function flushGuy(g){
  if(g.ctrlRemovePending){
    g.ctrlRemovePending = false;
    if(world.bodies.indexOf(g.ctrl) >= 0) world.remove(g.ctrl);
  }
}
function guardGuy(g){
  const pv = g.D.pelvis.position;
  let bad = false;
  const lim = 9 * g.style.scale * g.style.scale * (g.style.limb>1.2?2.2:1);
  for(let i=0;i<g.bodies.length;i++){
    const b = g.bodies[i], p = b.position, v = b.velocity;
    if(!isFinite(p.x) || !isFinite(p.y) || !isFinite(p.z)){ bad = true; break; }
    const dx=p.x-pv.x, dy=p.y-pv.y, dz=p.z-pv.z;
    if(dx*dx+dy*dy+dz*dz > lim){ bad = true; break; }
    const sp = Math.sqrt(v.x*v.x+v.y*v.y+v.z*v.z);
    if(sp > 55){ const k = 55/sp; v.x*=k; v.y*=k; v.z*=k; }
    const av = b.angularVelocity, aw = Math.sqrt(av.x*av.x+av.y*av.y+av.z*av.z);
    if(aw > 30){ const k = 30/aw; av.x*=k; av.y*=k; av.z*=k; }
  }
  if(!bad && g.koTimer <= 0){
    const c = g.ctrl.position;
    const dx=pv.x-c.x, dy=pv.y-(c.y+g.dim.hipOff), dz=pv.z-c.z;
    if(dx*dx+dy*dy+dz*dz > 25) bad = true;
  }
  if(bad){
    const c = g.ctrl.position;
    moldGuyAt(g, c.x, c.y - g.dim.ctrlR, c.z);
    g.standRamp = 0.2;
  }
}
function syncGuy(g){
  const br = 1 + Math.sin(g.walkPhase*3.1)*0.06;
  for(const k in g.D){
    const b = g.D[k], m = g.M[k];
    if(!m) continue;
    m.position.copy(b.position);
    m.quaternion.copy(b.quaternion);
    const sp = Math.min(1, Math.hypot(b.velocity.x, b.velocity.y, b.velocity.z)/18);
    let st = 1 + sp*0.30, sq = 1 - sp*0.14;
    if(k === 'chest'){ st *= br; sq /= br; }
    else if(k === 'pelvis'){ st /= br; sq *= br; }
    const base = m.userData.base;
    if(base) m.scale.set(base.x*sq, base.y*st, base.z*sq);
    else m.scale.set(sq, st, sq);
  }
  const p = g.D.pelvis.position;
  let ringY = 0.09;
  if(currentMap && currentMap.ringY) ringY = currentMap.ringY(p.y);
  g.ring.position.set(p.x, ringY, p.z);
  g.ring.visible = p.y > currentMap.killY + 2;
}
function respawnGuy(g, spot){
  const s = spot || currentMap.spawn();
  if(world.bodies.indexOf(g.ctrl) < 0) world.addBody(g.ctrl);
  g.ctrl.position.set(s.x, s.y, s.z);
  g.ctrl.velocity.set(0,0,0);
  moldGuyAt(g, s.x, s.y - g.dim.ctrlR, s.z);
  g.koTimer = 0; g.ctrlRemovePending = false; g.standRamp = 0.3; g.koCooldown = 1.8;
  g.moveSpeed = 0; g.ai.tile = null;
}

const guys = STYLES.map(st=>buildGuy(st));
let player = guys[0];

function onGuyCollide(g, e){
  const other = e.body;
  if(!other) return;
  if(other.tile){ startTileFall(other.tile); return; }
  if(other.isPad){
    if(g.ctrl.velocity.y < 2){
      g.ctrl.velocity.y = other.padPower * g.style.jump;
      g.D.chest.velocity.y += other.padPower*0.5;
      if(g === player){ style += 5; boing(300, 1200, 0.25, 'square', 0.12); confetti(g.ctrl.position, 10); }
    }
    return;
  }
  if(!playing || g.koTimer > 0 || g.koCooldown > 0 || !other.isHazard) return;
  const rel = Math.abs(e.contact.getImpactVelocityAlongNormal());
  if(rel < 4.5) return;
  const dir = new CANNON.Vec3(g.ctrl.position.x - other.position.x, 0,
                              g.ctrl.position.z - other.position.z);
  if(dir.norm() < 0.1) dir.set(rand(-1,1), 0, rand(-1,1));
  dir.normalize();
  const pw = (other.hazardPower || 1) / Math.sqrt(g.style.massMul);
  const power = clamp(rel, 5, 22) * 2.2 * pw;
  knockOutGuy(g, new CANNON.Vec3(dir.x*power, 20*pw, dir.z*power));
  if(g === player){
    knockdowns++; style += 50;
    confetti(g.ctrl.position, 26);
    boing(700, 60, 0.45, 'sawtooth', 0.2);
    const cries = ['으아악!','꺄악!','뭉개졌다!','안 돼애애', other.hazardName + '에 맞았다!'];
    yell(cries[Math.floor(Math.random()*cries.length)]);
  }
}

function applyMove(g, dx, dz, sprint, wantJump, dt){
  const st = g.style;
  const SPEED = 14 * st.speed * (currentMap.speedMul || 1) * (sprint ? 1.4 : 1);
  const accel = g.grounded ? 15 : 8;
  const v = g.ctrl.velocity;
  const f = 1-Math.exp(-accel*dt);
  v.x = lerp(v.x, dx*SPEED, f);
  v.z = lerp(v.z, dz*SPEED, f);
  g.moveSpeed = Math.hypot(v.x, v.z);
  if(g.moveSpeed > 0.8) g.faceAngle = lerp(g.faceAngle, Math.atan2(v.x, v.z), 1-Math.pow(0.002, dt));
  if(wantJump){
    if(g.coyote > 0){
      v.y = 15.5 * st.jump; g.coyote = 0;
      g.D.chest.velocity.y += 6; g.D.head.velocity.y += 4;
      if(g === player) boing(420, 900, 0.14, 'square', 0.1);
      return 'jump';
    } else if(!g.posedThisJump){
      g.posedThisJump = true; g.poseTimer = 0.7;
      v.y += 5 * st.jump;
      g.D.armLL.applyImpulse(new CANNON.Vec3(rand(-3,3), 7, rand(-3,3)), new CANNON.Vec3(0,0,0));
      g.D.armLR.applyImpulse(new CANNON.Vec3(rand(-3,3), 7, rand(-3,3)), new CANNON.Vec3(0,0,0));
      return 'pose';
    }
  }
  return null;
}
function updateGrounded(g){
  g.grounded = false;
  const th = -g.dim.ctrlR*0.55;
  for(let i=0;i<world.contacts.length;i++){
    const c = world.contacts[i];
    if(c.bi === g.ctrl && c.ri.y < th){ g.grounded = true; break; }
    if(c.bj === g.ctrl && c.rj.y < th){ g.grounded = true; break; }
  }
}
function playerInput(g, dt){
  let ix = (keys['KeyD']?1:0) - (keys['KeyA']?1:0);
  let iz = (keys['KeyS']?1:0) - (keys['KeyW']?1:0);
  const len = Math.hypot(ix, iz);
  if(len > 0){ ix/=len; iz/=len; }
  const sn = Math.sin(camYaw), cs = Math.cos(camYaw);
  const r = applyMove(g, ix*cs - iz*sn, ix*sn + iz*cs,
                      keys['ShiftLeft']||keys['ShiftRight'], jumpPressed, dt);
  if(r === 'pose'){
    style += 15; confetti(g.ctrl.position, 8);
    boing(900, 300, 0.2, 'triangle', 0.09); yell('멋진 포즈!');
  }
}

// -------------------------------------------------------- 미니맵 / 순위판
function drawMap(){
  const S = 264, half = S/2, R = currentMap.mapR;
  const k = half/(R+3);
  mapCtx.clearRect(0,0,S,S);
  mapCtx.fillStyle = '#e9d7b4'; mapCtx.fillRect(0,0,S,S);
  mapCtx.strokeStyle = '#1a110a'; mapCtx.lineWidth = 6;
  mapCtx.beginPath(); mapCtx.arc(half, half, R*k, 0, 7); mapCtx.stroke();
  const put = (x,z,r,color)=>{
    mapCtx.fillStyle = color; mapCtx.beginPath();
    mapCtx.arc(half + x*k, half + z*k, r, 0, 7); mapCtx.fill();
  };
  if(currentMap.hasTiles){
    const L = currentMap.hasLayers ? tileLayerOf(player.D.pelvis.position.y - 0.4) : -1;
    for(let i=0;i<tiles.length;i++){
      const t = tiles[i];
      if(!t.alive || (L >= 0 && t.layer !== L)) continue;
      const col = t.dying ? '#d94f33' :
                  (t.safe ? '#7ff0e0' : hex(LAYER_COLORS[t.colorIdx % LAYER_COLORS.length]));
      put(t.x, t.z, t.vr*k*0.78, col);
    }
  } else {
    plateaus.forEach(p=>{
      mapCtx.fillStyle = 'rgba(47,174,122,.4)'; mapCtx.beginPath();
      mapCtx.arc(half+p.x*k, half+p.z*k, p.r*k, 0, 7); mapCtx.fill(); });
    hazards.forEach(h=>{
      if(h.kind==='duck') put(h.x, h.z, 5, '#c9820f');
      else if(h.kind==='bump') put(h.x, h.z, 3, '#8f66d6');
      else if(h.kind==='arm') put(h.x, h.z, 4, '#c43f68');
    });
    put(0,0,5,'#c9a222');
  }
  guys.forEach(g=>{
    const t = g.D.pelvis.position;
    if(g === player){ put(t.x, t.z, 7, '#1a110a'); put(t.x, t.z, 4.5, '#f6ecd6'); }
    else put(t.x, t.z, 5, hex(g.style.shirt));
  });
}
function drawBoard(){
  elBoard.innerHTML = '';
  const sorted = guys.slice().sort((a,b)=>(a.knockdowns+a.falls)-(b.knockdowns+b.falls));
  sorted.forEach(g=>{
    const row = document.createElement('div');
    row.className = 'brow' + (g === player ? ' me' : '') + (g.koTimer>0 ? ' ko' : '');
    const dot = document.createElement('div');
    dot.className = 'bdot'; dot.style.background = hex(g.style.shirt);
    const name = document.createElement('div');
    name.className = 'bname'; name.textContent = g.name + (g === player ? ' (나)' : '');
    const st = document.createElement('div');
    st.className = 'bstate';
    st.textContent = g.koTimer > 0 ? '뭉개짐' :
      (currentMap.hasLayers ? (tileLayerOf(g.D.pelvis.position.y-0.4)+1) + '층'
                            : (g.knockdowns + g.falls) + '회');
    row.appendChild(dot); row.appendChild(name); row.appendChild(st);
    elBoard.appendChild(row);
  });
}

// -------------------------------------------------------- 메인 루프
const clock = new THREE.Clock();
const camPos = new V3(0, 12, 24), camLook = new V3();

function stepGuys(dt){
  guys.forEach(g=>{
    g.koCooldown = Math.max(0, g.koCooldown - dt);
    g.poseTimer = Math.max(0, g.poseTimer - dt);
    if(g.koTimer > 0){
      g.koTimer -= dt; g.moveSpeed = 0;
      if(g.koTimer <= 0 && g.D.pelvis.position.y > currentMap.killY + 6) recoverGuy(g);
    } else {
      updateGrounded(g);
      if(g.grounded){ g.coyote = 0.14; g.posedThisJump = false; }
      else g.coyote = Math.max(0, g.coyote - dt);
      if(playing){
        if(g === player) playerInput(g, dt); else currentMap.ai(g, dt);
      } else g.moveSpeed = 0;
    }
    driveGuy(g, dt);
  });
  jumpPressed = false;
}
function afterStep(){ guys.forEach(g=>{ flushGuy(g); guardGuy(g); syncGuy(g); }); }

function step(dt){
  gameTime += dt;
  if(eventActive){
    eventLeft -= dt;
    if(eventActive.tick) eventActive.tick(dt);
    if(eventLeft <= 0){ eventActive.off(); eventActive = null; eventTimer = rand(9,15); }
  } else {
    eventTimer -= dt;
    if(eventTimer <= 0) triggerEvent();
  }
  if(keys['ArrowLeft'])  camTargetYaw += dt*2.0;
  if(keys['ArrowRight']) camTargetYaw -= dt*2.0;
  camYaw = lerp(camYaw, camTargetYaw, 1-Math.pow(0.0001, dt));

  hazards.forEach(h=>h.update && h.update(dt));
  stepGuys(dt);
  world.step(1/60, dt, 4);
  afterStep();
  if(currentMap.hasTiles) updateTiles(dt);

  pads.forEach(p=>{ p.t += dt; p.arrow.position.y = 1.3 + Math.sin(p.t*3)*0.25; });
  balls.forEach(b=>{
    if(b.body.position.y < -40){ b.body.position.set(rand(-25,25), 25, rand(-25,25)); b.body.velocity.set(0,0,0); }
    b.mesh.position.copy(b.body.position); b.mesh.quaternion.copy(b.body.quaternion);
  });
  for(let i=debris.length-1;i>=0;i--){
    const d = debris[i]; d.life -= dt;
    d.mesh.position.copy(d.body.position); d.mesh.quaternion.copy(d.body.quaternion);
    if(d.life <= 0 || d.body.position.y < -40){
      scene.remove(d.mesh); world.remove(d.body); debris.splice(i,1);
    }
  }
  guys.forEach(g=>{
    if(g.D.pelvis.position.y < currentMap.killY){
      if(g === player){
        lives--; drawLives(); boing(200, 60, 0.5, 'square', 0.2);
        if(lives <= 0){ gameOver(); return; }
        respawnGuy(g); yell('한 번 더!');
      } else { g.falls++; respawnGuy(g); }
    }
  });
  for(let i=confettiPool.length-1;i>=0;i--){
    const c = confettiPool[i];
    c.life -= dt; c.v.y -= 22*dt;
    c.m.position.addScaledVector(c.v, dt);
    c.m.rotation.x += c.rv.x*dt; c.m.rotation.y += c.rv.y*dt; c.m.rotation.z += c.rv.z*dt;
    if(c.life <= 0){ scene.remove(c.m); c.m.material.dispose(); confettiPool.splice(i,1); }
  }
  style += dt * 8;
  elTimer.innerHTML = gameTime.toFixed(1) + '초<small>버틴 시간</small>';
  elStyle.textContent = Math.floor(style);
  if(currentMap.hasTiles){
    if(currentMap.hasLayers)
      elMyLayer.textContent = (tileLayerOf(player.D.pelvis.position.y - 0.4) + 1) + '/' + HEX_LAYERS;
    elTileLeft.textContent = aliveTiles().length;
  }
  drawMap();
  boardTimer -= dt;
  if(boardTimer <= 0){ boardTimer = 0.3; drawBoard(); }
}
function updateCamera(dt){
  const t = player.D.pelvis.position;
  const desired = new V3(t.x - Math.sin(camYaw)*currentMap.camDist,
                         t.y + currentMap.camHigh,
                         t.z - Math.cos(camYaw)*currentMap.camDist);
  camPos.lerp(desired, 1-Math.pow(0.002, dt));
  camera.position.copy(camPos);
  camLook.lerp(new V3(t.x, t.y+0.9, t.z), 1-Math.pow(0.0005, dt));
  camera.lookAt(camLook);
  sunTarget.position.set(t.x, t.y*0.5, t.z);
  sun.position.set(t.x + 26, t.y*0.5 + 46, t.z + 20);
}
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 1/25);
  if(playing) step(dt);
  else {
    hazards.forEach(h=>h.update && h.update(dt));
    stepGuys(dt);
    world.step(1/60, dt, 3);
    afterStep();
    if(currentMap.hasTiles) updateTiles(dt);
    balls.forEach(b=>{ b.mesh.position.copy(b.body.position); b.mesh.quaternion.copy(b.body.quaternion); });
  }
  updateCamera(dt);
  renderer.render(scene, camera);
}

// -------------------------------------------------------- 맵 로드 / 선택 화면
function loadMap(map){
  clearArena();
  currentMap = map;
  map.build();
  elMapInfo.style.display = map.hasTiles ? 'block' : 'none';
  document.getElementById('layerWrap').style.display = map.hasLayers ? 'inline' : 'none';
  scene.fog.far = map.id === 'arena' ? 250 : (map.id === 'bridge' ? 230 : 200);
}
let pickedMap = 0, picked = 0;
const mapPicker = document.getElementById('mapPicker');
const picker = document.getElementById('picker');

function buildMapPicker(){
  mapPicker.innerHTML = '';
  MAPS.forEach((m, i)=>{
    const card = document.createElement('div');
    card.className = 'mcard' + (i===pickedMap ? ' sel' : '');
    const prev = document.createElement('div');
    prev.className = 'mprev';
    if(m.id === 'arena'){
      let html = '<i style="left:50%;top:50%;transform:translate(-50%,-50%);width:86px;height:86px;'+
                 'border-radius:50%;background:#d9a3ba;border:3px solid #1a110a"></i>';
      [[0,-26],[0,26],[-26,0],[26,0]].forEach(p=>{
        html += '<i style="left:calc(50% + '+p[0]+'px - 7px);top:calc(50% + '+p[1]+'px - 7px);'+
                'width:14px;height:14px;border-radius:50%;background:#d98a1c;border:2px solid #1a110a"></i>';
      });
      html += '<i style="left:50%;top:50%;transform:translate(-50%,-50%) rotate(24deg);width:60px;height:9px;'+
              'background:#dcb733;border:2px solid #1a110a;border-radius:5px"></i>';
      prev.innerHTML = html;
    } else if(m.id === 'hex'){
      const clip = 'clip-path:polygon(50% 0%,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%)';
      const cols = ['#d44a76','#d99903','#2fae7a'];
      let html = '';
      for(let row=0; row<3; row++){
        for(let col=0; col<5; col++){
          const ox = (col-2)*17 + (row%2?8.5:0), oy = (row-1)*15 + row*2;
          html += '<i style="left:calc(50% + '+ox+'px - 9px);top:calc(50% + '+oy+'px - 10px);'+
                  'width:18px;height:20px;background:'+cols[row]+';'+clip+'"></i>';
        }
      }
      prev.innerHTML = html;
    } else {
      // 갈래 고가도로: 가운데 허브에서 갈라졌다 다시 만나는 길
      const clip = 'clip-path:polygon(50% 0%,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%)';
      const hexAt = (x, y, c, glow)=>
        '<i style="left:calc(50% + '+x+'px - 7px);top:calc(50% + '+y+'px - 8px);width:14px;height:16px;'+
        'background:'+c+';'+clip+(glow?';box-shadow:0 0 7px 3px #7ff0e0':'')+'"></i>';
      let html = hexAt(0,0,'#7ff0e0',true);
      [-1,1].forEach(sgn=>{
        html += hexAt(sgn*15, 0, '#2fae7a');
        html += hexAt(sgn*29, -13, '#d99903') + hexAt(sgn*29, 13, '#d99903');
        html += hexAt(sgn*44, -13, '#d99903') + hexAt(sgn*44, 13, '#d99903');
        html += hexAt(sgn*58, 0, '#7ff0e0', true);
      });
      prev.innerHTML = html;
    }
    const nm = document.createElement('div'); nm.className='mname'; nm.textContent = m.name;
    const tg = document.createElement('div'); tg.className='mtag'; tg.textContent = m.tag;
    card.appendChild(prev); card.appendChild(nm); card.appendChild(tg);
    card.addEventListener('click', ()=>{
      if(pickedMap !== i){
        pickedMap = i; buildMapPicker(); loadMap(MAPS[i]);
        guys.forEach(g=>respawnGuy(g, currentMap.spawn()));
      }
      audioReady(); boing(500,900,0.12,'triangle',0.1);
    });
    mapPicker.appendChild(card);
  });
}
function buildPicker(){
  picker.innerHTML = '';
  STYLES.forEach((st, i)=>{
    const card = document.createElement('div');
    card.className = 'pick' + (i===picked ? ' sel' : '');
    const s = st.scale, w = st.width, lm = st.limb;
    const headD = 21*s*(st.headSize||1)*(st.id==='alien'?1.35:1);
    const bodyW = 28*s*w, bodyH = 28*s;
    const limbH = 24*s*lm, limbW = 7.5*s*w;
    const baseY = 90, legTop = baseY - limbH;
    const bodyBottom = legTop, bodyTop = bodyBottom - bodyH, headBottom = bodyTop;
    const fig = document.createElement('div');
    fig.className = 'fig';
    fig.innerHTML =
      '<i style="left:calc(50% - '+(bodyW*0.3+limbW/2)+'px);top:'+legTop+'px;width:'+limbW+'px;height:'+limbH+'px;background:'+hex(st.pants)+';border-radius:40%"></i>'+
      '<i style="left:calc(50% + '+(bodyW*0.3-limbW/2)+'px);top:'+legTop+'px;width:'+limbW+'px;height:'+limbH+'px;background:'+hex(st.pants)+';border-radius:40%"></i>'+
      '<i style="left:calc(50% - '+(bodyW/2+limbW*0.9)+'px);top:'+(bodyTop+6)+'px;width:'+limbW+'px;height:'+limbH+'px;background:'+hex(st.skin)+';border-radius:40%;transform:rotate(12deg)"></i>'+
      '<i style="left:calc(50% + '+(bodyW/2-limbW*0.1)+'px);top:'+(bodyTop+6)+'px;width:'+limbW+'px;height:'+limbH+'px;background:'+hex(st.skin)+';border-radius:40%;transform:rotate(-12deg)"></i>'+
      '<i style="left:calc(50% - '+(bodyW/2)+'px);top:'+bodyTop+'px;width:'+bodyW+'px;height:'+bodyH+'px;background:'+hex(st.shirt)+';border-radius:45% 45% 38% 38%"></i>'+
      '<i style="left:calc(50% - '+(headD/2)+'px);top:'+(headBottom-headD)+'px;width:'+headD+'px;height:'+headD+'px;background:'+hex(st.skin)+';border-radius:50%"></i>'+
      '<i style="left:calc(50% - '+(headD/2)+'px);top:'+(headBottom-headD-4)+'px;width:'+headD+'px;height:'+(headD*0.42)+'px;background:'+hex(st.hair)+';border-radius:50% 50% 20% 20%"></i>';
    card.appendChild(fig);
    const nm = document.createElement('div'); nm.className='pname'; nm.textContent = st.name;
    const tg = document.createElement('div'); tg.className='ptag'; tg.textContent = st.tag;
    const sc = document.createElement('div'); sc.className='pstat';
    sc.textContent = '속도 '+Math.round(st.speed*100)+' · 점프 '+Math.round(st.jump*100)+
                     ' · 흐물 '+Math.round((1/st.stiff)*100);
    card.appendChild(nm); card.appendChild(tg); card.appendChild(sc);
    card.addEventListener('click', ()=>{ picked = i; buildPicker(); audioReady(); boing(500,900,0.12,'triangle',0.1); });
    picker.appendChild(card);
  });
}

const startScreen = document.getElementById('startScreen');
const overScreen  = document.getElementById('overScreen');
function startGame(){
  audioReady();
  player = guys[picked];
  if(!currentMap || currentMap.id !== MAPS[pickedMap].id) loadMap(MAPS[pickedMap]);
  else if(currentMap.reset) currentMap.reset(false);
  playing = true; gameTime = 0; lives = 3; style = 0; knockdowns = 0;
  eventTimer = 8;
  if(eventActive){ eventActive.off(); eventActive = null; }
  world.gravity.y = -34;
  debris.forEach(d=>{ scene.remove(d.mesh); world.remove(d.body); }); debris.length = 0;
  guys.forEach(g=>{ g.knockdowns = 0; g.falls = 0; respawnGuy(g); });
  camTargetYaw = camYaw = Math.atan2(player.ctrl.position.x, player.ctrl.position.z) + Math.PI;
  drawLives(); drawBoard();
  startScreen.classList.add('hidden');
  overScreen.classList.add('hidden');
  banner(player.name + ', 살아남아라!');
}
function gameOver(){
  playing = false;
  best = Math.max(best, gameTime);
  document.getElementById('finalTime').textContent = gameTime.toFixed(1);
  document.getElementById('finalStyle').textContent = Math.floor(style);
  document.getElementById('bestTime').textContent = best.toFixed(1);
  const sorted = guys.slice().sort((a,b)=>(a.knockdowns+a.falls)-(b.knockdowns+b.falls));
  document.getElementById('finalBoard').innerHTML =
    '<b>' + currentMap.name + ' · 덜 뭉개진 순서</b><br>' + sorted.map((g,i)=>
      (i+1)+'위 ' + g.name + (g===player?' (나)':'') + ' — 뭉개짐 ' + g.knockdowns + '회, 추락 ' + g.falls + '회'
    ).join('<br>');
  const t = gameTime, myRank = sorted.indexOf(player)+1;
  const rank = t < 15 ? '반죽만도 못한 실력' : t < 35 ? '그럭저럭 말랑말랑' :
               t < 60 ? '중급 찰흙' : t < 90 ? '고무 오리의 친구' : '전설의 찰흙맨';
  document.getElementById('rank').textContent =
    rank + ' · 5인방 중 ' + myRank + '위 · 뭉개진 횟수 ' + knockdowns + '번';
  document.getElementById('overTitle').textContent =
    knockdowns > 6 ? '너무 많이 뭉개졌다!' : '떨어졌다!';
  overScreen.classList.remove('hidden');
  boing(300, 80, 0.8, 'sawtooth', 0.2);
}
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('retryBtn').addEventListener('click', ()=>{
  overScreen.classList.add('hidden');
  startScreen.classList.remove('hidden');
});

/* ---------------------------------------------------------------- 화면 밝기 */
const BRIGHT = [
  {name:'어둡게', exp:0.60, hemi:0.28, sun:0.52, amb:0.07, sky:0x2f5f85, fog:0x3f6f92, near:70},
  {name:'보통',   exp:0.85, hemi:0.45, sun:0.78, amb:0.12, sky:0x5aa8d8, fog:0x86bcd8, near:85},
  {name:'밝게',   exp:1.06, hemi:0.68, sun:1.00, amb:0.20, sky:0x8fd8ff, fog:0xb8e8ff, near:95}
];
let brightLevel = 1;
function applyBrightness(){
  const b = BRIGHT[brightLevel];
  renderer.toneMappingExposure = b.exp;
  hemi.intensity = b.hemi; sun.intensity = b.sun; amb.intensity = b.amb;
  scene.background.setHex(b.sky);
  scene.fog.color.setHex(b.fog); scene.fog.near = b.near;
  const btn = document.getElementById('bright');
  if(btn) btn.textContent = '밝기: ' + b.name;
}
function cycleBrightness(){
  brightLevel = (brightLevel + 1) % BRIGHT.length;
  applyBrightness();
  boing(600, 900, 0.1, 'triangle', 0.08);
}
document.getElementById('bright').addEventListener('click', e=>{
  e.preventDefault(); audioReady(); cycleBrightness();
});

// -------------------------------------------------------- 시작
loadMap(MAPS[0]);
guys.forEach((g,i)=>{
  const a = i/guys.length*Math.PI*2;
  respawnGuy(g, {x:Math.cos(a)*26, y:6, z:Math.sin(a)*26});
});
buildMapPicker(); buildPicker();
applyBrightness();
drawLives(); drawBoard(); drawMap();
animate();
</script>
