<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>말랑이 키우기</title>
    <style>
        :root {
            --bg-day: linear-gradient(135deg, #ffeaa7, #fab1a0);
            --bg-night: linear-gradient(135deg, #2d3436, #0984e3);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-color: #2d3436;
        }

        body {
            font-family: 'Jua', 'Apple SD Gothic Neo', sans-serif;
            background: var(--bg-day);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background 1s ease;
        }

        body.night {
            background: var(--bg-night);
            color: #dfe6e9;
        }

        .game-container {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-sizing: border-box;
            transition: background 0.3s ease, color 0.3s ease;
        }

        body.night .game-container {
            background: rgba(45, 52, 54, 0.9);
            color: #dfe6e9;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 24px;
            color: #ff7675;
        }

        .top-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.04);
            padding: 8px 12px;
            border-radius: 12px;
            margin-bottom: 12px;
            font-size: 14px;
            font-weight: bold;
        }
        body.night .top-info {
            background: rgba(255,255,255,0.08);
        }

        .exp-bar-container {
            background: rgba(0,0,0,0.08);
            border-radius: 8px;
            height: 10px;
            width: 100%;
            margin-bottom: 15px;
            overflow: hidden;
        }
        .exp-bar {
            height: 100%;
            background: #55efc4;
            width: 0%;
            transition: width 0.3s ease;
        }

        .pet-stage {
            position: relative;
            height: 160px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
        }

        .speech-bubble {
            background: #fff;
            color: #2d3436;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 13px;
            margin-bottom: 8px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.08);
            position: relative;
            max-width: 85%;
            word-break: break-all;
        }
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 5px 5px 0;
            border-style: solid;
            border-color: #fff transparent;
            display: block;
            width: 0;
        }

        .pet-avatar {
            font-size: 65px;
            animation: bounce 1.5s infinite ease-in-out;
            cursor: pointer;
            user-select: none;
            display: inline-block;
            width: 120px;
            height: 120px;
            overflow: hidden;
            border-radius: 50%;
            position: relative;
            background: transparent;
        }

        /* 공통 이미지 기본 스타일 */
        .pet-avatar img {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 130%;
            height: 130%;
            object-fit: contain;
            transform: translate(-50%, -50%);
        }

        /* 1단계 (빵숙이 로컬 이미지): 흰색 배경 제거를 위해 mix-blend-mode 및 필터 적용 */
        .pet-avatar img.stage-1 {
            mix-blend-mode: multiply;
            filter: contrast(140%) brightness(105%);
        }

        /* 2단계 (무지개 만두 말랑이): 흰색 배경 제거 */
        .pet-avatar img.stage-2 {
            mix-blend-mode: multiply;
            filter: contrast(130%) brightness(105%);
        }

        /* 3단계 (청사과 왁뿌볼) */
        .pet-avatar img.stage-3 {
            mix-blend-mode: multiply;
            filter: contrast(130%) brightness(105%);
        }

        body.night .pet-avatar img {
            mix-blend-mode: screen;
        }

        .pet-avatar.evolve-effect {
            animation: evolveAnim 0.6s ease;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes evolveAnim {
            0% { transform: scale(1) rotate(0deg); filter: brightness(1); }
            50% { transform: scale(1.4) rotate(15deg); filter: brightness(1.5) drop-shadow(0 0 15px #ffeaa7); }
            100% { transform: scale(1) rotate(0deg); filter: brightness(1); }
        }

        .sleeping {
            animation: sleepBounce 2.5s infinite ease-in-out;
        }
        @keyframes sleepBounce {
            0%, 100% { transform: translateY(0) rotate(-3deg); }
            50% { transform: translateY(4px) rotate(3deg); }
        }

        .stats-container {
            margin-bottom: 15px;
            text-align: left;
        }
        .stat-row {
            margin-bottom: 6px;
        }
        .stat-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 2px;
            font-weight: bold;
        }
        .gauge-bar-container {
            background: rgba(0,0,0,0.08);
            border-radius: 6px;
            height: 8px;
            overflow: hidden;
        }
        .gauge-bar {
            height: 100%;
            width: 70%;
            transition: width 0.3s ease, background-color 0.3s ease;
        }

        .action-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        .btn {
            background: #ff7675;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 5px rgba(0,0,0,0.1);
            transition: transform 0.1s, background 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            background: #d63031;
        }
        .btn:active {
            transform: translateY(1px);
        }
        .btn-heal {
            grid-column: span 2;
            background: #0984e3;
        }
        .btn-heal:hover { background: #74b9ff; }

        .btn-mini {
            grid-column: span 2;
            background: #00b894;
        }
        .btn-mini:hover { background: #55efc4; }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            width: 280px;
            color: #2d3436;
        }
        .rps-btns {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
        }
        .rps-btn {
            font-size: 28px;
            background: #f1f2f6;
            border: none;
            padding: 8px;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .rps-btn:hover { transform: scale(1.1); }
    </style>
</head>
<body>

    <div class="game-container">
        <h1 id="petNameTitle">🟢 말랑이</h1>
        
        <div class="top-info">
            <span id="levelInfo">단계: 알 (Lv.1)</span>
            <span id="timeInfo">🌞 낮</span>
        </div>

        <div class="exp-bar-container">
            <div class="exp-bar" id="expBar"></div>
        </div>

        <div class="pet-stage">
            <div class="speech-bubble" id="speechBubble">안녕! 나를 잘 돌봐줘!</div>
            <div class="pet-avatar" id="petAvatar">🥚</div>
        </div>

        <div class="stats-container">
            <div class="stat-row">
                <div class="stat-label"><span>포만감</span><span id="statHungerVal">70/100</span></div>
                <div class="gauge-bar-container"><div class="gauge-bar" id="gaugeHunger"></div></div>
            </div>
            <div class="stat-row">
                <div class="stat-label"><span>행복</span><span id="statHappyVal">70/100</span></div>
                <div class="gauge-bar-container"><div class="gauge-bar" id="gaugeHappy"></div></div>
            </div>
            <div class="stat-row">
                <div class="stat-label"><span>청결</span><span id="statCleanVal">70/100</span></div>
                <div class="gauge-bar-container"><div class="gauge-bar" id="gaugeClean"></div></div>
            </div>
            <div class="stat-row">
                <div class="stat-label"><span>에너지</span><span id="statEnergyVal">70/100</span></div>
                <div class="gauge-bar-container"><div class="gauge-bar" id="gaugeEnergy"></div></div>
            </div>
        </div>

        <div class="action-grid" id="actionGrid">
            <button class="btn" onclick="feedPet()">🍚 밥 주기</button>
            <button class="btn" onclick="playPet()">⚽ 놀아주기</button>
            <button class="btn" onclick="washPet()">🧼 씻기기</button>
            <button class="btn" onclick="sleepPet()">💤 재우기</button>
            <button class="btn btn-mini" onclick="openMiniGame()">🎮 가위바위보</button>
        </div>
    </div>

    <!-- 미니게임 모달 -->
    <div class="modal" id="rpsModal">
        <div class="modal-content">
            <h3>말랑이와 가위바위보!</h3>
            <p id="rpsResultText">무엇을 내겠습니까?</p>
            <div class="rps-btns">
                <button class="rps-btn" onclick="playRPS('rock')">✊</button>
                <button class="rps-btn" onclick="playRPS('paper')">✋</button>
                <button class="rps-btn" onclick="playRPS('scissors')">✌️</button>
            </div>
            <br>
            <button class="btn" onclick="closeMiniGame()" style="padding: 5px 12px; font-size: 12px; margin-top: 10px;">닫기</button>
        </div>
    </div>

<script>
    const state = {
        hunger: 70,
        happy: 70,
        clean: 70,
        energy: 70,
        exp: 0,
        level: 1,
        isSleeping: false,
        isSick: false,
        isNight: false
    };

    const stages = [
        { name: "알", type: "emoji", display: "🥚" },
        { name: "빵숙이 말랑이", type: "image", url: "file:///C:/Users/sycoding/Downloads/%EB%B9%B5%EC%88%99%EC%9D%B4.png", class: "stage-1" },
        { name: "무지개 만두 말랑이", type: "image", url: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSuxLQ90lvmoiC_W9m0CpT-PKZKEWzmYwHzHk_8h-27Ag&s", class: "stage-2" },
        { name: "청사과 왁뿌볼", type: "image", url: "https://shopping.toss.im/live/taca/ai/v2/YmExMDVm/QU9HWGg1V0gwdFlWRDFvZUdYMWEvM21nR1lRNkF2MWU4UDZoQ1VJUWg2MXI.png", class: "stage-3" }
    ];

    function setBubble(msg) {
        document.getElementById('speechBubble').innerText = msg;
    }

    function updateUI() {
        updateGauge('Hunger', state.hunger);
        updateGauge('Happy', state.happy);
        updateGauge('Clean', state.clean);
        updateGauge('Energy', state.energy);

        let currentStageIdx = Math.min(state.level - 1, stages.length - 1);
        let stageData = stages[currentStageIdx];
        document.getElementById('levelInfo').innerText = `단계: ${stageData.name} (Lv.${state.level})`;
        
        let expPercent = (state.exp % 1000) / 10;
        document.getElementById('expBar').style.width = `${expPercent}%`;
        document.getElementById('timeInfo').innerText = state.isNight ? "🌙 밤" : "🌞 낮";

        if (state.isNight) {
            document.body.classList.add('night');
        } else {
            document.body.classList.remove('night');
        }

        if (!state.isSick && (state.hunger <= 0 || state.happy <= 0 || state.clean <= 0 || state.energy <= 0)) {
            state.isSick = true;
            setBubble("몸이 너무 아파요... 🤒");
        }

        renderAvatar(stageData);
        updateActionButtons();
    }

    function renderAvatar(stageData) {
        const avatarEl = document.getElementById('petAvatar');
        
        if (state.isSick) {
            avatarEl.innerHTML = "🤒";
            avatarEl.className = "pet-avatar";
            return;
        }

        if (state.isSleeping) {
            avatarEl.innerHTML = "💤";
            avatarEl.className = "pet-avatar sleeping";
            return;
        }

        avatarEl.className = "pet-avatar";
        
        if (stageData.type === "emoji") {
            avatarEl.innerHTML = stageData.display;
        } else {
            avatarEl.innerHTML = `<img src="${stageData.url}" alt="${stageData.name}" class="${stageData.class}" onerror="this.onerror=null; this.parentNode.innerHTML='🟢';">`;
        }
    }

    function updateGauge(statName, val) {
        const bar = document.getElementById(`gauge${statName}`);
        const valText = document.getElementById(`stat${statName}Val`);
        let clampedVal = Math.max(0, Math.round(val));
        bar.style.width = `${clampedVal}%`;
        valText.innerText = `${clampedVal}/100`;

        if (clampedVal > 50) bar.style.backgroundColor = "#55efc4";
        else if (clampedVal > 20) bar.style.backgroundColor = "#ffeaa7";
        else bar.style.backgroundColor = "#ff7675";
    }

    function updateActionButtons() {
        const grid = document.getElementById('actionGrid');
        if (state.isSick) {
            grid.innerHTML = `<button class="btn btn-heal" onclick="healPet()">💊 치료하기</button>`;
        } else {
            grid.innerHTML = `
                <button class="btn" onclick="feedPet()">🍚 밥 주기</button>
                <button class="btn" onclick="playPet()">⚽ 놀아주기</button>
                <button class="btn" onclick="washPet()">🧼 씻기기</button>
                <button class="btn" onclick="sleepPet()">💤 ${state.isSleeping ? '일어나기' : '재우기'}</button>
                <button class="btn btn-mini" onclick="openMiniGame()">🎮 가위바위보</button>
            `;
        }
    }

    function addExp(amount) {
        if (state.isSick) return;
        state.exp += amount;
        let newLevel = Math.floor(state.exp / 1000) + 1;
        if (newLevel > state.level) {
            state.level = newLevel;
            let currentStage = stages[Math.min(state.level - 1, stages.length - 1)];
            
            const avatarEl = document.getElementById('petAvatar');
            avatarEl.classList.add('evolve-effect');
            setTimeout(() => avatarEl.classList.remove('evolve-effect'), 600);

            alert(`말랑이(이)가 진화했다! [${currentStage.name}] (으)로 성장했습니다! ✨`);
            setBubble(`우와! 내가 [${currentStage.name}] (으)로 진화했어! 🎉`);
        }
    }

    function feedPet() {
        if (state.isSleeping) return wakeUpWarning();
        state.hunger = Math.min(100, state.hunger + 20);
        state.happy = Math.min(100, state.happy + 5);
        if (state.energy > 0) state.energy = Math.min(100, state.energy + 5);
        
        setBubble("냠냠! 맛있는 밥이다~ 🍚");
        addExp(10);
        updateUI();
    }

    function playPet() {
        if (state.isSleeping) return wakeUpWarning();
        state.happy = Math.min(100, state.happy + 20);
        state.hunger = Math.max(0, state.hunger - 10);
        state.energy = Math.max(0, state.energy - 15);
        state.clean = Math.max(0, state.clean - 10);

        setBubble("신나게 놀았다! 😆");
        addExp(10);
        updateUI();
    }

    function washPet() {
        if (state.isSleeping) return wakeUpWarning();
        state.clean = Math.min(100, state.clean + 20);
        state.happy = Math.max(0, state.happy - 5);

        setBubble("뽀득뽀득 깨끗해졌어요! 🧼");
        addExp(10);
        updateUI();
    }

    function sleepPet() {
        state.isSleeping = !state.isSleeping;
        if (state.isSleeping) {
            setBubble("쿨쿨... Zzz 💤");
        } else {
            setBubble("개운하게 일어났다! ☀️");
        }
        updateUI();
    }

    function healPet() {
        state.isSick = false;
        state.hunger = 50;
        state.happy = 50;
        state.clean = 50;
        state.energy = 50;
        setBubble("건강을 되찾았어요! 고마워요 💚");
        updateUI();
    }

    function wakeUpWarning() {
        setBubble("지금은 자고 있어요! 💤");
    }

    function openMiniGame() {
        if (state.isSleeping) return wakeUpWarning();
        document.getElementById('rpsModal').style.display = 'flex';
        document.getElementById('rpsResultText').innerText = "무엇을 내겠습니까?";
    }

    function closeMiniGame() {
        document.getElementById('rpsModal').style.display = 'none';
    }

    function playRPS(playerChoice) {
        const choices = ['rock', 'paper', 'scissors'];
        const rpsEmojis = { rock: '✊', paper: '✋', scissors: '✌️' };
        const petChoice = choices[Math.floor(Math.random() * choices.length)];
        
        let resultMsg = `말랑이: ${rpsEmojis[petChoice]} VS 나: ${rpsEmojis[playerChoice]} - `;

        if (playerChoice === petChoice) {
            resultMsg += "비겼습니다! (행복 변화 없음)";
        } else if (
            (playerChoice === 'rock' && petChoice === 'scissors') ||
            (playerChoice === 'paper' && petChoice === 'rock') ||
            (playerChoice === 'scissors' && petChoice === 'paper')
        ) {
            resultMsg += "이겼습니다! 🎉 (행복 +15)";
            state.happy = Math.min(100, state.happy + 15);
            addExp(15);
        } else {
            resultMsg += "졌습니다... 😢 (행복 +5)";
            state.happy = Math.min(100, state.happy + 5);
        }

        document.getElementById('rpsResultText').innerText = resultMsg;
        updateUI();
    }

    let tickCount = 0;
    setInterval(() => {
        if (!state.isSick) {
            let energyDec = state.isNight ? 5 : 3;
            let normalDec = 2.5;

            if (state.isSleeping) {
                state.energy = Math.min(100, state.energy + 8);
                state.hunger = Math.max(0, state.hunger - 1);
            } else {
                state.hunger = Math.max(0, state.hunger - normalDec);
                state.happy = Math.max(0, state.happy - normalDec);
                state.clean = Math.max(0, state.clean - normalDec);
                state.energy = Math.max(0, state.energy - energyDec);
            }
        }

        tickCount++;
        if (tickCount >= 20) {
            tickCount = 0;
            state.isNight = !state.isNight;
        }

        updateUI();
    }, 1500);

    updateUI();
</script>

</body>
</html>
