<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>귀여운 드래곤 키우기 🐉</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Jua', sans-serif;
            background: linear-gradient(135deg, #fdfcfb 0%, #e2d1c3 100%);
            background-color: #fff0f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #5d4037;
        }

        .game-container {
            width: 420px;
            background: #ffffff;
            border-radius: 35px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            border: 6px solid #ffccbc;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .screen {
            padding: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        .hidden {
            display: none !important;
        }

        /* 상점 화면 스타일 */
        #shop-screen h1 {
            font-size: 26px;
            color: #ff7043;
            margin-bottom: 20px;
            text-align: center;
        }

        .egg-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        .egg-card {
            background: #fff3e0;
            border: 3px dashed #ffb74d;
            border-radius: 20px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: transform 0.2s;
        }

        .egg-card:hover {
            transform: scale(1.03);
        }

        .egg-emoji-icon {
            font-size: 45px;
            width: 60px;
            text-align: center;
        }

        .egg-info {
            flex-grow: 1;
            margin-left: 15px;
        }

        .egg-name {
            font-size: 18px;
            color: #e65100;
        }

        .select-btn {
            background: #ff7043;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 15px;
            font-family: 'Jua', sans-serif;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px #d84315;
            transition: all 0.1s;
        }

        .select-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 #d84315;
        }

        /* 메인 게임 화면 스타일 */
        #main-screen {
            background: linear-gradient(to bottom, #e1f5fe, #fff9c4);
        }

        .top-status {
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            padding: 12px 15px;
            border-radius: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .level-exp-info {
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            margin-bottom: 5px;
            color: #0277bd;
        }

        .progress-bar-container {
            width: 100%;
            background: #b0bec5;
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: #4caf50;
            width: 0%;
            transition: width 0.3s;
        }

        /* 펫 디스플레이 */
        .pet-display-area {
            position: relative;
            height: 210px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }

        .speech-bubble {
            background: #ffffff;
            border: 2px solid #81d4fa;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 15px;
            color: #01579b;
            margin-bottom: 12px;
            position: relative;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            max-width: 270px;
            text-align: center;
        }

        .pet-avatar {
            font-size: 90px;
            animation: bounce 1.5s infinite ease-in-out;
            filter: drop-shadow(0 10px 8px rgba(0,0,0,0.15));
            cursor: pointer;
            user-select: none;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        /* 스탯 바 영역 */
        .stats-area {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 18px;
            background: rgba(255, 255, 255, 0.8);
            padding: 12px;
            border-radius: 15px;
        }

        .stat-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 15px;
        }

        .stat-label {
            width: 80px;
        }

        .stat-bar-bg {
            flex-grow: 1;
            background: #e0e0e0;
            height: 14px;
            border-radius: 7px;
            overflow: hidden;
            margin: 0 10px;
        }

        .stat-bar-fill {
            height: 100%;
            width: 70%;
            transition: width 0.3s, background-color 0.3s;
        }

        .stat-val {
            width: 35px;
            text-align: right;
            font-size: 14px;
        }

        /* 상호작용 버튼 영역 */
        .actions-area {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            width: 100%;
        }

        .action-btn {
            background: #ff8a65;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 15px;
            font-family: 'Jua', sans-serif;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px #e64a19;
            transition: all 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .action-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 #e64a19;
        }

        .action-btn.heal-btn {
            background: #ba68c8;
            box-shadow: 0 4px #8e24aa;
            grid-column: span 2;
        }
        .action-btn.heal-btn:active {
            box-shadow: 0 0 #8e24aa;
        }

        /* 반짝임 효과 애니메이션 */
        @keyframes sparkle {
            0% { transform: scale(1) rotate(0deg); filter: brightness(1); }
            50% { transform: scale(1.3) rotate(15deg); filter: brightness(1.6) drop-shadow(0 0 20px gold); }
            100% { transform: scale(1) rotate(0deg); filter: brightness(1); }
        }

        .sparkle-effect {
            animation: sparkle 0.8s ease-in-out;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- 1단계: 상점 화면 (알 고르기) -->
        <div id="shop-screen" class="screen">
            <h1>🐉 나만의 알을 선택하세요! 🥚</h1>
            <div class="egg-list">
                <div class="egg-card">
                    <div class="egg-emoji-icon">🥚</div>
                    <div class="egg-info">
                        <div class="egg-name">1. 드래곤 알</div>
                        <div style="font-size:13px; color:#8d6e63;">기본적이고 씩씩한 붉은 알</div>
                    </div>
                    <button class="select-btn" onclick="startGame(1)">선택하기</button>
                </div>
                <div class="egg-card">
                    <div class="egg-emoji-icon">🟢</div>
                    <div class="egg-info">
                        <div class="egg-name">2. 그린 드래곤 알</div>
                        <div style="font-size:13px; color:#8d6e63;">싱그러운 자연의 초록 알</div>
                    </div>
                    <button class="select-btn" onclick="startGame(2)">선택하기</button>
                </div>
                <div class="egg-card">
                    <div class="egg-emoji-icon">🔮</div>
                    <div class="egg-info">
                        <div class="egg-name">3. 레전드 드래곤 알</div>
                        <div style="font-size:13px; color:#8d6e63;">신비로운 전설의 보라 알</div>
                    </div>
                    <button class="select-btn" onclick="startGame(3)">선택하기</button>
                </div>
            </div>
        </div>

        <!-- 2단계: 메인 게임 화면 -->
        <div id="main-screen" class="screen hidden">
            <!-- 위쪽 상태 (레벨 & 경험치) -->
            <div class="top-status">
                <div class="level-exp-info">
                    <span id="level-display">단계: 알 (Lv.1)</span>
                    <span id="exp-display">경험치: 0/100</span>
                </div>
                <div class="progress-bar-container">
                    <div id="exp-bar" class="progress-bar"></div>
                </div>
            </div>

            <!-- 중앙 펫 영역 -->
            <div class="pet-display-area">
                <div id="speech-bubble" class="speech-bubble">안녕! 나를 잘 돌봐줘! 👋</div>
                <div id="pet-avatar" class="pet-avatar">🥚</div>
            </div>

            <!-- 상태 바 영역 -->
            <div class="stats-area">
                <div class="stat-row">
                    <span class="stat-label">🍖 포만감</span>
                    <div class="stat-bar-bg">
                        <div id="hunger-bar" class="stat-bar-fill"></div>
                    </div>
                    <span id="hunger-val" class="stat-val">70</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">⭐ 행복</span>
                    <div class="stat-bar-bg">
                        <div id="happy-bar" class="stat-bar-fill"></div>
                    </div>
                    <span id="happy-val" class="stat-val">70</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">✨ 청결</span>
                    <div class="stat-bar-bg">
                        <div id="clean-bar" class="stat-bar-fill"></div>
                    </div>
                    <span id="clean-val" class="stat-val">70</span>
                </div>
            </div>

            <!-- 상호작용 버튼 영역 -->
            <div class="actions-area">
                <button class="action-btn" onclick="feedPet()">🍗 밥 주기</button>
                <button class="action-btn" onclick="playWithPet()">⚽ 놀아주기</button>
                <button class="action-btn" onclick="washPet()">🛁 씻기기</button>
                <button id="heal-btn" class="action-btn heal-btn hidden" onclick="healPet()">💊 치료하기</button>
            </div>
        </div>
    </div>

    <script>
        // 게임 데이터 상태
        let gameState = {
            eggType: 1,      // 1: 기본, 2: 그린, 3: 레전드
            stage: 2,        // 2: 알, 3: 드래곤
            level: 1,
            exp: 0,
            hunger: 70,
            happy: 70,
            clean: 70,
            isSick: false
        };

        // 펫 이모지 맵 (알 / 진화한 드래곤)
        const petAvatars = {
            1: { egg: "🥚", dragon: "🐲" },
            2: { egg: "🟢", dragon: "🐉" },
            3: { egg: "🔮", dragon: "🦖" }
        };

        // 게임 시작 (상점에서 알 선택)
        function startGame(type) {
            gameState.eggType = type;
            gameState.stage = 2;
            gameState.level = 1;
            gameState.exp = 0;
            gameState.hunger = 70;
            gameState.happy = 70;
            gameState.clean = 70;
            gameState.isSick = false;

            document.getElementById('shop-screen').classList.add('hidden');
            document.getElementById('main-screen').classList.remove('hidden');

            updateUI();
            
            // 3초마다 게이지 감소 루프 시작
            setInterval(decreaseStats, 3000);
        }

        // 3초마다 스탯 감소
        function decreaseStats() {
            if (gameState.isSick) return; // 아플 때는 감소 정지

            gameState.hunger = Math.max(0, gameState.hunger - 3);
            gameState.happy = Math.max(0, gameState.happy - 3);
            gameState.clean = Math.max(0, gameState.clean - 3);

            // 어떤 게이지든 0이 되면 아픔 상태 발생
            if ((gameState.hunger === 0 || gameState.happy === 0 || gameState.clean === 0) && !gameState.isSick) {
                gameState.isSick = true;
                setBubble("아이쿠! 아파요... 치료해주세요! 🤒");
            }

            updateUI();
        }

        // 스탯 바 색상 계산 함수 (많으면 초록, 적으면 빨강)
        function getBarColor(value) {
            if (value > 60) return '#4caf50'; // 초록
            if (value > 30) return '#ffeb3b'; // 노랑
            return '#f44336'; // 빨강
        }

        // 화면 UI 업데이트
        function updateUI() {
            // 스탯 바 반영
            document.getElementById('hunger-bar').style.width = gameState.hunger + '%';
            document.getElementById('hunger-bar').style.backgroundColor = getBarColor(gameState.hunger);
            document.getElementById('hunger-val').innerText = gameState.hunger;

            document.getElementById('happy-bar').style.width = gameState.happy + '%';
            document.getElementById('happy-bar').style.backgroundColor = getBarColor(gameState.happy);
            document.getElementById('happy-val').innerText = gameState.happy;

            document.getElementById('clean-bar').style.width = gameState.clean + '%';
            document.getElementById('clean-bar').style.backgroundColor = getBarColor(gameState.clean);
            document.getElementById('clean-val').innerText = gameState.clean;

            // 레벨 & 경험치 반영
            let stageName = (gameState.stage === 2) ? "알" : "드래곤";
            document.getElementById('level-display').innerText = `단계: ${stageName} (Lv.${gameState.level})`;
            document.getElementById('exp-display').innerText = `경험치: ${gameState.exp}/100`;
            document.getElementById('exp-bar').style.width = gameState.exp + '%';

            // 펫 이모지 설정
            const petEl = document.getElementById('pet-avatar');
            const currentSet = petAvatars[gameState.eggType];

            if (gameState.isSick) {
                petEl.innerText = "🤒";
            } else {
                if (gameState.stage === 2) {
                    petEl.innerText = currentSet.egg;
                } else {
                    petEl.innerText = currentSet.dragon;
                }
            }

            // 아픔 상태에 따른 치료 버튼 표시 제어
            const healBtn = document.getElementById('heal-btn');
            if (gameState.isSick) {
                healBtn.classList.remove('hidden');
            } else {
                healBtn.classList.add('hidden');
            }
        }

        // 말풍선 메시지 변경
        function setBubble(msg) {
            document.getElementById('speech-bubble').innerText = msg;
        }

        // 경험치 획득 및 성장 처리
        function addExp(amount) {
            if (gameState.isSick) {
                setBubble("아파서 경험치를 얻을 수 없어요! 🤒");
                return;
            }

            gameState.exp += amount;
            if (gameState.exp >= 100) {
                gameState.exp = 0;
                levelUp();
            }
            updateUI();
        }

        // 레벨업 및 진화 처리
        function levelUp() {
            gameState.level++;
            
            // 2단계(알)에서 레벨이 오르면 3단계(드래곤)로 진화
            if (gameState.stage === 2) {
                gameState.stage = 3;
                setBubble("🎉 드디어 드래곤(이)가 진화했다! 🐉✨");
            } else {
                setBubble(`🎉 레벨 업! 레벨 ${gameState.level}이 되었어요! 🎈`);
            }

            // 반짝임 효과 애니메이션 추가
            const petEl = document.getElementById('pet-avatar');
            petEl.classList.add('sparkle-effect');
            setTimeout(() => {
                petEl.classList.remove('sparkle-effect');
            }, 800);
        }

        // 1. 밥 주기 버튼
        function feedPet() {
            if (gameState.isSick) {
                setBubble("아파서 밥을 먹을 수 없어요... 치료해주세요! 🤒");
                return;
            }
            gameState.hunger = Math.min(100, gameState.hunger + 25);
            gameState.happy = Math.min(100, gameState.happy + 5);
            setBubble("냠냠! 맛있는 밥을 먹었어요! 🍖");
            addExp(10);
        }

        // 2. 놀아주기 버튼
        function playWithPet() {
            if (gameState.isSick) {
                setBubble("아파서 놀 수 없어요... 치료해주세요! 🤒");
                return;
            }
            gameState.happy = Math.min(100, gameState.happy + 25);
            gameState.hunger = Math.max(0, gameState.hunger - 10);
            gameState.clean = Math.max(0, gameState.clean - 10);
            setBubble("신나게 뛰어놀았어요! 😆✨");
            addExp(10);
        }

        // 3. 씻기기 버튼
        function washPet() {
            if (gameState.isSick) {
                setBubble("아파서 씻을 수 없어요... 치료해주세요! 🤒");
                return;
            }
            gameState.clean = Math.min(100, gameState.clean + 35);
            gameState.happy = Math.max(0, gameState.happy - 5);
            setBubble("보글보글 깨끗하게 목욕했어요! 🛁");
            addExp(10);
        }

        // 4. 치료하기 버튼
        function healPet() {
            gameState.isSick = false;
            gameState.hunger = 50;
            gameState.happy = 50;
            gameState.clean = 50;
            setBubble("약을 먹고 건강을 되찾았어요! 💊✨");
            updateUI();
        }
    </script>
</body>
</html>
