<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🦎 크레스티드 게코 키우기</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Gamja Flower', 'GmarketSansMedium', sans-serif, cursive;
            user-select: none;
        }

        body {
            background-color: #fdf6ec;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .game-container {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            padding: 25px;
            border: 4px solid #f3d5b5;
            position: relative;
            overflow: hidden;
        }

        /* 헤더 & 레벨 정보 */
        .header {
            text-align: center;
            margin-bottom: 20px;
            background: #fff8f0;
            padding: 15px;
            border-radius: 18px;
            border: 2px dashed #e7bc91;
        }

        .stage-title {
            font-size: 24px;
            font-weight: bold;
            color: #8b5e3c;
            margin-bottom: 8px;
        }

        .exp-bar-container {
            width: 100%;
            height: 16px;
            background: #eee;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #ddd;
        }

        .exp-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ffb703, #fb8500);
            transition: width 0.3s ease;
        }

        .exp-text {
            font-size: 14px;
            color: #666;
            margin-top: 4px;
        }

        /* 펫 영역 */
        .pet-area {
            height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            margin: 15px 0;
        }

        .speech-bubble {
            position: absolute;
            top: 10px;
            background: #fff0f5;
            padding: 10px 18px;
            border-radius: 20px;
            border: 2px solid #ffb6c1;
            font-size: 16px;
            font-weight: bold;
            color: #d87093;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            animation: popIn 0.3s ease;
            z-index: 5;
            max-width: 80%;
            text-align: center;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 10px 10px 0;
            border-style: solid;
            border-color: #ffb6c1 transparent;
            display: block;
            width: 0;
        }

        .pet-avatar {
            font-size: 80px;
            margin-top: 30px;
            cursor: pointer;
            transition: transform 0.2s;
            filter: drop-shadow(0 8px 5px rgba(0,0,0,0.1));
            display: inline-block;
        }

        /* 바운스 애니메이션 */
        .bounce {
            animation: bounce 1.8s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-15px) scale(1.05); }
        }

        .sick-animation {
            animation: shake 0.5s infinite;
        }

        @keyframes shake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-5deg); }
            75% { transform: rotate(5deg); }
        }

        /* 스탯 바 */
        .stats-container {
            background: #fdf8f5;
            padding: 15px;
            border-radius: 18px;
            margin-bottom: 20px;
            border: 2px solid #f7d6c8;
        }

        .stat-row {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }

        .stat-row:last-child {
            margin-bottom: 0;
        }

        .stat-label {
            width: 85px;
            font-size: 15px;
            font-weight: bold;
            color: #555;
        }

        .stat-bar-bg {
            flex: 1;
            height: 14px;
            background: #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
            margin: 0 10px;
            border: 1px solid #ccc;
        }

        .stat-bar-fill {
            height: 100%;
            width: 70%;
            border-radius: 8px;
            transition: width 0.4s ease, background-color 0.4s ease;
        }

        .stat-val {
            width: 35px;
            font-size: 14px;
            font-weight: bold;
            text-align: right;
            color: #444;
        }

        /* 버튼 영역 */
        .actions-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .btn {
            background: #fff;
            border: 2px solid #e0e0e0;
            border-radius: 16px;
            padding: 12px 8px;
            font-size: 15px;
            font-weight: bold;
            color: #444;
            cursor: pointer;
            box-shadow: 0 4px 0 #ddd;
            transition: all 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #ddd;
        }

        .btn-feed { background: #ffe8d6; border-color: #ddbea9; box-shadow: 0 4px 0 #cb997e; }
        .btn-play { background: #ddffdd; border-color: #b7e4c7; box-shadow: 0 4px 0 #74c69d; }
        .btn-clean { background: #e0f4ff; border-color: #b9e0ff; box-shadow: 0 4px 0 #8ebdff; }
        .btn-sleep { background: #f3e8ff; border-color: #d8b4fe; box-shadow: 0 4px 0 #c084fc; }
        .btn-cube { background: #fff3bf; border-color: #ffe066; box-shadow: 0 4px 0 #fcc419; }
        .btn-bite { background: #ffe3e3; border-color: #ffa8a8; box-shadow: 0 4px 0 #ff6b6b; }
        .btn-heal { background: #ffc9c9; border-color: #ff8787; box-shadow: 0 4px 0 #f03e3e; grid-column: span 2; color: #b71c1c; animation: pulse 1s infinite; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        /* 진화 오버레이 */
        .evolution-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            border-radius: 25px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .evolution-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .sparkle {
            font-size: 50px;
            animation: spin 1s infinite linear;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

<div class="game-container">
    <!-- 진화 축하 화면 -->
    <div class="evolution-overlay" id="evoOverlay">
        <div class="sparkle">✨🦎✨</div>
        <h2 style="color: #d87093; margin: 15px 0 5px;" id="evoMsg">진화했다!</h2>
        <p style="color: #666; font-size: 16px;">축하합니다! 도마뱀이 성장했어요!</p>
    </div>

    <!-- 헤더 & 레벨 -->
    <div class="header">
        <div class="stage-title" id="stageName">1단계: 알 🥚</div>
        <div class="exp-bar-container">
            <div class="exp-bar-fill" id="expFill"></div>
        </div>
        <div class="exp-text">EXP: <span id="expText">0</span> / 100</div>
    </div>

    <!-- 펫 표현 영역 -->
    <div class="pet-area">
        <div class="speech-bubble" id="speech">안녕! 나를 잘 보살펴줘! 🦎</div>
        <div class="pet-avatar bounce" id="petAvatar">🥚</div>
    </div>

    <!-- 스탯 게이지 -->
    <div class="stats-container">
        <div class="stat-row">
            <span class="stat-label">🍖 포만감</span>
            <div class="stat-bar-bg"><div class="stat-bar-fill" id="barHunger"></div></div>
            <span class="stat-val" id="valHunger">70</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">🥰 행복</span>
            <div class="stat-bar-bg"><div class="stat-bar-fill" id="barHappiness"></div></div>
            <span class="stat-val" id="valHappiness">70</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">🧼 청결</span>
            <div class="stat-bar-bg"><div class="stat-bar-fill" id="barCleanliness"></div></div>
            <span class="stat-val" id="valCleanliness">70</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">⚡ 에너지</span>
            <div class="stat-bar-bg"><div class="stat-bar-fill" id="barEnergy"></div></div>
            <span class="stat-val" id="valEnergy">70</span>
        </div>
    </div>

    <!-- 상호작용 버튼 -->
    <div class="actions-grid">
        <button class="btn btn-feed" onclick="handleAction('feed')">🍚 밥 주기</button>
        <button class="btn btn-play" onclick="handleAction('play')">🎾 놀아주기</button>
        <button class="btn btn-clean" onclick="handleAction('clean')">🚿 씻기기</button>
        <button class="btn btn-sleep" onclick="handleAction('sleep')">🌙 재우기</button>
        <button class="btn btn-cube" onclick="handleAction('cube')">🧊 큐브 맞추기</button>
        <button class="btn btn-bite" onclick="handleAction('bite')">🐊 물기</button>
        <button class="btn btn-heal" id="btnHeal" style="display: none;" onclick="healPet()">💊 치료하기 (아픔!)</button>
    </div>
</div>

<script>
    // 게임 데이터 상태
    const state = {
        hunger: 70,
        happiness: 70,
        cleanliness: 70,
        energy: 70,
        exp: 0,
        level: 1, // 1~5 단계
        isSick: false
    };

    // 진화 단계 정보 (5단계 전 과정 도마뱀 이모지 유지)
    const stages = [
        { level: 1, name: "1단계: 알 🥚", avatar: "🥚" },
        { level: 2, name: "2단계: 아기 게코 🦎", avatar: "🦎" },
        { level: 3, name: "3단계: 청소년 게코 🦎✨", avatar: "🦎" },
        { level: 4, name: "4단계: 어른 게코 🦎👑", avatar: "🦎" },
        { level: 5, name: "5단계: 할아버지 게코 🦎👴", avatar: "🦎" }
    ];

    // 표정/상태 메시지
    const messages = {
        feed: ["맛있는 귀뚜라미 냠냠! 🦗", "우물우물... 배가 불러요!", "맛있어! 기분이 좋아졌어!"],
        play: ["신나게 꼬리를 흔들며 파닥파닥! 🎾", "우와! 너무 재밌어!", "더 놀아줘! 신난다!"],
        clean: ["구석구석 깨끗하게 싹싹! 🫧", "시원해! 피부가 매끈매끈해졌어!", "물놀이는 좋아!"],
        sleep: ["쿨쿨... 잠을 자고 에너지를 회복해요 💤", "잘 자고 일어났더니 힘이 나!", "쿨쿨... Zzz..."],
        cube: ["지능 상승! 큐브를 뚝딱 맞췄어요 🧊", "뇌가 말랑말랑해지는 기분이야!", "재밌는 큐브 놀이!"],
        bite: ["앙! 손가락을 꽉 물었어요! 🐊", "장난치기 성공! 앙!", "헤헤... 조금 아팠지?"],
        sick: ["쿨럭... 아파서 아무것도 할 수 없어요 🤒", "몸이 안 좋아요... 치료해주세요 🏥"],
        heal: ["짠! 약을 먹고 싹 나았어요! ✨", "이제 안 아파요! 고마워요!"],
        decay: ["배가 고프거나 심심해지고 있어요... 😢", "졸리고 몸이 더러워지는 중..." ]
    };

    // DOM 요소
    const elStageName = document.getElementById('stageName');
    const elExpFill = document.getElementById('expFill');
    const elExpText = document.getElementById('expText');
    const elPetAvatar = document.getElementById('petAvatar');
    const elSpeech = document.getElementById('speech');
    const elBtnHeal = document.getElementById('btnHeal');
    const elEvoOverlay = document.getElementById('evoOverlay');
    const elEvoMsg = document.getElementById('evoMsg');

    // UI 업데이트
    function updateUI() {
        ['hunger', 'happiness', 'cleanliness', 'energy'].forEach(stat => {
            state[stat] = Math.max(0, Math.min(100, state[stat]));
        });

        if ((state.hunger === 0 || state.happiness === 0 || state.cleanliness === 0 || state.energy === 0) && !state.isSick) {
            state.isSick = true;
            showSpeech(getRandomMsg(messages.sick));
        }

        updateBar('barHunger', 'valHunger', state.hunger);
        updateBar('barHappiness', 'valHappiness', state.happiness);
        updateBar('barCleanliness', 'valCleanliness', state.cleanliness);
        updateBar('barEnergy', 'valEnergy', state.energy);

        elExpFill.style.width = `${state.exp}%`;
        elExpText.innerText = state.exp;

        if (state.isSick) {
            elBtnHeal.style.display = 'flex';
            elPetAvatar.innerText = "🤒";
            elPetAvatar.className = "pet-avatar sick-animation";
        } else {
            elBtnHeal.style.display = 'none';
            elPetAvatar.className = "pet-avatar bounce";
            
            const avg = (state.hunger + state.happiness + state.cleanliness + state.energy) / 4;
            const currentStage = stages[state.level - 1];

            if (state.level === 1) {
                elPetAvatar.innerText = "🥚";
            } else {
                if (avg < 35) {
                    elPetAvatar.innerText = "😢";
                } else {
                    elPetAvatar.innerText = currentStage.avatar;
                }
            }
        }
    }

    function updateBar(barId, valId, value) {
        const bar = document.getElementById(barId);
        const val = document.getElementById(valId);
        
        bar.style.width = `${value}%`;
        val.innerText = Math.round(value);

        if (value > 60) {
            bar.style.backgroundColor = "#4caf50";
        } else if (value > 30) {
            bar.style.backgroundColor = "#ff9800";
        } else {
            bar.style.backgroundColor = "#f44336";
        }
    }

    function showSpeech(text) {
        elSpeech.innerText = text;
        elSpeech.style.animation = 'none';
        elSpeech.offsetHeight;
        elSpeech.style.animation = 'popIn 0.3s ease';
    }

    function getRandomMsg(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
    }

    function addExp(amount) {
        if (state.isSick) return;

        state.exp += amount;
        if (state.exp >= 100) {
            state.exp -= 100;
            levelUp();
        }
    }

    function levelUp() {
        if (state.level < 5) {
            state.level++;
            const newStage = stages[state.level - 1];
            elStageName.innerText = newStage.name;

            elEvoMsg.innerText = `도마뱀이 진화했다! (${newStage.name})`;
            elEvoOverlay.classList.add('active');
            
            setTimeout(() => {
                elEvoOverlay.classList.remove('active');
                showSpeech(`짜잔! ${newStage.name}(으)로 멋지게 진화했어! ✨`);
            }, 2000);
        } else {
            showSpeech("최고 단계(할아버지 게코)에 도달했어요! 만렙 달성! 👑");
        }
    }

    function handleAction(action) {
        if (state.isSick) {
            showSpeech(getRandomMsg(messages.sick));
            return;
        }

        switch (action) {
            case 'feed':
                state.hunger += 25;
                state.happiness += 5;
                if (state.energy > 0) state.happiness += 5;
                showSpeech(getRandomMsg(messages.feed));
                break;

            case 'play':
                state.happiness += 25;
                state.hunger -= 10;
                state.energy -= 15;
                state.cleanliness -= 10;
                showSpeech(getRandomMsg(messages.play));
                break;

            case 'clean':
                state.cleanliness += 35;
                state.happiness -= 5;
                showSpeech(getRandomMsg(messages.clean));
                break;

            case 'sleep':
                state.hunger -= 5;
                state.energy += 20;
                showSpeech(getRandomMsg(messages.sleep));
                break;

            case 'cube':
                state.energy += 20;
                state.happiness += 40;
                showSpeech(getRandomMsg(messages.cube));
                break;

            case 'bite':
                state.hunger += 30;
                state.energy -= 10;
                state.cleanliness -= 10;
                showSpeech(getRandomMsg(messages.bite));
                break;
        }

        addExp(10);
        updateUI();
    }

    function healPet() {
        state.isSick = false;
        state.hunger = Math.max(state.hunger, 30);
        state.happiness = Math.max(state.happiness, 30);
        state.cleanliness = Math.max(state.cleanliness, 30);
        state.energy = Math.max(state.energy, 30);

        showSpeech(getRandomMsg(messages.heal));
        updateUI();
    }

    setInterval(() => {
        if (!state.isSick) {
            state.hunger -= 2;
            state.happiness -= 2;
            state.cleanliness -= 1.5;
            state.energy -= 1.5;
            updateUI();
        }
    }, 3000);

    updateUI();
</script>

</body>
</html>
