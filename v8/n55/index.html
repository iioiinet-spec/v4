<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도마뱀 키우기: 뿌엥이의 성장 일기</title>
    <style>
        :root {
            --bg-color: #fcf6f5;
            --card-bg: #ffffff;
            --primary-color: #a8dadc;
            --accent-color: #ffb703;
            --text-color: #2b2d42;
            --danger-color: #e63946;
            --success-color: #2a9d8f;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .game-container {
            background-color: var(--card-bg);
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            width: 400px;
            padding: 25px;
            text-align: center;
            box-sizing: border-box;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 5px;
            color: #457b9d;
        }

        .status-header {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 15px;
        }

        /* 경험치 및 레벨 바 */
        .progress-box {
            background: #f1faee;
            border-radius: 15px;
            padding: 10px;
            margin-bottom: 20px;
        }

        .bar-container {
            background: #e9ecef;
            border-radius: 10px;
            height: 12px;
            width: 100%;
            overflow: hidden;
            margin-top: 5px;
        }

        .bar {
            height: 100%;
            transition: width 0.3s ease;
        }

        #exp-bar { background-color: #457b9d; }

        /* 펫 영역 및 집 꾸미기 배경 */
        .pet-stage {
            height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            position: relative;
            margin-bottom: 15px;
            background: linear-gradient(to bottom, #f0ebd8 0%, #e3d5ca 100%);
            border-radius: 20px;
            overflow: hidden;
            border: 3px solid #d5bdaf;
            padding-bottom: 15px;
        }

        /* 방 안의 소품들 (카펫, 소파, 화분) */
        .room-decor {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1;
        }

        .rug {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 180px;
            height: 45px;
            background-color: #f4a261;
            border-radius: 50%;
            opacity: 0.6;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }

        .sofa {
            position: absolute;
            bottom: 25px;
            left: 20px;
            font-size: 35px;
        }

        .plant {
            position: absolute;
            bottom: 25px;
            right: 20px;
            font-size: 30px;
        }

        .pet {
            font-size: 70px;
            cursor: pointer;
            animation: bounce 2s infinite ease-in-out;
            user-select: none;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
            margin-bottom: 5px;
        }

        /* 일반 점프 애니메이션 */
        .jump-anim {
            animation: jumpEffect 0.5s ease !important;
        }

        @keyframes jumpEffect {
            0% { transform: translateY(0); }
            50% { transform: translateY(-60px) scale(1.1); }
            100% { transform: translateY(0); }
        }

        /* 4단 점프 애니메이션 (4번 연속 폴짝폴짝) */
        .quad-jump-anim {
            animation: quadJumpEffect 1.2s ease !important;
        }

        @keyframes quadJumpEffect {
            0% { transform: translateY(0); }
            12% { transform: translateY(-40px) scale(1.05); }
            25% { transform: translateY(0); }
            37% { transform: translateY(-55px) scale(1.1); }
            50% { transform: translateY(0); }
            62% { transform: translateY(-70px) scale(1.15); }
            75% { transform: translateY(0); }
            87% { transform: translateY(-85px) scale(1.2); }
            100% { transform: translateY(0); }
        }

        /* 구르기 애니메이션 */
        .roll-anim {
            animation: rollEffect 0.6s linear !important;
        }

        @keyframes rollEffect {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(0.9); }
            100% { transform: rotate(360deg) scale(1); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* 어른 도마뱀 이미지 스타일 */
        .pet img {
            width: 120px;
            height: 120px;
            object-fit: contain;
            mix-blend-mode: multiply;
            background: transparent;
        }

        .bubble {
            background: #fff;
            border: 2px solid #a8dadc;
            border-radius: 15px;
            padding: 6px 12px;
            font-size: 13px;
            margin-bottom: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            max-width: 80%;
            z-index: 2;
            animation: fadeIn 0.2s;
        }

        /* 스탯 게이지 */
        .stats-box {
            text-align: left;
            margin-bottom: 20px;
        }

        .stat-item {
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: bold;
        }

        .stat-bar-container {
            background: #e9ecef;
            border-radius: 8px;
            height: 10px;
            width: 100%;
            overflow: hidden;
            margin-top: 3px;
        }

        /* 버튼 패널 */
        .button-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        button {
            background-color: var(--primary-color);
            border: none;
            border-radius: 15px;
            padding: 12px;
            font-size: 13px;
            font-weight: bold;
            color: var(--text-color);
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: #8ecae6;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        button.danger-btn {
            background-color: #ffb703;
            grid-column: span 2;
        }

        button.danger-btn:hover {
            background-color: #fb8500;
            color: white;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>🦎 뿌엥이의 성장일기</h1>
        <div class="status-header" id="stage-name">단계: 알 🥚</div>

        <!-- 경험치 및 레벨 -->
        <div class="progress-box">
            <div id="level-text" style="font-size: 13px; font-weight: bold;">레벨 1 (경험치 0/100)</div>
            <div class="bar-container">
                <div id="exp-bar" class="bar" style="width: 0%;"></div>
            </div>
        </div>

        <!-- 펫 & 집 꾸미기 영역 -->
        <div class="pet-stage">
            <div class="room-decor">
                <div class="rug"></div>
                <div class="sofa">🛋️</div>
                <div class="plant">🪴</div>
            </div>
            <div id="bubble" class="bubble">안녕? 나는 뿌엥이야! 💤</div>
            <div id="pet" class="pet">🥚</div>
        </div>

        <!-- 스탯 게이지 -->
        <div class="stats-box">
            <div class="stat-item">
                포만감 <span id="hunger-val">70</span>%
                <div class="stat-bar-container"><div id="hunger-bar" class="bar" style="width: 70%;"></div></div>
            </div>
            <div class="stat-item">
                행복도 <span id="happy-val">70</span>%
                <div class="stat-bar-container"><div id="happy-bar" class="bar" style="width: 70%;"></div></div>
            </div>
            <div class="stat-item">
                청결도 <span id="clean-val">70</span>%
                <div class="stat-bar-container"><div id="clean-bar" class="bar" style="width: 70%;"></div></div>
            </div>
        </div>

        <!-- 상호작용 버튼 -->
        <div class="button-grid">
            <button onclick="feed()">🍚 밥 주기</button>
            <button onclick="play()">⚽ 놀아주기</button>
            <button onclick="clean()">🧼 씻기기</button>
            <button onclick="sleep()">💤 낮잠 자기</button>
            <button onclick="jumpPet()">🦘 뛰기</button>
            <button onclick="rollPet()">🔄 구르기</button>
            <button onclick="quadJumpPet()">🚀 4단 점프!</button> <!-- 4단 점프 버튼 추가 -->
            <button id="cure-btn" class="danger-btn" onclick="cure()">💊 병원 가기 (치료)</button>
        </div>
    </div>

    <script>
        // 게임 상태 데이터
        let game = {
            hunger: 70,
            happy: 70,
            clean: 70,
            energy: 70, 
            exp: 0,
            level: 1,
            stage: 1, // 1: 알, 2: 아기, 3: 어른
            isSick: false
        };

        // DOM 요소들
        const petEl = document.getElementById('pet');
        const bubbleEl = document.getElementById('bubble');
        const stageNameEl = document.getElementById('stage-name');
        const levelTextEl = document.getElementById('level-text');
        const expBarEl = document.getElementById('exp-bar');
        
        const hungerValEl = document.getElementById('hunger-val');
        const hungerBarEl = document.getElementById('hunger-bar');
        const happyValEl = document.getElementById('happy-val');
        const happyBarEl = document.getElementById('happy-bar');
        const cleanValEl = document.getElementById('clean-val');
        const cleanBarEl = document.getElementById('clean-bar');

        // 메시지 리스트
        const messages = {
            feed: ["냠냠! 맛있어 고마워! 😋", "배가 든든해서 기분 좋아~ 🍖", "꿀맛이다 뿌엥! 🥗"],
            play: ["신난다! 재밌어! 😆", "최고의 놀이야! 🏃‍♂️", "뿌엥이는 놀이가 제일 좋아! ✨"],
            clean: ["개운하다! 뽀송뽀송해졌어~ 🫧", "향기로운 도마뱀이 되었지! 🛁"],
            sleep: ["하아아암... 낮잠은 나의 힘 💤", "Zzz... 꿈속에서 놀고 있어 🌙"],
            jump: ["영차! 높이 뛰어올랐지롱! 🦘", "폴짝폴짝 운동 신경 최고지? ✨", "으랏차차! 하늘을 나는 기분이야! 🚀"],
            roll: ["데굴데굴~ 카펫 위에서 구르기! 🌀", "빙글빙글 돌았더니 어지러워~ 💫", "데구르르 재밌다 뿌엥! 🤸‍♂️"],
            quadJump: ["와우! 4단 점프 성공! 천장에 닿겠어! 🚀", "폴짝! 폴짝! 폴짝! 폴짝! 대단하지? 😎", "슈퍼 울트라 4단 점프 발동! ✨"],
            sick: ["몸이 너무 아파요... 🤒 도와주세요...", "뿌엥... 기운이 하나도 없어 흑흑 💧"],
            evolve: ["앗! 뭔가 몸이 이상해... 부화한다! 🌟", "짜잔! 뿌엥이가 멋지게 진화했어요! 🎉"]
        };

        function showMessage(msg) {
            bubbleEl.innerText = msg;
        }

        // 게이지 색상 변경 함수
        function getBarColor(value) {
            if (value > 60) return 'var(--success-color)';
            if (value > 30) return 'var(--accent-color)';
            return 'var(--danger-color)';
        }

        // 화면 업데이트
        function updateUI() {
            hungerValEl.innerText = game.hunger;
            happyValEl.innerText = game.happy;
            cleanValEl.innerText = game.clean;

            hungerBarEl.style.width = game.hunger + '%';
            hungerBarEl.style.backgroundColor = getBarColor(game.hunger);

            happyBarEl.style.width = game.happy + '%';
            happyBarEl.style.backgroundColor = getBarColor(game.happy);

            cleanBarEl.style.width = game.clean + '%';
            cleanBarEl.style.backgroundColor = getBarColor(game.clean);

            let maxExp = game.level * 100;
            levelTextEl.innerText = `레벨 ${game.level} (경험치 ${game.exp}/${100})`;
            expBarEl.style.width = game.exp + '%';

            if (game.hunger === 0 || game.happy === 0 || game.clean === 0) {
                if (!game.isSick) {
                    game.isSick = true;
                    showMessage(messages.sick[Math.floor(Math.random() * messages.sick.length)]);
                }
            }

            if (game.isSick) {
                petEl.innerText = '🤒';
            } else {
                if (game.stage === 1) {
                    petEl.innerText = '🥚';
                    stageNameEl.innerText = '단계: 알 🥚';
                } else if (game.stage === 2) {
                    let avg = (game.hunger + game.happy + game.clean) / 3;
                    if (avg >= 70) petEl.innerText = '🦎😊';
                    else if (avg >= 40) petEl.innerText = '🦎😐';
                    else petEl.innerText = '🦎😢';
                    stageNameEl.innerText = '단계: 아기 도마뱀 🌱';
                } else {
                    stageNameEl.innerText = '단계: 어른 도마뱀 (뿌엥이) 🔥';
                    if (!petEl.querySelector('img')) {
                        petEl.innerHTML = '<img src="https://mblogthumb-phinf.pstatic.net/MjAxODA2MjBfMTU1/MDAxNTI5NDg3OTU0MjI2.FsYBwCGihGmb0IA_om2mHaAP5SbJfmyLMnV4GDA9kpIg.S4Gss4O9EOc-N2D3alFckSeirOlDbDgLAdhgfWEykQIg.JPEG.kjonga/1.jpg?type=w800" alt="어른 도마뱀">';
                    }
                }
            }
        }

        function addExp(amount) {
            if (game.isSick) return;

            game.exp += amount;
            if (game.exp >= 100) {
                game.exp = 0;
                game.level++;
                
                if (game.level === 2 && game.stage === 1) {
                    game.stage = 2;
                    showMessage(messages.evolve[1]);
                } else if (game.level >= 3 && game.stage === 2) {
                    game.stage = 3;
                    showMessage(messages.evolve[1]);
                } else {
                    showMessage("레벨 업! 뿌엥이가 더 튼튼해졌어요! 🎉");
                }
            }
        }

        function clamp() {
            game.hunger = Math.max(0, Math.min(100, game.hunger));
            game.happy = Math.max(0, Math.min(100, game.happy));
            game.clean = Math.max(0, Math.min(100, game.clean));
            game.energy = Math.max(0, Math.min(100, game.energy));
        }

        function feed() {
            if (game.isSick) { return alert("뿌엥이가 아파서 아무것도 먹지 못해요! 먼저 치료해주세요."); }
            game.hunger += 25;
            game.happy += (game.energy > 30 ? 5 : 2);
            game.energy -= 5;
            clamp();
            addExp(10);
            showMessage(messages.feed[Math.floor(Math.random() * messages.feed.length)]);
            updateUI();
        }

        function play() {
            if (game.isSick) { return alert("뿌엥이가 아파서 놀 수 없어요! 먼저 치료해주세요."); }
            game.happy += 25;
            game.hunger -= 10;
            game.energy -= 15;
            game.clean -= 10;
            clamp();
            addExp(10);
            showMessage(messages.play[Math.floor(Math.random() * messages.play.length)]);
            updateUI();
        }

        function clean() {
            if (game.isSick) { return alert("뿌엥이가 아파요! 치료가 먼저예요."); }
            game.clean += 35;
            game.happy -= 5;
            clamp();
            addExp(10);
            showMessage(messages.clean[Math.floor(Math.random() * messages.clean.length)]);
            updateUI();
        }

        function sleep() {
            if (game.isSick) { return alert("아픈 상태에서는 잠을 자도 피로가 안 풀려요!"); }
            game.energy += 30;
            game.hunger -= 10;
            game.happy += 10;
            clamp();
            addExp(5);
            showMessage(messages.sleep[Math.floor(Math.random() * messages.sleep.length)]);
            updateUI();
        }

        function jumpPet() {
            if (game.isSick) { return alert("뿌엥이가 아파서 뛸 수 없어요! 먼저 치료해주세요."); }
            if (game.energy < 10) { return alert("뿌엥이가 너무 지쳐서 뛸 힘이 없어요! 잠을 재워주세요."); }

            game.happy += 15;
            game.energy -= 10;
            game.hunger -= 5;
            clamp();
            addExp(8);

            petEl.classList.add('jump-anim');
            setTimeout(() => {
                petEl.classList.remove('jump-anim');
            }, 500);

            showMessage(messages.jump[Math.floor(Math.random() * messages.jump.length)]);
            updateUI();
        }

        function rollPet() {
            if (game.isSick) { return alert("뿌엥이가 아파서 뒹굴 수 없어요! 먼저 치료해주세요."); }
            if (game.energy < 10) { return alert("뿌엥이가 너무 지쳐서 구를 힘이 없어요! 잠을 재워주세요."); }

            game.happy += 15;
            game.energy -= 10;
            game.hunger -= 5;
            clamp();
            addExp(8);

            petEl.classList.add('roll-anim');
            setTimeout(() => {
                petEl.classList.remove('roll-anim');
            }, 600);

            showMessage(messages.roll[Math.floor(Math.random() * messages.roll.length)]);
            updateUI();
        }

        // 4단 점프 액션 함수
        function quadJumpPet() {
            if (game.isSick) { return alert("뿌엥이가 아파서 뛸 수 없어요! 먼저 치료해주세요."); }
            if (game.energy < 20) { return alert("뿌엥이가 너무 지쳐서 4단 점프를 할 힘이 없어요! 잠을 재워주세요."); }

            game.happy += 25;
            game.energy -= 18;
            game.hunger -= 8;
            clamp();
            addExp(15);

            petEl.classList.add('quad-jump-anim');
            setTimeout(() => {
                petEl.classList.remove('quad-jump-anim');
            }, 1200);

            showMessage(messages.quadJump[Math.floor(Math.random() * messages.quadJump.length)]);
            updateUI();
        }

        function cure() {
            if (!game.isSick) {
                showMessage("뿌엥이는 지금 아주 건강해요! ✨");
                return;
            }
            game.isSick = false;
            game.hunger = 50;
            game.happy = 50;
            game.clean = 50;
            clamp();
            showMessage("건강을 되찾았어요! 앞으로 잘 돌봐주세요! 💚");
            updateUI();
        }

        setInterval(() => {
            game.hunger -= 3;
            game.happy -= 3;
            game.clean -= 2;
            game.energy -= 2;
            clamp();
            updateUI();
        }, 3000);

        updateUI();
    </script>
</body>
</html>
