<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐉 드래곤 키우기</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Arial", "Malgun Gothic", sans-serif;
    background:
      radial-gradient(circle at 20% 20%, #fff6b7 0 8%, transparent 20%),
      radial-gradient(circle at 80% 10%, #d9c8ff 0 10%, transparent 25%),
      linear-gradient(135deg, #ffd6e7, #c9f5ff 45%, #d8ffd1);
    color: #49365f;
    overflow-x: hidden;
  }

  .game {
    width: min(900px, 94vw);
    margin: 20px auto;
    padding: 22px;
    border-radius: 35px;
    background: rgba(255,255,255,.72);
    box-shadow: 0 15px 50px rgba(91,65,130,.2);
    backdrop-filter: blur(10px);
  }

  h1 {
    margin: 0 0 4px;
    text-align: center;
    font-size: clamp(30px, 6vw, 54px);
    color: #7549a8;
    text-shadow: 3px 3px #fff;
  }

  .subtitle {
    text-align:center;
    font-size: 17px;
    margin-bottom: 18px;
  }

  .evolution {
    background: linear-gradient(90deg,#fff1a8,#ffc5e6,#c8d9ff);
    border: 4px solid white;
    border-radius: 25px;
    padding: 14px 18px;
    box-shadow: 0 5px 15px #a879b555;
  }

  .evo-title {
    display:flex;
    justify-content:space-between;
    gap:10px;
    font-size:20px;
    font-weight:900;
    margin-bottom:8px;
  }

  .xp-track, .stat-track {
    height: 27px;
    border-radius: 20px;
    background:#e7e0eb;
    overflow:hidden;
    border:3px solid white;
    box-shadow: inset 0 2px 5px #7774;
  }

  .xp-fill {
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#ff75bd,#9c75ff,#54d9ff);
    transition:.5s;
  }

  .dragon-area {
    position:relative;
    min-height:360px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .dragon-wrap {
    position:relative;
    animation:bounce 1.8s ease-in-out infinite;
    filter: drop-shadow(0 20px 15px #7b569444);
  }

  @keyframes bounce {
    0%,100% { transform:translateY(4px) rotate(-1deg); }
    50% { transform:translateY(-13px) rotate(1deg); }
  }

  .dragon {
    width:min(430px,72vw);
    height:auto;
  }

  .aura {
    position:absolute;
    inset:12%;
    border-radius:50%;
    background:radial-gradient(circle,#fff8 0,transparent 65%);
    z-index:-1;
    animation:aura 2s infinite alternate;
  }

  @keyframes aura {
    from { transform:scale(.9); opacity:.5; }
    to { transform:scale(1.1); opacity:.9; }
  }

  .status-bubble {
    position:absolute;
    top:12px;
    right:5%;
    padding:10px 16px;
    background:#fff;
    border-radius:20px;
    font-size:18px;
    font-weight:bold;
    box-shadow:0 5px 15px #5553;
  }

  .stats {
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
  }

  .stat {
    background:#fff;
    border-radius:22px;
    padding:12px;
    box-shadow:0 5px 14px #80609022;
  }

  .stat-head {
    display:flex;
    justify-content:space-between;
    font-size:18px;
    font-weight:900;
    margin-bottom:6px;
  }

  .stat-fill {
    height:100%;
    width:50%;
    background:linear-gradient(90deg,#ff4d4d,#ffd83d,#5cff88,#55cfff,#b45cff);
    transition:.4s;
  }

  .stat-fill.low {
    background:#111;
  }

  .buttons {
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-top:18px;
  }

  button {
    border:0;
    border-radius:22px;
    padding:17px 8px;
    font-size:18px;
    font-weight:900;
    color:#49365f;
    cursor:pointer;
    box-shadow:0 7px 0 #0002, 0 10px 20px #80609022;
    transition:.15s;
  }

  button:hover { transform:translateY(-3px); }
  button:active { transform:translateY(4px); box-shadow:0 2px 0 #0002; }

  .feed { background:#ffe39b; }
  .play { background:#ffb8dd; }
  .wash { background:#9fe8ff; }
  .heal { background:#b9f3b1; }

  .message {
    min-height:50px;
    margin-top:15px;
    padding:12px;
    border-radius:20px;
    text-align:center;
    background:#fff;
    font-size:19px;
    font-weight:bold;
  }

  .sparkles {
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:10;
  }

  .spark {
    position:absolute;
    font-size:28px;
    animation:sparkle 1.4s forwards;
  }

  @keyframes sparkle {
    0% { transform:scale(.3) rotate(0); opacity:0; }
    20% { opacity:1; }
    100% { transform:translate(var(--x),var(--y)) scale(1.8) rotate(360deg); opacity:0; }
  }

  .sick .dragon-wrap {
    filter:grayscale(.55) drop-shadow(0 20px 15px #5555);
  }

  @media(max-width:650px) {
    .stats { grid-template-columns:1fr; }
    .buttons { grid-template-columns:repeat(2,1fr); }
    .dragon-area { min-height:310px; }
    .status-bubble { font-size:14px; top:5px; }
  }
</style>
</head>

<body>
<div class="game" id="game">
  <h1>🐉 드래곤 키우기</h1>
  <div class="subtitle">밥도 주고 💕 놀아주고 🛁 씻겨주면서 멋진 드래곤으로 키워보세요!</div>

  <div class="evolution">
    <div class="evo-title">
      <span id="stage">🥚 알</span>
      <span>Lv. <span id="level">1</span></span>
    </div>
    <div class="xp-track">
      <div class="xp-fill" id="xpFill"></div>
    </div>
    <div style="text-align:center;margin-top:5px;font-weight:bold">
      경험치 <span id="xp">0</span> / 200
    </div>
  </div>

  <div class="dragon-area">
    <div class="aura"></div>
    <div class="status-bubble" id="faceText">😊 기분 좋아요!</div>

    <div class="dragon-wrap">
      <svg class="dragon" id="dragon" viewBox="0 0 500 430"
           xmlns="http://www.w3.org/2000/svg">

        <!-- 날개 -->
        <path id="wingL"
          d="M145 205 Q55 115 28 165 Q55 190 75 235 Q35 225 55 275 Q105 255 165 245Z"
          fill="#a96ee8" stroke="#49365f" stroke-width="8"/>
        <path id="wingR"
          d="M355 205 Q445 115 472 165 Q445 190 425 235 Q465 225 445 275 Q395 255 335 245Z"
          fill="#a96ee8" stroke="#49365f" stroke-width="8"/>

        <!-- 꼬리 -->
        <path d="M335 320 Q430 330 448 275 Q462 230 415 238
                 Q435 260 410 275 Q390 290 325 275Z"
              fill="#7046c5" stroke="#49365f" stroke-width="8"/>

        <!-- 몸 -->
        <ellipse cx="250" cy="280" rx="112" ry="105"
                 fill="#9f73e8" stroke="#49365f" stroke-width="9"/>

        <!-- 배 -->
        <ellipse cx="250" cy="300" rx="67" ry="75"
                 fill="#ffdca8" stroke="#49365f" stroke-width="6"/>

        <!-- 머리 -->
        <ellipse cx="250" cy="160" rx="125" ry="105"
                 fill="#b484f2" stroke="#49365f" stroke-width="9"/>

        <!-- 뿔 -->
        <path d="M170 82 L150 18 L205 70Z"
              fill="#ffe77a" stroke="#49365f" stroke-width="7"/>
        <path d="M330 82 L350 18 L295 70Z"
              fill="#ffe77a" stroke="#49365f" stroke-width="7"/>

        <!-- 귀 -->
        <path d="M135 135 Q75 90 95 165 Q115 185 145 175Z"
              fill="#ff9ecf" stroke="#49365f" stroke-width="7"/>
        <path d="M365 135 Q425 90 405 165 Q385 185 355 175Z"
              fill="#ff9ecf" stroke="#49365f" stroke-width="7"/>

        <!-- 눈 -->
        <ellipse cx="205" cy="145" rx="20" ry="28" fill="white"/>
        <ellipse cx="295" cy="145" rx="20" ry="28" fill="white"/>
        <circle id="eyeL" cx="205" cy="150" r="10" fill="#302047"/>
        <circle id="eyeR" cx="295" cy="150" r="10" fill="#302047"/>

        <!-- 코 -->
        <circle cx="232" cy="190" r="6" fill="#49365f"/>
        <circle cx="268" cy="190" r="6" fill="#49365f"/>

        <!-- 입 -->
        <path id="mouth"
              d="M220 207 Q250 230 280 207"
              fill="none" stroke="#49365f" stroke-width="8"
              stroke-linecap="round"/>

        <!-- 볼 -->
        <ellipse cx="155" cy="190" rx="22" ry="11" fill="#ff8ebc" opacity=".7"/>
        <ellipse cx="345" cy="190" rx="22" ry="11" fill="#ff8ebc" opacity=".7"/>

        <!-- 발 -->
        <ellipse cx="185" cy="372" rx="45" ry="22"
                 fill="#8a5dd0" stroke="#49365f" stroke-width="7"/>
        <ellipse cx="315" cy="372" rx="45" ry="22"
                 fill="#8a5dd0" stroke="#49365f" stroke-width="7"/>
      </svg>
    </div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-head"><span>😊 행복</span><span id="happyNum">70</span></div>
      <div class="stat-track"><div class="stat-fill" id="happyBar"></div></div>
    </div>

    <div class="stat">
      <div class="stat-head"><span>🛁 청결</span><span id="cleanNum">70</span></div>
      <div class="stat-track"><div class="stat-fill" id="cleanBar"></div></div>
    </div>

    <div class="stat">
      <div class="stat-head"><span>⚡ 에너지</span><span id="energyNum">70</span></div>
      <div class="stat-track"><div class="stat-fill" id="energyBar"></div></div>
    </div>
  </div>

  <div class="buttons">
    <button class="feed" onclick="feed()">🍖 밥 주기</button>
    <button class="play" onclick="play()">🎾 놀아주기</button>
    <button class="wash" onclick="wash()">🛁 씻기기</button>
    <button class="heal" onclick="heal()">💖 치료하기</button>
  </div>

  <div class="message" id="message">
    🐣 드래곤이 당신을 기다리고 있어요!
  </div>
</div>

<div class="sparkles" id="sparkles"></div>

<script>
let happy = 70;
let clean = 70;
let energy = 70;

let xp = 0;
let level = 1;
let stage = 0;
let sick = false;

const stages = [
  "🥚 알",
  "🐣 아기 드래곤",
  "🐲 어른 드래곤",
  "🌌 우주 드래곤",
  "🕳️ 블랙홀 드래곤"
];

const dragonColors = [
  ["#b484f2","#7046c5"],
  ["#7ee7c5","#43a889"],
  ["#ff9c65","#e85d42"],
  ["#65d8ff","#536cff"],
  ["#33334f","#090914"]
];

function clamp(n) {
  return Math.max(0, Math.min(200, n));
}

function checkSick() {
  if (happy <= 0 || clean <= 0 || energy <= 0) {
    sick = true;
  }
}

function addXP(amount) {
  if (sick) return;

  xp += amount;

  while (xp >= 200 && stage < 4) {
    xp -= 200;
    stage++;
    level++;
    evolve();
  }

  // 최종 단계에서는 경험치가 계속 쌓이되 바는 순환
  if (stage === 4 && xp >= 200) xp = 200;
}

function careDone() {
  checkSick();

  if (!sick) {
    addXP(50);
  }

  update();
}

function feed() {
  if (sick) {
    message("🤒 아픈 드래곤은 먼저 치료해주세요!");
    return;
  }

  happy = clamp(happy + 5);
  energy = clamp(energy + 5);
  clean = clamp(clean + 0);
  addXP(50);

  message("🍖 냠냠! 맛있는 밥을 먹었어요! 행복 +5, 에너지 +5");
  update();
}

function play() {
  if (sick) {
    message("🤒 아픈 드래곤은 놀 수 없어요. 먼저 치료해주세요!");
    return;
  }

  happy = clamp(happy + 25);
  clean = clamp(clean - 10);
  energy = clamp(energy - 15);

  addXP(50);
  checkSick();

  message("🎾 신나게 놀았어요! 행복 +25");
  update();
}

function wash() {
  if (sick) {
    message("🤒 아픈 드래곤은 먼저 치료해주세요!");
    return;
  }

  clean = clamp(clean + 35);
  happy = clamp(happy - 5);

  addXP(50);
  checkSick();

  message("🛁 반짝반짝 깨끗해졌어요! 청결 +35");
  update();
}

function heal() {
  if (!sick) {
    message("💖 드래곤은 건강해요! 더 많이 사랑해주세요.");
    return;
  }

  happy = Math.max(happy, 40);
  clean = Math.max(clean, 40);
  energy = Math.max(energy, 40);
  sick = false;

  message("💖 치료 완료! 드래곤이 건강해졌어요!");
  sparkle();
  update();
}

function evolve() {
  document.getElementById("message").innerText =
    "🎉✨ 드래곤이 진화했다! ✨🎉";

  sparkle();

  const [body, wing] = dragonColors[stage];

  document.querySelector(".dragon").querySelectorAll("ellipse").forEach(el => {
    if (
      el.getAttribute("fill") !== "white" &&
      el.getAttribute("fill") !== "#ffdca8" &&
      el.getAttribute("fill") !== "#ff8ebc"
    ) {
      el.setAttribute("fill", body);
    }
  });

  document.getElementById("wingL").setAttribute("fill", wing);
  document.getElementById("wingR").setAttribute("fill", wing);

  // 최종 진화는 블랙홀 느낌
  if (stage === 4) {
    document.querySelector(".aura").style.background =
      "radial-gradient(circle,#b36bff 0,#111 30%,transparent 70%)";
  }
}

function sparkle() {
  const box = document.getElementById("sparkles");

  for (let i = 0; i < 35; i++) {
    const s = document.createElement("div");
    s.className = "spark";
    s.textContent = ["✨","⭐","💫","🌟"][Math.floor(Math.random()*4)];
    s.style.left = (30 + Math.random()*40) + "vw";
    s.style.top = (25 + Math.random()*40) + "vh";
    s.style.setProperty("--x", (Math.random()*300-150) + "px");
    s.style.setProperty("--y", (Math.random()*300-150) + "px");
    box.appendChild(s);

    setTimeout(() => s.remove(), 1500);
  }
}

function message(text) {
  document.getElementById("message").innerText = text;
}

function updateBar(bar, value) {
  bar.style.width = (value / 2) + "%";
  bar.classList.toggle("low", value <= 35);
}

function updateFace() {
  const avg = (happy + clean + energy) / 3;
  const bubble = document.getElementById("faceText");
  const mouth = document.getElementById("mouth");

  if (sick || avg <= 25) {
    bubble.innerText = "🤒 아파요...";
    mouth.setAttribute("d","M220 225 Q250 200 280 225");
    document.getElementById("game").classList.add("sick");
  } else if (avg >= 110) {
    bubble.innerText = "🤩 최고예요!";
    mouth.setAttribute("d","M220 205 Q250 240 280 205");
    document.getElementById("game").classList.remove("sick");
  } else if (avg >= 60) {
    bubble.innerText = "😊 기분 좋아요!";
    mouth.setAttribute("d","M220 207 Q250 230 280 207");
    document.getElementById("game").classList.remove("sick");
  } else {
    bubble.innerText = "😟 조금 힘들어요";
    mouth.setAttribute("d","M220 225 Q250 205 280 225");
    document.getElementById("game").classList.remove("sick");
  }
}

function update() {
  checkSick();

  document.getElementById("happyNum").innerText = happy;
  document.getElementById("cleanNum").innerText = clean;
  document.getElementById("energyNum").innerText = energy;

  updateBar(document.getElementById("happyBar"), happy);
  updateBar(document.getElementById("cleanBar"), clean);
  updateBar(document.getElementById("energyBar"), energy);

  document.getElementById("stage").innerText = stages[stage];
  document.getElementById("level").innerText = level;
  document.getElementById("xp").innerText = xp;
  document.getElementById("xpFill").style.width =
    stage === 4 ? "100%" : (xp / 2) + "%";

  updateFace();
}

// 7초마다 전체 게이지 감소
setInterval(() => {
  happy = clamp(happy - 5);
  clean = clamp(clean - 5);
  energy = clamp(energy - 5);

  checkSick();

  if (sick) {
    message("🤒 드래곤이 아파요! 💖 치료해주세요!");
  } else {
    message("⏰ 시간이 지나 드래곤의 상태가 조금 떨어졌어요.");
  }

  update();
}, 7000);

update();
</script>
</body>
</html>
