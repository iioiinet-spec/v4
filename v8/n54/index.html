<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배리티 키우기: 진정한 하드코어 폭발 모드</title>
    <style>
        body {
            background-color: #FFFBE6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #4A4A4A;
        }
        .game-container {
            background-color: #FFFFFF;
            width: 420px;
            padding: 25px;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            box-sizing: border-box;
            position: relative;
        }
        h1 {
            margin-top: 0;
            color: #E74C3C;
            font-size: 24px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        .status-header {
            background-color: #FFFDF0;
            padding: 10px 15px;
            border-radius: 15px;
            margin-bottom: 15px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }
        /* 배리티 본체 디자인 및 애니메이션 */
        .pet-box {
            height: 160px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .pet {
            font-size: 70px;
            cursor: pointer;
            transition: transform 0.2s;
            animation: bounce 1.5s infinite ease-in-out;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0) scale(1, 1); }
            50% { transform: translateY(-15px) scale(1.05, 0.95); }
        }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-3px, 0px) rotate(-5deg); }
            40% { transform: translate(1px, -1px) rotate(5deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            80% { transform: translate(1px, -1px) rotate(1deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .angry-shake {
            animation: shake 0.2s infinite !important;
        }
        .speech-bubble {
            background-color: #FFEBEE;
            padding: 6px 14px;
            border-radius: 15px;
            font-size: 13px;
            margin-top: 10px;
            min-height: 20px;
            display: inline-block;
            font-weight: bold;
            color: #C62828;
            max-width: 90%;
            word-break: break-all;
        }
        /* 게이지 스타일 */
        .gauges {
            margin: 15px 0;
            text-align: left;
        }
        .gauge-row {
            margin-bottom: 8px;
        }
        .gauge-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 2px;
            font-weight: bold;
        }
        .gauge-bar-container {
            background-color: #EFEFEF;
            border-radius: 10px;
            height: 12px;
            overflow: hidden;
        }
        .gauge-bar {
            height: 100%;
            width: 70%;
            transition: width 0.3s, background-color 0.3s;
            border-radius: 10px;
        }
        .anger-bar {
            background-color: #E74C3C !important;
        }
        /* 버튼 스타일 (4개로 깔끔한 2x2 배치) */
        .buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        button {
            background-color: #E67E22;
            border: none;
            padding: 14px;
            border-radius: 15px;
            font-size: 14px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        button:hover {
            background-color: #D35400;
            transform: scale(0.98);
        }
        button:active {
            transform: scale(0.95);
        }

        /* 게임 오버 오버레이 화면 스타일 */
        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 10;
            display: none;
        }
        #game-over-screen h2 {
            color: #FF6B6B;
            font-size: 28px;
            margin-bottom: 10px;
        }
        #game-over-screen p {
            font-size: 14px;
            margin-bottom: 20px;
            color: #DDDDDD;
            text-align: center;
            padding: 0 20px;
        }
        #restart-btn {
            background-color: #FF6B6B;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        #restart-btn:hover {
            background-color: #EE5253;
        }
    </style>
</head>
<body>

<div class="game-container">
    <!-- 게임 오버 화면 -->
    <div id="game-over-screen">
        <h2>💥 KABOOM! GAME OVER 💥</h2>
        <p>배리티가 완전히 화나서 집을 폭8시켰어요! 🧨🔥<br>(치트키가 없으니 정말 빡세죠?)</p>
        <button id="restart-btn" onclick="restartGame()">재도전 🔄</button>
    </div>

    <h1>🔥 리얼 하드코어 배리티 🔥</h1>
    
    <div class="status-header">
        <span id="level-text">단계: 신비로운 알 🥚</span>
        <span id="exp-text">경험치: 0/100</span>
    </div>

    <!-- 펫 영역 -->
    <div class="pet-box">
        <div id="pet" class="pet" onclick="petClick()">🥚</div>
        <div id="speech" class="speech-bubble">이제 달래줄 버튼도 없지? 알아서 잘해봐라! 💢</div>
    </div>

    <!-- 스탯 게이지 -->
    <div class="gauges">
        <div class="gauge-row">
            <div class="gauge-label"><span>포만감 🍖</span><span id="hunger-val">60/100</span></div>
            <div class="gauge-bar-container"><div id="hunger-bar" class="gauge-bar"></div></div>
        </div>
        <div class="gauge-row">
            <div class="gauge-label"><span>행복도 ✨</span><span id="happy-val">60/100</span></div>
            <div class="gauge-bar-container"><div id="happy-bar" class="gauge-bar"></div></div>
        </div>
        <div class="gauge-row">
            <div class="gauge-label"><span>청결도 🧼</span><span id="clean-val">60/100</span></div>
            <div class="gauge-bar-container"><div id="clean-bar" class="gauge-bar"></div></div>
        </div>
        <div class="gauge-row">
            <div class="gauge-label"><span style="color:#C0392B;">분노 게이지 💢</span><span id="anger-val">0/100</span></div>
            <div class="gauge-bar-container"><div id="anger-bar" class="gauge-bar anger-bar" style="width: 0%;"></div></div>
        </div>
    </div>

    <!-- 상호작용 버튼 (긴급 달래주기 삭제 완료) -->
    <div class="buttons">
        <button onclick="feedPet()">🍚 밥 주기</button>
        <button onclick="playPet()">⚽ 놀아주기</button>
        <button onclick="cleanPet()">🛁 씻기기</button>
        <button onclick="sleepPet()">💤 재우기</button>
    </div>
</div>

<script>
    let game = {
        stage: 0,
        stageNames: ["신비로운 알 🥚", "아기 노란 구슬 🟡", "거대한 황금 구슬 🌕"],
        exp: 0,
        hunger: 60,
        happy: 60,
        clean: 60,
        anger: 0,
        isGameOver: false
    };

    const petEl = document.getElementById("pet");
    const speechEl = document.getElementById("speech");
    const levelText = document.getElementById("level-text");
    const expText = document.getElementById("exp-text");
    
    const hungerBar = document.getElementById("hunger-bar");
    const happyBar = document.getElementById("happy-bar");
    const cleanBar = document.getElementById("clean-bar");
    const angerBar = document.getElementById("anger-bar");
    
    const hungerVal = document.getElementById("hunger-val");
    const happyVal = document.getElementById("happy-val");
    const cleanVal = document.getElementById("clean-val");
    const angerVal = document.getElementById("anger-val");
    const gameOverScreen = document.getElementById("game-over-screen");

    function updateUI() {
        if (game.isGameOver) return;

        updateGaugeBar(hungerBar, hungerVal, game.hunger);
        updateGaugeBar(happyBar, happyVal, game.happy);
        updateGaugeBar(cleanBar, cleanVal, game.clean);
        
        angerBar.style.width = game.anger + "%";
        angerVal.innerText = Math.floor(game.anger) + "/100";

        levelText.innerText = `단계: ${game.stageNames[game.stage]}`;
        expText.innerText = `경험치: ${game.exp}/100`;

        if (game.anger >= 100) {
            triggerGameOver();
            return;
        }

        // 대사 시스템
        if (game.anger >= 75) {
            petEl.classList.add("angry-shake");
            setSpeech("진짜 폭발 직전이다!! 집 날아가기 전에 스탯 관리 똑바로 해!! 😡🧨");
        } else if (game.anger >= 40) {
            petEl.classList.add("angry-shake");
            setSpeech("눈 돌아가기 전에 관리 안 하냐? 💢");
        } else if (game.hunger < 40) {
            petEl.classList.remove("angry-shake");
            setSpeech("쓰러지기 직전이야! 빨리 밥 안 주면 집 폭8시킨다! 😡🍚");
            updatePetAppearance();
        } else if (game.happy < 40) {
            petEl.classList.remove("angry-shake");
            setSpeech("우울해서 미쳐버릴 것 같아... 빨리 안 놀아줘?! 😒⚽");
            updatePetAppearance();
        } else if (game.clean < 40) {
            petEl.classList.remove("angry-shake");
            setSpeech("몸이 엉망진창이야! 당장 씻겨줘! 🧼💦");
            updatePetAppearance();
        } else {
            petEl.classList.remove("angry-shake");
            if (speechEl.innerText.includes("폭발") || speechEl.innerText.includes("빨리") || speechEl.innerText.includes("미쳐")) {
                setSpeech("음... 이 정도면 눈감아 주지. 계속 긴장해라? 😏");
            }
            updatePetAppearance();
        }
    }

    function triggerGameOver() {
        game.isGameOver = true;
        gameOverScreen.style.display = "flex";
    }

    function restartGame() {
        game.stage = 0;
        game.exp = 0;
        game.hunger = 60;
        game.happy = 60;
        game.clean = 60;
        game.anger = 0;
        game.isGameOver = false;
        
        gameOverScreen.style.display = "none";
        petEl.classList.remove("angry-shake");
        setSpeech("이번엔 치트키도 없는데 잘 버텨보시지! 😈");
        updateUI();
    }

    function updateGaugeBar(barEl, valEl, value) {
        barEl.style.width = value + "%";
        valEl.innerText = Math.floor(value) + "/100";
        
        if (value > 50) barEl.style.backgroundColor = "#27AE60";
        else if (value > 25) barEl.style.backgroundColor = "#F39C12";
        else barEl.style.backgroundColor = "#C0392B";
    }

    function updatePetAppearance() {
        if (game.stage === 0) {
            petEl.innerText = "🥚";
        } else if (game.stage === 1) {
            if (game.happy >= 70) petEl.innerText = "🟡";
            else if (game.happy >= 30) petEl.innerText = "🟠";
            else petEl.innerText = "🫥";
        } else {
            if (game.happy >= 70) petEl.innerText = "🌕";
            else if (game.happy >= 30) petEl.innerText = "🟡";
            else petEl.innerText = "🌑";
        }
    }

    function setSpeech(text) {
        speechEl.innerText = text;
    }

    function addExp(amount) {
        if (game.isGameOver || game.anger >= 40) return;

        game.exp += amount;
        if (game.exp >= 100) {
            game.exp = 0;
            if (game.stage < 2) {
                game.stage++;
                setSpeech(`호오... ${game.stageNames[game.stage]}로 진화했네. 나쁘지 않아! 😎`);
            } else {
                setSpeech("드디어 궁극의 황금 구슬 도달! 인정해 줄게! 🏆");
            }
        }
    }

    function feedPet() {
        if (game.isGameOver) return;
        game.hunger = Math.min(100, game.hunger + 35);
        game.clean = Math.max(0, game.clean - 15);
        game.anger = Math.max(0, game.anger - 10);
        setSpeech("밥은 먹여줬는데 입에 뭐가 묻었잖아! 🍚😒");
        addExp(10);
        updateUI();
    }

    function playPet() {
        if (game.isGameOver) return;
        if (game.hunger < 25) return setSpeech("배고파서 쓰러지겠는데 무슨 놀이야! 밥부터 줘! 😡");

        game.happy = Math.min(100, game.happy + 40);
        game.hunger = Math.max(0, game.hunger - 25);
        game.clean = Math.max(0, game.clean - 20);
        game.anger = Math.max(0, game.anger - 10);
        
        setSpeech("재밌긴 한데 엄청 힘들고 더러워졌어! ⚽💦");
        addExp(10);
        updateUI();
    }

    function cleanPet() {
        if (game.isGameOver) return;
        game.clean = Math.min(100, game.clean + 50);
        game.happy = Math.max(0, game.happy - 15);
        game.anger = Math.max(0, game.anger - 5);
        setSpeech("개운하긴 한데 물 묻어서 귀찮아! 🛁😒");
        addExp(10);
        updateUI();
    }

    function sleepPet() {
        if (game.isGameOver) return;
        game.happy = Math.min(100, game.happy + 20);
        game.hunger = Math.max(0, game.hunger - 20);
        game.anger = Math.max(0, game.anger - 15);
        setSpeech("잠은 잤지만 배고프고 심심해졌어! 💤");
        addExp(10);
        updateUI();
    }

    function petClick() {
        if (game.isGameOver) return;
        setSpeech("함부로 건드리지 마! 기분 안 좋을 땐 역효과야! ⚡");
        game.anger = Math.min(100, game.anger + 5);
        updateUI();
    }

    setInterval(() => {
        if (game.isGameOver) return;

        game.hunger = Math.max(0, game.hunger - 6);
        game.happy = Math.max(0, game.happy - 6);
        game.clean = Math.max(0, game.clean - 5);

        if (game.hunger < 60 || game.happy < 60 || game.clean < 60) {
            game.anger = Math.min(100, game.anger + 35);
        } else {
            game.anger = Math.max(0, game.anger - 3);
        }

        updateUI();
    }, 2500);

    updateUI();
</script>

</body>
</html>
