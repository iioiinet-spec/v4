<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>공룡 키우기 게임</title>
  <style>
    :root {
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --primary: #a8e6cf;
      --primary-dark: #88d8b0;
      --accent: #ffaaa5;
      --text: #4a4a4a;
    }

    body {
      font-family: 'Pretendard', sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .game-container {
      background-color: var(--card-bg);
      width: 360px;
      padding: 24px;
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      text-align: center;
      position: relative;
    }

    /* 도감 버튼 (우측 상단) */
    .book-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: #fff0e6;
      border: 1.5px solid #ffd3b6;
      padding: 6px 10px;
      border-radius: 12px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* 상단 레벨 및 경험치 */
    .status-header {
      margin-bottom: 15px;
      margin-top: 10px;
    }
    .level-info {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 5px;
    }
    .exp-bar-bg {
      background-color: #eee;
      border-radius: 10px;
      height: 10px;
      overflow: hidden;
    }
    .exp-bar-fill {
      background-color: #ffd3b6;
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }

    /* 실시간 만족도 표시 */
    .satisfaction-tracker {
      font-size: 0.8rem;
      color: #888;
      margin-top: 4px;
    }

    /* 펫 표시 영역 */
    .pet-area {
      position: relative;
      margin: 15px 0;
      height: 140px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .speech-bubble {
      position: absolute;
      top: -10px;
      background: #fff3ed;
      border: 1.5px solid #ffaaa5;
      padding: 6px 12px;
      border-radius: 15px;
      font-size: 0.85rem;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .speech-bubble.show { opacity: 1; }

    .pet-emoji {
      font-size: 5rem;
      transition: transform 0.2s ease;
      cursor: pointer;
      display: inline-block;
    }

    /* 애니메이션 */
    .bounce {
      animation: bounceAnim 0.5s ease;
    }

    @keyframes bounceAnim {
      0%   { transform: translateY(0) scale(1, 1); }
      30%  { transform: translateY(-20px) scale(0.9, 1.1); }
      50%  { transform: translateY(0) scale(1.1, 0.9); }
      75%  { transform: translateY(-8px) scale(0.95, 1.05); }
      100% { transform: translateY(0) scale(1, 1); }
    }

    .sparkle-effect {
      animation: evolveAnim 0.8s ease-in-out;
    }

    @keyframes evolveAnim {
      0%   { transform: scale(1) rotate(0deg); filter: brightness(1); }
      50%  { transform: scale(1.4) rotate(180deg); filter: brightness(1.5) drop-shadow(0 0 15px gold); }
      75%  { transform: scale(0.9) rotate(360deg); }
      100% { transform: scale(1) rotate(360deg); filter: brightness(1); }
    }

    /* 게이지 영역 */
    .stats-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .stat-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.9rem;
    }

    .stat-label { width: 60px; text-align: left; }

    .bar-bg {
      flex: 1;
      background-color: #f0f0f0;
      height: 14px;
      border-radius: 7px;
      margin: 0 10px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 7px;
      transition: width 0.3s ease, background-color 0.3s ease;
    }

    #fullness-bar { background-color: #ff8b94; }
    #happiness-bar { background-color: #ffaaa5; }
    #cleanliness-bar { background-color: #a8e6cf; }
    #energy-bar { background-color: #dcedc1; }

    /* 버튼 영역 */
    .actions-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      background-color: #f7f9f8;
      border: 2px solid var(--primary-dark);
      color: var(--text);
      padding: 10px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:hover {
      background-color: var(--primary);
      color: #fff;
    }

    button:active {
      transform: scale(0.95);
    }

    .cure-btn {
      grid-column: span 2;
      border-color: #ff8b94;
      background-color: #ffe6e6;
    }
    .cure-btn:hover { background-color: #ff8b94; }

    .next-dino-btn {
      grid-column: span 2;
      border-color: #ffd3b6;
      background-color: #fff0e6;
      color: #d97724;
      font-size: 1rem;
      padding: 12px;
    }
    .next-dino-btn:hover {
      background-color: #ffd3b6;
      color: #fff;
    }

    /* 게임 완주 메뉴 화면 */
    #menu-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 0;
    }

    .menu-title {
      font-size: 1.5rem;
      font-weight: bold;
      color: #2b5c46;
      margin-bottom: 10px;
    }

    .restart-btn {
      background: #a8e6cf;
      border: 2px solid #88d8b0;
      color: #2b5c46;
      font-size: 1.1rem;
      padding: 14px 20px;
      border-radius: 14px;
      width: 90%;
      margin-top: 15px;
      cursor: pointer;
    }
    .restart-btn:hover {
      background: #88d8b0;
      color: #fff;
    }

    /* 모달 공통 */
    .modal-overlay {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 24px;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }
    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 16px;
      width: 80%;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    /* 결과 등급 카드 */
    .result-card {
      background: #faf5ff;
      border: 2px dashed #d8b4fe;
      border-radius: 12px;
      padding: 15px;
      margin: 15px 0;
    }
    .result-grade {
      font-size: 2.8rem;
      font-weight: bold;
      color: #9333ea;
      margin: 5px 0;
    }

    /* 도감 스타일 */
    .book-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 15px 0;
    }
    .book-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px;
      background: #f9f9f9;
      border-radius: 10px;
    }
    .book-item.locked { opacity: 0.5; }
    .close-btn {
      margin-top: 10px;
      background: #eee;
      border: none;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <button class="book-btn" onclick="openBookModal()">📖 도감</button>

    <!-- 인게임 화면 영역 -->
    <div id="game-screen">
      <div class="status-header">
        <div class="level-info"><span id="species-label">트리케라</span> <span id="stage-label">알</span> (Lv. <span id="level">1</span>/5)</div>
        <div class="exp-bar-bg">
          <div id="exp-bar" class="exp-bar-fill"></div>
        </div>
        <div class="satisfaction-tracker">누적 평균 만족도: <span id="satisfaction-score">100</span>점</div>
      </div>

      <div class="pet-area">
        <div id="speech" class="speech-bubble">반가워!</div>
        <div id="pet" class="pet-emoji">🥚</div>
      </div>

      <div class="stats-container">
        <div class="stat-row">
          <span class="stat-label">🍖 포만감</span>
          <div class="bar-bg"><div id="fullness-bar" class="bar-fill" style="width: 70%;"></div></div>
          <span id="fullness-val">70</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">😊 행복도</span>
          <div class="bar-bg"><div id="happiness-bar" class="bar-fill" style="width: 70%;"></div></div>
          <span id="happiness-val">70</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">🧼 청결도</span>
          <div class="bar-bg"><div id="cleanliness-bar" class="bar-fill" style="width: 70%;"></div></div>
          <span id="cleanliness-val">70</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">⚡ 에너지</span>
          <div class="bar-bg"><div id="energy-bar" class="bar-fill" style="width: 70%;"></div></div>
          <span id="energy-val">70</span>
        </div>
      </div>

      <div class="actions-container">
        <button onclick="feed()">🍖 밥 주기</button>
        <button onclick="play()">🎾 놀아주기</button>
        <button onclick="wash()">🧼 씻기기</button>
        <button onclick="sleep()">💤 재우기</button>
        <button id="cure-btn" class="cure-btn" onclick="cure()" style="display: none;">💊 치료하기</button>
        <button id="next-dino-btn" class="next-dino-btn" onclick="growNextDino()" style="display: none;">🎉 다음 공룡 키우기</button>
      </div>
    </div>

    <!-- 모든 키우기 완주 후 메뉴 화면 -->
    <div id="menu-screen">
      <div style="font-size: 4rem; margin-bottom: 10px;">🏆</div>
      <div class="menu-title">모든 공룡 완육 성공!</div>
      <div style="font-size: 0.9rem; color: #666; margin-bottom: 15px;">
        축하합니다! 도감의 모든 공룡을 훌륭하게 키워내셨습니다.
      </div>
      <button class="restart-btn" onclick="restartGameDirectly()">🔄 처음부터 다시 하기</button>
    </div>

    <!-- 1마리 키울 때마다 나오는 결과 등급 모달 -->
    <div id="result-modal" class="modal-overlay">
      <div class="modal-content">
        <h3>🎉 육성 완료!</h3>
        <p><span id="final-dino-name">공룡</span>의 완육을 축하합니다!</p>
        <div class="result-card">
          <div style="font-size: 0.85rem; color: #666;">최종 만족도 등급</div>
          <div id="final-grade" class="result-grade">SSS</div>
          <div id="final-score-text" style="font-size: 0.9rem; font-weight: bold;">평균 점수: 95점</div>
        </div>
        <p id="final-comment" style="font-size: 0.85rem; color: #666;">완벽한 케어였습니다!</p>
        
        <button class="close-btn" onclick="closeResultModal()">확인</button>
      </div>
    </div>

    <!-- 도감 모달 -->
    <div id="book-modal" class="modal-overlay">
      <div class="modal-content">
        <h3>📖 공룡 도감</h3>
        <div class="book-list" id="book-list"></div>
        <button class="close-btn" onclick="closeBookModal()">닫기</button>
      </div>
    </div>

  </div>

  <script>
    // --- 효과음 엔진 ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTone(freq, type = 'sine', duration = 0.15, startDelay = 0) {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime + startDelay);

      gain.gain.setValueAtTime(0.1, audioCtx.currentTime + startDelay);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + startDelay + duration);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(audioCtx.currentTime + startDelay);
      osc.stop(audioCtx.currentTime + startDelay + duration);
    }

    const sfx = {
      pop: () => playTone(523.25, 'sine', 0.1),
      play: () => { playTone(587.33, 'sine', 0.1); playTone(880, 'sine', 0.15, 0.1); },
      wash: () => { playTone(440, 'triangle', 0.1); playTone(659.25, 'triangle', 0.1, 0.08); },
      sleep: () => { playTone(329.63, 'sine', 0.3); },
      cure: () => { playTone(523.25, 'sine', 0.1); playTone(659.25, 'sine', 0.1, 0.1); playTone(783.99, 'sine', 0.2, 0.2); },
      levelUp: () => {
        playTone(523.25, 'triangle', 0.12, 0);
        playTone(659.25, 'triangle', 0.12, 0.1);
        playTone(783.99, 'triangle', 0.12, 0.2);
        playTone(1046.50, 'triangle', 0.3, 0.3);
      },
      fanfare: () => {
        playTone(523.25, 'triangle', 0.1, 0);
        playTone(659.25, 'triangle', 0.1, 0.1);
        playTone(783.99, 'triangle', 0.1, 0.2);
        playTone(1046.50, 'triangle', 0.2, 0.3);
        playTone(1318.51, 'triangle', 0.4, 0.5);
      }
    };

    const dinoList = ['tricera', 'tyranno', 'ptera'];
    let dinoIndex = 0;

    const dinoData = {
      tricera: { name: '트리케라', baby: '🦕', adult: '🦕' },
      tyranno: { name: '티라노', baby: '🦖', adult: '🦖' },
      ptera: { name: '프테라', baby: '🐣', adult: '🦅' }
    };

    let collection = {
      tricera: null,
      tyranno: null,
      ptera: null
    };

    let currentSpecies = dinoList[dinoIndex];
    let stats = { fullness: 70, happiness: 70, cleanliness: 70, energy: 70 };
    let exp = 0;
    let level = 1;
    let stage = 1; 
    let isSick = false;
    let isSleeping = false;
    let speechTimeout;
    let satisfactionHistory = [];

    const stageNames = { 1: '알', 2: '아기', 3: '어른' };

    function triggerBounce() {
      const petEl = document.getElementById('pet');
      petEl.classList.remove('bounce');
      void petEl.offsetWidth;
      petEl.classList.add('bounce');
    }

    function getAverageStat() {
      const sum = stats.fullness + stats.happiness + stats.cleanliness + stats.energy;
      return Math.round(sum / 4);
    }

    function recordSatisfaction() {
      if (level >= 5) return;
      let score = getAverageStat();
      if (isSick) score -= 30;
      satisfactionHistory.push(Math.max(0, score));
    }

    function getOverallSatisfaction() {
      if (satisfactionHistory.length === 0) return 70;
      const total = satisfactionHistory.reduce((a, b) => a + b, 0);
      return Math.round(total / satisfactionHistory.length);
    }

    function checkAllCompleted() {
      return Object.values(collection).every(val => val !== null);
    }

    function updateUI() {
      for (let key in stats) {
        const val = Math.max(0, Math.min(100, stats[key]));
        stats[key] = val;
        document.getElementById(`${key}-val`).innerText = val;
        document.getElementById(`${key}-bar`).style.width = `${val}%`;
      }

      if (Object.values(stats).some(val => val === 0) && !isSick) {
        isSick = true;
        showMessage("아파요... 치료해 주세요!");
      }

      document.getElementById('cure-btn').style.display = isSick ? 'block' : 'none';
      document.getElementById('next-dino-btn').style.display = (level >= 5 && !checkAllCompleted()) ? 'block' : 'none';

      const petEl = document.getElementById('pet');
      if (isSleeping) {
        petEl.innerText = '💤';
      } else if (isSick) {
        petEl.innerText = '🤒';
      } else {
        if (stage === 1) petEl.innerText = '🥚';
        else if (stage === 2) petEl.innerText = dinoData[currentSpecies].baby;
        else petEl.innerText = dinoData[currentSpecies].adult;
      }

      document.getElementById('level').innerText = level;
      document.getElementById('species-label').innerText = dinoData[currentSpecies].name;
      document.getElementById('stage-label').innerText = stageNames[stage];
      document.getElementById('exp-bar').style.width = (level >= 5) ? '100%' : `${exp}%`;
      document.getElementById('satisfaction-score').innerText = getOverallSatisfaction();
    }

    function showMessage(msg) {
      const bubble = document.getElementById('speech');
      bubble.innerText = msg;
      bubble.classList.add('show');
      clearTimeout(speechTimeout);
      speechTimeout = setTimeout(() => {
        bubble.classList.remove('show');
      }, 2000);
    }

    function addExp(amount) {
      if (isSick || level >= 5) return;

      recordSatisfaction();
      exp += amount;

      if (exp >= 100) {
        exp -= 100;
        level++;

        sfx.levelUp();

        if (level === 5) {
          exp = 100;
          finishGrowth();
        } else {
          showMessage("레벨 업!");
        }

        if (level === 2 && stage === 1) evolve(2);
        else if (level === 4 && stage === 2) evolve(3);
      }
    }

    // 한 마리 키울 때마다 팝업으로 SSS 등급 표시
    function finishGrowth() {
      const finalScore = getOverallSatisfaction();
      let grade = 'C';
      let comment = '';

      if (finalScore >= 90) { grade = 'SSS'; comment = '최고의 보호자! 공룡이 완벽하게 자랐습니다.'; }
      else if (finalScore >= 80) { grade = 'S'; comment = '아주 훌륭해요! 공룡이 매우 행복해합니다.'; }
      else if (finalScore >= 70) { grade = 'A'; comment = '무난하게 잘 키우셨네요.'; }
      else if (finalScore >= 55) { grade = 'B'; comment = '무사히 어른이 되었습니다.'; }
      else { grade = 'C'; comment = '스탯 관리에 조금 더 신경 써주세요.'; }

      const gradeOrder = { 'SSS': 5, 'S': 4, 'A': 3, 'B': 2, 'C': 1 };
      const currentBest = collection[currentSpecies];
      if (!currentBest || gradeOrder[grade] > gradeOrder[currentBest]) {
        collection[currentSpecies] = grade;
      }

      document.getElementById('final-dino-name').innerText = dinoData[currentSpecies].name;
      document.getElementById('final-grade').innerText = grade;
      document.getElementById('final-score-text').innerText = `평균 점수: ${finalScore}점`;
      document.getElementById('final-comment').innerText = comment;

      document.getElementById('result-modal').style.display = 'flex';
    }

    function closeResultModal() {
      document.getElementById('result-modal').style.display = 'none';

      // 만약 도감의 모든 공룡을 키웠다면 최종 메뉴 화면으로 전환
      if (checkAllCompleted()) {
        sfx.fanfare();
        document.getElementById('game-screen').style.display = 'none';
        document.getElementById('menu-screen').style.display = 'flex';
      } else {
        updateUI();
      }
    }

    function growNextDino() {
      dinoIndex = (dinoIndex + 1) % dinoList.length;
      resetDinoStatus(dinoList[dinoIndex]);
      showMessage(`새로운 ${dinoData[currentSpecies].name} 알을 만났어요!`);
    }

    // [처음부터 다시 하기] 클릭 시 전체 초기화
    function restartGameDirectly() {
      sfx.levelUp();
      collection = { tricera: null, tyranno: null, ptera: null };
      dinoIndex = 0;
      resetDinoStatus(dinoList[0]);
      document.getElementById('menu-screen').style.display = 'none';
      document.getElementById('game-screen').style.display = 'block';
      showMessage(`게임이 리셋되었습니다! 첫 번째 알부터 시작합니다.`);
    }

    function resetDinoStatus(species) {
      currentSpecies = species;
      level = 1;
      stage = 1;
      exp = 0;
      stats = { fullness: 70, happiness: 70, cleanliness: 70, energy: 70 };
      satisfactionHistory = [];
      isSick = false;
      isSleeping = false;
      triggerBounce();
      updateUI();
    }

    function evolve(nextStage) {
      stage = nextStage;
      const petEl = document.getElementById('pet');
      petEl.classList.remove('bounce');
      petEl.classList.add('sparkle-effect');
      
      const name = `${dinoData[currentSpecies].name} (${stageNames[stage]})`;
      showMessage(`${name}(으)로 진화했다!`);

      setTimeout(() => {
        petEl.classList.remove('sparkle-effect');
      }, 800);
    }

    function feed() {
      if (isSleeping) return;
      sfx.pop();
      triggerBounce();
      stats.fullness += 25;
      stats.happiness += (stats.energy > 0) ? 5 : 0;
      showMessage("냠냠, 맛있다!");
      addExp(10);
      updateUI();
    }

    function play() {
      if (isSleeping) return;
      if (stats.energy < 15) {
        showMessage("너무 피곤해서 놀 수 없어요!");
        return;
      }
      sfx.play();
      triggerBounce();
      stats.happiness += 25;
      stats.fullness -= 10;
      stats.energy -= 15;
      stats.cleanliness -= 10;
      showMessage("신나게 놀았다!");
      addExp(10);
      updateUI();
    }

    function wash() {
      if (isSleeping) return;
      sfx.wash();
      triggerBounce();
      stats.cleanliness += 35;
      stats.happiness -= 5;
      showMessage("뽀득뽀득 깨끗해요!");
      addExp(10);
      updateUI();
    }

    function sleep() {
      if (isSleeping) return;
      sfx.sleep();
      triggerBounce();
      isSleeping = true;
      showMessage("쿨쿨... 잠드는 중");
      updateUI();

      setTimeout(() => {
        stats.energy += 40;
        stats.fullness -= 10;
        isSleeping = false;
        showMessage("잘 잤다!");
        addExp(10);
        updateUI();
      }, 2000);
    }

    function cure() {
      if (!isSick) return;
      sfx.cure();
      triggerBounce();
      isSick = false;
      for (let key in stats) {
        if (stats[key] === 0) stats[key] = 30;
      }
      showMessage("건강을 회복했어요!");
      updateUI();
    }

    function openBookModal() {
      sfx.pop();
      const bookList = document.getElementById('book-list');
      bookList.innerHTML = '';

      for (let key in dinoData) {
        const grade = collection[key];
        const isUnlocked = grade !== null;
        const dino = dinoData[key];

        const item = document.createElement('div');
        item.className = `book-item ${isUnlocked ? '' : 'locked'}`;
        item.innerHTML = `
          <span>${isUnlocked ? dino.adult : '❓'}</span>
          <span><strong>${isUnlocked ? dino.name : '???'}</strong></span>
          <span>${isUnlocked ? `최고 등급: ${grade}` : '미수집'}</span>
        `;
        bookList.appendChild(item);
      }

      document.getElementById('book-modal').style.display = 'flex';
    }

    function closeBookModal() {
      sfx.pop();
      document.getElementById('book-modal').style.display = 'none';
    }

    setInterval(() => {
      if (!isSleeping && document.getElementById('game-screen').style.display !== 'none') {
        stats.fullness -= 2;
        stats.happiness -= 2;
        stats.cleanliness -= 1;
        stats.energy -= 1;
        recordSatisfaction();
        updateUI();
      }
    }, 3000);

    updateUI();
  </script>
</body>
</html>
