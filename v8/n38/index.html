<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공룡 키우기 게임 🦕</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f7f9fc;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
            transition: background-color 0.5s;
        }
        body.sleeping-mode {
            background-color: #212529;
            color: #adb5bd;
        }
        .game-container {
            background-color: #ffffff;
            width: 400px;
            padding: 25px;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: background-color 0.5s, color 0.5s, box-shadow 0.5s;
        }
        body.sleeping-mode .game-container {
            background-color: #343a40;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-size: 24px;
            color: #ff6b6b;
            margin-bottom: 15px;
        }
        body.sleeping-mode h1 {
            color: #ff8787;
        }
        /* 상단 정보 */
        .info-panel {
            background-color: #fff0f0;
            padding: 12px;
            border-radius: 15px;
            margin-bottom: 20px;
            transition: background-color 0.5s;
        }
        body.sleeping-mode .info-panel {
            background-color: #495057;
        }
        .level-text {
            font-size: 16px;
            font-weight: bold;
            color: #ff6b6b;
            margin-bottom: 8px;
        }
        body.sleeping-mode .level-text {
            color: #ffa8a8;
        }
        .exp-bar-container {
            width: 100%;
            background-color: #ffe3e3;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            transition: background-color 0.5s;
        }
        body.sleeping-mode .exp-bar-container {
            background-color: #6c757d;
        }
        .exp-bar {
            width: 0%;
            height: 100%;
            background-color: #ff8787;
            transition: width 0.3s;
        }
        /* 공룡 영역 */
        .pet-stage {
            position: relative;
            height: 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }
        .speech-bubble {
            background-color: #fff;
            border: 2px solid #ffd43b;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            color: #f59f00;
            margin-bottom: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            min-height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.5s, color 0.5s, border-color 0.5s;
        }
        body.sleeping-mode .speech-bubble {
            background-color: #495057;
            border-color: #748ffc;
            color: #bac8ff;
        }
        .pet-avatar {
            font-size: 70px;
            animation: bounce 1.5s infinite ease-in-out;
            transition: transform 0.2s;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .sparkle {
            position: absolute;
            font-size: 30px;
            animation: pop 0.6s ease-out forwards;
        }
        @keyframes pop {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(1.5) translateY(-30px); opacity: 0; }
        }
        /* 스탯 영역 */
        .stats-container {
            background-color: #f1f3f5;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            text-align: left;
            transition: background-color 0.5s;
        }
        body.sleeping-mode .stats-container {
            background-color: #495057;
        }
        .stat-item {
            margin-bottom: 8px;
        }
        .stat-item:last-child {
            margin-bottom: 0;
        }
        .stat-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 3px;
        }
        body.sleeping-mode .stat-label {
            color: #e9ecef;
        }
        .stat-bar-container {
            width: 100%;
            background-color: #e9ecef;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            transition: background-color 0.5s;
        }
        body.sleeping-mode .stat-bar-container {
            background-color: #6c757d;
        }
        .stat-bar {
            height: 100%;
            width: 35%;
            transition: width 0.3s, background-color 0.3s;
        }
        /* 버튼 영역 */
        .action-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        button {
            background-color: #748ffc;
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        button:hover {
            background-color: #5c7cfa;
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(0);
        }
        button:disabled {
            background-color: #adb5bd !important;
            cursor: not-allowed;
            transform: none !important;
        }
        button.heal-btn {
            grid-column: span 2;
            background-color: #ff6b6b;
            display: none;
        }
        button.heal-btn:hover {
            background-color: #fa5252;
        }
        button.restart-btn {
            grid-column: span 2;
            background-color: #38d9a9;
            display: none;
        }
        button.restart-btn:hover {
            background-color: #20c997;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>🦕 공룡 키우기</h1>

        <!-- 상단 정보 (레벨 및 경험치) -->
        <div class="info-panel">
            <div class="level-text" id="levelText">단계: 알 🥚 (경험치 0/1000)</div>
            <div class="exp-bar-container">
                <div class="exp-bar" id="expBar"></div>
            </div>
        </div>

        <!-- 펫 영역 -->
        <div class="pet-stage">
            <div class="speech-bubble" id="speechBubble">안녕! 나를 잘 돌봐줘! 👋</div>
            <div class="pet-avatar" id="petAvatar">🥚</div>
        </div>

        <!-- 스탯 영역 -->
        <div class="stats-container">
            <div class="stat-item">
                <div class="stat-label">
                    <span>❤️ 체력 (HP)</span>
                    <span id="hpText">100/100</span>
                </div>
                <div class="stat-bar-container">
                    <div class="stat-bar" id="hpBar" style="width: 100%;"></div>
                </div>
            </div>
            <div class="stat-item">
                <div class="stat-label">
                    <span>🍗 포만감 (최대 200, 150초과 시 위험)</span>
                    <span id="hungerText">70/200</span>
                </div>
                <div class="stat-bar-container">
                    <div class="stat-bar" id="hungerBar" style="width: 35%;"></div>
                </div>
            </div>
            <div class="stat-item">
                <div class="stat-label">
                    <span>💖 행복</span>
                    <span id="happyText">70/100</span>
                </div>
                <div class="stat-bar-container">
                    <div class="stat-bar" id="happyBar" style="width: 70%;"></div>
                </div>
            </div>
            <div class="stat-item">
                <div class="stat-label">
                    <span>✨ 청결</span>
                    <span id="cleanText">70/100</span>
                </div>
                <div class="stat-bar-container">
                    <div class="stat-bar" id="cleanBar" style="width: 70%;"></div>
                </div>
            </div>
        </div>

        <!-- 상호작용 버튼 -->
        <div class="action-buttons">
            <button id="feedBtn" onclick="feedPet()">🍗 밥 주기</button>
            <button id="playBtn" onclick="playWithPet()">🎾 놀아주기</button>
            <button id="washBtn" onclick="washPet()">🧼 씻기기</button>
            <button id="sleepBtn" onclick="sleepPet()">💤 재우기</button>
            <button class="heal-btn" id="healBtn" onclick="healPet()">💊 치료하기</button>
            <button class="restart-btn" id="restartBtn" onclick="restartGame()">🔄 처음부터 다시 시작하기</button>
        </div>
    </div>

    <script>
        let game = {
            level: 1, 
            exp: 0,
            hp: 100,
            hunger: 70, 
            happy: 70,
            clean: 70,
            isSick: false,
            isDead: false,
            isCompleted: false,
            isSleeping: false,
            awakeSeconds: 0,
            dinoType: null // 랜덤으로 결정될 공룡 타입 ('tyrano', 'brachio', 'ceratops')
        };

        const maxExp = 1000; 
        const maxHunger = 200; 

        const dinoData = {
            tyrano: { name: '티라노사우루스', icons: { 2: '🐣', 3: '🦖', 4: '🦖👑' } },
            brachio: { name: '브라키오사우루스', icons: { 2: '🐣', 3: '🦕', 4: '🦕👑' } },
            ceratops: { name: '트리케라톱스', icons: { 2: '🐣', 3: '🐉', 4: '🐉👑' } }
        };

        let sickTimer = null;

        const petAvatar = document.getElementById('petAvatar');
        const speechBubble = document.getElementById('speechBubble');
        const levelText = document.getElementById('levelText');
        const expBar = document.getElementById('expBar');
        
        const hpBar = document.getElementById('hpBar');
        const hpText = document.getElementById('hpText');
        const hungerBar = document.getElementById('hungerBar');
        const hungerText = document.getElementById('hungerText');
        const happyBar = document.getElementById('happyBar');
        const happyText = document.getElementById('happyText');
        const cleanBar = document.getElementById('cleanBar');
        const cleanText = document.getElementById('cleanText');
        const healBtn = document.getElementById('healBtn');
        const restartBtn = document.getElementById('restartBtn');
        
        const feedBtn = document.getElementById('feedBtn');
        const playBtn = document.getElementById('playBtn');
        const washBtn = document.getElementById('washBtn');
        const sleepBtn = document.getElementById('sleepBtn');

        function showMessage(msg) {
            speechBubble.innerText = msg;
        }

        function updateBar(barElement, textElement, value, maxVal) {
            let percent = (value / maxVal) * 100;
            barElement.style.width = percent + '%';
            textElement.innerText = `${value}/${maxVal}`;

            if (maxVal === 200) {
                if (value > 150) {
                    barElement.style.backgroundColor = '#ff6b6b'; 
                } else if (value >= 50) {
                    barElement.style.backgroundColor = '#51cf66'; 
                } else if (value >= 20) {
                    barElement.style.backgroundColor = '#ffd43b'; 
                } else {
                    barElement.style.backgroundColor = '#ff6b6b'; 
                }
            } else {
                if (value > 50) {
                    barElement.style.backgroundColor = '#51cf66';
                } else if (value > 20) {
                    barElement.style.backgroundColor = '#ffd43b';
                } else {
                    barElement.style.backgroundColor = '#ff6b6b';
                }
            }
        }

        function getLevelName() {
            if (game.level === 1) return '알 🥚';
            let typeName = dinoData[game.dinoType].name;
            if (game.level === 2) return `아기 ${typeName}`;
            if (game.level === 3) return `어린이 ${typeName}`;
            return `어른 ${typeName} 👑`;
        }

        function updateUI() {
            updateBar(hpBar, hpText, game.hp, 100);
            updateBar(hungerBar, hungerText, game.hunger, 200);
            updateBar(happyBar, happyText, game.happy, 100);
            updateBar(cleanBar, cleanText, game.clean, 100);

            let expPercent = game.isCompleted ? 100 : (game.exp / maxExp) * 100;
            expBar.style.width = expPercent + '%';
            
            if (game.isDead) {
                levelText.innerText = `단계: 게임 오버 (사망)`;
            } else if (game.isCompleted) {
                levelText.innerText = `단계: 최종 성체 달성! 🏆`;
            } else {
                levelText.innerText = `단계: ${getLevelName()} (경험치 ${game.exp}/${maxExp})`;
            }

            if (game.isDead) {
                petAvatar.innerText = '👻';
                healBtn.style.display = 'none';
                restartBtn.style.display = 'block';
                return;
            }

            if (game.isCompleted) {
                petAvatar.innerText = dinoData[game.dinoType].icons[4];
                healBtn.style.display = 'none';
                restartBtn.style.display = 'block';
                return;
            }

            if (game.isSleeping) {
                document.body.classList.add('sleeping-mode');
                petAvatar.innerText = '💤';
                healBtn.style.display = 'none';
                feedBtn.disabled = true;
                playBtn.disabled = true;
                washBtn.disabled = true;
                sleepBtn.disabled = true;
                return;
            } else {
                document.body.classList.remove('sleeping-mode');
                feedBtn.disabled = false;
                playBtn.disabled = false;
                washBtn.disabled = false;
                sleepBtn.disabled = false;
            }

            if (game.isSick) {
                petAvatar.innerText = '🤒';
                healBtn.style.display = 'block';
                if (game.hunger > 150) {
                    showMessage("너무 많이 먹어서 배탈이 났어요! 🤢 (체력 감소 중!)");
                    healBtn.innerText = "💊 소화제 먹이기";
                } else {
                    showMessage("아파요... 병원에 데려가 주세요 😢 (체력 감소 중!)");
                    healBtn.innerText = "💊 치료하기";
                }
            } else {
                healBtn.style.display = 'none';
                let avgStat = ((game.hunger / 200 * 100) + game.happy + game.clean) / 3;
                if (game.level === 1) {
                    petAvatar.innerText = '🥚';
                } else {
                    if (avgStat >= 70) {
                        petAvatar.innerText = dinoData[game.dinoType].icons[game.level];
                    } else if (avgStat >= 40) {
                        petAvatar.innerText = '😐';
                    } else {
                        petAvatar.innerText = '😢';
                    }
                }
            }
        }

        function triggerSickness() {
            if (!game.isSick && !game.isDead && !game.isSleeping) {
                game.isSick = true;
                
                sickTimer = setTimeout(() => {
                    if (game.isSick && !game.isDead) {
                        game.hp = 0;
                        game.isDead = true;
                        showMessage("방치되어 하늘나라로 떠났습니다... 👻");
                        updateUI();
                    }
                }, 10000);
            }
        }

        function addExp(amount) {
            if (game.isSick || game.isDead || game.isCompleted || game.isSleeping) return;

            game.exp += amount;
            if (game.exp >= maxExp) {
                game.exp = maxExp;
                game.isCompleted = true;
                game.level = 4;
                triggerFinalEvolutionEffect();
                updateUI();
                return;
            }

            let prevLevel = game.level;
            if (game.exp >= 666) {
                game.level = 3;
            } else if (game.exp >= 333) {
                game.level = 2;
                // 알에서 처음 부화할 때 랜덤으로 공룡 종류 결정!
                if (!game.dinoType) {
                    const types = ['tyrano', 'brachio', 'ceratops'];
                    game.dinoType = types[Math.floor(Math.random() * types.length)];
                }
            } else {
                game.level = 1;
            }

            if (game.level > prevLevel) {
                triggerEvolutionEffect();
            }

            updateUI();
        }

        function triggerEvolutionEffect() {
            if (game.level === 2) {
                showMessage(`🎉 알이 깨어났다! 귀여운 ${dinoData[game.dinoType].name} 아기가 태어났어요! 🐣✨`);
            } else {
                showMessage(`🎉 공룡이 ${getLevelName()}(으)로 진화했다! ✨`);
            }
            createSparkles();
        }

        function triggerFinalEvolutionEffect() {
            showMessage(`🏆 축하합니다! 멋진 ${dinoData[game.dinoType].name}(으)로 완전히 성장했어요! 🎉`);
            createSparkles();
        }

        function createSparkles() {
            const stage = document.querySelector('.pet-stage');
            for (let i = 0; i < 6; i++) {
                const sparkle = document.createElement('div');
                sparkle.classList.add('sparkle');
                sparkle.innerText = i % 2 === 0 ? '✨' : '⭐';
                sparkle.style.left = `${Math.random() * 80 + 10}%`;
                sparkle.style.top = `${Math.random() * 50 + 20}%`;
                stage.appendChild(sparkle);
                setTimeout(() => sparkle.remove(), 600);
            }
        }

        // --- 상호작용 함수들 ---
        function feedPet() {
            if (game.isSick || game.isDead || game.isCompleted || game.isSleeping) return;
            game.hunger = Math.min(maxHunger, game.hunger + 25);
            game.happy = Math.min(100, game.happy + 5);
            game.hp = Math.min(100, game.hp + 10);
            
            if (game.hunger > 150) {
                triggerSickness();
            } else {
                showMessage("냠냠! 밥을 먹고 체력이 올랐어요! 🍖💖");
                addExp(10);
            }
            updateUI();
        }

        function playWithPet() {
            if (game.isSick || game.isDead || game.isCompleted || game.isSleeping) return;
            if (game.hunger < 10) { return showMessage("배고파서 놀 힘이 없어요... 🍗 먼저 밥을 주세요!"); }
            if (game.hp < 15) { return showMessage("체력이 너무 부족해서 놀 수 없어요... 휴식이 필요해요! 💤"); }
            
            game.happy = Math.min(100, game.happy + 25);
            game.hunger = Math.max(0, game.hunger - 10);
            game.clean = Math.max(0, game.clean - 10);
            game.hp = Math.max(0, game.hp - 10);
            
            if (game.hp === 0) {
                game.isDead = true;
                showMessage("너무 지쳐서 쓰러졌어요... 👻");
                updateUI();
                return;
            }

            showMessage("신나게 뛰어놀았어요! (체력 -10) 🎾✨");
            addExp(10);
            updateUI();
        }

        function washPet() {
            if (game.isSick || game.isDead || game.isCompleted || game.isSleeping) return;
            game.clean = Math.min(100, game.clean + 35);
            game.happy = Math.max(0, game.happy - 5);
            showMessage("뽀득뽀득 깨끗해졌어요! 🧼");
            addExp(10);
        }

        function sleepPet() {
            if (game.isSick || game.isDead || game.isCompleted || game.isSleeping) return;
            
            game.isSleeping = true;
            game.awakeSeconds = 0;
            showMessage("쿨쿨... 푹 자는 중입니다... (10초 동안 정지) 💤");
            updateUI();

            setTimeout(() => {
                if (!game.isDead) {
                    game.isSleeping = false;
                    game.hunger = Math.max(0, game.hunger - 10);
                    game.happy = Math.min(100, game.happy + 15);
                    game.hp = Math.min(100, game.hp + 30);
                    showMessage("개운하게 잘 일어났어요! (체력 +30) ☀️✨");
                    addExp(10);
                    updateUI();
                }
            }, 10000);
        }

        function healPet() {
            if (game.isDead || game.isCompleted || game.isSleeping) return;
            
            clearTimeout(sickTimer);
            game.isSick = false;
            game.hp = Math.min(100, game.hp + 50);

            if (game.hunger > 150) {
                game.hunger = 100;
                showMessage("소화제를 먹고 배탈이 나았어요! 💊✨");
            } else {
                game.hunger = Math.max(40, game.hunger);
            }
            game.happy = Math.max(40, game.happy);
            game.clean = Math.max(40, game.clean);
            updateUI();
        }

        function restartGame() {
            clearTimeout(sickTimer);
            game = {
                level: 1,
                exp: 0,
                hp: 100,
                hunger: 70,
                happy: 70,
                clean: 70,
                isSick: false,
                isDead: false,
                isCompleted: false,
                isSleeping: false,
                awakeSeconds: 0,
                dinoType: null
            };
            restartBtn.style.display = 'none';
            document.body.classList.remove('sleeping-mode');
            showMessage("새로운 알이 나타났어요! 어떤 공룡이 나올까요? 🥚");
            updateUI();
        }

        // 3초마다 게이지 감소 시스템
        setInterval(() => {
            if (!game.isSick && !game.isDead && !game.isCompleted && !game.isSleeping) {
                game.hunger = Math.max(0, game.hunger - 3);
                game.happy = Math.max(0, game.happy - 3);
                game.clean = Math.max(0, game.clean - 3);

                if (game.hunger === 0 || game.happy === 0 || game.clean === 0) {
                    triggerSickness();
                }
                updateUI();
            }
        }, 3000);

        // 2초마다 아픈 상태일 때 체력 감소 시스템
        setInterval(() => {
            if (game.isSick && !game.isDead && !game.isCompleted && !game.isSleeping) {
                game.hp = Math.max(0, game.hp - 15);
                if (game.hp === 0) {
                    game.isDead = true;
                    showMessage("체력이 바닥나서 하늘나라로 떠났습니다... 👻");
                }
                updateUI();
            }
        }, 2000);

        // 1초마다 수면 부족(과로) 체크 시스템
        setInterval(() => {
            if (!game.isDead && !game.isCompleted && !game.isSleeping) {
                game.awakeSeconds++;

                if (game.awakeSeconds >= 30) {
                    game.hp = Math.max(0, game.hp - 10);
                    showMessage("너무 안 자서 졸음이 쏟아져요! 체력이 깎이는 중... 🥱💥");

                    if (game.hp === 0) {
                        game.isDead = true;
                        showMessage("너무 피곤해서 쓰러져 사망했습니다... 👻");
                    }
                    updateUI();
                }
            }
        }, 1000);

        updateUI();
    </script>
</body>
</html>
