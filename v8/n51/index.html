<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>파이리 키우기 게임</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #FFF5EE;
    font-family: Arial, "Malgun Gothic", sans-serif;
    color: #4A4A4A;
}

.game-container {
    width: 400px;
    max-width: 94vw;
    padding: 25px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,.1);
    text-align: center;
}

/* 상단 */
.header-info {
    display: flex;
    justify-content: space-between;
    padding: 12px 15px;
    background: #FFF0F5;
    border-radius: 12px;
    font-weight: bold;
}

/* 경험치 */
.exp-title {
    text-align: left;
    font-size: 12px;
    color: #888;
    margin-top: 15px;
}

.exp-bg {
    height: 10px;
    margin: 6px 0 15px;
    background: #e5e5e5;
    border-radius: 10px;
    overflow: hidden;
}

.exp-bar {
    width: 0%;
    height: 100%;
    background: #FFD700;
    transition: .3s;
}

/* 캐릭터 */
.pet-stage {
    min-height: 315px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.pet-image-box {
    width: 260px;
    height: 260px;
    background: #FFF5EE;
    border-radius: 30px;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
}

.pet-avatar {
    width: 235px;
    height: 235px;
    object-fit: contain;
    cursor: pointer;
    user-select: none;
    animation: bounce 1.5s infinite ease-in-out;
}

@keyframes bounce {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-8px);
    }
}

/* 진화/클릭 효과 */
.sparkle {
    animation: sparkle .6s ease !important;
}

@keyframes sparkle {
    0% {
        transform: scale(1);
        filter: brightness(1);
    }

    50% {
        transform: scale(1.18);
        filter: brightness(1.4);
    }

    100% {
        transform: scale(1);
        filter: brightness(1);
    }
}

/* 말풍선 */
.speech {
    margin-top: 15px;
    padding: 7px 14px;
    border: 2px solid #FFD700;
    border-radius: 15px;
    background: #FFF8DC;
    font-size: 14px;
}

/* 능력치 */
.stats {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin: 10px 0 25px;
}

.stat {
    display: flex;
    align-items: center;
    gap: 10px;
}

.label {
    width: 55px;
    font-size: 14px;
    font-weight: bold;
    text-align: left;
}

.stat-bg {
    flex: 1;
    height: 14px;
    background: #eee;
    border-radius: 10px;
    overflow: hidden;
}

.stat-fill {
    width: 70%;
    height: 100%;
    transition: .3s;
}

/* 버튼 */
.buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

button {
    border: none;
    padding: 13px;
    border-radius: 14px;
    background: #FFEBEE;
    color: #555;
    font-weight: bold;
    cursor: pointer;
    font-size: 15px;
    transition: .2s;
}

button:hover {
    background: #FFCDD2;
    transform: translateY(-2px);
}

button:active {
    transform: translateY(0);
}

#heal {
    display: none;
    grid-column: span 2;
    background: #E8F5E9;
    color: #2E7D32;
}

/* 이미지 설정 */
.image-settings {
    margin-top: 22px;
    padding-top: 15px;
    border-top: 1px solid #eee;
}

.image-settings summary {
    cursor: pointer;
    color: #888;
    font-size: 13px;
}

.image-input {
    margin-top: 12px;
    text-align: left;
    font-size: 12px;
}

.image-input label {
    display: block;
    margin-bottom: 5px;
    font-weight: bold;
}

.image-input input {
    width: 100%;
    font-size: 12px;
}

.image-status {
    margin-top: 12px;
    font-size: 11px;
    color: #888;
    line-height: 1.6;
}

.reset-btn {
    margin-top: 10px;
    padding: 8px 12px;
    background: #f5f5f5;
    font-size: 12px;
    font-weight: normal;
}
</style>
</head>

<body>

<div class="game-container">

    <!-- 상단 -->
    <div class="header-info">
        <span id="name">🔥 파이리 (파이리)</span>
        <span id="level">Lv.1</span>
    </div>

    <!-- 경험치 -->
    <div class="exp-title">
        성장 경험치
    </div>

    <div class="exp-bg">
        <div class="exp-bar" id="exp"></div>
    </div>

    <!-- 캐릭터 -->
    <div class="pet-stage">

        <div class="pet-image-box">

            <img
                id="pet"
                class="pet-avatar"
                alt="파이리"
                onclick="petClick()"
            >

        </div>

        <div class="speech" id="speech">
            안녕! 나를 멋진 불꽃으로 키워줘!
        </div>

    </div>

    <!-- 능력치 -->
    <div class="stats">

        <div class="stat">
            <span class="label">포만감</span>

            <div class="stat-bg">
                <div id="hunger" class="stat-fill"></div>
            </div>
        </div>

        <div class="stat">
            <span class="label">행복도</span>

            <div class="stat-bg">
                <div id="happy" class="stat-fill"></div>
            </div>
        </div>

        <div class="stat">
            <span class="label">청결도</span>

            <div class="stat-bg">
                <div id="clean" class="stat-fill"></div>
            </div>
        </div>

    </div>

    <!-- 버튼 -->
    <div class="buttons">

        <button onclick="feedPet()">
            🍖 밥 주기
        </button>

        <button onclick="playPet()">
            🔥 불꽃놀이
        </button>

        <button onclick="washPet()">
            🫧 씻기기
        </button>

        <button onclick="sleepPet()">
            💤 잠자기
        </button>

        <button id="heal" onclick="healPet()">
            💊 치료하기
        </button>

    </div>

    <!-- 이미지 설정 -->
    <details class="image-settings" open>

        <summary>
            🖼️ 캐릭터 이미지 설정
        </summary>

        <div class="image-input">

            <label>
                🔥 파이리 이미지
            </label>

            <input
                type="file"
                id="charmanderFile"
                accept="image/*"
            >

        </div>

        <div class="image-input">

            <label>
                🦎 리자드 이미지
            </label>

            <input
                type="file"
                id="charmeleonFile"
                accept="image/*"
            >

        </div>

        <div class="image-input">

            <label>
                🐉 리자몽 이미지
            </label>

            <input
                type="file"
                id="charizardFile"
                accept="image/*"
            >

        </div>

        <div class="image-status" id="imageStatus"></div>

        <button
            class="reset-btn"
            onclick="resetImages()"
        >
            저장된 캐릭터 이미지 초기화
        </button>

    </details>

</div>


<script>

/* =====================================
   게임 데이터
===================================== */

let game = {

    stage: 1,

    level: 1,

    exp: 0,

    hunger: 70,

    happy: 70,

    clean: 70,

    energy: 70,

    sick: false

};


/* =====================================
   이미지 데이터
===================================== */

let images = {

    charmander:
        localStorage.getItem("charmanderImage") || "",

    charmeleon:
        localStorage.getItem("charmeleonImage") || "",

    charizard:
        localStorage.getItem("charizardImage") || ""

};


/* =====================================
   HTML 요소
===================================== */

const pet =
    document.getElementById("pet");

const nameEl =
    document.getElementById("name");

const levelEl =
    document.getElementById("level");

const expEl =
    document.getElementById("exp");

const speech =
    document.getElementById("speech");

const hungerEl =
    document.getElementById("hunger");

const happyEl =
    document.getElementById("happy");

const cleanEl =
    document.getElementById("clean");

const healBtn =
    document.getElementById("heal");

const imageStatus =
    document.getElementById("imageStatus");


/* =====================================
   현재 캐릭터
===================================== */

function getCurrentKey() {

    if (game.stage === 1) {
        return "charmander";
    }

    if (game.stage === 2) {
        return "charmeleon";
    }

    return "charizard";
}


/* =====================================
   현재 캐릭터 이름
===================================== */

function getCurrentName() {

    if (game.stage === 1) {
        return "파이리";
    }

    if (game.stage === 2) {
        return "리자드";
    }

    return "리자몽";
}


/* =====================================
   이미지 표시
===================================== */

function updateImage() {

    const key =
        getCurrentKey();

    const currentImage =
        images[key];


    /*
       이미지가 선택되어 있으면
       실제 사진을 표시
    */

    if (currentImage) {

        pet.src =
            currentImage;

        pet.style.display =
            "block";

        return;
    }


    /*
       이미지가 아직 없으면
       이모지를 보여주지 않고
       이미지 선택 안내
    */

    pet.removeAttribute("src");

    pet.style.display =
        "none";


    speech.innerText =
        getCurrentName() +
        " 이미지를 아래에서 선택해주세요! 🖼️";

}


/* =====================================
   이미지 상태 표시
===================================== */

function updateImageStatus() {

    imageStatus.innerHTML =

        "🔥 파이리 : " +
        (images.charmander
            ? "✅ 설정됨"
            : "❌ 선택 필요") +

        "<br>" +

        "🦎 리자드 : " +
        (images.charmeleon
            ? "✅ 설정됨"
            : "❌ 선택 필요") +

        "<br>" +

        "🐉 리자몽 : " +
        (images.charizard
            ? "✅ 설정됨"
            : "❌ 선택 필요");

}


/* =====================================
   이미지 파일 읽기
===================================== */

function loadImage(input, key) {

    const file =
        input.files[0];

    if (!file) {
        return;
    }


    /*
       FileReader로 사진을
       브라우저에서 사용할 수 있는
       데이터로 변환
    */

    const reader =
        new FileReader();


    reader.onload =
        function(event) {

            const imageData =
                event.target.result;


            images[key] =
                imageData;


            /*
               브라우저에 저장
            */

            try {

                localStorage.setItem(
                    key + "Image",
                    imageData
                );

            }

            catch (error) {

                alert(
                    "이미지가 너무 커서 저장하지 못했습니다.\n" +
                    "사진 크기를 조금 줄인 후 다시 선택해주세요."
                );

            }


            updateUI();

        };


    reader.readAsDataURL(file);

}


/* =====================================
   이미지 선택 이벤트
===================================== */

document
    .getElementById("charmanderFile")
    .addEventListener(
        "change",
        function() {

            loadImage(
                this,
                "charmander"
            );

        }
    );


document
    .getElementById("charmeleonFile")
    .addEventListener(
        "change",
        function() {

            loadImage(
                this,
                "charmeleon"
            );

        }
    );


document
    .getElementById("charizardFile")
    .addEventListener(
        "change",
        function() {

            loadImage(
                this,
                "charizard"
            );

        }
    );


/* =====================================
   이미지 초기화
===================================== */

function resetImages() {

    const answer =
        confirm(
            "저장된 캐릭터 이미지를 모두 삭제할까요?"
        );


    if (!answer) {
        return;
    }


    localStorage.removeItem(
        "charmanderImage"
    );

    localStorage.removeItem(
        "charmeleonImage"
    );

    localStorage.removeItem(
        "charizardImage"
    );


    images.charmander = "";

    images.charmeleon = "";

    images.charizard = "";


    document
        .getElementById("charmanderFile")
        .value = "";

    document
        .getElementById("charmeleonFile")
        .value = "";

    document
        .getElementById("charizardFile")
        .value = "";


    updateUI();

}


/* =====================================
   상태 색상
===================================== */

function getColor(value) {

    if (value > 60) {
        return "#4CAF50";
    }

    if (value > 30) {
        return "#FF9800";
    }

    return "#F44336";

}


/* =====================================
   화면 업데이트
===================================== */

function updateUI() {


    /* 포만감 */

    hungerEl.style.width =
        game.hunger + "%";

    hungerEl.style.backgroundColor =
        getColor(game.hunger);


    /* 행복도 */

    happyEl.style.width =
        game.happy + "%";

    happyEl.style.backgroundColor =
        getColor(game.happy);


    /* 청결도 */

    cleanEl.style.width =
        game.clean + "%";

    cleanEl.style.backgroundColor =
        getColor(game.clean);


    /* 경험치 */

    expEl.style.width =
        game.exp + "%";


    /* 레벨 */

    levelEl.innerText =
        "Lv." +
        game.level;


    /* 이름 */

    nameEl.innerText =
        "🔥 파이리 (" +
        getCurrentName() +
        ")";


    /* 이미지 */

    updateImage();


    /* 이미지 설정 상태 */

    updateImageStatus();


    /* 아픈 상태 */

    if (game.sick) {

        healBtn.style.display =
            "block";

        speech.innerText =
            "아파요... 치료해주세요 🤒";

    }

    else {

        healBtn.style.display =
            "none";

    }

}


/* =====================================
   말풍선
===================================== */

function say(text) {

    speech.innerText =
        text;

}


/* =====================================
   경험치
===================================== */

function addExp(amount) {


    if (game.sick) {

        say(
            "아파서 경험치를 얻을 수 없어요! 🤒"
        );

        return;

    }


    game.exp += amount;


    /* =================================
       진화
    ================================== */

    if (
        game.exp >= 100 &&
        game.stage < 3
    ) {

        game.exp = 0;

        game.stage++;

        game.level++;


        /*
           진화 애니메이션
        */

        pet.classList.remove(
            "sparkle"
        );

        void pet.offsetWidth;

        pet.classList.add(
            "sparkle"
        );


        say(
            "🎉 축하해요! " +
            getCurrentName() +
            "로 진화했어요!"
        );

    }


    updateUI();

}


/* =====================================
   밥 주기
===================================== */

function feedPet() {

    if (game.sick) {

        sickMessage();

        return;

    }


    game.hunger =
        Math.min(
            100,
            game.hunger + 25
        );


    game.happy =
        Math.min(
            100,
            game.happy + 10
        );


    say(
        "얌얌! 맛있는 열매를 먹었어요 🍖"
    );


    addExp(10);

}


/* =====================================
   불꽃놀이
===================================== */

function playPet() {

    if (game.sick) {

        sickMessage();

        return;

    }


    if (game.energy < 15) {

        say(
            "에너지가 부족해요! 잠을 재워주세요 💤"
        );

        return;

    }


    game.happy =
        Math.min(
            100,
            game.happy + 25
        );


    game.hunger =
        Math.max(
            0,
            game.hunger - 10
        );


    game.clean =
        Math.max(
            0,
            game.clean - 10
        );


    game.energy -= 15;


    say(
        "불꽃을 뿜으며 신나게 놀았어요! 🔥"
    );


    addExp(10);

}


/* =====================================
   씻기
===================================== */

function washPet() {

    if (game.sick) {

        sickMessage();

        return;

    }


    game.clean =
        Math.min(
            100,
            game.clean + 35
        );


    game.happy =
        Math.max(
            0,
            game.happy - 5
        );


    say(
        "반짝반짝 깨끗해졌어요! 🫧"
    );


    addExp(10);

}


/* =====================================
   잠자기
===================================== */

function sleepPet() {

    if (game.sick) {

        sickMessage();

        return;

    }


    game.energy =
        100;


    game.hunger =
        Math.max(
            0,
            game.hunger - 15
        );


    say(
        "코오... 푹 자서 에너지가 충전됐어요! 💤"
    );


    addExp(5);

}


/* =====================================
   치료
===================================== */

function healPet() {

    game.sick =
        false;


    game.hunger =
        40;

    game.happy =
        40;

    game.clean =
        40;


    say(
        "약을 먹고 건강해졌어요! 💊"
    );


    updateUI();

}


/* =====================================
   아플 때
===================================== */

function sickMessage() {

    say(
        "아파서 움직일 수 없어요! 치료해주세요 🤒"
    );

}


/* =====================================
   캐릭터 클릭
===================================== */

function petClick() {

    if (game.sick) {
        return;
    }


    say(
        getCurrentName() +
        "가 주인을 만나서 기뻐요! ❤️"
    );


    pet.classList.remove(
        "sparkle"
    );


    void pet.offsetWidth;


    pet.classList.add(
        "sparkle"
    );

}


/* =====================================
   시간에 따른 스탯 감소
===================================== */

setInterval(
    function() {

        if (game.sick) {
            return;
        }


        game.hunger =
            Math.max(
                0,
                game.hunger - 3
            );


        game.happy =
            Math.max(
                0,
                game.happy - 3
            );


        game.clean =
            Math.max(
                0,
                game.clean - 3
            );


        game.energy =
            Math.min(
                100,
                game.energy + 2
            );


        if (
            game.hunger === 0 ||
            game.happy === 0 ||
            game.clean === 0
        ) {

            game.sick =
                true;


            say(
                "꼬리 불꽃이 약해졌어요... 아파요! 🤒"
            );

        }


        updateUI();

    },

    3000
);


/* =====================================
   게임 시작
===================================== */

updateUI();

</script>

</body>
</html>
