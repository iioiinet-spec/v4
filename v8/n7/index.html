<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동물 키우기</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #FFF5EE;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #4A4A4A;
        }

        .game-container {
            background-color: #FFFFFF;
            width: 100%;
            max-width: 420px;
            padding: 24px;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(255, 182, 193, 0.3);
            text-align: center;
            border: 4px solid #FFE4E1;
        }

        .game-header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 22px;
            color: #FF6B8B;
        }

        .change-pet-btn {
            background-color: #FFF0F5;
            border: 2px solid #FFD1DC;
            padding: 6px 10px;
            border-radius: 10px;
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
            color: #FF6B8B;
        }

        .change-pet-btn:hover {
            background-color: #FFE4E1;
        }

        .status-header {
            background-color: #FFF0F5;
            padding: 12px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .level-info {
            font-size: 16px;
            font-weight: bold;
            color: #555;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .exp-bar-container {
            width: 100%;
            background-color: #E0E0E0;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
        }

        .exp-bar {
            width: 0%;
            height: 100%;
            background-color: #FFB6C1;
            transition: width 0.3s ease;
        }

        .pet-stage-container {
            position: relative;
            height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .speech-bubble {
            background-color: #FFF;
            border: 2px solid #FFB6C1;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            color: #FF6B8B;
            margin-bottom: 10px;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            min-height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 8px 8px 0;
            border-style: solid;
            border-color: #FFB6C1 transparent;
            display: block;
            width: 0;
        }

        .pet-display {
            font-size: 80px;
            animation: bounce 1.5s infinite ease-in-out;
            cursor: pointer;
            user-select: none;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        .gauges-container {
            background-color: #F8F9FA;
            padding: 15px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        .gauge-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: bold;
        }

        .gauge-row:last-child {
            margin-bottom: 0;
        }

        .gauge-label {
            width: 70px;
            text-align: left;
        }

        .gauge-bar-bg {
            flex-grow: 1;
            background-color: #E0E0E0;
            height: 14px;
            border-radius: 7px;
            overflow: hidden;
            margin: 0 10px;
        }

        .gauge-bar-fill {
            height: 100%;
            width: 70%;
            transition: width 0.3s ease, background-color 0.3s ease;
        }

        .gauge-value {
            width: 35px;
            text-align: right;
        }

        .buttons-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        button {
            background-color: #FFD1DC;
            border: none;
            padding: 12px;
            border-radius: 15px;
            font-size: 15px;
            font-weight: bold;
            color: #555;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        button:hover {
            background-color: #FFB6C1;
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0,0,0,0.1);
        }

        button:active {
            transform: translateY(0);
        }

        button.heal-btn {
            grid-column: span 2;
            background-color: #B5EAD7;
        }

        button.heal-btn:hover {
            background-color: #93E9BE;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.4);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .modal-content {
            background-color: #FFF;
            padding: 20px;
            border-radius: 20px;
            width: 90%;
            max-width: 320px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .modal-content h3 {
            color: #FF6B8B;
            margin-bottom: 15px;
        }

        .choice-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }

        .choice-btn {
            background-color: #FFF0F5;
            border: 2px solid #FFD1DC;
            padding: 10px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .choice-btn:hover {
            background-color: #FFE4E1;
        }

        .close-modal-btn {
            background-color: #E0E0E0;
            width: 100%;
        }

        @keyframes sparkle {
            0% { transform: scale(1) rotate(0deg); opacity: 1; }
            50% { transform: scale(1.3) rotate(15deg); opacity: 0.8; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .sparkle-effect {
            animation: sparkle 0.5s ease;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="game-header-top">
            <h1 id="main-title">🐾 동물 키우기 🐾</h1>
            <button class="change-pet-btn" onclick="openPetSelectModal()">동물 변경</button>
        </div>

        <div class="status-header">
            <div class="level-info">
                <span id="stage-name">단계: 알 🥚</span>
                <span>경험치 <span id="exp-text">0</span>/100</span>
            </div>
            <div class="exp-bar-container">
                <div id="exp-bar" class="exp-bar"></div>
            </div>
        </div>

        <div class="pet-stage-container">
            <div id="speech-bubble" class="speech-bubble">안녕! 나를 잘 돌봐줘! 👋</div>
            <div id="pet-display" class="pet-display" onclick="petTouch()">🥚</div>
        </div>

        <div class="gauges-container">
            <div class="gauge-row">
                <span class="gauge-label">🍖 포만감</span>
                <div class="gauge-bar-bg"><div id="hunger-bar" class="gauge-bar-fill"></div></div>
                <span id="hunger-val" class="gauge-value">70</span>
            </div>
            <div class="gauge-row">
                <span class="gauge-label">💖 행복</span>
                <div class="gauge-bar-bg"><div id="happy-bar" class="gauge-bar-fill"></div></div>
                <span id="happy-val" class="gauge-value">70</span>
            </div>
            <div class="gauge-row">
                <span class="gauge-label">✨ 청결</span>
                <div class="gauge-bar-bg"><div id="clean-bar" class="gauge-bar-fill"></div></div>
                <span id="clean-val" class="gauge-value">70</span>
            </div>
        </div>

        <div class="buttons-container">
            <button onclick="openFoodModal()">🍖 밥 주기</button>
            <button onclick="openPlayModal()">🎾 놀아주기</button>
            <button onclick="openWashModal()">🛁 씻기기</button>
            <button onclick="openSleepModal()">💤 재우기</button>
            <button onclick="openFriendModal()" style="grid-column: span 2; background-color: #E2F0CB;">🤝 친구 만나기</button>
            <button id="heal-button" class="heal-btn" onclick="openHealModal()" style="display: none;">💊 치료하기</button>
        </div>
    </div>

    <!-- 동물 종류 선택 모달 창 -->
    <div id="pet-select-modal" class="modal">
        <div class="modal-content">
            <h3>어떤 동물을 키울까요? 🐾</h3>
            <div class="choice-list">
                <button class="choice-btn" onclick="selectPetType('dog')">
                    <span>🐶 멍멍이 (강아지)</span> <span>활발함</span>
                </button>
                <button class="choice-btn" onclick="selectPetType('cat')">
                    <span>🐱 야옹이 (고양이)</span> <span>도도함</span>
                </button>
                <button class="choice-btn" onclick="selectPetType('rabbit')">
                    <span>🐰 토끼</span> <span>깜찍함</span>
                </button>
                <button class="choice-btn" onclick="selectPetType('hamster')">
                    <span>🐹 햄스터</span> <span>귀여움</span>
                </button>
            </div>
            <button class="close-modal-btn" onclick="closeModal('pet-select-modal')">취소</button>
        </div>
    </div>

    <!-- 음식 선택 모달 창 -->
    <div id="food-modal" class="modal">
        <div class="modal-content">
            <h3>어떤 음식을 줄까요? 🍽️</h3>
            <div class="choice-list">
                <button class="choice-btn" onclick="feedFood(15, 5, '바삭바삭 맛있는 사료를 먹었어요! 🥣')">
                    <span>🥣 기본 사료</span> <span>포만 +15 / 행복 +5</span>
                </button>
                <button class="choice-btn" onclick="feedFood(25, 15, '최고급 간식에 눈이 번쩍! 🍖')">
                    <span>🍖 수제 간식</span> <span>포만 +25 / 행복 +15</span>
                </button>
                <button class="choice-btn" onclick="feedFood(10, 10, '고소한 우유를 싹 비웠어요! 🥛')">
                    <span>🥛 영양 우유</span> <span>포만 +10 / 행복 +10</span>
                </button>
                <button class="choice-btn" onclick="feedFood(35, 20, '가장 좋아하는 특식을 맛있게 먹었어요! ✨')">
                    <span>✨ 별미 특식</span> <span>포만 +35 / 행복 +20</span>
                </button>
            </div>
            <button class="close-modal-btn" onclick="closeModal('food-modal')">취소</button>
        </div>
    </div>

    <!-- 놀이 선택 모달 창 -->
    <div id="play-modal" class="modal">
        <div class="modal-content">
            <h3>어떤 놀이를 할까요? 🎾</h3>
            <div class="choice-list">
                <button class="choice-btn" onclick="playGame(10, 15, 5, 5, '장난감을 가지고 즐겁게 놀았어요! 🧸')">
                    <span>🧸 장난감 놀이</span> <span>행복+15 / 에너지-10</span>
                </button>
                <button class="choice-btn" onclick="playGame(15, 25, 10, 10, '에너지를 뿜뿜하며 신나게 뛰어놀았어요! 🥏')">
                    <span>🥏 신나게 뛰어놀기</span> <span>행복+25 / 포만-10 / 청결-10 / 에너지-15</span>
                </button>
                <button class="choice-btn" onclick="playGame(20, 35, 15, 15, '즐거운 산책과 탐험을 다녀왔어요! 🌳')">
                    <span>🌳 야외 산책/탐험</span> <span>행복+35 / 포만-15 / 청결-15 / 에너지-20</span>
                </button>
            </div>
            <button class="close-modal-btn" onclick="closeModal('play-modal')">취소</button>
        </div>
    </div>

    <!-- 씻기 도구 선택 모달 창 -->
    <div id="wash-modal" class="modal">
        <div class="modal-content">
            <h3>어떤 도구로 씻길까요? 🛁</h3>
            <div class="choice-list">
                <button class="choice-btn" onclick="washPetAction(20, 0, '물로 가볍게 먼지를 씻어냈어요! 🚿')">
                    <span>🚿 물 샤워</span> <span>청결 +20 / 행복 0</span>
                </button>
                <button class="choice-btn" onclick="washPetAction(35, 5, '향기로운 거품으로 목욕을 마쳤어요! 🫧✨')">
                    <span>🫧 거품 목욕</span> <span>청결 +35 / 행복 +5</span>
                </button>
                <button class="choice-btn" onclick="washPetAction(50, 15, '전문 미용사에게 털 손질과 케어를 받았어요! ✂️💖')">
                    <span>✂️ 전문 미용 & 케어</span> <span>청결 +50 / 행복 +15</span>
                </button>
            </div>
            <button class="close-modal-btn" onclick="closeModal('wash-modal')">취소</button>
        </div>
    </div>

    <!-- 잠자기/휴식 선택 모달 창 -->
    <div id="sleep-modal" class="modal">
        <div class="modal-content">
            <h3>어떻게 휴식을 취할까요? 💤</h3>
            <div class="choice-list">
                <button class="choice-btn" onclick="sleepPetAction(40, 3, '낮잠 쿠션에서 얕은 잠을 잤어요. 🛋️')">
                    <span>🛋️ 낮잠 쿠션</span> <span>에너지 +40 / 포만-3</span>
                </button>
                <button class="choice-btn" onclick="sleepPetAction(70, 5, '포근한 침대에서 푹 잠들었어요! 🛏️')">
                    <span>🛏️ 포근한 침대</span> <span>에너지 +70 / 포만-5</span>
                </button>
                <button class="choice-btn" onclick="sleepPetAction(100, 8, '꿀잠과 함께 힐링 스파를 즐겼어요! ♨️✨')">
                    <span>♨️ 힐링 스파 & 침대</span> <span>에너지 최대 / 포만-8 / 행복 +10</span>
                </button>
            </div>
            <button class="close-modal-btn" onclick="closeModal('sleep-modal')">취소</button>
        </div>
    </div>

    <!-- 친구 만나기 선택 모달 창 -->
    <div id="friend-modal" class="modal">
        <div class="modal-content">
            <h3>어떤 친구를 만날까요? 🤝</h3>
            <div class="choice-list">
                <button class="choice-btn" onclick="meetFriend('동네 친구', 20, 10, '동네 친구를 만나 신나게 수다를 떨었어요! 🦊💬')">
                    <span>🦊 동네 친구 만나기</span> <span>행복 +20 / 포만 -10</span>
                </button>
                <button class="choice-btn" onclick="meetFriend('단짝 친구', 35, 15, '단짝 친구와 함께 맛있는 간식을 나눠 먹었어요! 🐼🍡')">
                    <span>🐼 단짝 친구와 놀기</span> <span>행복 +35 / 포만 -15</span>
                </button>
                <button class="choice-btn" onclick="meetFriend('동물 파티', 50, 20, '와글와글 동물 친구들과 대모임을 열었어요! 🎉🥳')">
                    <span>🎉 동물 파티 참석하기</span> <span>행복 +50 / 포만 -20</span>
                </button>
            </div>
            <button class="close-modal-btn" onclick="closeModal('friend-modal')">취소</button>
        </div>
    </div>

    <!-- 치료 선택 모달 창 -->
    <div id="heal-modal" class="modal">
        <div class="modal-content">
            <h3>어떤 처방을 할까요? 💊</h3>
            <div class="choice-list">
                <button class="choice-btn" onclick="healAction('hunger', '소화제와 영양식을 처방하여 배탈을 고쳤어요! 🥣💊')">
                    <span>🥣 소화제 (배탈용)</span> <span>포만감 회복</span>
                </button>
                <button class="choice-btn" onclick="healAction('happiness', '마음을 달래주는 비타민과 장난감을 선물했어요! 🧸💖')">
                    <span>🧸 비타민 (우울증용)</span> <span>행복 회복</span>
                </button>
                <button class="choice-btn" onclick="healAction('cleanliness', '깨끗한 연고를 바르고 소독을 마쳤어요! 🧴✨')">
                    <span>🧴 치료 연고 (피부병용)</span> <span>청결 회복</span>
                </button>
            </div>
            <button class="close-modal-btn" onclick="closeModal('heal-modal')">취소</button>
        </div>
    </div>

    <script>
        let game = {
            petType: 'dog',
            stage: 1,
            exp: 0,
            hunger: 70,
            happiness: 70,
            cleanliness: 70,
            energy: 70,
            isSick: false,
            sickType: null
        };

        const petData = {
            dog: {
                name: "멍멍이",
                stages: { 1: "알 🥚", 2: "아기 멍멍이 🐶", 3: "어른 멍멍이 🐕" },
                emojis: { 1: "🥚", 2: "🐶", 3: "🐕" }
            },
            cat: {
                name: "야옹이",
                stages: { 1: "알 🥚", 2: "아기 야옹이 🐱", 3: "어른 야옹이 🐈" },
                emojis: { 1: "🥚", 2: "🐱", 3: "🐈" }
            },
            rabbit: {
                name: "토끼",
                stages: { 1: "알 🥚", 2: "아기 토끼 🐰", 3: "어른 토끼 🐇" },
                emojis: { 1: "🥚", 2: "🐰", 3: "🐇" }
            },
            hamster: {
                name: "햄스터",
                stages: { 1: "알 🥚", 2: "아기 햄스터 🐹", 3: "어른 햄스터 🐹" },
                emojis: { 1: "🥚", 2: "🐹", 3: "🐹" }
            }
        };

        setInterval(() => {
            if (game.hunger > 0) game.hunger = Math.max(0, game.hunger - 2);
            if (game.happiness > 0) game.happiness = Math.max(0, game.happiness - 2);
            if (game.cleanliness > 0) game.cleanliness = Math.max(0, game.cleanliness - 2);
            if (game.energy < 100) game.energy = Math.min(100, game.energy + 3);

            checkSickness();
            updateUI();
        }, 3000);

        function checkSickness() {
            if (game.isSick) return;

            const currentPetName = petData[game.petType].name;
            if (game.hunger === 0) {
                game.isSick = true;
                game.sickType = 'hunger';
                setBubble(`꼬르륵... ${currentPetName}가 배고파서 배탈이 났어요! 🤢`);
            } else if (game.happiness === 0) {
                game.isSick = true;
                game.sickType = 'happiness';
                setBubble(`시무룩... ${currentPetName}가 우울증에 걸렸어요! 💔`);
            } else if (game.cleanliness === 0) {
                game.isSick = true;
                game.sickType = 'cleanliness';
                setBubble(`간지러워요! ${currentPetName}에게 피부병이 생겼어요! 🦠`);
            }
        }

        function addExp(amount) {
            if (game.isSick) {
                setBubble("아파서 아무것도 할 수 없어요! 치료가 먼저예요!");
                return;
            }

            game.exp += amount;
            if (game.exp >= 100) {
                game.exp -= 100;
                if (game.stage < 3) {
                    game.stage++;
                    triggerEvolutionEffect();
                    const stageName = petData[game.petType].stages[game.stage];
                    setBubble(`와! ${stageName}(이)가 진화했다! 🎉`);
                } else {
                    game.exp = 100;
                }
            }
            updateUI();
        }

        function triggerEvolutionEffect() {
            const petEl = document.getElementById("pet-display");
            petEl.classList.add("sparkle-effect");
            setTimeout(() => petEl.classList.remove("sparkle-effect"), 500);
        }

        function openPetSelectModal() {
            document.getElementById("pet-select-modal").style.display = "flex";
        }

        function selectPetType(type) {
            game.petType = type;
            closeModal('pet-select-modal');
            document.getElementById("main-title").innerText = `🐾 ${petData[type].name} 키우기 🐾`;
            setBubble(`새로운 친구 ${petData[type].name}(이)와 함께하게 되었어요! ✨`);
            updateUI();
        }

        function openFoodModal() {
            if (game.isSick) { checkSickness(); return; }
            document.getElementById("food-modal").style.display = "flex";
        }

        function openPlayModal() {
            if (game.isSick) { checkSickness(); return; }
            document.getElementById("play-modal").style.display = "flex";
        }

        function openWashModal() {
            if (game.isSick) { checkSickness(); return; }
            document.getElementById("wash-modal").style.display = "flex";
        }

        function openSleepModal() {
            if (game.isSick) { checkSickness(); return; }
            document.getElementById("sleep-modal").style.display = "flex";
        }

        function openFriendModal() {
            if (game.isSick) { checkSickness(); return; }
            document.getElementById("friend-modal").style.display = "flex";
        }

        function openHealModal() {
            if (!game.isSick) return;
            document.getElementById("heal-modal").style.display = "flex";
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = "none";
        }

        function feedFood(hungerVal, happyVal, msg) {
            closeModal('food-modal');
            let energyBonus = game.energy > 30 ? 5 : 0;
            game.hunger = Math.min(100, game.hunger + hungerVal);
            game.happiness = Math.min(100, game.happiness + happyVal + energyBonus);
            setBubble(msg);
            addExp(10);
        }

        function playGame(energyCost, happyVal, hungerCost, cleanCost, msg) {
            if (game.energy < energyCost) {
                setBubble("너무 피곤해요! 잠을 재워주세요 💤");
                closeModal('play-modal');
                return;
            }
            closeModal('play-modal');
            game.energy = Math.max(0, game.energy - energyCost);
            game.happiness = Math.min(100, game.happiness + happyVal);
            game.hunger = Math.max(0, game.hunger - hungerCost);
            game.cleanliness = Math.max(0, game.cleanliness - cleanCost);
            setBubble(msg);
            addExp(10);
        }

        function washPetAction(cleanVal, happyVal, msg) {
            closeModal('wash-modal');
            game.cleanliness = Math.min(100, game.cleanliness + cleanVal);
            game.happiness = Math.min(100, game.happiness + happyVal);
            setBubble(msg);
            addExp(10);
        }

        function sleepPetAction(energyVal, hungerCost, msg) {
            closeModal('sleep-modal');
            game.energy = Math.min(100, game.energy + energyVal);
            game.hunger = Math.max(0, game.hunger - hungerCost);
            if(energyVal === 100) {
                game.happiness = Math.min(100, game.happiness + 10);
            }
            setBubble(msg);
            addExp(10);
        }

        function meetFriend(friendType, happyVal, hungerCost, msg) {
            closeModal('friend-modal');
            game.happiness = Math.min(100, game.happiness + happyVal);
            game.hunger = Math.max(0, game.hunger - hungerCost);
            setBubble(msg);
            addExp(15);
        }

        function healAction(selectedType, msg) {
            closeModal('heal-modal');

            if (game.sickType === selectedType) {
                game.isSick = false;
                game.sickType = null;
                game.hunger = Math.max(game.hunger, 50);
                game.happiness = Math.max(game.happiness, 50);
                game.cleanliness = Math.max(game.cleanliness, 50);
                setBubble(msg);
                updateUI();
            } else {
                setBubble("앗, 이 약은 지금 증상에 맞지 않아요! 다른 약을 골라주세요. 💦");
            }
        }

        function petTouch() {
            if (game.isSick) return;
            setBubble("쓰다듬어 주셔서 기뻐요! 🐾💕");
            game.happiness = Math.min(100, game.happiness + 3);
            updateUI();
        }

        function setBubble(text) {
            document.getElementById("speech-bubble").innerText = text;
        }

        function updateUI() {
            const currentPet = petData[game.petType];
            document.getElementById("stage-name").innerText = `단계: ${currentPet.stages[game.stage]}`;
            document.getElementById("exp-text").innerText = game.exp;
            document.getElementById("exp-bar").style.width = `${game.exp}%`;

            let displayEmoji = currentPet.emojis[game.stage];
            if (game.isSick) {
                if (game.sickType === 'hunger') displayEmoji = "🤢";
                else if (game.sickType === 'happiness') displayEmoji = "💔";
                else if (game.sickType === 'cleanliness') displayEmoji = "🦠";
                
                document.getElementById("heal-button").style.display = "block";
            } else {
                document.getElementById("heal-button").style.display = "none";
                if (game.happiness < 30) {
                    displayEmoji = "😢";
                }
            }
            document.getElementById("pet-display").innerText = displayEmoji;

            updateGaugeBar("hunger", game.hunger);
            updateGaugeBar("happy", game.happiness);
            updateGaugeBar("clean", game.cleanliness);
        }

        function updateGaugeBar(name, value) {
            const bar = document.getElementById(`${name}-bar`);
            const valText = document.getElementById(`${name}-val`);
            bar.style.width = `${value}%`;
            valText.innerText = value;

            if (value > 50) {
                bar.style.backgroundColor = "#A8E6CF";
            } else if (value > 20) {
                bar.style.backgroundColor = "#FFD3B6";
            } else {
                bar.style.backgroundColor = "#FF8B94";
            }
        }

        updateUI();
    </script>
</body>
</html>
