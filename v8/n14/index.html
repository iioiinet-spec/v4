
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>꼬마공룡 키우기 - 디럭스 에디션</title>
    <style>
        :root {
            --bg-day: #eef2f3;
            --bg-night: #2c3e50;
            --bg-rain: #718093;
            --bg-snow: #dfe6e9;
            --card-bg-day: #ffffff;
            --card-bg-night: #34495e;
            --text-day: #2c3e50;
            --text-night: #ecf0f1;
            --primary: #ff8b94;
            --secondary: #a8e6cf;
        }

        body {
            font-family: 'Cafe24SsurroundAir', 'Jalnan', 'Apple SD Gothic Neo', sans-serif;
            background-color: var(--bg-day);
            color: var(--text-day);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            transition: background-color 0.5s, color 0.5s;
        }

        body.night { background-color: var(--bg-night); color: var(--text-night); }
        body.rain { background-color: var(--bg-rain); color: #fff; }
        body.snow { background-color: var(--bg-snow); color: #2d3436; }

        .game-container {
            background-color: var(--card-bg-day);
            width: 420px;
            padding: 20px;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            transition: background-color 0.5s;
            position: relative;
            overflow: hidden;
        }

        body.night .game-container { background-color: var(--card-bg-night); box-shadow: 0 10px 25px rgba(0,0,0,0.3); }

        .header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 8px;
            padding: 0 5px;
        }

        .env-badge-group {
            display: flex;
            gap: 5px;
            font-size: 13px;
        }

        .status-bars {
            background: rgba(0,0,0,0.03);
            padding: 10px;
            border-radius: 20px;
            margin-bottom: 12px;
        }

        body.night .status-bars { background: rgba(255,255,255,0.05); }

        .bar-container {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
            font-size: 13px;
        }

        .bar-container:last-child { margin-bottom: 0; }
        .bar-label { width: 65px; text-align: left; }
        .bar-bg { flex-grow: 1; height: 10px; background-color: #e0e0e0; border-radius: 5px; overflow: hidden; margin-left: 5px; }
        .bar-fill { height: 100%; width: 70%; background-color: #4cd137; border-radius: 5px; transition: width 0.3s, background-color 0.3s; }

        .pet-stage-info { font-size: 14px; margin-bottom: 4px; color: #e67e22; font-weight: bold; }
        .exp-bar-bg { width: 100%; height: 6px; background-color: #e0e0e0; border-radius: 3px; overflow: hidden; margin-bottom: 12px; }
        .exp-bar-fill { height: 100%; width: 0%; background-color: #f1c40f; transition: width 0.3s; }

        .pet-stage {
            font-size: 70px;
            margin: 15px 0;
            min-height: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .accessory-layer {
            position: absolute;
            top: -15px;
            font-size: 35px;
            z-index: 2;
        }

        .bounce { animation: bounce 1.5s infinite ease-in-out; }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes sparkle {
            0% { transform: scale(1) rotate(0deg); filter: brightness(1); }
            50% { transform: scale(1.2) rotate(15deg); filter: brightness(1.5); }
            100% { transform: scale(1) rotate(0deg); filter: brightness(1); }
        }
        .sparkle-anim { animation: sparkle 0.5s ease; }

        .speech-bubble {
            background-color: #ffffff;
            color: #333;
            padding: 8px 12px;
            border-radius: 15px;
            font-size: 13px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 10px;
            min-height: 20px;
            display: inline-block;
            max-width: 85%;
            word-break: keep-all;
        }

        .action-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 8px;
        }

        button {
            background-color: #ff9a9e;
            border: none;
            color: white;
            padding: 8px 4px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 5px rgba(0,0,0,0.05);
            transition: transform 0.1s, background-color 0.2s;
        }

        button:active { transform: scale(0.95); }
        button:hover { opacity: 0.9; }

        .btn-shop { background-color: #a1c4fd; }
        .btn-game { background-color: #fbc531; }
        .btn-heal { background-color: #e84118; display: none; }
        .btn-adventure { background-color: #9b59b6; }
        .btn-diary { background-color: #e67e22; }
        .btn-fossil { background-color: #1abc9c; }

        /* 모달 시스템 */
        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            border-radius: 30px;
            z-index: 10;
        }

        .modal-content {
            background: white;
            color: #333;
            padding: 20px;
            border-radius: 20px;
            width: 82%;
            text-align: center;
            max-height: 80%;
            overflow-y: auto;
        }

        .modal-content h3 { margin-top: 0; margin-bottom: 10px; }
        .modal-btn { background-color: #4cd137; margin: 4px; padding: 8px 12px; font-size: 12px; }
        .close-btn { background-color: #718093; margin-top: 10px; font-size: 12px; }

        .diary-box {
            background: #fff9e6;
            border: 2px dashed #f1c40f;
            padding: 10px;
            border-radius: 10px;
            text-align: left;
            font-size: 13px;
            line-height: 1.4;
            max-height: 150px;
            overflow-y: auto;
            margin-bottom: 10px;
        }

        .fossil-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            margin: 10px 0;
        }
        .fossil-cell {
            background: #dcdde1;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
        }
        .fossil-cell.dug { background: #e1b12c; }
    </style>
</head>
<body>

<div class="game-container" id="gameContainer">
    <div class="header-info">
        <span id="coinDisplay">💰 80 코인</span>
        <div class="env-badge-group">
            <span id="envIndicator">🌞 낮</span>
            <span id="weatherIndicator">🌤️ 맑음</span>
        </div>
    </div>

    <div class="pet-stage-info">
        <span id="stageName">단계: 알 (Lv.1)</span> | 성격: <span id="personalityText">평범함</span>
    </div>
    <div class="exp-bar-bg">
        <div class="exp-bar-fill" id="expBar"></div>
    </div>

    <div class="status-bars">
        <div class="bar-container">
            <span class="bar-label">포만감</span>
            <div class="bar-bg"><div class="bar-fill" id="hungerBar"></div></div>
        </div>
        <div class="bar-container">
            <span class="bar-label">행복</span>
            <div class="bar-bg"><div class="bar-fill" id="happinessBar"></div></div>
        </div>
        <div class="bar-container">
            <span class="bar-label">청결</span>
            <div class="bar-bg"><div class="bar-fill" id="cleanBar"></div></div>
        </div>
        <div class="bar-container">
            <span class="bar-label">에너지</span>
            <div class="bar-bg"><div class="bar-fill" id="energyBar"></div></div>
        </div>
    </div>

    <div class="speech-bubble" id="speechBubble">안녕! 나를 키워줘! 대단한 모험을 떠나볼까? 👋</div>

    <div class="pet-stage bounce" id="petDisplay">
        <div class="accessory-layer" id="accessoryLayer"></div>
        🥚
    </div>

    <div class="action-grid">
        <button onclick="feedPet()">🍖 밥 주기</button>
        <button onclick="playWithPet()">🎾 놀아주기</button>
        <button onclick="washPet()">🧼 씻기기</button>
        <button class="btn-shop" onclick="openShop()">🛒 상점</button>
        <button class="btn-game" onclick="openMiniGame()">🎮 미니게임</button>
        <button class="btn-fossil" onclick="openFossilGame()">⛏️ 화석발굴</button>
        <button class="btn-adventure" onclick="startAdventure()">🗺️ 탐험배낭</button>
        <button class="btn-diary" onclick="openDiaryModal()">📖 일기장</button>
        <button class="btn-heal" id="healBtn" onclick="healPet()">💊 치료하기</button>
    </div>
</div>

<!-- 상점 모달 (소모품 & 꾸미기 패션쇼) -->
<div class="modal" id="shopModal">
    <div class="modal-content">
        <h3>🛒 상점 & 패션 부티크</h3>
        <p style="font-size:12px; margin-bottom:8px;">아이템 구매 및 꾸미기</p>
        <div style="font-size:12px; font-weight:bold; color:#e67e22; margin-bottom:5px;">[소모품]</div>
        <button class="modal-btn" onclick="buyItem('snack')">간식 (20코인)<br><small>포만감 +40</small></button>
        <button class="modal-btn" onclick="buyItem('toy')">장난감 (30코인)<br><small>행복 +50</small></button>
        <button class="modal-btn" onclick="buyItem('mushroom')">신비 버섯 (25코인)<br><small>전체스탯 +20</small></button>
        
        <div style="font-size:12px; font-weight:bold; color:#9b59b6; margin:10px 0 5px 0;">[패션 코스튬]</div>
        <button class="modal-btn" style="background:#9b59b6;" onclick="buyAccessory('none', 0)">기본(벗기)</button>
        <button class="modal-btn" style="background:#9b59b6;" onclick="buyAccessory('😎', 40)">선글라스 (40코인)</button>
        <button class="modal-btn" style="background:#9b59b6;" onclick="buyAccessory('🧙‍♂️', 50)">마법사모자 (50코인)</button>
        <button class="modal-btn" style="background:#9b59b6;" onclick="buyAccessory('🎧', 50)">헤드셋 (50코인)</button>
        <button class="modal-btn" style="background:#9b59b6;" onclick="buyAccessory('🦆', 60)">오리튜브 (60코인)</button>
        <br>
        <button class="close-btn" onclick="closeShop()">닫기</button>
    </div>
</div>

<!-- 미니게임 모달 (가위바위보) -->
<div class="modal" id="gameModal">
    <div class="modal-content">
        <h3>🎮 공룡과 가위바위보</h3>
        <p style="font-size:13px;">이기면 행복 +15, 코인 +10!</p>
        <button class="modal-btn" onclick="playRPS('rock')">✊ 바위</button>
        <button class="modal-btn" onclick="playRPS('paper')">✋ 보</button>
        <button class="modal-btn" onclick="playRPS('scissors')">✌️ 가위</button>
        <p id="rpsResult" style="margin-top:10px; font-weight:bold; font-size:13px;"></p>
        <button class="close-btn" onclick="closeMiniGame()">닫기</button>
    </div>
</div>

<!-- 화석 발굴 미니게임 모달 -->
<div class="modal" id="fossilModal">
    <div class="modal-content">
        <h3>⛏️ 타임어택 화석 발굴</h3>
        <p id="fossilTimerText" style="font-size:12px; color:#e74c3c; font-weight:bold;">남은 시간: 10초</p>
        <p style="font-size:12px;">모래판을 마구 클릭해서 보물을 찾으세요!</p>
        <div class="fossil-grid" id="fossilGrid"></div>
        <p id="fossilResult" style="font-size:13px; font-weight:bold;"></p>
        <button class="close-btn" onclick="closeFossilGame()">닫기</button>
    </div>
</div>

<!-- 일기장 모달 -->
<div class="modal" id="diaryModal">
    <div class="modal-content">
        <h3>📖 꼬마공룡의 TMI 일기장</h3>
        <div class="diary-box" id="diaryContent">아직 작성된 일기가 없습니다. 공룡과 상호작용해 보세요!</div>
        <button class="close-btn" onclick="closeDiaryModal()">닫기</button>
    </div>
</div>

<script>
    // 게임 상태 객체
    const game = {
        hunger: 70,
        happiness: 70,
        clean: 70,
        energy: 70,
        coins: 80,
        exp: 0,
        level: 1,
        stage: 0, // 0: 알, 1: 아기, 2: 청소년, 3: 어른
        isSick: false,
        isNight: false,
        weather: 'clear', // clear, rain, snow
        accessory: '',
        ownedAccessories: [],
        adventureActive: false,
        diaries: ["오늘 세상에 처음 태어났다. 주인님이 아주 멋진 사람이었으면 좋겠다! 🥚"],
        personality: '순딩이'
    };

    const stages = [
        { name: "알", emoji: "🥚" },
        { name: "아기 공룡", emoji: "🦕" },
        { name: "청소년 공룡", emoji: "🦖" },
        { name: "어른 공룡", emoji: "🐉" }
    ];

    // DOM 요소 캐시
    const petDisplay = document.getElementById('petDisplay');
    const accessoryLayer = document.getElementById('accessoryLayer');
    const speechBubble = document.getElementById('speechBubble');
    const stageName = document.getElementById('stageName');
    const personalityText = document.getElementById('personalityText');
    const expBar = document.getElementById('expBar');
    const coinDisplay = document.getElementById('coinDisplay');
    const envIndicator = document.getElementById('envIndicator');
    const weatherIndicator = document.getElementById('weatherIndicator');
    const gameContainer = document.getElementById('gameContainer');
    const healBtn = document.getElementById('healBtn');

    const bars = {
        hunger: document.getElementById('hungerBar'),
        happiness: document.getElementById('happinessBar'),
        clean: document.getElementById('cleanBar'),
        energy: document.getElementById('energyBar')
    };

    function updateUI() {
        for (let key in bars) {
            bars[key].style.width = `${game[key]}%`;
            bars[key].style.backgroundColor = game[key] < 30 ? '#e84118' : '#4cd137';
        }

        expBar.style.width = `${game.exp}%`;
        coinDisplay.innerText = `💰 ${game.coins} 코인`;
        stageName.innerText = `단계: ${stages[game.stage].name} (Lv.${game.level})`;
        personalityText.innerText = game.personality;
        accessoryLayer.innerText = game.accessory;

        if (game.isSick) {
            petDisplay.innerHTML = `<div class="accessory-layer">${game.accessory}</div>🤒`;
            healBtn.style.display = "block";
            speechBubble.innerText = "아파요... 치료해 주세요! 😢";
        } else {
            healBtn.style.display = "none";
            let moodEmoji = "😊";
            let avgStat = (game.hunger + game.happiness + game.clean + game.energy) / 4;
            if (avgStat < 40) moodEmoji = "😢";
            else if (avgStat < 70) moodEmoji = "😐";

            if (game.stage === 0) {
                petDisplay.innerHTML = `<div class="accessory-layer">${game.accessory}</div>🥚`;
            } else {
                petDisplay.innerHTML = `<div class="accessory-layer">${game.accessory}</div>${stages[game.stage].emoji} ${moodEmoji}`;
            }
        }
    }

    function showMessage(msg) {
        speechBubble.innerText = msg;
    }

    // 일기 추가 및 성격 판정
    function addDiary(text) {
        game.diaries.unshift(text);
        if (game.diaries.length > 10) game.diaries.pop();
        
        // 성격 자동 판정
        if (game.happiness > 80) game.personality = '개구쟁이 🎉';
        else if (game.hunger < 40) game.personality = '불만 가득 💢';
        else if (game.clean < 40) game.personality = '꼬질꼬질 💩';
        else game.personality = '순딩이 ✨';
    }

    function addProgress(expGain, coinGain = 5) {
        if (game.isSick || game.adventureActive) {
            if(game.adventureActive) showMessage("공룡이 지금 탐험 중이에요!");
            else showMessage("아픈 동안에는 돌볼 수 없어요! 먼저 치료해주세요.");
            return;
        }

        game.coins += coinGain;
        game.exp += expGain;

        petDisplay.classList.add('sparkle-anim');
        setTimeout(() => petDisplay.classList.remove('sparkle-anim'), 500);

        if (game.exp >= 100) {
            game.exp = 0;
            game.level++;
            if (game.stage < stages.length - 1) {
                game.stage++;
                showMessage(`🎉 꼬마공룡이(가) ${stages[game.stage].name}(으)로 진화했다!`);
                addDiary(`오늘 드디어 ${stages[game.stage].name}(으)로 진화했다! 훨씬 멋져진 것 같다. 🦖`);
            } else {
                showMessage("🎉 레벨 업! 최고 단계에 도달했어요!");
            }
        }
        updateUI();
    }

    // 상호작용
    function feedPet() {
        if (game.isSick || game.adventureActive) return;
        game.hunger = Math.min(100, game.hunger + 25);
        game.happiness = Math.min(100, game.happiness + 5);
        if (game.energy > 0) game.happiness = Math.min(100, game.happiness + 5);
        showMessage("냠냠! 맛있는 밥을 먹었어요! 🍖");
        addDiary("주인님이 맛있는 밥을 주셨다. 배가 든든하니 기분이 좋다! 🍖");
        addProgress(10);
    }

    function playWithPet() {
        if (game.isSick || game.adventureActive) return;
        game.happiness = Math.min(100, game.happiness + 25);
        game.hunger = Math.max(0, game.hunger - 10);
        game.energy = Math.max(0, game.energy - 15);
        game.clean = Math.max(0, game.clean - 10);
        showMessage("신나게 뛰어놀았어요! 🎾");
        addDiary("오늘 장난치고 놀았더니 체력은 닳았지만 엄청 재미있었다! 🎾");
        addProgress(10);
    }

    function washPet() {
        if (game.isSick || game.adventureActive) return;
        game.clean = Math.min(100, game.clean + 35);
        game.happiness = Math.max(0, game.happiness - 5);
        showMessage("반짝반짝 깨끗해졌어요! 🧼");
        addDiary("거품 목욕을 했다. 거품이 눈에 들어갈 뻔했지만 개운하다! 🫧");
        addProgress(10);
    }

    function healPet() {
        game.isSick = false;
        game.hunger = 50;
        game.happiness = 50;
        game.clean = 50;
        game.energy = 50;
        showMessage("건강을 되찾았어요! ✨");
        addDiary("아팠다가 겨우 나았다. 앞으로는 건강 관리를 잘해야지! 💊");
        updateUI();
    }

    // 1. 상점 & 패션 부티크
    function openShop() { document.getElementById('shopModal').style.display = 'flex'; }
    function closeShop() { document.getElementById('shopModal').style.display = 'none'; }

    function buyItem(item) {
        if (item === 'snack') {
            if (game.coins >= 20) {
                game.coins -= 20;
                game.hunger = Math.min(100, game.hunger + 40);
                showMessage("맛있는 간식을 먹었어요! 🍪");
                closeShop();
                updateUI();
            } else { showMessage("코인이 부족해요! 💰"); }
        } else if (item === 'toy') {
            if (game.coins >= 30) {
                game.coins -= 30;
                game.happiness = Math.min(100, game.happiness + 50);
                showMessage("새 장난감에 엄청 좋아해요! 🧸");
                closeShop();
                updateUI();
            } else { showMessage("코인이 부족해요! 💰"); }
        } else if (item === 'mushroom') {
            if (game.coins >= 25) {
                game.coins -= 25;
                game.hunger = Math.min(100, game.hunger + 20);
                game.happiness = Math.min(100, game.happiness + 20);
                game.clean = Math.min(100, game.clean + 20);
                game.energy = Math.min(100, game.energy + 20);
                showMessage("신비한 버섯을 먹고 기운이 펄펄 넘쳐요! 🍄");
                closeShop();
                updateUI();
            } else { showMessage("코인이 부족해요! 💰"); }
        }
    }

    function buyAccessory(accSymbol, cost) {
        if (cost === 0 || game.ownedAccessories.includes(accSymbol)) {
            game.accessory = (accSymbol === 'none') ? '' : accSymbol;
            showMessage("패션 스타일을 변경했어요! ✨");
            updateUI();
            closeShop();
            return;
        }
        if (game.coins >= cost) {
            game.coins -= cost;
            game.ownedAccessories.push(accSymbol);
            game.accessory = accSymbol;
            showMessage("새로운 코스튬을 장착했어요! 😎");
            updateUI();
            closeShop();
        } else {
            showMessage("코인이 부족해요! 💰");
        }
    }

    // 2. 미니게임 (가위바위보)
    function openMiniGame() { document.getElementById('gameModal').style.display = 'flex'; document.getElementById('rpsResult').innerText = ""; }
    function closeMiniGame() { document.getElementById('gameModal').style.display = 'none'; }

    function playRPS(userChoice) {
        const choices = ['rock', 'paper', 'scissors'];
        const emojis = { rock: '✊', paper: '✋', scissors: '✌️' };
        const petChoice = choices[Math.floor(Math.random() * choices.length)];
        
        let resultText = `공룡: ${emojis[petChoice]} / 나: ${emojis[userChoice]} - `;

        if (userChoice === petChoice) {
            resultText += "비겼어요! (행복 +5)";
            game.happiness = Math.min(100, game.happiness + 5);
        } else if (
            (userChoice === 'rock' && petChoice === 'scissors') ||
            (userChoice === 'paper' && petChoice === 'rock') ||
            (userChoice === 'scissors' && petChoice === 'paper')
        ) {
            resultText += "이겼어요! 🎉 (행복 +15, 코인 +10)";
            game.happiness = Math.min(100, game.happiness + 15);
            game.coins += 10;
        } else {
            resultText += "졌어요... 💧 (행복 +5)";
            game.happiness = Math.min(100, game.happiness + 5);
        }
        document.getElementById('rpsResult').innerText = resultText;
        updateUI();
    }

    // 3. 화석 발굴 미니게임
    let fossilTimer = null;
    let fossilTimeLeft = 10;
    let dugCount = 0;

    function openFossilGame() {
        if (game.isSick) { showMessage("아파서 화석을 발굴할 수 없어요!"); return; }
        document.getElementById('fossilModal').style.display = 'flex';
        fossilTimeLeft = 10;
        dugCount = 0;
        document.getElementById('fossilTimerText').innerText = `남은 시간: ${fossilTimeLeft}초`;
        document.getElementById('fossilResult').innerText = "";
        
        const grid = document.getElementById('fossilGrid');
        grid.innerHTML = "";
        for (let i = 0; i < 12; i++) {
            let cell = document.createElement('div');
            cell.className = 'fossil-cell';
            cell.innerText = "🪨";
            let hasTreasure = Math.random() < 0.4;
            cell.onclick = function() {
                if (!cell.classList.contains('dug')) {
                    cell.classList.add('dug');
                    if (hasTreasure) {
                        cell.innerText = "🦴";
                        dugCount++;
                    } else {
                        cell.innerText = "✨";
                    }
                }
            };
            grid.appendChild(cell);
        }

        fossilTimer = setInterval(() => {
            fossilTimeLeft--;
            document.getElementById('fossilTimerText').innerText = `남은 시간: ${fossilTimeLeft}초`;
            if (fossilTimeLeft <= 0) {
                clearInterval(fossilTimer);
                let rewardCoins = dugCount * 12;
                game.coins += rewardCoins;
                document.getElementById('fossilResult').innerText = `발굴 완료! 뼈다귀 ${dugCount}개 획득 (+${rewardCoins}코인)`;
                addDiary(`오늘 화석 발굴장에 가서 뼈다귀를 엄청 캐냈다! 대단하지? 🦴`);
                updateUI();
            }
        }, 1000);
    }

    function closeFossilGame() {
        clearInterval(fossilTimer);
        document.getElementById('fossilModal').style.display = 'none';
    }

    // 4. 탐험 배낭 (방치형 보상)
    function startAdventure() {
        if (game.isSick) { showMessage("아파서 탐험을 갈 수 없어요!"); return; }
        if (game.energy < 80 || game.happiness < 70) {
            showMessage("에너지(80 이상)와 행복이 충분해야 탐험을 갈 수 있어요! 🎒");
            return;
        }
        if (game.adventureActive) {
            showMessage("이미 공룡이 탐험 중입니다!");
            return;
        }

        game.adventureActive = true;
        petDisplay.style.display = "none";
        speechBubble.innerText = "모험을 떠났습니다! 10초 뒤에 돌아옵니다... 🗺️";
        addDiary("오늘 거대한 정글과 동굴로 단독 탐험을 떠났다! 어떤 걸 주워올까? 🗺️");

        setTimeout(() => {
            game.adventureActive = false;
            petDisplay.style.display = "flex";
            game.energy = Math.max(0, game.energy - 40);
            
            let rewardCoins = 30 + Math.floor(Math.random() * 30);
            game.coins += rewardCoins;
            
            let foundAccs = ['😎', '🧙‍♂️', '🎧', '🦆'];
            let randomAcc = foundAccs[Math.floor(Math.random() * foundAccs.length)];
            if (!game.ownedAccessories.includes(randomAcc)) {
                game.ownedAccessories.push(randomAcc);
                game.accessory = randomAcc;
                showMessage(`탐험 성공! 코인과 신기한 모자(${randomAcc})를 주워왔어요!`);
            } else {
                showMessage(`탐험 성공! 대량의 코인(${rewardCoins}코인)을 들고 돌아왔어요! 🎉`);
            }
            addDiary(`탐험에서 무사히 돌아왔다! 보물과 멋진 모자를 발견해서 기분이 최고다! 🎒`);
            updateUI();
        }, 10000);
    }

    // 5. 일기장 모달
    function openDiaryModal() {
        document.getElementById('diaryModal').style.display = 'flex';
        let htmlStr = "";
        game.diaries.forEach((d, idx) => {
            htmlStr += `<p><b>[기록 ${game.diaries.length - idx}]</b><br>${d}</p>`;
        });
        document.getElementById('diaryContent').innerHTML = htmlStr;
    }
    function closeDiaryModal() { document.getElementById('diaryModal').style.display = 'none'; }

    // 날씨 시스템 및 스탯 감소 주기 (3초마다)
    let tickCount = 0;
    setInterval(() => {
        if (!game.isSick && !game.adventureActive) {
            game.hunger = Math.max(0, game.hunger - 3);
            game.happiness = Math.max(0, game.happiness - 3);
            
            let cleanDec = (game.weather === 'rain') ? 6 : 2;
            game.clean = Math.max(0, game.clean - cleanDec);
            
            let energyDec = game.isNight ? 5 : 3;
            if (game.weather === 'snow') energyDec += 3;
            game.energy = Math.max(0, game.energy - energyDec);

            if (game.hunger === 0 || game.happiness === 0 || game.clean === 0 || game.energy === 0) {
                game.isSick = true;
                addDiary("결국 스탯 하나가 바닥을 쳐서 앓아눕고 말았다... 너무 아프다. 🤒");
            }
        }

        tickCount++;
        if (tickCount % 7 === 0) {
            const weathers = ['clear', 'rain', 'snow'];
            game.weather = weathers[Math.floor(Math.random() * weathers.length)];
            document.body.classList.remove('rain', 'snow');
            if (game.weather === 'rain') {
                document.body.classList.add('rain');
                weatherIndicator.innerText = "🌧️ 비";
                showMessage("주룩주룩 비가 내려요! 청결도가 빨리 닳으니 조심하세요!");
                addDiary("갑자기 비가 내리기 시작했다. 온몸이 빗물에 젖어 찝찝하다. 🌧️");
            } else if (game.weather === 'snow') {
                document.body.classList.add('snow');
                weatherIndicator.innerText = "❄️ 눈";
                showMessage("하얀 눈이 내려요! 날씨가 추워 에너지가 빨리 닳아요.");
                addDiary("하늘에서 눈이 펑펑 내린다. 춥지만 눈사람을 만들고 싶다! ❄️");
            } else {
                weatherIndicator.innerText = "🌤️ 맑음";
            }
        }

        if (tickCount >= 14) {
            tickCount = 0;
            game.isNight = !game.isNight;
            if (game.isNight) {
                document.body.classList.add('night');
                envIndicator.innerText = "🌙 밤";
                showMessage("밤이 되었어요. 에너지가 더 빨리 줄어들어요! 😴");
                addDiary("밤이 깊어졌다. 달빛을 보며 조용히 잠에 빠져든다. 🌙");
            } else {
                document.body.classList.remove('night');
                envIndicator.innerText = "🌞 낮";
                showMessage("상쾌한 아침이 밝았어요! ☀️");
                addDiary("새로운 아침이 밝았다! 오늘 하루도 활기차게 시작해야지! ☀️");
            }
        }

        updateUI();
    }, 3000);

    updateUI();
</script>
