<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>리얼 왁뿌볼 10단계 마스터</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #fff0f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #4a4a4a;
        }
        .game-container {
            background-color: #ffffff;
            width: 420px;
            padding: 25px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.25);
            text-align: center;
            border: 4px solid #ffb6c1;
        }
        h1 {
            color: #ff1493;
            margin-top: 0;
            font-size: 21px;
        }
        /* 상단 정보 (레벨 및 경험치) */
        .info-panel {
            background-color: #fff5f8;
            padding: 10px 15px;
            border-radius: 15px;
            margin-bottom: 15px;
            border: 2px solid #ffd1dc;
        }
        .level-text {
            font-weight: bold;
            font-size: 15px;
            color: #db7093;
            margin-bottom: 5px;
        }
        .exp-bar-container {
            width: 100%;
            background-color: #ffe4e1;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
        }
        .exp-bar {
            height: 100%;
            background-color: #ff69b4;
            width: 0%;
            transition: width 0.3s;
        }
        /* 펫 영역 */
        .pet-stage {
            position: relative;
            height: 190px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 5px 0;
        }
        .bubble {
            background-color: #f0f8ff;
            padding: 8px 15px;
            border-radius: 15px;
            font-size: 13px;
            margin-bottom: 8px;
            position: relative;
            max-width: 85%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            min-height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #b0e0e6;
        }
        .bubble::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 6px 6px 0;
            border-style: solid;
            border-color: #f0f8ff transparent;
            display: block;
            width: 0;
        }

        /* 왁뿌볼 기본 통짜 구체 디자인 */
        .waxball-outer {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            position: relative;
            cursor: pointer;
            user-select: none;
            box-shadow: inset -15px -15px 25px rgba(0,0,0,0.3), inset 10px 10px 20px rgba(255,255,255,0.8), 0 12px 25px rgba(0,0,0,0.18);
            transition: transform 0.1s ease;
            animation: bounce 1.5s infinite ease-in-out;
        }

        /* 평소 광채 하이라이트 */
        .waxball-outer::before {
            content: '';
            position: absolute;
            top: 14px;
            left: 22px;
            width: 40px;
            height: 20px;
            background: rgba(255, 255, 255, 0.75);
            border-radius: 50%;
            transform: rotate(-35deg);
        }

        /* 평소 통통 튀는 애니메이션 */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .squish {
            transform: scale(0.82, 1.15) !important;
        }
        .sparkle {
            animation: pop 0.4s ease-in-out;
        }
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.25); }
            100% { transform: scale(1); }
        }

        /* 스탯 게이지 바 */
        .stats-container {
            background-color: #f8f9fa;
            padding: 12px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 1px solid #e9ecef;
        }
        .stat-row {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .stat-row:last-child {
            margin-bottom: 0;
        }
        .stat-label {
            width: 80px;
            text-align: left;
            font-weight: bold;
            font-size: 13px;
        }
        .gauge-bar-container {
            flex-grow: 1;
            background-color: #e9ecef;
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
            margin: 0 10px;
        }
        .gauge-bar {
            height: 100%;
            width: 70%;
            transition: width 0.3s, background-color 0.3s;
        }
        .stat-value {
            width: 35px;
            text-align: right;
            font-size: 12px;
            color: #6c757d;
        }
        /* 상호작용 버튼 */
        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        button {
            background-color: #ff69b4;
            color: white;
            border: none;
            padding: 11px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.08);
            transition: all 0.1s;
        }
        button:hover {
            background-color: #ff1493;
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(1px);
        }
        button#heal-btn {
            grid-column: span 2;
            background-color: #95a5a6;
            display: none;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>리얼 왁뿌볼 10단계 마스터</h1>

        <!-- 성장 및 경험치 정보 -->
        <div class="info-panel">
            <div class="level-text" id="level-text">단계: 1단계 (생 클레이 덩어리)</div>
            <div class="exp-bar-container">
                <div class="exp-bar" id="exp-bar"></div>
            </div>
        </div>

        <!-- 왁뿌볼 이미지 스테이지 -->
        <div class="pet-stage">
            <div class="bubble" id="bubble-text">반짝이는 왁스 껍질을 키워보세요.</div>
            <div class="waxball-outer" id="waxball-outer" onclick="petClick()"></div>
        </div>

        <!-- 스탯 바 목록 -->
        <div class="stats-container">
            <div class="stat-row">
                <span class="stat-label">말랑함</span>
                <div class="gauge-bar-container">
                    <div class="gauge-bar" id="hunger-bar"></div>
                </div>
                <span class="stat-value" id="hunger-val">70</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">ASMR감</span>
                <div class="gauge-bar-container">
                    <div class="gauge-bar" id="happiness-bar"></div>
                </div>
                <span class="stat-value" id="happiness-val">70</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">왁스상태</span>
                <div class="gauge-bar-container">
                    <div class="gauge-bar" id="clean-bar"></div>
                </div>
                <span class="stat-value" id="clean-val">70</span>
            </div>
        </div>

        <!-- 상호작용 버튼 -->
        <div class="buttons-grid">
            <button onclick="feedPet()">클레이 충전</button>
            <button onclick="playWithPet()">냉동고 얼리기</button>
            <button onclick="washPet()">왁스 코팅하기</button>
            <button onclick="sleepPet()">꾹꾹이 누르기</button>
            <button id="heal-btn" onclick="healPet()">찢어진 곳 복구하기</button>
        </div>
    </div>

    <script>
        const stageList = [
            { level: 1, name: "생 클레이 덩어리", gradient: "radial-gradient(circle at 35% 35%, #ffffff, #dcdde1)" },
            { level: 2, name: "말랑 반죽 클레이", gradient: "radial-gradient(circle at 35% 35%, #fff200, #fbc531)" },
            { level: 3, name: "초보 왁스 볼", gradient: "radial-gradient(circle at 35% 35%, #ffeaa7, #e1b12c)" },
            { level: 4, name: "반짝 코팅 왁뿌볼", gradient: "radial-gradient(circle at 35% 35%, #ff7675, #d63031)" },
            { level: 5, name: "말랑 촉촉 왁뿌볼", gradient: "radial-gradient(circle at 35% 35%, #55efc4, #00b894)" },
            { level: 6, name: "꽁꽁 얼려진 왁뿌볼", gradient: "radial-gradient(circle at 35% 35%, #81ecec, #0984e3)" },
            { level: 7, name: "빠삭 ASMR 왁뿌볼", gradient: "radial-gradient(circle at 35% 35%, #a29bfe, #6c5ce7)" },
            { level: 8, name: "영롱한 무지개 왁뿌볼", gradient: "radial-gradient(circle at 35% 35%, #fd79a8, #e84393)" },
            { level: 9, name: "특급 레전드 왁뿌볼", gradient: "radial-gradient(circle at 35% 35%, #00cec9, #0984e3)" },
            { level: 10, name: "궁극의 왁뿌볼 마스터", gradient: "radial-gradient(circle at 35% 35%, #ffeaa7, #ff9f43)" }
        ];

        let state = {
            stage: 1,
            exp: 0,
            hunger: 70,
            happiness: 70,
            clean: 70,
            isSick: false
        };

        const levelText = document.getElementById('level-text');
        const expBar = document.getElementById('exp-bar');
        const bubbleText = document.getElementById('bubble-text');
        const waxballOuter = document.getElementById('waxball-outer');
        
        const hungerBar = document.getElementById('hunger-bar');
        const happinessBar = document.getElementById('happiness-bar');
        const cleanBar = document.getElementById('clean-bar');
        
        const hungerVal = document.getElementById('hunger-val');
        const happinessVal = document.getElementById('happiness-val');
        const cleanVal = document.getElementById('clean-val');
        const healBtn = document.getElementById('heal-btn');

        setInterval(() => {
            if (state.isSick) return;

            state.hunger = Math.max(0, state.hunger - 3);
            state.happiness = Math.max(0, state.happiness - 3);
            state.clean = Math.max(0, state.clean - 3);

            if (state.hunger === 0 || state.happiness === 0 || state.clean === 0) {
                if (!state.isSick) {
                    state.isSick = true;
                    bubbleText.innerText = "왁스 껍질이 터져버렸습니다!";
                    healBtn.style.display = "block";
                }
            }

            updateUI();
        }, 3000);

        function updateUI() {
            updateBar(hungerBar, hungerVal, state.hunger);
            updateBar(happinessBar, happinessVal, state.happiness);
            updateBar(cleanBar, cleanVal, state.clean);

            let currentInfo = stageList[state.stage - 1];
            levelText.innerText = `단계: ${currentInfo.name} (Lv.${state.stage}/10)`;
            expBar.style.width = `${state.exp}%`;

            if (state.isSick) {
                waxballOuter.style.background = "radial-gradient(circle at 35% 35%, #b2bec3, #636e72)";
            } else {
                waxballOuter.style.background = currentInfo.gradient;
            }
        }

        function updateBar(barElement, valElement, value) {
            valElement.innerText = value;
            barElement.style.width = `${value}%`;
            if (value > 50) {
                barElement.style.backgroundColor = "#27ae60";
            } else if (value > 20) {
                barElement.style.backgroundColor = "#f39c12";
            } else {
                barElement.style.backgroundColor = "#c0392b";
            }
        }

        function addExp(amount) {
            if (state.isSick) {
                bubbleText.innerText = "터진 상태에서는 레벨업을 할 수 없습니다. 복구가 필요합니다.";
                return;
            }

            state.exp += amount;
            if (state.exp >= 100) {
                state.exp = 0;
                if (state.stage < 10) {
                    state.stage++;
                    triggerEvolutionEffect();
                } else {
                    state.exp = 100;
                    bubbleText.innerText = "축하합니다! 전설의 왁뿌볼 마스터를 달성했습니다.";
                }
            }
            updateUI();
        }

        function triggerEvolutionEffect() {
            waxballOuter.classList.add('sparkle');
            setTimeout(() => waxballOuter.classList.remove('sparkle'), 400);
            
            let currentInfo = stageList[state.stage - 1];
            bubbleText.innerText = `레벨 업! [${currentInfo.name}] (Lv.${state.stage}) (으)로 진화했습니다.`;
        }

        function petClick() {
            if (state.isSick) {
                bubbleText.innerText = "아파서 터져 있어요. 빨리 복구 버튼을 눌러주세요.";
                return;
            }
            waxballOuter.classList.add('squish');
            setTimeout(() => waxballOuter.classList.remove('squish'), 150);

            const messages = [
                "빠작! 바삭한 왁스 껍질에 금이 가는 ASMR 소리가 납니다.",
                "말랑한 왁뿌볼이 꾹 눌리며 힐링이 됩니다.",
                "냉동고에 살짝 얼려뒀다 깨면 희열이 두 배가 됩니다.",
                `현재 ${state.stage}단계 왁뿌볼 상태입니다.`
            ];
            bubbleText.innerText = messages[Math.floor(Math.random() * messages.length)];
        }

        function feedPet() {
            if (state.isSick) return;
            state.hunger = Math.min(100, state.hunger + 25);
            state.happiness = Math.min(100, state.happiness + 5);
            bubbleText.innerText = "말랑한 클레이 속살을 가득 충전했습니다.";
            addExp(15);
        }

        function playWithPet() {
            if (state.isSick) return;
            state.happiness = Math.min(100, state.happiness + 25);
            state.hunger = Math.max(0, state.hunger - 10);
            state.clean = Math.max(0, state.clean - 10);
            bubbleText.innerText = "냉동고에 넣어 살짝 얼렸더니 바삭함이 폭발합니다.";
            addExp(15);
        }

        function washPet() {
            if (state.isSick) return;
            state.clean = Math.min(100, state.clean + 35);
            state.happiness = Math.max(0, state.happiness - 5);
            bubbleText.innerText = "표면에 맑은 왁스 층을 고르게 코팅했습니다.";
            addExp(15);
        }

        function sleepPet() {
            if (state.isSick) return;
            state.happiness = Math.min(100, state.happiness + 10);
            state.hunger = Math.max(0, state.hunger - 5);
            bubbleText.innerText = "손으로 천천히 주물러주며 ASMR 힐링 타임을 가졌습니다.";
            addExp(15);
        }

        function healPet() {
            state.isSick = false;
            state.hunger = 50;
            state.happiness = 50;
            state.clean = 50;
            healBtn.style.display = "none";
            bubbleText.innerText = "새 왁스로 완벽하게 복구되었습니다.";
            updateUI();
        }

        updateUI();
    </script>
</body>
</html>
