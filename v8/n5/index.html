<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>곰돌이 푸 키우기 🧸🍯</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 16px;
      background-color: #fef08a; /* 파스텔 노랑 */
      color: #713f12;
      font-family: 'Pretendard', system-ui, -apple-system, sans-serif;
      font-size: 13px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      transition: background-color 1s ease;
      overflow: hidden;
      position: relative;
    }

    /* 동글동글하고 연노랑색 글씨 (배경 대비를 위해 테두리 shadow 적용) */
    .yellow-text {
      color: #fef9c3;
      font-weight: 800;
      font-size: 13px;
      text-shadow: 1px 1px 3px rgba(113, 63, 18, 0.8);
    }

    /* 밤 모드 */
    body.night-mode {
      background-color: #1e1b4b;
    }

    /* 배경 요소를 담을 컨테이너 */
    .bg-animation-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* 배경 날아다니는 꿀벌 🐝 */
    .bg-bee {
      position: absolute;
      font-size: 32px;
      animation: flyBee 12s infinite ease-in-out;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15));
    }

    @keyframes flyBee {
      0% { top: 15%; left: 10%; transform: scaleX(1); }
      25% { top: 35%; left: 80%; transform: scaleX(1); }
      50% { top: 70%; left: 70%; transform: scaleX(-1); }
      75% { top: 50%; left: 15%; transform: scaleX(-1); }
      100% { top: 15%; left: 10%; transform: scaleX(1); }
    }

    /* 배경에서 꿀벌을 쫓아 뛰어다니는 곰돌이 친구 🧸 */
    .bg-chasing-bear {
      position: absolute;
      font-size: 42px;
      opacity: 0.65;
      animation: chaseBee 12s infinite ease-in-out;
    }

    @keyframes chaseBee {
      0% { top: 22%; left: 5%; transform: scaleX(1) translateY(0); }
      12% { transform: scaleX(1) translateY(-15px); } /* 중간 점프 */
      25% { top: 42%; left: 72%; transform: scaleX(1) translateY(0); }
      37% { transform: scaleX(1) translateY(-15px); } /* 중간 점프 */
      50% { top: 77%; left: 62%; transform: scaleX(-1) translateY(0); }
      62% { transform: scaleX(-1) translateY(-15px); } /* 중간 점프 */
      75% { top: 57%; left: 8%; transform: scaleX(-1) translateY(0); }
      87% { transform: scaleX(-1) translateY(-15px); } /* 중간 점프 */
      100% { top: 22%; left: 5%; transform: scaleX(1) translateY(0); }
    }

    /* 메인 게임 카드 */
    .container {
      width: 100%;
      max-width: 380px;
      background: rgba(255, 253, 235, 0.95);
      border: 4px solid #fde047;
      border-radius: 28px;
      padding: 18px;
      box-shadow: 0 10px 25px rgba(113, 63, 18, 0.15);
      position: relative;
      z-index: 2;
      transition: all 1s ease;
    }

    body.night-mode .container {
      background: rgba(30, 27, 75, 0.92);
      border-color: #6366f1;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    /* 상단 레벨 / 정보 */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      background: #ca8a04;
      padding: 8px 12px;
      border-radius: 20px;
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.3);
    }

    .info-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 60%;
    }

    .info-header {
      display: flex;
      justify-content: space-between;
    }

    .exp-bar-bg {
      width: 100%;
      height: 10px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 10px;
      overflow: hidden;
    }

    .exp-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #facc15, #fef08a);
      width: 0%;
      border-radius: 8px;
      transition: width 0.3s ease;
    }

    .coin-badge {
      background: #854d0e;
      padding: 6px 10px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* 메인 펫 캐릭터 영역 및 애니메이션 */
    .pet-stage {
      height: 160px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .speech-bubble {
      position: absolute;
      top: 0;
      background: #ffffff;
      color: #854d0e;
      border: 2px solid #facc15;
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: bold;
      opacity: 0;
      transform: translateY(5px);
      transition: all 0.3s ease;
      pointer-events: none;
      box-shadow: 0 4px 10px rgba(234, 179, 8, 0.2);
      z-index: 10;
      max-width: 90%;
      text-align: center;
    }

    .speech-bubble.active {
      opacity: 1;
      transform: translateY(0);
    }

    /* 메인 곰돌이 통통 튀는 애니메이션 */
    .pet {
      font-size: 72px;
      cursor: pointer;
      margin-top: 15px;
      display: inline-block;
      animation: bounce 2s infinite ease-in-out;
      transform-origin: center bottom;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-12px) scale(1.03, 0.97); }
    }

    .evolution-effect {
      animation: sparkle 1.2s ease-in-out !important;
    }

    @keyframes sparkle {
      0% { transform: scale(1) rotate(0deg); filter: brightness(1); }
      50% { transform: scale(1.4) rotate(180deg); filter: brightness(2) drop-shadow(0 0 15px #facc15); }
      100% { transform: scale(1) rotate(360deg); filter: brightness(1); }
    }

    /* 게이지 그리드 */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .stat-card {
      background: rgba(254, 240, 138, 0.4);
      padding: 8px 10px;
      border-radius: 16px;
      border: 1px solid rgba(250, 204, 21, 0.6);
    }

    body.night-mode .stat-card {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.1);
    }

    .stat-title {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
      font-weight: bold;
      color: #854d0e;
    }

    body.night-mode .stat-title {
      color: #fef08a;
    }

    .stat-bar-bg {
      height: 10px;
      width: 100%;
      background: rgba(0,0,0,0.12);
      border-radius: 8px;
      overflow: hidden;
    }

    .stat-bar-fill {
      height: 100%;
      width: 70%;
      transition: width 0.3s ease, background-color 0.4s ease;
      border-radius: 8px;
    }

    /* 버튼 스타일 */
    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .btn {
      background: #eab308;
      border: none;
      padding: 10px;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 3px 0 #ca8a04;
      transition: all 0.1s ease;
    }

    .btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #ca8a04;
    }

    .btn-heal {
      grid-column: span 2;
      background: #ef4444;
      box-shadow: 0 3px 0 #b91c1c;
      display: none;
    }

    .btn-heal.active {
      display: block;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }

    /* 하단 보조 메뉴 */
    .sub-section {
      border-top: 2px dashed rgba(234, 179, 8, 0.4);
      padding-top: 8px;
      margin-top: 8px;
    }

    .section-label {
      font-weight: bold;
      margin-bottom: 6px;
      color: #854d0e;
    }

    body.night-mode .section-label {
      color: #fef08a;
    }

    .sub-btn-group {
      display: flex;
      gap: 6px;
    }

    .sub-btn {
      flex: 1;
      background: #ca8a04;
      border: none;
      padding: 8px 4px;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 2px 0 #854d0e;
    }

    .sub-btn:active {
      transform: translateY(1px);
      box-shadow: 0 1px 0 #854d0e;
    }
  </style>
</head>
<body>

  <!-- 배경 애니메이션 요소 (날아다니는 꿀벌 & 쫓아다니며 점프하는 곰돌이) -->
  <div class="bg-animation-container">
    <div class="bg-bee">🐝</div>
    <div class="bg-chasing-bear">🧸</div>
  </div>

  <div class="container">
    <!-- 상단 상태바 -->
    <div class="top-bar">
      <div class="info-left">
        <div class="info-header">
          <span id="stageText" class="yellow-text">단계: 알 🥚</span>
          <span id="levelText" class="yellow-text">Lv.1</span>
        </div>
        <div class="exp-bar-bg">
          <div class="exp-bar-fill" id="expBar"></div>
        </div>
      </div>
      <div id="dayNightIcon" style="font-size: 18px;">🌞</div>
      <div class="coin-badge">
        <span>🪙</span>
        <span id="coinText" class="yellow-text">0</span>
      </div>
    </div>

    <!-- 메인 펫 캐릭터 & 말풍선 -->
    <div class="pet-stage">
      <div class="speech-bubble" id="speechBubble">오늘도 행복한 하루야! 🍯</div>
      <div class="pet" id="petAvatar" onclick="touchPet()">🥚</div>
    </div>

    <!-- 스탯 게이지 목록 -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-title"><span>🍚 포만감</span><span id="valFullness">70</span></div>
        <div class="stat-bar-bg"><div class="stat-bar-fill" id="barFullness"></div></div>
      </div>
      <div class="stat-card">
        <div class="stat-title"><span>💖 행복</span><span id="valHappiness">70</span></div>
        <div class="stat-bar-bg"><div class="stat-bar-fill" id="barHappiness"></div></div>
      </div>
      <div class="stat-card">
        <div class="stat-title"><span>🧼 청결</span><span id="valCleanliness">70</span></div>
        <div class="stat-bar-bg"><div class="stat-bar-fill" id="barCleanliness"></div></div>
      </div>
      <div class="stat-card">
        <div class="stat-title"><span>⚡ 에너지</span><span id="valEnergy">70</span></div>
        <div class="stat-bar-bg"><div class="stat-bar-fill" id="barEnergy"></div></div>
      </div>
    </div>

    <!-- 상호작용 버튼 -->
    <div class="actions-grid">
      <button class="btn btn-heal" id="btnHeal" onclick="heal()"><span class="yellow-text">🤒 치료하기</span></button>
      <button class="btn" onclick="feed()"><span class="yellow-text">🍚 밥 주기</span></button>
      <button class="btn" onclick="play()"><span class="yellow-text">🧶 놀아주기</span></button>
      <button class="btn" onclick="wash()"><span class="yellow-text">🧼 씻기기</span></button>
      <button class="btn" onclick="sleep()"><span class="yellow-text">💤 재우기</span></button>
    </div>

    <!-- 상점 -->
    <div class="sub-section">
      <div class="section-label">🛒 상점</div>
      <div class="sub-btn-group">
        <button class="sub-btn" onclick="buySnack()"><span class="yellow-text">간식 (20🪙)</span></button>
        <button class="sub-btn" onclick="buyToy()"><span class="yellow-text">장난감 (30🪙)</span></button>
      </div>
    </div>

    <!-- 미니게임 -->
    <div class="sub-section">
      <div class="section-label">🎮 가위바위보 미니게임</div>
      <div class="sub-btn-group">
        <button class="sub-btn" onclick="playRPS('rock')"><span class="yellow-text">✊ 바위</span></button>
        <button class="sub-btn" onclick="playRPS('paper')"><span class="yellow-text">✋ 보</span></button>
        <button class="sub-btn" onclick="playRPS('scissors')"><span class="yellow-text">✌️ 가위</span></button>
      </div>
    </div>
  </div>

  <script>
    // 게임 내부 상태
    const state = {
      fullness: 70,
      happiness: 70,
      cleanliness: 70,
      energy: 70,
      exp: 0,
      level: 1,
      coins: 0,
      stage: 0, // 0: 알, 1: 아기, 2: 청소년, 3: 어른
      isSick: false,
      isSleeping: false,
      isNight: false
    };

    const stages = ["알 🥚", "아기 🍼", "청소년 🎒", "어른 👑"];
    let speechTimer = null;

    // 3초마다 모든 스탯 감소
    setInterval(() => {
      if (!state.isSleeping) {
        state.fullness = Math.max(0, state.fullness - 3);
        state.happiness = Math.max(0, state.happiness - 3);
        state.cleanliness = Math.max(0, state.cleanliness - 3);
        
        // 밤 모드일 때 에너지가 더 빨리 감소 (6 감소)
        const energyLoss = state.isNight ? 6 : 3;
        state.energy = Math.max(0, state.energy - energyLoss);
      } else {
        // 자는 동안 에너지 회복
        state.energy = Math.min(100, state.energy + 15);
        state.fullness = Math.max(0, state.fullness - 1);
      }

      // 게이지 중 하나라도 0이 되면 아픔 조건 달성
      if ((state.fullness === 0 || state.happiness === 0 || state.cleanliness === 0 || state.energy === 0) && !state.isSick) {
        state.isSick = true;
        speak("몸이 아파요... 치료해 주세요 🤒");
      }

      updateUI();
    }, 3000);

    // 15초마다 낮/밤 전환
    setInterval(() => {
      state.isNight = !state.isNight;
      document.body.classList.toggle('night-mode', state.isNight);
      document.getElementById('dayNightIcon').innerText = state.isNight ? '🌙' : '🌞';
      if (state.isNight) speak("밤이 되었어요. 에너지가 더 빨리 줄어들어요 🌙");
      else speak("화창한 낮이 찾아왔어요! 🌞");
    }, 15000);

    // UI 동기화 및 표정 업데이트
    function updateUI() {
      renderGauge('Fullness', state.fullness);
      renderGauge('Happiness', state.happiness);
      renderGauge('Cleanliness', state.cleanliness);
      renderGauge('Energy', state.energy);

      document.getElementById('stageText').innerText = `단계: ${stages[state.stage]}`;
      document.getElementById('levelText').innerText = `Lv.${state.level}`;
      document.getElementById('expBar').style.width = `${state.exp}%`;
      document.getElementById('coinText').innerText = state.coins;

      // 치료 버튼 표시 제어
      const healBtn = document.getElementById('btnHeal');
      if (state.isSick) healBtn.classList.add('active');
      else healBtn.classList.remove('active');

      // 곰돌이 푸 상태별 표정 제어
      const pet = document.getElementById('petAvatar');
      if (state.isSick) {
        pet.innerText = '🤒';
      } else if (state.isSleeping) {
        pet.innerText = '💤🧸';
      } else if (state.stage === 0) {
        pet.innerText = '🥚';
      } else {
        const avg = (state.fullness + state.happiness + state.cleanliness + state.energy) / 4;
        let face = '😊'; // 좋음
        if (avg < 40) face = '😢'; // 나쁨
        else if (avg < 70) face = '😐'; // 보통

        // 실제 곰돌이 이모지 표현 🧸 + 표정
        pet.innerText = `🧸${face}`;
      }
    }

    // 게이지 바 색상 변경 (많으면 파랑, 적으면 빨강)
    function renderGauge(type, val) {
      document.getElementById(`val${type}`).innerText = val;
      const bar = document.getElementById(`bar${type}`);
      bar.style.width = `${val}%`;

      if (val > 50) {
        bar.style.backgroundColor = '#3b82f6'; // 파랑
      } else if (val > 20) {
        bar.style.backgroundColor = '#f59e0b'; // 주황
      } else {
        bar.style.backgroundColor = '#ef4444'; // 빨강
      }
    }

    // 말풍선 출력 함수
    function speak(text) {
      const bubble = document.getElementById('speechBubble');
      bubble.innerText = text;
      bubble.classList.add('active');
      
      clearTimeout(speechTimer);
      speechTimer = setTimeout(() => {
        bubble.classList.remove('active');
      }, 2500);
    }

    // 보상 및 경험치 처리
    function addCareReward() {
      if (state.isSick) return; // 아픈 상태에서는 경험치/코인 제외

      state.coins += 5;
      state.exp += 10;

      if (state.exp >= 100) {
        state.exp -= 100;
        state.level += 1;
        checkEvolution();
      }
    }

    // 진화 조건 체크
    function checkEvolution() {
      let nextStage = state.stage;
      if (state.level >= 10) nextStage = 3; // 어른
      else if (state.level >= 5) nextStage = 2; // 청소년
      else if (state.level >= 2) nextStage = 1; // 아기

      if (nextStage !== state.stage) {
        state.stage = nextStage;
        const pet = document.getElementById('petAvatar');
        pet.classList.add('evolution-effect');
        setTimeout(() => pet.classList.remove('evolution-effect'), 1200);
        speak("곰돌이(이)가 진화했다! ✨");
      } else {
        speak(`레벨 업! Lv.${state.level} 달성! 🎉`);
      }
    }

    function touchPet() {
      if (state.isSleeping) {
        speak("쿨쿨... 잠자는 중이야 💤");
      } else if (state.isSick) {
        speak("몸이 아파서 힘들어요 🤒");
      } else {
        speak("도도하지만 낮잠과 꿀을 제일 좋아해 🧸🍯");
      }
    }

    /* 액션 버튼 핸들러 */
    function feed() {
      if (state.isSick || state.isSleeping) return;
      state.fullness = Math.min(100, state.fullness + 25);
      const bonus = state.energy > 0 ? 5 : 0;
      state.happiness = Math.min(100, state.happiness + 5 + bonus);
      speak("달콤한 꿀 맛은 언제나 최고야! 🍯");
      addCareReward();
      updateUI();
    }

    function play() {
      if (state.isSick || state.isSleeping) return;
      if (state.energy < 15) {
        speak("너무 피곤해서 놀 수 없어 ⚡");
        return;
      }
      state.happiness = Math.min(100, state.happiness + 25);
      state.fullness = Math.max(0, state.fullness - 10);
      state.energy = Math.max(0, state.energy - 15);
      state.cleanliness = Math.max(0, state.cleanliness - 10);
      speak("신나게 뛰어놀았어! 🧶");
      addCareReward();
      updateUI();
    }

    function wash() {
      if (state.isSick || state.isSleeping) return;
      state.cleanliness = Math.min(100, state.cleanliness + 35);
      state.happiness = Math.max(0, state.happiness - 5);
      speak("몸이 뽀득뽀득 깨끗해졌어! 🧼");
      addCareReward();
      updateUI();
    }

    function sleep() {
      if (state.isSick) return;
      state.isSleeping = !state.isSleeping;
      if (state.isSleeping) {
        state.energy = Math.min(100, state.energy + 40);
        state.fullness = Math.max(0, state.fullness - 10);
        speak("쿨쿨... 낮잠 자는 시간 💤");
      } else {
        speak("푹 자고 일어났어! 🌞");
      }
      updateUI();
    }

    function heal() {
      if (!state.isSick) return;
      state.isSick = false;
      state.fullness = Math.max(20, state.fullness);
      state.happiness = Math.max(20, state.happiness);
      state.cleanliness = Math.max(20, state.cleanliness);
      state.energy = Math.max(20, state.energy);
      speak("치료 완료! 다시 기운이 나 💊");
      updateUI();
    }

    /* 상점 아이템 구매 */
    function buySnack() {
      if (state.isSick || state.isSleeping) return;
      if (state.coins >= 20) {
        state.coins -= 20;
        state.fullness = Math.min(100, state.fullness + 40);
        speak("맛있는 간식을 먹었어! 🍯 (포만감 +40)");
        updateUI();
      } else {
        speak("코인이 부족해! 🪙");
      }
    }

    function buyToy() {
      if (state.isSick || state.isSleeping) return;
      if (state.coins >= 30) {
        state.coins -= 30;
        state.happiness = Math.min(100, state.happiness + 50);
        speak("새 장난감으로 신나게 놀았어! 🧸 (행복 +50)");
        updateUI();
      } else {
        speak("코인이 부족해! 🪙");
      }
    }

    /* 가위바위보 미니게임 */
    function playRPS(userChoice) {
      if (state.isSick || state.isSleeping) return;

      const choices = ['rock', 'paper', 'scissors'];
      const petChoice = choices[Math.floor(Math.random() * 3)];

      if (userChoice === petChoice) {
        speak("비겼다! 한 번 더 해! (행복 +5) 🤝");
        state.happiness = Math.min(100, state.happiness + 5);
      } else if (
        (userChoice === 'rock' && petChoice === 'scissors') ||
        (userChoice === 'paper' && petChoice === 'rock') ||
        (userChoice === 'scissors' && petChoice === 'paper')
      ) {
        speak("네가 이겼어! 참 잘했어 (행복 +15, 10🪙) 🎉");
        state.happiness = Math.min(100, state.happiness + 15);
        state.coins += 10;
      } else {
        speak("내가 이겼지롱! (행복 +5) 😜");
        state.happiness = Math.min(100, state.happiness + 5);
      }

      updateUI();
    }

    // 초기 화면 업데이트
    updateUI();
  </script>
</body>
</html>
