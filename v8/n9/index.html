<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>싸지른! - 1인칭 하늘 스테이지</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB;
            font-family: 'Malgun Gothic', sans-serif;
            user-select: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: white;
            pointer-events: none;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        #gauge-container {
            width: 300px;
            height: 25px;
            background-color: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            overflow: hidden;
            border: 3px solid #fff;
            margin-top: 8px;
        }
        #gauge-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff4d4d, #ffcc00, #4cd137);
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.8);
            font-size: 24px;
            pointer-events: none;
            text-shadow: 1px 1px 2px #000;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #fff;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="ui">
        <h2 style="margin:0;">🚽 싸지른! (1인칭 스테이지)</h2>
        <div id="gauge-container">
            <div id="gauge-bar"></div>
        </div>
    </div>
    <div id="crosshair">+</div>
    <div id="instructions">
        <b>조작법:</b><br>
        - 화면 클릭: 마우스 잠금 (시점 회전)<br>
        - 이동: W, A, S, D<br>
        - 점프: 스페이스바 (즉발 점프!)<br>
        - 목표: 하늘 위 변기까지 안전하게 도달하기!
    </div>

    <!-- Three.js 및 컨트롤러 라이브러리 로드 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

    <script>
        let scene, camera, renderer, controls;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();
        let prevTime = performance.now();

        // 게임 메카닉 변수
        let canJump = false;
        let poopGauge = 100;

        let platforms = [];
        let toiletMesh;
        let gameEnded = false;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            // 안개 제거로 먼 거리 발판 흔들림 원인 차단
            scene.fog = null;

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3.8, 0);

            // antialias를 false로 설정하여 서브픽셀 렌더링으로 인한 화면 떨림/잔상 방지
            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.outputEncoding = THREE.sRGBEncoding;
            document.body.appendChild(renderer.domElement);

            controls = new THREE.PointerLockControls(camera, document.body);

            document.body.addEventListener('click', () => {
                if (!gameEnded) controls.lock();
            });

            scene.add(controls.getObject());

            const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(30, 50, 30);
            scene.add(directionalLight);

            createMap();

            const onKeyDown = function (event) {
                if (gameEnded) return;
                switch (event.code) {
                    case 'KeyW': moveForward = true; break;
                    case 'KeyA': moveLeft = true; break;
                    case 'KeyS': moveBackward = true; break;
                    case 'KeyD': moveRight = true; break;
                    case 'Space':
                        if (canJump) {
                            velocity.y = 13;
                            canJump = false;
                        }
                        break;
                }
            };

            const onKeyUp = function (event) {
                if (gameEnded) return;
                switch (event.code) {
                    case 'KeyW': moveForward = false; break;
                    case 'KeyA': moveLeft = false; break;
                    case 'KeyS': moveBackward = false; break;
                    case 'KeyD': moveRight = false; break;
                }
            };

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            window.addEventListener('resize', onWindowResize);
        }

        function createMap() {
            const startMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const blockMat = new THREE.MeshBasicMaterial({ color: 0xddeeff });
            const toiletBaseMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

            createBox(8, 1, 8, 0, 2, 0, startMat);

            const mapData = [
                {x: 0, y: 3.0, z: -6.5, w: 3.5, h: 1, d: 3.5},
                {x: 0, y: 3.5, z: -12.5, w: 3.5, h: 1, d: 3.5},
                {x: 0, y: 4.0, z: -18.5, w: 3.5, h: 1, d: 3.5},
                {x: 0, y: 4.5, z: -24.5, w: 4.0, h: 1, d: 4.0}
            ];

            mapData.forEach(data => {
                createBox(data.w, data.h, data.d, data.x, data.y, data.z, blockMat);
            });

            const toiletGroup = new THREE.Group();
            
            const bowlGeo = new THREE.BoxGeometry(2, 2.5, 2);
            const bowl = new THREE.Mesh(bowlGeo, toiletBaseMat);
            bowl.position.y = 1.25;
            toiletGroup.add(bowl);

            const tankGeo = new THREE.BoxGeometry(2, 2, 0.8);
            const tank = new THREE.Mesh(tankGeo, toiletBaseMat);
            tank.position.set(0, 3, -0.6);
            toiletGroup.add(tank);

            const waterGeo = new THREE.BoxGeometry(1.4, 0.1, 1.4);
            const waterMat = new THREE.MeshBasicMaterial({ color: 0x00d2d3 });
            const water = new THREE.Mesh(waterGeo, waterMat);
            water.position.set(0, 2.45, 0);
            toiletGroup.add(water);

            toiletGroup.position.set(0, 5, -24.5);
            scene.add(toiletGroup);
            toiletMesh = toiletGroup;
        }

        function createBox(w, h, d, x, y, z, material) {
            const geometry = new THREE.BoxGeometry(w, h, d);
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(x, y, z);
            // 발판 매트릭스 고정으로 연산 부하 및 미세 흔들림 원천 차단
            mesh.matrixAutoUpdate = false;
            mesh.updateMatrix();
            scene.add(mesh);
            platforms.push(mesh);
            return mesh;
        }

        function updateGaugeUI() {
            const bar = document.getElementById('gauge-bar');
            bar.style.width = Math.max(0, poopGauge) + '%';

            if (poopGauge <= 0 && !gameEnded) {
                gameOver("💩 참지 못하고 바지에 똥을 싸버렸습니다! 게임 실패...");
            }
        }

        function gameOver(message) {
            gameEnded = true;
            controls.unlock();
            alert(message);
            location.reload();
        }

        function gameClear() {
            gameEnded = true;
            controls.unlock();
            alert("🎉 무사히 변기에 도착하여 시원하게 볼일을 보았습니다! 클리어!");
            location.reload();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (gameEnded) return;

            const time = performance.now();
            // 프레임 드랍 시 물리 연산이 튀는 현상(스파이크) 방지를 위해 델타 타임 상한선 설정
            let delta = (time - prevTime) / 1000;
            if (delta > 0.1) delta = 0.1;
            prevTime = time;

            if (controls.isLocked === true) {
                poopGauge -= delta * 0.7;
                updateGaugeUI();

                // 즉각적인 감속 적용으로 미끄러짐 및 잔떨림 방지
                velocity.x -= velocity.x * 25.0 * delta;
                velocity.z -= velocity.z * 25.0 * delta;
                velocity.y -= 35.0 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * 70.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 70.0 * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);

                let cameraPos = controls.getObject().position;
                cameraPos.y += (velocity.y * delta);

                let onPlatform = false;
                platforms.forEach(platform => {
                    const box = new THREE.Box3().setFromObject(platform);
                    
                    if (cameraPos.x >= box.min.x && cameraPos.x <= box.max.x &&
                        cameraPos.z >= box.min.z && cameraPos.z <= box.max.z) {
                        
                        if (cameraPos.y >= box.max.y && cameraPos.y <= box.max.y + 1.2) {
                            if (velocity.y <= 0) {
                                cameraPos.y = box.max.y + 1.8;
                                velocity.y = 0;
                                onPlatform = true;
                            }
                        }
                    }
                });

                canJump = onPlatform;

                if (toiletMesh) {
                    const distance = cameraPos.distanceTo(toiletMesh.position);
                    if (distance < 3.5) {
                        gameClear();
                    }
                }

                if (cameraPos.y < -15) {
                    gameOver("💀 하늘 아래로 떨어져 대참사가 일어났습니다!");
                }
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
