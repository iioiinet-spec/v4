<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>신비한 도마뱀 키우기 육성 게임</title>
    <style>
        :root {
            --bg-color: #f4f9f4;
            --card-bg: #ffffff;
            --primary-color: #a8e6cf;
            --secondary-color: #dcedc1;
            --text-color: #4a5568;
            --border-radius: 20px;
        }

        body {
            font-family: 'Jua', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        .game-container {
            background-color: var(--card-bg);
            border: 4px solid #c7ceea;
            border-radius: var(--border-radius);
            padding: 25px;
            width: 380px;
            box-shadow: 0 10px 25px rgba(168, 230, 207, 0.3);
            text-align: center;
        }

        /* 상단 정보 영역 */
        .header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #e8f5e9;
            padding: 10px 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .exp-bar-container {
            background-color: #eee;
            border-radius: 10px;
            height: 10px;
            width: 100%;
            margin-top: 8px;
            overflow: hidden;
        }

        .exp-bar {
            background-color: #81c784;
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        /* 펫 렌더링 영역 */
        .pet-stage {
            height: 160px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            margin: 10px 0;
        }

        .pet-avatar {
            font-size: 80px;
            cursor: pointer;
            animation: bounce 1.5s infinite ease-in-out;
            user-select: none;
            display: inline-block;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        /* 2단 점프 애니메이션 정의 (올라갔다가 살짝 내려온 뒤, 한 번 더 높이 껑충!) */
        @keyframes doubleJump {
            0% { transform: translateY(0) scale(1); }
            25% { transform: translateY(-35px) scale(1.05); }
            45% { transform: translateY(-15px) scale(0.95); }
            70% { transform: translateY(-60px) scale(1.15) rotate(5deg); }
            100% { transform: translateY(0) scale(1); }
        }

        .double-jump-effect {
            animation: doubleJump 0.6s ease !important;
        }

        /* 말풍선 */
        .speech-bubble {
            background-color: #fff;
            border: 2px solid #a8e6cf;
            border-radius: 15px;
            padding: 6px 14px;
            font-size: 15px;
            margin-bottom: 10px;
            position: relative;
            display: inline-block;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            min-height: 22px;
        }

        /* 스탯 바 영역 */
        .stats-container {
            margin: 15px 0;
            text-align: left;
        }

        .stat-group {
            margin-bottom: 10px;
        }

        .stat-label {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 3px;
        }

        .gauge-bar-container {
            background-color: #f0f0f0;
            border-radius: 8px;
            height: 14px;
            width: 100%;
            overflow: hidden;
        }

        .gauge-bar {
            height: 100%;
            width: 70%;
            transition: width 0.4s ease, background-color 0.4s ease;
        }

        /* 버튼 영역 */
        .actions-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            background-color: #fff;
            border: 2px solid #dcedc1;
            border-radius: 14px;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            color: #555;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        .btn:hover {
            background-color: #f1f8e9;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(168, 230, 207, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-heal {
            grid-column: span 2;
            background-color: #ffcccb;
            border-color: #ff9999;
            color: #d9534f;
            display: none;
        }

        .btn-heal:hover {
            background-color: #ffb3b3;
        }

        /* 축하 효과 애니메이션 */
        @keyframes celebrate {
            0% { transform: scale(1); filter: hue-rotate(0deg); }
            50% { transform: scale(1.3) rotate(10deg); filter: hue-rotate(90deg); }
            100% { transform: scale(1); filter: hue-rotate(0deg); }
        }
        .celebrate-effect {
            animation: celebrate 0.6s ease;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- 상단 정보: 레벨 및 경험치 -->
        <div class="header-info">
            <div><span id="level-name">단계: 알 🥚</span></div>
            <div>EXP <span id="exp-text">0</span>/100</div>
        </div>
        <div class="exp-bar-container">
            <div class="exp-bar" id="exp-bar"></div>
        </div>

        <!-- 펫 영역 -->
        <div class="pet-stage">
            <div class="speech-bubble" id="speech-bubble">안녕! 귀여운 도마뱀을 잘 돌봐줘! 👋</div>
            <div class="pet-avatar" id="pet-avatar" onclick="petTouched()">🥚</div>
        </div>

        <!-- 스탯 게이지 -->
        <div class="stats-container">
            <div class="stat-group">
                <div class="stat-label"><span>🐛 포만감</span><span id="hunger-val">70</span></div>
                <div class="gauge-bar-container"><div class="gauge-bar" id="hunger-bar"></div></div>
            </div>
            <div class="stat-group">
                <div class="stat-label"><span>💖 행복</span><span id="happy-val">70</span></div>
                <div class="gauge-bar-container"><div class="gauge-bar" id="happy-bar"></div></div>
            </div>
            <div class="stat-group">
                <div class="stat-label"><span>✨ 청결</span><span id="clean-val">70</span></div>
                <div class="gauge-bar-container"><div class="gauge-bar" id="clean-bar"></div></div>
            </div>
        </div>

        <!-- 상호작용 버튼 -->
        <div class="actions-container">
            <button class="btn" onclick="feedPet()">🐛 밥 주기</button>
            <button class="btn" onclick="playWithPet()">🌿 놀아주기</button>
            <button class="btn" onclick="washPet()">🧼 씻기기</button>
            <button class="btn" onclick="sleepPet()">💤 재우기</button>
            <button class="btn btn-heal" id="heal-btn" onclick="healPet()">💊 치료하기</button>
        </div>
    </div>

    <script>
        // 게임 상태 데이터
        const gameState = {
            level: 1, // 1: 알, 2: 아기 도마뱀, 3: 신비한 드래곤
            exp: 0,
            hunger: 70,
            happy: 70,
            clean: 70,
            isSick: false,
            energy: 70
        };

        // DOM 요소 캐싱
        const petAvatar = document.getElementById('pet-avatar');
        const speechBubble = document.getElementById('speech-bubble');
        const levelName = document.getElementById('level-name');
        const expText = document.getElementById('exp-text');
        const expBar = document.getElementById('exp-bar');
        
        const hungerVal = document.getElementById('hunger-val');
        const hungerBar = document.getElementById('hunger-bar');
        const happyVal = document.getElementById('happy-val');
        const happyBar = document.getElementById('happy-bar');
        const cleanVal = document.getElementById('clean-val');
        const cleanBar = document.getElementById('clean-bar');
        const healBtn = document.getElementById('heal-btn');

        function speak(msg) {
            speechBubble.innerText = msg;
        }

        function clamp(val) {
            return Math.max(0, Math.min(100, val));
        }

        function getGaugeColor(value) {
            if (value > 50) return '#a8e6cf';
            if (value > 20) return '#ffd3b6';
            return '#ff8b94';
        }

        function updateUI() {
            hungerVal.innerText = Math.round(gameState.hunger);
            hungerBar.style.width = gameState.hunger + '%';
            hungerBar.style.backgroundColor = getGaugeColor(gameState.hunger);

            happyVal.innerText = Math.round(gameState.happy);
            happyBar.style.width = gameState.happy + '%';
            happyBar.style.backgroundColor = getGaugeColor(gameState.happy);

            cleanVal.innerText = Math.round(gameState.clean);
            cleanBar.style.width = gameState.clean + '%';
            cleanBar.style.backgroundColor = getGaugeColor(gameState.clean);

            expText.innerText = gameState.exp;
            expBar.style.width = (gameState.exp % 100) + '%';

            if (gameState.isSick) {
                petAvatar.innerText = '🤒';
                levelName.innerText = '단계: 아픔 😢';
                healBtn.style.display = 'block';
            } else {
                healBtn.style.display = 'none';
                if (gameState.level === 1) {
                    petAvatar.innerText = '🥚';
                    levelName.innerText = '단계: 알 🥚';
                } else if (gameState.level === 2) {
                    if (gameState.happy >= 70) petAvatar.innerText = '🦎';
                    else if (gameState.happy >= 30) petAvatar.innerText = '🦎';
                    else petAvatar.innerText = '🥺';
                    levelName.innerText = '단계: 아기 도마뱀 🦎';
                } else {
                    if (gameState.happy >= 70) petAvatar.innerText = '🐉';
                    else if (gameState.happy >= 30) petAvatar.innerText = '🐲';
                    else petAvatar.innerText = '😭';
                    levelName.innerText = '단계: 신비한 드래곤 ✨';
                }
            }
        }

        function actionDone(expGain, msg) {
            if (gameState.isSick) {
                speak("아파서 아무것도 할 수 없어... 치료해 줘! 🤒");
                return;
            }

            addExp(expGain);
            speak(msg);
            updateUI();
        }

        function addExp(amount) {
            gameState.exp += amount;
            if (gameState.exp >= 300 && gameState.level < 3) {
                gameState.level = 3;
                triggerEvolution("도마뱀이 신비한 용으로 최종 진화했습니다! 🐉✨");
            } else if (gameState.exp >= 100 && gameState.level < 2) {
                gameState.level = 2;
                triggerEvolution("알에서 귀여운 도마뱀이 태어났어요! 🦎");
            }
        }

        function triggerEvolution(congratsMsg) {
            petAvatar.classList.add('celebrate-effect');
            setTimeout(() => {
                petAvatar.classList.remove('celebrate-effect');
            }, 600);
            speak(congratsMsg);
        }

        function feedPet() {
            if (gameState.isSick) return;
            gameState.hunger = clamp(gameState.hunger + 25);
            gameState.happy = clamp(gameState.happy + 5);
            if (gameState.energy > 0) {
                gameState.happy = clamp(gameState.happy + 5);
            }
            actionDone(10, "오물오물! 맛있는 먹이를 먹었어요! 🐛");
        }

        function playWithPet() {
            if (gameState.isSick) return;
            gameState.happy = clamp(gameState.happy + 25);
            gameState.hunger = clamp(gameState.hunger - 10);
            gameState.energy = clamp(gameState.energy - 15);
            gameState.clean = clamp(gameState.clean - 10);
            actionDone(10, "풀숲을 함께 탐험하며 놀았어요! 🌿");
        }

        function washPet() {
            if (gameState.isSick) return;
            gameState.clean = clamp(gameState.clean + 35);
            gameState.happy = clamp(gameState.happy - 5);
            actionDone(10, "미끌미끌 피부를 깨끗이 씻었어요! 🫧");
        }

        function sleepPet() {
            if (gameState.isSick) return;
            gameState.energy = 100;
            gameState.hunger = clamp(gameState.hunger - 5);
            speak("따뜻한 바위 위에서 푹 잤어요! 💤");
            updateUI();
        }

        function healPet() {
            gameState.isSick = false;
            gameState.hunger = 40;
            gameState.happy = 40;
            gameState.clean = 40;
            speak("약을 먹고 다시 기운을 차렸어요! 💊✨");
            updateUI();
        }

        // 도마뱀 클릭 시 2단 점프 및 반응 애니메이션 실행
        function petTouched() {
            petAvatar.classList.remove('double-jump-effect');
            void petAvatar.offsetWidth; // 애니메이션 강제 재시작용 리프레시
            petAvatar.classList.add('double-jump-effect');

            if (gameState.isSick) {
                speak("끙끙... 아파요... 🤒");
                return;
            }
            const messages = [
                "더블 점프! 공중에서 한 번 더 껑충! 🚀✨",
                "혓바닥을 낼름거리며 신나게 날아올라요! 👅",
                "두 번 점프하는 재주를 보여줍니다! 🦎",
                "주인님 덕분에 신나요! ❤️"
            ];
            const randomMsg = messages[Math.floor(Math.random() * messages.length)];
            speak(randomMsg);
        }

        // 3초마다 게이지 감소
        setInterval(() => {
            gameState.hunger = clamp(gameState.hunger - 3);
            gameState.happy = clamp(gameState.happy - 3);
            gameState.clean = clamp(gameState.clean - 3);

            if (!gameState.isSick && (gameState.hunger === 0 || gameState.happy === 0 || gameState.clean === 0)) {
                gameState.isSick = true;
                speak("아이고... 돌봐주지 않아서 도마뱀이 아파졌어요! 🤒");
            }

            updateUI();
        }, 3000);

        updateUI();
    </script>
</body>
</html>
