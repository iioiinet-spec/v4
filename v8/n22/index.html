<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>파스텔 다마고치 - 얼티밋 패밀리 에디션</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DungGeunMo&display=swap');

        body {
            background: linear-gradient(135deg, #fbc53120, #e8411815, #00a8ff20), #f5f6fa;
            background-color: #fce4ec;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'DungGeunMo', sans-serif;
            overflow: hidden;
            user-select: none;
        }

        #app-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s ease;
            transform-origin: center;
            flex-shrink: 0;
        }

        #device {
            background: radial-gradient(circle at 35% 35%, #8ae9eb, #40e0d0, #00b8d4);
            border-radius: 45% 45% 55% 55% / 50% 50% 50% 50%;
            width: 380px;
            height: 440px;
            box-shadow: inset -10px -10px 20px rgba(0,0,0,0.1), 10px 15px 25px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 50px;
            position: relative;
            z-index: 1;
        }

        #device::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 15%;
            width: 70%;
            height: 60px;
            background: #ffb8d8;
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
            z-index: -1;
            box-shadow: inset 0 5px 10px rgba(255,255,255,0.4);
        }

        #device::after {
            content: '';
            position: absolute;
            top: 25%;
            right: -15px;
            width: 30px;
            height: 45px;
            background: #ffb8d8;
            border-radius: 8px;
            z-index: -1;
            box-shadow: inset -2px -2px 5px rgba(0,0,0,0.1);
        }

        .logo {
            position: absolute;
            top: 25px;
            color: #ffeaa7;
            font-size: 1rem;
            text-shadow: 1px 1px 0px #e1b12c;
            letter-spacing: 2px;
            z-index: 2;
        }

        #screen-bezel {
            width: 250px;
            height: 250px;
            background: #2d3436;
            border-radius: 8px;
            padding: 10px;
            box-shadow: inset 0 0 10px #000;
            position: relative;
            border: 4px solid #ffb8d8;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #screen {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: background-color 1s ease;
            background-image: 
                radial-gradient(circle at 10% 20%, #fff 2px, transparent 2px),
                radial-gradient(circle at 30% 40%, #fff 1px, transparent 1px),
                radial-gradient(circle at 70% 60%, #fff 2px, transparent 2px),
                radial-gradient(circle at 80% 20%, #fff 1px, transparent 1px),
                radial-gradient(circle at 40% 80%, #fff 2px, transparent 2px);
        }

        #screen.day { background-color: #4a69bd; }
        #screen.night { background-color: #0c2461; }
        #screen.night * { color: #ecf0f1 !important; }

        .hw-buttons {
            display: flex;
            gap: 35px;
            margin-top: 30px;
        }

        .hw-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #ffb8d8;
            box-shadow: inset -2px -2px 5px rgba(0,0,0,0.15), 2px 2px 4px rgba(0,0,0,0.2);
        }

        #controls {
            width: 390px;
            margin-top: 15px;
        }

        #gameplay {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #status-bars {
            position: absolute;
            top: 48px;
            width: 92%;
            display: flex;
            flex-direction: column;
            gap: 3px;
            font-size: 0.58rem;
            color: #fff;
            font-weight: bold;
            text-shadow: 1px 1px 0 #000;
        }

        .stat-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .stat-label {
            width: 45px;
            text-align: left;
        }

        .stat-bar-bg {
            flex-grow: 1;
            height: 5px;
            background-color: rgba(255,255,255,0.5);
            border-radius: 3px;
            overflow: hidden;
            border: 1px solid #2d3436;
            margin-left: 5px;
        }

        .stat-bar-fill {
            height: 100%;
            width: 50%;
            background-color: #2ed573;
            transition: width 0.3s;
        }

        #character {
            font-size: 3.3rem;
            animation: bounce 1s infinite alternate;
            transition: transform 0.3s ease;
            text-align: center;
            margin-top: 35px;
            white-space: nowrap;
        }

        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-8px); }
        }

        #message {
            position: absolute;
            bottom: 5px;
            font-size: 0.65rem;
            color: #fff;
            text-shadow: 1px 1px 0 #000;
            text-align: center;
            width: 100%;
            padding: 0 5px;
            z-index: 100;
        }

        #buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            width: 100%;
        }

        .btn {
            height: 42px;
            border-radius: 20px;
            background: linear-gradient(145deg, #ffeaa7, #fdcb6e);
            border: 2px solid #e1b12c;
            box-shadow: 0 3px 0 #d4a31d, 0 4px 6px rgba(0,0,0,0.15);
            cursor: pointer;
            font-size: 0.55rem;
            font-weight: bold;
            color: #2d3436;
            transition: all 0.1s;
            font-family: 'DungGeunMo', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
            padding: 2px;
            word-break: keep-all;
        }

        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 0 0 #d4a31d, 0 2px 3px rgba(0,0,0,0.15);
        }

        .overlay-screen {
            text-align: center;
            padding: 8px;
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(209, 247, 196, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            overflow-y: auto;
        }

        #screen.night .overlay-screen {
            background: rgba(44, 62, 80, 0.95);
        }

        .animal-option {
            font-size: 1.6rem;
            cursor: pointer;
            margin: 0 3px;
            transition: transform 0.2s;
            display: inline-block;
        }
        .animal-option:hover { transform: scale(1.3); }
        
        .poop {
            position: absolute;
            font-size: 1.2rem;
            bottom: 25px;
            right: 15px;
            display: none;
        }

        /* 뱃지 배치 최적화 (겹침 방지 2단 구조) */
        .badge {
            position: absolute;
            font-size: 0.52rem;
            background: rgba(255,255,255,0.88);
            padding: 2px 4px;
            border-radius: 4px;
            color: #333;
            z-index: 5;
            white-space: nowrap;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }
        /* 1단 (상단 라인) */
        #level-badge { top: 4px; left: 4px; }
        #gender-badge { top: 4px; left: 55px; font-weight: bold; }
        #time-badge { top: 4px; right: 4px; }
        /* 2단 (이름 & 골드 분리 라인) */
        #name-badge { 
            top: 25px; 
            left: 4px; 
            background: #7bed9f; 
            color: #2f3542; 
            font-weight: bold; 
            max-width: 100px; 
            overflow: hidden; 
            text-overflow: ellipsis; 
        }
        #coin-badge { 
            top: 25px; 
            right: 4px; 
            background: #fff200; 
            font-weight: bold; 
        }

        .sub-btn {
            font-family: 'DungGeunMo';
            font-size: 0.6rem;
            padding: 5px 8px;
            margin: 3px;
            cursor: pointer;
            background: #ff7675;
            color: white;
            border: 2px solid #d63031;
            border-radius: 5px;
            width: 90%;
        }

        .list-box {
            font-size: 0.58rem;
            background: rgba(255,255,255,0.8);
            width: 90%;
            max-height: 120px;
            overflow-y: auto;
            border-radius: 5px;
            padding: 4px;
            margin-bottom: 5px;
            text-align: left;
            color: #2d3436;
        }

        /* 가족 가계도 UI */
        #family-menu.overlay-screen {
            background: #47b8a8;
            color: white;
            justify-content: flex-start;
            padding-top: 15px;
            overflow-y: auto;
        }
        #family-menu p {
            color: white !important;
            font-size: 0.8rem !important;
            text-shadow: 1px 1px 0px rgba(0,0,0,0.3);
            margin-bottom: 10px;
            font-weight: bold;
        }
        .tree-row {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            position: relative;
            width: 100%;
            margin-bottom: 25px;
        }
        .tree-box {
            background: transparent;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2;
            width: 70px;
        }
        .avatar-stand {
            font-size: 1.8rem;
            width: 50px;
            height: 45px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            background: radial-gradient(circle at bottom, #f1c40f 45%, transparent 46%);
            margin-bottom: 3px;
            border-bottom: 4px solid #e1b12c;
            border-radius: 50% 50% 0 0;
            padding-bottom: 2px;
        }
        .tree-name {
            font-weight: bold;
            font-size: 0.65rem;
            margin-bottom: 2px;
            text-shadow: 1px 1px 1px rgba(0,0,0,0.5);
        }
        .tree-role {
            font-size: 0.55rem;
            opacity: 0.9;
            text-shadow: 1px 1px 1px rgba(0,0,0,0.5);
        }
        .tree-line-h {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translateX(-50%);
            width: 90px;
            height: 3px;
            background: white;
            z-index: 1;
        }
        .tree-heart {
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 1rem;
        }
        .tree-line-v {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            width: 3px;
            height: 25px;
            background: white;
            z-index: 1;
        }
        .tree-btn {
            background: white;
            color: #47b8a8;
            border: none;
            border-radius: 10px;
            font-family: 'DungGeunMo';
            padding: 3px 8px;
            font-size: 0.55rem;
            cursor: pointer;
            font-weight: bold;
            margin-top: 4px;
            box-shadow: 0 2px 0 rgba(0,0,0,0.2);
        }
        .tree-btn:active {
            transform: translateY(2px);
            box-shadow: none;
        }
    </style>
</head>
<body>
<div id="app-container">
    <div id="device">
        <div class="logo">PASTEL TAMA</div>
        
        <div id="screen-bezel">
            <div id="screen" class="day">
                <div id="level-badge" class="badge">LV.1</div>
                <div id="gender-badge" class="badge">♂️</div>
                <div id="time-badge" class="badge">☀️ 낮</div>
                <div id="name-badge" class="badge">이름</div>
                <div id="coin-badge" class="badge">💰 50G</div>

                <!-- 로비 -->
                <div id="lobby-menu" class="overlay-screen" style="display: none;">
                    <p style="font-size: 0.8rem; margin-bottom:10px; color:#2f3542;">✨ 파스텔 다마고치 ✨</p>
                    <button class="sub-btn" onclick="continueGame()" id="btn-continue" style="background:#0984e3; display:none;">🎮 이어하기</button>
                    <button class="sub-btn" onclick="showCharacterSelection()" style="background:#00b894; border-color:#00a381;">🐣 새로하기</button>
                    <button class="sub-btn" onclick="openEncyclopedia()" style="background:#6c5ce7; border-color:#4834d4;">📖 도감 보기</button>
                </div>

                <!-- 선택 화면 -->
                <div id="selection" class="overlay-screen" style="display: none;">
                    <p style="font-size: 0.7rem; margin-bottom:4px; color:#2f3542;">성별을 골라주세요!</p>
                    <div style="margin-bottom:6px;">
                        <button class="sub-btn" onclick="setGender('male')" id="btn-male" style="width:70px; background:#0984e3; display:inline-block;">♂️ 수컷</button>
                        <button class="sub-btn" onclick="setGender('female')" id="btn-female" style="width:70px; background:#ff7675; display:inline-block; opacity:0.5;">♀️ 암컷</button>
                    </div>
                    <p style="font-size: 0.7rem; margin-bottom:4px; color:#2f3542;">키울 동물을 골라주세요!</p>
                    <div>
                        <span class="animal-option" onclick="startGame('dog')">🐶</span>
                        <span class="animal-option" onclick="startGame('cat')">🐱</span>
                        <span class="animal-option" onclick="startGame('bird')">🐣</span>
                        <span class="animal-option" onclick="startGame('dino')">🦖</span>
                    </div>
                    <button class="sub-btn" onclick="backToLobby()" style="margin-top:6px; background:#b2bec3; border-color:#636e72; width:auto; padding:3px 10px;">뒤로가기</button>
                </div>

                <!-- 상점 -->
                <div id="shop-menu" class="overlay-screen" style="display: none;">
                    <p style="font-size: 0.7rem; margin-bottom:4px; color:#2f3542;">🛒 아이템 상점</p>
                    <button class="sub-btn" onclick="buyItem('snack', 20)">🍖 간식 (20G)</button>
                    <button class="sub-btn" onclick="buyItem('toy', 30)">🎾 장난감 (30G)</button>
                    <button class="sub-btn" onclick="buyItem('stop_growth', 40)" id="shop-stop-btn">🛑 성장 고정 (40G)</button>
                    <button class="sub-btn" onclick="buyItem('level1', 50)" style="background:#f1c40f; border-color:#f39c12; color:#2c3e50;">⭐ 1렙업 캔디 (50G)</button>
                    <button class="sub-btn" onclick="buyItem('level5', 100)" style="background:#e67e22; border-color:#d35400;">🌟 5렙업 캔디 (100G)</button>
                    <button class="sub-btn" onclick="buyItem('level10', 250)" style="background:#e74c3c; border-color:#c0392b;">💫 10렙업 캔디 (250G)</button>
                    <button class="sub-btn" onclick="buyOppositeEgg(50)" id="shop-egg-btn" style="background:#0984e3; border-color:#74b9ff;">🥚 반대 성별 부화 (50G)</button>
                    <button class="sub-btn" onclick="closeOverlay()" style="background:#b2bec3; border-color:#636e72; width:80px;">닫기</button>
                </div>

                <!-- 도감 -->
                <div id="encyclopedia-menu" class="overlay-screen" style="display: none;">
                    <p style="font-size: 0.7rem; margin-bottom:2px; color:#2f3542;">📖 동물 도감</p>
                    <div id="encyclopedia-stats" style="font-size: 0.55rem; margin-bottom:3px; font-weight:bold; color:#2d3436;">수집률: 0%</div>
                    <div class="list-box" id="encyclopedia-list"></div>
                    <button class="sub-btn" onclick="closeOverlay()" style="background:#b2bec3; border-color:#636e72; width:auto; padding:3px 10px;">돌아가기</button>
                </div>

                <!-- 설정 -->
                <div id="setting-menu" class="overlay-screen" style="display: none;">
                    <p style="font-size: 0.7rem; margin-bottom:4px; color:#2f3542;">⚙️ 게임 설정</p>
                    <p style="font-size: 0.58rem; margin-bottom:2px; margin-top:0px; color:#2d3436;">배경 음악:</p>
                    <button class="sub-btn" onclick="toggleBGM()" id="btn-bgm" style="background:#a29bfe; border-color:#6c5ce7; width:95%; margin-bottom:6px;">🎵 BGM 켜기</button>
                    <p style="font-size: 0.58rem; margin-bottom:2px; margin-top:2px; color:#2d3436;">시간 흐름 모드:</p>
                    <button class="sub-btn" onclick="setTimeMode('fast')" id="btn-fast" style="background:#0984e3; width:45%; display:inline-block;">⚡ 빠름</button>
                    <button class="sub-btn" onclick="setTimeMode('real')" id="btn-real" style="width:45%; display:inline-block;">⏰ 현실</button>

                    <p style="font-size: 0.58rem; margin-bottom:2px; margin-top:6px; color:#2d3436;">화면 크기 조절:</p>
                    <button class="sub-btn" onclick="setDeviceSize('mobile')" id="btn-size-mobile" style="background:#0984e3; width:45%; display:inline-block;">📱 핸드폰</button>
                    <button class="sub-btn" onclick="setDeviceSize('pc')" id="btn-size-pc" style="width:45%; display:inline-block;">💻 컴퓨터</button>

                    <button class="sub-btn" onclick="resetGameData()" style="background:#d63031; border-color:#b71540; margin-top:10px;">🚨 초기화(데이터삭제)</button>
                    <button class="sub-btn" onclick="closeOverlay()" style="background:#b2bec3; border-color:#636e72; width:auto; padding:2px 10px;">닫기</button>
                </div>

                <!-- 교배 -->
                <div id="breed-menu" class="overlay-screen" style="display: none;">
                    <p style="font-size: 0.7rem; margin-bottom:4px; color:#2f3542;">💖 짝을 찾았어요!<br>새 알의 성별을 골라주세요.</p>
                    <button class="sub-btn" onclick="confirmBreed('male')" style="background:#0984e3;">♂️ 수컷으로 낳기</button>
                    <button class="sub-btn" onclick="confirmBreed('female')" style="background:#ff7675;">♀️ 암컷으로 낳기</button>
                    <button class="sub-btn" onclick="closeOverlay()" style="background:#b2bec3; border-color:#636e72; margin-top:8px; width:auto; padding:2px 10px;">취소</button>
                </div>

                <!-- 가족 가계도 -->
                <div id="family-menu" class="overlay-screen" style="display: none;">
                    <p>🌳 우리 가족 가계도</p>
                    <div id="family-list" style="width:100%; display:flex; flex-direction:column; align-items:center;"></div>
                    <button class="sub-btn" onclick="closeOverlay()" style="background:#ffffff; color:#47b8a8; border:2px solid #ffffff; margin-top:10px; width:80px; padding:4px 10px; font-weight:bold;">닫기</button>
                </div>

                <!-- 메인 게임플레이 화면 -->
                <div id="gameplay" style="display: none;">
                    <div id="status-bars">
                        <div class="stat-row">
                            <span class="stat-label">배부름</span>
                            <div class="stat-bar-bg"><div id="bar-hunger" class="stat-bar-fill"></div></div>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">행복도</span>
                            <div class="stat-bar-bg"><div id="bar-happy" class="stat-bar-fill" style="background-color: #3742fa;"></div></div>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">에너지</span>
                            <div class="stat-bar-bg"><div id="bar-energy" class="stat-bar-fill" style="background-color: #ffa502;"></div></div>
                        </div>
                    </div>
                    
                    <div id="character">🥚</div>
                    <div id="poop" class="poop">💩</div>
                    <div id="message">반갑소! 즐거운 다마고치 시간!</div>
                </div>
            </div>
        </div>

        <div class="hw-buttons">
            <div class="hw-btn"></div>
            <div class="hw-btn"></div>
            <div class="hw-btn"></div>
        </div>
    </div>

    <!-- 컨트롤 버튼 -->
    <div id="controls">
        <div id="buttons">
            <button class="btn" onclick="feed()">🍖 밥주기</button>
            <button class="btn" onclick="play()">⚽ 놀기</button>
            <button class="btn" onclick="sleep()">💤 재우기</button>
            <button class="btn" onclick="openFamilyMenu()" style="background: linear-gradient(145deg, #a29bfe, #6c5ce7); border-color:#4834d4; color:white;">👨‍👩‍👧 가족</button>
            <button class="btn" onclick="openShop()">🛒 상점</button>
            <button class="btn" onclick="breed()">💖 교배</button>
            <button class="btn" onclick="openEncyclopedia()">📖 도감</button>
            <button class="btn" onclick="openSettings()">⚙️ 설정</button>
        </div>
    </div>

    <!-- BGM 음원 -->
    <audio id="bgmAudio" loop>
        <source src="https://raw.githubusercontent.com/mdn/webaudio-examples/main/audio-analyser/viper.mp3" type="audio/mpeg">
    </audio>
</div>

<script>
    const animalStages = {
        dog: ['🥚', '🐶', '🐕', '🦮', '👴'],
        cat: ['🥚', '🐱', '🐈', '🐈‍⬛', '👵'],
        bird: ['🥚', '🐣', '🐥', '🐔', '🦉'],
        dino: ['🥚', '🦎', '🦖', '🐉', '🐲']
    };
    const animalNames = { dog: '강아지', cat: '고양이', bird: '병아리', dino: '공룡' };

    let familyTree = { 1: { male: null, female: null } };
    let activeGen = 1;
    let coins = 50;
    let timeMode = 'fast';
    let deviceSize = 'mobile';
    let gameLoop;
    let timeSeconds = 0;
    let isBgmPlaying = false;

    let petName = '';
    let currentAnimal = '';
    let selectedGender = 'male';
    let level = 1;
    let exp = 0;
    let hunger = 60;
    let happiness = 60;
    let energy = 100;
    let isSleeping = false;
    let hasPoop = false;
    let isDead = false;
    let isGrowthFrozen = false;

    function packPet() {
        return { petName, currentAnimal, level, exp, hunger, happiness, energy, isSleeping, hasPoop, isDead, isGrowthFrozen };
    }

    function unpackPet(data) {
        if (!data) return;
        petName = data.petName || '이름없음';
        currentAnimal = data.currentAnimal || '';
        level = data.level || 1;
        exp = data.exp || 0;
        hunger = data.hunger || 60;
        happiness = data.happiness || 60;
        energy = data.energy || 100;
        isSleeping = data.isSleeping || false;
        hasPoop = data.hasPoop || false;
        isDead = data.isDead || false;
        isGrowthFrozen = data.isGrowthFrozen || false;
    }

    let encyclopedia = {};
    try {
        encyclopedia = JSON.parse(localStorage.getItem('tama_encyclopedia')) || {
            dog: [false, false, false, false, false],
            cat: [false, false, false, false, false],
            bird: [false, false, false, false, false],
            dino: [false, false, false, false, false]
        };
    } catch(e) {
        encyclopedia = { dog: [false, false, false, false, false], cat: [false, false, false, false, false], bird: [false, false, false, false, false], dino: [false, false, false, false, false] };
    }

    const elLobbyMenu = document.getElementById('lobby-menu');
    const elSelection = document.getElementById('selection');
    const elShopMenu = document.getElementById('shop-menu');
    const elEncyclopediaMenu = document.getElementById('encyclopedia-menu');
    const elSettingMenu = document.getElementById('setting-menu');
    const elBreedMenu = document.getElementById('breed-menu');
    const elFamilyMenu = document.getElementById('family-menu');
    const elGameplay = document.getElementById('gameplay');
    
    const elCharacter = document.getElementById('character');
    const elMessage = document.getElementById('message');
    const elScreen = document.getElementById('screen');
    const elTimeBadge = document.getElementById('time-badge');
    const elLevelBadge = document.getElementById('level-badge');
    const elGenderBadge = document.getElementById('gender-badge');
    const elCoinBadge = document.getElementById('coin-badge');
    const elNameBadge = document.getElementById('name-badge');
    const elPoop = document.getElementById('poop');

    const barHunger = document.getElementById('bar-hunger');
    const barHappy = document.getElementById('bar-happy');
    const barEnergy = document.getElementById('bar-energy');

    window.onload = function() {
        checkSaveData();
        window.addEventListener('resize', applyDeviceSize);
        document.body.addEventListener('click', function initAudio() {
            if (isBgmPlaying) {
                document.getElementById('bgmAudio').play().catch(e => console.log(e));
            }
            document.body.removeEventListener('click', initAudio);
        }, { once: true });
    };

    function resetGameData() {
        if(confirm("모든 데이터(가계도 포함)가 삭제됩니다. 계속하시겠습니까?")) {
            localStorage.clear();
            location.reload();
        }
    }

    function checkSaveData() {
        try {
            const saved = localStorage.getItem('tama_multi_save');
            elLobbyMenu.style.display = 'flex';
            if (saved) {
                document.getElementById('btn-continue').style.display = 'block';
                const data = JSON.parse(saved);
                deviceSize = data.deviceSize || 'mobile';
                setDeviceSize(deviceSize);
            } else {
                document.getElementById('btn-continue').style.display = 'none';
                setDeviceSize('mobile');
            }
        } catch(e) {
            console.error("Save Data Corrupted");
            localStorage.clear();
            document.getElementById('btn-continue').style.display = 'none';
        }
    }

    function continueGame() {
        try {
            const saved = localStorage.getItem('tama_multi_save');
            if (saved) {
                const data = JSON.parse(saved);
                
                if (data.familyTree) {
                    familyTree = data.familyTree;
                    activeGen = data.activeGen || 1;
                } else {
                    familyTree = { 1: { male: null, female: null } };
                    activeGen = 1;
                }
                
                coins = data.coins || 50;
                timeMode = data.timeMode || 'fast';
                selectedGender = data.selectedGender || 'male';
                deviceSize = data.deviceSize || 'mobile';
                
                setTimeMode(timeMode);
                setDeviceSize(deviceSize);

                if (!familyTree[activeGen]) {
                    familyTree[activeGen] = { male: null, female: null };
                }

                if (familyTree[activeGen][selectedGender]) {
                    unpackPet(familyTree[activeGen][selectedGender]);
                } else {
                    let opposite = (selectedGender === 'male') ? 'female' : 'male';
                    if (familyTree[activeGen][opposite]) {
                        selectedGender = opposite;
                        unpackPet(familyTree[activeGen][opposite]);
                    }
                }

                elLobbyMenu.style.display = 'none';
                elGameplay.style.display = 'flex';
                updateScreen();
                showMessage("이어서 게임을 시작합니다! 🎮");

                clearInterval(gameLoop);
                gameLoop = setInterval(gameTick, 2000);
            }
        } catch(e) {
            alert("저장 데이터를 불러오는데 실패했습니다. 데이터가 리셋됩니다.");
            localStorage.clear();
            location.reload();
        }
    }

    function showCharacterSelection() {
        elLobbyMenu.style.display = 'none';
        elSelection.style.display = 'flex';
    }

    function backToLobby() {
        elSelection.style.display = 'none';
        checkSaveData();
    }

    function quitToLobby() {
        closeOverlay();
        elGameplay.style.display = 'none';
        clearInterval(gameLoop);
        saveGame();
        checkSaveData();
        showMessage("메인 화면으로 돌아왔습니다.");
    }

    function setGender(gender) {
        selectedGender = gender;
        document.getElementById('btn-male').style.opacity = (gender === 'male') ? '1' : '0.5';
        document.getElementById('btn-female').style.opacity = (gender === 'female') ? '1' : '0.5';
    }

    function setTimeMode(mode) {
        timeMode = mode;
        document.getElementById('btn-fast').style.background = (mode === 'fast') ? '#0984e3' : '#ff7675';
        document.getElementById('btn-real').style.background = (mode === 'real') ? '#0984e3' : '#ff7675';
        showMessage(mode === 'fast' ? "가속 모드로 설정되었습니다." : "현실 시간 모드로 설정되었습니다.");
        if(currentAnimal) saveGame();
    }

    function setDeviceSize(size) {
        deviceSize = size;
        document.getElementById('btn-size-mobile').style.background = (size === 'mobile') ? '#0984e3' : '#ff7675';
        document.getElementById('btn-size-pc').style.background = (size === 'pc') ? '#0984e3' : '#ff7675';
        applyDeviceSize();
        if(currentAnimal) saveGame();
    }
    
    function applyDeviceSize() {
        const elAppContainer = document.getElementById('app-container');
        if (!elAppContainer) return;
        if (deviceSize === 'pc') {
            let maxScale = Math.min(1.5, window.innerHeight / 750);
            elAppContainer.style.transform = `scale(${maxScale})`;
        } else {
            let scale = Math.min(1, window.innerWidth / 420);
            let heightScale = Math.min(1, window.innerHeight / 750);
            elAppContainer.style.transform = `scale(${Math.min(scale, heightScale)})`;
        }
    }

    function toggleBGM() {
        const bgm = document.getElementById('bgmAudio');
        const btn = document.getElementById('btn-bgm');
        if (isBgmPlaying) {
            bgm.pause();
            isBgmPlaying = false;
            btn.innerText = "🎵 BGM 켜기";
            btn.style.background = "#a29bfe";
            btn.style.borderColor = "#6c5ce7";
        } else {
            bgm.play().then(() => {
                isBgmPlaying = true;
                btn.innerText = "🔇 BGM 끄기";
                btn.style.background = "#ff7675";
                btn.style.borderColor = "#d63031";
            }).catch(e => {
                showMessage("오디오 재생 권한이 필요합니다.");
            });
        }
    }

    function startGame(animalType) {
        let inputName = prompt("새 펫의 이름을 지어주세요!", animalNames[animalType]);
        if (inputName === null) return; 
        
        petName = inputName.trim() || animalNames[animalType];

        familyTree = { 1: { male: null, female: null } };
        activeGen = 1;
        currentAnimal = animalType;
        level = 1;
        exp = 0;
        coins = 50;
        hunger = 60;
        happiness = 60;
        energy = 100;
        isSleeping = false;
        hasPoop = false;
        isDead = false;
        isGrowthFrozen = false;
        
        familyTree[activeGen][selectedGender] = packPet();
        
        elSelection.style.display = 'none';
        elGameplay.style.display = 'flex';
        
        updateScreen();
        saveGame();
        showMessage(`${petName}이(가) 태어났습니다!`);

        clearInterval(gameLoop);
        gameLoop = setInterval(gameTick, 2000);
        
        if (!isBgmPlaying) toggleBGM();
    }

    function openFamilyMenu() {
        if (currentAnimal) {
            if(!familyTree[activeGen]) familyTree[activeGen] = { male:null, female:null };
            familyTree[activeGen][selectedGender] = packPet();
        }

        const listEl = document.getElementById('family-list');
        let html = '';
        let gens = Object.keys(familyTree).map(Number).sort((a,b) => a-b);
        
        gens.forEach((gen, index) => {
            let g = familyTree[gen];
            let isLast = index === gens.length - 1;

            html += `<div class="tree-row">`;
            
            if (g.male && g.female) {
                html += `<div class="tree-line-h"><div class="tree-heart">♥</div></div>`;
            }

            if (g.male) {
                let isCur = (gen === activeGen && selectedGender === 'male');
                let spriteIdx = g.male.isDead ? 4 : Math.min(3, Math.floor(g.male.level/5));
                let sprite = animalStages[g.male.currentAnimal][spriteIdx];
                if(g.male.isDead) sprite = "👻";
                
                html += `<div class="tree-box">
                            <div class="tree-role">[${gen}세대] ♂️ ${isCur ? '👑' : ''}</div>
                            <div class="avatar-stand">${sprite}</div>
                            <div class="tree-name">${g.male.petName}</div>
                            <button class="tree-btn" onclick="switchPetTo(${gen}, 'male')" ${isCur ? 'style="background:#f1c40f; color:white;"' : ''}>${isCur ? '현재' : '선택'}</button>
                         </div>`;
            } else {
                html += `<div class="tree-box" style="opacity:0.6;">
                            <div class="tree-role">♂️ 빈 자리</div>
                            <div class="avatar-stand" style="background:transparent; border:none;">🥚</div>
                            <div class="tree-name">-</div>
                         </div>`;
            }

            html += `<div style="width:40px;"></div>`;

            if (g.female) {
                let isCur = (gen === activeGen && selectedGender === 'female');
                let spriteIdx = g.female.isDead ? 4 : Math.min(3, Math.floor(g.female.level/5));
                let sprite = animalStages[g.female.currentAnimal][spriteIdx];
                if(g.female.isDead) sprite = "👻";
                
                html += `<div class="tree-box">
                            <div class="tree-role">[${gen}세대] ♀️ ${isCur ? '👑' : ''}</div>
                            <div class="avatar-stand">${sprite}</div>
                            <div class="tree-name">${g.female.petName}</div>
                            <button class="tree-btn" onclick="switchPetTo(${gen}, 'female')" ${isCur ? 'style="background:#f1c40f; color:white;"' : ''}>${isCur ? '현재' : '선택'}</button>
                         </div>`;
            } else {
                html += `<div class="tree-box" style="opacity:0.6;">
                            <div class="tree-role">♀️ 빈 자리</div>
                            <div class="avatar-stand" style="background:transparent; border:none;">🥚</div>
                            <div class="tree-name">-</div>
                         </div>`;
            }
            
            if (!isLast) {
                html += `<div class="tree-line-v"></div>`;
            }
            html += `</div>`;
        });
        
        listEl.innerHTML = html;
        elFamilyMenu.style.display = 'flex';
    }

    function switchPetTo(gen, gender) {
        if (activeGen === gen && selectedGender === gender) {
            showMessage("이미 현재 돌보고 있는 펫입니다!");
            return;
        }
        if (currentAnimal) {
            if(!familyTree[activeGen]) familyTree[activeGen] = { male:null, female:null };
            familyTree[activeGen][selectedGender] = packPet();
        }
        
        activeGen = gen;
        selectedGender = gender;
        unpackPet(familyTree[activeGen][selectedGender]);
        
        closeOverlay();
        updateScreen();
        saveGame();
        showMessage(`✨ ${gen}세대 ${petName} 화면으로 전환했습니다!`);
    }

    function feed() {
        if (checkBlockedForAction()) return;
        if (hunger >= 100) { showMessage("이미 배가 불러요!"); return; }
        
        hunger = Math.min(100, hunger + 25);
        energy = Math.min(100, energy + 5);
        coins += 5;
        gainExp(15);
        showMessage("냠냠! 맛있는 맘마! (+5G)");
        updateScreen();
        saveGame();
    }

    function play() {
        if (checkBlockedForAction()) return;
        if (hasPoop) { showMessage("더러워서 놀 수 없어요.."); return; }
        if (energy < 15) { showMessage("너무 피곤해요! 재워주세요."); return; }

        happiness = Math.min(100, happiness + 25);
        hunger = Math.max(0, hunger - 10);
        energy = Math.max(0, energy - 15);
        coins += 10;
        gainExp(20);
        
        elCharacter.style.transform = 'scale(1.25)';
        setTimeout(() => elCharacter.style.transform = 'scale(1)', 300);
        
        showMessage("신나게 놀았어요! (+10G) 😆");
        updateScreen();
        saveGame();
    }

    function sleep() {
        if (isDead) return;
        isSleeping = !isSleeping;
        if (isSleeping) {
            showMessage("쿨쿨 잠을 자는 중... 💤");
        } else {
            showMessage("일어났어요! 컨디션 최고!");
        }
        updateScreen();
        saveGame();
    }

    function openShop() { 
        if (isDead) { showMessage("사망한 상태입니다."); return; }
        const stopBtn = document.getElementById('shop-stop-btn');
        stopBtn.innerText = isGrowthFrozen ? "🛑 성장 멈춤 해제 (40G)" : "🛑 성장 멈춤 유지 (40G)";
        elShopMenu.style.display = 'flex'; 
    }
    
    function openSettings() { 
        elSettingMenu.style.display = 'flex'; 
    }

    function openEncyclopedia() { renderEncyclopediaUI(); elEncyclopediaMenu.style.display = 'flex'; }
    
    function closeOverlay() {
        elShopMenu.style.display = 'none';
        elEncyclopediaMenu.style.display = 'none';
        elSettingMenu.style.display = 'none';
        elBreedMenu.style.display = 'none';
        elFamilyMenu.style.display = 'none';
    }

    function buyItem(itemType, cost) {
        if (coins < cost) { showMessage("코인이 부족해요!"); return; }

        if (itemType.startsWith('level')) {
            if (isGrowthFrozen) {
                showMessage("🛑 성장 고정 중에는 별사탕을 먹을 수 없어요!");
                return;
            }
            if (level >= 20) {
                showMessage("이미 수명이 다했어요..."); return;
            }

            let amount = parseInt(itemType.replace('level', ''));
            coins -= cost;
            level += amount;
            exp = 0;
            
            closeOverlay();
            
            if (level >= 20) {
                updateScreen();
                die();
            } else {
                showMessage(`✨ 뾰로롱! 별사탕을 먹고 ${amount}레벨업 했어요! (LV.${level})`);
                updateScreen();
                saveGame();
            }
            return;
        }

        coins -= cost;
        if (itemType === 'snack') {
            hunger = Math.min(100, hunger + 35);
            showMessage("간식을 맛있게 먹었어요! 🍖");
        } else if (itemType === 'toy') {
            happiness = Math.min(100, happiness + 40);
            showMessage("장난감으로 신나게 놀았어요! 🎾");
        } else if (itemType === 'stop_growth') {
            isGrowthFrozen = !isGrowthFrozen;
            showMessage(isGrowthFrozen ? "🛑 성장이 고정되었습니다!" : "✨ 성장이 다시 진행됩니다!");
        }
        
        closeOverlay();
        updateScreen();
        saveGame();
    }
    
    function buyOppositeEgg(cost) {
        let opposite = (selectedGender === 'male') ? 'female' : 'male';
        
        if (!familyTree[activeGen]) familyTree[activeGen] = { male: null, female: null };
        if (familyTree[activeGen][opposite]) {
            showMessage(`이미 ${activeGen}세대에 ${opposite === 'male' ? '수컷' : '암컷'} 펫이 존재합니다!`);
            return;
        }
        if (coins < cost) { showMessage("코인이 부족해요!"); return; }
        
        let inputName = prompt(`새로운 ${activeGen}세대 ${opposite === 'male' ? '수컷' : '암컷'} 펫의 이름을 지어주세요!`, "둘째");
        if (inputName === null) return; 

        coins -= cost;
        
        familyTree[activeGen][opposite] = {
            petName: inputName.trim() || "둘째",
            currentAnimal: currentAnimal, 
            level: 1, exp: 0, hunger: 80, happiness: 80, energy: 100,
            isSleeping: false, hasPoop: false, isDead: false, isGrowthFrozen: false
        };
        
        closeOverlay();
        saveGame();
        showMessage(`🥚 ${inputName.trim() || "둘째"} 입양 완료! 👨‍👩‍👧 가족 버튼을 눌러보세요.`);
    }

    function breed() {
        if (checkBlockedForAction()) return;
        
        if(!familyTree[activeGen]) familyTree[activeGen] = { male:null, female:null };
        familyTree[activeGen][selectedGender] = packPet();
        
        let m = familyTree[activeGen].male;
        let f = familyTree[activeGen].female;

        if (!m || !f || m.isDead || f.isDead) {
            showMessage("현재 세대의 수컷과 암컷이 모두 살아있어야 교배할 수 있어요!");
            return;
        }
        
        if (m.level < 10 || f.level < 10) { 
            showMessage("두 펫 모두 어른(LV.10 이상)이 되어야 교배할 수 있어요! 🚫"); 
            return; 
        }
        
        elBreedMenu.style.display = 'flex';
    }

    function confirmBreed(gender) {
        let nextGen = Math.max(...Object.keys(familyTree).map(Number)) + 1;

        let inputName = prompt(`새로 태어난 ${nextGen}세대 펫의 이름을 지어주세요!`, `${nextGen}세`);
        if (inputName === null) return; 

        let childAnimal = currentAnimal; 
        
        if(!familyTree[nextGen]) familyTree[nextGen] = { male: null, female: null };

        selectedGender = gender;
        activeGen = nextGen;
        
        petName = inputName.trim() || `${nextGen}세`;
        currentAnimal = childAnimal;
        level = 1;
        exp = 0;
        hunger = 80;
        happiness = 80;
        energy = 100;
        isSleeping = false;
        hasPoop = false;
        isDead = false;
        isGrowthFrozen = false;
        
        familyTree[activeGen][selectedGender] = packPet();
        
        closeOverlay();
        showMessage(`💖 교배 성공! ${activeGen}세대 ${petName} 탄생! 🥚`);
        updateScreen();
        saveGame();
    }

    function unlockEncyclopedia(animal, stageIdx) {
        if (!encyclopedia[animal]) encyclopedia[animal] = [false, false, false, false, false];
        encyclopedia[animal][stageIdx] = true;
        localStorage.setItem('tama_encyclopedia', JSON.stringify(encyclopedia));
    }

    function renderEncyclopediaUI() {
        const listEl = document.getElementById('encyclopedia-list');
        const statsEl = document.getElementById('encyclopedia-stats');
        listEl.innerHTML = '';

        let totalSlots = 20;
        let unlockedCount = 0;

        for (let type in animalStages) {
            let rowStr = `<b>[${animalNames[type]}]</b> `;
            for (let i = 0; i < 5; i++) {
                if (encyclopedia[type] && encyclopedia[type][i]) {
                    rowStr += animalStages[type][i] + " ";
                    unlockedCount++;
                } else {
                    rowStr += "❓ ";
                }
            }
            listEl.innerHTML += `<div>${rowStr}</div>`;
        }
        let percent = Math.floor((unlockedCount / totalSlots) * 100);
        statsEl.innerText = `전체 수집률: ${percent}% (${unlockedCount}/${totalSlots})`;
    }

    function gainExp(amount) {
        if (isDead || isGrowthFrozen) return;
        exp += amount;
        let requiredExp = level * 40;

        if (exp >= requiredExp) {
            exp = 0;
            level++;
            if (level >= 20) { die(); return; }
            showMessage(`✨ 레벨 업! LV. ${level} 도달!`);
            updateScreen();
        }
    }

    function die() {
        isDead = true;
        level = 20;
        elCharacter.innerText = "👻";
        showMessage(`☠️ ${petName}이(가) 수명을 다했습니다...`);
        
        if(!familyTree[activeGen]) familyTree[activeGen] = { male:null, female:null };
        familyTree[activeGen][selectedGender] = packPet();
        saveGame();
        
        let hasLiving = false;
        for(let gen in familyTree) {
            if (familyTree[gen].male && !familyTree[gen].male.isDead) hasLiving = true;
            if (familyTree[gen].female && !familyTree[gen].female.isDead) hasLiving = true;
        }

        if (!hasLiving) {
            clearInterval(gameLoop);
            setTimeout(() => { showMessage("모든 펫이 사망했습니다. 리셋을 해주세요."); }, 2000);
        } else {
            setTimeout(() => { showMessage("👨‍👩‍👧 가족 버튼을 눌러 다른 펫을 돌보세요!"); }, 2000);
        }
    }

    function gameTick() {
        if (isDead || !currentAnimal) return;

        let isNightTime = false;

        if (timeMode === 'fast') {
            timeSeconds += 2;
            if (timeSeconds % 16 === 0) {
                if (elScreen.classList.contains('day')) {
                    elScreen.classList.remove('day'); elScreen.classList.add('night');
                    elTimeBadge.innerText = '🌙 밤';
                } else {
                    elScreen.classList.remove('night'); elScreen.classList.add('day');
                    elTimeBadge.innerText = '☀️ 낮';
                }
            }
            isNightTime = elScreen.classList.contains('night');
        } else {
            const currentHour = new Date().getHours();
            if (currentHour >= 6 && currentHour < 18) {
                elScreen.classList.remove('night'); elScreen.classList.add('day');
                elTimeBadge.innerText = '☀️ 낮(현실)';
                isNightTime = false;
            } else {
                elScreen.classList.remove('day'); elScreen.classList.add('night');
                elTimeBadge.innerText = '🌙 밤(현실)';
                isNightTime = true;
            }
        }

        if (isNightTime && !isSleeping) {
            isSleeping = true;
            showMessage(`${petName}이(가) 잠에 듭니다... 🌙`);
        }

        if (isSleeping) {
            energy = Math.min(100, energy + 15);
            hunger = Math.max(0, hunger - 2);

            if (!isNightTime && energy >= 100) {
                isSleeping = false;
                showMessage(`${petName}이(가) 상쾌하게 일어났어요! ✨`);
            }
        } else {
            hunger = Math.max(0, hunger - 4);
            happiness = Math.max(0, happiness - 3);
            energy = Math.max(0, energy - 3);
        }
        updateScreen();
        saveGame();
    }

    function updateScreen() {
        if (!isDead && currentAnimal) {
            let spriteIdx = 0;
            if (!isGrowthFrozen) {
                if (level >= 15) spriteIdx = 4;
                else if (level >= 10) spriteIdx = 3;
                else if (level >= 5) spriteIdx = 2;
                else if (level >= 2) spriteIdx = 1;
                else spriteIdx = 0;
            } else {
                spriteIdx = 1;
            }

            if (isSleeping) {
                elCharacter.innerText = animalStages[currentAnimal][spriteIdx] + "💤";
            } else {
                elCharacter.innerText = animalStages[currentAnimal][spriteIdx];
            }
            unlockEncyclopedia(currentAnimal, spriteIdx);
        } else if (isDead) {
            elCharacter.innerText = "👻";
        }
        
        barHunger.style.width = hunger + '%';
        barHappy.style.width = happiness + '%';
        barEnergy.style.width = energy + '%';

        elNameBadge.innerText = petName;
        elLevelBadge.innerText = `[${activeGen}세] LV.${level}${isGrowthFrozen ? '(고정)' : ''}`;
        elGenderBadge.innerText = selectedGender === 'male' ? '♂️' : '♀️';
        elGenderBadge.style.color = selectedGender === 'male' ? '#0984e3' : '#e84393';
        elCoinBadge.innerText = `💰 ${coins}G`;
        elPoop.style.display = hasPoop ? 'block' : 'none';
    }

    function checkBlockedForAction() {
        if (isDead) {
            showMessage("사망한 상태입니다.");
            return true;
        }
        if (isSleeping) {
            showMessage("잠자는 중에는 행동할 수 없어요!");
            return true;
        }
        return false;
    }

    function saveGame() {
        try {
            if (currentAnimal) {
                if(!familyTree[activeGen]) familyTree[activeGen] = { male: null, female: null };
                familyTree[activeGen][selectedGender] = packPet();
            }
            const saveData = { familyTree, activeGen, selectedGender, coins, timeMode, deviceSize };
            localStorage.setItem('tama_multi_save', JSON.stringify(saveData));
        } catch(e) {
            console.error(e);
        }
    }

    function showMessage(text) {
        elMessage.innerText = text;
        setTimeout(() => {
            if (elMessage.innerText === text) elMessage.innerText = "";
        }, 3500);
    }
</script>
</body>
</html>
