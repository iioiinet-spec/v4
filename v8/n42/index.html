<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>꼬부기 키우기</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Jua', 'Comic Sans MS', sans-serif, system-ui;
        }
        body {
            background: linear-gradient(135deg, #e0f7fa, #e8f5e9);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .game-container {
            background-color: #ffffff;
            width: 420px;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 25px;
            text-align: center;
            border: 5px solid #b2ebf2;
            position: relative;
            overflow: hidden;
        }
        h1 {
            color: #0277bd;
            font-size: 28px;
            margin-top: 0;
            margin-bottom: 15px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }
        .status-header {
            background-color: #f1f8e9;
            padding: 10px 15px;
            border-radius: 15px;
            margin-bottom: 15px;
            border: 2px dashed #c8e6c9;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            color: #33691e;
            margin-bottom: 8px;
        }
        .exp-bar-container {
            background-color: #dcedc8;
            border-radius: 10px;
            height: 14px;
            width: 100%;
            overflow: hidden;
            border: 1px solid #c5e1a5;
        }
        .exp-bar-fill {
            background-color: #7cb342;
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }
        .pet-stage-name {
            font-size: 22px;
            color: #ff8f00;
            margin: 5px 0;
            font-weight: bold;
        }
        .pet-screen {
            position: relative;
            height: 240px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 15px 0;
            background: radial-gradient(circle, #e1f5fe 0%, #b3e5fc 100%);
            border-radius: 20px;
            border: 3px solid #81d4fa;
            overflow: hidden;
        }
        .pet-img {
            width: 140px;
            height: 140px;
            object-fit: contain;
            animation: bounce 2s infinite ease-in-out;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.15));
            transition: transform 0.3s;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
        @keyframes evolveAnimation {
            0% { transform: scale(1) rotate(0deg); filter: brightness(1); }
            25% { transform: scale(1.4) rotate(-15deg); filter: brightness(2) drop-shadow(0 0 25px gold); }
            50% { transform: scale(0.6) rotate(15deg); filter: brightness(0.2); }
            75% { transform: scale(1.5) rotate(-10deg); filter: brightness(2.5) drop-shadow(0 0 35px #00ffff); }
            100% { transform: scale(1) rotate(0deg); filter: brightness(1); }
        }
        .evolving {
            animation: evolveAnimation 1.5s ease-in-out;
        }
        .speech-bubble {
            position: absolute;
            top: 15px;
            background: #ffffff;
            border: 2px solid #81d4fa;
            border-radius: 15px;
            padding: 8px 12px;
            font-size: 14px;
            color: #01579b;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            max-width: 80%;
            word-break: break-all;
            z-index: 10;
        }
        .speech-bubble:after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            width: 0;
            height: 0;
            border: 8px solid transparent;
            border-top-color: #81d4fa;
            border-bottom: 0;
            margin-left: -8px;
        }
        .stats-container {
            background-color: #fffde7;
            padding: 12px;
            border-radius: 15px;
            margin-bottom: 15px;
            border: 2px solid #fff9c4;
        }
        .stat-item {
            margin-bottom: 8px;
        }
        .stat-item:last-child {
            margin-bottom: 0;
        }
        .stat-info {
            display: flex;
            justify-content: space-between;
            font-size: 15px;
            font-weight: bold;
            color: #4e342e;
            margin-bottom: 3px;
        }
        .stat-bar-container {
            background-color: #e0e0e0;
            border-radius: 8px;
            height: 12px;
            width: 100%;
            overflow: hidden;
        }
        .stat-bar-fill {
            height: 100%;
            width: 70%;
            transition: width 0.3s, background-color 0.3s;
        }
        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .btn {
            background-color: #fff;
            border: 2px solid;
            border-radius: 15px;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.1s ease;
            box-shadow: 0 4px 0 rgba(0,0,0,0.05);
        }
        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 rgba(0,0,0,0.05);
        }
        .btn-feed { border-color: #ffccbc; color: #d84315; background-color: #fbe9e7; }
        .btn-play { border-color: #fff59d; color: #f57f17; background-color: #fffde7; }
        .btn-wash { border-color: #b3e5fc; color: #0277bd; background-color: #e1f5fe; }
        .btn-cure { 
            grid-column: span 2; 
            border-color: #ff8a80; 
            color: #c62828; 
            background-color: #ffebee; 
            display: none; 
        }
    </style>
</head>
<body>

<div class="game-container">
    <h1>🐢 꼬부기 키우기 🐢</h1>

    <!-- 상단 상태 (레벨, 경험치, 단계 이름) -->
    <div class="status-header">
        <div class="info-row">
            <span id="level-display">Lv. 1</span>
            <span id="mood-emoji">😊</span>
        </div>
        <div class="pet-stage-name" id="stage-name">꼬부기</div>
        <div class="exp-bar-container">
            <div class="exp-bar-fill" id="exp-bar"></div>
        </div>
    </div>

    <!-- 펫 화면 -->
    <div class="pet-screen">
        <div class="speech-bubble" id="speech-bubble">안녕! 반가워! 🌊</div>
        <img id="pet-image" class="pet-img" src="https://i.namu.wiki/i/lgO1gjKeUjPRMacZZmCOya-Dd8Pqf5NZjO43we5ezlY8dstmhLdqOGvKtFosMjGMwUdBYLRZBIUv8_1hCHWYkZp8BHvrBnXWZYtSyYR-6mOecgBDSH3WSDFCVmp2g-i28GJk02oFnNkvQGi1MNamFw.webp" alt="포켓몬">
    </div>

    <!-- 스탯 바 -->
    <div class="stats-container">
        <div class="stat-item">
            <div class="stat-info">
                <span>🍖 포만감</span>
                <span id="hunger-text">70/100</span>
            </div>
            <div class="stat-bar-container">
                <div class="stat-bar-fill" id="hunger-bar" style="width: 70%;"></div>
            </div>
        </div>
        <div class="stat-item">
            <div class="stat-info">
                <span>💖 행복</span>
                <span id="happy-text">70/100</span>
            </div>
            <div class="stat-bar-container">
                <div class="stat-bar-fill" id="happy-bar" style="width: 70%;"></div>
            </div>
        </div>
        <div class="stat-item">
            <div class="stat-info">
                <span>✨ 청결</span>
                <span id="clean-text">70/100</span>
            </div>
            <div class="stat-bar-container">
                <div class="stat-bar-fill" id="clean-bar" style="width: 70%;"></div>
            </div>
        </div>
        <div class="stat-item" style="margin-top: 8px;">
            <div class="stat-info">
                <span>⚡ 에너지</span>
                <span id="energy-text">70/100</span>
            </div>
            <div class="stat-bar-container">
                <div class="stat-bar-fill" id="energy-bar" style="width: 70%; background-color: #ab47bc;"></div>
            </div>
        </div>
    </div>

    <!-- 상호작용 버튼 -->
    <div class="buttons-grid">
        <button class="btn btn-feed" onclick="feedPet()">🍙 밥 주기</button>
        <button class="btn btn-play" onclick="playPet()">⚽ 놀아주기</button>
        <button class="btn btn-wash" onclick="washPet()">🚿 씻기기</button>
        <button class="btn btn-cure" id="cure-btn" onclick="curePet()">🤒 치료하기</button>
    </div>
</div>

<script>
    // 게임 스탯 상태
    let stats = {
        hunger: 70,
        happy: 70,
        clean: 70,
        energy: 70,
        exp: 0,
        level: 1,
        isSick: false,
        isEvolving: false
    };

    // 진화 단계별 데이터
    const stages = [
        {
            levelThreshold: 1,
            name: "꼬부기",
            img: "https://i.namu.wiki/i/lgO1gjKeUjPRMacZZmCOya-Dd8Pqf5NZjO43we5ezlY8dstmhLdqOGvKtFosMjGMwUdBYLRZBIUv8_1hCHWYkZp8BHvrBnXWZYtSyYR-6mOecgBDSH3WSDFCVmp2g-i28GJk02oFnNkvQGi1MNamFw.webp"
        },
        {
            levelThreshold: 16,
            name: "어니부기",
            img: "https://i.namu.wiki/i/tj-U7higMqVVRBX7qOHjgKgKHhgUfFmAzhv2TRxgJ5D7ldl6jcMQIPTyDUYgOc9zvhObM_QHEPlmai4duiqh-XFU0wPcDvzuKGtU0HVil-mJ0Hzi1fTLv6Ppuho8pIx78k-sEHwJ5vXvnrr6z1iIVQ.webp"
        },
        {
            levelThreshold: 36,
            name: "거북왕",
            img: "https://i.namu.wiki/i/u7KxIVMXVLBh14RtHh4ZH0bwPISrIfsF_3xZWuCERlGuo7GMU21BoBk_j_yXZTyoIzaPlpxuPp_HlE59EbV4YzuQ93kvIGG0y_PsQvuaIVnNlVmmIi4XEDnPAxauA5hlzYpf22sJ2s0g526k7hewPA.webp"
        }
    ];

    // 요소 참조
    const petImage = document.getElementById('pet-image');
    const speechBubble = document.getElementById('speech-bubble');
    const levelDisplay = document.getElementById('level-display');
    const stageName = document.getElementById('stage-name');
    const moodEmoji = document.getElementById('mood-emoji');
    const expBar = document.getElementById('exp-bar');
    
    const hungerBar = document.getElementById('hunger-bar');
    const hungerText = document.getElementById('hunger-text');
    const happyBar = document.getElementById('happy-bar');
    const happyText = document.getElementById('happy-text');
    const cleanBar = document.getElementById('clean-bar');
    const cleanText = document.getElementById('clean-text');
    const energyBar = document.getElementById('energy-bar');
    const energyText = document.getElementById('energy-text');
    const cureBtn = document.getElementById('cure-btn');

    // 게이지 색상 결정 (많으면 초록, 적으면 빨강)
    function getBarColor(value) {
        if (value > 50) return '#66bb6a';
        if (value > 25) return '#ffa726';
        return '#ef5350';
    }

    // 말풍선 대사 출력
    function showMessage(text) {
        speechBubble.textContent = text;
    }

    // 화면 갱신 함수
    function updateUI() {
        hungerBar.style.width = stats.hunger + '%';
        hungerBar.style.backgroundColor = getBarColor(stats.hunger);
        hungerText.textContent = `${Math.floor(stats.hunger)}/100`;

        happyBar.style.width = stats.happy + '%';
        happyBar.style.backgroundColor = getBarColor(stats.happy);
        happyText.textContent = `${Math.floor(stats.happy)}/100`;

        cleanBar.style.width = stats.clean + '%';
        cleanBar.style.backgroundColor = getBarColor(stats.clean);
        cleanText.textContent = `${Math.floor(stats.clean)}/100`;

        energyBar.style.width = stats.energy + '%';
        energyBar.style.backgroundColor = getBarColor(stats.energy);
        energyText.textContent = `${Math.floor(stats.energy)}/100`;

        levelDisplay.textContent = `Lv. ${stats.level}`;
        let expPercent = (stats.exp / 80) * 100;
        expBar.style.width = `${Math.min(expPercent, 100)}%`;

        let currentStage = stages[0];
        if (stats.level >= 36) currentStage = stages[2];
        else if (stats.level >= 16) currentStage = stages[1];

        stageName.textContent = currentStage.name;
        
        if (stats.isSick) {
            moodEmoji.textContent = '🤒';
            cureBtn.style.display = 'block';
        } else {
            cureBtn.style.display = 'none';
            let avgStat = (stats.hunger + stats.happy + stats.clean + stats.energy) / 4;
            if (avgStat >= 60) moodEmoji.textContent = '😊';
            else if (avgStat >= 30) moodEmoji.textContent = '😐';
            else moodEmoji.textContent = '😢';
        }
    }

    // 경험치 증가 및 진화 체크
    function addExp(amount) {
        if (stats.isSick || stats.isEvolving) return;

        stats.exp += amount;
        if (stats.exp >= 80) {
            stats.exp -= 80;
            let oldLevel = stats.level;
            stats.level++;
            checkEvolution(oldLevel, stats.level);
        }
        updateUI();
    }

    // 진화 처리 함수 (멋진 연출 효과 포함)
    function checkEvolution(oldLv, newLv) {
        let evolved = false;
        let message = "";
        let targetImg = "";

        if (oldLv < 16 && newLv >= 16) {
            evolved = true;
            message = "꼬부기(이)가 진화했다! ✨";
            targetImg = stages[1].img;
        } else if (oldLv < 36 && newLv >= 36) {
            evolved = true;
            message = "어니부기(이)가 진화했다! 🚀";
            targetImg = stages[2].img;
        }

        if (evolved) {
            stats.isEvolving = true;
            petImage.classList.add('evolving');
            showMessage("빛이 나고 있어요...! ✨");

            setTimeout(() => {
                petImage.src = targetImg;
            }, 750); // 애니메이션 중간 지점에 이미지 변경

            setTimeout(() => {
                petImage.classList.remove('evolving');
                stats.isEvolving = false;
                showMessage(message);
            }, 1500);
        }
    }

    // [밥 주기] 버튼
    function feedPet() {
        if (stats.isSick || stats.isEvolving) {
            showMessage("지금은 밥을 먹을 수 없어요... 🤒");
            return;
        }
        let happyBonus = stats.energy > 0 ? 8 : 10;
        stats.hunger = Math.min(100, stats.hunger + 40);
        stats.happy = Math.min(100, stats.happy + happyBonus);
        showMessage("냠냠! 맛있게 잘 먹어요! 🍙");
        addExp(15);
    }

    // [놀아주기] 버튼
    function playPet() {
        if (stats.isSick || stats.isEvolving) {
            showMessage("지금은 놀 수 없어요... 🤒");
            return;
        }
        stats.happy = Math.min(100, stats.happy + 50);
        stats.hunger = Math.max(0, stats.hunger - 20);
        stats.energy = Math.max(0, stats.energy - 25);
        stats.clean = Math.max(0, stats.clean - 20);
        showMessage("신나게 물총 놀이를 했어요! 💦");
        addExp(15);
    }

    // [씻기기] 버튼
    function washPet() {
        if (stats.isSick || stats.isEvolving) {
            showMessage("지금은 씻을 수 없어요... 🤒");
            return;
        }
        stats.clean = Math.min(100, stats.clean + 65);
        stats.happy = Math.max(0, stats.happy - 35);
        showMessage("반짝반짝 깨끗해졌어요! ✨");
        addExp(15);
    }

    // [치료하기] 버튼
    function curePet() {
        stats.isSick = false;
        stats.hunger = 40;
        stats.happy = 40;
        stats.clean = 40;
        stats.energy = 40;
        showMessage("건강을 되찾았어요! 힘내자 💙");
        updateUI();
    }

    // 3초마다 모든 게이지 감소 루프
    setInterval(() => {
        if (!stats.isSick && !stats.isEvolving) {
            stats.hunger = Math.max(0, stats.hunger - 3);
            stats.happy = Math.max(0, stats.happy - 3);
            stats.clean = Math.max(0, stats.clean - 3);
            stats.energy = Math.max(0, stats.energy - 3);

            if (stats.hunger === 0 || stats.happy === 0 || stats.clean === 0 || stats.energy === 0) {
                stats.isSick = true;
                showMessage("아이쿠! 관리가 소홀해서 아파요... 🤒");
            }
            updateUI();
        }
    }, 3000);

    // 최초 실행
    updateUI();
</script>

</body>
</html>
