<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>농장 & 업그레이드 타이쿤</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .main-wrapper {
            display: flex;
            gap: 20px;
        }
        .game-container, .dlc-container {
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            width: 340px;
            text-align: center;
        }
        .header-info {
            display: flex;
            justify-content: space-between;
            background: #e9ecef;
            padding: 8px 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 12px;
        }
        .slot-container {
            display: flex;
            gap: 5px;
            justify-content: center;
            margin-bottom: 15px;
        }
        .slot {
            flex: 1;
            padding: 8px 4px;
            border: 2px dashed #ccc;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            background: #fafafa;
        }
        .slot.active {
            border: 2px solid #4facfe;
            background: #e1f5fe;
            font-weight: bold;
        }
        .pet-avatar {
            font-size: 70px;
            margin: 10px 0;
        }
        .status-box {
            margin: 12px 0;
            text-align: left;
            background: #f8f9fa;
            padding: 12px;
            border-radius: 10px;
        }
        .status-item {
            margin-bottom: 6px;
            font-size: 12px;
            font-weight: bold;
        }
        .progress-bar {
            width: 100%;
            background: #e9ecef;
            border-radius: 5px;
            overflow: hidden;
            height: 8px;
            margin-top: 2px;
        }
        .progress-fill {
            height: 100%;
            width: 100%;
            transition: width 0.3s;
        }
        #hunger-fill { background-color: #ff6b6b; }
        #happy-fill { background-color: #ffd93d; }
        #energy-fill { background-color: #6bcbef; }
        
        .btn-group, .shop-group {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-top: 8px;
        }
        button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 6px;
            background: #4facfe;
            color: white;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #00f2fe; }
        .sell-btn { background: #28a745; }
        .sell-btn:hover { background: #218838; }

        .dlc-container h3 { margin-top: 0; color: #333; font-size: 16px; }
        .dlc-item {
            background: #f1f3f5;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            text-align: left;
            font-size: 12px;
        }
        .dlc-item button {
            margin-top: 5px;
            width: 100%;
            background: #ff9800;
        }
        .dlc-item button:hover { background: #f57c00; }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <!-- 왼쪽: 메인 게임 화면 -->
        <div class="game-container">
            <h2>🏡 농장 타이쿤</h2>
            
            <div class="header-info">
                <span id="gold-text">💰 300 Gold</span>
                <span id="pet-info">닭 (수컷)</span>
            </div>

            <div class="slot-container" id="slot-container"></div>

            <div id="name-level-text" style="font-weight: bold; color: #555; margin-bottom: 5px; font-size: 13px;">
                이름: 삐요 | Lv. 1 (경험치: 0/100)
            </div>
            
            <div class="pet-avatar" id="pet">🥚</div>

            <div class="status-box">
                <div class="status-item">
                    🍖 배고픔
                    <div class="progress-bar"><div class="progress-fill" id="hunger-fill" style="width: 80%;"></div></div>
                </div>
                <div class="status-item">
                    ⭐ 행복도
                    <div class="progress-bar"><div class="progress-fill" id="happy-fill" style="width: 80%;"></div></div>
                </div>
                <div class="status-item">
                    💤 에너지
                    <div class="progress-bar"><div class="progress-fill" id="energy-fill" style="width: 80%;"></div></div>
                </div>
            </div>

            <div class="btn-group">
                <button onclick="feedPet()">밥 주기</button>
                <button onclick="playWithPet()">놀아주기</button>
                <button onclick="sleepPet()">재우기</button>
            </div>

            <div class="shop-group">
                <button class="sell-btn" onclick="sellPet()">동물 팔기</button>
                <button onclick="openShop()">동물 사기</button>
            </div>
        </div>

        <!-- 오른쪽: DLC 및 효율 업그레이드 상점 -->
        <div class="dlc-container">
            <h3>🎁 DLC & 효율 상점</h3>
            
            <div class="dlc-item">
                <b>🥩 육식 동물 DLC</b><br>
                <span style="font-size: 10px; color: #666;">늑대, 호랑이 해제</span><br>
                <button onclick="buyDLC('carnivore', 500)">구매 (500G)</button>
            </div>

            <div class="dlc-item">
                <b>🌵 사막 동물 DLC</b><br>
                <span style="font-size: 10px; color: #666;">낙타, 샌드웜 해제</span><br>
                <button onclick="buyDLC('desert', 300)">구매 (300G)</button>
            </div>

            <div class="dlc-item">
                <b>🪵 자동 먹이통 (효율 +)</b><br>
                <span style="font-size: 10px; color: #666;">밥 주기 효과 2배 증가</span><br>
                <button onclick="buyUpgrade('feed', 200)">업그레이드 (200G)</button>
            </div>

            <div class="dlc-item">
                <b>🪀 자동 장난감 (효율 +)</b><br>
                <span style="font-size: 10px; color: #666;">놀아주기 효과 2배 증가</span><br>
                <button onclick="buyUpgrade('play', 200)">업그레이드 (200G)</button>
            </div>
        </div>
    </div>

    <script>
        let game = {
            gold: 300,
            currentSlot: 0,
            upgrades: { feed: false, play: false },
            dlc: { carnivore: false, desert: false },
            slots: [
                { type: "chicken", name: "삐요", gender: "수컷", level: 1, exp: 0, maxExp: 100, hunger: 80, happy: 80, energy: 80, isAlive: true }
            ]
        };

        const petEl = document.getElementById('pet');
        const goldText = document.getElementById('gold-text');
        const petInfo = document.getElementById('pet-info');
        const nameLevelText = document.getElementById('name-level-text');
        const hungerFill = document.getElementById('hunger-fill');
        const happyFill = document.getElementById('happy-fill');
        const energyFill = document.getElementById('energy-fill');
        const slotContainer = document.getElementById('slot-container');

        function renderSlots() {
            slotContainer.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                let div = document.createElement('div');
                div.className = `slot ${game.currentSlot === i ? 'active' : ''}`;
                if (game.slots[i]) {
                    let p = game.slots[i];
                    div.innerHTML = `<b>슬롯 ${i+1}</b><br>${p.name} (Lv.${p.level})`;
                } else {
                    div.innerHTML = `<b>슬롯 ${i+1}</b><br>비어있음`;
                }
                div.onclick = () => { if(game.slots[i]) { game.currentSlot = i; updateUI(); } };
                slotContainer.appendChild(div);
            }
        }

        function updateUI() {
            renderSlots();
            goldText.innerText = `💰 ${game.gold} Gold`;

            let pet = game.slots[game.currentSlot];
            if (!pet || !pet.isAlive) return;

            let names = { chicken: '닭', pig: '돼지', cow: '소', wolf: '늑대', tiger: '호랑이', camel: '낙타', worm: '샌드웜' };
            petInfo.innerText = `${names[pet.type] || pet.type} (${pet.gender})`;
            nameLevelText.innerText = `이름: ${pet.name} | Lv. ${pet.level} (경험치: ${pet.exp}/${pet.maxExp})`;

            hungerFill.style.width = pet.hunger + '%';
            happyFill.style.width = pet.happy + '%';
            energyFill.style.width = pet.energy + '%';

            // 아바타 지정
            if (pet.type === 'chicken') petEl.innerText = pet.level >= 3 ? '🐓' : pet.level === 2 ? '🐥' : '🥚';
            else if (pet.type === 'pig') petEl.innerText = pet.level >= 3 ? '🐖' : pet.level === 2 ? '🐷' : '🐽';
            else if (pet.type === 'cow') petEl.innerText = pet.level >= 3 ? '🐂' : pet.level === 2 ? '🐄' : '🐮';
            else if (pet.type === 'wolf') petEl.innerText = '🐺';
            else if (pet.type === 'tiger') petEl.innerText = '🐅';
            else if (pet.type === 'camel') petEl.innerText = '🐪';
            else if (pet.type === 'worm') petEl.innerText = '🐛';
        }

        function addExp(amount) {
            let pet = game.slots[game.currentSlot];
            pet.exp += amount;
            if (pet.exp >= pet.maxExp) {
                pet.level += 1;
                pet.exp = 0;
                pet.maxExp = Math.floor(pet.maxExp * 1.4);
                alert(`🎉 레벨업! ${pet.name}이(가) Lv.${pet.level}이 되었습니다!`);
            }
            updateUI();
        }

        function feedPet() {
            let pet = game.slots[game.currentSlot];
            if (!pet.isAlive) return;
            let boost = game.upgrades.feed ? 2 : 1;
            pet.hunger = Math.min(100, pet.hunger + (25 * boost));
            addExp(20);
        }

        function playWithPet() {
            let pet = game.slots[game.currentSlot];
            if (!pet.isAlive) return;
            if (pet.energy < 15) {
                alert('동물이 너무 피곤해합니다! 재워주세요.');
                return;
            }
            let boost = game.upgrades.play ? 2 : 1;
            pet.happy = Math.min(100, pet.happy + (20 * boost));
            pet.energy = Math.max(0, pet.energy - 15);
            addExp(30);
        }

        function sleepPet() {
            let pet = game.slots[game.currentSlot];
            if (!pet.isAlive) return;
            pet.energy = Math.min(100, pet.energy + 35);
            pet.hunger = Math.max(0, pet.hunger - 10);
            addExp(10);
        }

        function sellPet() {
            let pet = game.slots[game.currentSlot];
            let price = 50 + (pet.level * 40) + (pet.happy / 2);
            game.gold += Math.floor(price);
            alert(`💰 ${pet.name}을(를) ${Math.floor(price)} 골드에 판매했습니다!`);
            game.slots.splice(game.currentSlot, 1);
            game.currentSlot = Math.max(0, game.currentSlot - 1);
            if (game.slots.length === 0) {
                game.slots.push({ type: "chicken", name: "꼬꼬", gender: "수컷", level: 1, exp: 0, maxExp: 100, hunger: 80, happy: 80, energy: 80, isAlive: true });
            }
            updateUI();
        }

        // 동물 구매 상점 (DLC 동물 연동 완료)
        function openShop() {
            if (game.slots.length >= 3) {
                alert("슬롯이 꽉 찼습니다! (최대 3마리)");
                return;
            }

            let shopList = "기본 동물:\n1. 닭 (50G)\n2. 돼지 (150G)\n3. 소 (300G)";
            if (game.dlc.carnivore) shopList += "\n\n육식 동물 DLC:\n4. 늑대 (400G)\n5. 호랑이 (600G)";
            if (game.dlc.desert) shopList += "\n\n사막 동물 DLC:\n6. 낙타 (350G)\n7. 샌드웜 (800G)";

            let choice = prompt(`어떤 동물을 구매하시겠습니까?\n\n${shopList}`, "1");
            
            let type = "", cost = 0;
            if (choice === "1") { type = "chicken"; cost = 50; }
            else if (choice === "2") { type = "pig"; cost = 150; }
            else if (choice === "3") { type = "cow"; cost = 300; }
            else if (choice === "4" && game.dlc.carnivore) { type = "wolf"; cost = 400; }
            else if (choice === "5" && game.dlc.carnivore) { type = "tiger"; cost = 600; }
            else if (choice === "6" && game.dlc.desert) { type = "camel"; cost = 350; }
            else if (choice === "7" && game.dlc.desert) { type = "worm"; cost = 800; }
            else {
                alert("잘못된 선택이거나 해제되지 않은 DLC 동물입니다.");
                return;
            }

            if (game.gold >= cost) {
                game.gold -= cost;
                let name = prompt("동물의 이름을 지어주세요:", "동물");
                let gender = Math.random() < 0.5 ? "수컷" : "암컷";
                game.slots.push({ type: type, name: name || "동물", gender: gender, level: 1, exp: 0, maxExp: 100, hunger: 80, happy: 80, energy: 80, isAlive: true });
                game.currentSlot = game.slots.length - 1;
                updateUI();
            } else {
                alert("골드가 부족합니다!");
            }
        }

        function buyDLC(dlcName, price) {
            if (game.dlc[dlcName]) {
                alert("이미 구매한 DLC입니다!");
                return;
            }
            if (game.gold >= price) {
                game.gold -= price;
                game.dlc[dlcName] = true;
                alert(`🎁 DLC 활성화 성공! 상점에서 새로운 동물들을 구매할 수 있습니다.`);
            } else {
                alert("골드가 부족합니다!");
            }
        }

        function buyUpgrade(type, price) {
            if (game.upgrades[type]) {
                alert("이미 구매한 업그레이드입니다!");
                return;
            }
            if (game.gold >= price) {
                game.gold -= price;
                game.upgrades[type] = true;
                alert(`⚡ 효율 업그레이드 완료!`);
            } else {
                alert("골드가 부족합니다!");
            }
        }

        setInterval(() => {
            game.slots.forEach(pet => {
                if (!pet.isAlive) return;
                pet.hunger = Math.max(0, pet.hunger - 1);
                pet.happy = Math.max(0, pet.happy - 1);
                pet.energy = Math.max(0, pet.energy - 1);
                pet.exp += 2;
                if (pet.exp >= pet.maxExp) {
                    pet.level += 1;
                    pet.exp = 0;
                    pet.maxExp = Math.floor(pet.maxExp * 1.4);
                }
                if (pet.hunger === 0 || pet.energy === 0) {
                    pet.isAlive = false;
                    alert(`💀 방치되어 ${pet.name}이(가) 무지개 다리를 건넜습니다...`);
                }
            });
            updateUI();
        }, 3000);

        updateUI();
    </script>

</body>
</html>
