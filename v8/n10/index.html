<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주술회전: 영역전개 키우기</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Maplestory', 'Jalnan', 'Malgun Gothic', sans-serif;
        }

        body {
            background-color: #1a1528;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .phone-container {
            width: 100%;
            max-width: 420px;
            height: 100%;
            max-height: 800px;
            background: #110f18;
            border-radius: 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 25px;
            position: relative;
            overflow: hidden;
            border: 3px solid #3d3456;
            transition: border-color 0.4s ease;
        }

        .phone-container.domain-active {
            border-color: #ff3838;
            box-shadow: 0 0 30px rgba(255, 56, 56, 0.5);
        }

        .header {
            text-align: center;
            z-index: 10;
        }

        .title {
            font-size: 20px;
            color: #d1c9e8;
            margin-bottom: 5px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .level-info {
            font-size: 15px;
            color: #ff6b81;
            font-weight: bold;
        }

        .stats-container {
            background: #1c1828;
            padding: 12px 15px;
            border-radius: 15px;
            border: 2px solid #2d2640;
            z-index: 10;
        }

        .stat-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
            color: #b2a8d3;
        }

        .stat-row:last-child {
            margin-bottom: 0;
        }

        .bar-bg {
            flex-grow: 1;
            height: 12px;
            background: #2a223f;
            border-radius: 6px;
            margin-left: 10px;
            overflow: hidden;
            position: relative;
        }

        .bar-fill {
            height: 100%;
            width: 0%;
            border-radius: 6px;
            transition: width 0.3s ease, background-color 0.3s ease;
        }

        .character-screen {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        canvas {
            display: block;
            border-radius: 20px;
            background: radial-gradient(circle, #251d38 0%, #110f18 80%);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
            cursor: pointer;
        }

        .character-name {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #f1f0f6;
            background: #251d38;
            padding: 6px 18px;
            border-radius: 20px;
            border: 2px solid #4a3e6b;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .domain-text-overlay {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            font-size: 24px;
            font-weight: 900;
            color: #fff;
            text-align: center;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000, 0 0 30px #000;
            transition: all 0.3s ease;
            width: 90%;
        }

        .domain-text-overlay.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.1);
        }

        .actions {
            display: flex;
            gap: 15px;
            z-index: 10;
        }

        .btn {
            flex: 1;
            background: linear-gradient(135deg, #e84118, #c23616);
            color: white;
            border: none;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 6px 0 #8c1404;
            transition: all 0.1s ease;
            letter-spacing: 1px;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #8c1404;
        }

        .modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #1c1828;
            border: 3px solid #ff6b81;
            padding: 30px;
            border-radius: 25px;
            text-align: center;
            width: 85%;
            box-shadow: 0 10px 30px rgba(255,107,129,0.3);
            animation: pop-up 0.3s ease;
        }

        @keyframes pop-up {
            0% { transform: scale(0.8); }
            100% { transform: scale(1); }
        }

        .modal-content h2 {
            color: #ff6b81;
            font-size: 22px;
            margin-bottom: 10px;
        }

        .modal-content p {
            color: #d1c9e8;
            font-size: 15px;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .modal-btn {
            background: #7158e2;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 0 #3b318c;
        }
    </style>
</head>
<body>

    <div class="phone-container" id="phoneContainer">
        <div class="header">
            <div class="title">⚡ 주술회전: 영역전개 ⚡</div>
            <div class="level-info" id="levelInfo">STAGE 1 : 메구미</div>
        </div>

        <div class="stats-container">
            <div class="stat-row">
                <span>주력</span>
                <div class="bar-bg">
                    <div class="bar-fill" id="juPowerBar"></div>
                </div>
                <span id="juPowerText" style="width: 55px; text-align: right;">0/900</span>
            </div>
            <div class="stat-row">
                <span>체력</span>
                <div class="bar-bg">
                    <div class="bar-fill" id="hpBar"></div>
                </div>
                <span id="hpText" style="width: 55px; text-align: right;">0/900</span>
            </div>
        </div>

        <div class="character-screen">
            <div class="domain-text-overlay" id="domainText">영역전개!</div>
            <canvas id="gameCanvas" width="280" height="280"></canvas>
            <div class="character-name" id="characterName">후시구로 메구미</div>
        </div>

        <div class="actions">
            <button class="btn" id="fightBtn">⚔️ 싸우기 & 영역전개</button>
        </div>
    </div>

    <div class="modal" id="evolutionModal">
        <div class="modal-content">
            <h2 id="modalTitle">단계 상승!</h2>
            <p id="modalDesc">주술사가 진화했습니다!</p>
            <button class="modal-btn" id="modalCloseBtn">확인</button>
        </div>
    </div>

    <script>
        // 죠고 영역전개: 개관철위산 반영
        const stages = [
            { level: 1, name: "후시구로 메구미", color: "#32ff7e", domain: "감합암예정 (嵌合暗翳庭)", type: "megumi" },
            { level: 2, name: "죠고", color: "#ff4d4d", domain: "개관철위산 (開棺鉄囲山)", type: "jogo" },
            { level: 3, name: "다곤", color: "#00d2d3", domain: "탕온편성 (盪媼平線)", type: "dagon" },
            { level: 4, name: "마히토", color: "#ff9f43", domain: "자폐원돈과 (自閉円頓裏)", type: "mahito" },
            { level: 5, name: "옷코츠 유타", color: "#54a0ff", domain: "진안상애 (真贋相愛)", type: "yuta" },
            { level: 6, name: "히구루마 히로미", color: "#feca57", domain: "주주사멸 (誅伏誅戮)", type: "higuruma" },
            { level: 7, name: "켄자쿠", color: "#a55eea", domain: "태장편야 (胎蔵遍野)", type: "kenjaku" },
            { level: 8, name: "고죠 사토루", color: "#00d8d6", domain: "무량공처 (無量空処)", type: "gojo" },
            { level: 9, name: "료멘 스쿠나", color: "#ff3838", domain: "복마어주자 (伏魔御廚子)", type: "sukuna" }
        ];

        let juPower = 0;
        let hp = 0;
        let currentStageIndex = 0;
        let isDomainActive = false;
        let animTick = 0;

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const phoneContainer = document.getElementById('phoneContainer');
        const domainText = document.getElementById('domainText');
        
        const juPowerBar = document.getElementById('juPowerBar');
        const juPowerText = document.getElementById('juPowerText');
        const hpBar = document.getElementById('hpBar');
        const hpText = document.getElementById('hpText');
        const characterName = document.getElementById('characterName');
        const levelInfo = document.getElementById('levelInfo');
        const fightBtn = document.getElementById('fightBtn');
        
        const evolutionModal = document.getElementById('evolutionModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalDesc = document.getElementById('modalDesc');
        const modalCloseBtn = document.getElementById('modalCloseBtn');

        function getBarColor(value) {
            const p = value / 900;
            if (p < 0.3) return '#ff4d4d';
            if (p < 0.7) return '#feca57';
            return '#1dd1a1';
        }

        function drawCharacter() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            animTick += 0.05;

            const stageObj = stages[currentStageIndex];
            const bounceY = Math.sin(animTick * 2) * 6;

            if (isDomainActive) {
                ctx.fillStyle = "rgba(255, 0, 0, 0.15)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.strokeStyle = stageObj.color;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(140, 140 + bounceY, 90 + Math.sin(animTick * 5) * 10, 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.save();
            ctx.translate(140, 140 + bounceY);

            switch(stageObj.type) {
                case 'megumi':
                    ctx.fillStyle = "#2d3436";
                    ctx.beginPath(); ctx.arc(0, -10, 35, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = "#0984e3";
                    ctx.fillRect(-25, 20, 50, 45);
                    break;
                case 'jogo':
                    ctx.fillStyle = "#e17055";
                    ctx.beginPath(); ctx.arc(0, -5, 42, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = "#fab1a0";
                    ctx.beginPath(); ctx.ellipse(0, -35, 20, 10, 0, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = "#ff7675";
                    ctx.beginPath(); ctx.arc(0, -5, 10, 0, Math.PI*2); ctx.fill();
                    break;
                case 'dagon':
                    ctx.fillStyle = "#00cec9";
                    ctx.beginPath(); ctx.arc(0, -10, 40, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = "#01a3a4";
                    ctx.fillRect(-30, 20, 60, 50);
                    break;
                case 'mahito':
                    ctx.fillStyle = "#dfe6e9";
                    ctx.beginPath(); ctx.arc(0, -10, 38, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = "#2d3436";
                    ctx.fillRect(-15, -15, 8, 8);
                    ctx.fillRect(7, -15, 12, 4);
                    break;
                case 'yuta':
                    ctx.fillStyle = "#74b9ff";
                    ctx.beginPath(); ctx.arc(0, -12, 35, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = "#dfe6e9";
                    ctx.fillRect(25, -40, 6, 80);
                    break;
                case 'higuruma':
                    ctx.fillStyle = "#fdcb6e";
                    ctx.beginPath(); ctx.arc(0, -12, 36, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = "#e1b12c";
                    ctx.fillRect(-30, 20, 60, 45);
                    break;
                case 'kenjaku':
                    ctx.fillStyle = "#636e72";
                    ctx.beginPath(); ctx.arc(0, -10, 38, 0, Math.PI*2); ctx.fill();
                    ctx.strokeStyle = "#000"; ctx.lineWidth = 3;
                    ctx.beginPath(); ctx.moveTo(-30, -25); ctx.lineTo(30, -25); ctx.stroke();
                    break;
                case 'gojo':
                    ctx.fillStyle = "#2d3436";
                    ctx.fillRect(-32, -22, 64, 18);
                    ctx.fillStyle = "#0984e3";
                    ctx.beginPath(); ctx.arc(0, -15, 36, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = "#74b9ff";
                    ctx.beginPath(); ctx.arc(0, 0, 45 + Math.sin(animTick*4)*5, 0, Math.PI*2); ctx.fill();
                    break;
                case 'sukuna':
                    ctx.fillStyle = "#d63031";
                    ctx.beginPath(); ctx.arc(0, -10, 40, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = "#2d3436";
                    ctx.fillRect(-28, -20, 10, 4); ctx.fillRect(18, -20, 10, 4);
                    ctx.fillRect(-28, -8, 10, 4); ctx.fillRect(18, -8, 10, 4);
                    break;
            }

            ctx.restore();
            requestAnimationFrame(drawCharacter);
        }

        function updateUI() {
            if (juPower > 900) juPower = 900;
            if (hp > 900) hp = 900;

            juPowerBar.style.width = (juPower / 900) * 100 + '%';
            juPowerBar.style.backgroundColor = getBarColor(juPower);
            juPowerText.innerText = `${juPower}/900`;

            hpBar.style.width = (hp / 900) * 100 + '%';
            hpBar.style.backgroundColor = getBarColor(hp);
            hpText.innerText = `${hp}/900`;

            let calculatedStage = Math.floor(juPower / 90);
            if (calculatedStage > 8) calculatedStage = 8;

            if (calculatedStage !== currentStageIndex) {
                currentStageIndex = calculatedStage;
                triggerEvolution(stages[currentStageIndex]);
            }

            const currentObj = stages[currentStageIndex];
            characterName.innerText = currentObj.name;
            levelInfo.innerText = `STAGE ${currentObj.level} : ${currentObj.name}`;
        }

        function triggerEvolution(stageData) {
            modalTitle.innerText = `🔥 주력 각성: STAGE ${stageData.level} 달성! 🔥`;
            modalDesc.innerText = `${stageData.name}(이)가 진화했습니다!\n영역: [${stageData.domain}]의 경지에 도달했습니다.`;
            evolutionModal.classList.add('show');
        }

        fightBtn.addEventListener('click', () => {
            if (isDomainActive) return;
            isDomainActive = true;

            const currentObj = stages[currentStageIndex];
            phoneContainer.classList.add('domain-active');
            
            domainText.innerText = `영역전개!\n「 ${currentObj.domain} 」`;
            domainText.classList.add('show');

            juPower += 30;
            hp += 30;
            updateUI();

            setTimeout(() => {
                phoneContainer.classList.remove('domain-active');
                domainText.classList.remove('show');
                isDomainActive = false;
            }, 1200);
        });

        modalCloseBtn.addEventListener('click', () => {
            evolutionModal.classList.remove('show');
        });

        updateUI();
        drawCharacter();
    </script>
</body>
</html>
