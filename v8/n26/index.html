<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐉 드래곤 키우기</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Arial Rounded MT Bold", "Malgun Gothic", sans-serif;
  color: #49385f;
  background:
    radial-gradient(circle at 15% 15%, #fff6c7 0 7%, transparent 8%),
    radial-gradient(circle at 85% 20%, #d9f7ff 0 8%, transparent 9%),
    linear-gradient(135deg, #ffd8ef, #d8e8ff 45%, #d7fff0);
  min-height: 100vh;
  overflow-x: hidden;
}

body::before,
body::after {
  content: "✦  ✧  ★  ✦  ✧";
  position: fixed;
  color: rgba(255,255,255,.8);
  font-size: 30px;
  letter-spacing: 30px;
  animation: stars 8s linear infinite;
  pointer-events: none;
}
body::before { top: 8%; left: 3%; }
body::after { bottom: 8%; right: 2%; animation-delay: -4s; }

@keyframes stars {
  50% { transform: translateY(-20px) rotate(8deg); opacity: .45; }
}

.game {
  width: min(900px, 94vw);
  margin: 20px auto 40px;
}

h1 {
  text-align: center;
  font-size: clamp(34px, 7vw, 62px);
  margin: 8px 0 14px;
  color: #7d4db5;
  text-shadow: 3px 4px 0 white;
}

.card {
  background: rgba(255,255,255,.78);
  border: 4px solid white;
  border-radius: 30px;
  box-shadow: 0 12px 35px rgba(104,73,135,.18);
  padding: 20px;
  backdrop-filter: blur(8px);
}

.top {
  display: grid;
  grid-template-columns: 1fr 1.5fr;
  gap: 18px;
}

.stage {
  background: linear-gradient(135deg,#fff0a8,#ffd4e9);
  border-radius: 22px;
  padding: 15px;
  text-align: center;
}

.stage-name {
  font-size: clamp(24px,5vw,38px);
  font-weight: 900;
}

.level {
  font-size: 20px;
  margin-top: 5px;
}

.xp-track {
  height: 22px;
  background: #e5dff0;
  border-radius: 20px;
  overflow: hidden;
  margin-top: 10px;
  border: 3px solid white;
}

.xp-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg,#ff78bd,#8c7cff,#5fe5d0);
  transition: width .4s;
}

.pet-area {
  position: relative;
  min-height: 420px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.pet-glow {
  position: absolute;
  width: 310px;
  height: 310px;
  border-radius: 50%;
  background: radial-gradient(circle,rgba(255,255,255,.9),rgba(255,210,244,.3),transparent 70%);
}

.dragon-wrap {
  position: relative;
  z-index: 2;
  width: min(420px, 85vw);
  animation: bounce 1.9s ease-in-out infinite;
  transform-origin: center bottom;
}

@keyframes bounce {
  0%,100% { transform: translateY(5px) rotate(-1deg); }
  50% { transform: translateY(-14px) rotate(1deg); }
}

svg {
  width: 100%;
  height: auto;
  overflow: visible;
}

.wing {
  animation: wing 1.2s ease-in-out infinite alternate;
  transform-origin: 50% 60%;
}
@keyframes wing {
  from { transform: rotate(-4deg); }
  to { transform: rotate(5deg); }
}

.tail {
  animation: tail 1.5s ease-in-out infinite alternate;
  transform-origin: 70% 55%;
}
@keyframes tail {
  from { transform: rotate(-2deg); }
  to { transform: rotate(4deg); }
}

.eye {
  animation: blink 4s infinite;
  transform-origin: center;
}
@keyframes blink {
  0%, 45%, 48%, 100% { transform: scaleY(1); }
  46%, 47% { transform: scaleY(.08); }
}

.status-bubble {
  position: absolute;
  top: 5px;
  right: 5px;
  background: white;
  border: 3px solid #e6d8f5;
  border-radius: 22px;
  padding: 10px 15px;
  font-size: 19px;
  font-weight: bold;
  box-shadow: 0 7px 18px rgba(80,50,100,.15);
}

.stats {
  display: grid;
  gap: 12px;
  margin-top: 5px;
}

.stat {
  background: #fff;
  border-radius: 18px;
  padding: 10px 13px;
  box-shadow: 0 4px 12px rgba(100,70,120,.1);
}

.stat-head {
  display: flex;
  justify-content: space-between;
  font-size: 19px;
  font-weight: bold;
  margin-bottom: 6px;
}

.bar {
  height: 27px;
  background: #eee;
  border-radius: 30px;
  overflow: hidden;
  border: 3px solid #fff;
}

.fill {
  height: 100%;
  width: 35%;
  border-radius: 30px;
  transition: width .45s, background .45s;
}

.buttons {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 12px;
  margin-top: 16px;
}

button {
  border: 0;
  border-radius: 22px;
  padding: 16px 8px;
  font-size: 20px;
  font-weight: 900;
  color: #50365e;
  cursor: pointer;
  box-shadow: 0 6px 0 rgba(80,55,100,.16);
  transition: transform .12s, box-shadow .12s;
}

button:hover { transform: translateY(-3px); }
button:active {
  transform: translateY(3px);
  box-shadow: 0 2px 0 rgba(80,55,100,.16);
}

.feed { background: #ffd76f; }
.play { background: #ff9fcf; }
.wash { background: #86e9ff; }
.cure { background: #a9edb4; }

.message {
  text-align: center;
  min-height: 36px;
  font-size: 21px;
  font-weight: 900;
  margin-top: 15px;
}

.help {
  text-align: center;
  margin-top: 12px;
  font-size: 15px;
  color: #74677e;
}

.sick {
  filter: grayscale(.45) brightness(.9);
  animation: sick 1.5s ease-in-out infinite;
}

@keyframes sick {
  50% { transform: translateY(7px) rotate(-3deg); }
}

.sparkle {
  position: fixed;
  pointer-events: none;
  z-index: 99;
  font-size: 32px;
  animation: sparkle 1.2s forwards;
}

@keyframes sparkle {
  0% { opacity: 1; transform: scale(.4) translateY(0); }
  100% { opacity: 0; transform: scale(1.8) translateY(-100px) rotate(180deg); }
}

.evolution {
  position: fixed;
  inset: 0;
  z-index: 90;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(80,50,120,.55);
  backdrop-filter: blur(5px);
}

.evolution.show { display: flex; }

.evolution-box {
  background: linear-gradient(135deg,#fff,#ffe7fa,#e4ffff);
  padding: 35px;
  border-radius: 35px;
  text-align: center;
  border: 5px solid white;
  box-shadow: 0 20px 60px rgba(0,0,0,.25);
  animation: pop .55s cubic-bezier(.2,1.5,.5,1);
}

@keyframes pop {
  from { transform: scale(.2) rotate(-10deg); }
  to { transform: scale(1) rotate(0); }
}

.evolution-title {
  font-size: clamp(30px,7vw,58px);
  color: #a24dc7;
  font-weight: 900;
}

.evolution-stage {
  font-size: 30px;
  margin: 12px;
}

.close {
  background: #cbb8ff;
  margin-top: 10px;
  padding: 12px 30px;
}

@media (max-width: 700px) {
  .top { grid-template-columns: 1fr; }
  .pet-area { min-height: 350px; }
  .buttons { grid-template-columns: repeat(2,1fr); }
  button { font-size: 18px; }
}
</style>
</head>

<body>
<div class="game">

  <h1>🐉 드래곤 키우기</h1>

  <div class="card">

    <div class="top">
      <div class="stage">
        <div class="stage-name" id="stageName">🥚 알</div>
        <div class="level" id="levelText">레벨 1</div>
        <div class="xp-track">
          <div class="xp-fill" id="xpFill"></div>
        </div>
        <div id="xpText">경험치 0 / 200</div>
      </div>

      <div class="stats">
        <div class="stat">
          <div class="stat-head">
            <span>😊 행복</span>
            <span id="happyText">70 / 200</span>
          </div>
          <div class="bar"><div class="fill" id="happyBar"></div></div>
        </div>

        <div class="stat">
          <div class="stat-head">
            <span>🍖 포만감</span>
            <span id="cleanText">70 / 200</span>
          </div>
          <div class="bar"><div class="fill" id="cleanBar"></div></div>
        </div>

        <div class="stat">
          <div class="stat-head">
            <span>⚡ 에너지</span>
            <span id="energyText">70 / 200</span>
          </div>
          <div class="bar"><div class="fill" id="energyBar"></div></div>
        </div>
      </div>
    </div>

    <div class="pet-area">
      <div class="pet-glow"></div>
      <div class="status-bubble" id="statusBubble">😊 기분 좋아!</div>

      <div class="dragon-wrap" id="dragonWrap">
        <svg viewBox="0 0 500 430" aria-label="귀여운 드래곤 그림">

          <!-- 꼬리 -->
          <path class="tail"
            d="M370 300 C455 285 475 340 425 365 C390 382 375 350 405 340"
            fill="none" stroke="#6d4bc4" stroke-width="38" stroke-linecap="round"/>
          <path d="M407 340 L450 320 L432 358 Z" fill="#ff86c8"/>

          <!-- 왼쪽 날개 -->
          <path class="wing"
            d="M160 190 C80 125 45 160 75 230 L35 265 C100 270 145 250 180 220 Z"
            fill="#a58cff" stroke="#6743a8" stroke-width="7"/>
          <path d="M72 228 L142 210 M75 258 L145 225"
            stroke="#7b5aca" stroke-width="5"/>

          <!-- 오른쪽 날개 -->
          <path class="wing"
            d="M340 190 C420 125 455 160 425 230 L465 265 C400 270 355 250 320 220 Z"
            fill="#a58cff" stroke="#6743a8" stroke-width="7"/>
          <path d="M428 228 L358 210 M425 258 L355 225"
            stroke="#7b5aca" stroke-width="5"/>

          <!-- 몸 -->
          <ellipse cx="250" cy="290" rx="115" ry="105"
                   fill="url(#bodyGradient)" stroke="#553d92" stroke-width="8"/>

          <!-- 배 -->
          <ellipse cx="250" cy="315" rx="65" ry="72"
                   fill="#ffe8a8" stroke="#9d6c9e" stroke-width="5"/>

          <!-- 발 -->
          <ellipse cx="175" cy="365" rx="48" ry="27" fill="#8b65df"/>
          <ellipse cx="325" cy="365" rx="48" ry="27" fill="#8b65df"/>

          <!-- 뿔 -->
          <path d="M175 105 L155 45 L205 95 Z"
                fill="#ffe17d" stroke="#6743a8" stroke-width="7"/>
          <path d="M325 105 L345 45 L295 95 Z"
                fill="#ffe17d" stroke="#6743a8" stroke-width="7"/>

          <!-- 머리 -->
          <ellipse cx="250" cy="165" rx="125" ry="100"
                   fill="url(#headGradient)" stroke="#553d92" stroke-width="8"/>

          <!-- 귀 -->
          <path d="M145 145 Q90 110 115 175 Q130 200 155 180"
                fill="#ff9bd0" stroke="#6743a8" stroke-width="7"/>
          <path d="M355 145 Q410 110 385 175 Q370 200 345 180"
                fill="#ff9bd0" stroke="#6743a8" stroke-width="7"/>

          <!-- 눈 -->
          <g class="eye">
            <ellipse cx="205" cy="160" rx="25" ry="31" fill="white"/>
            <ellipse cx="295" cy="160" rx="25" ry="31" fill="white"/>
            <ellipse cx="208" cy="166" rx="10" ry="17" fill="#39245e"/>
            <ellipse cx="292" cy="166" rx="10" ry="17" fill="#39245e"/>
            <circle cx="212" cy="158" r="4" fill="white"/>
            <circle cx="296" cy="158" r="4" fill="white"/>
          </g>

          <!-- 코 -->
          <circle cx="235" cy="202" r="6" fill="#503765"/>
          <circle cx="265" cy="202" r="6" fill="#503765"/>

          <!-- 입 -->
          <path id="mouth"
            d="M220 220 Q250 245 280 220"
            fill="none" stroke="#633c70" stroke-width="7" stroke-linecap="round"/>

          <!-- 이마 보석 -->
          <path d="M250 95 L265 118 L250 137 L235 118 Z"
                fill="#62e7e9" stroke="#ffffff" stroke-width="5"/>

          <defs>
            <linearGradient id="bodyGradient" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#9b7cff"/>
              <stop offset="50%" stop-color="#62dbe4"/>
              <stop offset="100%" stop-color="#ff8ecf"/>
            </linearGradient>
            <linearGradient id="headGradient" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#b08aff"/>
              <stop offset="50%" stop-color="#75e6e4"/>
              <stop offset="100%" stop-color="#ff9bd4"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
    </div>

    <div class="buttons">
      <button class="feed" onclick="feed()">🍖 밥 주기</button>
      <button class="play" onclick="play()">🎾 놀아주기</button>
      <button class="wash" onclick="wash()">🫧 씻기기</button>
      <button class="cure" onclick="cure()">💖 치료하기</button>
    </div>

    <div class="message" id="message">
      드래곤을 잘 돌봐주세요! 💕
    </div>

    <div class="help">
      ⏰ 7초마다 조금씩 지쳐요 · 💡 게이지가 하나라도 0이 되면 아파요
    </div>
  </div>
</div>

<div class="evolution" id="evolution">
  <div class="evolution-box">
    <div class="evolution-title">✨ 드래곤이 진화했다! ✨</div>
    <div class="evolution-stage" id="evolutionStage"></div>
    <button class="close" onclick="closeEvolution()">멋져요! 🥳</button>
  </div>
</div>

<script>
let happy = 70;
let clean = 70;
let energy = 70;

let xp = 0;
let level = 1;
let stage = 0;
let sick = false;

const stages = [
  "🥚 알",
  "🐣 아기 드래곤",
  "🐲 어른 드래곤",
  "🌌 우주 드래곤",
  "🕳️ 블랙홀 드래곤",
  "🌈 무지개 드래곤"
];

const stageColors = [
  ["#b08aff","#75e6e4"],
  ["#8ee5a8","#70d9e8"],
  ["#9d78ff","#ff8acb"],
  ["#566dff","#5edcff"],
  ["#24183f","#101020"],
  ["#ff79c8","#ffe36e"]
];

function clamp(value) {
  return Math.max(0, Math.min(200, value));
}

function rainbowColor(percent) {
  if (percent <= 15) return "#050505";
  if (percent <= 35) return "#ff5d68";
  if (percent <= 55) return "#ffb84d";
  if (percent <= 75) return "#a5e65a";

  return "linear-gradient(90deg,#ff5da2,#ffd65a,#68e7a4,#58c7ff,#a478ff)";
}

function updateBar(id, value) {
  const bar = document.getElementById(id);
  bar.style.width = value / 2 + "%";
  bar.style.background = rainbowColor(value);
}

function update() {
  happy = clamp(happy);
  clean = clamp(clean);
  energy = clamp(energy);

  document.getElementById("happyText").textContent =
    `${happy} / 200`;

  document.getElementById("cleanText").textContent =
    `${clean} / 200`;

  document.getElementById("energyText").textContent =
    `${energy} / 200`;

  updateBar("happyBar", happy);
  updateBar("cleanBar", clean);
  updateBar("energyBar", energy);

  document.getElementById("stageName").textContent = stages[stage];
  document.getElementById("levelText").textContent =
    `레벨 ${level}`;

  document.getElementById("xpText").textContent =
    `경험치 ${xp} / 200`;

  document.getElementById("xpFill").style.width =
    (xp / 200 * 100) + "%";

  updateMood();
}

function updateMood() {
  const bubble = document.getElementById("statusBubble");
  const dragon = document.getElementById("dragonWrap");
  const mouth = document.getElementById("mouth");

  dragon.classList.toggle("sick", sick);

  if (sick) {
    bubble.textContent = "🤒 아파요...";
    mouth.setAttribute("d","M220 240 Q250 215 280 240");
    return;
  }

  const average = (happy + clean + energy) / 3;

  if (average >= 100) {
    bubble.textContent = "😆 최고야!";
    mouth.setAttribute("d","M220 215 Q250 250 280 215");
  } else if (average >= 45) {
    bubble.textContent = "🙂 괜찮아!";
    mouth.setAttribute("d","M225 225 Q250 240 275 225");
  } else {
    bubble.textContent = "😢 힘들어...";
    mouth.setAttribute("d","M220 245 Q250 220 280 245");
  }
}

function message(text) {
  document.getElementById("message").textContent = text;
}

function addXP() {
  if (sick) {
    message("🤒 아픈 동안에는 경험치를 얻을 수 없어요!");
    return;
  }

  xp += 50;

  if (xp >= 200) {
    xp -= 200;
    level++;

    if (stage < stages.length - 1) {
      stage++;
      evolution();
    }
  }
}

function feed() {
  if (sick) {
    message("🤒 먼저 치료해 주세요!");
    return;
  }

  clean = clamp(clean);
  happy = clamp(happy + 5);

  if (energy > 0) {
    energy = clamp(energy + 5);
  }

  clean = clamp(clean + 25);

  message("🍖 냠냠! 맛있는 밥을 먹었어요!");
  addXP();
  sparkle("🍖");
  update();
}

function play() {
  if (sick) {
    message("🤒 아픈 동안에는 놀 수 없어요!");
    return;
  }

  happy = clamp(happy + 25);
  clean = clamp(clean - 10);
  energy = clamp(energy - 15);

  message("🎾 신나게 놀았어요! 행복해졌어요!");
  addXP();
  sparkle("💖");
  checkSick();
  update();
}

function wash() {
  if (sick) {
    message("🤒 먼저 치료해 주세요!");
    return;
  }

  clean = clamp(clean + 35);
  happy = clamp(happy - 5);

  message("🫧 반짝반짝! 깨끗해졌어요!");
  addXP();
  sparkle("🫧");
  update();
}

function cure() {
  if (!sick) {
    message("😊 지금은 아프지 않아요!");
    return;
  }

  sick = false;

  happy = Math.max(happy, 45);
  clean = Math.max(clean, 45);
  energy = Math.max(energy, 45);

  message("💖 치료 완료! 드래곤이 건강해졌어요!");
  sparkle("💖");
  update();
}

function checkSick() {
  if (happy <= 0 || clean <= 0 || energy <= 0) {
    sick = true;
    message("🤒 드래곤이 아파요! 치료해 주세요.");
  }
}

function sparkle(symbol = "✨") {
  for (let i = 0; i < 14; i++) {
    const el = document.createElement("div");
    el.className = "sparkle";
    el.textContent = symbol;

    el.style.left = (35 + Math.random() * 30) + "%";
    el.style.top = (25 + Math.random() * 45) + "%";
    el.style.animationDelay = Math.random() * .4 + "s";

    document.body.appendChild(el);

    setTimeout(() => el.remove(), 1600);
  }
}

function evolution() {
  document.getElementById("evolutionStage").textContent =
    `🎉 ${stages[stage]}이 되었어요!`;

  document.getElementById("evolution").classList.add("show");

  sparkle("✨");
  sparkle("🌟");

  // 진화할 때 드래곤의 색도 변화
  const [a,b] = stageColors[stage];
  document.getElementById("bodyGradient").innerHTML = `
    <stop offset="0%" stop-color="${a}"/>
    <stop offset="100%" stop-color="${b}"/>
  `;

  document.getElementById("headGradient").innerHTML = `
    <stop offset="0%" stop-color="${b}"/>
    <stop offset="100%" stop-color="${a}"/>
  `;
}

function closeEvolution() {
  document.getElementById("evolution").classList.remove("show");
}

// 7초마다 상태 감소
setInterval(() => {
  if (!sick) {
    happy = clamp(happy - 4);
    clean = clamp(clean - 4);
    energy = clamp(energy - 4);

    checkSick();

    if (!sick) {
      message("⏰ 시간이 지나면서 조금 지쳤어요!");
    }
  }

  update();
}, 7000);

update();
</script>
</body>
</html>
