<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스피드런 드래곤 키우기</title>
  <style>
    :root {
      --bg-color: #fce4ec;
      --card-bg: #ffffff;
      --primary: #f48fb1;
      --primary-hover: #f06292;
      --text-color: #4a4a4a;
      --border-radius: 20px;
    }

    * {
      box-sizing: border-box;
      font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 30px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      position: relative;
      overflow: hidden;
    }

    h1, h2, h3 {
      text-align: center;
      margin-top: 0;
    }

    /* 드래곤 선택 화면 */
    .select-screen {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .dragon-card {
      background: #f8bbd0;
      border: 3px solid transparent;
      border-radius: 15px;
      padding: 15px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .dragon-card:hover {
      transform: translateY(-3px);
      border-color: #ec407a;
    }

    .dragon-icon-preview {
      width: 60px;
      height: 60px;
      flex-shrink: 0;
    }

    .dragon-card h3 {
      margin: 0 0 5px 0;
      color: #880e4f;
      text-align: left;
    }

    .dragon-card p {
      margin: 0;
      font-size: 0.85rem;
      line-height: 1.4;
    }

    /* 게임 화면 */
    .game-screen {
      display: none;
      flex-direction: column;
      gap: 15px;
    }

    /* 상단 정보 */
    .top-info {
      background: #f1f8e9;
      padding: 15px;
      border-radius: 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
    }

    /* 프로그래스 바 공통 */
    .bar-container {
      width: 100%;
      height: 18px;
      background: #e0e0e0;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    .bar-fill {
      height: 100%;
      width: 100%;
      border-radius: 10px;
      transition: width 0.15s ease, background-color 0.3s ease;
    }

    /* 플레이어 & 펫 체력 바 */
    .hp-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* 펫 비주얼 영역 */
    .pet-display {
      height: 180px;
      background: #e1f5fe;
      border-radius: 15px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .pet-avatar-wrapper {
      width: 130px;
      height: 130px;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .sparkle {
      animation: pulse 0.5s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(1); filter: brightness(1); }
      100% { transform: scale(1.15); filter: brightness(1.3) drop-shadow(0 0 12px #fff); }
    }

    /* 요구치(상태) 섹션 */
    .stats-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .stat-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .stat-label {
      width: 60px;
      font-weight: bold;
      font-size: 0.9rem;
    }

    /* 버튼 영역 */
    .action-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-top: 5px;
    }

    .action-btn {
      background: #e0f2f1;
      border: 2px solid #80cbc4;
      border-radius: 15px;
      padding: 12px 5px;
      font-size: 0.95rem;
      font-weight: bold;
      color: #004d40;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      outline: none;
    }

    .action-btn:active {
      transform: scale(0.98);
    }

    .btn-hold-fill {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 0%;
      background: rgba(0, 150, 136, 0.35);
      pointer-events: none;
      transition: height 0.05s linear;
    }

    /* 치유 버튼 */
    .heal-btn {
      background: #fff3e0;
      border: 2px solid #ffcc80;
      color: #e65100;
      width: 100%;
      padding: 12px;
      border-radius: 15px;
      font-weight: bold;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      margin-top: 5px;
    }

    .heal-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* 메시지 오버레이 */
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      color: white;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-radius: var(--border-radius);
      z-index: 10;
      text-align: center;
      padding: 20px;
    }

    .overlay button {
      background: #ff4081;
      border: none;
      color: white;
      padding: 12px 24px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 1rem;
      margin-top: 20px;
      cursor: pointer;
    }

    .guide-text {
      text-align: center;
      font-size: 0.8rem;
      color: #888;
      margin-top: -5px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 선택 화면 -->
    <div id="select-screen" class="select-screen">
      <h1>🐲 드래곤 선택</h1>
      <div class="dragon-card" onclick="selectDragon('fire')">
        <div class="dragon-icon-preview" id="preview-fire"></div>
        <div>
          <h3>불드래곤</h3>
          <p><b>플레이어 피해:</b> 빠름<br><b>요구치 난이도:</b> 낮음 (체력 150)</p>
        </div>
      </div>
      <div class="dragon-card" onclick="selectDragon('water')">
        <div class="dragon-icon-preview" id="preview-water"></div>
        <div>
          <h3>물드래곤</h3>
          <p><b>플레이어 피해:</b> 적음<br><b>요구치 해결:</b> 느림 (체력 90)</p>
        </div>
      </div>
      <div class="dragon-card" onclick="selectDragon('lightning')">
        <div class="dragon-icon-preview" id="preview-lightning"></div>
        <div>
          <h3>번개드래곤</h3>
          <p><b>특수 규칙:</b> 2단계부터 피해 무효!<br><b>대신 요구치 감소 속도 폭증⚡</b> (체력 120)</p>
        </div>
      </div>
    </div>

    <!-- 게임 화면 -->
    <div id="game-screen" class="game-screen">
      <!-- 상단 진화/경험치 바 -->
      <div class="top-info">
        <div class="info-row">
          <span>단계: <b id="pet-stage">알</b></span>
          <span>Lv. <b id="pet-level">1</b></span>
        </div>
        <div class="bar-container">
          <div id="exp-bar" class="bar-fill" style="background-color: #ab47bc; width: 0%;"></div>
        </div>
      </div>

      <!-- 플레이어 및 펫 체력 -->
      <div class="hp-section">
        <div>
          <div class="info-row" style="font-size:0.85rem;">
            <span>❤️ 플레이어 체력</span>
            <span id="player-hp-text">100/100</span>
          </div>
          <div class="bar-container">
            <div id="player-hp-bar" class="bar-fill" style="background-color: #ef5350; width: 100%;"></div>
          </div>
        </div>
        <div>
          <div class="info-row" style="font-size:0.85rem;">
            <span>💚 펫 체력</span>
            <span id="pet-hp-text">150/150</span>
          </div>
          <div class="bar-container">
            <div id="pet-hp-bar" class="bar-fill" style="background-color: #66bb6a; width: 100%;"></div>
          </div>
        </div>
      </div>

      <!-- 펫 캐릭터 SVG 비주얼 표시 -->
      <div class="pet-display" id="pet-display">
        <div id="pet-avatar-wrapper" class="pet-avatar-wrapper"></div>
        <div id="pet-name" style="font-weight: bold; margin-top: 2px;">불드래곤</div>
      </div>

      <!-- 상태(스탯) 정보 -->
      <div class="stats-section">
        <div class="stat-row">
          <span class="stat-label">🍖 포만감</span>
          <div class="bar-container">
            <div id="satiety-bar" class="bar-fill"></div>
          </div>
        </div>
        <div class="stat-row">
          <span class="stat-label">💖 행복</span>
          <div class="bar-container">
            <div id="happiness-bar" class="bar-fill"></div>
          </div>
        </div>
        <div class="stat-row">
          <span class="stat-label">🧼 청결</span>
          <div class="bar-container">
            <div id="clean-bar" class="bar-fill"></div>
          </div>
        </div>
      </div>

      <!-- 상호작용 버튼 -->
      <div class="action-buttons">
        <button id="btn-feed" class="action-btn">
          [Q] 밥주기
          <div class="btn-hold-fill"></div>
        </button>
        <button id="btn-play" class="action-btn">
          [W] 놀아주기
          <div class="btn-hold-fill"></div>
        </button>
        <button id="btn-wash" class="action-btn">
          [E] 씻기기
          <div class="btn-hold-fill"></div>
        </button>
      </div>

      <!-- 회복 버튼 -->
      <button id="btn-heal" class="heal-btn" disabled>[R] 펫 체력 회복 (40)</button>
      <div class="guide-text">키보드(Q/W/E/R)를 누르거나 마우스/터치로 꾹 눌러주세요!</div>
    </div>

    <!-- 게임 오버 / 메시지 오버레이 -->
    <div id="overlay" class="overlay">
      <h2 id="overlay-msg">게임 오버</h2>
      <button onclick="resetGame()">다시 시작</button>
    </div>
  </div>

  <script>
    // --- 파스텔 톤 서양 드래곤 SVG 렌더링 함수 ---
    function renderDragonSVG(type, stage) {
      const colors = {
        fire: { body: '#ff8a80', belly: '#ffe0b2', wing: '#ff5252', horn: '#ffd54f' },
        water: { body: '#80deea', belly: '#e0f7fa', wing: '#00bcd4', horn: '#b2ebd9' },
        lightning: { body: '#fff59d', belly: '#fffde7', wing: '#fbc02d', horn: '#ff9800' }
      };
      const c = colors[type];

      // 1단계: 알
      if (stage === 0) {
        return `
          <svg viewBox="0 0 100 100" width="100%" height="100%">
            <ellipse cx="50" cy="55" rx="30" ry="38" fill="${c.body}" />
            <path d="M 35 45 Q 42 40 40 50 T 55 52 T 62 42" fill="none" stroke="${c.belly}" stroke-width="4" stroke-linecap="round"/>
            <ellipse cx="40" cy="30" rx="3" ry="5" fill="#fff" opacity="0.6"/>
          </svg>
        `;
      }

      // 2단계: 아기 서양 드래곤
      if (stage === 1) {
        return `
          <svg viewBox="0 0 100 100" width="100%" height="100%">
            <!-- 날개 -->
            <path d="M 30 50 C 10 30 15 15 35 35 Z" fill="${c.wing}" />
            <path d="M 70 50 C 90 30 85 15 65 35 Z" fill="${c.wing}" />
            <!-- 꼬리 -->
            <path d="M 50 70 Q 70 85 80 75 Q 85 70 80 65" fill="none" stroke="${c.body}" stroke-width="8" stroke-linecap="round"/>
            <path d="M 80 75 L 88 75 L 83 68 Z" fill="${c.wing}"/>
            <!-- 몸통 -->
            <ellipse cx="50" cy="62" rx="22" ry="24" fill="${c.body}" />
            <ellipse cx="50" cy="65" rx="14" ry="16" fill="${c.belly}" />
            <!-- 머리 -->
            <circle cx="50" cy="38" r="18" fill="${c.body}" />
            <!-- 뿔 -->
            <path d="M 42 24 Q 38 15 35 18 Z" fill="${c.horn}" />
            <path d="M 58 24 Q 62 15 65 18 Z" fill="${c.horn}" />
            <!-- 눈 -->
            <circle cx="43" cy="36" r="3" fill="#4a4a4a" />
            <circle cx="57" cy="36" r="3" fill="#4a4a4a" />
            <circle cx="44" cy="35" r="1" fill="#fff" />
            <circle cx="58" cy="35" r="1" fill="#fff" />
            <!-- 볼터치 -->
            <circle cx="39" cy="41" r="3" fill="#ff80ab" opacity="0.6"/>
            <circle cx="61" cy="41" r="3" fill="#ff80ab" opacity="0.6"/>
            <!-- 입 -->
            <path d="M 47 42 Q 50 45 53 42" fill="none" stroke="#4a4a4a" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        `;
      }

      // 3단계: 성체 서양 드래곤
      return `
        <svg viewBox="0 0 100 100" width="100%" height="100%">
          <!-- 큰 날개 -->
          <path d="M 28 48 C -5 20 5 0 32 28 C 15 35 20 50 28 48 Z" fill="${c.wing}" />
          <path d="M 72 48 C 105 20 95 0 68 28 C 85 35 80 50 72 48 Z" fill="${c.wing}" />
          <!-- 꼬리 & 꼬리 가시 -->
          <path d="M 50 72 Q 78 92 88 78 Q 92 70 85 62" fill="none" stroke="${c.body}" stroke-width="10" stroke-linecap="round"/>
          <path d="M 88 78 L 98 78 L 91 68 Z" fill="${c.horn}"/>
          <!-- 몸통 및 배 -->
          <ellipse cx="50" cy="64" rx="25" ry="26" fill="${c.body}" />
          <path d="M 40 48 Q 50 48 60 48 L 58 82 Q 50 86 42 82 Z" fill="${c.belly}" />
          <!-- 머리 및 주둥이 -->
          <ellipse cx="50" cy="34" rx="20" ry="17" fill="${c.body}" />
          <!-- 큰 뿔 -->
          <path d="M 38 20 C 32 5 20 8 28 20 Z" fill="${c.horn}" />
          <path d="M 62 20 C 68 5 80 8 72 20 Z" fill="${c.horn}" />
          <!-- 눈 -->
          <ellipse cx="41" cy="31" rx="3.5" ry="4.5" fill="#4a4a4a" />
          <ellipse cx="59" cy="31" rx="3.5" ry="4.5" fill="#4a4a4a" />
          <circle cx="42" cy="29" r="1.2" fill="#fff" />
          <circle cx="60" cy="29" r="1.2" fill="#fff" />
          <!-- 볼터치 -->
          <circle cx="36" cy="37" r="3.5" fill="#ff80ab" opacity="0.5"/>
          <circle cx="64" cy="37" r="3.5" fill="#ff80ab" opacity="0.5"/>
          <!-- 미소 / 콧구멍 -->
          <circle cx="47" cy="36" r="0.8" fill="#4a4a4a"/>
          <circle cx="53" cy="36" r="0.8" fill="#4a4a4a"/>
          <path d="M 45 39 Q 50 43 55 39" fill="none" stroke="#4a4a4a" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      `;
    }

    // --- 드래곤 데이터 설정 ---
    const DRAGON_TYPES = {
      fire: {
        name: '불드래곤',
        maxPetHp: 150,
        playerDrainRate: 1.2,
        statDrainRate: 25.0,   // 전반적인 감소 속도 상승
        statMax: { satiety: 100, happiness: 100, clean: 100 },
        statStart: { satiety: 70, happiness: 70, clean: 70 }
      },
      water: {
        name: '물드래곤',
        maxPetHp: 90,
        playerDrainRate: 0.5,
        statDrainRate: 20.0,
        actionSpeedMult: 1.4,
        statMax: { satiety: 120, happiness: 110, clean: 50 },
        statStart: { satiety: 60, happiness: 70, clean: 30 }
      },
      lightning: {
        name: '번개드래곤',
        maxPetHp: 120,
        playerDrainRate: 0.8,
        statDrainRate: 22.0,   // 기본 속도도 빠름
        statMax: { satiety: 100, happiness: 80, clean: 110 },
        statStart: { satiety: 70, happiness: 70, clean: 80 }
      }
    };

    // 프리뷰 드래곤 생성
    document.getElementById('preview-fire').innerHTML = renderDragonSVG('fire', 2);
    document.getElementById('preview-water').innerHTML = renderDragonSVG('water', 2);
    document.getElementById('preview-lightning').innerHTML = renderDragonSVG('lightning', 2);

    // --- 게임 상태 변수 ---
    let selectedType = null;
    let config = null;

    let playerHp = 100;
    let maxPlayerHp = 100;
    let petHp = 100;
    let maxPetHp = 100;

    let level = 1;
    let exp = 0;
    let stage = 0; // 0: 알, 1: 성장체, 2: 성체

    let stats = { satiety: 0, happiness: 0, clean: 0 };

    let isGameOver = false;
    let gameLoopInterval = null;

    // 홀드 입력 타이머
    const holdDuration = 350;
    const healHoldDuration = 1000;
    let holdTimer = null;
    let activeKey = null;

    function selectDragon(type) {
      selectedType = type;
      config = DRAGON_TYPES[type];

      document.getElementById('select-screen').style.display = 'none';
      document.getElementById('game-screen').style.display = 'flex';

      initGame();
    }

    function initGame() {
      isGameOver = false;
      playerHp = 100;
      petHp = config.maxPetHp;
      maxPetHp = config.maxPetHp;
      level = 1;
      exp = 0;
      stage = 0;

      stats.satiety = config.statStart.satiety;
      stats.happiness = config.statStart.happiness;
      stats.clean = config.statStart.clean;

      document.getElementById('pet-name').innerText = config.name;
      document.getElementById('overlay').style.display = 'none';

      updateUI();

      if (gameLoopInterval) clearInterval(gameLoopInterval);
      gameLoopInterval = setInterval(gameLoop, 100);
    }

    // --- 메인 게임 루프 ---
    function gameLoop() {
      if (isGameOver) return;

      // 1. 플레이어 체력 차감
      let stageDamageMult = (3 - stage) * 0.4;
      let drainAmount = (config.playerDrainRate * stageDamageMult) * 0.1;

      if (selectedType === 'lightning' && stage >= 1) {
        drainAmount = 0; // 번개드래곤 2단계 이상일 때 플레이어 자동 피해 무효화
      }

      playerHp -= drainAmount;
      if (playerHp <= 0) {
        playerHp = 0;
        endGame("펫으로 인해 사망하였습니다.");
        return;
      }

      // 2. 요구치(스탯) 감소 속도 계산
      let currentStatDrainRate = config.statDrainRate;

      // 🔥 [요청사항] 번개드래곤 2단계(인덱스 1) 이상부터 요구치 감소 속도 개빠르게 폭증!
      if (selectedType === 'lightning' && stage >= 1) {
        currentStatDrainRate = 35.0; // 엄청 빠르게 감소!
      }

      const drainStep = 0.3 * currentStatDrainRate;

      ['satiety', 'happiness', 'clean'].forEach(key => {
        stats[key] -= drainStep * 0.1;

        if (stats[key] <= 0) {
          stats[key] = config.statStart[key]; // 시작값으로 복구

          if (selectedType === 'lightning') {
            playerHp -= 40; // 번개드래곤 폭주 피해
          } else {
            petHp -= 30; // 일반 펫 데미지
          }
        }
      });

      if (petHp <= 0) {
        petHp = 0;
        endGame("펫이 사망하였습니다.");
        return;
      }

      updateUI();
    }

    function triggerAction(action) {
      if (isGameOver) return;

      if (action === 'feed') {
        stats.satiety = Math.min(config.statMax.satiety, stats.satiety + 25);
        stats.happiness = Math.min(config.statMax.happiness, stats.happiness + 5);
        addExp(10);
      } else if (action === 'play') {
        stats.happiness = Math.min(config.statMax.happiness, stats.happiness + 25);
        stats.satiety = Math.max(0, stats.satiety - 10);
        stats.clean = Math.max(0, stats.clean - 10);
        addExp(10);
      } else if (action === 'wash') {
        stats.clean = Math.min(config.statMax.clean, stats.clean + 35);
        stats.happiness = Math.max(0, stats.happiness - 5);
        addExp(10);
      } else if (action === 'heal') {
        petHp = Math.min(maxPetHp, petHp + 40);
      }

      updateUI();
    }

    function addExp(amount) {
      exp += amount;
      if (exp >= 100) {
        level += Math.floor(exp / 100);
        exp = exp % 100;

        let newStage = stage;
        if (level >= 6) newStage = 2;
        else if (level >= 3) newStage = 1;

        if (newStage !== stage) {
          stage = newStage;
          triggerEvolveEffect();
        }
      }
    }

    function triggerEvolveEffect() {
      const petDisplay = document.getElementById('pet-display');
      petDisplay.classList.add('sparkle');
      alert(`${config.name}(이)가 진화했다!`);
      setTimeout(() => {
        petDisplay.classList.remove('sparkle');
      }, 1000);
    }

    function updateUI() {
      const stageNames = ['알', '성장체', '성체'];
      document.getElementById('pet-stage').innerText = stageNames[stage];
      document.getElementById('pet-level').innerText = level;
      document.getElementById('exp-bar').style.width = `${exp}%`;

      // SVG 드래곤 업데이트
      document.getElementById('pet-avatar-wrapper').innerHTML = renderDragonSVG(selectedType, stage);

      document.getElementById('player-hp-text').innerText = `${Math.ceil(playerHp)}/${maxPlayerHp}`;
      document.getElementById('player-hp-bar').style.width = `${(playerHp / maxPlayerHp) * 100}%`;

      document.getElementById('pet-hp-text').innerText = `${Math.ceil(petHp)}/${maxPetHp}`;
      document.getElementById('pet-hp-bar').style.width = `${(petHp / maxPetHp) * 100}%`;

      updateStatBar('satiety-bar', stats.satiety, config.statMax.satiety);
      updateStatBar('happiness-bar', stats.happiness, config.statMax.happiness);
      updateStatBar('clean-bar', stats.clean, config.statMax.clean);

      const healBtn = document.getElementById('btn-heal');
      healBtn.disabled = (petHp >= maxPetHp);
    }

    function updateStatBar(elementId, value, max) {
      const bar = document.getElementById(elementId);
      const percentage = Math.max(0, Math.min(100, (value / max) * 100));
      bar.style.width = `${percentage}%`;

      if (percentage > 50) {
        bar.style.backgroundColor = '#66bb6a';
      } else if (percentage > 25) {
        bar.style.backgroundColor = '#ffa726';
      } else {
        bar.style.backgroundColor = '#ef5350';
      }
    }

    function setupHoldEvents() {
      const actions = [
        { key: 'q', id: 'btn-feed', action: 'feed' },
        { key: 'w', id: 'btn-play', action: 'play' },
        { key: 'e', id: 'btn-wash', action: 'wash' },
        { key: 'r', id: 'btn-heal', action: 'heal', isHeal: true }
      ];

      actions.forEach(item => {
        const btn = document.getElementById(item.id);

        const startHold = (e) => {
          if (e) e.preventDefault();
          if (activeKey || isGameOver) return;
          if (item.isHeal && petHp >= maxPetHp) return;

          activeKey = item.key;
          let duration = item.isHeal ? healHoldDuration : holdDuration;
          if (config && config.actionSpeedMult) duration *= config.actionSpeedMult;

          let startTime = Date.now();

          holdTimer = setInterval(() => {
            let elapsed = Date.now() - startTime;
            let progress = Math.min(100, (elapsed / duration) * 100);

            if (btn.querySelector('.btn-hold-fill')) {
              btn.querySelector('.btn-hold-fill').style.height = `${progress}%`;
            }

            if (elapsed >= duration) {
              endHold();
              triggerAction(item.action);
            }
          }, 20);
        };

        const endHold = () => {
          if (activeKey === item.key) {
            clearInterval(holdTimer);
            holdTimer = null;
            activeKey = null;
            if (btn.querySelector('.btn-hold-fill')) {
              btn.querySelector('.btn-hold-fill').style.height = '0%';
            }
          }
        };

        btn.addEventListener('mousedown', startHold);
        btn.addEventListener('mouseup', endHold);
        btn.addEventListener('mouseleave', endHold);

        btn.addEventListener('touchstart', startHold);
        btn.addEventListener('touchend', endHold);

        item.startHold = startHold;
        item.endHold = endHold;
      });

      window.addEventListener('keydown', (e) => {
        const k = e.key.toLowerCase();
        if (['q', 'w', 'e', 'r'].includes(k) && activeKey !== k) {
          const item = actions.find(a => a.key === k);
          if (item) item.startHold();
        }
      });

      window.addEventListener('keyup', (e) => {
        const k = e.key.toLowerCase();
        if (['q', 'w', 'e', 'r'].includes(k)) {
          const item = actions.find(a => a.key === k);
          if (item) item.endHold();
        }
      });
    }

    function endGame(message) {
      isGameOver = true;
      clearInterval(gameLoopInterval);
      document.getElementById('overlay-msg').innerText = message;
      document.getElementById('overlay').style.display = 'flex';
    }

    function resetGame() {
      document.getElementById('select-screen').style.display = 'flex';
      document.getElementById('game-screen').style.display = 'none';
      document.getElementById('overlay').style.display = 'none';
    }

    setupHoldEvents();
  </script>
</body>
</html>
