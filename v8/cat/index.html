<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f4d6ad">
<title>냥이의 집</title>
<style>
:root{
  --cream:#fff7eb;
  --cream2:#f8ead7;
  --brown:#5b3d2c;
  --soft:#ffffffcc;
  --line:#e4caa9;
  --shadow:0 10px 30px rgba(119,76,38,.18);
  --orange:#ff9d2e;
  --pink:#ff6f91;
  --blue:#59b8f0;
  --purple:#9168ef;
  --green:#9bd56d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#3a2b22;background:#f8e3c3;touch-action:manipulation}
button,input{font:inherit}
button{border:0;cursor:pointer}
.app{
  position:relative;width:100%;height:100%;
  background:
    linear-gradient(rgba(255,245,225,.24),rgba(255,244,224,.24)),
    radial-gradient(circle at 50% 18%,rgba(255,255,255,.85),transparent 25%),
    linear-gradient(180deg,#f6d7b2 0 36%,#eac99b 36% 100%);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.bg-room{position:absolute;inset:0;overflow:hidden}
.wall{position:absolute;inset:0 0 34%;background:linear-gradient(180deg,#f8dfbf,#f6e8d4)}
.floor{position:absolute;left:0;right:0;bottom:0;height:34%;background:
  repeating-linear-gradient(90deg,rgba(126,88,51,.08) 0 2px,transparent 2px 120px),
  linear-gradient(#dfbd8a,#d8af78)}
.window{
  position:absolute;left:50%;top:18%;transform:translateX(-50%);width:34%;height:38%;
  border:16px solid #f7ead9;background:
    linear-gradient(90deg,transparent 48%,#f7ead9 48% 52%,transparent 52%),
    linear-gradient(transparent 48%,#f7ead9 48% 52%,transparent 52%),
    linear-gradient(#d9f1ff,#c6edff 55%,#b8dfaa);
  box-shadow:0 0 40px rgba(255,244,200,.75)
}
.curtain{position:absolute;top:17%;width:11%;height:43%;background:linear-gradient(90deg,#fff6e6,#f4e3cb);border-radius:0 0 20px 20px;box-shadow:0 6px 20px rgba(118,77,43,.08)}
.curtain.left{left:25%}.curtain.right{right:25%}
.plant{
  position:absolute;left:19%;bottom:22%;font-size:110px;filter:drop-shadow(0 8px 7px rgba(0,0,0,.12))
}
.cat-tree{position:absolute;right:7%;bottom:16%;font-size:160px;opacity:.95}
.cat-bed{position:absolute;left:6%;bottom:17%;font-size:110px}
.rug{
  position:absolute;left:50%;bottom:12%;transform:translateX(-50%);width:44%;height:14%;
  background:radial-gradient(ellipse,#fffdf9 0 45%,#f6ecdf 60%,#e9d8c6 80%);
  border-radius:50%;filter:drop-shadow(0 8px 10px rgba(0,0,0,.08))
}
.top-left{
  position:absolute;top:calc(env(safe-area-inset-top) + 18px);left:22px;z-index:15
}
.brand{font-size:24px;font-weight:900;display:flex;align-items:center;gap:8px}
.name-box{
  margin-top:8px;background:#fffdf7e8;border:1px solid rgba(110,75,45,.12);border-radius:18px;
  padding:8px 12px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow)
}
#catName{border:0;background:transparent;outline:none;width:110px;font-size:18px;font-weight:800;color:#3a2b22}
.level-box{margin-top:8px;width:220px}
.level-row{display:flex;justify-content:space-between;font-weight:800}
.level-bar{height:12px;background:#c7a782;border-radius:999px;margin-top:4px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.15)}
.level-fill{height:100%;width:45%;background:linear-gradient(90deg,#ffba27,#ff8f1f);border-radius:999px}
.wallet{
  position:absolute;top:calc(env(safe-area-inset-top) + 20px);left:50%;transform:translateX(-50%);
  display:flex;gap:10px;z-index:15
}
.currency{
  min-width:150px;background:#fff9efed;border:1px solid rgba(110,75,45,.12);border-radius:20px;padding:8px 12px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;box-shadow:var(--shadow);font-weight:900;font-size:17px
}
.currency .icon{font-size:25px}
.round-plus{width:30px;height:30px;border-radius:50%;background:#fff;border:1px solid #dcc1a0;color:#6a4b37;font-size:20px;display:grid;place-items:center}
.mode-btn{
  position:absolute;right:20px;top:calc(env(safe-area-inset-top) + 20px);z-index:16;
  background:#4a3a2f;color:white;border-radius:22px;padding:13px 18px;font-weight:850;box-shadow:var(--shadow)
}
.side-menu{
  position:absolute;right:22px;top:140px;z-index:14;display:flex;flex-direction:column;gap:14px
}
.side-btn{
  width:62px;height:62px;border-radius:50%;background:#fffaf2e8;border:1px solid rgba(110,75,45,.12);
  box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#4d392d
}
.side-btn span{font-size:24px;line-height:1}
.tip-card{
  position:absolute;left:22px;top:210px;z-index:12;width:280px;padding:18px;background:#fffdf5dd;
  border:1px solid rgba(110,75,45,.12);border-radius:24px;box-shadow:var(--shadow);backdrop-filter:blur(6px)
}
.tip-card b{font-size:18px}
.cat-wrap{
  position:absolute;left:50%;bottom:39%;width:126px;height:150px;transform:translateX(-50%);
  z-index:10;transform-origin:50% 80%
}
.cat{
  position:relative;width:100%;height:100%;filter:drop-shadow(0 8px 5px rgba(0,0,0,.24))
}
.body{position:absolute;left:28px;top:62px;width:70px;height:74px;background:#090909;border-radius:48% 48% 42% 42%}
.head{position:absolute;left:31px;top:18px;width:64px;height:58px;background:#090909;border-radius:45% 45% 50% 50%}
.ear{position:absolute;top:-16px;width:25px;height:30px;background:#090909;clip-path:polygon(50% 0,100% 100%,0 100%)}
.ear.left{left:2px;transform:rotate(-9deg)}.ear.right{right:2px;transform:rotate(9deg)}
.eye{position:absolute;top:24px;width:15px;height:10px;border-radius:50%;background:radial-gradient(circle at 50% 50%,#071008 0 2px,#4df3a1 3px 6px,#f5dd68 7px 8px,#111 9px)}
.eye.left{left:12px}.eye.right{right:12px}
.nose{position:absolute;left:50%;top:37px;transform:translateX(-50%);width:6px;height:4px;border-radius:50%;background:#3b2d33}
.leg{position:absolute;top:116px;width:16px;height:29px;background:#080808;border-radius:40%}
.leg.l{left:38px}.leg.r{left:62px}
.tail{
  position:absolute;left:90px;top:88px;width:54px;height:13px;background:#080808;border-radius:999px;
  transform-origin:0 50%;transform:rotate(52deg)
}
.heart-bubble{
  position:absolute;left:50%;bottom:160px;transform:translateX(-50%);background:white;border-radius:24px;padding:7px 11px;
  box-shadow:var(--shadow);opacity:0;transition:.2s;font-size:20px
}
.heart-bubble.show{opacity:1}
@keyframes tailWag{0%,100%{transform:rotate(36deg)}50%{transform:rotate(72deg)}}
@keyframes jump{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-80px)}}
@keyframes shake{0%,100%{transform:translateX(-50%) rotate(0)}25%{transform:translateX(-50%) rotate(-6deg)}50%{transform:translateX(-50%) rotate(6deg)}75%{transform:translateX(-50%) rotate(-5deg)}}
@keyframes sleep{0%,100%{transform:translateX(-50%) rotate(82deg) scale(.92)}50%{transform:translateX(-50%) rotate(82deg) scale(.96)}}
@keyframes zoom{0%{left:50%}25%{left:20%}55%{left:80%}78%{left:35%}100%{left:50%}}
.cat-wrap.tail .tail{animation:tailWag .4s 5 ease-in-out}
.cat-wrap.jump{animation:jump 1s ease-in-out}
.cat-wrap.shake{animation:shake .8s ease-in-out}
.cat-wrap.sleep{animation:sleep 2s ease-in-out infinite}
.cat-wrap.zoom{animation:zoom 2.4s ease-in-out}
.action-strip{
  position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 145px);transform:translateX(-50%);
  width:min(900px,86%);display:grid;grid-template-columns:repeat(4,1fr);gap:16px;z-index:14
}
.action{
  min-height:150px;border-radius:26px;padding:14px 12px;box-shadow:var(--shadow);border:2px solid rgba(255,255,255,.55);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-weight:900
}
.action .emoji{font-size:52px}
.action small{font-size:12px}
.feed{background:linear-gradient(180deg,#ffe8a7,#ffd675)}.play{background:linear-gradient(180deg,#dff3c9,#bce990)}
.clean{background:linear-gradient(180deg,#d7efff,#9fd6f7)}.sleep-btn{background:linear-gradient(180deg,#e8dcff,#c8b6f4)}
.status-panel{
  position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 48px);transform:translateX(-50%);
  width:min(930px,92%);background:#fff8efe8;border:1px solid rgba(110,75,45,.12);border-radius:24px;
  padding:12px 18px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;z-index:14;box-shadow:var(--shadow)
}
.stat{padding:4px 10px}
.stat-head{display:flex;justify-content:space-between;font-weight:800;font-size:13px}
.bar{height:12px;background:#ead9c7;border-radius:999px;overflow:hidden;margin-top:6px}.fill{height:100%;border-radius:999px}
.hunger{background:linear-gradient(90deg,#ff9d2e,#ffbb4a)}.happy{background:linear-gradient(90deg,#ff7595,#ff91a9)}
.clean-fill{background:linear-gradient(90deg,#59b8f0,#7ad5ff)}.energy{background:linear-gradient(90deg,#8f68ed,#b08cff)}
.bottom-note{
  position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 8px);transform:translateX(-50%);
  width:min(930px,92%);font-size:12px;text-align:center;color:#8e694e;z-index:14
}
.floatfx{position:fixed;z-index:30;pointer-events:none;font-size:28px;animation:float 1.1s ease-out forwards}
@keyframes float{0%{opacity:0;transform:translateY(10px) scale(.8)}20%{opacity:1}100%{opacity:0;transform:translateY(-70px) scale(1.2)}}
.toast{
  position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);z-index:30;background:#4d392ddd;color:white;
  padding:10px 16px;border-radius:16px;font-weight:800;opacity:0;pointer-events:none;transition:.2s
}
.toast.show{opacity:1}
@media(max-width:850px){
  .wallet{top:76px}.top-left{left:12px}.mode-btn{right:12px}
  .side-menu{right:10px;top:145px}.side-btn{width:52px;height:52px}
  .tip-card{left:12px;top:180px;width:220px;padding:13px;font-size:13px}
  .window{width:52%;height:33%;top:24%}.curtain.left{left:19%}.curtain.right{right:19%}
  .plant{left:3%;bottom:24%;font-size:75px}.cat-tree{right:-3%;font-size:120px}.cat-bed{left:-2%;font-size:85px}
  .cat-wrap{bottom:39%;width:110px;height:132px}
  .action-strip{bottom:calc(env(safe-area-inset-bottom) + 150px);width:94%;gap:8px}
  .action{min-height:112px;border-radius:20px;padding:9px}.action .emoji{font-size:36px}.action small{font-size:10px}
  .status-panel{bottom:calc(env(safe-area-inset-bottom) + 52px);width:94%;padding:9px;gap:4px}
  .stat{padding:3px}.stat-head{font-size:10px}.bar{height:9px}
}
@media(max-width:520px){
  .brand{font-size:18px}.name-box{padding:6px 9px}.level-box{width:160px}.wallet{left:56%;gap:5px}.currency{min-width:100px;font-size:13px;padding:6px 8px}.currency .icon{font-size:19px}.round-plus{width:24px;height:24px;font-size:15px}
  .tip-card{display:none}.side-menu{top:125px}.cat-wrap{bottom:40%;}.action-strip{grid-template-columns:repeat(4,1fr)}.action{min-height:96px}.action .emoji{font-size:31px}.action strong{font-size:11px}
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="bg-room">
    <div class="wall"></div><div class="floor"></div>
    <div class="window"></div><div class="curtain left"></div><div class="curtain right"></div>
    <div class="plant">🪴</div><div class="cat-tree">🪵</div><div class="cat-bed">🛖</div><div class="rug"></div>
  </div>

  <div class="top-left">
    <div class="brand">🐾 냥이의 집</div>
    <div class="name-box"><input id="catName" value="냥이" maxlength="12"><span>✏️</span></div>
    <div class="level-box">
      <div class="level-row"><span>Lv. <b id="levelView">3</b></span><span><b id="expView">60</b> / 120</span></div>
      <div class="level-bar"><div class="level-fill" id="levelFill"></div></div>
    </div>
  </div>

  <div class="wallet">
    <div class="currency"><span class="icon">🪙</span><b id="coinView">215</b><button class="round-plus" id="coinPlus">+</button></div>
    <div class="currency"><span class="icon">💎</span><b id="gemView">5</b><button class="round-plus" id="gemPlus">+</button></div>
  </div>

  <button class="mode-btn" id="modeBtn">📺 화면 모드 전환</button>

  <div class="side-menu">
    <button class="side-btn"><span>⚙️</span>설정</button>
    <button class="side-btn"><span>📓</span>일지</button>
    <button class="side-btn"><span>📷</span>사진</button>
  </div>

  <div class="tip-card"><b> 더블 탭/클릭!</b><br>빈 공간을 두 번 터치하면 전체화면이 전환돼요!</div>

  <div class="cat-wrap" id="catWrap">
    <div class="heart-bubble" id="heartBubble">💗</div>
    <div class="cat">
      <div class="tail"></div>
      <div class="body"></div>
      <div class="leg l"></div><div class="leg r"></div>
      <div class="head"><div class="ear left"></div><div class="ear right"></div><div class="eye left"></div><div class="eye right"></div><div class="nose"></div></div>
    </div>
  </div>

  <div class="action-strip">
    <button class="action feed" id="feedBtn"><div class="emoji">🍕</div><strong>츄르 주기</strong><small>-10 배고픔</small></button>
    <button class="action play" id="playBtn"><div class="emoji">🧶</div><strong>장난감 놀이</strong><small>-10 에너지</small></button>
    <button class="action clean" id="cleanBtn"><div class="emoji">🧼</div><strong>세수시키기</strong><small>-10 에너지</small></button>
    <button class="action sleep-btn" id="sleepBtn"><div class="emoji">🌙</div><strong>캣타워 수면</strong><small>+20 에너지</small></button>
  </div>

  <div class="status-panel">
    <div class="stat"><div class="stat-head"><span>🍴 배고픔</span><b id="hungerV">55</b></div><div class="bar"><div class="fill hunger" id="hungerFill"></div></div></div>
    <div class="stat"><div class="stat-head"><span>💗 행복도</span><b id="happyV">75</b></div><div class="bar"><div class="fill happy" id="happyFill"></div></div></div>
    <div class="stat"><div class="stat-head"><span>💧 청결도</span><b id="cleanV">80</b></div><div class="bar"><div class="fill clean-fill" id="cleanFill"></div></div></div>
    <div class="stat"><div class="stat-head"><span>⚡ 에너지</span><b id="energyV">60</b></div><div class="bar"><div class="fill energy" id="energyFill"></div></div></div>
  </div>

  <div class="bottom-note">💡 TIP: 고양이를 터치하면 다양한 반응을 보여줘요!</div>
  <div class="toast" id="toast"></div>
</div>

<script>
(()=>{
'use strict';
const STORAGE_KEY='warmBlackCatPet_v1';
const app=document.getElementById('app');
const catWrap=document.getElementById('catWrap');
const heartBubble=document.getElementById('heartBubble');
const toast=document.getElementById('toast');
const nameInput=document.getElementById('catName');
const modeBtn=document.getElementById('modeBtn');

let state={
  name:'냥이',level:3,exp:60,expMax:120,coin:215,gem:5,
  hunger:55,happy:75,clean:80,energy:60,lastSeen:Date.now()
};
let busy=false,lastTap=0,audioCtx=null;

const clamp=v=>Math.max(0,Math.min(100,v));
const wait=ms=>new Promise(r=>setTimeout(r,ms));

function load(){
  try{
    const s=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');
    if(s) state={...state,...s};
  }catch(e){}
  nameInput.value=state.name;
}
function save(){
  state.name=nameInput.value.trim()||'냥이';
  state.lastSeen=Date.now();
  localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
}
function render(){
  levelView.textContent=state.level;expView.textContent=Math.floor(state.exp);
  levelFill.style.width=Math.min(100,state.exp/state.expMax*100)+'%';
  coinView.textContent=state.coin;gemView.textContent=state.gem;
  hungerV.textContent=Math.round(state.hunger);happyV.textContent=Math.round(state.happy);
  cleanV.textContent=Math.round(state.clean);energyV.textContent=Math.round(state.energy);
  hungerFill.style.width=state.hunger+'%';happyFill.style.width=state.happy+'%';
  cleanFill.style.width=state.clean+'%';energyFill.style.width=state.energy+'%';
  modeBtn.textContent=(document.fullscreenElement||document.webkitFullscreenElement)?'📱 일반 모드':'📺 화면 모드 전환';
}
function showToast(t){
  toast.textContent=t;toast.classList.add('show');clearTimeout(window._tt);
  window._tt=setTimeout(()=>toast.classList.remove('show'),1400);
}
function addExp(n){
  state.exp+=n;
  while(state.exp>=state.expMax){
    state.exp-=state.expMax;state.level++;state.expMax+=20;state.coin+=30;
    fx('✨',8);showToast('레벨 업! Lv.'+state.level+' 🎉');
  }
}
function fx(sym='💗',count=5){
  const r=catWrap.getBoundingClientRect();
  for(let i=0;i<count;i++){
    const e=document.createElement('div');e.className='floatfx';e.textContent=sym;
    e.style.left=(r.left+r.width/2+(Math.random()-.5)*90)+'px';
    e.style.top=(r.top+r.height*.3+(Math.random()-.5)*25)+'px';
    document.body.appendChild(e);setTimeout(()=>e.remove(),1200);
  }
}
function tone(freq=480,d=.1){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;o.type='triangle';g.gain.value=.035;
    o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+d);o.stop(audioCtx.currentTime+d);
  }catch(e){}
}
function meow(){tone(520,.08);setTimeout(()=>tone(350,.13),70)}
function clearAnim(){['tail','jump','shake','sleep','zoom'].forEach(c=>catWrap.classList.remove(c))}
function pet(){
  if(busy)return;
  clearAnim();catWrap.classList.add('tail');heartBubble.classList.add('show');fx('💗',5);meow();
  state.happy=clamp(state.happy+3);addExp(2);render();save();
  setTimeout(()=>{catWrap.classList.remove('tail');heartBubble.classList.remove('show')},1200);
}
async function action(kind){
  if(busy)return;busy=true;clearAnim();
  if(kind==='feed'){
    state.hunger=clamp(state.hunger+18);state.happy=clamp(state.happy+5);state.coin=Math.max(0,state.coin-5);addExp(6);
    catWrap.classList.add('tail');fx('😋',4);showToast('츄르 냠냠!');await wait(1300);
  }
  if(kind==='play'){
    if(state.energy<10){showToast('에너지가 부족해요!');busy=false;return}
    state.energy=clamp(state.energy-10);state.happy=clamp(state.happy+16);state.hunger=clamp(state.hunger-4);addExp(9);
    catWrap.classList.add('jump');showToast('장난감 와락!');tone(760,.09);await wait(1100);
  }
  if(kind==='clean'){
    if(state.energy<6){showToast('조금 쉬고 세수해요!');busy=false;return}
    state.energy=clamp(state.energy-6);state.clean=clamp(state.clean+20);state.happy=clamp(state.happy+3);addExp(7);
    catWrap.classList.add('shake');fx('💧',7);showToast('털 털! 냥냥 세수');await wait(1000);
  }
  if(kind==='sleep'){
    state.energy=clamp(state.energy+22);state.hunger=clamp(state.hunger-5);state.happy=clamp(state.happy+4);addExp(5);
    catWrap.classList.add('sleep');showToast('골골송... Zzz');for(let i=0;i<5;i++)setTimeout(()=>fx('Z',1),i*350);await wait(2100);
  }
  clearAnim();busy=false;render();save();
}
function randomMotion(){
  if(busy||document.hidden)return;
  const arr=['tail','jump','shake','zoom'];const m=arr[Math.floor(Math.random()*arr.length)];
  clearAnim();catWrap.classList.add(m);setTimeout(()=>catWrap.classList.remove(m),m==='zoom'?2400:1200);
}
function decay(){
  if(busy&&catWrap.classList.contains('sleep'))return;
  state.hunger=clamp(state.hunger-.5);state.happy=clamp(state.happy-.15);state.clean=clamp(state.clean-.12);state.energy=clamp(state.energy-.1);
  render();save();
}
function isFullscreen(){return !!(document.fullscreenElement||document.webkitFullscreenElement)}
async function toggleFullscreen(){
  try{
    if(!isFullscreen()){
      const el=document.documentElement;
      if(el.requestFullscreen) await el.requestFullscreen();
      else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      else showToast('이 브라우저는 전체화면을 지원하지 않아요.');
    }else{
      if(document.exitFullscreen) await document.exitFullscreen();
      else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
      else if(document.webkitCancelFullScreen) document.webkitCancelFullScreen();
    }
  }catch(e){showToast('전체화면 전환이 제한되었어요.')}
  setTimeout(render,100);
}
function interactiveTarget(t){return !!t.closest('button,input,.action-strip,.status-panel,.side-menu,.top-left,.wallet,.cat-wrap')}

app.addEventListener('dblclick',e=>{if(interactiveTarget(e.target))return;e.preventDefault();toggleFullscreen()});
app.addEventListener('touchstart',e=>{
  if(interactiveTarget(e.target))return;
  const now=Date.now();
  if(now-lastTap<320){e.preventDefault();lastTap=0;toggleFullscreen()}else lastTap=now;
},{passive:false});

modeBtn.addEventListener('click',toggleFullscreen);
document.addEventListener('fullscreenchange',render);
document.addEventListener('webkitfullscreenchange',render);

catWrap.addEventListener('click',pet);
feedBtn.addEventListener('click',()=>action('feed'));
playBtn.addEventListener('click',()=>action('play'));
cleanBtn.addEventListener('click',()=>action('clean'));
sleepBtn.addEventListener('click',()=>action('sleep'));
coinPlus.addEventListener('click',()=>{state.coin+=50;render();save();showToast('코인 +50')});
gemPlus.addEventListener('click',()=>{state.gem+=1;render();save();showToast('보석 +1')});
nameInput.addEventListener('change',()=>{state.name=nameInput.value.trim()||'냥이';save();showToast('이름 저장 완료!')});

load();render();
setInterval(randomMotion,7000);
setInterval(decay,12000);
window.addEventListener('beforeunload',save);
})();
</script>
</body>
</html>
