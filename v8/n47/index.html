<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로게이머 키우기 🎮🐾</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --card-bg: #16213e;
            --primary-color: #0f3460;
            --accent-color: #e94560;
            --text-color: #eaeaea;
        }

        * {
            box-sizing: border-box;
            font-family: 'DungGeunMo', 'Pretendard', monospace, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 420px;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 4px solid #0f3460;
            text-align: center;
            position: relative;
        }

        /* 캐릭터 선택 화면 */
        .select-screen {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 500px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .select-screen::-webkit-scrollbar {
            width: 6px;
        }
        .select-screen::-webkit-scrollbar-thumb {
            background: #0f3460;
            border-radius: 3px;
        }

        .select-screen h2 {
            color: #ffcc00;
            text-shadow: 2px 2px #000;
            margin-bottom: 10px;
        }

        .pet-choice-btn {
            background: #0f3460;
            border: 3px solid #e94560;
            color: #fff;
            border-radius: 12px;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .pet-choice-btn:hover {
            transform: scale(1.03);
            background: #e94560;
        }

        /* 상단 레벨 및 경험치 */
        .header-info {
            background: #0f3460;
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 2px solid #e94560;
        }

        .level-title {
            font-size: 0.95rem;
            font-weight: bold;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: #ffcc00;
        }

        .exp-bar-container {
            background: #1a1a2e;
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
            border: 2px solid #4a4a8a;
        }

        .exp-bar {
            background: #e94560;
            height: 100%;
            width: 0%;
            transition: width 0.3s;
        }

        /* 펫 영역 & 애니메이션 */
        .pet-display {
            height: 160px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            margin: 8px 0;
            overflow: hidden;
            background: #111827;
            border-radius: 15px;
            border: 2px dashed #374151;
        }

        .speech-bubble {
            position: absolute;
            top: 8px;
            background: #ffffff;
            color: #111827;
            padding: 5px 10px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.8rem;
            animation: fadeIn 0.3s;
            z-index: 10;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            max-width: 90%;
            word-break: keep-all;
        }

        .pet-avatar {
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
            width: 90px;
            height: 90px;
            animation: moveAndBounce 4s infinite alternate ease-in-out;
        }

        .pet-avatar svg {
            width: 85px;
            height: 85px;
        }

        @keyframes moveAndBounce {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-5px) rotate(-2deg); }
            100% { transform: translateY(0) rotate(2deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 상태 바 목록 */
        .stats-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
            background: #111827;
            padding: 10px;
            border-radius: 12px;
        }

        .stat-row {
            display: flex;
            align-items: center;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .stat-label {
            width: 75px;
            text-align: left;
        }

        .stat-bar-bg {
            flex-grow: 1;
            background: #1f2937;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            margin: 0 6px;
            border: 1px solid #374151;
        }

        .stat-bar-fill {
            height: 100%;
            width: 70%;
            border-radius: 4px;
            transition: width 0.3s, background-color 0.3s;
        }

        .stat-val {
            width: 30px;
            text-align: right;
        }

        /* 상호작용 버튼 Grid */
        .actions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
        }

        .btn {
            border: none;
            padding: 9px;
            font-size: 0.8rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 3px 0 rgba(0,0,0,0.3);
            transition: transform 0.1s;
            color: #fff;
        }

        .btn:active {
            transform: translateY(3px);
            box-shadow: none;
        }

        .btn-feed { background-color: #d97706; }
        .btn-play { background-color: #dc2626; }
        .btn-squad { background-color: #b91c1c; }
        .btn-clean { background-color: #059669; }
        .btn-wipe { background-color: #0284c7; }
        .btn-sleep { background-color: #7c3aed; }

        .btn-minigame {
            background-color: #4f46e5;
            width: 100%;
            padding: 10px;
            font-size: 0.9rem;
            margin-top: 2px;
        }

        /* 모달 스타일 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            border: 3px solid #ffcc00;
            width: 90%;
            max-width: 350px;
            text-align: center;
        }

        .modal-content h3 {
            color: #ffcc00;
            margin-bottom: 10px;
        }

        .team-btn {
            background: #0f3460;
            border: 2px solid #e94560;
            color: #fff;
            padding: 9px;
            margin: 5px 0;
            width: 100%;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .team-btn:hover {
            background: #e94560;
        }

        /* 발로란트 에임 미니게임 스타일 */
        .valorant-aim-box {
            width: 100%;
            height: 240px;
            background: #0f172a;
            border: 2px solid #38bdf8;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            margin: 10px 0;
            cursor: crosshair;
        }

        .val-target {
            position: absolute;
            width: 30px;
            height: 30px;
            background: #ff4655;
            border-radius: 50%;
            border: 2px solid #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 8px #ff4655;
        }

        .val-hud {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #38bdf8;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <div id="select-screen" class="select-screen">
        <h2>🎮 프로게이머 지망생 선택</h2>
        <button class="pet-choice-btn" onclick="selectPet('parrot')">🦜 앵무새 (피지컬 괴물)</button>
        <button class="pet-choice-btn" onclick="selectPet('hamster')">🐹 햄스터 (오더 장인)</button>
        <button class="pet-choice-btn" onclick="selectPet('dog')">🐶 강아지 (든든한 탱커)</button>
        <button class="pet-choice-btn" onclick="selectPet('cat')">🐱 고양이 (냉혹한 딜러)</button>
        <button class="pet-choice-btn" onclick="selectPet('horse')">🐴 말 (치고 빠지는 스퍼터)</button>
    </div>

    <div id="game-screen" class="hidden">
        <div class="header-info">
            <div class="level-title" id="level-display"></div>
            <div class="exp-bar-container">
                <div class="exp-bar" id="exp-bar"></div>
            </div>
        </div>

        <div class="pet-display" id="pet-display">
            <div class="speech-bubble" id="speech-bubble">랭크 게임 돌리러 가자!</div>
            <div class="pet-avatar" id="pet-avatar"></div>
        </div>

        <div class="stats-container">
            <div class="stat-row">
                <span class="stat-label">🍔 포만감</span>
                <div class="stat-bar-bg"><div class="stat-bar-fill" id="bar-fullness" style="background-color: #f59e0b;"></div></div>
                <span class="stat-val" id="val-fullness">70</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">⚽ 멘탈</span>
                <div class="stat-bar-bg"><div class="stat-bar-fill" id="bar-happiness" style="background-color: #ef4444;"></div></div>
                <span class="stat-val" id="val-happiness">70</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">🧼 청결</span>
                <div class="stat-bar-bg"><div class="stat-bar-fill" id="bar-cleanliness" style="background-color: #10b981;"></div></div>
                <span class="stat-val" id="val-cleanliness">70</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">🔋 에너지</span>
                <div class="stat-bar-bg"><div class="stat-bar-fill" id="bar-energy" style="background-color: #8b5cf6;"></div></div>
                <span class="stat-val" id="val-energy">70</span>
            </div>
        </div>

        <div class="actions-grid">
            <button class="btn btn-feed" onclick="interact('feed')">🍕 야식 먹기</button>
            <button class="btn btn-play" id="btn-play-mode" onclick="interact('play')">🎮 솔랭 돌리기</button>
            <button class="btn btn-squad" id="btn-squad-mode" onclick="interact('squad')">👥 5인큐 돌리기</button>
            <button class="btn btn-clean" id="btn-clean" onclick="interact('clean')">🚿 샤워하기</button>
            <button class="btn btn-wipe" onclick="interact('wipe')">⌨️ 키보드 닦기</button>
            <button class="btn btn-sleep" onclick="interact('sleep')">💤 숙면 취하기</button>
        </div>

        <button class="btn btn-minigame" onclick="openValorantMinigame()">🎯 발로란트 에임 훈련 하기</button>
    </div>
</div>

<!-- 프로 팀 선택 모달 -->
<div id="team-modal" class="modal-overlay hidden">
    <div class="modal-content">
        <h3>🏆 프로 팀 선택</h3>
        <p style="font-size: 0.8rem; margin-bottom: 12px;">입단할 프로팀을 선택하세요!</p>
        <button class="team-btn" onclick="selectTeam('T1')">T1</button>
        <button class="team-btn" onclick="selectTeam('C9')">C9</button>
        <button class="team-btn" onclick="selectTeam('GENG')">GENG</button>
        <button class="team-btn" onclick="selectTeam('SENTINALS')">SENTINALS</button>
        <button class="team-btn" onclick="selectTeam('LOUD')">LOUD</button>
    </div>
</div>

<!-- 종목 선택 모달 -->
<div id="game-choice-modal" class="modal-overlay hidden">
    <div class="modal-content">
        <h3>🎮 종목 선택</h3>
        <p style="font-size: 0.8rem; margin-bottom: 12px;">도전할 종목을 선택하세요!</p>
        <button class="team-btn" onclick="selectGameCategory('롤')">리그 오브 레전드 (LoL)</button>
        <button class="team-btn" onclick="selectGameCategory('발로란트')">발로란트</button>
        <button class="team-btn" onclick="selectGameCategory('오버워치')">오버워치</button>
        <button class="team-btn" onclick="selectGameCategory('마블 라이벌즈')">마블 라이벌즈</button>
    </div>
</div>

<!-- 만렙 달성 시: 이적 또는 팀 잔류 선택 모달 -->
<div id="career-choice-modal" class="modal-overlay hidden">
    <div class="modal-content">
        <h3>🌟 시즌 종료 & 계약 협상</h3>
        <p id="career-msg" style="font-size: 0.8rem; margin-bottom: 12px;">만렙(Champions 우승)을 달성했습니다! 거취를 선택하세요.</p>
        <button class="team-btn" onclick="chooseCareerOption('stay')" style="background-color: #059669; border-color: #34d399;">🤝 현재 팀에 남기 (연봉 인상 & 티어 유지)</button>
        <button class="team-btn" onclick="chooseCareerOption('transfer')" style="background-color: #d97706; border-color: #fbbf24;">✈️ 다른 프로 팀으로 이적하기</button>
    </div>
</div>

<!-- 발로란트 에임 훈련 미니게임 모달 -->
<div id="minigame-modal" class="modal-overlay hidden">
    <div class="modal-content" style="max-width: 380px;">
        <h3>🎯 발로란트 슈팅 훈련</h3>
        <div class="val-hud">
            <span id="val-score">적중: 0</span>
            <span id="val-time-left">시간: 10초</span>
        </div>
        <div class="valorant-aim-box" id="aim-box" onclick="recordMiss()"></div>
        <button class="team-btn" onclick="closeValorantMinigame()" style="background-color: #dc2626; border-color: #f87171; margin-top: 5px;">훈련 종료</button>
    </div>
</div>

<script>
    const eggSvg = `
    <svg viewBox="0 0 16 16" width="100" height="100" style="image-rendering: pixelated;">
        <rect x="5" y="2" width="6" height="1" fill="#4b5563"/>
        <rect x="4" y="3" width="8" height="2" fill="#9ca3af"/>
        <rect x="3" y="5" width="10" height="7" fill="#e5e7eb"/>
        <rect x="4" y="12" width="8" height="2" fill="#9ca3af"/>
        <rect x="5" y="14" width="6" height="1" fill="#4b5563"/>
    </svg>`;

    const petsLevel2 = {
        parrot: `<svg viewBox="0 0 16 16" width="100" height="100" style="image-rendering: pixelated;"><rect x="5" y="2" width="6" height="6" fill="#ef4444"/><rect x="6" y="3" width="2" height="2" fill="#fff"/><rect x="7" y="4" width="1" height="1" fill="#000"/><rect x="11" y="4" width="2" height="2" fill="#f59e0b"/><rect x="4" y="6" width="3" height="5" fill="#10b981"/><rect x="7" y="8" width="4" height="4" fill="#facc15"/><rect x="2" y="12" width="4" height="2" fill="#3b82f6"/><rect x="3" y="13" width="2" height="1" fill="#1d4ed8"/></svg>`,
        hamster: `<svg viewBox="0 0 16 16" width="100" height="100" style="image-rendering: pixelated;"><rect x="4" y="3" width="2" height="2" fill="#d1d5db"/><rect x="10" y="3" width="2" height="2" fill="#d1d5db"/><rect x="4" y="5" width="8" height="7" fill="#fbbf24"/><rect x="6" y="7" width="1" height="1" fill="#000"/><rect x="9" y="7" width="1" height="1" fill="#000"/><rect x="2" y="12" width="4" height="2" fill="#3b82f6"/><rect x="3" y="13" width="2" height="1" fill="#1d4ed8"/></svg>`,
        dog: `<svg viewBox="0 0 16 16" width="100" height="100" style="image-rendering: pixelated;"><rect x="3" y="4" width="2" height="3" fill="#9ca3af"/><rect x="11" y="4" width="2" height="3" fill="#9ca3af"/><rect x="4" y="3" width="8" height="7" fill="#d1d5db"/><rect x="6" y="5" width="1" height="1" fill="#000"/><rect x="9" y="5" width="1" height="1" fill="#000"/><rect x="2" y="12" width="4" height="2" fill="#3b82f6"/><rect x="3" y="13" width="2" height="1" fill="#1d4ed8"/></svg>`,
        cat: `<svg viewBox="0 0 16 16" width="100" height="100" style="image-rendering: pixelated;"><rect x="4" y="2" width="2" height="3" fill="#fb923c"/><rect x="10" y="2" width="2" height="3" fill="#fb923c"/><rect x="4" y="4" width="8" height="6" fill="#fdba74"/><rect x="5" y="6" width="1" height="1" fill="#000"/><rect x="10" y="6" width="1" height="1" fill="#000"/><rect x="2" y="12" width="4" height="2" fill="#3b82f6"/><rect x="3" y="13" width="2" height="1" fill="#1d4ed8"/></svg>`,
        horse: `<svg viewBox="0 0 16 16" width="100" height="100" style="image-rendering: pixelated;"><rect x="9" y="1" width="2" height="3" fill="#451a03"/><rect x="7" y="4" width="5" height="6" fill="#a8a29e"/><rect x="10" y="5" width="1" height="1" fill="#000"/><rect x="2" y="12" width="4" height="2" fill="#3b82f6"/><rect x="3" y="13" width="2" height="1" fill="#1d4ed8"/></svg>`
    };

    const petData = {
        parrot: { name: '앵무새' },
        hamster: { name: '햄스터' },
        dog: { name: '강아지' },
        cat: { name: '고양이' },
        horse: { name: '말' }
    };

    let selectedPetType = '';
    let level = 1;
    let exp = 0;
    const maxExp = 100;
    let stats = { fullness: 70, happiness: 70, cleanliness: 70, energy: 70 };
    let cleanCount = 0; 
    let feedCount = 0; 
    let sleepCount = 0; 
    let wipeCount = 0;
    let consecutiveLosses = 0; 
    let currentTeam = '';
    let currentGame = '롤';

    // 발로란트 미니게임 변수
    let targetInterval = null;
    let gameTimer = null;
    let score = 0;
    let timeLeft = 10;

    function selectPet(type) {
        selectedPetType = type;
        document.getElementById('select-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');

        updateAvatarUI();
        updateHeaderUI();
        updateStatsUI();
        updateGameButtons();
        setInterval(decayStats, 3000);
    }

    function updateAvatarUI() {
        const avatarElem = document.getElementById('pet-avatar');
        if (level === 1) {
            avatarElem.innerHTML = eggSvg;
        } else {
            avatarElem.innerHTML = petsLevel2[selectedPetType];
        }
    }

    function updateHeaderUI() {
        if (!selectedPetType) return;
        const name = petData[selectedPetType].name;
        
        let gearType = '';
        if (level <= 3) gearType = '사무용 장비';
        else if (level <= 6) gearType = '일반용 장비';
        else if (level <= 9) gearType = '가성비 장비';
        else if (level <= 12) gearType = '중간용 장비';
        else gearType = '프로용 장비';

        let title = `LV.${level} 🖱️ ${name} (${gearType})`;
        if (currentTeam) {
            let tournamentStage = '국내 리그(VCL)';
            if (level >= 4 && level <= 6) {
                tournamentStage = 'VCT 국제 리그';
            } else if (level >= 7 && level <= 9) {
                tournamentStage = 'VCT 마스터스 (Masters)';
            } else if (level >= 10 && level <= 12) {
                tournamentStage = 'VCT 락인 / 상위 스테이지';
            } else if (level >= 13) {
                tournamentStage = '월드 챔피언십 (Champions) 🏆';
            }
            title += ` [${currentTeam} / ${currentGame} - ${tournamentStage}]`;
        }

        document.getElementById('level-display').innerHTML = title;
        document.getElementById('exp-bar').style.width = `${(exp / maxExp) * 100}%`;
    }

    function updateGameButtons() {
        const playBtn = document.getElementById('btn-play-mode');
        const squadBtn = document.getElementById('btn-squad-mode');
        
        if (currentGame === '롤') {
            playBtn.innerText = '🎮 솔랭 돌리기';
            squadBtn.innerText = '👥 5인큐 돌리기';
        } else if (currentGame === '발로란트') {
            playBtn.innerText = '🎮 경쟁전 돌리기';
            squadBtn.innerText = '👥 스커미시(내전)';
        } else if (currentGame === '오버워치') {
            playBtn.innerText = '🎮 경쟁전 돌리기';
            squadBtn.innerText = '👥 6인 그룹큐';
        } else if (currentGame === '마블 라이벌즈') {
            playBtn.innerText = '🎮 랭크전 돌리기';
            squadBtn.innerText = '👥 스쿼드 매치';
        }
    }

    function addExperience(amount) {
        exp += amount;
        if (exp >= maxExp) {
            if (level < 15) {
                level++;
                exp = exp - maxExp;
                
                if (currentTeam && (level === 4 || level === 7 || level === 10 || level === 13)) {
                    let nextTournamentName = '';
                    if (level === 4) nextTournamentName = 'VCT 국제 리그 진출!';
                    else if (level === 7) nextTournamentName = '글로벌 🌟 마스터스 (Masters) 진출!';
                    else if (level === 10) nextTournamentName = '상위 스테이지 및 플레이오프 격돌!';
                    else if (level === 13) nextTournamentName = '최고 권위의 무대 🏆 챔피언스 (Champions) 진출!';
                    
                    setSpeechBubble(`🚀 성적으로 증명했다! ${nextTournamentName}`);
                } else {
                    setSpeechBubble(`🔥 랭크 티어 상승! LV.${level} 달성!`);
                }

                updateAvatarUI();
            } else {
                exp = maxExp;
                if (!currentTeam) {
                    document.getElementById('team-modal').classList.remove('hidden');
                } else {
                    document.getElementById('career-choice-modal').classList.remove('hidden');
                }
            }
        }
        updateHeaderUI();
    }

    function selectTeam(teamName) {
        currentTeam = teamName;
        document.getElementById('team-modal').classList.add('hidden');
        document.getElementById('game-choice-modal').classList.remove('hidden');
    }

    function selectGameCategory(gameName) {
        currentGame = gameName;
        document.getElementById('game-choice-modal').classList.add('hidden');
        setSpeechBubble(`🎉 ${currentTeam} 입단 & ${currentGame} 종목 전향 완료! 새로운 마음으로 LV.1부터 다시 시작!`);
        level = 1;
        exp = 0;
        updateAvatarUI();
        updateHeaderUI();
        updateGameButtons();
    }

    function chooseCareerOption(option) {
        document.getElementById('career-choice-modal').classList.add('hidden');
        if (option === 'stay') {
            setSpeechBubble(`🤝 ${currentTeam}과 재계약 성공! 전력 보강 후 계속 달립니다.`);
            level = 10; // 레벨을 약간 낮춰서 계속 플레이할 수 있게 세팅
            exp = 0;
        } else {
            // 이적 선택 시 팀 선택 및 종목 선택 모달로 이동
            document.getElementById('team-modal').classList.remove('hidden');
        }
        updateHeaderUI();
    }

    function decayStats() {
        stats.fullness = Math.max(0, stats.fullness - 3);
        stats.happiness = Math.max(0, stats.happiness - 2);
        stats.cleanliness = Math.max(0, stats.cleanliness - 1);
        stats.energy = Math.max(0, stats.energy - 1);
        updateStatsUI();
    }

    function updateStatsUI() {
        document.getElementById('val-fullness').innerText = stats.fullness;
        document.getElementById('val-happiness').innerText = stats.happiness;
        document.getElementById('val-cleanliness').innerText = stats.cleanliness;
        document.getElementById('val-energy').innerText = stats.energy;

        document.getElementById('bar-fullness').style.width = `${stats.fullness}%`;
        document.getElementById('bar-happiness').style.width = `${stats.happiness}%`;
        document.getElementById('bar-cleanliness').style.width = `${stats.cleanliness}%`;
        document.getElementById('bar-energy').style.width = `${stats.energy}%`;
    }

    function handleLoss(modeName) {
        consecutiveLosses++;
        const drop = Math.floor(Math.random() * 21) + 10; 
        stats.happiness = Math.max(0, stats.happiness - drop);
        
        let msg = `${modeName} 패배! 멘탈이 ${drop} 만큼 깨졌다... 😭 (연패: ${consecutiveLosses})`;
        let gainExp = 5 - (consecutiveLosses * 5); 

        if (consecutiveLosses >= 3) {
            consecutiveLosses = 0;
            if (level > 1) {
                level--;
                msg = `🚨 3연패 충격! 1레벨 강등당했습니다! (현재 LV.${level})`;
            } else {
                msg = `🚨 3연패 충격이지만 이미 LV.1입니다! 정신 차리자...`;
            }
            gainExp = -10;
        }

        return { msg, gainExp };
    }

    function interact(action) {
        let msg = '';
        let gainExp = 15;

        if (action !== 'clean') cleanCount = 0; 
        if (action !== 'feed') feedCount = 0;
        if (action !== 'sleep') sleepCount = 0; 
        if (action !== 'wipe') wipeCount = 0;

        let loseChance = (sleepCount >= 3) ? 0.7 : 0.4;

        switch (action) {
            case 'feed': 
                feedCount++;
                if (feedCount < 3) {
                    stats.fullness = Math.min(100, stats.fullness + 30); 
                    msg = '피자 냠냠! 에너지 충전 완료 🍕'; 
                } else {
                    stats.happiness = Math.max(0, stats.happiness - 30);
                    msg = '너무 배불러서 게임 집중 불가... 🤢';
                    gainExp = 0;
                }
                consecutiveLosses = 0;
                break;
            case 'play': 
            case 'squad':
                let modeName = (action === 'play') ? '랭크 게임' : '팀큐';
                if (sleepCount >= 3) modeName = '몽롱한 상태의 ' + modeName;

                if (wipeCount >= 2) {
                    stats.happiness = Math.max(0, stats.happiness - 30);
                    msg = '⌨️ 에러 발생! 키보드 접촉 불량으로 게임 시작 직후 튕겼다! (행복 -30)';
                    gainExp = -5;
                    wipeCount = 0;
                } else if (Math.random() < loseChance) {
                    const res = handleLoss(modeName);
                    msg = res.msg;
                    gainExp = res.gainExp;
                } else {
                    consecutiveLosses = 0;
                    stats.happiness = Math.min(100, stats.happiness + 30); 
                    msg = `${currentGame} 승리! 🎮`; 
                }
                break;
            case 'clean': 
                cleanCount++; 
                if (cleanCount < 3) {
                    stats.cleanliness = Math.min(100, stats.cleanliness + 40);
                    msg = '상쾌하게 씻고 손목 풀기 완료! 🚿';
                } else {
                    stats.happiness = Math.max(0, stats.happiness - 30); 
                    msg = '게임 끊기 싫은데 씻으라니! 😡'; 
                    gainExp = 0; 
                }
                break;
            case 'wipe':
                wipeCount++;
                stats.cleanliness = Math.min(100, stats.cleanliness + 25);
                stats.happiness = Math.min(100, stats.happiness + 10);
                if (wipeCount >= 2) {
                    msg = '구석구석 키보드를 너무 자주 닦았더니 선이 꼬였다... ⌨️💦';
                } else {
                    msg = '구석구석 키보드를 반짝반짝 닦았다! ✨⌨️';
                }
                gainExp = 10;
                break;
            case 'sleep': 
                sleepCount++;
                stats.energy = Math.min(100, stats.energy + 50); 
                if (sleepCount >= 3) {
                    msg = '너무 많이 자서 오히려 잠이 안 깨고 몽롱하다... 😴💤 (집중력 저하!)';
                    stats.happiness = Math.max(0, stats.happiness - 10);
                } else {
                    msg = '꿀잠 자고 피지컬 회복! 💤'; 
                }
                break;
        }
        
        addExperience(gainExp);
        setSpeechBubble(msg);
        updateStatsUI();
    }

    function setSpeechBubble(text) {
        const bubble = document.getElementById('speech-bubble');
        bubble.innerText = text;
        bubble.style.animation = 'none';
        bubble.offsetHeight; 
        bubble.style.animation = null;
    }

    // --- 발로란트 에임 훈련 미니게임 로직 ---
    function openValorantMinigame() {
        document.getElementById('minigame-modal').classList.remove('hidden');
        score = 0;
        timeLeft = 10;
        document.getElementById('val-score').innerText = `적중: ${score}`;
        document.getElementById('val-time-left').innerText = `시간: ${timeLeft}초`;
        document.getElementById('aim-box').innerHTML = '';

        gameTimer = setInterval(() => {
            timeLeft--;
            document.getElementById('val-time-left').innerText = `시간: ${timeLeft}초`;
            if (timeLeft <= 0) {
                endValorantMinigame();
            }
        }, 1000);

        targetInterval = setInterval(spawnValTarget, 700);
    }

    function spawnValTarget() {
        const box = document.getElementById('aim-box');
        box.innerHTML = ''; // 한 번에 하나의 타겟만 유지

        const target = document.createElement('div');
        target.classList.add('val-target');

        const maxX = box.clientWidth - 35;
        const maxY = box.clientHeight - 35;
        const randomX = Math.floor(Math.random() * maxX) + 15;
        const randomY = Math.floor(Math.random() * maxY) + 15;

        target.style.left = `${randomX}px`;
        target.style.top = `${randomY}px`;

        target.onclick = (e) => {
            e.stopPropagation(); // 배경 클릭(빗나감) 이벤트 방지
            score++;
            document.getElementById('val-score').innerText = `적중: ${score}`;
            spawnValTarget();
        };

        box.appendChild(target);
    }

    function recordMiss() {
        // 박스 빈 공간을 클릭했을 때 (빗나감 판정 효과용)
        score = Math.max(0, score - 1);
        document.getElementById('val-score').innerText = `적중: ${score}`;
    }

    function endValorantMinigame() {
        clearInterval(gameTimer);
        clearInterval(targetInterval);
        document.getElementById('minigame-modal').classList.add('hidden');

        let rewardExp = score * 4;
        addExperience(rewardExp);
        setSpeechBubble(`🎯 발로란트 에임 훈련 완료! 총 ${score}명 헤드샷 적중! (+${rewardExp} EXP)`);
    }

    function closeValorantMinigame() {
        clearInterval(gameTimer);
        clearInterval(targetInterval);
        document.getElementById('minigame-modal').classList.add('hidden');
    }
</script>
