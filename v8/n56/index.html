<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지우의 리자몽 키우기 게임</title>
    <style>
        body {
            /* 푸른 하늘과 초원 배경 톤 */
            background: linear-gradient(135deg, #e3f2fd 0%, #e8f5e9 100%);
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #2e7d32;
        }
        .game-container {
            background-color: #ffffff;
            border-radius: 28px;
            box-shadow: 0 10px 25px rgba(33, 150, 243, 0.15);
            width: 420px;
            padding: 24px;
            text-align: center;
            box-sizing: border-box;
            border: 4px solid #bbdefb;
        }
        h2 {
            margin-top: 0;
            color: #1976d2;
            font-size: 26px;
        }
        .status-bar-container {
            background-color: #f1f8e9;
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 16px;
            border: 2px solid #dcedc8;
        }
        .gauge-row {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
        }
        .gauge-row:last-child {
            margin-bottom: 0;
        }
        .gauge-label {
            width: 70px;
            text-align: left;
            color: #388e3c;
        }
        .gauge-bar-bg {
            flex-grow: 1;
            background-color: #dcedc8;
            border-radius: 8px;
            height: 14px;
            overflow: hidden;
            margin: 0 8px;
        }
        .gauge-bar-fill {
            height: 100%;
            width: 50%;
            transition: width 0.3s, background-color 0.3s;
        }
        /* 강과 초원 풍경 배경 */
        .pet-screen {
            background: linear-gradient(180deg, #4fc3f7 0%, #81d4fa 40%, #a5d6a7 40%, #66bb6a 100%);
            border-radius: 20px;
            height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 16px;
            overflow: hidden;
            border: 3px solid #64b5f6;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.05);
        }
        /* 강과 풀숲 장식 */
        .pet-screen::before {
            content: "🌊 〰️ 🌊 〰️ 🌊";
            position: absolute;
            top: 82px;
            font-size: 14px;
            letter-spacing: 12px;
            opacity: 0.7;
        }
        .pet-screen::after {
            content: "🌻 🌿 🌲 🌾 🌳 🌻";
            position: absolute;
            bottom: 6px;
            font-size: 16px;
            letter-spacing: 4px;
        }
        .pet-img {
            width: 120px;
            height: 120px;
            object-fit: contain;
            animation: bounce 1.5s infinite ease-in-out;
            cursor: pointer;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.15));
            z-index: 1;
            margin-top: 15px;
            transition: transform 0.5s;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        /* 지우의 리자몽 비행 애니메이션 */
        .fly-animation {
            animation: soarHigh 2s infinite alternate ease-in-out !important;
        }
        @keyframes soarHigh {
            0% { 
                transform: translate(-30px, -45px) scale(1.25) rotate(-12deg); 
                filter: drop-shadow(0 15px 10px rgba(255, 87, 34, 0.4)) brightness(1.1);
            }
            50% {
                transform: translate(0px, -60px) scale(1.3) rotate(0deg); 
                filter: drop-shadow(0 20px 15px rgba(255, 152, 0, 0.6)) brightness(1.2);
            }
            100% { 
                transform: translate(30px, -45px) scale(1.25) rotate(12deg); 
                filter: drop-shadow(0 15px 10px rgba(255, 87, 34, 0.4)) brightness(1.1);
            }
        }

        .speech-bubble {
            background-color: white;
            border-radius: 14px;
            padding: 6px 12px;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            margin-bottom: 5px;
            min-height: 20px;
            color: #1976d2;
            border: 2px solid #bbdefb;
            z-index: 1;
        }
        .btn-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        button {
            background-color: #2196f3;
            color: white;
            border: none;
            border-radius: 14px;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 6px rgba(33, 150, 243, 0.3);
        }
        button:hover {
            background-color: #1e88e5;
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(0);
        }
        button.heal-btn {
            grid-column: span 2;
            background-color: #ef5350;
            box-shadow: 0 4px 6px rgba(239, 83, 80, 0.3);
            display: none;
        }
        button.heal-btn:hover {
            background-color: #e53935;
        }
        .sparkle {
            animation: sparkleAnim 0.6s ease-in-out;
        }
        @keyframes sparkleAnim {
            0% { transform: scale(1) rotate(0deg); filter: brightness(1); }
            50% { transform: scale(1.3) rotate(15deg); filter: brightness(1.6); }
            100% { transform: scale(1) rotate(0deg); filter: brightness(1); }
        }
    </style>
</head>
<body>

<div class="game-container">
    <h2>🐉 지우의 리자몽 키우기 🌟</h2>

    <!-- 상단 정보 (단계 및 경험치) -->
    <div class="status-bar-container">
        <div style="font-weight: bold; margin-bottom: 6px; color: #1976d2;" id="stage-text">단계: 알 🥚</div>
        <div class="gauge-row">
            <span class="gauge-label">경험치</span>
            <div class="gauge-bar-bg">
                <div class="gauge-bar-fill" id="exp-bar" style="background-color: #66bb6a; width: 0%;"></div>
            </div>
            <span id="exp-text" style="width: 45px; text-align: right; color: #555;">0/100</span>
        </div>
    </div>

    <!-- 펫 화면 (초원과 강 풍경 배경) 및 말풍선 -->
    <div class="pet-screen">
        <div class="speech-bubble" id="speech-bubble">안녕! 멋진 파트너가 되어줘! 😊</div>
        <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png" 
             class="pet-img" id="pet-avatar" onclick="tapPet()" alt="포켓몬">
    </div>

    <!-- 게이지바 모음 (시작값 50) -->
    <div class="status-bar-container">
        <div class="gauge-row">
            <span class="gauge-label">포만감</span>
            <div class="gauge-bar-bg"><div class="gauge-bar-fill" id="hunger-bar"></div></div>
        </div>
        <div class="gauge-row">
            <span class="gauge-label">행복도</span>
            <div class="gauge-bar-bg"><div class="gauge-bar-fill" id="happy-bar"></div></div>
        </div>
        <div class="gauge-row">
            <span class="gauge-label">청결도</span>
            <div class="gauge-bar-bg"><div class="gauge-bar-fill" id="clean-bar"></div></div>
        </div>
    </div>

    <!-- 상호작용 버튼 -->
    <div class="btn-grid">
        <button onclick="feedPet()">🍖 밥 주기</button>
        <button onclick="playWithPet()">⚽ 놀아주기</button>
        <button onclick="washPet()">✨ 씻기기</button>
        <button onclick="sleepPet()">💤 자기</button>
        <button class="heal-btn" id="heal-btn" onclick="healPet()">💊 치료하기</button>
    </div>
</div>

<script>
    // 모든 스탯 시작값을 50으로 설정
    let state = {
        hunger: 50,
        happy: 50,
        clean: 50,
        energy: 50, 
        exp: 0,
        stage: 0, // 0: 알, 1: 파이리, 2: 리자드, 3: 리자몽
        isSick: false
    };

    const stages = [
        { name: "알", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png" },
        { name: "파이리", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/4.png" },
        { name: "리자드", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/5.png" },
        { name: "리자몽", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/6.png" }
    ];

    function updateUI() {
        setGauge('hunger-bar', state.hunger);
        setGauge('happy-bar', state.happy);
        setGauge('clean-bar', state.clean);
        
        document.getElementById('exp-bar').style.width = state.exp + '%';
        document.getElementById('exp-text').innerText = state.exp + '/100';

        let currentStageObj = stages[state.stage];
        document.getElementById('stage-text').innerText = `단계: ${currentStageObj.name} (${state.stage}/3)`;

        let avatarEl = document.getElementById('pet-avatar');
        let healBtn = document.getElementById('heal-btn');

        avatarEl.src = currentStageObj.img;

        if (state.isSick) {
            avatarEl.style.filter = "grayscale(80%) brightness(70%)";
            avatarEl.classList.remove('fly-animation');
            healBtn.style.display = "block";
            document.getElementById('speech-bubble').innerText = "기운이 없어요... 치료해 주세요! 🤒😢";
        } else {
            healBtn.style.display = "none";
            
            // 최종 진화(리자몽)이면서 모든 게이지가 90 이상일 때 하늘을 활공
            if (state.stage === 3 && state.hunger >= 90 && state.happy >= 90 && state.clean >= 90) {
                avatarEl.classList.add('fly-animation');
                document.getElementById('speech-bubble').innerText = "크으어어! 하늘 높이 날아올라 불꽃을 뿜어낸다! 🔥🚀✨";
            } else {
                avatarEl.classList.remove('fly-animation');
                avatarEl.style.filter = "drop-shadow(0 5px 5px rgba(0,0,0,0.15))";
                let avg = (state.hunger + state.happy + state.clean) / 3;
                if (avg < 30) {
                    document.getElementById('speech-bubble').innerText = "조금 뾰루퉁한 것 같아요... 😢";
                } else if (avg < 70) {
                    document.getElementById('speech-bubble').innerText = "훈련하기 좋은 평온한 상태예요. 😐";
                } else {
                    document.getElementById('speech-bubble').innerText = "트레이너를 향해 미소 짓고 있어요! 😊";
                }
            }
        }
    }

    function setGauge(elementId, value) {
        const bar = document.getElementById(elementId);
        bar.style.width = value + '%';
        if (value > 50) {
            bar.style.backgroundColor = '#66bb6a'; // 초록
        } else if (value > 20) {
            bar.style.backgroundColor = '#ffca28'; // 노랑
        } else {
            bar.style.backgroundColor = '#ef5350'; // 빨강
        }
    }

    function showMessage(msg) {
        if (!state.isSick) {
            document.getElementById('speech-bubble').innerText = msg;
        }
    }

    function addExp(amount) {
        if (state.isSick) return;

        state.exp += amount;
        if (state.exp >= 100) {
            state.exp = 0;
            if (state.stage < 3) {
                state.stage++;
                triggerEvolutionEffect();
            }
        }
    }

    function triggerEvolutionEffect() {
        let avatarEl = document.getElementById('pet-avatar');
        avatarEl.classList.add('sparkle');
        setTimeout(() => avatarEl.classList.remove('sparkle'), 600);

        if (state.stage === 1) {
            alert("🎉 파이리(이)가 진화했다! 🎉");
            showMessage("파이리(이)가 진화했다! 🔥");
        } else if (state.stage === 2) {
            alert("🎉 리자드가 진화했다! 🎉");
            showMessage("리자드가 진화했다! 🦖");
        } else if (state.stage === 3) {
            alert("🎉 최종 진화 지우의 리자몽이 되었다! 🎉");
            showMessage("강한 상대와 싸우고 싶은 리자몽으로 진화했다! 🐉🔥");
        }
    }

    function feedPet() {
        if (state.isSick) return;
        state.hunger = Math.min(100, state.hunger + 35);
        state.happy = Math.min(100, state.happy + (state.energy > 20 ? 10 : 5));
        showMessage("맛있게 냠냠! 기분이 좋아졌어요! 🍖");
        addExp(10);
        updateUI();
    }

    function playWithPet() {
        if (state.isSick) return;
        state.happy = Math.min(100, state.happy + 35);
        state.hunger = Math.max(0, state.hunger - 10);
        state.energy = Math.max(0, state.energy - 15);
        state.clean = Math.max(0, state.clean - 20);
        showMessage("초원과 강가를 달리며 신나게 훈련했어요! ⚽");
        addExp(10);
        updateUI();
    }

    function washPet() {
        if (state.isSick) {
            showMessage("아픈 상태에서는 씻을 수 없어요! 먼저 치료해주세요.");
            return;
        }
        state.clean = Math.min(100, state.clean + 45);
        state.happy = Math.max(0, state.happy - 10);
        showMessage("시원한 강물에서 몸을 깨끗이 씻었어요! ✨");
        addExp(10);
        updateUI();
    }

    function sleepPet() {
        if (state.isSick) return;
        state.energy = Math.min(100, state.energy + 40);
        state.hunger = Math.max(0, state.hunger - 10);
        showMessage("풀숲 그늘 아래서 든든하게 휴식을 취해요! 💤");
        addExp(10);
        updateUI();
    }

    function healPet() {
        state.isSick = false;
        state.hunger = 50;
        state.happy = 50;
        state.clean = 50;
        showMessage("원기를 회복하고 다시 힘을 내요! 💪");
        updateUI();
    }

    function tapPet() {
        if(!state.isSick) {
            showMessage("든든한 파트너 리자몽이 꼬리 불꽃을 흔듭니다! 🥰");
        }
    }

    // 2초마다 모든 게이지 감소
    setInterval(() => {
        state.hunger = Math.max(0, state.hunger - 3);
        state.happy = Math.max(0, state.happy - 3);
        state.clean = Math.max(0, state.clean - 3);

        if ((state.hunger === 0 || state.happy === 0 || state.clean === 0) && !state.isSick) {
            state.isSick = true;
        }

        updateUI();
    }, 2000);

    updateUI();
</script>

</body>
</html>
