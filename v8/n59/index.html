<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>진짜 포켓몬 GO! - 버그 수정 버전</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle, #7bc67b 0%, #2e7d32 100%);
            height: 100vh;
            overflow: hidden;
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', 'Arial', sans-serif;
            user-select: none;
            touch-action: none;
        }
        #header {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 8px 16px;
            border-radius: 25px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.25);
            font-size: 12px;
            font-weight: bold;
            color: #333;
            z-index: 10;
            display: flex;
            gap: 6px;
            align-items: center;
        }
        button.menu-btn {
            background: linear-gradient(135deg, #f12711, #f5af19);
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0,0,0,0.15);
            transition: transform 0.1s;
        }
        button.menu-btn:active { transform: scale(0.95); }
        #game-area {
            position: relative;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(rgba(255,255,255,0.15) 1px, transparent 0);
            background-size: 24px 24px;
        }
        .map-pokemon {
            position: absolute;
            width: 75px;
            height: 75px;
            cursor: pointer;
            animation: bounce 1.5s infinite alternate;
            z-index: 5;
            filter: drop-shadow(0 8px 6px rgba(0,0,0,0.3));
            pointer-events: auto;
        }
        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-12px); }
        }
        .fullscreen-screen {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?q=80&w=1000&auto=format&fit=crop') no-repeat center center/cover;
            z-index: 50;
            text-align: center;
            overflow: hidden;
        }
        /* 포획 화면 */
        #target-pokemon {
            position: absolute;
            top: 36%; left: 50%;
            transform: translate(-50%, -50%);
            width: 160px; height: 160px;
            filter: drop-shadow(0 15px 10px rgba(0,0,0,0.4));
            pointer-events: none;
        }
        #target-ring {
            position: absolute;
            top: 36%; left: 50%;
            transform: translate(-50%, -50%);
            width: 140px; height: 140px;
            border: 4px solid #ff4757;
            border-radius: 50%;
            pointer-events: none;
            display: none;
            z-index: 51;
            box-shadow: 0 0 10px rgba(255, 71, 87, 0.6);
        }
        #info-panel {
            position: absolute;
            top: 22%; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: #ffcc00;
            padding: 8px 18px;
            border-radius: 16px;
            font-weight: bold;
            font-size: 15px;
            display: flex;
            gap: 15px;
            z-index: 60;
            border: 1px solid rgba(255,255,255,0.2);
        }
        #curve-badge {
            position: absolute;
            top: 18%; left: 50%;
            transform: translateX(-50%);
            background: rgba(238, 90, 36, 0.9);
            color: white; padding: 4px 12px; border-radius: 10px;
            font-size: 12px; font-weight: bold; display: none; z-index: 61;
            box-shadow: 0 3px 6px rgba(0,0,0,0.3);
        }
        #berry-bar {
            position: absolute;
            top: 20px; right: 20px;
            display: flex; gap: 10px; z-index: 60;
        }
        .berry-wrapper { text-align: center; }
        .berry-btn {
            background: rgba(255,255,255,0.9);
            border: 2px solid #ddd;
            border-radius: 50%;
            width: 48px; height: 48px;
            cursor: pointer; font-size: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.25);
        }
        .berry-count { color: white; font-size: 11px; font-weight: bold; text-shadow: 1px 1px 3px black; margin-top: 3px; }
        #ball-selector {
            position: absolute;
            top: 20px; left: 20px;
            display: flex; flex-direction: column; gap: 8px; z-index: 60;
        }
        .ball-select-btn {
            background: rgba(255,255,255,0.9);
            border: 2px solid #ccc;
            border-radius: 14px;
            padding: 6px 12px;
            cursor: pointer; font-weight: bold; font-size: 12px;
            display: flex; align-items: center; gap: 6px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.25);
        }
        .ball-select-btn.active { border-color: #ffcc00; background: #fff9db; transform: scale(1.05); }
        #throwable-ball {
            position: absolute; bottom: 40px; left: calc(50% - 42px);
            width: 85px; height: 85px; cursor: grab; z-index: 60;
            filter: drop-shadow(0 10px 8px rgba(0,0,0,0.3));
            touch-action: none;
        }
        #throwable-ball.spinning { animation: spin 0.3s infinite linear; }
        @keyframes spin { 0% { transform: rotate(0deg) scale(1.1); } 100% { transform: rotate(360deg) scale(1.1); } }
        /* 체육관 배틀 화면 */
        #battle-screen {
            background: linear-gradient(135deg, #2c3e50, #4ca1af);
        }
        .battle-arena {
            position: absolute;
            top: 15%; width: 100%;
            display: flex; justify-content: space-around; align-items: center;
            padding: 0 20px; box-sizing: border-box; z-index: 60;
        }
        .battle-unit {
            text-align: center;
            background: rgba(0,0,0,0.5);
            padding: 15px; border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.2);
            width: 140px;
        }
        .battle-unit img { width: 90px; height: 90px; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.3)); }
        .hp-bar-container {
            width: 100%; background: #555; height: 12px; border-radius: 6px; margin-top: 8px; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.3);
        }
        .hp-bar { width: 100%; height: 100%; background: #2ed573; transition: width 0.3s; }                
        #battle-controls {
            position: absolute; bottom: 40px; width: 100%;
            display: flex; justify-content: center; gap: 15px; z-index: 60;
        }
        .battle-action-btn {
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            color: white; border: none; padding: 12px 24px;
            border-radius: 20px; font-weight: bold; font-size: 16px;
            cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .battle-action-btn:active:not(:disabled) { transform: scale(0.95); }
        #message {
            position: absolute; bottom: 140px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.88); color: white;
            padding: 10px 20px; border-radius: 14px; font-size: 15px;
            z-index: 70; display: none; box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.15); text-align: center;
        }
        .modal {
            display: none; position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(10px);
            padding: 24px; border-radius: 24px; width: 340px; max-height: 82vh;
            box-shadow: 0 15px 35px rgba(0,0,0,0.35); z-index: 100;
            text-align: center; overflow-y: auto;
        }
        .box-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
            max-height: 260px; overflow-y: auto; margin-bottom: 15px; padding: 5px;
        }
        .box-card {
            background: #f8f9fa; border: 2px solid #e1e4e8; border-radius: 14px;
            padding: 8px 4px; text-align: center; cursor: pointer;
            box-shadow: 0 3px 6px rgba(0,0,0,0.05); transition: all 0.2s;
        }
        .box-card:hover { border-color: #ffcc00; background: #fffdf0; transform: translateY(-2px); }
        .dex-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 0; border-bottom: 1px solid #eee;
        }
    </style>
</head>
<body>
    <div id="header">
        🔴 <span id="poke-ball-count">25</span> 
        🔵 <span id="great-ball-count">15</span> 
        🟡 <span id="ultra-ball-count">10</span> 
        ✨ <span id="score">0</span>
        <button class="menu-btn" onclick="playSound('click'); openStorage()">🎒 보관함</button>
        <button class="menu-btn" onclick="playSound('click'); openDex()">📖 도감</button>
        <button class="menu-btn" onclick="playSound('click'); startGymBattle()" style="background:linear-gradient(135deg, #00b09b, #96c93d);">⚔️ 체육관</button>

    <div id="game-area"></div>
    <div id="message">야생에 포켓몬들이 나타났습니다!</div>
    
    <!-- 포획 화면 -->
    <div id="encounter-screen" class="fullscreen-screen">
        <div id="info-panel">
            <span>CP <span id="encounter-cp">150</span></span>
            <span style="color:#2ed573;">포획확률: <span id="catch-chance-label">25%</span></span>

        <div id="ball-selector">

            </button>

        <img id="target-pokemon" src="" alt="포켓몬">
        <div id="target-ring"></div>

    <!-- 체육관 배틀 화면 -->

        <div class="battle-arena">

                <div class="hp-bar-container"><div id="enemy-hp-bar" class="hp-bar"></div></div>

    <!-- 보관함 모달 -->
    <div id="storage-modal" class="modal">
        <h2>포켓몬 보관함 (<span id="storage-count">0</span>마리)</h2>
        <div id="storage-grid" class="box-grid"></div>

    <!-- 상세 정보 및 진화 모달 -->
    <div id="detail-modal" class="modal">

        <div style="display: flex; gap: 10px; justify-content: center;">
            <button id="detail-evolve-btn" class="menu-btn" onclick="playSound('evolve'); evolveMyPokemon()">진화하기</button>
            <button class="menu-btn" onclick="playSound('click'); closeDetailModal()" style="background:#b2bec3;">닫기</button>
        </div>
    </div>

    <!-- 도감 모달 -->
    <div id="dex-modal" class="modal">
        <h2>포켓몬 도감 현황</h2>
        <div id="dex-list" style="max-height: 240px; overflow-y: auto; text-align: left; margin-bottom: 15px;"></div>
        <button class="menu-btn" onclick="playSound('click'); closeDex()" style="width:100%;">닫기</button>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            if (type === 'click') {
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.start(); osc.stop(audioCtx.currentTime + 0.08);
            } else if (type === 'throw') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'catch') {
                let now = audioCtx.currentTime;
                [523, 659, 784, 1046].forEach((freq, i) => {
                    let o = audioCtx.createOscillator(); let g = audioCtx.createGain();
                    o.connect(g); g.connect(audioCtx.destination);
                    o.frequency.setValueAtTime(freq, now + i * 0.1);
                    g.gain.setValueAtTime(0.15, now + i * 0.1);
                    g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.2);
                    o.start(now + i * 0.1); o.stop(now + i * 0.1 + 0.2);
                });
            } else if (type === 'escape') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                osc.start(); osc.stop(audioCtx.currentTime + 0.25);
            } else if (type === 'evolve') {
                let now = audioCtx.currentTime;
                [400, 500, 600, 800, 1200].forEach((freq, i) => {
                    let o = audioCtx.createOscillator(); let g = audioCtx.createGain();
                    o.connect(g); g.connect(audioCtx.destination);
                    o.frequency.setValueAtTime(freq, now + i * 0.08);
                    g.gain.setValueAtTime(0.15, now + i * 0.08);
                    g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.08 + 0.15);
                    o.start(now + i * 0.08); o.stop(now + i * 0.08 + 0.15);
                });
            }
        }

        const pokemonDB = [
            { id: 1, name: "이상해씨", type: "풀", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/1.png", evolveTo: "이상해풀" },
            { id: 2, name: "이상해풀", type: "풀", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/2.png", evolveTo: "이상해꽃" },
            { id: 3, name: "이상해꽃", type: "풀", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/3.png", evolveTo: null },
            { id: 4, name: "파이리", type: "불꽃", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/4.png", evolveTo: "리자드" },
            { id: 5, name: "리자드", type: "불꽃", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/5.png", evolveTo: "리자몽" },
            { id: 6, name: "리자몽", type: "불꽃", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/6.png", evolveTo: null },
            { id: 7, name: "꼬부기", type: "물", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/7.png", evolveTo: "어니부기" },
            { id: 8, name: "어니부기", type: "물", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/8.png", evolveTo: "거북왕" },
            { id: 9, name: "거북왕", type: "물", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/9.png", evolveTo: null },
            { id: 25, name: "피카츄", type: "전기", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png", evolveTo: "라이츄" },
            { id: 26, name: "라이츄", type: "전기", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/26.png", evolveTo: null },
            { id: 133, name: "이브이", type: "노말", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/133.png", evolveTo: null },
            { id: 143, name: "잠만보", type: "노말", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/143.png", evolveTo: null },
            { id: 150, name: "뮤츠", type: "에스퍼", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/150.png", evolveTo: null }
        ];

        let score = 0;
        let pokeBalls = 25, greatBalls = 15, ultraBalls = 10;
        let selectedBallType = 'poke';
        let berries = { razz: 5, nanab: 5, pinap: 5 };
        let myPokemonBox = [];
        let currentEncounter = null;
        let selectedStorageIndex = null;

        let battleState = {
            active: false,
            playerPokemon: null,
            enemyPokemon: null,
            playerHp: 100,
            playerMaxHp: 100,
            enemyHp: 100,
            enemyMaxHp: 100
        };

        let ringSize = 140;
        let ringShrinking = true;
        let ringInterval = null;
        let isCurve = false;
        let activeBerry = null;

        const scoreEl = document.getElementById("score");
        const pokeBallCountEl = document.getElementById("poke-ball-count");
        const greatBallCountEl = document.getElementById("great-ball-count");
        const ultraBallCountEl = document.getElementById("ultra-ball-count");
        const selectPokeCountEl = document.getElementById("select-poke-count");
        const selectGreatCountEl = document.getElementById("select-great-count");
        const selectUltraCountEl = document.getElementById("select-ultra-count");
        const gameArea = document.getElementById("game-area");
        const messageEl = document.getElementById("message");
        const encounterScreen = document.getElementById("encounter-screen");
        const battleScreen = document.getElementById("battle-screen");
        const targetPokemonEl = document.getElementById("target-pokemon");
        const targetRingEl = document.getElementById("target-ring");
        const throwableBall = document.getElementById("throwable-ball");
        const catchChanceLabel = document.getElementById("catch-chance-label");
        const curveBadge = document.getElementById("curve-badge");

        function updateUI() {
            scoreEl.textContent = score;
            pokeBallCountEl.textContent = pokeBalls;
            greatBallCountEl.textContent = greatBalls;
            ultraBallCountEl.textContent = ultraBalls;
            selectPokeCountEl.textContent = pokeBalls;
            selectGreatCountEl.textContent = greatBalls;
            selectUltraCountEl.textContent = ultraBalls;
        }

        function updateBerryUI() {
            document.getElementById("count-razz").textContent = berries.razz + "개";
            document.getElementById("count-nanab").textContent = berries.nanab + "개";
            document.getElementById("count-pinap").textContent = berries.pinap + "개";
        }

        function selectBall(type) {
            selectedBallType = type;
            ['poke', 'great', 'ultra'].forEach(t => document.getElementById(`btn-${t}ball`).classList.remove('active'));
            document.getElementById(`btn-${type}ball`).classList.add('active');
            if (type === 'poke') throwableBall.src = "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png";
            else if (type === 'great') throwableBall.src = "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/great-ball.png";
            else if (type === 'ultra') throwableBall.src = "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/ultra-ball.png";
        }

        function feedBerry(type) {
            if (berries[type] <= 0) {
                showMessage("열매가 부족합니다!");
                return;
            }
            berries[type]--;
            activeBerry = type;
            updateBerryUI();
            showMessage(`🍎 ${type === 'razz' ? '라즈열매' : type === 'nanab' ? '나나열매' : '파인열매'}를 주었습니다!`);
            updateCatchChanceDisplay();
        }

        function showMessage(text) {
            messageEl.textContent = text;
            messageEl.style.display = "block";
            setTimeout(() => { messageEl.style.display = "none"; }, 2000);
        }

        // 맵에 포켓몬 생성
        setInterval(() => {
            if (document.querySelectorAll('.map-pokemon').length < 10 && encounterScreen.style.display !== "block" && !battleState.active) {
                spawnMapPokemon();
            }
        }, 1200);

        function spawnMapPokemon() {
            const pData = pokemonDB[Math.floor(Math.random() * pokemonDB.length)];
            const cp = pData.id === 150 ? Math.floor(Math.random() * 500) + 1200 : Math.floor(Math.random() * 600) + 100;

            const mapEl = document.createElement("img");
            mapEl.src = pData.img;
            mapEl.className = "map-pokemon";
            mapEl.style.left = Math.floor(Math.random() * (window.innerWidth - 80)) + "px";
            mapEl.style.top = Math.floor(Math.random() * (window.innerHeight - 220) + 60) + "px";
            mapEl.draggable = false;

            mapEl.addEventListener("click", (e) => {
                e.stopPropagation();
                playSound('click');
                startEncounter(pData, cp);
                mapEl.remove();
            });

            gameArea.appendChild(mapEl);
            setTimeout(() => { if (mapEl.parentElement) mapEl.remove(); }, 8000);
        }

        function startEncounter(pData, cp) {
            currentEncounter = { data: pData, cp: cp };
            document.getElementById("encounter-cp").textContent = cp;
            targetPokemonEl.src = pData.img;
            encounterScreen.style.display = "block";
            activeBerry = null;
            updateBerryUI();
            resetBallPosition();
            updateCatchChanceDisplay();

            ringSize = 140;
            targetRingEl.style.display = "block";
            if (ringInterval) clearInterval(ringInterval);
            ringInterval = setInterval(() => {
                ringSize = ringShrinking ? ringSize - 3 : ringSize + 3;
                if (ringSize <= 40) ringShrinking = false;
                if (ringSize >= 140) ringShrinking = true;
                targetRingEl.style.width = ringSize + "px";
                targetRingEl.style.height = ringSize + "px";
                updateCatchChanceDisplay();
            }, 40);
        }

        function calculateCurrentCatchChance() {
            if (!currentEncounter) return 0.25;
            let bonus = ringSize < 60 ? 1.3 : (ringSize < 95 ? 1.1 : 1.0);
            if (selectedBallType === 'great') bonus *= 1.25;
            if (selectedBallType === 'ultra') bonus *= 1.5;
            if (isCurve) bonus *= 1.4;
            if (activeBerry === 'razz') bonus *= 1.3;

            let chance = ((1 - (currentEncounter.cp / 2500)) * 0.45 + 0.08) * bonus;
            return Math.min(0.75, Math.max(0.12, chance));
        }

        function updateCatchChanceDisplay() {
            const chance = Math.round(calculateCurrentCatchChance() * 100);
            catchChanceLabel.textContent = chance + "%";
            catchChanceLabel.style.color = chance >= 40 ? "#2ed573" : (chance >= 25 ? "#ffa502" : "#ff4757");
        }

        function resetBallPosition() {
            throwableBall.style.transition = "none";
            throwableBall.style.bottom = "40px";
            throwableBall.style.left = "calc(50% - 42px)";
            throwableBall.style.transform = "translate(0px, 0px) scale(1)";
            throwableBall.style.display = "block";
            throwableBall.classList.remove("spinning");
            curveBadge.style.display = "none";
            isCurve = false;
        }

        // 안정적인 볼 드래그 및 던지기 이벤트 로직
        let isDragging = false, startX, startY, lastMoveX = 0, totalHorizontalMove = 0;

        throwableBall.addEventListener("pointerdown", (e) => {
            if ((selectedBallType === 'poke' && pokeBalls <= 0) ||
                (selectedBallType === 'great' && greatBalls <= 0) ||
                (selectedBallType === 'ultra' && ultraBalls <= 0)) {
                showMessage("볼이 부족합니다!");
                return;
            }
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            lastMoveX = e.clientX;
            totalHorizontalMove = 0;
            e.preventDefault();
        });

        window.addEventListener("pointermove", (e) => {
            if (!isDragging) return;
            let deltaX = e.clientX - startX;
            let deltaY = e.clientY - startY;

            totalHorizontalMove += Math.abs(e.clientX - lastMoveX);
            lastMoveX = e.clientX;

            if (totalHorizontalMove > 100) {
                isCurve = true;
                curveBadge.style.display = "block";
                throwableBall.classList.add("spinning");
            }

            throwableBall.style.transform = `translate(${deltaX}px, ${deltaY}px) scale(0.9)`;
        });

        window.addEventListener("pointerup", (e) => {
            if (!isDragging) return;
            isDragging = false;

            let deltaY = e.clientY - startY;
            if (deltaY < -50) {
                // 볼 차감
                if (selectedBallType === 'poke') pokeBalls--;
                else if (selectedBallType === 'great') greatBalls--;
                else if (selectedBallType === 'ultra') ultraBalls--;
                updateUI();

                playSound('throw');
                animateThrow();
            } else {
                resetBallPosition();
            }
        });

        function animateThrow() {
            throwableBall.style.transition = "all 0.4s ease-out";
            throwableBall.style.bottom = "65vh";
            throwableBall.style.left = "calc(50% - 42px)";
            throwableBall.style.transform = "translate(0px, 0px) scale(0.35)";

            setTimeout(() => {
                throwableBall.style.display = "none";
                clearInterval(ringInterval);
                targetRingEl.style.display = "none";

                let chance = calculateCurrentCatchChance();
                if (Math.random() < chance) {
                    playSound('catch');
                    showMessage(`🎉 ${currentEncounter.data.name} 포획 성공!`);
                    score += Math.round(currentEncounter.cp * 0.5);
                    myPokemonBox.push({ ...currentEncounter.data, cp: currentEncounter.cp, candy: 3 });
                    updateUI();
                    setTimeout(closeEncounter, 1500);
                } else {
                    playSound('escape');
                    showMessage(`😢 포켓몬이 볼에서 빠져나왔습니다!`);
                    setTimeout(() => {
                        resetBallPosition();
                        // 링 재시작
                        ringSize = 140;
                        targetRingEl.style.display = "block";
                        ringInterval = setInterval(() => {
                            ringSize = ringShrinking ? ringSize - 3 : ringSize + 3;
                            if (ringSize <= 40) ringShrinking = false;
                            if (ringSize >= 140) ringShrinking = true;
                            targetRingEl.style.width = ringSize + "px";
                            targetRingEl.style.height = ringSize + "px";
                            updateCatchChanceDisplay();
                        }, 40);
                    }, 1200);
                }
            }, 400);
        }

        function closeEncounter() {
            encounterScreen.style.display = "none";
            if (ringInterval) clearInterval(ringInterval);
        }

        // 보관함 및 진화 시스템
        function openStorage() {
            document.getElementById("storage-count").textContent = myPokemonBox.length;
            const grid = document.getElementById("storage-grid");
            grid.innerHTML = "";
            myPokemonBox.forEach((p, idx) => {
                grid.innerHTML += `
                    <div class="box-card" onclick="openDetailModal(${idx})">
                        <img src="${p.img}" width="50" style="filter:drop-shadow(0 3px 3px rgba(0,0,0,0.2))">
                        <div style="font-size:11px; font-weight:bold;">${p.name}</div>
                        <div style="font-size:10px; color:#ff4757;">CP ${p.cp}</div>
                    </div>`;
            });
            document.getElementById("storage-modal").style.display = "block";
        }

        function closeStorage() { document.getElementById("storage-modal").style.display = "none"; }

        function openDetailModal(idx) {
            selectedStorageIndex = idx;
            const p = myPokemonBox[idx];
            document.getElementById("detail-name").textContent = p.name;
            document.getElementById("detail-img").src = p.img;
            document.getElementById("detail-type").textContent = `속성: ${p.type}`;
            document.getElementById("detail-cp").textContent = `CP ${p.cp}`;
            document.getElementById("detail-candy").textContent = `보유 사탕: ${p.candy}개 (진화 필요: 3개)`;
            
            const evolveBtn = document.getElementById("detail-evolve-btn");
            evolveBtn.style.display = p.evolveTo ? "inline-block" : "none";
            document.getElementById("storage-modal").style.display = "none";
            document.getElementById("detail-modal").style.display = "block";
        }

        function closeDetailModal() { document.getElementById("detail-modal").style.display = "none"; openStorage(); }

        function evolveMyPokemon() {
            let p = myPokemonBox[selectedStorageIndex];
            if (p.candy < 3) {
                showMessage("사탕이 부족합니다! (필요: 3개)");
                return;
            }
            p.candy -= 3;
            let nextName = p.evolveTo;
            let nextData = pokemonDB.find(item => item.name === nextName);
            if (nextData) {
                p.name = nextData.name;
                p.img = nextData.img;
                p.type = nextData.type;
                p.evolveTo = nextData.evolveTo;
                p.cp = Math.round(p.cp * 1.45);
                showMessage(`✨ 진화 성공! ${p.name}(이)가 되었습니다!`);
                openDetailModal(selectedStorageIndex);
            }
        }

        // 체육관 배틀 시스템
        function startGymBattle() {
            if (myPokemonBox.length === 0) {
                showMessage("보관함에 포켓몬이 있어야 체육관에 도전할 수 있습니다!");
                return;
            }
            let myP = myPokemonBox[0];
            let enemyP = pokemonDB[Math.floor(Math.random() * pokemonDB.length)];

            battleState.active = true;
            battleState.playerPokemon = myP;
            battleState.enemyPokemon = enemyP;
            battleState.playerMaxHp = myP.cp;
            battleState.playerHp = myP.cp;
            battleState.enemyMaxHp = enemyP.id === 150 ? 1500 : 400;
            battleState.enemyHp = battleState.enemyMaxHp;

            document.getElementById("player-battle-name").textContent = myP.name + ` (CP ${myP.cp})`;
            document.getElementById("player-battle-img").src = myP.img;
            document.getElementById("enemy-battle-name").textContent = enemyP.name;
            document.getElementById("enemy-battle-img").src = enemyP.img;

            updateBattleUI();
            battleScreen.style.display = "block";
        }

        function updateBattleUI() {
            document.getElementById("player-hp-bar").style.width = Math.max(0, (battleState.playerHp / battleState.playerMaxHp) * 100) + "%";
            document.getElementById("player-hp-text").textContent = `${Math.max(0, Math.round(battleState.playerHp))}/${battleState.playerMaxHp}`;
            document.getElementById("enemy-hp-bar").style.width = Math.max(0, (battleState.enemyHp / battleState.enemyMaxHp) * 100) + "%";
            document.getElementById("enemy-hp-text").textContent = `${Math.max(0, Math.round(battleState.enemyHp))}/${battleState.enemyMaxHp}`;
        }

        function playerAttack() {
            playSound('hit');
            let dmg = Math.round(battleState.playerPokemon.cp * 0.35);
            battleState.enemyHp -= dmg;
            updateBattleUI();

            if (battleState.enemyHp <= 0) {
                playSound('catch');
                showMessage("🎉 체육관 배틀 승리! 보상 획득!");
                score += 500;
                pokeBalls += 5;
                updateUI();
                setTimeout(escapeBattle, 1500);
                return;
            }

            setTimeout(() => {
                playSound('hit');
                let enemyDmg = Math.round(Math.random() * 50 + 40);
                battleState.playerHp -= enemyDmg;
                updateBattleUI();

                if (battleState.playerHp <= 0) {
                    playSound('escape');
                    showMessage("😢 체육관 배틀 패배...");
                    setTimeout(escapeBattle, 1500);
                }
            }, 600);
        }

        function escapeBattle() {
            battleState.active = false;
            battleScreen.style.display = "none";
        }

        // 도감 시스템
        function openDex() {
            const list = document.getElementById("dex-list");
            list.innerHTML = "";
            pokemonDB.forEach(p => {
                let caught = myPokemonBox.some(m => m.name === p.name);
                list.innerHTML += `
                    <div class="dex-item">
                        <div style="display:flex; align-items:center; gap:10px;">
                            <img src="${p.img}" width="35" style="${caught ? '' : 'filter: brightness(0);'}">
                            <b>#${p.id} ${p.name}</b>
                        </div>
                        <span style="font-size:12px; font-weight:bold; color:${caught ? '#2ed573' : '#ff4757'}">${caught ? '✔️ 보유중' : '❌ 미포획'}</span>
                    </div>`;
            });
            document.getElementById("dex-modal").style.display = "block";
        }
        function closeDex() { document.getElementById("dex-modal").style.display = "none"; }

        updateUI();
    </script>
</body>
</html>
