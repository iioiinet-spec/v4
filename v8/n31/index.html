<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포켓몬 키우기 🌊✨</title>
    <style>
        :root {
            --primary-color: #70a1ff;
            --bg-color: #e0f7fa;
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-color: #2f3640;
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(180deg, #00b4db, #0083b0);
            font-family: 'Maplestory', 'Jua', 'Comic Sans MS', sans-serif;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 바닷속 수영 애니메이션 배경 요소 */
        .bubble {
            position: absolute;
            bottom: -50px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            animation: rise 5s infinite ease-in;
            z-index: 0;
        }
        @keyframes rise {
            0% { transform: translateY(0) scale(1); opacity: 0.8; }
            100% { transform: translateY(-100vh) scale(1.5); opacity: 0; }
        }

        .game-container {
            position: relative;
            z-index: 10;
            width: 420px;
            background: var(--card-bg);
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            backdrop-filter: blur(5px);
        }

        h1 {
            font-size: 24px;
            margin: 5px 0 15px 0;
            color: #0066cc;
        }

        /* 상단 정보 */
        .top-info {
            display: flex;
            justify-content: space-between;
            background: #f1f2f6;
            padding: 10px 15px;
            border-radius: 15px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* 게이지바 */
        .stat-box {
            text-align: left;
            margin-bottom: 10px;
            font-size: 13px;
        }
        .stat-bar-container {
            width: 100%;
            background: #dfe4ea;
            border-radius: 10px;
            height: 14px;
            overflow: hidden;
            margin-top: 3px;
        }
        .stat-bar {
            height: 100%;
            width: 70%;
            transition: width 0.3s, background-color 0.3s;
        }

        /* 펫 영역 (수영 및 통통 튀기) */
        .pet-stage {
            position: relative;
            height: 180px;
            margin: 15px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            overflow: hidden;
        }

        .pet {
            font-size: 80px;
            cursor: pointer;
            user-select: none;
            animation: bounce 1.5s infinite alternate, swim 3s infinite ease-in-out;
            transition: transform 0.2s;
        }

        @keyframes bounce {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-15px) scale(1.05); }
        }

        @keyframes swim {
            0% { transform: translateX(0) translateY(0) rotate(0deg); }
            25% { transform: translateX(10px) translateY(-5px) rotate(5deg); }
            50% { transform: translateX(0) translateY(5px) rotate(0deg); }
            75% { transform: translateX(-10px) translateY(-5px) rotate(-5deg); }
            100% { transform: translateX(0) translateY(0) rotate(0deg); }
        }

        /* 말풍선 */
        .speech-bubble {
            position: absolute;
            top: 10px;
            background: #ffffff;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 13px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            animation: fadeInOut 2s forwards;
            border: 2px solid #70a1ff;
        }

        /* 버튼 패널 */
        .btn-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 10px;
        }

        button {
            background: #70a1ff;
            color: white;
            border: none;
            padding: 10px 5px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #1e90ff;
            transition: all 0.1s;
        }

        button:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #1e90ff;
        }

        button.shop-btn { background: #ffa502; box-shadow: 0 4px 0 #ff7f00; }
        button.game-btn { background: #2ed573; box-shadow: 0 4px 0 #26af5f; }
        button.cure-btn { background: #ff4757; box-shadow: 0 4px 0 #ff6b81; display: none; }

        /* 폭죽 및 이펙트 */
        .firework {
            position: absolute;
            font-size: 24px;
            animation: explode 1s forwards;
            pointer-events: none;
        }
        @keyframes explode {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(2) translate(var(--tx), var(--ty)); opacity: 0; }
        }

        /* 미니게임 모달 */
        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            border-radius: 25px;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 20px;
            width: 80%;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- 배경 방울 생성용 컨테이너 -->
    <div id="bubbles"></div>

    <div class="game-container">
        <h1>⚡ 포켓몬 키우기 🌊</h1>

        <!-- 상단 정보 (레벨, 코인, 경험치) -->
        <div class="top-info">
            <span id="level-display">Lv.1 피카츄</span>
            <span id="coin-display">🪙 0코인</span>
        </div>

        <div class="stat-box">
            <span>경험치 (<span id="exp-text">0</span>/100)</span>
            <div class="stat-bar-container"><div id="exp-bar" class="stat-bar" style="width: 0%; background: #ffa502;"></div></div>
        </div>

        <!-- 펫 영역 -->
        <div class="pet-stage" id="stage">
            <div id="speech" class="speech-bubble" style="display:none;">안녕! 반가워! 👋</div>
            <div id="pet" class="pet" onclick="drinkWater()">⚡</div>
        </div>

        <!-- 게이지 목록 -->
        <div class="stat-box">
            <span>포만감 🍗</span>
            <div class="stat-bar-container"><div id="bar-hunger" class="stat-bar"></div></div>
        </div>
        <div class="stat-box">
            <span>행복도 ✨</span>
            <div class="stat-bar-container"><div id="bar-happy" class="stat-bar"></div></div>
        </div>
        <div class="stat-box">
            <span>청결도 🧼</span>
            <div class="stat-bar-container"><div id="bar-clean" class="stat-bar"></div></div>
        </div>
        <div class="stat-box">
            <span>에너지 ⚡</span>
            <div class="stat-bar-container"><div id="bar-energy" class="stat-bar"></div></div>
        </div>

        <!-- 상호작용 버튼 -->
        <div class="btn-grid">
            <button onclick="feedPet()">🍗 밥 주기</button>
            <button onclick="playPet()">🎾 놀아주기</button>
            <button onclick="washPet()">🧼 씻기기</button>
            <button class="shop-btn" onclick="openShop()">🛍️ 상점</button>
            <button class="game-btn" onclick="openGame()">🎮 미니게임</button>
            <button id="cure-btn" class="cure-btn" onclick="curePet()">💊 치료하기</button>
        </div>
    </div>

    <!-- 미니게임 모달창 -->
    <div id="game-modal" class="modal">
        <div class="modal-content">
            <h3>가위바위보 대결! ✊✌️✋</h3>
            <p>포켓몬과 가위바위보를 합니다!</p>
            <div style="margin: 15px 0;">
                <button onclick="playRPS('rock')">✊ 바위</button>
                <button onclick="playRPS('paper')">✋ 보</button>
                <button onclick="playRPS('scissors')">✌️ 가위</button>
            </div>
            <p id="rps-result" style="font-weight: bold; color: #0066cc;"></p>
            <button style="background:#ff4757; margin-top:10px;" onclick="closeGame()">닫기</s>
        </div>
    </div>

    <!-- 상점 모달창 -->
    <div id="shop-modal" class="modal">
        <div class="modal-content">
            <h3>🛍️ 포켓몬 상점</h3>
            <p>코인으로 아이템을 구매하세요!</p>
            <div style="margin: 15px 0; display:flex; flex-direction:column; gap:10px;">
                <button class="shop-btn" onclick="buyItem('snack')">간식 (20코인) - 포만감 +40</button>
                <button class="shop-btn" onclick="buyItem('toy')">장난감 (30코인) - 행복 +50</button>
            </div>
            <button style="background:#ff4757;" onclick="closeShop()">닫기</button>
        </div>
    </div>

    <script>
        // 게임 상태 데이터
        let petData = {
            level: 1,
            exp: 0,
            coins: 0,
            hunger: 70,
            happy: 70,
            clean: 70,
            energy: 70,
            isSick: false
        };

        // 포켓몬 진화 단계 리스트 (피카츄 -> 이상해씨(이로치) -> 마그마 -> 메가리자몽 -> 샤미드)
        // 레벨 9 도달 시 마지막 샤미드로 진화
        const stages = [
            { level: 1, name: "피카츄", icon: "⚡" },
            { level: 3, name: "이로치 이상해씨", icon: "🟢" },
            { level: 5, name: "마그마", icon: "🔥" },
            { level: 7, name: "메가리자몽", icon: "🐉" },
            { level: 9, name: "샤미드", icon: "🌊" }
        ];

        // 배경 거울(거품) 효과 생성
        setInterval(() => {
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            const size = Math.random() * 15 + 5 + 'px';
            bubble.style.width = size;
            bubble.style.height = size;
            bubble.style.left = Math.random() * 380 + 'px';
            bubble.style.animationDuration = (Math.random() * 3 + 2) + 's';
            document.getElementById('bubbles').appendChild(bubble);
            setTimeout(() => bubble.remove(), 5000);
        }, 600);

        // 3초마다 게이지 감소
        setInterval(() => {
            if (petData.isSick) return;
            petData.hunger = Math.max(0, petData.hunger - 2);
            petData.happy = Math.max(0, petData.happy - 2);
            petData.clean = Math.max(0, petData.clean - 2);
            petData.energy = Math.max(0, petData.energy - 2);

            checkSickness();
            updateUI();
        }, 3000);

        function checkSickness() {
            if (petData.hunger === 0 || petData.happy === 0 || petData.clean === 0 || petData.energy === 0) {
                if (!petData.isSick) {
                    petData.isSick = true;
                    showSpeech("아파요... 🤒 도와주세요!");
                    document.getElementById('cure-btn').style.display = 'block';
                }
            }
        }

        function curePet() {
            petData.hunger = 50;
            petData.happy = 50;
            petData.clean = 50;
            petData.energy = 50;
            petData.isSick = false;
            document.getElementById('cure-btn').style.display = 'none';
            showSpeech("건강을 되찾았어요! ✨");
            updateUI();
        }

        function drinkWater() {
            showSpeech("꿀꺽꿀꺽~ 바닷물 시원하다! 🌊");
            petData.hunger = Math.min(100, petData.hunger + 2);
            updateUI();
        }

        function showSpeech(text) {
            const speech = document.getElementById('speech');
            speech.innerText = text;
            speech.style.display = 'block';
            setTimeout(() => { speech.style.display = 'none'; }, 2000);
        }

        function addExpAndCoins() {
            if (petData.isSick) return;
            petData.exp += 10;
            petData.coins += 5;

            if (petData.exp >= 100) {
                petData.exp = 0;
                petData.level++;
                checkEvolution();
            }
            updateUI();
        }

        function checkEvolution() {
            let currentStageInfo = stages[0];
            for (let s of stages) {
                if (petData.level >= s.level) {
                    currentStageInfo = s;
                }
            }
            
            showSpeech(`${currentStageInfo.name}(이)가 진화했다! 🎉`);
            triggerFireworks();
        }

        function triggerFireworks() {
            const stage = document.getElementById('stage');
            for (let i = 0; i < 15; i++) {
                const fw = document.createElement('div');
                fw.className = 'firework';
                fw.innerHTML = '✨';
                fw.style.left = '50%';
                fw.style.top = '50%';
                fw.style.setProperty('--tx', (Math.random() - 0.5) * 200 + 'px');
                fw.style.setProperty('--ty', (Math.random() - 0.5) * 200 + 'px');
                stage.appendChild(fw);
                setTimeout(() => fw.remove(), 1000);
            }
        }

        // 상호작용 액션
        function feedPet() {
            if (petData.isised) return;
            petData.hunger = Math.min(100, petData.hunger + 25);
            petData.happy = Math.min(100, petData.happy + 5);
            if(petData.energy > 0) petData.energy = Math.min(100, petData.energy + 5);
            showSpeech("냠냠 맛있어! 🍗");
            addExpAndCoins();
        }

        function playPet() {
            if (petData.isSick) return;
            petData.happy = Math.min(100, petData.happy + 25);
            petData.hunger = Math.max(0, petData.hunger - 10);
            petData.energy = Math.max(0, petData.energy - 15);
            petData.clean = Math.max(0, petData.clean - 10);
            showSpeech("신나게 수영하고 놀았다! 🎾");
            addExpAndCoins();
        }

        function washPet() {
            if (petData.isSick) return;
            petData.clean = Math.min(100, petData.clean + 35);
            petData.happy = Math.max(0, petData.happy - 5);
            showSpeech("뽀득뽀득 깨끗해졌어요! 🧼");
            addExpAndCoins();
        }

        // UI 갱신 함수
        function updateUI() {
            // 현재 포켓몬 찾기
            let currentPet = stages[0];
            for (let s of stages) {
                if (petData.level >= s.level) {
                    currentPet = s;
                }
            }

            // 표정 변경 시스템
            let faceEmoji = currentPet.icon;
            if (petData.isSick) {
                faceEmoji = "🤒";
            } else {
                let avg = (petData.hunger + petData.happy + petData.clean + petData.energy) / 4;
                if (avg > 70) faceEmoji = currentPet.icon + " 😊";
                else if (avg > 30) faceEmoji = currentPet.icon + " 😐";
                else faceEmoji = currentPet.icon + " 😢";
            }

            document.getElementById('pet').innerText = faceEmoji;
            document.getElementById('level-display').innerText = `Lv.${petData.level} ${currentPet.name}`;
            document.getElementById('coin-display').innerText = `🪙 ${petData.coins}코인`;
            document.getElementById('exp-text').innerText = petData.exp;
            document.getElementById('exp-bar').style.width = petData.exp + '%';

            setBar('bar-hunger', petData.hunger);
            setBar('bar-happy', petData.happy);
            setBar('bar-clean', petData.clean);
            setBar('bar-energy', petData.energy);
        }

        function setBar(id, value) {
            const bar = document.getElementById(id);
            bar.style.width = value + '%';
            if (value > 50) bar.style.backgroundColor = '#2ed573'; // 초록
            else if (value > 20) bar.style.backgroundColor = '#ffa502'; // 주황
            else bar.style.backgroundColor = '#ff4757'; // 빨강
        }

        // 상점 및 미니게임 모달 제어
        function openShop() { document.getElementById('shop-modal').style.display = 'flex'; }
        function closeShop() { document.getElementById('shop-modal').style.display = 'none'; }
        function openGame() { document.getElementById('game-modal').style.display = 'flex'; }
        function closeGame() { document.getElementById('game-modal').style.display = 'none'; }

        function buyItem(type) {
            if (type === 'snack' && petData.coins >= 20) {
                petData.coins -= 20;
                petData.hunger = Math.min(100, petData.hunger + 40);
                showSpeech("간식 냠냠! 🍖");
            } else if (type === 'toy' && petData.coins >= 30) {
                petData.coins -= 30;
                petData.happy = Math.min(100, petData.happy + 50);
                showSpeech("새 장난감 최고야! 🎉");
            } else {
                alert("코인이 부족해요! 코인을 모아보세요.");
            }
            updateUI();
        }

        function playRPS(userChoice) {
            const choices = ['rock', 'paper', 'scissors'];
            const petChoice = choices[Math.floor(Math.random() * 3)];
            const map = { rock: '✊ 바위', paper: '✋ 보', scissors: '✌️ 가위' };

            let resultText = `포켓몬: ${map[petChoice]} / 당신: ${map[userChoice]} - `;

            if (userChoice === petChoice) {
                resultText += "비겼어요! 😐";
            } else if (
                (userChoice === 'rock' && petChoice === 'scissors') ||
                (userChoice === 'paper' && petChoice === 'rock') ||
                (userChoice === 'scissors' && petChoice === 'paper')
            ) {
                resultText += "이겼어요! 행복 +15, 코인 +10 ✨";
                petData.happy = Math.min(100, petData.happy + 15);
                petData.coins += 10;
            } else {
                resultText += "졌어요... 행복 +5 💧";
                petData.happy = Math.min(100, petData.happy + 5);
            }

            document.getElementById('rps-result').innerText = resultText;
            updateUI();
        }

        // 초기 화면 렌더링
        updateUI();
    </script>
</body>
</html>
