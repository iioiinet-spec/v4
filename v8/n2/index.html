<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고양이 키우기 🐱</title>
    <style>
        :root {
            --bg-day: #FFF5EE;
            --bg-night: #2C3E50;
            --card-bg: #FFFFFF;
            --text-color: #4A4A4A;
            --primary: #FFB6C1;
            --secondary: #FFD700;
        }

        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background-color: var(--bg-day);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background-color 0.5s ease;
            user-select: none;
        }

        body.night {
            background-color: var(--bg-night);
            color: #ECF0F1;
        }

        .game-container {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 15px;
            transition: background 0.5s ease;
        }

        body.night .game-container {
            background: #34495E;
        }

        /* 상단 정보 */
        .header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .exp-bar-container {
            width: 100%;
            background: #E0E0E0;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 5px;
        }

        .exp-bar {
            height: 100%;
            background: #FF69B4;
            width: 0%;
            transition: width 0.3s;
        }

        /* 메인 펫 영역 */
        .pet-stage {
            text-align: center;
            position: relative;
            padding: 20px 0;
        }

        .speech-bubble {
            background: #FFF;
            border: 2px solid #FFB6C1;
            border-radius: 15px;
            padding: 8px 15px;
            font-size: 0.95rem;
            display: inline-block;
            margin-bottom: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            color: #333;
            min-height: 20px;
        }

        .pet-avatar {
            font-size: 5rem;
            display: inline-block;
            animation: bounce 2s infinite ease-in-out;
            cursor: pointer;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* 스탯 바 */
        .stats-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .stat-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .stat-bar-bg {
            flex-grow: 1;
            background: #E0E0E0;
            height: 14px;
            border-radius: 7px;
            overflow: hidden;
        }

        .stat-bar-fill {
            height: 100%;
            width: 50%;
            transition: width 0.3s, background-color 0.3s;
        }

        /* 버튼 영역 */
        .action-buttons, .shop-buttons, .mini-game-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        button {
            background: #FFB6C1;
            border: none;
            border-radius: 15px;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.1s, background 0.2s;
        }

        button:active {
            transform: scale(0.95);
        }

        button:hover {
            opacity: 0.9;
        }

        .section-title {
            font-size: 1rem;
            margin: 5px 0 0 0;
            font-weight: bold;
            border-bottom: 2px dashed #ddd;
            padding-bottom: 3px;
        }

        /* 미니게임 결과창 */
        #mini-game-result {
            text-align: center;
            font-weight: bold;
            font-size: 0.95rem;
            min-height: 24px;
            color: #FF6B6B;
        }
    </style>
</head>
<body id="body">

    <div class="game-container">
        <!-- 상단: 레벨, 코인, 시간 -->
        <div>
            <div class="header-info">
                <span id="level-display">Lv.1 새끼 고양이</span>
                <span id="coin-display">🪙 0 코인</span>
                <span id="time-display">🌞 낮</span>
            </div>
            <div class="exp-bar-container">
                <div class="exp-bar" id="exp-bar"></div>
            </div>
        </div>

        <!-- 메인 펫 영역 -->
        <div class="pet-stage">
            <div class="speech-bubble" id="speech-bubble">안녕! 나는 야옹이야 🐾</div>
            <div class="pet-avatar" id="pet-avatar" onclick="petClick()">🐱</div>
        </div>

        <!-- 상태 스탯 -->
        <div class="stats-container">
            <div class="stat-row">
                <span>🍖 포만감</span>
                <div class="stat-bar-bg"><div class="stat-bar-fill" id="bar-hunger"></div></div>
                <span id="val-hunger">50</span>
            </div>
            <div class="stat-row">
                <span>💖 행복</span>
                <div class="stat-bar-bg"><div class="stat-bar-fill" id="bar-happy"></div></div>
                <span id="val-happy">50</span>
            </div>
            <div class="stat-row">
                <span>✨ 청결</span>
                <div class="stat-bar-bg"><div class="stat-bar-fill" id="bar-clean"></div></div>
                <span id="val-clean">50</span>
            </div>
            <div class="stat-row">
                <span>⚡ 에너지</span>
                <div class="stat-bar-bg"><div class="stat-bar-fill" id="bar-energy"></div></div>
                <span id="val-energy">50</span>
            </div>
        </div>

        <!-- 기본 상호작용 -->
        <h3 class="section-title">돌보기</h3>
        <div class="action-buttons">
            <button onclick="feed()">🥣 밥 주기</button>
            <button onclick="play()">🧶 놀아주기</button>
            <button onclick="wash()">🛁 씻기기</button>
            <button onclick="sleep()">💤 재우기</button>
        </div>

        <!-- 상점 -->
        <h3 class="section-title">상점</h3>
        <div class="shop-buttons">
            <button onclick="buyItem('snack')">사료 (15코인)</button>
            <button onclick="buyItem('treat')">간식 (35코인)</button>
            <button onclick="buyItem('fish')">생선 (45코인)</button>
            <button onclick="buyItem('bath')">목욕세트 (25코인)</button>
        </div>

        <!-- 미니게임 (가위바위보) -->
        <h3 class="section-title">미니게임 (가위바위보)</h3>
        <div class="mini-game-buttons">
            <button onclick="playRPS('가위')">✌️ 가위</button>
            <button onclick="playRPS('바위')">✊ 바위</button>
        </div>
        <div id="mini-game-result">야옹이와 가위바위보를 해보세요!</div>
    </div>

    <script>
        // 게임 상태 데이터
        let game = {
            level: 1,
            exp: 0,
            maxExp: 500,
            coins: 50,
            hunger: 50,
            happy: 50,
            clean: 50,
            energy: 50,
            isSleeping: false,
            isNight: false
        };

        const stages = [
            { level: 1, name: "새끼 고양이", emoji: "🐱" },
            { level: 2, name: "어린 고양이", emoji: "😺" },
            { level: 3, name: "어른 고양이", emoji: "🦁" }
        ];

        // 메시지 출력 함수
        function speak(msg) {
            document.getElementById('speech-bubble').innerText = msg;
        }

        // 스탯 제한 및 색상 업데이트
        function updateStats() {
            game.hunger = Math.max(0, Math.min(100, game.hunger));
            game.happy = Math.max(0, Math.min(100, game.happy));
            game.clean = Math.max(0, Math.min(100, game.clean));
            game.energy = Math.max(0, Math.min(100, game.energy));

            setBar('hunger', game.hunger);
            setBar('happy', game.happy);
            setBar('clean', game.clean);
            setBar('energy', game.energy);

            // 레벨 및 코인 표시
            let currentStage = stages[Math.min(game.level - 1, stages.length - 1)];
            document.getElementById('level-display').innerText = `Lv.${game.level} ${currentStage.name}`;
            document.getElementById('coin-display').innerText = `🪙 ${game.coins} 코인`;
            document.getElementById('exp-bar').style.width = `${(game.exp / game.maxExp) * 100}%`;

            // 아바타 및 표정 관리
            let avatar = currentStage.emoji;
            if (game.isSleeping) {
                avatar = "💤 " + currentStage.emoji;
            } else if (game.happy < 40 || game.hunger < 40) {
                avatar = "😿";
            } else if (game.happy > 70) {
                avatar = "😻";
            }
            document.getElementById('pet-avatar').innerText = avatar;
        }

        function setBar(statName, value) {
            let bar = document.getElementById(`bar-${statName}`);
            let val = document.getElementById(`val-${statName}`);
            bar.style.width = `${value}%`;
            val.innerText = Math.floor(value);

            // 색상 변경 (0~45 빨강, 46~65 노랑, 67~100 초록)
            if (value <= 45) {
                bar.style.backgroundColor = '#FF6B6B';
            } else if (value <= 65) {
                bar.style.backgroundColor = '#FCC419';
            } else {
                bar.style.backgroundColor = '#51CF66';
            }
        }

        // 경험치 및 코인 획득 공통 함수
        function reward(expGain, coinGain = 5) {
            game.exp += expGain;
            game.coins += coinGain;

            if (game.exp >= game.maxExp) {
                game.exp -= game.maxExp;
                if (game.level < 3) {
                    game.level++;
                    speak(`🎉 야옹이가 Lv.${game.level}(으)로 진화했다! ✨`);
                }
            }
            updateStats();
        }

        // 터치 반응
        function petClick() {
            speak("야옹~ 🐾 쓰다듬어 주니 좋아해요!");
            reward(2, 2);
        }

        // 기본 액션 함수들
        function feed() {
            if(game.isSleeping) return speak("야옹이가 자고 있어요. 깨우지 마세요! 💤");
            game.hunger += 25;
            game.happy += 5;
            if(game.energy > 0) game.energy += 5;
            speak("냠냠 맛있어! 밥을 먹었어요 🥣");
            reward(10);
        }

        function play() {
            if(game.isSleeping) return speak("야옹이가 자고 있어요! 💤");
            if(game.energy < 15) return speak("에너지가 부족해서 놀 수 없어요... 🥱");
            game.happy += 25;
            game.hunger -= 10;
            game.energy -= 15;
            game.clean -= 10;
            speak("신나게 장난감을 가지고 놀았어요! 🧶");
            reward(15);
        }

        function wash() {
            if(game.isSleeping) return speak("야옹이가 자고 있어요! 💤");
            game.clean += 35;
            game.happy -= 5;
            speak("뽀득뽀득 깨끗해졌어요! 🛁");
            reward(12);
        }

        function sleep() {
            if (game.isSleeping) {
                game.isSleeping = false;
                speak("기분 좋게 낮잠에서 일어났어요! ✨");
            } else {
                game.isSleeping = true;
                speak("스르륵... 잠에 빠져듭니다 💤");
            }
            updateStats();
        }

        // 상점 구매 시스템
        function buyItem(itemType) {
            let items = {
                snack: { cost: 15, hunger: 25, clean: -5, happy: 0, name: "사료" },
                treat: { cost: 35, hunger: 40, clean: -10, happy: 10, name: "간식" },
                fish: { cost: 45, hunger: 55, clean: -15, happy: 40, name: "생선" },
                bath: { cost: 25, clean: 15, energy: -10, happy: -20, name: "목욕세트" }
            };

            let item = items[itemType];
            if (game.coins < item.cost) {
                return speak("코인이 부족해요! 열심히 돌봐주세요 🪙");
            }

            game.coins -= item.cost;
            if(item.hunger) game.hunger += item.hunger;
            if(item.clean) game.clean += item.clean;
            if(item.happy) game.happy += item.happy;
            if(item.energy) game.energy += item.energy;

            speak(`상점에서 ${item.name}(을)를 구매해 사용했어요! 🛒`);
            reward(8, 0);
        }

        // 미니게임 (가위바위보)
        function playRPS(playerChoice) {
            if(game.isSleeping) return speak("야옹이가 자고 있어서 게임할 수 없어요! 💤");
            
            const choices = ['가위', '바위'];
            const catChoice = choices[Math.floor(Math.random() * choices.length)];
            let resultText = `야옹이: ${catChoice} vs 나: ${playerChoice} - `;

            if (playerChoice === catChoice) {
                resultText += "비겼어요! 😐 (행복 +5)";
                game.happy += 5;
                reward(5, 5);
            } else if (
                (playerChoice === '바위' && catChoice === '가위')
            ) {
                resultText += "이겼어요! 🎉 (행복 +15, 코인 +10)";
                game.happy += 15;
                reward(15, 10);
            } else {
                resultText += "졌어요... 😢 (행복 +5)";
                game.happy += 5;
                reward(5, 5);
            }
            document.getElementById('mini-game-result').innerText = resultText;
            updateStats();
        }

        // 시간 주기 루프 (게이지 감소 및 낮/밤 변경)
        setInterval(() => {
            // 게이지 감소 (3~6초 주기를 반영하여 매 4초마다 실행)
            let drainMultiplier = game.isNight ? 1.5 : 1.0;
            
            game.hunger -= 4 * drainMultiplier;
            game.happy -= 3 * drainMultiplier;
            game.clean -= 2 * drainMultiplier;

            if (game.isSleeping) {
                game.energy += 15; // 자는 동안 에너지 회복
            } else {
                game.energy -= 3 * drainMultiplier;
            }

            updateStats();
        }, 4000);

        // 낮과 밤 변경 루프 (30초마다 전환)
        setInterval(() => {
            game.isNight = !game.isNight;
            const body = document.getElementById('body');
            const timeDisplay = document.getElementById('time-display');

            if (game.isNight) {
                body.classList.add('night');
                timeDisplay.innerText = "🌙 밤";
                speak("밤이 되었어요. 에너지가 더 빨리 닳으니 재워주세요! 🌙");
            } else {
                body.classList.remove('night');
                timeDisplay.innerText = "🌞 낮";
                speak("상쾌한 아침이 밝았습니다! 🌞");
            }
        }, 30000);

        // 초기 실행
        updateStats();
    </script>
</body>
</html>
