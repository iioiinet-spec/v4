<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 펫 키우기 🐾</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Jua', 'Comic Sans MS', sans-serif, system-ui;
        }
        body {
            background-color: #fff3e0;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.5s;
        }
        body.night {
            background-color: #263238;
        }
        .game-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 440px;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 22px;
            text-align: center;
            border: 4px solid #ffe0b2;
            transition: background-color 0.5s, border-color 0.5s;
        }
        body.night .game-container {
            background-color: #37474f;
            border-color: #546e7a;
        }
        
        /* 펫 선택 화면 스타일 */
        #select-screen h1 {
            color: #ef6c00;
            font-size: 26px;
            margin-bottom: 5px;
        }
        #select-screen p {
            color: #777;
            font-size: 15px;
            margin-bottom: 25px;
        }
        body.night #select-screen p {
            color: #b0bec5;
        }
        .pet-select-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        .pet-card {
            background: #fff8e1;
            border: 3px solid #ffe082;
            border-radius: 20px;
            padding: 20px 10px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }
        .pet-card:hover {
            transform: translateY(-5px);
            background-color: #ffecb3;
        }
        .pet-card-icon {
            font-size: 55px;
            margin-bottom: 8px;
        }
        .pet-card-name {
            font-size: 16px;
            color: #e65100;
            font-weight: bold;
        }

        /* 게임 메인 화면 스타일 */
        #game-screen {
            display: none;
        }
        h2 {
            color: #ef6c00;
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        body.night h2 {
            color: #ffb74d;
        }
        .top-info-box {
            display: flex;
            gap: 5px;
            align-items: center;
        }
        .badge-box {
            font-size: 13px;
            background-color: #fffde7;
            padding: 4px 6px;
            border-radius: 12px;
            border: 2px solid #fff59d;
            color: #fbc02d;
            font-weight: bold;
        }
        .home-btn {
            background-color: #ffb74d;
            border: 2px solid #ffa726;
            color: white;
            padding: 4px 6px;
            border-radius: 12px;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 0 2px 0 #f57c00;
        }
        .reset-btn {
            background-color: #ff8a80;
            border: 2px solid #ff5252;
            color: white;
            padding: 4px 6px;
            border-radius: 12px;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 0 2px 0 #d32f2f;
        }
        .status-header {
            background-color: #fff8e1;
            border-radius: 15px;
            padding: 10px 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            color: #f57f17;
            font-weight: bold;
        }
        body.night .status-header {
            background-color: #455a64;
            color: #ffe082;
        }
        .exp-bar-container {
            width: 100%;
            background-color: #ffe0b2;
            height: 10px;
            border-radius: 5px;
            margin-top: 6px;
            overflow: hidden;
        }
        body.night .exp-bar-container {
            background-color: #607d8b;
        }
        .exp-bar {
            height: 100%;
            background-color: #ffb300;
            width: 0%;
            transition: width 0.3s;
        }
        .pet-stage {
            position: relative;
            height: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }
        .speech-bubble {
            background-color: #fff9c4;
            border: 2px solid #fbc02d;
            border-radius: 15px;
            padding: 6px 12px;
            font-size: 14px;
            color: #f57f17;
            margin-bottom: 8px;
            position: relative;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            min-height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pet {
            font-size: 70px;
            cursor: pointer;
            transition: transform 0.2s;
            animation: bounce 1.5s infinite ease-in-out;
            user-select: none;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0) scale(1, 1); }
            50% { transform: translateY(-10px) scale(1.05, 0.95); }
        }
        @keyframes shine {
            0% { filter: hue-rotate(0deg) brightness(1); }
            50% { filter: hue-rotate(90deg) brightness(1.4); transform: scale(1.25); }
            100% { filter: hue-rotate(0deg) brightness(1); }
        }
        .pet.evolve-effect {
            animation: shine 0.6s ease-in-out;
        }
        .gauges {
            background-color: #fafafa;
            border-radius: 15px;
            padding: 8px 12px;
            margin-bottom: 12px;
            border: 2px solid #f0f0f0;
        }
        body.night .gauges {
            background-color: #263238;
            border-color: #455a64;
        }
        .gauge-row {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
            font-size: 13px;
        }
        .gauge-row:last-child { margin-bottom: 0; }
        .gauge-label {
            width: 75px;
            text-align: left;
            color: #555;
            font-weight: bold;
        }
        body.night .gauge-label { color: #cfd8dc; }
        .gauge-bar-bg {
            flex-grow: 1;
            background-color: #eee;
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
            margin: 0 8px;
        }
        body.night .gauge-bar-bg { background-color: #455a64; }
        .gauge-bar-fill {
            height: 100%;
            width: 70%;
            transition: width 0.3s, background-color 0.3s;
        }
        .gauge-value {
            width: 35px;
            text-align: right;
            color: #777;
            font-size: 12px;
        }
        body.night .gauge-value { color: #b0bec5; }
        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 8px;
        }
        button {
            color: white;
            border: none;
            border-radius: 14px;
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s;
        }
        button:active { transform: translateY(2px); }
        #btn-feed { background-color: #ff7043; box-shadow: 0 3px 0 #d84315; }
        #btn-play { background-color: #ffa726; box-shadow: 0 3px 0 #f57c00; }
        #btn-wash { background-color: #29b6f6; box-shadow: 0 3px 0 #0288d1; }
        #btn-sleep { background-color: #ab47bc; box-shadow: 0 3px 0 #7b1fa2; }
        #btn-cure { 
            background-color: #ef5350; 
            box-shadow: 0 3px 0 #c62828; 
            grid-column: span 2;
            display: none; 
        }
        .sub-btn-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        #btn-minigame { background-color: #26a69a; box-shadow: 0 3px 0 #00695c; }
        #btn-shop { background-color: #ec407a; box-shadow: 0 3px 0 #c2185b; }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            width: 330px;
            border: 3px solid #ffcc80;
        }
        .modal-content h3 { color: #f57c00; margin-top: 0; }
        .rps-btn {
            background-color: #fff;
            border: 2px solid #26a69a;
            border-radius: 12px;
            font-size: 26px;
            padding: 8px 12px;
            margin: 4px;
            cursor: pointer;
            box-shadow: 0 3px 0 #b2dfdb;
        }
        .shop-item {
            background: #fff8e1;
            border: 2px solid #ffe082;
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }
        .shop-item button {
            background-color: #ffa726;
            box-shadow: 0 2px 0 #f57c00;
            padding: 6px 12px;
            font-size: 13px;
        }
        .close-btn {
            background-color: #78909c;
            box-shadow: 0 3px 0 #455a64;
            margin-top: 10px;
            padding: 8px 16px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="game-container">
    
    <!-- 1. 펫 선택 화면 -->
    <div id="select-screen">
        <h1>🐾 펫 키우기</h1>
        <p>함께 키울 친구를 선택해 주세요!</p>
        <div class="pet-select-grid">
            <div class="pet-card" onclick="selectPet('dog')">
                <div class="pet-card-icon">🐶</div>
                <div class="pet-card-name">강아지</div>
            </div>
            <div class="pet-card" onclick="selectPet('cat')">
                <div class="pet-card-icon">🐱</div>
                <div class="pet-card-name">고양이</div>
            </div>
            <div class="pet-card" onclick="selectPet('dino')">
                <div class="pet-card-icon">🦖</div>
                <div class="pet-card-name">공룡</div>
            </div>
            <div class="pet-card" onclick="selectPet('slime')">
                <div class="pet-card-icon">🟢</div>
                <div class="pet-card-name">슬라임</div>
            </div>
        </div>
    </div>

    <!-- 2. 게임 메인 화면 -->
    <div id="game-screen">
        <h2>
            <span id="title-text">🐱 펫 키우기</span>
            <div class="top-info-box">
                <span class="badge-box" id="coin-display">🪙 0</span>
                <button class="home-btn" onclick="goHome()">🏠 선택</button>
                <button class="reset-btn" onclick="resetGame()">🔄 초기화</button>
            </div>
        </h2>

        <div class="status-header">
            <div style="width: 100%;">
                <div style="display: flex; justify-content: space-between;">
                    <span id="level-text">단계: 알 🥚</span>
                    <span id="exp-text">EXP: 0/100</span>
                </div>
                <div class="exp-bar-container">
                    <div class="exp-bar" id="exp-bar"></div>
                </div>
            </div>
        </div>

        <div class="pet-stage">
            <div class="speech-bubble" id="speech-bubble">반가워! 나를 잘 키워줘! 😊</div>
            <div class="pet" id="pet" onclick="clickPet()">🥚</div>
        </div>

        <!-- 5가지 상태 게이지 (포만감, 행복, 청결, 에너지, 수면) -->
        <div class="gauges">
            <div class="gauge-row">
                <span class="gauge-label">🍗 포만감</span>
                <div class="gauge-bar-bg"><div class="gauge-bar-fill" id="bar-hunger"></div></div>
                <span class="gauge-value" id="val-hunger">70</span>
            </div>
            <div class="gauge-row">
                <span class="gauge-label">⭐ 행복</span>
                <div class="gauge-bar-bg"><div class="gauge-bar-fill" id="bar-happy"></div></div>
                <span class="gauge-value" id="val-happy">70</span>
            </div>
            <div class="gauge-row">
                <span class="gauge-label">✨ 청결</span>
                <div class="gauge-bar-bg"><div class="gauge-bar-fill" id="bar-clean"></div></div>
                <span class="gauge-value" id="val-clean">70</span>
            </div>
            <div class="gauge-row">
                <span class="gauge-label">⚡ 에너지</span>
                <div class="gauge-bar-bg"><div class="gauge-bar-fill" id="bar-energy"></div></div>
                <span class="gauge-value" id="val-energy">70</span>
            </div>
            <div class="gauge-row">
                <span class="gauge-label">💤 수면</span>
                <div class="gauge-bar-bg"><div class="gauge-bar-fill" id="bar-sleep"></div></div>
                <span class="gauge-value" id="val-sleep">70</span>
            </div>
        </div>

        <div class="buttons-grid">
            <button id="btn-feed" onclick="feedPet()">🍗 밥 주기</button>
            <button id="btn-play" onclick="playPet()">⭐ 놀아주기</button>
            <button id="btn-wash" onclick="washPet()">✨ 씻기기</button>
            <button id="btn-sleep" onclick="sleepPet()">💤 재우기</button>
            <button id="btn-cure" onclick="curePet()">💊 치료하기</button>
        </div>
        
        <div class="sub-btn-row">
            <button id="btn-minigame" onclick="openMinigame()">🎮 미니게임</button>
            <button id="btn-shop" onclick="openShop()">🛍️ 상점 가기</button>
        </div>
    </div>
</div>

<!-- 미니게임 모달 -->
<div class="modal" id="rps-modal">
    <div class="modal-content">
        <h3 id="rps-title">펫과 가위바위보! ✊✌️✋</h3>
        <p id="rps-result-text">무엇을 내겠습니까?</p>
        <div style="margin: 15px 0;">
            <button class="rps-btn" onclick="playRPS('rock')">✊</button>
            <button class="rps-btn" onclick="playRPS('paper')">✋</button>
            <button class="rps-btn" onclick="playRPS('scissors')">✌️</button>
        </div>
        <button class="close-btn" onclick="closeModal('rps-modal')">닫기</button>
    </div>
</div>

<!-- 상점 모달 -->
<div class="modal" id="shop-modal">
    <div class="modal-content">
        <h3>🛍️ 펫 상점</h3>
        <div class="shop-item">
            <span>🍗 영양 간식<br><small>포만감 +40</small></span>
            <button onclick="buyItem('snack', 20)">20 코인</button>
        </div>
        <div class="shop-item">
            <span>🎁 장난감<br><small>행복 +50</small></span>
            <button onclick="buyItem('toy', 30)">30 코인</button>
        </div>
        <button class="close-btn" onclick="closeModal('shop-modal')">닫기</button>
    </div>
</div>

<script>
    const petDataConfig = {
        dog: {
            title: "강아지 키우기",
            stages: [
                { name: "알", icon: "🥚" },
                { name: "아기 강아지", icon: "🐶" },
                { name: "청소년 강아지", icon: "🐕" },
                { name: "어른 강아지", icon: "🦮" }
            ],
            messages: ["멍멍! 산책 가자 주인님! 🐾", "꼬리를 흔들며 반겨줘요~", "간식 최고! 🦴", "활기차게 뛰어놀 준비 완료!"]
        },
        cat: {
            title: "고양이 키우기",
            stages: [
                { name: "알", icon: "🥚" },
                { name: "아기 고양이", icon: "🐱" },
                { name: "청소년 고양이", icon: "😺" },
                { name: "어른 고양이", icon: "🐈" }
            ],
            messages: ["골골골... 쓰다듬어 주니 좋아요 🐾", "집사, 오늘 간식은 뭐야? 🐟", "햇살이 따스해서 졸린가봐요 ☀️", "도도하게 앞발을 핥고 있어요 🐱"]
        },
        dino: {
            title: "공룡 키우기",
            stages: [
                { name: "알", icon: "🥚" },
                { name: "아기 공룡", icon: "🦖" },
                { name: "청소년 공룡", icon: "🦕" },
                { name: "어른 공룡", icon: "🐉" }
            ],
            messages: ["크아앙! 멋진 공룡이 될 거야! 🔥", "고기를 많이 먹고 쑥쑥 크는 중! 🍖", "꼬리로 땅을 쿵쿵 울려봐요 🌋", "따뜻한 체온이 느껴져요 ✨"]
        },
        slime: {
            title: "슬라임 키우기",
            stages: [
                { name: "알", icon: "🥚" },
                { name: "아기 슬라임", icon: "🟢" },
                { name: "청소년 슬라임", icon: "🔵" },
                { name: "어른 슬라임", icon: "🟣" }
            ],
            messages: ["말랑말랑 촉감이 좋아요~ ✨", "퐁글퐁글 뛰어놀기! 💧", "젤리처럼 통통 튀어요 🍡", "반짝반짝 빛나는 슬라임이에요!"]
        }
    };

    let currentPetType = null;
    let gameInterval = null;

    // 게임 상태 변수 (sleep 스탯 추가됨)
    let state = {
        hunger: 70,
        happy: 70,
        clean: 70,
        energy: 70,
        sleep: 70,
        exp: 0,
        level: 1,
        coins: 0,
        isSleeping: false,
        isNight: false,
        isSick: false
    };

    const selectScreen = document.getElementById('select-screen');
    const gameScreen = document.getElementById('game-screen');
    const petEl = document.getElementById('pet');
    const speechEl = document.getElementById('speech-bubble');
    const levelText = document.getElementById('level-text');
    const expText = document.getElementById('exp-text');
    const expBar = document.getElementById('exp-bar');
    const coinDisplay = document.getElementById('coin-display');
    const titleText = document.getElementById('title-text');
    const btnCure = document.getElementById('btn-cure');
    const rpsResultText = document.getElementById('rps-result-text');

    const bars = {
        hunger: document.getElementById('bar-hunger'),
        happy: document.getElementById('bar-happy'),
        clean: document.getElementById('bar-clean'),
        energy: document.getElementById('bar-energy'),
        sleep: document.getElementById('bar-sleep')
    };

    const vals = {
        hunger: document.getElementById('val-hunger'),
        happy: document.getElementById('val-happy'),
        clean: document.getElementById('val-clean'),
        energy: document.getElementById('val-energy'),
        sleep: document.getElementById('val-sleep')
    };

    function selectPet(type) {
        currentPetType = type;
        selectScreen.style.display = 'none';
        gameScreen.style.display = 'block';
        titleText.textContent = `${petDataConfig[type].title} 🐾`;
        resetStateValues();
        startGameLoop();
        updateUI();
    }

    function goHome() {
        if(gameInterval) clearInterval(gameInterval);
        gameScreen.style.display = 'none';
        selectScreen.style.display = 'block';
        document.body.classList.remove('night');
    }

    function resetStateValues() {
        state.hunger = 70;
        state.happy = 70;
        state.clean = 70;
        state.energy = 70;
        state.sleep = 70;
        state.exp = 0;
        state.level = 1;
        state.coins = 0;
        state.isSleeping = false;
        state.isNight = false;
        state.isSick = false;
    }

    function resetGame() {
        if (confirm("게임을 초기화하고 알 단계로 돌아가시겠습니까?")) {
            resetStateValues();
            document.body.classList.remove('night');
            showMessage("새로운 알이 태어났습니다 🥚");
            updateUI();
        }
    }

    function getGaugeColor(val) {
        if (val > 60) return '#66bb6a';
        if (val > 30) return '#ffa726';
        return '#ef5350';
    }

    function updateUI() {
        if (!currentPetType) return;
        for (let key in bars) {
            bars[key].style.width = state[key] + '%';
            bars[key].style.backgroundColor = getGaugeColor(state[key]);
            vals[key].textContent = Math.round(state[key]);
        }

        let stages = petDataConfig[currentPetType].stages;
        let currentStage = stages[state.level - 1];
        levelText.textContent = `단계: ${currentStage.name} ${currentStage.icon}`;
        expText.textContent = `EXP: ${state.exp}/100`;
        expBar.style.width = state.exp + '%';
        coinDisplay.textContent = `🪙 ${state.coins}`;

        if (state.isSick) {
            btnCure.style.display = 'block';
        } else {
            btnCure.style.display = 'none';
        }

        updatePetFace();
    }

    function updatePetFace() {
        if (state.level === 1) {
            petEl.textContent = '🥚';
            return;
        }
        if (state.isSick) {
            petEl.textContent = '🤒';
            return;
        }
        if (state.isSleeping) {
            petEl.textContent = '💤';
            return;
        }
        petEl.textContent = petDataConfig[currentPetType].stages[state.level - 1].icon;
    }

    function showMessage(msg) {
        speechEl.textContent = msg;
    }

    function clamp(val) {
        return Math.max(0, Math.min(100, val));
    }

    function rewardAction() {
        if (state.isSick) return;
        state.coins += 5;
        state.exp += 10;
        if (state.exp >= 100) {
            state.exp -= 100;
            if (state.level < 4) {
                state.level++;
                triggerEvolveEffect();
                showMessage(`🎉 친구가 ${petDataConfig[currentPetType].stages[state.level - 1].name}으로 진화했다! ✨`);
            } else {
                state.exp = 100;
            }
        }
    }

    function triggerEvolveEffect() {
        petEl.classList.add('evolve-effect');
        setTimeout(() => petEl.classList.remove('evolve-effect'), 600);
    }

    // --- 상호작용 액션 ---
    function feedPet() {
        if (state.isSick) { showMessage("아파서 밥을 먹지 못해요! 🤒"); return; }
        if (state.isSleeping) { showMessage("자고 있어요! 깨우지 마세요 💤"); return; }

        state.hunger = clamp(state.hunger + 25);
        state.energy = clamp(state.energy + 10);
        state.happy = clamp(state.happy + 5);
        rewardAction();
        if (!state.isSick) showMessage("맛있는 음식을 배불리 먹었어요! 🍖");
        updateUI();
    }

    function playPet() {
        if (state.isSick) { showMessage("아파서 놀 수 없어요! 🤒"); return; }
        if (state.isSleeping) { showMessage("자고 있어요! 💤"); return; }

        state.happy = clamp(state.happy + 25);
        state.hunger = clamp(state.hunger - 10);
        state.energy = clamp(state.energy - 10);
        state.sleep = clamp(state.sleep - 10);
        state.clean = clamp(state.clean - 10);
        rewardAction();
        if (!state.isSick) showMessage("신나게 장난치며 놀았어요! 🎉");
        updateUI();
    }

    function washPet() {
        if (state.isSick) { showMessage("아파서 씻을 수 없어요! 🤒"); return; }
        if (state.isSleeping) { showMessage("자고 있어요! 💤"); return; }

        state.clean = clamp(state.clean + 35);
        state.happy = clamp(state.happy - 5);
        rewardAction();
        if (!state.isSick) showMessage("깨끗하게 씻고 개운해졌어요! ✨");
        updateUI();
    }

    function sleepPet() {
        if (state.isSick) { showMessage("아파서 잠을 잘 못 자요! 🤒"); return; }
        if (state.isSleeping) {
            state.isSleeping = false;
            showMessage("상쾌하게 일어났어요! ☀️");
        } else {
            state.isSleeping = true;
            state.sleep = clamp(state.sleep + 40);
            state.energy = clamp(state.energy + 20);
            state.hunger = clamp(state.hunger - 10);
            showMessage("쿨쿨 단잠에 빠졌습니다... 💤");
        }
        updateUI();
    }

    function curePet() {
        state.isSick = false;
        state.hunger = 40;
        state.happy = 40;
        state.clean = 40;
        state.energy = 40;
        state.sleep = 40;
        showMessage("약 먹고 건강을 완전히 회복했어요! 💖");
        updateUI();
    }

    function clickPet() {
        if (state.isSick) { showMessage("끙끙 앓는 소리를 낸다... 😢"); return; }
        if (state.isSleeping) { showMessage("색색거리며 자고 있어요... 💤"); return; }
        const msgs = petDataConfig[currentPetType].messages;
        showMessage(msgs[Math.floor(Math.random() * msgs.length)]);
    }

    // --- 미니게임 ---
    function openMinigame() {
        if (state.isSick) { showMessage("아파서 게임할 수 없어요! 🤒"); return; }
        if (state.isSleeping) { showMessage("자고 있어서 게임할 수 없어요! 💤"); return; }
        rpsResultText.textContent = "가위, 바위, 보 중 하나를 선택하세요!";
        document.getElementById('rps-modal').style.display = "flex";
    }

    function playRPS(playerChoice) {
        const choices = ['rock', 'paper', 'scissors'];
        const petChoice = choices[Math.floor(Math.random() * choices.length)];
        const emojiMap = { rock: '✊', paper: '✋', scissors: '✌️' };

        let resultMsg = `상대: ${emojiMap[petChoice]} VS 나: ${emojiMap[playerChoice]} - `;

        if (playerChoice === petChoice) {
            resultMsg += "비겼어요!";
            state.happy = clamp(state.happy + 5);
        } else if (
            (playerChoice === 'rock' && petChoice === 'scissors') ||
            (playerChoice === 'paper' && petChoice === 'rock') ||
            (playerChoice === 'scissors' && petChoice === 'paper')
        ) {
            resultMsg += "이겼습니다! 🎉 행복+15, 코인+10";
            state.happy = clamp(state.happy + 15);
            state.coins += 10;
            if (!state.isSick) state.exp += 5;
        } else {
            resultMsg += "졌어요... 😢 행복+5";
            state.happy = clamp(state.happy + 5);
        }
        rpsResultText.textContent = resultMsg;
        updateUI();
    }

    // --- 상점 ---
    function openShop() {
        if (state.isSick) { showMessage("아파서 상점에 갈 수 없어요! 🤒"); return; }
        if (state.isSleeping) { showMessage("자고 있어서 상점에 갈 수 없어요! 💤"); return; }
        document.getElementById('shop-modal').style.display = "flex";
    }

    function buyItem(itemType, cost) {
        if (state.coins < cost) {
            alert("코인이 부족해요!");
            return;
        }
        state.coins -= cost;
        if (itemType === 'snack') {
            state.hunger = clamp(state.hunger + 40);
            showMessage("영양 간식을 맛있게 먹었어요! 🍖");
        } else if (itemType === 'toy') {
            state.happy = clamp(state.happy + 50);
            showMessage("새 장난감으로 신나게 놀았어요! ✨");
        }
        closeModal('shop-modal');
        updateUI();
    }

    function closeModal(modalId) {
        document.getElementById(modalId).style.display = "none";
    }

    // --- 루프 시스템 (3초 주기) ---
    function startGameLoop() {
        if(gameInterval) clearInterval(gameInterval);
        let tickCount = 0;

        gameInterval = setInterval(() => {
            if (!state.isSick && gameScreen.style.display === 'block') {
                let energyLoss = state.isNight ? 5 : 3;
                let sleepLoss = state.isSleeping ? 0 : 2; // 자는 동안에는 수면 게이지가 감소하지 않음

                state.hunger = clamp(state.hunger - 3);
                state.happy = clamp(state.happy - 3);
                state.clean = clamp(state.clean - 2);
                state.energy = clamp(state.energy - energyLoss);
                state.sleep = clamp(state.sleep - sleepLoss);

                // 자는 중일 때 수면 게이지 자동 회복
                if (state.isSleeping) {
                    state.sleep = clamp(state.sleep + 5);
                    if (state.sleep >= 100) {
                        state.isSleeping = false;
                        showMessage("잠을 푹 자고 개운하게 일어났어요! ☀️");
                    }
                }

                if (state.hunger === 0 || state.happy === 0 || state.clean === 0 || state.energy === 0 || state.sleep === 0) {
                    state.isSick = true;
                    state.isSleeping = false;
                    showMessage("너무 지쳐서 아파요... 치료해 주세요! 🤒");
                }

                tickCount++;
                if (tickCount >= 10) {
                    tickCount = 0;
                    state.isNight = !state.isNight;
                    if (state.isNight) {
                        document.body.classList.add('night');
                        showMessage("밤이 되었습니다 🌙");
                    } else {
                        document.body.classList.remove('night');
                        showMessage("상쾌한 아침이 밝았어요! ☀️");
                    }
                }
            }
            updateUI();
        }, 3000);
    }
</script>
