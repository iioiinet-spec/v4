<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>갸라도스 키우기</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #1e90ff, #00ced1, #008b8b);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            /* 산호초 바다 분위기의 배경 패턴 느낌 */
            background-image: radial-gradient(circle, rgba(255,255,255,0.2) 10%, transparent 10%),
                              radial-gradient(circle, rgba(255,192,203,0.2) 15%, transparent 15%);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
        }

        .game-container {
            width: 400px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        /* 상단 정보 영역 */
        .header-info {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-weight: bold;
            color: #333;
        }

        .exp-bar-container {
            width: 100%;
            background: #ddd;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .exp-bar {
            height: 100%;
            background: #ffcc00;
            width: 0%;
            transition: width 0.3s;
        }

        /* 스탯창 */
        .stats-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }

        .stat-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 14px;
            font-weight: bold;
            color: #444;
        }

        .stat-bar-bg {
            flex-grow: 1;
            margin-left: 10px;
            background: #eee;
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
        }

        .stat-bar {
            height: 100%;
            width: 80%;
            background: #4caf50;
            transition: width 0.3s, background 0.3s;
        }

        /* 펫 영역 */
        .pet-stage {
            height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 15px;
        }

        .speech-bubble {
            background: #fff;
            border: 2px solid #333;
            border-radius: 10px;
            padding: 5px 15px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 10px;
            position: relative;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            min-height: 20px;
            text-align: center;
        }

        .pet-image-container {
            width: 150px;
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .pet-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            animation: bounce 1.5s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .status-emoji {
            position: absolute;
            top: 0;
            right: 10px;
            font-size: 24px;
        }

        /* 상호작용 버튼 영역 */
        .actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            width: 100%;
        }

        .btn {
            padding: 10px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: #ff6b6b;
            color: white;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn:hover {
            background: #ff5252;
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-feed { background: #ff9f43; }
        .btn-feed:hover { background: #ff9f43; opacity: 0.9; }
        .btn-play { background: #48dbfb; color: #333; }
        .btn-play:hover { background: #0abde3; color: #fff; }
        .btn-wash { background: #1dd1a1; }
        .btn-wash:hover { background: #10ac84; }
        .btn-cure { background: #ee5253; display: none; grid-column: span 2; }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- 상단 정보 -->
        <div class="header-info">
            <span id="pet-stage-name">단계: 알</span>
            <span id="pet-mood">기분: 보통 😐</span>
        </div>
        <div class="exp-bar-container">
            <div class="exp-bar" id="exp-bar"></div>
        </div>

        <!-- 스탯창 -->
        <div class="stats-container">
            <div class="stat-row">
                <span>포만감</span>
                <div class="stat-bar-bg"><div class="stat-bar" id="bar-hunger"></div></div>
            </div>
            <div class="stat-row">
                <span>행복도</span>
                <div class="stat-bar-bg"><div class="stat-bar" id="bar-happy"></div></div>
            </div>
            <div class="stat-row">
                <span>청결도</span>
                <div class="stat-bar-bg"><div class="stat-bar" id="bar-clean"></div></div>
            </div>
        </div>

        <!-- 펫 영역 -->
        <div class="pet-stage">
            <div class="speech-bubble" id="speech-bubble">안녕! 나를 잘 키워줘!</div>
            <div class="pet-image-container">
                <div class="status-emoji" id="status-emoji">😐</div>
                <!-- 갸라도스 이미지 링크 사용 -->
                <img id="pet-img" class="pet-img" src="https://upload.wikimedia.org/wikipedia/en/5/53/Pok%C3%A9mon_Gyarados_art.png" alt="갸라도스">
            </div>
        </div>

        <!-- 버튼 영역 -->
        <div class="actions">
            <button class="btn btn-feed" onclick="feedPet()">밥 주기 🍖</button>
            <button class="btn btn-play" onclick="playPet()">놀아주기 ⚽</button>
            <button class="btn btn-wash" onclick="washPet()">씻기기 🛁</button>
            <button class="btn btn-cure" id="btn-cure" onclick="curePet()">치료하기 💊</button>
        </div>
    </div>

    <script>
        // 게임 상태 변수
        let state = {
            level: 1, // 1: 알, 2: 아기(미니 갸라도스 느낌), 3: 어른(갸라도스)
            exp: 0,
            hunger: 80,
            happy: 80,
            clean: 80,
            isSick: false
        };

        // 이미지 소스 설정 (알 단계는 구분을 위해 동그란 아이콘 혹은 대체 이미지 사용 가능)
        const imgUrls = {
            egg: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png", 
            baby: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/130.png", // 갸라도스 스프라이트
            adult: "https://upload.wikimedia.org/wikipedia/en/5/53/Pok%C3%A9mon_Gyarados_art.png"
        };

        const stageNames = ["", "알", "아기 갸라도스", "어른 갸라도스"];

        // DOM 요소들
        const expBar = document.getElementById("exp-bar");
        const barHunger = document.getElementById("bar-hunger");
        const barHappy = document.getElementById("bar-happy");
        const barClean = document.getElementById("bar-clean");
        const petImg = document.getElementById("pet-img");
        const statusEmoji = document.getElementById("status-emoji");
        const petMood = document.getElementById("pet-mood");
        const petStageName = document.getElementById("pet-stage-name");
        const speechBubble = document.getElementById("speech-bubble");
        const btnCure = document.getElementById("btn-cure");

        // 3초마다 게이지 감소
        setInterval(() => {
            if (state.isSick) return;

            state.hunger = Math.max(0, state.hunger - 2);
            state.happy = Math.max(0, state.happy - 2);
            state.clean = Math.max(0, state.clean - 2);

            checkSick();
            updateUI();
        }, 3000);

        // 아픔 상태 체크
        function checkSick() {
            if ((state.hunger === 0 || state.happy === 0 || state.clean === 0) && !state.isSick) {
                state.isSick = true;
                speechBubble.innerText = "너무 아파요... ㅠㅠ";
                btnCure.style.display = "block";
            }
        }

        // 공통 경험치 획득 및 성장 체크
        function addExp(amount) {
            if (state.isSick) {
                speechBubble.innerText = "아파서 아무것도 할 수 없어요! 치료가 필요해요!";
                return;
            }

            state.exp += amount;
            if (state.exp >= 100) {
                state.exp = 0;
                if (state.level < 3) {
                    state.level++;
                    speechBubble.innerText = `🎉 갸라도스(이)가 ${stageNames[state.level]}(으)로 진화했다!`;
                } else {
                    speechBubble.innerText = "최종 단계까지 무럭무럭 자랐어요!";
                }
            }
            updateUI();
        }

        // 버튼 상호작용 함수들
        function feedPet() {
            if (state.isSick) return;
            state.hunger = Math.min(100, state.hunger + 20);
            state.happy = Math.min(100, state.happy + 5);
            speechBubble.innerText = "얌얌! 맛있게 잘 먹었어요! 🍖";
            addExp(5);
        }

        function playPet() {
            if (state.isSick) return;
            state.happy = Math.min(100, state.happy + 25);
            state.hunger = Math.max(0, state.hunger - 5);
            state.clean = Math.max(0, state.clean - 15);
            speechBubble.innerText = "신나게 놀았어요! 기분 최고! ⚽";
            addExp(5);
        }

        function washPet() {
            if (state.isSick) return;
            state.clean = Math.min(100, state.clean + 35);
            state.happy = Math.max(0, state.happy - 5);
            speechBubble.innerText = "반짝반짝 깨끗해졌어요! 🛁";
            addExp(5);
        }

        function curePet() {
            state.isSick = false;
            state.hunger = 40;
            state.happy = 40;
            state.clean = 40;
            btnCure.style.display = "none";
            speechBubble.innerText = "건강을 되찾았어요! 다행이다~ 😊";
            updateUI();
        }

        // 스탯바 색상 조절 함수 (많으면 초록, 적으면 빨강)
        function setBarColor(barElement, value) {
            barElement.style.width = value + "%";
            if (value > 50) {
                barElement.style.background = "#4caf50"; // 초록
            } else if (value > 20) {
                barElement.style.background = "#ff9f43"; // 주황
            } else {
                barElement.style.background = "#ff5252"; // 빨강
            }
        }

        // 화면 업데이트
        function updateUI() {
            // 스탯 바 반영
            setBarColor(barHunger, state.hunger);
            setBarColor(barHappy, state.happy);
            setBarColor(barClean, state.clean);

            // 경험치 바 반영
            expBar.style.width = state.exp + "%";

            // 단계 및 이미지 변경
            petStageName.innerText = `단계: ${stageNames[state.level]}`;
            if (state.level === 1) {
                petImg.src = imgUrls.egg;
            } else if (state.level === 2) {
                petImg.src = imgUrls.baby;
            } else {
                petImg.src = imgUrls.adult;
            }

            // 상태 표정 및 이모지 관리
            if (state.isSick) {
                statusEmoji.innerText = "🤒";
                petMood.innerText = "상태: 아픔 🤒";
            } else {
                let avg = (state.hunger + state.happy + state.clean) / 3;
                if (avg > 70) {
                    statusEmoji.innerText = "😊";
                    petMood.innerText = "기분: 좋음 😊";
                } else if (avg > 35) {
                    statusEmoji.innerText = "😐";
                    petMood.innerText = "기분: 보통 😐";
                } else {
                    statusEmoji.innerText = "😢";
                    petMood.innerText = "기분: 나쁨 😢";
                }
            }
        }

        // 초기 실행
        updateUI();
    </script>
</body>
</html>
