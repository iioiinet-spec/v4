<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>말랑말랑 커비 키우기 🌟</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
            font-family: 'Jua', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #fce4ec;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #game-container {
            width: 460px;
            height: 780px;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
            border: 8px solid #FF80AB;
            border-radius: 35px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            transition: background 1.5s ease;
        }

        #game-container.night {
            background: linear-gradient(to bottom, #1A237E 0%, #283593 100%) !important;
        }

        #game-container.parttime-bg {
            background: linear-gradient(to bottom, #FFF8E1 0%, #FFECB3 100%) !important;
        }

        /* 상단 UI */
        .top-ui {
            padding: 15px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 0 0 25px 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            z-index: 10;
        }

        .level-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.2rem;
            color: #880e4f;
            margin-bottom: 5px;
        }

        .exp-bar-container {
            width: 100%;
            height: 16px;
            background-color: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #FF4081;
        }

        .exp-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #FF80AB, #FF4081);
            transition: width 0.3s ease;
        }

        .coin-display {
            text-align: right;
            font-size: 1.15rem;
            color: #f57f17;
            margin-top: 5px;
            font-weight: bold;
        }

        /* 스탯 패널 */
        .stats-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.75);
            margin: 8px 15px 0 15px;
            border-radius: 20px;
            z-index: 10;
        }

        .stat-box {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #37474f;
        }

        .bar-outer {
            width: 100%;
            height: 14px;
            background-color: #ddd;
            border-radius: 7px;
            overflow: hidden;
            border: 1.5px solid #555;
        }

        .bar-inner {
            height: 100%;
            width: 70%;
            transition: width 0.3s ease, background-color 0.3s ease;
        }

        /* 필드 및 펫 (동그라미 커비) */
        .main-field {
            flex: 1;
            position: relative;
            cursor: pointer;
            overflow: hidden;
        }

        #kirby {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            transition: left 0.8s ease-out, top 0.8s ease-out;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
        }

        .kirby-shape {
            width: 110px;
            height: 110px;
            background-color: #FF80AB;
            border: 5px solid #F50057;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 15px rgba(0,0,0,0.15);
            animation: bounce 1.5s infinite alternate ease-in-out;
            position: relative;
        }

        .kirby-face {
            font-size: 3rem;
            line-height: 1;
        }

        .ability-badge {
            position: absolute;
            top: -12px;
            right: -8px;
            font-size: 1.8rem;
            background: white;
            border-radius: 50%;
            padding: 2px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        @keyframes bounce {
            0% { transform: translateY(0) scale(1, 1); }
            100% { transform: translateY(-12px) scale(1.05, 0.95); }
        }

        .speech-bubble {
            position: absolute;
            top: -45px;
            background: white;
            padding: 6px 14px;
            border-radius: 15px;
            font-size: 0.95rem;
            border: 2px solid #FF4081;
            white-space: nowrap;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            animation: popIn 0.3s ease;
            pointer-events: none;
            z-index: 6;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 8px 8px 0;
            border-style: solid;
            border-color: white transparent;
            display: block;
            width: 0;
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        .time-indicator {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 1.8rem;
        }

        /* 컨트롤 버튼 */
        .controls {
            padding: 12px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 25px 25px 0 0;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            z-index: 10;
        }

        .btn {
            background-color: #FF80AB;
            border: none;
            border-bottom: 4px solid #F50057;
            color: white;
            padding: 10px 5px;
            border-radius: 15px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.1s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .btn:active {
            transform: translateY(3px);
            border-bottom-width: 1px;
        }

        .btn:disabled {
            background-color: #b0bec5 !important;
            border-bottom: 4px solid #78909c !important;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .btn-sleep.available {
            background-color: #FBC02D;
            border-bottom-color: #F57F17;
        }

        .btn-cure {
            background-color: #4CAF50;
            border-bottom-color: #2E7D32;
            grid-column: span 3;
            font-size: 1.1rem;
            padding: 12px;
            animation: pulse 1s infinite;
        }

        .btn-ability {
            grid-column: span 3;
            background-color: #9C27B0;
            border-bottom-color: #7B1FA2;
            font-size: 1.05rem;
            padding: 10px;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        /* 모달 창 */
        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 100;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 25px;
            text-align: center;
            width: 85%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 4px solid #FF4081;
        }

        .copy-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .copy-btn {
            padding: 12px;
            background: #FFE082;
            border: 2px solid #FFA000;
            border-radius: 15px;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        /* 아르바이트 (주황 동그라미 웨이들 디) */
        #parttime-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 50;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .pt-gauge-container {
            width: 100%;
            height: 22px;
            background: #fff;
            border-radius: 11px;
            border: 3px solid #333;
            overflow: hidden;
            margin-top: 50px;
        }

        .pt-gauge {
            height: 100%;
            width: 100%;
            background: #FF5722;
            transition: width 0.1s linear;
        }

        .waddle-container {
            position: relative;
            height: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .waddle-dee-shape {
            width: 110px;
            height: 110px;
            background-color: #FF9800;
            border: 5px solid #E65100;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 15px rgba(0,0,0,0.15);
            position: relative;
        }

        .waddle-dee-face {
            font-size: 2.5rem;
        }

        .order-bubble {
            position: absolute;
            top: -25px;
            right: -15px;
            background: white;
            border: 3px solid #FF9800;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            animation: popIn 0.2s ease;
        }

        .food-controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        #countdown-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75);
            z-index: 90;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
        }

        #countdown-number {
            font-size: 7rem;
            color: #FFEB3B;
            text-shadow: 0 5px 15px rgba(0,0,0,0.5);
            animation: popIn 0.3s ease;
        }

        .sparkle {
            position: absolute;
            pointer-events: none;
            animation: sparkleAnim 0.8s linear forwards;
            font-size: 1.8rem;
            z-index: 99;
        }

        @keyframes sparkleAnim {
            0% { opacity: 1; transform: scale(0) rotate(0deg); }
            100% { opacity: 0; transform: scale(1.6) rotate(180deg); }
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="time-indicator" id="time-icon">🌞</div>

    <!-- 상단 랭크 & 코인 UI -->
    <div class="top-ui">
        <div class="level-info">
            <span id="stage-name">🌸 1단계: 커비</span>
            <span id="level-text">Lv.1</span>
        </div>
        <div class="exp-bar-container">
            <div class="exp-bar" id="exp-bar"></div>
        </div>
        <div class="coin-display">
            💰 <span id="coin-val">100</span> 코인
        </div>
    </div>

    <!-- 상태 스탯 게이지 -->
    <div class="stats-panel">
        <div class="stat-box">
            <div class="stat-label">🍖 포만감 (<span id="satiety-val">0</span>/10000)</div>
            <div class="bar-outer"><div class="bar-inner" id="bar-satiety"></div></div>
        </div>
        <div class="stat-box">
            <div class="stat-label">💖 행복 (<span id="happy-val">70</span>/100)</div>
            <div class="bar-outer"><div class="bar-inner" id="bar-happy"></div></div>
        </div>
        <div class="stat-box">
            <div class="stat-label">🧼 청결 (<span id="clean-val">70</span>/100)</div>
            <div class="bar-outer"><div class="bar-inner" id="bar-clean"></div></div>
        </div>
        <div class="stat-box">
            <div class="stat-label">⚡ 에너지 (<span id="energy-val">70</span>/100)</div>
            <div class="bar-outer"><div class="bar-inner" id="bar-energy"></div></div>
        </div>
    </div>

    <!-- 메인 필드 및 핑크 동그라미 커비 -->
    <div class="main-field" id="field">
        <div id="kirby">
            <div class="speech-bubble" id="bubble" style="display: none;">안녕!</div>
            <div class="kirby-shape">
                <div class="kirby-face" id="kirby-face">😊</div>
                <div class="ability-badge" id="ability-badge" style="display:none;">🗡️</div>
            </div>
        </div>
    </div>

    <!-- 하단 행동 버튼 -->
    <div class="controls" id="main-controls">
        <button class="btn" onclick="feedPet()">🍖 밥 주기<br><small>(-5코인)</small></button>
        <button class="btn" onclick="playPet()">🎾 놀아주기</button>
        <button class="btn" onclick="cleanPet()">🧼 씻기기<br><small>(-3코인)</small></button>
        <button class="btn btn-sleep" id="btn-sleep" onclick="sleepPet()" disabled>🌙 재우기</button>
        <button class="btn" onclick="openRPS()">✌️ 미니게임</button>
        <button class="btn" onclick="startPartTimeSequence()">🍔 아르바이트</button>
        <button class="btn btn-ability" id="btn-ability" onclick="useAbilitySkill()" style="display: none;">✨ 카피 능력 스킬 사용!</button>
        <button class="btn btn-cure" id="btn-cure" onclick="curePet()" style="display: none;">🩺 치료하기 (-500 코인)</button>
    </div>

    <!-- 아르바이트 카운트다운 -->
    <div id="countdown-overlay">
        <h2 style="margin: 0 0 10px 0;">🍔 아르바이트 준비!</h2>
        <div id="countdown-number">3</div>
    </div>

    <!-- 아르바이트 화면 -->
    <div id="parttime-overlay">
        <div class="pt-gauge-container">
            <div class="pt-gauge" id="pt-gauge-bar"></div>
        </div>
        <div style="text-align: center; font-size: 1.2rem; color: #d84315;">
            성공: <span id="pt-count">0</span>명 (명당 30코인)
        </div>
        <div class="waddle-container">
            <div class="waddle-dee-shape">
                <div class="waddle-dee-face">👀</div>
                <div class="order-bubble" id="order-food">🍔</div>
            </div>
        </div>
        <div class="food-controls">
            <button class="btn" style="background:#ff7043; border-color:#d84315;" onclick="serveFood('🍔')">🍔 햄버거</button>
            <button class="btn" style="background:#29b6f6; border-color:#0288d1;" onclick="serveFood('🥤')">🥤 음료수</button>
            <button class="btn" style="background:#ffee58; border-color:#fbc02d; color:#333;" onclick="serveFood('🍟')">🍟 감자튀김</button>
        </div>
    </div>

    <!-- 카피 능력 선택 모달 -->
    <div class="modal" id="copy-modal">
        <div class="modal-content">
            <h2>✨ 카피 능력을 고르세요! ✨</h2>
            <div class="copy-options">
                <button class="copy-btn" onclick="selectCopyAbility('스워드')">🗡️ 스워드</button>
                <button class="copy-btn" onclick="selectCopyAbility('파이어')">🔥 파이어</button>
                <button class="copy-btn" onclick="selectCopyAbility('커터')">🌙 커터</button>
                <button class="copy-btn" onclick="selectCopyAbility('아이스')">❄️ 아이스</button>
            </div>
        </div>
    </div>

    <!-- 미니게임 (가위바위보) 모달 -->
    <div class="modal" id="rps-modal">
        <div class="modal-content">
            <h2>✌️ 가위바위보 게임! ✊</h2>
            <p>커비를 이기면 행복 +15, 코인 +10!</p>
            <div style="font-size: 3rem; margin: 15px 0;" id="rps-result">❓</div>
            <div class="copy-options">
                <button class="copy-btn" onclick="playRPS('✌️')">✌️ 가위</button>
                <button class="copy-btn" onclick="playRPS('✊')">✊ 바위</button>
                <button class="copy-btn" onclick="playRPS('✋')">✋ 보</button>
            </div>
            <button class="btn" style="margin-top: 15px; width: 100%;" onclick="closeRPS()">닫기</button>
        </div>
    </div>
</div>

<script>
    /* 카피 능력별 아이콘 정의 */
    const ABILITY_ICONS = {
        '스워드': '🗡️',
        '파이어': '🔥',
        '커터': '🌙',
        '아이스': '❄️'
    };

    const FINAL_ABILITY_ICONS = {
        '스워드': '🦋🗡️',
        '파이어': '🐲🔥',
        '커터': '⚙️🌙',
        '아이스': '☃️❄️'
    };

    /* 게임 상태 변수 */
    let satiety = 0;
    let happy = 70;
    let clean = 70;
    let energy = 70;
    let coin = 100; 
    let exp = 0;
    let level = 1;

    let isSick = false;
    let isNight = false;
    let isPartTime = false;

    let evolutionStage = 1; // 1: 기본, 2: 카피능력, 3: 최종진화
    let selectedAbility = "";

    /* 아르바이트 변수 */
    let ptGauge = 100;
    let ptSuccessCount = 0;
    let currentOrder = "";
    let ptTimer = null;
    let ptOrderTimer = null;

    /* 표정 바꿈 (좋음 😊 / 보통 😐 / 나쁨 😢) */
    function getMoodEmoji() {
        if (isSick) return "🤒";
        const avg = ((satiety/100) + happy + clean + energy) / 4;
        if (avg >= 65) return "😊";
        if (avg >= 35) return "😐";
        return "😢";
    }

    /* 커비 렌더링 */
    function renderKirby() {
        document.getElementById('kirby-face').innerText = getMoodEmoji();
        const badge = document.getElementById('ability-badge');

        if (evolutionStage >= 2 && !isSick) {
            badge.style.display = 'block';
            badge.innerText = evolutionStage === 3 ? FINAL_ABILITY_ICONS[selectedAbility] : ABILITY_ICONS[selectedAbility];
        } else {
            badge.style.display = 'none';
        }
    }

    /* 단계 명칭 반환 */
    function getStageTitle() {
        if (evolutionStage === 1) return "🌸 1단계: 커비";
        if (evolutionStage === 2) return `✨ 2단계: ${selectedAbility} 커비`;
        if (evolutionStage === 3) {
            const finalNames = {
                '스워드': '몰포 스워드',
                '파이어': '드래고닉 파이어',
                '커터': '풀 메탈 커터',
                '아이스': '블리자드 아이스'
            };
            return `👑 3단계: ${finalNames[selectedAbility]}`;
        }
    }

    /* UI 갱신 */
    function updateUI() {
        document.getElementById('coin-val').innerText = coin.toLocaleString();
        document.getElementById('level-text').innerText = `Lv.${level}`;
        document.getElementById('stage-name').innerText = getStageTitle();
        document.getElementById('exp-bar').style.width = `${exp}%`;

        document.getElementById('satiety-val').innerText = satiety;
        document.getElementById('happy-val').innerText = happy;
        document.getElementById('clean-val').innerText = clean;
        document.getElementById('energy-val').innerText = energy;

        updateBar('bar-satiety', satiety, 10000);
        updateBar('bar-happy', happy, 100);
        updateBar('bar-clean', clean, 100);
        updateBar('bar-energy', energy, 100);

        renderKirby();

        document.getElementById('btn-cure').style.display = isSick ? 'block' : 'none';
        document.getElementById('btn-ability').style.display = (evolutionStage >= 2 && !isSick) ? 'block' : 'none';
        
        const sleepBtn = document.getElementById('btn-sleep');
        if (isNight && !isPartTime) {
            sleepBtn.disabled = false;
            sleepBtn.classList.add('available');
        } else {
            sleepBtn.disabled = true;
            sleepBtn.classList.remove('available');
        }
    }

    /* 막대 그래프 색상 제어 */
    function updateBar(elementId, value, max) {
        const bar = document.getElementById(elementId);
        const pct = Math.max(0, Math.min(100, (value / max) * 100));
        bar.style.width = `${pct}%`;

        if (pct > 50) {
            bar.style.backgroundColor = "#4CAF50"; 
        } else if (pct > 20) {
            bar.style.backgroundColor = "#FFEB3B"; 
        } else {
            bar.style.backgroundColor = "#F44336"; 
        }
    }

    /* 말풍선 출력 */
    function showBubble(text) {
        const bubble = document.getElementById('bubble');
        bubble.innerText = text;
        bubble.style.display = 'block';
        setTimeout(() => {
            bubble.style.display = 'none';
        }, 2000);
    }

    /* 파티클 효과 */
    function createSparkles(customIcons) {
        const field = document.getElementById('field');
        const icons = customIcons || ['✨', '⭐', '🌟', '💖'];
        for (let i = 0; i < 15; i++) {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            sparkle.innerText = icons[Math.floor(Math.random() * icons.length)];
            sparkle.style.left = `${Math.random() * 80 + 10}%`;
            sparkle.style.top = `${Math.random() * 80 + 10}%`;
            field.appendChild(sparkle);
            setTimeout(() => sparkle.remove(), 800);
        }
    }

    /* 카피 능력 전용 스킬 사용 (코인 제공 X) */
    function useAbilitySkill() {
        if (isSick) return showBubble("아파서 스킬을 쓸 수 없어요 🤒");

        if (selectedAbility === '스워드') {
            if (evolutionStage === 2) {
                happy = Math.min(100, happy + 10);
                createSparkles(['🗡️', '⚔️', '✨']);
                showBubble("검 휘두르기! 🗡️ (+행복 10)");
            } else {
                happy = Math.min(100, happy + 25);
                createSparkles(['🦋', '🗡️', '✨']);
                showBubble("몰포 스코치 베기! 🦋🗡️ (+행복 25)");
            }
        } else if (selectedAbility === '파이어') {
            if (evolutionStage === 2) {
                energy = Math.min(100, energy + 20);
                createSparkles(['🔥', '💥', '✨']);
                showBubble("불뿜기! 🔥 (+에너지 20)");
            } else {
                energy = Math.min(100, energy + 50);
                happy = Math.min(100, happy + 20);
                createSparkles(['🐲', '🔥', '💥']);
                showBubble("드래곤 브레스! 🐲🔥 (+에너지 50, 행복 20)");
            }
        } else if (selectedAbility === '커터') {
            if (evolutionStage === 2) {
                happy = Math.min(100, happy + 20);
                createSparkles(['🌙', '💫', '✨']);
                showBubble("부메랑 던지기! 🌙 (+행복 20)");
            } else {
                happy = Math.min(100, happy + 40);
                satiety = Math.min(10000, satiety + 500);
                createSparkles(['⚙️', '🌙', '💥']);
                showBubble("풀 메탈 차크람! ⚙️ (+행복 40, 포만감 500)");
            }
        } else if (selectedAbility === '아이스') {
            if (evolutionStage === 2) {
                clean = Math.min(100, clean + 25);
                createSparkles(['❄️', '🧊', '✨']);
                showBubble("얼음 입김! ❄️ (+청결 25)");
            } else {
                clean = 100;
                happy = Math.min(100, happy + 20);
                createSparkles(['☃️', '❄️', '🧊']);
                showBubble("블리자드 스톰! ☃️❄️ (청결 100% 회복!)");
            }
        }
        addExp(15);
        updateUI();
    }

    /* 경험치 획득 */
    function addExp(amount) {
        if (isSick) return; 

        exp += amount;
        if (exp >= 100) {
            exp -= 100;
            level++;
            checkEvolution();
        }
        updateUI();
    }

    /* 진화 체킹 */
    function checkEvolution() {
        if (level >= 3 && evolutionStage === 1) {
            document.getElementById('copy-modal').style.display = 'flex';
        } else if (level >= 6 && evolutionStage === 2) {
            evolutionStage = 3;
            triggerEvolutionEffects();
        }
    }

    /* 카피 능력 선택 */
    function selectCopyAbility(ability) {
        selectedAbility = ability;
        evolutionStage = 2;
        document.getElementById('copy-modal').style.display = 'none';
        triggerEvolutionEffects();
    }

    /* 진화 이펙트 */
    function triggerEvolutionEffects() {
        createSparkles();
        showBubble("커비(이)가 진화했다! 🎉");
        updateUI();
    }

    /* 행동 기능들 */
    function feedPet() {
        if (isSick) return showBubble("아파서 먹을 수 없어요 🤒");
        coin -= 5;
        satiety = Math.min(10000, satiety + 25);
        happy = Math.min(100, happy + 5);
        energy = Math.min(100, energy + 5);
        showBubble("냠냠! 맛있다 냠! 🍖");
        addExp(10);
    }

    function playPet() {
        if (isSick) return showBubble("아파서 놀 수 없어요 🤒");
        happy = Math.min(100, happy + 25);
        satiety = Math.max(0, satiety - 10);
        energy = Math.max(0, energy - 15);
        clean = Math.max(0, clean - 10);
        showBubble("신나게 놀자! 🎾");
        checkHealth();
        addExp(10);
    }

    function cleanPet() {
        if (isSick) return showBubble("아플 땐 쉬어야 해요 🤒");
        coin -= 3;
        clean = Math.min(100, clean + 35);
        happy = Math.max(0, happy - 5);
        showBubble("뽀득뽀득 깨끗해요! 🧼");
        addExp(10);
    }

    function sleepPet() {
        if (!isNight) return showBubble("낮에는 잠을 잘 수 없어요! 🌞");
        satiety = Math.max(0, satiety - 10);
        happy = Math.min(100, happy + 10);
        energy = Math.min(100, energy + 50);
        showBubble("쿨쿨... 잘 자고 일어났어요! 💤");
        toggleNight(false);
        checkHealth();
        addExp(10);
    }

    function curePet() {
        if (!isSick) return;
        coin -= 500;
        isSick = false;
        satiety = Math.max(satiety, 1000);
        happy = 100;
        clean = 100;
        energy = 100;
        showBubble("다 나았어요! 건강해요! 🩺");
        updateUI();
    }

    function checkHealth() {
        if (satiety <= 0 || happy <= 0 || clean <= 0 || energy <= 0) {
            if (!isSick) {
                isSick = true;
                showBubble("아이구... 아파요 🤒");
            }
        }
        updateUI();
    }

    /* 3초 감퇴 루프 (돈 제외 모든 게이지 -3) */
    setInterval(() => {
        if (isPartTime) return;

        let energyDrain = isNight ? 6 : 3;

        satiety = Math.max(0, satiety - 3);
        happy = Math.max(0, happy - 3);
        clean = Math.max(0, clean - 3);
        energy = Math.max(0, energy - energyDrain);

        checkHealth();
    }, 3000);

    /* 낮과 밤 주기적 전환 (25초마다 변경) */
    setInterval(() => {
        if (isPartTime) return;
        toggleNight(!isNight);
    }, 25000);

    function toggleNight(nightState) {
        isNight = nightState;
        const container = document.getElementById('game-container');
        const timeIcon = document.getElementById('time-icon');

        if (isNight) {
            container.classList.add('night');
            timeIcon.innerText = "🌙";
        } else {
            container.classList.remove('night');
            timeIcon.innerText = "🌞";
        }
        updateUI();
    }

    /* 이동 기능 */
    document.getElementById('field').addEventListener('click', (e) => {
        if (isPartTime) return;

        const fieldRect = e.currentTarget.getBoundingClientRect();
        const clickX = e.clientX - fieldRect.left;
        const clickY = e.clientY - fieldRect.top;

        const kirbyX = (clickX / fieldRect.width) * 100;
        const kirbyY = (clickY / fieldRect.height) * 100;

        const kirbyElem = document.getElementById('kirby');
        kirbyElem.style.left = `${kirbyX}%`;
        kirbyElem.style.top = `${kirbyY}%`;
    });

    /* 미니게임 (가위바위보) */
    function openRPS() {
        if (isSick) return showBubble("아파서 게임을 할 수 없어요 🤒");
        document.getElementById('rps-result').innerText = "❓";
        document.getElementById('rps-modal').style.display = 'flex';
    }

    function closeRPS() {
        document.getElementById('rps-modal').style.display = 'none';
    }

    function playRPS(userChoice) {
        const choices = ['✌️', '✊', '✋'];
        const kirbyChoice = choices[Math.floor(Math.random() * 3)];
        
        let resultStr = `커비: ${kirbyChoice} vs 나: ${userChoice}\n`;

        if (userChoice === kirbyChoice) {
            resultStr += "비겼어요! 다시 도전해보세요!";
        } else if (
            (userChoice === '✌️' && kirbyChoice === '✋') ||
            (userChoice === '✊' && kirbyChoice === '✌️') ||
            (userChoice === '✋' && kirbyChoice === '✊')
        ) {
            resultStr += "이겼다! 🥳 (+행복 15, +10코인)";
            happy = Math.min(100, happy + 15);
            coin += 10;
            addExp(10);
        } else {
            resultStr += "졌어요 ㅠ_ㅠ (+행복 5)";
            happy = Math.min(100, happy + 5);
        }

        document.getElementById('rps-result').innerText = kirbyChoice;
        alert(resultStr);
        updateUI();
    }

    /* 아르바이트 로직 */
    function startPartTimeSequence() {
        if (isSick) return showBubble("아파서 알바를 갈 수 없어요 🤒");

        const countdownOverlay = document.getElementById('countdown-overlay');
        const countdownNum = document.getElementById('countdown-number');
        
        countdownOverlay.style.display = 'flex';
        let count = 3;
        countdownNum.innerText = count;

        const countInterval = setInterval(() => {
            count--;
            if (count > 0) {
                countdownNum.innerText = count;
            } else {
                clearInterval(countInterval);
                countdownOverlay.style.display = 'none';
                startPartTime();
            }
        }, 1000);
    }

    function startPartTime() {
        isPartTime = true;
        ptGauge = 100;
        ptSuccessCount = 0;

        document.getElementById('parttime-overlay').style.display = 'flex';
        document.getElementById('game-container').classList.add('parttime-bg');
        document.getElementById('main-controls').style.display = 'none';

        nextOrder();

        ptTimer = setInterval(() => {
            ptGauge -= 0.05;
            document.getElementById('pt-gauge-bar').style.width = `${Math.max(0, ptGauge)}%`;

            if (ptGauge <= 0) {
                endPartTime();
            }
        }, 100);
    }

    function nextOrder() {
        const foods = ['🍔', '🥤', '🍟'];
        currentOrder = foods[Math.floor(Math.random() * 3)];
        document.getElementById('order-food').innerText = currentOrder;
        document.getElementById('pt-count').innerText = ptSuccessCount;

        if (ptOrderTimer) clearTimeout(ptOrderTimer);

        ptOrderTimer = setTimeout(() => {
            if (isPartTime) {
                ptGauge -= 5;
                showPtMissEffect();
                nextOrder();
            }
        }, 1000);
    }

    function serveFood(food) {
        if (!isPartTime) return;

        if (food === currentOrder) {
            ptSuccessCount++;
            nextOrder();
        } else {
            ptGauge -= 5;
            showPtMissEffect();
            nextOrder();
        }
    }

    function showPtMissEffect() {
        const bar = document.getElementById('pt-gauge-bar');
        bar.style.backgroundColor = '#ff1744';
        setTimeout(() => {
            bar.style.backgroundColor = '#FF5722';
        }, 200);
    }

    function endPartTime() {
        clearInterval(ptTimer);
        if (ptOrderTimer) clearTimeout(ptOrderTimer);

        isPartTime = false;
        const earnedCoin = ptSuccessCount * 30;
        coin += earnedCoin;

        document.getElementById('parttime-overlay').style.display = 'none';
        document.getElementById('game-container').classList.remove('parttime-bg');
        document.getElementById('main-controls').style.display = 'grid';

        alert(`아르바이트 끝!\n웨이들 디 ${ptSuccessCount}명에게 음식 전달 완료! 🎉\n${earnedCoin} 코인을 얻었습니다!`);
        updateUI();
    }

    updateUI();
</script>
</body>
</html>
