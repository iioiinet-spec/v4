<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포켓몬 다마고치 - 전설의 포켓몬</title>
    <style>
        :root {
            --primary-color: #4CAF50;
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .game-container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .screen {
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .hidden {
            display: none !important;
        }

        #start-screen {
            height: 100vh;
            max-height: 600px;
            justify-content: flex-start;
            padding-top: 15px;
        }

        #start-screen h1 {
            font-size: 1.6rem;
            margin-bottom: 5px;
            color: #2c3e50;
        }

        #start-screen p {
            font-size: 0.85rem;
            color: #7f8c8d;
            margin-bottom: 15px;
            text-align: center;
        }

        .pokemon-choices {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            width: 100%;
            max-height: 420px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .pokemon-choices::-webkit-scrollbar {
            width: 6px;
        }
        .pokemon-choices::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 3px;
        }

        .choice-card {
            background: #fff;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 10px 8px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .choice-card:hover {
            transform: translateY(-3px);
            border-color: var(--primary-color);
            box-shadow: 0 6px 12px rgba(76, 175, 80, 0.15);
        }

        .choice-card img {
            width: 55px;
            height: 55px;
            object-fit: contain;
            margin-bottom: 4px;
        }

        .choice-card h3 {
            font-size: 0.9rem;
            color: #34495e;
        }

        #play-screen {
            padding: 15px;
        }

        .status-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8f9fa;
            padding: 10px 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .stage {
            width: 100%;
            height: 250px;
            background: linear-gradient(to bottom, #fff8e7 65%, #d7ccc8 65%);
            border: 3px solid #bcaaa4;
            border-radius: 15px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }

        .room-window {
            position: absolute;
            top: 15px;
            left: 20px;
            width: 55px;
            height: 60px;
            background: #b3e5fc;
            border: 4px solid #8d6e63;
            border-radius: 6px;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.1);
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 2px;
            padding: 2px;
        }

        .window-pane {
            background: #e1f5fe;
            border-radius: 2px;
        }

        .room-frame {
            position: absolute;
            top: 20px;
            right: 25px;
            width: 45px;
            height: 50px;
            background: #d7ccc8;
            border: 4px solid #8d6e63;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .speech-bubble {
            background: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            margin-bottom: 5px;
            position: relative;
            max-width: 80%;
            text-align: center;
            z-index: 2;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 6px 6px 0;
            border-style: solid;
            border-color: white transparent;
            display: block;
            width: 0;
        }

        .pokemon-display-area {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 2;
        }

        .pokemon-img {
            width: 110px;
            height: 110px;
            object-fit: contain;
            animation: bounce 1.5s infinite ease-in-out;
            transition: filter 0.3s, transform 0.3s;
        }

        .gigantamax-size {
            width: 135px;
            height: 135px;
            animation: bounceGigant 1.5s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes bounceGigant {
            0%, 100% { transform: translateY(0) scale(1.1); }
            50% { transform: translateY(-10px) scale(1.1); }
        }

        .sick {
            filter: grayscale(80%) hue-rotate(90deg);
        }

        .sparkle {
            position: absolute;
            font-size: 1.5rem;
            animation: popUp 0.8s forwards;
            pointer-events: none;
            z-index: 3;
        }

        @keyframes popUp {
            0% { transform: scale(0) translateY(0); opacity: 1; }
            100% { transform: scale(1.5) translateY(-50px); opacity: 0; }
        }

        .stats-container {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat-box {
            background: #f8f9fa;
            padding: 8px 12px;
            border-radius: 10px;
        }

        .stat-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 100%;
            transition: width 0.3s ease, background-color 0.3s;
        }

        .actions-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            width: 100%;
        }

        .action-btn {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 10px 5px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #555;
        }

        .action-btn:hover {
            background: #f1f8e9;
            border-color: var(--primary-color);
            color: var(--primary-color);
            transform: translateY(-2px);
        }

        .action-btn span {
            font-size: 1.2rem;
        }

        .modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            width: 85%;
            max-width: 340px;
            animation: scaleUp 0.3s ease;
        }

        @keyframes scaleUp {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-content h2 {
            color: #e67e22;
            margin-bottom: 10px;
            font-size: 1.3rem;
        }

        .modal-content p {
            font-size: 0.95rem;
            margin-bottom: 20px;
            color: #555;
        }

        .modal-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .modal-btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .mega-btn { background: #9c27b0; }
        .giga-btn { background: #ff5722; }
    </style>
</head>

                    "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/10185.png",
                    "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/888.png"
                ]
            },
            zamazenta: {
                name: "자마젠타",
                stages: [
                    "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png",
                    "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/889.png",
                    "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/889.png",
                    "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/889.png",
                    "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/10186.png",
                    "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/889.png"
                ]
            }
        };

        const stageNames = ["알", "아기", "청소년", "어른", "메가진화(원시회귀)", "거다이맥스"];

        let gameState = {
            type: null,
            name: "",
            xp: 0,
            stage: 0,
            hunger: 100,
            happiness: 100,
            clean: 100,
            energy: 100,
            isSick: false
        };

        let gameInterval = null;

        function startGame(type) {
            gameState.type = type;
            gameState.name = pokemonData[type].name;
            gameState.xp = 0;
            gameState.stage = 0;
            gameState.hunger = 100;
            gameState.happiness = 100;
            gameState.clean = 100;
            gameState.energy = 100;
            gameState.isSick = false;

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('play-screen').classList.remove('hidden');

            updateUI();

            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, 3000);
        }

        function gameLoop() {
            gameState.hunger = Math.max(0, gameState.hunger - 3);
            gameState.happiness = Math.max(0, gameState.happiness - 3);
            gameState.clean = Math.max(0, gameState.clean - 3);
            gameState.energy = Math.max(0, gameState.energy - 3);

            if (gameState.hunger < 15 || gameState.happiness < 15 || gameState.clean < 15 || gameState.energy < 15) {
                gameState.isSick = true;
            }

            updateUI();
        }

        function doAction(actionType) {
            let xpEarned = gameState.isSick ? 0 : 10;

            if (actionType === 'feed') {
                gameState.hunger = Math.min(100, gameState.hunger + 25);
                showSpeech("냠냠! 맛있어!");
            } else if (actionType === 'play') {
                if (gameState.energy < 15) {
                    showSpeech("너무 피곤해... 잘래요...");
                    return;
                }
                gameState.happiness = Math.min(100, gameState.happiness + 25);
                gameState.energy = Math.max(0, gameState.energy - 10);
                showSpeech("신난다! 재미있다!");
            } else if (actionType === 'wash') {
                gameState.clean = Math.min(100, gameState.clean + 30);
                showSpeech("개운하다! 뽀송뽀송~");
            } else if (actionType === 'cure') {
                if (gameState.isSick) {
                    gameState.isSick = false;
                    gameState.hunger = Math.min(100, gameState.hunger + 20);
                    gameState.happiness = Math.min(100, gameState.happiness + 20);
                    showSpeech("치료받으니 살 것 같아요!");
                } else {
                    showSpeech("난 건강한걸요? 치료 필요 없어요!");
                    return;
                }
            }

            if (!gameState.isSick && xpEarned > 0) {
                addXP(xpEarned);
                createSparkleEffect();
            }

            updateUI();
        }

        function addXP(amount) {
            if (gameState.stage >= 4) return;

            gameState.xp += amount;
            if (gameState.xp >= 100) {
                gameState.xp = 0;
                gameState.stage++;
                
                if (gameState.stage === 3) {
                    triggerEvolution();
                } else if (gameState.stage === 4) {
                    gameState.stage = 3;
                    document.getElementById('choice-modal').classList.remove('hidden');
                    return;
                } else {
                    triggerEvolution();
                }
            }
        }

        const originalAddXP = addXP;
        addXP = function(amount) {
            if (gameState.stage === 3) {
                gameState.xp += amount;
                if (gameState.xp >= 100) {
                    gameState.xp = 0;
                    document.getElementById('choice-modal').classList.remove('hidden');
                }
                return;
            }
            originalAddXP(amount);
        };

        function triggerEvolution() {
            let nextStageName = stageNames[gameState.stage];
            let evolutionText = `${gameState.name}이(가) [${nextStageName}](으)로 진화했습니다!`;
            
            document.getElementById('evolution-msg').innerText = evolutionText;
            document.getElementById('evolution-modal').classList.remove('hidden');
            createSparkleEffect();
        }

        function closeModal() {
            document.getElementById('evolution-modal').classList.add('hidden');
            updateUI();
        }

        function chooseFinalEvolution(targetStage) {
            gameState.stage = targetStage;
            document.getElementById('choice-modal').classList.add('hidden');
            
            let formName = targetStage === 4 ? "메가진화(원시회귀)" : "거다이맥스";
            document.getElementById('evolution-msg').innerText = `✨ ${gameState.name}이(가) 강력한 [${formName}](으)로 각성했습니다! ✨`;
            document.getElementById('evolution-modal').classList.remove('hidden');
            createSparkleEffect();
            updateUI();
        }

        function showSpeech(text) {
            const bubble = document.getElementById('speech-bubble');
            bubble.innerText = text;
        }

        function createSparkleEffect() {
            const stage = document.getElementById('stage');
            for(let i=0; i<3; i++) {
                setTimeout(() => {
                    const sparkle = document.createElement('div');
                    sparkle.className = 'sparkle';
                    sparkle.innerText = '✨';
                    sparkle.style.left = Math.random() * 60 + 20 + '%';
                    sparkle.style.top = Math.random() * 40 + 30 + '%';
                    stage.appendChild(sparkle);
                    setTimeout(() => sparkle.remove(), 800);
                }, i * 200);
            }
        }

        function updateUI() {
            let currentStageName = stageNames[gameState.stage];
            document.getElementById('info-name').innerText = `${gameState.name} (${currentStageName})`;
            document.getElementById('info-xp').innerText = gameState.stage >= 4 ? `XP: MAX` : `XP: ${gameState.xp} / 100`;

            const imgElement = document.getElementById('pokemon-img');
            const pokeObj = pokemonData[gameState.type];
            imgElement.src = pokeObj.stages[gameState.stage];

            if (gameState.stage === 5) {
                imgElement.classList.add('gigantamax-size');
            } else {
                imgElement.classList.remove('gigantamax-size');
            }

            if (gameState.isSick) {
                imgElement.classList.add('sick');
                showSpeech("아파서 힘이 없어요... 치료해주세요!");
            } else {
                imgElement.classList.remove('sick');
                if(document.getElementById('speech-bubble').innerText.includes("아파서")) {
                    showSpeech("기운을 차렸어요!");
                }
            }

            updateBar('hunger', gameState.hunger);
            updateBar('happiness', gameState.happiness);
            updateBar('clean', gameState.clean);
            updateBar('energy', gameState.energy);
        }

        function updateBar(statName, value) {
            document.getElementById(`stat-${statName}-val`).innerText = value;
            const bar = document.getElementById(`bar-${statName}`);
            bar.style.width = value + '%';
            
            if (value > 50) {
                bar.style.backgroundColor = statName === 'hunger' ? '#ff9800' : statName === 'happiness' ? '#e91e63' : statName === 'clean' ? '#03a9f4' : '#4caf50';
            } else if (value > 20) {
                bar.style.backgroundColor = '#ffeb3b';
            } else {
                bar.style.backgroundColor = '#f44336';
            }
        }
    </script>
