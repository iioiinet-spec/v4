<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>고군분투 - 닌자 고양이</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #0b0f19; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #game-container { position: relative; width: 800px; height: 400px; background-color: #1e293b; border-radius: 12px; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.7); }
        canvas { display: block; }
        
        /* UI Screens */
        .screen { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(15, 23, 42, 0.88); color: white; z-index: 10; backdrop-filter: blur(6px); }
        .hidden { display: none !important; }
        
        button { padding: 12px 24px; background: linear-gradient(to bottom, #3b82f6, #2563eb); border: none; border-radius: 8px; color: white; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: transform 0.1s, filter 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        button:hover { filter: brightness(1.1); transform: translateY(-2px); }
        button:active { transform: translateY(0); }
        button:disabled { background: #4b5563; color: #9ca3af; cursor: not-allowed; transform: none; box-shadow: none; filter: none; }
        
        #hud { position: absolute; top: 15px; left: 20px; color: white; font-size: 1.2rem; font-weight: bold; z-index: 5; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
        
        /* Shop Grid */
        .shop-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 88%; max-width: 540px; margin-bottom: 15px; max-height: 250px; overflow-y: auto; padding-right: 5px; }
        .shop-item { background: rgba(30, 41, 59, 0.95); border: 2px solid #334155; border-radius: 8px; padding: 10px; text-align: center; }
        .shop-item.equipped { border-color: #f59e0b; box-shadow: 0 0 12px rgba(245, 158, 11, 0.6); }

        /* Progress Bar */
        #progress-container { position: absolute; bottom: 0; left: 0; width: 100%; height: 8px; background: rgba(0,0,0,0.5); z-index: 5; }
        #progress-bar { width: 0%; height: 100%; background: linear-gradient(to right, #3b82f6, #10b981, #eab308); transition: width 0.2s linear; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    
    <div id="hud">
        <div>점수: <span id="current-score" class="text-yellow-400">0</span> | 생존: <span id="survival-time" class="text-blue-400">00:00</span></div>
    </div>

    <!-- Progress Bar (5-minute victory goal) -->
    <div id="progress-container">
        <div id="progress-bar"></div>
    </div>

    <!-- Start & Game Over Menu Screen -->
    <div id="start-screen" class="screen">
        <h1 id="menu-title" class="text-5xl font-extrabold mb-2 text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500 drop-shadow-lg">고군분투</h1>
        <p id="menu-desc" class="text-gray-300 mb-5 text-lg">닌자 고양이의 와이어 액션!</p>
        
        <div class="mb-5 p-2.5 bg-gray-800 bg-opacity-90 rounded-lg border border-gray-700 shadow-inner">
            <p class="text-lg text-yellow-400 font-bold">보유 코인: <span id="menu-total-coins">0</span> 🪙</p>
        </div>

        <div class="flex gap-4">
            <button id="start-btn">게임 시작</button>
            <button id="shop-btn" style="background: linear-gradient(to bottom, #10b981, #059669);">스킨 상점</button>
            <button id="howto-btn" style="background: linear-gradient(to bottom, #718096, #4a5568);">게임방법</button>
        </div>
    </div>

    <!-- Shop Screen -->
    <div id="shop-screen" class="screen hidden">
        <h2 class="text-3xl font-bold mb-1 text-green-400 drop-shadow-md">스킨 상점 & 업적</h2>
        <p class="mb-3 text-sm text-gray-300">현재 코인: <span id="shop-total-coins" class="text-yellow-400 font-bold">0</span> 🪙</p>
        
        <div class="shop-grid" id="shop-items-container">
            <!-- Shop items generated by JS -->
        </div>
        
        <button id="close-shop-btn" class="mt-1" style="background: linear-gradient(to bottom, #ef4444, #b91c1c); font-size: 1rem; padding: 8px 24px; box-shadow: 0 4px 10px rgba(239, 68, 68, 0.4);">❌ 상점 닫기</button>
    </div>

    <!-- Tutorial Screen -->
    <div id="tutorial-screen" class="screen hidden">
        <h2 class="text-4xl font-bold mb-6 text-yellow-400 drop-shadow-md">게임 방법</h2>
        <div class="text-left mb-8 text-base text-gray-200 space-y-3 bg-gray-800 p-6 rounded-lg w-3/4 max-w-md shadow-inner leading-relaxed">
            <p>🏃‍♂️ <strong>자동 이동:</strong> 스스로 달려갑니다. (30초마다 속도 상승)</p>
            <p>⬆️ <strong>점프:</strong> 바닥에서 클릭/터치하면 점프!</p>
            <p>🪠 <strong>공중 액션:</strong> 타워 근처에서 클릭하면 타워 꼭대기에 와이어가 꽂히며 스윙!</p>
            <p>🐉 <strong>특수 업적 스킨:</strong></p>
            <p class="text-sm text-orange-400 ml-4">- 2분 생존: 리자몽 (자유 비행! 단, 비행 시 코인 획득 불가)</p>
            <p class="text-sm text-slate-300 ml-4">- 5분 생존: 대형 돌 석상 (궁극의 능력!)</p>
            <p>🪙 <strong>코인:</strong> 은코인(10점), 금코인(50점)</p>
        </div>
        <button id="close-tutorial-btn">닫기</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI Elements
    const startScreen = document.getElementById('start-screen');
    const shopScreen = document.getElementById('shop-screen');
    const tutorialScreen = document.getElementById('tutorial-screen');
    
    const menuTitle = document.getElementById('menu-title');
    const menuDesc = document.getElementById('menu-desc');
    const startBtn = document.getElementById('start-btn');
    const shopBtn = document.getElementById('shop-btn');
    const howtoBtn = document.getElementById('howto-btn');
    const closeShopBtn = document.getElementById('close-shop-btn');
    const closeTutorialBtn = document.getElementById('close-tutorial-btn');
    const shopItemsContainer = document.getElementById('shop-items-container');
    
    const scoreElement = document.getElementById('current-score');
    const survivalTimeElement = document.getElementById('survival-time');
    const progressBar = document.getElementById('progress-bar');
    const menuTotalCoinsElement = document.getElementById('menu-total-coins');
    const shopTotalCoinsElement = document.getElementById('shop-total-coins');

    // Game Constants
    const GAME_WIDTH = 800;
    const GAME_HEIGHT = 400;
    const GRAVITY = 0.6;
    let INITIAL_SPEED = 5.5;
    const TARGET_SURVIVAL_TIME = 300; // 5분 = 300초

    // Game Variables
    let player;
    let platforms = [];
    let towers = [];
    let coins = [];
    let clouds = [];
    let lanterns = [];
    let fireflies = [];
    
    let score = 0;
    let frame = 0;
    let gameSpeed = INITIAL_SPEED;
    let isGameOver = false;
    let isVictory = false;
    let animationId;
    let lastPlatformEndX = 0;
    let lastPlatformY = GAME_HEIGHT - 80;
    let survivalTime = 0;
    let hasBrokenRecord = false;

    // Storage & Achievements
    let bestScore = parseInt(localStorage.getItem('ninjaCatBestScore')) || 0;
    let totalCoins = parseInt(localStorage.getItem('ninjaCatTotalCoins')) || 0;
    let currentSkin = localStorage.getItem('ninjaCatCurrentSkin') || 'default';
    let ownedSkins = JSON.parse(localStorage.getItem('ninjaCatOwnedSkins')) || ['default'];
    let maxSurvivalSeconds = parseInt(localStorage.getItem('ninjaCatMaxSurvival')) || 0;

    const SKINS_DB = {
        default: { id: 'default', name: '치즈 닌자', cost: 0, color: '#f59e0b', desc: '안정적인 기본형' },
        spiderman: { id: 'spiderman', name: '스파이더맨', cost: 1000, color: '#dc2626', desc: '점프력 20% 강화!' },
        genji: { id: 'genji', name: '사이보그 겐지', cost: 2500, color: '#d1d5db', desc: '획득 코인 1.5배!' },
        turtle: { id: 'turtle', name: '닌자 거북이', cost: 4000, color: '#16a34a', desc: '주변 코인 자동 흡수 (자석)' },
        shadow: { id: 'shadow', name: '그림자 닌자', cost: 6000, color: '#6366f1', desc: '특수 속도감 & 보너스 점수!' },
        samurai: { id: 'samurai', name: '황금 무사', cost: 10000, color: '#eab308', desc: '코인 2배 & 점프 강화!' },
        charizard: { id: 'charizard', name: '리자몽', cost: 0, unlock: '2분 생존 업적 보상', color: '#f97316', desc: '좌클릭 비행 가능! (단, 비행 시 코인 획득 불가)' },
        buddha: { id: 'buddha', name: '대형 돌 석상', cost: 0, unlock: '5분 생존 클리어 보상', color: '#64748b', desc: '궁극의 성능 & 자석 능력!' }
    };

    // 석상 상태 (무표정, 놀람, 비웃음)
    const statue = {
        x: GAME_WIDTH / 2, 
        y: 200, 
        state: 'NORMAL' // NORMAL, SURPRISED, MOCKING
    };

    class Player {
        constructor() {
            this.x = 150;
            this.y = GAME_HEIGHT - 150;
            this.width = currentSkin === 'buddha' ? 56 : currentSkin === 'charizard' ? 50 : 40;
            this.height = currentSkin === 'buddha' ? 50 : currentSkin === 'charizard' ? 42 : 30;
            this.velocityY = 0;
            this.isGrounded = false;
            
            this.isSwinging = false;
            this.wireTarget = null;
            this.swingAngle = 0;
            this.swingRadius = 0;
            this.swingSpeed = 0;
        }

        update() {
            if (currentSkin === 'charizard') {
                // 리자몽 전용 비행 물리 (중력이 약하고 클릭 시 상승)
                this.velocityY += GRAVITY * 0.35;
                this.y += this.velocityY;
                if (this.y < 20) { this.y = 20; this.velocityY = 0; }
                this.isGrounded = false;
                return;
            }

            if (this.isSwinging && this.wireTarget) {
                this.swingAngle += this.swingSpeed;
                this.swingSpeed += 0.002;
                
                if (this.wireTarget.ref) {
                    this.wireTarget.x = this.wireTarget.ref.x + this.wireTarget.ref.width / 2;
                }

                this.x = this.wireTarget.x + Math.sin(this.swingAngle) * this.swingRadius;
                this.y = this.wireTarget.y + Math.cos(this.swingAngle) * this.swingRadius;
                this.velocityY = 0;

                if (this.swingAngle > Math.PI / 2.5) this.releaseWire();
            } else {
                this.velocityY += GRAVITY;
                this.y += this.velocityY;
                
                if (this.x < 150) this.x += 2;
                if (this.x > 150) this.x -= 2;
                if (Math.abs(this.x - 150) < 2) this.x = 150;
            }
            this.isGrounded = false;
        }
        
        fireWire() {
            if (isGameOver || isVictory) return;
            if (currentSkin === 'charizard') return; // 리자몽은 비행하므로 와이어 불필요

            let target = null;
            let minDx = Infinity;

            for (let i = 0; i < towers.length; i++) {
                let tower = towers[i];
                let dx = tower.x - this.x;
                
                if (dx > 20 && dx < 450 && tower.y < this.y + 50) {
                    if (dx < minDx) {
                        minDx = dx;
                        target = tower;
                    }
                }
            }

            if (target) {
                this.isSwinging = true;
                this.wireTarget = { ref: target, x: target.x + target.width / 2, y: target.y };
                let dx = this.x - this.wireTarget.x;
                let dy = this.y - this.wireTarget.y;
                
                this.swingRadius = Math.sqrt(dx * dx + dy * dy);
                this.swingAngle = Math.atan2(dx, dy);
                this.swingSpeed = 0.02 + (gameSpeed * 0.002);
            }
        }

        releaseWire() {
            if (this.isSwinging) {
                this.isSwinging = false;
                this.wireTarget = null;
                let jumpMul = (currentSkin === 'spiderman' || currentSkin === 'samurai' || currentSkin === 'buddha') ? 1.4 : 1.0;
                this.velocityY = -11 * jumpMul * 0.85; 
            }
        }

        draw() {
            let legOffset1 = 0, legOffset2 = 0;
            if (this.isGrounded && !this.isSwinging && !isGameOver) {
                legOffset1 = Math.sin(frame * 0.5) * 8; 
                legOffset2 = Math.sin(frame * 0.5 + Math.PI) * 8;
            } else {
                legOffset1 = -5; legOffset2 = 5;
            }

            if (currentSkin === 'buddha') {
                this.drawBuddha(legOffset1, legOffset2);
            } else if (currentSkin === 'charizard') {
                this.drawCharizard();
            } else if (currentSkin === 'spiderman') {
                this.drawSpiderman(legOffset1, legOffset2);
            } else if (currentSkin === 'genji') {
                this.drawGenji(legOffset1, legOffset2);
            } else if (currentSkin === 'turtle') {
                this.drawTurtle(legOffset1, legOffset2);
            } else if (currentSkin === 'shadow') {
                this.drawShadow(legOffset1, legOffset2);
            } else if (currentSkin === 'samurai') {
                this.drawSamurai(legOffset1, legOffset2);
            } else {
                this.drawDefault(legOffset1, legOffset2);
            }
        }

        drawCharizard() {
            // 리자몽 비행 디자인
            ctx.fillStyle = '#ea580c'; ctx.beginPath(); ctx.roundRect(this.x, this.y, this.width, this.height, 12); ctx.fill();
            ctx.fillStyle = '#fdba74'; ctx.fillRect(this.x + 8, this.y + 12, this.width - 16, this.height - 16);
            ctx.fillStyle = '#c2410c';
            let wingFlap = Math.sin(frame * 0.4) * 15;
            ctx.beginPath(); ctx.moveTo(this.x + 20, this.y + 10); ctx.lineTo(this.x + 5, this.y - 15 + wingFlap); ctx.lineTo(this.x + 35, this.y + 5); ctx.fill();
            ctx.fillStyle = '#ea580c'; ctx.beginPath(); ctx.roundRect(this.x + 25, this.y - 12, 24, 20, 8); ctx.fill();
            ctx.fillStyle = '#1e293b'; ctx.fillRect(this.x + 35, this.y - 4, 4, 4);
            let flameSize = 8 + Math.sin(frame * 0.3) * 3;
            ctx.fillStyle = '#fef08a'; ctx.beginPath(); ctx.arc(this.x - 10, this.y + 20, flameSize + 3, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(this.x - 10, this.y + 20, flameSize, 0, Math.PI*2); ctx.fill();
        }

        drawBuddha(legOffset1, legOffset2) {
            if (this.isSwinging && this.wireTarget) {
                ctx.beginPath(); ctx.moveTo(this.x + this.width, this.y); ctx.lineTo(this.wireTarget.x, this.wireTarget.y);
                ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 4; ctx.stroke();
                ctx.fillStyle = '#facc15'; ctx.beginPath(); ctx.arc(this.wireTarget.x, this.wireTarget.y, 10, 0, Math.PI * 2); ctx.fill();
            }
            ctx.fillStyle = '#64748b'; ctx.beginPath(); ctx.roundRect(this.x, this.y, this.width, this.height, 16); ctx.fill();
            ctx.fillStyle = '#475569'; ctx.beginPath(); ctx.arc(this.x + this.width/2, this.y + 20, 22, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(this.x + 10, this.y + 15); ctx.lineTo(this.x + 22, this.y + 15); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(this.x + 34, this.y + 15); ctx.lineTo(this.x + 46, this.y + 15); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(this.x + 20, this.y + 30); ctx.lineTo(this.x + 36, this.y + 30); ctx.stroke();
            ctx.fillStyle = '#fbbf24'; ctx.beginPath(); ctx.arc(this.x + this.width/2, this.y + 8, 4, 0, Math.PI*2); ctx.fill();
        }

        drawDefault(legOffset1, legOffset2) {
            if (this.isSwinging && this.wireTarget) {
                ctx.beginPath(); ctx.moveTo(this.x + this.width, this.y); ctx.lineTo(this.wireTarget.x, this.wireTarget.y);
                ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 2; ctx.stroke();
                ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(this.wireTarget.x, this.wireTarget.y, 8, 0, Math.PI * 2); ctx.fill();
            }
            ctx.fillStyle = '#f59e0b'; ctx.beginPath(); ctx.roundRect(this.x, this.y, this.width, this.height, 12); ctx.fill();
            ctx.fillStyle = '#d97706'; ctx.fillRect(this.x + 10, this.y, 4, this.height); ctx.fillRect(this.x + 20, this.y, 4, this.height);
            ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.roundRect(this.x + 5, this.y + 15, this.width - 10, 15, 6); ctx.fill();
            ctx.fillStyle = '#111827'; ctx.beginPath(); ctx.roundRect(this.x + 20, this.y - 10, 22, 22, 8); ctx.fill();
            ctx.fillStyle = '#f59e0b'; ctx.beginPath(); ctx.moveTo(this.x+22, this.y-10); ctx.lineTo(this.x+28, this.y-20); ctx.lineTo(this.x+32, this.y-10); ctx.fill();
            ctx.beginPath(); ctx.moveTo(this.x+34, this.y-10); ctx.lineTo(this.x+38, this.y-20); ctx.lineTo(this.x+42, this.y-10); ctx.fill();
            ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.roundRect(this.x + 24, this.y - 5, 16, 11, 4); ctx.fill();
            ctx.fillStyle = '#000000'; ctx.beginPath(); ctx.arc(this.x+28, this.y, 2, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(this.x+36, this.y, 2, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#f472b6'; ctx.beginPath(); ctx.arc(this.x+32, this.y+2, 1.5, 0, Math.PI*2); ctx.fill(); 
            let tailOffset = Math.sin(frame * 0.2) * 5;
            ctx.fillStyle = '#ef4444'; ctx.fillRect(this.x + 15, this.y - 5, -12, 4);
            ctx.beginPath(); ctx.moveTo(this.x, this.y+5); ctx.quadraticCurveTo(this.x-15, this.y-10+tailOffset, this.x-20, this.y+tailOffset);
            ctx.lineWidth = 4; ctx.strokeStyle = '#f59e0b'; ctx.stroke();
            ctx.fillStyle = '#f59e0b';
            ctx.fillRect(this.x + 5 + legOffset2, this.y + this.height - 2, 6, 10);
            ctx.fillRect(this.x + 15 + legOffset1, this.y + this.height - 2, 6, 10);
            if (this.isSwinging) {
                ctx.save(); ctx.translate(this.x + this.width - 5, this.y + 10);
                let aimAngle = Math.atan2(this.wireTarget.y - (this.y + 10), this.wireTarget.x - (this.x + this.width));
                ctx.rotate(aimAngle); ctx.fillRect(0, -3, 20, 6); ctx.restore();
                ctx.fillRect(this.x + 25 + legOffset1, this.y + this.height - 2, 6, 10);
            } else {
                ctx.fillRect(this.x + 25 + legOffset2, this.y + this.height - 2, 6, 10);
                ctx.fillRect(this.x + 35 + legOffset1, this.y + this.height - 2, 6, 10);
                ctx.fillStyle = '#94a3b8'; ctx.fillRect(this.x + 10, this.y - 15, 4, 25);
                ctx.fillStyle = '#ef4444'; ctx.fillRect(this.x + 5, this.y - 20, 14, 8);
            }
        }

        drawSpiderman(legOffset1, legOffset2) {
            if (this.isSwinging && this.wireTarget) {
                ctx.beginPath(); ctx.moveTo(this.x + this.width, this.y); ctx.lineTo(this.wireTarget.x, this.wireTarget.y);
                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke();
                ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(this.wireTarget.x, this.wireTarget.y, 6, 0, Math.PI * 2); ctx.fill();
            }
            ctx.fillStyle = '#dc2626'; ctx.beginPath(); ctx.roundRect(this.x, this.y, this.width, this.height, 12); ctx.fill();
            ctx.fillStyle = '#2563eb'; ctx.fillRect(this.x+10, this.y, 20, this.height);
            ctx.fillStyle = '#dc2626'; ctx.beginPath(); ctx.roundRect(this.x + 20, this.y - 12, 22, 22, 10); ctx.fill();
            ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#000000'; ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(this.x+22, this.y-2); ctx.lineTo(this.x+28, this.y-10); ctx.lineTo(this.x+30, this.y); ctx.closePath(); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(this.x+32, this.y); ctx.lineTo(this.x+34, this.y-10); ctx.lineTo(this.x+40, this.y-2); ctx.closePath(); ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#dc2626';
            ctx.fillRect(this.x + 5 + legOffset2, this.y + this.height - 2, 6, 10);
            ctx.fillRect(this.x + 15 + legOffset1, this.y + this.height - 2, 6, 10);
            if (this.isSwinging) {
                ctx.save(); ctx.translate(this.x + this.width - 5, this.y + 10);
                let aimAngle = Math.atan2(this.wireTarget.y - (this.y + 10), this.wireTarget.x - (this.x + this.width));
                ctx.rotate(aimAngle); ctx.fillRect(0, -3, 20, 6); ctx.restore();
                ctx.fillRect(this.x + 25 + legOffset1, this.y + this.height - 2, 6, 10);
            } else {
                ctx.fillRect(this.x + 25 + legOffset2, this.y + this.height - 2, 6, 10);
                ctx.fillRect(this.x + 35 + legOffset1, this.y + this.height - 2, 6, 10);
            }
        }

        drawGenji(legOffset1, legOffset2) {
            if (this.isSwinging && this.wireTarget) {
                ctx.beginPath(); ctx.moveTo(this.x + this.width, this.y); ctx.lineTo(this.wireTarget.x, this.wireTarget.y);
                ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 2; ctx.stroke();
                ctx.fillStyle = '#94a3b8'; ctx.beginPath(); ctx.arc(this.wireTarget.x, this.wireTarget.y, 6, 0, Math.PI * 2); ctx.fill();
            }
            ctx.fillStyle = '#d1d5db'; ctx.beginPath(); ctx.roundRect(this.x, this.y, this.width, this.height, 6); ctx.fill();
            ctx.fillStyle = '#4b5563'; ctx.fillRect(this.x+5, this.y+5, 10, 10);
            ctx.fillStyle = '#e5e7eb'; ctx.beginPath(); ctx.roundRect(this.x + 20, this.y - 12, 22, 22, 4); ctx.fill();
            ctx.fillStyle = '#22c55e'; ctx.shadowColor = '#22c55e'; ctx.shadowBlur = 10;
            ctx.fillRect(this.x + 22, this.y - 4, 16, 4);
            ctx.shadowBlur = 0;
            let tailOffset = Math.sin(frame * 0.3) * 5;
            ctx.fillStyle = '#22c55e';
            ctx.beginPath(); ctx.moveTo(this.x+15, this.y-5); ctx.quadraticCurveTo(this.x-10, this.y-10+tailOffset, this.x-25, this.y+5+tailOffset);
            ctx.lineWidth = 5; ctx.strokeStyle = '#22c55e'; ctx.stroke();
            ctx.fillStyle = '#9ca3af';
            ctx.fillRect(this.x + 5 + legOffset2, this.y + this.height - 2, 6, 10);
            ctx.fillRect(this.x + 15 + legOffset1, this.y + this.height - 2, 6, 10);
            if (this.isSwinging) {
                ctx.save(); ctx.translate(this.x + this.width - 5, this.y + 10);
                let aimAngle = Math.atan2(this.wireTarget.y - (this.y + 10), this.wireTarget.x - (this.x + this.width));
                ctx.rotate(aimAngle); ctx.fillRect(0, -3, 20, 6); ctx.restore();
                ctx.fillRect(this.x + 25 + legOffset1, this.y + this.height - 2, 6, 10);
            } else {
                ctx.fillRect(this.x + 25 + legOffset2, this.y + this.height - 2, 6, 10);
                ctx.fillRect(this.x + 35 + legOffset1, this.y + this.height - 2, 6, 10);
                ctx.fillStyle = '#374151'; ctx.fillRect(this.x + 10, this.y - 20, 4, 30);
                ctx.fillStyle = '#22c55e'; ctx.fillRect(this.x + 8, this.y - 22, 8, 4);
            }
        }

        drawTurtle(legOffset1, legOffset2) {
            if (this.isSwinging && this.wireTarget) {
                ctx.beginPath(); ctx.moveTo(this.x + this.width, this.y); ctx.lineTo(this.wireTarget.x, this.wireTarget.y);
                ctx.strokeStyle = '#78350f'; ctx.lineWidth = 3; ctx.stroke();
                ctx.fillStyle = '#92400e'; ctx.beginPath(); ctx.arc(this.wireTarget.x, this.wireTarget.y, 6, 0, Math.PI * 2); ctx.fill();
            }
            ctx.fillStyle = '#16a34a'; ctx.beginPath(); ctx.roundRect(this.x, this.y, this.width, this.height, 12); ctx.fill();
            ctx.fillStyle = '#854d0e'; ctx.beginPath(); ctx.roundRect(this.x-5, this.y+2, 20, this.height-4, 8); ctx.fill();
            ctx.fillStyle = '#ca8a04'; ctx.beginPath(); ctx.roundRect(this.x+5, this.y+15, this.width-15, 15, 6); ctx.fill();
            ctx.fillStyle = '#16a34a'; ctx.beginPath(); ctx.arc(this.x + 30, this.y - 2, 12, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#2563eb'; ctx.fillRect(this.x+18, this.y-8, 22, 8);
            ctx.beginPath(); ctx.moveTo(this.x+18, this.y-8); ctx.lineTo(this.x+5, this.y-12); ctx.lineTo(this.x+18, this.y-2); ctx.fill();
            ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(this.x+26, this.y-4, 2, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(this.x+34, this.y-4, 2, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#16a34a';
            ctx.fillRect(this.x + 5 + legOffset2, this.y + this.height - 2, 8, 10);
            ctx.fillRect(this.x + 15 + legOffset1, this.y + this.height - 2, 8, 10);
            if (this.isSwinging) {
                ctx.save(); ctx.translate(this.x + this.width - 5, this.y + 10);
                let aimAngle = Math.atan2(this.wireTarget.y - (this.y + 10), this.wireTarget.x - (this.x + this.width));
                ctx.rotate(aimAngle); ctx.fillRect(0, -3, 20, 6); ctx.restore();
                ctx.fillRect(this.x + 25 + legOffset1, this.y + this.height - 2, 8, 10);
            } else {
                ctx.fillRect(this.x + 25 + legOffset2, this.y + this.height - 2, 8, 10);
                ctx.fillRect(this.x + 35 + legOffset1, this.y + this.height - 2, 8, 10);
            }
        }

        drawShadow(legOffset1, legOffset2) {
            if (this.isSwinging && this.wireTarget) {
                ctx.beginPath(); ctx.moveTo(this.x + this.width, this.y); ctx.lineTo(this.wireTarget.x, this.wireTarget.y);
                ctx.strokeStyle = '#a855f7'; ctx.lineWidth = 2; ctx.stroke();
                ctx.fillStyle = '#6366f1'; ctx.beginPath(); ctx.arc(this.wireTarget.x, this.wireTarget.y, 6, 0, Math.PI * 2); ctx.fill();
            }
            ctx.fillStyle = '#312e81'; ctx.beginPath(); ctx.roundRect(this.x, this.y, this.width, this.height, 12); ctx.fill();
            ctx.fillStyle = '#1e1b4b'; ctx.beginPath(); ctx.roundRect(this.x + 20, this.y - 10, 22, 22, 8); ctx.fill();
            ctx.fillStyle = '#a855f7'; ctx.shadowColor = '#a855f7'; ctx.shadowBlur = 8;
            ctx.fillRect(this.x + 24, this.y - 4, 14, 3);
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#4338ca';
            ctx.fillRect(this.x + 5 + legOffset2, this.y + this.height - 2, 6, 10);
            ctx.fillRect(this.x + 15 + legOffset1, this.y + this.height - 2, 6, 10);
            if (this.isSwinging) {
                ctx.save(); ctx.translate(this.x + this.width - 5, this.y + 10);
                let aimAngle = Math.atan2(this.wireTarget.y - (this.y + 10), this.wireTarget.x - (this.x + this.width));
                ctx.rotate(aimAngle); ctx.fillRect(0, -3, 20, 6); ctx.restore();
                ctx.fillRect(this.x + 25 + legOffset1, this.y + this.height - 2, 6, 10);
            } else {
                ctx.fillRect(this.x + 25 + legOffset2, this.y + this.height - 2, 6, 10);
                ctx.fillRect(this.x + 35 + legOffset1, this.y + this.height - 2, 6, 10);
            }
        }

        drawSamurai(legOffset1, legOffset2) {
            if (this.isSwinging && this.wireTarget) {
                ctx.beginPath(); ctx.moveTo(this.x + this.width, this.y); ctx.lineTo(this.wireTarget.x, this.wireTarget.y);
                ctx.strokeStyle = '#eab308'; ctx.lineWidth = 3; ctx.stroke();
                ctx.fillStyle = '#facc15'; ctx.beginPath(); ctx.arc(this.wireTarget.x, this.wireTarget.y, 7, 0, Math.PI * 2); ctx.fill();
            }
            ctx.fillStyle = '#ca8a04'; ctx.beginPath(); ctx.roundRect(this.x, this.y, this.width, this.height, 12); ctx.fill();
            ctx.fillStyle = '#facc15'; ctx.fillRect(this.x+8, this.y+4, this.width-16, 6);
            ctx.fillStyle = '#a16207'; ctx.beginPath(); ctx.roundRect(this.x + 20, this.y - 12, 22, 22, 10); ctx.fill();
            ctx.fillStyle = '#facc15'; ctx.beginPath(); ctx.arc(this.x + 31, this.y - 18, 6, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#ca8a04';
            ctx.fillRect(this.x + 5 + legOffset2, this.y + this.height - 2, 6, 10);
            ctx.fillRect(this.x + 15 + legOffset1, this.y + this.height - 2, 6, 10);
            if (this.isSwinging) {
                ctx.save(); ctx.translate(this.x + this.width - 5, this.y + 10);
                let aimAngle = Math.atan2(this.wireTarget.y - (this.y + 10), this.wireTarget.x - (this.x + this.width));
                ctx.rotate(aimAngle); ctx.fillRect(0, -3, 20, 6); ctx.restore();
                ctx.fillRect(this.x + 25 + legOffset1, this.y + this.height - 2, 6, 10);
            } else {
                ctx.fillRect(this.x + 25 + legOffset2, this.y + this.height - 2, 6, 10);
                ctx.fillRect(this.x + 35 + legOffset1, this.y + this.height - 2, 6, 10);

    class Platform {
        constructor(x, y, w, h) {
            this.x = x; this.y = y; this.width = w; this.height = h; this.markedForDeletion = false;
        }
        update() {
            if (!isGameOver && !isVictory) this.x -= gameSpeed;
            if (this.x + this.width < 0) this.markedForDeletion = true;
        }
        draw() {
            ctx.fillStyle = '#1e293b';
            ctx.beginPath(); ctx.moveTo(this.x - 12, this.y + 18); ctx.lineTo(this.x, this.y); ctx.lineTo(this.x + this.width, this.y); ctx.lineTo(this.x + this.width + 12, this.y + 18); ctx.fill();
            
            ctx.fillStyle = '#0f172a';
            for(let i = 0; i < this.width; i += 28) { ctx.beginPath(); ctx.arc(this.x + i + 14, this.y + 2, 9, 0, Math.PI); ctx.fill(); }
            
            ctx.fillStyle = '#f8fafc'; ctx.fillRect(this.x, this.y + 18, this.width, this.height - 18);
            ctx.fillStyle = '#451a03'; 
            for(let i = 30; i < this.width - 30; i += 70) {
                ctx.fillRect(this.x + i, this.y + 18, 10, this.height - 18);
                ctx.fillStyle = '#fef08a';
                ctx.fillRect(this.x + i + 15, this.y + 35, 30, 40);
                ctx.strokeStyle = '#451a03'; ctx.lineWidth = 2;
                ctx.strokeRect(this.x + i + 15, this.y + 35, 30, 40);
                ctx.beginPath(); ctx.moveTo(this.x + i + 30, this.y + 35); ctx.lineTo(this.x + i + 30, this.y + 75); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(this.x + i + 15, this.y + 55); ctx.lineTo(this.x + i + 45, this.y + 55); ctx.stroke();
                ctx.fillStyle = '#451a03';
            }
            ctx.fillRect(this.x, this.y + 18, this.width, 8);
        }
    }

    class Tower {
        constructor(x, y, w, h) {
            this.x = x; this.y = y; this.width = w; this.height = h; this.markedForDeletion = false;
        }
        update() {
            if (!isGameOver && !isVictory) this.x -= gameSpeed;
            if (this.x + this.width < 0) this.markedForDeletion = true;
        }
        draw() {
            ctx.fillStyle = '#f8fafc'; ctx.fillRect(this.x, this.y, this.width, this.height);
            ctx.strokeStyle = '#334155'; ctx.lineWidth = 2; ctx.strokeRect(this.x, this.y, this.width, this.height);

            ctx.fillStyle = '#1e293b';
            for (let wy = this.y + 30; wy < this.y + this.height - 40; wy += 50) {
                ctx.fillRect(this.x + 10, wy, 10, 16);
                ctx.fillRect(this.x + this.width - 20, wy, 10, 16);
            }

            let layerHeight = 70; 
            let roofCount = Math.floor(this.height / layerHeight);
            for(let i = 0; i <= roofCount; i++) {
                let rY = this.y + (i * layerHeight);
                let overhang = 18 + (i * 3);
                ctx.fillStyle = '#0f172a';
                ctx.beginPath(); ctx.moveTo(this.x - overhang, rY + 16); ctx.lineTo(this.x, rY); ctx.lineTo(this.x + this.width, rY); ctx.lineTo(this.x + this.width + overhang, rY + 16); ctx.fill();
                ctx.fillStyle = '#334155'; ctx.fillRect(this.x - overhang/1.5, rY + 6, this.width + overhang*1.3, 4);
            }
            ctx.fillStyle = '#fbbf24';
            ctx.beginPath(); ctx.moveTo(this.x + this.width/2 - 6, this.y); ctx.lineTo(this.x + this.width/2, this.y - 18); ctx.lineTo(this.x + this.width/2 + 6, this.y); ctx.fill();
        }
    }

    class Coin {
        constructor(x, y, type) {
            this.x = x; this.y = y; this.type = type; this.radius = 12; this.markedForDeletion = false; this.sinValue = Math.random() * Math.PI * 2; 
        }
        update() {
            if (!isGameOver && !isVictory && (currentSkin === 'turtle' || currentSkin === 'samurai' || currentSkin === 'buddha') && player) {
                let dx = player.x - this.x;
                let dy = player.y - this.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                let magnetRange = currentSkin === 'buddha' ? 300 : 140;
                if (dist < magnetRange) {
                    this.x += dx * 0.12;
                    this.y += dy * 0.12;
                }
            }

            if (!isGameOver && !isVictory) this.x -= gameSpeed; 
            this.sinValue += 0.1;
            if (this.x + this.radius < 0) this.markedForDeletion = true;
        }
        draw() {
            let floatY = this.y + Math.sin(this.sinValue) * 5;
            ctx.beginPath(); ctx.arc(this.x, floatY, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = this.type === 'gold' ? '#fbbf24' : '#cbd5e1'; ctx.fill();
            ctx.beginPath(); ctx.arc(this.x, floatY, this.radius - 4, 0, Math.PI * 2);
            ctx.fillStyle = this.type === 'gold' ? '#f59e0b' : '#94a3b8'; ctx.fill();
        }
    }
    
    class Cloud {
        constructor(x, y, size, speedRatio) {
            this.x = x; this.y = y; this.size = size; this.speedRatio = speedRatio;
        }
        update() {
            if (!isGameOver && !isVictory) this.x -= gameSpeed * this.speedRatio;
            if (this.x + this.size * 3 < 0) {
                this.x = GAME_WIDTH + Math.random() * 200; this.y = 20 + Math.random() * 200;
            }
        }
        draw() {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.18)';
            ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.arc(this.x + this.size * 1.2, this.y - this.size * 0.3, this.size * 0.8, 0, Math.PI * 2);
            ctx.arc(this.x + this.size * 1.5, this.y + this.size * 0.2, this.size * 0.9, 0, Math.PI * 2); ctx.fill();
        }
    }

    class Lantern {
        constructor(x, y) {
            this.x = x; this.y = y; this.swing = Math.random() * Math.PI;
        }
        update() {
            if (!isGameOver && !isVictory) this.x -= gameSpeed * 0.4;
            this.swing += 0.04;
            if (this.x < -50) {
                this.x = GAME_WIDTH + Math.random() * 200;
                this.y = 50 + Math.random() * 150;
            }
        }
        draw() {
            let curX = this.x + Math.sin(this.swing) * 6;
            ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(this.x, 0); ctx.lineTo(curX, this.y); ctx.stroke();
            
            ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.roundRect(curX - 10, this.y, 20, 26, 6); ctx.fill();
            ctx.fillStyle = '#fbbf24'; ctx.fillRect(curX - 6, this.y + 4, 12, 18);
        }
    }

    class Firefly {
        constructor() {
            this.x = Math.random() * GAME_WIDTH;
            this.y = Math.random() * GAME_HEIGHT;
            this.vx = (Math.random() - 0.5) * 1;
            this.vy = (Math.random() - 0.5) * 1;
            this.alpha = Math.random();
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            if (!isGameOver && !isVictory) this.x -= gameSpeed * 0.2;
            if (this.x < 0) this.x = GAME_WIDTH;
            if (this.y < 0 || this.y > GAME_HEIGHT) this.vy *= -1;
            this.alpha += (Math.random() - 0.5) * 0.1;
            if (this.alpha < 0.1) this.alpha = 0.1;
            if (this.alpha > 0.9) this.alpha = 0.9;
        }
        draw() {
            ctx.fillStyle = `rgba(253, 224, 71, ${this.alpha})`;
            ctx.beginPath(); ctx.arc(this.x, this.y, 2, 0, Math.PI*2); ctx.fill();
        }
    }

    function drawRealisticStoneStatue() {
        ctx.save();
        ctx.translate(statue.x, statue.y);
        
        let moonGradient = ctx.createRadialGradient(0, -60, 0, 0, -60, 260);
        moonGradient.addColorStop(0, 'rgba(254, 240, 138, 1)'); 
        moonGradient.addColorStop(0.4, 'rgba(253, 224, 71, 0.6)'); 
        moonGradient.addColorStop(1, 'rgba(253, 224, 71, 0)');
        ctx.fillStyle = moonGradient;
        ctx.beginPath(); ctx.arc(0, -60, 260, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fef08a';
        ctx.beginPath(); ctx.arc(0, -60, 120, 0, Math.PI * 2); ctx.fill();

        let stoneGrad = ctx.createLinearGradient(0, -120, 0, 160);
        stoneGrad.addColorStop(0, '#64748b'); 
        stoneGrad.addColorStop(0.5, '#475569');
        stoneGrad.addColorStop(1, '#1e293b');

        ctx.fillStyle = stoneGrad;
        ctx.beginPath(); ctx.moveTo(0, -20); ctx.quadraticCurveTo(-140, 20, -160, 140); ctx.lineTo(160, 140); ctx.quadraticCurveTo(140, 20, 0, -20); ctx.fill();
        
        ctx.strokeStyle = 'rgba(15, 23, 42, 0.4)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(-60, 20); ctx.quadraticCurveTo(0, 80, 60, 20); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-80, 60); ctx.quadraticCurveTo(0, 120, 80, 60); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-120, 110); ctx.quadraticCurveTo(0, 150, 120, 110); ctx.stroke();

        ctx.fillStyle = stoneGrad;
        ctx.beginPath(); ctx.moveTo(100, 40); ctx.quadraticCurveTo(170, -20, 130, -70); ctx.lineTo(90, -70); ctx.quadraticCurveTo(130, -20, 80, 20); ctx.fill();

        ctx.fillStyle = '#334155';
        for(let i=0; i<12; i++) {
            let angle = (i / 11) * Math.PI; let beadX = Math.cos(angle) * -70; let beadY = Math.sin(angle) * 50 + 20;
            ctx.beginPath(); ctx.arc(beadX, beadY, 12, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 2; ctx.stroke();
        }

        ctx.fillStyle = stoneGrad;
        ctx.beginPath(); ctx.arc(0, -60, 70, 0, Math.PI * 2); ctx.fill();
        
        ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
        ctx.beginPath(); ctx.arc(-15, -80, 35, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = '#fbbf24'; ctx.beginPath(); ctx.arc(0, -90, 5, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = stoneGrad;
        ctx.beginPath(); ctx.moveTo(-60, -90); ctx.lineTo(-40, -140); ctx.lineTo(-10, -120); ctx.fill();
        ctx.beginPath(); ctx.moveTo(60, -90); ctx.lineTo(40, -140); ctx.lineTo(10, -120); ctx.fill();

        ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 4;
        if (statue.state === 'NORMAL') {
            ctx.beginPath(); ctx.moveTo(-35, -60); ctx.lineTo(-15, -60); ctx.stroke(); 
            ctx.beginPath(); ctx.moveTo(15, -60); ctx.lineTo(35, -60); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(-15, -25); ctx.lineTo(15, -25); ctx.stroke();
        } else if (statue.state === 'SURPRISED') {
            ctx.fillStyle = '#0f172a';
            ctx.beginPath(); ctx.arc(-25, -60, 10, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(25, -60, 10, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(0, -25, 12, 0, Math.PI*2); ctx.stroke();
        } else if (statue.state === 'MOCKING') {
            ctx.beginPath(); ctx.moveTo(-40, -65); ctx.lineTo(-15, -55); ctx.stroke(); 
            ctx.beginPath(); ctx.moveTo(40, -65); ctx.lineTo(15, -55); ctx.stroke(); 
            ctx.beginPath(); ctx.arc(-5, -25, 20, 0, Math.PI/1.5, false); ctx.stroke();
        }

        ctx.fillStyle = stoneGrad;
        ctx.beginPath(); ctx.arc(110, -70, 25, 0, Math.PI*2); ctx.fill(); 
        
        ctx.fillStyle = '#451a03'; ctx.fillRect(80, -165, 90, 60); 
        ctx.fillStyle = '#1e293b'; ctx.fillRect(85, -160, 80, 50); 
        
        ctx.fillStyle = '#fbbf24'; ctx.font = 'bold 18px Arial'; ctx.textAlign = 'center'; ctx.fillText("BEST", 125, -140);
        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 22px Arial'; ctx.fillText(bestScore, 125, -120);
        
        ctx.restore();
    }

    function initGame() {
        startScreen.classList.add('hidden');
        shopScreen.classList.add('hidden');
        tutorialScreen.classList.add('hidden');

        player = new Player();
        platforms = [];
        towers = [];
        coins = [];
        score = 0;
        frame = 0;
        survivalTime = 0;
        gameSpeed = INITIAL_SPEED;
        isGameOver = false;
        isVictory = false;
        hasBrokenRecord = false;
        statue.state = 'NORMAL';
        scoreElement.innerText = score;
        survivalTimeElement.innerText = "00:00";
        progressBar.style.width = "0%";
        lastPlatformEndX = GAME_WIDTH;
        lastPlatformY = GAME_HEIGHT - 80;
        
        platforms.push(new Platform(0, GAME_HEIGHT - 80, GAME_WIDTH, 80));
        
        if (animationId) cancelAnimationFrame(animationId);
        animate();
    }

    function generateLevelChunks() {
        if (isGameOver || isVictory) return;

        while (lastPlatformEndX < GAME_WIDTH + 800) {
            let hasTower = Math.random() < 0.7; 
            let gap, pHeight;
            let speedBonus = (gameSpeed - INITIAL_SPEED) * 8; 

            if (hasTower) {
                gap = 150 + Math.random() * 200 + speedBonus;
                pHeight = GAME_HEIGHT - (80 + Math.random() * 140);
            } else {
                gap = 70 + Math.random() * 80 + (speedBonus * 0.5); 
                pHeight = lastPlatformY + (Math.random() * 60 - 30);
                if (pHeight > GAME_HEIGHT - 40) pHeight = GAME_HEIGHT - 40;
                if (pHeight < GAME_HEIGHT - 180) pHeight = GAME_HEIGHT - 180;
            }

            let startX = lastPlatformEndX + gap;
            let pWidth = 300 + Math.random() * 400;
            platforms.push(new Platform(startX, pHeight, pWidth, GAME_HEIGHT - pHeight));
            lastPlatformY = pHeight;
            
            if (hasTower) {
                let tX = startX - gap / 2 - 20; 
                let tHeight = pHeight - (100 + Math.random() * 80); 
                towers.push(new Tower(tX, tHeight, 40, GAME_HEIGHT - tHeight));
            }
            
            let coinCount = Math.floor(pWidth / 30); 
            for (let i = 0; i < coinCount; i++) {
                let cX = startX + (pWidth / coinCount) * i + 15;
                let cY = pHeight - 40 - (Math.random() * 60); 
                coins.push(new Coin(cX, cY, Math.random() < 0.25 ? 'gold' : 'silver'));
            }
            lastPlatformEndX = startX + pWidth;
        }
    }

    function checkCollisions() {
        if (isGameOver || isVictory) return;
        if (currentSkin === 'charizard') return; // 리자몽은 비행하므로 낙사 및 발판 충돌 면제

        platforms.forEach(p => {
            if (!player.isSwinging && player.x < p.x + p.width && player.x + player.width > p.x && player.y + player.height <= p.y + 15 && player.y + player.height + player.velocityY >= p.y) {
                player.isGrounded = true; player.velocityY = 0; player.y = p.y - player.height;
            }
        });

        coins.forEach(c => {
            if (!c.markedForDeletion) {
                let testX = Math.max(player.x, Math.min(c.x, player.x + player.width));
                let testY = Math.max(player.y, Math.min(c.y, player.y + player.height));
                let dist = Math.sqrt((c.x - testX)**2 + (c.y - testY)**2);
                if (dist <= c.radius + 5) {
                    c.markedForDeletion = true;
                    
                    // 리자몽은 코인 획득 불가
                    if (currentSkin === 'charizard') return;

                    let baseVal = c.type === 'gold' ? 50 : 10;
                    let coinMultiplier = 1.0;
                    if (currentSkin === 'genji') coinMultiplier = 1.5;
                    if (currentSkin === 'samurai' || currentSkin === 'buddha') coinMultiplier = 2.0;

                    let gained = Math.round(baseVal * coinMultiplier);
                    if (currentSkin === 'shadow' || currentSkin === 'buddha') gained += 15;

                    score += gained;
                    totalCoins += gained;
                    scoreElement.innerText = score;

                    if (bestScore > 0 && score > bestScore && !hasBrokenRecord) {
                        hasBrokenRecord = true;
                        statue.state = 'SURPRISED';
                    }
                }
            }
        });

        if (player.y > GAME_HEIGHT) handleGameOver();
    }

    function handleGameOver() {
        isGameOver = true;
        statue.state = 'MOCKING';
        
        if (score > bestScore) {
            bestScore = score;
            localStorage.setItem('ninjaCatBestScore', bestScore);
        }
        localStorage.setItem('ninjaCatTotalCoins', totalCoins);
        updateCoinDisplays();
        
        setTimeout(() => {
            menuTitle.innerText = "게임 오버!";
            menuDesc.innerText = `최고 기록: ${bestScore}점 | 이번 점수: ${score}점`;
            startBtn.innerText = "다시 하기";
            startScreen.classList.remove('hidden');
        }, 600);
    }

    function handleVictory() {
        isVictory = true;
        if (!ownedSkins.includes('buddha')) {
            ownedSkins.push('buddha');
            localStorage.setItem('ninjaCatOwnedSkins', JSON.stringify(ownedSkins));
        }
        localStorage.setItem('ninjaCatTotalCoins', totalCoins);
        updateCoinDisplays();

        setTimeout(() => {
            menuTitle.innerText = "🎉 5분 생존 클리어! 🎉";
            menuDesc.innerText = "궁극의 '대형 돌 석상' 스킨이 해금되었습니다!";
            startBtn.innerText = "다시 하기";
            startScreen.classList.remove('hidden');
        }, 500);
    }

    function checkAchievements(secs) {
        if (secs > maxSurvivalSeconds) {
            maxSurvivalSeconds = secs;
            localStorage.setItem('ninjaCatMaxSurvival', maxSurvivalSeconds);
        }

        // 2분(120초) 생존 시 리자몽 업적 해금
        if (secs >= 120 && !ownedSkins.includes('charizard')) {
            ownedSkins.push('charizard');
            localStorage.setItem('ninjaCatOwnedSkins', JSON.stringify(ownedSkins));
        }
    }

    function animate() {
        ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
        
        let gradient = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
        gradient.addColorStop(0, '#0f172a'); gradient.addColorStop(1, '#1e293b');
        ctx.fillStyle = gradient; ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
        
        drawRealisticStoneStatue();
        
        clouds.forEach(c => { c.update(); c.draw(); });
        lanterns.forEach(l => { l.update(); l.draw(); });
        fireflies.forEach(f => { f.update(); f.draw(); });

        generateLevelChunks();
        if (!isGameOver && !isVictory) lastPlatformEndX -= gameSpeed;

        platforms = platforms.filter(p => !p.markedForDeletion); platforms.forEach(p => { p.update(); p.draw(); });
        towers = towers.filter(t => !t.markedForDeletion); towers.forEach(t => { t.update(); t.draw(); });
        coins = coins.filter(c => !c.markedForDeletion); coins.forEach(c => { c.update(); c.draw(); });

        player.update();
        checkCollisions();
        player.draw();

        if (!isGameOver && !isVictory) {
            frame++;
            if (frame % 60 === 0) {
                survivalTime++;
                checkAchievements(survivalTime);

                let mins = String(Math.floor(survivalTime / 60)).padStart(2, '0');
                let secs = String(survivalTime % 60).padStart(2, '0');
                survivalTimeElement.innerText = `${mins}:${secs}`;

                let progressPct = Math.min(100, (survivalTime / TARGET_SURVIVAL_TIME) * 100);
                progressBar.style.width = `${progressPct}%`;

                if (survivalTime >= TARGET_SURVIVAL_TIME) {
                    handleVictory();
                }
            }
            if (survivalTime > 0 && survivalTime % 30 === 0 && frame % 60 === 0 && gameSpeed < 18) {
                gameSpeed += 0.6;
            }
        }

        animationId = requestAnimationFrame(animate);
    }

    function updateCoinDisplays() {
        menuTotalCoinsElement.innerText = totalCoins;
        shopTotalCoinsElement.innerText = totalCoins;
    }

    function openShop() {
        startScreen.classList.add('hidden');
        shopScreen.classList.remove('hidden');
        renderShopItems();
    }

    function renderShopItems() {
        shopItemsContainer.innerHTML = '';
        
        for (const [key, skin] of Object.entries(SKINS_DB)) {
            const isOwned = ownedSkins.includes(key);
            const isEquipped = currentSkin === key;
            
            const div = document.createElement('div');
            div.className = `shop-item ${isEquipped ? 'equipped' : ''}`;
            
            let buttonHTML = '';
            if (isEquipped) {
                buttonHTML = `<button disabled class="w-full mt-1.5 py-1 text-xs bg-gray-600">장착 중</button>`;
            } else if (isOwned) {
                buttonHTML = `<button onclick="equipSkin('${key}')" class="w-full mt-1.5 py-1 text-xs" style="background: #3b82f6;">장착하기</button>`;
            } else {
                if (key === 'charizard') {
                    buttonHTML = `<button disabled class="w-full mt-1.5 py-1 text-xs bg-orange-900 text-orange-200">2분 생존 업적 필요</button>`;
                } else if (key === 'buddha') {
                    buttonHTML = `<button disabled class="w-full mt-1.5 py-1 text-xs bg-red-900 text-red-200">5분 클리어 필요</button>`;
                } else {
                    const canAfford = totalCoins >= skin.cost;
                    buttonHTML = `<button onclick="buySkin('${key}')" ${!canAfford ? 'disabled' : ''} class="w-full mt-1.5 py-1 text-xs ${canAfford ? 'bg-yellow-500 hover:bg-yellow-400 font-bold' : ''}" style="color: ${canAfford ? 'black' : 'white'}">${skin.cost} 🪙 구매</button>`;
                }
            }

            div.innerHTML = `
                <div class="w-10 h-10 mx-auto mb-1 rounded-full flex items-center justify-center text-lg border-2" style="background: ${skin.color}; border-color: ${isEquipped ? '#f59e0b' : '#334155'};">
                    ${key === 'default' ? '🐱' : key === 'spiderman' ? '🕸️' : key === 'genji' ? '⚔️' : key === 'turtle' ? '🐢' : key === 'shadow' ? '🥷' : key === 'samurai' ? '🐯' : key === 'charizard' ? '🐉' : '🗿'}
                </div>
                <h3 class="text-white font-bold text-xs">${skin.name}</h3>
                <p class="text-[10px] text-gray-400 mt-0.5">${skin.desc}</p>
                ${buttonHTML}
            `;
            shopItemsContainer.appendChild(div);
        }
    }

    window.buySkin = function(skinId) {
        const skin = SKINS_DB[skinId];
        if (totalCoins >= skin.cost && !ownedSkins.includes(skinId)) {
            totalCoins -= skin.cost;
            ownedSkins.push(skinId);
            localStorage.setItem('ninjaCatTotalCoins', totalCoins);
            localStorage.setItem('ninjaCatOwnedSkins', JSON.stringify(ownedSkins));
            updateCoinDisplays();
            equipSkin(skinId);
        }
    };

    window.equipSkin = function(skinId) {
        if (ownedSkins.includes(skinId)) {
            currentSkin = skinId;
            localStorage.setItem('ninjaCatCurrentSkin', currentSkin);
            renderShopItems();
        }
    };

    function handleInputStart(e) {
        if (e.type === 'touchstart') e.preventDefault();
        if (!startScreen.classList.contains('hidden') || !shopScreen.classList.contains('hidden') || !tutorialScreen.classList.contains('hidden')) return;

        if (currentSkin === 'charizard') {
            // 리자몽 비행 상승 힘
            if (player) player.velocityY = -7;
            return;
        }

        if (player && player.isGrounded) {
            let jumpMul = (currentSkin === 'spiderman' || currentSkin === 'samurai' || currentSkin === 'buddha') ? 1.4 : 1.0;
            player.velocityY = -11 * jumpMul;
            player.isGrounded = false;
        } else if (player && !player.isSwinging) {
            player.fireWire();
        }
    }

    function handleInputEnd(e) {
        if (e.type === 'touchend') e.preventDefault();
        if (player && currentSkin !== 'charizard') player.releaseWire();
    }

    window.addEventListener('mousedown', handleInputStart);
    window.addEventListener('touchstart', handleInputStart, { passive: false });
    window.addEventListener('mouseup', handleInputEnd);
    window.addEventListener('touchend', handleInputEnd);

    startBtn.addEventListener('click', initGame);
    
    shopBtn.addEventListener('click', openShop);
    closeShopBtn.addEventListener('click', () => {
        shopScreen.classList.add('hidden');
        startScreen.classList.remove('hidden');
    });

    howtoBtn.addEventListener('click', () => {
        startScreen.classList.add('hidden');
        tutorialScreen.classList.remove('hidden');
    });

    closeTutorialBtn.addEventListener('click', () => {
        tutorialScreen.classList.add('hidden');
        startScreen.classList.remove('hidden');
    });

    updateCoinDisplays();
    for(let i=0; i<6; i++) clouds.push(new Cloud(Math.random()*GAME_WIDTH, 20+Math.random()*200, 30+Math.random()*40, 0.1+Math.random()*0.2));
    for(let i=0; i<3; i++) lanterns.push(new Lantern(150 + i * 250, 40 + Math.random() * 80));
    for(let i=0; i<15; i++) fireflies.push(new Firefly());
    
    ctx.fillStyle = '#0b0f19'; 
    ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
    drawRealisticStoneStatue();

</script>
</body>
</html>
