<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공룡 키우기</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Malgun Gothic', sans-serif;
        }

        body {
            background-color: #f7f3e9;
            color: #4a403a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            transition: background-color 1s ease;
        }

        body.night {
            background-color: #2c3e50;
            color: #ecf0f1;
        }

        .game-container {
            width: 440px;
            background: #ffffff;
            border: 4px solid #4a403a;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.1);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background 1s ease, border-color 1s ease;
        }

        body.night .game-container {
            background: #34495e;
            border-color: #ecf0f1;
        }

        #select-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(247, 243, 233, 0.96);
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        body.night #select-screen {
            background: rgba(44, 62, 80, 0.96);
        }

        .select-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .dino-options {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .dino-card {
            border: 3px solid #4a403a;
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            background: #fff;
            transition: transform 0.2s, background 0.2s;
            width: 130px;
        }

        .dino-card:hover {
            transform: translateY(-5px);
            background: #fff9e6;
        }

        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 16px;
            font-weight: bold;
        }

        .status-badge {
            background: #ffeaa7;
            padding: 4px 10px;
            border-radius: 8px;
            border: 2px solid #4a403a;
            font-size: 14px;
        }

        body.night .status-badge {
            background: #f1c40f;
            color: #2c3e50;
            border-color: #ecf0f1;
        }

        .exp-container {
            width: 100%;
            background: #dfe6e9;
            border: 2px solid #4a403a;
            border-radius: 8px;
            height: 14px;
            margin-bottom: 12px;
            overflow: hidden;
            position: relative;
        }

        .exp-bar {
            height: 100%;
            background: #00b894;
            width: 0%;
            transition: width 0.3s ease;
        }

        .exp-text {
            position: absolute;
            width: 100%;
            text-align: center;
            font-size: 10px;
            top: -1px;
            font-weight: bold;
            color: #2d3436;
        }

        .stats-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
        }

        .stat-row {
            display: flex;
            align-items: center;
            font-size: 13px;
            font-weight: bold;
        }

        .stat-label {
            width: 60px;
        }

        .stat-bar-bg {
            flex-grow: 1;
            background: #dfe6e9;
            border: 2px solid #4a403a;
            border-radius: 6px;
            height: 12px;
            overflow: hidden;
            margin-left: 5px;
        }

        .stat-bar {
            height: 100%;
            width: 70%;
            transition: width 0.3s ease, background-color 0.3s ease;
        }

        .stage-area {
            width: 100%;
            height: 190px;
            background: #dfe6e9;
            border: 3px solid #4a403a;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 12px;
            overflow: hidden;
        }

        body.night .stage-area {
            background: #2c3e50;
            border-color: #ecf0f1;
        }

        .time-indicator {
            position: absolute;
            top: 8px;
            right: 10px;
            font-size: 18px;
        }

        .speech-bubble {
            position: absolute;
            top: 12px;
            background: #fff;
            border: 2px solid #4a403a;
            border-radius: 10px;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: bold;
            box-shadow: 0 4px 0 rgba(0,0,0,0.05);
            max-width: 80%;
            text-align: center;
            z-index: 2;
            color: #4a403a;
        }

        #dino-avatar {
            font-size: 70px;
            animation: bounce 1.2s infinite ease-in-out;
            transition: filter 0.3s, transform 0.3s;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* 반짝임 애니메이션 효과 */
        @keyframes sparkle {
            0% { filter: drop-shadow(0 0 2px #fff) brightness(1); transform: scale(1); }
            50% { filter: drop-shadow(0 0 15px #ffeaa7) brightness(1.3); transform: scale(1.15) rotate(5deg); }
            100% { filter: drop-shadow(0 0 2px #fff) brightness(1); transform: scale(1); }
        }

        .sparkle-effect {
            animation: sparkle 0.8s ease-in-out 3 !important;
        }

        .sick-effect {
            filter: hue-rotate(90deg) saturate(50%);
        }

        .action-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            width: 100%;
            margin-bottom: 8px;
        }

        .btn {
            background: #ffeaa7;
            border: 2px solid #4a403a;
            border-radius: 8px;
            padding: 8px 0;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #4a403a;
            transition: transform 0.1s, box-shadow 0.1s, background 0.2s;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #4a403a;
        }

        .btn-danger {
            background: #ff7675;
            color: white;
        }

        .btn-primary {
            background: #74b9ff;
        }

        .btn-success {
            background: #55efc4;
        }

        .sub-menu {
            display: flex;
            justify-content: space-between;
            width: 100%;
            gap: 6px;
        }

        .sub-menu .btn {
            flex: 1;
            background: #fab1a0;
        }

        .modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 20;
            border-radius: 12px;
        }

        .modal-content {
            background: #fff;
            border: 3px solid #4a403a;
            border-radius: 12px;
            padding: 20px;
            width: 85%;
            text-align: center;
            box-shadow: 0 6px 0 rgba(0,0,0,0.15);
        }

        body.night .modal-content {
            background: #34495e;
            border-color: #ecf0f1;
        }

        .modal-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .modal-btns {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 12px;
        }

        .close-modal {
            background: #ff7675;
            color: white;
        }
    </style>
</head>
<body>

<div class="game-container">
    <!-- 공룡 선택 화면 -->
    <div id="select-screen">
        <div class="select-title">키울 공룡을 골라주세요!</div>
        <div class="dino-options">
            <div class="dino-card" onclick="startGame('carnivore')">
                <div style="font-size:32px;">🦖</div>
                <div style="font-weight:bold; margin-top:5px;">육식공룡</div>
                <div style="font-size:11px; color:#666;">고기를 좋아함</div>
            </div>
            <div class="dino-card" onclick="startGame('herbivore')">
                <div style="font-size:32px;">🦕</div>
                <div style="font-weight:bold; margin-top:5px;">초식공룡</div>
                <div style="font-size:11px; color:#666;">풀을 좋아함</div>
            </div>
        </div>
    </div>

    <!-- 상단바 -->
    <div class="header">
        <div id="level-display">Lv.1 알</div>
        <div class="status-badge">🪙 <span id="coin-count">50</span>원</div>
    </div>

    <!-- 경험치바 -->
    <div class="exp-container">
        <div class="exp-bar" id="exp-bar"></div>
        <div class="exp-text"><span id="exp-val">0</span> / 100</div>
    </div>

    <!-- 스탯 게이지 -->
    <div class="stats-container">
        <div class="stat-row">
            <span class="stat-label">포만감</span>
            <div class="stat-bar-bg"><div class="stat-bar" id="hunger-bar"></div></div>
        </div>
        <div class="stat-row">
            <span class="stat-label">청결</span>
            <div class="stat-bar-bg"><div class="stat-bar" id="clean-bar"></div></div>
        </div>
        <div class="stat-row">
            <span class="stat-label">에너지</span>
            <div class="stat-bar-bg"><div class="stat-bar" id="energy-bar"></div></div>
        </div>
    </div>

    <!-- 스테이지 영역 -->
    <div class="stage-area" id="stage-box">
        <div class="time-indicator" id="time-icon">🌞</div>
        <div class="speech-bubble" id="speech-bubble">안녕! 반가워!</div>
        <div id="dino-avatar">🥚</div>
    </div>

    <!-- 상호작용 버튼 (4개) -->
    <div class="action-grid">
        <button class="btn btn-success" onclick="feedDino()">밥 주기</button>
        <button class="btn btn-primary" onclick="playDino()">놀아주기</button>
        <button class="btn" style="background:#81ecec;" onclick="washDino()">씻기기</button>
        <button class="btn" style="background:#a29bfe;" onclick="restDino()">쉬기</button>
    </div>

    <!-- 하단 서브 메뉴 -->
    <div class="sub-menu">
        <button class="btn" onclick="openShop()">상점</button>
        <button class="btn" onclick="openMiniGame()">미니게임</button>
        <button class="btn btn-danger" id="cure-btn" style="display:none;" onclick="cureDino()">치료하기</button>
    </div>

    <!-- 상점 모달 -->
    <div class="modal" id="shop-modal">
        <div class="modal-content">
            <div class="modal-title">상점</div>
            <div id="shop-item-desc" style="font-size:13px; margin-bottom:12px;">아이템을 구매하세요!</div>
            <div style="display:flex; flex-direction:column; gap:6px;">
                <button class="btn" style="background:#55efc4;" onclick="buyItem('food')">간식 (포만감+40) - 20원</button>
                <button class="btn" style="background:#74b9ff;" onclick="buyItem('toy')">장난감 (행복+50) - 30원</button>
            </div>
            <div class="modal-btns">
                <button class="btn close-modal" onclick="closeModal('shop-modal')">닫기</button>
            </div>
        </div>
    </div>

    <!-- 미니게임 모달 -->
    <div class="modal" id="game-modal">
        <div class="modal-content">
            <div class="modal-title">가위바위보 대결!</div>
            <div id="game-result-text" style="font-size:13px; margin-bottom:12px;">무엇을 내겠습니까?</div>
            <div class="modal-btns">
                <button class="btn" onclick="playRPS('가위')">✌️ 가위</button>
                <button class="btn" onclick="playRPS('바위')">✊ 바위</button>
                <button class="btn" onclick="playRPS('보')">🖐️ 보</button>
            </div>
            <div class="modal-btns">
                <button class="btn close-modal" onclick="closeModal('game-modal')">나가기</button>
            </div>
        </div>
    </div>
</div>

<script>
    let petType = 'carnivore';
    let level = 1;
    let exp = 0;
    let coins = 50;
    
    let hunger = 70;
    let clean = 70;
    let energy = 70;
    let happiness = 70;

    let isSick = false;
    let isNight = false;
    let gameTimer = null;
    let timeTimer = null;

    const avatars = {
        carnivore: ['🥚', '🦖', '🦖', '🐉'],
        herbivore: ['🥚', '🦕', '🦕', '🐲']
    };

    const stageNames = ['알', '아기', '청소년', '어른'];

    function startGame(type) {
        petType = type;
        document.getElementById('select-screen').style.display = 'none';
        updateUI();
        showSpeech("안녕! 무럭무럭 키워줘!");
        
        gameTimer = setInterval(gameLoop, 3000);
        timeTimer = setInterval(toggleTime, 30000);
    }

    function gameLoop() {
        if (isSick) return;

        let decreaseRate = isNight ? 7 : 4;
        hunger = Math.max(0, hunger - decreaseRate);
        clean = Math.max(0, clean - decreaseRate);
        energy = Math.max(0, energy - (isNight ? 9 : 4));

        if (hunger === 0 || clean === 0 || energy === 0) {
            setSick(true);
        }

        updateUI();
    }

    function toggleTime() {
        isNight = !isNight;
        const body = document.body;
        const timeIcon = document.getElementById('time-icon');
        
        if (isNight) {
            body.classList.add('night');
            timeIcon.innerText = '🌙';
            showSpeech("밤이 되었어요. 에너지가 빨리 닳아요!");
        } else {
            body.classList.remove('night');
            timeIcon.innerText = '🌞';
            showSpeech("상쾌한 아침이에요!");
        }
    }

    function setSick(sickState) {
        isSick = sickState;
        const cureBtn = document.getElementById('cure-btn');
        const avatar = document.getElementById('dino-avatar');
        
        if (isSick) {
            cureBtn.style.display = 'block';
            avatar.classList.add('sick-effect');
            showSpeech("아프고 괴로워요... 🤒 치료해주세요!");
        } else {
            cureBtn.style.display = 'none';
            avatar.classList.remove('sick-effect');
            showSpeech("다시 건강해졌어요! 😊");
        }
    }

    function cureDino() {
        hunger = 50;
        clean = 50;
        energy = 50;
        setSick(false);
        updateUI();
    }

    function addExp(amount) {
        if (isSick) return;
        exp += amount;
        coins += 5;

        if (exp >= 100) {
            exp -= 100;
            levelUp();
        }
        updateUI();
    }

    function levelUp() {
        if (level < 4) {
            level++;
            triggerSparkle();
            showSpeech(`꼬마공룡(이)가 진화했다! ✨반짝반짝✨`);
        } else {
            showSpeech("최종 형태에 도달했어요! 멋진 공룡이에요!");
        }
    }

    function triggerSparkle() {
        const avatar = document.getElementById('dino-avatar');
        avatar.classList.add('sparkle-effect');
        setTimeout(() => {
            avatar.classList.remove('sparkle-effect');
        }, 2400);
    }

    function feedDino() {
        if (isSick) return;
        hunger = Math.min(100, hunger + 25);
        happiness = Math.min(100, happiness + (energy > 0 ? 5 : 0));
        let foodName = petType === 'carnivore' ? '고기 🥩' : '잎사귀 🍃';
        showSpeech(`냠냠! 맛있는 ${foodName}을(를) 먹었어요.`);
        addExp(10);
    }

    function playDino() {
        if (isSick) return;
        if (energy < 15 || hunger < 10) {
            showSpeech("너무 피곤하거나 배고파서 놀 수 없어요!");
            return;
        }
        happiness = Math.min(100, happiness + 25);
        hunger = Math.max(0, hunger - 10);
        energy = Math.max(0, energy - 15);
        clean = Math.max(0, clean - 10);
        showSpeech("신나게 뛰어놀았어요! ⚽");
        addExp(10);
    }

    function washDino() {
        if (isSick) return;
        clean = Math.min(100, clean + 35);
        happiness = Math.max(0, happiness - 5);
        showSpeech("깨끗하게 목욕했어요! 🧼 반짝반짝");
        addExp(10);
    }

    function restDino() {
        if (isSick) return;
        energy = Math.min(100, energy + 35);
        happiness = Math.min(100, happiness + 10);
        showSpeech("편안하게 휴식을 취했어요! 💤");
        addExp(10);
    }

    function showSpeech(msg) {
        const bubble = document.getElementById('speech-bubble');
        bubble.innerText = msg;
    }

    function updateUI() {
        document.getElementById('coin-count').innerText = coins;
        document.getElementById('level-display').innerText = `Lv.${level} ${stageNames[level-1]}`;

        document.getElementById('exp-bar').style.width = `${exp}%`;
        document.getElementById('exp-val').innerText = exp;

        updateBar('hunger-bar', hunger);
        updateBar('clean-bar', clean);
        updateBar('energy-bar', energy);

        document.getElementById('dino-avatar').innerText = avatars[petType][level - 1];

        // 상태에 따른 스테이지 테두리 색상 변화 (좋음 파랑, 보통 초록, 나쁨 빨강)
        let avgStat = (hunger + clean + energy) / 3;
        const stageBox = document.getElementById('stage-box');
        if (isSick || avgStat < 30) {
            stageBox.style.borderColor = '#ff7675'; // 빨강
        } else if (avgStat > 70) {
            stageBox.style.borderColor = '#74b9ff'; // 파랑
        } else {
            stageBox.style.borderColor = '#00b894'; // 초록
        }
    }

    function updateBar(barId, value) {
        const bar = document.getElementById(barId);
        bar.style.width = `${value}%`;
        if (value > 50) {
            bar.style.backgroundColor = '#00b894';
        } else if (value > 20) {
            bar.style.backgroundColor = '#fdcb6e';
        } else {
            bar.style.backgroundColor = '#ff7675';
        }
    }

    function openShop() {
        let itemHint = petType === 'carnivore' ? '신선한 고기 간식' : '싱그러운 풀 간식';
        document.getElementById('shop-item-desc').innerText = `추천 메뉴: ${itemHint}`;
        document.getElementById('shop-modal').style.display = 'flex';
    }

    function openMiniGame() {
        document.getElementById('game-modal').style.display = 'flex';
        document.getElementById('game-result-text').innerText = "가위, 바위, 보 중 하나를 골라주세요!";
    }

    function closeModal(modalId) {
        document.getElementById(modalId).style.display = 'none';
    }

    function buyItem(itemType) {
        if (itemType === 'food') {
            if (coins >= 20) {
                coins -= 20;
                hunger = Math.min(100, hunger + 40);
                showSpeech("간식을 맛있게 먹었어요! (+포만감)");
                closeModal('shop-modal');
            } else {
                showSpeech("코인이 부족해요! 🪙");
            }
        } else if (itemType === 'toy') {
            if (coins >= 30) {
                coins -= 30;
                happiness = Math.min(100, happiness + 50);
                showSpeech("새 장난감으로 신나게 놀았어요! 🧸");
                closeModal('shop-modal');
            } else {
                showSpeech("코인이 부족해요! 🪙");
            }
        }
        updateUI();
    }

    function playRPS(playerChoice) {
        const choices = ['가위', '바위', '보'];
        const dinoChoice = choices[Math.floor(Math.random() * 3)];
        let resultMsg = `공룡: ${dinoChoice} VS 나: ${playerChoice} - `;

        if (playerChoice === dinoChoice) {
            resultMsg += "비겼어요! (행복 +5)";
            happiness = Math.min(100, happiness + 5);
        } else if (
            (playerChoice === '가위' && dinoChoice === '보') ||
            (playerChoice === '바위' && dinoChoice === '가위') ||
            (playerChoice === '보' && dinoChoice === '바위')
        ) {
            resultMsg += "이겼어요! 🎉 (행복 +15, 코인 +10)";
            happiness = Math.min(100, happiness + 15);
            coins += 10;
        } else {
            resultMsg += "졌어요... 💧 (행복 +5)";
            happiness = Math.min(100, happiness + 5);
        }

        document.getElementById('game-result-text').innerText = resultMsg;
        updateUI();
    }
</script>

</body>
</html>
