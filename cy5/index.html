<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🍦 아이스크림 캐치</title>
<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #020510;
    color: #fff;
    font-family: "Courier New", "Malgun Gothic", monospace;
    overflow-x: hidden;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background:
        radial-gradient(circle at 50% 20%, #17245a 0%, #070d27 35%, #020510 75%);
}

button {
    font: inherit;
    color: white;
    cursor: pointer;
    border: 0;
}

#app {
    width: 100%;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 18px;
}

.screen {
    width: 100%;
    max-width: 900px;
    animation: fadeIn .35s ease;
}

.hidden {
    display: none !important;
}

.pixel-panel {
    background: #0a1230;
    border: 4px solid #5263b9;
    box-shadow:
        0 0 0 4px #111a43,
        0 10px 0 #020512,
        0 0 28px rgba(84, 104, 255, .25);
    border-radius: 12px;
}

h1, h2, h3, p {
    margin-top: 0;
}

.pixel-title {
    text-align: center;
    color: #fff;
    text-shadow:
        3px 3px 0 #3a247e,
        0 0 14px #8b7cff;
    letter-spacing: 1px;
}

.subtitle {
    text-align: center;
    color: #aab8ed;
}

/* INTRO */
#intro {
    max-width: 850px;
}

.intro-title {
    text-align: center;
    font-size: clamp(24px, 6vw, 42px);
    margin-bottom: 20px;
    color: #fff4d6;
    text-shadow: 4px 4px 0 #522a88;
}

.comic {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 10px;
    background: #161e43;
    border: 5px solid #e9d26b;
    box-shadow: 0 0 0 5px #46376b, 0 12px 0 #020510;
    border-radius: 8px;
}

.comic-panel {
    position: relative;
    aspect-ratio: 1 / 1;
    min-height: 220px;
    overflow: hidden;
    background: #17255a;
    border: 4px solid #0a0e25;
    box-shadow: inset 0 0 0 3px rgba(255,255,255,.08);
}

.comic-label {
    position: absolute;
    left: 8px;
    top: 8px;
    z-index: 5;
    background: #fff5bc;
    color: #111633;
    padding: 4px 7px;
    font-weight: bold;
    font-size: 12px;
    box-shadow: 3px 3px 0 #191c43;
}

.comic-caption {
    position: absolute;
    left: 10px;
    right: 10px;
    bottom: 10px;
    z-index: 6;
    padding: 7px;
    background: rgba(5, 8, 25, .85);
    border: 2px solid #fff;
    color: #fff;
    text-align: center;
    font-size: 12px;
}

.comic-canvas {
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
}

.start-area {
    text-align: center;
    margin-top: 22px;
}

.main-button {
    position: relative;
    min-width: 240px;
    padding: 15px 26px;
    background: #7654ff;
    border: 4px solid #b9b0ff;
    box-shadow: 0 6px 0 #38278d, 0 0 20px rgba(124, 94, 255, .35);
    border-radius: 8px;
    font-weight: bold;
    font-size: 17px;
    transition: transform .12s, filter .12s, box-shadow .12s;
}

.main-button:hover {
    transform: scale(1.05);
    filter: brightness(1.15);
    border-color: #ffe86b;
    box-shadow: 0 6px 0 #38278d, 0 0 25px rgba(255, 224, 86, .4);
}

.main-button:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #38278d;
}

/* GAME */
#gameScreen {
    max-width: 600px;
    position: relative;
}

.game-shell {
    position: relative;
    padding: 10px;
}

.game-header {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr auto;
    gap: 7px;
    margin-bottom: 9px;
}

.stat-box {
    background: #0d1738;
    border: 3px solid #4659a7;
    border-radius: 7px;
    padding: 7px 5px;
    text-align: center;
    min-width: 0;
}

.stat-label {
    color: #7887c8;
    font-size: 10px;
    margin-bottom: 2px;
}

.stat-value {
    color: #fff;
    font-weight: bold;
    font-size: 16px;
    white-space: nowrap;
}

#wardrobeButton,
#upgradeButton {
    width: 48px;
    min-width: 48px;
    height: 48px;
    border-radius: 8px;
    font-size: 22px;
}

#wardrobeButton {
    background: #bc4edb;
    border: 3px solid #f4a9ff;
    box-shadow: 0 4px 0 #63257a;
}

#upgradeButton {
    background: #278c9f;
    border: 3px solid #7cf5ff;
    box-shadow: 0 4px 0 #12505d;
}

#wardrobeButton:active,
#upgradeButton:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #34234d;
}

.canvas-wrap {
    position: relative;
    width: min(480px, 100%);
    margin: auto;
}

#gameCanvas {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 480 / 560;
    background: #050a1c;
    border: 5px solid #5d6dc5;
    border-radius: 14px;
    box-shadow:
        0 0 0 4px #11193c,
        0 12px 0 #02040c,
        0 0 28px rgba(87, 109, 255, .25);
    image-rendering: pixelated;
}

.mobile-controls {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-top: 12px;
}

.move-button {
    width: 100px;
    height: 55px;
    border-radius: 9px;
    background: #17265b;
    border: 3px solid #6276d5;
    box-shadow: 0 5px 0 #090f2a;
    font-size: 24px;
    touch-action: none;
    user-select: none;
}

.move-button:active,
.move-button.active {
    background: #465ac3;
    transform: translateY(4px);
    box-shadow: 0 1px 0 #090f2a;
}

.warning {
    position: absolute;
    left: 50%;
    top: 25%;
    transform: translate(-50%, -50%);
    min-width: 220px;
    max-width: 90%;
    padding: 12px 16px;
    text-align: center;
    background: #48162b;
    border: 3px solid #ff6b7a;
    box-shadow: 0 0 25px rgba(255, 65, 90, .45);
    border-radius: 8px;
    z-index: 20;
    animation: warningPop .25s ease;
}

.warning.shield {
    background: #123b43;
    border-color: #6df4dc;
    box-shadow: 0 0 25px rgba(91, 255, 221, .45);
}

.screen-flash {
    position: absolute;
    inset: 0;
    pointer-events: none;
    border-radius: 14px;
    z-index: 15;
    animation: flash .35s ease;
}

.screen-flash.red {
    background: rgba(255, 30, 65, .18);
}

.screen-flash.green {
    background: rgba(50, 255, 170, .15);
}

/* RESULT */
.overlay-screen {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    background: rgba(1, 3, 12, .9);
    backdrop-filter: blur(5px);
}

.result-card {
    width: min(460px, 94vw);
    padding: 30px 22px;
    text-align: center;
    background: #0b1433;
    border: 5px solid #6979d7;
    border-radius: 12px;
    box-shadow: 0 0 0 5px #151c46, 0 20px 60px rgba(0,0,0,.6);
    animation: resultPop .4s cubic-bezier(.2,1.4,.4,1);
}

.result-icon {
    font-size: 54px;
    margin-bottom: 8px;
}

.result-title {
    font-size: 27px;
    color: #ffe96a;
    text-shadow: 3px 3px 0 #6b3f83;
}

.result-score {
    color: #cbd4ff;
    font-size: 18px;
    margin: 16px 0 24px;
}

.reward-card {
    background: #151f4b;
    border: 3px solid #e4c75d;
    padding: 18px;
    margin: 15px 0 22px;
    border-radius: 8px;
    box-shadow: 0 0 22px rgba(255, 215, 74, .2);
}

.reward-outfit {
    font-size: 20px;
    color: #fff0a3;
    margin: 8px 0;
}

/* WARDROBE */
.wardrobe-panel {
    width: min(650px, 95vw);
    max-height: 88vh;
    overflow-y: auto;
    padding: 20px;
    background: #0a1230;
    border: 5px solid #6979d7;
    border-radius: 12px;
    box-shadow: 0 0 0 5px #151c46, 0 20px 60px #000;
    animation: resultPop .3s ease;
}

.wardrobe-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 15px;
}

.close-button {
    width: 40px;
    height: 40px;
    background: #5d2c55;
    border: 3px solid #d06ebc;
    border-radius: 7px;
    font-size: 20px;
}

.outfit-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.outfit-item {
    min-height: 135px;
    padding: 8px;
    background: #101a3c;
    border: 3px solid #35457f;
    border-radius: 8px;
    text-align: center;
    cursor: pointer;
    transition: .15s;
}

.outfit-item:hover {
    border-color: #8f9fff;
    transform: translateY(-2px);
}

.outfit-item.selected {
    border-color: #ffe45d;
    box-shadow: 0 0 15px rgba(255, 222, 80, .3);
}

.outfit-item.locked {
    opacity: .5;
    cursor: default;
}

.outfit-preview {
    width: 80px;
    height: 80px;
    margin: 0 auto 5px;
}

.outfit-preview canvas {
    width: 80px;
    height: 80px;
    image-rendering: pixelated;
}

.outfit-name {
    font-size: 11px;
    color: #fff;
}

.outfit-unlock {
    color: #8d9bd9;
    font-size: 9px;
    margin-top: 3px;
}


/* UPGRADE */
.upgrade-panel {
    width: min(620px, 95vw);
    max-height: 88vh;
    overflow-y: auto;
    padding: 20px;
    background: #081a27;
    border: 5px solid #45d7e6;
    border-radius: 12px;
    box-shadow: 0 0 0 5px #123544, 0 20px 60px #000;
    animation: resultPop .3s ease;
}

.upgrade-summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin: 14px 0;
}

.upgrade-summary > div {
    padding: 10px 6px;
    background: #0e2a39;
    border: 2px solid #2f7181;
    border-radius: 8px;
    text-align: center;
}

.upgrade-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.upgrade-item {
    padding: 15px 10px;
    background: #0b2330;
    border: 3px solid #2d6877;
    border-radius: 10px;
    text-align: center;
}

.upgrade-item h3 {
    color: #a9fbff;
    margin-bottom: 8px;
}

.upgrade-level {
    color: #ffe66e;
    font-size: 17px;
    font-weight: bold;
    margin: 8px 0;
}

.upgrade-desc {
    min-height: 42px;
    color: #9bbbc5;
    font-size: 11px;
    line-height: 1.5;
}

.upgrade-buy {
    width: 100%;
    margin-top: 10px;
    padding: 10px 7px;
    background: #1d7181;
    border: 3px solid #75f3ff;
    border-radius: 8px;
    box-shadow: 0 4px 0 #0c3a43;
}

.upgrade-buy:disabled {
    opacity: .4;
    cursor: default;
    filter: grayscale(1);
}

.save-badge {
    margin-top: 12px;
    color: #74f6b1;
    font-size: 11px;
    text-align: center;
}

/* ANIMATIONS */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes resultPop {
    0% { opacity: 0; transform: scale(.8) translateY(15px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
}

@keyframes warningPop {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(.7); }
    100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}

@keyframes flash {
    0% { opacity: 0; }
    30% { opacity: 1; }
    100% { opacity: 0; }
}

@media (max-width: 600px) {
    #app {
        padding: 10px;
    }

    .comic {
        gap: 6px;
        padding: 6px;
    }

    .comic-panel {
        min-height: 0;
    }

    .game-header {
        grid-template-columns: repeat(3, 1fr) 48px 48px;
    }

    .stat-value {
        font-size: 13px;
    }

    .stat-label {
        font-size: 9px;
    }

    .outfit-grid,
    .upgrade-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .upgrade-summary {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>
<div id="app">

    <!-- 프롤로그 -->
    <section id="intro" class="screen">
        <h1 class="intro-title">🍦 아이스크림 캐치</h1>

        <div class="comic">
            <div class="comic-panel">
                <span class="comic-label">① 평화로운 오후</span>
                <canvas id="comicDance" class="comic-canvas" width="240" height="240"></canvas>
                <div class="comic-caption">룰루랄라~ 아이스크림이다!</div>
            </div>

            <div class="comic-panel">
                <span class="comic-label">② 한 입!</span>
                <canvas id="comicEat" class="comic-canvas" width="240" height="240"></canvas>
                <div class="comic-caption">🍦 냠! 너무 맛있어!</div>
            </div>

            <div class="comic-panel">
                <span class="comic-label">③ 헉?!</span>
                <canvas id="comicRain" class="comic-canvas" width="240" height="240"></canvas>
                <div class="comic-caption">하늘에서 아이스크림이?!</div>
            </div>

            <div class="comic-panel">
                <span class="comic-label">④ 출동!</span>
                <canvas id="comicRun" class="comic-canvas" width="240" height="240"></canvas>
                <div class="comic-caption">잡아먹자!!</div>
            </div>
        </div>

        <div class="start-area">
            <button id="startButton" class="main-button">🎮 게임 시작하기</button>
        </div>
    </section>

    <!-- 게임 -->
    <section id="gameScreen" class="screen hidden">
        <div class="game-shell">
            <div class="game-header">
                <div class="stat-box">
                    <div class="stat-label">LEVEL</div>
                    <div id="levelValue" class="stat-value">1</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">ICE CREAM</div>
                    <div id="scoreValue" class="stat-value">🍦 0 / 10</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">TIME</div>
                    <div id="timeValue" class="stat-value">16.0</div>
                </div>
                <button id="wardrobeButton" title="옷장">👗</button>
                <button id="upgradeButton" title="업그레이드">⚙️</button>
            </div>

            <div class="canvas-wrap" id="canvasWrap">
                <canvas id="gameCanvas" width="480" height="560"></canvas>
                <div id="warning" class="warning hidden"></div>
            </div>

            <div class="mobile-controls">
                <button class="move-button" id="leftButton">◀</button>
                <button class="move-button" id="rightButton">▶</button>
            </div>
        </div>
    </section>
</div>

<!-- 결과 오버레이 -->
<div id="resultOverlay" class="overlay-screen hidden">
    <div class="result-card">
        <div id="resultIcon" class="result-icon">🎉</div>
        <div id="resultTitle" class="result-title">LEVEL CLEAR!</div>
        <div id="resultScore" class="result-score">🍦 10개 먹기 성공!</div>
        <div id="rewardArea"></div>
        <button id="resultButton" class="main-button">계속하기</button>
    </div>
</div>

<!-- 옷장 -->
<div id="wardrobeOverlay" class="overlay-screen hidden">
    <div class="wardrobe-panel">
        <div class="wardrobe-header">
            <div>
                <h2 style="margin-bottom:4px;">👗 옷장</h2>
                <div style="color:#8997d4;font-size:12px;">해금한 의상을 선택하세요</div>
            </div>
            <button id="closeWardrobe" class="close-button">✕</button>
        </div>
        <div id="outfitGrid" class="outfit-grid"></div>
    </div>
</div>


<!-- 업그레이드 -->
<div id="upgradeOverlay" class="overlay-screen hidden">
    <div class="upgrade-panel">
        <div class="wardrobe-header">
            <div>
                <h2 style="margin-bottom:4px;">⚙️ 능력 업그레이드</h2>
                <div style="color:#83bdc9;font-size:12px;">
                    레벨을 클리어하면 업그레이드 포인트를 1개 얻습니다.
                </div>
            </div>
            <button id="closeUpgrade" class="close-button">✕</button>
        </div>

        <div class="upgrade-summary">
            <div>💾 저장 레벨<br><b id="savedLevelText">1</b></div>
            <div>⭐ 업그레이드 포인트<br><b id="upgradePointText">0</b></div>
            <div>🏆 최고 레벨<br><b id="highestLevelText">1</b></div>
        </div>

        <div id="upgradeGrid" class="upgrade-grid"></div>

        <div class="save-badge">
            ✓ 레벨과 업그레이드는 브라우저 localStorage에 자동 저장됩니다.
        </div>
    </div>
</div>

<script>
"use strict";

/* =========================================================
   기본 설정
========================================================= */

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const intro = document.getElementById("intro");
const gameScreen = document.getElementById("gameScreen");
const startButton = document.getElementById("startButton");

const levelValue = document.getElementById("levelValue");
const scoreValue = document.getElementById("scoreValue");
const timeValue = document.getElementById("timeValue");

const resultOverlay = document.getElementById("resultOverlay");
const resultIcon = document.getElementById("resultIcon");
const resultTitle = document.getElementById("resultTitle");
const resultScore = document.getElementById("resultScore");
const rewardArea = document.getElementById("rewardArea");
const resultButton = document.getElementById("resultButton");

const wardrobeButton = document.getElementById("wardrobeButton");
const wardrobeOverlay = document.getElementById("wardrobeOverlay");
const closeWardrobe = document.getElementById("closeWardrobe");
const outfitGrid = document.getElementById("outfitGrid");

const upgradeButton = document.getElementById("upgradeButton");
const upgradeOverlay = document.getElementById("upgradeOverlay");
const closeUpgrade = document.getElementById("closeUpgrade");
const upgradeGrid = document.getElementById("upgradeGrid");
const savedLevelText = document.getElementById("savedLevelText");
const upgradePointText = document.getElementById("upgradePointText");
const highestLevelText = document.getElementById("highestLevelText");

const warning = document.getElementById("warning");
const canvasWrap = document.getElementById("canvasWrap");

const leftButton = document.getElementById("leftButton");
const rightButton = document.getElementById("rightButton");

const WIDTH = 480;
const HEIGHT = 560;

const LEVEL_TIME = 16;
const TARGET_SCORE = 10;
const PLAYER_SPEED = 320;

/* =========================================================
   localStorage
========================================================= */

const SAVE_KEY = "iceCreamCatchSave_v1";

let saveData = {
    highestLevel: 1,
    currentLevel: 1,
    upgradePoints: 0,
    upgrades: {
        speed: 0,
        time: 0,
        shield: 0
    },
    unlockedOutfits: [0],
    selectedOutfit: 0,
    shields: 0
};

function loadSave() {
    try {
        const saved = localStorage.getItem(SAVE_KEY);

        if (saved) {
            const parsed = JSON.parse(saved);

            if (typeof parsed.highestLevel === "number") {
                saveData.highestLevel = Math.max(1, parsed.highestLevel);
            }

            if (typeof parsed.currentLevel === "number") {
                saveData.currentLevel = Math.max(1, parsed.currentLevel);
            }

            if (typeof parsed.upgradePoints === "number") {
                saveData.upgradePoints = Math.max(0, Math.floor(parsed.upgradePoints));
            }

            if (parsed.upgrades && typeof parsed.upgrades === "object") {
                saveData.upgrades.speed = Math.max(0, Math.floor(parsed.upgrades.speed || 0));
                saveData.upgrades.time = Math.max(0, Math.floor(parsed.upgrades.time || 0));
                saveData.upgrades.shield = Math.max(0, Math.floor(parsed.upgrades.shield || 0));
            }

            if (Array.isArray(parsed.unlockedOutfits)) {
                saveData.unlockedOutfits = parsed.unlockedOutfits;
            }

            if (typeof parsed.selectedOutfit === "number") {
                saveData.selectedOutfit = parsed.selectedOutfit;
            }

            if (typeof parsed.shields === "number") {
                saveData.shields = Math.min(3, Math.max(0, parsed.shields));
            }
        }
    } catch (e) {
        console.warn("저장 데이터 불러오기 실패", e);
    }

    if (!saveData.unlockedOutfits.includes(0)) {
        saveData.unlockedOutfits.unshift(0);
    }
}

function saveGame() {
    try {
        localStorage.setItem(SAVE_KEY, JSON.stringify(saveData));
    } catch (e) {
        console.warn("저장 실패", e);
    }
}

loadSave();

if (saveData.currentLevel > 1) {
    startButton.textContent = `🎮 LEVEL ${saveData.currentLevel} 이어하기`;
}

/* =========================================================
   의상 데이터
========================================================= */

const outfits = [
    {
        id: 0,
        name: "기본 체크 탱크톱",
        unlockLevel: 1,
        type: "check",
        body: "#fff",
        accent: "#d9d9e8"
    },
    {
        id: 1,
        name: "빨간 후드",
        unlockLevel: 10,
        type: "hood",
        body: "#ef4e55",
        accent: "#ff8c7c"
    },
    {

function getMaxShields() {
    return 3 + saveData.upgrades.shield;
}

function getLevelTime() {
    // 시간 업그레이드 1레벨마다 +1초, 최대 +10초
    return LEVEL_TIME + Math.min(10, saveData.upgrades.time);
}

function applyUpgrades() {
    // 속도 업그레이드 1레벨마다 기본 속도의 8% 증가
    player.speed =
        PLAYER_SPEED * (1 + saveData.upgrades.speed * 0.08);

    saveData.shields = Math.min(
        getMaxShields(),
        Math.max(0, saveData.shields)
    );
}

function getUpgradeCost(type) {
    // 1단계는 1포인트, 이후 단계부터 조금씩 비싸짐
    const lv = saveData.upgrades[type] || 0;
    return 1 + Math.floor(lv / 3);
}

function buyUpgrade(type) {
    const cost = getUpgradeCost(type);

    if (saveData.upgradePoints < cost) {
        showWarning("⭐ 업그레이드 포인트가 부족해요!", false);
        return;
    }

    saveData.upgradePoints -= cost;
    saveData.upgrades[type]++;

    if (type === "shield") {
        // 보호막 최대치 업그레이드 시 보호막도 1개 즉시 지급
        saveData.shields = Math.min(
            getMaxShields(),
            saveData.shields + 1
        );
    }

    applyUpgrades();
    saveGame();
    renderUpgrade();
    updateUI();
}

function renderUpgrade() {
    if (!upgradeGrid) return;

    savedLevelText.textContent = saveData.currentLevel;
    upgradePointText.textContent = saveData.upgradePoints;
    highestLevelText.textContent = saveData.highestLevel;

    const data = [
        {
            type: "speed",
            icon: "🏃",
            name: "이동 속도",
            desc: "레벨당 이동 속도 +8%",

            value: `${getLevelTime()}초`
        },

            type: "shield",

            value: `${saveData.shields} / ${getMaxShields()}`
        }
    ];

    upgradeGrid.innerHTML = "";

    for (const item of data) {
        const lv = saveData.upgrades[item.type];
        const cost = getUpgradeCost(item.type);

        const card = document.createElement("div");
        card.className = "upgrade-item";

        card.innerHTML = `
            <div style="font-size:34px;">${item.icon}</div>
            <h3>${item.name}</h3>
            <div class="upgrade-level">Lv.${lv}</div>
            <div class="upgrade-desc">${item.desc}</div>
            <div style="margin-top:7px;color:#fff;">현재: ${item.value}</div>
            <button class="upgrade-buy"
                    ${saveData.upgradePoints < cost ? "disabled" : ""}>
                ⭐ ${cost}P 사용
            </button>
        `;

        card.querySelector(".upgrade-buy")
            .addEventListener("click", () => buyUpgrade(item.type));

        upgradeGrid.appendChild(card);
    }
}

function bindHoldButton(button, direction) {
    const start = e => {
        e.preventDefault();
        keys[direction] = true;
        facing = direction === "left" ? -1 : 1;
        button.classList.add("active");
    };

    const end = e => {

        keys[direction] = false;
        button.classList.remove("active");
    };

    button.addEventListener("pointerdown", start);
    button.addEventListener("pointerup", end);

/* =========================================================
   레벨 시작
========================================================= */

function startLevel(newLevel) {
    level = newLevel;

    saveData.currentLevel = level;
    saveData.highestLevel = Math.max(saveData.highestLevel, level);
    applyUpgrades();
    saveGame();

    score = 0;
    timeRemaining = getLevelTime();

    iceCreams = [];
    cans = [];
    particles = [];

    iceCreamSpawnTimer = 0.25;
    canSpawnTimer = 5;

    penaltyTimer = 0;

    player.x = WIDTH / 2 - player.width / 2;
    player.y = HEIGHT - 40 - player.height;

    gameState = "playing";

    resultOverlay.classList.add("hidden");

    updateUI();
}

/* =========================================================
   게임 루프
========================================================= */

function gameLoop(currentTime) {
    const deltaTime =
        Math.min(
            (currentTime - lastTime) / 1000,
            0.05
        );

    lastTime = currentTime;

    if (gameState === "playing") {
        update(deltaTime);
        draw();
    } else if (gameState === "wardrobe" || gameState === "upgrade") {
        draw();
    } else if (gameState === "intro") {
        draw();
    }

    requestAnimationFrame(gameLoop);
}

/* =========================================================
   업데이트
========================================================= */

function update(deltaTime) {
    updatePlayer(deltaTime);
    updateIceCreams(deltaTime);
    updateCans(deltaTime);
    updateParticles(deltaTime);
    checkCollisions();

    penaltyTimer = Math.max(0, penaltyTimer - deltaTime);

    updateLevel(deltaTime);
    updateUI();
}

function updatePlayer(deltaTime) {
    let direction = 0;

    if (keys.left) direction -= 1;
    if (keys.right) direction += 1;

    if (direction !== 0) {
        facing = direction < 0 ? -1 : 1;
    }

    player.x += direction * player.speed * deltaTime;

    player.x = Math.max(
        0,
        Math.min(
            canvas.width - player.width,
            player.x
        )
    );
}

const iceCreamColors = [
    {
        main: "#fff4d6",
        shadow: "#d9c9a8",
        cherry: "#fff"
    },
    {
        main: "#ff8fba",
        shadow: "#df5f91",

    }
];

function getIceCreamSpawnInterval() {
    return Math.max(
        0.25,
        1.2 - (level - 1) * 0.2
    );
}

function spawnIceCream() {
    const size = 24 + Math.random() * 7;

    iceCreams.push({
        x: Math.random() * (WIDTH - size),
        y: -size - 5,
        width: size,
        height: size + 13,
        speed: 125 + Math.random() * 35 + Math.min(level * 4, 100),
        color: iceCreamColors[
            Math.floor(Math.random() * iceCreamColors.length)
        ],
        wobble: Math.random() * Math.PI * 2,
        rotation: (Math.random() - .5) * .08
    });
}

function updateIceCreams(deltaTime) {
    iceCreamSpawnTimer -= deltaTime;

    if (iceCreamSpawnTimer <= 0) {
        spawnIceCream();

        iceCreamSpawnTimer =
            getIceCreamSpawnInterval();
    }

    for (let i = iceCreams.length - 1; i >= 0; i--) {
        const item = iceCreams[i];

        item.y += item.speed * deltaTime;
        item.wobble += deltaTime * 4;

        if (item.y > HEIGHT + 30) {
            iceCreams.splice(i, 1);
        }
    }
}

/* =========================================================
   깡통
========================================================= */

function getCanSpawnInterval() {
    if (level <= 3) return 5;

    if (level <= 5) return 4.5;

    if (level <= 7) return 3.8;

    return Math.max(
        2.8,
        5 - (level - 1) * 0.18
    );
}

function getCanAmount() {
    if (level <= 3) return 1;
    if (level <= 5) return Math.random() < .4 ? 2 : 1;
    if (level <= 7) return 2;
    return Math.min(
        3,
        1 + Math.floor(level / 8)
    );
}

function spawnCan() {
    if (cans.length >= 6) return;

    const amount = Math.min(
        getCanAmount(),
        6 - cans.length
    );

    for (let i = 0; i < amount; i++) {
        const width = 20 + Math.random() * 5;
        const height = 31 + Math.random() * 6;

        cans.push({
            x: Math.random() * (WIDTH - width),
            y: -height - 10 - Math.random() * 50,
            width,
            height,
            speed: 115 + Math.random() * 30 + Math.min(level * 5, 120),
            wobble: Math.random() * Math.PI * 2,
            rotation: (Math.random() - .5) * .15
        });
    }
}

function updateCans(deltaTime) {
    canSpawnTimer -= deltaTime;

    if (canSpawnTimer <= 0) {
        spawnCan();
        canSpawnTimer = getCanSpawnInterval();
    }

    for (let i = cans.length - 1; i >= 0; i--) {
        const can = cans[i];

        can.y += can.speed * deltaTime;
        can.wobble += deltaTime * 3;

        if (can.y > HEIGHT + 40) {
            cans.splice(i, 1);
        }
    }
}

/* =========================================================
   충돌
========================================================= */

function isColliding(a, b) {
    const marginX = 5;
    const marginY = 5;

    return (
        a.x + marginX < b.x + b.width &&
        a.x + a.width - marginX > b.x &&
        a.y + marginY < b.y + b.height &&
        a.y + a.height - marginY > b.y
    );
}

function checkCollisions() {
    for (let i = iceCreams.length - 1; i >= 0; i--) {
        const item = iceCreams[i];

        if (isColliding(player, item)) {
            iceCreams.splice(i, 1);

            createBurst(
                item.x + item.width / 2,
                item.y + item.height / 2,
                item.color.main,
                8
            );

            if (penaltyTimer <= 0) {
                score++;
                createScoreFloat(
                    item.x + item.width / 2,
                    item.y,
                    "+1 🍦"
                );
            }
        }
    }

    for (let i = cans.length - 1; i >= 0; i--) {
        const can = cans[i];

        if (isColliding(player, can)) {
            cans.splice(i, 1);

            createBurst(
                can.x + can.width / 2,
                can.y + can.height / 2,
                "#d9e0ef",
                10
            );

            if (saveData.shields > 0) {
                saveData.shields--;
                saveGame();

                showWarning(
                    "🛡 보호막이 깡통을 막았어요!",
                    true
                );

                flashScreen("green");
            } else {
                penaltyTimer = 1;

                showWarning(
                    "🥫 캔 충돌!<br>아이스크림 점수 획득<br>1초 정지",
                    false
                );

                flashScreen("red");
            }
        }
    }
}

/* =========================================================
   레벨 시간
========================================================= */

function updateLevel(deltaTime) {
    timeRemaining -= deltaTime;

    if (timeRemaining <= 0) {
        timeRemaining = 0;
        finishLevel();
    }
}

function finishLevel() {
    if (gameState !== "playing") return;

    gameState = "result";

    keys.left = false;
    keys.right = false;

    if (score >= TARGET_SCORE) {
        levelClear();
    } else {
        levelFailed();
    }
}

function levelClear() {
    const rewardLevel = level % 10 === 0;

    // 현재 레벨 클리어 보상: 업그레이드 포인트 +1
    saveData.upgradePoints += 1;

    // 다음 실행 시 이어서 시작할 레벨
    saveData.currentLevel = level + 1;

    if (level + 1 > saveData.highestLevel) {
        saveData.highestLevel = level + 1;
    }

    saveGame();

    if (rewardLevel) {
        const outfitIndex = Math.min(
            Math.floor(level / 10),
            outfits.length - 1
        );

        const outfit = outfits[outfitIndex];

        unlockOutfit(outfit.id);

        if (saveData.shields < getMaxShields()) {
            saveData.shields++;
        }

        saveGame();

        resultIcon.textContent = "🎁";
        resultTitle.textContent = `🎉 LEVEL ${level} CLEAR!`;

                <div style="color:#9fffe8;margin-top:12px;">

/* =========================================================
   파티클
========================================================= */

function createBurst(x, y, color, amount) {
    for (let i = 0; i < amount; i++) {
        particles.push({
            type: "spark",
            x,
            y,
            vx: (Math.random() - .5) * 180,
            vy: (Math.random() - .5) * 180,
            life: .45 + Math.random() * .25,
            maxLife: .7,
            color,
            size: 2 + Math.random() * 4
        });
    }
}

function createScoreFloat(x, y, text) {
    particles.push({
        type: "text",
        x,
        y,
        vx: 0,
        vy: -35,
        life: .7,
        maxLife: .7,
        color: "#fff5a3",
        text
    });
}

function updateParticles(deltaTime) {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];

        p.life -= deltaTime;
        p.x += p.vx * deltaTime;
        p.y += p.vy * deltaTime;

        if (p.type === "text") {
            p.vy *= .96;
        } else {
            p.vy += 80 * deltaTime;
        }

        if (p.life <= 0) {
            particles.splice(i, 1);
        }
    }
}

function drawParticles() {
    for (const p of particles) {
        const alpha = Math.max(
            0,
            p.life / p.maxLife
        );

        ctx.save();
        ctx.globalAlpha = alpha;

        if (p.type === "text") {
            ctx.font = "bold 15px monospace";
            ctx.fillStyle = p.color;
            ctx.textAlign = "center";
            ctx.fillText(p.text, p.x, p.y);
        } else {
            ctx.fillStyle = p.color;
            ctx.fillRect(
                Math.floor(p.x),
                Math.floor(p.y),
                p.size,
                p.size
            );
        }

        ctx.restore();
    }
}

/* =========================================================
   배경
========================================================= */

function drawBackground() {
    ctx.fillStyle = "#050a1c";
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    /* 달빛 */
    ctx.fillStyle = "#152458";
    ctx.fillRect(25, 70, 55, 55);

    ctx.fillStyle = "#050a1c";
    ctx.fillRect(39, 62, 45, 45);

    /* 별 */
    const stars = [
        [40, 32], [110, 52], [177, 27],
        [250, 69], [330, 33], [416, 61],
        [450, 115], [75, 160], [370, 145],
        [210, 120], [290, 175], [135, 200]
    ];

    ctx.fillStyle = "#8398ff";

    for (const [x, y] of stars) {
        const pulse =
            Math.sin(performance.now() / 500 + x) > 0
                ? 2
                : 1;

        ctx.fillRect(x, y, pulse, pulse);
    }

    /* 구름 */
    drawCloud(100, 110, .8);
    drawCloud(330, 90, .65);

    /* 먼 도시 실루엣 */
    ctx.fillStyle = "#0c1534";

    for (let x = 0; x < WIDTH; x += 35) {
        const h = 35 + ((x * 17) % 55);

        ctx.fillRect(
            x,
            HEIGHT - 40 - h,
            30,
            h
        );

        ctx.fillStyle = "#17234c";

        for (let wy = HEIGHT - 34 - h; wy < HEIGHT - 45; wy += 12) {
            ctx.fillRect(x + 7, wy, 4, 4);
            ctx.fillRect(x + 19, wy, 4, 4);
        }

        ctx.fillStyle = "#0c1534";
    }

    /* 지면 */
    ctx.fillStyle = "#172145";
    ctx.fillRect(0, HEIGHT - 40, WIDTH, 40);

    ctx.fillStyle = "#2c3970";
    ctx.fillRect(0, HEIGHT - 40, WIDTH, 5);

    ctx.fillStyle = "#40508f";
    for (let x = 0; x < WIDTH; x += 24) {
        ctx.fillRect(x, HEIGHT - 32, 12, 4);
    }
}

function drawCloud(x, y, scale) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);

    ctx.fillStyle = "#25356b";
    ctx.fillRect(-25, 0, 80, 14);
    ctx.fillRect(-10, -10, 30, 18);
    ctx.fillRect(8, -17, 28, 25);

    ctx.restore();
}

/* =========================================================
   소프트 아이스크림 그리기
========================================================= */

function drawIceCream(item) {
    const x = Math.floor(item.x);
    const y = Math.floor(item.y);
    const w = item.width;
    const h = item.height;
    const c = item.color;

    ctx.save();

    const wobble =
        Math.sin(item.wobble) * 1.2;

    ctx.translate(x + w / 2 + wobble, y);

    /* 콘 */
    ctx.fillStyle = "#d99a52";

    ctx.beginPath();
    ctx.moveTo(-w * .32, h * .38);
    ctx.lineTo(w * .32, h * .38);
    ctx.lineTo(0, h);
    ctx.closePath();
    ctx.fill();

    /* 콘 픽셀 무늬 */
    ctx.fillStyle = "#9d6535";
    for (let yy = h * .52; yy < h - 3; yy += 5) {
        const offset = ((yy / 5) % 2) * 3;
        ctx.fillRect(-w * .22 + offset, yy, 3, 2);
        ctx.fillRect(w * .08 - offset, yy + 3, 3, 2);
    }

    /* 소프트 아이스크림 */
    ctx.fillStyle = c.shadow;

    ctx.fillRect(
        -w * .39,
        h * .27,
        w * .78,
        h * .13
    );

    ctx.fillStyle = c.main;

    ctx.beginPath();
    ctx.arc(0, h * .28, w * .34, Math.PI, 0);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(-w * .14, h * .22, w * .25, Math.PI, 0);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(w * .08, h * .15, w * .24, Math.PI, 0);
    ctx.fill();

    ctx.fillRect(
        -w * .08,
        h * .06,
        w * .25,
        h * .15
    );

    /* 꼭대기 */
    ctx.fillRect(
        -w * .03,
        h * .01,
        w * .08,
        h * .08
    );

    /* 하이라이트 */
    ctx.fillStyle = c.cherry;
    ctx.fillRect(
        -w * .17,
        h * .15,
        Math.max(2, w * .08),
        Math.max(2, h * .07)
    );

    ctx.restore();
}

/* =========================================================
   깡통 그리기
========================================================= */

function drawCan(can) {
    const x = Math.floor(can.x);
    const y = Math.floor(can.y);
    const w = can.width;
    const h = can.height;

    ctx.save();

    ctx.translate(
        x + w / 2,
        y + h / 2
    );

    ctx.rotate(
        Math.sin(can.wobble) * .05 + can.rotation
    );

    /* 캔 몸통 */
    ctx.fillStyle = "#aeb8c7";
    ctx.fillRect(
        -w / 2,
        -h / 2 + 3,
        w,
        h - 6
    );

    /* 어두운 측면 */
    ctx.fillStyle = "#6d7788";
    ctx.fillRect(
        -w / 2,
        -h / 2 + 4,
        4,
        h - 8
    );

    ctx.fillRect(
        w / 2 - 4,
        -h / 2 + 4,
        4,
        h - 8
    );

    /* 윗부분 */
    ctx.fillStyle = "#dce4ed";
    ctx.fillRect(
        -w / 2 + 1,
        -h / 2,
        w - 2,
        6
    );

    ctx.fillStyle = "#727b8b";
    ctx.fillRect(
        -w / 4,
        -h / 2 + 1,
        w / 2,
        3
    );

    /* 캔 라벨 */
    ctx.fillStyle = "#cf4557";
    ctx.fillRect(
        -w / 2 + 3,
        -h * .05,
        w - 6,
        9
    );

    ctx.fillStyle = "#fff1c8";
    ctx.fillRect(
        -2,
        -h * .05 + 2,
        4,
        5
    );

    /* 하이라이트 */
    ctx.fillStyle = "#f4f8ff";
    ctx.fillRect(
        -w / 2 + 4,
        -h / 2 + 9,
        3,
        10
    );

    ctx.restore();
}

    drawParticles();

        ctx.save();

        ctx.globalAlpha =
            .25 + Math.sin(performance.now() / 70) * .1;

            player.x - 5,

wardrobeButton.addEventListener("click", openWardrobe);
closeWardrobe.addEventListener("click", closeWardrobeWindow);

function openWardrobe() {
    if (gameState === "playing") {
        gameState = "wardrobe";
    }

    renderWardrobe();
    wardrobeOverlay.classList.remove("hidden");
}

function closeWardrobeWindow() {
    wardrobeOverlay.classList.add("hidden");

    if (gameState === "wardrobe") {
        gameState = "playing";
    }
}

function renderWardrobe() {
    outfitGrid.innerHTML = "";

    for (const outfit of outfits) {
        const unlocked =
            saveData.unlockedOutfits.includes(outfit.id);

        const selected =
            saveData.selectedOutfit === outfit.id;

        const item = document.createElement("div");

        item.className =
            "outfit-item" +
            (selected ? " selected" : "") +
            (!unlocked ? " locked" : "");

        const preview = document.createElement("div");
        preview.className = "outfit-preview";

        const previewCanvas =
            document.createElement("canvas");

        previewCanvas.width = 80;
        previewCanvas.height = 80;

        preview.appendChild(previewCanvas);

        const pctx = previewCanvas.getContext("2d");

        drawOutfitPreview(
            pctx,
            outfit
        );

        const name = document.createElement("div");
        name.className = "outfit-name";

        name.textContent =
            unlocked
                ? outfit.name
                : "🔒 " + outfit.name;

        const unlock = document.createElement("div");
        unlock.className = "outfit-unlock";

        unlock.textContent =
            unlocked
                ? (selected ? "✓ 현재 착용 중" : "선택 가능")
                : `🔒 LV.${outfit.unlockLevel}`;

        item.appendChild(preview);
        item.appendChild(name);
        item.appendChild(unlock);

        if (unlocked) {
            item.addEventListener("click", () => {
                saveData.selectedOutfit = outfit.id;
                saveGame();
                renderWardrobe();
            });
        }

        outfitGrid.appendChild(item);
    }
}

function drawOutfitPreview(pctx, outfit) {
    pctx.clearRect(0, 0, 80, 80);

    pctx.fillStyle = "#111936";
    pctx.fillRect(0, 0, 80, 80);

    pctx.save();

    pctx.translate(40, 43);

    pctx.scale(1.5, 1.5);

    /* 머리카락 */
    pctx.fillStyle = "#151622";
    pctx.fillRect(-17, -21, 34, 20);
    pctx.fillRect(-20, -15, 7, 23);
    pctx.fillRect(13, -15, 7, 23);

    /* 얼굴 */
    pctx.fillStyle = "#ffd2b3";
    pctx.fillRect(-13, -17, 26, 23);

    /* 앞머리 */
    pctx.fillStyle = "#11121c";
    pctx.fillRect(-14, -22, 28, 7);
    pctx.fillRect(-9, -26, 18, 7);

    /* 눈 */
    pctx.fillStyle = "#2c2740";
    pctx.fillRect(-8, -8, 4, 4);
    pctx.fillRect(4, -8, 4, 4);

    /* 의상 */
    switch (outfit.type) {
        case "check": drawCheckTank(outfit); break;
        case "hood": drawHood(outfit); break;
        case "wizard": drawWizard(outfit); break;
        case "armor": drawArmor(outfit); break;
        case "space": drawSpace(outfit); break;
        case "hero": drawHero(outfit); break;
        case "frog": drawFrog(outfit); break;
        case "demon": drawDemon(outfit); break;
        case "gold": drawGold(outfit); break;
        case "ninja": drawNinja(outfit); break;
        case "pirate": drawPirate(outfit); break;
        case "angel": drawAngel(outfit); break;
        case "cyber": drawCyber(outfit); break;
        case "fire": drawFire(outfit); break;
        case "ice": drawIce(outfit); break;
    }

    pctx.fillStyle = "#ffd2b3";
    pctx.fillRect(-23, 3, 5, 5);
    pctx.fillRect(18, 3, 5, 5);

    pctx.fillStyle = "#4c3850";
    pctx.fillRect(-11, 15, 8, 12);
    pctx.fillRect(3, 15, 8, 12);

    pctx.fillStyle = "#202536";
    pctx.fillRect(-14, 25, 11, 5);
    pctx.fillRect(3, 25, 11, 5);

    pctx.restore();
}

function setupComicCanvas(c) {

function drawComicBackground(cctx, color) {
    cctx.fillStyle = color;
    cctx.fillRect(0, 0, 240, 240);

    /* 픽셀 하늘 */
    cctx.fillStyle = "rgba(255,255,255,.07)";

    for (let x = 0; x < 240; x += 16) {
        cctx.fillRect(
            x,
            0,
            1,
            240
        );
    }

    for (let y = 0; y < 240; y += 16) {
        cctx.fillRect(
            0,
            y,
            240,
            1
        );

}

function drawMiniCharacter(cctx, x, y, scale, pose, outfitType = "check") {
    cctx.save();

    cctx.translate(x, y);
    cctx.scale(scale, scale);

    let lean = 0;

    if (pose === 0) lean = -2;
    if (pose === 1) lean = 2;
    if (pose === 2) lean = -1;
    if (pose === 3) lean = 5;

    cctx.translate(lean, 0);

    /* 뒷머리 */
    cctx.fillStyle = "#12131d";
    cctx.fillRect(-17, -21, 34, 20);
    cctx.fillRect(-20, -15, 7, 23);
    cctx.fillRect(13, -15, 7, 23);

    /* 얼굴 */
    cctx.fillStyle = "#ffd2b3";
    cctx.fillRect(-13, -17, 26, 23);

    /* 머리카락 */
    cctx.fillStyle = "#11121c";
    cctx.fillRect(-14, -22, 28, 7);
    cctx.fillRect(-9, -26, 18, 7);
    cctx.fillRect(-17, -18, 7, 9);
    cctx.fillRect(10, -19, 7, 10);

    /* 눈 */
    cctx.fillStyle = "#2c2740";
    cctx.fillRect(-8, -8, 4, 4);
    cctx.fillRect(4, -8, 4, 4);

    /* 몸 */
    cctx.fillStyle = "#fff";
    cctx.fillRect(-14, 5, 28, 14);

    cctx.fillStyle = "#d9d9e8";
    for (let xx = -14; xx < 14; xx += 7) {
        cctx.fillRect(xx, 5, 3, 14);
    }

    for (let yy = 5; yy < 19; yy += 7) {
        cctx.fillRect(-14, yy, 28, 3);
    }

    /* 춤추는 팔 */
    cctx.fillStyle = "#ffd2b3";

    if (pose === 0) {
        cctx.fillRect(-26, -4, 9, 5);
        cctx.fillRect(14, -15, 5, 13);
    } else if (pose === 1) {
        cctx.fillRect(17, -4, 9, 5);
        cctx.fillRect(-19, -15, 5, 13);
    } else if (pose === 2) {
        cctx.fillRect(-23, -11, 5, 13);
        cctx.fillRect(18, -10, 5, 13);
    } else {
        cctx.fillRect(-26, -12, 10, 5);
        cctx.fillRect(16, -12, 10, 5);
    }

    /* 다리 */
    cctx.fillStyle = "#4c3850";

    if (pose === 0) {
        cctx.fillRect(-11, 15, 8, 13);
        cctx.fillRect(4, 17, 8, 11);
    } else if (pose === 1) {
        cctx.fillRect(-11, 17, 8, 11);
        cctx.fillRect(4, 15, 8, 13);
    } else {
        cctx.fillRect(-11, 16, 8, 12);
        cctx.fillRect(3, 16, 8, 12);
    }

    /* 신발 */
    cctx.fillStyle = "#202536";
    cctx.fillRect(-14, 26, 11, 5);
    cctx.fillRect(3, 26, 11, 5);

    cctx.restore();
}

function drawMiniSoftIceCream(cctx, x, y, scale, colorIndex = 0) {
    const colors = iceCreamColors[colorIndex % iceCreamColors.length];

    cctx.save();
    cctx.translate(x, y);
    cctx.scale(scale, scale);

    cctx.fillStyle = "#d99a52";

    cctx.beginPath();
    cctx.moveTo(-8, 6);
    cctx.lineTo(8, 6);
    cctx.lineTo(0, 28);
    cctx.closePath();
    cctx.fill();

    cctx.fillStyle = colors.main;

    cctx.beginPath();
    cctx.arc(0, 6, 10, Math.PI, 0);
    cctx.fill();

    cctx.beginPath();
    cctx.arc(-4, 1, 7, Math.PI, 0);
    cctx.fill();

    cctx.beginPath();
    cctx.arc(4, -4, 7, Math.PI, 0);
    cctx.fill();

    cctx.fillRect(-3, -10, 7, 9);

    cctx.fillStyle = colors.cherry;
    cctx.fillRect(-5, 0, 3, 3);

    cctx.restore();
}

function drawDanceComic(c) {
    const cctx = setupComicCanvas(c);

    drawComicBackground(cctx, "#5a9ddd");

    /* 도시 */
    cctx.fillStyle = "#3d4c87";
    cctx.fillRect(0, 145, 240, 55);

    cctx.fillStyle = "#e7b34f";
    cctx.fillRect(12, 125, 38, 75);

    cctx.fillStyle = "#c85568";
    cctx.fillRect(67, 110, 43, 90);

    cctx.fillStyle = "#72b96d";
    cctx.fillRect(130, 130, 48, 70);

    cctx.fillStyle = "#dfdb78";

    for (let x = 18; x < 50; x += 14) {
        for (let y = 138; y < 192; y += 17) {
            cctx.fillRect(x, y, 6, 7);
        }
    }

    /* 도로 */
    cctx.fillStyle = "#2a2e50";
    cctx.fillRect(0, 200, 240, 40);

    cctx.fillStyle = "#d3bb62";

    for (let x = 0; x < 240; x += 38) {
        cctx.fillRect(x, 218, 20, 4);
    }

    const pose =
        Math.floor((performance.now() / 1000) % 3);

    const bounce =
        Math.sin(performance.now() / 180) * 2;

    drawMiniCharacter(
        cctx,
        120,
        166 + bounce,
        1.65,
        pose
    );

    /* 아이스크림 들기 */
    drawMiniSoftIceCream(
        cctx,
        154,
        135 + bounce,
        .8,
        0
    );

    /* 춤 효과 */
    cctx.fillStyle = "#fff4a3";
    cctx.fillRect(65, 88, 8, 4);
    cctx.fillRect(172, 92, 8, 4);
    cctx.fillRect(88, 70, 4, 8);
    cctx.fillRect(190, 120, 4, 8);
}

function drawEatComic(c) {
    const cctx = setupComicCanvas(c);

    drawComicBackground(cctx, "#d96c9e");

    /* 배경 하트 */
    const hearts = [
        [32, 55], [190, 58], [45, 150],
        [200, 135], [168, 105]
    ];

    cctx.fillStyle = "#ffbad9";

    for (const [x, y] of hearts) {
        cctx.fillRect(x, y, 6, 6);
        cctx.fillRect(x + 6, y + 5, 6, 6);
        cctx.fillRect(x - 6, y + 5, 6, 6);
        cctx.fillRect(x, y + 10, 6, 6);
    }

    /* 얼굴 클로즈업 */
    cctx.fillStyle = "#ffd2b3";
    cctx.fillRect(57, 65, 126, 120);

    /* 머리 */
    cctx.fillStyle = "#12131d";
    cctx.fillRect(50, 45, 140, 45);
    cctx.fillRect(45, 60, 20, 70);
    cctx.fillRect(175, 60, 20, 70);

    /* 눈 감기 */
    cctx.strokeStyle = "#2c2740";
    cctx.lineWidth = 5;

    cctx.beginPath();
    cctx.moveTo(82, 105);
    cctx.lineTo(96, 111);
    cctx.stroke();

    cctx.beginPath();
    cctx.moveTo(144, 111);
    cctx.lineTo(158, 105);
    cctx.stroke();

    /* 볼 */
    cctx.fillStyle = "#f18ba5";
    cctx.fillRect(70, 127, 18, 8);
    cctx.fillRect(153, 127, 18, 8);

    /* 행복한 입 */
    cctx.fillStyle = "#9c3f5c";
    cctx.fillRect(104, 138, 32, 15);
    cctx.fillStyle = "#fff";
    cctx.fillRect(108, 139, 24, 5);

    /* 아이스크림 */
    drawMiniSoftIceCream(
        cctx,
        126,
        66,
        1.7,
        1
    );

    /* 반짝임 */
    cctx.fillStyle = "#fff8b0";
    cctx.fillRect(28, 101, 8, 3);
    cctx.fillRect(202, 100, 8, 3);
    cctx.fillRect(28, 100, 3, 8);
    cctx.fillRect(202, 97, 3, 9);
}

function drawRainComic(c) {
    const cctx = setupComicCanvas(c);

    drawComicBackground(cctx, "#273d82");

    /* 구름 */
    cctx.fillStyle = "#17275a";
    cctx.fillRect(20, 35, 80, 20);
    cctx.fillRect(42, 22, 35, 30);

    cctx.fillRect(130, 45, 90, 22);
    cctx.fillRect(157, 27, 42, 30);

    /* 아이스크림 폭우 */
    for (let i = 0; i < 18; i++) {
        const x = 12 + ((i * 47) % 225);
        const y =
            75 +
            ((i * 31) % 100) +
            Math.sin(performance.now() / 500 + i) * 4;

        drawMiniSoftIceCream(
            cctx,
            x,
            y,
            .65 + (i % 3) * .1,
            i % 5
        );
    }

    /* 놀란 캐릭터 */
    drawMiniCharacter(
        cctx,
        116,
        174,
        1.45,
        3
    );

    /* 놀람 */
    cctx.fillStyle = "#fff";
    cctx.fillRect(105, 115, 7, 10);
    cctx.fillRect(125, 115, 7, 10);

    cctx.fillStyle = "#fff4a3";
    cctx.fillRect(195, 120, 10, 4);
    cctx.fillRect(200, 115, 4, 14);
}

function drawRunComic(c) {
    const cctx = setupComicCanvas(c);

    drawComicBackground(cctx, "#e98c58");

    /* 속도선 */
    cctx.fillStyle = "#fff1b0";

    for (let i = 0; i < 10; i++) {
        const y = 55 + i * 17;
        const len = 20 + (i % 3) * 20;

        cctx.fillRect(
            10,
            y,
            len,
            3
        );
    }

    /* 달리는 캐릭터 */
    const bounce =
        Math.sin(performance.now() / 90) * 2;

    drawMiniCharacter(
        cctx,
        128,
        165 + bounce,
        1.7,
        3
    );

    /* 벌어진 입 */
    cctx.fillStyle = "#8e3c55";
    cctx.fillRect(137, 148, 10, 8);

    /* 양팔 */
    cctx.fillStyle = "#ffd2b3";
    cctx.fillRect(105, 130, 30, 5);
    cctx.fillRect(150, 124, 28, 5);

    /* 달리는 아이스크림 */
    drawMiniSoftIceCream(
        cctx,
        178,
        122 + bounce,
        1.0,
        2
    );

    /* 잔상 */
    cctx.fillStyle = "rgba(255,255,255,.45)";
    cctx.fillRect(62, 180, 35, 5);
    cctx.fillRect(46, 190, 30, 4);
    cctx.fillRect(28, 200, 25, 4);

    /* GO! */
    cctx.fillStyle = "#fff4a3";
    cctx.font = "bold 24px monospace";
    cctx.fillText("GO!", 175, 210);
}

/* =========================================================
   프롤로그 애니메이션 시작
========================================================= */

drawTutorial();

/* =========================================================
   모바일 / 창 크기 대응
========================================================= */

window.addEventListener("resize", () => {
    /* CSS가 canvas를 자동 축소하므로 추가 처리 불필요 */
});

/* =========================================================
   페이지 가시성 처리
   브라우저 탭 전환 시 시간이 과도하게 흐르지 않도록
   다음 프레임에서 deltaTime을 제한한다.
========================================================= */

document.addEventListener("visibilitychange", () => {
    if (!document.hidden) {
        lastTime = performance.now();
    }
});

/* =========================================================
   초기 Canvas 설정
========================================================= */

ctx.imageSmoothingEnabled = false;

/* =========================================================
   옷장 바깥 클릭
========================================================= */

wardrobeOverlay.addEventListener("click", e => {
    if (e.target === wardrobeOverlay) {
        closeWardrobeWindow();
    }
});

upgradeOverlay.addEventListener("click", e => {
    if (e.target === upgradeOverlay) {
        closeUpgradeWindow();
    }
});

/* =========================================================
   터치 스크롤 방지
========================================================= */

document.addEventListener("touchmove", e => {
    if (
        e.target === leftButton ||
        e.target === rightButton
    ) {
        e.preventDefault();
    }
}, { passive: false });

/* =========================================================
   페이지 시작 시 저장된 의상 보장
========================================================= */

if (
    !saveData.unlockedOutfits.includes(
        saveData.selectedOutfit
    )
) {
    saveData.selectedOutfit = 0;
    saveGame();
}

/* =========================================================
   최고 레벨에 따른 과거 보상 복구
   저장 데이터가 오래된 경우에도 이미 도달한
   10레벨 보상을 사용할 수 있도록 한다.
========================================================= */

for (let i = 1; i < outfits.length; i++) {
    if (
        saveData.highestLevel >= outfits[i].unlockLevel
    ) {
        unlockOutfit(outfits[i].id);
    }
}

applyUpgrades();

saveData.shields = Math.min(
    getMaxShields(),
    Math.max(0, saveData.shields)
);

saveGame();
</script>
