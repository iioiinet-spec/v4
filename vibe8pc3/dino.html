<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>꼬마공룡 키우기</title>
<style>
  :root{
    --cream:#FFF6EA;
    --card:#FFFDF8;
    --peach:#FFD8B8;
    --peach-dark:#FFB88C;
    --mint:#BDEDD3;
    --mint-dark:#8FDBB0;
    --sky:#BFE3F0;
    --sky-dark:#8FCBE0;
    --coral:#FFB4A2;
    --coral-dark:#FF8F78;
    --sun:#FFE49C;
    --ink:#5B4636;
    --ink-soft:#8A7566;
    --green:#7ED08A;
    --yellow:#FFD15C;
    --red:#FF8A80;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; min-height:100%;
    background:var(--cream);
    font-family:'Apple SD Gothic Neo','Malgun Gothic',-apple-system,BlinkMacSystemFont,sans-serif;
    font-weight:700;
    color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    padding:18px;
  }
  .app{
    width:100%; max-width:420px;
    background:var(--card);
    border-radius:32px;
    padding:18px 18px 22px;
    box-shadow:0 14px 0 rgba(180,140,110,.18), 0 20px 40px rgba(180,140,110,.25);
  }

  /* ---------- header ---------- */
  .top-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .title{ font-size:22px; color:#B5652E; text-shadow:1px 1px 0 #fff; }
  .coins{
    display:flex; align-items:center; gap:4px; background:var(--sun);
    padding:6px 12px; border-radius:20px; font-size:15px; box-shadow:0 3px 0 #e8c66e;
  }

  .stage-bar{
    display:flex; align-items:center; gap:10px; margin:10px 0 14px;
    background:#FFF0DD; border-radius:20px; padding:8px 12px;
  }
  .stage-badge{
    font-size:20px; background:var(--peach); border-radius:50%;
    width:40px; height:40px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 3px 0 var(--peach-dark); flex:0 0 auto;
  }
  .stage-info{ flex:1; }
  .stage-name{ font-size:13px; color:var(--ink-soft); margin-bottom:3px; }
  .exp-track{
    height:12px; border-radius:8px; background:#F3E2CC; overflow:hidden;
    box-shadow:inset 0 2px 3px rgba(0,0,0,.08);
  }
  .exp-fill{
    height:100%; border-radius:8px; background:linear-gradient(90deg,#FFC98A,#FFA85C);
    transition:width .5s ease;
  }

  /* ---------- stage / pet display ---------- */
  .stage-view{
    position:relative; height:230px; border-radius:24px; overflow:hidden;
    margin-bottom:14px; transition:background 1.2s ease;
    background:linear-gradient(180deg,#CDEFF9 0%,#EAF9E3 70%,#DFF3C9 100%);
  }
  .stage-view.night{
    background:linear-gradient(180deg,#2B2A55 0%,#4A3F73 70%,#5C4A73 100%);
  }
  .sky-icon{ position:absolute; top:14px; right:16px; font-size:26px; filter:drop-shadow(0 2px 2px rgba(0,0,0,.15)); }
  .star{ position:absolute; width:3px;height:3px; background:#fff; border-radius:50%; opacity:0; transition:opacity .8s ease; }
  .stage-view.night .star{ opacity:.9; }
  .ground{
    position:absolute; left:0; right:0; bottom:0; height:34px;
    background:rgba(255,255,255,.25);
  }
  .pet-wrap{
    position:absolute; left:50%; bottom:38px; transform:translateX(-50%);
    display:flex; flex-direction:column; align-items:center;
  }
  .pet{
    font-size:110px; line-height:1; animation:bounce 1.6s ease-in-out infinite;
    filter:drop-shadow(0 8px 6px rgba(0,0,0,.15));
  }
  .pet.sleeping{ animation:sleepBob 2.4s ease-in-out infinite; }
  @keyframes bounce{ 0%,100%{ transform:translateY(0) scale(1); } 50%{ transform:translateY(-14px) scale(1.03); } }
  @keyframes sleepBob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-4px); } }

  .mood-badge{
    position:absolute; right:-6px; bottom:6px; font-size:26px;
    background:#fff; border-radius:50%; width:38px;height:38px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 3px 0 rgba(0,0,0,.1);
  }
  .zzz{
    position:absolute; top:-6px; right:-18px; font-size:20px; opacity:0;
    animation:none;
  }
  .zzz.show{ animation:floatZ 1.8s ease-in infinite; }
  @keyframes floatZ{ 0%{ opacity:0; transform:translateY(0) scale(.7);} 20%{opacity:1;} 100%{ opacity:0; transform:translateY(-30px) scale(1.2);} }

  .bubble{
    position:absolute; top:12px; left:50%; transform:translateX(-50%) scale(.85);
    background:#fff; padding:8px 16px; border-radius:18px; font-size:14px;
    box-shadow:0 4px 10px rgba(0,0,0,.12); opacity:0; transition:opacity .25s ease, transform .25s ease;
    white-space:nowrap; max-width:90%; text-overflow:ellipsis; overflow:hidden;
  }
  .bubble.show{ opacity:1; transform:translateX(-50%) scale(1); }
  .bubble::after{
    content:""; position:absolute; bottom:-7px; left:50%; transform:translateX(-50%);
    border-width:8px 7px 0 7px; border-style:solid; border-color:#fff transparent transparent transparent;
  }

  .sparkle{
    position:absolute; font-size:22px; opacity:0; pointer-events:none;
    animation:sparklePop 1s ease-out forwards;
  }
  @keyframes sparklePop{
    0%{ opacity:0; transform:scale(.3) translateY(0); }
    30%{ opacity:1; }
    100%{ opacity:0; transform:scale(1.3) translateY(-40px); }
  }

  .evolve-banner{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(255,246,234,.92); opacity:0; pointer-events:none; transition:opacity .35s ease;
    font-size:18px; text-align:center; padding:0 20px; color:#B5652E;
  }
  .evolve-banner.show{ opacity:1; pointer-events:auto; }

  /* ---------- stats ---------- */
  .stats{ display:flex; flex-direction:column; gap:8px; margin-bottom:14px; }
  .stat-row{ display:flex; align-items:center; gap:8px; }
  .stat-ico{ font-size:18px; width:24px; text-align:center; }
  .stat-track{
    flex:1; height:14px; border-radius:9px; background:#F0E6D8; overflow:hidden;
    box-shadow:inset 0 2px 3px rgba(0,0,0,.08);
  }
  .stat-fill{ height:100%; border-radius:9px; transition:width .5s ease, background .4s ease; }
  .stat-num{ width:30px; text-align:right; font-size:12px; color:var(--ink-soft); }

  /* ---------- buttons ---------- */
  .actions{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  .actions button{
    font-family:inherit; font-size:16px; color:var(--ink);
    border:none; border-radius:18px; padding:14px 8px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    box-shadow:0 5px 0 rgba(0,0,0,.12);
  }
  .actions button .ico{ font-size:26px; }
  .actions button:active{ transform:translateY(4px); box-shadow:0 1px 0 rgba(0,0,0,.12); }
  .btn-feed{ background:var(--peach); box-shadow:0 5px 0 var(--peach-dark); }
  .btn-play{ background:var(--sky); box-shadow:0 5px 0 var(--sky-dark); }
  .btn-wash{ background:var(--mint); box-shadow:0 5px 0 var(--mint-dark); }
  .btn-sleep{ background:#D9C8F0; box-shadow:0 5px 0 #B79EDD; }
  .btn-game{ background:var(--sun); box-shadow:0 5px 0 #E8C66E; grid-column:1 / -1; }
  .btn-treat{
    background:var(--coral); box-shadow:0 5px 0 var(--coral-dark); grid-column:1 / -1;
    display:none;
  }
  .btn-treat.show{ display:flex; }

  .rps-panel{
    display:none; margin-top:10px; background:#FFF0DD; border-radius:18px; padding:12px;
    text-align:center;
  }
  .rps-panel.show{ display:block; }
  .rps-title{ font-size:14px; color:var(--ink-soft); margin-bottom:8px; }
  .rps-choices{ display:flex; gap:8px; justify-content:center; }
  .rps-choices button{
    font-size:30px; background:#fff; border:none; border-radius:16px;
    width:64px; height:64px; cursor:pointer; box-shadow:0 4px 0 #e6d8c4;
  }
  .rps-choices button:active{ transform:translateY(3px); box-shadow:0 1px 0 #e6d8c4; }
  .rps-result{ margin-top:8px; font-size:13px; color:var(--ink-soft); min-height:16px; }
</style>
</head>
<body>

<div class="app">
  <div class="top-row">
    <div class="title">🦕 꼬마공룡 키우기</div>
    <div class="coins">🪙 <span id="coinCount">0</span></div>
  </div>

  <div class="stage-bar">
    <div class="stage-badge" id="stageBadge">🥚</div>
    <div class="stage-info">
      <div class="stage-name" id="stageName">알 단계 · Lv.1</div>
      <div class="exp-track"><div class="exp-fill" id="expFill" style="width:0%"></div></div>
    </div>
  </div>

  <div class="stage-view" id="stageView">
    <div class="sky-icon" id="skyIcon">🌞</div>
    <div class="star" style="top:20px;left:20px;"></div>
    <div class="star" style="top:40px;left:60px;"></div>
    <div class="star" style="top:16px;left:120px;"></div>
    <div class="star" style="top:55px;left:160px;"></div>
    <div class="ground"></div>

    <div class="bubble" id="bubble"></div>

    <div class="pet-wrap">
      <div class="pet" id="petEmoji">🥚</div>
      <div class="zzz" id="zzz">💤</div>
      <div class="mood-badge" id="moodBadge">😊</div>
    </div>

    <div class="evolve-banner" id="evolveBanner"></div>
  </div>

  <div class="stats">
    <div class="stat-row">
      <span class="stat-ico">🍖</span>
      <div class="stat-track"><div class="stat-fill" id="fill-hunger"></div></div>
      <span class="stat-num" id="num-hunger">70</span>
    </div>
    <div class="stat-row">
      <span class="stat-ico">😊</span>
      <div class="stat-track"><div class="stat-fill" id="fill-happiness"></div></div>
      <span class="stat-num" id="num-happiness">70</span>
    </div>
    <div class="stat-row">
      <span class="stat-ico">🛁</span>
      <div class="stat-track"><div class="stat-fill" id="fill-clean"></div></div>
      <span class="stat-num" id="num-clean">70</span>
    </div>
    <div class="stat-row">
      <span class="stat-ico">⚡</span>
      <div class="stat-track"><div class="stat-fill" id="fill-energy"></div></div>
      <span class="stat-num" id="num-energy">70</span>
    </div>
  </div>

  <div class="actions">
    <button class="btn-feed" onclick="feed()"><span class="ico">🍖</span>밥 주기</button>
    <button class="btn-play" onclick="play()"><span class="ico">🧸</span>놀아주기</button>
    <button class="btn-wash" onclick="wash()"><span class="ico">🛁</span>씻기기</button>
    <button class="btn-sleep" onclick="sleepPet()"><span class="ico">😴</span>재우기</button>
    <button class="btn-game" onclick="toggleRps()"><span class="ico">✌️</span>가위바위보 하기</button>
    <button class="btn-treat" id="treatBtn" onclick="treat()"><span class="ico">💊</span>치료하기</button>
  </div>

  <div class="rps-panel" id="rpsPanel">
    <div class="rps-title">꼬마공룡과 가위바위보!</div>
    <div class="rps-choices">
      <button onclick="playRps('가위')">✌️</button>
      <button onclick="playRps('바위')">✊</button>
      <button onclick="playRps('보')">✋</button>
    </div>
    <div class="rps-result" id="rpsResult"></div>
  </div>
</div>

<script>
(function(){
  const STAGES = [
    { key:'egg',      label:'알',            emoji:'🥚', size:80,  tint:'' },
    { key:'raptor',   label:'꼬마 랩터',      emoji:'🦎', size:92,  tint:'hue-rotate(100deg) saturate(1.4)' },
    { key:'anky',     label:'안킬로사우루스', emoji:'🐢', size:106, tint:'hue-rotate(40deg) saturate(1.2)' },
    { key:'trice',    label:'트리케라톱스',   emoji:'🦏', size:122, tint:'hue-rotate(260deg) saturate(1.1)' },
    { key:'spino',    label:'스피노사우루스', emoji:'🐊', size:138, tint:'hue-rotate(90deg) saturate(1.5)' },
    { key:'sauropod', label:'브라키오사우루스', emoji:'🦕', size:156, tint:'hue-rotate(180deg) saturate(1.3)' },
    { key:'trex',     label:'티라노사우루스', emoji:'🦖', size:180, tint:'hue-rotate(-20deg) saturate(1.4)' },
  ];

  const state = {
    stage:0, exp:0, coins:0,
    hunger:70, happiness:70, clean:70, energy:70,
    sick:false, sleeping:false, isNight:false,
  };

  const el = (id)=> document.getElementById(id);
  const petEl = el('petEmoji');
  const stageView = el('stageView');
  const bubbleEl = el('bubble');
  const moodEl = el('moodBadge');
  const zzzEl = el('zzz');
  const treatBtn = el('treatBtn');
  const rpsPanel = el('rpsPanel');
  const rpsResult = el('rpsResult');

  function clamp(v){ return Math.max(0, Math.min(100, v)); }

  function statColor(v){
    if(v >= 60) return 'linear-gradient(90deg,#8FE0A0,#6BCB80)';
    if(v >= 30) return 'linear-gradient(90deg,#FFDD8A,#FFC94D)';
    return 'linear-gradient(90deg,#FF9E92,#FF7A6B)';
  }

  function say(text, ms){
    bubbleEl.textContent = text;
    bubbleEl.classList.add('show');
    clearTimeout(say._t);
    say._t = setTimeout(()=> bubbleEl.classList.remove('show'), ms || 1800);
  }

  function checkSick(){
    state.sick = (state.hunger<=0 || state.happiness<=0 || state.clean<=0 || state.energy<=0);
  }

  function addExp(n){
    if(state.sick) return;
    state.exp += n;
    while(state.exp >= 100){
      if(state.stage < STAGES.length - 1){
        state.exp -= 100;
        state.stage++;
        evolveEffect();
      } else {
        state.exp = 100;
        break;
      }
    }
  }

  function evolveEffect(){
    const banner = el('evolveBanner');
    banner.textContent = '✨ 꼬마공룡이 진화했다! ✨ (' + STAGES[state.stage].label + ')';
    banner.classList.add('show');
    for(let i=0;i<8;i++){
      setTimeout(()=>{
        const s = document.createElement('div');
        s.className = 'sparkle';
        s.textContent = '✨';
        s.style.left = (20 + Math.random()*220) + 'px';
        s.style.top = (30 + Math.random()*140) + 'px';
        stageView.appendChild(s);
        setTimeout(()=> s.remove(), 1000);
      }, i*90);
    }
    setTimeout(()=> banner.classList.remove('show'), 2200);
  }

  function afterAction(){
    checkSick();
    if(!state.sick) addExp(10);
    renderAll();
  }

  window.feed = function(){
    if(state.sleeping) return;
    state.hunger = clamp(state.hunger + 25);
    state.happiness = clamp(state.happiness + 5);
    if(state.energy > 0) state.energy = clamp(state.energy + 5);
    say('냠냠! 맛있어요! 🍖');
    afterAction();
  };

  window.play = function(){
    if(state.sleeping) return;
    state.happiness = clamp(state.happiness + 25);
    state.hunger = clamp(state.hunger - 10);
    state.energy = clamp(state.energy - 15);
    state.clean = clamp(state.clean - 10);
    say('우와 신난다! 🧸');
    afterAction();
  };

  window.wash = function(){
    if(state.sleeping) return;
    state.clean = clamp(state.clean + 35);
    state.happiness = clamp(state.happiness - 5);
    say('시원하고 깨끗해요! 🛁');
    afterAction();
  };

  window.sleepPet = function(){
    if(state.sleeping) return;
    state.energy = clamp(state.energy + 40);
    state.hunger = clamp(state.hunger - 10);
    say('쿨쿨... 잘 자요 💤');
    state.sleeping = true;
    petEl.classList.add('sleeping');
    zzzEl.classList.add('show');
    setTimeout(()=>{
      state.sleeping = false;
      petEl.classList.remove('sleeping');
      zzzEl.classList.remove('show');
      say('잘 잤다! 개운해요!');
      renderAll();
    }, 3500);
    afterAction();
  };

  window.treat = function(){
    if(!state.sick) return;
    ['hunger','happiness','clean','energy'].forEach(k=>{
      if(state[k] < 30) state[k] = 30;
    });
    state.sick = false;
    say('다 나았어요! 고마워요! 💊');
    renderAll();
  };

  window.toggleRps = function(){
    rpsPanel.classList.toggle('show');
    rpsResult.textContent = '';
  };

  window.playRps = function(choice){
    if(state.sleeping) return;
    const opts = ['가위','바위','보'];
    const petChoice = opts[Math.floor(Math.random()*3)];
    let result;
    if(choice === petChoice){
      result = 'draw';
    } else if(
      (choice==='가위' && petChoice==='보') ||
      (choice==='바위' && petChoice==='가위') ||
      (choice==='보' && petChoice==='바위')
    ){
      result = 'win';
    } else {
      result = 'lose';
    }
    const iconMap = {'가위':'✌️','바위':'✊','보':'✋'};
    if(result === 'win'){
      state.happiness = clamp(state.happiness + 15);
      state.coins += 10;
      rpsResult.textContent = `나 ${iconMap[choice]} vs 꼬마공룡 ${iconMap[petChoice]} → 승리! 🪙+10`;
      say('내가 이겼다! 신난다!');
    } else if(result === 'lose'){
      state.happiness = clamp(state.happiness + 5);
      rpsResult.textContent = `나 ${iconMap[choice]} vs 꼬마공룡 ${iconMap[petChoice]} → 패배...`;
      say('졌지만 재밌었어요!');
    } else {
      state.happiness = clamp(state.happiness + 8);
      rpsResult.textContent = `나 ${iconMap[choice]} vs 꼬마공룡 ${iconMap[petChoice]} → 무승부!`;
      say('비겼어요! 다시 한판?');
    }
    afterAction();
  };

  /* ---------- render ---------- */
  function renderAll(){
    const s = STAGES[state.stage];
    petEl.textContent = s.emoji;
    petEl.style.fontSize = s.size + 'px';
    petEl.style.filter = (s.tint ? s.tint + ' ' : '') + 'drop-shadow(0 8px 6px rgba(0,0,0,.15))';
    el('stageBadge').textContent = s.emoji;
    el('stageName').textContent = s.label + ' · EXP ' + state.exp + '/100';
    el('expFill').style.width = state.exp + '%';
    el('coinCount').textContent = state.coins;

    ['hunger','happiness','clean','energy'].forEach(k=>{
      const v = state[k];
      el('fill-'+k).style.width = v + '%';
      el('fill-'+k).style.background = statColor(v);
      el('num-'+k).textContent = v;
    });

    if(state.sick){
      moodEl.textContent = '🤒';
    } else {
      const avg = (state.hunger + state.happiness + state.clean + state.energy) / 4;
      moodEl.textContent = avg >= 60 ? '😊' : (avg >= 30 ? '😐' : '😢');
    }

    treatBtn.classList.toggle('show', state.sick);
    stageView.classList.toggle('night', state.isNight);
    el('skyIcon').textContent = state.isNight ? '🌙' : '🌞';
  }

  /* ---------- timers ---------- */
  setInterval(()=>{
    if(state.sleeping) return;
    state.hunger = clamp(state.hunger - 2);
    state.happiness = clamp(state.happiness - 1);
    state.clean = clamp(state.clean - 1);
    state.energy = clamp(state.energy - (state.isNight ? 3 : 1));
    checkSick();
    renderAll();
  }, 3000);

  setInterval(()=>{
    state.isNight = !state.isNight;
    renderAll();
  }, 20000);

  renderAll();
})();
</script>
</body>
</html>
