<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>꼬마공룡 키우기 - PC 버전</title>
<style>
  :root{
    --cream:#FFF6EA;
    --card:#FFFDF8;
    --peach:#FFD8B8;
    --peach-dark:#FFB88C;
    --mint:#BDEDD3;
    --mint-dark:#8FDBB0;
    --sky:#BFE3F0;
    --sky-dark:#8FCBE0;
    --coral:#FFB4A2;
    --coral-dark:#FF8F78;
    --sun:#FFE49C;
    --ink:#5B4636;
    --ink-soft:#8A7566;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; min-height:100%;
    background:var(--cream);
    font-family:'Apple SD Gothic Neo','Malgun Gothic',-apple-system,BlinkMacSystemFont,sans-serif;
    font-weight:700;
    color:var(--ink);
  }
  .page{ max-width:1320px; margin:0 auto; padding:20px 24px 40px; }

  /* ---------- header ---------- */
  .header{
    display:flex; align-items:center; justify-content:space-between; gap:20px;
    background:var(--card); border-radius:24px; padding:14px 22px; margin-bottom:16px;
    box-shadow:0 8px 0 rgba(180,140,110,.14), 0 12px 24px rgba(180,140,110,.18);
  }
  .title{ font-size:24px; color:#B5652E; text-shadow:1px 1px 0 #fff; white-space:nowrap; }
  .header-right{ display:flex; align-items:center; gap:16px; flex:1; justify-content:flex-end; }
  .coins{
    display:flex; align-items:center; gap:5px; background:var(--sun);
    padding:7px 14px; border-radius:20px; font-size:15px; box-shadow:0 3px 0 #e8c66e; white-space:nowrap;
  }
  .stage-bar{ display:flex; align-items:center; gap:10px; width:280px; }
  .stage-badge{
    font-size:20px; background:var(--peach); border-radius:50%;
    width:38px; height:38px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 3px 0 var(--peach-dark); flex:0 0 auto;
  }
  .stage-info{ flex:1; }
  .stage-name{ font-size:12px; color:var(--ink-soft); margin-bottom:3px; }
  .exp-track{ height:10px; border-radius:8px; background:#F3E2CC; overflow:hidden; box-shadow:inset 0 2px 3px rgba(0,0,0,.08); }
  .exp-fill{ height:100%; border-radius:8px; background:linear-gradient(90deg,#FFC98A,#FFA85C); transition:width .5s ease; }

  /* ---------- layout ---------- */
  .layout{ display:flex; gap:16px; align-items:flex-start; }

  /* ---------- scene ---------- */
  .scene{
    position:relative; flex:1; height:560px; border-radius:26px; overflow:hidden;
    cursor:pointer; transition:background 1.2s ease; user-select:none;
    background:linear-gradient(180deg,#CDEFF9 0%,#EAF9E3 62%,#DFF3C9 100%);
    box-shadow:0 8px 0 rgba(180,140,110,.14), 0 12px 24px rgba(180,140,110,.18);
  }
  .scene.night{ background:linear-gradient(180deg,#2B2A55 0%,#4A3F73 62%,#5C4A73 100%); }
  .sky-icon{ position:absolute; top:20px; right:26px; font-size:32px; filter:drop-shadow(0 2px 2px rgba(0,0,0,.15)); pointer-events:none; }
  .star{ position:absolute; width:3px;height:3px; background:#fff; border-radius:50%; opacity:0; transition:opacity .8s ease; pointer-events:none; }
  .scene.night .star{ opacity:.9; }

  .hill{ position:absolute; bottom:100px; border-radius:50%; opacity:.5; pointer-events:none; }
  .hill.h1{ left:-40px; width:260px; height:120px; background:#AEE0A8; }
  .hill.h2{ left:220px; width:200px; height:90px; background:#C7EABE; opacity:.4; }
  .hill.h3{ right:-30px; width:280px; height:130px; background:#AEE0A8; }

  .pond{
    position:absolute; left:38%; bottom:60px; width:120px; height:36px; border-radius:50%;
    background:radial-gradient(ellipse at 40% 30%, #BFE6EE, #8FCBDA); opacity:.85; pointer-events:none;
  }
  .tree{ position:absolute; bottom:96px; font-size:46px; pointer-events:none; filter:drop-shadow(0 4px 3px rgba(0,0,0,.12)); }
  .bush{ position:absolute; bottom:96px; font-size:30px; pointer-events:none; }
  .flower{ position:absolute; bottom:100px; font-size:16px; pointer-events:none; }

  .ground{ position:absolute; left:0; right:0; bottom:0; height:100px; background:rgba(255,255,255,.22); pointer-events:none; }

  .dino-wrap{
    position:absolute; bottom:70px; left:50%; transform:translateX(-50%);
    transition:left 1.6s ease-in-out; z-index:5;
  }
  .dino-flip{ transition:transform .25s ease; }
  .dino-flip.face-left{ transform:scaleX(-1); }
  .dino{
    font-size:120px; line-height:1; animation:bounce 1.6s ease-in-out infinite;
    filter:drop-shadow(0 10px 8px rgba(0,0,0,.15));
  }
  .dino.walking{ animation:walkBounce .5s ease-in-out infinite; }
  .dino.running{ animation:runBounce .24s ease-in-out infinite; }
  .dino.jumping{ animation:jumpHop .7s ease-in-out 1; }
  .dino.rolling{ animation:rollSpin .35s linear infinite; }
  @keyframes jumpHop{
    0%{ transform:translateY(0) scaleY(1) rotate(0deg); }
    28%{ transform:translateY(-80px) scaleY(1.06) rotate(-8deg); }
    50%{ transform:translateY(-104px) scaleY(.95) rotate(0deg); }
    72%{ transform:translateY(-40px) scaleY(1.08) rotate(8deg); }
    100%{ transform:translateY(0) scaleY(1) rotate(0deg); }
  }
  @keyframes rollSpin{ 0%{ transform:rotate(0deg); } 100%{ transform:rotate(360deg); } }
  .dino.sleeping{ animation:sleepBob 2.4s ease-in-out infinite; }
  @keyframes bounce{ 0%,100%{ transform:translateY(0) scale(1); } 50%{ transform:translateY(-16px) scale(1.03); } }
  @keyframes walkBounce{ 0%,100%{ transform:translateY(0) rotate(0deg); } 50%{ transform:translateY(-10px) rotate(-4deg); } }
  @keyframes runBounce{ 0%,100%{ transform:translateY(0) scaleX(1.05) rotate(0deg); } 50%{ transform:translateY(-22px) scaleX(.94) rotate(-6deg); } }
  @keyframes sleepBob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-4px); } }

  .mood-badge{
    position:absolute; right:-2px; bottom:2px; font-size:28px;
    background:#fff; border-radius:50%; width:42px;height:42px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 3px 0 rgba(0,0,0,.1); pointer-events:none;
  }
  .feature-badge{
    position:absolute; left:-10px; top:6px; font-size:28px;
    display:none; filter:drop-shadow(0 2px 2px rgba(0,0,0,.2)); pointer-events:none;
  }
  .feature-badge.show{ display:block; }
  .zzz{ position:absolute; top:-4px; right:-14px; font-size:22px; opacity:0; pointer-events:none; }
  .zzz.show{ animation:floatZ 1.8s ease-in infinite; }
  @keyframes floatZ{ 0%{ opacity:0; transform:translateY(0) scale(.7);} 20%{opacity:1;} 100%{ opacity:0; transform:translateY(-32px) scale(1.2);} }

  .bubble{
    position:absolute; bottom:100%; left:50%; margin-bottom:10px;
    transform:translateX(-50%) scale(.85);
    background:#fff; padding:9px 18px; border-radius:18px; font-size:15px;
    box-shadow:0 4px 10px rgba(0,0,0,.12); opacity:0; transition:opacity .25s ease, transform .25s ease;
    white-space:nowrap; pointer-events:none;
  }
  .bubble.show{ opacity:1; transform:translateX(-50%) scale(1); }
  .bubble::after{
    content:""; position:absolute; bottom:-7px; left:50%; transform:translateX(-50%);
    border-width:8px 7px 0 7px; border-style:solid; border-color:#fff transparent transparent transparent;
  }

  .sparkle{ position:absolute; font-size:24px; opacity:0; pointer-events:none; animation:sparklePop 1s ease-out forwards; }
  @keyframes sparklePop{
    0%{ opacity:0; transform:scale(.3) translateY(0); }
    30%{ opacity:1; }
    100%{ opacity:0; transform:scale(1.3) translateY(-46px); }
  }
  .evolve-banner{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(255,246,234,.92); opacity:0; pointer-events:none; transition:opacity .35s ease;
    font-size:22px; text-align:center; padding:0 30px; color:#B5652E; z-index:20;
  }
  .evolve-banner.show{ opacity:1; }

  .hint{
    position:absolute; left:14px; bottom:14px; font-size:12px; color:var(--ink-soft);
    background:rgba(255,255,255,.7); padding:5px 10px; border-radius:12px; pointer-events:none;
  }

  /* ---------- sidebar ---------- */
  .sidebar{ width:300px; flex:0 0 auto; display:flex; flex-direction:column; gap:14px; }
  .panel{
    background:var(--card); border-radius:22px; padding:16px;
    box-shadow:0 8px 0 rgba(180,140,110,.14), 0 12px 24px rgba(180,140,110,.18);
  }
  .panel-title{ font-size:14px; color:var(--ink-soft); margin-bottom:10px; }

  .stats{ display:flex; flex-direction:column; gap:9px; }
  .stat-row{ display:flex; align-items:center; gap:8px; }
  .stat-ico{ font-size:17px; width:22px; text-align:center; }
  .stat-track{ flex:1; height:13px; border-radius:9px; background:#F0E6D8; overflow:hidden; box-shadow:inset 0 2px 3px rgba(0,0,0,.08); }
  .stat-fill{ height:100%; border-radius:9px; transition:width .5s ease, background .4s ease; }
  .stat-num{ width:28px; text-align:right; font-size:12px; color:var(--ink-soft); }

  .actions{ display:grid; grid-template-columns:repeat(2,1fr); gap:9px; }
  .actions button{
    font-family:inherit; font-size:15px; color:var(--ink);
    border:none; border-radius:16px; padding:12px 6px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    box-shadow:0 5px 0 rgba(0,0,0,.12);
  }
  .actions button .ico{ font-size:23px; }
  .actions button:active{ transform:translateY(4px); box-shadow:0 1px 0 rgba(0,0,0,.12); }
  .btn-feed{ background:var(--peach); box-shadow:0 5px 0 var(--peach-dark); }
  .btn-play{ background:var(--sky); box-shadow:0 5px 0 var(--sky-dark); }
  .btn-wash{ background:var(--mint); box-shadow:0 5px 0 var(--mint-dark); }
  .btn-sleep{ background:#D9C8F0; box-shadow:0 5px 0 #B79EDD; }
  .btn-game{ background:var(--sun); box-shadow:0 5px 0 #E8C66E; grid-column:1 / -1; }
  .btn-treat{ background:var(--coral); box-shadow:0 5px 0 var(--coral-dark); grid-column:1 / -1; display:none; }
  .btn-treat.show{ display:flex; }

  .rps-panel{ display:none; margin-top:6px; }
  .rps-panel.show{ display:block; }
  .rps-title{ font-size:13px; color:var(--ink-soft); margin-bottom:8px; text-align:center; }
  .rps-choices{ display:flex; gap:8px; justify-content:center; }
  .rps-choices button{
    font-size:28px; background:#fff; border:none; border-radius:16px;
    width:58px; height:58px; cursor:pointer; box-shadow:0 4px 0 #e6d8c4;
  }
  .rps-choices button:active{ transform:translateY(3px); box-shadow:0 1px 0 #e6d8c4; }
  .rps-result{ margin-top:8px; font-size:12px; color:var(--ink-soft); min-height:16px; text-align:center; }

  @media (max-width: 900px){
    .layout{ flex-direction:column; }
    .sidebar{ width:100%; flex-direction:row; flex-wrap:wrap; }
    .sidebar .panel{ flex:1 1 260px; }
    .header{ flex-wrap:wrap; }
    .stage-bar{ width:220px; }
  }
</style>
</head>
<body>

<div class="page">
  <div class="header">
    <div class="title">🦕 꼬마공룡 키우기 <span style="font-size:14px;color:var(--ink-soft);">PC 버전 · 넓은 화면에서 자유롭게!</span></div>
    <div class="header-right">
      <div class="stage-bar">
        <div class="stage-badge" id="stageBadge">🥚</div>
        <div class="stage-info">
          <div class="stage-name" id="stageName">알 단계 · EXP 0/100</div>
          <div class="exp-track"><div class="exp-fill" id="expFill" style="width:0%"></div></div>
        </div>
      </div>
      <div class="coins">🪙 <span id="coinCount">0</span></div>
    </div>
  </div>

  <div class="layout">
    <div class="scene" id="scene">
      <div class="sky-icon" id="skyIcon">🌞</div>
      <div class="star" style="top:24px;left:6%;"></div>
      <div class="star" style="top:50px;left:14%;"></div>
      <div class="star" style="top:18px;left:30%;"></div>
      <div class="star" style="top:60px;left:46%;"></div>
      <div class="star" style="top:30px;left:64%;"></div>
      <div class="star" style="top:70px;left:80%;"></div>

      <div class="hill h1"></div>
      <div class="hill h2"></div>
      <div class="hill h3"></div>
      <div class="pond"></div>
      <div class="tree" style="left:8%;">🌳</div>
      <div class="tree" style="right:10%;">🌲</div>
      <div class="bush" style="left:22%;">🌿</div>
      <div class="bush" style="right:26%;">🌿</div>
      <div class="flower" style="left:46%;">🌼</div>
      <div class="flower" style="left:60%;">🌸</div>
      <div class="ground"></div>

      <div class="dino-wrap" id="dinoWrap">
        <div class="bubble" id="bubble"></div>
        <div class="dino-flip" id="dinoFlip">
          <div class="dino" id="dinoEmoji">🥚</div>
        </div>
        <div class="zzz" id="zzz">💤</div>
        <div class="mood-badge" id="moodBadge">😊</div>
        <div class="feature-badge" id="featureBadge"></div>
      </div>

      <div class="evolve-banner" id="evolveBanner"></div>
      <div class="hint">화면을 클릭하면 꼬마공룡이 그 자리로 걸어가요 🐾</div>
    </div>

    <div class="sidebar">
      <div class="panel">
        <div class="panel-title">상태</div>
        <div class="stats">
          <div class="stat-row">
            <span class="stat-ico">🍖</span>
            <div class="stat-track"><div class="stat-fill" id="fill-hunger"></div></div>
            <span class="stat-num" id="num-hunger">70</span>
          </div>
          <div class="stat-row">
            <span class="stat-ico">😊</span>
            <div class="stat-track"><div class="stat-fill" id="fill-happiness"></div></div>
            <span class="stat-num" id="num-happiness">70</span>
          </div>
          <div class="stat-row">
            <span class="stat-ico">🛁</span>
            <div class="stat-track"><div class="stat-fill" id="fill-clean"></div></div>
            <span class="stat-num" id="num-clean">70</span>
          </div>
          <div class="stat-row">
            <span class="stat-ico">⚡</span>
            <div class="stat-track"><div class="stat-fill" id="fill-energy"></div></div>
            <span class="stat-num" id="num-energy">70</span>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">돌보기</div>
        <div class="actions">
          <button class="btn-feed" onclick="feed()"><span class="ico">🍖</span>밥 주기</button>
          <button class="btn-play" onclick="play()"><span class="ico">🧸</span>놀아주기</button>
          <button class="btn-wash" onclick="wash()"><span class="ico">🛁</span>씻기기</button>
          <button class="btn-sleep" onclick="sleepPet()"><span class="ico">😴</span>재우기</button>
          <button class="btn-game" onclick="toggleRps()"><span class="ico">✌️</span>가위바위보 하기</button>
          <button class="btn-treat" id="treatBtn" onclick="treat()"><span class="ico">💊</span>치료하기</button>
        </div>
        <div class="rps-panel" id="rpsPanel">
          <div class="rps-title">꼬마공룡과 가위바위보!</div>
          <div class="rps-choices">
            <button onclick="playRps('가위')">✌️</button>
            <button onclick="playRps('바위')">✊</button>
            <button onclick="playRps('보')">✋</button>
          </div>
          <div class="rps-result" id="rpsResult"></div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">동작 시켜보기</div>
        <div class="actions">
          <button class="btn-wash" onclick="wanderWalk()"><span class="ico">🚶</span>걷기</button>
          <button class="btn-sky" style="background:var(--peach);box-shadow:0 5px 0 var(--peach-dark);" onclick="wanderRun()"><span class="ico">🏃</span>뛰기</button>
          <button class="btn-jump" style="background:var(--sky);box-shadow:0 5px 0 var(--sky-dark);" onclick="doJump()"><span class="ico">🦘</span>점프</button>
          <button class="btn-roll" style="background:#D9C8F0;box-shadow:0 5px 0 #B79EDD;" onclick="doRollAction()"><span class="ico">🌀</span>구르기</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  const STAGES = [
    { key:'egg',      label:'알',              emoji:'🥚', size:90,  tint:'', accessory:'' },
    { key:'raptor',   label:'꼬마 랩터',       emoji:'🦖', size:100, tint:'hue-rotate(100deg) saturate(1.5)', accessory:'' },
    { key:'anky',     label:'안킬로사우루스',  emoji:'🐢', size:118, tint:'hue-rotate(40deg) saturate(1.3)',  accessory:'🔨' },
    { key:'trice',    label:'트리케라톱스',    emoji:'🦏', size:136, tint:'hue-rotate(250deg) saturate(1.1)', accessory:'🔱' },
    { key:'spino',    label:'스피노사우루스',  emoji:'🐊', size:154, tint:'hue-rotate(90deg) saturate(1.5)',  accessory:'⛵' },
    { key:'sauropod', label:'브라키오사우루스', emoji:'🦕', size:176, tint:'hue-rotate(180deg) saturate(1.3)', accessory:'' },
    { key:'trex',     label:'티라노사우루스',  emoji:'🦖', size:210, tint:'hue-rotate(-20deg) saturate(1.5)', accessory:'🔥' },
  ];

  const state = {
    stage:0, exp:0, coins:0,
    hunger:70, happiness:70, clean:70, energy:70,
    sick:false, sleeping:false, isNight:false,
    x:0, busy:false,
  };

  const el = (id)=> document.getElementById(id);
  const scene = el('scene');
  const dinoWrap = el('dinoWrap');
  const dinoFlip = el('dinoFlip');
  const dinoEl = el('dinoEmoji');
  const bubbleEl = el('bubble');
  const moodEl = el('moodBadge');
  const zzzEl = el('zzz');
  const treatBtn = el('treatBtn');
  const rpsPanel = el('rpsPanel');
  const rpsResult = el('rpsResult');

  function clamp(v){ return Math.max(0, Math.min(100, v)); }

  function statColor(v){
    if(v >= 60) return 'linear-gradient(90deg,#8FE0A0,#6BCB80)';
    if(v >= 30) return 'linear-gradient(90deg,#FFDD8A,#FFC94D)';
    return 'linear-gradient(90deg,#FF9E92,#FF7A6B)';
  }

  function say(text, ms){
    bubbleEl.textContent = text;
    bubbleEl.classList.add('show');
    clearTimeout(say._t);
    say._t = setTimeout(()=> bubbleEl.classList.remove('show'), ms || 1800);
  }

  function checkSick(){
    state.sick = (state.hunger<=0 || state.happiness<=0 || state.clean<=0 || state.energy<=0);
  }

  function addExp(n){
    if(state.sick) return;
    state.exp += n;
    while(state.exp >= 100){
      if(state.stage < STAGES.length - 1){
        state.exp -= 100;
        state.stage++;
        evolveEffect();
      } else {
        state.exp = 100;
        break;
      }
    }
  }

  function evolveEffect(){
    const banner = el('evolveBanner');
    banner.textContent = '✨ 꼬마공룡이 진화했다! ✨ (' + STAGES[state.stage].label + ')';
    banner.classList.add('show');
    for(let i=0;i<10;i++){
      setTimeout(()=>{
        const s = document.createElement('div');
        s.className = 'sparkle';
        s.textContent = '✨';
        s.style.left = (40 + Math.random()*(scene.clientWidth-80)) + 'px';
        s.style.top = (60 + Math.random()*380) + 'px';
        scene.appendChild(s);
        setTimeout(()=> s.remove(), 1000);
      }, i*90);
    }
    setTimeout(()=> banner.classList.remove('show'), 2200);
  }

  function afterAction(){
    checkSick();
    if(!state.sick) addExp(10);
    renderAll();
  }

  /* ---------- movement ---------- */
  function faceDir(dir){ dinoFlip.classList.toggle('face-left', dir > 0); }

  function sceneMaxX(){
    const w = scene.clientWidth;
    const dinoW = dinoWrap.offsetWidth || 120;
    return Math.max(40, w - dinoW/2 - 30);
  }
  function sceneMinX(){
    const dinoW = dinoWrap.offsetWidth || 120;
    return -(scene.clientWidth/2) + dinoW/2 + 30 - scene.clientWidth/2;
  }

  function goTo(targetX, mode, onDone){
    if(state.sleeping) return;
    const w = scene.clientWidth;
    const half = w/2;
    const clamped = Math.max(-half+70, Math.min(half-70, targetX));
    const dist = Math.abs(clamped - state.x);
    const speed = mode === 'run' ? 320 : mode === 'roll' ? 260 : 90; // px per second
    const dur = Math.max(0.4, dist / speed);
    faceDir(clamped >= state.x ? 1 : -1);
    dinoEl.classList.remove('walking','running','rolling');
    const animClass = mode === 'run' ? 'running' : mode === 'roll' ? 'rolling' : 'walking';
    dinoEl.classList.add(animClass);
    dinoWrap.style.transition = `left ${dur}s ease-in-out`;
    state.x = clamped;
    dinoWrap.style.left = `calc(50% + ${clamped}px)`;
    state.busy = true;
    clearTimeout(goTo._t);
    goTo._t = setTimeout(()=>{
      dinoEl.classList.remove('walking','running','rolling');
      state.busy = false;
      if(onDone) onDone();
    }, dur*1000);
  }

  function doJump(){
    if(state.busy || state.sleeping) return;
    state.busy = true;
    dinoEl.classList.remove('walking','running','rolling');
    dinoEl.classList.add('jumping');
    say('폴짝!', 800);
    clearTimeout(doJump._t);
    doJump._t = setTimeout(()=>{
      dinoEl.classList.remove('jumping');
      state.busy = false;
    }, 700);
  }

  function doRollAction(){
    if(state.busy || state.sleeping) return;
    const half = scene.clientWidth/2 - 90;
    const dir = Math.random() < 0.5 ? -1 : 1;
    const dist = 140 + Math.random()*90;
    let target = state.x + dir*dist;
    target = Math.max(-half, Math.min(half, target));
    say('데굴데굴~', 900);
    goTo(target, 'roll');
  }
  window.doJump = doJump;
  window.doRollAction = doRollAction;
  window.wanderWalk = function(){
    if(state.busy || state.sleeping) return;
    const half = scene.clientWidth/2 - 90;
    goTo((Math.random()*2-1) * half, 'walk');
  };
  window.wanderRun = function(){
    if(state.busy || state.sleeping) return;
    const half = scene.clientWidth/2 - 90;
    goTo((Math.random()*2-1) * half, 'run');
  };

  function ambientWander(){
    const delay = 3000 + Math.random()*4000;
    setTimeout(()=>{
      if(!state.busy && !state.sleeping){
        const r = Math.random();
        if(r < 0.45){
          const half = scene.clientWidth/2 - 90;
          goTo((Math.random()*2 - 1) * half, 'walk');
        } else if(r < 0.65){
          doJump();
        } else if(r < 0.85){
          doRollAction();
        } else {
          const half = scene.clientWidth/2 - 90;
          goTo((Math.random()*2 - 1) * half, 'run');
        }
      }
      ambientWander();
    }, delay);
  }

  scene.addEventListener('click', (e)=>{
    if(state.sleeping) return;
    const rect = scene.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    const targetX = clickX - rect.width/2;
    goTo(targetX, 'walk', ()=>{ say('여기 왔어요!', 900); });
  });

  /* ---------- interactions ---------- */
  window.feed = function(){
    if(state.sleeping) return;
    state.hunger = clamp(state.hunger + 25);
    state.happiness = clamp(state.happiness + 5);
    if(state.energy > 0) state.energy = clamp(state.energy + 5);
    say('냠냠! 맛있어요! 🍖');
    afterAction();
  };

  window.play = function(){
    if(state.sleeping) return;
    state.happiness = clamp(state.happiness + 25);
    state.hunger = clamp(state.hunger - 10);
    state.energy = clamp(state.energy - 15);
    state.clean = clamp(state.clean - 10);
    say('우와 신난다! 🧸');
    const half = scene.clientWidth/2 - 90;
    const p1 = (Math.random()*2-1) * half;
    goTo(p1, 'run', ()=>{
      doJump();
      setTimeout(()=>{ doRollAction(); }, 750);
    });
    afterAction();
  };

  window.wash = function(){
    if(state.sleeping) return;
    state.clean = clamp(state.clean + 35);
    state.happiness = clamp(state.happiness - 5);
    say('시원하고 깨끗해요! 🛁');
    afterAction();
  };

  window.sleepPet = function(){
    if(state.sleeping) return;
    state.energy = clamp(state.energy + 40);
    state.hunger = clamp(state.hunger - 10);
    say('쿨쿨... 잘 자요 💤');
    state.sleeping = true;
    dinoEl.classList.remove('walking','running','jumping','rolling');
    dinoEl.classList.add('sleeping');
    zzzEl.classList.add('show');
    setTimeout(()=>{
      state.sleeping = false;
      dinoEl.classList.remove('sleeping');
      zzzEl.classList.remove('show');
      say('잘 잤다! 개운해요!');
      renderAll();
    }, 3500);
    afterAction();
  };

  window.treat = function(){
    if(!state.sick) return;
    ['hunger','happiness','clean','energy'].forEach(k=>{
      if(state[k] < 30) state[k] = 30;
    });
    state.sick = false;
    say('다 나았어요! 고마워요! 💊');
    renderAll();
  };

  window.toggleRps = function(){
    rpsPanel.classList.toggle('show');
    rpsResult.textContent = '';
  };

  window.playRps = function(choice){
    if(state.sleeping) return;
    const opts = ['가위','바위','보'];
    const petChoice = opts[Math.floor(Math.random()*3)];
    let result;
    if(choice === petChoice){
      result = 'draw';
    } else if(
      (choice==='가위' && petChoice==='보') ||
      (choice==='바위' && petChoice==='가위') ||
      (choice==='보' && petChoice==='바위')
    ){
      result = 'win';
    } else {
      result = 'lose';
    }
    const iconMap = {'가위':'✌️','바위':'✊','보':'✋'};
    if(result === 'win'){
      state.happiness = clamp(state.happiness + 15);
      state.coins += 10;
      rpsResult.textContent = `나 ${iconMap[choice]} vs 꼬마공룡 ${iconMap[petChoice]} → 승리! 🪙+10`;
      say('내가 이겼다! 신난다!');
    } else if(result === 'lose'){
      state.happiness = clamp(state.happiness + 5);
      rpsResult.textContent = `나 ${iconMap[choice]} vs 꼬마공룡 ${iconMap[petChoice]} → 패배...`;
      say('졌지만 재밌었어요!');
    } else {
      state.happiness = clamp(state.happiness + 8);
      rpsResult.textContent = `나 ${iconMap[choice]} vs 꼬마공룡 ${iconMap[petChoice]} → 무승부!`;
      say('비겼어요! 다시 한판?');
    }
    afterAction();
  };

  /* ---------- render ---------- */
  function renderAll(){
    const s = STAGES[state.stage];
    dinoEl.textContent = s.emoji;
    dinoEl.style.fontSize = s.size + 'px';
    dinoEl.style.filter = (s.tint ? s.tint + ' ' : '') + 'drop-shadow(0 10px 8px rgba(0,0,0,.15))';
    const fb = el('featureBadge');
    if(s.accessory){ fb.textContent = s.accessory; fb.classList.add('show'); }
    else { fb.classList.remove('show'); }
    el('stageBadge').textContent = s.emoji;
    el('stageName').textContent = s.label + ' · EXP ' + state.exp + '/100';
    el('expFill').style.width = state.exp + '%';
    el('coinCount').textContent = state.coins;

    ['hunger','happiness','clean','energy'].forEach(k=>{
      const v = state[k];
      el('fill-'+k).style.width = v + '%';
      el('fill-'+k).style.background = statColor(v);
      el('num-'+k).textContent = v;
    });

    if(state.sick){
      moodEl.textContent = '🤒';
    } else {
      const avg = (state.hunger + state.happiness + state.clean + state.energy) / 4;
      moodEl.textContent = avg >= 60 ? '😊' : (avg >= 30 ? '😐' : '😢');
    }

    treatBtn.classList.toggle('show', state.sick);
    scene.classList.toggle('night', state.isNight);
    el('skyIcon').textContent = state.isNight ? '🌙' : '🌞';
  }

  /* ---------- timers ---------- */
  setInterval(()=>{
    if(state.sleeping) return;
    state.hunger = clamp(state.hunger - 2);
    state.happiness = clamp(state.happiness - 1);
    state.clean = clamp(state.clean - 1);
    state.energy = clamp(state.energy - (state.isNight ? 3 : 1));
    checkSick();
    renderAll();
  }, 3000);

  setInterval(()=>{
    state.isNight = !state.isNight;
    renderAll();
  }, 20000);

  window.addEventListener('load', ()=>{
    dinoWrap.style.left = 'calc(50% + 0px)';
    renderAll();
    ambientWander();
  });
})();
</script>
</body>
</html>
