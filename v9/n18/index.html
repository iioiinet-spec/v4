<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5학년 2학기 시간표 및 D-Day</title>
    <!-- 고운 돋움체 구글 폰트 불러오기 -->
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;       /* 배경색: 완전한 검은색 */
            --card-color: #ffffff;     /* 칸/카드 배경색: 흰색 */
            --text-color: #000000;     /* 기본 글자색: 검은색 */
            --main-text: #ffffff;      /* 상단 제목 및 카운터 글자색: 흰색 */
            --point-color: #ffffff;    /* 포인트 강조 색상: 흰색 */
            --border-radius: 14px;     /* 모서리 둥글기: 14px */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Gowun Dodum', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--main-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 30px 15px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .dday-section {
            background-color: var(--card-color);
            color: var(--text-color);
            border-radius: var(--border-radius);
            padding: 25px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
        }

        .title-text {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .counter-text {
            font-size: 2rem;
            font-weight: bold;
        }

        .table-section {
            background-color: var(--card-color);
            color: var(--text-color);
            border-radius: var(--border-radius);
            padding: 20px;
            overflow-x: auto;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        th, td {
            border: 1px solid #000000;
            padding: 12px 8px;
            font-size: 1rem;
        }

        th {
            background-color: #000000;
            color: #ffffff;
            font-weight: bold;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- D-Day 상단 카드 영역 -->
        <div class="dday-section" id="ddayContainer">
            <div class="title-text" id="mainTitle">로딩 중...</div>
            <div class="counter-text" id="counterDisplay">계산 중...</div>
        </div>

        <!-- 시간표 표 영역 -->
        <div class="table-section">
            <table id="timetable">
                <!-- 테이블 내용이 자바스크립트에 의해 동적으로 생성됩니다 -->
            </table>
        </div>
    </div>

    <script>
        // ==========================================
        // [여기에만 고치세요] 데이터 설정 영역 시작
        // ==========================================
        
        // 상단에 표시될 전체 시간표 제목
        const TITLE = '5학년 2학기 시간표';
        
        // 목표 이름과 목표 날짜 (연도-월-일 형식)
        const TARGET = { label: '겨울방학', date: '2026-12-17' };
        
        // 요일 목록 배열
        const DAYS = ['월', '화', '수', '목', '금'];
        
        // 교시별 시간 및 과목 목록 데이터 배열
        const PERIODS = [
            { time: '09:00', subjects: ['체육', '체육', '체육', '체육', '체육'] },
            { time: '10:00', subjects: ['체육', '체육', '체육', '체육', '체육'] },
            { time: '11:00', subjects: ['체육', '체육', '체육', '체육', '체육'] },
            { time: '13:00', subjects: ['체육', '체육', '체육', '체육', '체육'] },
            { time: '14:00', subjects: ['체육', '체육', '체육', '체육', '체육'] }
        ];

        // ==========================================
        // [여기에만 고치세요] 데이터 설정 영역 끝
        // ==========================================

        function updateDDay() {
            // 상단 제목 요소를 가져와서 설정된 TITLE 값을 넣습니다
            document.getElementById('mainTitle').innerText = TITLE;

            // 현재 날짜 객체를 생성합니다 (시간 정보는 00:00:00으로 초기화)
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            // 목표 날짜 문자열을 Date 객체로 변환합니다
            const targetDate = new Date(TARGET.date);
            targetDate.setHours(0, 0, 0, 0);

            // 두 날짜 사이의 시간 차이를 밀리초(ms) 단위로 구합니다
            const diffTime = targetDate - today;
            // 밀리초를 일(day) 단위로 변환합니다 (1일 = 24시간 * 60분 * 60초 * 1000밀리초)
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            // D-Day 화면 표시 요소를 가져옵니다
            const counterDisplay = document.getElementById('counterDisplay');

            // 남은 날짜에 따라 다르게 텍스트를 표시합니다
            if (diffDays > 0) {
                // 목표일이 아직 남은 경우
                counterDisplay.innerText = `${TARGET.label}까지 D-${diffDays}`;
            } else if (diffDays === 0) {
                // 오늘이 바로 목표일인 경우
                counterDisplay.innerText = `오늘은 바로 ${TARGET.label}입니다!`;
            } else {
                // 목표일이 이미 지난 경우
                counterDisplay.innerText = `${TARGET.label}로부터 D+${Math.abs(diffDays)} 지났습니다`;
            }
        }

        function renderTimetable() {
            // 테이블 요소를 가져옵니다
            const table = document.getElementById('timetable');
            // 기존 테이블 내용을 초기화합니다
            table.innerHTML = '';

            // 1. 테이블 헤더(thead) 생성 영역
            const thead = document.createElement('thead');
            const headerRow = document.createElement('tr');

            // '시간/요일' 타이틀 헤더 셀을 생성합니다
            const timeHeader = document.createElement('th');
            timeHeader.innerText = '교시';
            headerRow.appendChild(timeHeader);

            // 요일 배열을 반복하며 각 요일별 헤더 셀을 생성합니다
            for (let i = 0; i < DAYS.length; i++) {
                const th = document.createElement('th');
                th.innerText = DAYS[i];
                headerRow.appendChild(th);
            }
            thead.appendChild(headerRow);
            table.appendChild(thead);

            // 2. 테이블 본문(tbody) 생성 영역
            const tbody = document.createElement('tbody');

            // 교시 데이터 배열을 반복하여 각 행(row)을 생성합니다
            for (let i = 0; i < PERIODS.length; i++) {
                const periodData = PERIODS[i];
                const row = document.createElement('tr');

                // 행의 첫 번째 칸에 시간 및 교시 정보를 넣습니다
                const timeCell = document.createElement('td');
                timeCell.innerHTML = `<strong>${i + 1}교시</strong><br><small>${periodData.time}</small>`;
                row.appendChild(timeCell);

                // 해당 교시의 요일별 과목 데이터를 반복하여 칸을 생성합니다
                for (let j = 0; j < periodData.subjects.length; j++) {
                    const td = document.createElement('td');
                    td.innerText = periodData.subjects[j];
                    row.appendChild(td);
                }

                // 완성된 행을 본문에 추가합니다
                tbody.appendChild(row);
            }
            table.appendChild(tbody);
        }

        window.onload = function() {
            // 처음 페이지가 열릴 때 D-Day 카운터를 실행합니다
            updateDDay();
            // 시간표 화면을 생성합니다
            renderTimetable();

            // 1분(60000밀리초)마다 자동으로 D-Day 카운터를 갱신합니다
            setInterval(updateDDay, 60000);
        };
    </script>
</body>
</html>
