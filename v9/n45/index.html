<!DOCTYPE html> <!-- 이 문서는 HTML5 웹 표준으로 작성되었음을 브라우저에 알려줍니다 -->
<html lang="ko"> <!-- 웹페이지의 기본 언어를 한국어로 설정합니다 -->
<head>
    <meta charset="UTF-8"> <!-- 웹페이지가 한글과 특수문자를 깨지지 않게 읽도록 인코딩을 UTF-8로 지정합니다 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 모바일 기기 화면 크기에 맞게 자동으로 확대/축소되도록 설정합니다 -->
    <title>시간표 및 D-Day</title> <!-- 브라우저 탭에 표시되는 웹페이지의 제목입니다 -->
    <!-- 구글 폰트(Jua 주아체)를 불러오는 링크 태그입니다 -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        /* :root는 CSS에서 전역으로 사용할 변수들을 정의하는 공간입니다 */
        :root {
            --bg-color: #12161f;       /* [배경색] 늦은 밤 스터디 카페의 어둡고 차분한 배경 색상 */
            --card-color: #1744b5;     /* [칸 색상] 시간표 항목 및 카드들이 들어가는 깊고 진한 파란색 */
            --text-color: #e8ecf7;     /* [글자색] 어두운 배경에서 눈이 편안한 밝은 은빛 글자 색상 */
            --point-color: #39d5b1;    /* [포인트색] D-Day 카운터나 중요한 곳을 강조하는 민트색 */
        }

        /* 웹페이지 전체의 기본 스타일을 설정합니다 */
        body {
            background-color: var(--bg-color); /* 변수에 정의된 밤 배경색 적용 */
            color: var(--text-color);           /* 변수에 정의된 기본 글자색 적용 */
            font-family: 'Jua', sans-serif;    /* 구글 주아 폰트를 전체 글꼴로 지정 */
            margin: 0;                          /* 브라우저 기본 여백을 제거합니다 */
            padding: 20px;                      /* 화면 사방에 20픽셀의 여백을 줍니다 */
            display: flex;                      /* 내부 요소를 정렬하기 위해 플렉스박스 사용 */
            flex-direction: column;             /* 요소를 위에서 아래로 세로 배치합니다 */
            align-items: center;                /* 요소를 가로 기준 가운데로 정렬합니다 */
            min-height: 100vh;                  /* 최소 높이를 화면 꽉 차게 설정합니다 */
            box-sizing: border-box;             /* 패딩이 크기에 포함되도록 설정합니다 */
        }

        /* 화면 위쪽 D-Day 카운터 박스 디자인입니다 */
        .dday-box {
            background-color: var(--card-color); /* 카드의 진한 파란색 적용 */
            border-radius: 14px;                 /* 모서리를 14px 만큼 둥글게 깎습니다 */
            padding: 20px 40px;                  /* 안쪽 여백을 위아래 20, 양옆 40 지정 */
            text-align: center;                  /* 글자를 가운데로 정렬합니다 */
            margin-bottom: 25px;                 /* 아래쪽 요소와의 간격을 25px 줍니다 */
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); /* 은은한 그림자를 주어 입체감을 줍니다 */
            width: 100%;                         /* 너비를 꽉 채우되 */
            max-width: 450px;                    /* 최대 크기를 450px로 제한합니다 */
            box-sizing: border-box;              /* 패딩 포함 크기 계산 */
        }

        /* 목표 이름 글자 스타일 */
        .dday-title {
            font-size: 24px;                     /* 글자 크기를 24픽셀로 설정 */
            margin-bottom: 8px;                  /* 아래쪽 여백 8픽셀 */
        }

        /* 남은 날짜 숫자를 크게 보여주는 스타일 */
        .dday-count {
            font-size: 42px;                     /* 아주 큰 글자 크기 지정 */
            color: var(--point-color);           /* 강조 포인트 민트색 적용 */
        }

        /* 월~금 요일 선택 탭 버튼들을 감싸는 영역 */
        .tab-container {
            display: flex;                       /* 버튼들을 가로로 나란히 배치 */
            gap: 10px;                           /* 버튼 사이의 간격을 10px로 설정 */
            margin-bottom: 15px;                 /* 아래 시간표와의 간격 */
            flex-wrap: wrap;                     /* 화면이 좁으면 줄바꿈 허용 */
            justify-content: center;             /* 가운데 정렬 */
            max-width: 500px;
            width: 100%;
        }

        /* 개별 요일 탭 버튼 디자인 */
        .tab-btn {
            background-color: #1c2333;           /* 평소에는 어두운 버튼 배경색 */
            color: var(--text-color);            /* 글자색 */
            border: 2px solid var(--card-color); /* 테두리를 파란색으로 지정 */
            padding: 10px 18px;                  /* 버튼 안쪽 여백 */
            border-radius: 14px;                 /* 모서리를 14px 둥글게 */
            font-family: 'Jua', sans-serif;      /* 주아 폰트 적용 */
            font-size: 18px;                     /* 글자 크기 18px */
            cursor: pointer;                     /* 마우스 올렸을 때 손가락 모양으로 변경 */
            transition: 0.2s;                    /* 부드러운 효과 전환 시간 */
        }

        /* 마우스를 올렸을 때 버튼 효과 */
        .tab-btn:hover {
            background-color: var(--card-color); /* 파란색으로 채워짐 */
        }

        /* 현재 선택된 활성 요일 탭 버튼 스타일 */
        .tab-btn.active {
            background-color: var(--point-color); /* 포인트 민트색으로 채우기 */
            color: var(--bg-color);              /* 글자는 어두운 배경색으로 반전 */
            border-color: var(--point-color);    /* 테두리도 민트색으로 일치 */
        }

        /* 시간표 표를 감싸는 영역입니다 */
        .timetable-box {
            background-color: var(--card-color); /* 진한 파란색 박스 배경 */
            border-radius: 14px;                 /* 모서리를 14px 둥글게 */
            padding: 20px;                       /* 안쪽 여백 20픽셀 */
            width: 100%;                         /* 너비 100% */
            max-width: 450px;                    /* 최대 너비 450px 제한 */
            box-sizing: border-box;              /* 박스 크기 계산 방식 */
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); /* 그림자 효과 */
            text-align: center;                  /* 내용 가운데 정렬 */
        }

        /* 현재 선택된 요일 제목 표시 영역 */
        .current-day-title {
            font-size: 22px;                     /* 글자 크기 22px */
            margin-bottom: 15px;                 /* 아래쪽 간격 */
            color: var(--point-color);           /* 포인트 색상 적용 */
        }

        /* 시간표 목록을 세로로 나열하는 영역 */
        .period-list {
            display: flex;                       /* 세로 정렬을 위한 플렉스 */
            flex-direction: column;              /* 위에서 아래로 정렬 */
            gap: 10px;                           /* 교시 사이 간격 10px */
        }

        /* 각각의 교시 한 줄에 대한 디자인 */
        .period-row {
            background-color: rgba(0, 0, 0, 0.2); /* 투명한 검은색을 깔아 구분감 부여 */
            border-radius: 10px;                 /* 모서리 둥글기 */
            padding: 12px 15px;                  /* 안쪽 여백 */
            display: flex;                       /* 시간과 과목을 가로로 배치 */
            justify-content: space-between;      /* 양 끝으로 정렬 */
            align-items: center;                 /* 세로 중앙 정렬 */
            font-size: 18px;                     /* 글자 크기 18px */
            border: 2px solid transparent;       /* 평소에는 투명한 테두리 */
            transition: 0.2s;                    /* 부드러운 전환 효과 */
        }

        /* 현재 시각에 해당하는 교시에 적용될 강조 테두리 (형광펜 효과) */
        .period-row.highlight {
            border: 2px solid var(--point-color); /* 포인트 민트색 테두리 */
            background-color: rgba(57, 213, 177, 0.15); /* 배경도 민트색 빛으로 은은하게 채움 */
        }

        /* 주말일 때 안내 문구를 보여주는 스타일 */
        .weekend-msg {
            font-size: 20px;                     /* 글자 크기 20px */
            color: var(--point-color);           /* 포인트 민트색 */
            padding: 30px 0;                     /* 위아래 여백 */
        }
    </style>
</head>
<body>

    <!-- 화면 위쪽 D-Day 카운터 영역 -->
    <div class="dday-box">
        <div class="dday-title" id="dday-title-text">목표</div> <!-- 목표 이름이 표시되는 칸 -->
        <div class="dday-count" id="dday-count-text">D-0</div> <!-- 남은 날짜가 표시되는 칸 -->
    </div>

    <!-- 월~금 요일 탭 버튼들이 들어갈 자리 -->
    <div class="tab-container" id="tab-container"></div>

    <!-- 아래쪽 요일별 시간표 표 영역 -->
    <div class="timetable-box">
        <div class="current-day-title" id="day-title">요일</div> <!-- 선택된 요일 이름 표시 -->
        <div class="period-list" id="period-list"></div> <!-- 시간표 교시들이 출력되는 곳 -->
    </div>

    <script>
        // ==========================================
        // [여기만 고치세요] 데이터와 설정을 수정하는 곳입니다
        // ==========================================
        const TITLE  = '6학년 2학기';                       // 목표의 이름 
        const TARGET = { label:'졸업', date:'2026-12-31' };     // 목표의 세부 내용과 D-Day 목표 날짜 (년-월-일)
        const DAYS   = ['월','화','수','목','금'];             // 시간표를 표시할 요일 목록
        const PERIODS = [
            { time:'09:00', subjects:['수학', '수학', '사회', '체육', '수학'] }, // 1교시 시간과 월~금 과목순서
            { time:'10:00', subjects:['체육', '사회', '국어', '국어', '과학'] }, // 2교시 시간과 월~금 과목순서
            { time:'11:00', subjects:['미술', '과학', '수학', '수학', '미술'] }, // 3교시 시간과 월~금 과목순서
            { time:'13:00', subjects:['국어', '국어', '체육', '동아리', '사회'] }, // 4교시 시간과 월~금 과목순서
            { time:'14:00', subjects:['사회', '체육', '음악', '음악', '국어'] }, // 5교시 시간과 월~금 과목순서
        ];
        // ==========================================

        let currentDayIndex = 0; // 현재 선택된 요일의 번호 (0: 월요일, 1: 화요일 ...)

        // D-Day 계산 및 화면에 표시하는 함수
        function updateDday() {
            const titleEl = document.getElementById('dday-title-text'); // D-Day 제목 요소 가져오기
            const countEl = document.getElementById('dday-count-text'); // D-Day 숫자 요소 가져오기

            titleEl.textContent = `${TITLE} ${TARGET.label}까지`; // 제목 텍스트 조합

            const today = new Date(); // 오늘 날짜 가져오기
            const targetDate = new Date(TARGET.date); // 목표 날짜 생성
            
            // 시차 계산을 위해 자정 기준으로 시간 초기화
            today.setHours(0,0,0,0);
            targetDate.setHours(0,0,0,0);

            const diffTime = targetDate - today; // 목표일과 오늘 날짜의 시간 차이 계산
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); // 밀리초를 일(day) 단위로 변환

            // 남은 날짜에 따라 문구 다르게 표시
            if (diffDays > 0) {
                countEl.textContent = `D-${diffDays}`;
            } else if (diffDays === 0) {
                countEl.textContent = `D-Day!`;
            } else {
                countEl.textContent = `D+${Math.abs(diffDays)}`;
            }
        }

        // 요일 탭 버튼을 화면에 그려주는 함수
        function renderTabs() {
            const container = document.getElementById('tab-container'); // 탭을 담을 부모 요소
            container.innerHTML = ''; // 기존 내용을 초기화

            DAYS.forEach((day, index) => {
                const btn = document.createElement('button'); // 버튼 생성
                btn.className = `tab-btn ${index === currentDayIndex ? 'active' : ''}`; // 현재 선택된 탭이면 active 클래스 추가
                btn.textContent = `${day}요일`; // 버튼 이름 설정 (예: 월요일)
                btn.onclick = () => {
                    currentDayIndex = index; // 누른 요일의 번호로 변경
                    renderTabs();            // 탭 다시 그리기
                    renderTimetable();       // 시간표 다시 그리기
                };
                container.appendChild(btn); // 컨테이너에 버튼 추가
            });
        }

        // 선택된 요일의 시간표를 화면에 그려주는 함수
        function renderTimetable() {
            const dayTitleEl = document.getElementById('day-title'); // 요일 제목 요소
            const listEl = document.getElementById('period-list'); // 시간표 목록 요소
            listEl.innerHTML = ''; // 기존 내용 초기화

            const selectedDayName = DAYS[currentDayIndex]; // 현재 선택된 요일 이름 (예: '월')
            dayTitleEl.textContent = `${selectedDayName}요일 시간표`; // 제목 표시

            // 현재 실제 날짜와 시각 확인
            const now = new Date();
            const realDay = now.getDay(); // 0: 일요일, 1: 월요일 ... 5: 금요일, 6: 토요일
            const currentHours = now.getHours(); // 현재 시
            const currentMinutes = now.getMinutes(); // 현재 분
            const currentTimeNum = currentHours * 60 + currentMinutes; // 시간을 분 단위로 환산하여 비교 용이하게 함

            // 오늘이 월~금 중 어느 요일인지 확인 (월:1 ~ 금:5)
            const isToday = (realDay >= 1 && realDay <= 5 && (realDay - 1) === currentDayIndex);

            PERIODS.forEach((period, periodIndex) => {
                const row = document.createElement('div'); // 교시 한 줄을 위한 div 생성
                row.className = 'period-row';

                const subjectName = period.subjects[currentDayIndex]; // 해당 교시의 과목명

                // 시간 문자열(예: '09:00')을 분 단위 숫자로 변환
                const [pHour, pMin] = period.time.split(':').map(Number);
                const periodTimeNum = pHour * 60 + pMin;
                
                // 현재 시각이 해당 교시 범위 내인지 체크 (시작 시간 ~ 시작 시간 + 60분 사이)
                if (isToday && currentTimeNum >= periodTimeNum && currentTimeNum < periodTimeNum + 60) {
                    row.classList.add('highlight'); // 현재 교시면 테두리 강조 클래스 추가
                }

                // 시간과 과목 이름을 담아서 HTML에 추가
                row.innerHTML = `
                    <span>${period.time} (${periodIndex + 1}교시)</span>
                    <strong>${subjectName}</strong>
                `;
                listEl.appendChild(row);
            });
        }

        // 페이지가 처음 열렸을 때 실행되는 초기화 함수
        function init() {
            // 접속한 요일이 주말(토요일:6, 일요일:0)이거나 평일이면 초기 탭 자동 지정
            const realDay = new Date().getDay();
            if (realDay >= 1 && realDay <= 5) {
                currentDayIndex = realDay - 1; // 오늘이 평일이면 오늘 요일로 기본 선택
            } else {
                currentDayIndex = 0; // 주말이면 기본으로 월요일 선택
            }

            updateDday();      // D-Day 계산 실행
            renderTabs();      // 탭 버튼 생성
            renderTimetable(); // 시간표 생성
        }

        init(); // 초기화 함수 호출

        // 1분(60000밀리초)마다 자동으로 시간표 강조 및 D-Day를 갱신합니다
        setInterval(() => {
            updateDday();
            renderTimetable();
        }, 60000);
    </script>
</body>
</html>
