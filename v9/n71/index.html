<!DOCTYPE html>
<!-- 이 문서가 HTML5 문서임을 알려줍니다. -->
<html lang="ko">
<!-- 문서의 언어를 한국어로 설정합니다. -->

<head>
  <!-- 한글이 깨지지 않도록 문자 인코딩을 설정합니다. -->
  <meta charset="UTF-8">
  <!-- 휴대폰에서도 화면이 알맞게 보이도록 설정합니다. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 브라우저 탭에 표시될 제목입니다. -->
  <title>방학표</title>

  <!-- 구글 폰트를 사용하기 위해 연결을 미리 준비합니다. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <!-- 구글 폰트 서버와 연결합니다. -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Orbitron 폰트를 불러옵니다. -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* 전체 디자인에서 사용하는 색상과 크기를 모아둡니다. */
    :root {
      /* 화면 전체의 배경 색상입니다. */
      --bg-color: #325cbd;
      /* 시간표와 D-Day 칸의 색상입니다. */
      --cell-color: #8a0a41;
      /* 기본 글자 색상입니다. */
      --text-color: #ff7300;
      /* 중요한 내용을 강조하는 색상입니다. */
      --point-color: #00ff4c;
      /* 모든 모서리를 둥글게 만드는 정도입니다. */
      --radius: 14px;
    }

    /* 모든 요소의 크기 계산 방식을 통일합니다. */
    * {
      box-sizing: border-box;
    }

    /* 페이지 전체의 기본 디자인을 설정합니다. */
    body {
      /* 브라우저가 자동으로 넣는 바깥 여백을 없앱니다. */
      margin: 0;
      /* 화면 가장자리와 내용 사이에 여백을 만듭니다. */
      padding: 30px 20px;
      /* 페이지 배경 색상을 적용합니다. */
      background: var(--bg-color);
      /* 기본 글자 색상을 적용합니다. */
      color: var(--text-color);
      /* Orbitron 폰트를 적용합니다. */
      font-family: 'Orbitron', sans-serif;
    }

    /* 전체 내용을 가운데에 배치합니다. */
    .container {
      /* 내용이 너무 넓어지지 않도록 최대 너비를 정합니다. */
      max-width: 1000px;
      /* 좌우 여백을 자동으로 만들어 가운데 정렬합니다. */
      margin: 0 auto;
    }

    /* 페이지 제목을 꾸밉니다. */
    h1 {
      /* 제목을 가운데 정렬합니다. */
      text-align: center;
      /* 제목의 글자 크기를 정합니다. */
      font-size: 2.5rem;
      /* 제목 아래에 여백을 만듭니다. */
      margin: 0 0 25px;
    }

    /* D-Day 전체 영역을 꾸밉니다. */
    #countdown {
      /* D-Day 영역의 배경 색상입니다. */
      background: var(--cell-color);
      /* 모서리를 둥글게 만듭니다. */
      border-radius: var(--radius);
      /* 영역 안쪽에 여백을 만듭니다. */
      padding: 35px 20px;
      /* 내용을 가운데 정렬합니다. */
      text-align: center;
      /* 시간표와의 간격을 만듭니다. */
      margin-bottom: 30px;
    }

    /* 목표 이름을 꾸밉니다. */
    #target-label {
      /* 목표 이름을 한 줄 영역으로 만듭니다. */
      display: block;
      /* 목표 이름의 글자 크기를 정합니다. */
      font-size: 1.3rem;
      /* 목표 이름과 D-Day 사이의 간격입니다. */
      margin-bottom: 15px;
    }

    /* D-Day 숫자를 크게 표시합니다. */
    #days-left {
      /* 화면 크기에 따라 숫자 크기를 조절합니다. */
      font-size: clamp(3rem, 10vw, 7rem);
      /* 숫자를 굵게 표시합니다. */
      font-weight: 700;
      /* 숫자를 포인트 색상으로 표시합니다. */
      color: var(--point-color);
      /* 숫자가 줄바꿈되지 않도록 합니다. */
      white-space: nowrap;
    }

    /* 시간표를 감싸는 영역입니다. */
    .table-wrap {
      /* 화면이 작으면 시간표를 가로로 움직일 수 있게 합니다. */
      overflow-x: auto;
      /* 바깥쪽 모서리를 둥글게 만듭니다. */
      border-radius: var(--radius);
    }

    /* 시간표 전체를 꾸밉니다. */
    table {
      /* 셀 사이의 테두리를 하나로 합칩니다. */
      border-collapse: collapse;
      /* 표의 너비를 화면에 맞춥니다. */
      width: 100%;
      /* 너무 좁아지지 않도록 최소 너비를 정합니다. */
      min-width: 700px;
      /* 표의 배경 색상을 적용합니다. */
      background: var(--cell-color);
      /* 표의 모서리를 둥글게 만듭니다. */
      border-radius: var(--radius);
      /* 표 밖으로 내용이 튀어나가지 않게 합니다. */
      overflow: hidden;
    }

    /* 표의 모든 칸을 꾸밉니다. */
    th,
    td {
      /* 칸 사이에 포인트 색상의 선을 만듭니다. */
      border: 1px solid var(--point-color);
      /* 칸 안쪽에 여백을 만듭니다. */
      padding: 18px 12px;
      /* 칸의 글자를 가운데 정렬합니다. */
      text-align: center;
    }

    /* 요일 머리글을 꾸밉니다. */
    th {
      /* 요일을 포인트 색상으로 표시합니다. */
      color: var(--point-color);
      /* 요일을 굵게 표시합니다. */
      font-weight: 700;
    }

    /* 시간 칸을 꾸밉니다. */
    td:first-child {
      /* 시간을 포인트 색상으로 표시합니다. */
      color: var(--point-color);
      /* 시간을 굵게 표시합니다. */
      font-weight: 600;
    }

    /* 작은 화면을 위한 디자인입니다. */
    @media (max-width: 600px) {
      /* 작은 화면에서는 페이지 여백을 줄입니다. */
      body {
        padding: 20px 12px;
      }

      /* 작은 화면에서는 제목을 조금 작게 만듭니다. */
      h1 {
        font-size: 1.8rem;
      }

      /* 작은 화면에서는 D-Day 영역의 여백을 줄입니다. */
      #countdown {
        padding: 25px 15px;
      }
    }
  </style>
</head>

<body>
  <!-- 화면의 전체 내용을 담는 영역입니다. -->
  <div class="container">

    <!-- JS에서 입력한 제목을 이곳에 표시합니다. -->
    <h1 id="title"></h1>

    <!-- D-Day를 보여주는 영역입니다. -->
    <section id="countdown">
      <!-- JS에서 입력한 목표 이름을 표시합니다. -->
      <span id="target-label"></span>
      <!-- 남은 날짜를 표시합니다. -->
      <div id="days-left"></div>
    </section>

    <!-- 시간표가 들어가는 영역입니다. -->
    <div class="table-wrap">
      <!-- JS가 시간표 내용을 자동으로 만들어 넣습니다. -->
      <table id="schedule"></table>
    </div>

  </div>

  <script>
    // ============================================
    // 여기만 고치세요
    // ============================================

    // 화면 위쪽에 표시할 제목입니다.
    const TITLE = '방학표';

    // D-Day의 목표 이름과 날짜입니다.
    const TARGET = { label: '생일', date: '2027-04-08' };

    // 시간표에 사용할 요일입니다.
    const DAYS = ['월', '화', '수', '목', '금'];

    // 시간표의 교시와 과목입니다.
    const PERIODS = [
      { time: '09:00', subjects: ['개강식', '게임 시간', '수학', '공부', '방학식'] },
      { time: '11:00', subjects: ['요리하기', '자기', '국어', '게임 시간', '취미생활'] },
      { time: '13:00', subjects: ['텔레비전보기', '뒹글기', '과학', '견학', '산책'] },
      { time: '14:00', subjects: ['공부', '놀이터에서놀기', '사회', '견학', '자기'] },
      { time: '17:00', subjects: ['컴퓨터', '미술', '게임 시간', '놀이터에서 놀기', '게임 시간'] }
    ];

    // ============================================
    // 여기부터는 기능 코드입니다.
    // ============================================

    // 제목을 화면에 표시합니다.
    document.getElementById('title').textContent = TITLE;

    // 목표 이름을 화면에 표시합니다.
    document.getElementById('target-label').textContent = TARGET.label;

    // 오늘 날짜와 목표 날짜의 차이를 계산하는 함수입니다.
    function updateDDay() {
      // 현재 날짜와 시간을 가져옵니다.
      const today = new Date();

      // 목표 날짜를 가져옵니다.
      const targetDate = new Date(TARGET.date + 'T00:00:00');

      // 두 날짜의 차이를 밀리초 단위로 계산합니다.
      const difference = targetDate - today;

      // 밀리초를 하루 단위로 바꿉니다.
      const days = Math.ceil(difference / (1000 * 60 * 60 * 24));

      // D-Day 숫자를 표시할 요소를 가져옵니다.
      const daysLeft = document.getElementById('days-left');

      // 목표 날짜가 이미 지났는지 확인합니다.
      if (days < 0) {
        // 목표 날짜가 지난 경우 지나간 날짜를 표시합니다.
        daysLeft.textContent = 'D+' + Math.abs(days);
      } else if (days === 0) {
        // 목표 날짜가 오늘이면 D-DAY를 표시합니다.
        daysLeft.textContent = 'D-DAY';
      } else {
        // 목표 날짜가 남아 있으면 D-Day 숫자를 표시합니다.
        daysLeft.textContent = 'D-' + days;
      }
    }

    // 처음 화면을 열었을 때 D-Day를 계산합니다.
    updateDDay();

    // 하루에 한 번 D-Day를 다시 계산합니다.
    setInterval(updateDDay, 1000 * 60 * 60);

    // 시간표 표를 가져옵니다.
    const schedule = document.getElementById('schedule');

    // 표의 머리글을 만듭니다.
    const headerRow = document.createElement('tr');

    // 시간이라는 첫 번째 머리글을 만듭니다.
    const timeHeader = document.createElement('th');

    // 첫 번째 머리글에 시간이라는 글자를 넣습니다.
    timeHeader.textContent = '시간';

    // 첫 번째 머리글을 표에 추가합니다.
    headerRow.appendChild(timeHeader);

    // 월요일부터 금요일까지 머리글을 만듭니다.
    DAYS.forEach(day => {
      // 새로운 머리글 칸을 만듭니다.
      const th = document.createElement('th');

      // 머리글 칸에 요일을 넣습니다.
      th.textContent = day;

      // 만든 머리글 칸을 표에 추가합니다.
      headerRow.appendChild(th);
    });

    // 완성된 머리글을 표에 추가합니다.
    schedule.appendChild(headerRow);

    // 각 교시를 표의 한 줄로 만듭니다.
    PERIODS.forEach(period => {
      // 새로운 표 행을 만듭니다.
      const row = document.createElement('tr');

      // 시간 칸을 만듭니다.
      const timeCell = document.createElement('td');

      // 시간 칸에 시간을 넣습니다.
      timeCell.textContent = period.time;

      // 시간 칸을 행에 추가합니다.
      row.appendChild(timeCell);

      // 월요일부터 금요일까지 과목을 넣습니다.
      period.subjects.forEach(subject => {
        // 새로운 과목 칸을 만듭니다.
        const cell = document.createElement('td');

        // 과목 이름을 칸에 넣습니다.
        cell.textContent = subject;

        // 과목 칸을 행에 추가합니다.
        row.appendChild(cell);
      });

      // 완성된 행을 표에 추가합니다.
      schedule.appendChild(row);
    });
  </script>
</body>
</html>
