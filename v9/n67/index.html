<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인터랙티브 스마트 시간표</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .editable-cell:focus {
            outline: 2px solid #3b82f6;
            background-color: #eff6ff !important;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <header class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 text-white p-2.5 rounded-xl shadow-md">
                    <i class="fa-solid fa-calendar-days text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-900" id="timetable-title-display">나만의 스마트 시간표</h1>
                    <p class="text-xs text-slate-500">칸을 클릭하여 자유롭게 내용을 입력하고 관리하세요</p>
                </div>
            </div>

            <div class="flex flex-wrap items-center gap-2">
                <button onclick="openSettingsModal()" class="inline-flex items-center gap-1.5 px-3.5 py-2 text-sm font-medium text-slate-700 bg-white border border-slate-300 rounded-lg hover:bg-slate-50 transition shadow-sm">
                    <i class="fa-solid fa-gear text-slate-500"></i> 설정
                </button>
                <button onclick="resetTimetable()" class="inline-flex items-center gap-1.5 px-3.5 py-2 text-sm font-medium text-rose-700 bg-rose-50 border border-rose-200 rounded-lg hover:bg-rose-100 transition">
                    <i class="fa-solid fa-rotate-right"></i> 초기화
                </button>
                <button onclick="saveTimetable()" class="inline-flex items-center gap-1.5 px-4 py-2 text-sm font-medium text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 transition shadow-sm">
                    <i class="fa-solid fa-floppy-disk"></i> 저장하기
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-6 sm:px-6 flex flex-col gap-6">
        
        <!-- Toast Notification Banner -->
        <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-xl flex items-center gap-3 text-sm">
            <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400"></i>
            <span id="toast-message">변경사항이 저장되었습니다.</span>
        </div>

        <!-- Cell Style Toolbar -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-2 text-sm text-slate-600">
                <span class="inline-block w-3 h-3 rounded-full bg-indigo-500"></span>
                <span>셀을 클릭하고 텍스트를 바로 입력할 수 있습니다. 줄바꿈도 지원됩니다.</span>
            </div>
            <div class="flex items-center gap-3">
                <label for="cell-color-picker" class="text-sm font-medium text-slate-600">셀 배경색:</label>
                <input type="color" id="cell-color-picker" value="#eff6ff" class="w-9 h-9 rounded-lg border border-slate-300 cursor-pointer p-1 bg-white">
                <button onclick="applyCellColor()" class="px-3 py-1.5 text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg transition border border-slate-300">색상 적용</button>
                <button onclick="clearCellColor()" class="px-3 py-1.5 text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg transition border border-slate-300">색상 제거</button>
            </div>
        </div>

        <!-- Timetable Wrapper -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex-grow flex flex-col">
            <div class="overflow-x-auto flex-grow">
                <table id="timetable" class="w-full border-collapse min-w-[700px]">
                    <thead id="timetable-head" class="bg-slate-100 text-slate-700 uppercase text-xs tracking-wider"></thead>
                    <tbody id="timetable-body" class="divide-y divide-slate-200 text-sm"></tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="settings-modal" class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden border border-slate-200 transform transition-all">
            <div class="px-6 py-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                <h3 class="font-bold text-slate-900 text-lg">시간표 구조 설정</h3>
                <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">시간표 제목</label>
                    <input type="text" id="modal-title-input" class="w-full px-3.5 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">요일 설정 (쉼표로 구분)</label>
                    <input type="text" id="modal-days-input" class="w-full px-3.5 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">교시 / 시간대 목록 (쉼표로 구분)</label>
                    <textarea id="modal-periods-input" rows="3" class="w-full px-3.5 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm"></textarea>
                </div>
            </div>
            <div class="px-6 py-4 bg-slate-50 border-t border-slate-200 flex justify-end gap-2">
                <button onclick="closeSettingsModal()" class="px-4 py-2 text-sm font-medium text-slate-700 bg-white border border-slate-300 rounded-xl hover:bg-slate-50 transition">취소</button>
                <button onclick="saveSettings()" class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 transition shadow-sm">적용하기</button>
            </div>
        </div>
    </div>

    <script>
        let timetableData = {
            title: "나만의 스마트 시간표",
            days: ["월", "화", "수", "목", "금"],
            periods: [
                "1교시\n09:00 - 09:50",
                "2교시\n10:00 - 10:50",
                "3교시\n11:00 - 11:50",
                "점심시간\n12:00 - 13:00",
                "4교시\n13:00 - 13:50",
                "5교시\n14:00 - 14:50",
                "6교시\n15:00 - 15:50"
            ],
            cells: {}
        };

        let activeSelectedCell = null;

        window.onload = function() {
            loadFromStorage();
            renderTimetable();
        };

        function renderTimetable() {
            document.getElementById('timetable-title-display').innerText = timetableData.title;

            const thead = document.getElementById('timetable-head');
            const tbody = document.getElementById('timetable-body');

            thead.innerHTML = '';
            tbody.innerHTML = '';

            let headerRow = document.createElement('tr');
            let thTime = document.createElement('th');
            thTime.className = "px-4 py-3.5 text-center font-semibold text-slate-600 border-b border-r border-slate-200 w-36 bg-slate-50";
            thTime.innerText = "시간 / 교시";
            headerRow.appendChild(thTime);

            timetableData.days.forEach(day => {
                let th = document.createElement('th');
                th.className = "px-4 py-3.5 text-center font-semibold text-slate-700 border-b border-r border-slate-200";
                th.innerText = day;
                headerRow.appendChild(th);
            });
            thead.appendChild(headerRow);

            timetableData.periods.forEach((period, rIndex) => {
                let tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50/50 transition";

                let tdPeriod = document.createElement('td');
                tdPeriod.className = "px-3 py-3 text-center font-medium text-slate-600 border-r border-slate-200 bg-slate-50/80 whitespace-pre-line text-xs sm:text-sm";
                tdPeriod.innerText = period;
                tr.appendChild(tdPeriod);

                timetableData.days.forEach((day, cIndex) => {
                    let td = document.createElement('td');
                    td.className = "p-2 border-r border-slate-200 text-center relative h-24 align-middle transition cursor-pointer editable-cell";
                    td.setAttribute('contenteditable', 'true');
                    td.dataset.row = rIndex;
                    td.dataset.col = cIndex;

                    let cellKey = `${rIndex}-${cIndex}`;
                    if (timetableData.cells[cellKey]) {
                        td.innerHTML = timetableData.cells[cellKey].text || '';
                        if (timetableData.cells[cellKey].bg) {
                            td.style.backgroundColor = timetableData.cells[cellKey].bg;
                        }
                    }

                    td.addEventListener('focus', function() {
                        activeSelectedCell = td;
                    });

                    td.addEventListener('input', function() {
                        if (!timetableData.cells[cellKey]) {
                            timetableData.cells[cellKey] = {};
                        }
                        timetableData.cells[cellKey].text = td.innerHTML;
                    });

                    tr.appendChild(td);
                });

                tbody.appendChild(tr);
            });
        }

        function applyCellColor() {
            if (!activeSelectedCell) {
                showToast("색상을 변경할 셀을 먼저 선택해주세요.", "error");
                return;
            }
            const color = document.getElementById('cell-color-picker').value;
            activeSelectedCell.style.backgroundColor = color;
            
            let r = activeSelectedCell.dataset.row;
            let c = activeSelectedCell.dataset.col;
            let key = `${r}-${c}`;
            if (!timetableData.cells[key]) timetableData.cells[key] = {};
            timetableData.cells[key].bg = color;
            showToast("셀 배경색이 적용되었습니다.");
        }

        function clearCellColor() {
            if (!activeSelectedCell) {
                showToast("색상을 초기화할 셀을 먼저 선택해주세요.", "error");
                return;
            }
            activeSelectedCell.style.backgroundColor = '';
            let r = activeSelectedCell.dataset.row;
            let c = activeSelectedCell.dataset.col;
            let key = `${r}-${c}`;
            if (timetableData.cells[key]) {
                delete timetableData.cells[key].bg;
            }
            showToast("셀 배경색이 제거되었습니다.");
        }

        function saveTimetable() {
            const cells = document.querySelectorAll('#timetable-body td.editable-cell');
            cells.forEach(td => {
                let r = td.dataset.row;
                let c = td.dataset.col;
                let key = `${r}-${c}`;
                if (!timetableData.cells[key]) timetableData.cells[key] = {};
                timetableData.cells[key].text = td.innerHTML;
            });

            localStorage.setItem('smart_timetable_data', JSON.stringify(timetableData));
            showToast("시간표가 저장되었습니다!");
        }

        function loadFromStorage() {
            const saved = localStorage.getItem('smart_timetable_data');
            if (saved) {
                try {
                    timetableData = JSON.parse(saved);
                } catch(e) {
                    console.error("Failed to parse saved data", e);
                }
            }
        }

        function resetTimetable() {
            if (confirm("정말로 모든 내용을 초기화하시겠습니까?")) {
                localStorage.removeItem('smart_timetable_data');
                timetableData = {
                    title: "나만의 스마트 시간표",
                    days: ["월", "화", "수", "목", "금"],
                    periods: [
                        "1교시\n09:00 - 09:50",
                        "2교시\n10:00 - 10:50",
                        "3교시\n11:00 - 11:50",
                        "점심시간\n12:00 - 13:00",
                        "4교시\n13:00 - 13:50",
                        "5교시\n14:00 - 14:50",
                        "6교시\n15:00 - 15:50"
                    ],
                    cells: {}
                };
                renderTimetable();
                showToast("시간표가 초기화되었습니다.", "error");
            }
        }

        function openSettingsModal() {
            document.getElementById('modal-title-input').value = timetableData.title;
            document.getElementById('modal-days-input').value = timetableData.days.join(', ');
            document.getElementById('modal-periods-input').value = timetableData.periods.map(p => p.replace(/\n/g, ' ')).join(', ');
            document.getElementById('settings-modal').classList.remove('hidden');
        }

        function closeSettingsModal() {
            document.getElementById('settings-modal').classList.add('hidden');
        }

        function saveSettings() {
            const newTitle = document.getElementById('modal-title-input').value.trim();
            const newDays = document.getElementById('modal-days-input').value.split(',').map(s => s.trim()).filter(Boolean);
            const newPeriodsRaw = document.getElementById('modal-periods-input').value.split(',').map(s => s.trim()).filter(Boolean);

            if (newTitle) timetableData.title = newTitle;
            if (newDays.length > 0) timetableData.days = newDays;
            if (newPeriodsRaw.length > 0) {
                timetableData.periods = newPeriodsRaw.map(p => p.replace(' ', '\n'));
            }

            renderTimetable();
            closeSettingsModal();
            saveTimetable();
            showToast("시간표 설정이 업데이트되었습니다.");
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');
            const toastIcon = document.getElementById('toast-icon');

            toastMessage.innerText = message;
            if (type === 'error') {
                toastIcon.className = "fa-solid fa-circle-exclamation text-rose-400";
            } else {
                toastIcon.className = "fa-solid fa-circle-check text-emerald-400";
            }

            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
    </script>
</body>
</html>
