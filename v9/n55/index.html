<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이세용 학생의 알록달록 주간 시간표</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Jua for cute elementary school style) -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Jua', sans-serif;
            background: linear-gradient(135deg, #fbcfe8 0%, #bae6fd 50%, #fef08a 100%);
            min-height: 100vh;
        }
        .cute-shadow {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="p-4 sm:p-6 md:p-8">

    <div class="max-w-5xl mx-auto">
        <!-- 상단 헤더 및 D-Day 카운터 -->
        <header class="bg-white/90 backdrop-blur rounded-3xl p-6 mb-6 cute-shadow text-center border-4 border-pink-300">
            <h1 class="text-3xl sm:text-4xl text-pink-600 mb-2 drop-shadow">✨ 이세용 학생의 4학년 주간 시간표 ✨</h1>
            <p class="text-gray-600 text-sm sm:text-base mb-4">오늘도 즐겁고 신나는 하루를 시작해볼까요? 화이팅!</p>
            
            <!-- D-Day 카운터 영역 (여기만 고치세요: 소중한 날짜 설정) -->
            <div id="dday-container" class="inline-block bg-yellow-100 border-2 border-yellow-300 rounded-2xl px-6 py-3">
                <span id="dday-title" class="text-yellow-800 text-lg font-bold">🎉 다음 소중한 날(예: 소풍/방학)까지: </span>
                <span id="dday-count" class="text-pink-600 text-xl font-extrabold animate-pulse">계산중...</span>
            </div>
        </header>

        <!-- 선생님 이름 및 정보 입력 영역 -->
        <section class="bg-white/90 backdrop-blur rounded-3xl p-5 mb-6 cute-shadow border-4 border-blue-300 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <span class="text-3xl">👩‍🏫</span>
                <div>
                    <label for="teacher-name" class="block text-sm text-gray-500 font-bold">우리반 선생님 성함</label>
                    <input type="text" id="teacher-name" value="김선생님" class="text-xl font-bold text-blue-600 border-b-2 border-blue-400 focus:outline-none bg-transparent px-1 w-40 text-center">
                </div>
            </div>
            <div class="flex items-center gap-3">
                <span class="text-3xl">🏫</span>
                <div>
                    <label for="class-info" class="block text-sm text-gray-500 font-bold">학년/반 정보</label>
                    <input type="text" id="class-info" value="4학년 2반" class="text-xl font-bold text-indigo-600 border-b-2 border-indigo-400 focus:outline-none bg-transparent px-1 w-40 text-center">
                </div>
            </div>
            <button onclick="saveInfo()" class="bg-gradient-to-r from-pink-400 to-purple-400 text-white font-bold px-6 py-2 rounded-2xl shadow hover:scale-105 transition-transform">
                저장하기 💾
            </button>
        </section>

        <!-- 주간 시간표 본문 (월~금) -->
        <main class="bg-white/95 backdrop-blur rounded-3xl p-4 sm:p-6 cute-shadow border-4 border-purple-300 overflow-x-auto">
            <div class="min-w-[700px]">
                <table class="w-full border-collapse">
                    <thead>
                        <tr class="bg-purple-100 text-purple-800 rounded-xl">
                            <th class="p-3 rounded-l-2xl w-20">교시</th>
                            <th class="p-3">월요일</th>
                            <th class="p-3">화요일</th>
                            <th class="p-3">수요일</th>
                            <th class="p-3">목요일</th>
                            <th class="p-3 rounded-r-2xl">금요일</th>
                        </tr>
                    </thead>
                    <tbody id="timetable-body" class="text-center text-gray-700">
                        <!-- 자바스크립트에 의해 시간표 데이터가 동적으로 채워집니다 -->
                    </tbody>
                </table>
            </div>
        </main>

        <!-- 안내말 -->
        <footer class="text-center mt-6 text-gray-600 text-sm">
            <p>💡 과목 이름을 클릭해서 직접 수정할 수도 있어요! (새로고침하면 원래대로 돌아갑니다)</p>
        </footer>
    </div>

    <script>
        /* 
          ================================================================
          ✨ [여기만 고치세요!] 선생님과 학생들이 시간표를 쉽게 수정하는 공간 ✨
          ================================================================
          아래의 `timetableData` 변수 안의 과목 이름을 바꾸면 시간표가 바로 바뀝니다!
          과목 이름에 따라 색상(국어, 수학, 사회, 과학, 영어, 예체능 등)이 자동으로 예쁘게 칠해집니다.
        */
        const timetableData = [
            { period: "1교시", mon: "국어", tue: "수학", wed: "사회", thu: "과학", fri: "영어" },
            { period: "2교시", mon: "국어", tue: "수학", wed: "음악", thu: "사회", fri: "미술" },
            { period: "3교시", mon: "사회", tue: "영어", wed: "국어", thu: "수학", fri: "체육" },
            { period: "4교시", mon: "과학", tue: "체육", wed: "도덕", thu: "국어", fri: "음악" },
            { period: "점심시간", mon: "🍱 냠냠", tue: "🍱 냠냠", wed: "🍱 냠냠", thu: "🍱 냠냠", fri: "🍱 냠냠" },
            { period: "5교시", mon: "영어", tue: "미술", wed: "체육", thu: "영어", fri: "창체" },
            { period: "6교시", mon: "창체", tue: "창체", wed: "미술", thu: "과학", fri: "창체" }
        ];

        /* 
          [여기만 고치세요!] D-Target 날짜 설정 (연도, 월(0부터 시작하므로 1뺌), 일)
          예를 들어 2026년 7월 20일이 소풍 또는 방학이라면 아래 날짜를 수정하세요!
        */
        const targetDate = new Date(2026, 6, 20); // 2026년 7월 20일

        // 과목별 자동 색상 매핑 함수
        function getSubjectStyle(subject) {
            if (subject.includes("국어")) return "bg-red-100 text-red-700 border-red-300";
            if (subject.includes("수학")) return "bg-blue-100 text-blue-700 border-blue-300";
            if (subject.includes("사회")) return "bg-amber-100 text-amber-700 border-amber-300";
            if (subject.includes("과학")) return "bg-emerald-100 text-emerald-700 border-emerald-300";
            if (subject.includes("영어")) return "bg-purple-100 text-purple-700 border-purple-300";
            if (subject.includes("체육")) return "bg-orange-100 text-orange-700 border-orange-300";
            if (subject.includes("음악") || subject.includes("미술")) return "bg-pink-100 text-pink-700 border-pink-300";
            if (subject.includes("점심")) return "bg-yellow-50 text-yellow-800 border-yellow-200 font-bold";
            return "bg-gray-100 text-gray-700 border-gray-300";
        }

        // 시간표 화면에 그리기
        function renderTimetable() {
            const tbody = document.getElementById('timetable-body');
            tbody.innerHTML = '';

            timetableData.forEach((row, index) => {
                const tr = document.createElement('tr');
                tr.className = index % 2 === 0 ? 'bg-white' : 'bg-purple-50/40';
                
                // 교시 열
                let html = `<td class="p-3 font-bold text-purple-700 bg-purple-100/50 rounded-l-xl">${row.period}</td>`;
                
                // 월~금 요일 열
                ['mon', 'tue', 'wed', 'thu', 'fri'].forEach(day => {
                    const subject = row[day];
                    const styleClass = getSubjectStyle(subject);
                    html += `
                        <td class="p-2">
                            <div contenteditable="true" class="p-2 rounded-xl border-2 ${styleClass} transition-all hover:scale-105 cursor-pointer text-center font-bold">
                                ${subject}
                            </div>
                        </td>
                    `;
                });
                
                tr.innerHTML = html;
                tbody.appendChild(tr);
            });
        }

        // D-Day 계산 함수
        function updateDDay() {
            const today = new Date();
            // 시간 차이 계산 (밀리초 기준)
            const diffTime = targetDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            const ddayCountEl = document.getElementById('dday-count');
            if (diffDays > 0) {
                ddayCountEl.innerText = `D-${diffDays}일 남았어요! 🚀`;
            } else if (diffDays === 0) {
                ddayCountEl.innerText = `드디어 오늘이에요! 🎉`;
            } else {
                ddayCountEl.innerText = `이미 지나간 멋진 날이에요! ✨`;
            }
        }

        // 정보 저장 알림 기능 (메시지 박스 대체 구현)
        function saveInfo() {
            const teacher = document.getElementById('teacher-name').value;
            const classInfo = document.getElementById('class-info').value;
            
            // 귀여운 토스트 메시지 생성
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-5 right-5 bg-pink-500 text-white font-bold px-6 py-3 rounded-2xl cute-shadow z-50 animate-bounce';
            toast.innerText = `✨ ${classInfo} ${teacher} 설정이 저장되었습니다!`;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        // 앱 초기화 실행
        window.onload = function() {
            renderTimetable();
            updateDDay();
        };
    </script>
</body>
</html>
