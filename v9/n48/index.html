<!DOCTYPE html>
<html lang="ko">
<head>
    <!-- 문서의 문자 인코딩 설정 -->
    <meta charset="UTF-8">
    <!-- 모바일 화면 크기 대응을 위한 뷰포트 설정 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 웹페이지 상단 탭에 표시될 제목 -->
    <title>한옥 정자 시간표 및 D-Day</title>
    <!-- 구글 폰트 Do Hyeon(도현) 연결 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet">
    <!-- CSS 스타일 시작 -->
    <style>
        /* 색상 및 디자인을 관리하는 CSS 변수 설정 (라이트 모드: 낮의 한옥 정자 마루) */
        :root {
            --bg-color: #f7eedb;     /* 고즈넉한 한지 및 한옥 마루 톤의 배경 */
            --box-color: #fffaf0;    /* 백색 대신 따뜻한 크림빛 한지 박스 배경 */
            --text-color: #3d2c1d;   /* 진한 고목 나무 느낌의 글자 색상 */
            --point-color: #964b00;  /* 묵직하고 따뜻한 전통 갈색 포인트 */
        }

        /* 다크 모드가 활성화되었을 때의 CSS 변수 변경 (밤의 한옥 정자) */
        body.dark-mode {
            --bg-color: #0f172a;     /* 깊고 아늑한 밤하늘 */
            --box-color: #1e293b;    /* 어두운 목재 느낌의 박스 배경 */
            --text-color: #f8fafc;   /* 밝고 선명한 글자 색상 */
            --point-color: #fbbf24;  /* 밤을 밝히는 은은한 등불빛 */
        }

        /* 전체 페이지 기본 스타일 및 한옥 정자 배경 설정 */
        body {
            font-family: 'Do Hyeon', sans-serif;
            background-color: var(--bg-color);
            /* 한옥 정자 처마 아래 그늘과 마당의 푸르름을 담은 은은한 배경 효과 */
            background-image: 
                radial-gradient(circle at 50% 120%, rgba(101, 163, 13, 0.25) 0%, transparent 60%),
                linear-gradient(to bottom, rgba(150, 75, 0, 0.03) 0%, transparent 100%);
            background-repeat: no-repeat;
            background-attachment: fixed;
            margin: 0;
            padding: 20px;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            transition: background-color 0.5s ease, color 0.3s ease;
            position: relative;
            overflow-x: hidden;
        }

        /* 화면 하단 한옥 정자 감성을 더해주는 안내 문구 */
        body::before {
            content: "🏮 고즈넉한 한옥 정자에 오신 것을 환영합니다 🏮";
            position: fixed;
            bottom: 8px;
            font-size: 0.85rem;
            color: var(--point-color);
            opacity: 0.7;
            pointer-events: none;
            z-index: 1;
            letter-spacing: 1px;
        }

        /* 낮에 정자 위를 날아다니는 참새 애니메이션 스타일 */
        .sparrow {
            position: fixed;
            font-size: 24px;
            pointer-events: none;
            z-index: 10;
            animation: flySparrow 12s linear infinite;
        }
        @keyframes flySparrow {
            0% { transform: translate(-50px, 150px) scaleX(1); opacity: 0; }
            10% { opacity: 1; }
            45% { transform: translate(45vw, 80px) scaleX(1); }
            50% { transform: translate(50vw, 70px) scaleX(-1); }
            90% { opacity: 1; }
            100% { transform: translate(105vw, 160px) scaleX(-1); opacity: 0; }
        }

        /* 밤에 한옥 정자 주위를 날아다니는 반딧불이 애니메이션 스타일 */
        .firefly {
            position: fixed;
            width: 8px;
            height: 8px;
            background-color: #fde047;
            border-radius: 50%;
            box-shadow: 0 0 12px #fde047, 0 0 24px #eab308;
            pointer-events: none;
            z-index: 10;
            opacity: 0;
            animation: floatFirefly 6s ease-in-out infinite;
        }
        @keyframes floatFirefly {
            0% { transform: translate(0, 0); opacity: 0; }
            50% { opacity: 0.95; transform: translate(var(--move-x), var(--move-y)); }
            100% { transform: translate(0, 0); opacity: 0; }
        }

        /* 다크 모드일 때 참새 숨기기, 라이트 모드일 때 반딧불이 숨기기 */
        body.dark-mode .sparrow { display: none; }
        body:not(.dark-mode) .firefly { display: none; }

        /* 상단 컨트롤 영역 (밤낮 버튼 + 인터랙션 위젯) 공통 박스 스타일 */
        .top-controls {
            width: 100%;
            max-width: 650px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 10px;
            flex-wrap: wrap;
            z-index: 2;
        }

        /* 밤낮 모드 변경 버튼 스타일 (둥글기 18px 적용) */
        .mode-btn {
            background-color: var(--box-color);
            color: var(--text-color);
            border: 2px solid var(--point-color);
            padding: 8px 16px;
            border-radius: 18px;
            cursor: pointer;
            font-family: 'Do Hyeon', sans-serif;
            font-size: 1rem;
            box-shadow: 0 3px 10px rgba(60, 40, 20, 0.08);
            transition: background-color 0.2s, transform 0.1s;
        }
        .mode-btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        /* 오늘 기분 및 날씨 인터랙션 위젯 박스 (둥글기 18px 적용) */
        .interaction-box {
            background-color: var(--box-color);
            padding: 8px 16px;
            border-radius: 18px;
            border: 1px solid rgba(150, 75, 0, 0.15);
            box-shadow: 0 3px 10px rgba(60, 40, 20, 0.08);
            display: flex;
            gap: 15px;
            align-items: center;
            font-size: 0.95rem;
            transition: background-color 0.3s ease;
        }

        /* 셀렉트 박스(드롭다운) 디자인 */
        .interaction-box select {
            font-family: 'Do Hyeon', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--point-color);
            padding: 4px 8px;
            border-radius: 10px;
            cursor: pointer;
            outline: none;
        }

        /* D-Day 카운터 디자인 박스 (둥글기 18px 적용) */
        .dday-container {
            background-color: var(--box-color);
            color: var(--text-color);
            padding: 25px;
            border-radius: 18px;
            border: 1px solid rgba(150, 75, 0, 0.15);
            text-align: center;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 4px 15px rgba(60, 40, 20, 0.08);
            margin-bottom: 25px;
            transition: background-color 0.3s ease;
            z-index: 2;
        }

        /* 목표 이름 글자 스타일 */
        .dday-title {
            font-size: 1.2rem;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--point-color);
        }

        /* 남은 날짜 숫자 글자 스타일 */
        .dday-count {
            font-size: 2.2rem;
            font-weight: bold;
        }

        /* 시간표 테이블을 감싸는 박스 (둥글기 18px 적용) */
        .timetable-container {
            width: 100%;
            max-width: 650px;
            background-color: var(--box-color);
            padding: 20px;
            border-radius: 18px;
            border: 1px solid rgba(150, 75, 0, 0.15);
            box-shadow: 0 4px 15px rgba(60, 40, 20, 0.08);
            overflow-x: auto;
            transition: background-color 0.3s ease;
            z-index: 2;
        }

        /* 테이블 기본 디자인 설정 */
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            color: var(--text-color);
        }

        /* 테이블 셀(칸) 테두리 및 여백 설정 */
        th, td {
            border: 1px solid rgba(150, 75, 0, 0.15);
            padding: 10px 6px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        /* 표 머리글(요일) 색상 설정 */
        th {
            background-color: var(--point-color);
            color: #ffffff;
            cursor: default;
        }

        /* 시간 및 교시 정보가 들어가는 첫 번째 열 스타일 */
        td:first-child {
            background-color: rgba(150, 75, 0, 0.06);
            font-weight: bold;
            white-space: nowrap;
            cursor: default;
        }

        /* 현재 교시 강조 테두리 스타일 */
        .highlight-cell {
            border: 3px solid var(--point-color) !important;
            box-shadow: 0 0 10px rgba(150, 75, 0, 0.3);
        }

        /* 과목 클릭 시 준비물이 표시되는 안내 박스 */
        .supply-box {
            margin-top: 15px;
            text-align: center;
            font-size: 1rem;
            color: var(--point-color);
            min-height: 1.5em;
            font-weight: bold;
        }
    </style>
    <!-- CSS 스타일 끝 -->
</head>
<body>

    <!-- 낮에 정자 위를 날아다니는 참새 이모지 -->
    <div class="sparrow" style="top: 18vh; animation-delay: 0s;">🐦</div>
    <div class="sparrow" style="top: 32vh; animation-delay: 4s;">🕊️</div>

    <!-- 밤에 한옥 정자에 찾아오는 반딧불이 생성 -->
    <div class="firefly" style="top: 20vh; left: 25vw; --move-x: 90px; --move-y: -60px; animation-delay: 0s;"></div>
    <div class="firefly" style="top: 50vh; left: 75vw; --move-x: -110px; --move-y: 50px; animation-delay: 2s;"></div>
    <div class="firefly" style="top: 70vh; left: 35vw; --move-x: 70px; --move-y: -70px; animation-delay: 4s;"></div>
    <div class="firefly" style="top: 25vh; left: 80vw; --move-x: -80px; --move-y: -30px; animation-delay: 1.5s;"></div>

    <!-- 상단 컨트롤 영역 (다크모드 버튼 + 오늘의 기분/날씨 선택 위젯) -->
    <div class="top-controls">
        <button class="mode-btn" onclick="toggleDarkMode()">🏛️ 한옥 정자 밤낮 변경</button>
        
        <div class="interaction-box">
            <!-- 오늘 기분 선택 인터랙션 -->
            <div>
                <span>기분:</span>
                <select id="moodSelect" onchange="saveInteraction()">
                    <option value="😊 좋음">😊 좋음</option>
                    <option value="😎 최고">😎 최고</option>
                    <option value="😴 피곤함">😴 피곤함</option>
                    <option value="😭 슬픔/힘듦">😭 슬픔/힘듦</option>
                    <option value="🤔 보통">🤔 보통</option>
                </select>
            </div>
            <!-- 오늘 날씨 선택 인터랙션 -->
            <div>
                <span>날씨:</span>
                <select id="weatherSelect" onchange="saveInteraction()">
                    <option value="☀️ 맑음">☀️ 맑음</option>
                    <option value="☁️ 흐림">☁️ 흐림</option>
                    <option value="🌧️ 비">🌧️ 비</option>
                    <option value="❄️ 눈">❄️ 눈</option>
                </select>
            </div>
        </div>
    </div>

    <!-- 화면 위쪽 D-Day 영역 -->
    <div class="dday-container">
        <div class="dday-title" id="ddayTitle">목표</div>
        <div class="dday-count" id="ddayCount">D-0</div>
    </div>

    <!-- 화면 아래쪽 시간표 영역 -->
    <div class="timetable-container">
        <table id="timetable">
            <thead>
                <tr id="tableHeader">
                    <!-- 자바스크립트가 요일 헤더를 자동으로 채웁니다 -->
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- 자바스크립트가 시간표 내용을 자동으로 채웁니다 -->
            </tbody>
        </table>
        <!-- 과목 클릭 시 준비물이 출력되는 영역 -->
        <div class="supply-box" id="supplyMessage">과목 칸을 누르면 준비물이 표시됩니다.</div>
    </div>

    <!-- 자바스크립트 시작 -->
    <script>
        // ==========================================
        // [여기만 고치세요] 설정 영역
        // ==========================================
        const TITLE = '1학년 3반 시간표';
        const TARGET = { label: '목표', date: '2026-12-10' };
        const DAYS = ['월', '화', '수', '목', '금'];
        const PERIODS = [
          { time: '09:00', subjects: ['수학', '선체', '국어', '도덕', '정보'] },
          { time: '10:00', subjects: ['영어', '스클', '사회', '국어', '국어'] },
          { time: '11:00', subjects: ['체육', '수학', '과학', '사회', '음악'] },
          { time: '13:00', subjects: ['미술', '기가', '영어', '음악', '진로'] },
          { time: '14:00', subjects: ['미술', '도덕', '수학', '영어', '과학'] },
        ];

        // 과목별 준비물 사전 설정
        const SUPPLIES = {
            '수학': '교과서, 수학 익힘책, 필기구, 계산기',
            '국어': '국어 교과서, 공책, 필기구',
            '영어': '영어 교과서, 단어장, 공책',
            '과학': '과학 교과서, 실험 관찰, 필기구',
            '사회': '사회 교과서, 지도, 필기구',
            '체육': '운동복, 운동화, 물병',
            '미술': '미술 도구, 스케치북, 색도구',
            '음악': '음악 교과서, 리코더 또는 악기',
            '도덕': '도덕 교과서, 필기구',
            '정보': '필기구, 개인 보조기기',
            '진로': '진로 활동지, 필기구',
            '기가': '기술가정 교과서, 필기구',
            '선체': '선체 교과서 및 자료',
            '스클': '스마트 기기 및 교재'
        };
        // ==========================================
        // 설정 영역 끝 (아래 코드는 수정하지 않아도 됩니다)
        // ==========================================

        // 과목 이름에 따라 자동으로 일관된 색상을 만들어주는 함수
        function getSubjectColor(subject) {
            if (!subject) return '';
            const pastelColors = [
                'rgba(150, 75, 0, 0.08)',
                'rgba(217, 119, 6, 0.08)',
                'rgba(101, 163, 13, 0.08)',
                'rgba(180, 83, 9, 0.08)',
                'rgba(120, 53, 15, 0.08)',
                'rgba(202, 138, 4, 0.1)'
            ];
            let hash = 0;
            for (let i = 0; i < subject.length; i++) {
                hash = subject.charCodeAt(i) + ((hash << 5) - hash);
            }
            return pastelColors[Math.abs(hash) % pastelColors.length];
        }

        // 밤낮 모드 전환 함수
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
        }

        // 기분과 날씨 선택 값을 브라우저 저장소(localStorage)에 저장하는 함수
        function saveInteraction() {
            const mood = document.getElementById('moodSelect').value;
            const weather = document.getElementById('weatherSelect').value;
            localStorage.setItem('user_mood', mood);
            localStorage.setItem('user_weather', weather);
        }

        // 저장된 기분과 날씨를 불러오는 함수
        function loadInteraction() {
            const savedMood = localStorage.getItem('user_mood');
            const savedWeather = localStorage.getItem('user_weather');
            if (savedMood) document.getElementById('moodSelect').value = savedMood;
            if (savedWeather) document.getElementById('weatherSelect').value = savedWeather;
        }

        // D-Day 계산 및 화면 표시 함수 (D-Day가 0일 때 축하 문구 포함)
        function initDDay() {
            const titleElement = document.getElementById('ddayTitle');
            const countElement = document.getElementById('ddayCount');

            titleElement.innerText = `${TITLE} (${TARGET.label}까지)`;

            const today = new Date();
            const todayDateOnly = new Date(today.getFullYear(), today.getMonth(), today.getDate());
            const targetDateObj = new Date(TARGET.date);
            const targetDateOnly = new Date(targetDateObj.getFullYear(), targetDateObj.getMonth(), targetDateObj.getDate());
            
            const diffTime = targetDateOnly - todayDateOnly;
            const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays > 0) {
                countElement.innerText = `D - ${diffDays}`;
            } else if (diffDays === 0) {
                countElement.innerText = "🎉 D-Day! 목표 달성일 축하합니다! 🎉";
            } else {
                countElement.innerText = `D + ${Math.abs(diffDays)} (목표일 지남)`;
            }
        }

        // 시간표 표를 동적으로 생성하는 함수
        function initTimetable() {
            const headerRow = document.getElementById('tableHeader');
            const tbody = document.getElementById('tableBody');

            let headerHTML = '<th>시간</th>';
            for (let i = 0; i < DAYS.length; i++) {
                headerHTML += `<th>${DAYS[i]}</th>`;
            }
            headerRow.innerHTML = headerHTML;

            let bodyHTML = '';
            for (let i = 0; i < PERIODS.length; i++) {
                bodyHTML += '<tr>';
                bodyHTML += `<td>${PERIODS[i].time}<br>(${i + 1}교시)</td>`;
                
                for (let j = 0; j < PERIODS[i].subjects.length; j++) {
                    const subject = PERIODS[i].subjects[j];
                    const subColor = getSubjectColor(subject);
                    bodyHTML += `<td style="background-color: ${subColor};" onclick="showSupply('${subject}')">${subject}</td>`;
                }
                bodyHTML += '</tr>';
            }
            tbody.innerHTML = bodyHTML;
        }

        // 과목 클릭 시 하단에 준비물을 띄워주는 함수
        function showSupply(subject) {
            const msgElement = document.getElementById('supplyMessage');
            const supplyText = SUPPLIES[subject] || '등록된 준비물이 없습니다.';
            msgElement.innerText = `[${subject}] 준비물: ${supplyText}`;
        }

        // 현재 시각 기준으로 주말 체크, 실시간 D-Day/쉬는 날 문구, 현재 교시 테두리 강조 함수
        function updateRealtimeStatus() {
            const now = new Date();
            const dayIndex = now.getDay(); // 0:일요일, 6:토요일
            const countElement = document.getElementById('ddayCount');

            if (dayIndex === 0 || dayIndex === 6) {
                countElement.innerText = "☕ 오늘은 쉬는 날입니다!";
            } else {
                initDDay();
            }

            const currentMinutes = now.getHours() * 60 + now.getMinutes();
            let activePeriod = -1;

            for (let i = 0; i < PERIODS.length; i++) {
                const [h, m] = PERIODS[i].time.split(':').map(Number);
                const startMinutes = h * 60 + m;
                const endMinutes = (i < PERIODS.length - 1) ? 
                    (Number(PERIODS[i+1].time.split(':')[0]) * 60 + Number(PERIODS[i+1].time.split(':')[1])) : 
                    startMinutes + 60;

                if (currentMinutes >= startMinutes && currentMinutes < endMinutes) {
                    activePeriod = i;
                    break;
                }
            }

            const rows = document.getElementById('tableBody').getElementsByTagName('tr');
            for (let r = 0; r < rows.length; r++) {
                const cells = rows[r].getElementsByTagName('td');
                for (let c = 1; c < cells.length; c++) {
                    cells[c].classList.remove('highlight-cell');
                }
            }

            if (dayIndex >= 1 && dayIndex <= 5 && activePeriod !== -1) {
                const targetRow = rows[activePeriod];
                if (targetRow) {
                    const targetCell = targetRow.getElementsByTagName('td')[dayIndex];
                    if (targetCell) {
                        targetCell.classList.add('highlight-cell');
                    }
                }
            }
        }

        // 웹페이지 로딩 완료 시 실행 및 1분(60000ms)마다 자동 갱신
        window.onload = function() {
            loadInteraction();
            initDDay();
            initTimetable();
            updateRealtimeStatus();
            setInterval(updateRealtimeStatus, 60000);
        };
    </script>
    <!-- 자바스크립트 끝 -->

</body>
</html>
