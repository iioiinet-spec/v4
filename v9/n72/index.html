<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 구글 폰트: 고운돋움 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">

  <title>6학년 2학기 시간표</title>

  <style>
    :root {
      --bg: #12161f;          /* 전체 배경색 */
      --cell: #1b2130;        /* 시간표 칸 배경색 */
      --text: #e8ecf7;        /* 기본 글자색 */
      --point: #7be0c8;       /* 강조 포인트 색 */
      --radius: 14px;         /* 모서리 둥글기 */
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Gowun Dodum', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 30px;
    }

    #today {
      text-align: center;
      color: var(--point);
      margin-bottom: 20px;
    }

    #weekend-message {
      text-align: center;
      color: var(--point);
      font-size: 20px;
      min-height: 30px;
      margin-bottom: 10px;
    }

    .schedule {
      display: grid;
      grid-template-columns: 90px repeat(5, 1fr);
      gap: 8px;
    }

    .cell {
      min-height: 80px;
      background: var(--cell);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10px;
    }

    .header {
      min-height: 55px;
      color: var(--point);
      font-weight: bold;
    }

    .time {
      color: var(--point);
      font-size: 14px;
    }

    .subject {
      font-size: 18px;
    }

    .current-period {
      outline: 2px solid var(--point);
      outline-offset: -2px;
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }

      .schedule {
        gap: 5px;
        grid-template-columns: 55px repeat(5, 1fr);
      }

      .cell {
        min-height: 65px;
        padding: 5px;
      }

      .subject {
        font-size: 14px;
      }

      .time {
        font-size: 11px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>6학년 2학기</h1>
    <div id="today">오늘</div>
    <div id="weekend-message"></div>

    <div class="schedule" id="schedule">
      <div class="cell header">시간</div>

      <div class="cell header">월</div>
      <div class="cell header">화</div>
      <div class="cell header">수</div>
      <div class="cell header">목</div>
      <div class="cell header">금</div>
    </div>
  </main>

  <script>
    const TITLE  = '6학년 2학기';
    const TARGET = { label:'오늘', date:'2026-10-02' };
    const DAYS   = ['월','화','수','목','금'];

    const PERIODS = [
      { time:'09:00', subjects:['체육', '체육', '체육', '수학', '체육'] },
      { time:'10:00', subjects:['체육', '체육', '체육', '체육', '체육'] },
      { time:'11:00', subjects:['체육', '창체', '체육', '창체', '실과'] },
      { time:'13:00', subjects:['창체', '국어', '체육', '체육', '실과'] },
      { time:'14:00', subjects:['창체', '체육', '체육', '체욱', '체육'] },
    ];

    const schedule = document.querySelector('#schedule');

    PERIODS.forEach((period, periodIndex) => {
      const timeCell = document.createElement('div');
      timeCell.className = 'cell time';
      timeCell.textContent = period.time;
      schedule.appendChild(timeCell);

      period.subjects.forEach((subject, dayIndex) => {
        const cell = document.createElement('div');
        cell.className = 'cell subject schedule-cell';
        cell.dataset.day = dayIndex;
        cell.dataset.period = periodIndex;
        cell.textContent = subject;
        schedule.appendChild(cell);
      });
    });

    function updateCurrentPeriod() {
      const now = new Date();
      const day = now.getDay(); // 일=0, 월=1, ..., 토=6
      const hour = now.getHours();

      document.querySelectorAll('.current-period').forEach(cell => {
        cell.classList.remove('current-period');
      });

      const weekendMessage = document.querySelector('#weekend-message');
      weekendMessage.textContent = '';

      if (day === 0 || day === 6) {
        weekendMessage.textContent = '오늘은 쉬는 날';
        return;
      }

      const periodIndex = PERIODS.findIndex((period, index) => {
        const startHour = Number(period.time.split(':')[0]);
        const nextHour = index < PERIODS.length - 1
          ? Number(PERIODS[index + 1].time.split(':')[0])
          : 15;

        return hour >= startHour && hour < nextHour;
      });

      if (periodIndex === -1) return;

      const todayCells = document.querySelectorAll(
        `.schedule-cell[data-day="${day - 1}"][data-period="${periodIndex}"]`
      );

      todayCells.forEach(cell => {
        cell.classList.add('current-period');
      });
    }

    updateCurrentPeriod();
    setInterval(updateCurrentPeriod, 60000);
  </script>
</body>
</html>
