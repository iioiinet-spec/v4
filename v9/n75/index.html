<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- 문서의 문자셋을 UTF-8로 설정합니다 -->
  <meta charset="UTF-8">
  <!-- 모바일 기기에서 화면이 올바르게 표시되도록 설정합니다 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 웹페이지의 제목을 설정합니다 -->
  <title>월드챔피언십 D-Day 시간표</title>
  <!-- 구글 폰트 Jua(주아) 불러오기 연결을 준비합니다 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <!-- 구글 폰트 서버와의 연결을 최적화합니다 -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- 구글 폰트 Jua(주아) 스타일을 웹페이지에 불러옵니다 -->
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <!-- CSS 스타일을 작성하는 시작 태그입니다 -->
  <style>
    /* CSS 변수 설정: 여기서 디자인 색상과 단위를 한 번에 관리합니다 */
    :root {
      --bg-color: #000000;     /* 전체 배경색 (검정) */
      --box-color: #001dfa;    /* 시간표와 D-Day 칸 배경색 (파랑) */
      --text-color: #ffffff;   /* 기본 글자색 (흰색) */
      --point-color: #fa0000;  /* 강조할 포인트 색상 (빨강) */
      --radius-size: 28px;     /* 모서리 둥글기 크기 (28px) */
    }

    /* 전체 화면 기본 스타일 설정입니다 */
    body {
      background-color: var(--bg-color); /* 배경색 변수를 적용합니다 */
      color: var(--text-color);          /* 기본 글자색 변수를 적용합니다 */
      font-family: 'Jua', sans-serif;    /* 주아 폰트를 전체 적용합니다 */
      margin: 0;                         /* 브라우저 기본 바깥 여백을 없애줍니다 */
      padding: 20px;                     /* 화면 안쪽 여백을 줍니다 */
      display: flex;                     /* 요소를 자유롭게 배치하기 위해 flex를 씁니다 */
      flex-direction: column;            /* 요소를 위에서 아래로 세로 배치합니다 */
      align-items: center;               /* 가로 방향 중앙으로 정렬합니다 */
      min-height: 100vh;                 /* 최소 높이를 화면 전체 높이로 채웁니다 */
    }

    /* D-Day 카운터를 감싸는 상자 스타일입니다 */
    #dday-container {
      background-color: var(--box-color); /* 상자 배경을 파란색으로 채웁니다 */
      border-radius: var(--radius-size);  /* 모서리를 28px 둥글게 만듭니다 */
      padding: 30px;                      /* 상자 안쪽 여백을 넓게 줍니다 */
      text-align: center;                 /* 글자를 가운데로 정렬합니다 */
      margin-bottom: 20px;                /* 아래쪽 요소와의 간격을 줍니다 */
      width: 90%;                         /* 너비를 화면의 90%로 설정합니다 */
      max-width: 800px;                   /* 최대 너비를 800px로 제한합니다 */
      box-shadow: 0 4px 20px rgba(250, 0, 0, 0.4); /* 빨간색 그림자 효과를 줍니다 */
    }

    /* 목표 이름 글자 스타일입니다 */
    #dday-title {
      font-size: 1.8rem;                  /* 목표 이름 글자 크기를 키웁니다 */
      margin: 0 0 10px 0;                 /* 아래쪽에만 살짝 여백을 줍니다 */
    }

    /* 남은 날짜(D-Day 숫자) 글자 스타일입니다 */
    #dday-result {
      color: var(--point-color);          /* 남은 날짜는 빨간색 포인트로 강조합니다 */
      font-size: 3.5rem;                  /* 숫자를 아주 크게 표시합니다 */
      margin: 0;                          /* 기본 여백을 없애줍니다 */
    }

    /* 주말일 때 안내 문구가 표시될 스타일입니다 */
    #weekend-message {
      display: none;                      /* 평소에는 숨겨둡니다 */
      font-size: 1.8rem;                  /* 글자 크기를 키웁니다 */
      color: var(--point-color);          /* 빨간색 포인트로 강조합니다 */
      margin-bottom: 20px;                /* 아래쪽 여백을 줍니다 */
      text-align: center;                 /* 글자를 가운데로 정렬합니다 */
    }

    /* 시간표 전체를 감싸는 영역 스타일입니다 */
    #timetable-container {
      width: 90%;                         /* 너비를 화면의 90%로 설정합니다 */
      max-width: 1200px;                  /* 최대 너비를 1200px로 제한합니다 */
    }

    /* 표(Table) 전체 스타일입니다 */
    table {
      width: 100%;                        /* 표의 너비를 가득 채웁니다 */
      border-collapse: separate;          /* 셀 사이에 간격을 주기 위해 분리형으로 설정합니다 */
      border-spacing: 10px;               /* 각각의 칸 사이에 10px 간격을 줍니다 */
    }

    /* 표의 칸(제목칸과 내용칸) 공통 스타일입니다 */
    th, td {
      background-color: var(--box-color); /* 칸 배경색을 파란색으로 채웁니다 */
      border-radius: var(--radius-size);  /* 칸 모서리를 28px 둥글게 만듭니다 */
      padding: 20px 10px;                 /* 칸 안쪽 여백을 줍니다 */
      text-align: center;                 /* 글자를 가운데로 정렬합니다 */
      word-break: keep-all;               /* 단어가 중간에 끊기지 않게 줄바꿈합니다 */
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5); /* 은은한 어두운 그림자를 줍니다 */
      border: 4px solid transparent;      /* 기본 테두리를 투명하게 주어 크기 변화를 방지합니다 */
    }

    /* 표의 요일(상단) 및 시간(좌측) 칸 강조 스타일입니다 */
    th, td:first-child {
      color: var(--point-color);          /* 요일과 시간 글자를 빨간색 포인트로 만듭니다 */
      font-size: 1.2rem;                  /* 글자 크기를 일반 내용보다 키웁니다 */
    }

    /* 현재 진행 중인 교시 칸을 빨간색 테두리로 강조하는 스타일입니다 */
    .current-period {
      border: 4px solid var(--point-color) !important; /* 포인트 색상으로 테두리를 두릅니다 */
    }
  </style>
</head>
<body>

  <!-- D-Day 카운터가 표시될 상자 영역입니다 -->
  <div id="dday-container">
    <!-- 목표 이름이 들어갈 제목 요소입니다 -->
    <h2 id="dday-title">로딩 중...</h2>
    <!-- 남은 D-Day 날짜가 들어갈 텍스트 요소입니다 -->
    <div id="dday-result">D-0</div>
  </div>

  <!-- 주말일 때 나타날 안내 문구 영역입니다 -->
  <div id="weekend-message">오늘은 쉬는 날</div>

  <!-- 월~금 5교시 시간표 표가 들어갈 영역입니다 -->
  <div id="timetable-container">
    <!-- HTML 표를 만드는 태그입니다 -->
    <table id="timetable">
      <!-- 표의 머리글(요일 목록)이 들어갈 영역입니다 -->
      <thead>
        <tr id="table-header-row">
          <!-- 자바스크립트로 요일 칸들이 여기에 자동으로 채워집니다 -->
        </tr>
      </thead>
      <!-- 표의 본문(시간별 과목)이 들어갈 영역입니다 -->
      <tbody id="table-body">
        <!-- 자바스크립트로 시간표 내용이 여기에 자동으로 채워집니다 -->
      </tbody>
    </table>
  </div>

  <!-- 자바스크립트 코드를 작성하는 시작 태그입니다 -->
  <script>
    // ==========================================
    // [여기만 고치세요] 아래의 상수 값을 수정하여 내용을 변경하세요!
    // ==========================================
    const TITLE = '월드쳄피언십'; // 웹사이트 상단 타이틀 상수입니다
    const TARGET = { 
      label: '포켓몬 월드 쳄피언십', // D-Day 목표 이름 상수입니다
      date: '2027-08-13'           // D-Day 목표 날짜 상수입니다 (YYYY-MM-DD 형식)
    };
    const DAYS = ['월', '화', '수', '목', '금']; // 시간표 요일 목록 상수입니다
    const PERIODS = [ // 시간표 교시별 시간과 과목 목록 배열 상수입니다
      { time: '8:00', subjects: ['1차 포고', '카드깡', '1차 포고', '카드깡', '1차 포고'] },
      { time: '10:00', subjects: ['카드 게임 연습', '카드 게임 연습', '카드 게임 연습', '카드 게임 연습', '카드 게임 연습'] },
      { time: '12:00', subjects: ['온라인 팝업 스토어', '오프라인 파업 스토어', '포켓몬 메가페스타 성수', '포켓몬 메가페스타 잠실', '포켓몬 메가페스타 부산'] },
      { time: '18:00', subjects: ['2차 포고', '친구랑 놀기', '2차 포고', '친구랑 놀기', '2차 포고'] },
      { time: '20:00', subjects: ['Pokémon Team Masters대회준비', '코리안리그 대회준비', '카드샵 대항전 대회준비', '월드 쳄피언십 대회준비', '미니리그 대회준비'] },
    ];
    // ==========================================

    // 문서가 완전히 로드된 후 실행되는 함수입니다
    window.addEventListener('DOMContentLoaded', () => {
      // 브라우저 탭 제목을 TITLE 상수로 변경합니다
      document.title = TITLE;

      // D-Day 목표 이름을 화면에 출력합니다
      document.getElementById('dday-title').innerText = TARGET.label;

      // D-Day 남은 날짜를 계산하는 함수를 실행합니다
      calculateDDay();

      // 시간표 헤더를 그리는 함수를 실행합니다
      renderTimetableHeader();

      // 시간표 본문을 그리는 함수를 실행합니다
      renderTimetableBody();

      // 현재 시각 기준 교시 테두리 강조 함수를 실행합니다
      highlightCurrentPeriod();

      // 1분(60,000밀리초)마다 자동으로 현재 교시를 갱신합니다
      setInterval(highlightCurrentPeriod, 60000);
    });

    // D-Day를 계산하여 화면에 보여주는 함수입니다
    function calculateDDay() {
      // 오늘 날짜 객체를 생성합니다 (시간은 0시 0분 0초로 맞춥니다)
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      // 목표 날짜 문자열을 날짜 객체로 변환합니다
      const targetDate = new Date(TARGET.date);
      targetDate.setHours(0, 0, 0, 0);

      // 목표 날짜와 오늘 날짜의 시간 차이를 밀리초 단위로 구합니다
      const diffTime = targetDate.getTime() - today.getTime();
      
      // 밀리초를 일(day) 단위로 변환합니다
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

      // 결과를 화면에 표시할 요소를 가져옵니다
      const resultElement = document.getElementById('dday-result');

      // 남은 날짜에 따라 다르게 글자를 표시합니다
      if (diffDays > 0) {
        resultElement.innerText = `D - ${diffDays}`; // 남은 날짜가 미래일 때
      } else if (diffDays === 0) {
        resultElement.innerText = `D - DAY!`; // 오늘이 바로 그날일 때
      } else {
        resultElement.innerText = `D + ${Math.abs(diffDays)}`; // 이미 지난 날짜일 때
      }
    }

    // 시간표 표의 헤더(요일)를 동적으로 생성하는 함수입니다
    function renderTimetableHeader() {
      // 헤더 행 요소를 가져옵니다
      const headerRow = document.getElementById('table-header-row');
      
      // 첫 번째 칸으로 '시간' 타이틀을 넣습니다
      let headerHTML = '<th>시간</th>';
      
      // DAYS 배열을 순회하며 요일 칸을 하나씩 만듭니다
      for (let i = 0; i < DAYS.length; i++) {
        headerHTML += `<th>${DAYS[i]}</th>`; // 각 요일을 th 태그로 감싸서 추가합니다
      }
      
      // 완성된 HTML을 헤더 행에 넣습니다
      headerRow.innerHTML = headerHTML;
    }

    // 시간표 표의 본문(교시별 과목)을 동적으로 생성하는 함수입니다
    function renderTimetableBody() {
      // 본문 tbody 요소를 가져옵니다
      const tbody = document.getElementById('table-body');
      let bodyHTML = ''; // 본문 HTML 코드를 저장할 빈 문자열을 만듭니다

      // PERIODS 배열을 순회하며 각 교시 행을 만듭니다
      for (let i = 0; i < PERIODS.length; i++) {
        const period = PERIODS[i]; // 현재 교시 데이터 객체입니다
        bodyHTML += '<tr>'; // 행 시작 태그를 엽니다
        
        // 첫 번째 열에 해당 교시의 시간 정보를 넣습니다
        bodyHTML += `<td>${period.time}</td>`;

        // 해당 교시의 월~금 과목들을 순회하며 칸을 만듭니다
        for (let j = 0; j < period.subjects.length; j++) {
          bodyHTML += `<td>${period.subjects[j]}</td>`; // 각 과목을 td 태그로 넣습니다
        }

        bodyHTML += '</tr>'; // 행 닫기 태그를 닫습니다
      }

      // 완성된 본문 HTML을 tbody에 넣습니다
      tbody.innerHTML = bodyHTML;
    }

    // 현재 시각을 기준으로 오늘 요일과 교시를 찾아 테두리로 강조하는 함수입니다
    function highlightCurrentPeriod() {
      // 기존에 칠해져 있던 모든 강조 테두리를 제거합니다
      const prev = document.querySelectorAll('.current-period');
      for (let i = 0; i < prev.length; i++) {
        prev[i].classList.remove('current-period');
      }

      // 현재 날짜와 시간 정보를 가져옵니다
      const now = new Date();
      const dayIndex = now.getDay(); // 0: 일요일, 1: 월요일 ... 6: 토요일
      const weekendMessage = document.getElementById('weekend-message');
      const timetableContainer = document.getElementById('timetable-container');

      // 주말(토요일, 일요일)인 경우 처리합니다
      if (dayIndex === 0 || dayIndex === 6) {
        weekendMessage.style.display = 'block'; // 쉬는 날 문구를 보여줍니다
        timetableContainer.style.display = 'none'; // 주말에는 시간표를 숨깁니다
        return;
      } else {
        weekendMessage.style.display = 'none'; // 평일이면 문구를 숨깁니다
        timetableContainer.style.display = 'block'; // 평일이면 시간표를 보여줍니다
      }

      // 월~금은 요일 인덱스가 1~5이므로 그대로 열 번호와 일치합니다
      const targetColIndex = dayIndex; 
      const currentMins = now.getHours() * 60 + now.getMinutes();

      // 각 교시의 시작 시간을 분 단위로 계산하여 배열로 만듭니다
      let periodMins = [];
      for (let i = 0; i < PERIODS.length; i++) {
        const parts = PERIODS[i].time.split(':');
        periodMins.push(parseInt(parts[0]) * 60 + parseInt(parts[1]));
      }

      // 현재 시각이 몇 교시에 해당하는지 찾습니다
      let activeIndex = -1;
      for (let i = 0; i < periodMins.length; i++) {
        const start = periodMins[i];
        const end = (i + 1 < periodMins.length) ? periodMins[i + 1] : start + 120; // 마지막 교시는 2시간 동안 유지
        if (currentMins >= start && currentMins < end) {
          activeIndex = i;
          break;
        }
      }

      // 해당하는 교시가 있으면 해당 칸에 테두리 클래스를 추가합니다
      if (activeIndex !== -1) {
        const rows = document.getElementById('table-body').getElementsByTagName('tr');
        if (rows[activeIndex]) {
          const cells = rows[activeIndex].getElementsByTagName('td');
          if (cells[targetColIndex]) {
            cells[targetColIndex].classList.add('current-period');
          }
        }
      }
    }
  </script>
</body>
</html>
