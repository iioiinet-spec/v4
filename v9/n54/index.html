<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍀 생일날 시간표 및 스페이스바 연타 게임 & 상점 🍀</title>
  
  <!-- 구글 폰트 고운돋움(Gowun Dodum) 불러오기 -->
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #f5fff6;
      --box-bg: #2a7e4f;
      --text-color: #51d733;
      --point-color: #76c17b;
      --radius-size: 14px;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: var(--bg-color);
      font-family: 'Gowun Dodum', sans-serif;
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: relative;
      z-index: 2;
    }

    /* 카드 공통 스타일 */
    .card {
      background-color: var(--box-bg);
      border: 2px solid var(--point-color);
      border-radius: var(--radius-size);
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(42, 126, 79, 0.15);
    }

    /* D-Day 카드 특별 크기 */
    .dday-card {
      padding: 24px;
    }

    .title-text {
      font-size: 1.2rem;
      margin-bottom: 8px;
      color: var(--point-color);
    }

    .dday-number {
      font-size: 2.5rem;
      font-weight: bold;
      color: var(--text-color);
    }

    .congrats-message {
      margin-top: 12px;
      font-size: 1.3rem;
      font-weight: bold;
      color: #ffe600;
      animation: bounce 1s infinite alternate;
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-5px); }
    }

    .game-title, .shop-title {
      font-size: 1.1rem;
      color: var(--point-color);
      margin-bottom: 8px;
      font-weight: bold;
    }

    .game-status {
      font-size: 1.3rem;
      font-weight: bold;
      color: #ffe600;
      margin-bottom: 15px;
    }

    .game-btn {
      background-color: var(--point-color);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 1.1rem;
      font-family: 'Gowun Dodum', sans-serif;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s;
    }

    .game-btn:hover {
      background-color: #5bb360;
    }

    .collection-box {
      margin-top: 12px;
      padding: 10px;
      background-color: rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      font-size: 1.1rem;
      color: #ffffff;
    }

    /* 상점 리스트 스타일 */
    .shop-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }

    .shop-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: rgba(0, 0, 0, 0.2);
      padding: 10px 15px;
      border-radius: 8px;
    }

    .shop-item-info {
      font-size: 0.95rem;
      color: #ffffff;
      text-align: left;
    }

    .shop-buy-btn {
      background-color: #ffe600;
      color: #2a7e4f;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.95rem;
      font-family: 'Gowun Dodum', sans-serif;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
      white-space: nowrap;
    }

    .shop-buy-btn:hover:not(:disabled) {
      background-color: #ffcd00;
    }

    .shop-buy-btn:disabled {
      background-color: #cccccc;
      color: #666666;
      cursor: not-allowed;
    }

    /* 시간표 영역 */
    .schedule-wrapper {
      background-color: var(--box-bg);
      border: 2px solid var(--point-color);
      border-radius: var(--radius-size);
      padding: 16px;
      overflow-x: auto;
      box-shadow: 0 4px 10px rgba(42, 126, 79, 0.15);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
    }

    th, td {
      padding: 12px 8px;
      border: 1px solid var(--point-color);
      border-radius: 6px;
      font-size: 0.95rem;
    }

    th {
      background-color: rgba(118, 193, 123, 0.2);
      color: var(--text-color);
      font-weight: bold;
    }

    td {
      color: var(--text-color);
      background-color: rgba(255, 255, 255, 0.05);
    }

    /* 스페이스바 입력 시 생성되는 플로팅 클로버 */
    .click-clover {
      position: fixed;
      font-size: 1.5rem;
      pointer-events: none;
      user-select: none;
      z-index: 9999;
      animation: floatUp 0.8s ease-out forwards;
    }

    @keyframes floatUp {
      0% {
        transform: translate(-50%, -50%) scale(0.5);
        opacity: 1;
      }
      100% {
        transform: translate(-50%, -150%) scale(1.3);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- 1) D-Day 카운터 영역 -->
    <div class="card dday-card">
      <div id="titleContainer" class="title-text"></div>
      <div id="ddayContainer" class="dday-number"></div>
      <div id="congratsContainer"></div>
    </div>

    <!-- 2) 10초 스페이스바 연타 게임 영역 -->
    <div class="card game-card">
      <div class="game-title">🍀 10초 스페이스바 연타 게임 🍀</div>
      <div id="gameStatus" class="game-status">버튼을 누르고 스페이스바를 연타하세요!</div>
      <button id="startBtn" class="game-btn" onclick="startCountdown()">게임 시작</button>
      <div class="collection-box">
        내 클로버 보관함: <span id="totalCloverCount">0</span> 개 🍀
      </div>
    </div>

    <!-- 3) 클로버 상점 영역 -->
    <div class="card shop-card">
      <div class="shop-title">🛒 클로버 상점 🛒</div>
      <div class="shop-list">
        <!-- 10 클로버 무제한 티켓 -->
        <div class="shop-item">
          <div class="shop-item-info">🍀 10 클로버 무제한 티켓<br><small>평상시 스페이스바 당 +1개</small></div>
          <button id="btnUnlimited" class="shop-buy-btn" onclick="buyItem('unlimited', 10)">구매 (10개)</button>
        </div>
        <!-- 100 클로버 2배 티켓 -->
        <div class="shop-item">
          <div class="shop-item-info">🎟️ 100 클로버 2배 티켓<br><small>게임 중 획득 배율 x2</small></div>
          <button id="btnX2" class="shop-buy-btn" onclick="buyItem('x2', 100)">구매 (100개)</button>
        </div>
        <!-- 777 클로버 7배 티켓 -->
        <div class="shop-item">
          <div class="shop-item-info">🎟️ 777 클로버 7배 티켓<br><small>게임 중 획득 배율 x7</small></div>
          <button id="btnX7" class="shop-buy-btn" onclick="buyItem('x7', 777)">구매 (777개)</button>
        </div>
        <!-- 10000 클로버 100배 티켓 -->
        <div class="shop-item">
          <div class="shop-item-info">🎟️ 10000 클로버 100배 티켓<br><small>게임 중 획득 배율 x100</small></div>
          <button id="btnX100" class="shop-buy-btn" onclick="buyItem('x100', 10000)">구매 (10000개)</button>
        </div>
      </div>
    </div>

    <!-- 4) 시간표 표 영역 -->
    <div class="schedule-wrapper">
      <table id="scheduleTable"></table>
    </div>

  </div>

  <script>
    /* ========================================================== */
    /* 데이터 설정 영역 - [여기만 고치세요]                      */
    /* ========================================================== */
    const TITLE = '🍀 행운의 생일날 시간표 🍀';
    const TARGET = { label: '생일', date: '2026-03-02' };
    const DAYS = ['월', '화', '수', '목', '금'];
    const PERIODS = [
      { time: '09:00', subjects: ['체육', '창체', '창체', '창체', '미술'] },
      { time: '10:00', subjects: ['체육', '체육', '창체', '창체', '창체'] },
      { time: '11:00', subjects: ['미술', '체육', '체육', '창체', '창체'] },
      { time: '13:00', subjects: ['창체', '미술', '체육', '체육', '창체'] },
      { time: '14:00', subjects: ['창체', '창체', '미술', '체육', '체육'] }
    ];
    /* ========================================================== */

    // 게임 및 상점 상태 변수
    let isPlaying = false;
    let isCountdown = false;
    let currentScore = 0;
    let totalClover = 0;
    let timeLeft = 10;
    let timerId = null;

    // 상점 업그레이드 상태 변수
    let hasUnlimited = false;     // 무제한 티켓 구매 여부
    let cloverMultiplier = 1;     // 기본 획득 배율 (2배, 7배, 100배)

    // 1. D-Day 계산 함수
    function initDday() {
      const titleEl = document.getElementById('titleContainer');
      const ddayEl = document.getElementById('ddayContainer');
      const congratsEl = document.getElementById('congratsContainer');

      titleEl.innerText = TITLE + ' (' + TARGET.label + '까지)';

      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const targetMonthDay = TARGET.date.slice(5);
      const currentYear = today.getFullYear();

      let targetDate = new Date(currentYear + '-' + targetMonthDay);
      targetDate.setHours(0, 0, 0, 0);

      if (today > targetDate) {
        targetDate = new Date((currentYear + 1) + '-' + targetMonthDay);
        targetDate.setHours(0, 0, 0, 0);
      }

      const diffTime = targetDate - today;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

      if (diffDays > 0) {
        ddayEl.innerText = `🍀 D - ${diffDays} 🍀`;
        congratsEl.innerHTML = '';
      } else if (diffDays === 0) {
        ddayEl.innerText = `🍀 D - Day! 🍀`;
        congratsEl.innerHTML = `<div class="congrats-message">🍀🎉 생일을 진심으로 축하합니다! 🎂✨🍀</div>`;
      }
    }

    // 2. 시간표 표 생성 함수
    function initSchedule() {
      const tableEl = document.getElementById('scheduleTable');
      let html = '';

      html += '<thead><tr>';
      html += '<th>교시</th>';
      html += '<th>시간</th>';
      for (let i = 0; i < DAYS.length; i++) {
        html += `<th>${DAYS[i]}요일</th>`;
      }
      html += '</tr></thead>';

      html += '<tbody>';
      for (let p = 0; p < PERIODS.length; p++) {
        html += '<tr>';
        html += `<td><strong>${p + 1}교시</strong></td>`;
        html += `<td>${PERIODS[p].time}</td>`;
        for (let d = 0; d < PERIODS[p].subjects.length; d++) {
          html += `<td>${PERIODS[p].subjects[d]}</td>`;
        }
        html += '</tr>';
      }
      html += '</tbody>';

      tableEl.innerHTML = html;
    }

    // 3. 상점 아이템 구매 함수
    function buyItem(type, cost) {
      if (totalClover < cost) {
        alert('클로버가 부족합니다!');
        return;
      }

      // 비용 차감 후 보관함 갱신
      totalClover -= cost;
      document.getElementById('totalCloverCount').innerText = totalClover;

      // 상점 아이템 효과 적용
      if (type === 'unlimited') {
        hasUnlimited = true;
        const btn = document.getElementById('btnUnlimited');
        btn.innerText = '구매 완료';
        btn.disabled = true;
      } else if (type === 'x2') {
        cloverMultiplier = 2;
        document.getElementById('btnX2').innerText = '적용 중 (x2)';
      } else if (type === 'x7') {
        cloverMultiplier = 7;
        document.getElementById('btnX2').innerText = '구매됨';
        document.getElementById('btnX7').innerText = '적용 중 (x7)';
      } else if (type === 'x100') {
        cloverMultiplier = 100;
        document.getElementById('btnX2').innerText = '구매됨';
        document.getElementById('btnX7').innerText = '구매됨';
        document.getElementById('btnX100').innerText = '적용 중 (x100)';
      }

      playBellSound(1046.50, 0.4); // 상쾌한 고음 벨소리
      checkShopButtons();
    }

    // 4. 보유 클로버 개수에 따른 상점 버튼 활성화/비활성화 제어
    function checkShopButtons() {
      if (!hasUnlimited) {
        document.getElementById('btnUnlimited').disabled = (totalClover < 10);
      }
      if (cloverMultiplier < 2) {
        document.getElementById('btnX2').disabled = (totalClover < 100);
      }
      if (cloverMultiplier < 7) {
        document.getElementById('btnX7').disabled = (totalClover < 777);
      }
      if (cloverMultiplier < 100) {
        document.getElementById('btnX100').disabled = (totalClover < 10000);
      }
    }

    // 5. 게임 시작 전 3초 쿨타임(카운트다운)
    function startCountdown() {
      if (isPlaying || isCountdown) return;

      isCountdown = true;
      let count = 3;
      const statusEl = document.getElementById('gameStatus');
      const btnEl = document.getElementById('startBtn');

      btnEl.style.display = 'none';
      statusEl.innerText = `준비... ${count}`;
      playBellSound(400, 0.2);

      let countInterval = setInterval(function() {
        count--;
        if (count > 0) {
          statusEl.innerText = `준비... ${count}`;
          playBellSound(400, 0.2);
        } else {
          clearInterval(countInterval);
          isCountdown = false;
          beginGame();
        }
      }, 1000);
    }

    // 6. 10초 스페이스바 연타 게임 시작
    function beginGame() {
      isPlaying = true;
      currentScore = 0;
      timeLeft = 10;

      const statusEl = document.getElementById('gameStatus');
      statusEl.innerText = `남은 시간: ${timeLeft}초 | 획득: ${currentScore}개`;

      timerId = setInterval(function() {
        timeLeft--;
        if (timeLeft > 0) {
          statusEl.innerText = `남은 시간: ${timeLeft}초 | 획득: ${currentScore}개`;
        } else {
          clearInterval(timerId);
          isPlaying = false;
          statusEl.innerText = `게임 종료! 이번 판에 ${currentScore}개 획득!`;
          document.getElementById('startBtn').style.display = 'inline-block';
          document.getElementById('startBtn').innerText = '다시 하기';
          checkShopButtons();
        }
      }, 1000);
    }

    // 7. 벨 소리 효과 재생
    function playBellSound(customFreq = 783.99, duration = 0.5) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(customFreq, audioCtx.currentTime);

        gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    // 8. 스페이스바 키 입력 이벤트 처리
    function initKeyboardEffect() {
      document.addEventListener('keydown', function(event) {
        if (event.code === 'Space' || event.key === ' ') {
          event.preventDefault(); // 스크롤 내림 방지

          let addAmount = 0;

          // 게임 진행 중일 때는 배율이 적용된 클로버 획득
          if (isPlaying) {
            addAmount = cloverMultiplier;
            currentScore += addAmount;
            totalClover += addAmount;

            document.getElementById('gameStatus').innerText = `남은 시간: ${timeLeft}초 | 획득: ${currentScore}개`;
            document.getElementById('totalCloverCount').innerText = totalClover;
            playBellSound(783.99, 0.5);
          } 
          // 평상시 무제한 티켓을 구매했다면 누를 때마다 +1개 획득
          else if (hasUnlimited) {
            addAmount = 1;
            totalClover += addAmount;
            document.getElementById('totalCloverCount').innerText = totalClover;
            playBellSound(600, 0.2);
          } 
          // 그 외 상태에서는 소리만 재생
          else {
            playBellSound(600, 0.3);
          }

          // 상점 버튼 활성 상태 실시간 갱신
          checkShopButtons();

          // 플로팅 클로버 애니메이션 생성
          const clover = document.createElement('span');
          clover.innerText = '🍀';
          clover.className = 'click-clover';

          const randomX = Math.random() * (window.innerWidth - 100) + 50;
          const randomY = window.innerHeight / 2 + (Math.random() * 100 - 50);

          clover.style.left = randomX + 'px';
          clover.style.top = randomY + 'px';

          document.body.appendChild(clover);

          setTimeout(function() {
            clover.remove();
          }, 800);
        }
      });
    }

    // 초기 실행
    window.onload = function() {
      initDday();
      initSchedule();
      initKeyboardEffect();
      checkShopButtons();
    };
  </script>

</body>
</html>
