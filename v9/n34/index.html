<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"> <!-- 한글 깨짐 방지를 위한 문자 인코딩 설정 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 모바일 화면 크기 맞춤 -->
  <title>D-Day & 시간표 다이어리</title> <!-- 웹 브라우저 탭에 표시될 제목 -->
  
  <!-- '잘난체' (JalnanNeo) 폰트 불러오기 -->
  <link href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2202-2@1.0/JalnanNeoTTFDetail.woff2" rel="preload" as="font" type="font/woff2" crossorigin>
  
  <style>
    /* 잘난체 폰트 정의 */
    @font-face {
      font-family: 'JalnanNeo';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2202-2@1.0/JalnanNeoTTFDetail.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
    }

    /* 전체 페이지 기본 스타일 설정 (공책 배경 콘셉트) */
    body {
      font-family: 'JalnanNeo', sans-serif; /* 전체 폰트를 잘난체로 설정 */
      background-color: #f2eee5; /* 따뜻한 공책 종이 바탕색 */
      /* 격자(줄노트) 배경 패턴 생성 */
      background-image: 
        linear-gradient(rgba(180, 170, 150, 0.25) 1px, transparent 1px),
        linear-gradient(90deg, rgba(180, 170, 150, 0.25) 1px, transparent 1px);
      background-size: 24px 24px; /* 격자 간격 크기 */
      margin: 0; /* 여백 제거 */
      padding: 30px 20px; /* 안쪽 여백 추가 */
      display: flex; /* 요소를 중앙 배치하기 위한 수직 정렬 상자 */
      flex-direction: column; /* 요소들을 위에서 아래로 세로 배치 */
      align-items: center; /* 가운데 정렬 */
    }

    /* 입체감이 강화된 공책 카드 컨테이너 스타일 */
    .card {
      background-color: #fffefb; /* 공책 내지 색상 */
      border-radius: 16px; /* 모서리 둥글게 */
      border: 2px solid #e2dad0; /* 카드 테두리 */
      /* 다중 그림자로 3D 입체감 연출 */
      box-shadow: 
        0 10px 25px rgba(0, 0, 0, 0.08),
        0 4px 6px rgba(0, 0, 0, 0.04),
        inset 0 0 12px rgba(0, 0, 0, 0.02);
      padding: 24px 30px; /* 안쪽 여백 */
      margin-bottom: 25px; /* 아래쪽 간격 */
      width: 100%; /* 너비 전체 */
      max-width: 620px; /* 최대 너비 제한 */
      box-sizing: border-box; /* 패딩 포함 너비 계산 */
      position: relative; /* 위치 기준점 설정 */
    }

    /* 상단 오늘 날짜 표시 스타일 (왼쪽 위 배치) */
    .today-banner {
      width: 100%;
      max-width: 620px;
      text-align: left; /* 왼쪽 정렬 */
      margin-bottom: 12px;
      padding-left: 5px;
    }

    .today-date-text {
      font-size: 1.8rem; /* 큼지막한 날짜 글자 크기 */
      color: #4a3e3d; /* 손글씨 느낌 밤색 */
      text-shadow: 1px 1px 0px #fff;
    }

    /* D-Day 카운터 상자 (보라색 계열 파스텔 적용) */
    .dday-card {
      background: linear-gradient(135deg, #f3e8ff 0%, #e9d5ff 100%);
      border: 2px solid #d8b4fe;
      box-shadow: 
        0 12px 20px rgba(168, 85, 247, 0.15),
        0 4px 6px rgba(168, 85, 247, 0.08);
      text-align: center;
    }

    /* D-Day 목표 이름 입력칸 스타일 */
    .dday-title-input {
      font-family: 'JalnanNeo', sans-serif;
      font-size: 1.2rem;
      color: #6b21a8;
      background: transparent;
      border: none;
      border-bottom: 2px dashed #c084fc;
      text-align: center;
      width: 80%;
      padding: 4px;
      outline: none;
      margin-bottom: 10px;
    }

    /* D-Day 목표 날짜 선택 입력창 스타일 */
    .dday-date-input {
      font-family: 'JalnanNeo', sans-serif;
      font-size: 0.95rem;
      color: #7e22ce;
      background: #ffffff;
      border: 1px solid #c084fc;
      border-radius: 8px;
      padding: 4px 8px;
      outline: none;
      cursor: pointer;
      margin-bottom: 12px;
    }

    /* D-Day 대기시간 표시 스타일 */
    .dday-count {
      font-size: 2.8rem;
      font-weight: bold;
      color: #7e22ce;
      text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8);
    }

    /* 카드 내부 제목 스타일 */
    h2 {
      color: #4a3e3d;
      margin-top: 0;
      margin-bottom: 15px;
      text-align: center;
    }

    /* 시간표 표(Table) 스타일 */
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 6px;
      margin-top: 10px;
    }

    /* 표의 제목 셀(th)과 내용 셀(td) 공통 스타일 */
    th, td {
      border-radius: 8px;
      padding: 6px 4px;
      text-align: center;
      font-size: 0.9rem;
      box-shadow: 
        0 3px 5px rgba(0, 0, 0, 0.06),
        inset 0 1px 1px rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(0, 0, 0, 0.05);
    }

    th {
      background-color: #e2e8f0;
      color: #334155;
    }

    td:first-child {
      background-color: #f1f5f9;
      color: #475569;
      font-size: 0.85rem;
    }

    /* 직접 수정 가능한 셀 입력창(input) 스타일 */
    .cell-input {
      width: 100%;
      border: none;
      background: transparent;
      font-family: 'JalnanNeo', sans-serif;
      font-size: 0.85rem;
      text-align: center;
      outline: none;
      color: #334155;
      box-sizing: border-box;
    }

    /* 기분 선택 버튼 그룹 스타일 */
    .mood-container {
      display: flex;
      justify-content: space-around;
      margin-bottom: 15px;
      background: #fdfbf7;
      padding: 10px;
      border-radius: 12px;
      border: 1px dashed #d6c7b2;
    }

    .mood-btn {
      font-size: 1.8rem;
      background: none;
      border: none;
      cursor: pointer;
      opacity: 0.4; /* 선택 안 됨 기본 흐림 */
      transition: transform 0.2s, opacity 0.2s;
      padding: 5px;
    }

    .mood-btn.selected {
      opacity: 1.0; /* 선택된 기분 강조 */
      transform: scale(1.3); /* 선택 시 살짝 커짐 */
    }

    /* 다이어리 텍스트 입력 영역(textarea) 스타일 */
    .diary-textarea {
      width: 100%;
      height: 120px;
      font-family: 'JalnanNeo', sans-serif;
      font-size: 0.95rem;
      line-height: 1.6;
      padding: 12px;
      border: 1px solid #e2dad0;
      border-radius: 10px;
      /* 공책 줄노트 줄무늬 배경 */
      background: repeating-linear-gradient(
        #fffefb,
        #fffefb 28px,
        #e2dad0 29px
      );
      resize: vertical;
      outline: none;
      box-sizing: border-box;
      color: #4a3e3d;
    }
  </style>
</head>
<body>

  <!-- 1) 오늘 날짜 표시 (왼쪽 상단 큼지막하게) -->
  <div class="today-banner">
    <div id="today-display" class="today-date-text">📅 오늘 날짜 불러오는 중...</div>
  </div>

  <!-- 2) 직접 수정 가능한 D-Day 카운터 (보라색 파스텔) -->
  <div class="card dday-card">
    <!-- 목표 이름 직접 입력 -->
    <input type="text" id="target-title-input" class="dday-title-input" value="2026년 기말고사 대기시간" oninput="saveData()" placeholder="목표 이름을 입력하세요">
    <br>
    <!-- 목표 날짜 직접 선택 -->
    <input type="date" id="target-date-input" class="dday-date-input" value="2026-12-25" onchange="updateDDay(); saveData();">
    
    <!-- 계산된 D-Day 대기시간 표시 -->
    <div id="dday-text" class="dday-count">D-Day</div>
  </div>

  <!-- 3) 직접 수정 가능한 시간표 영역 -->
  <div class="card">
    <h2>주간 시간표 (칸 클릭 후 직접 수정)</h2>
    <table>
      <thead>
        <tr>
          <th>교시</th>
          <th>월</th>
          <th>화</th>
          <th>수</th>
          <th>목</th>
          <th>금</th>
        </tr>
      </thead>
      <tbody id="timetable-body">
        <!-- 자바스크립트로 직접 수정 가능한 입력칸 셀들이 생성됩니다 -->
      </tbody>
    </table>
  </div>

  <!-- 4) 오늘 기분 & 다이어리 작성 영역 -->
  <div class="card">
    <h2>오늘 나의 기분</h2>
    <!-- 기분 이모지 선택 버튼 -->
    <div class="mood-container">
      <button class="mood-btn" onclick="selectMood('😄')">😄</button>
      <button class="mood-btn" onclick="selectMood('😊')">😊</button>
      <button class="mood-btn" onclick="selectMood('😐')">😐</button>
      <button class="mood-btn" onclick="selectMood('😢')">😢</button>
      <button class="mood-btn" onclick="selectMood('😡')">😡</button>
    </div>

    <h2>오늘의 다이어리</h2>
    <!-- 줄노트 스타일 다이어리 글상자 -->
    <textarea id="diary-input" class="diary-textarea" placeholder="오늘 하루는 어땠나요? 자유롭게 기록해 보세요..." oninput="saveData()"></textarea>
  </div>

  <script>
    // ==========================================
    // 기본 데이터 초기값
    // ==========================================

    // 기본 시간표 데이터 (1~6교시)
    let timetableData = [
      ["국어", "수학", "영어", "사회", "과학"],
      ["수학", "국어", "체육", "과학", "영어"],
      ["영어", "사회", "음악", "수학", "국어"],
      ["과학", "영어", "미술", "역사", "수학"],
      ["사회", "체육", "도덕", "영어", "자율"],
      ["동아리", "한문", "진로", "정보", "학급"]
    ];

    // 기본 방과후 데이터 (월, 목, 금)
    let afterSchoolData = ["코딩방과후", "", "", "축구교실", "밴드부"];

    // 과목별 지정 파스텔 색상 모음
    const PASTEL_COLORS = [
      "#FFB3BA", "#FFDFBA", "#FFFFBA", "#BAFFC9", 
      "#BAE1FF", "#E8AEFF", "#D5AAFF", "#FFC6FF", 
      "#F0E68C", "#E0FEFE", "#C7CEEA", "#FFDAC1"
    ];

    // 밝은 초록 파스텔 (방과후 전용)
    const BRIGHT_GREEN = "#86efac";

    const subjectColorMap = {};
    let colorIndex = 0;

    // 과목명에 따른 파스텔 색상 반환 함수
    function getSubjectColor(subjectName) {
      if (!subjectName || subjectName.trim() === "") return "#ffffff";
      if (!subjectColorMap[subjectName]) {
        subjectColorMap[subjectName] = PASTEL_COLORS[colorIndex % PASTEL_COLORS.length];
        colorIndex++;
      }
      return subjectColorMap[subjectName];
    }

    // 1) 오늘 날짜 상단 왼쪽 표시 함수
    function displayTodayDate() {
      const today = new Date();
      const year = today.getFullYear();
      const month = today.getMonth() + 1;
      const date = today.getDate();
      const dayNames = ["일", "월", "화", "수", "목", "금", "토"];
      const day = dayNames[today.getDay()];

      document.getElementById("today-display").innerText = `📅 ${year}년 ${month}월 ${date}일 (${day})`;
    }

    // 2) D-Day 대기시간 계산 함수
    function updateDDay() {
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const targetDateStr = document.getElementById("target-date-input").value;
      if (!targetDateStr) return;

      const targetDate = new Date(targetDateStr);
      targetDate.setHours(0, 0, 0, 0);

      const diffTime = targetDate - today;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

      const ddayElement = document.getElementById("dday-text");
      if (diffDays > 0) {
        ddayElement.innerText = "D-" + diffDays;
      } else if (diffDays === 0) {
        ddayElement.innerText = "D-DAY!";
      } else {
        ddayElement.innerText = "D+" + Math.abs(diffDays);
      }
    }

    // 3) 시간표 및 방과후 생성/수정 가능 테이블 렌더링 함수
    function renderTimetable() {
      const tbody = document.getElementById("timetable-body");
      tbody.innerHTML = "";

      // 1~6교시 렌더링
      timetableData.forEach((periodData, pIndex) => {
        const row = document.createElement("tr");

        const periodCell = document.createElement("td");
        periodCell.innerText = (pIndex + 1) + "교시";
        row.appendChild(periodCell);

        periodData.forEach((subject, dIndex) => {
          const cell = document.createElement("td");
          const input = document.createElement("input");
          input.type = "text";
          input.className = "cell-input";
          input.value = subject;

          // 배경색 설정
          cell.style.backgroundColor = getSubjectColor(subject);

          // 내용 직접 입력 수정 시 데이터 업데이트 및 저장
          input.oninput = function() {
            timetableData[pIndex][dIndex] = this.value;
            cell.style.backgroundColor = getSubjectColor(this.value);
            saveData();
          };

          cell.appendChild(input);
          row.appendChild(cell);
        });

        tbody.appendChild(row);
      });

      // 방과후 맨 아래 행 렌더링
      const afterRow = document.createElement("tr");
      const afterTitleCell = document.createElement("td");
      afterTitleCell.innerText = "방과후";
      afterRow.appendChild(afterTitleCell);

      afterSchoolData.forEach((activity, dIndex) => {
        const cell = document.createElement("td");
        const input = document.createElement("input");
        input.type = "text";
        input.className = "cell-input";
        input.value = activity;

        if (activity.trim() !== "") {
          cell.style.backgroundColor = BRIGHT_GREEN;
          input.style.color = "#14532d";
        } else {
          cell.style.backgroundColor = "#f8fafc";
        }

        // 방과후 칸 수정 시 처리
        input.oninput = function() {
          afterSchoolData[dIndex] = this.value;
          if (this.value.trim() !== "") {
            cell.style.backgroundColor = BRIGHT_GREEN;
            this.style.color = "#14532d";
          } else {
            cell.style.backgroundColor = "#f8fafc";
            this.style.color = "#334155";
          }
          saveData();
        };

        cell.appendChild(input);
        afterRow.appendChild(cell);
      });

      tbody.appendChild(afterRow);
    }

    // 4) 기분 선택 처리 함수
    let selectedMood = "";
    function selectMood(emoji) {
      selectedMood = emoji;
      const buttons = document.querySelectorAll(".mood-btn");
      buttons.forEach(btn => {
        if (btn.innerText === emoji) {
          btn.classList.add("selected");
        } else {
          btn.classList.remove("selected");
        }
      });
      saveData();
    }

    // 5) 작성 데이터 브라우저(LocalStorage) 자동 저장 함수
    function saveData() {
      const dataToSave = {
        targetTitle: document.getElementById("target-title-input").value,
        targetDate: document.getElementById("target-date-input").value,
        timetable: timetableData,
        afterSchool: afterSchoolData,
        mood: selectedMood,
        diary: document.getElementById("diary-input").value
      };
      localStorage.setItem("myDiaryData", JSON.stringify(dataToSave));
    }

    // 6) 브라우저에 저장된 데이터 불러오기 함수
    function loadData() {
      const saved = localStorage.getItem("myDiaryData");
      if (saved) {
        const parsed = JSON.parse(saved);
        if (parsed.targetTitle) document.getElementById("target-title-input").value = parsed.targetTitle;
        if (parsed.targetDate) document.getElementById("target-date-input").value = parsed.targetDate;
        if (parsed.timetable) timetableData = parsed.timetable;
        if (parsed.afterSchool) afterSchoolData = parsed.afterSchool;
        if (parsed.diary) document.getElementById("diary-input").value = parsed.diary;
        if (parsed.mood) selectMood(parsed.mood);
      }
    }

    // 페이지 로드 시 초기 실행
    displayTodayDate();
    loadData();
    updateDDay();
    renderTimetable();
  </script>
</body>
</html>
