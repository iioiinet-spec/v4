<!DOCTYPE html>
<!-- HTML5 문서입니다. -->
<html lang="ko">
<!-- 문서의 언어를 한국어로 설정합니다. -->

<head>
  <!-- 한글 사용을 위한 문자 인코딩입니다. -->
  <meta charset="UTF-8">
  <!-- 모바일에서도 화면 크기에 맞게 표시합니다. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 브라우저 탭에 표시될 제목입니다. -->
  <title>나의 오늘 일기</title>

  <style>
    /* 전체 화면에서 사용할 색상입니다. */
    :root {
      --yellow: #ffd83d; /* 밝은 노란색입니다. */
      --orange: #ff9f00; /* 주황색 포인트입니다. */
      --brown: #593d25; /* 글씨와 테두리에 사용할 갈색입니다. */
      --paper: #fffdf2; /* 일기장의 종이 색상입니다. */
      --white: #ffffff; /* 흰색입니다. */
      --shadow: rgba(70, 40, 10, 0.25); /* 그림자 색상입니다. */
    }

    /* 모든 요소의 크기 계산을 쉽게 합니다. */
    * {
      box-sizing: border-box;
    }

    /* 페이지 전체의 기본 디자인입니다. */
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Comic Sans MS", "Malgun Gothic", sans-serif;
      color: var(--brown);
      background: var(--yellow) url("background.png") center bottom / cover no-repeat fixed;
      overflow-x: hidden;
    }

    /* 화면 전체에 살짝 밝은 막을 씌워 글자가 잘 보이게 합니다. */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(255, 196, 30, 0.08);
      pointer-events: none;
      z-index: -1;
    }

    /* 일기장의 전체 크기와 위치를 정합니다. */
    .diary {
      width: min(92%, 720px);
      margin: 35px auto 100px;
      padding: 26px;
      background: rgba(255, 253, 242, 0.94);
      border: 3px solid var(--brown);
      border-radius: 18px;
      box-shadow: 0 14px 35px var(--shadow);
    }

    /* 일기장 제목입니다. */
    h1 {
      margin: 0 0 22px;
      text-align: center;
      font-size: clamp(28px, 6vw, 46px);
      color: var(--brown);
    }

    /* 이름과 날짜를 담는 위쪽 영역입니다. */
    .top-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 15px;
    }

    /* 각각의 입력 영역입니다. */
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* 입력 영역의 제목입니다. */
    label {
      font-weight: bold;
      font-size: 15px;
    }

    /* 이름 입력창입니다. */
    input {
      width: 100%;
      padding: 12px;
      border: 2px solid var(--brown);
      border-radius: 10px;
      background: var(--white);
      color: var(--brown);
      font-size: 16px;
      outline: none;
    }

    /* 입력창을 눌렀을 때 강조합니다. */
    input:focus {
      border-color: var(--orange);
    }

    /* 날씨와 기분 선택 영역입니다. */
    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 18px;
    }

    /* 선택 버튼들을 담는 영역입니다. */
    .choice-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    /* 날씨와 기분 버튼의 기본 모양입니다. */
    .choice {
      padding: 8px 11px;
      border: 2px solid var(--brown);
      border-radius: 20px;
      background: var(--white);
      color: var(--brown);
      cursor: pointer;
      font-size: 14px;
    }

    /* 선택된 버튼의 모양입니다. */
    .choice.selected {
      background: var(--yellow);
      box-shadow: 0 3px 0 var(--brown);
      transform: translateY(-1px);
    }

    /* 일기 제목 입력창입니다. */
    .diary-title {
      margin-bottom: 12px;
    }

    /* 일기 내용을 보여주는 종이입니다. */
    .paper {
      position: relative;
      min-height: 320px;
      padding: 22px 22px 30px 48px;
      overflow: hidden;
      background:
        repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent 31px,
          rgba(100, 130, 180, 0.22) 32px
        ),
        var(--paper);
      border: 2px solid var(--brown);
      border-radius: 10px;
    }

    /* 종이 왼쪽의 세로 줄입니다. */
    .paper::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 34px;
      width: 2px;
      background: rgba(220, 80, 80, 0.35);
    }

    /* 사용자가 입력할 일기 영역입니다. */
    #diaryInput {
      width: 100%;
      min-height: 270px;
      resize: vertical;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--brown);
      font-family: "Comic Sans MS", "Malgun Gothic", sans-serif;
      font-size: 18px;
      line-height: 32px;
    }

    /* 글자가 나타나는 애니메이션용 일기 영역입니다. */
    #writtenDiary {
      display: none;
      min-height: 270px;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 18px;
      line-height: 32px;
    }

    /* 버튼 영역입니다. */
    .actions {
      display: flex;
      justify-content: center;
      margin-top: 20px;
    }

    /* 다 적었어요 버튼입니다. */
    #doneButton {
      padding: 13px 28px;
      border: 3px solid var(--brown);
      border-radius: 30px;
      background: var(--yellow);
      color: var(--brown);
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 0 var(--brown);
    }

    /* 버튼을 눌렀을 때 살짝 내려갑니다. */
    #doneButton:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 var(--brown);
    }

    /* 실제 연필처럼 보이는 연필입니다. */
    #pencil {
      position: fixed;
      display: none;
      width: 92px;
      height: 20px;
      z-index: 20;
      pointer-events: none;
      transform-origin: 90% 50%;
      filter: drop-shadow(3px 4px 3px rgba(0, 0, 0, 0.25));
    }

    /* 연필의 나무 부분입니다. */
    #pencil::before {
      content: "";
      position: absolute;
      left: 0;
      top: 2px;
      width: 16px;
      height: 16px;
      background: #e7c49a;
      clip-path: polygon(0 50%, 100% 0, 100% 100%);
    }

    /* 연필의 흑연 부분입니다. */
    #pencil::after {
      content: "";
      position: absolute;
      left: 0;
      top: 7px;
      width: 5px;
      height: 6px;
      background: #333;
      clip-path: polygon(0 50%, 100% 0, 100% 100%);
    }

    /* 연필 몸통입니다. */
    .pencil-body {
      position: absolute;
      left: 12px;
      top: 2px;
      width: 65px;
      height: 16px;
      border-radius: 3px;
      background: linear-gradient(
        to bottom,
        #f4c542 0%,
        #ffd95a 45%,
        #eab52f 100%
      );
    }

    /* 연필 뒤쪽 지우개입니다. */
    .pencil-eraser {
      position: absolute;
      right: 3px;
      top: 2px;
      width: 15px;
      height: 16px;
      border-radius: 0 5px 5px 0;
      background: #f08ca1;
    }

    /* 애니메이션 중 입력창을 숨깁니다. */
    .writing #diaryInput {
      display: none;
    }

    /* 애니메이션 중 결과 텍스트를 표시합니다. */
    .writing #writtenDiary {
      display: block;
    }

    /* 완료 후 표시되는 메시지입니다. */
    #message {
      min-height: 24px;
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }

    /* 작은 화면에서는 위쪽 정보를 한 줄씩 표시합니다. */
    @media (max-width: 600px) {
      /* 모바일에서 이름과 날짜를 세로로 배치합니다. */
      .top-info {
        grid-template-columns: 1fr;
      }

      /* 모바일에서 날씨와 기분도 세로로 배치합니다. */
      .choices {
        grid-template-columns: 1fr;
      }

      /* 모바일에서 일기장의 여백을 줄입니다. */
      .diary {
        padding: 18px;
      }

      /* 모바일에서 종이의 왼쪽 여백을 줄입니다. */
      .paper {
        padding-left: 38px;
      }

      /* 모바일에서 세로 줄 위치를 옮깁니다. */
      .paper::before {
        left: 26px;
      }
    }
  </style>
</head>

<body>
  <!-- 일기장 전체입니다. -->
  <main class="diary">

    <!-- 일기장 제목입니다. -->
    <h1>오늘의 일기 ✏️</h1>

    <!-- 이름과 날짜 영역입니다. -->
    <div class="top-info">

      <!-- 이름 입력 영역입니다. -->
      <div class="field">
        <!-- 이름 입력창의 설명입니다. -->
        <label for="name">이름</label>
        <!-- 이름을 입력하는 칸입니다. -->
        <input id="name" type="text" placeholder="이름을 적어주세요">
      </div>

      <!-- 날짜 표시 영역입니다. -->
      <div class="field">
        <!-- 날짜의 설명입니다. -->
        <label>날짜</label>
        <!-- 오늘 날짜가 자동으로 표시됩니다. -->
        <input id="date" type="text" readonly>
      </div>
    </div>

    <!-- 날씨와 기분 선택 영역입니다. -->
    <div class="choices">

      <!-- 날씨 선택 영역입니다. -->
      <div class="field">
        <!-- 날씨 제목입니다. -->
        <label>날씨</label>

        <!-- 날씨 버튼들입니다. -->
        <div class="choice-buttons" id="weatherButtons">
          <!-- 맑음 버튼입니다. -->
          <button class="choice" data-value="☀️ 맑음">☀️ 맑음</button>
          <!-- 흐림 버튼입니다. -->
          <button class="choice" data-value="☁️ 흐림">☁️ 흐림</button>
          <!-- 비 버튼입니다. -->
          <button class="choice" data-value="🌧️ 비">🌧️ 비</button>
          <!-- 눈 버튼입니다. -->
          <button class="choice" data-value="❄️ 눈">❄️ 눈</button>
        </div>
      </div>

      <!-- 기분 선택 영역입니다. -->
      <div class="field">
        <!-- 기분 제목입니다. -->
        <label>기분</label>

        <!-- 기분 버튼들입니다. -->
        <div class="choice-buttons" id="moodButtons">
          <!-- 행복 버튼입니다. -->
          <button class="choice" data-value="😄 행복">😄 행복</button>
          <!-- 보통 버튼입니다. -->
          <button class="choice" data-value="🙂 보통">🙂 보통</button>
          <!-- 피곤 버튼입니다. -->
          <button class="choice" data-value="😴 피곤">😴 피곤</button>
          <!-- 속상 버튼입니다. -->
          <button class="choice" data-value="😢 속상">😢 속상</button>
        </div>
      </div>
    </div>

    <!-- 일기 제목을 입력하는 칸입니다. -->
    <div class="field diary-title">
      <!-- 제목 입력창의 설명입니다. -->
      <label for="title">제목</label>
      <!-- 일기 제목 입력창입니다. -->
      <input id="title" type="text" placeholder="오늘의 제목">
    </div>

    <!-- 일기를 쓰는 종이입니다. -->
    <section class="paper" id="paper">

      <!-- 사용자가 일기를 입력하는 영역입니다. -->
      <textarea id="diaryInput" placeholder="오늘 있었던 일을 자유롭게 적어보세요."></textarea>

      <!-- 연필 애니메이션으로 나타날 일기입니다. -->
      <div id="writtenDiary"></div>
    </section>

    <!-- 버튼 영역입니다. -->
    <div class="actions">
      <!-- 일기 작성을 완료하는 버튼입니다. -->
      <button id="doneButton">다 적었어요 ✏️</button>
    </div>

    <!-- 애니메이션 상태 메시지입니다. -->
    <div id="message"></div>
  </main>

  <!-- 화면에 나타날 연필입니다. -->
  <div id="pencil">
    <!-- 연필 몸통입니다. -->
    <div class="pencil-body"></div>
    <!-- 연필 지우개입니다. -->
    <div class="pencil-eraser"></div>
  </div>

  <script>
    // 오늘 날짜를 입력창에 넣습니다.
    const dateInput = document.getElementById("date");

    // 현재 날짜를 가져옵니다.
    const today = new Date();

    // 날짜를 한국어 형식으로 만듭니다.
    const dateText =
      `${today.getFullYear()}년 ${today.getMonth() + 1}월 ${today.getDate()}일`;

    // 날짜 입력창에 오늘 날짜를 표시합니다.
    dateInput.value = dateText;

    // 날씨와 기분 버튼을 처리하는 함수입니다.
    function setupChoices(containerId) {
      // 버튼이 들어 있는 영역을 가져옵니다.
      const container = document.getElementById(containerId);

      // 영역 안의 모든 선택 버튼을 가져옵니다.
      const buttons = container.querySelectorAll(".choice");

      // 모든 버튼에 클릭 기능을 추가합니다.
      buttons.forEach(button => {
        // 버튼을 클릭했을 때 실행됩니다.
        button.addEventListener("click", () => {
          // 같은 영역의 다른 버튼 선택을 해제합니다.
          buttons.forEach(item => item.classList.remove("selected"));

          // 현재 누른 버튼을 선택 상태로 만듭니다.
          button.classList.add("selected");
        });
      });
    }

    // 날씨 버튼의 기능을 설정합니다.
    setupChoices("weatherButtons");

    // 기분 버튼의 기능을 설정합니다.
    setupChoices("moodButtons");

    // 완료 버튼을 가져옵니다.
    const doneButton = document.getElementById("doneButton");

    // 입력한 일기 영역을 가져옵니다.
    const diaryInput = document.getElementById("diaryInput");

    // 실제로 글씨가 나타날 영역을 가져옵니다.
    const writtenDiary = document.getElementById("writtenDiary");

    // 연필 요소를 가져옵니다.
    const pencil = document.getElementById("pencil");

    // 종이 영역을 가져옵니다.
    const paper = document.getElementById("paper");

    // 상태 메시지를 가져옵니다.
    const message = document.getElementById("message");

    // 완료 버튼을 눌렀을 때 실행됩니다.
    doneButton.addEventListener("click", async () => {

      // 일기 내용을 가져옵니다.
      const text = diaryInput.value.trim();

      // 일기 내용이 비어 있는지 확인합니다.
      if (!text) {
        // 내용을 먼저 적어달라는 메시지를 표시합니다.
        message.textContent = "일기를 먼저 적어주세요!";

        // 함수 실행을 멈춥니다.
        diaryInput.focus();

        // 이후 코드를 실행하지 않습니다.
        return;
      }

      // 이미 작성 중이면 다시 실행하지 않습니다.
      if (document.body.classList.contains("writing")) {
        return;
      }

      // 작성 애니메이션 상태를 시작합니다.
      document.body.classList.add("writing");

      // 버튼을 잠급니다.
      doneButton.disabled = true;

      // 버튼 글자를 변경합니다.
      doneButton.textContent = "연필이 쓰는 중...";

      // 상태 메시지를 표시합니다.
      message.textContent = "잠시만 기다려 주세요 ✏️";

      // 결과 영역을 비웁니다.
      writtenDiary.textContent = "";

      // 연필을 화면에 표시합니다.
      pencil.style.display = "block";

      // 화면의 일기 종이 위치를 가져옵니다.
      const paperRect = paper.getBoundingClientRect();

      // 연필의 시작 위치를 종이 오른쪽 위로 정합니다.
      pencil.style.left = `${paperRect.right - 105}px`;

      // 연필의 시작 위치를 종이 위쪽으로 정합니다.
      pencil.style.top = `${paperRect.top + 20}px`;

      // 총 애니메이션 시간을 12초로 설정합니다.
      const duration = 12000;

      // 글자 하나당 시간을 계산합니다.
      const delay = Math.max(18, Math.floor(duration / text.length));

      // 일기 글자를 하나씩 처리합니다.
      for (let i = 0; i < text.length; i++) {

        // 현재 글자를 결과 영역에 추가합니다.
        writtenDiary.textContent += text[i];

        // 현재 글자가 들어갈 위치를 계산합니다.
        const progress = (i + 1) / text.length;

        // 종이 안에서의 가로 위치를 계산합니다.
        const x = 48 + ((paper.clientWidth - 75) * (progress % 1));

        // 글줄이 내려가는 위치를 계산합니다.
        const line = Math.floor((i / 38));

        // 세로 위치를 계산합니다.
        const y = 25 + ((line % 8) * 32);

        // 연필을 글씨 근처로 이동시킵니다.
        pencil.style.left = `${paperRect.left + x}px`;

        // 연필을 글씨 근처의 높이로 이동시킵니다.
        pencil.style.top = `${paperRect.top + y}px`;

        // 연필이 실제로 쓰는 느낌을 위해 살짝 회전시킵니다.
        pencil.style.transform = `rotate(${i % 2 === 0 ? 7 : -5}deg)`;

        // 다음 글자까지 잠시 기다립니다.
        await new Promise(resolve => setTimeout(resolve, delay));
      }

      // 글쓰기 애니메이션이 끝났으므로 연필을 숨깁니다.
      pencil.style.display = "none";

      // 작성 중 상태를 제거합니다.
      document.body.classList.remove("writing");

      // 버튼을 다시 사용할 수 있게 합니다.
      doneButton.disabled = false;

      // 버튼 문구를 원래대로 돌립니다.
      doneButton.textContent = "다 적었어요 ✓";

      // 완료 메시지를 표시합니다.
      message.textContent = "오늘의 일기가 완성됐어요! 🌟";
    });
  </script>
</body>

</html>
