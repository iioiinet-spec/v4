<!DOCTYPE html> <!-- 이 문서는 HTML5 웹 문서임을 브라우저에 알려줍니다 -->
<html lang="ko"> <!-- 문서의 기본 언어가 한국어임을 설정합니다 -->
<head>
  <meta charset="UTF-8"> <!-- 한글 및 다국어가 깨지지 않도록 UTF-8 인코딩을 사용합니다 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 모바일 기기 화면 크기에 맞게 자동 조절(반응형)합니다 -->
  <title>D-Day 시간표</title> <!-- 브라우저 탭에 표시될 제목입니다 -->
  
  <!-- 구글 폰트(고운돋움)를 불러오는 링크 태그입니다 -->
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">

  <style>
    /* ========================================== */
    /* [여기를 고치세요] 디자인 색상 및 폰트 설정 변수 모음 */
    /* ========================================== */
    :root {
      --bg-color: #f5ede5;      /* 전체 배경 색상 */
      --card-bg: #ffd4b8;     /* 표 및 카드 배경 색상 (칸 배경) */
      --text-color: #000000;    /* 기본 글자 색상 */
      --point-color: #aa9174;   /* 강조(포인트) 색상 (제목, 테두리 등) */
      --border-radius: 15px;    /* 모서리 둥글기 값 */
    }

    /* 전체 페이지 기본 스타일 설정 */
    body {
      background-color: var(--bg-color); /* 배경 색상 변수 적용 */
      color: var(--text-color);          /* 글자 색상 변수 적용 */
      font-family: 'Gowun Dodum', sans-serif; /* 고운돋움 폰트 적용 */
      margin: 0;                         /* 브라우저 기본 여백 제거 */
      padding: 20px;                     /* 화면 안쪽 여백 추가 */
      display: flex;                     /* 요소를 유연하게 배치 */
      flex-direction: column;            /* 세로 방향으로 정렬 */
      align-items: center;               /* 가로 중앙 정렬 */
      min-height: 100vh;                 /* 최소 높이를 화면 꽉 차게 설정 */
      box-sizing: border-box;            /* 패딩이 크기에 포함되도록 설정 */
    }

    /* 메인 컨테이너 박스 */
    .container {
      width: 100%;
      max-width: 600px;                  /* 최대 너비 제한 */
      display: flex;
      flex-direction: column;
      gap: 20px;                         /* 요소들 사이의 간격 */
    }

    /* D-Day 카운터 상자 디자인 */
    .dday-box {
      background-color: var(--card-bg);  /* 칸 배경 색상 적용 */
      border: 2px solid var(--point-color); /* 포인트 색상의 테두리 */
      border-radius: var(--border-radius); /* 모서리 둥글기 적용 */
      padding: 25px;                     /* 안쪽 여백 */
      text-align: center;                /* 글자 가운데 정렬 */
    }

    /* D-Day 목표 이름 스타일 */
    .dday-title {
      font-size: 1.5rem;                 /* 글자 크기 */
      font-weight: bold;                 /* 글자 굵기 */
      margin-bottom: 10px;               /* 아래쪽 여백 */
      color: var(--point-color);         /* 포인트 색상 적용 */
    }

    /* D-Day 남은 날짜 숫자 스타일 */
    .dday-counter {
      font-size: 2.2rem;                 /* 크게 표시할 날짜 크기 */
      font-weight: bold;
    }

    /* 시간표 표 감싸는 상자 디자인 */
    .timetable-box {
      background-color: var(--card-bg);  /* 칸 배경 색상 적용 */
      border: 2px solid var(--point-color); /* 포인트 색상의 테두리 */
      border-radius: var(--border-radius); /* 모서리 둥글기 적용 */
      padding: 15px;                     /* 안쪽 여백 */
      overflow-x: auto;                  /* 화면이 작아지면 가로 스크롤 생성 */
    }

    /* 표(Table) 기본 스타일 */
    table {
      width: 100%;                       /* 가로 꽉 채우기 */
      border-collapse: collapse;         /* 표 테두리 겹침 방지 */
      text-align: center;                /* 글자 가운데 정렬 */
    }

    /* 표의 칸(Th, Td) 공통 스타일 */
    th, td {
      border: 1px solid var(--point-color); /* 칸마다 테두리 설정 */
      padding: 12px 8px;                 /* 칸 안쪽 여백 */
      font-size: 1rem;                   /* 글자 크기 */
    }

    /* 표의 제목 행(요일, 교시) 배경 */
    th {
      background-color: var(--point-color); /* 포인트 색상 배경 */
      color: #ffffff;                    /* 글자색을 흰색으로 하여 가독성 높임 */
    }

    /* 현재 진행 중인 교시 칸 감청색 강조 테두리 스타일 */
    .current-period {
      border: 2px solid #005577 !important; /* 감청색 테두리 */
      background-color: #f7ebd9 !important; /* 배경색 미세하게 살짝 강조 */
    }

    /* 주말 안내 문구 스타일 */
    .weekend-notice {
      text-align: center;
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--point-color);
      padding: 10px;
    }
  </style>
</head>
<body>

  <!-- 전체 화면을 감싸는 메인 영역 -->
  <div class="container">
    <!-- 위쪽 D-Day 카운터 영역 -->
    <div class="dday-box">
      <div id="target-title" class="dday-title">목표 이름</div>
      <div id="dday-value" class="dday-counter">D-Day 계산 중...</div>
    </div>

    <!-- 아래쪽 월~금 5교시 시간표 표 영역 -->
    <div class="timetable-box">
      <div id="weekend-message" class="weekend-notice" style="display: none;">오늘은 쉬는 날</div>
      <table id="timetable">
        <!-- JavaScript를 통해 표 내용이 이 자리에 자동으로 채워집니다 -->
      </table>
    </div>
  </div>

  <script>
    /* ========================================== */
    /* [여기를 고치세요] 시간표 내용과 목표 날짜 설정 */
    /* ========================================== */
    const TITLE  = '6학년 2학기';                     /* 목표 이름 */
    const TARGET = { label:'2027년', date:'2027-01-01' }; /* 목표 날짜 (YYYY-MM-DD 형식) */
    const DAYS   = ['월','화','수','목','금'];          /* 요일 배열 */
    const PERIODS = [
      { time:'09:00', subjects:['국어', '수학', '영어', '국어', '수학'] },
      { time:'10:00', subjects:['수학', '영어', '국어', '수학', '체육'] },
      { time:'11:00', subjects:['영어', '도덕', '체육', '과학', '미술'] },
      { time:'13:00', subjects:['사회', '국어', '수학', '과학', '미술'] },
      { time:'14:00', subjects:['사회', '수학', '과학', '창체', '국어'] },
    ]; // 교시별 시간과 과목 데이터

    /* ========================================== */
    /* [기능 로직] D-Day 계산 및 시간표 화면 출력 */
    /* ========================================== */

    // 1. D-Day 계산 및 화면 표시 함수
    function renderDDay() {
      const titleElement = document.getElementById('target-title'); // 타이틀 HTML 요소 가져오기
      const ddayElement = document.getElementById('dday-value');   // 카운터 HTML 요소 가져오기

      titleElement.textContent = `${TITLE} (${TARGET.label})`; // 타이틀 텍스트 설정

      const today = new Date();                     // 오늘 날짜 가져오기
      const targetDate = new Date(TARGET.date);     // 목표 날짜 생성
      
      // 시간 오차를 없애기 위해 년, 월, 일까지만 날짜를 비교하도록 초기화
      today.setHours(0, 0, 0, 0);
      targetDate.setHours(0, 0, 0, 0);

      const diffTime = targetDate - today;          // 목표일과 오늘 날짜의 밀리초 차이 계산
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); // 밀리초를 일(day) 단위로 변환

      // 남은 날짜에 따른 텍스트 분기 처리
      if (diffDays > 0) {
        ddayElement.textContent = `D-${diffDays}`;  // 목표일이 미래인 경우
      } else if (diffDays === 0) {
        ddayElement.textContent = 'D-Day (오늘!)'; // 오늘이 바로 목표일인 경우
      } else {
        ddayElement.textContent = `D+${Math.abs(diffDays)}`; // 목표일이 지난 경우
      }
    }

    // 2. 시간표 표(Table) 생성 및 현재 교시 강조 화면 표시 함수
    function renderTimetable() {
      const tableElement = document.getElementById('timetable'); // 테이블 HTML 요소 가져오기
      const weekendMsg = document.getElementById('weekend-message'); // 주말 메시지 요소 가져오기
      
      const now = new Date();                       // 현재 시각 가져오기
      const dayIndex = now.getDay();                // 요일 번호 (0: 일요일, 1: 월요일 ... 6: 토요일)
      const currentHour = now.getHours();           // 현재 시간(시)
      const currentMinute = now.getMinutes();       // 현재 시간(분)
      const currentTimeNum = currentHour * 60 + currentMinute; // 비교를 위해 분(minute) 단위로 환산

      // 주말(토요일: 6, 일요일: 0)인지 확인
      const isWeekend = (dayIndex === 0 || dayIndex === 6);

      if (isWeekend) {
        weekendMsg.style.display = 'block';         // 주말이면 안내 문구 표시
        tableElement.style.display = 'none';        // 표는 숨김 처리
        return;
      } else {
        weekendMsg.style.display = 'none';          // 평일이면 안내 문구 숨김
        tableElement.style.display = 'table';       // 표 표시
      }

      // 평일 요일 인덱스 변환 (월:0, 화:1, 수:2, 목:3, 금:4)
      const currentDayCol = dayIndex - 1; 

      let html = '';                                             // 생성할 HTML 문자열 변수 초기화

      // 2-1. 표의 첫 번째 행(헤더): 교시 및 요일들 표시
      html += '<thead><tr>';
      html += '<th>교시</th>'; // 가장 첫 칸은 '교시' 제목
      for (let i = 0; i < DAYS.length; i++) {
        html += `<th>${DAYS[i]}요일</th>`; // 월, 화, 수, 목, 금 요일 출력
      }
      html += '</tr></thead>';

      // 2-2. 표의 본문 행: 각 교시별 시간과 과목들 표시
      html += '<tbody>';
      for (let p = 0; p < PERIODS.length; p++) {
        html += '<tr>';
        html += `<td><strong>${p + 1}교시</strong><br><span style="font-size:0.8rem; font-weight:normal;">(${PERIODS[p].time})</span></td>`; // 몇 교시인지와 시간 표시
        
        // 해당 교시의 월~금 과목들 반복 출력
        for (let d = 0; d < PERIODS[p].subjects.length; d++) {
          let isCurrentCell = false;

          // 오늘 요일이고, 현재 시간이 해당 교시 시간 범위에 포함되는지 확인 (각 교시 간격을 1시간으로 가정하여 계산)
          if (d === currentDayCol) {
            const [pHour, pMin] = PERIODS[p].time.split(':').map(Number);
            const periodStartTime = pHour * 60 + pMin;
            const periodEndTime = periodStartTime + 60; // 1시간 동안 진행된다고 가정

            if (currentTimeNum >= periodStartTime && currentTimeNum < periodEndTime) {
              isCurrentCell = true; // 현재 교시 칸으로 판정
            }
          }

          // 현재 교시 칸인 경우 감청색 테두리 적용 클래스 부여
          html += `<td class="${isCurrentCell ? 'current-period' : ''}">${PERIODS[p].subjects[d]}</td>`;
        }
        html += '</tr>';
      }
      html += '</tbody>';

      tableElement.innerHTML = html; // 완성된 HTML을 테이블에 삽입
    }

    // 웹페이지가 완전히 로딩된 후 함수를 실행하고 1분마다 자동 갱신합니다.
    window.onload = function() {
      renderDDay();      // D-Day 계산 실행
      renderTimetable(); // 시간표 생성 실행

      // 1분(60,000 밀리초)마다 시간표와 D-Day를 자동으로 다시 갱신
      setInterval(function() {
        renderDDay();
        renderTimetable();
      }, 60000);
    };
  </script>
</body>
</html>
