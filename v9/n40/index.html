<!-- HTML5 문서 형식을 선언합니다. -->
<!DOCTYPE html>
<!-- 웹페이지의 언어를 한국어로 설정합니다. -->
<html lang="ko">
<!-- 문서의 메타데이터와 스타일을 정의하는 머리말 영역입니다. -->
<head>
    <!-- 문자 인코딩을 UTF-8로 지정합니다. -->
    <meta charset="UTF-8">
    <!-- 모바일 기기에서 화면 비율이 올바르게 맞도록 뷰포트를 설정합니다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 브라우저 탭에 표시될 문서 제목입니다. -->
    <title>D-Day 및 내가 가장 좋아하는 음식 TOP 5</title>
    <!-- 구글 폰트(Black Han Sans)를 불러오기 위한 link 태그입니다. -->
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
    <!-- 내부 스타일시트를 시작합니다. -->
    <style>
        /* :root 선택자를 이용해 재사용할 색상 변수들을 정의합니다. */
        :root {
            /* 3) 배경 색상 변수입니다 (깊은 밤의 어두운 톤). */
            --bg-color: #131616;
            /* 3) 카드 및 칸 배경 색상 변수입니다. */
            --card-bg: #153f41;
            /* 3) 기본 글자 색상 변수입니다. */
            --text-color: #fafafa;
            /* 3) 강조 및 포인트 색상 변수입니다 (형광 민트 톤). */
            --point-color: #8efbe1;
            /* 테두리나 보조 선에 사용할 투명한 포인트 색상입니다. */
            --border-color: rgba(142, 251, 225, 0.2);
        }

        /* 전체 문서의 기본 글꼴, 배경색, 여백, 기본 색상을 설정합니다. */
        body {
            /* 4) 구글 폰트 Black Han Sans를 적용합니다. */
            font-family: 'Black Han Sans', sans-serif;
            /* 정의한 배경색 변수를 적용합니다. */
            background-color: var(--bg-color);
            /* 정의한 글자색 변수를 적용합니다. */
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
        }

        /* 콘텐츠를 중앙에 배치하고 최대 너비를 제한하는 컨테이너입니다. */
        .container {
            max-width: 850px;
            margin: 0 auto;
        }

        /* D-Day 카운터 카드의 디자인, 모서리 둥글기, 그림자를 설정합니다. */
        .dday-card {
            background-color: var(--card-bg);
            /* 5) 모서리 둥글기를 14px로 설정합니다. */
            border-radius: 14px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            margin-bottom: 25px;
            border: 1px solid var(--border-color);
        }

        /* D-Day 목표 이름의 글꼴 크기와 포인트 색상을 지정합니다. */
        .dday-title {
            font-size: 22px;
            color: var(--point-color);
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        /* D-Day 남은 날짜 숫자의 크기와 포인트를 강조합니다. */
        .dday-count {
            font-size: 52px;
            color: var(--text-color);
            text-shadow: 0 0 10px rgba(142, 251, 225, 0.3);
        }

        /* 음식 순위 표를 감싸는 카드 컨테이너의 디자인을 설정합니다. */
        .timetable-card {
            background-color: var(--card-bg);
            /* 5) 모서리 둥글기를 14px로 설정합니다. */
            border-radius: 14px;
            padding: 25px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            overflow-x: auto;
            border: 1px solid var(--border-color);
        }

        /* (요청에 따라 윗줄의 "내가 가장 좋아하는 음식 TOP 5" 타이틀 문구는 완전히 제거되었습니다.) */

        /* 표 전체의 너비와 테두리 간격을 설정합니다. */
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            text-align: center;
            /* 5) 표 자체의 모서리도 14px 둥글게 처리합니다. */
            border-radius: 14px;
            overflow: hidden;
        }

        /* 표 내부의 셀(머리글 및 내용) 테두리와 패딩을 지정합니다. */
        th, td {
            border: 1px solid var(--border-color);
            padding: 16px 12px;
            font-size: 16px;
        }

        /* 표의 머리글(순위 및 요일) 배경색과 포인트 글자색을 지정합니다. */
        th {
            background-color: rgba(142, 251, 225, 0.12);
            color: var(--point-color);
        }

        /* 표의 본문 셀 배경색과 글자색을 지정합니다. */
        td {
            background-color: rgba(21, 63, 65, 0.6);
            color: var(--text-color);
        }

        /* 마우스 커서가 올라간 행의 배경색을 부드럽게 변경합니다. */
        tr:hover td {
            background-color: rgba(142, 251, 225, 0.2);
        }
    </style>
</head>
<!-- 웹페이지의 화면에 실제로 표시되는 본문 영역입니다. -->
<body>
    <!-- 전체 내용을 감싸는 메인 컨테이너 영역입니다. -->
    <div class="container">
        <!-- D-Day 정보를 보여주는 상단 카드 영역입니다. -->
        <div class="dday-card">
            <!-- 목표 이름을 출력할 HTML 요소입니다. -->
            <div id="goalNameDisplay" class="dday-title">목표 불러오는 중...</div>
            <!-- 남은 날짜 숫자를 출력할 HTML 요소입니다. -->
            <div id="ddayDisplay" class="dday-count">D-0</div>
        </div>

        <!-- 음식 순위표 정보를 보여주는 하단 카드 영역입니다. -->
        <div class="timetable-card">
            <!-- 표 구조를 생성합니다. -->
            <table>
                <!-- 표의 머리글 부분을 정의합니다. -->
                <thead>
                    <tr>
                        <!-- 순위 표시 열 머리글입니다. -->
                        <th>순위</th>
                        <!-- 월요일 열 머리글입니다. -->
                        <th>월</th>
                        <!-- 화요일 열 머리글입니다. -->
                        <th>화</th>
                        <!-- 수요일 열 머리글입니다. -->
                        <th>수</th>
                        <!-- 목요일 열 머리글입니다. -->
                        <th>목</th>
                        <!-- 금요일 열 머리글입니다. -->
                        <th>금</th>
                    </tr>
                </thead>
                <!-- 자바스크립트로 행이 동적으로 채워질 본문 영역입니다. -->
                <tbody id="timetableBody">
                </tbody>
            </table>
        </div>
    </div>

    <!-- 웹페이지 동적 동작을 처리할 자바스크립트 영역입니다. -->
    <script>
        /* =================================================== */
        /* 7) [여기만 고치세요] 사용자 설정 영역 시작          */
        /* =================================================== */
        // 1. 목표 날짜를 'YYYY-MM-DD' 형식으로 설정하세요.
        const TARGET_DATE = "2026-12-31";
        
        // 2. D-Day 카운터에 표시할 목표 이름을 설정하세요.
        const GOAL_NAME = "2026년도 목표 달성";
        
        // 3. 월~금 요일의 음식 리스트 데이터를 순서대로 입력하세요.
        // 각 배열의 값은 순서대로 [월요일, 화요일, 수요일, 목요일, 금요일]의 음식(TOP 1 ~ TOP 5)입니다.
        const TIMETABLE_DATA = [
            ["피자", "피자", "피자", "피자", "피자"],     // TOP 1 음식
            ["치킨", "치킨", "치킨", "치킨", "치킨"],     // TOP 2 음식
            ["초밥", "초밥", "초밥", "초밥", "초밥"],     // TOP 3 음식
            ["햄버거", "햄버거", "햄버거", "햄버거", "햄버거"], // TOP 4 음식
            ["떡볶이", "떡볶이", "떡볶이", "떡볶이", "떡볶이"]  // TOP 5 음식
        ];
        /* =================================================== */
        /* 7) [여기만 고치세요] 사용자 설정 영역 끝            */
        /* =================================================== */

        // D-Day 계산 및 화면 업데이트 함수를 정의합니다.
        function calculateDday() {
            // 설정된 목표 날짜의 시간 밀리초 값을 가져옵니다.
            const targetTime = new Date(TARGET_DATE).getTime();
            // 오늘 날짜 객체를 생성합니다.
            const today = new Date();
            // 오늘 날짜의 시간 정보를 제외하고 연, 월, 일 단위만 밀리초로 구합니다.
            const todayTime = new Date(today.getFullYear(), today.getMonth(), today.getDate()).getTime();
            // 목표 날짜와 오늘 날짜의 시간 차이를 계산합니다.
            const distance = targetTime - todayTime;
            // 밀리초를 일(day) 단위로 환산하고 올림 처리합니다.
            const daysLeft = Math.ceil(distance / (1000 * 60 * 60 * 24));
            // 화면의 목표 이름 요소에 상수로 지정한 이름을 대입합니다.
            document.getElementById("goalNameDisplay").innerText = GOAL_NAME;
            // D-Day 표시 텍스트를 저장할 변수를 선언합니다.
            let ddayText = "";
            // 남은 날짜가 0보다 클 경우 남은 D-Day 형식으로 지정합니다.
            if (daysLeft > 0) {
                ddayText = `D - ${daysLeft}`;
            // 남은 날짜가 0일 경우 오늘이 목표일임을 표시합니다.
            } else if (daysLeft === 0) {
                ddayText = "D - Day (오늘)";
            // 목표 날짜가 지난 경우 지난 일수를 표시합니다.
            } else {
                ddayText = `D + ${Math.abs(daysLeft)}`;
            }
            // 계산된 D-Day 문자열을 화면에 출력합니다.
            document.getElementById("ddayDisplay").innerText = ddayText;
        }

        // 음식 순위 데이터를 HTML 표로 그려주는 함수를 정의합니다.
        function renderTimetable() {
            // 표 본문이 삽입될 tbody 요소를 선택합니다.
            const tbody = document.getElementById("timetableBody");
            // 기존에 있던 내용을 초기화합니다.
            tbody.innerHTML = "";
            // 각 순위에 표시될 레이블 배열을 정의합니다.
            const rankLabels = ["TOP 1", "TOP 2", "TOP 3", "TOP 4", "TOP 5"];
            // TOP 1부터 TOP 5까지 반복문을 순회합니다.
            for (let i = 0; i < TIMETABLE_DATA.length; i++) {
                // 새로운 테이블 행(tr) 요소를 생성합니다.
                const row = document.createElement("tr");
                // 순위 번호를 나타내는 머리글 셀(th)을 생성합니다.
                const rankCell = document.createElement("th");
                
                // 미리 정의된 배열에서 순위 라벨을 가져와서 셀에 대입합니다.
                rankCell.innerText = rankLabels[i] || `TOP ${i + 1}`;

                // 생성한 순위 셀을 현재 행에 추가합니다.
                row.appendChild(rankCell);
                // 현재 순위의 요일별 음식 배열을 가져옵니다.
                const foods = TIMETABLE_DATA[i];
                // 월요일부터 금요일까지 음식 정보를 순회합니다.
                for (let j = 0; j < foods.length; j++) {
                    // 음식 내용을 표시할 셀(td)을 생성합니다.
                    const td = document.createElement("td");
                    // 음식 이름을 셀에 채웁니다.
                    td.innerText = foods[j];
                    // 생성한 음식 셀을 현재 행에 추가합니다.
                    row.appendChild(td);
                }
                // 완성된 한 행을 tbody에 추가합니다.
                tbody.appendChild(row);
            }
        }

        // 웹페이지 로드가 완료되면 실행되는 이벤트 핸들러입니다.
        window.onload = function() {
            // D-Day 계산 함수를 호출합니다.
            calculateDday();
            // 음식 순위표 렌더링 함수를 호출합니다.
            renderTimetable();
        };
    </script>
</body>
</html>
