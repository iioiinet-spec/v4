<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>타워 디펜스 게임 - 확장팩</title>
    <style>
        body {
            margin: 0;
            background-color: #1e1e1e;
            color: white;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        h1 {
            margin: 5px 0;
            font-size: 24px;
        }
        #ui {
            display: flex;
            gap: 20px;
            margin-bottom: 10px;
            font-size: 18px;
            font-weight: bold;
        }
        canvas {
            border: 3px solid #fff;
            background-color: #2e2e2e;
            cursor: pointer;
        }
        #shop {
            margin-top: 10px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 800px;
        }
        button {
            padding: 8px 12px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background-color: #444;
            color: white;
            transition: 0.2s;
        }
        button:hover {
            background-color: #666;
        }
        button.selected {
            background-color: #ff9800;
            color: black;
        }
        #wave-btn {
            background-color: #4CAF50;
            padding: 8px 20px;
        }
        #wave-btn:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <h1>타워 디펜스 게임 (확장판)</h1>
    <div id="ui">
        <div>골드: <span id="gold">200</span>G</div>
        <div>생명력: <span id="hp">20</span></div>
        <div>웨이브: <span id="wave">0</span></div>
    </div>

    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <div id="shop">
        <button id="btn-normal" onclick="selectTower('normal', 50)">기본 (50G)</button>
        <button id="btn-sniper" onclick="selectTower('sniper', 100)">저격 (100G)</button>
        <button id="btn-rapid" onclick="selectTower('rapid', 150)">속사 (150G)</button>
        <button id="btn-ice" onclick="selectTower('ice', 80)">얼음 (80G)</button>
        <button id="btn-magic" onclick="selectTower('magic', 120)">마법 (120G)</button>
        <button id="btn-laser" onclick="selectTower('laser', 140)">레이저 (140G)</button>
        <button id="wave-btn" onclick="startWave()">웨이브 시작!</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 게임 상태
        let gold = 200; // 시작 골드 약간 상향 (타워 다양성 체험용)
        let hp = 20;
        let wave = 0;
        let selectedType = null;
        let selectedCost = 0;

        let enemies = [];
        let towers = [];
        let projectiles = [];
        let effects = []; // 폭발, 레이저 효과 등
        let isWaveActive = false;
        let spawnQueue = [];
        let spawnTimer = 0;

        // 적 이동 경로
        const path = [
            { x: 0, y: 100 },
            { x: 250, y: 100 },
            { x: 250, y: 300 },
            { x: 550, y: 300 },
            { x: 550, y: 100 },
            { x: 800, y: 100 }
        ];

        // 타워 종류 설정 (속사 타워 150원으로 인상 + 신규 타워 추가)
        const towerStats = {
            normal: { range: 100, damage: 15, cooldown: 40, color: '#3498db', cost: 50, type: 'single' },
            sniper: { range: 220, damage: 60, cooldown: 110, color: '#9b59b6', cost: 100, type: 'single' },
            rapid:  { range: 80,  damage: 5,  cooldown: 8,   color: '#e74c3c', cost: 150, type: 'single' },
            ice:    { range: 90,  damage: 5,  cooldown: 50,  color: '#00bcd4', cost: 80,  type: 'ice', slow: 0.5 }, // 적 속도 50% 감소
            magic:  { range: 110, damage: 25, cooldown: 70,  color: '#ffeb3b', cost: 120, type: 'splash', splashRange: 50 }, // 범위 폭발
            laser:  { range: 130, damage: 2,  cooldown: 5,   color: '#ff5722', cost: 140, type: 'laser' } // 연속 지옥 레이저
        };

        function updateUI() {
            document.getElementById('gold').innerText = gold;
            document.getElementById('hp').innerText = hp;
            document.getElementById('wave').innerText = wave;
        }

        function selectTower(type, cost) {
            if (gold < cost) {
                alert('골드가 부족합니다!');
                return;
            }
            selectedType = type;
            selectedCost = cost;

            document.querySelectorAll('#shop button').forEach(b => b.classList.remove('selected'));
            if(type) document.getElementById(`btn-${type}`).classList.add('selected');
        }

        canvas.addEventListener('click', (e) => {
            if (!selectedType) return;

            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            if (isNearPath(x, y)) {
                alert('길 위에는 타워를 지을 수 없습니다!');
                return;
            }

            for (let t of towers) {
                if (Math.hypot(t.x - x, t.y - y) < 30) {
                    alert('다른 타워와 너무 가깝습니다!');
                    return;
                }
            }

            const stat = towerStats[selectedType];
            towers.push({
                x: x,
                y: y,
                type: selectedType,
                attackType: stat.type,
                range: stat.range,
                damage: stat.damage,
                cooldownMax: stat.cooldown,
                cooldown: 0,
                color: stat.color,
                slow: stat.slow || 0,
                splashRange: stat.splashRange || 0
            });

            gold -= selectedCost;
            selectTower(null, 0);
            updateUI();
        });

        function isNearPath(x, y) {
            for (let i = 0; i < path.length - 1; i++) {
                const p1 = path[i];
                const p2 = path[i + 1];
                const minX = Math.min(p1.x, p2.x) - 20;
                const maxX = Math.max(p1.x, p2.x) + 20;
                const minY = Math.min(p1.y, p2.y) - 20;
                const maxY = Math.max(p1.y, p2.y) + 20;

                if (x >= minX && x <= maxX && y >= minY && y <= maxY) return true;
            }
            return false;
        }

        function startWave() {
            if (isWaveActive) return;
            wave++;
            isWaveActive = true;
            
            let enemyCount = 6 + wave * 3;
            let enemyHp = 50 + wave * 20;
            let enemySpeed = 1.1 + wave * 0.08;

            spawnQueue = [];
            for (let i = 0; i < enemyCount; i++) {
                spawnQueue.push({
                    hp: enemyHp,
                    maxHp: enemyHp,
                    speed: enemySpeed,
                    baseSpeed: enemySpeed,
                    pathIndex: 0,
                    x: path[0].x,
                    y: path[0].y,
                    slowTimer: 0
                });
            }
            spawnTimer = 0;
            updateUI();
        }

        function update() {
            // 적 스폰
            if (spawnQueue.length > 0) {
                spawnTimer++;
                if (spawnTimer > 35) {
                    enemies.push(spawnQueue.shift());
                    spawnTimer = 0;
                }
            } else if (enemies.length === 0 && isWaveActive) {
                isWaveActive = false;
                gold += 60 + wave * 15;
                updateUI();
            }

            // 적 이동 및 상태이상 업데이트
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];

                // 슬로우 지속시간 체크
                if (e.slowTimer > 0) {
                    e.slowTimer--;
                    if (e.slowTimer === 0) e.speed = e.baseSpeed;
                }

                let targetPoint = path[e.pathIndex + 1];
                let dx = targetPoint.x - e.x;
                let dy = targetPoint.y - e.y;
                let dist = Math.hypot(dx, dy);

                if (dist < e.speed) {
                    e.x = targetPoint.x;
                    e.y = targetPoint.y;
                    e.pathIndex++;

                    if (e.pathIndex >= path.length - 1) {
                        hp--;
                        enemies.splice(i, 1);
                        updateUI();
                        if (hp <= 0) {
                            alert('게임 오버!');
                            location.reload();
                        }
                        continue;
                    }
                } else {
                    e.x += (dx / dist) * e.speed;
                    e.y += (dy / dist) * e.speed;
                }
            }

            // 타워 공격 로직
            for (let t of towers) {
                if (t.cooldown > 0) t.cooldown--;

                if (t.cooldown === 0) {
                    let target = null;
                    let minDist = Infinity;

                    for (let e of enemies) {
                        let dist = Math.hypot(e.x - t.x, e.y - t.y);
                        if (dist <= t.range && dist < minDist) {
                            minDist = dist;
                            target = e;
                        }
                    }

                    if (target) {
                        if (t.attackType === 'laser') {
                            // 레이저는 투사체 없이 즉시 데미지 + 시각 효과
                            target.hp -= t.damage;
                            effects.push({ type: 'laser', x1: t.x, y1: t.y, x2: target.x, y2: target.y, life: 3 });
                            checkEnemyDeath(target);
                        } else {
                            // 일반, 저격, 속사, 얼음, 마법 타워는 투사체 발사
                            projectiles.push({
                                x: t.x,
                                y: t.y,
                                target: target,
                                damage: t.damage,
                                speed: 7,
                                attackType: t.attackType,
                                slow: t.slow,
                                splashRange: t.splashRange
                            });
                        }
                        t.cooldown = t.cooldownMax;
                    }
                }
            }

            // 투사체 이동 및 피격 처리
            for (let i = projectiles.length - 1; i >= 0; i--) {
                let p = projectiles[i];
                if (!enemies.includes(p.target)) {
                    projectiles.splice(i, 1);
                    continue;
                }

                let dx = p.target.x - p.x;
                let dy = p.target.y - p.y;
                let dist = Math.hypot(dx, dy);

                if (dist < p.speed) {
                    // 명중 효과 분기
                    if (p.attackType === 'splash') {
                        // 광역 폭발 데미지
                        effects.push({ type: 'explosion', x: p.target.x, y: p.target.y, r: p.splashRange, life: 10 });
                        for (let e of enemies) {
                            if (Math.hypot(e.x - p.target.x, e.y - p.target.y) <= p.splashRange) {
                                e.hp -= p.damage;
                                checkEnemyDeath(e);
                            }
                        }
                    } else {
                        // 단일 타격
                        p.target.hp -= p.damage;
                        if (p.attackType === 'ice') {
                            p.target.speed = p.target.baseSpeed * (1 - p.slow);
                            p.target.slowTimer = 90; // 90프레임 동안 슬로우
                        }
                        checkEnemyDeath(p.target);
                    }
                    projectiles.splice(i, 1);
                } else {
                    p.x += (dx / dist) * p.speed;
                    p.y += (dy / dist) * p.speed;
                }
            }

            // 시각 효과 수명 감소
            for (let i = effects.length - 1; i >= 0; i--) {
                effects[i].life--;
                if (effects[i].life <= 0) effects.splice(i, 1);
            }
        }

        function checkEnemyDeath(enemy) {
            if (enemy.hp <= 0) {
                let index = enemies.indexOf(enemy);
                if (index > -1) {
                    enemies.splice(index, 1);
                    gold += 12;
                    updateUI();
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. 길 그리기
            ctx.strokeStyle = '#444';
            ctx.lineWidth = 30;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(path[0].x, path[0].y);
            for (let i = 1; i < path.length; i++) {
                ctx.lineTo(path[i].x, path[i].y);
            }
            ctx.stroke();

            // 2. 타워 그리기
            for (let t of towers) {
                ctx.fillStyle = t.color;
                ctx.beginPath();
                ctx.arc(t.x, t.y, 16, 0, Math.PI * 2);
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#fff';
                ctx.stroke();
            }

            // 3. 적 그리기 (슬로우 걸리면 파란빛 테두리)
            for (let e of enemies) {
                ctx.fillStyle = e.slowTimer > 0 ? '#00bcd4' : '#e74c3c';
                ctx.beginPath();
                ctx.arc(e.x, e.y, 10, 0, Math.PI * 2);
                ctx.fill();

                // 체력바
                ctx.fillStyle = '#000';
                ctx.fillRect(e.x - 12, e.y - 18, 24, 4);
                ctx.fillStyle = '#2ecc71';
                ctx.fillRect(e.x - 12, e.y - 18, 24 * (e.hp / e.maxHp), 4);
            }

            // 4. 투사체 그리기
            for (let p of projectiles) {
                ctx.fillStyle = p.attackType === 'ice' ? '#00bcd4' : (p.attackType === 'splash' ? '#ffeb3b' : '#f1c40f');
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.attackType === 'splash' ? 6 : 4, 0, Math.PI * 2);
                ctx.fill();
            }

            // 5. 레이저 및 폭발 효과 그리기
            for (let eff of effects) {
                if (eff.type === 'laser') {
                    ctx.strokeStyle = '#ff5722';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(eff.x1, eff.y1);
                    ctx.lineTo(eff.x2, eff.y2);
                    ctx.stroke();
                } else if (eff.type === 'explosion') {
                    ctx.strokeStyle = 'rgba(255, 235, 59, 0.7)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(eff.x, eff.y, eff.r, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        updateUI();
        loop();
    </script>
</body>
</html>
