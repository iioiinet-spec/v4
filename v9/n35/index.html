<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>레트로 복싱 아케이드 게임</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+KR:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            user-select: none;
            background-color: #000;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
        .arcade-font {
            font-family: 'Dela Gothic One', cursive;
        }
        /* CRT Scanline Effect */
        .crt::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 50;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }
        @keyframes pulse-orange {
            0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(249, 115, 22, 0.6); }
            50% { transform: scale(1.05); box-shadow: 0 0 40px rgba(249, 115, 22, 0.9); }
        }
        .pulse-btn {
            animation: pulse-orange 2s infinite;
        }
    </style>
</head>
<body class="bg-black text-white h-screen w-screen flex items-center justify-center crt">

    <div id="game-container" class="relative w-full max-w-4xl h-[600px] bg-gray-900 border-4 border-orange-500 rounded-2xl overflow-hidden shadow-2xl flex flex-col">

        <!-- SCREEN 1: START SCREEN -->
        <div id="screen-start" class="absolute inset-0 bg-black flex flex-col items-center justify-center z-40 transition-opacity duration-500">
            <h1 class="arcade-font text-5xl md:text-7xl text-orange-500 mb-8 tracking-wider drop-shadow-[0_5px_5px_rgba(255,100,0,0.5)]">RETRO BOXER</h1>
            <div id="btn-play" class="w-72 h-32 bg-orange-500 rounded-3xl flex items-center justify-center cursor-pointer pulse-btn hover:bg-orange-400 transition-all border-4 border-orange-300">
                <span class="arcade-font text-black text-4xl tracking-widest">플레이</span>
            </div>
            <p class="text-gray-400 mt-12 text-sm text-center">방향키(← →) 이동 | SPACE 점프<br><strong>A키</strong>: 왼주먹 | <strong>D키</strong>: 오른주먹 | <strong>S키 / 버튼</strong>: 특수기</p>
        </div>

        <!-- SCREEN 2: CHARACTER SELECTION SCREEN -->
        <div id="screen-select" class="absolute inset-0 bg-gray-950 flex flex-col items-center justify-center z-30 opacity-0 pointer-events-none transition-opacity duration-500">
            <h2 class="arcade-font text-3xl md:text-4xl text-yellow-400 mb-6 tracking-wide">파이터를 선택하세요</h2>
            <div class="grid grid-cols-2 gap-8 w-11/12 max-w-3xl h-96">
                <!-- Character 1: Doebak -->
                <div id="char-doebak" class="bg-gray-900 border-4 border-blue-500 hover:border-blue-300 rounded-2xl flex flex-col items-center justify-center p-6 cursor-pointer transform hover:scale-105 transition-all shadow-lg group">
                    <h3 class="arcade-font text-2xl text-blue-400 mb-4 group-hover:text-blue-300">돼박이</h3>
                    <div class="w-32 h-36 bg-blue-900/40 rounded-xl flex items-center justify-center border-2 border-blue-500/50 relative overflow-hidden mb-4">
                        <svg viewBox="0 0 100 120" class="w-28 h-28">
                            <ellipse cx="50" cy="70" rx="35" ry="30" fill="#3b82f6"/>
                            <circle cx="50" cy="35" r="18" fill="#fbcfe8"/>
                            <circle cx="20" cy="65" r="12" fill="#ef4444"/>
                            <circle cx="80" cy="65" r="12" fill="#ef4444"/>
                            <circle cx="43" cy="33" r="2" fill="#000"/>
                            <circle cx="57" cy="33" r="2" fill="#000"/>
                            <path d="M 45 42 Q 50 48 55 42" stroke="#000" stroke-width="2" fill="none"/>
                        </svg>
                    </div>
                    <span class="mt-2 text-sm text-gray-300 font-bold bg-blue-600/30 px-4 py-2 rounded-full border border-blue-500">선택하기 (특수: 압박)</span>
                </div>

                <!-- Character 2: Chibak -->
                <div id="char-chibak" class="bg-gray-900 border-4 border-red-500 hover:border-red-300 rounded-2xl flex flex-col items-center justify-center p-6 cursor-pointer transform hover:scale-105 transition-all shadow-lg group">
                    <h3 class="arcade-font text-2xl text-red-400 mb-4 group-hover:text-red-300">치박이</h3>
                    <div class="w-32 h-36 bg-red-900/40 rounded-xl flex items-center justify-center border-2 border-red-500/50 relative overflow-hidden mb-4">
                        <svg viewBox="0 0 100 120" class="w-28 h-28">
                            <rect x="40" y="45" width="20" height="45" rx="8" fill="#ef4444"/>
                            <circle cx="50" cy="30" r="14" fill="#fbcfe8"/>
                            <circle cx="22" cy="55" r="10" fill="#3b82f6"/>
                            <circle cx="78" cy="55" r="10" fill="#3b82f6"/>
                            <circle cx="45" cy="28" r="1.5" fill="#000"/>
                            <circle cx="55" cy="28" r="1.5" fill="#000"/>
                            <line x1="46" y1="36" x2="54" y2="36" stroke="#000" stroke-width="2"/>
                        </svg>
                    </div>
                    <span class="mt-2 text-sm text-gray-300 font-bold bg-red-600/30 px-4 py-2 rounded-full border border-red-500">선택하기 (특수: 속타)</span>
                </div>
            </div>
        </div>

        <!-- SCREEN 3: BATTLE ARENA -->
        <div id="screen-arena" class="absolute inset-0 bg-gradient-to-b from-slate-900 via-zinc-900 to-black flex flex-col z-20 opacity-0 pointer-events-none transition-opacity duration-500">
            <!-- HUD -->
            <div class="flex justify-between items-center px-6 py-4 bg-black/60 border-b border-orange-500/30">
                <div class="flex items-center gap-3">
                    <span id="hud-player-name" class="arcade-font text-orange-400 text-lg">플레이어</span>
                    <div class="w-48 h-6 bg-gray-700 rounded-full overflow-hidden border-2 border-orange-500">
                        <div id="player-hp" class="h-full bg-green-500 transition-all duration-200" style="width: 100%;"></div>
                    </div>
                </div>
                <div class="arcade-font text-xl text-yellow-400">VS</div>
                <div class="flex items-center gap-3 flex-row-reverse">
                    <span class="arcade-font text-red-500 text-lg">근육맨 (300HP)</span>
                    <div class="w-48 h-6 bg-gray-700 rounded-full overflow-hidden border-2 border-red-500">
                        <div id="enemy-hp" class="h-full bg-red-500 transition-all duration-200" style="width: 100%;"></div>
                    </div>
                </div>
            </div>

            <!-- Canvas Arena -->
            <div class="relative flex-1 w-full overflow-hidden">
                <canvas id="gameCanvas" class="w-full h-full block"></canvas>
                
                <!-- Countdown Overlay with blur/dimming -->
                <div id="countdown-overlay" class="absolute inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-30">
                    <div id="countdown-text" class="arcade-font text-7xl text-yellow-400 drop-shadow-[0_0_20px_rgba(234,179,8,0.8)]">3</div>
                </div>

                <!-- Special Skill Button (압박 / 속타) in Bottom-Left -->
                <div id="special-skill-container" class="absolute bottom-4 left-4 z-20">
                    <button id="btn-special" class="w-24 h-14 bg-orange-500 hover:bg-orange-400 active:scale-95 border-2 border-orange-300 rounded-xl flex items-center justify-center shadow-lg cursor-pointer transition-all">
                        <span id="special-btn-text" class="arcade-font text-black text-sm tracking-wider">압박</span>
                    </button>
                </div>

                <!-- Controls Helper -->
                <div class="absolute bottom-3 left-1/2 transform -translate-x-1/2 bg-black/50 px-4 py-1.5 rounded-full border border-gray-700 text-xs text-gray-300 pointer-events-none">
                    이동: ← → | 점프: SPACE | <strong>A</strong>: 왼주먹 | <strong>D</strong>: 오른주먹 | <strong>S</strong>: 특수기
                </div>

                <!-- Game Over / Victory Modal -->
                <div id="game-over-modal" class="absolute inset-0 bg-black/80 flex flex-col items-center justify-center hidden z-50">
                    <h2 id="game-result-text" class="arcade-font text-4xl mb-6 text-yellow-400">VICTORY</h2>
                    <button id="btn-restart" class="px-6 py-3 bg-orange-500 text-black arcade-font rounded-xl text-xl hover:bg-orange-400 transition-all">다시 하기</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // DOM Elements
        const screenStart = document.getElementById('screen-start');
        const screenSelect = document.getElementById('screen-select');
        const screenArena = document.getElementById('screen-arena');
        const btnPlay = document.getElementById('btn-play');
        const charDoebak = document.getElementById('char-doebak');
        const charChibak = document.getElementById('char-chibak');
        const hudPlayerName = document.getElementById('hud-player-name');
        const playerHpBar = document.getElementById('player-hp');
        const enemyHpBar = document.getElementById('enemy-hp');
        const gameOverModal = document.getElementById('game-over-modal');
        const gameResultText = document.getElementById('game-result-text');
        const btnRestart = document.getElementById('btn-restart');
        const countdownOverlay = document.getElementById('countdown-overlay');
        const countdownText = document.getElementById('countdown-text');
        const specialBtnText = document.getElementById('special-btn-text');
        const btnSpecial = document.getElementById('btn-special');
        
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game State Variables
        let selectedCharacter = 'doebak'; // 'doebak' or 'chibak'
        let gameRunning = false;
        let matchStarted = false;
        let animationFrameId = null;

        // Input state tracking
        const keys = { left: false, right: false, space: false, a: false, d: false, s: false };

        // Web Audio API sound generator
        let audioCtx = null;
        function playHitSound(isHeavy) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = isHeavy ? 'sawtooth' : 'square';
                osc.frequency.setValueAtTime(isHeavy ? 100 : 220, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } catch(e) {}
        }

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }

        window.addEventListener('resize', () => {
            if (gameRunning) resizeCanvas();
        });

        btnPlay.addEventListener('click', () => {
            screenStart.style.opacity = '0';
            screenStart.classList.add('pointer-events-none');
            screenSelect.style.opacity = '1';
            screenSelect.classList.remove('pointer-events-none');
        });

        charDoebak.addEventListener('click', () => startGame('doebak', '돼박이', '압박'));
        charChibak.addEventListener('click', () => startGame('chibak', '치박이', '속타'));

        btnRestart.addEventListener('click', () => {
            gameOverModal.classList.add('hidden');
            screenArena.style.opacity = '0';
            screenArena.classList.add('pointer-events-none');
            screenSelect.style.opacity = '1';
            screenSelect.classList.remove('pointer-events-none');
            gameRunning = false;
        });

        btnSpecial.addEventListener('click', () => {
            if (!matchStarted || !gameRunning) return;
            triggerSpecialSkill();
        });

        function startGame(type, name, skillName) {
            selectedCharacter = type;
            hudPlayerName.textContent = name;
            specialBtnText.textContent = skillName;

            screenSelect.style.opacity = '0';
            screenSelect.classList.add('pointer-events-none');
            screenArena.style.opacity = '1';
            screenArena.classList.remove('pointer-events-none');

            resizeCanvas();
            initEntities();
            gameRunning = true;
            matchStarted = false;

            player.hp = player.maxHp;
            enemy.hp = enemy.maxHp;
            playerHpBar.style.width = '100%';
            enemyHpBar.style.width = '100%';

            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            gameLoop();
            runCountdown();
        }

        function runCountdown() {
            countdownOverlay.classList.remove('hidden');
            let count = 3;
            countdownText.textContent = count;

            let timer = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownText.textContent = count;
                } else if (count === 0) {
                    countdownText.textContent = "FIGHT!";
                } else {
                    clearInterval(timer);
                    countdownOverlay.classList.add('hidden');
                    matchStarted = true;
                }
            }, 1000);
        }

        window.addEventListener('keydown', (e) => {
            if (!gameRunning || !matchStarted) return;
            if (e.code === 'ArrowLeft') keys.left = true;
            if (e.code === 'ArrowRight') keys.right = true;
            if (e.code === 'Space') {
                e.preventDefault();
                keys.space = true;
            }
            if (e.code === 'KeyA') keys.a = true;
            if (e.code === 'KeyD') keys.d = true;
            if (e.code === 'KeyS') {
                e.preventDefault();
                triggerSpecialSkill();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft') keys.left = false;
            if (e.code === 'ArrowRight') keys.right = false;
            if (e.code === 'Space') keys.space = false;
            if (e.code === 'KeyA') keys.a = false;
            if (e.code === 'KeyD') keys.d = false;
            if (e.code === 'KeyS') keys.s = false;
        });

        let player, enemy, particles, camera;

        function initEntities() {
            const groundY = canvas.height - 80;
            player = {
                x: 150,
                y: groundY - 100,
                width: selectedCharacter === 'doebak' ? 80 : 60,
                height: 100,
                vx: 0,
                vy: 0,
                speed: 5,
                jumpPower: -12,
                gravity: 0.6,
                isGrounded: true,
                facing: 1,
                hp: 100,
                maxHp: 100,
                punchType: null,
                punchTimer: 0,
                comboCount: 0,
                comboTimer: 0
            };

            enemy = {
                x: canvas.width - 250,
                y: groundY - 110,
                width: 70,
                height: 110,
                vx: 0,
                vy: 0,
                speed: 2.2,
                facing: -1,
                hp: 300,
                maxHp: 300,
                aiTimer: 0,
                punchType: null,
                punchTimer: 0
            };

            particles = [];
            camera = { zoom: 1, x: 0, y: 0, targetZoom: 1 };
        }

        function gameLoop() {
            if (!gameRunning) return;
            update();
            render();
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function update() {
            if (!matchStarted) return;

            const groundY = canvas.height - 80;

            // Handle Chibak's rapid combo timer (20 hits in 1 second)
            if (player.comboTimer > 0) {
                player.comboTimer--;
                if (player.comboTimer % 3 === 0 && player.comboCount > 0) {
                    player.comboCount--;
                    playHitSound(true);
                    applyDamageToEnemy(15); // 15 * 20 = 300 total damage
                    createParticles(enemy.x + enemy.width/2, enemy.y + 40, '#facc15');
                }
                if (player.comboTimer === 0) {
                    camera.targetZoom = 1;
                    player.punchType = null;
                }
                return; // Freeze normal movement during cinematic combo
            }

            // Player Movement
            player.vx = 0;
            if (keys.left) { player.vx = -player.speed; player.facing = -1; }
            if (keys.right) { player.vx = player.speed; player.facing = 1; }

            if (keys.space && player.isGrounded) {
                player.vy = player.jumpPower;
                player.isGrounded = false;
            }

            if (keys.a && player.punchTimer === 0) triggerPlayerPunch('left');
            else if (keys.d && player.punchTimer === 0) triggerPlayerPunch('right');

            if (player.punchTimer > 0) {
                player.punchTimer--;
                if (player.punchTimer === 0) player.punchType = null;
            }

            player.vy += player.gravity;
            player.x += player.vx;
            player.y += player.vy;

            if (player.y >= groundY - player.height) {
                player.y = groundY - player.height;
                player.vy = 0;
                player.isGrounded = true;
            }

            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

            // Enemy AI Logic
            enemy.aiTimer++;
            let dx = player.x - enemy.x;
            
            if (Math.abs(dx) > 75) {
                enemy.vx = Math.sign(dx) * enemy.speed;
                enemy.facing = Math.sign(dx);
            } else {
                enemy.vx = 0;
                enemy.facing = dx < 0 ? -1 : 1;
                if (enemy.aiTimer % 55 === 0 && Math.random() < 0.75 && enemy.punchTimer === 0) {
                    enemy.punchType = Math.random() > 0.5 ? 'left' : 'right';
                    enemy.punchTimer = 18;
                    playHitSound(true);

                    if (Math.abs(dx) < 90) {
                        player.hp = Math.max(0, player.hp - 30); // 30 damage
                        playerHpBar.style.width = `${(player.hp / player.maxHp) * 100}%`;
                        createParticles(player.x + player.width/2, player.y + 40, '#ef4444');
                        if (player.hp <= 0) endGame(false);
                    }
                }
            }

            if (enemy.punchTimer > 0) {
                enemy.punchTimer--;
                if (enemy.punchTimer === 0) enemy.punchType = null;
            }

            enemy.x += enemy.vx;
            if (enemy.x < 0) enemy.x = 0;
            if (enemy.x + enemy.width > canvas.width) enemy.x = canvas.width - enemy.width;

            // Smooth camera zoom interpolation
            camera.zoom += (camera.targetZoom - camera.zoom) * 0.1;

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function triggerPlayerPunch(side) {
            player.punchType = side;
            player.punchTimer = 16;
            playHitSound(side === 'right');

            let distance = Math.abs((player.x + player.width/2) - (enemy.x + enemy.width/2));
            let facingMatch = (player.facing === 1 && enemy.x > player.x) || (player.facing === -1 && enemy.x < player.x);

            if (distance < 85 && facingMatch) {
                applyDamageToEnemy(side === 'right' ? 15 : 10);
            }
        }

        function triggerSpecialSkill() {
            if (!gameRunning || !matchStarted || player.punchTimer > 0 || player.comboTimer > 0) return;

            let distance = Math.abs((player.x + player.width/2) - (enemy.x + enemy.width/2));
            let facingMatch = (player.facing === 1 && enemy.x > player.x) || (player.facing === -1 && enemy.x < player.x);

            if (selectedCharacter === 'doebak') {
                // 압박: Pull back fist then powerful punch for 150 damage
                player.punchType = 'special';
                player.punchTimer = 25;
                playHitSound(true);
                if (distance < 110 && facingMatch) {
                    applyDamageToEnemy(150);
                }
            } else {
                // 속타: Both fists pulled back, 20 rapid hits in 1 second (60fps -> 60 frames = 1 sec, 20 hits every 3 frames), 300 total damage, zoom-in camera!
                player.punchType = 'chibak-special';
                player.comboCount = 20;
                player.comboTimer = 60; // 1 second
                camera.targetZoom = 1.4; // Cinematic Zoom-in
                playHitSound(true);
            }
        }

        function applyDamageToEnemy(damage) {
            enemy.hp = Math.max(0, enemy.hp - damage);
            enemyHpBar.style.width = `${(enemy.hp / enemy.maxHp) * 100}%`;
            enemy.x += player.facing * 15;
            createParticles(enemy.x + enemy.width/2, enemy.y + 40, '#facc15');

            if (enemy.hp <= 0) endGame(true);
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 12; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 25, color: color,
                    size: Math.random() * 6 + 2
                });
            }
        }

        function endGame(isVictory) {
            gameRunning = false;
            gameResultText.textContent = isVictory ? "VICTORY!" : "DEFEAT...";
            gameResultText.className = `arcade-font text-4xl mb-6 ${isVictory ? 'text-yellow-400' : 'text-red-500'}`;
            gameOverModal.classList.remove('hidden');
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            // Apply camera zoom transform centered between fighters
            let centerX = (player.x + enemy.x) / 2;
            let centerY = (player.y + enemy.y) / 2;
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.scale(camera.zoom, camera.zoom);
            ctx.translate(-canvas.width / 2 - (centerX - canvas.width/2) * 0.3, -canvas.height / 2);

            const groundY = canvas.height - 80;

            // Draw Background Ropes
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(0, groundY - 120); ctx.lineTo(canvas.width, groundY - 120);
            ctx.moveTo(0, groundY - 80); ctx.lineTo(canvas.width, groundY - 80);
            ctx.moveTo(0, groundY - 40); ctx.lineTo(canvas.width, groundY - 40);
            ctx.stroke();

            // Ring Floor
            ctx.fillStyle = '#334155';
            ctx.fillRect(0, groundY, canvas.width, 80);
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, groundY, canvas.width, 10);

            // Draw Fighter & Enemy
            drawFighter(player, selectedCharacter === 'doebak' ? '돼박이' : '치박이', selectedCharacter === 'doebak' ? '#3b82f6' : '#ef4444', selectedCharacter === 'doebak');
            drawMuscularEnemy(enemy);

            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            });

            ctx.restore();
        }

        function drawFighter(f, name, primaryColor, isFat) {
            ctx.save();
            ctx.translate(f.x + f.width / 2, f.y + f.height / 2);
            ctx.scale(f.facing, 1);

            ctx.fillStyle = primaryColor;
            if (isFat) {
                ctx.beginPath();
                ctx.ellipse(0, 10, 32, 26, 0, 0, Math.PI * 2);
                ctx.fill();
            } else {
                ctx.beginPath();
                ctx.roundRect(-18, -5, 36, 50, 8);
                ctx.fill();
            }

            ctx.fillStyle = '#fbcfe8';
            ctx.beginPath();
            ctx.arc(0, -28, isFat ? 18 : 15, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#e11d48';
            ctx.fillRect(-16, -34, 32, 6);

            ctx.fillStyle = '#000';
            ctx.fillRect(4, -30, 4, 4);

            let leftPunchOffset = (f.punchType === 'left') ? 28 : 0;
            let rightPunchOffset = (f.punchType === 'right') ? 32 : 0;

            if (f.punchType === 'special') {
                if (f.punchTimer > 15) { leftPunchOffset = -20; rightPunchOffset = -20; }
                else { leftPunchOffset = 45; rightPunchOffset = 45; }
            } else if (f.punchType === 'chibak-special') {
                // Both fists pull back and rapidly oscillate forward & backward for combo
                let osc = Math.sin(Date.now() * 0.05) * 35;
                leftPunchOffset = 25 + osc;
                rightPunchOffset = 25 - osc;
            }

            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.arc(-24 - leftPunchOffset, 15, 11, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(22 + rightPunchOffset, 10, 12, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();

            ctx.fillStyle = '#fff';
            ctx.font = '12px "Noto Sans KR", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(name, f.x + f.width / 2, f.y - 12);
        }

        function drawMuscularEnemy(e) {
            ctx.save();
            ctx.translate(e.x + e.width / 2, e.y + e.height / 2);
            ctx.scale(e.facing, 1);

            ctx.fillStyle = '#d97706';
            ctx.beginPath();
            ctx.moveTo(-24, -15);
            ctx.lineTo(24, -15);
            ctx.lineTo(16, 35);
            ctx.lineTo(-16, 35);
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = '#b45309';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-12, -5); ctx.lineTo(0, 5); ctx.lineTo(12, -5);
            ctx.stroke();

            ctx.fillStyle = '#fde68a';
            ctx.beginPath();
            ctx.arc(0, -32, 16, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#1c1917';
            ctx.fillRect(-4, -50, 8, 12);

            ctx.fillStyle = '#000';
            ctx.fillRect(4, -34, 4, 3);

            ctx.fillStyle = '#dc2626';
            ctx.fillRect(-18, 32, 36, 18);

            let leftPunchOffset = (e.punchType === 'left') ? 26 : 0;
            let rightPunchOffset = (e.punchType === 'right') ? 28 : 0;

            ctx.fillStyle = '#1d4ed8';
            ctx.beginPath();
            ctx.arc(-28 - leftPunchOffset, 20, 12, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(25 + rightPunchOffset, 15, 13, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();

            ctx.fillStyle = '#ef4444';
            ctx.font = '12px "Noto Sans KR", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText("근육맨 (300HP)", e.x + e.width / 2, e.y - 15);
        }
    </script>
