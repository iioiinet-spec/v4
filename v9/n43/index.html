<!DOCTYPE html> <!-- HTML5 문서임을 선언합니다. -->
<html lang="ko"> <!-- 문서의 언어를 한국어로 설정합니다. -->

<head> <!-- 문서 설정 영역을 시작합니다. -->
  <meta charset="UTF-8"> <!-- 한글을 정상적으로 표시합니다. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 모바일 화면에 맞춥니다. -->
  <title>D-Day & 시간표</title> <!-- 브라우저 탭의 제목입니다. -->

  <link rel="preconnect" href="https://fonts.googleapis.com"> <!-- 구글 폰트 서버에 연결합니다. -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> <!-- 폰트 연결을 준비합니다. -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet"> <!-- Noto Serif KR 폰트를 불러옵니다. -->

  <style> /* CSS를 시작합니다. */

    :root { /* 색상 변수를 모아둡니다. */
      --color-background: #f2f2f0; /* 전체 배경색입니다. */
      --color-card: #ffffff; /* 카드와 표 칸의 색입니다. */
      --color-text: #111111; /* 기본 글자색입니다. */
      --color-point: #111111; /* 테두리와 강조 색입니다. */
    }

    * { /* 모든 HTML 요소에 적용합니다. */
      box-sizing: border-box; /* 크기에 여백과 테두리를 포함합니다. */
    }

    body { /* 페이지 전체의 디자인입니다. */
      margin: 0; /* 기본 여백을 없앱니다. */
      font-family: "Noto Serif KR", serif; /* 본명조 폰트를 사용합니다. */
      background: var(--color-background); /* 배경색을 적용합니다. */
      color: var(--color-text); /* 글자색을 적용합니다. */
    }

    .container { /* 전체 콘텐츠 영역입니다. */
      max-width: 900px; /* 콘텐츠의 최대 너비입니다. */
      margin: 0 auto; /* 콘텐츠를 가운데에 배치합니다. */
      padding: 40px 20px; /* 콘텐츠 주변에 여백을 줍니다. */
    }

    .dday { /* D-Day 영역입니다. */
      background: var(--color-card); /* 흰색 배경을 사용합니다. */
      color: var(--color-text); /* 검은색 글자를 사용합니다. */
      border: 1px solid var(--color-point); /* 검은색 테두리를 만듭니다. */
      border-radius: 0; /* 모서리를 둥글게 하지 않습니다. */
      padding: 45px 20px; /* 안쪽 여백을 설정합니다. */
      text-align: center; /* 내용을 가운데 정렬합니다. */
      margin-bottom: 40px; /* 시간표와 간격을 만듭니다. */
    }

    .target-name { /* 목표 이름의 디자인입니다. */
      font-size: 28px; /* 목표 이름을 크게 표시합니다. */
      font-weight: 600; /* 목표 이름을 강조합니다. */
      margin-bottom: 18px; /* 아래쪽 간격을 만듭니다. */
    }

    .remaining { /* D-Day 숫자의 디자인입니다. */
      font-size: 64px; /* D-Day를 크게 표시합니다. */
      font-weight: 700; /* D-Day를 굵게 표시합니다. */
      line-height: 1.1; /* 줄 높이를 설정합니다. */
    }

    .date-text { /* 목표 날짜의 디자인입니다. */
      margin-top: 18px; /* 위쪽 간격을 만듭니다. */
      font-size: 15px; /* 날짜 글자 크기입니다. */
    }

    h2 { /* 시간표 제목의 디자인입니다. */
      margin: 0 0 16px; /* 제목 주변 여백을 설정합니다. */
      font-size: 24px; /* 제목 글자 크기입니다. */
      font-weight: 600; /* 제목을 강조합니다. */
    }

    table { /* 시간표 전체의 디자인입니다. */
      width: 100%; /* 화면 너비에 맞춥니다. */
      border-collapse: collapse; /* 표의 테두리를 하나로 합칩니다. */
      background: var(--color-card); /* 표 배경을 흰색으로 만듭니다. */
      border: 1px solid var(--color-point); /* 표 바깥 테두리를 만듭니다. */
      border-radius: 0; /* 모서리를 직각으로 만듭니다. */
      overflow: hidden; /* 표 내용이 밖으로 나가지 않게 합니다. */
    }

    th, td { /* 표의 모든 칸에 적용합니다. */
      border: 1px solid var(--color-point); /* 칸마다 테두리를 만듭니다. */
      padding: 16px 8px; /* 칸 안쪽의 여백입니다. */
      text-align: center; /* 칸의 내용을 가운데 정렬합니다. */
      color: var(--color-text); /* 칸의 글자색입니다. */
    }

    th { /* 요일 제목 칸입니다. */
      background: var(--color-card); /* 흰색 배경을 사용합니다. */
      font-weight: 600; /* 요일을 강조합니다. */
    }

    td:first-child { /* 첫 번째 칸인 교시 칸입니다. */
      background: var(--color-card); /* 흰색 배경을 사용합니다. */
      font-weight: 600; /* 교시를 강조합니다. */
    }

    .today-period { /* 현재 교시 칸의 디자인입니다. */
      outline: 3px solid var(--color-point); /* 현재 교시 칸을 굵게 강조합니다. */
      outline-offset: -3px; /* 강조 테두리를 칸 안쪽으로 넣습니다. */
    }

    .day-off { /* 주말 문구의 디자인입니다. */
      margin: 0 0 16px; /* 아래쪽 간격을 설정합니다. */
      font-weight: 600; /* 주말 문구를 강조합니다. */
    }

    @media (max-width: 600px) { /* 휴대폰 화면에서 적용합니다. */

      .container { /* 모바일 전체 영역입니다. */
        padding: 25px 10px; /* 모바일에서는 여백을 줄입니다. */
      }

      .target-name { /* 모바일 목표 이름입니다. */
        font-size: 22px; /* 목표 이름을 작게 표시합니다. */
      }

      .remaining { /* 모바일 D-Day입니다. */
        font-size: 48px; /* D-Day 크기를 줄입니다. */
      }

      th, td { /* 모바일 표의 칸입니다. */
        padding: 12px 4px; /* 칸의 여백을 줄입니다. */
        font-size: 14px; /* 글자를 조금 작게 표시합니다. */
      }
    }

  </style> <!-- CSS를 끝냅니다. -->
</head> <!-- 문서 설정 영역을 끝냅니다. -->

<body> <!-- 화면에 표시할 내용을 시작합니다. -->

  <div class="container"> <!-- 전체 콘텐츠를 담습니다. -->

    <section class="dday"> <!-- D-Day 영역을 시작합니다. -->
      <div id="targetName" class="target-name"></div> <!-- 목표 이름을 표시합니다. -->
      <div id="remaining" class="remaining"></div> <!-- 남은 날짜를 표시합니다. -->
      <div id="dateText" class="date-text"></div> <!-- 목표 날짜를 표시합니다. -->
    </section> <!-- D-Day 영역을 끝냅니다. -->

    <section> <!-- 시간표 영역을 시작합니다. -->
      <h2>주간 시간표</h2> <!-- 시간표 제목입니다. -->
      <p id="dayOffMessage" class="day-off"></p> <!-- 주말일 때 쉬는 날 문구를 표시합니다. -->

      <table> <!-- 시간표 표를 시작합니다. -->
        <thead> <!-- 표의 제목 영역을 시작합니다. -->
          <tr> <!-- 제목 행을 시작합니다. -->
            <th>교시</th> <!-- 교시 제목입니다. -->
            <th>월</th> <!-- 월요일 제목입니다. -->
            <th>화</th> <!-- 화요일 제목입니다. -->
            <th>수</th> <!-- 수요일 제목입니다. -->
            <th>목</th> <!-- 목요일 제목입니다. -->
            <th>금</th> <!-- 금요일 제목입니다. -->
          </tr> <!-- 제목 행을 끝냅니다. -->
        </thead> <!-- 표의 제목 영역을 끝냅니다. -->

        <tbody id="scheduleBody"></tbody> <!-- JavaScript가 시간표를 넣습니다. -->
      </table> <!-- 시간표 표를 끝냅니다. -->
    </section> <!-- 시간표 영역을 끝냅니다. -->

  </div> <!-- 전체 콘텐츠를 끝냅니다. -->

  <script> // JavaScript를 시작합니다.

    // ==================== 여기만 고치세요 ==================== // 수정할 데이터는 이 부분만 바꾸면 됩니다.

    const TITLE = '운동회'; // 페이지의 목표 이름입니다.
    const TARGET = { label: '운동회', date: '2026-10-21' }; // 목표 이름과 날짜입니다.
    const DAYS = ['월', '화', '수', '목', '금']; // 시간표의 요일입니다.

    const PERIODS = [ // 시간표 데이터를 설정합니다.
      { time: '09:05', subjects: ['음악', '음악', '도덕', '체육', '체육'] }, // 1교시입니다.
      { time: '10:00', subjects: ['도덕', '과학', '영어', '체육', '체육'] }, // 2교시입니다.
      { time: '10:55', subjects: ['체육', '영어', '체육', '체육', '체육'] }, // 3교시입니다.
      { time: '11:50', subjects: ['체육', '국어', '기술', '체육', '체육'] }, // 4교시입니다.
      { time: '14:30', subjects: ['수학', '정보', '수학', '체육', '체육'] } // 5교시입니다.
    ]; // 시간표 데이터를 끝냅니다.

    // ==================== 여기만 고치세요 ==================== // 위의 데이터만 수정하면 됩니다.

    document.title = TITLE; // 브라우저 탭 제목을 목표 이름으로 설정합니다.

    const targetNameElement = document.getElementById("targetName"); // 목표 이름을 표시할 곳을 가져옵니다.
    const remainingElement = document.getElementById("remaining"); // D-Day를 표시할 곳을 가져옵니다.
    const dateTextElement = document.getElementById("dateText"); // 목표 날짜를 표시할 곳을 가져옵니다.
    const scheduleBodyElement = document.getElementById("scheduleBody"); // 시간표를 표시할 곳을 가져옵니다.
    const dayOffMessageElement = document.getElementById("dayOffMessage"); // 주말 문구를 표시할 곳을 가져옵니다.

    targetNameElement.textContent = TARGET.label; // 설정한 목표 이름을 화면에 표시합니다.
    dateTextElement.textContent = "목표 날짜: " + TARGET.date; // 설정한 목표 날짜를 화면에 표시합니다.

    function updateDday() { // D-Day를 계산하는 함수를 만듭니다.

      const today = new Date(); // 현재 날짜를 가져옵니다.
      const target = new Date(TARGET.date + "T00:00:00"); // 목표 날짜를 가져옵니다.
      const todayOnly = new Date(today.getFullYear(), today.getMonth(), today.getDate()); // 오늘 날짜만 남깁니다.
      const difference = target - todayOnly; // 목표 날짜와 오늘 날짜의 차이를 계산합니다.
      const days = Math.ceil(difference / (1000 * 60 * 60 * 24)); // 차이를 일수로 바꿉니다.

      if (days > 0) { // 목표 날짜가 아직 남았다면 실행합니다.
        remainingElement.textContent = "D-" + days; // D-숫자로 표시합니다.
      } else if (days === 0) { // 목표 날짜가 오늘이면 실행합니다.
        remainingElement.textContent = "D-DAY"; // D-DAY로 표시합니다.
      } else { // 목표 날짜가 지났다면 실행합니다.
        remainingElement.textContent = "D+" + Math.abs(days); // D+숫자로 표시합니다.
      }
    }

    function createSchedule() { // 시간표를 만드는 함수를 시작합니다.

      scheduleBodyElement.innerHTML = ""; // 기존 시간표 내용을 비웁니다.

      PERIODS.forEach((period, index) => { // 모든 교시를 하나씩 처리합니다.

        const row = document.createElement("tr"); // 새로운 행을 만듭니다.

        const periodCell = document.createElement("td"); // 교시 번호 칸을 만듭니다.
        periodCell.textContent = (index + 1) + "교시"; // 교시 번호를 표시합니다.
        row.appendChild(periodCell); // 교시 번호 칸을 행에 추가합니다.

        period.subjects.forEach((subject) => { // 월요일부터 금요일까지 과목을 처리합니다.

          const cell = document.createElement("td"); // 과목 칸을 만듭니다.
          cell.textContent = subject; // 과목 이름을 넣습니다.
          row.appendChild(cell); // 과목 칸을 행에 추가합니다.
        });

        scheduleBodyElement.appendChild(row); // 완성한 행을 시간표에 추가합니다.
      });
    }

    function updateCurrentPeriod() { // 현재 교시를 확인하는 함수를 만듭니다.

      const now = new Date(); // 현재 날짜와 시간을 가져옵니다.
      const dayIndex = now.getDay() - 1; // 월요일을 0으로 계산합니다.
      const currentMinutes = now.getHours() * 60 + now.getMinutes(); // 현재 시간을 분으로 바꿉니다.

      dayOffMessageElement.textContent = ""; // 쉬는 날 문구를 초기화합니다.

      document.querySelectorAll("#scheduleBody td").forEach((cell) => { // 모든 시간표 칸을 확인합니다.
        cell.classList.remove("today-period"); // 기존 강조를 제거합니다.
      });

      if (dayIndex < 0 || dayIndex > 4) { // 토요일이나 일요일인지 확인합니다.
        dayOffMessageElement.textContent = "오늘은 쉬는 날"; // 주말 문구를 표시합니다.
        return; // 함수를 종료합니다.
      }

      PERIODS.forEach((period, periodIndex) => { // 모든 교시를 확인합니다.

        const [hour, minute] = period.time.split(":").map(Number); // 교시 시작 시간을 분리합니다.
        const periodMinutes = hour * 60 + minute; // 교시 시작 시간을 분으로 바꿉니다.
        const nextPeriod = PERIODS[periodIndex + 1]; // 다음 교시를 가져옵니다.

        let nextMinutes = 24 * 60; // 마지막 교시는 하루 끝까지로 설정합니다.

        if (nextPeriod) { // 다음 교시가 있다면 실행합니다.
          const [nextHour, nextMinute] = nextPeriod.time.split(":").map(Number); // 다음 교시 시간을 분리합니다.
          nextMinutes = nextHour * 60 + nextMinute; // 다음 교시 시작 시간을 분으로 바꿉니다.
        }

        if (currentMinutes >= periodMinutes && currentMinutes < nextMinutes) { // 현재 시간이 해당 교시인지 확인합니다.

          const row = document.querySelectorAll("#scheduleBody tr")[periodIndex]; // 현재 교시의 행을 찾습니다.
          const cell = row.querySelectorAll("td")[dayIndex + 1]; // 오늘 요일의 과목 칸을 찾습니다.

          cell.classList.add("today-period"); // 현재 교시 칸을 강조합니다.
        }
      });
    }

    updateDday(); // D-Day를 처음 계산합니다.
    createSchedule(); // 시간표를 처음 만듭니다.
    updateCurrentPeriod(); // 현재 교시를 처음 확인합니다.
    setInterval(updateCurrentPeriod, 60000); // 1분마다 현재 교시를 갱신합니다.

  </script> <!-- JavaScript를 끝냅니다. -->

</body> <!-- 화면 영역을 끝냅니다. -->
</html> <!-- HTML 문서를 끝냅니다. -->
