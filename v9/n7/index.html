<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- 한글을 정상적으로 표시합니다. -->
  <meta charset="UTF-8">
  <!-- 휴대폰에서도 화면에 맞게 표시합니다. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 브라우저 탭의 제목입니다. -->
  <title>5학년 5학기</title>

  <style>
    /* 모든 요소의 크기 계산을 설정합니다. */
    * { box-sizing: border-box; }

    /* 페이지 전체의 모양을 설정합니다. */
    body {
      /* 기본 여백을 없앱니다. */
      margin: 0;
      /* 글꼴을 설정합니다. */
      font-family: Arial, "맑은 고딕", sans-serif;
      /* 배경색을 설정합니다. */
      background: #f3f4f6;
      /* 글자색을 설정합니다. */
      color: #222;
    }

    /* D-Day 영역을 설정합니다. */
    .dday {
      /* 글자를 가운데 정렬합니다. */
      text-align: center;
      /* 안쪽 여백을 설정합니다. */
      padding: 50px 20px;
      /* 배경색을 설정합니다. */
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      /* 글자를 흰색으로 설정합니다. */
      color: white;
    }

    /* 제목의 모양을 설정합니다. */
    .title {
      /* 제목 크기를 설정합니다. */
      font-size: 30px;
      /* 제목 아래 여백을 설정합니다. */
      margin-bottom: 20px;
    }

    /* D-Day 숫자의 모양을 설정합니다. */
    .dday-number {
      /* 숫자를 크게 표시합니다. */
      font-size: 70px;
      /* 숫자를 굵게 표시합니다. */
      font-weight: bold;
      /* 기본 여백을 제거합니다. */
      margin: 0;
    }

    /* 날짜의 모양을 설정합니다. */
    .date {
      /* 날짜 위쪽에 여백을 줍니다. */
      margin-top: 20px;
    }

    /* 시간표 영역을 설정합니다. */
    .schedule {
      /* 최대 너비를 설정합니다. */
      max-width: 1000px;
      /* 화면 가운데에 배치합니다. */
      margin: 40px auto;
      /* 좌우 여백을 설정합니다. */
      padding: 0 15px;
    }

    /* 시간표 제목을 설정합니다. */
    .schedule h2 {
      /* 제목을 가운데 정렬합니다. */
      text-align: center;
      /* 제목 아래 여백을 설정합니다. */
      margin-bottom: 20px;
    }

    /* 시간표 표를 설정합니다. */
    table {
      /* 표의 선을 합칩니다. */
      border-collapse: collapse;
      /* 표의 너비를 100%로 설정합니다. */
      width: 100%;
      /* 표 배경을 흰색으로 설정합니다. */
      background: white;
      /* 표 모서리를 둥글게 합니다. */
      border-radius: 12px;
      /* 표에 그림자를 넣습니다. */
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      /* 내용이 모서리 밖으로 나가지 않게 합니다. */
      overflow: hidden;
    }

    /* 표의 모든 칸을 설정합니다. */
    th, td {
      /* 칸의 테두리를 설정합니다. */
      border: 1px solid #e5e7eb;
      /* 칸 안쪽 여백을 설정합니다. */
      padding: 16px 10px;
      /* 글자를 가운데 정렬합니다. */
      text-align: center;
    }

    /* 표의 머리글을 설정합니다. */
    th {
      /* 연한 보라색 배경을 사용합니다. */
      background: #eef2ff;
      /* 글자색을 설정합니다. */
      color: #3730a3;
    }

    /* 시간 칸을 설정합니다. */
    .time {
      /* 시간 글자를 굵게 표시합니다. */
      font-weight: bold;
      /* 시간 칸의 배경색을 설정합니다. */
      background: #f9fafb;
    }

    /* 휴대폰 화면에서 보기 좋게 만듭니다. */
    @media (max-width: 600px) {
      /* 휴대폰에서 제목 크기를 줄입니다. */
      .title { font-size: 24px; }

      /* 휴대폰에서 D-Day 크기를 줄입니다. */
      .dday-number { font-size: 52px; }

      /* 휴대폰에서 표 크기를 줄입니다. */
      th, td {
        /* 칸의 여백을 줄입니다. */
        padding: 12px 5px;
        /* 글자 크기를 줄입니다. */
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <!-- D-Day를 표시하는 영역입니다. -->
  <section class="dday">
    <!-- 제목을 표시합니다. -->
    <div id="title" class="title"></div>

    <!-- D-Day를 표시합니다. -->
    <div id="ddayNumber" class="dday-number"></div>

    <!-- 목표 날짜를 표시합니다. -->
    <div id="targetDate" class="date"></div>
  </section>

  <!-- 시간표를 표시하는 영역입니다. -->
  <section class="schedule">
    <!-- 시간표 제목입니다. -->
    <h2>월~금 시간표</h2>

    <!-- 시간표 표입니다. -->
    <table>
      <!-- 요일을 넣을 곳입니다. -->
      <thead id="scheduleHead"></thead>

      <!-- 과목을 넣을 곳입니다. -->
      <tbody id="scheduleBody"></tbody>
    </table>
  </section>

  <script>
    // ==========================================================
    // 여기만 고치세요.
    // ==========================================================

    // 화면에 표시할 학기 이름입니다.
    const TITLE = '5학년 5학기';

    // 목표 날짜를 설정합니다.
    const TARGET = {
      // 목표 이름입니다.
      label: 'D-Day',
      // 목표 날짜입니다.
      date: '2026-09-29'
    };

    // 시간표의 요일입니다.
    const DAYS = ['월', '화', '수', '목', '금'];

    // 1교시부터 5교시까지의 시간표입니다.
    const PERIODS = [
      // 1교시는 월~금 모두 체육입니다.
      { time: '09:00', subjects: ['체육', '체육', '체육', '체육', '체육'] },

      // 2교시는 월~금 모두 바이브코딩입니다.
      { time: '10:00', subjects: ['바이브코딩', '바이브코딩', '바이브코딩', '바이브코딩', '바이브코딩'] },

      // 3교시는 월~금 모두 바이브코딩입니다.
      { time: '11:00', subjects: ['바이브코딩', '바이브코딩', '바이브코딩', '바이브코딩', '바이브코딩'] },

      // 4교시는 여러 일반 교과목입니다.
      { time: '13:00', subjects: ['국어', '수학', '영어', '과학', '사회'] },

      // 5교시는 여러 일반 교과목입니다.
      { time: '14:00', subjects: ['수학', '국어', '체육', '미술', '음악'] }
    ];

    // ==========================================================
    // 여기부터는 수정하지 않아도 됩니다.
    // ==========================================================

    // 제목을 화면에 표시합니다.
    document.getElementById('title').textContent = TITLE;

    // 목표 날짜를 자정 기준으로 만듭니다.
    const targetDate = new Date(TARGET.date + 'T00:00:00');

    // 현재 날짜를 가져옵니다.
    const today = new Date();

    // 현재 시간을 자정으로 맞춥니다.
    today.setHours(0, 0, 0, 0);

    // 목표 날짜와 오늘 날짜의 차이를 계산합니다.
    const difference = targetDate - today;

    // 하루를 밀리초로 계산합니다.
    const oneDay = 1000 * 60 * 60 * 24;

    // 남은 날짜를 계산합니다.
    const daysLeft = Math.ceil(difference / oneDay);

    // D-Day를 표시할 곳을 가져옵니다.
    const ddayNumber = document.getElementById('ddayNumber');

    // 목표 날짜가 아직 남았는지 확인합니다.
    if (daysLeft > 0) {
      // 남은 날짜를 표시합니다.
      ddayNumber.textContent = 'D-' + daysLeft;
    } else if (daysLeft === 0) {
      // 오늘이 목표 날짜라면 D-Day를 표시합니다.
      ddayNumber.textContent = 'D-Day';
    } else {
      // 목표 날짜가 지났다면 지난 날짜를 표시합니다.
      ddayNumber.textContent = 'D+' + Math.abs(daysLeft);
    }

    // 목표 날짜를 화면에 표시합니다.
    document.getElementById('targetDate').textContent =
      '목표 날짜: ' + TARGET.date;

    // 시간표 머리글 영역을 가져옵니다.
    const scheduleHead = document.getElementById('scheduleHead');

    // 시간표 내용 영역을 가져옵니다.
    const scheduleBody = document.getElementById('scheduleBody');

    // 시간표 머리글 행을 만듭니다.
    const headerRow = document.createElement('tr');

    // 시간 머리글 칸을 만듭니다.
    const timeHeader = document.createElement('th');

    // 시간이라는 글자를 표시합니다.
    timeHeader.textContent = '시간';

    // 시간 머리글을 행에 추가합니다.
    headerRow.appendChild(timeHeader);

    // 월요일부터 금요일까지 반복합니다.
    DAYS.forEach(function(day) {
      // 새로운 요일 칸을 만듭니다.
      const th = document.createElement('th');

      // 요일을 표시합니다.
      th.textContent = day;

      // 요일 칸을 추가합니다.
      headerRow.appendChild(th);
    });

    // 완성된 머리글을 표에 추가합니다.
    scheduleHead.appendChild(headerRow);

    // 각 교시를 반복합니다.
    PERIODS.forEach(function(period) {
      // 새로운 행을 만듭니다.
      const row = document.createElement('tr');

      // 시간 칸을 만듭니다.
      const timeCell = document.createElement('td');

      // 시간을 표시합니다.
      timeCell.textContent = period.time;

      // 시간 칸에 클래스를 적용합니다.
      timeCell.className = 'time';

      // 시간 칸을 행에 추가합니다.
      row.appendChild(timeCell);

      // 월요일부터 금요일까지 과목을 반복합니다.
      period.subjects.forEach(function(subject) {
        // 새로운 과목 칸을 만듭니다.
        const cell = document.createElement('td');

        // 과목을 표시합니다.
        cell.textContent = subject || '-';

        // 과목 칸을 행에 추가합니다.
        row.appendChild(cell);
      });

      // 완성된 행을 표에 추가합니다.
      scheduleBody.appendChild(row);
    });
  </script>
</body>
</html>
