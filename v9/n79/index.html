<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 시간표</title>
    <!-- 구글 폰트 Jua(주아) 불러오기 -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f6f2ff;       /* 배경 색상 */
            --card-bg: #ffffff;        /* 카드 및 칸 백그라운드 색상 */
            --text-color: #4a3f63;     /* 기본 글자 색상 */
            --point-color: #b58cff;    /* 강조 포인트 색상 */
            --border-radius: 22px;     /* 모서리 둥글기 */
            --highlight-border: #ff7675;/* 현재 교시 테두리 강조 색상 */
        }

        /* 전체 페이지 기본 설정 */
        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Jua', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* 메인 컨테이너 박스 */
        .container {
            width: 100%;
            max-width: 600px;
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 25px;
            box-shadow: 0 10px 25px rgba(181, 140, 255, 0.2);
            box-sizing: border-box;
            text-align: center;
        }

        /* 타이틀 제목 스타일 */
        h1 {
            font-size: 2rem;
            margin-top: 0;
            margin-bottom: 15px;
            color: var(--point-color);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }

        /* D-Day 카운터 박스 */
        .dday-box {
            background-color: var(--bg-color);
            border-radius: var(--border-radius);
            padding: 20px;
            margin-bottom: 25px;
            border: 2px dashed var(--point-color);
        }

        /* 목표 이름 및 남은 날짜 텍스트 */
        .dday-title {
            font-size: 1.2rem;
            margin-bottom: 5px;
        }

        .dday-count {
            font-size: 2.2rem;
            color: var(--point-color);
            margin: 0;
        }

        /* 주말 안내 메시지 스타일 */
        .weekend-msg {
            font-size: 1.1rem;
            color: var(--highlight-border);
            margin-top: 8px;
        }

        /* 시간표 테이블 래퍼 */
        .table-wrapper {
            overflow-x: auto;
            border-radius: var(--border-radius);
        }

        /* 시간표 테이블 디자인 */
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            overflow: hidden;
        }

        /* 테이블 헤더 및 셀 공통 스타일 */
        th, td {
            padding: 12px 8px;
            font-size: 0.95rem;
            text-align: center;
            border: 1px solid var(--bg-color);
        }

        /* 헤더(요일 및 시간) 배경 */
        th {
            background-color: var(--point-color);
            color: #ffffff;
        }

        /* 현재 교시 강조 테두리 클래스 */
        .current-period {
            border: 3px solid var(--highlight-border) !important;
            background-color: #fff0f0;
            transform: scale(1.02);
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 웹앱 타이틀이 표시될 공간 -->
        <h1 id="app-title">나의 시간표</h1>

        <!-- D-Day 카운터가 표시되는 영역 -->
        <div class="dday-box">
            <div class="dday-title" id="dday-label-text">목표까지</div>
            <div class="dday-count" id="dday-count-text">D-0</div>
            <div class="weekend-msg" id="weekend-notice" style="display: none;"></div>
        </div>

        <!-- 월~금 시간표가 들어갈 테이블 영역 -->
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>교시</th>
                        <!-- JS를 통해 월~금 요일 헤더가 동적으로 생성됩니다 -->
                        <th id="day-header-0">월</th>
                        <th id="day-header-1">화</th>
                        <th id="day-header-2">수</th>
                        <th id="day-header-3">목</th>
                        <th id="day-header-4">금</th>
                    </tr>
                </thead>
                <tbody id="schedule-body">
                    <!-- JS를 통해 시간표 행과 과목이 동적으로 채워집니다 -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // ==========================================
        // [여기만 고치세요] 데이터 및 설정 영역
        // ==========================================
        const TITLE  = '나의 시간표';                             // 웹앱 상단 제목
        const TARGET = { label:'목표', date:'2026-12-10' };        // D-Day 목표 이름과 날짜 (YYYY-MM-DD)
        const DAYS   = ['월','화','수','목','금'];                 // 요일 목록
        const PERIODS = [                                          // 교시별 시간 및 과목 목록
          { time:'09:00', subjects:['과자', '영화', '피구', '과자', '게임'] },
          { time:'10:00', subjects:['영화', '체육', '코딩', '유*브', '체육'] },
          { time:'11:00', subjects:['유*브', '게임', '놀기', '마피아게임', '아싸홍삼'] },
          { time:'13:00', subjects:['밥', '밥', '밥', '밥', '밥'] },
          { time:'14:00', subjects:['게임', '유*브', '자유시간', '게임', '코딩'] },
        ];

        // 웹페이지 제목 설정 적용
        document.getElementById('app-title').innerText = TITLE;

        // D-Day 계산 및 화면 표시 함수
        function updateDday() {
            const today = new Date();                                      // 오늘 날짜 객체 생성
            const targetDate = new Date(TARGET.date);                      // 목표 날짜 객체 생성
            
            // 시각 차이를 일(day) 단위로 계산
            const diffTime = targetDate.setHours(0,0,0,0) - today.setHours(0,0,0,0);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            const labelElem = document.getElementById('dday-label-text');
            const countElem = document.getElementById('dday-count-text');

            if (diffDays > 0) {
                labelElem.innerText = `${TARGET.label}까지 남은 날`;
                countElem.innerText = `D - ${diffDays}`;
            } else if (diffDays === 0) {
                labelElem.innerText = `${TARGET.label} 당일!`;
                countElem.innerText = `D - DAY`;
            } else {
                labelElem.innerText = `${TARGET.label} 지남`;
                countElem.innerText = `D + ${Math.abs(diffDays)}`;
            }
        }

        // 시간표 테이블 HTML 생성 함수
        function renderSchedule() {
            const tbody = document.getElementById('schedule-body');
            tbody.innerHTML = '';                                          // 기존 내용을 초기화

            PERIODS.forEach((period, pIndex) => {
                const tr = document.createElement('tr');                   // 행(tr) 생성

                // 시간 표시 셀 생성
                const timeTd = document.createElement('td');
                timeTd.innerText = period.time;
                tr.appendChild(timeTd);

                // 요일별 과목 셀 생성
                period.subjects.forEach((subject, dIndex) => {
                    const subjTd = document.createElement('td');
                    subjTd.innerText = subject;
                    // 나중에 현재 교시를 찾기 쉽도록 고유 아이디 부여 (예: cell-2-0)
                    subjTd.id = `cell-${pIndex}-${dIndex}`;
                    tr.appendChild(subjTd);
                });

                tbody.appendChild(tr);                                     // tbody에 행 추가
            });
        }

        // 현재 시각을 기준으로 오늘 요일과 현재 교시를 판별하여 강조하는 함수
        function highlightCurrentPeriod() {
            const now = new Date();
            const dayOfWeek = now.getDay();                                // 0: 일요일, 1: 월요일 ... 6: 토요일
            const weekendNotice = document.getElementById('weekend-notice');

            // 주말(토요일: 6, 일요일: 0)인 경우 처리
            if (dayOfWeek === 0 || dayOfWeek === 6) {
                weekendNotice.style.display = 'block';
                weekendNotice.innerText = "오늘은 쉬는 날 🥳";
                return;
            } else {
                weekendNotice.style.display = 'none';
            }

            // 월~금은 요일 인덱스 변환 (월: 0, 화: 1, 수: 2, 목: 3, 금: 4)
            const currentDayIndex = dayOfWeek - 1;

            const currentHour = now.getHours();
            const currentMinute = now.getMinutes();
            const currentTimeValue = currentHour * 60 + currentMinute;     // 현재 시각을 분으로 환산

            // 모든 칸의 강조 효과 초기화
            for (let p = 0; p < PERIODS.length; p++) {
                for (let d = 0; d < DAYS.length; d++) {
                    const cell = document.getElementById(`cell-${p}-${d}`);
                    if (cell) {
                        cell.classList.remove('current-period');
                    }
                }
            }

            // 교시별 시간대 비교하여 현재 교시 찾기
            let activePeriodIndex = -1;
            for (let i = 0; i < PERIODS.length; i++) {
                const [pHour, pMin] = PERIODS[i].time.split(':').map(Number);
                const periodStartTime = pHour * 60 + pMin;
                
                // 마지막 교시가 아니면 다음 교시 전까지, 마지막 교시라면 이후 시간까지 포함
                let periodEndTime = periodStartTime + 60;                    // 기본 1교시 간격 60분 가정
                if (i + 1 < PERIODS.length) {
                    const [nextHour, nextMin] = PERIODS[i+1].time.split(':').map(Number);
                    periodEndTime = nextHour * 60 + nextMin;
                } else {
                    periodEndTime = periodStartTime + 120;                   // 마지막 교시는 넉넉하게 2시간 범위로 설정
                }

                if (currentTimeValue >= periodStartTime && currentTimeValue < periodEndTime) {
                    activePeriodIndex = i;
                    break;
                }
            }

            // 현재 교시가 일치하고 월~금 범위 안이라면 테두리 강조 적용
            if (activePeriodIndex !== -1 && currentDayIndex >= 0 && currentDayIndex < 5) {
                const targetCell = document.getElementById(`cell-${activePeriodIndex}-${currentDayIndex}`);
                if (targetCell) {
                    targetCell.classList.add('current-period');
                }
            }
        }

        // 최초 실행 시 함수 호출
        updateDday();
        renderSchedule();
        highlightCurrentPeriod();

        // 1분(60000밀리초)마다 자동으로 시간 및 카운터/교시 갱신
        setInterval(() => {
            updateDday();
            highlightCurrentPeriod();
        }, 60000);
    </script>
</body>
</html>
