<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4학년 2학기 시간표</title>
    <!-- 구글 폰트: 고운 돋움 (Gowun Dodum) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* 지정해주신 컬러 및 스타일 변수 */
            --bg-color: #fff3c7;      /* 배경색 */
            --cell-bg: #b8ccff;       /* 칸 배경색 */
            --text-color: #000000;    /* 기본 글자색 */
            --point-color: #875e5e;   /* 강조 포인트색 (갈색 계열) */
            --border-color: #9cb5f5;  /* 테두리선 색상 */
            --radius: 15px;           /* 모서리 둥글기 */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Gowun Dodum', sans-serif;
            padding: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .schedule-container {
            width: 100%;
            max-width: 800px;
            background-color: #ffffff;
            border: 2px solid var(--border-color);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: 0 4px 16px rgba(135, 94, 94, 0.15);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px dashed var(--border-color);
            padding-bottom: 16px;
        }

        .title {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--text-color);
        }

        .target {
            background-color: var(--bg-color);
            padding: 6px 14px;
            border-radius: var(--radius);
            font-size: 0.9rem;
            border: 1px solid var(--border-color);
            color: var(--point-color); /* 갈색 계열 적용 */
            font-weight: bold;
        }

        .target span {
            color: var(--point-color);
            margin-right: 6px;
        }

        .helper-text {
            font-size: 0.85rem;
            color: var(--point-color);
            margin-bottom: 10px;
            text-align: right;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 8px;
        }

        th, td {
            padding: 14px 10px;
            text-align: center;
            border-radius: var(--radius);
            font-size: 0.95rem;
        }

        th {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-weight: bold;
            border: 1px solid var(--border-color);
        }

        td {
            background-color: var(--cell-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            transition: all 0.2s ease;
        }

        td.time {
            background-color: var(--bg-color);
            font-weight: bold;
            color: var(--point-color);
            font-size: 0.9rem;
        }

        /* 수정 가능한 과목 칸 스타일 */
        td.editable {
            cursor: pointer;
            position: relative;
        }

        td.editable:hover {
            filter: brightness(0.95);
            transform: translateY(-2px);
        }

        /* 입력창 디자인 */
        td.editable input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            text-align: center;
            font-family: 'Gowun Dodum', sans-serif;
            font-size: 0.95rem;
            color: var(--text-color);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="schedule-container">
        <div class="header">
            <h1 class="title">4학년 2학기</h1>
            <div class="target">
                <span>목표</span> 12-25 크리스마스
            </div>
        </div>
        
        <div class="helper-text">💡 과목을 클릭하면 내용을 수정할 수 있어요!</div>

        <table>
            <thead>
                <tr>
                    <th>시간</th>
                    <th>월</th>
                    <th>화</th>
                    <th>수</th>
                    <th>목</th>
                    <th>금</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="time">09:00</td>
                    <td class="editable">국어</td>
                    <td class="editable">수학</td>
                    <td class="editable">영어</td>
                    <td class="editable">수학</td>
                    <td class="editable">수학</td>
                </tr>
                <tr>
                    <td class="time">10:00</td>
                    <td class="editable">수학</td>
                    <td class="editable">영어</td>
                    <td class="editable">과학</td>
                    <td class="editable">동아리</td>
                    <td class="editable">국어</td>
                </tr>
                <tr>
                    <td class="time">11:00</td>
                    <td class="editable">체육</td>
                    <td class="editable">과학</td>
                    <td class="editable">국어</td>
                    <td class="editable">체육</td>
                    <td class="editable">미술</td>
                </tr>
                <tr>
                    <td class="time">13:00</td>
                    <td class="editable">사회</td>
                    <td class="editable">국어</td>
                    <td class="editable">국어</td>
                    <td class="editable">국어</td>
                    <td class="editable">미술</td>
                </tr>
                <tr>
                    <td class="time">14:00</td>
                    <td class="editable">음악</td>
                    <td class="editable">사회</td>
                    <td class="editable">도덕</td>
                    <td class="editable">창체</td>
                    <td class="editable">음악</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        // 과목 칸 클릭 시 텍스트를 수정할 수 있는 input으로 변환하는 기능
        document.querySelectorAll('td.editable').forEach(cell => {
            cell.addEventListener('click', function () {
                if (this.querySelector('input')) return;

                const currentText = this.textContent;
                this.textContent = '';

                const input = document.createElement('input');
                input.type = 'text';
                input.value = currentText;
                this.appendChild(input);
                input.focus();
                input.select();

                const save = () => {
                    this.textContent = input.value.trim() || currentText;
                };

                input.addEventListener('blur', save);
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        input.blur();
                    }
                });
            });
        });
    </script>

</body>
</html>
