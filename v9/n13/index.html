<!DOCTYPE html>
<html lang="ko">
<head>
    <!-- 문서의 문자 인코딩을 UTF-8로 설정합니다 -->
    <meta charset="UTF-8">
    <!-- 모바일 기기 화면 크기에 맞게 반응형 뷰포트를 설정합니다 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 웹페이지의 제목을 설정합니다 -->
    <title>방학표</title>
    <!-- 구글 폰트 Orbitron을 불러옵니다 -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* :root 선택자에 CSS 변수를 선언하여 색상과 디자인 요소를 관리합니다 */
        :root {
            --bg-color: #f5f5f5;      /* 배경 색상 */
            --cell-color: #0bb1da;    /* 칸 배경 색상 */
            --text-color: #23211f;    /* 글자 색상 */
            --point-color: #b670d7;   /* 포인트 색상 */
            --radius-val: 14px;       /* 모서리 둥글기 값 */
        }

        /* 웹페이지 전체 바디 스타일을 지정합니다 */
        body {
            background-color: var(--bg-color); /* 변수로 지정한 배경색 적용 */
            color: var(--text-color);           /* 변수로 지정한 글자색 적용 */
            font-family: 'Orbitron', sans-serif;/* 구글 폰트 Orbitron 적용 */
            margin: 0;                          /* 기본 바디 여백 제거 */
            padding: 20px;                      /* 바디 안쪽 여백 추가 */
            display: flex;                      /* 플렉스 박스 레이아웃 사용 */
            flex-direction: column;             /* 세로 방향 정렬 */
            align-items: center;                /* 가로 가운데 정렬 */
            min-height: 100vh;                  /* 최소 높이를 화면 전체로 설정 */
            box-sizing: border-box;             /* 박스 크기 계산 기준 설정 */
        }

        /* 메인 콘텐츠를 감싸는 컨테이너 박스 스타일 */
        .container {
            width: 100%;                        /* 너비 100% 설정 */
            max-width: 950px;                   /* 최대 너비 제한 */
            background: #ffffff;                /* 흰색 배경 지정 */
            padding: 30px;                      /* 안쪽 여백 설정 */
            border-radius: var(--radius-val);   /* 14px 둥근 모서리 적용 */
            box-shadow: 0 8px 25px rgba(182, 112, 215, 0.15); /* 부드러운 네온 그림자 효과 */
            box-sizing: border-box;             /* 크기 계산 포함 */
        }

        /* D-Day 카운터를 표시하는 상단 박스 스타일 */
        .dday-box {
            text-align: center;                 /* 텍스트 가운데 정렬 */
            margin-bottom: 25px;                /* 아래쪽 여백 추가 */
            padding: 25px;                      /* 안쪽 여백 추가 */
            background: var(--point-color);     /* 포인트 색상 배경 적용 */
            color: #ffffff;                     /* 흰색 글자 적용 */
            border-radius: var(--radius-val);   /* 14px 둥근 모서리 적용 */
            box-shadow: 0 4px 15px rgba(182, 112, 215, 0.4); /* 입체감 주는 그림자 */
        }

        /* D-Day 박스 내부 제목 스타일 */
        .dday-box h1 {
            margin: 0 0 10px 0;                 /* 기본 여백 제거 후 아래 여백 추가 */
            font-size: 1.8rem;                  /* 글자 크기 지정 */
            letter-spacing: 1px;                /* 자간 넓히기 */
        }

        /* D-Day 남은 일수 숫자 텍스트 스타일 */
        .dday-box .counter {
            font-size: 2.6rem;                  /* 크게 보이는 카운터 글자 크기 */
            font-weight: bold;                  /* 굵게 설정 */
        }

        /* 주말 안내 문구 스타일 */
        .weekend-notice {
            text-align: center;                 /* 텍스트 가운데 정렬 */
            font-size: 1.25rem;                 /* 글자 크기 지정 */
            color: var(--point-color);          /* 포인트 색상 적용 */
            margin-bottom: 20px;                /* 아래쪽 여백 추가 */
            font-weight: bold;                  /* 굵게 설정 */
            min-height: 1.5em;                  /* 빈 문자열일 때도 높이 유지 */
        }

        /* 시간표 테이블을 감싸는 스크롤 영역 스타일 */
        .table-container {
            overflow-x: auto;                   /* 모바일 화면에서 가로 스크롤 허용 */
        }

        /* 시간표 테이블 전체 스타일 */
        table {
            width: 100%;                        /* 테이블 너비 100% */
            border-collapse: separate;          /* 테두리 분리 설정 (둥근 모서리 적용 위해) */
            border-spacing: 6px;                /* 칸 사이의 간격 설정 */
        }

        /* 테이블 머리글 및 일반 셀 공통 스타일 */
        th, td {
            padding: 14px 10px;                 /* 안쪽 여백 설정 */
            text-align: center;                 /* 가운데 정렬 */
            border-radius: var(--radius-val);   /* 14px 둥근 모서리 적용 */
            font-size: 0.95rem;                 /* 글자 크기 지정 */
            box-sizing: border-box;             /* 크기 계산 방식 지정 */
        }

        /* 테이블 머리글(요일, 시간 헤더) 스타일 */
        th {
            background-color: var(--text-color);/* 어두운 글자색을 배경색으로 사용 */
            color: #ffffff;                     /* 흰색 글자 적용 */
            font-weight: bold;                  /* 굵게 설정 */
        }

        /* 과목 칸 및 시간 칸 셀 스타일 */
        td {
            background-color: var(--cell-color);/* 칸 배경색 적용 (#0bb1da) */
            color: #ffffff;                     /* 흰색 글자 적용 */
            font-weight: 600;                   /* 약간 굵은 글자 */
            transition: all 0.3s ease;          /* 부드러운 전환 효과 추가 */
        }

        /* 과목 안에 들어가는 이모지와 텍스트 정렬용 span */
        .subject-item {
            display: inline-flex;               /* 인라인 플렉스로 정렬 */
            align-items: center;                /* 수직 가운데 정렬 */
            justify-content: center;            /* 수평 가운데 정렬 */
            gap: 6px;                           /* 이모지와 텍스트 사이 간격 */
        }

        /* 현재 진행 중인 교시 칸에 적용될 네온 강조 테두리 스타일 */
        .current-period {
            border: 4px solid var(--point-color) !important; /* 포인트 색상 두께감 있는 테두리 */
            box-shadow: 0 0 15px var(--point-color);         /* 네온 빛이 번지는 듯한 그림자 효과 */
            transform: scale(1.03);                          /* 살짝 확대하여 눈에 띄게 함 */
        }

        /* 하단 설명 문구 스타일 */
        .description {
            margin-top: 25px;                   /* 위쪽 여백 추가 */
            font-size: 0.85rem;                 /* 작은 글자 크기 설정 */
            color: #666666;                     /* 회색 계열 글자 색상 */
            text-align: center;                 /* 가운데 정렬 */
            line-height: 1.5;                   /* 줄 간격 설정 */
        }
    </style>
</head>
<body>

    <!-- 전체를 감싸는 메인 컨테이너 박스 -->
    <div class="container">
        <!-- 화면 위쪽 D-Day 카운터 영역 -->
        <div class="dday-box">
            <!-- 목표 이름이 표시되는 제목 엘리먼트 -->
            <h1 id="title-text">방학표</h1>
            <!-- 남은 날짜 숫자가 크게 표시되는 엘리먼트 -->
            <div class="counter" id="dday-counter">불러오는 중...</div>
        </div>

        <!-- 주말일 때 "오늘은 쉬는 날" 문구가 표시되는 영역 -->
        <div class="weekend-notice" id="weekend-notice"></div>

        <!-- 아래쪽 시간표 표를 감싸는 영역 -->
        <div class="table-container">
            <!-- 월~금 5교시 시간표 테이블 -->
            <table id="schedule-table">
                <thead>
                    <tr id="table-header-row">
                        <th>시간</th>
                        <!-- 자바스크립트가 요일 헤더를 동적으로 채웁니다 -->
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- 자바스크립트가 시간표 내용을 동적으로 채웁니다 -->
                </tbody>
            </table>
        </div>

        <!-- 요구사항에 맞춘 5줄 이내의 간결한 설명 영역 -->
        <div class="description">
            이 웹 앱은 목표 날짜까지 남은 기간을 계산하고 월요일부터 금요일까지의 5교시 시간표를 보여줍니다.<br>
            현재 시각을 실시간으로 확인하여 오늘 요일의 해당하는 현재 교시 칸에 네온 테두리 강조를 표시합니다.<br>
            주말에는 자동으로 휴식 안내 문구를 띄우며, 모든 데이터와 디자인 변수는 상단 상수 및 :root에서 관리됩니다.
        </div>
    </div>

    <script>
        // ==========================================
        // [여기만 고치세요] 아래 상수 값을 수정하여 내용 변경 가능
        // ==========================================
        const TITLE  = '방학표';                              // 상단 목표 이름 설정
        const TARGET = { label:'생일', date:'2027-04-08' };     // 목표 대상과 날짜 설정 (YYYY-MM-DD 형식)
        const DAYS   = ['월','화','수','목','금'];             // 월~금 요일 배열 설정
        const PERIODS = [
            { time:'09:00', subjects:['과학', '국어', '국어', '과학', '사회'] }, // 1교시 시간 및 과목 목록
            { time:'9:50', subjects:['과학', '영어', '국어', '음악', '사회'] },  // 2교시 시간 및 과목 목록
            { time:'10:40', subjects:['체육', '수학', '체육', '영어', '수학'] }, // 3교시 시간 및 과목 목록
            { time:'11:30', subjects:['음악', '미술', '사회', '도덕', '국어'] }, // 4교시 시간 및 과목 목록
            { time:'1:00', subjects:['수학', '미술', '수학', '수학', '체육'] },  // 5교시 시간 및 과목 목록
        ];
        // ==========================================

        // 과목별로 멋진 이모지 그림을 매칭해주는 헬퍼 함수
        function getSubjectWithIcon(subjectName) {
            let icon = '📖'; // 기본 책 이모지
            if (subjectName === '과학') icon = '🔬';      // 과학 과목 아이콘
            else if (subjectName === '국어') icon = '✍️';    // 국어 과목 아이콘
            else if (subjectName === '영어') icon = '🔤';    // 영어 과목 아이콘
            else if (subjectName === '사회') icon = '🌍';    // 사회 과목 아이콘
            else if (subjectName === '체육') icon = '⚽';    // 체육 과목 아이콘
            else if (subjectName === '음악') icon = '🎵';    // 음악 과목 아이콘
            else if (subjectName === '미술') icon = '🎨';    // 미술 과목 아이콘
            else if (subjectName === '도덕') icon = '🛡️';    // 도덕 과목 아이콘
            else if (subjectName === '수학') icon = '📐';    // 수학 과목 아이콘

            // 이모지와 과목 이름을 담은 HTML 구조 문자열 반환
            return `<span class="subject-item"><span>${icon}</span><span>${subjectName}</span></span>`;
        }

        // HTML 문서의 모든 요소가 완전히 로드된 후 실행됩니다
        window.addEventListener('DOMContentLoaded', function() {
            // 상단 타이틀 영역에 목표 이름 반영
            document.getElementById('title-text').innerText = TITLE + ' - ' + TARGET.label + '까지';

            // D-Day 계산 함수 실행
            updateDday();

            // 시간표 테이블 생성 함수 실행
            buildScheduleTable();

            // 현재 교시 강조 및 주말 확인 함수 실행
            updateCurrentHighlight();

            // 1분(60000밀리초)마다 자동으로 함수들을 재실행하여 실시간 갱신
            setInterval(function() {
                updateDday();
                updateCurrentHighlight();
            }, 60000);
        });

        // D-Day 일수를 계산하여 화면에 표시하는 함수
        function updateDday() {
            const counterEl = document.getElementById('dday-counter'); // 카운터 엘리먼트 가져오기
            const targetDate = new Date(TARGET.date + 'T00:00:00');    // 목표 날짜 객체 생성
            const today = new Date();                                  // 오늘 날짜 객체 생성
            today.setHours(0, 0, 0, 0);                                // 시간을 자정으로 초기화하여 정확한 일수 비교

            const diffTime = targetDate - today;                       // 목표일과 오늘 사이의 밀리초 차이 계산
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); // 밀리초를 일(day) 단위로 변환

            if (diffDays > 0) {
                counterEl.innerText = `D - ${diffDays}일 남음`;          // 남은 일수가 양수인 경우
            } else if (diffDays === 0) {
                counterEl.innerText = `오늘이 바로 그날입니다!`;         // 목표일 당일인 경우
            } else {
                counterEl.innerText = `목표일이 지났습니다 (+${Math.abs(diffDays)}일)`; // 목표일이 지난 경우
            }
        }

        // 월~금 5교시 시간표 테이블 구조를 동적으로 생성하는 함수
        function buildScheduleTable() {
            const headerRow = document.getElementById('table-header-row'); // 테이블 헤더 행 가져오기
            const tbody = document.getElementById('table-body');           // 테이블 본문 영역 가져오기

            // 요일 배열을 순회하며 헤더 셀(th) 생성
            DAYS.forEach(day => {
                const th = document.createElement('th');                   // th 엘리먼트 생성
                th.innerText = day;                                        // 요일 글자 대입
                headerRow.appendChild(th);                                 // 헤더 행에 자식으로 추가
            });

            // 교시 데이터 배열을 순회하며 행(tr) 생성
            PERIODS.forEach((period, pIndex) => {
                const tr = document.createElement('tr');                   // tr 행 엘리먼트 생성
                
                // 각 행의 맨 앞에 시간 표시 셀 생성
                const timeTd = document.createElement('td');
                timeTd.innerText = period.time;                            // 시간 문자열 대입
                timeTd.style.fontWeight = 'bold';                          // 시간 글자 두껍게 설정
                tr.appendChild(timeTd);                                    // 행에 추가

                // 요일별 과목 목록을 순회하며 과목 셀(td) 생성
                period.subjects.forEach((subject, sIndex) => {
                    const td = document.createElement('td');
                    td.innerHTML = getSubjectWithIcon(subject);            // 이모지가 포함된 HTML 과목명 대입
                    td.id = `cell-${sIndex}-${pIndex}`;                    // 위치 추적용 고유 ID 부여 (요일인덱스-교시인덱스)
                    tr.appendChild(td);                                    // 행에 추가
                });

                tbody.appendChild(tr);                                     // 테이블 본문에 완성된 행 추가
            });
        }

        // 현재 시각을 기준으로 요일과 교시를 파악하여 테두리로 강조하고 주말을 안내하는 함수
        function updateCurrentHighlight() {
            // 이전에 적용되었던 모든 강조 클래스 제거
            const prevHighlighted = document.querySelectorAll('.current-period');
            prevHighlighted.forEach(el => el.classList.remove('current-period'));

            const noticeEl = document.getElementById('weekend-notice');    // 주말 안내 엘리먼트 가져오기
            const now = new Date();                                      // 현재 날짜 및 시각 객체 생성
            const dayOfWeek = now.getDay();                              // 현재 요일 번호 가져오기 (0:일, 1:월 ... 6:토)
            const currentHour = now.getHours();                          // 현재 시간(시) 가져오기
            const currentMinute = now.getMinutes();                      // 현재 시간(분) 가져오기
            const currentTimeVal = currentHour * 60 + currentMinute;     // 자정부터 경과한 총 분(minute) 계산

            // 주말(토요일: 6, 일요일: 0)인 경우 처리
            if (dayOfWeek === 0 || dayOfWeek === 6) {
                noticeEl.innerText = "오늘은 쉬는 날";                      // 주말 안내 문구 표시
                return;                                                  // 교시 계산 로직 중단
            } else {
                noticeEl.innerText = "";                                   // 평일인 경우 문구 비우기
            }

            const dayIndex = dayOfWeek - 1;                              // 월요일(1)부터 시작하므로 0~4 인덱스로 변환
            if (dayIndex < 0 || dayIndex > 4) return;                    // 요일 범위를 벗어난 경우 종료

            // 1교시부터 5교시까지의 대략적인 시작 및 종료 시간 범위를 분(minute) 단위로 정의
            const periodTimes = [
                { start: 9 * 60 + 0,   end: 9 * 60 + 45 },   // 1교시 시간대 설정
                { start: 9 * 60 + 50,  end: 10 * 60 + 35 },  // 2교시 시간대 설정
                { start: 10 * 60 + 40, end: 11 * 60 + 25 },  // 3교시 시간대 설정
                { start: 11 * 60 + 30, end: 12 * 60 + 15 },  // 4교시 시간대 설정
                { start: 13 * 60 + 0,  end: 13 * 60 + 50 }   // 5교시 시간대 설정
            ];

            // 정의된 교시 시간대를 순회하며 현재 시간이 속하는 교시 판별
            for (let pIdx = 0; pIdx < periodTimes.length; pIdx++) {
                const p = periodTimes[pIdx];
                if (currentTimeVal >= p.start && currentTimeVal <= p.end) {
                    // 일치하는 교시 칸의 ID를 조합하여 해당 엘리먼트 선택
                    const targetCell = document.getElementById(`cell-${dayIndex}-${pIdx}`);
                    if (targetCell) {
                        targetCell.classList.add('current-period');       // 네온 강조 테두리 클래스 추가
                    }
                    break;                                               // 찾았으므로 반복문 종료
                }
            }
        }
    </script>
</body>
</html>
