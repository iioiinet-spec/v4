<!DOCTYPE html> <!-- HTML5 문서 선언 -->
<html lang="ko"> <!-- 언어를 한국어로 지정 -->
<head> <!-- 문서의 설정 정보를 담는 헤더 영역 -->
  <meta charset="UTF-8"> <!-- 문자 인코딩을 UTF-8로 설정 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 모바일 반응형 화면 설정 -->
  <title>시간표 & D-Day</title> <!-- 브라우저 탭에 표시될 제목 -->

  <!-- 구글 폰트 Noto Serif KR(본명조) 불러오기 -->
  <link rel="preconnect" href="https://fonts.googleapis.com"> <!-- 폰트 서버 사전 연결 -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> <!-- 폰트 정적 자원 사전 연결 -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet"> <!-- 폰트 스타일시트 링크 -->

  <style> /* CSS 스타일시트 시작 */
    :root { /* 프로젝트 전체에서 사용할 CSS 변수 정의 */
      --bg-color: #f2f2f0; /* 배경 색상 */
      --card-bg: #ffffff; /* 카드 및 상자 배경 색상 */
      --text-color: #111111; /* 기본 글자 색상 */
      --point-color: #111111; /* 포인트 및 강조 색상 */
      --border-color: #111111; /* 테두리 선 색상 */
      --radius: 0px; /* 모서리 둥글기 값 (직각) */
    }

    * { /* 모든 HTML 요소에 적용할 기본 스타일 */
      box-sizing: border-box; /* 패딩과 테두리를 너비에 포함 */
      margin: 0; /* 여백 제거 */
      padding: 0; /* 안쪽 여백 제거 */
    }

    body { /* 화면 전체 바탕 스타일 */
      background-color: var(--bg-color); /* 설정한 배경색 적용 */
      color: var(--text-color); /* 설정한 글자색 적용 */
      font-family: 'Noto Serif KR', serif; /* 본명조 폰트 적용 */
      display: flex; /* 중앙 정렬을 위한 플렉스 레이아웃 */
      flex-direction: column; /* 요소를 위에서 아래로 정렬 */
      align-items: center; /* 가로 중앙 정렬 */
      min-height: 100vh; /* 화면 전체 높이 사용 */
      padding: 20px; /* 화면 테두리와의 여백 */
    }

    .container { /* 전체 내용을 담는 중앙 메인 상자 */
      width: 100%; /* 너비 100% 사용 */
      max-width: 650px; /* 최대 너비 제한 */
      margin-top: 20px; /* 위쪽 여백 */
    }

    h1 { /* 최상단 타이틀 제목 스타일 */
      text-align: center; /* 글자 가운데 정렬 */
      margin-bottom: 20px; /* 아래쪽 여백 */
      font-size: 1.8rem; /* 글자 크기 설정 */
    }

    /* 1) D-Day 카운터 상자 스타일 */
    .dday-card { /* D-Day 정보를 담는 상자 */
      background-color: var(--card-bg); /* 카드 배경색 지정 */
      border: 2px solid var(--border-color); /* 테두리 두께와 색상 지정 */
      border-radius: var(--radius); /* 직각 모서리 적용 */
      padding: 25px; /* 안쪽 여백 */
      text-align: center; /* 가운데 정렬 */
      margin-bottom: 25px; /* 아래쪽 시간표와의 여백 */
    }

    .dday-label { /* 디데이 목표 이름 스타일 */
      font-size: 1.1rem; /* 글자 크기 설정 */
      margin-bottom: 8px; /* 아래쪽 여백 */
    }

    .dday-count { /* 디데이 남은 날짜 큰 글자 스타일 */
      font-size: 2.8rem; /* 남은 날짜를 크게 표시 */
      font-weight: bold; /* 두껍게 표시 */
      color: var(--point-color); /* 포인트 색상 적용 */
    }

    /* 2) 시간표 표 스타일 */
    .timetable-card { /* 시간표 전체를 감싸는 상자 */
      background-color: var(--card-bg); /* 흰색 배경 적용 */
      border: 2px solid var(--border-color); /* 외곽 테두리 적용 */
      border-radius: var(--radius); /* 직각 모서리 적용 */
      padding: 15px; /* 안쪽 여백 */
      overflow-x: auto; /* 화면이 좁을 때 가로 스크롤 허용 */
    }

    .status-msg { /* 날짜 알림 문구 스타일 */
      text-align: center; /* 가운데 정렬 */
      font-weight: bold; /* 두꺼운 글씨 */
      margin-bottom: 15px; /* 아래쪽 여백 */
      color: var(--point-color); /* 포인트 색상 지정 */
      font-size: 1.05rem; /* 글자 크기 설정 */
    }

    table { /* 시간표 표 전체 스타일 */
      width: 100%; /* 상자 너비에 맞춤 */
      border-collapse: collapse; /* 셀 테두리 선을 하나로 합침 */
      text-align: center; /* 표 안의 텍스트 가운데 정렬 */
    }

    th, td { /* 표의 칸(셀) 기본 스타일 */
      border: 1px solid var(--border-color); /* 각 칸마다 검은색 테두리 */
      padding: 10px 5px; /* 안쪽 여백 지정 */
      font-size: 0.95rem; /* 글자 크기 설정 */
    }

    th { /* 표의 제목 행(요일, 교시) 스타일 */
      background-color: var(--bg-color); /* 약간 밝은 회색 배경 */
      font-weight: bold; /* 글자 두껍게 */
    }

    /* 3) 현재 교시 자동 강조 클래스 */
    .active-cell { /* 현재 교시에 부여될 강조 스타일 */
      outline: 3px solid var(--point-color); /* 선명한 두꺼운 테두리 둘러싸기 */
      outline-offset: -3px; /* 테두리가 안쪽으로 그려지도록 설정 */
      font-weight: bold; /* 강조를 위해 글자 두껍게 변경 */
      background-color: var(--bg-color); /* 배경색을 살짝 변경하여 눈에 띄게함 */
    }
  </style> <!-- CSS 스타일시트 끝 -->
</head> <!-- 헤더 영역 끝 -->
<body> <!-- 화면에 실제로 보이는 본문 영역 시작 -->

  <div class="container"> <!-- 모든 요소를 하나로 묶어주는 메인 상자 -->

    <h1 id="main-title"></h1> <!-- 학기 및 페이지 제목이 들어갈 위치 -->

    <!-- D-Day 카운터 표시 영역 -->
    <div class="dday-card"> <!-- 디데이 카드 영역 -->
      <div id="dday-label" class="dday-label"></div> <!-- 목표 이름 표시 위치 -->
      <div id="dday-count" class="dday-count"></div> <!-- 남은 일수(D-Day) 표시 위치 -->
    </div> <!-- 디데이 카드 끝 -->

    <!-- 월~금 시간표 표시 영역 -->
    <div class="timetable-card"> <!-- 시간표 카드 영역 -->
      <div id="status-msg" class="status-msg"></div> <!-- 오늘 날짜 출력 영역 -->
      <table> <!-- 시간표 데이터 표 생성 -->
        <thead> <!-- 표의 제목 부분 시작 -->
          <tr> <!-- 요일 제목 행 -->
            <th>교시</th> <!-- 시간 표시 열 제목 -->
            <!-- 자바스크립트로 월~금 요일이 들어감 -->
          </tr>
        </thead>
        <tbody id="timetable-body"> <!-- 자바스크립트로 교시별 과목이 들어갈 자리 -->
        </tbody>
      </table> <!-- 시간표 표 끝 -->
    </div> <!-- 시간표 카드 끝 -->

  </div> <!-- 메인 상자 끝 -->

  <script> /* 자바스크립트 코드 시작 */

    // ==========================================
    // [여기만 고치세요] 사용자 설정 상수 데이터 모음
    // ==========================================
    const TITLE  = '1학년 2학기'; // 상단에 표시될 기본 타이틀 이름
    const TARGET = { label:'2027년 1월 8일', date:'2027-01-08' }; // D-Day 목표 이름과 목표 날짜 (YYYY-MM-DD)
    const DAYS   = ['월','화','수','목','금']; // 시간표에 표시할 주중 요일 목록
    const PERIODS = [ // 교시별 시작 시간과 요일별 과목 목록 설정 데이터
      { time:'09:10', subjects:['사회', '정보', '국어', '기가', '미술'] }, // 1교시
      { time:'10:05', subjects:['과학', '수학', '도덕', '음악', '미술'] }, // 2교시
      { time:'11:00', subjects:['영어', '선체', '기가', '수학', '국어'] }, // 3교시
      { time:'11:55', subjects:['음악', '스클', '과학', '도덕', '수학'] }, // 4교시
      { time:'01:40', subjects:['체육', '진로', '수학', '과학', '도덕'] }, // 5교시
      { time:'02:35', subjects:['정보', '국어', '영어', '체육', '영어'] }, // 6교시
      { time:'03:30', subjects:['',     '정보', '',     '국어', ''    ] }, // 7교시
    ]; // 데이터 모음 끝
    // ==========================================


    // --- D-Day 계산 및 화면 출력 함수 ---
    function updateDDay() { // D-Day 계산 함수 선언
      const today = new Date(); // 오늘 날짜 객체 생성
      const targetDate = new Date(TARGET.date); // 설정해둔 목표 날짜 객체 생성
      
      // 오늘과 목표일의 시간을 0시 0분 0초로 맞추어 pure 날짜 차이만 계산
      today.setHours(0,0,0,0); // 현재 시간 초기화
      targetDate.setHours(0,0,0,0); // 목표 시간 초기화

      const diffTime = targetDate - today; // 두 날짜 간의 밀리초 단위 차이 계산
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); // 밀리초를 일(day) 단위로 환산

      document.getElementById('main-title').innerText = TITLE; // 메인 타이틀 화면 출력
      document.getElementById('dday-label').innerText = `${TARGET.label}까지`; // D-Day 라벨 화면 출력 (예: "2027년 1월 8일까지")

      if (diffDays > 0) { // 목표 날짜가 아직 남았을 경우
        document.getElementById('dday-count').innerText = `D-${diffDays}`; // D-남은일수 형식으로 표시
      } else if (diffDays === 0) { // 오늘이 바로 목표 날짜인 경우
        document.getElementById('dday-count').innerText = `D-Day`; // D-Day 로 표시
      } else { // 목표 날짜가 이미 지난 경우
        document.getElementById('dday-count').innerText = `D+${Math.abs(diffDays)}`; // 지나간 일수 표시
      }
    }


    // --- 시간표 그리기 (초기 1회 실행) ---
    function renderTable() { // 시간표 HTML을 생성해주는 함수
      const headerRow = document.querySelector('thead tr'); // 요일 제목이 들어갈 행 선택
      
      // 요일 헤더 생성 (월~금)
      DAYS.forEach(day => { // 설정된 요일 배열을 순회
        const th = document.createElement('th'); // th 제목 태그 생성
        th.innerText = day; // 요일 이름 텍스트 대입
        headerRow.appendChild(th); // 제목 행에 추가
      });

      const tbody = document.getElementById('timetable-body'); // 표 본문 요소 선택
      tbody.innerHTML = ''; // 기존 내용 초기화

      // 교시별 행 데이터 생성
      PERIODS.forEach((period, pIndex) => { // 교시 목록 순회
        const tr = document.createElement('tr'); // 행(tr) 태그 생성
        
        // 1열: 교시 및 시작 시간
        const timeTd = document.createElement('td'); // 시간용 td 생성
        timeTd.innerHTML = `<strong>${pIndex + 1}교시</strong><br>(${period.time})`; // 교시와 시간 텍스트 채우기
        tr.appendChild(timeTd); // 행에 시간 칸 추가

        // 2~6열: 각 요일별 과목 칸 생성
        period.subjects.forEach((subject, dIndex) => { // 과목 목록 순회
          const td = document.createElement('td'); // 과목용 td 생성
          td.innerText = subject; // 과목명 텍스트 대입
          td.id = `cell-${pIndex}-${dIndex}`; // 나중에 강조 표시할 수 있도록 위치 id 부여
          tr.appendChild(td); // 행에 과목 칸 추가
        });

        tbody.appendChild(tr); // 본문에 완료된 행 추가
      });
    }


    // --- 현재 시간에 맞게 시간표 강조 및 오늘 날짜 갱신 함수 ---
    function highlightCurrentPeriod() { // 실시간 교시 강조 처리 함수
      const now = new Date(); // 현재 시각 가져오기
      const dayOfWeek = now.getDay(); // 현재 요일 (0:일, 1:월, 2:화, 3:수, 4:목, 5:금, 6:토)
      const statusMsgEl = document.getElementById('status-msg'); // 날짜 메시지 출력 요소

      // 오늘 날짜 텍스트 구성 (예: "2026년 10월 3일 (토요일)")
      const year = now.getFullYear(); // 년도
      const month = now.getMonth() + 1; // 월 (0부터 시작하므로 +1)
      const date = now.getDate(); // 일
      const dayNames = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일']; // 요일 명칭
      
      // 상단에 날짜 및 요일만 표시
      statusMsgEl.innerText = `${year}년 ${month}월 ${date}일 (${dayNames[dayOfWeek]})`;

      // 이전의 모든 강조 스타일(active-cell)을 우선 제거
      document.querySelectorAll('.active-cell').forEach(el => { // 모든 강조된 셀 찾기
        el.classList.remove('active-cell'); // active-cell 클래스 삭제
      });

      // 주말 체크 (0: 일요일, 6: 토요일)
      if (dayOfWeek === 0 || dayOfWeek === 6) { // 토요일이거나 일요일인 경우
        return; // 주말에는 교시 강조를 실행하지 않고 종료
      }

      // 평일인 경우 요일 인덱스 변환 (월요일:1->0, 화요일:2->1, ... 금요일:5->4)
      const dayIndex = dayOfWeek - 1; // 자바스크립트 요일을 배열 인덱스에 맞게 조정

      // 현재 분단위 환산 계산 (시 * 60 + 분)
      const currentMinutes = now.getHours() * 60 + now.getMinutes(); // 현재 시각을 분으로 계산

      // 각 교시별 분 환산 및 현재 교시 판별
      PERIODS.forEach((period, pIndex) => { // 교시별 반복
        const [h, m] = period.time.split(':').map(Number); // '09:10' 형태를 시/분 숫자로 분리
        let startMinutes = h * 60 + m; // 시작 시각을 분으로 환산
        
        // 시간 데이터가 12시 이전 형태(예: '01:40', '02:35' 등 오후 시간)일 경우 처리
        if (h < 8) { // 아침 8시 이전 숫자는 오후(PM) 시각으로 간주하여 12시간을 더함
          startMinutes += 12 * 60; // 12시간 분량 추가
        }

        const endMinutes = startMinutes + 45; // 1교시 수업 시간을 45분으로 설정

        // 현재 시각이 해당 교시의 수업 시간 범위 안에 있는지 확인
        if (currentMinutes >= startMinutes && currentMinutes < endMinutes) { // 현재 시간이 시작~종료 사이라면
          const activeTd = document.getElementById(`cell-${pIndex}-${dayIndex}`); // 해당 위치의 셀 선택
          if (activeTd && activeTd.innerText.trim() !== '') { // 해당 위치의 셀이 존재하고 빈 칸이 아닌 경우
            activeTd.classList.add('active-cell'); // 테두리 강조 스타일 클래스 추가
          }
        }
      });
    }


    // --- 페이지 로드 시 실행 및 자동 타이머 설정 ---
    updateDDay(); // 화면이 열리면 D-Day 먼저 계산
    renderTable(); // 시간표 표 구성하여 화면에 그리기
    highlightCurrentPeriod(); // 현재 시간 교시 강조 초기 실행

    // 1분(60,000밀리초)마다 시각을 체크하여 자동 갱신
    setInterval(() => { // 반복 타이머 실행
      highlightCurrentPeriod(); // 현재 교시 강조 업데이트
    }, 60000); // 60,000ms = 1분 주기 설정

  </script> <!-- 자바스크립트 코드 끝 -->
</body>
</html>
