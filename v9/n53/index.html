<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>20000자리 공학계산기</title>
<style>
:root{--bg:#f2f3f6;--pn:#fff;--bt:#e6e8ee;--fg:#16181d;--mu:#667;--ac:#3b63e0;--ok:#fff;--er:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101216;--pn:#181b21;--bt:#252933;--fg:#e8e9ec;--mu:#8a90a0;--ac:#7c9cff;--ok:#10131a;--er:#ff7b6b}}
:root[data-theme="dark"]{--bg:#101216;--pn:#181b21;--bt:#252933;--fg:#e8e9ec;--mu:#8a90a0;--ac:#7c9cff;--ok:#10131a;--er:#ff7b6b}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:18px;margin:4px 0 12px;font-weight:650}
.res{background:var(--pn);border-radius:10px;padding:14px;margin-bottom:12px}
#out{font:14px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;max-height:44vh;min-height:90px;overflow:auto;word-break:break-all;white-space:pre-wrap;user-select:text}
#out .i{font-size:20px;font-weight:600}#out .e{color:var(--er)}
#st{color:var(--mu);font-size:12.5px;margin-top:8px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;color:var(--mu);font-size:13px}
select,input[type=text]{background:var(--pn);color:var(--fg);border:1px solid var(--bt);border-radius:8px;padding:8px;font:inherit}
#in{width:100%;font:17px ui-monospace,Menlo,Consolas,monospace;margin-bottom:10px}
button{font:inherit;color:var(--fg);background:var(--bt);border:0;border-radius:8px;padding:11px 0;cursor:pointer}
button:active{filter:brightness(.9)}button:focus-visible,select:focus-visible,#in:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.bar button{padding:7px 12px}
.g{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.g .f{background:var(--pn)}.g .n{background:var(--bt)}.g .o{color:var(--ac);font-weight:600}
.g .eq{background:var(--ac);color:var(--ok);font-weight:700;grid-column:span 2}
.h{color:var(--mu);font-size:12.5px;margin-top:12px}
</style></head><body><main>
<h1>20000자리 공학계산기</h1>
<div class="res"><div id="out"><span class="i">0</span></div><div id="st">식을 입력하고 = 또는 Enter</div></div>
<div class="bar">
<label>자릿수 <select id="dig"><option>20000</option><option>30000</option><option>50000</option></select></label>
<button id="dg" title="각도 단위">RAD</button>
<label><input type="checkbox" id="grp" checked> 10자리씩 끊기</label>
<button id="cp">결과 복사</button>
</div>
<input type="text" id="in" autocomplete="off" spellcheck="false" placeholder="예: sqrt(2), pi, e^100, 5000!, sin(1)">
<div class="g" id="pad"></div>
<p class="h">지원: + − × ÷ ^ ! ( ) · sqrt cbrt sin cos tan asin acos atan sinh cosh tanh ln log exp abs fact pow(a,b) · pi e ans.<br>고정소수점 계산이라 소수점 아래 지정 자릿수까지 정확합니다 (정수 거듭제곱 ≤ 10만, n! ≤ 3만).</p>
</main>
<script>
const $=id=>document.getElementById(id);
let D=20000,G=80,P,S,deg=false,raw='0',ansS='0';
const setP=p=>{P=p;S=10n**BigInt(p)},pw10=n=>10n**BigInt(n),ab=x=>x<0n?-x:x,bl=n=>n.toString(2).length;
const mul=(a,b)=>a*b/S,div=(a,b)=>{if(!b)throw Error('0으로 나눌 수 없음');return a*S/b};
const resc=(v,a,b)=>b>=a?v*pw10(b-a):v/pw10(a-b);
function isqrt(n){if(n<2n)return n;let x=1n<<BigInt((bl(n)+1)>>1),y;for(;;){y=(x+n/x)>>1n;if(y>=x)return x;x=y}}
const sqrt=a=>{if(a<0n)throw Error('음수의 제곱근');return isqrt(a*S)};
const piC={};
function PI(){if(piC[P])return piC[P];const at=n=>{const n2=BigInt(n*n);let t=S/BigInt(n),s=t,i=1n,g=-1n;while(t){t/=n2;i+=2n;s+=g*(t/i);g=-g}return s};return piC[P]=4n*(4n*at(5)-at(239))}
function exp(x){if(ab(x)>100000n*S)throw Error('지수 범위 초과');const k=Math.min(150,P>>3)+bl(ab(x)/S),y=x>>BigInt(k);let t=S,s=S;for(let n=1n;t;n++){t=t*y/S/n;s+=t}for(let i=0;i<k;i++)s=s*s/S;return s}
function sc(x){const p=PI(),p2=2n*p;x-=((x+p)/p2)*p2;const k=Math.min(150,P>>3),y=x>>BigInt(k),y2=y*y/S;let c=S,t=S,s=y,u=y;
for(let n=1n;t||u;n++){t=-t*y2/S/((2n*n-1n)*(2n*n));u=-u*y2/S/((2n*n)*(2n*n+1n));c+=t;s+=u}
for(let i=0;i<k;i++){const cc=c*c/S-s*s/S;s=2n*c*s/S;c=cc}return[c,s]}
function refine(x,f0,step){const p0=P,L=[];let p=p0;while(p>150){L.unshift(p);p=(p>>1)+60}
let y=BigInt(Math.round(f0*1e15)),cp=15;for(const q of[30,60,120,...L]){y=resc(y,cp,q);cp=q;setP(q);y=step(resc(x,p0,q),y)}setP(p0);return y}
const tf=x=>Number(x*pw10(15)/S)/1e15;
const atan=x=>refine(x,Math.atan(tf(x)),(X,y)=>{const[c,s]=sc(y);return y-div(s-mul(X,c),c+mul(X,s))});
function ln(x){if(x<=0n)throw Error('ln은 양수만 가능');const s=x.toString(),h=Math.min(17,s.length);
return refine(x,Math.log(parseFloat(s.slice(0,h)))+(s.length-h-P)*Math.LN10,(X,y)=>{const e=exp(y);return y+div(X-e,e)})}
function pow(a,b){if(b%S===0n&&ab(b)<=100000n*S){let n=ab(b)/S,r=S,q=a;for(;n>0n;n>>=1n){if(n&1n)r=mul(r,q);if(n>1n)q=mul(q,q)}return b<0n?div(S,r):r}
if(a<0n)throw Error('음수의 비정수 거듭제곱');if(!a)return 0n;return exp(mul(b,ln(a)))}
function fact(x){if(x%S||x<0n)throw Error('팩토리얼은 0 이상 정수만');const n=BigInt(x/S);if(n>30000n)throw Error('n ≤ 30000');let r=1n;for(let i=2n;i<=n;i++)r*=i;return r*S}
const toR=x=>deg?mul(x,PI())/180n:x,fromR=x=>deg?div(x*180n,PI()):x;
const asinR=x=>{if(ab(x)>S)throw Error('정의역 오류');if(ab(x)===S)return x/S*PI()/2n;return atan(div(x,sqrt(S-mul(x,x))))};
const F={sqrt,cbrt:x=>pow(x,div(S,3n*S)),sin:x=>sc(toR(x))[1],cos:x=>sc(toR(x))[0],tan:x=>{const[c,s]=sc(toR(x));return div(s,c)},
asin:x=>fromR(asinR(x)),acos:x=>fromR(PI()/2n-asinR(x)),atan:x=>fromR(atan(x)),
sinh:x=>{const e=exp(x);return(e-div(S,e))/2n},cosh:x=>{const e=exp(x);return(e+div(S,e))/2n},tanh:x=>{const e=exp(2n*x);return div(e-S,e+S)},
ln,log:x=>div(ln(x),ln(10n*S)),exp,abs:ab,fact,pow};
const num=s=>{const m=/^(\d*)\.?(\d*)(?:e([+-]?\d+))?$/i.exec(s),d=BigInt((m[1]+m[2])||'0'),e=P+(+(m[3]||0))-m[2].length;return e>=0?d*pw10(e):d/pw10(-e)};
function evaluate(src){
src=src.replace(/×/g,'*').replace(/÷/g,'/').replace(/π/g,'pi').replace(/√/g,'sqrt');
const T=[],re=/\s*(?:(\d+\.?\d*(?:e[+-]?\d+)?|\.\d+(?:e[+-]?\d+)?)|([a-z_]\w*)|(\S))/iy;let m;
while(re.lastIndex<src.length&&(m=re.exec(src)))T.push(m[1]?{t:'n',v:m[1]}:m[2]?{t:'i',v:m[2]}:{t:'o',v:m[3]});
let k=0;const pk=()=>T[k],nx=()=>T[k++],isO=c=>pk()&&pk().t=='o'&&pk().v==c;
function E(){let a=Tm();while(isO('+')||isO('-')){const o=nx().v,b=Tm();a=o=='+'?a+b:a-b}return a}
function Tm(){let a=U();for(;;){if(isO('*')){nx();a=mul(a,U())}else if(isO('/')){nx();a=div(a,U())}else if(pk()&&(pk().t!='o'||isO('(')))a=mul(a,U());else return a}}
function U(){if(isO('-')){nx();return-U()}if(isO('+')){nx();return U()}const a=Po();if(isO('^')){nx();return pow(a,U())}return a}
function Po(){let a=Pr();while(isO('!')){nx();a=fact(a)}return a}
function Pr(){const t=nx();if(!t)throw Error('식이 끝나지 않았습니다');
if(t.t=='n')return num(t.v);
if(t.t=='i'){const n=t.v.toLowerCase();if(isO('(')){nx();const a=[E()];while(isO(',')){nx();a.push(E())}if(!isO(')'))throw Error('")"가 필요합니다');nx();const f=F[n];if(!f)throw Error('알 수 없는 함수: '+t.v);return f(...a)}
if(n=='pi')return PI();if(n=='e')return exp(S);if(n=='ans')return(ansS[0]=='-'?-1n:1n)*num(ansS.replace('-',''));throw Error('알 수 없는 이름: '+t.v)}
if(t.v=='('){const a=E();if(!isO(')'))throw Error('")"가 필요합니다');nx();return a}
throw Error('잘못된 기호: '+t.v)}
const v=E();if(k<T.length)throw Error('해석할 수 없는 부분: '+T[k].v);return v}
function fmt(v){const neg=v<0n;v=ab(v);const r=(v+5n*pw10(G-1))/pw10(G),s=r.toString().padStart(D+1,'0');
return{neg:neg&&r!==0n,ip:s.slice(0,-D),fp:s.slice(-D).replace(/0+$/,'')}}
function show(){const o=$('out');o.textContent='';const sp=document.createElement('span');sp.className='i';sp.textContent=raw;o.appendChild(sp)}
function run(){const src=$('in').value.trim();if(!src)return;$('st').textContent='계산 중…';
setTimeout(()=>{const t0=performance.now(),o=$('out');
try{D=+$('dig').value;setP(D+G);const f=fmt(evaluate(src));raw=(f.neg?'-':'')+f.ip+(f.fp?'.'+f.fp:'');ansS=raw;
const g=$('grp').checked;o.textContent='';const a=document.createElement('span');a.className='i';a.textContent=(f.neg?'-':'')+f.ip;o.appendChild(a);
if(f.fp){o.appendChild(document.createTextNode('.'+(g?f.fp.replace(/(.{10})/g,'$1 ').trim():f.fp)))}
$('st').textContent=`정수부 ${f.ip.length}자리 · 소수부 ${f.fp.length}자리 · 총 ${f.ip.length+f.fp.length}자리 · ${Math.round(performance.now()-t0)}ms`;o.scrollTop=0}
catch(e){o.innerHTML='';const s=document.createElement('span');s.className='e';s.textContent=e.message||String(e);o.appendChild(s);$('st').textContent='오류'}},30)}
const keys=[['sin','sin(','f'],['cos','cos(','f'],['tan','tan(','f'],['π','pi','f'],['e','e','f'],['AC','AC','o'],
['asin','asin(','f'],['acos','acos(','f'],['atan','atan(','f'],['(','(','f'],[')',')','f'],['⌫','BS','o'],
['ln','ln(','f'],['log','log(','f'],['eˣ','exp(','f'],['√','sqrt(','f'],['xʸ','^','f'],['n!','!','f'],
['7','7','n'],['8','8','n'],['9','9','n'],['÷','/','o'],['x²','^2','f'],['1/x','1/(','f'],
['4','4','n'],['5','5','n'],['6','6','n'],['×','*','o'],['sinh','sinh(','f'],['ans','ans','f'],
['1','1','n'],['2','2','n'],['3','3','n'],['−','-','o'],['cosh','cosh(','f'],['tanh','tanh(','f'],
['0','0','n'],['.','.','n'],[',',',','n'],['+','+','o'],['=','=','eq']];
const pad=$('pad'),inp=$('in');
for(const[l,v,c]of keys){const b=document.createElement('button');b.textContent=l;b.className=c;b.onclick=()=>{
if(v=='=')return run();if(v=='AC'){inp.value='';return inp.focus()}
const a=inp.selectionStart??inp.value.length,z=inp.selectionEnd??a;
if(v=='BS'){const s=a==z?Math.max(0,a-1):a;inp.value=inp.value.slice(0,s)+inp.value.slice(z);inp.setSelectionRange(s,s)}
else{inp.value=inp.value.slice(0,a)+v+inp.value.slice(z);inp.setSelectionRange(a+v.length,a+v.length)}inp.focus()};pad.appendChild(b)}
inp.addEventListener('keydown',e=>{if(e.key=='Enter')run()});
$('dg').onclick=e=>{deg=!deg;e.target.textContent=deg?'DEG':'RAD'};
$('cp').onclick=async()=>{try{await navigator.clipboard.writeText(raw);$('st').textContent='복사했습니다'}catch(_){const r=document.createRange();r.selectNodeContents($('out'));const s=getSelection();s.removeAllRanges();s.addRange(r);$('st').textContent='선택됨 — Ctrl+C로 복사하세요'}};
</script></body></html>
