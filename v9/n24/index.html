<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>다른 색 찾기</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0b0b0b;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        .game {
            width: 96vw;
            max-width: 1300px;
            margin: auto;
            text-align: center;
            padding: 20px 0;
        }

        h1 {
            font-size: 40px;
            margin: 5px;
        }

        .description {
            color: #888;
            margin-bottom: 15px;
        }

        /* 난이도 */

        .difficulty {
            margin: 10px;
        }

        .difficulty button {
            background: #222;
            color: white;

            border: 1px solid #555;
            border-radius: 8px;

            padding: 10px 25px;
            margin: 4px;

            font-size: 17px;
            cursor: pointer;
        }

        .difficulty button:hover {
            background: #444;
        }

        .difficulty button.active {
            background: white;
            color: black;
        }

        /* 점수 */

        .info {
            display: flex;
            justify-content: center;
            gap: 50px;

            font-size: 20px;
            margin: 15px;
        }

        /* 색상 영역 */

        #colors {
            width: 100%;

            display: grid;

            gap: 10px;

            margin: 15px auto;
        }

        /* 색 버튼 */

        .color {
            width: 100%;
            height: 150px;

            border: none;
            border-radius: 15px;

            cursor: pointer;

            transition: transform 0.08s,
                        outline 0.15s,
                        box-shadow 0.15s;
        }

        .color:hover {
            transform: scale(0.97);
        }

        .color:disabled {
            cursor: default;
        }

        /* 결과 */

        #result {
            height: 30px;

            font-size: 21px;
            font-weight: bold;

            margin: 10px;
        }

        /* 다음 문제 */

        #next {
            background: #222;
            color: white;

            border: 1px solid #555;
            border-radius: 8px;

            padding: 10px 30px;

            font-size: 16px;

            cursor: pointer;
        }

        #next:hover {
            background: #444;
        }

    </style>
</head>


<body>

<div class="game">

    <h1>🎨 다른 색 찾기</h1>

    <div class="description">
        여러 색 중에서 딱 하나 다른 색을 찾아보세요!
    </div>


    <!-- 난이도 -->

    <div class="difficulty">

        <button id="easy"
                onclick="setDifficulty('easy')">
            하
        </button>

        <button id="normal"
                onclick="setDifficulty('normal')">
            중
        </button>

        <button id="hard"
                onclick="setDifficulty('hard')">
            상
        </button>

    </div>


    <!-- 점수 -->

    <div class="info">

        <div>
            점수 :
            <span id="score">0</span>
        </div>

        <div>
            문제 :
            <span id="round">1</span>
        </div>

    </div>


    <!-- 색깔 -->

    <div id="colors"></div>


    <!-- 결과 -->

    <div id="result"></div>


    <!-- 다음 문제 -->

    <button id="next"
            onclick="newQuestion()">
        다음 문제
    </button>

</div>


<script>

    /* =========================
       기본 변수
    ========================= */

    let score = 0;
    let round = 1;

    let difficulty = "easy";


    /* =========================
       난이도 설정
    ========================= */

    const settings = {

        easy: {

            // 색 개수
            count: 9,

            // 색 차이
            difference: 15,

            // 한 줄에 몇 개
            columns: 3

        },


        normal: {

            count: 16,

            difference: 7,

            columns: 4

        },


        hard: {

            count: 25,

            difference: 2,

            columns: 5

        }

    };


    /* =========================
       난이도 변경
    ========================= */

    function setDifficulty(level) {

        difficulty = level;

        score = 0;
        round = 1;


        document.getElementById("score")
            .textContent = score;

        document.getElementById("round")
            .textContent = round;


        /*
            선택된 난이도 표시
        */

        document
            .querySelectorAll(".difficulty button")
            .forEach(button => {

                button.classList.remove("active");

            });


        document
            .getElementById(level)
            .classList.add("active");


        newQuestion();

    }


    /* =========================
       새 문제
    ========================= */

    function newQuestion() {

        const box =
            document.getElementById("colors");

        const result =
            document.getElementById("result");


        const setting =
            settings[difficulty];


        /*
            기존 색 제거
        */

        box.innerHTML = "";

        result.textContent = "";


        /*
            그리드 설정
        */

        box.style.gridTemplateColumns =
            `repeat(${setting.columns}, 1fr)`;


        /*
            상 난이도는
            점수가 높아질수록 더 어려워짐
        */

        let difference =
            setting.difference;


        if (difficulty === "hard") {

            difference = Math.max(
                1,
                setting.difference -
                Math.floor(score / 5)
            );

        }


        /*
            기본 RGB 색상
        */

        const r =
            Math.floor(Math.random() * 180) + 30;

        const g =
            Math.floor(Math.random() * 180) + 30;

        const b =
            Math.floor(Math.random() * 180) + 30;


        /*
            RGB 중 어떤 값을 바꿀지 결정

            0 = R
            1 = G
            2 = B
        */

        const colorType =
            Math.floor(Math.random() * 3);


        /*
            정답 위치
        */

        const answer =
            Math.floor(
                Math.random() * setting.count
            );


        /*
            색 버튼 생성
        */

        for (
            let i = 0;
            i < setting.count;
            i++
        ) {

            const button =
                document.createElement("button");


            button.className = "color";


            /*
                기본 색상
            */

            let cr = r;
            let cg = g;
            let cb = b;


            /*
                정답 색상만 다르게
            */

            if (i === answer) {

                if (colorType === 0) {

                    cr += difference;

                }

                else if (colorType === 1) {

                    cg += difference;

                }

                else {

                    cb += difference;

                }

            }


            /*
                RGB 범위 제한
            */

            cr = Math.min(255, cr);
            cg = Math.min(255, cg);
            cb = Math.min(255, cb);


            /*
                색 적용
            */

            button.style.backgroundColor =
                `rgb(${cr}, ${cg}, ${cb})`;


            /*
                버튼 클릭
            */

            button.onclick = function () {

                /*
                    모든 버튼 비활성화
                */

                document
                    .querySelectorAll(".color")
                    .forEach(b => {

                        b.disabled = true;

                    });


                /*
                    정답
                */

                if (i === answer) {

                    score++;


                    document
                        .getElementById("score")
                        .textContent = score;


                    result.textContent =
                        "🎉 정답!";


                    result.style.color =
                        "#00ff88";


                    /*
                        정답 버튼 초록색
                    */

                    button.style.outline =
                        "6px solid #00ff88";


                    button.style.boxShadow =
                        "0 0 30px #00ff88";

                }


                /*
                    오답
                */

                else {

                    result.textContent =
                        "❌ 틀렸습니다! 정답은 초록색입니다.";


                    result.style.color =
                        "#ff4444";


                    /*
                        내가 누른 버튼 = 빨간색
                    */

                    button.style.outline =
                        "6px solid #ff3333";


                    button.style.boxShadow =
                        "0 0 25px #ff3333";


                    /*
                        정답 버튼 찾기
                    */

                    const allButtons =
                        document.querySelectorAll(".color");


                    const correctButton =
                        allButtons[answer];


                    /*
                        정답 = 초록색
                    */

                    correctButton.style.outline =
                        "6px solid #00ff88";


                    correctButton.style.boxShadow =
                        "0 0 30px #00ff88";

                }

            };


            /*
                화면에 버튼 추가
            */

            box.appendChild(button);

        }


        /*
            문제 번호 표시
        */

        document
            .getElementById("round")
            .textContent = round;


        round++;

    }


    /* =========================
       게임 시작
    ========================= */

    setDifficulty("easy");

</script>

</body>
</html>
