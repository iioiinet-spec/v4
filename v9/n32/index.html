<!DOCTYPE html>
<html lang="ko">
<head>
    <!-- 문서의 문자 인코딩을 UTF-8로 설정합니다 -->
    <meta charset="UTF-8">
    <!-- 모바일 기기에서 화면이 알맞게 보이도록 뷰포트를 설정합니다 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 웹페이지의 제목을 설정합니다 -->
    <title>민지혁의 주간 시간표</title>
    <!-- 구글 폰트 고운돋움(Gowun Dodum)을 불러옵니다 -->
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
    <style>
        /* :root CSS 변수로 색상과 디자인을 한곳에서 관리합니다 */
        :root {
            /* 전체 웹페이지 배경 색상 */
            --배경색: #12161f;
            /* 시간표 칸 및 카드 상자 배경 색상 */
            --칸배경: #1b2130;
            /* 기본 텍스트 및 제목 글자 색상 */
            --글자색: #e8ecf7;
            /* 강조 및 버튼 포인트 색상 */
            --포인트색: #7be0c8;
            /* 카드 및 박스 모서리 둥글기 */
            --카드모서리: 14px;
            
            /* 과목별 지정 색상 설정 */
            --색-국어: #ff5c5c;      /* 국어: 빨간색 */
            --색-수학: #4c8bf5;      /* 수학: 파란색 */
            --색-영어: #ffd43b;      /* 영어: 노란색 */
            --색-사회: #51cf66;      /* 사회: 초록색 */
            --색-과학: #cc5de8;      /* 과학: 보라색 */
            --색-체육: #ff922b;      /* 체육: 주황색 */
            --색-음악: #ffffff;      /* 음악: 흰색 */
            --색-미술: #212529;      /* 미술: 검은색 */
            --색-실과: #8b5cf6;      /* 실과: 갈색 계열 포인트 */
            --색-도덕: #a9dfbf;      /* 도덕: 연두색 */
            --색-기본: #242c3d;      /* 빈 칸 기본 색상 */
        }

        /* 웹페이지 전체 기본 스타일을 지정합니다 */
        body {
            background-color: var(--배경색);
            color: var(--글자색);
            font-family: 'Gowun Dodum', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* 전체 콘텐츠를 담는 중앙 컨테이너 박스입니다 */
        .container {
            width: 100%;
            max-width: 900px;
        }

        /* 상단 환영 문구 및 D-Day 카드가 들어가는 상자입니다 */
        .header-card {
            background-color: var(--칸배경);
            border-radius: var(--카드모서리);
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* 상단 메인 제목 스타일입니다 */
        h1 {
            color: var(--포인트색);
            margin: 0 0 10px 0;
            font-size: 1.8rem;
        }

        /* D-Day 남은 날짜 표시 텍스트 스타일입니다 */
        .d-day-display {
            font-size: 1.1rem;
            margin-top: 8px;
            color: var(--포인트색);
            font-weight: bold;
        }

        /* 코인과 버튼들이 위치하는 상단 바 영역입니다 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--칸배경);
            padding: 15px 20px;
            border-radius: var(--카드모서리);
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            flex-wrap: wrap;
            gap: 10px;
        }

        /* 모은 코인 개수를 보여주는 상자입니다 */
        .coin-box {
            font-size: 1.1rem;
            font-weight: bold;
        }

        /* 버튼들을 묶어주는 그룹입니다 */
        .btn-group {
            display: flex;
            gap: 8px;
        }

        /* 공통 버튼 디자인 스타일입니다 */
        button {
            background-color: var(--포인트색);
            color: #12161f;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-family: 'Gowun Dodum', sans-serif;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        /* 마우스를 올렸을 때 버튼 확대 효과입니다 */
        button:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }

        /* 모바일 기기에서도 표가 잘 보이게 감싸는 영역입니다 */
        .table-responsive {
            overflow-x: auto;
            background-color: var(--칸배경);
            border-radius: var(--카드모서리);
            padding: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* 시간표 테이블 전체 기본 틀입니다 */
        table {
            width: 100%;
            border-collapse: collapse;
            border-radius: 8px;
            overflow: hidden;
        }

        /* 표의 셀(제목과 내용 칸) 기본 디자인입니다 */
        th, td {
            border: 1px solid #2d3748;
            padding: 12px 8px;
            text-align: center;
            font-size: 1rem;
        }

        /* 표의 상단 요일/교시 헤더 디자인입니다 */
        th {
            background-color: #242c3d;
            color: var(--포인트색);
            font-size: 1.1rem;
        }

        /* 오늘 요일 헤더를 시각적으로 강조합니다 */
        th.today-header {
            background-color: #2b3d59;
            border: 2px solid var(--포인트색);
        }

        /* 시간표 안의 개별 칸(클릭 가능) 스타일입니다 */
        .time-slot {
            cursor: pointer;
            transition: opacity 0.2s;
            height: 60px;
            vertical-align: middle;
        }

        /* 마우스를 올렸을 때 칸의 투명도를 조절합니다 */
        .time-slot:hover {
            opacity: 0.8;
        }

        /* 오늘 요일의 시간표 열에 강조 테두리를 줍니다 */
        td.today-column {
            box-shadow: inset 0 0 0 2px var(--포인트색);
        }

        /* 과목별 지정 색상 클래스 정의 */
        .subject-국어 { background-color: var(--색-국어); color: #12161f; font-weight: bold; }
        .subject-수학 { background-color: var(--색-수학); color: #ffffff; font-weight: bold; }
        .subject-영어 { background-color: var(--색-영어); color: #12161f; font-weight: bold; }
        .subject-사회 { background-color: var(--색-사회); color: #12161f; font-weight: bold; }
        .subject-과학 { background-color: var(--색-과학); color: #ffffff; font-weight: bold; }
        .subject-체육 { background-color: var(--색-체육); color: #12161f; font-weight: bold; }
        .subject-음악 { background-color: var(--색-음악); color: #12161f; font-weight: bold; }
        .subject-미술 { background-color: var(--색-미술); color: #ffffff; font-weight: bold; }
        .subject-실과 { background-color: var(--색-실과); color: #ffffff; font-weight: bold; }
        .subject-도덕 { background-color: var(--색-도덕); color: #12161f; font-weight: bold; }
        .subject-빈칸 { background-color: var(--색-기본); color: #718096; }
        .subject-휴강 { background-color: #151922; color: #4a5568; cursor: default; }

        /* 하단 초보자용 안내 설명 박스 스타일입니다 */
        .guide-box {
            background-color: var(--칸배경);
            border-radius: var(--카드모서리);
            padding: 15px 20px;
            margin-top: 20px;
            font-size: 0.9rem;
            line-height: 1.5;
            color: #a0aec0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <!-- 화면 전체를 감싸는 컨테이너 시작 -->
    <div class="container">
        <!-- 상단 환영 문구 및 D-Day 카드 시작 -->
        <div class="header-card">
            <h1>민지혁의 주간 시간표</h1>
            <div id="welcome-msg">오늘도 즐거운 학교생활 화이팅! 🎉</div>
            <div id="d-day-counter" class="d-day-display">목표 D-Day 계산 중...</div>
        </div>
        <!-- 상단 카드 끝 -->

        <!-- 코인 및 버튼 조작 바 시작 -->
        <div class="top-bar">
            <div class="coin-box">💰 모은 코인: <span id="coin-count">0</span> 코인</div>
            <div class="btn-group">
                <button onclick="completeTask()">할 일 완료 (+1000코인)</button>
                <button onclick="resetTimetable()">초기화</button>
            </div>
        </div>
        <!-- 조작 바 끝 -->

        <!-- 주간 시간표 테이블 영역 시작 -->
        <div class="table-responsive">
            <table>
                <thead>
                    <tr id="table-header-row">
                        <th>교시</th>
                        <th id="th-월">월요일</th>
                        <th id="th-화">화요일</th>
                        <th id="th-수">수요일</th>
                        <th id="th-목">목요일</th>
                        <th id="th-금">금요일</th>
                    </tr>
                </thead>
                <tbody id="timetable-body">
                    <!-- 자바스크립트에 의해 동적으로 표 내용이 채워집니다 -->
                </tbody>
            </table>
        </div>
        <!-- 테이블 영역 끝 -->

        <!-- 하단 초보자용 설명 영역 -->
        <div class="guide-box">
            💡 <strong>안내:</strong> 시간표 칸을 클릭하면 원하는 과목으로 바로 바꿀 수 있어요! 할 일을 마치고 코인을 모아보세요.
        </div>
    </div>
    <!-- 컨테이너 끝 -->

    <script>
        // [여기만 고치세요] D-Day 목표 이름, 목표 날짜, 그리고 기본 시간표 데이터를 여기서 수정할 수 있습니다.
        const CONFIG = {
            ddayName: "여름방학",           // 목표로 하는 이벤트 이름
            ddayTargetDate: "2027-07-20", // 목표 날짜 (YYYY-MM-DD 형식)
            maxCoinsForUpdate: 10000      // 특별 업그레이드에 필요한 목표 코인
        };

        // 과목 이름별로 적용될 색상 클래스 매핑 규칙입니다
        const subjectColorMap = {
            "국어": "subject-국어",
            "수학": "subject-수학",
            "영어": "subject-영어",
            "사회": "subject-사회",
            "과학": "subject-과학",
            "체육": "subject-체육",
            "음악": "subject-음악",
            "미술": "subject-미술",
            "실과": "subject-실과",
            "도덕": "subject-도덕"
        };

        // 기본 주간 시간표 데이터 구조 (월~목 6교시, 수요일 5교시 설정)
        const defaultTimetableData = {
            1: { 월: "국어", 화: "수학", 수: "영어", 목: "과학", 금: "사회" },
            2: { 월: "수학", 화: "국어", 수: "사회", 목: "영어", 금: "과학" },
            3: { 월: "과학", 화: "사회", 수: "국어", 목: "수학", 금: "영어" },
            4: { 월: "영어", 화: "과학", 수: "수학", 목: "국어", 금: "체육" },
            5: { 월: "체육", 화: "음악", 수: "미술", 목: "도덕", 금: "국어" },
            6: { 월: "미술", 화: "실과", 수: "",   목: "음악", 금: "수학" }
        };

        // 브라우저 로컬 스토리지에서 저장된 시간표 데이터를 불러옵니다. 없으면 기본 데이터를 씁니다.
        let timetableData = JSON.parse(localStorage.getItem('min_jihyuk_timetable_v3')) || defaultTimetableData;
        
        // 브라우저 로컬 스토리지에서 모은 코인 개수를 불러옵니다. 없으면 0으로 시작합니다.
        let userCoins = parseInt(localStorage.getItem('min_jihyuk_coins_v3')) || 0;

        // D-Day 남은 일수를 계산해서 화면에 보여주는 함수입니다
        function updateDDayCounter() {
            const today = new Date();
            const targetDate = new Date(CONFIG.ddayTargetDate);
            const timeDifference = targetDate - today;
            const remainingDays = Math.ceil(timeDifference / (1000 * 60 * 60 * 24));
            
            const ddayElement = document.getElementById('d-day-counter');
            if (remainingDays > 0) {
                ddayElement.innerText = `🎯 ${CONFIG.ddayName}까지 D-${remainingDays}일 남았습니다!`;
            } else if (remainingDays === 0) {
                ddayElement.innerText = `🎉 드디어 오늘이 ${CONFIG.ddayName}입니다!`;
            } else {
                ddayElement.innerText = `✨ ${CONFIG.ddayName} 목표 날짜가 지났습니다!`;
            }
        }

        // 주간 시간표 표를 화면에 그리고 클릭 이벤트를 설정하는 함수입니다
        function renderTimetable() {
            const tableBody = document.getElementById('timetable-body');
            tableBody.innerHTML = '';

            // 오늘 요일을 숫자로 확인합니다 (0:일, 1:월, 2:화, 3:수, 4:목, 5:금, 6:토)
            const now = new Date();
            const currentDayNumber = now.getDay();
            const daysKeyMap = { 1: '월', 2: '화', 3: '수', 4: '목', 5: '금' };
            const todayKeyString = daysKeyMap[currentDayNumber] || '';

            // 오늘 요일의 테이블 헤더를 강조합니다
            ['월', '화', '수', '목', '금'].forEach(dayName => {
                const headerElement = document.getElementById(`th-${dayName}`);
                if (headerElement) {
                    if (dayName === todayKeyString) {
                        headerElement.className = 'today-header';
                    } else {
                        headerElement.className = '';
                    }
                }
            });

            // 1교시부터 6교시까지 반복해서 행을 만듭니다
            for (let periodIndex = 1; periodIndex <= 6; periodIndex++) {
                const rowElement = document.createElement('tr');
                
                // 교시 번호 칸을 만듭니다
                const periodHeaderCell = document.createElement('th');
                periodHeaderCell.innerText = `${periodIndex}교시`;
                rowElement.appendChild(periodHeaderCell);

                const weekdays = ['월', '화', '수', '목', '금'];
                
                weekdays.forEach(dayName => {
                    const cellElement = document.createElement('td');
                    cellElement.className = 'time-slot';

                    // 오늘 요일인 칸에 시각적 효과를 줍니다
                    if (dayName === todayKeyString) {
                        cellElement.classList.add('today-column');
                    }

                    // 수요일 6교시는 수업이 없으므로 휴강 처리합니다
                    if (dayName === '수' && periodIndex === 6) {
                        cellElement.innerText = '-';
                        cellElement.className += ' subject-휴강';
                        rowElement.appendChild(cellElement);
                        return;
                    }

                    // 해당 칸의 과목 이름을 가져옵니다
                    const subjectName = (timetableData[periodIndex] && timetableData[periodIndex][dayName]) ? timetableData[periodIndex][dayName] : '';
                    cellElement.innerText = subjectName || '(입력하기)';

                    // 과목에 맞는 색상 클래스를 적용하거나 빈 칸 클래스를 적용합니다
                    if (subjectName && subjectColorMap[subjectName]) {
                        cellElement.classList.add(subjectColorMap[subjectName]);
                    } else {
                        cellElement.classList.add('subject-빈칸');
                    }

                    // 칸을 클릭했을 때 과목을 수정할 수 있는 프롬프트 창을 띄웁니다
                    cellElement.onclick = () => {
                        const newSubjectInput = prompt(`${dayName}요일 ${periodIndex}교시 과목을 입력하세요\n(예: 국어, 수학, 영어, 사회, 과학, 체육, 음악, 미술, 실과, 도덕):`, subjectName);
                        if (newSubjectInput !== null) {
                            const trimmedSubject = newSubjectInput.trim();
                            if (!timetableData[periodIndex]) timetableData[periodIndex] = {};
                            timetableData[periodIndex][dayName] = trimmedSubject;

                            // 변경된 시간표를 브라우저 저장소에 저장하고 화면을 다시 그립니다
                            localStorage.setItem('min_jihyuk_timetable_v3', JSON.stringify(timetableData));
                            renderTimetable();
                        }
                    };

                    rowElement.appendChild(cellElement);
                });

                tableBody.appendChild(rowElement);
            }

            // 화면의 코인 수량 글자를 업데이트합니다
            document.getElementById('coin-count').innerText = userCoins;
        }

        // 할 일 완료 버튼을 누를 때 실행되는 함수입니다 (+1000코인 지급 및 10000코인 달성 이벤트)
        function completeTask() {
            userCoins += 1000;
            localStorage.setItem('min_jihyuk_coins_v3', userCoins);
            
            if (userCoins >= CONFIG.maxCoinsForUpdate) {
                alert(`🌟 대단해요! ${CONFIG.maxCoinsForUpdate}코인을 달성하여 특별 황금빛 테마로 자연스럽게 업그레이드되었습니다!`);
                document.documentElement.style.setProperty('--포인트색', '#ffca3a');
            } else {
                alert("참 잘했어요! +1000코인을 획득했습니다! 👏");
            }
            
            renderTimetable();
        }

        // 시간표를 초기 상태로 되돌리는 함수입니다
        function resetTimetable() {
            if (confirm("정말 시간표와 코인을 초기화하시겠습니까?")) {
                localStorage.removeItem('min_jihyuk_timetable_v3');
                localStorage.removeItem('min_jihyuk_coins_v3');
                location.reload();
            }
        }

        // 웹페이지가 처음 열릴 때 자동으로 실행되는 메인 함수입니다
        window.onload = function() {
            updateDDayCounter();
            renderTimetable();
        };
    </script>
</body>
</html>
