 <!DOCTYPE html>
<!-- 이 문서는 HTML5 형식으로 작성되었습니다. -->
<html lang="ko">
<!-- 문서의 기본 언어를 한국어로 설정합니다. -->

<head>
  <!-- 한글이 깨지지 않도록 문자 인코딩을 설정합니다. -->
  <meta charset="UTF-8">
  <!-- 휴대폰에서도 화면 너비에 맞게 표시되도록 설정합니다. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 브라우저 탭에 표시할 제목입니다. -->
  <title>즐거운 시간표</title>

  <!-- 페이지의 전체 디자인을 설정합니다. -->
  <style>
    /* 모든 색상과 공통 디자인 값을 이곳에서 관리합니다. */
    :root {
      --background: #000000; /* 전체 배경 색상입니다. */
      --cell: #302c2c; /* 시간표와 카드의 배경 색상입니다. */
      --text: #00ffe1; /* 기본 글자 색상입니다. */
      --point: #00fad0; /* 강조할 때 사용하는 포인트 색상입니다. */
      --radius: 9px; /* 모든 모서리의 둥글기입니다. */
    }

    /* 모든 요소의 크기 계산을 쉽게 만듭니다. */
    * {
      box-sizing: border-box;
    }

    /* 페이지 전체의 기본 디자인을 설정합니다. */
    body {
      margin: 0;
      min-height: 100vh;
      padding: 30px 16px 40px;
      background: var(--background);
      color: var(--text);
      font-family: 'Orbitron', sans-serif;
    }

    /* 페이지 전체 내용을 가운데 정렬합니다. */
    .container {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
    }

    /* D-Day 영역의 디자인을 설정합니다. */
    .dday {
      margin-bottom: 25px;
      padding: 35px 20px;
      text-align: center;
      background: var(--cell);
      border: 1px solid var(--point);
      border-radius: var(--radius);
      box-shadow: 0 0 20px rgba(0, 250, 208, 0.15);
    }

    /* 목표 이름의 글자 크기를 설정합니다. */
    .target-label {
      margin: 0 0 15px;
      color: var(--text);
      font-size: clamp(20px, 4vw, 32px);
    }

    /* D-Day 숫자를 크게 표시합니다. */
    .dday-number {
      margin: 0;
      color: var(--point);
      font-size: clamp(50px, 12vw, 100px);
      font-weight: 700;
      letter-spacing: 3px;
      text-shadow: 0 0 18px rgba(0, 250, 208, 0.45);
    }

    /* 목표 날짜의 글자 모양을 설정합니다. */
    .target-date {
      margin: 15px 0 0;
      font-size: 14px;
      opacity: 0.8;
    }

    /* 시간표 제목의 디자인을 설정합니다. */
    .schedule-title {
      margin: 0 0 15px;
      color: var(--point);
      font-size: 24px;
    }

    /* 오늘의 상태 문구를 표시하는 영역입니다. */
    #todayStatus {
      min-height: 24px;
      margin: 0 0 10px;
      color: var(--point);
      text-align: center;
      font-weight: 700;
    }

    /* 시간표가 좁은 화면에서 잘리지 않도록 설정합니다. */
    .table-wrap {
      overflow-x: auto;
    }

    /* 시간표 전체의 디자인을 설정합니다. */
    table {
      width: 100%;
      min-width: 650px;
      border-collapse: separate;
      border-spacing: 4px;
    }

    /* 시간표의 모든 칸을 디자인합니다. */
    th,
    td {
      padding: 15px 10px;
      background: var(--cell);
      color: var(--text);
      text-align: center;
      border: 1px solid transparent;
      border-radius: var(--radius);
      transition: 0.2s ease;
    }

    /* 요일 제목을 포인트 색상으로 강조합니다. */
    th {
      color: var(--point);
    }

    /* 시간 표시 칸을 강조합니다. */
    .time-cell {
      color: var(--point);
      font-weight: 700;
    }

    /* 현재 교시 칸에 네온 테두리를 표시합니다. */
    .current-period {
      border: 2px solid var(--point);
      box-shadow: 0 0 15px rgba(0, 250, 208, 0.65);
      color: var(--point);
    }

    /* 작은 화면에서도 보기 좋도록 여백을 줄입니다. */
    @media (max-width: 600px) {
      /* 모바일 화면의 바깥 여백을 줄입니다. */
      body {
        padding: 15px 8px 25px;
      }

      /* 모바일 화면의 D-Day 영역 여백을 줄입니다. */
      .dday {
        padding: 25px 12px;
      }

      /* 모바일 화면의 표 칸 여백을 줄입니다. */
      th,
      td {
        padding: 12px 8px;
      }
    }
  </style>
</head>

<body>
  <!-- 페이지의 모든 내용을 담는 영역입니다. -->
  <main class="container">

    <!-- 화면 위쪽의 D-Day 영역입니다. -->
    <section class="dday">
      <!-- 목표 이름을 표시하는 부분입니다. -->
      <h1 class="target-label" id="targetLabel"></h1>
      <!-- 남은 날짜를 크게 표시하는 부분입니다. -->
      <p class="dday-number" id="ddayNumber"></p>
      <!-- 목표 날짜를 표시하는 부분입니다. -->
      <p class="target-date" id="targetDate"></p>
    </section>

    <!-- 화면 아래쪽의 시간표 영역입니다. -->
    <section>
      <!-- 시간표 제목입니다. -->
      <h2 class="schedule-title">5교시 시간표</h2>
      <!-- 오늘이 주말인지 또는 현재 상태를 표시합니다. -->
      <div id="todayStatus"></div>

      <!-- 화면이 좁으면 시간표를 좌우로 움직일 수 있습니다. -->
      <div class="table-wrap">
        <!-- 월요일부터 금요일까지의 시간표 표입니다. -->
        <table>
          <!-- 표의 머리글 영역입니다. -->
          <thead>
            <!-- 요일 제목을 표시하는 행입니다. -->
            <tr>
              <!-- 첫 번째 열에는 시간이 표시됩니다. -->
              <th>시간</th>
              <!-- 월요일 제목입니다. -->
              <th id="day-0"></th>
              <!-- 화요일 제목입니다. -->
              <th id="day-1"></th>
              <!-- 수요일 제목입니다. -->
              <th id="day-2"></th>
              <!-- 목요일 제목입니다. -->
              <th id="day-3"></th>
              <!-- 금요일 제목입니다. -->
              <th id="day-4"></th>
            </tr>
          </thead>

          <!-- 실제 시간표 내용이 들어가는 영역입니다. -->
          <tbody id="scheduleBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    // ============================================================
    // 여기만 고치세요
    // 시간표 내용과 목표 날짜는 이곳에서만 수정하면 됩니다.
    // ============================================================

    // 페이지의 제목입니다.
    const TITLE = '5학년 2학기 즐거운 시간표(내 기준)';

    // D-Day의 목표 이름과 목표 날짜입니다.
    const TARGET = { label: '겨울방학', date: '2026-12-31' };

    // 시간표에 표시할 요일입니다.
    const DAYS = ['월', '화', '수', '목', '금'];

    // 각 교시의 시간과 월요일부터 금요일까지의 과목입니다.
    const PERIODS = [
      { time: '9:00', subjects: ['국어', '현장체험학습', '개교 기념일', '체육대회', '체육'] },
      { time: '10:30', subjects: ['사회', '', '', '', '체육'] },
      { time: '12:30', subjects: ['음악', '', '', '', '체육'] },
      { time: '1:10', subjects: ['점심시간', '점심(도시락)', '', '', '점심시간'] },
      { time: '2:30', subjects: ['영어', '', '', '점심시간(밥 먹고 하교)', '동아리'] }
    ];

    // 브라우저 탭의 제목을 TITLE 값으로 설정합니다.
    document.title = TITLE;

    // 목표 이름을 화면에 표시합니다.
    document.getElementById('targetLabel').textContent = TARGET.label;

    // 목표 날짜를 화면에 표시합니다.
    document.getElementById('targetDate').textContent = `목표 날짜: ${TARGET.date}`;

    // DAYS 배열의 요일을 표의 머리글에 표시합니다.
    DAYS.forEach((day, index) => {
      // 해당 요일 칸을 찾아 요일 이름을 넣습니다.
      document.getElementById(`day-${index}`).textContent = day;
    });

    // 시간표를 HTML로 만들어 화면에 표시하는 함수입니다.
    function renderSchedule() {
      // 시간표의 본문 영역을 가져옵니다.
      const body = document.getElementById('scheduleBody');

      // 기존에 있던 시간표 내용을 비웁니다.
      body.innerHTML = '';

      // 모든 교시를 하나씩 반복합니다.
      PERIODS.forEach(period => {
        // 새로운 표의 한 줄을 만듭니다.
        const row = document.createElement('tr');

        // 시간 표시용 칸을 만듭니다.
        const timeCell = document.createElement('td');

        // 시간 칸에 전용 CSS 클래스를 적용합니다.
        timeCell.className = 'time-cell';

        // 시간 칸에 교시 시간을 표시합니다.
        timeCell.textContent = period.time;

        // 시간 칸을 현재 행에 추가합니다.
        row.appendChild(timeCell);

        // 월요일부터 금요일까지 과목 칸을 만듭니다.
        period.subjects.forEach(subject => {
          // 새로운 과목 칸을 만듭니다.
          const cell = document.createElement('td');

          // 과목이 비어 있으면 대시를 표시합니다.
          cell.textContent = subject || '—';

          // 과목 칸을 현재 행에 추가합니다.
          row.appendChild(cell);
        });

        // 완성된 한 줄을 시간표에 추가합니다.
        body.appendChild(row);
      });
    }

    // 목표 날짜까지 남은 날짜를 계산하는 함수입니다.
    function updateDday() {
      // 현재 날짜와 시간을 가져옵니다.
      const now = new Date();

      // 목표 날짜를 자바스크립트 날짜로 변환합니다.
      const target = new Date(`${TARGET.date}T00:00:00`);

      // 오늘 날짜에서 시간 정보를 제거합니다.
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

      // 목표 날짜와 오늘 날짜의 차이를 계산합니다.
      const difference = target - today;

      // 하루를 밀리초 단위로 계산합니다.
      const oneDay = 1000 * 60 * 60 * 24;

      // 남은 날짜를 계산합니다.
      const days = Math.ceil(difference / oneDay);

      // D-Day 숫자를 표시할 요소를 가져옵니다.
      const ddayNumber = document.getElementById('ddayNumber');

      // 목표 날짜가 이미 지난 경우입니다.
      if (days < 0) {
        // 지난 날짜를 D+ 형식으로 표시합니다.
        ddayNumber.textContent = `D+${Math.abs(days)}`;
      }

      // 오늘이 목표 날짜인 경우입니다.
      else if (days === 0) {
        // D-DAY라고 표시합니다.
        ddayNumber.textContent = 'D-DAY';
      }

      // 목표 날짜가 아직 남은 경우입니다.
      else {
        // 남은 날짜를 D- 형식으로 표시합니다.
        ddayNumber.textContent = `D-${days}`;
      }
    }

    // 현재 교시를 찾아 강조하는 함수입니다.
    function updateCurrentPeriod() {
      // 현재 날짜와 시간을 가져옵니다.
      const now = new Date();

      // 자바스크립트에서 일요일은 0, 월요일은 1입니다.
      const jsDay = now.getDay();

      // 월요일을 0으로 만드는 계산을 합니다.
      const dayIndex = jsDay - 1;

      // 이전에 강조된 교시의 테두리를 모두 제거합니다.
      document.querySelectorAll('.current-period').forEach(cell => {
        // 현재 교시 CSS 클래스를 제거합니다.
        cell.classList.remove('current-period');
      });

      // 오늘 상태 문구를 표시할 영역을 가져옵니다.
      const status = document.getElementById('todayStatus');

      // 토요일 또는 일요일인지 확인합니다.
      if (dayIndex < 0 || dayIndex > 4) {
        // 주말이면 쉬는 날이라는 문구를 표시합니다.
        status.textContent = '오늘은 쉬는 날';

        // 주말에는 현재 교시를 찾지 않습니다.
        return;
      }

      // 평일에는 주말 문구를 비웁니다.
      status.textContent = '';

      // 현재 시각을 분 단위로 변환합니다.
      const currentMinutes = now.getHours() * 60 + now.getMinutes();

      // 모든 교시를 확인합니다.
      for (let i = 0; i < PERIODS.length; i++) {
        // 교시의 시간을 시와 분으로 나눕니다.
        const [hour, minute] = PERIODS[i].time.split(':').map(Number);

        // 교시 시작 시간을 분 단위로 변환합니다.
        const startMinutes = hour * 60 + minute;

        // 현재 시간이 해당 교시 시작 이후인지 확인합니다.
        if (currentMinutes >= startMinutes) {
          // 현재 교시에 해당하는 표의 행을 가져옵니다.
          const row = document.querySelectorAll('#scheduleBody tr')[i];

          // 해당 행이 실제로 존재하는지 확인합니다.
          if (row) {
            // 첫 번째 칸은 시간이므로 요일 칸은 +1 위치입니다.
            const cell = row.children[dayIndex + 1];

            // 해당 요일의 교시 칸이 존재하는지 확인합니다.
            if (cell) {
              // 현재 교시 칸에 강조 클래스를 추가합니다.
              cell.classList.add('current-period');
            }
          }
        }
      }
    }

    // 페이지가 열릴 때 시간표를 한 번 만듭니다.
    renderSchedule();

    // 페이지가 열릴 때 D-Day를 바로 계산합니다.
    updateDday();

    // 페이지가 열릴 때 현재 교시를 바로 확인합니다.
    updateCurrentPeriod();

    // 1분마다 D-Day를 다시 계산합니다.
    setInterval(updateDday, 60000);

    // 1분마다 현재 교시를 다시 확인합니다.
    setInterval(updateCurrentPeriod, 60000);
  </script>
</body>

</html>
