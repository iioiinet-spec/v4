<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4학년 2학기 시간표</title>
    <!-- Google Fonts: Jua -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-color: #151405;     /* 배경 색상 */
            --cell-color: #623232;   /* 시간표 칸 색상 */
            --text-color: #f3d5d5;   /* 글자 색상 (가독성을 위한 밝은 톤, 요구된 #672323 테마 반영) */
            --point-color: #482828;  /* 포인트 색상 */
            --accent-border: #ffd700;/* 현재 교시 강조 테두리 색상 */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Jua', sans-serif;
            border-radius: 0px !important;
        }

        /* 모서리 둥글기 0px 적용 */
        * {
            border-radius: 0px !important;
        }

        .timetable-cell {
            background-color: var(--cell-color);
            border: 2px solid var(--point-color);
            transition: all 0.3s ease;
        }

        .highlight-current {
            border: 3px solid var(--accent-border) !important;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 md:p-8">

    <header class="w-full max-w-4xl text-center mb-6">
        <div class="text-sm opacity-80 mb-1">"은은한 노을빛이 감도는 방 안, 낡은 다이어리 위에 정갈하게 적힌 시간표"</div>
        <h1 id="app-title" class="text-3xl md:text-5xl font-bold tracking-wider py-2">4학년 2학기 시간표</h1>
        <div id="target-banner" class="inline-block px-4 py-2 mt-2 text-sm md:text-base border border-[var(--point-color)] bg-[var(--cell-color)]">
            목표 (<span id="target-date">2026-12-10</span>까지) - <span id="d-day">D-Day 계산 중...</span>
        </div>
        <div id="status-message" class="mt-3 text-lg font-semibold text-amber-300"></div>
    </header>

    <main class="w-full max-w-4xl overflow-x-auto shadow-2xl">
        <table class="w-full border-collapse">
            <thead>
                <tr id="days-header" class="bg-[var(--point-color)] text-center text-lg md:text-xl">
                    <th class="p-3 border border-[var(--point-color)]">시간 / 요일</th>
                    <!-- 요일 헤더가 동적으로 삽입됩니다 -->
                </tr>
            </thead>
            <tbody id="timetable-body">
                <!-- 시간표 데이터가 동적으로 삽입됩니다 -->
            </tbody>
        </table>
    </main>

    <footer class="w-full max-w-4xl text-center mt-6 text-xs md:text-sm opacity-70">
        <p>© 2026 4학년 2학기 교실. 모든 권리 보유.</p>
    </footer>

    <script>
        const TITLE = '4학년 2학기 시간표';
        const TARGET = { label: '목표', date: '2026-12-10' };
        const DAYS = ['월', '화', '수', '목', '금'];
        const PERIODS = [
            { time: '09:00~09:40', subjects: ['국어', '국어', '수학', '수학', '국어'] },
            { time: '09:50~10:30', subjects: ['체육', '영어', '국어', '사회', '사회'] },
            { time: '10:40~11:20', subjects: ['수학', '수학', '영어', '사회', '체육'] },
            { time: '11:30~12:10', subjects: ['과학', '과학', '체육', '국어', '미술'] },
            { time: '01:00~01:40', subjects: ['과학', '사회', '과학', '도덕', '미술'] }, // 01:00은 오후 1시로 처리
        ];

        function updateDday() {
            const targetDate = new Date(TARGET.date + 'T00:00:00');
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const diffTime = targetDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            const dDayEl = document.getElementById('d-day');
            if (diffDays > 0) {
                dDayEl.textContent = `D-${diffDays}`;
            } else if (diffDays === 0) {
                dDayEl.textContent = `D-Day!`;
            } else {
                dDayEl.textContent = `D+${Math.abs(diffDays)}`;
            }
            document.getElementById('target-date').textContent = TARGET.date;
            document.getElementById('app-title').textContent = TITLE;
        }

        function renderTimetable() {
            // 요일 헤더 렌더링
            const headerRow = document.getElementById('days-header');
            DAYS.forEach(day => {
                const th = document.createElement('th');
                th.className = 'p-3 border border-[var(--point-color)]';
                th.textContent = day;
                headerRow.appendChild(th);
            });

            // 시간표 바디 렌더링
            const tbody = document.getElementById('timetable-body');
            PERIODS.forEach((period, pIndex) => {
                const tr = document.createElement('tr');
                
                // 시간 열
                const timeTd = document.createElement('td');
                timeTd.className = 'p-3 border border-[var(--point-color)] text-center bg-[var(--point-color)] font-bold text-sm md:text-base';
                timeTd.textContent = period.time;
                tr.appendChild(timeTd);

                // 요일별 과목 열
                period.subjects.forEach((subject, dIndex) => {
                    const td = document.createElement('td');
                    td.className = 'timetable-cell p-3 border border-[var(--point-color)] text-center text-base md:text-lg';
                    td.id = `cell-${dIndex}-${pIndex}`;
                    td.textContent = subject;
                    tr.appendChild(td);
                });

                tbody.appendChild(tr);
            });
        }

        function updateCurrentPeriodHighlight() {
            // 이전 강조 제거
            document.querySelectorAll('.timetable-cell').forEach(cell => {
                cell.classList.remove('highlight-current');
            });

            const now = new Date();
            const dayOfWeek = now.getDay(); // 0: 일요일, 1: 월요일, ... 6: 토요일
            const statusMsg = document.getElementById('status-message');

            // 주말 체크 (토요일: 6, 일요일: 0)
            if (dayOfWeek === 0 || dayOfWeek === 6) {
                statusMsg.textContent = "오늘은 쉬는 날";
                return;
            }

            const currentDayIndex = dayOfWeek - 1; // 월(1)->0, 화(2)->1 ... 금(5)->4
            if (currentDayIndex < 0 || currentDayIndex > 4) {
                statusMsg.textContent = "오늘은 쉬는 날";
                return;
            }

            // 현재 시각 분 환산
            const currentHour = now.getHours();
            const currentMinute = now.getMinutes();
            const currentTimeMinutes = currentHour * 60 + currentMinute;

            // 교시 시간 파싱 및 판별 함수
            let matchedPeriodIndex = -1;

            PERIODS.forEach((period, index) => {
                const [startStr, endStr] = period.time.split('~');
                
                const parseTime = (timeStr, isPmCandidate) => {
                    let [h, m] = timeStr.split(':').map(Number);
                    // 01:00 ~ 01:40 인 경우 오후 1시(13시)로 처리
                    if (isPmCandidate && h < 8) {
                        h += 12;
                    }
                    return h * 60 + m;
                };

                const startMinutes = parseTime(startStr, index === 4);
                const endMinutes = parseTime(endStr, index === 4);

                if (currentTimeMinutes >= startMinutes && currentTimeMinutes <= endMinutes) {
                    matchedPeriodIndex = index;
                }
            });

            if (matchedPeriodIndex !== -1) {
                statusMsg.textContent = `현재 진행 중: ${DAYS[currentDayIndex]}요일 ${matchedPeriodIndex + 1}교시 (${PERIODS[matchedPeriodIndex].subjects[currentDayIndex]})`;
                const targetCell = document.getElementById(`cell-${currentDayIndex}-${matchedPeriodIndex}`);
                if (targetCell) {
                    targetCell.classList.add('highlight-current');
                }
            } else {
                statusMsg.textContent = "현재 수업 시간이 아니거나 수업이 끝났습니다.";
            }
        }

        window.onload = function() {
            updateDday();
            renderTimetable();
            updateCurrentPeriodHighlight();

            // 1분마다 자동으로 현재 시간 및 강조 표시 갱신
            setInterval(() => {
                updateCurrentPeriodHighlight();
            }, 60000);
        };
    </script>
</body>
</html>
