<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 구글 폰트를 불러옵니다. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- 페이지 제목입니다. -->
  <title>D-Day 시간표</title>

  <style>
    /* 모든 요소의 크기 계산을 통일합니다. */
    * {
      box-sizing: border-box;
    }

    /* 전체 색상 변수입니다. */
    :root {
      --sky: #50b9ce; /* 하늘 색상입니다. */
      --card: #8ed7dc; /* 카드 색상입니다. */
      --text: #000000; /* 글자 색상입니다. */
      --point: #00ffc8; /* 포인트 색상입니다. */
      --leaf: #4DFF70; /* 나뭇잎 기본 색상입니다. */
      --leaf-dark: #20B94A; /* 나뭇잎 어두운 색상입니다. */
      --glow: rgba(77,255,112,.45); /* 나뭇잎 발광 색상입니다. */
      --trunk: #51352a; /* 나무 줄기 색상입니다. */
    }

    /* 페이지 전체입니다. */
    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      font-family: 'Orbitron', sans-serif;
      color: var(--text);
      background: var(--sky);
    }

    /* 배경 전체입니다. */
    .world {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: -10;
      background: var(--sky);
      transition: background 2s ease;
    }

    /* 하늘의 은은한 빛입니다. */
    .sky-light {
      position: absolute;
      width: 80vmax;
      height: 80vmax;
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,.25), transparent 65%);
    }

    /* 해입니다. */
    .sun {
      position: absolute;
      width: 100px;
      height: 100px;
      left: 52%;
      top: 25%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: #fff5a3;
      box-shadow:
        0 0 30px #fff5a3,
        0 0 90px rgba(255,240,150,.7);
      transition: opacity 2s ease;
    }

    /* 달입니다. */
    .moon {
      position: absolute;
      width: 90px;
      height: 90px;
      left: 52%;
      top: 23%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: #fffde9;
      box-shadow: 0 0 50px rgba(255,255,230,.5);
      opacity: 0;
      transition: opacity 2s ease;
    }

    /* 달의 일부를 가립니다. */
    .moon::after {
      content: "";
      position: absolute;
      width: 90px;
      height: 90px;
      left: 25px;
      top: -10px;
      border-radius: 50%;
      background: var(--sky);
    }

    /* 별입니다. */
    .stars {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 2s ease;
      background-image:
        radial-gradient(circle, white 1px, transparent 2px),
        radial-gradient(circle, white 1px, transparent 2px),
        radial-gradient(circle, white 2px, transparent 3px);
      background-size: 110px 140px, 180px 180px, 250px 220px;
      background-position: 10px 20px, 80px 60px, 140px 30px;
    }

    /* 구름입니다. */
    .cloud {
      position: absolute;
      width: 170px;
      height: 42px;
      border-radius: 50px;
      background: rgba(255,255,255,.72);
      filter: blur(2px);
      animation: cloudMove 50s linear infinite;
    }

    /* 구름의 왼쪽 둥근 부분입니다. */
    .cloud::before {
      content: "";
      position: absolute;
      width: 70px;
      height: 70px;
      left: 25px;
      bottom: 0;
      border-radius: 50%;
      background: inherit;
    }

    /* 구름의 오른쪽 둥근 부분입니다. */
    .cloud::after {
      content: "";
      position: absolute;
      width: 60px;
      height: 60px;
      right: 25px;
      bottom: 0;
      border-radius: 50%;
      background: inherit;
    }

    /* 첫 번째 구름입니다. */
    .cloud.one {
      left: -200px;
      top: 20%;
    }

    /* 두 번째 구름입니다. */
    .cloud.two {
      left: -300px;
      top: 38%;
      transform: scale(.7);
      animation-duration: 65s;
      animation-delay: -20s;
    }

    /* 구름 이동 애니메이션입니다. */
    @keyframes cloudMove {
      from {
        transform: translateX(0);
      }
      to {
        transform: translateX(calc(100vw + 500px));
      }
    }

    /* 왼쪽 나무 줄기입니다. */
    .trunk.left {
      position: absolute;
      left: -100px;
      bottom: -100px;
      width: 190px;
      height: 78vh;
      border-radius: 100px;
      background: linear-gradient(
        90deg,
        #291910,
        var(--trunk),
        #75513b,
        #352017
      );
      transform: rotate(-8deg);
      box-shadow: 20px 0 35px rgba(0,0,0,.3);
    }

    /* 오른쪽 나무 줄기입니다. */
    .trunk.right {
      position: absolute;
      right: -110px;
      bottom: -100px;
      width: 200px;
      height: 82vh;
      border-radius: 100px;
      background: linear-gradient(
        90deg,
        #352017,
        #75513b,
        var(--trunk),
        #291910
      );
      transform: rotate(9deg);
      box-shadow: -20px 0 35px rgba(0,0,0,.3);
    }

    /* 왼쪽 가지입니다. */
    .branch.left {
      position: absolute;
      left: -40px;
      top: 8%;
      width: 450px;
      height: 65px;
      border-radius: 60px;
      background: var(--trunk);
      transform: rotate(-23deg);
    }

    /* 오른쪽 가지입니다. */
    .branch.right {
      position: absolute;
      right: -40px;
      top: 7%;
      width: 470px;
      height: 70px;
      border-radius: 60px;
      background: var(--trunk);
      transform: rotate(23deg);
    }

    /* 나뭇잎을 담는 영역입니다. */
    .leaves {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    /* 모든 나뭇잎의 기본 모양입니다. */
    .leaf {
      position: absolute;
      border-radius: 50%;
      background:
        radial-gradient(
          circle at 35% 25%,
          #e0ffe6 0%,
          #9dffaa 8%,
          #4DFF70 32%,
          #35e85c 65%,
          #20B94A 100%
        );
      box-shadow:
        inset 8px 7px 14px rgba(255,255,255,.25),
        inset -12px -12px 18px rgba(0,80,20,.22),
        0 0 18px var(--glow),
        0 8px 18px rgba(0,60,20,.2);
      filter: saturate(1.15);
      animation: leafMove 5s ease-in-out infinite alternate;
    }

    /* 나뭇잎 가운데에 잎맥을 추가합니다. */
    .leaf::after {
      content: "";
      position: absolute;
      left: 12%;
      top: 50%;
      width: 76%;
      height: 2px;
      border-radius: 50%;
      background: rgba(10,100,35,.35);
      transform: rotate(-8deg);
    }

    /* 기본 나뭇잎 위치입니다. */
    .leaf.a { width:240px; height:160px; left:-50px; top:-40px; }
    .leaf.b { width:280px; height:180px; left:120px; top:-80px; }
    .leaf.c { width:230px; height:160px; left:330px; top:-70px; }
    .leaf.d { width:280px; height:180px; right:150px; top:-80px; }
    .leaf.e { width:250px; height:170px; right:-60px; top:-30px; }
    .leaf.f { width:190px; height:140px; left:-50px; top:150px; }
    .leaf.g { width:210px; height:150px; right:-50px; top:170px; }
    .leaf.h { width:150px; height:110px; left:80px; top:100px; }
    .leaf.i { width:170px; height:120px; right:80px; top:90px; }
    .leaf.j { width:150px; height:105px; left:43%; top:-20px; }
    .leaf.k { width:130px; height:95px; left:5%; top:300px; }
    .leaf.l { width:150px; height:105px; right:5%; top:320px; }

    /* 추가된 나뭇잎입니다. */
    .leaf.m { width:130px; height:90px; left:3%; top:60px; }
    .leaf.n { width:110px; height:80px; left:15%; top:20px; }
    .leaf.o { width:140px; height:95px; left:27%; top:80px; }
    .leaf.p { width:115px; height:85px; left:42%; top:30px; }
    .leaf.q { width:135px; height:90px; right:27%; top:70px; }
    .leaf.r { width:115px; height:80px; right:14%; top:25px; }
    .leaf.s { width:140px; height:95px; right:2%; top:80px; }

    /* 가운데를 빽빽하게 만듭니다. */
    .leaf.t { width:105px; height:75px; left:8%; top:200px; }
    .leaf.u { width:130px; height:90px; left:22%; top:170px; }
    .leaf.v { width:110px; height:80px; left:38%; top:210px; }
    .leaf.w { width:135px; height:95px; right:35%; top:160px; }
    .leaf.x { width:110px; height:80px; right:20%; top:210px; }
    .leaf.y { width:125px; height:85px; right:7%; top:190px; }

    /* 아래쪽 잎입니다. */
    .leaf.z { width:100px; height:70px; left:12%; top:320px; }

    /* 잎마다 살짝 다른 각도를 줍니다. */
    .leaf:nth-child(3n) {
      transform: rotate(7deg);
    }

    /* 잎마다 다른 각도를 줍니다. */
    .leaf:nth-child(3n + 1) {
      transform: rotate(-5deg);
    }

    /* 잎마다 다른 각도를 줍니다. */
    .leaf:nth-child(3n + 2) {
      transform: rotate(3deg);
    }

    /* 잎의 자연스러운 움직임입니다. */
    @keyframes leafMove {
      from {
        margin-top: 0;
      }
      to {
        margin-top: 3px;
      }
    }

    /* 화면 아래쪽 풀입니다. */
    .grass {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 70px;
      background: linear-gradient(
        to top,
        #237a3c,
        rgba(35,122,60,.5)
      );
      clip-path: polygon(
        0 45%, 5% 15%, 10% 45%, 15% 10%, 20% 48%,
        25% 18%, 30% 45%, 35% 12%, 40% 48%, 45% 18%,
        50% 45%, 55% 10%, 60% 48%, 65% 15%, 70% 45%,
        75% 12%, 80% 48%, 85% 15%, 90% 45%, 95% 12%,
        100% 45%, 100% 100%, 0 100%
      );
    }

    /* 실제 콘텐츠 영역입니다. */
    .container {
      position: relative;
      z-index: 5;
      max-width: 1000px;
      margin: auto;
      padding: 50px 20px 100px;
    }

    /* D-Day 카드입니다. */
    .dday {
      padding: 35px 20px;
      margin-bottom: 25px;
      text-align: center;
      border: 2px solid var(--point);
      border-radius: 8px;
      background: rgba(142,215,220,.72);
      backdrop-filter: blur(8px);
      box-shadow:
        0 15px 40px rgba(0,0,0,.2),
        0 0 25px rgba(0,255,200,.25);
    }

    /* D-Day 제목입니다. */
    .dday h1 {
      margin: 0 0 15px;
      font-size: 32px;
    }

    /* D-Day 숫자입니다. */
    #dday {
      font-size: 70px;
      font-weight: 700;
      text-shadow: 3px 3px 0 var(--point);
    }

    /* 날짜입니다. */
    .date {
      margin-top: 12px;
      font-size: 15px;
    }

    /* 시간표 카드입니다. */
    .schedule {
      padding: 20px;
      border: 2px solid var(--point);
      border-radius: 8px;
      background: rgba(142,215,220,.72);
      backdrop-filter: blur(8px);
      box-shadow:
        0 15px 40px rgba(0,0,0,.2),
        0 0 25px rgba(0,255,200,.2);
      overflow-x: auto;
    }

    /* 시간표 제목입니다. */
    .schedule h2 {
      margin: 0 0 15px;
      text-align: center;
      font-size: 24px;
    }

    /* 시간표입니다. */
    table {
      width: 100%;
      min-width: 650px;
      border-collapse: separate;
      border-spacing: 4px;
    }

    /* 표의 모든 칸입니다. */
    th,
    td {
      padding: 14px 10px;
      text-align: center;
      border: 1px solid var(--point);
      border-radius: 8px;
      background: rgba(142,215,220,.88);
    }

    /* 표의 제목 칸입니다. */
    th {
      background: var(--point);
    }

    /* 시간 칸입니다. */
    .time {
      background: var(--point);
      font-weight: 700;
    }

    /* 모바일 화면입니다. */
    @media (max-width: 600px) {

      /* 모바일 여백입니다. */
      .container {
        padding: 25px 10px 90px;
      }

      /* 모바일 제목 크기입니다. */
      .dday h1 {
        font-size: 24px;
      }

      /* 모바일 D-Day 크기입니다. */
      #dday {
        font-size: 50px;
      }

      /* 모바일 왼쪽 나무 위치입니다. */
      .trunk.left {
        left: -150px;
      }

      /* 모바일 오른쪽 나무 위치입니다. */
      .trunk.right {
        right: -150px;
      }

      /* 모바일 왼쪽 가지 위치입니다. */
      .branch.left {
        left: -150px;
      }

      /* 모바일 오른쪽 가지 위치입니다. */
      .branch.right {
        right: -150px;
      }

      /* 모바일에서 나뭇잎 크기를 조금 줄입니다. */
      .leaf {
        transform: scale(.8);
      }
    }
  </style>
</head>

<body>

  <!-- 배경 전체입니다. -->
  <div class="world">

    <!-- 하늘의 빛입니다. -->
    <div class="sky-light"></div>

    <!-- 별입니다. -->
    <div class="stars"></div>

    <!-- 해입니다. -->
    <div class="sun"></div>

    <!-- 달입니다. -->
    <div class="moon"></div>

    <!-- 구름입니다. -->
    <div class="cloud one"></div>

    <!-- 두 번째 구름입니다. -->
    <div class="cloud two"></div>

    <!-- 왼쪽 나무 줄기입니다. -->
    <div class="trunk left"></div>

    <!-- 오른쪽 나무 줄기입니다. -->
    <div class="trunk right"></div>

    <!-- 왼쪽 가지입니다. -->
    <div class="branch left"></div>

    <!-- 오른쪽 가지입니다. -->
    <div class="branch right"></div>

    <!-- 나뭇잎 전체입니다. -->
    <div class="leaves">

      <!-- 기존 나뭇잎 12개입니다. -->
      <div class="leaf a"></div>
      <div class="leaf b"></div>
      <div class="leaf c"></div>
      <div class="leaf d"></div>
      <div class="leaf e"></div>
      <div class="leaf f"></div>
      <div class="leaf g"></div>
      <div class="leaf h"></div>
      <div class="leaf i"></div>
      <div class="leaf j"></div>
      <div class="leaf k"></div>
      <div class="leaf l"></div>

      <!-- 추가 나뭇잎 14개입니다. -->
      <div class="leaf m"></div>
      <div class="leaf n"></div>
      <div class="leaf o"></div>
      <div class="leaf p"></div>
      <div class="leaf q"></div>
      <div class="leaf r"></div>
      <div class="leaf s"></div>
      <div class="leaf t"></div>
      <div class="leaf u"></div>
      <div class="leaf v"></div>
      <div class="leaf w"></div>
      <div class="leaf x"></div>
      <div class="leaf y"></div>
      <div class="leaf z"></div>

    </div>

    <!-- 아래쪽 풀입니다. -->
    <div class="grass"></div>

  </div>

  <!-- 실제 콘텐츠입니다. -->
  <main class="container">

    <!-- D-Day 영역입니다. -->
    <section class="dday">

      <!-- 제목입니다. -->
      <h1 id="title"></h1>

      <!-- D-Day 숫자입니다. -->
      <div id="dday"></div>

      <!-- 목표 날짜입니다. -->
      <div class="date" id="targetDate"></div>

    </section>

    <!-- 시간표 영역입니다. -->
    <section class="schedule">

      <!-- 시간표 제목입니다. -->
      <h2>월~금 시간표</h2>

      <!-- 시간표입니다. -->
      <table>

        <!-- 요일 제목입니다. -->
        <thead>
          <tr>
            <th>시간</th>
            <th>월</th>
            <th>화</th>
            <th>수</th>
            <th>목</th>
            <th>금</th>
          </tr>
        </thead>

        <!-- JavaScript가 내용을 넣습니다. -->
        <tbody id="scheduleBody"></tbody>

      </table>

    </section>

  </main>

  <script>
    /* ===================================================== */
    /* 여기만 고치세요. */
    /* ===================================================== */

    /* 화면에 표시할 이름입니다. */
    const TITLE = '줴줴이야';

    /* 목표 이름과 날짜입니다. */
    const TARGET = {
      label: '2학기 중간',
      date: '2026-10-06'
    };

    /* 시간표의 요일입니다. */
    const DAYS = ['월', '화', '수', '목', '금'];

    /* 시간표 내용입니다. */
    const PERIODS = [
      {
        time: '09:00',
        subjects: ['유튜브', 'unity', '산책', 'uinty', '유튜브']
      },
      {
        time: '10:00',
        subjects: ['유튜브', 'unity', 'unity', '만들기', '유튜브']
      },
      {
        time: '11:00',
        subjects: ['로블록스', '유튜브', 'unity', 'unity', '유튜브']
      },
      {
        time: '13:00',
        subjects: ['unity', '만들기', '산책', '만들기', '유튜브']
      },
      {
        time: '14:00',
        subjects: ['만들기', '유튜브', '로블록스', 'unity', '유튜브']
      }
    ];

    /* ===================================================== */
    /* 여기까지만 고치세요. */
    /* ===================================================== */

    /* 제목 요소를 가져옵니다. */
    const titleElement = document.getElementById('title');

    /* D-Day 요소를 가져옵니다. */
    const ddayElement = document.getElementById('dday');

    /* 목표 날짜 요소를 가져옵니다. */
    const targetDateElement = document.getElementById('targetDate');

    /* 시간표 본문을 가져옵니다. */
    const scheduleBody = document.getElementById('scheduleBody');

    /* 해 요소를 가져옵니다. */
    const sun = document.querySelector('.sun');

    /* 달 요소를 가져옵니다. */
    const moon = document.querySelector('.moon');

    /* 별 요소를 가져옵니다. */
    const stars = document.querySelector('.stars');

    /* 구름을 모두 가져옵니다. */
    const clouds = document.querySelectorAll('.cloud');

    /* 제목을 표시합니다. */
    titleElement.textContent = TITLE;

    /* 목표 이름과 날짜를 표시합니다. */
    targetDateElement.textContent = `${TARGET.label} · ${TARGET.date}`;

    /* D-Day를 계산하는 함수입니다. */
    function updateDday() {

      /* 현재 날짜와 시간을 가져옵니다. */
      const now = new Date();

      /* 목표 날짜를 가져옵니다. */
      const target = new Date(`${TARGET.date}T00:00:00`);

      /* 오늘 날짜만 계산합니다. */
      const today = new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate()
      );

      /* 날짜 차이를 계산합니다. */
      const difference = target - today;

      /* 밀리초를 날짜로 변환합니다. */
      const days = Math.ceil(
        difference / (1000 * 60 * 60 * 24)
      );

      /* 목표 날짜가 남았으면 D-로 표시합니다. */
      if (days > 0) {
        ddayElement.textContent = `D-${days}`;

      /* 목표 날짜가 오늘이면 D-Day입니다. */
      } else if (days === 0) {
        ddayElement.textContent = 'D-Day';

      /* 목표 날짜가 지났으면 D+로 표시합니다. */
      } else {
        ddayElement.textContent = `D+${Math.abs(days)}`;
      }
    }

    /* 실제 시간에 따라 배경을 변경합니다. */
    function updateWorld() {

      /* 현재 시간을 가져옵니다. */
      const now = new Date();

      /* 현재 시간만 가져옵니다. */
      const hour = now.getHours();

      /* 하늘 색상을 저장합니다. */
      let sky;

      /* 해 표시 여부입니다. */
      let showSun = false;

      /* 달 표시 여부입니다. */
      let showMoon = false;

      /* 별 표시 여부입니다. */
      let showStars = false;

      /* 구름 투명도입니다. */
      let cloudOpacity = 1;

      /* 새벽입니다. */
      if (hour >= 5 && hour < 9) {

        /* 새벽 하늘입니다. */
        sky = '#79cbd7';

        /* 해를 표시합니다. */
        showSun = true;

        /* 구름 투명도입니다. */
        cloudOpacity = .7;

      /* 낮입니다. */
      } else if (hour >= 9 && hour < 17) {

        /* 낮 하늘입니다. */
        sky = '#50b9ce';

        /* 해를 표시합니다. */
        showSun = true;

        /* 구름을 밝게 표시합니다. */
        cloudOpacity = .9;

      /* 노을입니다. */
      } else if (hour >= 17 && hour < 20) {

        /* 노을 하늘입니다. */
        sky = '#d87d69';

        /* 해를 표시합니다. */
        showSun = true;

        /* 구름을 어둡게 합니다. */
        cloudOpacity = .45;

      /* 밤입니다. */
      } else {

        /* 밤하늘입니다. */
        sky = '#10284b';

        /* 달을 표시합니다. */
        showMoon = true;

        /* 별을 표시합니다. */
        showStars = true;

        /* 밤에는 구름을 거의 보이지 않게 합니다. */
        cloudOpacity = .15;
      }

      /* 하늘 색상을 변경합니다. */
      document.documentElement.style.setProperty('--sky', sky);

      /* 해를 표시하거나 숨깁니다. */
      sun.style.opacity = showSun ? '1' : '0';

      /* 달을 표시하거나 숨깁니다. */
      moon.style.opacity = showMoon ? '1' : '0';

      /* 별을 표시하거나 숨깁니다. */
      stars.style.opacity = showStars ? '1' : '0';

      /* 모든 구름의 투명도를 변경합니다. */
      clouds.forEach(function(cloud) {
        cloud.style.opacity = cloudOpacity;
      });
    }

    /* 시간표를 만드는 함수입니다. */
    function makeSchedule() {

      /* 기존 내용을 비웁니다. */
      scheduleBody.innerHTML = '';

      /* 모든 교시를 반복합니다. */
      PERIODS.forEach(function(period) {

        /* 새로운 행을 만듭니다. */
        const row = document.createElement('tr');

        /* 시간 칸을 만듭니다. */
        const timeCell = document.createElement('td');

        /* 시간 칸의 클래스를 지정합니다. */
        timeCell.className = 'time';

        /* 시간을 넣습니다. */
        timeCell.textContent = period.time;

        /* 시간 칸을 행에 넣습니다. */
        row.appendChild(timeCell);

        /* 과목들을 반복합니다. */
        period.subjects.forEach(function(subject) {

          /* 과목 칸을 만듭니다. */
          const cell = document.createElement('td');

          /* 과목 이름을 넣습니다. */
          cell.textContent = subject;

          /* 과목 칸을 행에 넣습니다. */
          row.appendChild(cell);
        });

        /* 완성된 행을 시간표에 넣습니다. */
        scheduleBody.appendChild(row);
      });
    }

    /* 처음에 D-Day를 계산합니다. */
    updateDday();

    /* 처음에 배경을 설정합니다. */
    updateWorld();

    /* 처음에 시간표를 만듭니다. */
    makeSchedule();

    /* 1분마다 D-Day를 갱신합니다. */
    setInterval(updateDday, 60000);

    /* 1분마다 실제 시간에 맞춰 배경을 갱신합니다. */
    setInterval(updateWorld, 60000);
  </script>
