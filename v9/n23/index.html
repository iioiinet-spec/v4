<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- 한글이 깨지지 않도록 문자 인코딩을 설정합니다. -->
  <meta charset="UTF-8">
  <!-- 휴대폰에서도 화면이 알맞게 보이도록 설정합니다. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 브라우저 탭에 표시할 제목입니다. -->
  <title>나만의 D-Day 시간표</title>

  <style>
    /* 모든 요소의 크기 계산 방식을 통일합니다. */
    * { box-sizing: border-box; }

    /* 페이지 전체의 기본 스타일을 설정합니다. */
    body {
      /* 페이지 바깥 여백을 없앱니다. */
      margin: 0;
      /* 기본 글꼴을 설정합니다. */
      font-family: Arial, "Noto Sans KR", sans-serif;
      /* 사용자가 선택한 배경색을 적용합니다. */
      background: var(--background-color);
      /* 사용자가 선택한 기본 글자색을 적용합니다. */
      color: var(--text-color);
      /* 색상 변경을 부드럽게 합니다. */
      transition: 0.2s;
    }

    /* 전체 내용을 감싸는 영역입니다. */
    .container {
      /* 내용의 최대 너비를 설정합니다. */
      max-width: 1100px;
      /* 화면 가운데에 배치합니다. */
      margin: 0 auto;
      /* 안쪽 여백을 설정합니다. */
      padding: 20px;
    }

    /* 설정 영역을 배치합니다. */
    .settings {
      /* 설정 상자를 가로로 배치합니다. */
      display: flex;
      /* 설정 상자 사이의 간격을 설정합니다. */
      gap: 15px;
      /* 화면이 좁으면 줄바꿈합니다. */
      flex-wrap: wrap;
      /* 설정 상자를 가운데 정렬합니다. */
      justify-content: center;
      /* 아래쪽 여백을 설정합니다. */
      margin-bottom: 20px;
    }

    /* 각각의 설정 상자입니다. */
    .setting-box {
      /* 설정 상자의 배경을 흰색으로 설정합니다. */
      background: rgba(255, 255, 255, 0.95);
      /* 안쪽 여백을 설정합니다. */
      padding: 15px;
      /* 모서리를 둥글게 만듭니다. */
      border-radius: 15px;
      /* 그림자를 추가합니다. */
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      /* 내용을 가운데 정렬합니다. */
      text-align: center;
    }

    /* 설정 상자의 제목입니다. */
    .setting-title {
      /* 제목 아래에 여백을 만듭니다. */
      margin-bottom: 10px;
      /* 제목을 굵게 표시합니다. */
      font-weight: bold;
    }

    /* D-Day 입력 영역입니다. */
    .dday-settings {
      /* 입력 요소를 가로로 배치합니다. */
      display: flex;
      /* 입력 요소 사이의 간격을 설정합니다. */
      gap: 8px;
      /* 화면이 좁으면 줄바꿈합니다. */
      flex-wrap: wrap;
      /* 가운데 정렬합니다. */
      justify-content: center;
    }

    /* D-Day 입력창입니다. */
    .dday-settings input {
      /* 입력창의 테두리를 설정합니다. */
      border: 1px solid #d1d5db;
      /* 입력창 안쪽 여백을 설정합니다. */
      padding: 10px;
      /* 입력창 모서리를 둥글게 만듭니다. */
      border-radius: 8px;
      /* 글자 크기를 설정합니다. */
      font-size: 14px;
      /* 기본 외곽선을 제거합니다. */
      outline: none;
    }

    /* 목표 이름 입력창의 너비입니다. */
    #goalInput {
      /* 목표 이름 입력창을 160px로 설정합니다. */
      width: 160px;
    }

    /* 목표 날짜 입력창의 너비입니다. */
    #dateInput {
      /* 날짜 입력창을 160px로 설정합니다. */
      width: 160px;
    }

    /* D-Day 적용 버튼입니다. */
    #saveDday {
      /* 기본 테두리를 제거합니다. */
      border: none;
      /* 버튼 배경색을 설정합니다. */
      background: #2563eb;
      /* 버튼 글자를 흰색으로 설정합니다. */
      color: white;
      /* 버튼 안쪽 여백을 설정합니다. */
      padding: 10px 16px;
      /* 버튼 모서리를 둥글게 만듭니다. */
      border-radius: 8px;
      /* 글자를 굵게 표시합니다. */
      font-weight: bold;
      /* 마우스를 올리면 손가락 모양으로 표시합니다. */
      cursor: pointer;
    }

    /* 색상 선택 영역입니다. */
    .color-options {
      /* 색상 선택기를 가로로 배치합니다. */
      display: flex;
      /* 색상 선택기 사이의 간격을 설정합니다. */
      gap: 12px;
      /* 색상 선택기를 가운데 정렬합니다. */
      justify-content: center;
      /* 화면이 좁으면 줄바꿈합니다. */
      flex-wrap: wrap;
      /* 아래쪽 여백을 설정합니다. */
      margin-bottom: 10px;
    }

    /* 각각의 색상 선택기입니다. */
    .color-option {
      /* 내용을 세로로 배치합니다. */
      display: flex;
      /* 세로 방향으로 배치합니다. */
      flex-direction: column;
      /* 내용을 가운데 정렬합니다. */
      align-items: center;
      /* 요소 사이의 간격을 설정합니다. */
      gap: 4px;
      /* 글자 크기를 설정합니다. */
      font-size: 12px;
      /* 글자를 굵게 표시합니다. */
      font-weight: bold;
    }

    /* 색상 선택 버튼입니다. */
    input[type="color"] {
      /* 색상 선택기의 너비를 설정합니다. */
      width: 50px;
      /* 색상 선택기의 높이를 설정합니다. */
      height: 38px;
      /* 기본 테두리를 제거합니다. */
      border: none;
      /* 기본 배경을 투명하게 만듭니다. */
      background: transparent;
      /* 마우스를 올리면 손가락 모양으로 표시합니다. */
      cursor: pointer;
    }

    /* 색상 초기화 버튼입니다. */
    #resetColors {
      /* 기본 테두리를 제거합니다. */
      border: none;
      /* 버튼 배경색을 설정합니다. */
      background: #374151;
      /* 버튼 글자색을 흰색으로 설정합니다. */
      color: white;
      /* 버튼 안쪽 여백을 설정합니다. */
      padding: 9px 13px;
      /* 버튼 모서리를 둥글게 만듭니다. */
      border-radius: 8px;
      /* 마우스를 올리면 손가락 모양으로 표시합니다. */
      cursor: pointer;
    }

    /* D-Day 표시 영역입니다. */
    .dday {
      /* D-Day 배경색을 적용합니다. */
      background: var(--dday-color);
      /* D-Day 글자를 흰색으로 표시합니다. */
      color: white;
      /* 내용을 가운데 정렬합니다. */
      text-align: center;
      /* 모서리를 둥글게 만듭니다. */
      border-radius: 20px;
      /* 안쪽 여백을 설정합니다. */
      padding: 30px 20px;
      /* 아래쪽 여백을 설정합니다. */
      margin-bottom: 30px;
      /* 그림자를 추가합니다. */
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
    }

    /* D-Day 목표 이름입니다. */
    #goalName {
      /* 기본 바깥 여백을 제거합니다. */
      margin: 0 0 15px;
      /* 목표 이름을 크게 표시합니다. */
      font-size: 36px;
    }

    /* D-Day 숫자입니다. */
    #days {
      /* D-Day 숫자를 크게 표시합니다. */
      font-size: 75px;
      /* 숫자를 굵게 표시합니다. */
      font-weight: 900;
      /* 줄 높이를 설정합니다. */
      line-height: 1;
    }

    /* 목표 날짜입니다. */
    #targetDateText {
      /* 위쪽 여백을 설정합니다. */
      margin-top: 15px;
      /* 글자 크기를 설정합니다. */
      font-size: 16px;
    }

    /* 시간표 제목입니다. */
    .schedule-title {
      /* 제목을 가운데 정렬합니다. */
      text-align: center;
      /* 글자 크기를 설정합니다. */
      font-size: 28px;
      /* 아래쪽 여백을 설정합니다. */
      margin-bottom: 10px;
    }

    /* 하이라이트 사용법 안내입니다. */
    .highlight-guide {
      /* 글자를 가운데 정렬합니다. */
      text-align: center;
      /* 아래쪽 여백을 설정합니다. */
      margin-bottom: 15px;
      /* 글자 크기를 설정합니다. */
      font-size: 14px;
      /* 글자를 살짝 흐리게 표시합니다. */
      opacity: 0.75;
    }

    /* 시간표를 감싸는 영역입니다. */
    .table-wrap {
      /* 화면이 좁으면 가로 스크롤을 허용합니다. */
      overflow-x: auto;
      /* 모서리를 둥글게 만듭니다. */
      border-radius: 15px;
      /* 그림자를 추가합니다. */
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
    }

    /* 시간표 표입니다. */
    table {
      /* 칸 사이의 테두리를 합칩니다. */
      border-collapse: collapse;
      /* 표를 화면 너비에 맞춥니다. */
      width: 100%;
      /* 작은 화면에서도 일정한 최소 너비를 유지합니다. */
      min-width: 650px;
      /* 열의 너비를 일정하게 합니다. */
      table-layout: fixed;
    }

    /* 시간표의 모든 칸입니다. */
    th,
    td {
      /* 칸 테두리를 설정합니다. */
      border: 1px solid rgba(128, 128, 128, 0.4);
      /* 칸의 높이를 설정합니다. */
      height: 65px;
      /* 내용을 가운데 정렬합니다. */
      text-align: center;
      /* 칸 안쪽 여백을 설정합니다. */
      padding: 5px;
      /* 사용자가 선택한 칸 색상을 적용합니다. */
      background: var(--cell-color);
      /* 사용자가 선택한 글자색을 적용합니다. */
      color: var(--text-color);
      /* 색상 변경을 부드럽게 합니다. */
      transition: background 0.15s, color 0.15s;
    }

    /* 첫 번째 열인 교시 열의 너비입니다. */
    th:first-child,
    td:first-child {
      /* 교시 열을 80px로 설정합니다. */
      width: 80px;
    }

    /* 요일 제목 칸입니다. */
    th {
      /* 요일 글자를 굵게 표시합니다. */
      font-weight: bold;
      /* 요일 칸의 높이를 설정합니다. */
      height: 50px;
    }

    /* 교시 표시입니다. */
    .period {
      /* 교시 글자를 굵게 표시합니다. */
      font-weight: bold;
    }

    /* 시간표 입력창입니다. */
    .schedule-input {
      /* 입력창의 너비를 전체로 설정합니다. */
      width: 100%;
      /* 입력창의 높이를 전체로 설정합니다. */
      height: 100%;
      /* 입력창 테두리를 제거합니다. */
      border: none;
      /* 입력창 배경을 투명하게 만듭니다. */
      background: transparent;
      /* 글자를 가운데 정렬합니다. */
      text-align: center;
      /* 글자 크기를 설정합니다. */
      font-size: 16px;
      /* 기본 글자색을 적용합니다. */
      color: var(--text-color);
      /* 외곽선을 제거합니다. */
      outline: none;
    }

    /* 입력창에 포커스가 들어왔을 때입니다. */
    .schedule-input:focus {
      /* 입력창을 살짝 강조합니다. */
      background: rgba(255, 255, 255, 0.2);
      /* 파란색 테두리를 표시합니다. */
      box-shadow: inset 0 0 0 2px #3b82f6;
      /* 모서리를 둥글게 만듭니다. */
      border-radius: 5px;
    }

    /* 하이라이트된 칸입니다. */
    td.highlight {
      /* 사용자가 선택한 하이라이트 색상을 적용합니다. */
      background: var(--highlight-color);
      /* 하이라이트 색에 맞는 반대 글자색을 적용합니다. */
      color: var(--highlight-text-color);
      /* 하이라이트 테두리를 강조합니다. */
      box-shadow: inset 0 0 0 3px rgba(0, 0, 0, 0.15);
      /* 글자를 굵게 표시합니다. */
      font-weight: bold;
    }

    /* 하이라이트된 칸 안의 입력창입니다. */
    td.highlight .schedule-input {
      /* 반대 글자색을 적용합니다. */
      color: var(--highlight-text-color);
      /* 배경을 투명하게 유지합니다. */
      background: transparent;
    }

    /* 마우스를 올린 시간표 칸을 살짝 표시합니다. */
    td:hover {
      /* 마우스를 올린 칸에 밝은 효과를 줍니다. */
      filter: brightness(0.97);
    }

    /* 하이라이트 안내 문구입니다. */
    .notice {
      /* 글자를 가운데 정렬합니다. */
      text-align: center;
      /* 위쪽 여백을 설정합니다. */
      margin-top: 12px;
      /* 글자 크기를 설정합니다. */
      font-size: 14px;
    }

    /* 휴대폰 화면용 스타일입니다. */
    @media (max-width: 600px) {
      /* D-Day 이름의 글자 크기를 줄입니다. */
      #goalName { font-size: 27px; }
      /* D-Day 숫자의 글자 크기를 줄입니다. */
      #days { font-size: 55px; }
      /* 설정 상자의 너비를 전체로 만듭니다. */
      .setting-box { width: 100%; }
    }
  </style>
</head>

<body>
  <!-- 페이지 전체를 감싸는 영역입니다. -->
  <main class="container">

    <!-- D-Day와 색상 설정 영역입니다. -->
    <section class="settings">

      <!-- D-Day 설정 상자입니다. -->
      <div class="setting-box">
        <!-- D-Day 설정 제목입니다. -->
        <div class="setting-title">📅 D-Day 변경</div>

        <!-- D-Day 입력 영역입니다. -->
        <div class="dday-settings">
          <!-- D-Day 이름을 입력합니다. -->
          <input type="text" id="goalInput" placeholder="예: 크리스마스">
          <!-- D-Day 날짜를 입력합니다. -->
          <input type="date" id="dateInput">
          <!-- 입력한 D-Day를 적용합니다. -->
          <button id="saveDday">D-Day 적용</button>
        </div>
      </div>

      <!-- 색상 설정 상자입니다. -->
      <div class="setting-box">
        <!-- 색상 설정 제목입니다. -->
        <div class="setting-title">🎨 색상 변경</div>

        <!-- 색상 선택 영역입니다. -->
        <div class="color-options">

          <!-- 기본 글자색을 선택합니다. -->
          <label class="color-option">
            글자 색
            <input type="color" id="textColor" value="#1f2937">
          </label>

          <!-- 시간표 칸 색을 선택합니다. -->
          <label class="color-option">
            칸 색
            <input type="color" id="cellColor" value="#ffffff">
          </label>

          <!-- 페이지 배경색을 선택합니다. -->
          <label class="color-option">
            배경 색
            <input type="color" id="backgroundColor" value="#f3f6fb">
          </label>

          <!-- D-Day 색을 선택합니다. -->
          <label class="color-option">
            D-Day 색
            <input type="color" id="ddayColor" value="#d62828">
          </label>

          <!-- 하이라이트 색을 선택합니다. -->
          <label class="color-option">
            하이라이트 색
            <input type="color" id="highlightColor" value="#fff176">
          </label>
        </div>

        <!-- 색상을 기본값으로 되돌립니다. -->
        <button id="resetColors">색상 초기화</button>
      </div>
    </section>

    <!-- D-Day 표시 영역입니다. -->
    <section class="dday">
      <!-- 목표 이름을 표시합니다. -->
      <h1 id="goalName">크리스마스</h1>
      <!-- 남은 날짜를 표시합니다. -->
      <div id="days">D-DAY</div>
      <!-- 목표 날짜를 표시합니다. -->
      <div id="targetDateText"></div>
    </section>

    <!-- 시간표 제목입니다. -->
    <h2 class="schedule-title">📚 주간 시간표</h2>

    <!-- 하이라이트 사용법을 알려줍니다. -->
    <div class="highlight-guide">
      💡 <b>마우스 커서를 원하는 칸 위에 올리고 스페이스바를 누르세요.</b>
      다시 누르면 하이라이트가 꺼집니다.
    </div>

    <!-- 시간표 영역입니다. -->
    <div class="table-wrap">
      <!-- 5열 8교시 시간표입니다. -->
      <table>

        <!-- 시간표 머리글입니다. -->
        <thead>
          <!-- 요일이 들어갈 행입니다. -->
          <tr id="scheduleHead"></tr>
        </thead>

        <!-- 시간표 내용이 들어갈 영역입니다. -->
        <tbody id="scheduleBody"></tbody>
      </table>
    </div>

    <!-- 저장 안내입니다. -->
    <div class="notice">
      시간표, D-Day, 색상, 하이라이트는 자동으로 저장됩니다.
    </div>
  </main>

  <script>
    // ============================================================
    // 여기만 고치세요.
    // ============================================================

    // 기본 D-Day 이름입니다.
    const DEFAULT_GOAL_NAME = "크리스마스";

    // 기본 D-Day 날짜입니다.
    const DEFAULT_TARGET_DATE = "2026-12-25";

    // 기본 시간표 내용입니다.
    const DEFAULT_SCHEDULE = {
      // 월요일의 8교시 내용입니다.
      "월": ["국어", "수학", "영어", "과학", "체육", "", "", ""],
      // 화요일의 8교시 내용입니다.
      "화": ["수학", "영어", "사회", "국어", "음악", "", "", ""],
      // 수요일의 8교시 내용입니다.
      "수": ["영어", "과학", "수학", "미술", "국어", "", "", ""],
      // 목요일의 8교시 내용입니다.
      "목": ["사회", "국어", "체육", "수학", "영어", "", "", ""],
      // 금요일의 8교시 내용입니다.
      "금": ["과학", "수학", "음악", "영어", "자율", "", "", ""]
    };

    // ============================================================
    // D-Day 기능입니다.
    // ============================================================

    // 목표 이름 입력창을 가져옵니다.
    const goalInput = document.getElementById("goalInput");

    // 목표 날짜 입력창을 가져옵니다.
    const dateInput = document.getElementById("dateInput");

    // D-Day 적용 버튼을 가져옵니다.
    const saveDday = document.getElementById("saveDday");

    // 목표 이름 표시 영역을 가져옵니다.
    const goalName = document.getElementById("goalName");

    // 남은 날짜 표시 영역을 가져옵니다.
    const days = document.getElementById("days");

    // 목표 날짜 표시 영역을 가져옵니다.
    const targetDateText = document.getElementById("targetDateText");

    // 저장된 목표 이름을 가져옵니다.
    goalInput.value = localStorage.getItem("goalName") || DEFAULT_GOAL_NAME;

    // 저장된 목표 날짜를 가져옵니다.
    dateInput.value = localStorage.getItem("targetDate") || DEFAULT_TARGET_DATE;

    // D-Day를 계산하고 화면에 표시하는 함수입니다.
    function updateDday() {
      // 입력된 목표 이름을 가져옵니다.
      const name = goalInput.value.trim();

      // 입력된 목표 날짜를 가져옵니다.
      const date = dateInput.value;

      // 목표 이름이 비어 있으면 기본 이름을 사용합니다.
      const finalName = name || "나의 목표";

      // 목표 이름을 화면에 표시합니다.
      goalName.textContent = finalName;

      // 목표 이름을 저장합니다.
      localStorage.setItem("goalName", finalName);

      // 날짜가 없으면 안내 문구를 표시합니다.
      if (!date) {
        // 날짜 입력 안내를 표시합니다.
        days.textContent = "날짜 입력";
        // 날짜 안내 문구를 표시합니다.
        targetDateText.textContent = "목표 날짜를 입력하세요.";
        // 함수를 끝냅니다.
        return;
      }

      // 목표 날짜를 날짜 객체로 만듭니다.
      const target = new Date(date + "T00:00:00");

      // 현재 날짜를 가져옵니다.
      const now = new Date();

      // 오늘 날짜만 남깁니다.
      const today = new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate()
      );

      // 목표 날짜와 오늘 날짜의 차이를 계산합니다.
      const difference = target - today;

      // 날짜 차이를 일수로 변환합니다.
      const remainingDays = Math.ceil(
        difference / (1000 * 60 * 60 * 24)
      );

      // 목표 날짜가 이미 지난 경우입니다.
      if (remainingDays < 0) {
        // D+ 형식으로 표시합니다.
        days.textContent = "D+" + Math.abs(remainingDays);
      // 목표 날짜가 오늘인 경우입니다.
      } else if (remainingDays === 0) {
        // D-DAY로 표시합니다.
        days.textContent = "D-DAY";
      // 목표 날짜가 미래인 경우입니다.
      } else {
        // D-숫자 형식으로 표시합니다.
        days.textContent = "D-" + remainingDays;
      }

      // 목표 날짜를 한국어 형식으로 표시합니다.
      targetDateText.textContent =
        "목표 날짜: " +
        target.toLocaleDateString("ko-KR", {
          // 연도를 표시합니다.
          year: "numeric",
          // 월을 표시합니다.
          month: "long",
          // 일을 표시합니다.
          day: "numeric"
        });

      // 목표 날짜를 저장합니다.
      localStorage.setItem("targetDate", date);
    }

    // D-Day 적용 버튼을 클릭하면 D-Day를 변경합니다.
    saveDday.addEventListener("click", updateDday);

    // 이름 입력창에서 엔터를 누르면 D-Day를 변경합니다.
    goalInput.addEventListener("keydown", function(event) {
      // 엔터 키인지 확인합니다.
      if (event.key === "Enter") {
        // D-Day를 변경합니다.
        updateDday();
      }
    });

    // 날짜 입력창에서 엔터를 누르면 D-Day를 변경합니다.
    dateInput.addEventListener("keydown", function(event) {
      // 엔터 키인지 확인합니다.
      if (event.key === "Enter") {
        // D-Day를 변경합니다.
        updateDday();
      }
    });

    // 페이지가 열리면 D-Day를 표시합니다.
    updateDday();

    // ============================================================
    // 색상 기능입니다.
    // ============================================================

    // 기본 글자색 선택기를 가져옵니다.
    const textColor = document.getElementById("textColor");

    // 칸 색상 선택기를 가져옵니다.
    const cellColor = document.getElementById("cellColor");

    // 배경색 선택기를 가져옵니다.
    const backgroundColor = document.getElementById("backgroundColor");

    // D-Day 색상 선택기를 가져옵니다.
    const ddayColor = document.getElementById("ddayColor");

    // 하이라이트 색상 선택기를 가져옵니다.
    const highlightColor = document.getElementById("highlightColor");

    // 색상 초기화 버튼을 가져옵니다.
    const resetColors = document.getElementById("resetColors");

    // 저장된 글자색을 불러옵니다.
    textColor.value = localStorage.getItem("textColor") || "#1f2937";

    // 저장된 칸 색상을 불러옵니다.
    cellColor.value = localStorage.getItem("cellColor") || "#ffffff";

    // 저장된 배경색을 불러옵니다.
    backgroundColor.value = localStorage.getItem("backgroundColor") || "#f3f6fb";

    // 저장된 D-Day 색상을 불러옵니다.
    ddayColor.value = localStorage.getItem("ddayColor") || "#d62828";

    // 저장된 하이라이트 색상을 불러옵니다.
    highlightColor.value = localStorage.getItem("highlightColor") || "#fff176";

    // 모든 색상을 화면에 적용하는 함수입니다.
    function applyColors() {
      // 기본 글자색을 적용합니다.
      document.documentElement.style.setProperty(
        "--text-color",
        textColor.value
      );

      // 시간표 칸 색상을 적용합니다.
      document.documentElement.style.setProperty(
        "--cell-color",
        cellColor.value
      );

      // 배경색을 적용합니다.
      document.documentElement.style.setProperty(
        "--background-color",
        backgroundColor.value
      );

      // D-Day 색상을 적용합니다.
      document.documentElement.style.setProperty(
        "--dday-color",
        ddayColor.value
      );

      // 하이라이트 색상을 적용합니다.
      document.documentElement.style.setProperty(
        "--highlight-color",
        highlightColor.value
      );

      // 하이라이트 색상의 빨간색 값을 가져옵니다.
      const r = parseInt(highlightColor.value.slice(1, 3), 16);

      // 하이라이트 색상의 초록색 값을 가져옵니다.
      const g = parseInt(highlightColor.value.slice(3, 5), 16);

      // 하이라이트 색상의 파란색 값을 가져옵니다.
      const b = parseInt(highlightColor.value.slice(5, 7), 16);

      // 하이라이트 색상의 밝기를 계산합니다.
      const brightness = (r * 299 + g * 587 + b * 114) / 1000;

      // 밝은 하이라이트에는 검은 글자를 사용합니다.
      const highlightTextColor =
        brightness > 128 ? "#000000" : "#ffffff";

      // 하이라이트 글자색을 적용합니다.
      document.documentElement.style.setProperty(
        "--highlight-text-color",
        highlightTextColor
      );

      // 글자색을 저장합니다.
      localStorage.setItem("textColor", textColor.value);

      // 칸 색상을 저장합니다.
      localStorage.setItem("cellColor", cellColor.value);

      // 배경색을 저장합니다.
      localStorage.setItem("backgroundColor", backgroundColor.value);

      // D-Day 색상을 저장합니다.
      localStorage.setItem("ddayColor", ddayColor.value);

      // 하이라이트 색상을 저장합니다.
      localStorage.setItem("highlightColor", highlightColor.value);
    }

    // 처음 페이지가 열리면 색상을 적용합니다.
    applyColors();

    // 글자색을 바꾸면 즉시 적용합니다.
    textColor.addEventListener("input", applyColors);

    // 칸 색상을 바꾸면 즉시 적용합니다.
    cellColor.addEventListener("input", applyColors);

    // 배경색을 바꾸면 즉시 적용합니다.
    backgroundColor.addEventListener("input", applyColors);

    // D-Day 색상을 바꾸면 즉시 적용합니다.
    ddayColor.addEventListener("input", applyColors);

    // 하이라이트 색상을 바꾸면 즉시 적용합니다.
    highlightColor.addEventListener("input", applyColors);

    // 색상 초기화 버튼을 눌렀을 때 실행합니다.
    resetColors.addEventListener("click", function() {
      // 기본 글자색으로 되돌립니다.
      textColor.value = "#1f2937";

      // 기본 칸 색으로 되돌립니다.
      cellColor.value = "#ffffff";

      // 기본 배경색으로 되돌립니다.
      backgroundColor.value = "#f3f6fb";

      // 기본 D-Day 색으로 되돌립니다.
      ddayColor.value = "#d62828";

      // 기본 하이라이트 색으로 되돌립니다.
      highlightColor.value = "#fff176";

      // 변경된 색상을 적용합니다.
      applyColors();
    });

    // ============================================================
    // 시간표 기능입니다.
    // ============================================================

    // 월요일부터 금요일까지의 요일입니다.
    const weekDays = ["월", "화", "수", "목", "금"];

    // 저장된 시간표를 가져옵니다.
    const savedSchedule = localStorage.getItem("schedule");

    // 저장된 시간표가 있으면 사용하고 없으면 기본 시간표를 사용합니다.
    const schedule = savedSchedule
      ? JSON.parse(savedSchedule)
      : JSON.parse(JSON.stringify(DEFAULT_SCHEDULE));

    // 저장된 하이라이트 목록을 가져옵니다.
    const savedHighlights = localStorage.getItem("highlights");

    // 저장된 하이라이트가 있으면 사용합니다.
    const highlights = savedHighlights
      ? JSON.parse(savedHighlights)
      : [];

    // 현재 마우스가 올라가 있는 칸을 저장합니다.
    let hoveredCell = null;

    // 시간표 머리글 영역을 가져옵니다.
    const scheduleHead = document.getElementById("scheduleHead");

    // 시간표 본문 영역을 가져옵니다.
    const scheduleBody = document.getElementById("scheduleBody");

    // 교시 제목을 첫 번째 칸에 표시합니다.
    scheduleHead.innerHTML = "<th>교시</th>";

    // 월요일부터 금요일까지 반복합니다.
    weekDays.forEach(function(day) {
      // 요일 제목을 추가합니다.
      scheduleHead.innerHTML += "<th>" + day + "</th>";
    });

    // 1교시부터 8교시까지 만듭니다.
    for (let period = 0; period < 8; period++) {

      // 새로운 행을 만듭니다.
      const row = document.createElement("tr");

      // 교시 번호 칸을 만듭니다.
      const periodCell = document.createElement("td");

      // 교시 번호 스타일을 적용합니다.
      periodCell.className = "period";

      // 교시 번호를 표시합니다.
      periodCell.textContent = (period + 1) + "교시";

      // 교시 번호 칸을 행에 추가합니다.
      row.appendChild(periodCell);

      // 월요일부터 금요일까지 반복합니다.
      weekDays.forEach(function(day) {

        // 시간표 칸을 만듭니다.
        const cell = document.createElement("td");

        // 현재 칸을 구분할 고유한 이름을 만듭니다.
        const highlightKey = day + "-" + period;

        // 현재 칸이 저장된 하이라이트 목록에 있는지 확인합니다.
        if (highlights.includes(highlightKey)) {
          // 저장된 하이라이트를 적용합니다.
          cell.classList.add("highlight");
        }

        // 입력창을 만듭니다.
        const input = document.createElement("input");

        // 입력창 종류를 텍스트로 설정합니다.
        input.type = "text";

        // 저장된 시간표 내용을 입력합니다.
        input.value = schedule[day][period] || "";

        // 입력창에 클래스를 적용합니다.
        input.className = "schedule-input";

        // 자동완성을 사용하지 않습니다.
        input.autocomplete = "off";

        // 시간표 내용을 수정할 때 실행합니다.
        input.addEventListener("input", function() {
          // 수정한 내용을 시간표 데이터에 저장합니다.
          schedule[day][period] = input.value;

          // 수정된 시간표를 저장합니다.
          localStorage.setItem(
            "schedule",
            JSON.stringify(schedule)
          );
        });

        // 입력창을 칸에 넣습니다.
        cell.appendChild(input);

        // ========================================================
        // 핵심 기능입니다.
        // 마우스 커서를 올린 칸을 기억합니다.
        // ========================================================

        // 마우스가 칸 안으로 들어오면 실행합니다.
        cell.addEventListener("mouseenter", function() {
          // 현재 마우스가 올라간 칸을 저장합니다.
          hoveredCell = cell;
        });

        // 마우스가 칸 밖으로 나가면 실행합니다.
        cell.addEventListener("mouseleave", function() {
          // 현재 칸이 기억된 칸인지 확인합니다.
          if (hoveredCell === cell) {
            // 기억된 칸을 비웁니다.
            hoveredCell = null;
          }
        });

        // 칸을 클릭했을 때 입력창에 포커스를 줍니다.
        cell.addEventListener("click", function() {
          // 입력창에 포커스를 줍니다.
          input.focus();
        });

        // 칸을 행에 추가합니다.
        row.appendChild(cell);
      });

      // 완성된 행을 시간표에 추가합니다.
      scheduleBody.appendChild(row);
    }

    // 하이라이트를 켜거나 끄는 함수입니다.
    function toggleHighlight(cell, key) {

      // 현재 칸이 하이라이트 상태인지 확인합니다.
      const isHighlighted = cell.classList.contains("highlight");

      // 현재 하이라이트가 켜져 있는 경우입니다.
      if (isHighlighted) {

        // 하이라이트를 제거합니다.
        cell.classList.remove("highlight");

        // 현재 칸의 저장 위치를 찾습니다.
        const index = highlights.indexOf(key);

        // 저장된 목록에 현재 칸이 있다면 제거합니다.
        if (index !== -1) {
          // 하이라이트 목록에서 현재 칸을 제거합니다.
          highlights.splice(index, 1);
        }

      // 현재 하이라이트가 꺼져 있는 경우입니다.
      } else {

        // 하이라이트를 적용합니다.
        cell.classList.add("highlight");

        // 하이라이트 목록에 현재 칸을 추가합니다.
        highlights.push(key);
      }

      // 변경된 하이라이트를 저장합니다.
      localStorage.setItem(
        "highlights",
        JSON.stringify(highlights)
      );
    }

    // ============================================================
    // 스페이스바 하이라이트 기능입니다.
    // ============================================================

    // 키보드 키를 눌렀을 때 실행합니다.
    document.addEventListener("keydown", function(event) {

      // 스페이스바가 아니면 종료합니다.
      if (event.code !== "Space") {
        return;
      }

      // 현재 마우스가 올라간 시간표 칸이 없으면 종료합니다.
      if (!hoveredCell) {
        return;
      }

      // 스페이스바를 눌렀을 때 페이지가 움직이지 않게 합니다.
      event.preventDefault();

      // 현재 마우스 칸에서 요일 위치를 계산합니다.
      const dayIndex =
        Array.from(hoveredCell.parentElement.children)
          .indexOf(hoveredCell) - 1;

      // 현재 마우스 칸에서 교시 위치를 계산합니다.
      const period =
        hoveredCell.parentElement.rowIndex - 1;

      // 계산된 위치에서 요일을 가져옵니다.
      const day = weekDays[dayIndex];

      // 올바른 시간표 칸인지 확인합니다.
      if (
        day &&
        period >= 0 &&
        period < 8
      ) {
        // 현재 칸의 고유한 저장 이름을 만듭니다.
        const key = day + "-" + period;

        // 현재 칸의 하이라이트를 변경합니다.
        toggleHighlight(hoveredCell, key);
      }
    });
  </script>
</body>
</html>
