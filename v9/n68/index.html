<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D-Day 및 수정 가능한 시간표</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 800px;
        }
        /* D-Day 카운터 카드 디자인 */
        .dday-card {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            color: #555;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            position: relative;
        }
        /* 코캐몬 캐릭터 이미지 스타일 */
        .dday-character {
            width: 100px;
            height: auto;
            margin-right: 25px;
            flex-shrink: 0;
            filter: drop-shadow(2px 2px 3px rgba(0,0,0,0.1));
        }
        .dday-content {
            flex-grow: 1;
            text-align: center;
        }
        .dday-card h1 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            font-weight: 700;
            color: #333;
        }
        .dday-number {
            font-size: 2.5rem;
            font-weight: bold;
            color: #d63384;
        }
        
        /* 시간표 테이블 영역 디자인 */
        .timetable-container {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            overflow-x: auto;
        }
        .timetable-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        h2 {
            font-size: 1.4rem;
            color: #2c3e50;
        }
        /* 초기화 버튼 디자인 */
        .reset-btn {
            background-color: #ff6b6b;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
            transition: background 0.2s;
        }
        .reset-btn:hover {
            background-color: #fa5252;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }
        th, td {
            border: 1px solid #e0e0e0;
            padding: 12px 8px;
            font-size: 0.95rem;
        }
        th {
            background-color: #f8f9fa;
            color: #495057;
        }
        td {
            color: #333;
            cursor: pointer; /* 클릭할 수 있음을 나타내는 커서 모양 */
            transition: background-color 0.2s;
        }
        /* 과목 칸에 마우스를 올렸을 때 효과 */
        td:hover {
            background-color: #fff0f3; 
        }
        /* 과목 수정용 입력창 스타일 */
        .edit-input {
            width: 100%;
            padding: 6px;
            font-size: 0.95rem;
            text-align: center;
            border: 2px solid #d63384;
            border-radius: 4px;
            outline: none;
        }
        /* 안내 문구 스타일 */
        .guide-text {
            font-size: 0.8rem;
            color: #888;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- D-Day 카운터 영역 -->
        <div class="dday-card">
            <!-- 코캐몬 캐릭터 이미지 -->
            <img src="https://cdn-icons-png.flaticon.com/512/3075/3075997.png" alt="코캐몬 캐릭터" class="dday-character">
            
            <div class="dday-content">
                <h1 id="goal-title">목표 로딩 중...</h1>
                <div class="dday-number" id="dday-value">D-0</div>
            </div>
        </div>

        <!-- 시간표 영역 -->
        <div class="timetable-container">
            <div class="timetable-header">
                <h2>📅 주간 시간표 (월~금 5교시)</h2>
                <button class="reset-btn" onclick="resetTimetable()">시간표 초기화</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>교시</th>
                        <th>월</th>
                        <th>화</th>
                        <th>수</th>
                        <th>목</th>
                        <th>금</th>
                    </tr>
                </thead>
                <tbody id="timetable-body">
                    <!-- 자바스크립트를 통해 시간표 행이 동적으로 생성됩니다. -->
                </tbody>
            </table>
            <div class="guide-text">💡 수정하고 싶은 과목 칸을 **클릭**하면 바로 이름을 바꿀 수 있습니다! (자동 저장됨)</div>
        </div>
    </div>

    <script>
        /* ========================================================== */
        /* [여기만 고치세요] 아래 상수의 값들을 수정하여 기본 목표를 변경하세요 */
        /* ========================================================== */
        
        // 1. 목표 이름과 목표 날짜 설정 (날짜 형식: 'YYYY-MM-DD')
        const GOAL_NAME = "개발자 데뷔까지"; 
        const TARGET_DATE = "2026-12-31"; 

        // 2. 기본 월요일부터 금요일까지 5교시 시간표 데이터 설정 (초기값)
        const DEFAULT_TIMETABLE = [
            ["HTML 기초", "CSS 마스터", "JS 입문", "Git 활용", "React 기초"], // 1교시
            ["CSS 심화", "JS 활용", "HTML 실습", "API 연동", "Vue 기초"], // 2교시
            ["JS 프로젝트", "React 실습", "알고리즘", "Node.js", "Python"],  // 3교시
            ["알고리즘", "Node.js", "AWS 기초", "포트폴리오", "UI/UX"], // 4교시
            ["포트폴리오", "UI/UX", "실전 프로젝트", "면접 준비", "배포"]   // 5교시
        ];
        
        /* ========================================================== */
        /* 이 아래 코드는 화면 렌더링 및 수정/저장 기능을 담당하는 로직입니다. */
        /* ========================================================== */

        window.addEventListener('DOMContentLoaded', () => {
            renderDDay();      // D-Day 카운터 표시
            loadAndRenderTimetable(); // 저장된 시간표를 불러와 화면에 표시
        });

        // D-Day 계산 및 표시 함수
        function renderDDay() {
            const goalTitleElement = document.getElementById('goal-title');
            const ddayValueElement = document.getElementById('dday-value');

            goalTitleElement.textContent = `🎯 ${GOAL_NAME}`;

            const today = new Date();
            const target = new Date(TARGET_DATE);
            today.setHours(0, 0, 0, 0);
            target.setHours(0, 0, 0, 0);

            const diffTime = target - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays > 0) {
                ddayValueElement.textContent = `D - ${diffDays}`;
            } else if (diffDays === 0) {
                ddayValueElement.textContent = "D-Day (오늘입니다!)";
            } else {
                ddayValueElement.textContent = `D + ${Math.abs(diffDays)} (지났습니다)`;
            }
        }

        // 브라우저 저장소(LocalStorage)에서 시간표 데이터를 불러오는 함수
        function loadAndRenderTimetable() {
            const savedData = localStorage.getItem('my_timetable_data');
            let timetableData;

            if (savedData) {
                // 저장된 데이터가 있으면 불러옵니다.
                timetableData = JSON.parse(savedData);
            } else {
                // 저장된 데이터가 없으면 기본 데이터(DEFAULT_TIMETABLE)를 사용합니다.
                timetableData = DEFAULT_TIMETABLE;
            }

            renderTimetableTable(timetableData);
        }

        // 시간표 테이블을 HTML에 그려주는 함수
        function renderTimetableTable(data) {
            const tbody = document.getElementById('timetable-body');
            tbody.innerHTML = ""; // 기존 내용을 비웁니다.

            for (let period = 0; period < data.length; period++) {
                const tr = document.createElement('tr');
                
                // 교시 번호 칸 생성
                const thPeriod = document.createElement('th');
                thPeriod.textContent = `${period + 1}교시`;
                tr.appendChild(thPeriod);

                // 요일별 과목 칸 생성 (월~금, 총 5일)
                for (let day = 0; day < 5; day++) {
                    const td = document.createElement('td');
                    td.textContent = data[period][day] || "";
                    
                    // 칸을 클릭했을 때 수정 모드로 진입하도록 이벤트 리스너 추가
                    td.addEventListener('click', () => {
                        makeCellEditable(td, period, day, data);
                    });

                    tr.appendChild(td);
                }
                tbody.appendChild(tr);
            }
        }

        // 특정 과목 칸을 클릭했을 때 입력창으로 변환하는 함수
        function makeCellEditable(tdElement, period, day, currentData) {
            // 이미 입력창이 열려있다면 중복 생성 방지
            if (tdElement.querySelector('input')) return;

            const currentText = tdElement.textContent;
            tdElement.textContent = ""; // 기존 텍스트 제거

            // 입력창(input) 생성
            const input = document.createElement('input');
            input.type = 'text';
            input.value = currentText;
            input.className = 'edit-input';

            tdElement.appendChild(input);
            input.focus(); // 입력창에 자동으로 포커스(커서) 맞춤

            // 수정 완료 처리 함수 (엔터를 치거나 다른 곳을 클릭할 때 실행)
            const saveChanges = () => {
                const newText = input.value.trim();
                currentData[period][day] = newText; // 데이터 배열 업데이트

                // 브라우저의 LocalStorage에 변경된 전체 시간표 저장
                localStorage.setItem('my_timetable_data', JSON.stringify(currentData));

                // 테이블 다시 그리기
                renderTimetableTable(currentData);
            };

            // 엔터 키를 누르면 수정 완료
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    saveChanges();
                }
            });

            // 입력창 영역 밖을 클릭(blur)하면 수정 완료
            input.addEventListener('blur', () => {
                saveChanges();
            });
        }

        // 시간표를 기본값으로 초기화하는 함수
        function resetTimetable() {
            if (confirm("시간표를 기본 설정으로 초기화하시겠습니까?")) {
                localStorage.removeItem('my_timetable_data'); // 저장된 데이터 삭제
                loadAndRenderTimetable(); // 기본값으로 다시 로드
            }
        }
    </script>
</body>
</html>
