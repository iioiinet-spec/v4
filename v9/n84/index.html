<!DOCTYPE html>
<!-- HTML 문서의 시작을 알리는 선언입니다 -->
<html lang="ko">
<!-- 한국어 사용 웹페이지로 설정합니다 -->
<head>
    <!-- 문서의 메타데이터와 스타일을 정의하는 머리말입니다 -->
    <meta charset="UTF-8">
    <!-- 문서의 문자 인코딩을 UTF-8로 설정하여 한글이 깨지지 않게 합니다 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 모바일 기기에서도 화면이 알맞게 보이도록 뷰포트를 설정합니다 -->
    <title>점점 어려워지는 큐브 맞추기 퍼즐</title>
    <!-- 브라우저 탭에 표시될 웹페이지의 제목입니다 -->
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
    <!-- 구글 폰트에서 '고운돋움' 글꼴을 불러옵니다 -->
    <style>
        :root {
            --bg-color: #f4f6fb;
            /* 배경 색상 변수: 산뜻한 연보라빛 회색 */
            --card-bg: #ffffff;
            /* 카드 및 상자 배경 색상: 흰색 */
            --text-color: #2c3e50;
            /* 기본 글자 색상: 어두운 남색 */
            --primary-color: #6366f1;
            /* 포인트 메인 색상: 인디고 블루 */
            --primary-hover: #4f46e5;
            /* 버튼 호버 색상 */
            --accent-color: #ec4899;
            /* 강조 색상: 핑크 */
            --border-radius: 16px;
            /* 요소들의 둥글기 크기 */
        }

        body {
            /* 웹페이지 전체의 기본 스타일을 지정합니다 */
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Gowun Dodum', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .game-container {
            /* 게임 전체를 감싸는 메인 카드 상자입니다 */
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            padding: 30px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-sizing: border-box;
        }

        h1 {
            /* 게임 제목 스타일입니다 */
            font-size: 1.6rem;
            margin-top: 0;
            margin-bottom: 10px;
            color: var(--primary-color);
        }

        .stats-bar {
            /* 스테이지 및 이동 횟수를 보여주는 정보 바입니다 */
            display: flex;
            justify-content: space-around;
            background-color: #f8fafc;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 1rem;
            font-weight: bold;
        }

        .stat-item span {
            color: var(--accent-color);
        }

        .board-wrapper {
            /* 퍼즐 보드를 중앙에 정렬하고 감싸는 영역입니다 */
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .puzzle-board {
            /* 슬라이딩 큐브 퍼즐 격자판입니다 (자바스크립트로 동적 그리드 생성) */
            display: grid;
            gap: 8px;
            background-color: #e2e8f0;
            padding: 10px;
            border-radius: 12px;
            box-sizing: border-box;
        }

        .tile {
            /* 개별 퍼즐 타일(조각) 스타일입니다 */
            background-color: var(--primary-color);
            color: white;
            font-size: 1.4rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
            transition: transform 0.15s ease, background-color 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .tile:hover {
            /* 마우스가 올라갔을 때 살짝 위로 뜨는 효과입니다 */
            transform: scale(0.96);
        }

        .tile.empty {
            /* 빈 칸(이동할 수 있는 빈 자리) 스타일입니다 */
            background-color: transparent;
            box-shadow: none;
            cursor: default;
        }

        .btn {
            /* 게임 내 버튼 스타일입니다 */
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px 24px;
            font-size: 1rem;
            font-family: 'Gowun Dodum', sans-serif;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 10px rgba(99, 102, 241, 0.3);
            width: 100%;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .message-box {
            /* 클리어 시 나타나는 축하 메시지 영역입니다 */
            margin-top: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent-color);
            min-height: 25px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>큐브 슬라이딩 퍼즐</h1>
        <!-- 현재 스테이지와 이동 횟수를 표시하는 통계 바 -->
        <div class="stats-bar">
            <div class="stat-item">스테이지: <span id="stageDisplay">1</span> / 5</div>
            <div class="stat-item">이동 횟수: <span id="movesDisplay">0</span></div>
        </div>

        <!-- 퍼즐 조각들이 동적으로 배치될 보드판 -->
        <div class="board-wrapper">
            <div id="puzzleBoard" class="puzzle-board"></div>
        </div>

        <!-- 게임 상태 및 클리어 메시지 -->
        <div id="messageBox" class="message-box">빈 칸 주변의 블록을 눌러 번호를 순서대로 맞추세요!</div>

        <!-- 조작 버튼 -->
        <button id="actionBtn" class="btn" onclick="initGame()">게임 다시 시작</button>
    </div>

    <script>
        // 현재 게임의 스테이지 번호 (1부터 시작하여 점진적으로 상승)
        let currentStage = 1;
        // 플레이어의 이동 횟수
        let moves = 0;
        // 퍼즐의 크기 (스테이지별로 2x2, 3x3, 4x4 등으로 커짐)
        let gridSize = 2;
        // 현재 퍼즐판의 타일 번호 배열 (마지막은 빈 칸 0)
        let tiles = [];
        // 게임 클리어 여부 상태
        let isCleared = false;

        // 스테이지별 난이도 설정 구성 (크기와 무작위 섞기 횟수)
        const stagesConfig = [
            { stage: 1, size: 2, shuffleCount: 5 },   // 스테이지 1: 2x2 크기, 가볍게 섞기
            { stage: 2, size: 3, shuffleCount: 20 },  // 스테이지 2: 3x3 크기, 보통 섞기
            { stage: 3, size: 3, shuffleCount: 45 },  // 스테이지 3: 3x3 크기, 많이 섞기
            { stage: 4, size: 4, shuffleCount: 80 },  // 스테이지 4: 4x4 크기, 복잡하게 섞기
            { stage: 5, size: 4, shuffleCount: 150 }  // 스테이지 5: 4x4 크기, 최고 난이도 극도로 섞기
        ];

        function initGame() {
            // 현재 스테이지에 맞는 설정값을 가져옵니다 (마지막 단계를 넘으면 스테이지 5 유지)
            const config = stagesConfig[Math.min(currentStage - 1, stagesConfig.length - 1)];
            gridSize = config.size;
            moves = 0;
            isCleared = false;

            // 화면에 스테이지와 이동 횟수를 반영합니다
            document.getElementById("stageDisplay").innerText = currentStage;
            document.getElementById("movesDisplay").innerText = moves;
            document.getElementById("messageBox").innerText = "빈 칸 주변의 블록을 눌러 번호를 순서대로 맞추세요!";
            document.getElementById("actionBtn").innerText = "다시 섞기";

            // 정답 상태의 배열을 만듭니다 (예: 2x2인 경우 [1, 2, 3, 0])
            const totalTiles = gridSize * gridSize;
            tiles = [];
            for (let i = 1; i < totalTiles; i++) {
                tiles.push(i);
            }
            tiles.push(0); // 0은 빈 칸을 의미합니다

            // 퍼즐이 실제로 풀 수 있는 상태가 되도록 무작위로 여러 번 슬라이드시켜 섞습니다
            shufflePuzzle(config.shuffleCount);

            // 화면에 퍼즐 보드를 렌더링합니다
            renderBoard();
        }

        function shufflePuzzle(count) {
            // 빈 칸(0)의 위치를 찾습니다
            for (let step = 0; step < count; step++) {
                const emptyIndex = tiles.indexOf(0);
                const emptyRow = Math.floor(emptyIndex / gridSize);
                const emptyCol = emptyIndex % gridSize;

                // 빈 칸과 인접한(이동 가능한) 타일들의 인덱스를 수집합니다
                const validMoves = [];
                const directions = [
                    { r: -1, c: 0 }, // 위
                    { r: 1, c: 0 },  // 아래
                    { r: 0, c: -1 }, // 왼쪽
                    { r: 0, c: 1 }   // 오른쪽
                ];

                directions.forEach(dir => {
                    const newRow = emptyRow + dir.r;
                    const newCol = emptyCol + dir.c;
                    if (newRow >= 0 && newRow < gridSize && newCol >= 0 && newCol < gridSize) {
                        validMoves.push(newRow * gridSize + newCol);
                    }
                });

                // 인접한 타일 중 하나를 무작위로 골라 빈 칸과 자리를 바꿉니다
                const randomTargetIndex = validMoves[Math.floor(Math.random() * validMoves.length)];
                tiles[emptyIndex] = tiles[randomTargetIndex];
                tiles[randomTargetIndex] = 0;
            }

            // 만약 섞인 결과가 우연히 완성된 상태라면 한 번 더 섞습니다
            if (checkWinCondition()) {
                shufflePuzzle(10);
            }
        }

        function renderBoard() {
            const boardElement = document.getElementById("puzzleBoard");
            boardElement.innerHTML = "";
            
            // CSS Grid 열과 행 개수를 동적으로 설정합니다 (예: grid-template-columns: repeat(3, 80px))
            const tileSize = gridSize === 4 ? 65 : (gridSize === 3 ? 80 : 110);
            boardElement.style.gridTemplateColumns = `repeat(${gridSize}, ${tileSize}px)`;

            // 각 타일을 생성하여 보드에 추가합니다
            tiles.forEach((tileValue, index) => {
                const tileDiv = document.createElement("div");
                tileDiv.classList.add("tile");
                tileDiv.style.width = `${tileSize}px`;
                tileDiv.style.height = `${tileSize}px`;

                if (tileValue === 0) {
                    // 빈 칸인 경우
                    tileDiv.classList.add("empty");
                } else {
                    // 번호가 있는 타일인 경우
                    tileDiv.innerText = tileValue;
                    // 타일을 클릭했을 때 이동 함수 실행
                    tileDiv.onclick = () => handleTileClick(index);
                }

                boardElement.appendChild(tileDiv);
            });
        }

        function handleTileClick(index) {
            if (isCleared) return; // 이미 클리어했으면 조작 불가

            const emptyIndex = tiles.indexOf(0);
            const clickedRow = Math.floor(index / gridSize);
            const clickedCol = index % gridSize;
            const emptyRow = Math.floor(emptyIndex / gridSize);
            const emptyCol = emptyIndex % gridSize;

            // 클릭한 타일이 빈 칸과 상하좌우로 인접해 있는지 확인합니다
            const isRowAdjacent = (clickedRow === emptyRow && Math.abs(clickedCol - emptyCol) === 1);
            const isColAdjacent = (clickedCol === emptyCol && Math.abs(clickedRow - emptyRow) === 1);

            if (isRowAdjacent || isColAdjacent) {
                // 빈 칸과 클릭한 타일의 자리를 서로 바꿉니다
                tiles[emptyIndex] = tiles[index];
                tiles[index] = 0;

                // 이동 횟수를 증가시키고 화면에 반영합니다
                moves++;
                document.getElementById("movesDisplay").innerText = moves;

                // 보드를 다시 그려줍니다
                renderBoard();

                // 퍼즐이 완성되었는지 검사합니다
                if (checkWinCondition()) {
                    handleClear();
                }
            }
        }

        function checkWinCondition() {
            const totalTiles = gridSize * gridSize;
            for (let i = 0; i < totalTiles - 1; i++) {
                if (tiles[i] !== i + 1) {
                    return false; // 번호가 순서대로 맞지 않으면 false 반환
                }
            }
            return tiles[totalTiles - 1] === 0; // 마지막 칸이 0이면 성공
        }

        function handleClear() {
            isCleared = true;
            const messageBox = document.getElementById("messageBox");
            const actionBtn = document.getElementById("actionBtn");

            if (currentStage < stagesConfig.length) {
                messageBox.innerText = `🎉 스테이지 ${currentStage} 클리어! 다음 단계로 이동합니다.`;
                currentStage++;
                actionBtn.innerText = "다음 스테이지 시작";
                // 버튼 클릭 시 다음 스테이지가 시작되도록 이벤트 변경
                actionBtn.onclick = initGame;
            } else {
                messageBox.innerText = `🏆 축하합니다! 모든 스테이지를 완벽하게 클리어하셨습니다!`;
                actionBtn.innerText = "처음부터 다시 하기";
                currentStage = 1;
                actionBtn.onclick = initGame;
            }
        }

        // 웹페이지가 처음 로드될 때 게임을 초기화하고 시작합니다
        window.onload = function() {
            initGame();
        };
    </script>
</body>
</html>
