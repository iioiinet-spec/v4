<!DOCTYPE html>
<html lang="ko">
<head>
    <!-- 문서의 문자 인코딩을 UTF-8로 설정합니다 -->
    <meta charset="UTF-8">
    <!-- 화면 크기를 기기 너비에 맞게 조절합니다 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 브라우저 탭에 표시될 제목입니다 -->
    <title>수업 시간표 & 스케줄</title>
    <!-- 구글 폰트 Jua(주아) 불러오기 -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        /* :root를 사용하여 색상 등의 디자인 변수를 모아둡니다 */
        :root {
            --bg-color: #8979af;      /* 배경 색상 */
            --cell-color: #e8abd8;    /* 표 칸 배경 색상 */
            --text-color: #000000;    /* 기본 글자 색상 */
            --point-color: #00376b;   /* 포인트 강조 색상 */
        }

        /* 전체 페이지 기본 스타일 설정 */
        body {
            background-color: var(--bg-color); /* 배경색 지정 */
            color: var(--text-color);           /* 글자색 지정 */
            font-family: 'Jua', sans-serif;     /* 구글 주아 폰트 적용 */
            margin: 0;                          /* 기본 여백 제거 */
            padding: 20px;                      /* 안쪽 여백 추가 */
            display: flex;                      /* 플렉스 박스 사용 */
            flex-direction: column;             /* 세로 방향 정렬 */
            align-items: center;                /* 가운데 정렬 */
        }

        /* 상단 D-Day 카운터 상자 스타일 */
        .dday-container {
            background-color: var(--cell-color); /* 칸 배경색 사용 */
            border: 3px solid var(--point-color); /* 테두리 설정 */
            border-radius: 15px;                 /* 모서리 둥글기 15px */
            padding: 20px 40px;                  /* 안쪽 여백 */
            margin-bottom: 30px;                 /* 아래쪽 간격 */
            text-align: center;                  /* 글자 가운데 정렬 */
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); /* 은은한 그림자 효과 */
        }

        /* D-Day 제목 글자 스타일 */
        .dday-title {
            font-size: 24px;                     /* 글자 크기 */
            margin-bottom: 10px;                 /* 아래쪽 간격 */
            color: var(--point-color);           /* 포인트 색상 적용 */
        }

        /* D-Day 남은 날짜 숫자 스타일 */
        .dday-count {
            font-size: 36px;                     /* 크게 표시할 날짜 크기 */
        }

        /* 시간표 표 전체 스타일 */
        table {
            border-collapse: collapse;           /* 표 테두리 겹침 방지 */
            background-color: var(--cell-color); /* 표 배경색 */
            border-radius: 15px;                 /* 모서리 둥글기 15px */
            overflow: hidden;                    /* 둥근 모서리에 맞춰 내용 숨기기 */
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); /* 은은한 그림자 */
            width: 100%;                         /* 너비 100% */
            max-width: 600px;                    /* 최대 너비 제한 */
            text-align: center;                  /* 글자 가운데 정렬 */
        }

        /* 표의 칸(Th, Td) 공통 스타일 */
        th, td {
            border: 2px solid var(--point-color); /* 칸 테두리 */
            padding: 12px;                        /* 칸 안쪽 여백 */
            font-size: 18px;                      /* 글자 크기 */
        }

        /* 표 제목 행(요일) 스타일 */
        th {
            background-color: var(--point-color); /* 배경을 포인트 색상으로 */
            color: #ffffff;                       /* 글자색을 하얗게 */
        }

        /* 현재 교시 강조 테두리 스타일 */
        .highlight-period {
            border: 4px dashed var(--point-color) !important; /* 점선 테두리로 강조 */
            background-color: #d195c4;                        /* 배경색 미세 조정 */
        }

        /* 주말 안내 문구 스타일 */
        .weekend-msg {
            margin-top: 15px;
            font-size: 20px;
            color: var(--point-color);
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- 화면 위쪽: D-Day 카운터 영역 -->
    <div class="dday-container">
        <div class="dday-title" id="ddayTitle">목표 이름</div>
        <div class="dday-count" id="ddayCount">D-Day 계산 중...</div>
        <!-- 주말일 경우 안내 문구가 표시될 자리 -->
        <div id="weekendNotice" class="weekend-msg"></div>
    </div>

    <!-- 화면 아래쪽: 시간표 표 영역 -->
    <table>
        <thead>
            <tr>
                <th>시간</th>
                <th>월</th>
                <th>화</th>
                <th>수</th>
                <th>목</th>
                <th>금</th>
            </tr>
        </thead>
        <tbody id="timetableBody">
            <!-- 자바스크립트로 표 내용이 여기에 채워집니다 -->
        </tbody>
    </table>

    <script>
        // ==========================================
        // [여기만 고치세요] 시간표 내용과 목표 날짜 설정
        // ==========================================
        const TITLE  = '우리 반 수업 시간표 & 스케줄'; // 상단에 표시될 제목 이름
        const TARGET = { label:'내 생일', date:'2026-11-14' }; // 목표 이름과 목표 날짜 (YYYY-MM-DD 형식)
        const DAYS   = ['월','화','수','목','금']; // 요일 배열 (월요일부터 금요일까지)
        const PERIODS = [
          { time:'09:00', subjects:['과확', '수확', '국어', '국어', '체육'] }, // 1교시 시간과 각 요일별 과목
          { time:'10:00', subjects:['과확', '수확', '국어', '과학', '국어'] }, // 2교시 시간과 각 요일별 과목
          { time:'11:00', subjects:['과확', '수확', '국어', '영어', '수학'] }, // 3교시 시간과 각 요일별 과목
          { time:'13:00', subjects:['과확', '수확', '국어', '수학', '실과'] }, // 4교시 시간과 각 요일별 과목
          { time:'14:00', subjects:['과확', '수확', '국어', '실과', '동아리'] },// 5교시 시간과 각 요일별 과목
        ];
        // ==========================================

        // D-Day와 현재 교시를 계산하고 화면에 반영하는 함수
        function updateSchedule() {
            // 자바스크립트의 오늘 날짜 정보를 가져옵니다
            const today = new Date();
            
            // 1) D-Day 계산 로직
            const titleElement = document.getElementById('ddayTitle'); // 제목 표시 요소 선택
            const countElement = document.getElementById('ddayCount'); // 남은 날짜 표시 요소 선택
            
            titleElement.textContent = TARGET.label; // 설정한 목표 이름을 화면에 넣습니다
            
            const targetDate = new Date(TARGET.date); // 목표 날짜 객체 생성
            // 시각 차이로 인한 오차를 없애기 위해 년, 월, 일 기준 시각을 00:00:00으로 맞춥니다
            today.setHours(0, 0, 0, 0);
            targetDate.setHours(0, 0, 0, 0);
            
            const diffTime = targetDate - today; // 목표 날짜와 오늘 날짜의 밀리초(ms) 차이 계산
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); // 밀리초를 일(day) 단위로 변환
            
            // 남은 날짜에 따라 문구를 다르게 표시합니다
            if (diffDays > 0) {
                countElement.textContent = `D - ${diffDays}일 남음`;
            } else if (diffDays === 0) {
                countElement.textContent = `오늘이 바로 그날 (D-Day)!`;
            } else {
                countElement.textContent = `목표일이 ${Math.abs(diffDays)}일 지났습니다`;
            }

            // 2) 시간표 HTML 동적 생성 및 현재 교시 강조 로직
            const tbody = document.getElementById('timetableBody'); // 시간표 <tbody> 선택
            tbody.innerHTML = ''; // 기존 내용을 초기화합니다

            // 현재 요일 구하기 (0: 일요일, 1: 월요일, ..., 6: 토요일)
            const currentDayIndex = today.getDay(); 
            const isWeekend = (currentDayIndex === 0 || currentDayIndex === 6); // 주말 여부 확인

            // 주말 안내 문구 처리
            const weekendNotice = document.getElementById('weekendNotice');
            if (isWeekend) {
                weekendNotice.textContent = "오늘은 쉬는 날";
            } else {
                weekendNotice.textContent = "";
            }

            // 현재 시각(시:분) 문자열 구하기 (예: "09:30")
            const nowTime = new Date();
            const currentHour = String(nowTime.getHours()).padStart(2, '0');
            const currentMinute = String(nowTime.getMinutes()).padStart(2, '0');
            const currentTimeStr = `${currentHour}:${currentMinute}`;

            // 현재 교시를 판별하기 위한 인덱스 찾기 (-1이면 해당없음)
            let currentPeriodIndex = -1;
            if (!isWeekend) {
                for (let i = 0; i < PERIODS.length; i++) {
                    const startTime = PERIODS[i].time; // 예: "09:00"
                    // 다음 교시 시작 시간 또는 임의의 종료 시간 계산 (간단히 1시간 간격으로 가정)
                    let endTime = "23:59";
                    if (i + 1 < PERIODS.length) {
                        endTime = PERIODS[i + 1].time;
                    } else {
                        endTime = "15:00"; // 마지막 교시 종료 기준
                    }

                    // 현재 시간이 해당 교시 시간 범위 안에 속하는지 확인
                    if (currentTimeStr >= startTime && currentTimeStr < endTime) {
                        currentPeriodIndex = i;
                        break;
                    }
                }
            }

            // 각 교시별로 행(tr)을 생성하여 표에 추가합니다
            PERIODS.forEach((period, pIndex) => {
                const tr = document.createElement('tr'); // 행 생성

                // 시간 칸(td) 생성 및 추가
                const timeTd = document.createElement('td');
                timeTd.textContent = period.time;
                tr.appendChild(timeTd);

                // 월~금 5개 요일별 과목 칸(td) 생성 및 추가
                for (let dIndex = 0; dIndex < DAYS.length; dIndex++) {
                    const td = document.createElement('td');
                    td.textContent = period.subjects[dIndex]; // 해당 요일의 과목 넣기

                    // 평일이고, 오늘 요일이며, 현재 교시와 일치하는 칸에 테두리 강조 클래스 추가
                    // 주말이 아니고, 오늘 요일이 일치하며(월요일은 dIndex=0이므로 currentDayIndex=1일 때 매칭), 현재 교시일 때
                    if (!isWeekend && (currentDayIndex - 1 === dIndex) && (pIndex === currentPeriodIndex)) {
                        td.classList.add('highlight-period');
                    }

                    tr.appendChild(td);
                }

                tbody.appendChild(tr); // 완성된 행을 표에 추가
            });
        }

        // 페이지가 처음 열렸을 때 함수 실행
        updateSchedule();

        // 1분(60000밀리초)마다 자동으로 함수를 실행하여 시간표와 카운터를 갱신합니다
        setInterval(updateSchedule, 60000);
    </script>
</body>
</html>
