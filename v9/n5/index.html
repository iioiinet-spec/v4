<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zombie Apocalypse 3D</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#startScreen{
    position:fixed;
    inset:0;
    z-index:1000;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    color:white;
    text-align:center;
    background:
        radial-gradient(circle,#26312dcc,#050707f8);
}

#startScreen h1{
    margin:0 0 15px;
    font-size:52px;
    color:#e33;
    text-shadow:4px 4px 0 #000;
}

#startScreen p{
    margin:5px;
    color:#ddd;
}

#startButton{
    margin-top:25px;
    padding:16px 50px;
    border:0;
    border-radius:8px;
    background:#b92323;
    color:white;
    font-size:22px;
    font-weight:bold;
    cursor:pointer;
}

#startButton:hover{
    background:#df3333;
}

#hud{
    position:fixed;
    left:15px;
    top:15px;
    z-index:20;
    color:white;
    font-size:16px;
    line-height:1.7;
    text-shadow:2px 2px 4px #000;
    pointer-events:none;
}

#hud .title{
    color:#ff4444;
    font-size:20px;
    font-weight:bold;
}

#weaponHUD{
    position:fixed;
    right:15px;
    top:15px;
    z-index:20;
    width:230px;
    padding:14px;
    color:white;
    background:rgba(10,12,12,.82);
    border:1px solid #777;
    border-radius:8px;
    text-shadow:2px 2px 3px #000;
    pointer-events:none;
}

#weaponName{
    font-size:24px;
    font-weight:bold;
    color:#ffd34e;
}

#ammo{
    font-size:20px;
    margin-top:4px;
}

.slot{
    margin-top:4px;
}

.activeSlot{
    color:#ffd34e;
    font-weight:bold;
}

#floorHUD{
    position:fixed;
    right:15px;
    top:190px;
    z-index:20;
    padding:8px 12px;
    color:white;
    background:#111c;
    border-radius:6px;
    pointer-events:none;
}

#crosshair{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:30;
    color:white;
    font-size:26px;
    font-weight:bold;
    text-shadow:0 0 5px black;
    pointer-events:none;
}

#hint{
    position:fixed;
    left:50%;
    bottom:18%;
    transform:translateX(-50%);
    z-index:40;
    display:none;
    padding:10px 18px;
    background:rgba(0,0,0,.75);
    color:white;
    border-radius:6px;
    pointer-events:none;
}

#waveMessage{
    position:fixed;
    top:90px;
    left:50%;
    transform:translateX(-50%);
    z-index:30;
    display:none;
    color:#ffd83d;
    font-size:38px;
    font-weight:bold;
    text-shadow:4px 4px #000;
    pointer-events:none;
}

#damageFlash{
    position:fixed;
    inset:0;
    z-index:25;
    background:transparent;
    pointer-events:none;
}

#help{
    position:fixed;
    left:15px;
    bottom:15px;
    z-index:20;
    color:#ddd;
    font-size:13px;
    text-shadow:2px 2px #000;
    pointer-events:none;
}
</style>
</head>

<body>

<div id="startScreen">
    <h1>ZOMBIE APOCALYPSE</h1>
    <p>WASD : 이동</p>
    <p>SPACE : 점프 / 벽 점프</p>
    <p>마우스 : 조준 / 클릭 : 사격</p>
    <p>1~4 : 무기 변경　R : 장전</p>
    <p>E : 무기 줍기 / 차량 / 엘리베이터</p>
    <p>T : 하늘 섬광탄 / 3초 조명</p>
    <button id="startButton">게임 시작</button>
</div>

<div id="hud">
    <div class="title">☣ APOCALYPSE CITY</div>
    ❤️ 체력: <span id="hp">100</span><br>
    ☠ 처치: <span id="kills">0</span><br>
    🌊 웨이브: <span id="wave">0</span><br>
    🧟 좀비: <span id="zombies">0</span><br>
    🚗 상태: <span id="carStatus">도보</span>
</div>

<div id="weaponHUD">
    <div style="color:#aaa;">현재 무기</div>
    <div id="weaponName">권총</div>
    <div id="ammo">12 / 60</div>
    <hr>
    <div id="slots"></div>
</div>

<div id="floorHUD">🏙 거리</div>

<div id="crosshair">+</div>

<div id="hint"></div>

<div id="waveMessage"></div>

<div id="damageFlash"></div>

<div id="help">
    WASD 이동 · SPACE 점프 · E 상호작용 · R 장전 · 1~4 무기 · T 섬광탄 (3초)
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
"use strict";

/* =========================================================
   기본 THREE 설정
========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x131e2c);

scene.fog = new THREE.Fog(
    0x131e2c,
    80,
    500
);

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    800
);

camera.rotation.order = "YXZ";

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,2)
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);


/* =========================================================
   조명
========================================================= */

const hemi = new THREE.HemisphereLight(
    0x9eb7c0,
    0x252019,
    0.48
);

scene.add(hemi);

const sun = new THREE.DirectionalLight(
    0xffd5a1,
    0.65
);

sun.position.set(
    -100,
    180,
    80
);

sun.castShadow = true;

sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;

scene.add(sun);


sun.shadow.camera.left=-110;sun.shadow.camera.right=110;sun.shadow.camera.top=110;sun.shadow.camera.bottom=-110;sun.shadow.camera.far=450;sun.shadow.bias=-.0005;
/* =========================================================
   상태
========================================================= */

let gameStarted = false;
let gameOver = false;

let wave = 0;

const keys = {};

const obstacles = [];
const zombies = [];
const bullets = [];
const pickups = [];
const cars = [];
const elevators = [];

const floors = [];


/* =========================================================
   플레이어
========================================================= */

const player = {

    x:0,
    y:1.7,
    z:170,

    vy:0,

    ground:true,

    hp:100,

    kills:0,

    speed:0.24,

    gravity:0.018,

    jumpPower:0.42,

    yaw:0,

    pitch:0,

    floor:0,

    wallJumpCooldown:0,

    shootCooldown:0,

    reload:false,

    reloadTimer:0,

    weapon:1,

    inventory:[1,2,3,4],

    inCar:false,

    car:null
};


/* =========================================================
   무기
========================================================= */

const weapons = {

    1:{
        name:"권총",
        damage:2,
        maxAmmo:12,
        reserve:60,
        fireDelay:16
    },

    2:{
        name:"돌격소총",
        damage:2,
        maxAmmo:30,
        reserve:120,
        fireDelay:5
    },

    3:{
        name:"산탄총",
        damage:6,
        maxAmmo:6,
        reserve:36,
        fireDelay:35
    },

    4:{
        name:"기관단총",
        damage:1,
        maxAmmo:25,
        reserve:100,
        fireDelay:4
    }
};

const ammo = {

    1:{
        clip:12,
        reserve:60
    },

    2:{
        clip:30,
        reserve:120
    },

    3:{
        clip:6,
        reserve:36
    },

    4:{
        clip:25,
        reserve:100
    }
};


/* =========================================================
   키 입력
========================================================= */

window.addEventListener(
    "keydown",
    function(e){

        keys[e.key.toLowerCase()] = true;
        if(e.code === "KeyT" && !e.repeat) launchFlare();

        if(e.code === "Space"){
            e.preventDefault();
            jump();
        }

        if(e.key >= "1" && e.key <= "4"){
            changeWeapon(
                Number(e.key)
            );
        }

        if(e.key.toLowerCase() === "r"){
            reload();
        }

        if(e.key.toLowerCase() === "e"){
            interact();
        }
    }
);

window.addEventListener(
    "keyup",
    function(e){
        keys[e.key.toLowerCase()] = false;
    }
);


/* =========================================================
   시작 버튼
========================================================= */

document.getElementById(
    "startButton"
).addEventListener(
    "click",
    function(){

        if(gameStarted) return;

        gameStarted = true;

        document.getElementById(
            "startScreen"
        ).style.display = "none";

        if(document.body.requestPointerLock){
            document.body.requestPointerLock();
        }

        startWave();
    }
);


/* =========================================================
   마우스
========================================================= */

document.addEventListener(
    "mousemove",
    function(e){

        if(!gameStarted) return;

        if(document.pointerLockElement !== document.body){
            return;
        }

        player.yaw -= e.movementX * 0.002;

        player.pitch -= e.movementY * 0.002;

        player.pitch = Math.max(
            -1.45,
            Math.min(1.45,player.pitch)
        );

        camera.rotation.y =
            player.yaw;

        camera.rotation.x =
            player.pitch;
    }
);

document.addEventListener(
    "mousedown",
    function(e){

        if(!gameStarted) return;

        if(
            document.pointerLockElement !==
            document.body
        ){

            if(document.body.requestPointerLock){
                document.body.requestPointerLock();
            }

            return;
        }

        if(e.button === 0){
            shoot();
        }
    }
);


/* =========================================================
   월드 바닥
========================================================= */

const ground = new THREE.Mesh(

    new THREE.PlaneGeometry(
        700,
        700
    ),

    new THREE.MeshStandardMaterial({
        color:0x464b49,
        roughness:1
    })
);

ground.rotation.x = -Math.PI / 2;

ground.receiveShadow = true;

scene.add(ground);


/* =========================================================
   도로
========================================================= */

function createRoad(
    x,
    z,
    width,
    depth
){

    const road = new THREE.Mesh(

        new THREE.BoxGeometry(
            width,
            0.05,
            depth
        ),

        new THREE.MeshStandardMaterial({
            color:0x242726
        })
    );

    road.position.set(
        x,
        0.025,
        z
    );

    scene.add(road);
}

createRoad(0,0,700,24);
createRoad(0,0,24,700);

createRoad(0,120,700,18);
createRoad(0,-120,700,18);

createRoad(120,0,18,700);
createRoad(-120,0,18,700);


const markingMat=new THREE.MeshStandardMaterial({color:0xb8afa0,roughness:1});
for(let v=-330;v<340;v+=12){for(const horizontal of [true,false]){const m=new THREE.Mesh(new THREE.PlaneGeometry(.22,5),markingMat);m.rotation.x=-Math.PI/2;if(horizontal)m.rotation.z=Math.PI/2;m.position.set(horizontal?v:0,.058,horizontal?0:v);scene.add(m);}}
/* =========================================================
   장애물
========================================================= */

function createObstacle(
    x,
    y,
    z,
    w,
    h,
    d,
    color,
    type
){

    const mesh = new THREE.Mesh(

        new THREE.BoxGeometry(
            w,
            h,
            d
        ),

        new THREE.MeshStandardMaterial({
            color:color,
            roughness:0.85
        })
    );

    mesh.position.set(
        x,
        y + h / 2,
        z
    );

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    scene.add(mesh);

    const object = {
        mesh:mesh,
        x:x,
        y:y,
        z:z,
        w:w,
        h:h,
        d:d,
        type:type || "wall"
    };

    obstacles.push(object);

    return object;
}


/* =========================================================
   아파트
========================================================= */

const apartment = {

    x:70,
    z:70,

    width:42,
    depth:34,

    floors:5,

    floorHeight:4
};


function createApartment(){

    const a = apartment;

    for(let f=0; f<a.floors; f++){

        const y =
            f * a.floorHeight;


        /* 왼쪽 외벽 */

        createObstacle(
            a.x - a.width/2,
            y,
            a.z,
            0.5,
            a.floorHeight,
            a.depth,
            0x777777,
            "building"
        );


        /* 오른쪽 외벽 */

        createObstacle(
            a.x + a.width/2,
            y,
            a.z,
            0.5,
            a.floorHeight,
            a.depth,
            0x777777,
            "building"
        );


        /* 뒤쪽 벽 */

        createObstacle(
            a.x,
            y,
            a.z + a.depth/2,
            a.width,
            a.floorHeight,
            0.5,
            0x707070,
            "building"
        );


        /*
          앞쪽 벽은 출입구 때문에
          양쪽으로 나눔
        */

        createObstacle(
            a.x - 14,
            y,
            a.z - a.depth/2,
            14,
            a.floorHeight,
            0.5,
            0x707070,
            "building"
        );

        createObstacle(
            a.x + 14,
            y,
            a.z - a.depth/2,
            14,
            a.floorHeight,
            0.5,
            0x707070,
            "building"
        );


        /* 층 바닥 */

        const floor = new THREE.Mesh(

            new THREE.BoxGeometry(
                a.width - 1,
                0.25,
                a.depth - 1
            ),

            new THREE.MeshStandardMaterial({
                color:0x555654
            })
        );

        floor.position.set(
            a.x,
            y,
            a.z
        );

        floor.receiveShadow = true;

        scene.add(floor);

        floors.push({
            level:f,
            y:y,
            x:a.x,
            z:a.z,
            width:a.width-1,
            depth:a.depth-1
        });


        /* 방 구분 벽 */

        createObstacle(
            a.x - 8,
            y,
            a.z + 8,
            0.3,
            a.floorHeight,
            12,
            0x686868,
            "interior"
        );

        createObstacle(
            a.x + 8,
            y,
            a.z + 8,
            0.3,
            a.floorHeight,
            12,
            0x686868,
            "interior"
        );


        /* 창문 */

        for(
            let wx=-14;
            wx<=14;
            wx+=7
        ){

            const windowMesh =
                new THREE.Mesh(

                    new THREE.BoxGeometry(
                        3,
                        1.3,
                        0.08
                    ),

                    new THREE.MeshStandardMaterial({
                        color:0x7faeb7,
                        emissive:0x101c1f
                    })
                );

            windowMesh.position.set(
                a.x + wx,
                y + 2.2,
                a.z - a.depth/2 - 0.04
            );

            scene.add(windowMesh);
        }


        /* 층 조명 */

        const light =
            new THREE.PointLight(
                0xffd99b,
                0.65,
                18
            );

        light.position.set(
            a.x,
            y + 3,
            a.z
        );

        scene.add(light);
    }


    createStairs();
    createElevator();
}


/* =========================================================
   계단
========================================================= */

function createStairs(){

    const a = apartment;

    for(
        let floor=0;
        floor<a.floors-1;
        floor++
    ){

        const base =
            floor * a.floorHeight;

        for(
            let step=0;
            step<14;
            step++
        ){

            const mesh =
                new THREE.Mesh(

                    new THREE.BoxGeometry(
                        4,
                        0.28,
                        1
                    ),

                    new THREE.MeshStandardMaterial({
                        color:0x4d4d4d
                    })
                );

            mesh.position.set(
                a.x + 13,
                base + 0.14 + step*0.28,
                a.z + 10 - step*0.65
            );

            mesh.castShadow = true;

            scene.add(mesh);

            obstacles.push({
                mesh:mesh,
                x:mesh.position.x,
                y:mesh.position.y-0.14,
                z:mesh.position.z,
                w:4,
                h:0.28,
                d:1,
                type:"stairs"
            });
        }
    }
}


/* =========================================================
   엘리베이터
========================================================= */

function createElevator(){

    const a = apartment;

    const x =
        a.x - 13;

    const z =
        a.z - 7;


    for(
        let f=0;
        f<a.floors;
        f++
    ){

        const y =
            f * a.floorHeight;

        createObstacle(
            x - 2,
            y,
            z,
            0.25,
            a.floorHeight,
            4,
            0x444444,
            "elevator"
        );

        createObstacle(
            x + 2,
            y,
            z,
            0.25,
            a.floorHeight,
            4,
            0x444444,
            "elevator"
        );

        createObstacle(
            x,
            y,
            z + 2,
            4,
            a.floorHeight,
            0.25,
            0x444444,
            "elevator"
        );
    }


    const cabin =
        new THREE.Group();


    const cabinFloor =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                3.5,
                0.15,
                3.5
            ),

            new THREE.MeshStandardMaterial({
                color:0x777777
            })
        );

    cabin.add(cabinFloor);


    const roof =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                3.5,
                0.15,
                3.5
            ),

            new THREE.MeshStandardMaterial({
                color:0x555555
            })
        );

    roof.position.y = 2.8;

    cabin.add(roof);


    cabin.position.set(
        x,
        0,
        z
    );

    scene.add(cabin);


    elevators.push({
        x:x,
        z:z,
        cabin:cabin,
        level:0,
        moving:false
    });
}

createApartment();


/* =========================================================
   도시 건물/잔해
========================================================= */

const facadeCanvas=document.createElement('canvas');facadeCanvas.width=256;facadeCanvas.height=256;
const fc=facadeCanvas.getContext('2d');fc.fillStyle='#b5b7b2';fc.fillRect(0,0,256,256);
for(let i=0;i<3500;i++){const v=140+Math.random()*65;fc.fillStyle=`rgba(${v},${v},${v},.28)`;fc.fillRect(Math.random()*256,Math.random()*256,2,2);}
fc.strokeStyle='#757975';fc.lineWidth=2;for(let y=0;y<256;y+=32){fc.beginPath();fc.moveTo(0,y);fc.lineTo(256,y);fc.stroke();for(let x=(y/32%2)*32;x<256;x+=64){fc.beginPath();fc.moveTo(x,y);fc.lineTo(x,y+32);fc.stroke();}}
const facadeTexture=new THREE.CanvasTexture(facadeCanvas);facadeTexture.colorSpace=THREE.SRGBColorSpace;
function createCityBuilding(
    x,
    z,
    w,
    d,
    h
){

    const wall = createObstacle(x,0,z,w,h,d,0x777d83,"cityBuilding");
    wall.mesh.material.map = facadeTexture;
    wall.mesh.material.color.setHex([0x89918f,0x8e8074,0x6a7a85][Math.floor(Math.random()*3)]);
    const group = new THREE.Group(); group.position.set(x,0,z); scene.add(group);
    const trim = new THREE.MeshStandardMaterial({color:0x303b44,roughness:0.85});
    const glass = new THREE.MeshStandardMaterial({color:0x243a49,metalness:.6,roughness:.25});
    const lit = new THREE.MeshStandardMaterial({color:0xc1a268,emissive:0xffb84c,emissiveIntensity:.65});
    function box(wi,he,de,px,py,pz,mat){const m=new THREE.Mesh(new THREE.BoxGeometry(wi,he,de),mat);m.position.set(px,py,pz);group.add(m);return m;}
    for(let y=2.2;y<h-1;y+=3.1){
        for(let px=-w/2+1.6;px<w/2-1;px+=2.7){
            for(const side of [-1,1]){
                box(1.55,1.9,.14,px,y,side*(d/2+.07),trim);
                box(1.25,1.55,.16,px,y,side*(d/2+.15),Math.random()<.16?lit:glass);
                box(1.65,.12,.35,px,y-.95,side*(d/2+.16),trim);
            }
        }
        for(let pz=-d/2+1.6;pz<d/2-1;pz+=2.7)for(const side of [-1,1]){
            box(.14,1.9,1.55,side*(w/2+.07),y,pz,trim);
            box(.16,1.55,1.25,side*(w/2+.15),y,pz,Math.random()<.12?lit:glass);
        }
        box(w+.4,.18,d+.4,0,y+1.25,0,trim);
    }
    box(w+.7,.4,d+.7,0,h+.2,0,trim);
    box(w*.35,1.3,d*.3,-w*.18,h+.85,0,trim);
    box(1.8,2.8,.2,0,1.4,-d/2-.15,glass);
    box(3.2,.22,1.5,0,3,-d/2-.6,trim);

}

for(let i=0;i<45;i++){

    const x =
        (Math.random()-0.5)*500;

    const z =
        (Math.random()-0.5)*500;

    if(
        Math.abs(x)<24 || Math.abs(z)<24 ||
        Math.abs(Math.abs(x)-120)<20 || Math.abs(Math.abs(z)-120)<20 ||

function getPlayerBox(
    x,
    y,
    z
){

    return new THREE.Box3(

        new THREE.Vector3(
            x-0.35,
            y-1.7,
            z-0.35
        ),

        new THREE.Vector3(
            x+0.35,
            y,
            z+0.35
        )
    );
}


function blocked(
    x,
    y,
    z
){

    const box =
        getPlayerBox(x,y,z);


    for(const object of obstacles){

        /*
          건물과 내부벽만 플레이어를
          막도록 함.

          계단은 별도 층 바닥으로 처리.
        */

        if(
            object.type === "building" ||
            object.type === "interior" ||
            object.type === "cityBuilding" ||
            object.type === "elevator"
        ){

            const objectBox =
                new THREE.Box3()
                    .setFromObject(
                        object.mesh
                    );

            if(
                box.intersectsBox(
                    objectBox
                )
            ){
                return true;
            }
        }
    }

    return false;
}


/* =========================================================
   층 바닥
========================================================= */

function isInsideApartment(){

    const a = apartment;

    return (
        player.x >
        a.x-a.width/2 &&
        player.x <
        a.x+a.width/2 &&

        player.z >
        a.z-a.depth/2 &&
        player.z <
        a.z+a.depth/2
    );
}


function getFloorHeight(){

    let result = 1.7;


    if(isInsideApartment()){

        for(const floor of floors){

            const inside =
                player.x >
                floor.x-floor.width/2 &&

                player.x <
                floor.x+floor.width/2 &&

                player.z >
                floor.z-floor.depth/2 &&

                player.z <
                floor.z+floor.depth/2;

            if(
                inside &&
                player.y >=
                floor.y-0.6
            ){

                result =
                    Math.max(
                        result,
                        floor.y+1.7
                    );
            }
        }
    }

    return result;
}


function updateFloor(){

    if(isInsideApartment()){

        let level =
            Math.floor(
                Math.max(
                    0,
                    player.y-1.7
                ) /
                apartment.floorHeight
            );

        level = Math.max(
            0,
            Math.min(
                apartment.floors-1,
                level
            )
        );

        player.floor = level;

        document.getElementById(
            "floorHUD"
        ).textContent =
            "🏢 " +
            (level+1) +
            "층";

    }else{

        player.floor = 0;

        document.getElementById(
            "floorHUD"
        ).textContent =
            "🏙 거리";
    }
}

function wallNearby(){

    const distance = 0.75;

    return (
        blocked(
            player.x+distance,
            player.y,
            player.z
        ) ||

        blocked(
            player.x-distance,
            player.y,
            player.z
        ) ||

        blocked(
            player.x,
            player.y,
            player.z+distance
        ) ||

        blocked(
            player.x,
            player.y,
            player.z-distance
        )
    );
}

/* =========================================================
   플레이어 이동
========================================================= */

function updatePlayer(){

    if(!gameStarted) return;


    if(player.inCar){

        updateCar();

        return;
    }


    const input =
        new THREE.Vector3();


    if(keys.w) input.z -= 1;
    if(keys.s) input.z += 1;
    if(keys.a) input.x -= 1;
    if(keys.d) input.x += 1;


    if(input.lengthSq()>0){

        input.normalize();


        const forward =
            new THREE.Vector3();

        camera.getWorldDirection(
            forward
        );

        forward.y = 0;

        forward.normalize();


        const right =
            new THREE.Vector3()
                .crossVectors(
                    forward,
                    new THREE.Vector3(
                        0,1,0
                    )
                )
                .normalize();


        const movement =
            new THREE.Vector3();

        movement.addScaledVector(
            forward,
            -input.z
        );

        movement.addScaledVector(
            right,
            input.x
        );

        movement.normalize();


        const nx =
            player.x +
            movement.x *
            player.speed;

        const nz =
            player.z +
            movement.z *
            player.speed;


        if(
            !blocked(
                nx,
                player.y,
                player.z
            )
        ){
            player.x = nx;
        }


        if(
            !blocked(
                player.x,
                player.y,
                nz
            )
        ){
            player.z = nz;
        }
    }


    player.vy -=
        player.gravity;

    player.y +=
        player.vy;


    const floorY =
        getFloorHeight();


    if(player.y <= floorY){

        player.y =
            floorY;

        player.vy = 0;

        player.ground = true;

    }else{

        player.ground = false;
    }


    if(
        player.wallJumpCooldown > 0
    ){
        player.wallJumpCooldown--;
    }


    updateFloor();


    camera.position.set(
        player.x,
        player.y,
        player.z
    );
}

/* =========================================================
   사격
========================================================= */

function shoot(){

    if(
        !gameStarted ||
        player.reload ||
        player.shootCooldown > 0 ||
        player.inCar
    ){
        return;
    }


    const weapon =
        weapons[player.weapon];

    const current =
        ammo[player.weapon];


    if(current.clip <= 0){

        reload();

        return;
    }


    current.clip--;

    player.shootCooldown =
        weapon.fireDelay;


    const shots =
        player.weapon === 3
        ? 7
        : 1;


    for(
        let i=0;
        i<shots;
        i++
    ){

        const direction =
            new THREE.Vector3();

        camera.getWorldDirection(
            direction
        );


        if(shots > 1){

            direction.x +=
                (Math.random()-0.5)*0.14;

            direction.y +=
                (Math.random()-0.5)*0.14;

            direction.z +=
                (Math.random()-0.5)*0.14;

            direction.normalize();
        }


        const bullet =
            new THREE.Mesh(

                new THREE.SphereGeometry(
                    0.055,
                    6,
                    6
                ),

                new THREE.MeshBasicMaterial({
                    color:0xffdf55
                })
            );


        bullet.position.copy(
            camera.position
        );


        bullet.userData = {
            velocity:
                direction.multiplyScalar(1.8),

            life:100,

            damage:
                weapon.damage
        };


        scene.add(bullet);

        bullets.push(bullet);
    }
}


/* =========================================================
   장전
========================================================= */

function reload(){

    if(
        player.reload ||
        player.inCar
    ){
        return;
    }


    const current =
        ammo[player.weapon];

    const weapon =
        weapons[player.weapon];


    if(
        current.clip >=
        weapon.maxAmmo
    ){
        return;
    }


    if(current.reserve <= 0){
        return;
    }


    player.reload = true;

    player.reloadTimer = 55;
}


function updateReload(){

    if(!player.reload){
        return;
    }


    player.reloadTimer--;


    if(
        player.reloadTimer <= 0
    ){

        const current =
            ammo[player.weapon];

        const weapon =
            weapons[player.weapon];


        const needed =
            weapon.maxAmmo -
            current.clip;


        const amount =
            Math.min(
                needed,
                current.reserve
            );


        current.clip +=
            amount;

        current.reserve -=
            amount;


        player.reload =
            false;
    }
}

    mesh(new THREE.BoxGeometry(.65,.83,.38),clothes,rig,0,1.28,0);

    mesh(new THREE.BoxGeometry(.14,.045,.025),dark,head,0,-.13,.258);
    for(let i=0;i<4;i++)mesh(new THREE.BoxGeometry(.025,.03,.018),new THREE.MeshStandardMaterial({color:0xc4baa2}),head,-.045+i*.03,-.12,.278);
    mesh(new THREE.BoxGeometry(.09,.15,.015),wound,head,-.18,-.08,.17);
    const arms=[],legs=[];
    for(const side of [-1,1]){
        const arm=new THREE.Group();arm.position.set(side*.4,1.64,0);rig.add(arm);arms.push(arm);
        mesh(new THREE.CylinderGeometry(.11,.085,.48,8),clothes,arm,0,-.22,0);
        mesh(new THREE.CylinderGeometry(.08,.06,.43,8),skin,arm,0,-.6,.06);
        mesh(new THREE.SphereGeometry(.095,8,8),skin,arm,0,-.85,.08);
        for(let f=0;f<3;f++)mesh(new THREE.BoxGeometry(.027,.12,.035),skin,arm,(f-1)*.037,-.93,.09);
        const leg=new THREE.Group();leg.position.set(side*.18,.89,0);rig.add(leg);legs.push(leg);

}

function updateZombies(){

    for(
        let i=0;
        i<zombies.length;
        i++
    ){

        const zombie =
            zombies[i];


        const dx =
            player.x -
            zombie.x;

        const dz =
            player.z -
            zombie.z;

        const distance =
            Math.hypot(
                dx,
                dz
            );


        if(distance > 1.7){

            const length =
                Math.max(
                    distance,
                    0.001
                );


            const step=zombie.speed*(.8+.2*Math.sin(zombie.phase));
            const nx=zombie.x+dx/length*step,nz=zombie.z+dz/length*step;
            if(!blocked(nx,1.7,zombie.z))zombie.x=nx;
            if(!blocked(zombie.x,1.7,nz))zombie.z=nz;
            // Slide along facades when the direct route is blocked.
            if(Math.abs(nx-zombie.x)+Math.abs(nz-zombie.z)>step*.9){
                const side=zombie.phase%6.28<3.14?1:-1;
                const sx=zombie.x-dz/length*step*side,sz=zombie.z+dx/length*step*side;
                if(!blocked(sx,1.7,sz)){zombie.x=sx;zombie.z=sz;}
            }
            zombie.mesh.rotation.y=Math.atan2(dx,dz);

        }else{

            zombie.attackTimer--;

            if(
                zombie.attackTimer <= 0
            ){

                player.hp -= 4;

                damageFlash();

                zombie.attackTimer =
                    45;


                if(player.hp <= 0){

                    player.hp = 0;

                    endGame();

                    return;
                }
            }
        }


        zombie.phase+=.065;
        const gait=Math.sin(zombie.phase);
        zombie.legs[0].rotation.x=gait*.38;
        zombie.legs[1].rotation.x=-gait*.26;
        zombie.arms[0].rotation.x=-1.05+gait*.16;
        zombie.arms[1].rotation.x=-.8-gait*.22;
        zombie.arms[0].rotation.z=-.12;zombie.arms[1].rotation.z=.18;
        zombie.rig.rotation.z=.055*Math.sin(zombie.phase*.5);
        zombie.rig.rotation.x=.12;
        zombie.rig.position.y=.025+Math.abs(gait)*.035;
        zombie.head.rotation.z=.16+.07*Math.sin(zombie.phase*.7);
        if(distance<=1.7){zombie.rig.rotation.x=.23+.14*Math.sin(zombie.phase*3);zombie.arms[0].rotation.x=-1.5+.35*Math.sin(zombie.phase*3);}
        zombie.mesh.position.set(
            zombie.x,
            zombie.y,
            zombie.z
        );
    }
}


/* =========================================================
   총알 업데이트
========================================================= */

function updateBullets(){

    for(
        let i=bullets.length-1;
        i>=0;
        i--
    ){

        const bullet =
            bullets[i];


        bullet.position.add(
            bullet.userData.velocity
        );


        bullet.userData.life--;


        let remove =
            bullet.userData.life <= 0;


        for(
            let j=zombies.length-1;
            j>=0;
            j--
        ){

            const zombie =
                zombies[j];


            const distance =
                Math.hypot(
                    bullet.position.x -
                    zombie.x,

                    bullet.position.z -
                    zombie.z
                );


            const hit =
                distance < 0.75 &&
                bullet.position.y >
                    zombie.y &&
                bullet.position.y <
                    zombie.y+2.5;


            if(hit){

                zombie.hp -=
                    bullet.userData.damage;

                remove = true;


                if(zombie.hp <= 0){

                    killZombie(j);
                }

                break;
            }
        }


        if(remove){

            scene.remove(
                bullet
            );

            bullets.splice(
                i,
                1
            );
        }
    }
}

function killZombie(index){

    const zombie =
        zombies[index];

    if(!zombie) return;


    if(Math.random()<0.18){

        const types = [
            "pistol",
            "rifle",
            "shotgun",
            "smg"
        ];

        const type =
            types[
                Math.floor(
                    Math.random()*
                    types.length
                )
            ];


        spawnWeapon(
            type,
            zombie.x,
            zombie.y+0.5,
            zombie.z
        );
    }


    scene.remove(
        zombie.mesh
    );


    zombies.splice(
        index,
        1
    );


    player.kills++;
}

/* =========================================================

function nearestPickup(){

    let best = null;
    let distance = Infinity;


    for(
        const pickup of pickups
    ){

        const d =
            Math.hypot(
                player.x -
                pickup.x,

                player.z -
                pickup.z
            );


        if(d < distance){

            distance = d;

            best = pickup;
        }
    }


    return {
        pickup:best,
        distance:distance
    };
}


/* =========================================================
   엘리베이터
========================================================= */

function nearestElevator(){

    let best = null;
    let distance = Infinity;


    for(
        const elevator of elevators
    ){

        const d =
            Math.hypot(
                player.x -
                elevator.x,

                player.z -
                elevator.z
            );


        if(d < distance){

            distance = d;

            best = elevator;
        }
    }


    return {
        elevator:best,
        distance:distance
    };
}


function useElevator(
    elevator
){

    if(
        elevator.moving
    ){
        return;
    }


    const target =
        (elevator.level + 1)
        %
        apartment.floors;


    const startY =
        elevator.cabin.position.y;

    const endY =
        target *
        apartment.floorHeight;


    elevator.moving = true;


    let progress = 0;


    function elevatorAnimation(){

        progress +=
            0.025;


        elevator.cabin.position.y =
            THREE.MathUtils.lerp(
                startY,
                endY,
                progress
            );


        player.x =
            elevator.x;

        player.z =
            elevator.z;

        player.y =
            elevator.cabin.position.y +
            1.7;


        if(progress < 1){

            requestAnimationFrame(
                elevatorAnimation
            );

        }else{

            elevator.level =
                target;

            elevator.moving =
                false;

            player.floor =
                target;

            player.y =
                endY+1.7;
        }
    }


    elevatorAnimation();
}


/* =========================================================
   차량
========================================================= */

function nearestCar(){

    let best = null;
    let distance = Infinity;


    for(
        const car of cars
    ){

        if(car.broken) continue;


        const d =
            Math.hypot(
                player.x -
                car.mesh.position.x,

                player.z -
                car.mesh.position.z
            );


        if(d < distance){

            distance = d;

            best = car;
        }
    }


    return {
        car:best,
        distance:distance
    };
}


function enterCar(car){

    if(!car) return;


    player.inCar = true;

    player.car = car;

    car.occupied = true;


    player.x =
        car.mesh.position.x;

    player.z =
        car.mesh.position.z;

    player.y = 2.5;
}


function exitCar(){

    const car =
        player.car;


    if(!car) return;


    car.occupied =
        false;


    player.inCar =
        false;


    player.x =
        car.mesh.position.x +
        Math.sin(
            car.rotation
        )*3;


    player.z =
        car.mesh.position.z +
        Math.cos(
            car.rotation
        )*3;


    player.car = null;
}


function updateCar(){

    const car =
        player.car;


    if(!car) return;


    if(keys.w){
        car.speed += 0.018;
    }

    if(keys.s){
        car.speed -= 0.012;
    }


    if(keys.a){
        car.rotation += 0.025;
    }

    if(keys.d){
        car.rotation -= 0.025;
    }


    car.speed *= 0.97;


    car.speed =
        Math.max(
            -0.25,
            Math.min(
                0.55,
                car.speed
            )
        );


    car.mesh.rotation.y =
        car.rotation;


    car.mesh.position.x +=
        Math.sin(
            car.rotation
        ) *
        car.speed;


    car.mesh.position.z +=
        Math.cos(
            car.rotation
        ) *
        car.speed;


    /* 차량으로 좀비 공격 */

    for(
        let i=zombies.length-1;
        i>=0;
        i--
    ){

        const zombie =
            zombies[i];


        const distance =
            Math.hypot(

                car.mesh.position.x -
                zombie.x,

                car.mesh.position.z -
                zombie.z
            );


        if(
            distance < 2.5 &&
            Math.abs(
                car.speed
            ) > 0.15
        ){

            killZombie(i);

            car.speed *= 0.75;
        }
    }


    player.x =
        car.mesh.position.x;

    player.z =
        car.mesh.position.z;

    player.y = 2.5;
}


/* =========================================================
   상호작용
========================================================= */

function interact(){

    if(!gameStarted) return;


    /* 차량에서 내리기 */

    if(player.inCar){

        exitCar();

        return;
    }


    /* 무기 줍기 */

    const nearest =
        nearestPickup();


    if(
        nearest.pickup &&
        nearest.distance < 3
    ){

        const pickup =
            nearest.pickup;


        const weaponNumber =
            {
                pistol:1,
                rifle:2,
                shotgun:3,
                smg:4
            }[
                pickup.type
            ];


        if(weaponNumber){

            player.weapon =
                weaponNumber;


            scene.remove(
                pickup.mesh
            );


            const index =
                pickups.indexOf(
                    pickup
                );


            if(index >= 0){

                pickups.splice(
                    index,
                    1
                );
            }


            updateWeaponHUD();

            return;
        }
    }


    /* 엘리베이터 */

    const nearestE =
        nearestElevator();


    if(
        nearestE.elevator &&
        nearestE.distance < 4
    ){

        useElevator(
            nearestE.elevator
        );

        return;
    }


    /* 차량 */

    const nearestC =
        nearestCar();


    if(
        nearestC.car &&
        nearestC.distance < 3
    ){

        enterCar(
            nearestC.car
        );
    }
}


/* =========================================================
   HUD
========================================================= */

function updateWeaponHUD(){

    const weapon =
        weapons[player.weapon];

    const current =
        ammo[player.weapon];


    document.getElementById(
        "weaponName"
    ).textContent =
        weapon.name;


    document.getElementById(
        "ammo"
    ).textContent =
        current.clip +
        " / " +
        current.reserve;


    let html = "";


    for(
        let i=1;
        i<=4;
        i++
    ){

        const active =
            i === player.weapon;


        html +=
            "<div class='slot " +
            (
                active
                ? "activeSlot"
                : ""
            ) +
            "'>" +

            i +
            " " +
            weapons[i].name +

            "</div>";
    }


    document.getElementById(
        "slots"
    ).innerHTML = html;
}


function updateHUD(){

    document.getElementById(
        "hp"
    ).textContent =
        Math.max(
            0,
            Math.floor(
                player.hp
            )
        );


    document.getElementById(
        "kills"
    ).textContent =
        player.kills;


    document.getElementById(
        "wave"
    ).textContent =
        wave;


    document.getElementById(
        "zombies"
    ).textContent =
        zombies.length;


    document.getElementById(
        "carStatus"
    ).textContent =
        player.inCar
        ? "🚗 운전 중"
        : "도보";
}


/* =========================================================
   상호작용 안내
========================================================= */

function updateHint(){

    const hint =
        document.getElementById(
            "hint"
        );


    if(player.inCar){

        hint.textContent =
            "E - 차량에서 내리기";

        hint.style.display =
            "block";

        return;
    }


    const pickup =
        nearestPickup();


    if(
        pickup.pickup &&
        pickup.distance < 3
    ){

        hint.textContent =
            "E - " +
            pickup.pickup.type +
            " 줍기";

        hint.style.display =
            "block";

        return;
    }


    const elevator =
        nearestElevator();


    if(
        elevator.elevator &&
        elevator.distance < 4
    ){

        hint.textContent =
            "E - 엘리베이터";

        hint.style.display =
            "block";

        return;
    }


    const car =
        nearestCar();


    if(
        car.car &&
        car.distance < 3
    ){

        hint.textContent =
            "E - 차량 탑승";

        hint.style.display =
            "block";

        return;
    }


    hint.style.display =
        "none";
}


/* =========================================================
   데미지 화면
========================================================= */

function damageFlash(){

    const flash =
        document.getElementById(
            "damageFlash"
        );


    flash.style.background =
        "rgba(255,0,0,0.35)";


    setTimeout(
        function(){

            flash.style.background =
                "transparent";

        },
        120
    );
}


/* =========================================================
   게임오버
========================================================= */

function endGame(){

    if(gameOver) return;


    gameOver = true;

    gameStarted = false;


    if(document.exitPointerLock){
        document.exitPointerLock();
    }


    const screen =
        document.getElementById(
            "startScreen"
        );


    screen.style.display =
        "flex";


    screen.innerHTML =
        `
        <h1>☠ GAME OVER</h1>

        <p>
            웨이브 ${wave}
        </p>

        <p>
            처치 ${player.kills}
        </p>

        <button
            id="restartButton"
        >
            다시 시작
        </button>
        `;


    document.getElementById(
        "restartButton"
    ).onclick =
        function(){

            location.reload();
        };
}


/* =========================================================
   전체 업데이트
========================================================= */

// Sky flare: exactly three seconds of real-time illumination.
const flareLight=new THREE.PointLight(0xffedd1,0,0,0);scene.add(flareLight);
const flareFill=new THREE.HemisphereLight(0xe2efff,0xa29577,0);scene.add(flareFill);
const flareGroup=new THREE.Group();scene.add(flareGroup);flareGroup.visible=false;
const flareMat=new THREE.MeshBasicMaterial({color:0xfff3d0,transparent:true,opacity:1});
const flareCore=new THREE.Mesh(new THREE.SphereGeometry(.55,16,12),flareMat);flareGroup.add(flareCore);
const sparks=[];for(let i=0;i<36;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.09,6,4),flareMat);flareGroup.add(m);sparks.push({mesh:m,angle:Math.random()*Math.PI*2,speed:2+Math.random()*6,vy:Math.random()*6});}
const flareHUD=document.createElement('div');flareHUD.style.cssText='position:fixed;left:50%;top:24px;transform:translateX(-50%);color:#ffe3a3;background:#111b;padding:10px 20px;border:1px solid #978558;border-radius:8px;z-index:25;font-size:18px;pointer-events:none';flareHUD.textContent='T · 하늘 섬광탄';document.body.appendChild(flareHUD);
let flareStart=-Infinity;
function launchFlare(){
    if(!gameStarted||gameOver)return;
    flareStart=performance.now();
    flareGroup.position.set(player.x-Math.sin(player.yaw)*16,player.y+22,player.z-Math.cos(player.yaw)*16);flareLight.position.copy(flareGroup.position);flareGroup.visible=true;
}
function updateFlare(){
    const t=(performance.now()-flareStart)/1000,active=t<3;
    flareGroup.visible=active;flareLight.intensity=active?85:0;flareFill.intensity=active?2.8:0;
    hemi.intensity=active?1.25:.48;sun.intensity=active?2.2:.65;
    scene.background.setHex(active?0x667b90:0x131e2c);scene.fog.color.copy(scene.background);
    if(active){flareHUD.textContent='섬광탄 · '+(3-t).toFixed(1)+'초';flareCore.scale.setScalar(1+.12*Math.sin(t*18));sparks.forEach(s=>{s.mesh.position.set(Math.cos(s.angle)*s.speed*t,s.vy*t-1.8*t*t,Math.sin(s.angle)*s.speed*t);});}
    else flareHUD.textContent='T · 하늘 섬광탄 (3초)';
}
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
function update(){
    updateFlare();

    if(!gameStarted){
        return;
    }


    if(
        player.shootCooldown > 0
    ){

        player.shootCooldown--;
    }


    updateReload();

    updatePlayer();

    updateZombies();

    updateBullets();

    updateHint();

    updateHUD();

    updateWeaponHUD();

    checkWave();
}


/* =========================================================
   창 크기 변경
========================================================= */

window.addEventListener(
    "resize",
    function(){

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);


/* =========================================================
   초기 HUD
========================================================= */

updateHUD();

updateWeaponHUD();


/* =========================================================
   메인 루프
========================================================= */

function gameLoop(){

    requestAnimationFrame(
        gameLoop
    );


    update();


    renderer.render(
        scene,
        camera
    );
}


gameLoop();
