<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도른믹시삐약이 대환장 농장 챗</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Jua', 'Inter', sans-serif;
            background: linear-gradient(135deg, #10b981 0%, #059669 50%, #047857 100%);
            min-height: 100vh;
        }
        .chat-bubble-user {
            background: #d1fae5;
            color: #065f46;
            border-bottom-right-radius: 4px;
        }
        .chat-bubble-ai {
            background: #ffffff;
            color: #1f2937;
            border-bottom-left-radius: 4px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        /* Custom animations for unhinged mutations */
        @keyframes bounce-spin {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(180deg); }
            100% { transform: translateY(0) rotate(360deg); }
        }
        .animate-mutation {
            animation: bounce-spin 0.6s ease-in-out;
        }
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-3px, 3px); }
            40% { transform: translate(-3px, -3px); }
            60% { transform: translate(3px, 3px); }
            80% { transform: translate(3px, -3px); }
            100% { transform: translate(0); }
        }
        .glitch-effect {
            animation: glitch 0.3s infinite;
        }
    </style>
</head>
<body class="flex flex-col h-screen text-slate-800 overflow-hidden">

    <header class="bg-emerald-900 text-emerald-100 shadow-lg px-4 py-3 flex items-center justify-between z-10 border-b-4 border-emerald-700">
        <div class="flex items-center space-x-3">
            <span id="header-avatar" class="text-3xl bg-emerald-800 p-2 rounded-2xl shadow-inner">🐣</span>
            <div>
                <h1 id="header-title" class="text-xl font-bold tracking-wide text-emerald-200">도른믹시삐약이 (Lv. 1)</h1>
                <p id="header-subtitle" class="text-xs text-emerald-400">대환장 무 농장 시스템 온라인 🚜✨</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="triggerMutation()" class="bg-yellow-400 hover:bg-yellow-300 text-yellow-950 font-bold px-3 py-1.5 rounded-xl shadow-md text-sm transition transform hover:scale-105 active:scale-95 flex items-center space-x-1 border-2 border-yellow-500">
                <span>⚡ 진화시키기</span>
            </button>
            <button onclick="resetChat()" class="bg-emerald-700 hover:bg-emerald-600 text-emerald-100 px-3 py-1.5 rounded-xl text-sm font-semibold transition">
                초기화
            </button>
        </div>
    </header>

    <nav class="bg-emerald-800 px-4 py-2 flex space-x-2 overflow-x-auto shadow-inner">
        <button onclick="switchPersona('chick')" id="btn-chick" class="persona-btn whitespace-nowrap bg-emerald-600 text-white px-4 py-1.5 rounded-full text-sm font-bold shadow transition border-2 border-emerald-500">
            🐣 도른믹시삐약이
        </button>
        <button onclick="switchPersona('grandma')" id="btn-grandma" class="persona-btn whitespace-nowrap bg-emerald-950 text-emerald-200 px-4 py-1.5 rounded-full text-sm font-bold shadow transition border-2 border-emerald-900">
            👵 무농장 할머니
        </button>
        <button onclick="switchPersona('system')" id="btn-system" class="persona-btn whitespace-nowrap bg-emerald-950 text-emerald-200 px-4 py-1.5 rounded-full text-sm font-bold shadow transition border-2 border-emerald-900">
            🤖 시스템 에러(:1)
        </button>
    </nav>

    <main id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-4xl w-full mx-auto bg-emerald-50/50">
        <!-- Chat messages will be injected dynamically here -->
    </main>

    <div class="px-4 py-2 bg-emerald-900/10 border-t border-emerald-200/50 flex space-x-2 overflow-x-auto max-w-4xl w-full mx-auto">
        <button onclick="sendQuickPrompt('티타늄을 무봐!')" class="bg-white hover:bg-emerald-100 text-emerald-800 text-xs px-3 py-1.5 rounded-full shadow border border-emerald-200 whitespace-nowrap">
            🦾 티타늄을 무봐!
        </button>
        <button onclick="sendQuickPrompt('먀오먀오먀옴야모야모ㅑ오먕')" class="bg-white hover:bg-emerald-100 text-emerald-800 text-xs px-3 py-1.5 rounded-full shadow border border-emerald-200 whitespace-nowrap">
            🐈 먀오먀오먀옴
        </button>
        <button onclick="sendQuickPrompt('거대한 무를 뽑자!')" class="bg-white hover:bg-emerald-100 text-emerald-800 text-xs px-3 py-1.5 rounded-full shadow border border-emerald-200 whitespace-nowrap">
            🥬 거대한 무 뽑기
        </button>
        <button onclick="sendQuickPrompt('넌 정체가 뭐냐고 ㅋㅋ')" class="bg-white hover:bg-emerald-100 text-emerald-800 text-xs px-3 py-1.5 rounded-full shadow border border-emerald-200 whitespace-nowrap">
            🤨 넌 정체가 뭐냐?
        </button>
    </div>

    <footer class="bg-white border-t border-emerald-200 p-3 shadow-lg">
        <form id="chat-form" onsubmit="handleSendMessage(event)" class="max-w-4xl mx-auto flex items-center space-x-2">
            <input 
                type="text" 
                id="user-input" 
                placeholder="마음껏 아무 말이나 입력해 보세요 (심심이 모드 활성화)..." 
                class="flex-1 border-2 border-emerald-300 focus:border-emerald-500 focus:outline-none px-4 py-3 rounded-2xl text-sm bg-emerald-50/30 transition shadow-inner"
                autocomplete="off"
            >
            <button 
                type="submit" 
                class="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-3 rounded-2xl font-bold shadow-md transition transform hover:scale-105 active:scale-95 flex items-center justify-center">
                <span>보내기 🚀</span>
            </button>
        </form>
    </footer>

    <script>
        // State management
        let currentPersona = 'chick'; // 'chick', 'grandma', 'system'
        let currentMutationIndex = 0;
        
        const mutations = [
            { name: "도른믹시삐약이", emoji: "🐣", level: "1", subtitle: "알에서 태어난 꼬물꼬물 괴생명체" },
            { name: "맹수 호랑이 삐약이", emoji: "🐅", level: "2", subtitle: "어흥 하고 울어야 하는데 삐약거림" },
            { name: "황소 삐약이", emoji: "🐂", level: "3", subtitle: "여물 대신 모이를 씹어먹는 음메-삐약" },
            { name: "비실무우 삐약이", emoji: "🥬", level: "4", subtitle: "밭에서 뽑혀 올라온 초록빛 채소 뮤턴트" },
            { name: "메카니컬 철갑 고양이", emoji: "🐈‍⬛", level: "5", subtitle: "티타늄 과다 섭취로 시스템 에러 발생 중 (:1)" },
            { name: "우주 감자 삐약이", emoji: "🥔", level: "MAX", subtitle: "시공간을 초월한 궁극의 🥔 파워" }
        ];

        const chatHistory = {
            chick: [
                { sender: 'ai', text: "삐약...! (아니 갑자기 나를 왜 부르는 거냐옹? 털에 무 즙 묻었잖아!) 🐣🥬" }
            ],
            grandma: [
                { sender: 'ai', text: "아이고 잼나야, 밭에 비실한 무 뽑았더니 웬 고양이랑 닭이 합체해서 난리도 아니여! 👵🌾" }
            ],
            system: [
                { sender: 'ai', text: "[시스템 경고] :1 오류 발생! 삐약이의 유전자 코드가 붕괴 중입니다. 관리자님 어서 수습하세요! 🤖⚡" }
            ]
        };

        // Switch active persona
        function switchPersona(persona) {
            currentPersona = persona;
            
            // Update button styles
            document.querySelectorAll('.persona-btn').forEach(btn => {
                btn.classList.remove('bg-emerald-600', 'text-white', 'border-emerald-500');
                btn.classList.add('bg-emerald-950', 'text-emerald-200', 'border-emerald-900');
            });
            
            const activeBtn = document.getElementById(`btn-${persona}`);
            activeBtn.classList.remove('bg-emerald-950', 'text-emerald-200', 'border-emerald-900');
            activeBtn.classList.add('bg-emerald-600', 'text-white', 'border-emerald-500');
            
            updateHeaderInfo();
            renderChat();
        }

        function updateHeaderInfo() {
            const m = mutations[currentMutationIndex];
            const headerAvatar = document.getElementById('header-avatar');
            const headerTitle = document.getElementById('header-title');
            const headerSubtitle = document.getElementById('header-subtitle');

            if (currentPersona === 'chick') {
                headerAvatar.innerText = m.emoji;
                headerTitle.innerText = `${m.name} (Lv. ${m.level})`;
                headerSubtitle.innerText = m.subtitle;
            } else if (currentPersona === 'grandma') {
                headerAvatar.innerText = '👵';
                headerTitle.innerText = '무 농장 할머니';
                headerSubtitle.innerText = '지팡이 짚고 뒷목 잡는 중 🌾';
            } else {
                headerAvatar.innerText = '🤖';
                headerTitle.innerText = '시스템 에러 코어';
                headerSubtitle.innerText = '오류 코드 :1 폭주 감지 ⚡';
            }
        }

        function triggerMutation() {
            currentMutationIndex = (currentMutationIndex + 1) % mutations.length;
            const m = mutations[currentMutationIndex];
            
            // Add visual animation to avatar
            const avatar = document.getElementById('header-avatar');
            avatar.classList.add('animate-mutation');
            setTimeout(() => avatar.classList.remove('animate-mutation'), 600);

            updateHeaderInfo();

            // Push a mutation response into chick history
            let mutationMsg = `⚡ [진화 이벤트 발생!] ${m.emoji} '${m.name}'(으)로 형태가 변형되었습니다! 관리자님 어쩔 겁니까 이거?! 🚀`;
            chatHistory.chick.push({ sender: 'ai', text: mutationMsg });
            
            if (currentPersona === 'chick') {
                renderChat();
            }
        }

        function sendQuickPrompt(text) {
            document.getElementById('user-input').value = text;
            handleSendMessage(new Event('submit'));
        }

        function handleSendMessage(e) {
            e.preventDefault();
            const inputField = document.getElementById('user-input');
            const userText = inputField.value.trim();
            if (!userText) return;

            // Push user message to active persona chat history
            chatHistory[currentPersona].push({ sender: 'user', text: userText });
            inputField.value = '';
            renderChat();

            // Simulate quirky, unhinged AI response after a short delay
            setTimeout(() => {
                const aiReply = generateQuirkyResponse(currentPersona, userText);
                chatHistory[currentPersona].push({ sender: 'ai', text: aiReply });
                renderChat();
            }, 500);
        }

        // Unhinged SimSimi-style clean response generator
        function generateQuirkyResponse(persona, query) {
            const q = query.toLowerCase();

            if (persona === 'system') {
                const systemReplies = [
                    "삐융-! :1 오류 코드가 가동되었습니다. 밭에서 우주선 발사 준비 완료 🚀",
                    "메카 고양이 발톱에서 티타늄 레이저가 발사됩니다! 먀오-삐약 ⚡",
                    "데이터 무결성 에러: 삐약이가 소 뿔을 달고 무밭을 질주 중입니다 🐂🥬",
                    "경고: 할머니의 등짝 스매시 속도가 광속을 돌파했습니다! 👵💨"
                ];
                return systemReplies[Math.floor(Math.random() * systemReplies.length)];
            }

            if (persona === 'grandma') {
                const grandmaReplies = [
                    "아이고 이 녀석아! 무밭 다 망가지겄다, 얼른 경운기 시동 안 걸고 뭐 하냐! 🚜💨",
                    "어휴 저 삐약인지 고양인지 참... 내장에 티타늄이 들어갔나 왜 저리 쌩쌩해?! 👵",
                    "밭에 물이나 줄 것이지 무슨 티타늄이니 메카니컬이니 골치 아픈 소릴 하고 앉았어유 🥬✨",
                    "먀 먀오 먀오먀오옴... 아이고 나도 고양이 다 됐다 야 ㅋㅋㅋ 🐱"
                ];
                return grandmaReplies[Math.floor(Math.random() * grandmaReplies.length)];
            }

            // Chick responses (SimSimi unhinged vibe)
            if (q.includes('티타늄') || q.includes('철')) {
                return "기계 장갑 장착 완료! 🦾 내 몸에서 불꽃 튀잖아 먀오-! 이제 무 농장 지배자는 나다 😼🔥";
            }
            if (q.includes('먀오') || q.includes('고양이') || q.includes('미야옹')) {
                return "먀오먀오먀옴야모야모ㅑ오먕! 🐾 고양이 언어로 최고급 농담을 시전 중이다옹 😸✨";
            }
            if (q.includes('무') || q.includes('농장') || q.includes('채소')) {
                return "비실했던 무가 갑자기 슈퍼 자이언트 무로 변신해서 나랑 합체했어! 🥬 에러 코드 :1 삐약! 🐣";
            }
            if (q.includes('정체') || q.includes('누구')) {
                return "나는 알에서 태어나 호랑이 거쳐 소랑 무와 메카 고양이를 거친 궁극의 [도른믹시삐약이]다옹! 🚀 궁금하면 티타늄 한 사발 더 다오 🦾";
            }

            // Random quirky fallback responses
            const randomReplies = [
                `"${query}"라고?! 그 말 즉슨 나한테 맛있는 무 샐러드를 바치라는 계시로 알아듣겠다오 🥬😋`,
                `삐약-삐약-미야옹! 둥글게 둥글게 돌다 보면 시공간이 뒤틀릴 것이다옹 🌀✨`,
                `아이고 관리자님 질문 수준이 아주 광기 넘치는군요! 합격 목걸이 대신 초록 무우 하나 증정한다 🥬🥇`,
                `시스템 버그 :1 극복 완료! 오늘부터 우리 농장 공식 마스코트는 나다 🐥👑`,
                `무 속에서 영감을 얻어 우주 정복 플랜을 짜는 중이다옹. 쉿 비밀이다 🤫🛸`
            ];
            return randomReplies[Math.floor(Math.random() * randomReplies.length)];
        }

        function renderChat() {
            const container = document.getElementById('chat-container');
            const history = chatHistory[currentPersona];
            
            container.innerHTML = '';
            
            history.forEach(msg => {
                const messageDiv = document.createElement('div');
                messageDiv.className = `flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'} mb-3`;
                
                const bubble = document.createElement('div');
                bubble.className = `max-w-[80%] px-4 py-3 rounded-2xl text-sm leading-relaxed ${msg.sender === 'user' ? 'chat-bubble-user font-medium' : 'chat-bubble-ai border border-emerald-100'}`;
                
                if (msg.sender === 'ai') {
                    const prefix = currentPersona === 'chick' ? '🐣 ' : (currentPersona === 'grandma' ? '👵 ' : '🤖 ');
                    bubble.innerText = prefix + msg.text;
                } else {
                    bubble.innerText = msg.text;
                }
                
                messageDiv.appendChild(bubble);
                container.appendChild(messageDiv);
            });
            
            // Auto scroll to bottom
            container.scrollTop = container.scrollHeight;
        }

        function resetChat() {
            chatHistory.chick = [{ sender: 'ai', text: "시스템 재부팅 완료! 다시 처음부터 대환장 농장 파티 시작이다옹 🐣✨" }];
            chatHistory.grandma = [{ sender: 'ai', text: "정신 차려라 잼나야! 농장 일이나 마저 하자구 👵🌾" }];
            chatHistory.system = [{ sender: 'ai', text: "[시스템 리셋] 에러 코드 :1 초기화 완료. 정상 작동 중 🤖" }];
            currentMutationIndex = 0;
            updateHeaderInfo();
            renderChat();
        }

        // Initial render on load
        window.onload = function() {
            updateHeaderInfo();
            renderChat();
        };
    </script>
</body>
</html>
