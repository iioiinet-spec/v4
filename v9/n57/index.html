<!DOCTYPE html>
<html lang="ko">
<head>
    <!-- 한글이 깨지지 않게 설정합니다. -->
    <meta charset="UTF-8">
    <!-- 휴대폰에서도 화면이 알맞게 보이도록 설정합니다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 브라우저 탭 이름입니다. -->
    <title>나의 시간표</title>

    <!-- 구글 폰트 고운돋움을 불러옵니다. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <!-- 구글 폰트 연결을 빠르게 합니다. -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- 고운돋움 폰트를 적용하기 위한 링크입니다. -->
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">

    <style>
        /* 색상과 디자인 값을 한곳에서 관리합니다. */
        :root {
            --bg-color: #12161f; /* 전체 페이지의 배경색입니다. */
            --card-color: #1b2130; /* 카드와 시간표 칸의 색상입니다. */
            --text-color: #e8ecf7; /* 기본 글자의 색상입니다. */
            --point-color: #7be0c8; /* 강조할 때 사용하는 포인트 색상입니다. */
            --border-color: #2b3447; /* 테두리에 사용하는 색상입니다. */
            --muted-color: #9ca6ba; /* 보조 글자에 사용하는 색상입니다. */
            --radius: 14px; /* 모서리를 둥글게 만드는 정도입니다. */
        }

        /* 페이지 전체의 기본 디자인입니다. */
        body {
            margin: 0;
            padding: 30px 20px;
            background: var(--bg-color);
            color: var(--text-color);
            font-family: 'Gowun Dodum', sans-serif;
        }

        /* 전체 내용을 가운데 정렬합니다. */
        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* D-Day 영역의 카드 디자인입니다. */
        .dday {
            padding: 40px 20px;
            background: var(--card-color);
            border-radius: var(--radius);
            text-align: center;
            margin-bottom: 24px;
        }

        /* 제목의 디자인입니다. */
        .title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        /* 목표 이름의 디자인입니다. */
        .goal-label {
            color: var(--muted-color);
            font-size: 18px;
        }

        /* D-Day 숫자를 크게 표시합니다. */
        .dday-number {
            margin: 10px 0;
            color: var(--point-color);
            font-size: 64px;
            font-weight: bold;
        }

        /* 목표 날짜의 디자인입니다. */
        .target-date {
            color: var(--muted-color);
            font-size: 16px;
        }

        /* 시간표 영역의 카드 디자인입니다. */
        .schedule {
            padding: 24px;
            background: var(--card-color);
            border-radius: var(--radius);
        }

        /* 시간표 제목의 디자인입니다. */
        h2 {
            margin-top: 0;
            margin-bottom: 20px;
        }

        /* 시간표가 화면 밖으로 넘어갈 때 가로 스크롤을 사용합니다. */
        .table-wrapper {
            overflow-x: auto;
        }

        /* 시간표 테이블의 기본 디자인입니다. */
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
        }

        /* 표의 모든 칸에 테두리를 적용합니다. */
        th,
        td {
            padding: 16px 12px;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        /* 표의 제목 칸을 강조합니다. */
        th {
            color: var(--point-color);
            background: var(--bg-color);
        }

        /* 시간표 칸에 마우스를 올렸을 때의 디자인입니다. */
        td:hover {
            background: var(--bg-color);
        }

        /* 현재 교시를 강조하는 테두리입니다. */
        .current-period {
            outline: 3px solid var(--point-color);
            outline-offset: -3px;
        }

        /* 주말 안내 문구의 디자인입니다. */
        .weekend-message {
            margin-top: 16px;
            color: var(--point-color);
            font-size: 18px;
            font-weight: bold;
            text-align: center;
        }

        /* 작은 화면에서도 보기 좋게 조정합니다. */
        @media (max-width: 600px) {
            /* 작은 화면에서 D-Day 숫자를 조금 줄입니다. */
            .dday-number {
                font-size: 48px;
            }

            /* 작은 화면에서 카드 여백을 줄입니다. */
            .schedule {
                padding: 16px;
            }
        }
    </style>
</head>

<body>
    <!-- 전체 내용을 담는 영역입니다. -->
    <div class="container">

        <!-- D-Day를 보여주는 영역입니다. -->
        <section class="dday">
            <!-- 제목이 표시되는 곳입니다. -->
            <div class="title" id="title"></div>
            <!-- 목표 이름이 표시되는 곳입니다. -->
            <div class="goal-label" id="goalLabel"></div>
            <!-- D-Day 숫자가 표시되는 곳입니다. -->
            <div class="dday-number" id="ddayNumber"></div>
            <!-- 목표 날짜가 표시되는 곳입니다. -->
            <div class="target-date" id="targetDate"></div>
        </section>

        <!-- 시간표를 보여주는 영역입니다. -->
        <section class="schedule">
            <!-- 시간표 제목입니다. -->
            <h2>월~금 시간표</h2>

            <!-- 주말일 때 쉬는 날 문구가 표시됩니다. -->
            <div id="weekendMessage" class="weekend-message"></div>

            <!-- 시간표가 들어가는 영역입니다. -->
            <div class="table-wrapper">
                <!-- 시간표 테이블입니다. -->
                <table>
                    <!-- 요일 제목 부분입니다. -->
                    <thead>
                        <tr>
                            <!-- 교시와 시간을 표시합니다. -->
                            <th>교시 / 시간</th>
                            <!-- 월요일을 표시합니다. -->
                            <th id="day0"></th>
                            <!-- 화요일을 표시합니다. -->
                            <th id="day1"></th>
                            <!-- 수요일을 표시합니다. -->
                            <th id="day2"></th>
                            <!-- 목요일을 표시합니다. -->
                            <th id="day3"></th>
                            <!-- 금요일을 표시합니다. -->
                            <th id="day4"></th>
                        </tr>
                    </thead>

                    <!-- 실제 시간표 내용이 들어가는 부분입니다. -->
                    <tbody id="scheduleBody"></tbody>
                </table>
            </div>
        </section>
    </div>

    <script>
        // ============================================================
        // 여기만 고치세요
        // ============================================================

        // 페이지의 제목입니다.
        const TITLE = '나의 시간표';

        // 목표 이름과 날짜입니다.
        const TARGET = {
            label: '목표',
            date: '2026-12-10'
        };

        // 시간표에 표시할 요일입니다.
        const DAYS = ['월', '화', '수', '목', '금'];

        // 각 교시의 시간과 과목입니다.
        const PERIODS = [
            { time: '09:00', subjects: ['영어', '미술', '중국어', '체육', '가정'] },
            { time: '10:00', subjects: ['스클', '과학', '체육', '중국어', '영독'] },
            { time: '11:00', subjects: ['가정', '진로', '수학', '미술', '포고'] },
            { time: '13:00', subjects: ['사회', '음악', '과학', '사회', '과학'] },
            { time: '14:00', subjects: ['수학', '국어', '영어', '국어', '체육'] }
        ];

        // ============================================================
        // 여기부터는 자동으로 작동합니다.
        // ============================================================

        // 브라우저 탭 제목을 설정합니다.
        document.title = TITLE;

        // 화면에 제목을 표시합니다.
        document.getElementById('title').textContent = TITLE;

        // 화면에 목표 이름을 표시합니다.
        document.getElementById('goalLabel').textContent = TARGET.label;

        // 목표 날짜를 날짜 객체로 만듭니다.
        const targetDate = new Date(TARGET.date + 'T00:00:00');

        // 현재 날짜와 시간을 가져옵니다.
        const today = new Date();

        // 오늘 날짜의 시간을 0시로 맞춥니다.
        today.setHours(0, 0, 0, 0);

        // 목표 날짜와 오늘 날짜의 차이를 계산합니다.
        const difference = targetDate - today;

        // 하루를 밀리초로 계산합니다.
        const oneDay = 1000 * 60 * 60 * 24;

        // 남은 날짜를 계산합니다.
        const daysLeft = Math.ceil(difference / oneDay);

        // D-Day 숫자를 표시할 요소를 가져옵니다.
        const ddayNumber = document.getElementById('ddayNumber');

        // 오늘이 목표 날짜인지 확인합니다.
        if (daysLeft === 0) {
            // 목표 날짜이면 D-DAY를 표시합니다.
            ddayNumber.textContent = 'D-DAY';

        // 목표 날짜가 지났는지 확인합니다.
        } else if (daysLeft < 0) {
            // 목표 날짜가 지난 경우 D+날짜를 표시합니다.
            ddayNumber.textContent = `D+${Math.abs(daysLeft)}`;

        // 목표 날짜가 아직 남았는지 확인합니다.
        } else {
            // 남은 날짜를 D-날짜로 표시합니다.
            ddayNumber.textContent = `D-${daysLeft}`;
        }

        // 목표 날짜를 화면에 표시합니다.
        document.getElementById('targetDate').textContent =
            `목표 날짜: ${TARGET.date}`;

        // 월요일부터 금요일까지 화면에 표시합니다.
        DAYS.forEach((day, index) => {
            // 해당 요일 칸에 요일 이름을 넣습니다.
            document.getElementById(`day${index}`).textContent = day;
        });

        // 시간표 내용이 들어갈 영역을 가져옵니다.
        const scheduleBody = document.getElementById('scheduleBody');

        // 모든 교시를 하나씩 화면에 만듭니다.
        PERIODS.forEach((period, periodIndex) => {
            // 새로운 행을 만듭니다.
            const row = document.createElement('tr');

            // 시간 칸을 만듭니다.
            const timeCell = document.createElement('td');

            // 교시 번호와 시간을 표시합니다.
            timeCell.textContent =
                `${periodIndex + 1}교시 / ${period.time}`;

            // 시간 칸을 행에 추가합니다.
            row.appendChild(timeCell);

            // 월요일부터 금요일까지 과목을 추가합니다.
            DAYS.forEach((day, dayIndex) => {
                // 과목 칸을 만듭니다.
                const subjectCell = document.createElement('td');

                // 해당 요일의 과목을 표시합니다.
                subjectCell.textContent = period.subjects[dayIndex];

                // 과목 칸을 행에 추가합니다.
                row.appendChild(subjectCell);
            });

            // 완성된 행을 시간표에 추가합니다.
            scheduleBody.appendChild(row);
        });

        // 현재 교시를 찾아서 강조하는 함수입니다.
        function updateCurrentPeriod() {
            // 현재 날짜와 시간을 가져옵니다.
            const now = new Date();

            // 현재 요일을 가져옵니다.
            // 일요일은 0, 월요일은 1, 토요일은 6입니다.
            const dayOfWeek = now.getDay();

            // 주말 문구를 표시할 요소를 가져옵니다.
            const weekendMessage =
                document.getElementById('weekendMessage');

            // 기존에 강조된 모든 칸의 강조를 제거합니다.
            document.querySelectorAll('.current-period').forEach(cell => {
                cell.classList.remove('current-period');
            });

            // 토요일이나 일요일인지 확인합니다.
            if (dayOfWeek === 0 || dayOfWeek === 6) {
                // 주말이면 쉬는 날 문구를 표시합니다.
                weekendMessage.textContent = '오늘은 쉬는 날';

                // 주말에는 교시 강조를 하지 않고 함수를 끝냅니다.
                return;
            }

            // 평일이면 주말 문구를 지웁니다.
            weekendMessage.textContent = '';

            // 자바스크립트의 요일 번호를 시간표의 번호로 바꿉니다.
            // 월요일은 0, 화요일은 1, 금요일은 4가 됩니다.
            const dayIndex = dayOfWeek - 1;

            // 현재 시각을 분 단위로 계산합니다.
            const currentMinutes =
                now.getHours() * 60 + now.getMinutes();

            // 모든 교시를 확인합니다.
            PERIODS.forEach((period, periodIndex) => {
                // 교시 시작 시간을 시와 분으로 나눕니다.
                const [hour, minute] =
                    period.time.split(':').map(Number);

                // 교시 시작 시간을 분으로 계산합니다.
                const periodStart = hour * 60 + minute;

                // 다음 교시를 가져옵니다.
                const nextPeriod = PERIODS[periodIndex + 1];

                // 다음 교시가 있으면 다음 교시 시작을 끝 시간으로 사용합니다.
                // 마지막 교시는 자정까지를 끝 시간으로 사용합니다.
                const periodEnd = nextPeriod
                    ? nextPeriod.time.split(':').map(Number)[0] * 60 +
                      nextPeriod.time.split(':').map(Number)[1]
                    : 24 * 60;

                // 현재 시간이 해당 교시인지 확인합니다.
                if (
                    currentMinutes >= periodStart &&
                    currentMinutes < periodEnd
                ) {
                    // 시간표의 모든 행을 가져옵니다.
                    const rows =
                        document.querySelectorAll('#scheduleBody tr');

                    // 현재 교시의 행에 있는 모든 칸을 가져옵니다.
                    const cells =
                        rows[periodIndex]?.querySelectorAll('td');

                    // 현재 요일의 과목 칸에 강조 표시를 추가합니다.
                    cells?.[dayIndex + 1]?.classList.add('current-period');
                }
            });
        }

        // 페이지를 처음 열었을 때 현재 교시를 바로 확인합니다.
        updateCurrentPeriod();

        // 1분마다 현재 교시를 다시 확인합니다.
        setInterval(updateCurrentPeriod, 60 * 1000);
    </script>
</body>
</html>
