<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시야 방해 벽돌 깨기</title>

  <style>
    :root {
      --bg: #11151d;
      --game-bg: #080b10;
      --text: #ffffff;
      --accent: #7be0c8;
      --brick: #d88af5;
      --paddle: #7be0c8;
      --ball: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .game-wrap {
      width: min(900px, 95vw);
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      color: var(--accent);
    }

    .info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 18px;
    }

    canvas {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: var(--game-bg);
      border: 3px solid var(--accent);
      border-radius: 10px;
      display: block;
      box-shadow: 0 0 30px rgba(123, 224, 200, 0.15);
    }

    .help {
      margin-top: 12px;
      color: #aaa;
    }

    button {
      margin-top: 12px;
      padding: 10px 22px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #11151d;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      filter: brightness(1.1);
    }

    /* 시야 방해 */
    #blindOverlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      pointer-events: none;

      background: rgba(255, 255, 255, 0.58);

      /* 시야 방해 40px blur */
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);

      box-shadow:
        inset 0 0 180px rgba(255, 255, 255, 0.9);
    }

    #blindText {
      position: absolute;
      inset: 0;

      display: flex;
      justify-content: center;
      align-items: center;

      color: rgba(20, 20, 20, 0.72);
      font-size: clamp(24px, 5vw, 60px);
      font-weight: bold;

      text-shadow:
        0 0 18px rgba(255, 255, 255, 1);

      filter: blur(4px);
    }

    #startMessage {
      margin-top: 8px;
      color: var(--accent);
      font-size: 15px;
    }
  </style>
</head>

<body>

  <div id="blindOverlay">
    <div id="blindText">👀 시야 방해!</div>
  </div>

  <div class="game-wrap">

    <h1>🧱 시야 방해 벽돌 깨기</h1>

    <div class="info">
      <span>점수: <b id="score">0</b></span>
      <span>목숨: <b id="lives">3</b></span>
    </div>

    <canvas id="game"></canvas>

    <div class="help">
      ← → 방향키로 패들을 움직이세요
    </div>

    <button id="restart">
      게임 시작 / 다시 시작
    </button>

    <div id="startMessage">
      버튼을 눌러 게임을 시작하세요
    </div>

  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    const scoreText =
      document.getElementById('score');

    const livesText =
      document.getElementById('lives');

    const restartButton =
      document.getElementById('restart');

    const blindOverlay =
      document.getElementById('blindOverlay');

    const blindText =
      document.getElementById('blindText');

    const startMessage =
      document.getElementById('startMessage');


    /* =========================
       캔버스
    ========================= */

    const W = 900;
    const H = 500;

    canvas.width = W;
    canvas.height = H;


    /* =========================
       게임 변수
    ========================= */

    let ball;
    let paddle;
    let bricks;

    let score = 0;
    let lives = 3;

    let running = false;
    let gameOver = false;

    let blindTimer = null;
    let blindEndTimer = null;

    let keys = {
      left: false,
      right: false
    };


    /* =========================
       벽돌 설정
    ========================= */

    const brickRows = 6;
    const brickCols = 10;

    const brickWidth = 76;
    const brickHeight = 24;

    const brickGap = 8;

    const brickStartX = 25;
    const brickStartY = 50;


    /* =========================
       게임 초기화
    ========================= */

    function initGame() {

      score = 0;
      lives = 3;

      scoreText.textContent = score;
      livesText.textContent = lives;

      paddle = {
        width: 130,
        height: 16,
        x: W / 2 - 65,
        y: H - 35,
        speed: 8
      };

      ball = {
        x: W / 2,
        y: H - 65,
        radius: 8,

        /* 공속도 3 */
        speedX: 3,
        speedY: -3
      };

      bricks = [];

      for (let row = 0; row < brickRows; row++) {

        for (let col = 0; col < brickCols; col++) {

          bricks.push({
            x:
              brickStartX +
              col * (brickWidth + brickGap),

            y:
              brickStartY +
              row * (brickHeight + brickGap),

            width: brickWidth,
            height: brickHeight,

            alive: true,

            color:
              row % 2 === 0
                ? '#d88af5'
                : '#7be0c8'
          });
        }
      }

      gameOver = false;
      running = false;

      clearTimeout(blindTimer);
      clearTimeout(blindEndTimer);

      blindOverlay.style.display = 'none';

      startMessage.textContent =
        '버튼을 눌러 게임을 시작하세요';

      draw();
    }


    /* =========================
       게임 시작
    ========================= */

    function startGame() {

      if (running) {
        return;
      }

      running = true;
      gameOver = false;

      startMessage.textContent =
        '게임 진행 중!';

      scheduleBlindEvent();
    }


    /* =========================
       키보드
    ========================= */

    document.addEventListener(
      'keydown',
      event => {

        if (!running) {
          return;
        }

        if (event.key === 'ArrowLeft') {
          keys.left = true;
          event.preventDefault();
        }

        if (event.key === 'ArrowRight') {
          keys.right = true;
          event.preventDefault();
        }
      }
    );


    document.addEventListener(
      'keyup',
      event => {

        if (event.key === 'ArrowLeft') {
          keys.left = false;
        }

        if (event.key === 'ArrowRight') {
          keys.right = false;
        }
      }
    );


    /* =========================
       게임 업데이트
    ========================= */

    function update() {

      if (!running || gameOver) {
        return;
      }


      /* 패들 */

      if (keys.left) {
        paddle.x -= paddle.speed;
      }

      if (keys.right) {
        paddle.x += paddle.speed;
      }

      if (paddle.x < 0) {
        paddle.x = 0;
      }

      if (paddle.x + paddle.width > W) {
        paddle.x = W - paddle.width;
      }


      /* 공 */

      ball.x += ball.speedX;
      ball.y += ball.speedY;


      /* 좌우 벽 */

      if (
        ball.x - ball.radius <= 0 ||
        ball.x + ball.radius >= W
      ) {
        ball.speedX *= -1;
      }


      /* 위쪽 벽 */

      if (ball.y - ball.radius <= 0) {
        ball.speedY *= -1;
      }


      /* 패들 충돌 */

      if (
        ball.y + ball.radius >= paddle.y &&
        ball.y - ball.radius <=
          paddle.y + paddle.height &&
        ball.x >= paddle.x &&
        ball.x <=
          paddle.x + paddle.width &&
        ball.speedY > 0
      ) {

        const hitPosition =
          (ball.x -
            (paddle.x + paddle.width / 2)) /
          (paddle.width / 2);

        ball.speedX =
          hitPosition * 5;

        ball.speedY =
          -Math.abs(ball.speedY);
      }


      /* 벽돌 충돌 */

      for (const brick of bricks) {

        if (!brick.alive) {
          continue;
        }

        if (
          ball.x + ball.radius > brick.x &&
          ball.x - ball.radius <
            brick.x + brick.width &&
          ball.y + ball.radius > brick.y &&
          ball.y - ball.radius <
            brick.y + brick.height
        ) {

          brick.alive = false;

          ball.speedY *= -1;

          score += 10;

          scoreText.textContent = score;

          break;
        }
      }


      /* 공이 떨어짐 */

      if (ball.y - ball.radius > H) {

        lives--;

        livesText.textContent = lives;

        if (lives <= 0) {

          gameOver = true;
          running = false;

          clearTimeout(blindTimer);
          clearTimeout(blindEndTimer);

          blindOverlay.style.display = 'none';

          startMessage.textContent =
            '게임 오버! 버튼을 눌러 다시 시작하세요';

        } else {

          ball.x = W / 2;
          ball.y = H - 65;

          /* 재시작 공속도 3 */
          ball.speedX =
            Math.random() > 0.5
              ? 3
              : -3;

          ball.speedY = -3;
        }
      }


      /* 모든 벽돌 제거 */

      if (
        bricks.every(
          brick => !brick.alive
        )
      ) {

        gameOver = true;
        running = false;

        clearTimeout(blindTimer);
        clearTimeout(blindEndTimer);

        blindOverlay.style.display = 'none';

        startMessage.textContent =
          '🎉 모든 벽돌을 깼습니다! 버튼을 눌러 다시 시작하세요';
      }
    }


    /* =========================
       화면 그리기
    ========================= */

    function draw() {

      ctx.clearRect(
        0,
        0,
        W,
        H
      );


      /* 배경 */

      ctx.fillStyle = '#080b10';

      ctx.fillRect(
        0,
        0,
        W,
        H
      );


      /* 벽돌 */

      bricks.forEach(brick => {

        if (!brick.alive) {
          return;
        }

        ctx.fillStyle =
          brick.color;

        ctx.fillRect(
          brick.x,
          brick.y,
          brick.width,
          brick.height
        );

        ctx.strokeStyle =
          'rgba(255,255,255,.2)';

        ctx.strokeRect(
          brick.x,
          brick.y,
          brick.width,
          brick.height
        );
      });


      /* 패들 */

      ctx.fillStyle =
        '#7be0c8';

      ctx.fillRect(
        paddle.x,
        paddle.y,
        paddle.width,
        paddle.height
      );


      /* 공 */

      ctx.beginPath();

      ctx.arc(
        ball.x,
        ball.y,
        ball.radius,
        0,
        Math.PI * 2
      );

      ctx.fillStyle =
        '#ffffff';

      ctx.shadowColor =
        '#ffffff';

      ctx.shadowBlur = 15;

      ctx.fill();

      ctx.shadowBlur = 0;
    }


    /* =========================
       시야 방해
    ========================= */

    function scheduleBlindEvent() {

      clearTimeout(blindTimer);

      if (!running) {
        return;
      }

      /* 다음 시야 방해까지 3~8초 */

      const nextEvent =
        3000 +
        Math.random() * 5000;

      blindTimer =
        setTimeout(() => {
          triggerBlindEvent();
        }, nextEvent);
    }


    function triggerBlindEvent() {

      if (!running) {
        return;
      }

      /* 시야 방해 지속 2초 */

      const duration = 2000;

      blindOverlay.style.display =
        'block';

      blindText.textContent =
        '👀 시야 방해!';

      clearTimeout(blindEndTimer);

      blindEndTimer =
        setTimeout(() => {

          blindOverlay.style.display =
            'none';

          scheduleBlindEvent();

        }, duration);
    }


    /* =========================
       시작 / 다시 시작
    ========================= */

    restartButton.addEventListener(
      'click',
      () => {

        clearTimeout(blindTimer);
        clearTimeout(blindEndTimer);

        blindOverlay.style.display =
          'none';

        initGame();
        startGame();
      }
    );


    /* =========================
       처음에는 정지
    ========================= */

    initGame();


    /* =========================
       게임 루프
    ========================= */

    function gameLoop() {

      update();
      draw();

      requestAnimationFrame(
        gameLoop
      );
    }

    gameLoop();

  </script>

</body>
</html>
