<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>파괴된 아카츠키 닌자 학교 시간표 & D-Day</title>
    <!-- 구글 폰트(고운 돋움) 불러오기 -->
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0f14;
            --card-color: #161b22;
            --text-color: #f0f3f6;
            --accent-color: #ff4500;
            --highlight-border: #dc2626;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Gowun Dodum', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* D-Day 카운터 상자 (폭발 여파로 찌그러진 형태) */
        .dday-container {
            background-color: var(--card-color);
            border: 2px solid var(--accent-color);
            border-radius: 2px 20px 5px 15px;
            padding: 20px 40px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 0 25px rgba(255, 69, 0, 0.4), inset 0 0 15px rgba(220, 38, 38, 0.3);
            width: 80%;
            max-width: 600px;
            position: relative;
            transform: rotate(-0.5deg); /* 살짝 비틀림 */
        }

        .akatsuki-cloud {
            font-size: 1.5rem;
            margin: 0 10px;
            vertical-align: middle;
        }

        .dday-title {
            font-size: 1.2rem;
            margin-top: 5px;
            margin-bottom: 10px;
            color: #a0aec0;
        }

        .dday-count {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--accent-color);
            text-shadow: 0 0 10px rgba(255, 69, 0, 0.6);
        }

        .weekend-notice {
            font-size: 1.1rem;
            color: #ff6b6b;
            margin-bottom: 15px;
            font-weight: bold;
        }

        /* 완전히 파괴되고 붕괴된 시간표 컨테이너 */
        .table-container {
            width: 100%;
            max-width: 900px;
            overflow-x: auto;
            position: relative;
            background-color: #0b0d12;
            
            /* 불규칙하고 극단적으로 파괴된 클립패스 */
            clip-path: polygon(
                0% 8%, 12% 0%, 28% 5%, 48% 0%, 75% 4%, 93% 0%, 100% 12%, 
                96% 35%, 100% 60%, 94% 85%, 100% 100%, 
                80% 95%, 55% 100%, 30% 96%, 8% 100%, 0% 88%, 
                4% 65%, 0% 38%
            );
            
            border: 3px solid #dc2626;
            padding: 18px;
            box-shadow: 0 0 40px rgba(220, 38, 38, 0.6), inset 0 0 30px rgba(0, 0, 0, 0.9);
            margin-bottom: 30px;
            transform: rotate(0.3deg);
        }

        .table-container::before {
            content: "💥 [경고: 신라텐세이(신羅天征)에 의해 파괴된 기록]";
            display: block;
            text-align: center;
            font-size: 0.8rem;
            color: #ff4500;
            margin-bottom: 12px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(255, 69, 0, 0.8);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #121720;
        }

        th, td {
            border: 1px dashed #4a1515; /* 핏빛 파열 테두리 */
            padding: 12px;
            text-align: center;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        /* 파괴된 칸 (임의의 일부 칸이 무너진 효과) */
        .destroyed-cell {
            background-color: #08090c !important;
            color: #ef4444 !important;
            font-style: italic;
            text-decoration: line-through;
            opacity: 0.7;
        }

        th {
            background-color: #1a0808;
            color: var(--accent-color);
            font-weight: bold;
            text-shadow: 0 0 5px rgba(255, 69, 0, 0.5);
        }

        .current-period {
            border: 3px solid var(--highlight-border) !important;
            background-color: rgba(220, 38, 38, 0.35) !important;
            font-weight: bold;
            box-shadow: inset 0 0 15px rgba(220, 38, 38, 0.5);
        }

        /* 심심이 위젯 스타일 */
        .simsimi-box {
            background-color: var(--card-color);
            border: 2px solid #dc2626;
            border-radius: 14px;
            padding: 15px 25px;
            width: 80%;
            max-width: 600px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 0 20px rgba(220, 38, 38, 0.3);
        }

        .simsimi-avatar {
            font-size: 2rem;
            background: #1a0808;
            padding: 10px;
            border-radius: 50%;
            border: 1px solid #ff4500;
        }

        .simsimi-content {
            flex-grow: 1;
        }

        .simsimi-name {
            font-size: 0.85rem;
            color: #ff4500;
            font-weight: bold;
            margin-bottom: 3px;
        }

        .simsimi-speech {
            font-size: 0.95rem;
            color: #f0f3f6;
            cursor: pointer;
        }

        .simsimi-speech:hover {
            color: #ff4500;
        }

        .description {
            margin-top: 20px;
            font-size: 0.85rem;
            color: #718096;
            text-align: center;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <!-- D-Day 카운터 영역 -->
    <div class="dday-container">
        <div id="weekend-banner"></div>
        <div>
            <span class="akatsuki-cloud">☁️</span>
            <span style="font-weight: bold; font-size: 1.1rem; color: #ff4500;">AKATSUKI ACADEMY (파괴됨)</span>
            <span class="akatsuki-cloud">☁️️</span>
        </div>
        <div class="dday-title" id="dday-label">목표</div>
        <div class="dday-count" id="dday-value">D-Day 계산 중...</div>
    </div>

    <!-- 완전히 파괴된 시간표 영역 -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>시간 / 요일</th>
                    <th>월</th>
                    <th>화</th>
                    <th>수</th>
                    <th>목</th>
                    <th>금</th>
                </tr>
            </thead>
            <tbody id="timetable-body">
                <!-- 자바스크립트로 렌더링 -->
            </tbody>
        </table>
    </div>

    <!-- 심심이 위젯 영역 -->
    <div class="simsimi-box">
        <div class="simsimi-avatar">🐤</div>
        <div class="simsimi-content">
            <div class="simsimi-name">심심이 (아카츠키 생존자)</div>
            <div class="simsimi-speech" id="simsimi-text" onclick="changeSimsimiSpeech()">클릭해서 파괴된 학교 소식을 들어보세요! (말풍선 클릭)</div>
        </div>
    </div>

    <!-- 하단 설명글 -->
    <div class="description">
        1. 인술에 의해 사방이 폭발하고 붕괴된 '파괴된 시간표' 콘셉트입니다.<br>
        2. 일부 칸은 완전히 부서져 소실되었으며, 실시간 현재 교시 강조 및 심심이 대화 기능이 작동합니다.
    </div>

    <script>
        const TITLE = '시험';
        const TARGET = { label: '시험날후', date: '2026-12-16' };
        const DAYS = ['월', '화', '수', '목', '금'];
        
        const PERIODS = [
            { time: '09:00', subjects: ['수학', '도덕:시험공부날', '국어:시험 저번주에봄', '전과목시험', '시험끝축하파티'] },
            { time: '10:00', subjects: ['국어', '수학: 시험 공부:시험전', '미술:시험:공부 없음', '2교시방학', '계속'] },
            { time: '11:00', subjects: ['국어', '수학:시험', '체육', '영어', '계속'] },
            { time: '12:00', subjects: ['미술', '도덕:시험공부2', '음악', '코딩', '국ㅇㅇ어'] },
            { time: '13:30', subjects: ['도덕:시험 공부', '도덕:시험', '음악', '영우형교실가서문뿌시기', '수학'] },
            { time: '14:30', subjects: ['과학', '사회', '역사', '기가', '자율'] },
            { time: '15:30', subjects: ['동아리', '창체', '진로', '체육', '청소'] },
        ];

        // 심심이 대사 목록 (파괴 버전)
        const simsimiLines = [
            "학교가 통째로 날아갔는데 시간표가 무슨 소용이야!",
            "신라텐세이 한 방에 전부 잿더미가 되었지...",
            "영우형 교실뿐만 아니라 학교 전체가 부서졌어!",
            "이 세계에 고통을... 아니, 보수 공사부터 해야겠는데?",
            "벌레 시체도 폭발에 휘말려서 흔적도 없어.",
            "수업이고 뭐고 다 박살 났으니까 집에나 가자.",
            "페인이 학교를 폭파시켰다! 도망쳐!"
        ];

        function changeSimsimiSpeech() {
            const speechEl = document.getElementById('simsimi-text');
            const randomIndex = Math.floor(Math.random() * simsimiLines.length);
            speechEl.innerText = simsimiLines[randomIndex];
        }

        function updateDday() {
            const titleEl = document.getElementById('dday-label');
            const valueEl = document.getElementById('dday-value');
            
            titleEl.innerText = `${TARGET.label} (${TARGET.date})`;
            
            const targetDate = new Date(TARGET.date);
            const today = new Date();
            
            targetDate.setHours(0, 0, 0, 0);
            today.setHours(0, 0, 0, 0);
            
            const diffTime = targetDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            if (diffDays > 0) {
                valueEl.innerText = `D - ${diffDays}`;
            } else if (diffDays === 0) {
                valueEl.innerText = `D - DAY! (오늘)`;
            } else {
                valueEl.innerText = `D + ${Math.abs(diffDays)} (지남)`;
            }
        }

        function timeToMinutes(timeStr) {
            const parts = timeStr.split(':');
            return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
        }

        function renderTimetable() {
            const tbody = document.getElementById('timetable-body');
            tbody.innerHTML = '';

            const now = new Date();
            const dayOfWeek = now.getDay();
            const currentHour = now.getHours();
            const currentMinute = now.getMinutes();
            const currentTimeVal = currentHour * 60 + currentMinute;

            const weekendBanner = document.getElementById('weekend-banner');
            let isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);

            if (isWeekend) {
                weekendBanner.innerHTML = '<div class="weekend-notice">오늘은 쉬는 날 (학교도 파괴됨)</div>';
            } else {
                weekendBanner.innerHTML = '';
            }

            const currentDayIndex = dayOfWeek - 1;

            PERIODS.forEach((period, pIndex) => {
                const tr = document.createElement('tr');

                const timeTd = document.createElement('td');
                timeTd.innerText = period.time;
                tr.appendChild(timeTd);

                period.subjects.forEach((subject, sIndex) => {
                    const td = document.createElement('td');
                    
                    // 폭발로 파괴된 것으로 처리할 특정 좌표들 (임의 지정)
                    const isDestroyed = (pIndex === 1 && sIndex === 2) || (pIndex === 4 && sIndex === 3) || (pIndex === 6 && sIndex === 4);

                    if (isDestroyed) {
                        td.innerText = '[폭발 소실]';
                        td.classList.add('destroyed-cell');
                    } else {
                        td.innerText = subject;
                    }

                    if (!isWeekend && sIndex === currentDayIndex) {
                        let prevTimeVal = 0;
                        if (pIndex > 0) {
                            prevTimeVal = timeToMinutes(PERIODS[pIndex - 1].time);
                        }
                        let currTimeVal = timeToMinutes(period.time);

                        let isCurrent = false;
                        if (pIndex === 0 && currentTimeVal <= currTimeVal) {
                            isCurrent = true;
                        } else if (currentTimeVal > prevTimeVal && currentTimeVal <= currTimeVal) {
                            isCurrent = true;
                        } else if (pIndex === PERIODS.length - 1 && currentTimeVal > currTimeVal) {
                            isCurrent = true;
                        }

                        if (isCurrent && !isDestroyed) {
                            td.classList.add('current-period');
                        }
                    }

                    tr.appendChild(td);
                });

                tbody.appendChild(tr);
            });
        }

        updateDday();
        renderTimetable();

        setInterval(() => {
            renderTimetable();
        }, 60000);
    </script>
</body>
</html>
