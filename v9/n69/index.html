<!DOCTYPE html>
<html lang="ko">
<head>
    <!-- 문서의 문자 인코딩을 UTF-8로 설정합니다. -->
    <meta charset="UTF-8">
    <!-- 모바일 기기 반응형 화면 조정을 위한 뷰포트 설정 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 상용 웹서비스 수준의 모던한 웹페이지 제목 설정 -->
    <title>스마트 학습 플래너 & 커스텀 테마 시간표</title>
    <style>
        /* CSS 스타일 시작: CSS 변수를 활용하여 동적 테마 변경이 가능하도록 설계 */
        :root {
            --primary-color: #f59e0b;
            --primary-dark: #d97706;
            --primary-light: #fef3c7;
            --bg-color: #fffbeb;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --border-color: #fde68a;
            --radius-lg: 16px;
            --radius-md: 10px;
            --shadow-sm: 0 4px 12px rgba(245, 158, 11, 0.15);
        }

        /* 페이지 전체 기본 스타일 초기화 및 박스 모델 설정 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        /* 바디 배경색과 중앙 정렬 레이아웃 설정 (배경색은 동적 변수 반영) */
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s ease;
        }

        /* 전체 콘텐츠를 감싸는 메인 컨테이너 카드 */
        .container {
            width: 100%;
            max-width: 1100px;
            background-color: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: 0 12px 30px -8px rgba(0, 0, 0, 0.1);
            padding: 36px;
            border: 2px solid var(--border-color);
            animation: fadeIn 0.4s ease-out;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        /* 부드러운 화면 진입 애니메이션 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 테마 설정 커스텀 패널 디자인 */
        .theme-panel {
            background-color: rgba(0, 0, 0, 0.02);
            border: 1px dashed var(--border-color);
            border-radius: var(--radius-md);
            padding: 16px;
            margin-bottom: 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
            justify-content: space-between;
        }

        .theme-control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .theme-control-group label {
            cursor: pointer;
        }

        /* 컬러 피커 및 셀렉트 박스 디자인 */
        .theme-control-group input[type="color"] {
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            background: none;
        }

        .theme-select {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: white;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
        }

        /* 상단 D-Day 카운터 배너 디자인 (동적 테마 컬러 적용) */
        .dday-card {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            color: #ffffff;
            border-radius: var(--radius-md);
            padding: 28px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
            transition: background 0.3s ease;
        }

        /* D-Day 목표 이름 스타일 */
        .dday-title {
            font-size: 1.15rem;
            font-weight: 600;
            opacity: 0.95;
            margin-bottom: 8px;
        }

        /* 남은 날짜 숫자 강조 스타일 */
        .dday-count {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -1px;
        }

        /* 상단 컨트롤 바 (제목 및 수정 버튼 영역) */
        .control-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        /* 시간표 섹션 타이틀 스타일 */
        .section-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* 버튼 컨테이너 (버튼들 간격 정렬) */
        .btn-group {
            display: flex;
            gap: 10px;
        }

        /* 직관적인 UI 액션 버튼 스타일 */
        .btn {
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            padding: 10px 18px;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: #64748b;
        }

        /* 시간표 테이블 반응형 스크롤 박스 */
        .table-responsive {
            overflow-x: auto;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }

        /* 시간표 표 기본 스타일 */
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            background-color: white;
        }

        /* 테이블 헤더 및 셀 공통 스타일 */
        th, td {
            padding: 16px 12px;
            border-bottom: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            font-size: 0.95rem;
            vertical-align: middle;
        }

        th:last-child, td:last-child {
            border-right: none;
        }

        /* 요일 헤더 디자인 */
        th {
            background-color: var(--primary-light);
            color: var(--text-main);
            font-weight: 700;
            transition: background-color 0.3s ease;
        }

        /* 교시 표시 열 디자인 */
        td:first-child {
            background-color: rgba(0, 0, 0, 0.02);
            font-weight: 700;
            color: var(--primary-dark);
            width: 90px;
        }

        /* 과목명 스타일 */
        .subject {
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 4px;
            font-size: 1rem;
        }

        /* 수업 설명(내용) 스타일 */
        .desc {
            font-size: 0.8rem;
            color: var(--text-sub);
            line-height: 1.3;
        }

        /* 비어있는 셀 스타일 */
        .empty-cell {
            color: #cbd5e1;
            font-size: 0.85rem;
            font-style: italic;
        }

        /* 수정 모드용 입력 상자 스타일 */
        .edit-input {
            width: 100%;
            padding: 6px 8px;
            margin-bottom: 6px;
            border: 1.5px solid var(--primary-color);
            border-radius: 6px;
            font-size: 0.9rem;
            text-align: center;
            outline: none;
        }

        .edit-desc {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.8rem;
            text-align: center;
            outline: none;
        }

        /* 모바일 화면 최적화 미디어 쿼리 */
        @media (max-width: 768px) {
            body { padding: 12px; }
            .container { padding: 18px; }
            .dday-count { font-size: 2.2rem; }
            th, td { padding: 10px 6px; font-size: 0.85rem; }
            .theme-panel { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>

    <!-- 웹페이지 메인 컨테이너 시작 -->
    <div class="container" id="mainContainer">
        
        <!-- [신규 기능] 상단 및 캘린더 분위기를 내 마음대로 바꾸는 테마 커스텀 패널 -->
        <div class="theme-panel">
            <div class="theme-control-group">
                <span>🎨 메인 테마 색상:</span>
                <input type="color" id="primaryColorPicker" value="#f59e0b" onchange="changeThemeColor(this.value)">
            </div>
            <div class="theme-control-group">
                <span>✨ 빠른 분위기 프리셋:</span>
                <select class="theme-select" id="presetSelector" onchange="applyPresetTheme(this.value)">
                    <option value="yellow">따뜻한 노란색 (기본)</option>
                    <option value="blue">시원한 블루 오션</option>
                    <option value="pink">러블리 핑크 블라썸</option>
                    <option value="emerald">차분한 에메랄드 그린</option>
                    <option value="dark">시크한 다크 모드</option>
                </select>
            </div>
            <div class="theme-control-group">
                <span>🔤 글꼴 스타일:</span>
                <select class="theme-select" id="fontSelector" onchange="changeFontFamily(this.value)">
                    <option value="'Segoe UI', sans-serif">기본 산세리프</option>
                    <option value="'Courier New', monospace">타자기 폰트 (고정폭)</option>
                    <option value="Georgia, serif">클래식 세리프</option>
                </select>
            </div>
        </div>

        <!-- 상단 D-Day 카운터 영역 -->
        <div class="dday-card" id="ddayCard">
            <div class="dday-title" id="targetNameDisplay">목표 로딩 중...</div>
            <div class="dday-count" id="ddayDisplay">D-Day</div>
        </div>

        <!-- 하단 시간표 및 컨트롤 영역 -->
        <div class="control-bar">
            <div class="section-title">✨ 월~수 체육 집중! 화요일만 6교시 시간표</div>
            <div class="btn-group">
                <button class="btn btn-secondary" onclick="resetThemeSettings()">테마 초기화</button>
                <button class="btn" id="editToggleBtn" onclick="toggleEditMode()">✏️ 수업 수정하기</button>
            </div>
        </div>

        <!-- 시간표 테이블 표시 영역 -->
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>교시</th>
                        <th>월요일</th>
                        <th>화요일 (6교시)</th>
                        <th>수요일</th>
                        <th>목요일</th>
                        <th>금요일</th>
                    </tr>
                </thead>
                <tbody id="timetableBody">
                    <!-- 자바스크립트에 의해 동적으로 시간표 행이 생성됩니다. -->
                </tbody>
            </table>
        </div>

    </div>

    <script>
        /* ========================================================== */
        /* [여기만 고치세요] 설정 영역: 목표 이름, 날짜 및 시간표 데이터를 수정하세요. */
        /* ========================================================== */

        const CONFIG_TARGET_NAME = "2026년 2학기 최종 목표"; 
        const CONFIG_TARGET_DATE = "2026-12-31";     

        // 월~수 체육 집중 및 화요일 6교시 설정이 반영된 기본 시간표 데이터
        const CONFIG_TIMETABLE = [
            /* 1교시 */
            [
                { subject: "체육", desc: "월요 활기찬 구기 운동 및 스트레칭" },
                { subject: "체육", desc: "화요 구기 종목 팀워크 실습" },
                { subject: "체육", desc: "수요 체력 강화 트레이닝 및 운동" },
                { subject: "국어", desc: "문법 핵심 개념 정리" },
                { subject: "수학", desc: "확률과 통계 심화 문제" }
            ],
            /* 2교시 */
            [
                { subject: "체육", desc: "구기 종목 기초 기술 훈련" },
                { subject: "체육", desc: "농구 드리블 및 패스 실습" },
                { subject: "체육", desc: "배드민턴 네트 플레이 연습" },
                { subject: "사회", desc: "경제 시장의 원리 이해" },
                { subject: "과학", desc: "화학 반응 속도와 에너지" }
            ],
            /* 3교시 */
            [
                { subject: "체육", desc: "매트 운동 및 체조 실습" },
                { subject: "체육", desc: "축구 패스 및 미니 게임" },
                { subject: "체육", desc: "배구 서브 및 리시브 훈련" },
                { subject: "영어", desc: "영작문 첨삭 및 문법 교정" },
                { subject: "역사", desc: "세계사 핵심 흐름 정리" }
            ],
            /* 4교시 */
            [
                { subject: "체육", desc: "이어달리기 및 민첩성 훈련" },
                { subject: "체육", desc: "피구 경기 전술 수립" },
                { subject: "체육", desc: "농구 슈팅 자세 교정 및 실전" },
                { subject: "역사", desc: "사료 분석을 통한 역사 해석" },
                { subject: "사회", desc: "법과 정치 헌법 원리" }
            ],
            /* 5교시 */
            [
                { subject: "체육", desc: "구기 종목 자유 대항전 실습" },
                { subject: "체육", desc: "피구 실전 경기 및 정리 운동" },
                { subject: "체육", desc: "배드민턴 복식 경기 실습" },
                { subject: "정보", desc: "파이썬 알고리즘 코딩" },
                { subject: "창체", desc: "자율 동아리 및 진로 탐색" }
            ],
            /* 6교시 (화요일만 수업, 나머지 요일 공강) */
            [
                { subject: "", desc: "" },                                    
                { subject: "방과후 심화", desc: "화요일 특별 프로젝트 및 코딩 실습" }, 
                { subject: "", desc: "" },                                    
                { subject: "", desc: "" },                                    
                { subject: "", desc: "" }                                     
            ]
        ];

        /* ========================================================== */
        /* 자바스크립트 로직 영역: 테마 제어, 저장 및 화면 렌더링 담당 */
        /* ========================================================== */

        let isEditing = false;

        // 웹페이지 로드 시 실행
        document.addEventListener("DOMContentLoaded", function() {
            loadSavedThemeSettings(); // 저장된 테마 분위기 불러오기
            loadSavedTimetable();     // 저장된 시간표 불러오기
            initDDay();               // D-Day 계산
            renderTimetable();        // 시간표 렌더링
        });

        // 1. 테마 색상 변경 및 CSS 변수 적용 함수
        function changeThemeColor(colorHex) {
            document.documentElement.style.setProperty('--primary-color', colorHex);
            // 어두운 계열 및 연한 계열 자동 계산 적용 (간이 조절)
            document.documentElement.style.setProperty('--primary-dark', adjustColorBrightness(colorHex, -30));
            document.documentElement.style.setProperty('--primary-light', adjustColorBrightness(colorHex, 75));
            document.documentElement.style.setProperty('--bg-color', adjustColorBrightness(colorHex, 92));
            document.documentElement.style.setProperty('--border-color', adjustColorBrightness(colorHex, 50));
            
            // 변경된 테마 설정값 브라우저 저장
            saveThemeSettings();
        }

        // 2. 분위기 프리셋 적용 함수
        function applyPresetTheme(presetName) {
            let mainColor = "#f59e0b";
            if (presetName === "blue") mainColor = "#3b82f6";
            if (presetName === "pink") mainColor = "#ec4899";
            if (presetName === "emerald") mainColor = "#10b981";
            if (presetName === "dark") mainColor = "#334155";

            document.getElementById("primaryColorPicker").value = mainColor === "#334155" ? "#475569" : mainColor;
            changeThemeColor(mainColor);
        }

        // 3. 폰트 스타일 변경 함수
        function changeFontFamily(fontValue) {
            document.body.style.fontFamily = fontValue;
            saveThemeSettings();
        }

        // 4. 색상 밝기 조절 헬퍼 함수
        function adjustColorBrightness(hex, percent) {
            let num = parseInt(hex.replace("#",""), 16);
            let r = (num >> 16) + Math.round(255 * (percent / 100));
            let g = ((num >> 8) & 0x00ff) + Math.round(255 * (percent / 100));
            let b = (num & 0x0000ff) + Math.round(255 * (percent / 100));
            r = Math.min(255, Math.max(0, r));
            g = Math.min(255, Math.max(0, g));
            b = Math.min(255, Math.max(0, b));
            return `#${(1 << 24 | r << 16 | g << 8 | b).toString(16).slice(1)}`;
        }

        // 5. 테마 설정 로컬스토리지 저장 및 불러오기
        function saveThemeSettings() {
            const settings = {
                color: document.getElementById("primaryColorPicker").value,
                preset: document.getElementById("presetSelector").value,
                font: document.getElementById("fontSelector").value
            };
            localStorage.setItem("my_custom_theme", JSON.stringify(settings));
        }

        function loadSavedThemeSettings() {
            const saved = localStorage.getItem("my_custom_theme");
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (parsed.color) {
                        document.getElementById("primaryColorPicker").value = parsed.color;
                        changeThemeColor(parsed.color);
                    }
                    if (parsed.preset) {
                        document.getElementById("presetSelector").value = parsed.preset;
                    }
                    if (parsed.font) {
                        document.getElementById("fontSelector").value = parsed.font;
                        document.body.style.fontFamily = parsed.font;
                    }
                } catch(e) { console.error(e); }
            }
        }

        // 6. 테마 설정 초기화
        function resetThemeSettings() {
            localStorage.removeItem("my_custom_theme");
            localStorage.removeItem("my_custom_timetable");
            location.reload();
        }

        // 7. 시간표 데이터 로컬스토리지 연동
        function loadSavedTimetable() {
            const savedData = localStorage.getItem("my_custom_timetable");
            if (savedData) {
                try {
                    const parsed = JSON.parse(savedData);
                    if (Array.isArray(parsed) && parsed.length === 6) {
                        for (let p = 0; p < 6; p++) {
                            for (let d = 0; d < 5; d++) {
                                if (parsed[p] && parsed[p][d]) {
                                    CONFIG_TIMETABLE[p][d] = parsed[p][d];
                                }
                            }
                        }
                    }
                } catch (e) { console.error(e); }
            }
        }

        // 8. D-Day 계산
        function initDDay() {
            const nameDisplay = document.getElementById("targetNameDisplay");
            const ddayDisplay = document.getElementById("ddayDisplay");

            nameDisplay.textContent = `🎯 ${CONFIG_TARGET_NAME}까지`;

            const today = new Date();
            const targetDate = new Date(CONFIG_TARGET_DATE);
            today.setHours(0, 0, 0, 0);
            targetDate.setHours(0, 0, 0, 0);

            const diffTime = targetDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays > 0) {
                ddayDisplay.textContent = `D - ${diffDays}`;
            } else if (diffDays === 0) {
                ddayDisplay.textContent = `D - Day (오늘이 바로 그날!)`;
            } else {
                ddayDisplay.textContent = `D + ${Math.abs(diffDays)} (목표일 경과)`;
            }
        }

        // 9. 시간표 렌더링
        function renderTimetable() {
            const tbody = document.getElementById("timetableBody");
            tbody.innerHTML = ""; 

            for (let period = 0; period < CONFIG_TIMETABLE.length; period++) {
                const tr = document.createElement("tr");

                const tdPeriod = document.createElement("td");
                tdPeriod.textContent = `${period + 1}교시`;
                tr.appendChild(tdPeriod);

                for (let day = 0; day < 5; day++) {
                    const td = document.createElement("td");
                    const lesson = CONFIG_TIMETABLE[period][day];
                    const hasClass = lesson.subject && lesson.subject.trim() !== "";

                    if (isEditing) {
                        td.innerHTML = `
                            <input type="text" class="edit-input" id="subj-${period}-${day}" value="${lesson.subject}" placeholder="과목명 입력">
                            <input type="text" class="edit-desc" id="desc-${period}-${day}" value="${lesson.desc}" placeholder="수업 내용 설명">
                        `;
                    } else {
                        if (hasClass) {
                            td.innerHTML = `
                                <div class="subject">${lesson.subject}</div>
                                <div class="desc">${lesson.desc}</div>
                            `;
                        } else {
                            td.innerHTML = `<span class="empty-cell">- 공강 -</span>`;
                        }
                    }
                    tr.appendChild(td);
                }
                tbody.appendChild(tr);
            }
        }

        // 10. 수정 모드 토글 및 저장
        function toggleEditMode() {
            const btn = document.getElementById("editToggleBtn");

            if (!isEditing) {
                isEditing = true;
                btn.textContent = "💾 수정 완료 및 저장";
                btn.style.backgroundColor = "#10b981"; 
                renderTimetable(); 
            } else {
                for (let period = 0; period < CONFIG_TIMETABLE.length; period++) {
                    for (let day = 0; day < 5; day++) {
                        const subjInput = document.getElementById(`subj-${period}-${day}`);
                        const descInput = document.getElementById(`desc-${period}-${day}`);
                        
                        if (subjInput && descInput) {
                            CONFIG_TIMETABLE[period][day].subject = subjInput.value.trim();
                            CONFIG_TIMETABLE[period][day].desc = descInput.value.trim();
                        }
                    }
                }

                localStorage.setItem("my_custom_timetable", JSON.stringify(CONFIG_TIMETABLE));

                isEditing = false;
                btn.textContent = "✏️ 수업 수정하기";
                btn.style.backgroundColor = ""; 
                renderTimetable(); 
            }
        }
    </script>
</body>
</html>
