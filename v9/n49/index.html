<!-- HTML 문서의 시작을 알리는 선언입니다 -->
<!DOCTYPE html>
<!-- 문서의 언어를 한국어로 설정합니다 -->
<html lang="ko">
<!-- 문서의 메타데이터와 스타일을 정의하는 head 태그입니다 -->
<head>
    <!-- 문서의 문자 인코딩을 UTF-8로 설정합니다 -->
    <meta charset="UTF-8">
    <!-- 모바일 기기에서 화면이 알맞게 표시되도록 뷰포트를 설정합니다 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 브라우저 탭에 표시될 제목을 설정합니다 -->
    <title>시간표 & D-Day 카운터</title>
    <!-- 구글 폰트(Jua 주아 체)를 불러오기 위한 link 태그입니다 -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <!-- 스타일을 정의하는 style 태그의 시작입니다 -->
    <style>
        /* CSS 변수 및 색상 팔레트 설정 (여기서 색상과 디자인을 쉽게 변경할 수 있습니다) */
        :root {
            --bg-color: #ffffff;      /* 배경색: 흰색 (#ffffff) */
            --box-color: #c7f4ff;     /* 칸/박스 배경색: 연한 파란색 (#c7f4ff) */
            --text-color: #7bceea;    /* 글자색: 하늘빛 파란색 (#7bceea) */
            --point-color: #d1f1ff;   /* 포인트 색상: 밝은 하늘색 (#d1f1ff) */
            --border-radius: 28px;    /* 모서리 둥글기: 28px 통일 */
        }

        /* 웹페이지 전체 기본 스타일 설정입니다 */
        body {
            background-color: var(--bg-color); /* 배경색 변수 적용 */
            color: var(--text-color);           /* 기본 글자색 변수 적용 */
            font-family: 'Jua', sans-serif;    /* 구글 주아 폰트 적용 */
            margin: 0;                          /* 기본 바깥 여백 제거 */
            padding: 20px;                      /* 안쪽 여백 20px 설정 */
            display: flex;                      /* 플렉스 박스 사용 */
            flex-direction: column;             /* 세로 방향 정렬 */
            align-items: center;                /* 가로 중앙 정렬 */
            min-height: 100vh;                  /* 최소 높이를 화면 전체로 설정 */
            box-sizing: border-box;             /* 패딩을 포함한 크기 계산 */
            overflow-x: hidden;                 /* 가로 스크롤 방지 */
        }

        /* 전체 콘텐츠를 감싸는 메인 컨테이너 박스입니다 */
        .container {
            width: 100%;                        /* 너비 100% */
            max-width: 600px;                   /* 최대 너비 600px 제한 */
            display: flex;                      /* 플렉스 박스 사용 */
            flex-direction: column;             /* 세로 방향 정렬 */
            gap: 20px;                          /* 요소 간 간격 20px */
            z-index: 2;                         /* 구름 이모지(z-index: 10)보다 아래에 위치하도록 설정 */
            position: relative;                 /* z-index 적용을 위한 포지션 설정 */
        }

        /* 최상단 제목 스타일입니다 */
        .main-title {
            text-align: center;                 /* 글자 가운데 정렬 */
            font-size: 32px;                    /* 글자 크기 32px */
            color: var(--text-color);           /* 글자색 변수 적용 */
            margin: 0;                          /* 기본 마진 제거 */
        }

        /* D-Day 카운터 박스 스타일입니다 */
        .dday-box {
            background-color: var(--box-color); /* 박스 배경색 변수 적용 */
            border-radius: var(--border-radius);/* 모서리 둥글기 28px 변수 적용 */
            padding: 25px;                      /* 안쪽 여백 25px */
            text-align: center;                 /* 글자 가운데 정렬 */
            box-shadow: 0 4px 15px rgba(123, 206, 234, 0.2); /* 부드러운 그림자 효과 */
        }

        /* D-Day 라벨(목표 이름) 스타일입니다 */
        .dday-label {
            font-size: 24px;                    /* 글자 크기 24px */
            margin-bottom: 5px;                 /* 아래쪽 여백 5px */
        }

        /* D-Day 남은 날짜 숫자 스타일입니다 */
        .dday-count {
            font-size: 48px;                    /* 크게 표시할 글자 크기 48px */
            color: var(--text-color);           /* 글자색 변수 적용 */
        }

        /* 시간표 표를 감싸는 박스 스타일입니다 */
        .timetable-box {
            background-color: var(--box-color); /* 박스 배경색 변수 적용 */
            border-radius: var(--border-radius);/* 모서리 둥글기 28px 변수 적용 */
            padding: 20px;                      /* 안쪽 여백 20px */
            box-shadow: 0 4px 15px rgba(123, 206, 234, 0.2); /* 부드러운 그림자 효과 */
            overflow-x: auto;                   /* 표가 넘칠 경우 가로 스크롤 허용 */
        }

        /* 시간표 테이블 스타일입니다 */
        table {
            width: 100%;                        /* 너비 100% */
            border-collapse: collapse;          /* 테두리 겹침 방지 */
            text-align: center;                 /* 글자 가운데 정렬 */
        }

        /* 테이블 셀(th, td) 공통 스타일입니다 */
        th, td {
            padding: 12px 8px;                  /* 위아래 12px, 양옆 8px 여백 */
            font-size: 18px;                    /* 글자 크기 18px */
            border-bottom: 2px solid var(--point-color); /* 아래쪽 테두리 선 포인트 색상 적용 */
        }

        /* 테이블 헤더(요일 항목) 스타일입니다 */
        th {
            color: var(--text-color);           /* 글자색 변수 적용 */
            font-size: 20px;                    /* 헤더 글자 크기 20px */
        }

        /* 마지막 행의 테두리를 없애 깔끔하게 만듭니다 */
        tr:last-child td {
            border-bottom: none;
        }

        /* 클릭했을 때 생성되는 구름 이모지 스타일입니다 */
        .click-cloud {
            position: fixed;                    /* 화면 고정 위치 */
            pointer-events: none;               /* 마우스 클릭 이벤트 방해하지 않음 */
            z-index: 10;                        /* 시간표 앞쪽(z-index: 2)에 오도록 설정 */
            animation: riseAndFade 1.2s ease-out forwards; /* 위로 떠오르며 사라지는 애니메이션 */
            user-select: none;                  /* 텍스트 선택 방지 */
        }

        /* 구름 이모지가 위로 올라가면서 투명해지는 키프레임 애니메이션 정의입니다 */
        @keyframes riseAndFade {
            0% {
                transform: translate(-50%, -50%) scale(0.6); /* 시작할 때 작고 중앙 정렬 */
                opacity: 1;                                  /* 불투명 상태 */
            }
            100% {
                transform: translate(-50%, -120px) scale(1.5); /* 위로 120px 이동하며 커짐 */
                opacity: 0;                                  /* 완전히 사라짐 */
            }
        }
    </style>
<!-- 스타일 정의의 끝입니다 -->
</head>
<!-- 웹페이지 본문(body)의 시작입니다 -->
<body>

    <!-- 화면 전체를 감싸는 메인 컨테이너 시작 -->
    <div class="container">
        <!-- 페이지 상단 제목 영역 시작 -->
        <h1 class="main-title" id="page-title">시간표</h1>
        <!-- 페이지 상단 제목 영역 끝 -->

        <!-- D-Day 카운터 박스 시작 -->
        <div class="dday-box">
            <div class="dday-label" id="dday-label">목표 이름</div>
            <div class="dday-count" id="dday-count">D-0</div>
        </div>
        <!-- D-Day 카운터 박스 끝 -->

        <!-- 시간표 표를 담고 있는 박스 시작 -->
        <div class="timetable-box">
            <table id="timetable">
                <!-- 요일 헤더가 동적으로 들어갈 공간 -->
                <thead>
                    <tr id="table-header-row">
                        <th>시간</th>
                    </tr>
                </thead>
                <!-- 시간표 수업 내용이 동적으로 들어갈 공간 -->
                <tbody id="table-body">
                </tbody>
            </table>
        </div>
        <!-- 시간표 표 박스 끝 -->
    </div>
    <!-- 메인 컨테이너 끝 -->

    <!-- 자바스크립트 코드를 시작하는 script 태그입니다 -->
    <script>
        // ==========================================
        // [여기만 고치세요] 데이터 및 설정 상수 영역
        // ==========================================
        
        // 1) 페이지 상단에 표시될 전체 제목입니다
        const TITLE = '3학년 2학기 시간표';

        // 2) D-Day 목표 설정 (이름과 목표 날짜 YYYY-MM-DD 형식)
        const TARGET = { label: '생일', date: '2027-03-10' };

        // 3) 요일 목록 설정 (월요일부터 금요일까지)
        const DAYS = ['월', '화', '수', '목', '금'];

        // 4) 교시별 시간 및 요일별 과목 목록 설정 (5교시 구성)
        const PERIODS = [
            { time: '09:00', subjects: ['체육', '체육', '미술', '음악', '영어'] },
            { time: '9:50',  subjects: ['음악', '영어', '미술', '체육', '체육'] },
            { time: '10:40', subjects: ['체육', '체육', '체육', '음악', '체육'] },
            { time: '11:30', subjects: ['체육', '음악', '음악', '체육', '음악'] },
            { time: '1:30',  subjects: ['자율', '자율', '자율', '자율', '자율'] },
        ];
        // ==========================================

        // 문서가 완전히 로드된 후 실행되는 함수입니다
        window.addEventListener('DOMContentLoaded', () => {
            // 1. 페이지 제목을 상수로 설정한 값으로 변경합니다
            document.getElementById('page-title').innerText = TITLE;

            // 2. D-Day 계산 및 표시 로직을 실행합니다
            calculateDDay();

            // 3. 시간표 표(테이블)를 동적으로 생성합니다
            buildTimetable();

            // 4. 화면을 마우스로 클릭했을 때 구름 이모지가 생성되는 이벤트를 등록합니다
            setupCloudClickEffect();
        });

        // D-Day 남은 날짜를 계산하여 화면에 표시하는 함수입니다
        function calculateDDay() {
            // 목표 이름 요소를 가져와서 텍스트를 설정합니다
            const labelEl = document.getElementById('dday-label');
            // D-Day 카운트 요소를 가져옵니다
            const countEl = document.getElementById('dday-count');

            // 목표 이름 설정 (예: '생일까지')
            labelEl.innerText = TARGET.label + '까지';

            // 오늘 날짜 객체를 생성합니다 (시간은 0시 0분 0초로 초기화)
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            // 목표 날짜 객체를 생성합니다
            const targetDate = new Date(TARGET.date);
            targetDate.setHours(0, 0, 0, 0);

            // 남은 시간(밀리초)을 계산합니다 (목표일 - 오늘)
            const diffTime = targetDate - today;
            // 밀리초를 일(day) 단위로 변환합니다
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            // 남은 날짜 결과에 따라 텍스트를 다르게 표시합니다
            if (diffDays > 0) {
                countEl.innerText = `D - ${diffDays}`; // 남은 날이 있는 경우
            } else if (diffDays === 0) {
                countEl.innerText = 'D - Day!'; // 오늘이 바로 그날인 경우
            } else {
                countEl.innerText = `D + ${Math.abs(diffDays)}`; // 목표일이 지난 경우
            }
        }

        // 시간표 테이블 구조를 동적으로 조립하는 함수입니다
        function buildTimetable() {
            // 테이블 헤더 요일 행을 가져옵니다
            const headerRow = document.getElementById('table-header-row');
            // 테이블 본문(body)을 가져옵니다
            const tbody = document.getElementById('table-body');

            // DAYS 배열을 순회하며 요일별 헤더(th)를 생성하여 추가합니다
            DAYS.forEach(day => {
                const th = document.createElement('th');
                th.innerText = day; // 요일 글자 입력
                headerRow.appendChild(th); // 헤더 행에 자식으로 추가
            });

            // PERIODS 배열을 순회하며 각 교시별 행(tr)을 생성합니다
            PERIODS.forEach(period => {
                const tr = document.createElement('tr');

                // 행의 첫 번째 칸으로 시간 정보를 표시할 셀(td)을 생성합니다
                const timeTd = document.createElement('td');
                timeTd.innerText = period.time;
                tr.appendChild(timeTd);

                // 해당 교시의 요일별 과목 배열을 순회하며 각 과목 셀(td)을 생성합니다
                period.subjects.forEach(subject => {
                    const subTd = document.createElement('td');
                    subTd.innerText = subject; // 과목명 입력
                    tr.appendChild(subTd); // 행에 추가
                });

                // 완성된 교시 행을 테이블 본문에 추가합니다
                tbody.appendChild(tr);
            });
        }

        // 화면 클릭 시 시간표 앞쪽에 구름 이모지 여러 개가 생성되도록 설정하는 함수입니다
        function setupCloudClickEffect() {
            // 문서 전체에 클릭 이벤트 리스너를 추가합니다
            document.addEventListener('click', (e) => {
                // 클릭한 위치의 X, Y 좌표를 가져옵니다
                const x = e.clientX;
                const y = e.clientY;

                // 클릭할 때마다 3개의 구름 이모지가 퍼져서 생성되도록 반복합니다
                for (let i = 0; i < 3; i++) {
                    const cloud = document.createElement('div');
                    cloud.className = 'click-cloud';
                    cloud.innerText = '☁️'; // 구름 이모지 설정

                    // 구름 이모지마다 크기를 무작위로 다르게 설정하여 자연스러운 느낌을 줍니다 (24px ~ 40px)
                    const fontSize = Math.floor(Math.random() * 16) + 24;
                    cloud.style.fontSize = fontSize + 'px';

                    // 클릭한 위치 주변으로 약간씩 무작위 오프셋을 주어 퍼져서 나타나게 합니다
                    const offsetX = (Math.random() - 0.5) * 60;
                    const offsetY = (Math.random() - 0.5) * 30;
                    cloud.style.left = (x + offsetX) + 'px';
                    cloud.style.top = (y + offsetY) + 'px';

                    // 생성된 구름 이모지를 body에 추가합니다 (CSS 애니메이션에 의해 자동으로 위로 떠오름)
                    document.body.appendChild(cloud);

                    // 애니메이션 재생 시간이 끝난 후(1.2초 뒤) HTML에서 구름 요소를 완전히 제거합니다
                    setTimeout(() => {
                        cloud.remove();
                    }, 1200);
                }
            });
        }
    </script>
<!-- 자바스크립트 영역의 끝입니다 -->
</body>
<!-- HTML 문서의 끝입니다 -->
</html>
