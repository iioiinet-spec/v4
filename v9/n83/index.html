<!DOCTYPE html>
<!-- HTML 문서의 시작을 알리는 선언입니다 -->
<html lang="ko">
<!-- 한국어 사용 웹페이지로 설정합니다 -->
<head>
    <!-- 문서의 메타데이터와 스타일을 정의하는 머리말입니다 -->
    <meta charset="UTF-8">
    <!-- 문서의 문자 인코딩을 UTF-8로 설정하여 한글이 깨지지 않게 합니다 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 모바일 기기에서도 화면이 알맞게 보이도록 뷰포트를 설정합니다 -->
    <title>D-Day 및 시간표</title>
    <!-- 브라우저 탭에 표시될 웹페이지의 제목입니다 -->
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
    <!-- 구글 폰트에서 '고운돋움' 글꼴을 불러옵니다 -->
    <style>
        :root {
            /* CSS 변수를 정의하는 루트 선택자입니다 */
            --bg-color: #ffffff;
            /* 배경 색상 변수: 흰색 */
            --cell-bg: #e9edf6;
            /* 시간표 칸 배경 색상 변수: 연한 회청색 */
            --text-color: #000000;
            /* 기본 글자 색상 변수: 검은색 */
            --primary-color: #5900ff;
            /* 강조 및 포인트 색상 변수: 보라색 */
            --border-radius: 11px;
            /* 모든 박스와 칸의 모서리 둥글기 크기 */
        }

        body {
            /* 웹페이지 전체의 기본 스타일을 지정합니다 */
            background-color: var(--bg-color);
            /* 정의된 배경 색상 변수를 적용합니다 */
            color: var(--text-color);
            /* 정의된 글자 색상 변수를 적용합니다 */
            font-family: 'Gowun Dodum', sans-serif;
            /* 고운돋움 폰트를 기본 글꼴로 설정합니다 */
            margin: 0;
            /* 브라우저 기본 바깥 여백을 없앱니다 */
            padding: 20px;
            /* 페이지 전체 안쪽 여백을 20픽셀 줍니다 */
            display: flex;
            /* 요소를 유연하게 배치하기 위해 플렉스박스를 사용합니다 */
            flex-direction: column;
            /* 내부 요소를 위에서 아래로 세로 배치합니다 */
            align-items: center;
            /* 내부 요소를 가로 중앙 정렬합니다 */
            min-height: 100vh;
            /* 최소 높이를 화면 전체 높이만큼 채웁니다 */
        }

        .dday-container {
            /* D-Day 카운터를 감싸는 상자 스타일입니다 */
            background-color: var(--cell-bg);
            /* 상자 배경에 칸 색상 변수를 적용합니다 */
            border-radius: var(--border-radius);
            /* 모서리를 11픽셀 둥글게 만듭니다 */
            padding: 24px;
            /* 상자 내부 여백을 줍니다 */
            margin-bottom: 30px;
            /* 아래쪽 요소와의 간격을 띄웁니다 */
            text-align: center;
            /* 텍스트를 가운데 정렬합니다 */
            width: 100%;
            /* 너비를 꽉 채우도록 합니다 */
            max-width: 600px;
            /* 최대 너비를 600픽셀로 제한합니다 */
            box-sizing: border-box;
            /* 패딩이 너비에 포함되도록 설정합니다 */
        }

        .dday-title {
            /* 목표 이름 텍스트 스타일입니다 */
            font-size: 1.2rem;
            /* 글자 크기를 적당하게 지정합니다 */
            margin-bottom: 8px;
            /* 아래쪽 여백을 줍니다 */
            color: var(--primary-color);
            /* 포인트 컬러를 적용합니다 */
        }

        .dday-value {
            /* 남은 날짜 숫자 텍스트 스타일입니다 */
            font-size: 2.5rem;
            /* 숫자를 아주 크게 표시합니다 */
            font-weight: bold;
            /* 글자를 굵게 만듭니다 */
        }

        .schedule-container {
            /* 시간표 전체를 감싸는 상자 스타일입니다 */
            width: 100%;
            /* 너비를 꽉 채우도록 합니다 */
            max-width: 800px;
            /* 최대 너비를 800픽셀로 제한합니다 */
            overflow-x: auto;
            /* 화면이 작을 때 가로 스크롤이 생기도록 합니다 */
        }

        .status-message {
            /* 주말이나 방과 후 상태 문구 스타일입니다 */
            text-align: center;
            /* 텍스트를 가운데 정렬합니다 */
            margin-bottom: 15px;
            /* 아래쪽 여백을 줍니다 */
            font-size: 1.1rem;
            /* 글자 크기를 지정합니다 */
            font-weight: bold;
            /* 글자를 굵게 만듭니다 */
            color: var(--primary-color);
            /* 포인트 색상을 적용합니다 */
        }

        table {
            /* 시간표 표 전체 스타일입니다 */
            width: 100%;
            /* 표 너비를 상자에 맞게 꽉 채웁니다 */
            border-collapse: collapse;
            /* 표 테두리 선이 겹치지 않게 하나로 합칩니다 */
        }

        th, td {
            /* 표의 제목 칸(th)과 내용 칸(td) 공통 스타일입니다 */
            background-color: var(--cell-bg);
            /* 칸 배경색을 지정합니다 */
            border: 2px solid var(--bg-color);
            /* 칸 사이에 간격을 주기 위해 배경색과 같은 두께의 테두리를 줍니다 */
            border-radius: var(--border-radius);
            /* 칸 모서리를 둥글게 만듭니다 */
            padding: 14px;
            /* 칸 안쪽 여백을 줍니다 */
            text-align: center;
            /* 텍스트를 가운데 정렬합니다 */
            font-size: 0.95rem;
            /* 글자 크기를 지정합니다 */
            transition: all 0.3s ease;
            /* 스타일이 바뀔 때 부드럽게 애니메이션 효과를 줍니다 */
        }

        th {
            /* 요일이 들어가는 머리글 칸 스타일입니다 */
            background-color: var(--primary-color);
            /* 배경을 포인트 컬러로 채웁니다 */
            color: #ffffff;
            /* 글자를 흰색으로 만듭니다 */
        }

        td.active-period {
            /* 현재 시각에 해당하는 교시 칸 강조 스타일입니다 */
            border: 3px solid var(--primary-color);
            /* 포인트 컬러로 두꺼운 테두리를 두릅니다 */
            background-color: #dfd4ff;
            /* 강조를 위해 약간 진한 연보라빛 배경색을 줍니다 */
            font-weight: bold;
            /* 글자를 굵게 만듭니다 */
        }
    </style>
</head>
<body>
    <div class="dday-container">
        <!-- 상단 D-Day 카운터를 표시할 영역입니다 -->
        <div id="ddayTitle" class="dday-title">목표 이름</div>
        <!-- 자바스크립트로 목표 이름을 채울 요소입니다 -->
        <div id="ddayValue" class="dday-value">D-0</div>
        <!-- 자바스크립트로 남은 날짜를 채울 요소입니다 -->
    </div>

    <div class="schedule-container">
        <!-- 하단 시간표를 표시할 영역입니다 -->
        <div id="statusMessage" class="status-message">현재 시각 확인 중...</div>
        <!-- 주말이나 현재 상태를 알려줄 문구 영역입니다 -->
        <table id="scheduleTable">
            <!-- 요일과 교시를 나타낼 표입니다 -->
            <thead>
                <tr>
                    <!-- 표의 첫 번째 줄(요일 머리글)입니다 -->
                    <th>교시</th>
                    <th>월</th>
                    <th>화</th>
                    <th>수</th>
                    <th>목</th>
                    <th>금</th>
                </tr>
            </thead>
            <tbody id="scheduleBody">
                <!-- 자바스크립트로 시간표 내용을 채워 넣을 본문 영역입니다 -->
            </tbody>
        </table>
    </div>

    <script>
        // ==========================================
        // [여기만 고치세요] 설정 상자 영역
        // ==========================================
        
        // 목표 날짜를 설정합니다 (년, 월, 일) - 월은 0부터 시작하지 않고 실제 월을 적습니다
        const targetDateSetting = new Date("2026-12-31"); 
        
        // 목표 이름을 설정합니다
        const targetTitleSetting = "2026년 목표 달성"; 

        // 1교시부터 5교시까지 요일별 시간표 내용을 정의합니다 (월~금 순서)
        // 순서: [월요일, 화요일, 수요일, 목요일, 금요일]
        const timetableData = [
            ["국어", "수학", "영어", "과학", "사회"], // 1교시 과목들
            ["영어", "국어", "수학", "사회", "과학"], // 2교시 과목들
            ["수학", "과학", "국어", "영어", "체육"], // 3교시 과목들
            ["사회", "영어", "과학", "국어", "미술"], // 4교시 과목들
            ["체육", "미술", "사회", "수학", "음악"]  // 5교시 과목들
        ];

        // 각 교시별 시작 및 종료 시각을 정의합니다 (24시간 기준 시, 분)
        const periodTimes = [
            { startHour: 9, startMin: 0, endHour: 9, endMin: 50 },   // 1교시: 09:00 ~ 09:50
            { startHour: 10, startMin: 0, endHour: 10, endMin: 50 }, // 2교시: 10:00 ~ 10:50
            { startHour: 11, startMin: 0, endHour: 11, endMin: 50 }, // 3교시: 11:00 ~ 11:50
            { startHour: 13, startMin: 0, endHour: 13, endMin: 50 }, // 4교시: 13:00 ~ 13:50 (점심시간 이후)
            { startHour: 14, startMin: 0, endHour: 14, endMin: 50 }  // 5교시: 14:00 ~ 14:50
        ];

        // ==========================================
        // 여기서부터는 프로그램 실행 로직입니다
        // ==========================================

        function updateDDay() {
            // D-Day 날짜를 계산하고 화면에 반영하는 함수입니다
            const today = new Date();
            // 오늘 날짜 정보를 가져옵니다
            
            // 시각 차이를 없애기 위해 날짜만 추출하여 비교합니다
            const target = new Date(targetDateSetting.getFullYear(), targetDateSetting.getMonth(), targetDateSetting.getDate());
            const current = new Date(today.getFullYear(), today.getMonth(), today.getDate());
            
            const diffTime = target - current;
            // 목표 날짜와 오늘 날짜의 밀리초 차이를 구합니다
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            // 밀리초를 일(day) 단위로 변환합니다

            // 화면의 목표 이름 요소를 찾아 텍스트를 바꿉니다
            document.getElementById("ddayTitle").innerText = targetTitleSetting;
            
            const ddayValueElement = document.getElementById("ddayValue");
            // 남은 날짜를 표시할 요소를 가져옵니다
            
            if (diffDays > 0) {
                // 목표일이 미래인 경우
                ddayValueElement.innerText = `D - ${diffDays}`;
            } else if (diffDays === 0) {
                // 오늘이 바로 그날인 경우
                ddayValueElement.innerText = "D - Day!";
            } else {
                // 목표일이 이미 지난 경우
                ddayValueElement.innerText = `D + ${Math.abs(diffDays)}`;
            }
        }

        function renderTimetable() {
            // 시간표 표의 본문 내용을 HTML로 만들어 채워 넣는 함수입니다
            const tbody = document.getElementById("scheduleBody");
            // 시간표 <tbody> 요소를 가져옵니다
            tbody.innerHTML = "";
            // 기존 내용을 초기화합니다

            // 1교시부터 5교시까지 반복합니다
            for (let periodIndex = 0; periodIndex < 5; periodIndex++) {
                const row = document.createElement("tr");
                // 새로운 행(tr)을 만듭니다

                // 교시 번호 칸을 먼저 만듭니다
                const periodCell = document.createElement("td");
                periodCell.innerText = `${periodIndex + 1}교시`;
                row.appendChild(periodCell);

                // 월요일부터 금요일까지 과목 데이터를 채웁니다
                for (let dayIndex = 0; dayIndex < 5; dayIndex++) {
                    const cell = document.createElement("td");
                    cell.innerText = timetableData[periodIndex][dayIndex];
                    // 해당 교시, 해당 요일의 과목명을 넣습니다
                    
                    // 나중에 현재 교시를 찾기 쉽도록 고유 아이디를 부여합니다
                    cell.id = `cell-${dayIndex + 1}-${periodIndex + 1}`;
                    row.appendChild(cell);
                }

                tbody.appendChild(row);
                // 완성된 행을 표 본문에 추가합니다
            }
        }

        function updateCurrentStatus() {
            // 현재 시각을 확인하여 요일, 교시를 판별하고 강조 및 문구를 갱신하는 함수입니다
            const now = new Date();
            // 현재 날짜와 시각 객체를 생성합니다
            const dayOfWeek = now.getDay(); 
            // 요일을 숫자로 가져옵니다 (0: 일요일, 1: 월요일, ..., 6: 토요일)
            
            const currentHour = now.getHours();
            // 현재 시간을 가져옵니다 (0~23)
            const currentMin = now.getMinutes();
            // 현재 분을 가져옵니다 (0~59)
            const currentTimeValue = currentHour * 60 + currentMin;
            // 비교를 위해 현재 시각을 분(minute) 단위로 환산합니다

            const statusMessageElement = document.getElementById("statusMessage");
            // 상태 문구를 표시할 요소를 가져옵니다

            // 먼저 모든 칸의 강조 스타일(테두리)을 초기화합니다
            const allCells = document.querySelectorAll("#scheduleBody td");
            allCells.forEach(cell => cell.classList.remove("active-period"));

            // 토요일(6)이거나 일요일(0)인 경우
            if (dayOfWeek === 0 || dayOfWeek === 6) {
                statusMessageElement.innerText = "오늘은 쉬는 날 (주말입니다)";
                return; // 주말이므로 여기서 함수를 종료합니다
            }

            // 월요일(1) ~ 금요일(5)인 경우 요일 인덱스 변환 (월요일: 1 -> 표의 첫 번째 과목 열)
            const currentDayColumn = dayOfWeek; 

            let activePeriodFound = false;
            // 현재 진행 중인 교시를 찾았는지 여부 변수입니다

            // 1교시부터 5교시까지 순회하며 현재 시각이 포함되는지 확인합니다
            for (let i = 0; i < periodTimes.length; i++) {
                const period = periodTimes[i];
                const startTimeValue = period.startHour * 60 + period.startMin;
                const endTimeValue = period.endHour * 60 + period.endMin;

                if (currentTimeValue >= startTimeValue && currentTimeValue <= endTimeValue) {
                    // 현재 시각이 해당 교시 시작과 종료 사이에 있는 경우
                    const targetCellId = `cell-${currentDayColumn}-${i + 1}`;
                    const targetCell = document.getElementById(targetCellId);
                    
                    if (targetCell) {
                        targetCell.classList.add("active-period");
                        // 해당 칸에 강조 클래스를 추가합니다
                    }

                    statusMessageElement.innerText = `현재 진행 중: ${i + 1}교시 (${period.startHour.toString().padStart(2, '0')}:${period.startMin.toString().padStart(2, '0')} ~ ${period.endHour.toString().padStart(2, '0')}:${period.endMin.toString().padStart(2, '0')})`;
                    activePeriodFound = true;
                    break;
                }
            }

            // 수업 시간대가 아닌 경우 처리
            if (!activePeriodFound) {
                if (currentTimeValue < (periodTimes[0].startHour * 60 + periodTimes[0].startMin)) {
                    statusMessageElement.innerText = "수업 시작 전입니다";
                } else {
                    statusMessageElement.innerText = "오늘 수업이 모두 끝났습니다";
                }
            }
        }

        // 웹페이지가 처음 로드될 때 실행되는 함수들입니다
        window.onload = function() {
            updateDDay(); // D-Day 계산 실행
            renderTimetable(); // 시간표 표 생성 실행
            updateCurrentStatus(); // 현재 시각 및 교시 강조 실행

            // 1분(60,000 밀리초)마다 자동으로 현재 시각 상태를 갱신합니다
            setInterval(updateCurrentStatus, 60000);
        };
    </script>
</body>
</html>
