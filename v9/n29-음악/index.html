<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 시간표 & D-Day</title>
    <!-- 구글 폰트 Noto Serif KR (본명조) 불러오기 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* :root 색상 변수 설정 구역 */
        :root {
            --bg-color: #f2f2f0;      /* 전체 배경색 */
            --box-bg: #ffffff;        /* 박스 및 칸 배경색 */
            --text-color: #111111;    /* 기본 글자색 */
            --point-color: #111111;   /* 포인트 및 강조 색상 */
            --border-color: #111111;  /* 테두리 선 색상 */
        }

        /* 전체 페이지 기본 설정 (본명조 폰트 및 0px 모서리 적용) */
        body {
            font-family: 'Noto Serif KR', serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 무드 한 줄 소개 스타일 */
        .mood-text {
            font-size: 0.85rem;
            color: var(--text-color);
            opacity: 0.6;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }

        /* 메인 타이틀 스타일 */
        .main-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 15px;
            letter-spacing: -0.5px;
        }

        /* D-Day 카운터 박스 디자인 */
        .dday-container {
            background-color: var(--box-bg);
            border: 1px solid var(--border-color);
            padding: 20px 40px;
            border-radius: 0px;
            text-align: center;
            margin-bottom: 25px;
            width: 100%;
            max-width: 800px;
            box-sizing: border-box;
        }

        /* 목표 이름 폰트 스타일 */
        .dday-title {
            font-size: 1rem;
            color: var(--text-color);
            opacity: 0.7;
            margin-bottom: 5px;
        }

        /* 남은 날짜(D-Day 숫자) 폰트 스타일 */
        .dday-count {
            font-size: 2rem;
            font-weight: 700;
            color: var(--point-color);
        }

        /* 시간표 테이블 감싸는 박스 */
        .table-container {
            background-color: var(--box-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 0px;
            width: 100%;
            max-width: 900px;
            overflow-x: auto;
            box-sizing: border-box;
        }

        /* 시간표 테이블 디자인 (table-layout: fixed로 칸 간격을 일정하게 고정) */
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            table-layout: fixed; 
        }

        /* 테이블 칸(셀) 디자인 및 너비 균등 분할 설정 */
        th, td {
            border: 1px solid var(--border-color);
            padding: 12px 6px;
            font-size: 0.85rem;
            border-radius: 0px;
            width: 14.28%; /* 시간/교시 칸(1개) + 월~금(5개) = 총 6개 칸이 일정하게 나누어지도록 설정 */
        }

        /* 표의 제목 행(요일, 교시 등) 배경색 */
        th {
            background-color: var(--point-color);
            color: var(--box-bg);
            font-weight: 600;
        }

        /* 시간 정보 칸 스타일 */
        .time-col {
            background-color: var(--box-bg);
            color: var(--text-color);
            font-size: 0.7rem;
            white-space: nowrap;
        }

        /* 점심시간 행 특별 디자인 */
        .lunch-row {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-weight: 600;
        }

        /* 현재 교시 테두리 강조 스타일 */
        .current-cell {
            border: 2px solid var(--point-color) !important;
            font-weight: 700;
        }

        /* 주말 안내 메시지 스타일 */
        .weekend-notice {
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-color);
            opacity: 0.7;
            margin-bottom: 15px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- 메인 페이지 제목 출력 영역 -->
    <div id="main-title" class="main-title">시간표 로딩 중...</div>

    <!-- 주말 안내 메시지 출력 영역 -->
    <div id="weekend-notice" class="weekend-notice" style="display: none;">오늘은 쉬는 날</div>

    <!-- 화면 위쪽 D-Day 영역 -->
    <div class="dday-container">
        <div id="dday-title" class="dday-title">목표 로딩 중...</div>
        <div id="dday-count" class="dday-count">D-0</div>
    </div>

    <!-- 화면 아래쪽 시간표 영역 -->
    <div class="table-container">
        <table id="timetable">
            <thead>
                <tr id="table-header">
                    <!-- 자바스크립트로 요일 헤더가 동적 생성됩니다 -->
                </tr>
            </thead>
            <tbody id="timetable-body">
                <!-- 자바스크립트로 시간표 내용이 동적 생성됩니다 -->
            </tbody>
        </table>
    </div>

    <!-- 자바스크립트 작성 구간 -->
    <script>
        // ==========================================
        // [여기만 고치세요] 데이터 설정 구역
        // ==========================================
        const TITLE  = '1학년 2학기 시간표'; // 상단에 표시할 전체 제목
        const TARGET = { label:'공연날', date:'2026-10-21' }; // D-Day 목표 이름과 날짜
        const DAYS   = ['월','화','수','목','금']; // 요일 배열
        const PERIODS = [
            { time:'09:05 ~ 09:50', subjects:['국어', '기가', '도덕', '사회', '한문'] }, // 1교시
            { time:'10:00 ~ 10:45', subjects:['도덕', '사회', '국어', '스포츠', '수학'] }, // 2교시
            { time:'10:55 ~ 11:40', subjects:['체육', '과학', '기가', '영어', '영어'] }, // 3교시
            { time:'11:50 ~ 12:35', subjects:['음악', '국어', '수학', '국어', '기가'] }, // 4교시
            { time:'12:35 ~ 13:30', subjects:'점심' },                                 // 점심시간
            { time:'13:35 ~ 14:20', subjects:['과학', '수학', '한문', '수학', '체육'] }, // 5교시
            { time:'14:30 ~ 15:15', subjects:['영어', '동아리', '음악', '과학', '사회'] }, // 6교시
            { time:'15:25 ~ 16:10', subjects:[' ', '체육', ' ', '도덕', ' '] }          // 7교시
        ];

        // ==========================================
        // 메인 제목 및 D-Day 계산 로직
        // ==========================================
        function updateHeaderAndDDay() {
            document.getElementById("main-title").innerText = TITLE;

            const titleElement = document.getElementById("dday-title");
            const countElement = document.getElementById("dday-count");

            titleElement.innerText = `[ ${TARGET.label}까지 ]`;

            const today = new Date();
            today.setHours(0, 0, 0, 0);

            const targetDay = new Date(TARGET.date);
            targetDay.setHours(0, 0, 0, 0);

            const diffTime = targetDay - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays > 0) {
                countElement.innerText = `D - ${diffDays}`;
            } else if (diffDays === 0) {
                countElement.innerText = `D - Day (오늘)`;
            } else {
                countElement.innerText = `D + ${Math.abs(diffDays)}`;
            }
        }

        // ==========================================
        // 시간표 테이블 생성 로직
        // ==========================================
        function renderTimetable() {
            const headerRow = document.getElementById("table-header");
            headerRow.innerHTML = `<th>시간 / 교시</th>` + DAYS.map(day => `<th>${day}</th>`).join('');

            const tbody = document.getElementById("timetable-body");
            tbody.innerHTML = "";

            PERIODS.forEach((periodItem, index) => {
                const row = document.createElement("tr");

                if (typeof periodItem.subjects === 'string') {
                    row.className = "lunch-row";
                    
                    const timeCell = document.createElement("td");
                    timeCell.className = "time-col";
                    timeCell.innerText = periodItem.time;
                    row.appendChild(timeCell);

                    const lunchCell = document.createElement("td");
                    lunchCell.colSpan = DAYS.length;
                    lunchCell.innerText = `${periodItem.subjects} 시간 (${periodItem.time})`;
                    row.appendChild(lunchCell);
                } 
                else {
                    const timeCell = document.createElement("td");
                    timeCell.className = "time-col";
                    const periodNum = index > 4 ? index : index + 1;
                    timeCell.innerHTML = `<strong>${periodNum}교시</strong><br><span style="font-size:0.65rem; opacity:0.6;">${periodItem.time}</span>`;
                    row.appendChild(timeCell);

                    periodItem.subjects.forEach(subject => {
                        const subjectCell = document.createElement("td");
                        subjectCell.innerText = subject === " " ? "" : subject;
                        row.appendChild(subjectCell);
                    });
                }

                tbody.appendChild(row);
            });
        }

        // ==========================================
        // 현재 시각 기준으로 오늘 요일/교시 테두리 강조 및 주말 안내 로직
        // ==========================================
        function highlightCurrentPeriod() {
            // 기존에 적용된 강조 클래스 초기화
            document.querySelectorAll(".current-cell").forEach(cell => {
                cell.classList.remove("current-cell");
            });

            const now = new Date();
            const dayOfWeek = now.getDay(); // 0:일, 1:월, 2:화, 3:수, 4:목, 5:금, 6:토
            const weekendNotice = document.getElementById("weekend-notice");

            // 주말(토요일: 6, 일요일: 0)인 경우 "오늘은 쉬는 날" 문구 표시 후 종료
            if (dayOfWeek === 0 || dayOfWeek === 6) {
                weekendNotice.style.display = "block";
                return;
            } else {
                weekendNotice.style.display = "none";
            }

            // 현재 시각을 'HH:MM' 형태의 문자열로 변환
            const currentHour = String(now.getHours()).padStart(2, '0');
            const currentMin = String(now.getMinutes()).padStart(2, '0');
            const currentTimeStr = `${currentHour}:${currentMin}`;

            const tbody = document.getElementById("timetable-body");

            // PERIODS 배열을 순회하며 현재 시간에 맞는 교시 탐색
            PERIODS.forEach((periodItem, index) => {
                // 점심시간은 건너뜀
                if (typeof periodItem.subjects === 'string') return;

                // 시간 문자열 파싱 (시작시간, 종료시간)
                const [start, end] = periodItem.time.split('~').map(s => s.trim());

                // 현재 시각이 해당 교시 시간 범위에 포함되는지 확인
                if (currentTimeStr >= start && currentTimeStr <= end) {
                    const targetRow = tbody.children[index]; // 해당 교시 행(tr)
                    
                    if (targetRow) {
                        // 요일에 해당하는 칸(td) 선택 (월요일: 1번 인덱스, 화요일: 2번 인덱스...)
                        const targetCell = targetRow.children[dayOfWeek];
                        if (targetCell) {
                            targetCell.classList.add("current-cell"); // 강조 클래스 부여
                        }
                    }
                }
            });
        }

        window.onload = function() {
            updateHeaderAndDDay();
            renderTimetable();
            highlightCurrentPeriod();

            // 1분(60,000밀리초)마다 현재 교시 강조 및 D-Day 정보 자동 갱신
            setInterval(() => {
                updateHeaderAndDDay();
                highlightCurrentPeriod();
            }, 60000);
        };
    </script>
</body>
</html>
