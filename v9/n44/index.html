<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Pulse Ascent - Vertical Arcade Game</title>
    <!-- Tailwind CSS for modern UI styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Orbitron', sans-serif;
            background-color: #030712;
            color: #ffffff;
            overflow-x: hidden;
        }
        canvas {
            display: block;
            touch-action: none;
        }
        .glow-text {
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.8), 0 0 20px rgba(59, 130, 246, 0.5);
        }
        .glow-box {
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.3), inset 0 0 15px rgba(59, 130, 246, 0.2);
        }
        .yellow-glow-bar {
            box-shadow: 0 0 12px rgba(234, 179, 8, 0.8), inset 0 0 6px rgba(253, 224, 71, 0.8);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(6, 182, 212, 0.6);
            border-radius: 4px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-3 select-none">

    <header class="w-full max-w-[360px] flex justify-between items-center mb-1.5 px-1">
        <div>
            <h1 class="text-base md:text-lg font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-500 glow-text">
                NEON ASCENT
            </h1>
            <p class="text-[9px] text-slate-400">수직 상승 서바이벌 아케이드</p>
        </div>
        <div class="flex gap-2">
            <div class="bg-slate-900/80 border border-cyan-500/40 rounded-xl px-2 py-0.5 text-right">
                <span class="block text-[7px] text-cyan-400 font-bold uppercase tracking-wider">ALTITUDE</span>
                <span id="currentAltitude" class="text-xs font-bold text-white">0</span><span class="text-[8px] text-cyan-400">m</span>
            </div>
            <div class="bg-slate-900/80 border border-amber-500/40 rounded-xl px-2 py-0.5 text-right">
                <span class="block text-[7px] text-amber-400 font-bold uppercase tracking-wider">CURRENCY</span>
                <span id="currencyDisplay" class="text-xs font-bold text-amber-300">0</span>
            </div>
        </div>
    </header>

    <main class="relative w-full max-w-[360px] aspect-[1/1.5] bg-slate-950 rounded-2xl border-2 border-cyan-500/30 glow-box overflow-hidden flex items-center justify-center">
        
        <!-- Top Yellow Ascent Progress Bar -->
        <div class="absolute top-3 left-4 right-4 z-10 flex flex-col gap-1 pointer-events-none">
            <div class="flex justify-between items-center text-[9px] font-bold tracking-wider text-amber-300 drop-shadow-[0_0_4px_rgba(0,0,0,0.8)]">
                <span>ASCENT PROGRESS</span>
                <span id="progressPercentage">0%</span>
            </div>
            <div class="w-full h-2.5 bg-slate-900/80 border border-amber-500/40 rounded-full overflow-hidden p-0.5 backdrop-blur-sm">
                <div id="progressBarFill" class="h-full bg-gradient-to-r from-amber-500 to-yellow-300 rounded-full yellow-glow-bar transition-all duration-75" style="width: 0%;"></div>
            </div>
        </div>

        <canvas id="gameCanvas" class="w-full h-full cursor-crosshair"></canvas>

        <div id="startScreen" class="absolute inset-0 bg-slate-950/92 backdrop-blur-md flex flex-col items-center justify-center p-5 text-center z-20">
            <div class="w-14 h-14 mb-3 rounded-2xl bg-gradient-to-tr from-cyan-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-cyan-500/50 animate-bounce">
                <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"></path>
                </svg>
            </div>
            <h2 class="text-2xl font-black text-white mb-1.5 glow-text">NEON PULSE ASCENT</h2>
            <p class="text-slate-300 text-[11px] max-w-xs mb-4 leading-relaxed">
                우주 대기권을 뚫고 부드럽게 상승하세요.<br>
                1000m 정상에 도달해 미션을 완료하세요!
            </p>
            <div class="flex flex-col gap-2.5 w-full max-w-[200px]">
                <button id="startButton" class="w-full py-3 bg-gradient-to-r from-cyan-500 to-indigo-600 rounded-xl font-bold text-xs text-white tracking-wider shadow-lg shadow-cyan-500/40 hover:shadow-cyan-500/70 active:scale-95 transition-all">
                    상승 시작
                </button>
                <button id="shopButton" class="w-full py-2.5 bg-slate-900 hover:bg-slate-800 border border-amber-500/50 rounded-xl font-bold text-xs text-amber-300 tracking-wider shadow-md shadow-amber-500/20 active:scale-95 transition-all flex items-center justify-center gap-1.5">
                    <svg class="w-4 h-4 text-amber-400" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M4 3a2 2 0 100 4h12a2 2 0 100-4H4z"></path>
                        <path fill-rule="evenodd" d="M3 8h14v7a2 2 0 01-2 2H5a2 2 0 01-2-2V8zm5 3a1 1 0 011-1h2a1 1 0 110 2H9a1 1 0 01-1-1z" clip-rule="evenodd"></path>
                    </svg>
                    함선 스킨 샵
                </button>
            </div>
        </div>

        <div id="shopScreen" class="absolute inset-0 bg-slate-950/95 backdrop-blur-md flex flex-col items-center justify-between p-4 z-30 hidden">
            <div class="w-full flex justify-between items-center border-b border-slate-800 pb-2">
                <div class="flex items-center gap-2">
                    <div class="w-7 h-7 rounded-lg bg-amber-500/20 border border-amber-500 flex items-center justify-center">
                        <svg class="w-4 h-4 text-amber-400" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M4 3a2 2 0 100 4h12a2 2 0 100-4H4z"></path>
                            <path fill-rule="evenodd" d="M3 8h14v7a2 2 0 01-2 2H5a2 2 0 01-2-2V8zm5 3a1 1 0 011-1h2a1 1 0 110 2H9a1 1 0 01-1-1z" clip-rule="evenodd"></path>
                        </svg>
                    </div>
                    <div>
                        <h3 class="text-sm font-bold text-white">함선 스킨 마켓</h3>
                        <p class="text-[9px] text-slate-400">보유 크레딧: <span id="shopCurrency" class="text-amber-400 font-bold">0</span></p>
                    </div>
                </div>
                <button id="closeShopButton" class="w-7 h-7 rounded-full bg-slate-900 border border-slate-700 flex items-center justify-center text-slate-300 hover:bg-slate-800">
                    ✕
                </button>
            </div>

            <div id="skinListContainer" class="w-full flex-1 overflow-y-auto custom-scrollbar my-2.5 space-y-2 pr-1">
                <!-- Populated dynamically via JS -->
            </div>

            <button id="backToStartButton" class="w-full py-2.5 bg-slate-900 hover:bg-slate-800 border border-slate-700 rounded-xl font-bold text-xs text-slate-300 tracking-wider active:scale-95 transition-all">
                돌아가기
            </button>
        </div>

        <div id="winScreen" class="absolute inset-0 bg-slate-950/92 backdrop-blur-md flex flex-col items-center justify-center p-5 text-center z-20 hidden">
            <div class="w-14 h-14 mb-3 rounded-2xl bg-gradient-to-tr from-amber-400 to-emerald-500 flex items-center justify-center shadow-lg shadow-amber-500/50 animate-pulse">
                <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path>
                </svg>
            </div>
            <h2 class="text-2xl font-black text-amber-400 mb-1 tracking-wide">MISSION COMPLETE!</h2>
            <p class="text-slate-300 text-[11px] mb-3">1000m 정상 도달 성공!</p>
            <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-3 w-44 mb-4 shadow-inner">
                <div class="text-[10px] text-slate-400 mb-1">획득한 크레딧</div>
                <div id="winScore" class="text-xl font-black text-amber-300">0</div>
            </div>
            <div class="flex gap-2 w-full max-w-[220px]">
                <button id="restartButtonWin" class="flex-1 py-3 bg-gradient-to-r from-emerald-500 to-teal-600 rounded-xl font-bold text-xs text-white tracking-wider shadow-lg shadow-emerald-500/40 hover:shadow-emerald-500/70 active:scale-95 transition-all">
                    다시 하기
                </button>
                <button id="winShopButton" class="px-3.5 py-3 bg-slate-900 hover:bg-slate-800 border border-amber-500/50 rounded-xl font-bold text-xs text-amber-300 active:scale-95 transition-all">
                    상점
                </button>
            </div>
        </div>

        <div id="gameOverScreen" class="absolute inset-0 bg-slate-950/92 backdrop-blur-md flex flex-col items-center justify-center p-5 text-center z-20 hidden">
            <h2 class="text-2xl font-black text-rose-500 mb-1 tracking-wide">CRASHED</h2>
            <p class="text-slate-400 text-[11px] mb-3">함선이 장애물과 충돌했습니다</p>
            <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-3 w-44 mb-4 shadow-inner">
                <div class="text-[10px] text-slate-400 mb-1">도달 고도 / 획득</div>
                <div id="finalAltitude" class="text-xl font-black text-rose-400">0m</div>
            </div>
            <div class="flex gap-2 w-full max-w-[220px]">
                <button id="restartButtonLose" class="flex-1 py-3 bg-gradient-to-r from-rose-500 to-pink-600 rounded-xl font-bold text-xs text-white tracking-wider shadow-lg shadow-rose-500/40 hover:shadow-rose-500/70 active:scale-95 transition-all">
                    다시 시도
                </button>
                <button id="loseShopButton" class="px-3.5 py-3 bg-slate-900 hover:bg-slate-800 border border-amber-500/50 rounded-xl font-bold text-xs text-amber-300 active:scale-95 transition-all">
                    상점
                </button>
            </div>
        </div>
    </main>

    <footer class="w-full max-w-[360px] mt-2 flex justify-between items-center text-[11px] text-slate-400 px-1">
        <div class="flex items-center gap-1.5">
            <span class="px-2 py-1 bg-slate-900 border border-slate-800 rounded text-[9px]">PC: A/D 또는 방향키</span>
            <span class="px-2 py-1 bg-slate-900 border border-slate-800 rounded text-[9px]">Mobile: 드래그</span>
        </div>
        <button id="soundToggle" class="px-2.5 py-1 bg-slate-900 hover:bg-slate-800 border border-slate-800 rounded-lg text-slate-300 transition-colors flex items-center gap-1">
            <svg class="w-3.5 h-3.5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
            </svg>
            <span id="soundStatus">사운드 ON</span>
        </button>
    </footer>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const startScreen = document.getElementById('startScreen');
        const shopScreen = document.getElementById('shopScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const winScreen = document.getElementById('winScreen');
        
        const startButton = document.getElementById('startButton');
        const shopButton = document.getElementById('shopButton');
        const closeShopButton = document.getElementById('closeShopButton');
        const backToStartButton = document.getElementById('backToStartButton');
        const winShopButton = document.getElementById('winShopButton');
        const loseShopButton = document.getElementById('loseShopButton');
        
        const restartButtonLose = document.getElementById('restartButtonLose');
        const restartButtonWin = document.getElementById('restartButtonWin');
        
        const currentAltitudeEl = document.getElementById('currentAltitude');
        const currencyDisplay = document.getElementById('currencyDisplay');
        const shopCurrency = document.getElementById('shopCurrency');
        const finalAltitudeEl = document.getElementById('finalAltitude');
        const winScoreEl = document.getElementById('winScore');
        
        const soundToggle = document.getElementById('soundToggle');
        const soundStatus = document.getElementById('soundStatus');
        const progressBarFill = document.getElementById('progressBarFill');
        const progressPercentage = document.getElementById('progressPercentage');
        const skinListContainer = document.getElementById('skinListContainer');

        let playerCurrency = parseInt(localStorage.getItem('neon_ascent_currency') || '0', 10);
        let unlockedSkins = JSON.parse(localStorage.getItem('neon_ascent_unlocked') || '["classic"]');
        let equippedSkin = localStorage.getItem('neon_ascent_equipped') || 'classic';

        const skins = [
            {
                id: 'classic',
                name: '클래식 시안 (Classic Cyan)',
                price: 0,
                color: '#06b6d4',
                trailColor: 'rgba(6, 182, 212, 0.4)',
                glow: '#06b6d4',
                desc: '표준 네온 함선. 안정적인 비행 성능.'
            },
            {
                id: 'cyber_purple',
                name: '사이버 퍼플 (Cyber Purple)',
                price: 200,
                color: '#a855f7',
                trailColor: 'rgba(168, 85, 247, 0.4)',
                glow: '#c084fc',
                desc: '신비로운 보라빛 네온 플라즈마 코어.'
            },
            {
                id: 'neon_gold',
                name: '네온 골드 (Neon Gold)',
                price: 500,
                color: '#fbbf24',
                trailColor: 'rgba(251, 191, 36, 0.4)',
                glow: '#fde047',
                desc: '황금빛 찬란한 부의 상징인 하이테크 함선.'
            },
            {
                id: 'plasma_emerald',
                name: '플라즈마 에메랄드 (Emerald)',
                price: 900,
                color: '#10b981',
                trailColor: 'rgba(16, 185, 129, 0.4)',
                glow: '#34d399',
                desc: '초고속 입자로 가공된 에메랄드 그린 스킨.'
            },
            {
                id: 'crimson_viper',
                name: '크림슨 바이퍼 (Crimson Viper)',
                price: 1500,
                color: '#38bdf8',
                trailColor: 'rgba(56, 189, 248, 0.4)',
                glow: '#7dd3fc',
                desc: '푸른 아쿠아빛 레이저처럼 날카로운 파일럿 스킨.'
            }
        ];

        function updateCurrencyUI() {
            currencyDisplay.textContent = playerCurrency;
            shopCurrency.textContent = playerCurrency;
            localStorage.setItem('neon_ascent_currency', playerCurrency.toString());
        }
        updateCurrencyUI();

        function renderShop() {
            skinListContainer.innerHTML = '';
            skins.forEach(skin => {
                const isUnlocked = unlockedSkins.includes(skin.id);
                const isEquipped = equippedSkin === skin.id;

                const card = document.createElement('div');
                card.className = `p-3 rounded-xl border flex items-center justify-between transition-all ${
                    isEquipped 
                        ? 'bg-slate-900/90 border-cyan-500 shadow-md shadow-cyan-500/20' 
                        : isUnlocked 
                            ? 'bg-slate-900/60 border-slate-700 hover:border-slate-500' 
                            : 'bg-slate-950/80 border-slate-800/80'
                }`;

                card.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 rounded-lg flex items-center justify-center border shadow-inner" style="background-color: ${skin.color}22; border-color: ${skin.color}">
                            <div class="w-4 h-4 rounded-full" style="background-color: ${skin.color}; box-shadow: 0 0 8px ${skin.glow}"></div>
                        </div>
                        <div>
                            <h4 class="text-xs font-bold text-white flex items-center gap-1.5">
                                ${skin.name}
                                ${isEquipped ? '<span class="text-[8px] bg-cyan-500/20 text-cyan-400 border border-cyan-500/40 px-1.5 py-0.5 rounded">장착중</span>' : ''}
                            </h4>
                            <p class="text-[9px] text-slate-400 max-w-[160px]">${skin.desc}</p>
                        </div>
                    </div>
                    <div>
                        ${
                            isEquipped 
                                ? `<span class="text-[10px] text-cyan-400 font-bold px-2.5 py-1">ACTIVE</span>`
                                : isUnlocked 
                                    ? `<button onclick="equipSkin('${skin.id}')" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded-lg text-[10px] font-bold text-white transition-all">장착</button>`
                                    : `<button onclick="buySkin('${skin.id}', ${skin.price})" class="px-3 py-1.5 bg-gradient-to-r from-amber-500 to-yellow-500 hover:brightness-110 rounded-lg text-[10px] font-bold text-slate-950 transition-all shadow-sm">🔒 ${skin.price}</button>`
                        }
                    </div>
                `;
                skinListContainer.appendChild(card);
            });
        }

        window.buySkin = function(id, price) {
            if (playerCurrency >= price) {
                playerCurrency -= price;
                unlockedSkins.push(id);
                equippedSkin = id;
                localStorage.setItem('neon_ascent_unlocked', JSON.stringify(unlockedSkins));
                localStorage.setItem('neon_ascent_equipped', equippedSkin);
                updateCurrencyUI();
                renderShop();
                playSound('coin');
            } else {
                playSound('hit');
            }
        };

        window.equipSkin = function(id) {
            equippedSkin = id;
            localStorage.setItem('neon_ascent_equipped', equippedSkin);
            renderShop();
            playSound('start');
        };

        let gameState = 'START';
        let altitude = 0;
        const maxGoalAltitude = 1000;
        let soundEnabled = true;
        let animationFrameId = null;
        let lastTime = 0;

        let backgroundStars = [];
        let backgroundClouds = [];

        function initSkyBackground() {
            backgroundStars = [];
            for (let i = 0; i < 50; i++) {
                backgroundStars.push({
                    x: Math.random() * 360,
                    y: Math.random() * 600,
                    size: Math.random() * 1.8 + 0.5,
                    alpha: Math.random() * 0.7 + 0.3,
                    twinkleSpeed: Math.random() * 0.03 + 0.01
                });
            }
            backgroundClouds = [];
            for (let i = 0; i < 5; i++) {
                backgroundClouds.push({
                    x: Math.random() * 300,
                    y: Math.random() * 600,
                    width: Math.random() * 80 + 60,
                    height: Math.random() * 25 + 15,
                    alpha: Math.random() * 0.12 + 0.03,
                    speed: Math.random() * 0.15 + 0.08
                });
            }
        }
        initSkyBackground();

        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!soundEnabled || !audioCtx) return;
            try {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;

                if (type === 'coin') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(587.33, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'hit') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(40, now + 0.3);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'start') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(600, now + 0.2);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } else if (type === 'win') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.setValueAtTime(554.37, now + 0.1);
                    osc.frequency.setValueAtTime(659.25, now + 0.2);
                    osc.frequency.setValueAtTime(880, now + 0.3);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                    osc.start(now);
                    osc.stop(now + 0.6);
                }
            } catch (e) {
                console.error(e);
            }
        }

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const player = {
            x: 0,
            y: 0,
            radius: 12,
            targetX: 0,
            trail: []
        };

        let obstacles = [];
        let coins = [];
        let particles = [];
        let spawnTimer = 0;

        const keys = {};
        window.addEventListener('keydown', e => { keys[e.key] = true; });
        window.addEventListener('keyup', e => { keys[e.key] = false; });

        let isPointerDown = false;
        canvas.addEventListener('pointerdown', e => {
            isPointerDown = true;
            updatePointerPosition(e);
        });
        canvas.addEventListener('pointermove', e => {
            if (isPointerDown) updatePointerPosition(e);
        });
        canvas.addEventListener('pointerup', () => { isPointerDown = false; });
        canvas.addEventListener('pointercancel', () => { isPointerDown = false; });

        function updatePointerPosition(e) {
            const rect = canvas.getBoundingClientRect();
            player.targetX = e.clientX - rect.left;
        }

        function updateProgressBar() {
            const progress = Math.min(100, Math.max(0, (altitude / maxGoalAltitude) * 100));
            progressBarFill.style.width = progress + '%';
            progressPercentage.textContent = Math.floor(progress) + '%';
        }

        function startGame() {
            initAudio();
            playSound('start');
            altitude = 0;
            currentAltitudeEl.textContent = '0';
            updateProgressBar();
            obstacles = [];
            coins = [];
            particles = [];
            spawnTimer = 0;
            initSkyBackground();

            const rect = canvas.getBoundingClientRect();
            player.x = rect.width / 2;
            player.targetX = player.x;
            player.y = rect.height - 70;
            player.trail = [];

            startScreen.classList.add('hidden');
            shopScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            winScreen.classList.add('hidden');
            gameState = 'PLAYING';
            lastTime = performance.now();
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function getActiveSkinData() {
            return skins.find(s => s.id === equippedSkin) || skins[0];
        }

        function spawnEntities(width) {
            spawnTimer++;
            const spawnInterval = Math.max(28, 58 - Math.floor(altitude / 120) * 3);

            if (spawnTimer % spawnInterval === 0 && altitude < maxGoalAltitude - 50) {
                const radius = Math.random() * 14 + 11;
                const isMoving = Math.random() > 0.4;
                obstacles.push({
                    x: Math.random() * (width - radius * 2) + radius,
                    y: -40,
                    radius: radius,
                    speed: Math.random() * 1.2 + 1.5 + (altitude / 600),
                    vx: isMoving ? (Math.random() > 0.5 ? 0.8 : -0.8) : 0,
                    color: '#38bdf8',
                    angle: 0,
                    spin: (Math.random() - 0.5) * 0.1
                });
            }

            if (spawnTimer % 80 === 0 && altitude < maxGoalAltitude - 80) {
                const radius = 9;
                coins.push({
                    x: Math.random() * (width - radius * 4) + radius * 2,
                    y: -40,
                    radius: radius,
                    speed: 1.5,
                    pulse: Math.random() * Math.PI
                });
            }
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 20; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 4 + 1;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: Math.random() * 2.5 + 1,
                    color: color,
                    alpha: 1,
                    decay: Math.random() * 0.03 + 0.015
                });
            }
        }

        // Helper function to smoothly interpolate hex colors
        function lerpColor(a, b, amount) {
            const ah = parseInt(a.replace(/#/g, ''), 16);
            const ar = ah >> 16, ag = (ah >> 8) & 0xff, ab = ah & 0xff;
            const bh = parseInt(b.replace(/#/g, ''), 16);
            const br = bh >> 16, bg = (bh >> 8) & 0xff, bb = bh & 0xff;
            const rr = Math.round(ar + amount * (br - ar));
            const rg = Math.round(ag + amount * (bg - ag));
            const rb = Math.round(ab + amount * (bb - ab));
            return `#${((1 << 24) + (rr << 16) + (rg << 8) + rb).toString(16).slice(1)}`;
        }

        function gameLoop(timestamp) {
            if (gameState !== 'PLAYING') return;

            const dt = timestamp - lastTime;
            lastTime = timestamp;

            const rect = canvas.getBoundingClientRect();
            const width = rect.width;
            const height = rect.height;

            // Smooth cosmic sky transitions (Deep Night Blue -> Twilight Indigo -> Deep Blue -> Cosmic Starlight Space)
            const progressRatio = Math.min(1.0, altitude / maxGoalAltitude);
            
            let topColor = '#030712';
            let bottomColor = '#0f172a';

            if (progressRatio <= 0.33) {
                const t = progressRatio / 0.33;
                topColor = lerpColor('#030712', '#0f172a', t);
                bottomColor = lerpColor('#0f172a', '#1e1b4b', t);
            } else if (progressRatio <= 0.66) {
                const t = (progressRatio - 0.33) / 0.33;
                topColor = lerpColor('#0f172a', '#1e1b4b', t);
                bottomColor = lerpColor('#1e1b4b', '#172554', t);
            } else {
                const t = (progressRatio - 0.66) / 0.34;
                topColor = lerpColor('#1e1b4b', '#172554', t);
                bottomColor = lerpColor('#172554', '#020617', t);
            }

            const bgGrad = ctx.createLinearGradient(0, 0, 0, height);
            bgGrad.addColorStop(0, topColor);
            bgGrad.addColorStop(1, bottomColor);
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, width, height);

            // Render and update scrolling stars
            backgroundStars.forEach(star => {
                star.y += 0.4;
                if (star.y > height) {
                    star.y = 0;
                    star.x = Math.random() * width;
                }
                star.alpha += star.twinkleSpeed;
                if (star.alpha > 0.9 || star.alpha < 0.2) star.twinkleSpeed *= -1;

                ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // Render and update drifting clouds
            backgroundClouds.forEach(cloud => {
                cloud.y += cloud.speed;
                if (cloud.y > height + 50) {
                    cloud.y = -50;
                    cloud.x = Math.random() * width;
                }
                ctx.fillStyle = `rgba(255, 255, 255, ${cloud.alpha * (1 - progressRatio * 0.7)})`;
                ctx.beginPath();
                ctx.ellipse(cloud.x, cloud.y, cloud.width / 2, cloud.height / 2, 0, 0, Math.PI * 2);
                ctx.fill();
            });

            altitude += 0.45;
            currentAltitudeEl.textContent = Math.floor(altitude);
            updateProgressBar();

            if (altitude >= maxGoalAltitude) {
                triggerWin();
                return;
            }

            const skin = getActiveSkinData();
            const keyboardSpeed = 6;
            if (keys['ArrowLeft'] || keys['a']) player.targetX -= keyboardSpeed;
            if (keys['ArrowRight'] || keys['d']) player.targetX += keyboardSpeed;

            player.targetX = Math.max(player.radius, Math.min(width - player.radius, player.targetX));
            player.x += (player.targetX - player.x) * 0.2;

            player.trail.push({ x: player.x, y: player.y });
            if (player.trail.length > 7) player.trail.shift();

            for (let i = 0; i < player.trail.length; i++) {
                const t = player.trail[i];
                const ratio = i / player.trail.length;
                ctx.beginPath();
                ctx.arc(t.x, t.y, player.radius * ratio * 0.8, 0, Math.PI * 2);
                ctx.fillStyle = skin.color;
                ctx.globalAlpha = ratio * 0.4;
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }

            ctx.save();
            ctx.shadowBlur = 16;
            ctx.shadowColor = skin.glow;
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = skin.color;
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();

            spawnEntities(width);

            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.y += obs.speed;
                obs.x += obs.vx;
                obs.angle += obs.spin;

                if (obs.x - obs.radius < 0 || obs.x + obs.radius > width) {
                    obs.vx *= -1;
                }

                ctx.save();
                ctx.translate(obs.x, obs.y);
                ctx.rotate(obs.angle);
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#38bdf8';
                ctx.strokeStyle = obs.color;
                ctx.lineWidth = 2;
                ctx.fillStyle = 'rgba(56, 189, 248, 0.15)';
                ctx.beginPath();
                ctx.rect(-obs.radius, -obs.radius, obs.radius * 2, obs.radius * 2);
                ctx.fill();
                ctx.stroke();
                ctx.restore();

                const hitBoxMultiplier = 1.2;
                const dx = player.x - obs.x;
                const dy = player.y - obs.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < player.radius + (obs.radius * hitBoxMultiplier)) {
                    playSound('hit');
                    createExplosion(player.x, player.y, '#38bdf8');
                    triggerGameOver();
                    return;
                }

                if (obs.y - obs.radius > height) {
                    obstacles.splice(i, 1);
                }
            }

            for (let i = coins.length - 1; i >= 0; i--) {
                const coin = coins[i];
                coin.y += coin.speed;
                coin.pulse += 0.1;
                const currentRadius = coin.radius + Math.sin(coin.pulse) * 1.5;

                ctx.save();
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#fbbf24';
                ctx.beginPath();
                ctx.arc(coin.x, coin.y, currentRadius, 0, Math.PI * 2);
                ctx.fillStyle = '#fbbf24';
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1.5;
                ctx.stroke();
                ctx.restore();

                const cdx = player.x - coin.x;
                const cdy = player.y - coin.y;
                const cdist = Math.sqrt(cdx * cdx + cdy * cdy);
                if (cdist < player.radius + currentRadius) {
                    playSound('coin');
                    createExplosion(coin.x, coin.y, '#fbbf24');
                    playerCurrency += 25;
                    updateCurrencyUI();
                    coins.splice(i, 1);
                    continue;
                }

                if (coin.y - coin.radius > height) {
                    coins.splice(i, 1);
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= p.decay;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
                ctx.restore();
            }

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function triggerGameOver() {
            gameState = 'GAMEOVER';
            const earnedReward = Math.floor(altitude / 2);
            playerCurrency += earnedReward;
            updateCurrencyUI();
            finalAltitudeEl.textContent = `${Math.floor(altitude)}m (+${earnedReward} 크레딧)`;
            gameOverScreen.classList.remove('hidden');
        }

        function triggerWin() {
            gameState = 'WIN';
            playSound('win');
            const earnedReward = 500 + Math.floor(altitude);
            playerCurrency += earnedReward;
            updateCurrencyUI();
            winScoreEl.textContent = `+${earnedReward} 크레딧`;
            winScreen.classList.remove('hidden');
        }

        startButton.addEventListener('click', startGame);
        restartButtonLose.addEventListener('click', startGame);
        restartButtonWin.addEventListener('click', startGame);

        shopButton.addEventListener('click', () => {
            renderShop();
            shopScreen.classList.remove('hidden');
        });

        winShopButton.addEventListener('click', () => {
            renderShop();
            shopScreen.classList.add('hidden');
            shopScreen.classList.remove('hidden');
        });

        loseShopButton.addEventListener('click', () => {
            renderShop();
            shopScreen.classList.add('hidden');
            shopScreen.classList.remove('hidden');
        });

        closeShopButton.addEventListener('click', () => {
            shopScreen.classList.add('hidden');
        });

        backToStartButton.addEventListener('click', () => {
            shopScreen.classList.add('hidden');
        });

        soundToggle.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            soundStatus.textContent = soundEnabled ? '사운드 ON' : '사운드 OFF';
            soundToggle.classList.toggle('border-cyan-500', soundEnabled);
        });

        ctx.fillStyle = '#030712';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    </script>
</body>
