<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5학년 2학기 나의 시간표</title>
    <!-- 구글 폰트 'Black Han Sans' 불러오기 -->
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffffff;      /* 배경 색상 */
            --box-color: #9497ff;     /* 칸/박스 배경 색상 */
            --text-color: #2f2a24;    /* 기본 글자 색상 */
            --point-color: #e2574c;   /* 강조(포인트) 색상 */
            --radius-size: 28px;      /* 모서리 둥글기 */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Black Han Sans', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .dday-box {
            background-color: var(--box-color);
            border-radius: var(--radius-size);
            padding: 25px;
            text-align: center;
            font-size: 24px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .dday-number {
            color: var(--point-color);
            font-size: 40px;
            margin-top: 10px;
        }

        .widgets-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .widget-box {
            background-color: var(--box-color);
            border-radius: var(--radius-size);
            padding: 15px 20px;
            font-size: 16px;
        }

        .weather-select, .mood-select {
            margin-top: 8px;
            padding: 5px 10px;
            border-radius: 10px;
            border: none;
            font-family: 'Black Han Sans', sans-serif;
            font-size: 14px;
        }

        .diary-box {
            background-color: var(--box-color);
            border-radius: var(--radius-size);
            padding: 15px 20px;
            grid-column: span 2;
        }

        .diary-textarea {
            width: 100%;
            height: 60px;
            margin-top: 8px;
            border-radius: 14px;
            border: none;
            padding: 10px;
            font-family: 'Black Han Sans', sans-serif;
            resize: none;
            box-sizing: border-box;
        }

        .alarm-box {
            background-color: var(--box-color);
            border-radius: var(--radius-size);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .alarm-controls {
            display: flex;
            gap: 10px;
        }

        .alarm-btn {
            background-color: var(--point-color);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 14px;
            font-family: 'Black Han Sans', sans-serif;
            cursor: pointer;
        }

        .schedule-box {
            background-color: var(--box-color);
            border-radius: var(--radius-size);
            padding: 20px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        th, td {
            padding: 12px;
            border: 2px solid white;
            font-size: 15px;
        }

        th {
            background-color: var(--point-color);
            color: white;
            border-radius: 10px;
        }

        /* 과목 칸 클릭 가능하도록 스타일 및 호버 효과 부여 */
        td.subject-cell {
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            position: relative;
        }

        td.subject-cell:hover {
            background-color: rgba(255, 255, 255, 0.3);
            transform: scale(1.02);
        }

        /* 준비물 표시 뱃지 디자인 */
        .prep-badge {
            display: inline-block;
            background-color: var(--point-color);
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 8px;
            margin-top: 4px;
            margin-left: 2px;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .modal-content {
            background-color: var(--box-color);
            padding: 25px;
            border-radius: var(--radius-size);
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            border: 4px solid white;
            text-align: center;
        }

        .modal-title {
            font-size: 20px;
            margin-bottom: 15px;
            color: var(--text-color);
        }

        .modal-textarea {
            width: 100%;
            height: 100px;
            border-radius: 14px;
            border: none;
            padding: 12px;
            font-family: 'Black Han Sans', sans-serif;
            resize: none;
            box-sizing: border-box;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .modal-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .modal-btn {
            background-color: var(--point-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 14px;
            font-family: 'Black Han Sans', sans-serif;
            cursor: pointer;
            font-size: 14px;
        }

        .modal-btn.cancel {
            background-color: #6c757d;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 스트리밍 및 UI 구성 요소 -->
        <div class="dday-box" id="ddayContainer">
            목표 로딩 중...
        </div>

        <div class="widgets-container">
            <div class="widget-box">
                <div>오늘의 날씨 ☀️</div>
                <select class="weather-select" id="weatherSelect">
                    <option value="맑음">맑음 ☀️</option>
                    <option value="흐림">흐림 ☁️</option>
                    <option value="비">비 🌧️</option>
                    <option value="눈">눈 ❄️</option>
                </select>
            </div>
            <div class="widget-box">
                <div>오늘의 기분 😊</div>
                <select class="mood-select" id="moodSelect">
                    <option value="좋음">좋음 😄</option>
                    <option value="신남">신남 🥳</option>
                    <option value="보통">보통 😐</option>
                    <option value="피곤함">피곤함 😴</option>
                </select>
            </div>
        </div>

        <div class="diary-box">
            <div>오늘의 일기 📝</div>
            <textarea class="diary-textarea" id="diaryInput" placeholder="오늘 어떤 일이 있었나요? 기록해보세요!"></textarea>
        </div>

        <div class="alarm-box">
            <div id="currentTimeDisplay">현재 시간: 00:00:00</div>
            <div class="alarm-controls">
                <input type="time" id="alarmTimeInput" class="weather-select">
                <button class="alarm-btn" id="setAlarmBtn">알람 설정</button>
                <button class="alarm-btn cancel" id="resetAlarmBtn" style="background-color: #6c757d;">알람 초기화</button>
            </div>
        </div>

        <div class="schedule-box">
            <h2 style="text-align: center; margin-top: 0;" id="scheduleTitle">시간표</h2>
            <table id="scheduleTable">
                <thead>
                    <tr>
                        <th>시간</th>
                        <th>월</th>
                        <th>화</th>
                        <th>수</th>
                        <th>목</th>
                        <th>금</th>
                    </tr>
                </thead>
                <tbody id="scheduleBody">
                    <!-- JavaScript로 동적 생성됨 -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- 준비물 입력 모달창 -->
    <div class="modal-overlay" id="prepModal">
        <div class="modal-content">
            <div class="modal-title" id="modalHeaderTitle">준비물 작성</div>
            <textarea class="modal-textarea" id="prepInput" placeholder="이 시간에 필요한 준비물을 적어주세요! (예: 공책, 색연필)"></textarea>
            <div class="modal-buttons">
                <button class="modal-btn" id="savePrepBtn">저장하기</button>
                <button class="modal-btn cancel" id="closeModalBtn">취소</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // [여기만 고치세요] 데이터 및 설정 상수 모음 시작
        // ==========================================
        const TITLE  = '5학년 2학기 나의 시간표'; // 상단에 표시될 타이틀 이름
        const TARGET = { label:'크리스마스', date:'2026-12-25' }; // D-Day 목표 이름과 날짜
        const DAYS   = ['월','화','수','목','금']; // 요일 배열
        const PERIODS = [
          { time:'09:00', subjects:['학교', '학교', '학교', '학교', '학교'] }, // 1교시 시간 및 과목
          { time:'2:30', subjects:['학교', '학교', '학교', '학교', '학교'] },  // 2교시 시간 및 과목
          { time:'4:00', subjects:['태권도', '영어학원', '태권도', '영어학원', '태권도'] }, // 3교시 시간 및 과목
          { time:'7:20', subjects:['태권도(8시)', '영어학원', '태권도(8시)', '영어학원', '태권도(8시)'] }, // 4교시 시간 및 과목
          { time:'10:00', subjects:['취침', '취침', '취침', '취침', '취침'] }, // 5교시 시간 및 과목
        ];
        // ==========================================
        // [여기만 고치세요] 데이터 및 설정 상수 모음 끝
        // ==========================================

        // 타이틀 내용을 화면에 반영하기
        document.getElementById('scheduleTitle').innerText = TITLE;

        // D-Day 계산 및 출력 함수 실행
        function updateDDay() {
            const today = new Date(); // 오늘 날짜 가져오기
            const targetDate = new Date(TARGET.date); // 목표 날짜 객체 생성
            
            // 시차 계산을 위해 연/월/일 기준으로 시간 비우기
            today.setHours(0, 0, 0, 0);
            targetDate.setHours(0, 0, 0, 0);

            // 날짜 차이를 일(day) 수로 변환
            const diffDays = Math.round((targetDate - today) / (1000 * 60 * 60 * 24));

            const container = document.getElementById('ddayContainer'); // D-Day 표시 요소 가져오기
            
            if (diffDays > 0) {
                // 목표일이 미래인 경우 남은 날짜 표시
                container.innerHTML = `${TARGET.label}까지<div class="dday-number">D-${diffDays}</div>`;
            } else if (diffDays === 0) {
                // 오늘이 목표일인 경우 D-day 표시
                container.innerHTML = `${TARGET.label}<div class="dday-number">D-day</div>`;
            } else {
                // 목표일이 지난 경우
                container.innerHTML = `${TARGET.label} 지남<div class="dday-number">D+${Math.abs(diffDays)}</div>`;
            }
        }

        updateDDay(); // 함수 호출

        // 준비물 데이터 관리를 위한 로컬스토리지 키 설정 함수
        function getPrepKey(rowIndex, colIndex) {
            return `prep_${rowIndex}_${colIndex}`;
        }

        // 요일별 시간표 표(Table) 동적 생성하기 및 클릭 이벤트 연결
        const scheduleBody = document.getElementById('scheduleBody');
        
        // 현재 선택된 셀의 인덱스를 저장할 변수
        let currentRowIdx = null;
        let currentColIdx = null;

        PERIODS.forEach((period, rIdx) => {
            const row = document.createElement('tr'); // 행 생성
            
            // 시간 셀 생성
            const timeCell = document.createElement('td');
            timeCell.innerText = period.time;
            row.appendChild(timeCell);

            // 월~금 과목 셀 생성
            period.subjects.forEach((subject, cIdx) => {
                const subCell = document.createElement('td');
                subCell.className = 'subject-cell'; // 클릭 효과용 클래스 지정
                
                // 기본 과목명 텍스트 노드 설정
                const textNode = document.createElement('div');
                textNode.innerText = subject;
                subCell.appendChild(textNode);

                // 저장된 준비물이 있다면 뱃지 생성하여 표시하기
                const savedPrep = localStorage.getItem(getPrepKey(rIdx, cIdx));
                if (savedPrep) {
                    const badge = document.createElement('span');
                    badge.className = 'prep-badge';
                    badge.innerText = '준비물 있음';
                    subCell.appendChild(badge);
                }

                // 셀 클릭 시 모달창 열기 이벤트 리스너 추가
                subCell.addEventListener('click', () => {
                    currentRowIdx = rIdx;
                    currentColIdx = cIdx;
                    
                    // 모달 제목에 해당 과목과 시간 정보 표시
                    document.getElementById('modalHeaderTitle').innerText = `${DAYS[cIdx]}요일 ${period.time} (${subject})`;
                    
                    // 기존에 저장된 준비물이 있다면 텍스트area에 불러오기
                    const currentPrep = localStorage.getItem(getPrepKey(rIdx, cIdx)) || '';
                    document.getElementById('prepInput').value = currentPrep;
                    
                    // 모달창 화면에 보이기
                    document.getElementById('prepModal').style.display = 'flex';
                });

                row.appendChild(subCell);
            });

            scheduleBody.appendChild(row); // 표 본문에 행 추가
        });

        // 모달 닫기 버튼 이벤트
        document.getElementById('closeModalBtn').addEventListener('click', () => {
            document.getElementById('prepModal').style.display = 'none';
        });

        // 준비물 저장 버튼 이벤트
        document.getElementById('savePrepBtn').addEventListener('click', () => {
            const prepText = document.getElementById('prepInput').value.trim();
            if (currentRowIdx !== null && currentColIdx !== null) {
                if (prepText) {
                    // 로컬스토리지에 준비물 저장
                    localStorage.setItem(getPrepKey(currentRowIdx, currentColIdx), prepText);
                } else {
                    // 빈 값이면 저장된 항목 삭제
                    localStorage.removeItem(getPrepKey(currentRowIdx, currentColIdx));
                }
                
                // 화면을 새로고침하여 준비물 뱃지 상태 반영
                location.reload();
            }
        });

        // 알람 설정 관련 변수
        let setAlarmTime = null;

        // 알람 시간 설정 버튼 이벤트 리스너
        document.getElementById('setAlarmBtn').addEventListener('click', () => {
            const inputVal = document.getElementById('alarmTimeInput').value;
            if (!inputVal) {
                // 알람 시간이 입력되지 않은 경우
                showCustomMessage('알람 시간을 선택해주세요!');
                return;
            }
            setAlarmTime = inputVal; // 알람 시간 저장
            showCustomMessage(`알람이 ${setAlarmTime}으로 설정되었습니다!`);
        });

        // 알람 초기화(삭제) 버튼 이벤트 리스너 추가
        document.getElementById('resetAlarmBtn').addEventListener('click', () => {
            setAlarmTime = null; // 알람 시간 변수 비우기
            document.getElementById('alarmTimeInput').value = ''; // 시간 입력창 초기화
            showCustomMessage('설정된 알람이 초기화되었습니다.');
        });

        // 현재 시간 표시 및 알람 체크 타이머 작동
        setInterval(() => {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            const currentTimeStr = `${hours}:${minutes}:${seconds}`;
            document.getElementById('currentTimeDisplay').innerText = `현재 시간: ${currentTimeStr}`;

            // 설정된 알람 시간과 현재 시간이 일치할 때
            if (setAlarmTime && `${hours}:${minutes}` === setAlarmTime) {
                showCustomMessage(`⏰ 설정된 알람 시간(${setAlarmTime})입니다!`);
                setAlarmTime = null; // 중복 울림 방지 초기화
            }
        }, 1000);

        // 경고/알림 메시지 출력용 커스텀 박스 (alert 대체)
        function showCustomMessage(msg) {
            let alertBox = document.getElementById('customAlertBox');
            if (!alertBox) {
                alertBox = document.createElement('div');
                alertBox.id = 'customAlertBox';
                alertBox.style.position = 'fixed';
                alertBox.style.bottom = '20px';
                alertBox.style.backgroundColor = 'var(--point-color)';
                alertBox.style.color = 'white';
                alertBox.style.padding = '10px 20px';
                alertBox.style.borderRadius = '14px';
                alertBox.style.fontFamily = 'Black Han Sans, sans-serif';
                alertBox.style.boxShadow = '0 4px 6px rgba(0,0,0,0.2)';
                alertBox.style.zIndex = '1000';
                document.body.appendChild(alertBox);
            }
            alertBox.innerText = msg;
            alertBox.style.display = 'block';
            setTimeout(() => {
                alertBox.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
```

### 요약
- 시간표의 각 과목 칸을 누르면 아름다운 모달창이 열려 준비물을 적고 저장할 수 있으며, 입력된 내용은 브라우저에 안전하게 저장됩니다.
