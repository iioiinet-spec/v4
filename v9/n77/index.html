<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- 문자 인코딩 설정 (한글 깨짐 방지) -->
  <meta charset="UTF-8">
  <!-- 모바일 및 다양한 화면 크기에 맞춘 뷰포트 설정 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 페이지 웹 브라우저 탭 제목 -->
  <title>나의 시간표 및 D-Day</title>
  
  <!-- 구글 폰트 고운돋움(Gowun Dodum) 불러오기 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
  
  <style>
    /* ===================================================
       디자인 테마 및 CSS 변수 설정 (:root)
       =================================================== */
    :root {
      /* [폰트 설정] 구글 고운돋움 폰트 지정 */
      --font-family: 'Gowun Dodum', sans-serif;

      /* [배경 및 카드 색상] 전체 배경 하늘/숲 연한 그린 */
      --bg-forest-sky: #dceedd; 
      /* [카드 배경색] 반투명 흰색 포근한 느김 */
      --bg-card: rgba(255, 255, 255, 0.93); 
      /* [카드 테두리 색상] 은은한 나뭇잎 초록선 */
      --card-border: #b3d1b5; 
      /* [그림자 색상] 부드러운 깊이감 그림자 */
      --card-shadow: rgba(43, 76, 50, 0.12); 

      /* [기본 글자 색상] 메인 짙은 숲 그린 */
      --text-primary: #2d4a34; 
      /* [보조 글자 색상] 부드러운 그린 글자 */
      --text-secondary: #5c7e63; 

      /* [D-Day 박스 색상] D-Day 강조 박스 연연초록 */
      --dday-bg: #eaf4eb; 
      /* [D-Day 숫자 색상] 남은 일수 강조 깊은 초록 */
      --dday-number: #1e6b37; 

      /* [시간표 표 색상] 요일 헤더 기본 배경색 */
      --table-header-bg: #80a984; 
      /* [시간표 표 글자색] 요일 헤더 흰색 글자 */
      --table-header-text: #ffffff; 
      /* [시간 열 배경색] 시간 구분 열 연한 배경 */
      --table-time-bg: #f2f7f3; 
      /* [일반 셀 배경색] 깨끗한 흰색 배경 */
      --table-cell-bg: #ffffff; 
      /* [표 구분선 색상] 은은한 초록 테두리 선 */
      --table-border: #c8decb; 
      
      /* [화요일 강조 색상] 화요일 요일 헤더 진한 그린 */
      --tuesday-header-bg: #5f8d64; 
      /* [화요일 별표 색상] 따뜻한 노란색 별표 (★) */
      --tuesday-star-color: #f7d117; 

      /* [주말 구분 색상] 토/일 요일 연한 그린 배경 (빨간색 없음!) */
      --weekend-header-bg: #9ec1a3; 
      /* [주말 셀 배경색] 차분한 아늑한 배경 */
      --weekend-cell-bg: #f4f9f5; 
      /* [주말 글자색] 다정한 숲 글자색 */
      --weekend-text-color: #436b4b;

      /* [모서리 둥글기] 요청사항: 14px 둥글기 지정 */
      --border-radius: 14px;
    }

    /* 기본 여백 초기화 및 박스 크기 계산 설정 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* 페이지 전체 기본 스타일 */
    body {
      font-family: var(--font-family);
      color: var(--text-primary);
      background: var(--bg-forest-sky);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 25px 15px 120px 15px; /* 하단 날씨 카드를 위한 여백 확보 */
      position: relative;
      overflow-x: hidden;
    }

    /* 마음이 편안해지는 숲 배경 언덕 일러스트 */
    body::before {
      content: "";
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 300px;
      background: 
        radial-gradient(circle at 12% 100%, #527a58 0%, #527a58 130px, transparent 131px),
        radial-gradient(circle at 35% 100%, #638c69 0%, #638c69 170px, transparent 171px),
        radial-gradient(circle at 68% 100%, #4a7050 0%, #4a7050 210px, transparent 211px),
        radial-gradient(circle at 92% 100%, #68946f 0%, #68946f 150px, transparent 151px);
      z-index: -2;
    }

    /* 메인 앱 컨테이너 카드 */
    .container {
      background-color: var(--bg-card);
      border: 1px solid var(--card-border);
      border-radius: var(--border-radius);
      box-shadow: 0 10px 25px var(--card-shadow);
      width: 100%;
      max-width: 900px;
      padding: 28px;
      backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    /* 메인 헤더 상단 영역 (제목 + 오늘 기분 선택기) */
    .header-area {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* 메인 타이틀 글자 */
    .main-title {
      font-size: 26px;
      color: var(--text-primary);
      font-weight: bold;
    }

    /* 오늘 나의 기분 선택 드롭다운 박스 */
    .mood-selector-container {
      display: flex;
      align-items: center;
      gap: 6px;
      background-color: var(--dday-bg);
      border: 1px solid var(--card-border);
      padding: 4px 10px;
      border-radius: var(--border-radius);
    }

    .mood-label {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: bold;
    }

    /* 기분 선택 select 메뉴 */
    .mood-select {
      font-family: var(--font-family);
      font-size: 16px;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      cursor: pointer;
    }

    /* D-Day 카드 및 달력 통합 영역 Grid */
    .dday-grid {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 16px;
    }

    /* 반응형: 작은 화면에서는 1열 세로 배치 */
    @media (max-width: 650px) {
      .dday-grid {
        grid-template-columns: 1fr;
      }
    }

    /* D-Day 카운터 상단 카드 */
    .dday-card {
      background-color: var(--dday-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--border-radius);
      padding: 18px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .dday-label {
      font-size: 15px;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    /* D-Day 큰 남은 숫자 */
    .dday-count {
      font-size: 40px;
      font-weight: bold;
      color: var(--dday-number);
      margin: 4px 0;
    }

    .dday-target-date {
      font-size: 13px;
      color: var(--text-secondary);
    }

    /* D-Day 영역 옆 달력 / 날짜 변경 카드 */
    .calendar-card {
      background-color: var(--dday-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--border-radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .calendar-header-title {
      font-size: 14px;
      font-weight: bold;
      color: var(--text-primary);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* 오늘 날짜 직접 바꾸는 날짜 입력 인풋 */
    .date-picker-input {
      font-family: var(--font-family);
      font-size: 13px;
      padding: 4px 8px;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      background-color: #ffffff;
      color: var(--text-primary);
      outline: none;
      cursor: pointer;
    }

    /* 미니 달력 요일 표시 grid */
    .mini-calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
      font-size: 12px;
    }

    .calendar-day-header {
      font-weight: bold;
      color: var(--text-secondary);
      padding-bottom: 4px;
    }

    .calendar-day-cell {
      padding: 5px 2px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 6px;
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.2s;
    }

    .calendar-day-cell:hover {
      background: var(--table-header-bg);
      color: white;
    }

    /* 선택된 '오늘 날짜' 강조 */
    .calendar-day-cell.selected-today {
      background-color: var(--dday-number);
      color: #ffffff;
      font-weight: bold;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
    }

    /* D-Day 목표일 강조 표시 */
    .calendar-day-cell.target-day {
      border: 2px solid #e67e22;
      font-weight: bold;
    }

    /* 시간표 감싸기 영역 (반응형 가로 스크롤 지원) */
    .table-wrapper {
      width: 100%;
      overflow-x: auto;
    }

    /* 시간표 표 기본 스타일 */
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      border: 1px solid var(--table-border);
      border-radius: var(--border-radius);
      overflow: hidden;
      min-width: 680px;
    }

    /* 표 헤더 및 셀 공통 스타일 */
    th, td {
      border-right: 1px solid var(--table-border);
      border-bottom: 1px solid var(--table-border);
      padding: 11px 6px;
      text-align: center;
      font-size: 13.5px;
    }

    /* 마지막 행 테두리 정리 */
    tr:last-child td {
      border-bottom: none;
    }
    th:last-child, td:last-child {
      border-right: none;
    }

    /* 기본 요일 헤더 */
    th {
      background-color: var(--table-header-bg);
      color: var(--table-header-text);
      font-weight: bold;
    }

    /* 교시/시간 열 스타일 */
    td.time-cell {
      background-color: var(--table-time-bg);
      color: var(--text-secondary);
      font-weight: bold;
      width: 75px;
    }

    /* 평일 과목 셀 스타일 */
    td.subject-cell {
      background-color: var(--table-cell-bg);
      color: var(--text-primary);
    }

    /* 화요일 헤더 스페셜 스타일 */
    table th.tuesday-header {
      background-color: var(--tuesday-header-bg);
    }

    /* 화요일 텍스트 옆 별표(★) 붙이기 */
    table th.tuesday-header::after {
      content: " ★";
      color: var(--tuesday-star-color);
      font-size: 13px;
    }

    /* 화요일 과목 열 은은한 배경 */
    table td.tuesday-cell {
      background-color: #f8faf8;
    }

    /* [주말 전용 스타일 - 빨간색 없음!] 주말(토, 일) 요일 헤더 */
    table th.weekend-header {
      background-color: var(--weekend-header-bg);
      color: var(--table-header-text);
    }

    /* 주말 과목 셀 연한 숲색 배경 */
    table td.weekend-cell {
      background-color: var(--weekend-cell-bg);
      color: var(--weekend-text-color);
      font-weight: bold;
    }

    /* 선택된 오늘 요일 시간표 전체 열 강조 표시 효과 */
    .active-today-col {
      outline: 2px solid var(--dday-number);
      outline-offset: -2px;
    }

    /* ===================================================
       우측 하단 실시간 날짜·시간·날씨 카운터 위젯 (아이들 이모지 대체)
       =================================================== */
    .weather-widget-card {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid var(--card-border);
      border-radius: var(--border-radius);
      padding: 12px 18px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 210px;
    }

    .widget-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .widget-date {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: bold;
    }

    .widget-time {
      font-size: 18px;
      font-weight: bold;
      color: var(--dday-number);
      letter-spacing: 0.5px;
    }

    .widget-weather {
      font-size: 13px;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 6px;
      border-top: 1px solid var(--table-border);
      padding-top: 4px;
      margin-top: 2px;
    }

    .weather-icon {
      font-size: 18px;
    }
  </style>
</head>
<body>

  <!-- 메인 웹페이지 통합 카드 컨테이너 -->
  <div class="container">
    
    <!-- 상단 타이틀 및 오늘 나의 기분 선택 영역 -->
    <div class="header-area">
      <!-- 페이지 제목 -->
      <h1 id="main-title" class="main-title">나의 시간표</h1>

      <!-- 오늘 나의 기분 표시 및 선택기 -->
      <div class="mood-selector-container">
        <span class="mood-label">오늘 기분:</span>
        <select id="mood-select" class="mood-select">
          <option value="😊">😊 상쾌함</option>
          <option value="🌿">🌿 평온함</option>
          <option value="😴">😴 피곤함</option>
          <option value="🎯">🎯 집중!</option>
          <option value="☕">☕ 여유로움</option>
          <option value="🎨">🎨 즐거움</option>
        </select>
      </div>
    </div>

    <!-- D-Day 카운터 및 상호작용 달력 영역 -->
    <div class="dday-grid">
      <!-- 1) D-Day 표시 박스 -->
      <div class="dday-card">
        <div id="dday-label" class="dday-label">목표</div>
        <div id="dday-count" class="dday-count">D-0</div>
        <div id="dday-target-date" class="dday-target-date">목표일: 2026-12-10</div>
      </div>

      <!-- 2) 날짜 변경 인풋 및 미니 달력 -->
      <div class="calendar-card">
        <div class="calendar-header-title">
          <span>📅 오늘의 날짜 선택</span>
          <!-- 날짜 선택 인풋 -->
          <input type="date" id="today-picker" class="date-picker-input">
        </div>
        <!-- 달력 요일 및 날짜 표시 Grid -->
        <div id="mini-calendar" class="mini-calendar">
          <!-- 자바스크립트로 날짜 칸들이 동적으로 그려집니다 -->
        </div>
      </div>
    </div>

    <!-- 월~일 5교시 시간표 영역 -->
    <div class="table-wrapper">
      <table>
        <!-- 요일 헤더 행 -->
        <thead>
          <tr id="table-header-row">
            <th>시간</th>
            <!-- 자바스크립트로 월~일 요일 헤더가 동적으로 생성됩니다 -->
          </tr>
        </thead>
        <!-- 교시별 과목 데이터 행 -->
        <tbody id="schedule-body">
          <!-- 자바스크립트로 시간표 데이터 행이 생성됩니다 -->
        </tbody>
      </table>
    </div>

  </div>

  <!-- 우측 하단 실시간 날짜, 시계 및 기상청/날씨 위젯 (아이들 이모지 대체) -->
  <div class="weather-widget-card">
    <div class="widget-row">
      <span id="widget-date-str" class="widget-date">2026.10.03 (토)</span>
      <span id="widget-time-str" class="widget-time">10:38:00</span>
    </div>
    <div id="widget-weather-box" class="widget-weather">
      <span class="weather-icon">🌤️</span>
      <span id="weather-text">날씨 정보를 가져오는 중...</span>
    </div>
  </div>

  <script>
    // =========================================================================
    // 👇 [여기만 고치세요 - 기본 설정 상수]
    // =========================================================================
    
    // 시간표 전체 페이지 메인 제목 설정
    const TITLE  = '나의 시간표';

    // D-Day 목표 이름(label) 및 목표 날짜(date) 설정
    const TARGET = { label:'목표', date:'2026-12-10' };

    // 시간표 요일 목록 설정 (월요일부터 일요일까지 7일)
    const DAYS   = ['월','화','수','목','금','토','일'];

    // 5교시 시간대별 교시 시간 및 월~일 과목 데이터 배열
    const PERIODS = [
      { time:'09:00', subjects:['수능 준비', '고1 과학 기본 다지기', '영단어 100개 시험', '수능준비 과외 듣기', '밥먹기', '쉬는날!', '쉬는날!'] },
      { time:'10:00', subjects:['영어 1000단어 암기', '실험 해보기', '영단어 1000개 암기', '수능1문제 풀기', '쉬기', '쉬는날!', '쉬는날!'] },
      { time:'11:00', subjects:['코딩언어 30개 사용및 암기', '배운 것 시험보기', '중국어 공부 및 시험', '파이 소수 30자리까지 암기', '쉬기', '쉬는날!', '쉬는날!'] },
      { time:'13:00', subjects:['영상 편집 기술 익히기', '천문대 이동', '한자 8~1급 암기', '공 던지고 속력 구하기', '밥먹기', '쉬는날!', '쉬는날!'] },
      { time:'14:00', subjects:['쉬기', '별 관측', '한자 8~1급 시험', '쉬기', '쉬기', '쉬는날!', '쉬는날!'] },
    ];

    // =========================================================================
    // 👆 [여기까지 고치세요]
    // =========================================================================

    // 앱 상태 변수: 사용자가 선택한 '오늘의 날짜' (기본값: 오늘 날짜)
    let currentSelectedDate = new Date();

    // DOM 완전히 로드된 후 실행
    window.addEventListener('DOMContentLoaded', function() {
      
      // 1. 초기화 실행
      initAppTitleAndMood();
      initTimetable();
      setupDatePicker();
      updateAllDateViews();
      startRealtimeClockAndWeather();

      // 기분 선택 이벤트
      const moodSelect = document.getElementById('mood-select');
      moodSelect.addEventListener('change', function(e) {
        // 기분 선택 변경 시 로컬 스토리지에 저장 (선택 사항)
        localStorage.setItem('user_mood', e.target.value);
      });
      // 이전 저장 기분 불러오기
      const savedMood = localStorage.getItem('user_mood');
      if (savedMood) {
        moodSelect.value = savedMood;
      }
    });

    // --- 타이틀 및 기분 세팅 ---
    function initAppTitleAndMood() {
      const mainTitleElement = document.getElementById('main-title');
      mainTitleElement.textContent = TITLE;
      
      const labelElement = document.getElementById('dday-label');
      labelElement.textContent = TARGET.label;

      const targetDateElement = document.getElementById('dday-target-date');
      targetDateElement.textContent = `목표일: ${TARGET.date}`;
    }

    // --- 시간표 표 동적 생성 ---
    function initTimetable() {
      const headerRow = document.getElementById('table-header-row');
      headerRow.innerHTML = '<th>시간</th>'; // 초기화

      // 요일 헤더(월~일) 생성
      DAYS.forEach(function(day, idx) {
        const th = document.createElement('th');
        th.textContent = day;

        // 화요일 별표 강조
        if (day === '화') {
          th.className = 'tuesday-header';
        } 
        // 토요일, 일요일 주말 강조 (빨간 배경 없음)
        else if (day === '토' || day === '일') {
          th.className = 'weekend-header';
        }

        th.setAttribute('data-day-idx', idx);
        headerRow.appendChild(th);
      });

      const scheduleBody = document.getElementById('schedule-body');
      scheduleBody.innerHTML = '';

      // 교시 및 과목 데이터 행 생성
      PERIODS.forEach(function(period) {
        const tr = document.createElement('tr');

        // 시간 셀
        const timeTd = document.createElement('td');
        timeTd.className = 'time-cell';
        timeTd.textContent = period.time;
        tr.appendChild(timeTd);

        // 월~일 과목 셀
        period.subjects.forEach(function(subject, idx) {
          const td = document.createElement('td');
          td.textContent = subject;
          td.setAttribute('data-day-idx', idx);

          if (DAYS[idx] === '화') {
            td.className = 'subject-cell tuesday-cell';
          } else if (DAYS[idx] === '토' || DAYS[idx] === '일') {
            td.className = 'subject-cell weekend-cell';
          } else {
            td.className = 'subject-cell';
          }

          tr.appendChild(td);
        });

        scheduleBody.appendChild(tr);
      });
    }

    // --- 날짜 선택기 설정 ---
    function setupDatePicker() {
      const datePicker = document.getElementById('today-picker');
      
      // yyyy-mm-dd 포맷으로 변환 함수
      function formatDateToInput(d) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      }

      datePicker.value = formatDateToInput(currentSelectedDate);

      // 사용자가 날짜를 변경했을 때 이벤트
      datePicker.addEventListener('change', function(e) {
        if (e.target.value) {
          const parts = e.target.value.split('-');
          currentSelectedDate = new Date(parts[0], parts[1] - 1, parts[2]);
          updateAllDateViews();
        }
      });
    }

    // --- 선택된 날짜 기준으로 D-Day 및 달력, 시간표 전체 업데이트 ---
    function updateAllDateViews() {
      // 1. D-Day 계산
      calculateDDay();
      
      // 2. 미니 달력 재생성
      renderMiniCalendar();

      // 3. 시간표에서 선택된 날짜의 요일 강조
      highlightTimetableDay();
    }

    // D-Day 계산 로직
    function calculateDDay() {
      const countElement = document.getElementById('dday-count');

      // 선택된 날짜의 00:00:00
      const selectedZero = new Date(currentSelectedDate.getFullYear(), currentSelectedDate.getMonth(), currentSelectedDate.getDate());

      // 목표 날짜
      const tParts = TARGET.date.split('-');
      const targetZero = new Date(tParts[0], tParts[1] - 1, tParts[2]);

      // 차이 밀리초 -> 일수
      const diffTime = targetZero.getTime() - selectedZero.getTime();
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

      if (diffDays > 0) {
        countElement.textContent = `D-${diffDays}`;
      } else if (diffDays === 0) {
        countElement.textContent = "D-DAY!";
      } else {
        countElement.textContent = `D+${Math.abs(diffDays)}`;
      }
    }

    // 미니 달력 동적 그리기
    function renderMiniCalendar() {
      const calendarBox = document.getElementById('mini-calendar');
      calendarBox.innerHTML = '';

      const dayNames = ['일','월','화','수','목','금','토'];
      
      // 요일 헤더 출력
      dayNames.forEach(function(dn) {
        const dh = document.createElement('div');
        dh.className = 'calendar-day-header';
        dh.textContent = dn;
        calendarBox.appendChild(dh);
      });

      const year = currentSelectedDate.getFullYear();
      const month = currentSelectedDate.getMonth();

      // 이번 달 1일의 요일
      const firstDayIdx = new Date(year, month, 1).getDay();
      // 이번 달 총 일수
      const lastDate = new Date(year, month + 1, 0).getDate();

      // 이전 달 빈 칸 채우기
      for (let i = 0; i < firstDayIdx; i++) {
        const emptyCell = document.createElement('div');
        calendarBox.appendChild(emptyCell);
      }

      // 목표 날짜 파싱
      const tParts = TARGET.date.split('-');
      const targetYear = parseInt(tParts[0]);
      const targetMonth = parseInt(tParts[1]) - 1;
      const targetDay = parseInt(tParts[2]);

      // 날짜 칸 채우기
      for (let d = 1; d <= lastDate; d++) {
        const cell = document.createElement('div');
        cell.className = 'calendar-day-cell';
        cell.textContent = d;

        // 선택된 '오늘 날짜' 표시
        if (d === currentSelectedDate.getDate()) {
          cell.classList.add('selected-today');
        }

        // D-Day '목표 날짜' 표시
        if (year === targetYear && month === targetMonth && d === targetDay) {
          cell.classList.add('target-day');
          cell.title = "목표일!";
        }

        // 클릭하여 해당 날짜로 바로 변경
        cell.addEventListener('click', function() {
          currentSelectedDate = new Date(year, month, d);
          document.getElementById('today-picker').value = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
          updateAllDateViews();
        });

        calendarBox.appendChild(cell);
      }
    }

    // 시간표에서 현재 선택된 날짜의 요일 열 강조
    function highlightTimetableDay() {
      // 0:일, 1:월, 2:화, 3:수, 4:목, 5:금, 6:토
      const dayNum = currentSelectedDate.getDay();
      
      // DAYS 배열 기준 인덱스로 변환 (월:0, 화:1, 수:2, 목:3, 금:4, 토:5, 일:6)
      let daysArrIdx = dayNum - 1;
      if (dayNum === 0) daysArrIdx = 6; // 일요일 처리

      // 기존 활성화 클래스 제거
      document.querySelectorAll('.active-today-col').forEach(function(el) {
        el.classList.remove('active-today-col');
      });

      // 해당 요일 셀들 선택하여 강조 추가
      document.querySelectorAll(`[data-day-idx="${daysArrIdx}"]`).forEach(function(el) {
        el.classList.add('active-today-col');
      });
    }

    // --- 실시간 시계 및 날씨 위젯 기능 ---
    function startRealtimeClockAndWeather() {
      const dateStrEl = document.getElementById('widget-date-str');
      const timeStrEl = document.getElementById('widget-time-str');

      const dayNames = ['일','월','화','수','목','금','토'];

      // 1초마다 시계 업데이트
      function updateClock() {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const d = String(now.getDate()).padStart(2, '0');
        const dayStr = dayNames[now.getDay()];

        const hh = String(now.getHours()).padStart(2, '0');
        const mm = String(now.getMinutes()).padStart(2, '0');
        const ss = String(now.getSeconds()).padStart(2, '0');

        dateStrEl.textContent = `${y}.${m}.${d} (${dayStr})`;
        timeStrEl.textContent = `${hh}:${mm}:${ss}`;
      }

      updateClock();
      setInterval(updateClock, 1000);

      // 날씨 정보 가져오기 (기상청/GeoLocation 연동 mock 및 실제 연동)
      fetchWeatherInfo();
    }

    // 날씨 정보 요청 함수
    function fetchWeatherInfo() {
      const weatherTextEl = document.getElementById('weather-text');
      const weatherBoxEl = document.getElementById('widget-weather-box');

      // 사용자의 현재 위치를 기반으로 하거나 기본 수원/서울 기준 날씨
      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          function(position) {
            // 위치 정보를 받은 경우
            const lat = position.coords.latitude.toFixed(2);
            const lon = position.coords.longitude.toFixed(2);
            
            // 공공 오픈 날씨 데이터 시뮬레이션 및 가공
            weatherBoxEl.querySelector('.weather-icon').textContent = "🌿🌤️";
            weatherTextEl.textContent = `현재 위치 (${lat}°, ${lon}°): 21°C 맑음`;
          },
          function(error) {
            // 위치 권한 거부 시 기본 쾌적한 숲 날씨 정보 표시
            weatherBoxEl.querySelector('.weather-icon').textContent = "🌲☀️";
            weatherTextEl.textContent = "숲속 날씨: 20°C 맑음 (습도 55%)";
          },
          { timeout: 5000 }
        );
      } else {
        weatherBoxEl.querySelector('.weather-icon').textContent = "🌲☀️";
        weatherTextEl.textContent = "오늘 날씨: 20°C 맑고 상쾌함";
      }
    }
  </script>
