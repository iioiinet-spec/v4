<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- 문서의 문자 인코딩을 UTF-8로 설정합니다. -->
  <meta charset="UTF-8">
  <!-- 모바일 및 다양한 기기 화면에 맞게 너비를 조절합니다. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 브라우저 탭에 표시될 제목입니다. -->
  <title>D-Day & 시간표</title>
  <!-- 구글 폰트 Nanum Pen Script(나눔손글씨)를 불러오는 link 태그입니다. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">
  
  <style>
    /* CSS 변수를 모아둔 root 영역입니다. */
    :root {
      /* 웹사이트의 전체 배경색입니다. */
      --bg-color: #ffffff;
      /* 카운터 상자와 시간표 셀(칸)의 배경색입니다. */
      --box-color: #d0f0fb;
      /* 기본 글자 색상입니다. */
      --text-color: #000000;
      /* D-Day 숫자와 테두리 등에 사용되는 포인트 색상입니다. */
      --point-color: #000000;
    }

    /* 화면 전체 기본 스타일 정의 */
    body {
      /* 전체 배경색을 변수로 지정합니다. */
      background-color: var(--bg-color);
      /* 기본 글자 색상을 변수로 지정합니다. */
      color: var(--text-color);
      /* 나눔손글씨 폰트를 최우선 적용합니다. */
      font-family: 'Nanum Pen Script', cursive, sans-serif;
      /* 기본 여백을 제거합니다. */
      margin: 0;
      /* 안쪽 여백을 20px 줍니다. */
      padding: 20px;
      /* 손글씨 폰트는 작아 보일 수 있어 기본 글자 크기를 크게 설정합니다. */
      font-size: 24px;
      /* 내용이 화면 중앙에 오도록 최대 너비를 설정합니다. */
      max-width: 800px;
      /* 박스를 가운데 정렬합니다. */
      margin: 0 auto;
    }

    /* 상단 제목 스타일 */
    h1 {
      /* 제목 글자 정렬을 가운데로 맞춥니다. */
      text-align: center;
      /* 아래쪽과의 간격을 조정합니다. */
      margin-bottom: 20px;
      /* 제목 글자 크기를 크게 키웁니다. */
      font-size: 40px;
    }

    /* D-Day 카운터 상자 스타일 */
    .dday-box {
      /* 카운터 상자 배경색을 지정합니다. */
      background-color: var(--box-color);
      /* 모서리를 둥글게 12px 처리합니다. */
      border-radius: 12px;
      /* 상자 안쪽 여백을 줍니다. */
      padding: 20px;
      /* 텍스트를 가운데 정렬합니다. */
      text-align: center;
      /* 시간표와의 간격을 위해 아래쪽에 여백을 줍니다. */
      margin-bottom: 30px;
    }

    /* D-Day 목표 이름 스타일 */
    .dday-label {
      /* 목표 이름 글자 크기 설정 */
      font-size: 32px;
      /* 아래쪽 여백 지정 */
      margin-bottom: 10px;
    }

    /* D-Day 숫자 강조 스타일 */
    .dday-count {
      /* 포인트 색상을 적용합니다. */
      color: var(--point-color);
      /* D-Day 숫자를 강조하기 위해 굵게 만듭니다. */
      font-weight: bold;
      /* 숫자를 매우 크게 표시합니다. */
      font-size: 56px;
    }

    /* 시간표 표 기본 스타일 */
    table {
      /* 표 전체 너비를 상자에 가득 채웁니다. */
      width: 100%;
      /* 셀 간격이 벌어지지 않도록 붙입니다. */
      border-collapse: separate;
      /* border-radius 적용을 위해 간격을 0으로 설정합니다. */
      border-spacing: 0;
      /* 표 전체 모서리도 둥글게 12px로 맞춥니다. */
      border-radius: 12px;
      /* 테두리가 둥근 모서리 밖으로 넘어가지 않도록 숨깁니다. */
      overflow: hidden;
    }

    /* 표의 각 셀(칸) 스타일 */
    th, td {
      /* 셀의 배경색을 지정합니다. */
      background-color: var(--box-color);
      /* 얇은 흰색 테두리로 칸을 구분해줍니다. */
      border: 1px solid var(--bg-color);
      /* 칸 안쪽 여백을 줍니다. */
      padding: 12px;
      /* 텍스트를 가운데 정렬합니다. */
      text-align: center;
    }

    /* 시간표 제목(헤더) 칸 스타일 */
    th {
      /* 제목 글자를 강조합니다. */
      font-weight: bold;
      /* 글자 크기를 조금 더 크게 설정합니다. */
      font-size: 28px;
    }
  </style>
</head>
<body>

  <!-- 메인 타이틀 표시 영역 -->
  <h1 id="app-title"></h1>

  <!-- D-Day 카운터 상자 영역 -->
  <div class="dday-box">
    <!-- 목표 이름을 표시할 위치 -->
    <div class="dday-label" id="target-label"></div>
    <!-- 남은 D-Day 날짜를 표시할 위치 -->
    <div class="dday-count" id="dday-result"></div>
  </div>

  <!-- 시간표 표 영역 -->
  <table>
    <thead>
      <!-- 시간표의 첫 번째 줄(요일)을 표시할 위치 -->
      <tr id="table-header"></tr>
    </thead>
    <!-- 교시별 과목 정보를 표시할 위치 -->
    <tbody id="table-body"></tbody>
  </table>

  <script>
    // ==========================================
    // 👇 [여기만 고치세요] 설정 값 모음
    // ==========================================
    // 페이지 최상단 타이틀 제목입니다.
    const TITLE = '내꺼';
    // D-Day 목표 이름과 목표 날짜(YYYY-MM-DD)를 설정합니다.
    const TARGET = { label: '크리스마스', date: '2026-12-25' };
    // 시간표의 요일 목록입니다.
    const DAYS = ['월', '화', '수', '목', '금'];
    // 교시별 시간과 요일별 과목 목록입니다.
    const PERIODS = [
      { time: '09:00', subjects: ['게임', '밥', '게임', '밥', '게임'] },
      { time: '10:00', subjects: ['밥', '게임', '밥', '게임', '밥'] },
      { time: '11:00', subjects: ['게임', '밥', '게임', '밥', '게임'] },
      { time: '13:00', subjects: ['밥', '게임', '밥', '게임', '밥'] },
      { time: '14:00', subjects: ['게임', '밥', '게임', '밥', '게임'] },
    ];
    // ==========================================

    // HTML 태그에 데이터 적용하는 함수 호출
    renderApp();

    // 전체 화면 내용을 화면에 그려주는 함수 정의
    function renderApp() {
      // 타이틀 텍스트를 HTML에 대입합니다.
      document.getElementById('app-title').innerText = TITLE;
      // D-Day 목표 이름을 HTML에 대입합니다.
      document.getElementById('target-label').innerText = TARGET.label;
      // 남은 날짜를 계산해 D-Day 결과 텍스트를 HTML에 대입합니다.
      document.getElementById('dday-result').innerText = calculateDDay(TARGET.date);

      // 시간표 요일 헤더 만들기 시작
      const headerRow = document.getElementById('table-header');
      // 첫 번째 칸은 '시간' 이름 지정
      headerRow.innerHTML = '<th>시간</th>';
      // 설정해둔 요일 배열(DAYS)을 순회하며 헤더 칸(th) 추가
      DAYS.forEach(day => {
        headerRow.innerHTML += `<th>${day}</th>`;
      });

      // 시간표 본문 내용 만들기 시작
      const tableBody = document.getElementById('table-body');
      // 이전 본문 내용 초기화
      tableBody.innerHTML = '';
      // 교시별 데이터(PERIODS)를 순회하며 행(tr) 생성
      PERIODS.forEach(period => {
        // 교시 시작 태그와 시간 표시 생성
        let rowHtml = `<tr><td>${period.time}</td>`;
        // 해당 교시의 과목들을 순회하며 칸(td) 생성
        period.subjects.forEach(subject => {
          rowHtml += `<td>${subject}</td>`;
        });
        // 행 닫는 태그 추가
        rowHtml += '</tr>';
        // 생성한 행을 표 본문에 붙여넣기
        tableBody.innerHTML += rowHtml;
      });
    }

    // 목표 날짜를 입력 받아 D-Day 남은 일수를 계산하는 함수 정의
    function calculateDDay(targetDateStr) {
      // 오늘 날짜 객체 생성
      const today = new Date();
      // 목표 날짜 객체 생성
      const target = new Date(targetDateStr);
      // 시간/분/초 단위를 무시하기 위해 시, 분, 초, 밀리초를 0으로 맞춤 (오늘)
      today.setHours(0, 0, 0, 0);
      // 목표 날짜도 시, 분, 초, 밀리초를 0으로 맞춤
      target.setHours(0, 0, 0, 0);

      // 목표 날짜에서 오늘 날짜를 뺀 밀리초 차이 계산
      const diffTime = target.getTime() - today.getTime();
      // 밀리초를 일(day) 단위로 변환 계산
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

      // 날짜 차이에 따라 결과 문자열 반환
      if (diffDays > 0) {
        // 남은 날짜가 있을 때
        return `D-${diffDays}`;
      } else if (diffDays === 0) {
        // 오늘이 D-Day일 때
        return 'D-DAY';
      } else {
        // 목표 날짜가 지났을 때
        return `D+${Math.abs(diffDays)}`;
      }
    }
  </script>
</body>
</html>
