<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D-Day 시간표</title>
  
  <!-- 구글 웹폰트 '고운돋움(Gowun Dodum)' 불러오기 -->
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">

  <style>
    /* CSS 변수 설정: 색상과 둥글기를 한곳에서 관리 */
    :root {
      --bg-color: #223d7c;      /* 전체 배경 색상 */
      --box-color: #0048ff;     /* 시간표 칸 및 카드 배경 색상 */
      --text-color: #ffffff;    /* 기본 글자 색상 */
      --point-color: #00d5ff;   /* 강조(포인트) 글자 및 테두리 색상 */
      --radius: 14px;           /* 모든 박스와 칸의 모서리 둥글기 */
    }

    /* 문서 전체 기본 스타일 설정 */
    body {
      margin: 0;                             /* 기본 여백 없애기 */
      padding: 20px;                         /* 화면 안쪽 여백 주기 */
      background-color: var(--bg-color);     /* 배경색 변수 적용 */
      color: var(--text-color);              /* 글자색 변수 적용 */
      font-family: 'Gowun Dodum', sans-serif;/* 고운돋움 폰트 적용 */
      display: flex;                         /* 정렬을 위해 플렉스박스 사용 */
      flex-direction: column;                /* 위에서 아래로 쌓이게 배치 */
      align-items: center;                   /* 가로 가운데 정렬 */
      min-height: 100vh;                     /* 최소 높이 화면 꽉 차게 */
      box-sizing: border-box;                /* 패딩 포함 크기 계산 */
    }

    /* 상단 D-Day 카운터 박스 디자인 */
    #dday-box {
      background-color: var(--box-color);    /* 박스 배경색 적용 */
      border: 2px solid var(--point-color);  /* 포인트 색상 테두리 */
      border-radius: var(--radius);          /* 둥근 모서리 14px 적용 */
      padding: 25px 40px;                    /* 안쪽 여백 주기 */
      text-align: center;                    /* 글자 가운데 정렬 */
      margin-bottom: 30px;                   /* 아래 시간표와 간격 주기 */
      width: 100%;                           /* 너비 100% */
      max-width: 600px;                      /* 최대 너비 제한 */
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);/* 부드러운 그림자 효과 */
    }

    /* D-Day 타이틀(목표 이름 등) 글자 스타일 */
    #dday-title {
      font-size: 1.5rem;                     /* 글자 크기 지정 */
      margin-bottom: 10px;                   /* 아래 여백 주기 */
      color: var(--point-color);             /* 포인트 색상 적용 */
    }

    /* 남은 날짜 숫자 크게 강조 스타일 */
    #dday-count {
      font-size: 2.5rem;                     /* 아주 큰 글자 크기 */
      font-weight: bold;                     /* 두껍게 설정 */
    }

    /* 시간표 전체를 감싸는 표(Table) 스타일 */
    table {
      width: 100%;                           /* 표 너비 100% */
      max-width: 800px;                      /* 최대 너비 제한 */
      border-collapse: separate;             /* 칸마다 둥글기를 주기 위해 분리 */
      border-spacing: 8px;                   /* 칸과 칸 사이 간격 주기 */
      background-color: transparent;         /* 배경 투명하게 설정 */
    }

    /* 표의 제목(요일)과 내용(교시/과목) 칸 공통 스타일 */
    th, td {
      background-color: var(--box-color);    /* 칸 배경색 적용 */
      color: var(--text-color);              /* 글자색 적용 */
      padding: 15px;                         /* 안쪽 여백 주기 */
      text-align: center;                    /* 글자 가운데 정렬 */
      border-radius: var(--radius);          /* 둥근 모서리 14px 적용 */
      font-size: 1.1rem;                     /* 글자 크기 설정 */
    }

    /* 요일이 들어가는 맨 윗줄 제목 스타일 */
    th {
      background-color: var(--point-color);  /* 요일 칸 배경 포인트 색상 */
      color: var(--bg-color);                /* 요일 글자는 배경색으로 대비 */
      font-weight: bold;                     /* 두껍게 설정 */
    }

    /* 시간(몇 시)이 적히는 첫 번째 열 스타일 */
    td:first-child {
      font-weight: bold;                     /* 시간 글자 두껍게 */
      background-color: rgba(0, 213, 255, 0.15); /* 시간에 미세한 투명 포인트색 */
      border: 1px solid var(--point-color);  /* 테두리선 추가 */
    }

    /* 현재 시간이 속한 교시 칸을 강조하는 테두리 스타일 */
    .current-period {
      border: 3px solid var(--point-color) !important; /* 포인트 색상으로 두꺼운 테두리 강조 */
      box-shadow: 0 0 10px var(--point-color);         /* 빛나는 효과 추가 */
    }
  </style>
</head>
<body>

  <!-- 화면 위쪽 D-Day 카운터를 보여줄 영역 -->
  <div id="dday-box">
    <div id="dday-title">목표 로딩 중...</div>
    <div id="dday-count">D-Day 계산 중...</div>
  </div>

  <!-- 아래쪽에 월~금 5교시 시간표가 들어갈 표 영역 -->
  <table id="timetable">
    <!-- 자바스크립트로 표의 내용이 자동으로 채워집니다 -->
  </table>

  <script>
    /* ---------------------------------------------------- */
    /* [여기만 고치세요] 데이터와 설정값들을 모아둔 곳입니다. */
    /* ---------------------------------------------------- */
    const TITLE  = '3학년 2학기';                             /* 상단에 표시될 메인 제목 */
    const TARGET = { label:'크리스마스', date:'2026-12-25' };  /* D-Day를 잴 목표 이름과 날짜 */
    const DAYS   = ['월','화','수','목','금'];               /* 시간표 상단에 들어갈 요일 배열 */
    const PERIODS = [
      { time:'09:00', subjects:['학교', '학교', '학교', '학교', '학교'] }, /* 1교시 시간과 월~금 과목 */
      { time:'10:00', subjects:['학교', '학교', '학교', '학교', '학교'] }, /* 2교시 시간과 월~금 과목 */
      { time:'11:00', subjects:['학교', '학교', '학교', '학교', '학교'] }, /* 3교시 시간과 월~금 과목 */
      { time:'13:00', subjects:['학교', '학교', '학교', '학교', '학교'] }, /* 4교시 시간과 월~금 과목 */
      { time:'14:00', subjects:['집', '집', '집', '집', '집'] },       /* 5교시 시간과 월~금 과목 */
    ];
    /* ---------------------------------------------------- */

    // HTML 문서가 브라우저에 모두 로드된 후 실행되는 함수
    window.addEventListener('DOMContentLoaded', function() {
      
      // 1. D-Day 계산 및 화면 표시 로직
      const titleEl = document.getElementById('dday-title');   // 제목을 넣을 HTML 요소 가져오기
      const countEl = document.getElementById('dday-count');   // 남은 날짜를 넣을 요소 가져오기

      // 오늘 날짜 구하기 (시, 분, 초는 0으로 초기화하여 날짜만 비교)
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      // 목표 날짜 객체 생성
      const targetDate = new Date(TARGET.date);
      targetDate.setHours(0, 0, 0, 0);

      // 남은 시간(밀리초)을 하루 단위(밀리초 * 초 * 분 * 시간)로 나누어 일수 계산
      const diffTime = targetDate - today;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

      // 화면에 제목과 D-Day 결과 텍스트 출력하기
      titleEl.textContent = `${TITLE} - ${TARGET.label}까지`;
      if (diffDays > 0) {
        countEl.textContent = `D - ${diffDays}일 남음`;
      } else if (diffDays === 0) {
        countEl.textContent = `D - Day (오늘이 바로 그날!)`;
      } else {
        countEl.textContent = `D + ${Math.abs(diffDays)}일 지남`;
      }

      // 2. 시간표 표(Table) 자동 생성 로직
      const tableEl = document.getElementById('timetable');    // 테이블 요소 가져오기

      // (1) 표의 첫 번째 줄(헤더: 요일 목록) 만들기
      let headerHTML = '<thead><tr><th>시간</th>';           // 시간 칸과 함께 시작
      for (let i = 0; i < DAYS.length; i++) {
        headerHTML += `<th>${DAYS[i]}요일</th>`;              // 각 요일별 제목 칸 추가
      }
      headerHTML += '</tr></thead>';

      // (2) 표의 본문(교시별 시간과 과목 목록) 만들기
      let bodyHTML = '<tbody>';
      for (let i = 0; i < PERIODS.length; i++) {
        bodyHTML += '<tr>';
        bodyHTML += `<td>${PERIODS[i].time}</td>`;             // 첫 번째 칸에 시간 넣기
        for (let j = 0; j < PERIODS[i].subjects.length; j++) {
          bodyHTML += `<td>${PERIODS[i].subjects[j]}</td>`;    // 월~금 각 요일별 과목 넣기
        }
        bodyHTML += '</tr>';
      }
      bodyHTML += '</tbody>';

      // 완성된 표 HTML을 테이블 요소 안에 넣기
      tableEl.innerHTML = headerHTML + bodyHTML;

      // 3. 현재 시각 기준으로 오늘 요일/교시를 강조하고 1분마다 갱신하는 함수
      function updateCurrentPeriod() {
        // 기존에 강조되어 있던 칸의 테두리 클래스 제거
        const highlighted = document.querySelectorAll('.current-period');
        highlighted.forEach(el => el.classList.remove('current-period'));

        // 주말(토요일: 6, 일요일: 0) 확인
        const now = new Date();
        const dayOfWeek = now.getDay(); // 0: 일, 1: 월, ..., 6: 토
        if (dayOfWeek === 0 || dayOfWeek === 6) {
          titleEl.textContent = `${TITLE} - 오늘은 쉬는 날`;
          return; // 주말이면 시간표 강조를 진행하지 않고 종료
        }

        // JS의 요일(1~5: 월~금)과 DAYS 배열 인덱스 매칭 (월요일: index 0 -> getDay(): 1)
        const dayIndex = dayOfWeek - 1; 

        // 현재 시각을 'HH:MM' 문자열 형태로 변환 (예: '09:30')
        const currentHours = String(now.getHours()).padStart(2, '0');
        const currentMinutes = String(now.getMinutes()).padStart(2, '0');
        const currentTimeStr = `${currentHours}:${currentMinutes}`;

        // PERIODS 배열을 돌며 현재 시간에 해당하는 교시 찾기
        const rows = tableEl.getElementsByTagName('tr');
        for (let i = 0; i < PERIODS.length; i++) {
          // 마지막 교시이거나, 다음 교시 시간 전까지를 해당 교시로 판정
          const startTime = PERIODS[i].time;
          let nextStartTime = (i < PERIODS.length - 1) ? PERIODS[i + 1].time : '24:00';

          if (currentTimeStr >= startTime && currentTimeStr < nextStartTime) {
            // 헤더(요일) 밑의 tbody 안에서 해당 교시(행 i)의 해당 요일(열 dayIndex + 1) 칸 선택
            if (rows[i + 1]) {
              const targetCell = rows[i + 1].getElementsByTagName('td')[dayIndex + 1];
              if (targetCell) {
                targetCell.classList.add('current-period'); // 강조 클래스 추가
              }
            }
            break;
          }
        }
      }

      // 페이지가 처음 열렸을 때 즉시 실행
      updateCurrentPeriod();

      // 1분(60000밀리초)마다 자동으로 함수를 다시 실행하여 실시간 갱신
      setInterval(updateCurrentPeriod, 60000);
    });
  </script>
</body>
</html>
