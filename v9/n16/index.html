<!DOCTYPE html>
<html lang="ko">
<head>
    <!-- 문서의 문자 인코딩을 UTF-8로 설정합니다 -->
    <meta charset="UTF-8">
    <!-- 모바일 기기 화면 크기에 맞게 뷰포트 설정 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 브라우저 탭에 표시될 타이틀 -->
    <title id="page-title">D-Day와 시간표</title>
    <!-- 구글 폰트 Gowun Dodum(고운돋움) 스타일시트 불러오기 -->
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
    <!-- 스타일 정의 시작 -->
    <style>
        /* :root 선택자에 디자인에 사용될 모든 색상 변수를 선언합니다 */
        :root {
            --bg-color: #0011ff;      /* 전체 배경 색상 (#0011ff) */
            --card-color: #00ff33;    /* 콘텐츠 카드/칸 배경 색상 (#00ff33) */
            --text-color: #383838;    /* 본문 및 일반 글자 색상 (#383838) */
            --point-color: #fafafa;   /* 강조(포인트) 및 하이라이트 색상 (#fafafa) */
            --radius-size: 11px;      /* 모든 모서리 둥글기 크기 (11px) */
        }

        /* 전체 페이지 기본 스타일 및 고운 돋움 폰트 지정 */
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Gowun Dodum', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* 전체 내용을 감싸는 메인 컨테이너 박스 */
        .main-container {
            width: 100%;
            max-width: 950px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* D-Day 카운터 및 시간표를 감싸는 카드 박스 공통 스타일 */
        .card-box {
            background-color: var(--card-color);
            border-radius: var(--radius-size);
            padding: 24px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        /* 목표 이름 및 타이틀 스타일 */
        #goal-title {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--text-color);
            margin-bottom: 8px;
        }

        /* D-Day 남은 일자 카운터 글자 스타일 */
        #d-day-counter {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--point-color);
            background-color: rgba(0, 0, 0, 0.15);
            border-radius: var(--radius-size);
            padding: 10px 20px;
            display: inline-block;
            margin-top: 5px;
        }

        /* 시간표 타이틀 및 안내 영역 래퍼 */
        .table-header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }

        /* 시간표 제목 스타일 */
        .table-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-color);
            margin: 0;
        }

        /* "오늘은 쉬는 날" 안내 배지 스타일 */
        #rest-day-notice {
            background-color: var(--bg-color);
            color: var(--point-color);
            padding: 6px 14px;
            border-radius: var(--radius-size);
            font-size: 0.95rem;
            font-weight: bold;
            display: none; /* 평소에는 숨김, 조건 만족 시 표시 */
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        /* 모바일 기기 대응을 위한 가로 스크롤 영역 */
        .table-responsive {
            overflow-x: auto;
        }

        /* 시간표 테이블 전체 스타일 */
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            background-color: var(--point-color);
            border-radius: var(--radius-size);
            overflow: hidden;
        }

        /* 테이블 헤더 및 셀 공통 테두리 및 패딩 */
        th, td {
            border: 1px solid rgba(56, 56, 56, 0.2);
            padding: 12px 6px;
            font-size: 0.9rem;
        }

        /* 테이블 머리글(요일/시간) 스타일 */
        thead tr {
            background-color: rgba(0, 255, 51, 0.3);
            color: var(--text-color);
            font-weight: bold;
        }

        /* 시간 표시 열(첫 번째 열) 스타일 */
        .time-cell {
            background-color: rgba(0, 17, 255, 0.08);
            font-weight: bold;
            color: var(--bg-color);
        }

        /* 현재 진행 중인 교시 칸을 강조하는 테두리 스타일 */
        .current-period-highlight {
            border: 3px solid var(--bg-color) !important;
            background-color: rgba(0, 255, 51, 0.25) !important;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- 전체 화면을 중앙 정렬하고 감싸는 메인 컨테이너 -->
    <div class="main-container">

        <!-- D-Day 카운터를 보여주는 상단 카드 박스 -->
        <div class="card-box">
            <!-- 목표 이름과 날짜가 출력되는 제목 영역 -->
            <div id="goal-title">목표 불러오는 중...</div>
            <!-- 남은 날짜 숫자가 크게 표시되는 영역 -->
            <div id="d-day-counter">D-0</div>
        </div>

        <!-- 주간 시간표를 보여주는 하단 카드 박스 -->
        <div class="card-box">
            <!-- 타이틀과 쉬는 날 안내 문구가 함께 들어가는 헤더 영역 -->
            <div class="table-header-container">
                <div class="table-title">📅 월~일 7일 전체 시간표</div>
                <!-- 주말이거나 시간 외일 때 나타나는 안내 메시지 -->
                <div id="rest-day-notice">🏖️ 오늘은 쉬는 날입니다!</div>
            </div>
            <!-- 가로 스크롤 가능한 테이블 래퍼 -->
            <div class="table-responsive">
                <table>
                    <thead>
                        <!-- 자바스크립트로 생성될 요일 및 헤더 행 (월~일) -->
                        <tr id="timetable-header"></tr>
                    </thead>
                    <tbody id="timetable-body">
                        <!-- 자바스크립트로 생성될 교시별 시간 및 과목 행 -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- 자바스크립트 로직 시작 -->
    <script>
        // ==========================================
        // [여기만 고치세요] 설정 상수 영역 시작
        // ==========================================
        const TITLE  = '67';
        const TARGET = { label:'크리스마스', date:'2026-12-25' };
        
        // 월요일부터 일요일까지 7일 전체 요일 배열 정의
        const DAYS   = ['월', '화', '수', '목', '금', '토', '일'];

        // 시간표 데이터 (월~일 7일 과목 지정)
        const PERIODS = [
          { time:'09:00', subjects:['국어', '수학', '영어', '과학', '사회', '휴식', '휴식'] },
          { time:'10:00', subjects:['수학', '영어', '국어', '역사', '체육', '휴식', '휴식'] },
          { time:'11:00', subjects:['영어', '국어', '수학', '미술', '음악', '휴식', '휴식'] },
          { time:'13:00', subjects:['과학', '사회', '역사', '국어', '수학', '휴식', '휴식'] },
          { time:'14:00', subjects:['체육', '미술', '음악', '수학', '영어', '휴식', '휴식'] },
        ];
        // ==========================================
        // [여기만 고치세요] 설정 상수 영역 끝
        // ==========================================

        // 현재 시각을 기준으로 요일과 교시를 계산하여 하이라이트 및 "쉬는 날" 안내를 처리하는 함수
        function updateCurrentHighlight() {
            // 오늘 날짜 객체 생성
            const now = new Date();
            const dayOfWeek = now.getDay(); // 0: 일요일, 1: 월요일 ... 6: 토요일

            // 자바스크립트 getDay() 결과(0=일~6=토)를 DAYS 배열 순서(0=월~6=일)로 매핑
            let dayIndex;
            if (dayOfWeek === 0) {
                dayIndex = 6; // 일요일
            } else {
                dayIndex = dayOfWeek - 1; // 월(0) ~ 토(5)
            }

            // 현재 시각을 "HH:MM" 문자열 형태로 변환
            const currentHours = String(now.getHours()).padStart(2, '0');
            const currentMinutes = String(now.getMinutes()).padStart(2, '0');
            const currentTimeStr = `${currentHours}:${currentMinutes}`;

            // 테이블의 모든 셀에서 기존 하이라이트 클래스 제거
            const allCells = document.querySelectorAll("#timetable-body td");
            for (let i = 0; i < allCells.length; i++) {
                allCells[i].classList.remove("current-period-highlight");
            }

            // "오늘은 쉬는 날" 배지 요소 가져오기
            const noticeElement = document.getElementById("rest-day-notice");

            // 조건 1: 주말(토요일=6 또는 일요일=0)인 경우 쉬는 날 안내 표시
            const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
            if (isWeekend) {
                noticeElement.innerText = "🏖️ 주말입니다. 오늘은 쉬는 날!";
                noticeElement.style.display = "inline-block";
                return; // 주말에는 교시 하이라이트를 적용하지 않고 종료
            }

            // 평일인 경우 현재 시간에 해당하는 교시 찾기
            let activePeriodIndex = -1;
            for (let i = 0; i < PERIODS.length; i++) {
                const periodTime = PERIODS[i].time;
                
                // 마지막 교시이거나 다음 교시 전까지의 시간 범위 설정
                let nextTime = "23:59";
                if (i + 1 < PERIODS.length) {
                    nextTime = PERIODS[i + 1].time;
                }

                if (currentTimeStr >= periodTime && currentTimeStr < nextTime) {
                    activePeriodIndex = i;
                    break;
                }
            }

            // 매칭된 교시가 있다면 해당 요일의 칸에 하이라이트 추가, 없으면 시간 외 휴식으로 판단
            if (activePeriodIndex !== -1) {
                noticeElement.style.display = "none"; // 수업 시간 중에는 안내 숨김
                const tbody = document.getElementById("timetable-body");
                const rows = tbody.getElementsByTagName("tr");
                if (rows[activePeriodIndex]) {
                    // 첫 번째 열은 시간이므로 요일 인덱스 + 1 번째 셀을 선택
                    const targetCell = rows[activePeriodIndex].getElementsByTagName("td")[dayIndex + 1];
                    if (targetCell) {
                        targetCell.classList.add("current-period-highlight");
                    }
                }
            } else {
                // 수업 시간이 아닌 시간대(방과 후 또는 이른 아침 등)
                noticeElement.innerText = "☕ 수업 시간이 아닙니다 (휴식 중)";
                noticeElement.style.display = "inline-block";
            }
        }

        // D-Day 계산 및 화면에 반영하는 함수
        function updateDDay() {
            // 브라우저 탭 타이틀을 설정합니다
            document.title = `${TITLE} - D-Day & 시간표`;

            // HTML 문서에서 타이틀 표시 요소를 가져옵니다
            const titleElement = document.getElementById("goal-title");
            // HTML 문서에서 카운터 표시 요소를 가져옵니다
            const counterElement = document.getElementById("d-day-counter");

            // 목표 이름과 날짜 텍스트를 구성하여 반영합니다
            titleElement.innerText = `${TITLE} - ${TARGET.label} (${TARGET.date})`;

            // 오늘 날짜를 구하고 시각을 0시 0분 0초로 초기화합니다
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            // 목표 날짜 객체를 생성하고 시각을 초기화합니다
            const targetDateObj = new Date(TARGET.date);
            targetDateObj.setHours(0, 0, 0, 0);

            // 목표일과 오늘 날짜의 차이 밀리초를 계산합니다
            const diffTime = targetDateObj - today;
            // 밀리초를 일(day) 수로 변환합니다
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            // 남은 날짜 수에 따라 텍스트를 다르게 분기 설정합니다
            if (diffDays > 0) {
                counterElement.innerText = `D - ${diffDays}`;
            } else if (diffDays === 0) {
                counterElement.innerText = "D-Day (오늘)";
            } else {
                counterElement.innerText = `D + ${Math.abs(diffDays)} (지남)`;
            }
        }

        // 월요일부터 일요일까지 포함된 7일 시간표 테이블을 생성하고 화면에 렌더링하는 함수
        function renderTimetable() {
            // 헤더와 바디 요소를 각각 가져옵니다
            const headerRow = document.getElementById("timetable-header");
            const tbody = document.getElementById("timetable-body");

            // 테이블 첫 번째 열 제목(시간) 설정
            headerRow.innerHTML = `<th class="time-cell">시간</th>`;
            // DAYS 배열(월~일 7일)을 순회하며 헤더 칸을 생성합니다
            for (let i = 0; i < DAYS.length; i++) {
                const th = document.createElement("th");
                th.innerText = DAYS[i];
                headerRow.appendChild(th);
            }

            // 테이블 바디 초기화
            tbody.innerHTML = "";

            // 교시별 데이터 배열을 순회하며 행을 생성합니다
            for (let i = 0; i < PERIODS.length; i++) {
                const periodObj = PERIODS[i];
                const row = document.createElement("tr");

                // 각 행의 맨 앞 시간 칸 생성
                const timeCell = document.createElement("td");
                timeCell.className = "time-cell";
                timeCell.innerText = periodObj.time;
                row.appendChild(timeCell);

                // 요일별 과목 데이터(월~일 7개)를 순회하며 칸 생성
                for (let j = 0; j < periodObj.subjects.length; j++) {
                    const subjectCell = document.createElement("td");
                    subjectCell.innerText = periodObj.subjects[j];
                    row.appendChild(subjectCell);
                }

                // 완성된 행을 테이블 바디에 추가합니다
                tbody.appendChild(row);
            }
        }

        // 페이지가 완전히 로드되면 D-Day 계산 및 시간표 렌더링 함수를 실행합니다
        window.onload = function() {
            updateDDay();
            renderTimetable();
            updateCurrentHighlight(); // 페이지 로드 직후 현재 교시 및 쉬는 날 상태 반영

            // 1분(60000 밀리초)마다 자동으로 현재 시간 강조 상태와 카운터를 갱신합니다
            setInterval(function() {
                updateDDay();
                updateCurrentHighlight();
            }, 60000);
        };
    </script>
</body>
</html>
