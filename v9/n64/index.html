<!DOCTYPE html>
<html lang="ko">
<head>
    <!-- 문서의 문자 인코딩을 UTF-8로 설정합니다 -->
    <meta charset="UTF-8">
    <!-- 화면 비율과 크기를 모바일 기기에 맞게 조절합니다 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 브라우저 탭에 표시될 제목입니다 -->
    <title>D-Day 시간표</title>
    <!-- 구글 폰트 Jua(주아) 적용 -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    
    <!-- 웹페이지의 디자인을 꾸미기 위한 CSS 스타일 시작 -->
    <style>
        /* :root CSS 변수 선언 (한국어 주석 포함) */
        :root {
            /* 배경 색상 (#000000) */
            --bg-color: #000000;
            
            /* 칸 및 컨테이너 색상 (#00bbfa) */
            --box-color: #00bbfa;
            
            /* 기본 글자 색상 (#ffffff) */
            --text-color: #ffffff;
            
            /* 포인트 색상 (#00ccff) */
            --accent-color: #00ccff;
            
            /* 모서리 둥글기 공통 (28px로 수정) */
            --border-radius: 28px;
        }

        /* 무드: 깊은 밤 네온사인이 반짝이는 미래지향적인 사이버 공간 */
        body {
            font-family: 'Jua', sans-serif; /* 구글 폰트 Jua 적용 */
            background-color: var(--bg-color); /* 배경 색상 변수 적용 */
            color: var(--text-color); /* 글자 색상 변수 적용 */
            margin: 0; /* 기본 여백 제거 */
            padding: 20px; /* 내부 여백 설정 */
        }

        /* 콘텐츠를 담는 중앙 정렬 박스 */
        .container {
            max-width: 800px; /* 최대 너비 800px */
            margin: 0 auto; /* 좌우 중앙 정렬 */
            background-color: var(--box-color); /* 박스 배경색 */
            color: var(--text-color); /* 내부 글자색 */
            padding: 30px; /* 내부 여백 */
            border-radius: var(--border-radius); /* 모서리 둥글기 28px */
            box-shadow: 0 4px 15px rgba(0, 187, 250, 0.2); /* 네온 느낌의 부드러운 그림자 */
        }

        /* D-Day 카운터 박스 스타일 */
        .dday-box {
            text-align: center; /* 글자 중앙 정렬 */
            background-color: var(--accent-color); /* 포인트 색상 적용 */
            color: var(--bg-color); /* 반전 색상으로 가독성 확보 */
            padding: 30px; /* 내부 여백 */
            border-radius: var(--border-radius); /* 모서리 둥글기 28px */
            margin-bottom: 30px; /* 아래 요소와의 간격 */
        }

        /* 목표 이름 글자 스타일 */
        .dday-title {
            font-size: 1.5rem; /* 글자 크기 */
            margin: 0 0 10px 0; /* 아래쪽 여백 */
        }

        /* 남은 날짜 숫자의 글자 스타일 */
        .dday-count {
            font-size: 3rem; /* 아주 큰 글자 크기 */
            font-weight: bold; /* 굵게 */
            margin: 0; /* 기본 여백 제거 */
        }

        /* 시간표 제목 스타일 */
        h2 {
            text-align: center; /* 중앙 정렬 */
            color: var(--text-color); /* 글자색 */
            margin-bottom: 15px; /* 아래 여백 */
        }

        /* 시간표 표(Table) 전체 스타일 */
        table {
            width: 100%; /* 표 너비를 화면에 꽉 차게 */
            border-collapse: separate; /* 둥근 모서리 적용을 위해 separate 사용 */
            border-spacing: 0;
            text-align: center; /* 글자 중앙 정렬 */
            border-radius: var(--border-radius); /* 모서리 둥글기 28px */
            overflow: hidden; /* 모서리 밖으로 튀어나오는 내용 숨김 */
        }

        /* 표의 셀(제목 및 내용) 공통 스타일 */
        th, td {
            border: 1px solid var(--bg-color); /* 배경색과 대비되는 테두리 */
            padding: 12px; /* 안쪽 여백 */
            font-size: 0.95rem; /* 글자 크기 */
            background-color: #0098cc; /* 칸 안쪽 가독성을 위한 톤 다운된 블루 */
            color: var(--text-color);
        }

        /* 표 제목 행 스타일 */
        th {
            background-color: var(--accent-color); /* 포인트 색상 */
            color: var(--bg-color); /* 글자색 반전 */
            font-weight: bold;
        }

        /* 마우스 올렸을 때 행 배경색 변경 효과 */
        tr:hover td {
            background-color: var(--accent-color);
            color: var(--bg-color);
            transition: 0.2s ease;
        }

        /* [추가된 기능] 현재 교시 강조 테두리 스타일 */
        .current-period {
            border: 4px solid #ff007f !important; /* 네온 핑크빛 강조 테두리 */
            box-shadow: 0 0 10px #ff007f;
        }

        /* [추가된 기능] 주말 안내 문구 스타일 */
        .weekend-notice {
            text-align: center;
            font-size: 1.3rem;
            color: #ff007f;
            margin-top: -15px;
            margin-bottom: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- 화면 전체를 감싸는 상자 시작 -->
    <div class="container">
        <!-- 1) 화면 위쪽 D-Day 카운터 영역 -->
        <div class="dday-box">
            <h1 class="dday-title" id="targetNameDisplay">목표</h1>
            <p class="dday-count" id="ddayDisplay">D-Day</p>
        </div>

        <!-- [추가된 기능] 주말 안내 문구가 들어갈 자리 -->
        <div id="weekendNotice" class="weekend-notice"></div>

        <!-- 2) 아래쪽 월~금 5교시 시간표 표 영역 -->
        <h2>주간 시간표 (월 ~ 금)</h2>
        <table>
            <thead>
                <tr>
                    <th>교시</th>
                    <th>월</th>
                    <th>화</th>
                    <th>수</th>
                    <th>목</th>
                    <th>금</th>
                </tr>
            </thead>
            <tbody id="timetableBody">
                <!-- 자바스크립트에 의해 시간표 내용이 이 곳에 동적으로 채워집니다 -->
            </tbody>
        </table>
    </div>

    <!-- 웹페이지의 동작을 제어하기 위한 자바스크립트 시작 -->
    <script>
        // ==========================================
        // 3) [여기만 고치세요] 설정 값 모음
        // ==========================================
        const CONFIG = {
            targetDate: "9999-12-31", // 목표 날짜 (형식: "YYYY-MM-DD")
            targetName: "2026년 수능/목표일", // 목표 이름 (화면 상단에 표시됨)
            
            // 5교시 시간표 데이터 (순서대로 1교시부터 5교시까지, [월, 화, 수, 목, 금])
            timetable: [
                ['축구', '축구', '축구', '발로란트', '애니보기'], // 1교시
                ['축구', '축구', '축구', '발로란트', '애니보기'], // 2교시
                ['축구', '축구', '발로란트', '발로란트', '애니보기'], // 3교시
                ['축구', '발로란트', '발로란트', '발로란트', '축구'], // 4교시
                ['축구', '발로란트', '발로란트', '발로란트', '축구'], // 5교시
            ]
        };
        // ==========================================

        // D-Day 계산 및 표시 함수
        function updateDday() {
            const today = new Date(); // 오늘 날짜 가져오기
            const target = new Date(CONFIG.targetDate); // 목표 날짜 객체 생성
            
            // 날짜 간의 시간 차이를 밀리초(ms) 단위로 구함
            const diffTime = target.getTime() - today.getTime();
            // 밀리초를 일(day) 단위로 변환 후 소수점 올림 처리
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            // HTML 요소에 목표 이름 설정
            document.getElementById("targetNameDisplay").innerText = CONFIG.targetName;

            // 남은 날짜에 따라 화면 문구 다르게 표시
            const ddayDisplay = document.getElementById("ddayDisplay");
            if (diffDays > 0) {
                ddayDisplay.innerText = `D - ${diffDays}`;
            } else if (diffDays === 0) {
                ddayDisplay.innerText = "D-Day (오늘)";
            } else {
                ddayDisplay.innerText = `D + ${Math.abs(diffDays)} (지남)`;
            }
        }

        // 시간표 표를 화면에 그려주는 함수
        function renderTimetable() {
            const tbody = document.getElementById("timetableBody");
            tbody.innerHTML = ""; // 기존 내용을 초기화

            // 설정된 시간표 배열을 반복문으로 돌며 행(tr) 생성
            CONFIG.timetable.forEach((periodSubjects, index) => {
                const row = document.createElement("tr"); // 새로운 행 생성
                
                // 교시 번호 칸 생성 (예: 1교시)
                const th = document.createElement("th");
                th.innerText = `${index + 1}교시`;
                row.appendChild(th);

                // 요일별 과목 칸 생성 (colIndex: 0=월, 1=화, 2=수, 3=목, 4=금)
                periodSubjects.forEach((subject, colIndex) => {
                    const td = document.createElement("td");
                    td.innerText = subject;
                    // 각 셀을 쉽게 찾을 수 있도록 속성 부여
                    td.setAttribute("data-day", colIndex + 1); // 1:월, 2:화, 3:수, 4:목, 5:금
                    td.setAttribute("data-period", index + 1); // 1~5교시
                    row.appendChild(td);
                });

                // 완성된 행을 표의 본문에 추가
                tbody.appendChild(row);
            });
        }

        // [추가된 기능] 현재 요일/교시 강조 및 주말 판별 함수
        function highlightCurrentPeriod() {
            const now = new Date();
            const day = now.getDay(); // 0: 일요일, 1: 월요일 ... 6: 토요일
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const currentTimeNum = hours * 60 + minutes; // 하루를 분 단위로 환산

            const noticeEl = document.getElementById("weekendNotice");
            
            // 기존 테두리 초기화
            document.querySelectorAll("td").forEach(td => td.classList.remove("current-period"));
            noticeEl.innerText = "";

            // 주말 체크 (토요일: 6, 일요일: 0)
            if (day === 0 || day === 6) {
                noticeEl.innerText = "오늘은 쉬는 날";
                return;
            }

            // 교시별 시간대 정의 (예시: 1교시 09:00~09:50, 2교시 10:00~10:50 ...)
            // 필요에 따라 시간(시*60 + 분)을 조정할 수 있습니다.
            const periodTimes = [
                { period: 1, start: 9 * 60, end: 9 * 60 + 50 },
                { period: 2, start: 10 * 60, end: 10 * 60 + 50 },
                { period: 3, start: 11 * 60, end: 11 * 60 + 50 },
                { period: 4, start: 13 * 60, end: 13 * 60 + 50 }, // 점심시간 가정 후 13시 시작
                { period: 5, start: 14 * 60, end: 14 * 60 + 50 }
            ];

            let activePeriod = null;
            periodTimes.forEach(p => {
                if (currentTimeNum >= p.start && currentTimeNum < p.end) {
                    activePeriod = p.period;
                }
            });

            // 현재 시간이 수업 시간대에 해당하면 해당 칸에 테두리 적용
            if (activePeriod !== null) {
                // day는 1(월)~5(금)
                const targetTd = document.querySelector(`td[data-day='${day}'][data-period='${activePeriod}']`);
                if (targetTd) {
                    targetTd.classList.add("current-period");
                }
            }
        }

        // 웹페이지가 처음 로드될 때 실행 및 1분(60000ms)마다 자동 갱신 설정
        window.onload = function() {
            updateDday();
            renderTimetable();
            highlightCurrentPeriod();

            // 1분마다 자동으로 갱신
            setInterval(() => {
                updateDday();
                highlightCurrentPeriod();
            }, 60000);
        };
    </script>
</body>
</html>
