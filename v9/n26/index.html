<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>D-Day & 시간표</title>
    <!-- 스타일을 지정하는 CSS 영역 시작 -->
 <!-- 구글 폰트(고운돋움) 불러오기 -->
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
    
    <!-- 스타일을 지정하는 CSS 영역 시작 -->
    <style>
        /* CSS 색상 및 디자인 변수 설정 (여기서 색상을 변경할 수 있습니다) */
        :root {
            --bg-color: #f0d8b7;     /* 페이지 전체 배경색 */
            --card-bg: #fb41b7;      /* D-Day 상자와 표 칸의 배경색 */
            --text-color: #000000;   /* 기본 글자색 (검은색) */
            --point-color: #27d3ab;  /* 포인트를 주는 강조 색상 (민트색) */
            --radius-size: 23px;     /* 모서리를 둥글게 만드는 크기 */
        }

        /* 페이지 전체 기본 설정 */
        body {
            font-family: 'Gowun Dodum', sans-serif; /* 구글 고운돋움 폰트 적용 */
            background-color: var(--bg-color);      /* 변수에서 배경색 가져오기 */
            color: var(--text-color);               /* 변수에서 글자색 가져오기 */
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;                    /* 내용을 가로 가운데 정렬 */
        }

        /* D-Day 카운터 상자 디자인 */
        .dday-container {
            background-color: var(--card-bg);       /* 카드 배경색 적용 */
            padding: 25px 40px;
            border-radius: var(--radius-size);      /* 둥근 모서리 변수 적용 */
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);/* 부드러운 그림자 효과 */
            text-align: center;
            margin-bottom: 30px;                    /* 아래쪽 표와 간격 조절 */
            width: 100%;
            max-width: 600px;
            border: 3px solid var(--text-color);    /* 테두리 추가로 키치한 느낌 살리기 */
        }

        /* D-Day 제목 글자 스타일 */
        .dday-title {
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        /* D-Day 남은 날짜 숫자 스타일 */
        .dday-count {
            font-size: 42px;
            font-weight: bold;
            color: var(--point-color);             /* 포인트 색상으로 강조 */
            text-shadow: 2px 2px 0px #000;         /* 글자에 그림자를 주어 돋보이게 함 */
        }

        /* 시간표 표(Table) 디자인 */
        table {
            width: 100%;
            max-width: 800px;
            border-collapse: separate;             /* 셀 사이 간격을 위해 separate 사용 */
            border-spacing: 6px;                   /* 표 칸들 사이의 미세한 간격 */
        }

        /* 표의 셀(제목과 내용) 공통 디자인 */
        th, td {
            background-color: var(--card-bg);      /* 칸 배경색 적용 */
            border: 2px solid var(--text-color);   /* 테두리 설정 */
            border-radius: var(--radius-size);     /* 칸마다 둥근 모서리 변수 적용 */
            padding: 15px 10px;
            text-align: center;                    /* 글자 가운데 정렬 */
            font-size: 15px;
        }

        /* 표의 머리글(요일 영역) 특별 디자인 */
        th {
            background-color: var(--point-color);  /* 요일 헤더는 포인트 색상 사용 */
            color: var(--text-color);
            font-size: 17px;
        }
/* 현재 교시 칸 강조를 위한 테두리 스타일 */
        .current-period {
            border: 4px solid var(--text-color) !important;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }
/* 시간표 칸에 3D 회전 효과를 주기 위한 부모 설정 */
        td {
            perspective: 1000px;
            cursor: pointer; /* 클릭할 수 있는 손가락 모양 커서 */
        }

        /* 칸 내부를 감싸는 카드 컨테이너 */
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s; /* 돌아가는 속도 */
            transform-style: preserve-3d;
        }

        /* 칸이 뒤집혔을 때 클래스 */
        td.flipped .card-inner {
            transform: rotateY(180deg);
        }

        /* 카드의 앞면과 뒷면 공통 설정 */
        .card-front, .card-back {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            backface-visibility: hidden; /* 뒤집혔을 때 뒷면이 안 보이게 처리 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 5px;
        }

        /* 카드의 뒷면(메모 입력/보기 화면) */
        .card-back {
            transform: rotateY(180deg);
            background-color: #fff;
            border-radius: var(--radius-size);
            color: var(--text-color);
        }

        /* 메모 입력창 스타일 */
        .memo-input {
            width: 90%;
            height: 70%;
            font-family: 'Gowun Dodum', sans-serif;
            font-size: 13px;
            border: 1px solid var(--text-color);
            border-radius: 8px;
            padding: 4px;
            resize: none;
            box-sizing: border-box;
        }
    </style>
    <!-- 스타일 영역 끝 -->
</head>
<body>

    <!-- 화면 위쪽: D-Day 카운터가 들어갈 자리 -->
    <div class="dday-container">
        <div id="ddayTitle" class="dday-title">목표 이름</div>
        <div id="ddayCount" class="dday-count">D-0</div>
    </div>

    <!-- 화면 아래쪽: 월~금 5교시 시간표 표가 들어갈 자리 -->
<!-- 주말일 때 안내 문구가 나타날 자리 -->
    <div id="weekendNotice" style="margin-bottom: 20px; font-weight: bold; font-size: 18px; display: none;"></div>
    <table>
        <thead>
            <tr id="tableHeader">
                <!-- 자바스크립트로 요일 헤더가 여기에 자동으로 채워집니다 -->
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- 자바스크립트로 시간표 내용이 여기에 자동으로 채워집니다 -->
        </tbody>
    </table>

    <!-- 자바스크립트 코드 영역 시작 -->
    <script>
        // ==========================================
        // [여기만 고치세요] 설정값 변경 영역
        // ==========================================
        const TITLE  = '시험공부좀 해라'; // D-Day 목표의 이름
        const TARGET = { label:'중간고사 이후', date:'2026-10-14' }; // 목표 날짜 (YYYY-MM-DD 형식)
        const DAYS   = ['월','화','수','목','금']; // 표시할 요일 목록
        const PERIODS = [
          { time:'09:05', subjects:['자습시간', '자습시간', '자습시간', '쉬는 시간', '-'] },
          { time:'10:00', subjects:['자습시간', '수학 시험', '과학 시험', '쉬는 시간', '-'] },
          { time:'10:55', subjects:['자습시간', '국어시험', '영어 시험', '체육', '-'] },
          { time:'11:50', subjects:['자습시간', '조기하교', '조기 하교', '시험끝축하파티', '-'] },
          { time:'13:30', subjects:['자습시간', '조기하교', '조기하교', '시험끝축하파티', '-'] },
        ];
        // ==========================================

        // 1. D-Day 계산 및 화면에 표시하는 함수
        function updateDDay() {
            const titleElement = document.getElementById('ddayTitle'); // D-Day 제목 요소를 가져옴
            const countElement = document.getElementById('ddayCount'); // D-Day 숫자 요소를 가져옴

            const targetDate = new Date(TARGET.date); // 목표 날짜 객체 생성
            const today = new Date(); // 오늘 날짜 객체 생성

            // 시, 분, 초를 0으로 초기화하여 정확한 날짜(일수) 차이만 계산
            targetDate.setHours(0, 0, 0, 0);
            today.setHours(0, 0, 0, 0);

            // 밀리초 단위를 하루 단위(일)로 변환
            const diffTime = targetDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            // 화면에 보여줄 텍스트 결정
            let ddayText = '';
            if (diffDays > 0) {
                ddayText = `D - ${diffDays}`; // 목표일이 남았을 때
            } else if (diffDays === 0) {
                ddayText = 'D - Day (오늘!)'; // 목표일이 오늘일 때
            } else {
                ddayText = `D + ${Math.abs(diffDays)}`; // 목표일이 지났을 때
            }

            // HTML 요소에 결과 반영
            titleElement.innerText = `${TITLE} (${TARGET.label})`;
            countElement.innerText = ddayText;
        }

        // 2. 시간표 표를 생성하고 화면에 채우는 함수
// 2. 시간표 표를 생성하고 현재 교시를 강조하는 함수
// 2. 시간표 표를 생성하고 카드 뒤집기(메모) 기능을 부여하는 함수
        function renderTimetable() {
            const headerRow = document.getElementById('tableHeader'); 
            const tableBody = document.getElementById('tableBody'); 
            const noticeDiv = document.getElementById('weekendNotice');

            // 요일 헤더 만들기
            let headerHTML = '<th>시간</th>';
            for (let i = 0; i < DAYS.length; i++) {
                headerHTML += `<th>${DAYS[i]}요일</th>`;
            }
            headerRow.innerHTML = headerHTML; 

            // 현재 날짜 및 시간 구하기
            const now = new Date();
            const currentDayIndex = now.getDay(); 
            
            if (currentDayIndex === 0 || currentDayIndex === 6) {
                noticeDiv.innerText = '☕ 오늘은 주말이라 쉬는 날입니다!';
                noticeDiv.style.display = 'block';
            } else {
                noticeDiv.style.display = 'none';
            }

            const currentTimeStr = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');

            let currentPeriodIndex = -1;
            for (let i = 0; i < PERIODS.length; i++) {
                if (PERIODS[i].time <= currentTimeStr) {
                    if (i === PERIODS.length - 1 || currentTimeStr < PERIODS[i + 1].time) {
                        currentPeriodIndex = i;
                    }
                }
            }

            // 각 교시별 시간표 내용 채우기
            let bodyHTML = '';
            for (let i = 0; i < PERIODS.length; i++) {
                const period = PERIODS[i];
                let isCurrentRow = (i === currentPeriodIndex && currentDayIndex >= 1 && currentDayIndex <= 5);

                bodyHTML += '<tr>';
                bodyHTML += `<td><strong>${period.time}</strong><br>${i+1}교시</td>`; 

                for (let j = 0; j < period.subjects.length; j++) {
                    let isCurrentCell = (isCurrentRow && j === (currentDayIndex - 1));
                    let cellClass = isCurrentCell ? ' class="current-period"' : '';
                    
                    // 고유 키 생성 (교시-요일)
                    let memoKey = `memo_${i}_${j}`;
                    let savedMemo = localStorage.getItem(memoKey) || '';

                    // 카드 뒤집기 구조 HTML 생성 (앞면: 과목명, 뒷면: 메모장)
                    bodyHTML += `<td${cellClass} onclick="this.classList.toggle('flipped')">` +
                                  `<div class="card-inner">` +
                                    `<div class="card-front">${period.subjects[j]}</div>` +
                                    `<div class="card-back" onclick="event.stopPropagation()">` +
                                      `<textarea class="memo-input" placeholder="메모 입력" oninput="saveMemo('${memoKey}', this.value)">${savedMemo}</textarea>` +
                                    `</div>` +
                                  `</div>` +
                                `</td>`;
                }
                bodyHTML += '</tr>';
            }
            tableBody.innerHTML = bodyHTML; 
        }

        // 3. 메모를 브라우저에 실시간 저장하는 함수
        function saveMemo(key, value) {
            localStorage.setItem(key, value);
        }// 페이지가 처음 열렸을 때 함수 실행
        updateDDay();
        renderTimetable();

        // 1분(60000밀리초)마다 자동으로 시간표와 D-Day를 다시 갱신
        setInterval(() => {
            updateDDay();
            renderTimetable();
        }, 60000);
    </script>
    <!-- 자바스크립트 영역 끝 -->

</body>
</html>
