<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dungeon 100</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#08070c;
    color:#fff;
    font-family:Arial,sans-serif;
}

button{
    border:1px solid #5b4c68;
    background:#211b2b;
    color:#fff;
    border-radius:8px;
    padding:10px 14px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#3b3048;
}

.hidden{
    display:none!important;
}

/* =========================
   LOBBY
========================= */

#lobby{
    position:absolute;
    inset:0;
    background:
        radial-gradient(circle at 50% 35%,#3a294a 0%,#17121f 38%,#08070c 80%);
}

.title{
    text-align:center;
    padding-top:35px;
    font-size:42px;
    font-weight:bold;
    color:#e8bd70;
    text-shadow:0 0 20px #8d5e2b;
}

.subtitle{
    text-align:center;
    color:#999;
    margin-top:6px;
}

.top-info{
    position:absolute;
    top:18px;
    right:20px;
    background:#15111c;
    border:1px solid #4e4159;
    border-radius:10px;
    padding:12px 18px;
}

.gold{
    color:#f0c557;
}

.hero{
    position:absolute;
    left:50%;
    top:40%;
    transform:translate(-50%,-50%);
    text-align:center;
}

.hero-icon{
    width:130px;
    height:130px;
    border-radius:50%;
    background:#2b2135;
    border:4px solid #9f7ac1;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:60px;
    box-shadow:0 0 35px #674782;
}

.hero-name{
    margin-top:15px;
    font-size:25px;
    color:#e4bc75;
}

.hero-stats{
    margin-top:8px;
    color:#aaa;
}

.menu{
    position:absolute;
    left:50%;
    bottom:22px;
    transform:translateX(-50%);
    width:min(620px,92vw);
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
}

.menu button{
    min-height:50px;
}

.menu .start{
    grid-column:1/4;
    height:65px;
    font-size:20px;
    background:linear-gradient(135deg,#704820,#b17835);
    border-color:#d5a35c;
}

/* =========================
   PANEL
========================= */

#panel{
    position:absolute;
    z-index:100;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:min(700px,92vw);
    max-height:88vh;
    overflow:auto;
    background:#14111b;
    border:1px solid #5d4d69;
    border-radius:14px;
    padding:22px;
    box-shadow:0 0 60px #000;
}

#panel h2{
    color:#e4bb70;
    text-align:center;
}

.card{
    background:#211b2b;
    border:1px solid #403549;
    border-radius:10px;
    padding:14px;
    margin:9px 0;
}

.class-card{
    cursor:pointer;
}

.class-card:hover,
.class-card.selected{
    border-color:#d8a95f;
    background:#2d2437;
}

.row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.close{
    width:100%;
    margin-top:12px;
}

.buy{
    background:#70502c;
}

.small{
    color:#999;
    font-size:13px;
}

/* =========================
   DUNGEON
========================= */

#dungeon{
    position:absolute;
    inset:0;
    display:none;
    background:#09080d;
}

#gameCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

.hud{
    position:absolute;
    z-index:5;
    left:15px;
    right:15px;
    top:15px;
    display:flex;
    justify-content:space-between;
    pointer-events:none;
}

.hud-box{
    background:rgba(15,12,20,.94);
    border:1px solid #51445b;
    border-radius:9px;
    padding:10px 14px;
}

.hp-bg{
    width:230px;
    height:14px;
    margin-top:5px;
    background:#38151c;
    border-radius:10px;
    overflow:hidden;
}

#hpFill{
    width:100%;
    height:100%;
    background:#dc4d59;
}

.leave{
    position:absolute;
    z-index:20;
    top:75px;
    right:15px;
}

.skillbar{
    position:absolute;
    z-index:10;
    left:50%;
    bottom:18px;
    transform:translateX(-50%);
    display:flex;
    gap:9px;
}

.skill{
    width:82px;
    height:76px;
    position:relative;
    text-align:center;
    padding-top:7px;
    background:rgba(24,19,31,.96);
    border:2px solid #55455f;
    border-radius:9px;
}

.skill-icon{
    font-size:27px;
}

.skill-key{
    color:#dcb16a;
    font-size:12px;
}

.skill-name{
    color:#aaa;
    font-size:10px;
    margin-top:2px;
}

.cooldown{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.65);
    border-radius:7px;
    font-size:24px;
}

.help{
    position:absolute;
    z-index:5;
    left:50%;
    bottom:105px;
    transform:translateX(-50%);
    color:#777;
    font-size:12px;
}

#message{
    position:absolute;
    z-index:1000;
    left:50%;
    top:16%;
    transform:translateX(-50%);
    padding:12px 24px;
    border:1px solid #b57e3c;
    background:rgba(18,14,23,.96);
    border-radius:9px;
    opacity:0;
    pointer-events:none;
    transition:.2s;
}

#message.show{
    opacity:1;
}

input[type=range]{
    width:100%;
}
</style>
</head>

<body>

<!-- =========================
     LOBBY
========================= -->

<div id="lobby">

    <div class="title">⚔ DUNGEON 100</div>
    <div class="subtitle">
        100층의 던전을 돌파하라
    </div>

    <div class="top-info">
        🪙 <span id="lobbyGold">0</span>G
        &nbsp; | &nbsp;
        🗝️ <span id="lobbyKeys">0</span>
        &nbsp; | &nbsp;
        최고 <span id="lobbyBest">1</span>F
    </div>

    <div class="hero">
        <div class="hero-icon" id="heroIcon">⚔️</div>
        <div class="hero-name" id="heroName">기사</div>
        <div class="hero-stats" id="heroStats"></div>
    </div>

    <div class="menu">

        <button class="start" onclick="startDungeon()">
            ⚔️ 던전 입장
        </button>

        <button onclick="openClasses()">🧙 직업</button>
        <button onclick="openShop()">🛒 상점</button>
        <button onclick="openUpgrade()">🔨 강화</button>

        <button onclick="openEquipment()">🎒 장비</button>
        <button onclick="openSkills()">✨ 스킬</button>
        <button onclick="openCollection()">📜 도감</button>

        <button onclick="openSettings()">⚙️ 설정</button>
        <button onclick="resetGame()">🗑️ 초기화</button>

    </div>
</div>


<!-- =========================
     DUNGEON
========================= -->

<div id="dungeon">

    <canvas id="gameCanvas"></canvas>

    <div class="hud">

        <div class="hud-box">
            ❤️ HP
            <div class="hp-bg">
                <div id="hpFill"></div>
            </div>
            <span id="hpText"></span>
        </div>

        <div class="hud-box">
            🪙 <span id="dGold">0</span>G
            &nbsp;&nbsp;
            🗝️ <span id="dKeys">0</span>
            &nbsp;&nbsp;
            <b><span id="dFloor">1</span>F</b>
        </div>

    </div>

    <button class="leave" onclick="leaveDungeon()">
        🚪 로비
    </button>

    <div class="help">
        WASD 이동 | 마우스 좌클릭 공격 | Q / E / R 스킬
    </div>

    <div class="skillbar">

        <div class="skill">
            <div class="skill-icon" id="qIcon">🛡️</div>
            <div class="skill-key">Q</div>
            <div class="skill-name" id="qName"></div>
            <div class="cooldown" id="qCD">0</div>
        </div>

        <div class="skill">
            <div class="skill-icon" id="eIcon">🔥</div>
            <div class="skill-key">E</div>
            <div class="skill-name" id="eName"></div>
            <div class="cooldown" id="eCD">0</div>
        </div>

        <div class="skill">
            <div class="skill-icon" id="rIcon">👑</div>
            <div class="skill-key">R</div>
            <div class="skill-name" id="rName"></div>
            <div class="cooldown" id="rCD">0</div>
        </div>

    </div>

</div>

<div id="panel" class="hidden"></div>
<div id="message"></div>


<script>
"use strict";

/* =========================================================
   저장 데이터
========================================================= */

const SAVE_KEY = "DUNGEON_100_FINAL";

const defaultSave = {
    gold: 1000,
    keys: 1,
    floor: 1,
    bestFloor: 1,

    className:"기사",

    weapon:{
        name:"낡은 검",
        attack:5,
        level:0
    },

    armor:{
        name:"낡은 갑옷",
        defense:2,
        level:0
    },

    skills:{
        q:1,
        e:1,
        r:1
    },

    settings:{
        scale:100,
        up:"w",
        down:"s",
        left:"a",
        right:"d",
        q:"q",
        e:"e",
        r:"r"
    },

    discovered:[],
    achievements:[]
};

let saveData;

try{
    const raw = localStorage.getItem(SAVE_KEY);
    saveData = raw ? JSON.parse(raw) : structuredClone(defaultSave);
}catch(e){
    saveData = structuredClone(defaultSave);
}

function saveGame(){
    localStorage.setItem(
        SAVE_KEY,
        JSON.stringify(saveData)
    );
}


/* =========================================================
   직업
========================================================= */

const CLASSES = {

    기사:{
        icon:"⚔️",
        hp:170,
        attack:14,
        defense:11,
        speed:2.7,

        q:{
            icon:"🛡️",
            name:"방패 강타",
            cd:180
        },

        e:{
            icon:"🛡️",
            name:"철벽",
            cd:360
        },

        r:{
            icon:"💥",
            name:"대지의 일격",
            cd:900
        }
    },

    레인저:{
        icon:"🏹",
        hp:105,
        attack:20,
        defense:5,
        speed:3.4,

        q:{
            icon:"🏹",
            name:"관통 화살",
            cd:150
        },

        e:{
            icon:"💥",
            name:"폭발 화살",
            cd:300
        },

        r:{
            icon:"🌪️",
            name:"폭풍의 화살",
            cd:780
        }
    },

    마법사:{
        icon:"🔥",
        hp:85,
        attack:28,
        defense:3,
        speed:2.8,

        q:{
            icon:"🔥",
            name:"화염구",
            cd:160
        },

        e:{
            icon:"❄️",
            name:"빙결",
            cd:330
        },

        r:{
            icon:"☄️",
            name:"메테오",
            cd:960
        }
    },

    암살자:{
        icon:"🗡️",
        hp:95,
        attack:23,
        defense:5,
        speed:3.7,

        q:{
            icon:"💨",
            name:"그림자 돌진",
            cd:150
        },

        e:{
            icon:"🗡️",
            name:"암습",
            cd:280
        },

        r:{
            icon:"☠️",
            name:"죽음의 표식",
            cd:840
        }
    }
};


/* =========================================================
   UI
========================================================= */

function updateLobby(){

    const c = CLASSES[saveData.className];

    document.getElementById("lobbyGold").textContent =
        saveData.gold;

    document.getElementById("lobbyKeys").textContent =
        saveData.keys;

    document.getElementById("lobbyBest").textContent =
        saveData.bestFloor;

    document.getElementById("heroIcon").textContent =
        c.icon;

    document.getElementById("heroName").textContent =
        saveData.className;

    document.getElementById("heroStats").innerHTML =
        `❤️ ${c.hp}
        　⚔️ ${c.attack + saveData.weapon.attack}
        　🛡️ ${c.defense + saveData.armor.defense}
        　💨 ${c.speed}`;
}

updateLobby();


function showPanel(html){

    const panel = document.getElementById("panel");

    panel.innerHTML = html;
    panel.classList.remove("hidden");
}

function closePanel(){

    document.getElementById("panel")
        .classList.add("hidden");
}


/* =========================================================
   직업 선택
========================================================= */

function openClasses(){

    let html = `<h2>🧙 직업 선택</h2>`;

    for(const [name,c] of Object.entries(CLASSES)){

        html += `
        <div class="card class-card
            ${saveData.className===name ? "selected":""}"
            onclick="selectClass('${name}')">

            <h3>
                ${c.icon} ${name}
            </h3>

            ❤️ HP ${c.hp}
           　⚔️ 공격 ${c.attack}
           　🛡️ 방어 ${c.defense}
           　💨 이속 ${c.speed}

            <hr>

            Q ${c.q.icon} ${c.q.name}
            <br>
            E ${c.e.icon} ${c.e.name}
            <br>
            R ${c.r.icon} ${c.r.name}

        </div>`;
    }

    html += `
        <button class="close" onclick="closePanel()">
            닫기
        </button>
    `;

    showPanel(html);
}


function selectClass(name){

    saveData.className = name;

    saveGame();
    updateLobby();
    closePanel();

    showMessage(
        `${CLASSES[name].icon} ${name} 선택`
    );
}


/* =========================================================
   스킬 업그레이드
========================================================= */

function skillDamageMultiplier(level){
    return 1 + (level-1)*0.25;
}

function skillCost(type){
    return 250 * saveData.skills[type];
}

function upgradeSkill(type){

    if(saveData.skills[type] >= 5){
        showMessage("이미 최대 레벨입니다.");
        return;
    }

    const cost = skillCost(type);

    if(saveData.gold < cost){
        showMessage("골드가 부족합니다.");
        return;
    }

    saveData.gold -= cost;
    saveData.skills[type]++;

    saveGame();
    updateLobby();

    showMessage(
        `${type.toUpperCase()} 스킬 Lv.${saveData.skills[type]}`
    );

    openSkills();
}


function openSkills(){

    const c = CLASSES[saveData.className];

    let html = `
        <h2>✨ 스킬 강화</h2>

        <div class="card">
            현재 골드:
            <span class="gold">${saveData.gold}G</span>
        </div>
    `;

    for(const type of ["q","e","r"]){

        const s = c[type];
        const lv = saveData.skills[type];

        html += `
        <div class="card">

            <div class="row">

                <div>
                    <b>
                        ${s.icon}
                        ${type.toUpperCase()}
                        - ${s.name}
                    </b>

                    <br>

                    <span class="small">
                        현재 Lv.${lv} |
                        피해 배율 x${skillDamageMultiplier(lv).toFixed(2)}
                    </span>
                </div>

                ${
                    lv < 5
                    ? `<button class="buy"
                        onclick="upgradeSkill('${type}')">
                        ${skillCost(type)}G
                        <br>
                        Lv.${lv+1}
                    </button>`
                    : `<span class="green">MAX</span>`
                }

            </div>

        </div>`;
    }

    html += `
        <button class="close" onclick="closePanel()">
            닫기
        </button>
    `;

    showPanel(html);
}


/* =========================================================
   상점
========================================================= */

function keyPrice(){

    const f = saveData.floor;

    return Math.floor(
        100 *
        Math.pow(1.055,f-1)
    );
}


function openShop(){

    let html = `
        <h2>🛒 골드 상점</h2>

        <div class="card">
            🪙 보유 골드:
            <span class="gold">${saveData.gold}G</span>
        </div>
    `;

    const weapons = [
        ["철검",500,15,10],
        ["강철검",1400,35,20],
        ["미스릴 검",3500,65,30],
        ["영웅의 검",8500,110,50],
        ["전설의 검",20000,180,70],
        ["신검",50000,300,90]
    ];

    for(const w of weapons){

        if(saveData.bestFloor < w[3])
            continue;

        html += `
        <div class="card">
            <div class="row">

                <div>
                    ⚔️ ${w[0]}
                    <br>
                    공격력 +${w[2]}
                </div>

                <button class="buy"
                    onclick="buyWeapon('${w[0]}',${w[1]},${w[2]})">
                    ${w[1]}G
                </button>

            </div>
        </div>`;
    }

    const armors = [
        ["철갑옷",500,10,10],
        ["강철 갑옷",1400,25,20],
        ["미스릴 갑옷",3500,48,30],
        ["영웅의 갑옷",8500,85,50],
        ["전설의 갑옷",20000,140,70],
        ["신의 갑옷",50000,230,90]
    ];

    for(const a of armors){

        if(saveData.bestFloor < a[3])
            continue;

        html += `
        <div class="card">
            <div class="row">

                <div>
                    🛡️ ${a[0]}
                    <br>
                    방어력 +${a[2]}
                </div>

                <button class="buy"
                    onclick="buyArmor('${a[0]}',${a[1]},${a[2]})">
                    ${a[1]}G
                </button>

            </div>
        </div>`;
    }

    const kp = keyPrice();

    html += `
        <div class="card">
            <div class="row">
                <div>
                    🗝️ 다음 층 열쇠
                    <br>
                    <span class="small">
                        현재 ${saveData.floor}층
                    </span>
                </div>

                <button class="buy"
                    onclick="buyKey()">
                    ${kp}G
                </button>
            </div>
        </div>

        <button class="close" onclick="closePanel()">
            닫기
        </button>
    `;

    showPanel(html);
}


function buyWeapon(name,cost,attack){

    if(saveData.gold < cost){
        showMessage("골드가 부족합니다.");
        return;
    }

    saveData.gold -= cost;

    saveData.weapon = {
        name,
        attack,
        level:0
    };

    saveGame();
    updateLobby();

    showMessage(`⚔️ ${name} 구매`);

    openShop();
}


function buyArmor(name,cost,defense){

    if(saveData.gold < cost){
        showMessage("골드가 부족합니다.");
        return;
    }

    saveData.gold -= cost;

    saveData.armor = {
        name,
        defense,
        level:0
    };

    saveGame();
    updateLobby();

    showMessage(`🛡️ ${name} 구매`);

    openShop();
}


function buyKey(){

    const cost = keyPrice();

    if(saveData.gold < cost){
        showMessage("골드가 부족합니다.");
        return;
    }

    saveData.gold -= cost;
    saveData.keys++;

    saveGame();
    updateLobby();

    showMessage("🗝️ 열쇠 구매");

    openShop();
}


/* =========================================================
   강화
========================================================= */

function weaponUpgradeCost(){
    return 350 + saveData.weapon.level * 450;
}

function armorUpgradeCost(){
    return 350 + saveData.armor.level * 450;
}


function openUpgrade(){

    const wc = weaponUpgradeCost();
    const ac = armorUpgradeCost();

    showPanel(`
        <h2>🔨 장비 강화</h2>

        <div class="card">
            ⚔️ ${saveData.weapon.name}
            +${saveData.weapon.level}

            <br>
            공격력 +${saveData.weapon.attack}

            <button class="buy"
                style="float:right"
                onclick="upgradeWeapon()">
                ${wc}G
            </button>
        </div>

        <div class="card">
            🛡️ ${saveData.armor.name}
            +${saveData.armor.level}

            <br>
            방어력 +${saveData.armor.defense}

            <button class="buy"
                style="float:right"
                onclick="upgradeArmor()">
                ${ac}G
            </button>
        </div>

        <button class="close"
            onclick="closePanel()">
            닫기
        </button>
    `);
}


function upgradeWeapon(){

    const cost = weaponUpgradeCost();

    if(saveData.gold < cost){
        showMessage("골드가 부족합니다.");
        return;
    }

    saveData.gold -= cost;
    saveData.weapon.level++;
    saveData.weapon.attack += 7;

    saveGame();
    updateLobby();

    showMessage("⚔️ 무기 강화!");

    openUpgrade();
}


function upgradeArmor(){

    const cost = armorUpgradeCost();

    if(saveData.gold < cost){
        showMessage("골드가 부족합니다.");
        return;
    }

    saveData.gold -= cost;
    saveData.armor.level++;
    saveData.armor.defense += 5;

    saveGame();
    updateLobby();

    showMessage("🛡️ 방어구 강화!");

    openUpgrade();
}


/* =========================================================
   장비 / 도감
========================================================= */

function openEquipment(){

    const c = CLASSES[saveData.className];

    showPanel(`
        <h2>🎒 장비</h2>

        <div class="card">
            ${c.icon} ${saveData.className}

const pressed = {};

window.addEventListener("keydown",function(e){

    const key = e.key.toLowerCase();

    if(waitingKey){

        saveData.settings[waitingKey] = key;
        waitingKey = null;

        saveGame();
        openSettings();

        return;
    }

    pressed[key] = true;

    if(!gameRunning)
        return;

    /*
       Q/E/R은 기본키와
       사용자가 설정한 키 모두 인식
    */

    const s = saveData.settings;

    if(key === "q" || key === s.q)
        useSkill("q");

    if(key === "e" || key === s.e)
        useSkill("e");

    if(key === "r" || key === s.r)
        useSkill("r");

    if(key === "escape")
        leaveDungeon();

    e.preventDefault();
});


window.addEventListener("keyup",function(e){

    pressed[e.key.toLowerCase()] = false;
});

function startDungeon(){

    */

    if(saveData.keys <= 0){

        const price = keyPrice();

        if(saveData.gold >= price){

            saveData.gold -= price;
            saveData.keys++;

            saveGame();

        }else{

            alert(
                `열쇠가 없습니다.\n`+
                `필요 골드: ${price}G`

            openShop();
            return;

    }

    */

    saveData.keys--;

        CLASSES[saveData.className];

    player = {

        y:canvas.height/2,

        radius:19,

========================================================= */

function createFloor(){

    monsters=[];

    const floor =
        saveData.floor;

    /*
       100층
    */

    if(floor===100){

        spawnMonster({
            type:"boss",
            name:"대마왕",
            icon:"😈",
            hp:65000,
            attack:500,
            speed:.55,
            range:180,
            gold:100000,
            radius:48
        });

        return;
    }

    /*
       10층 단위 보스
    */

    if(floor % 10 === 0){

        const bossLevel =
            floor/10;

        spawnMonster({
            type:"boss",
            name:
                floor===90
                ?"드래곤"
                :"층의 지배자",
            icon:
                floor===90
                ?"🐉"
                :"👑",
            hp:
                800 *
                Math.pow(1.45,bossLevel-1),
            attack:
                35 *
                Math.pow(1.38,bossLevel-1),
            speed:.45 + bossLevel*.02,
            range:170,
            gold:
                600 *
                bossLevel,
            radius:38 + bossLevel
        });

        return;
    }

    /*
       몬스터 수
    */

    const count =
        Math.min(
            4 +
            Math.floor(floor/7),
            13
        );

    for(let i=0;i<count;i++){

        const type =
            chooseMonsterType(floor);

        spawnMonster(type);
    }
}


/* =========================================================
   몬스터 종류
========================================================= */

function chooseMonsterType(floor){

    const r = Math.random();

    /*
       초반
    */

    if(floor < 10){

        return r<.8
            ? MONSTER.MELEE
            : MONSTER.FAST;
    }

    /*
       10~29
    */

    if(floor < 30){

        if(r<.50)
            return MONSTER.MELEE;

        if(r<.70)
            return MONSTER.FAST;

        if(r<.88)
            return MONSTER.RANGED;

        return MONSTER.TANK;
    }

    /*
       30~49
    */

    if(floor < 50){

        if(r<.32)
            return MONSTER.MELEE;

        if(r<.48)
            return MONSTER.FAST;

        if(r<.68)
            return MONSTER.RANGED;

        if(r<.84)
            return MONSTER.TANK;

        return MONSTER.AOE;
    }

    /*
       50+
    */

    if(r<.20)
        return MONSTER.MELEE;

    if(r<.35)
        return MONSTER.FAST;

    if(r<.57)
        return MONSTER.RANGED;

    if(r<.72)
        return MONSTER.TANK;

    return MONSTER.AOE;
}

/* =========================================================
   몬스터 생성
========================================================= */

function spawnMonster(base){

    const floor =
        saveData.floor;

    const scale =
        1 +
        floor*0.045 +
        Math.pow(floor,1.35)*0.002;

    let x,y;

    do{

        x =
            50 +
            Math.random() *
            Math.max(
                100,
                canvas.width-100
            );

        y =
            100 +
            Math.random() *
            Math.max(
                100,
                canvas.height-160
            );

    }while(
        player &&
        Math.hypot(
            x-player.x,
            y-player.y
        )<180
    );

    const m={

        ...base,

        x,
        y,

        maxHp:
            Math.floor(
                base.hp*scale
            ),

        hp:
            Math.floor(
                base.hp*scale
            ),

        attack:
            base.attack*scale,

        speed:
            base.speed *
            (1+floor*.002),

        gold:
            Math.floor(
                base.gold *
                (1+floor*.035)
            ),

        attackTimer:
            Math.random()*100,

        slow:1,
        stun:0,
        flash:0
    };

    monsters.push(m);

    if(
        !saveData.discovered
            .includes(base.name)
    ){

        saveData.discovered.push(
            base.name
        );

        saveGame();
    }
}


/* =========================================================
   게임 루프
========================================================= */

function gameLoop(time){

    if(!gameRunning)
        return;

    const dt =
        Math.min(
            (time-lastTime)/16.666,
            2
        );

    lastTime=time;

    update(dt);
    draw();

    requestAnimationFrame(gameLoop);
}


/* =========================================================
   UPDATE
========================================================= */

function update(dt){

    movePlayer(dt);

    if(player.attackTimer>0)
        player.attackTimer-=dt;

    if(player.invincible>0)
        player.invincible-=dt;

    for(const k of ["q","e","r"]){

        if(cooldown[k]>0)
            cooldown[k]-=dt;
    }

    updateMonsters(dt);
    updateProjectiles(dt);
    updateEffects(dt);

    if(
        mouse.down &&
        (
            saveData.className==="레인저" ||
            saveData.className==="마법사"
        )
    ){
        basicAttack();
    }

    updateHUD();
    updateSkillHUD();
}


/* =========================================================
   플레이어 이동
========================================================= */

function movePlayer(dt){

    const s =
        saveData.settings;

    let dx=0;
    let dy=0;

    if(pressed[s.up])
        dy--;

    if(pressed[s.down])
        dy++;

    if(pressed[s.left])
        dx--;

    if(pressed[s.right])
        dx++;

    if(dx || dy){

        const len =
            Math.hypot(dx,dy);

        dx/=len;
        dy/=len;

        /*
           의도적으로 느리게 설정
        */

        player.x +=
            dx *
            player.speed *
            dt;

        player.y +=
            dy *
            player.speed *
            dt;
    }

    player.x =
        Math.max(
            30,
            Math.min(
                canvas.width-30,
                player.x
            )
        );

    player.y =
        Math.max(
            95,
            Math.min(
                canvas.height-30,
                player.y
            )
        );
}


/* =========================================================
   기본 공격
========================================================= */

function basicAttack(){

    if(!gameRunning)
        return;

    if(player.attackTimer>0)
        return;

    const cls =
        saveData.className;

    if(cls==="기사" || cls==="암살자"){

        player.attackTimer=18;

        const angle =
            Math.atan2(
                mouse.y-player.y,
                mouse.x-player.x
            );

        for(const m of [...monsters]){

            const dx=m.x-player.x;
            const dy=m.y-player.y;

            const dist=Math.hypot(dx,dy);

            if(dist>85+m.radius)
                continue;

            const a=Math.atan2(dy,dx);

            if(
                Math.abs(
                    normalizeAngle(a-angle)
                )<.9
            ){

                let dmg=player.attack;

                if(cls==="암살자")
                    dmg*=1.25;

                damageMonster(
                    m,
                    dmg
                );
            }
        }

        effects.push({
            type:"slash",
            x:player.x,
            y:player.y,
            angle,
            life:12,
            max:12
        });

    }else{

        player.attackTimer=15;

        const angle =
            Math.atan2(
                mouse.y-player.y,
                mouse.x-player.x
            );

        projectiles.push({

            type:
                cls==="레인저"
                ?"arrow"
                :"magic",

            x:player.x,
            y:player.y,

            vx:
                Math.cos(angle)*8,

            vy:
                Math.sin(angle)*8,

            damage:
                player.attack,

            life:70,
            radius:6
        });
    }
}


/* =========================================================
   스킬
========================================================= */

function useSkill(type){

    if(!gameRunning)
        return;

    if(cooldown[type]>0){

        showMessage("아직 스킬이 준비되지 않았습니다.");
        return;
    }

    const cls =
        saveData.className;

    cooldown[type] =
        CLASSES[cls][type].cd;

    if(type==="q")
        skillQ(cls);

    if(type==="e")
        skillE(cls);

    if(type==="r")
        skillR(cls);
}


/* ================= Q ================= */

function skillQ(cls){

    const level =
        saveData.skills.q;

    const mult =
        skillDamageMultiplier(level);

    if(cls==="기사"){

        for(const m of [...monsters]){

            if(
                Math.hypot(
                    m.x-player.x,
                    m.y-player.y
                )<145
            ){

                damageMonster(
                    m,
                    player.attack*1.8*mult
                );

                m.stun=35;
            }
        }

        addCircle(
            player.x,
            player.y,
            145,
            "#8dc9ff"
        );

        showMessage("🛡️ 방패 강타!");

    }else if(cls==="레인저"){

        const angle =
            Math.atan2(
                mouse.y-player.y,
                mouse.x-player.x
            );

        projectiles.push({

            type:"piercing",
            x:player.x,
            y:player.y,

            vx:Math.cos(angle)*11,
            vy:Math.sin(angle)*11,

            damage:
                player.attack*
                2.2*mult,

            life:100,
            radius:10
        });

        showMessage("🏹 관통 화살!");

    }else if(cls==="마법사"){

        const target =
            nearestMonster();

        if(target){

            for(const m of [...monsters]){

                if(
                    Math.hypot(
                        m.x-target.x,
                        m.y-target.y
                    )<120
                ){

                    damageMonster(
                        m,
                        player.attack*
                        2*mult
                    );
                }
            }

            addCircle(
                target.x,
                target.y,
                120,
                "#ff682f"
            );
        }

        showMessage("🔥 화염구!");

    }else{

        const angle =
            Math.atan2(
                mouse.y-player.y,
                mouse.x-player.x
            );

        player.x +=
            Math.cos(angle)*150;

        player.y +=
            Math.sin(angle)*150;

        player.x =
            Math.max(
                30,
                Math.min(
                    canvas.width-30,
                    player.x
                )
            );

        player.y =
            Math.max(
                95,
                Math.min(
                    canvas.height-30,
                    player.y
                )
            );

        for(const m of [...monsters]){

            if(
                Math.hypot(
                    m.x-player.x,
                    m.y-player.y
                )<75
            ){

                damageMonster(
                    m,
                    player.attack*

        addCircle(
            player.x,
            player.y,
            75,
            "#b58cff"
        );

        showMessage("💨 그림자 돌진!");
    }
}

            if(
                Math.hypot(
                    m.x-x,
                    m.y-y
                )<230
            ){

                damageMonster(
                    m,
                    player.attack*
                    5*mult
                );

                m.stun=100;
            }
        }

        addCircle(
            x,y,230,"#ffcc44"
        );

        showMessage("☄️ 메테오!");

    }else{

        const target =
            nearestMonster();

        if(target){

            target.marked=true;

            damageMonster(
                target,
                player.attack*
                6*mult
            );

            setTimeout(()=>{

                if(target.hp>0){

                    damageMonster(
                        target,
                        player.attack*
                        4*mult
                    );
                }

            },1500);
        }

        showMessage("☠️ 죽음의 표식!");
    }
}


/* =========================================================
   몬스터 업데이트
========================================================= */

function updateMonsters(dt){

    for(const m of [...monsters]){

        if(m.stun>0){

            m.stun-=dt;
            continue;
        }

        if(m.slow<1){

            m.slow+=
                .003*dt;

            if(m.slow>1)
                m.slow=1;
        }

        const dx =
            player.x-m.x;

        const dy =
            player.y-m.y;

        const dist =
            Math.hypot(dx,dy);

        m.attackTimer-=dt;

        /*
           근접
        */

        if(m.type==="melee" ||
           m.type==="fast" ||
           m.type==="tank"){

            if(dist>m.range){

                m.x +=
                    dx/dist*
                    m.speed*
                    m.slow*
                    dt;

                m.y +=
                    dy/dist*
                    m.speed*
                    m.slow*
                    dt;

            }else{

                enemyHit(m);
            }
        }

        /*
           원거리
        */

        if(m.type==="ranged"){

            if(dist>m.range){

                m.x +=
                    dx/dist*
                    m.speed*
                    m.slow*
                    dt;

                m.y +=
                    dy/dist*
                    m.speed*
                    m.slow*
                    dt;

            }else if(m.attackTimer<=0){

                enemyProjectile(m);

                m.attackTimer=100;
            }
        }

        /*
           광역 몬스터
        */

        if(m.type==="aoe"){

            if(dist>m.range){

                m.x +=
                    dx/dist*
                    m.speed*
                    m.slow*
                    dt;

                m.y +=
                    dy/dist*
                    m.speed*
                    m.slow*
                    dt;

            }else if(m.attackTimer<=0){

                aoeAttack(m);

                m.attackTimer=150;
            }
        }

        /*
           보스
        */

        if(m.type==="boss"){

            if(dist>m.range){

                m.x +=
                    dx/dist*
                    m.speed*
                    dt;

                m.y +=
                    dy/dist*
                    m.speed*
                    dt;

            }else if(m.attackTimer<=0){

                bossAttack(m);

                m.attackTimer=90;
            }
        }

        if(m.flash>0)
            m.flash-=dt;
    }
}


/* =========================================================
   적 공격
========================================================= */

function enemyHit(m){

    if(m.attackTimer>0)
        return;

    damagePlayer(
        m.attack
    );

    m.attackTimer=65;
}


function enemyProjectile(m){

    const angle =
        Math.atan2(
            player.y-m.y,
            player.x-m.x
        );

    projectiles.push({

        enemy:true,

        type:"enemy",

        x:m.x,
        y:m.y,

        vx:Math.cos(angle)*4,
        vy:Math.sin(angle)*4,

        damage:m.attack,
        life:150,
        radius:7
    });
}


function aoeAttack(m){

    addCircle(
        m.x,
        m.y,
        m.range,
        "#e35c46"
    );

    if(
        Math.hypot(
            player.x-m.x,
            player.y-m.y
        )<m.range
    ){

        damagePlayer(
            m.attack*1.4
        );
    }
}


function bossAttack(m){

    addCircle(
        m.x,
        m.y,
        m.range,
        "#b54c7b"
    );

    if(
        Math.hypot(
            player.x-m.x,
            player.y-m.y
        )<m.range
    ){

        damagePlayer(
            m.attack
        );
    }

    /*
       보스 원거리 탄환
    */

    for(let i=0;i<6;i++){

        const angle =
            Math.PI*2*i/6;

        projectiles.push({

            enemy:true,

            type:"bossProjectile",

            x:m.x,
            y:m.y,

            vx:Math.cos(angle)*3.5,
            vy:Math.sin(angle)*3.5,

            damage:m.attack*.55,

            life:150,
            radius:9
        });
    }
}


/* =========================================================
   플레이어 피해
========================================================= */

function damagePlayer(amount){

    if(player.invincible>0)
        return;

    const damage =
        Math.max(
            1,
            amount-player.defense*.65
        );

    player.hp-=damage;

    player.invincible=12;

    effects.push({
        type:"hit",
        x:player.x,
        y:player.y,
        life:10,
        max:10
    });

    if(player.hp<=0){

        player.hp=0;

        updateHUD();

        dungeonFail();
    }
}


/* =========================================================
   몬스터 피해 / 골드
========================================================= */

function damageMonster(m,amount){

    if(!m || m.hp<=0)
        return;

    m.hp -= Math.max(
        1,
        Math.floor(amount)
    );

    m.flash=8;

    if(m.hp<=0){

        /*
           골드 정상 지급
        */

        const reward =
            Math.max(
                1,
                Math.floor(
                    m.gold *
                    (0.9+
                    Math.random()*.3)
                )
            );

        saveData.gold += reward;

        /*
           즉시 저장
        */

        saveGame();

        showMessage(
            `${m.icon} ${m.name} 처치 +${reward}G`
        );

        monsters =
            monsters.filter(
                x=>x!==m
            );

        updateLobby();

        /*
           모든 몬스터 처치
        */

        if(monsters.length===0){

            setTimeout(
                dungeonClear,
                400
            );
        }
    }
}


/* =========================================================
   투사체
========================================================= */

function updateProjectiles(dt){

    for(const p of [...projectiles]){

        p.x+=p.vx*dt;
        p.y+=p.vy*dt;

        p.life-=dt;

        let remove =
            p.life<=0 ||
            p.x<-50 ||
            p.x>canvas.width+50 ||
            p.y<-50 ||
            p.y>canvas.height+50;

        if(!p.enemy){

            for(const m of [...monsters]){

                if(
                    Math.hypot(
                        p.x-m.x,
                        p.y-m.y
                    )<
                    p.radius+m.radius
                ){

                    damageMonster(
                        m,
                        p.damage
                    );

                    if(
                        p.type!=="piercing"
                    ){
                        remove=true;
                        break;
                    }
                }
            }

        }else{

            if(
                Math.hypot(
                    p.x-player.x,
                    p.y-player.y
                )<
                p.radius+player.radius
            ){

                damagePlayer(
                    p.damage
                );

                remove=true;
            }
        }

        if(remove){

            projectiles =
                projectiles.filter(
                    x=>x!==p
                );
        }
    }
}


/* =========================================================
   이펙트
========================================================= */

function addCircle(x,y,r,color){

    effects.push({
        type:"circle",
        x,y,r,
        color,
        life:25,
        max:25
    });
}


function updateEffects(dt){

    for(const e of effects){

        e.life-=dt;
    }

    effects =
        effects.filter(
            e=>e.life>0
        );
}


/* =========================================================
   DRAW
========================================================= */

function draw(){

    /*
       매 프레임 전체 화면 지우기
       → 검은 화면 출력 문제 방지
    */

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawBackground();

    drawEffects();

    drawProjectiles();

    drawMonsters();

    drawPlayer();
}


/* ================= 배경 ================= */

function drawBackground(){

    ctx.fillStyle="#0d0b12";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    const size=50;

    for(
        let x=0;
        x<canvas.width;
        x+=size
    ){

        for(
            let y=80;
            y<canvas.height;
            y+=size
        ){

            ctx.fillStyle =
                ((x/size+y/size)%2===0)
                ?"#15111a"
                :"#19141f";

            ctx.fillRect(
                x,y,size,size
            );
        }
    }

    ctx.strokeStyle="#4a344b";
    ctx.lineWidth=7;

    ctx.strokeRect(
        20,
        88,
        canvas.width-40,
        canvas.height-118
    );
}


/* ================= 플레이어 ================= */

function drawPlayer(){

    ctx.save();

    if(player.invincible>0){

        ctx.globalAlpha =
            .5+
            Math.sin(
                performance.now()/50
            )*.25;
    }

    ctx.beginPath();

    ctx.fillStyle="#8162a5";

    ctx.arc(
        player.x,
        player.y,
        player.radius,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.strokeStyle="#e4c7ff";
    ctx.lineWidth=3;

    ctx.stroke();

    ctx.font="22px Arial";
    ctx.textAlign="center";
    ctx.textBaseline="middle";

    ctx.fillText(
        CLASSES[
            saveData.className
        ].icon,
        player.x,
        player.y
    );

    ctx.restore();

    /*
       조준선
    */

    if(
        saveData.className==="레인저" ||
        saveData.className==="마법사"
    ){

        ctx.strokeStyle=
            "rgba(255,255,255,.12)";

        ctx.beginPath();

        ctx.moveTo(
            player.x,
            player.y
        );

        ctx.lineTo(
            mouse.x,
            mouse.y
        );

        ctx.stroke();
    }
}


/* ================= 몬스터 ================= */

function drawMonsters(){

    for(const m of monsters){

        ctx.save();

        if(m.flash>0)
            ctx.globalAlpha=.5;

        ctx.beginPath();

        ctx.fillStyle =
            m.type==="boss"
            ?"#712743"
            :m.type==="ranged"
                ?"#394f8c"
                :m.type==="fast"
                    ?"#543c7d"
                    :m.type==="tank"
                        ?"#55534a"
                        :m.type==="aoe"
                            ?"#733e38"
                            :"#512d42";

        ctx.arc(
            m.x,
            m.y,
            m.radius,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.strokeStyle =
            m.marked
            ?"#ffe44c"
            :"#b55c7d";

        ctx.lineWidth =
            m.marked ? 4 : 2;

        ctx.stroke();

        ctx.font =
            m.type==="boss"
            ?"34px Arial"
            :"22px Arial";

        ctx.textAlign="center";
        ctx.textBaseline="middle";

        ctx.fillText(
            m.icon,
            m.x,
            m.y
        );

        /*
           HP 바
        */

        const width =
            m.type==="boss"
            ?110
            :55;

        ctx.fillStyle="#35151b";

        ctx.fillRect(
            m.x-width/2,
            m.y-m.radius-13,
            width,
            6
        );

        ctx.fillStyle="#e14c59";

        ctx.fillRect(
            m.x-width/2,
            m.y-m.radius-13,
            width*
            Math.max(
                0,
                m.hp/m.maxHp
            ),
            6
        );

        ctx.restore();
    }
}


/* ================= 투사체 ================= */

function drawProjectiles(){

    for(const p of projectiles){

        ctx.beginPath();

        ctx.fillStyle =
            p.enemy
            ?"#ff5667"
            :p.type==="magic"
                ?"#ff773c"
                :"#e5d9ad";

        ctx.arc(
            p.x,
            p.y,
            p.radius,
            0,
            Math.PI*2
        );

        ctx.fill();
    }
}


/* ================= 이펙트 ================= */

function drawEffects(){

    for(const e of effects){

        const alpha =
            Math.max(
                0,
                e.life/e.max
            );

        if(e.type==="circle"){

            ctx.globalAlpha=alpha;

            ctx.strokeStyle=e.color;
            ctx.lineWidth=5;

            ctx.beginPath();

            ctx.arc(
                e.x,
                e.y,
                e.r*(1+(1-alpha)*.15),
                0,
                Math.PI*2
            );

            ctx.stroke();

            ctx.globalAlpha=1;

        }else if(e.type==="slash"){

            ctx.globalAlpha=alpha;

            ctx.strokeStyle="#e5d08a";
            ctx.lineWidth=10;

            ctx.beginPath();

            ctx.arc(
                e.x,
                e.y,
                65,
                e.angle-.8,
                e.angle+.8
            );

            ctx.stroke();

            ctx.globalAlpha=1;

        }else if(e.type==="shield"){

            ctx.globalAlpha=alpha;

            ctx.strokeStyle="#76bfff";
            ctx.lineWidth=6;

            ctx.beginPath();

            ctx.arc(
                e.x,
                e.y,
                34,
                0,
                Math.PI*2
            );

            ctx.stroke();

            ctx.globalAlpha=1;

        }else if(e.type==="hit"){

            ctx.globalAlpha=alpha;

            ctx.fillStyle="#ff5555";

            ctx.font="20px Arial";

            ctx.textAlign="center";

            ctx.fillText(
                "!",
                e.x,
                e.y-30
            );

            ctx.globalAlpha=1;
        }
    }
}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

    if(!player)
        return;

    document.getElementById("dGold")
        .textContent=saveData.gold;

    document.getElementById("dKeys")
        .textContent=saveData.keys;

    document.getElementById("dFloor")
        .textContent=saveData.floor;

    document.getElementById("hpText")
        .textContent=
        `${Math.max(0,Math.ceil(player.hp))}
        / ${player.maxHp}`;

    document.getElementById("hpFill")
        .style.width=
        `${Math.max(
            0,
            player.hp/player.maxHp*100
        )}%`;
}


function updateSkillHUD(){

    const c =
        CLASSES[saveData.className];

    for(const type of ["q","e","r"]){

        document.getElementById(
            type+"Icon"
        ).textContent =
            c[type].icon;

        document.getElementById(
            type+"Name"
        ).textContent =
            `${c[type].name} Lv.${saveData.skills[type]}`;

        const cd =
            document.getElementById(
                type+"CD"
            );

        if(cooldown[type]>0){

            cd.style.display="flex";

            cd.textContent=
                Math.ceil(
                    cooldown[type]/60
                );

        }else{

            cd.style.display="none";
        }
    }
}


/* =========================================================
   층 클리어
========================================================= */

function dungeonClear(){

    if(!gameRunning)
        return;

    gameRunning=false;

    const cleared =
        saveData.floor;

    /*
       열쇠 지급
    */

    saveData.keys++;

    /*
       다음 층
    */

    if(saveData.floor<100)
        saveData.floor++;

    saveData.bestFloor =
        Math.max(
            saveData.bestFloor,
            saveData.floor
        );

    saveGame();

    updateLobby();

    setTimeout(()=>{

        if(cleared===100){

            alert(
                "👑 대마왕을 쓰러뜨렸습니다!\n\n"+
                "🎉 100층 던전 클리어!"
            );

        }else{

            alert(
                `🎉 ${cleared}층 클리어!\n\n`+
                `🗝️ 다음 층 열쇠 +1`
            );
        }

        leaveDungeon();

    },250);
}


/* =========================================================
   사망
========================================================= */

function dungeonFail(){

    if(!gameRunning)
        return;

    gameRunning=false;

    const floor =
        saveData.floor;

    const price =
        keyPrice();

    saveGame();

    setTimeout(()=>{

        const retry =
            confirm(
                `💀 ${floor}층에서 쓰러졌습니다.\n\n`+
                `다음 도전을 위해 열쇠가 필요합니다.\n`+
                `열쇠 가격: ${price}G\n\n`+
                `골드로 열쇠를 구매하시겠습니까?`
            );

        if(retry){

            if(saveData.gold>=price){

                saveData.gold-=price;
                saveData.keys++;

                saveGame();

                alert(
                    "🗝️ 열쇠를 구매했습니다!"
                );

            }else{

                alert(
                    "🪙 골드가 부족합니다."
                );
            }
        }

        leaveDungeon();

    },100);
}


/* =========================================================
   로비
========================================================= */

function leaveDungeon(){

    gameRunning=false;

    document.getElementById("dungeon")
        .style.display="none";

    document.getElementById("lobby")
        .style.display="block";

    updateLobby();
}


/* =========================================================
   유틸
========================================================= */

function nearestMonster(){

    let result=null;
    let dist=Infinity;

    for(const m of monsters){

        const d=
            Math.hypot(
                m.x-player.x,
                m.y-player.y
            );

        if(d<dist){

            dist=d;
            result=m;
        }
    }

    return result;
}


function normalizeAngle(a){

    while(a>Math.PI)
        a-=Math.PI*2;

    while(a<-Math.PI)
        a+=Math.PI*2;

    return a;
}


let messageTimer=null;

function showMessage(text){

    const el =
        document.getElementById("message");

    el.textContent=text;

    el.classList.add("show");

    clearTimeout(messageTimer);

    messageTimer =
        setTimeout(
            ()=>{
                el.classList.remove("show");
            },
            1200
        );
}


/* =========================================================
   초기화
========================================================= */

function resetGame(){

    if(
        !confirm(
            "정말 모든 데이터를 초기화할까요?"
        )
    )
        return;

    localStorage.removeItem(
        SAVE_KEY
    );

    location.reload();
}
