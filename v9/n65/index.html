
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>애니멀 몬스터 배틀</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:linear-gradient(135deg,#10152d,#29204b);
  color:white;font-family:Arial,"Malgun Gothic",sans-serif;
  min-height:100vh;padding:20px
}
.container{max-width:900px;margin:auto}
h1{text-align:center;font-size:34px;color:#ffe66d;text-shadow:0 3px 12px #000}
.subtitle{text-align:center;color:#c9c9e8}
.panel{
  background:#ffffff12;border:1px solid #ffffff30;
  border-radius:18px;padding:20px;margin:15px 0;
  box-shadow:0 8px 25px #0003
}
button{
  border:0;border-radius:12px;padding:13px 18px;
  font-size:16px;font-weight:bold;cursor:pointer;
  transition:.2s;color:#17152b
}
button:hover{transform:translateY(-2px);filter:brightness(1.1)}
button:disabled{opacity:.4;cursor:not-allowed;transform:none}
.primary{background:#ffe66d}
.attack{background:#70d6ff}
.special{background:linear-gradient(120deg,#ff5c8a,#ffbd59);color:white}
#startScreen{text-align:center;padding:35px 15px}
#startScreen button{font-size:20px;padding:16px 35px}
.hidden{display:none!important}
.roulette{
  display:flex;justify-content:center;align-items:center;
  gap:25px;flex-wrap:wrap;text-align:center
}
.monster-card{
  background:#ffffff15;border:2px solid #ffffff30;
  border-radius:18px;padding:18px;width:230px;min-height:220px;
  position:relative
}
.monster-emoji{font-size:75px;margin:8px}
.monster-name{font-size:22px;font-weight:bold}
.type{display:inline-block;background:#ffffff25;padding:5px 12px;border-radius:20px;margin-top:7px}
.vs{font-size:30px;font-weight:bold;color:#ffe66d}
#rouletteText{text-align:center;color:#ffe66d;font-size:20px;margin:18px}
.battle-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hp-box{flex:1;min-width:220px}
.hp-title{display:flex;justify-content:space-between;font-weight:bold;margin-bottom:7px}
.hp-bg{height:16px;background:#333;border-radius:20px;overflow:hidden}
.hp-fill{height:100%;width:100%;background:linear-gradient(90deg,#42e695,#b8f56b);transition:width .4s}
.enemy-fill{background:linear-gradient(90deg,#ff647c,#ffb15c)}
.battle-arena{
  display:flex;justify-content:space-around;align-items:center;
  gap:10px;text-align:center;flex-wrap:wrap;padding:20px 0
}
.fighter{position:relative;min-width:130px}
.fighter .monster-emoji{font-size:85px}
.fighter-name{font-size:19px;font-weight:bold}
.fighter.player .monster-emoji{animation:bob 1.5s infinite}
.fighter.enemy .monster-emoji{animation:bob 1.8s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.damage{
  position:absolute;top:0;left:50%;transform:translateX(-50%);
  font-size:30px;font-weight:900;color:#ffea65;
  text-shadow:0 2px 5px #000;pointer-events:none;
  animation:damageUp .9s forwards;z-index:5
}
@keyframes damageUp{
  0%{opacity:0;transform:translate(-50%,10px) scale(.7)}
  20%{opacity:1;transform:translate(-50%,-15px) scale(1.3)}
  100%{opacity:0;transform:translate(-50%,-65px) scale(1)}
}
.special-effect{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:#ffcc3355;z-index:20;pointer-events:none;
  animation:flash .8s forwards
}
.special-effect span{
  font-size:clamp(35px,8vw,75px);font-weight:900;color:#fff;
  text-shadow:0 0 15px #ff4b8b,0 0 35px #ffcf45;
  animation:burst .8s forwards
}
@keyframes flash{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
@keyframes burst{0%{transform:scale(.2) rotate(-10deg)}50%{transform:scale(1.25) rotate(5deg)}100%{transform:scale(1)}}
.controls{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.controls button{min-height:55px}
.special-row{margin-top:12px}
.special-row button{width:100%;min-height:58px;font-size:18px}
#message{text-align:center;min-height:30px;color:#ffe66d;font-weight:bold;font-size:18px;margin:12px 0}
#battleLog{
  height:160px;overflow-y:auto;background:#080b1d99;
  border-radius:12px;padding:12px;line-height:1.7
}
.log-line{border-bottom:1px solid #ffffff12;padding:3px 0}
.result{text-align:center;font-size:25px;font-weight:bold;color:#ffe66d;padding:15px}
.footer{text-align:center;color:#aaa;font-size:12px;margin-top:20px}
@media(max-width:500px){
  h1{font-size:27px}.monster-card{width:42%;min-width:140px;padding:10px}
  .monster-emoji{font-size:58px}.fighter .monster-emoji{font-size:65px}
  .controls button{font-size:14px;padding:10px 5px}
}
</style>
</head>
<body>
<div class="container">
  <h1>🐾 애니멀 몬스터 배틀 ⚔️</h1>
  <div class="subtitle">나만의 몬스터로 상대 몬스터와 대결하자!</div>

  <section id="startScreen" class="panel">
    <h2>몬스터 배틀에 오신 것을 환영합니다!</h2>
    <p>랜덤으로 선택된 몬스터끼리 1대1 대결을 펼칩니다.</p>
    <p>일반 공격력 2.5 · 필살기 성공 시 5 데미지</p>
    <button class="primary" onclick="startBattle()">🎮 게임 시작</button>
  </section>

  <section id="rouletteScreen" class="panel hidden">
    <h2 style="text-align:center">🎲 몬스터 선택 중!</h2>
    <div class="roulette">
      <div class="monster-card">
        <div id="rollPlayerEmoji" class="monster-emoji">❔</div>
        <div id="rollPlayerName" class="monster-name">선택 중</div>
        <div id="rollPlayerType" class="type">?</div>
        <p>플레이어</p>
      </div>
      <div class="vs">VS</div>
      <div class="monster-card">
        <div id="rollEnemyEmoji" class="monster-emoji">❔</div>
        <div id="rollEnemyName" class="monster-name">선택 중</div>
        <div id="rollEnemyType" class="type">?</div>
        <p>상대 AI</p>
      </div>
    </div>
    <div id="rouletteText">운명의 몬스터를 뽑는 중...</div>
  </section>

  <section id="battleScreen" class="hidden">
    <div class="panel">
      <div class="battle-top">
        <div class="hp-box">
          <div class="hp-title"><span id="playerHpName">플레이어</span><span id="playerHpText">10 / 10</span></div>
          <div class="hp-bg"><div id="playerHpBar" class="hp-fill"></div></div>
        </div>
        <div class="hp-box">
          <div class="hp-title"><span id="enemyHpName">상대</span><span id="enemyHpText">10 / 10</span></div>
          <div class="hp-bg"><div id="enemyHpBar" class="hp-fill enemy-fill"></div></div>
        </div>
      </div>

      <div class="battle-arena">
        <div class="fighter player" id="playerFighter">
          <div id="playerEmoji" class="monster-emoji">🦊</div>
          <div id="playerName" class="fighter-name">플레이어</div>
          <div id="playerType" class="type">불</div>
        </div>
        <div class="vs">⚔️ VS</div>
        <div class="fighter enemy" id="enemyFighter">
          <div id="enemyEmoji" class="monster-emoji">🐢</div>
          <div id="enemyName" class="fighter-name">상대</div>
          <div id="enemyType" class="type">물</div>
        </div>
      </div>

      <div id="message">공격을 선택하세요!</div>
    </div>

    <div class="panel">
      <h3>⚔️ 일반 기술</h3>
      <div class="controls">
        <button class="attack" id="move0" onclick="playerAttack(0)">기술 1</button>
        <button class="attack" id="move1" onclick="playerAttack(1)">기술 2</button>
        <button class="attack" id="move2" onclick="playerAttack(2)">기술 3</button>
        <button class="attack" id="move3" onclick="playerAttack(3)">기술 4</button>
      </div>
      <div class="special-row">
        <button class="special" id="specialButton" onclick="playerSpecial()">🔥 필살기 (성공 확률 50% · 5 데미지)</button>
      </div>
    </div>

    <div class="panel">
      <h3>📜 배틀 기록</h3>
      <div id="battleLog"></div>
    </div>
    <div id="resultPanel" class="panel hidden">
      <div id="resultText" class="result"></div>
      <div style="text-align:center">
        <button class="primary" onclick="startBattle()">🔄 새로운 배틀</button>
      </div>
    </div>
  </section>

  <div class="footer">ANIMAL MONSTER BATTLE</div>
</div>

<script>
const monsters = [
  {name:"플레임 폭스",emoji:"🦊",type:"불",moves:["화염 발톱","불꽃 돌진","파이어 볼","타오르는 꼬리"]},
  {name:"아쿠아 터틀",emoji:"🐢",type:"물",moves:["물대포","파도 강타","물방울 폭탄","회오리 물살"]},
  {name:"리프 디어",emoji:"🦌",type:"풀",moves:["잎사귀 베기","덩굴 채찍","꽃가루 공격","숲의 돌진"]},
  {name:"볼트 래빗",emoji:"🐰",type:"전기",moves:["번개 펀치","전기 충격","스파크","천둥 발차기"]},
  {name:"프로스트 펭귄",emoji:"🐧",type:"얼음",moves:["얼음 조각","눈보라","빙결 펀치","프로스트 샷"]},
  {name:"쉐도우 캣",emoji:"🐈‍⬛",type:"고스트",moves:["그림자 발톱","유령 구슬","어둠의 손","나이트 점프"]},
  {name:"드래곤 베어",emoji:"🐻",type:"드래곤",moves:["드래곤 브레스","용의 발톱","용암 충격","드래곤 돌진"]},
  {name:"다크 울프",emoji:"🐺",type:"악",moves:["어둠의 물기","다크 슬래시","밤의 공격","악몽의 발톱"]},
  {name:"메탈 라이온",emoji:"🦁",type:"강철",moves:["메탈 클로","강철 박치기","아이언 펀치","철갑 돌진"]},
  {name:"페어리 램",emoji:"🐑",type:"페어리",moves:["요정 빛","반짝 가루","별빛 공격","마법의 뿔"]}
];

// 공격하는 타입이 방어하는 타입에 유리한 상성표
// 유리: 3.5 데미지 / 불리: 기본 공격력의 0.5배
const strongAgainst = {
  "불":["풀","얼음","강철"],
  "물":["불"],
  "풀":["물"],
  "전기":["물"],
  "얼음":["풀","드래곤"],
  "고스트":["고스트"],
  "드래곤":["드래곤"],
  "악":["고스트"],
  "강철":["얼음","페어리"],
  "페어리":["드래곤","악"]
};

const BASE_DAMAGE = 2.5;
const ADVANTAGE_DAMAGE = 3.5;
const SPECIAL_DAMAGE = 5;
const MAX_HP = 10;

let player = null;
let enemy = null;
let playerHP = MAX_HP;
let enemyHP = MAX_HP;
let busy = false;
let battleOver = false;
let rouletteTimer = null;

function randomIndex(except=-1){
  let n;
  do{n=Math.floor(Math.random()*monsters.length)}while(n===except);
  return n;
}

function randomPair(){
  const p=randomIndex();
  const e=randomIndex(p);
  return [monsters[p],monsters[e]];
}

function startBattle(){
  clearInterval(rouletteTimer);
  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("battleScreen").classList.add("hidden");
  document.getElementById("resultPanel").classList.add("hidden");
  document.getElementById("rouletteScreen").classList.remove("hidden");

  busy=true;
  battleOver=false;
  const pair=randomPair();
  player=pair[0];
  enemy=pair[1];

  let count=0;
  rouletteTimer=setInterval(()=>{
    const a=monsters[Math.floor(Math.random()*monsters.length)];
    let b=monsters[Math.floor(Math.random()*monsters.length)];
    while(b===a)b=monsters[Math.floor(Math.random()*monsters.length)];

    showRouletteMonster("rollPlayer",a);
    showRouletteMonster("rollEnemy",b);
    count++;

    if(count>=16){
      clearInterval(rouletteTimer);
      showRouletteMonster("rollPlayer",player);
      showRouletteMonster("rollEnemy",enemy);
      document.getElementById("rouletteText").textContent="✨ 몬스터 선택 완료!";
      setTimeout(showBattle,800);
    }
  },110);
}

function showRouletteMonster(prefix,m){
  document.getElementById(prefix+"Emoji").textContent=m.emoji;
  document.getElementById(prefix+"Name").textContent=m.name;
  document.getElementById(prefix+"Type").textContent=m.type;
}

function showBattle(){
  document.getElementById("rouletteScreen").classList.add("hidden");
  document.getElementById("battleScreen").classList.remove("hidden");

  playerHP=MAX_HP;
  enemyHP=MAX_HP;
  busy=false;
  battleOver=false;

  document.getElementById("playerEmoji").textContent=player.emoji;
  document.getElementById("playerName").textContent=player.name;
  document.getElementById("playerType").textContent=player.type;

  document.getElementById("enemyEmoji").textContent=enemy.emoji;
  document.getElementById("enemyName").textContent=enemy.name;
  document.getElementById("enemyType").textContent=enemy.type;

  document.getElementById("playerHpName").textContent=player.name;
  document.getElementById("enemyHpName").textContent=enemy.name;

  player.moves.forEach((move,i)=>{
    document.getElementById("move"+i).textContent=move;
  });

  document.getElementById("battleLog").innerHTML="";
  document.getElementById("resultPanel").classList.add("hidden");
  document.getElementById("message").textContent="전투 시작! 공격을 선택하세요.";
  addLog("⚔️ "+player.name+" VS "+enemy.name+" 배틀 시작!");
  updateHP();
  updateButtons();
}

function getDamage(attackerType,defenderType){
  if(strongAgainst[attackerType]?.includes(defenderType)){
    return {damage:ADVANTAGE_DAMAGE,label:"상성 유리! ⭐"};
  }
  if(strongAgainst[defenderType]?.includes(attackerType)){
    return {damage:BASE_DAMAGE*0.5,label:"상성 불리! 💧"};
  }
  return {damage:BASE_DAMAGE,label:"일반 상성"};
}

function playerAttack(moveIndex){
  if(busy||battleOver)return;
  busy=true;
  updateButtons();

  const move=player.moves[moveIndex];
  const result=getDamage(player.type,enemy.type);
  applyDamage("player",result.damage,move,result.label);

  if(!checkEnd()){
    setTimeout(enemyTurn,850);
  }
}

function playerSpecial(){
  if(busy||battleOver)return;
  busy=true;
  updateButtons();

  addLog("🔥 "+player.name+" 필살기 발동!");
  document.getElementById("message").textContent="🔥 필살기 성공 여부를 확인하는 중...";

  setTimeout(()=>{
    const success=Math.random()<0.5;
    if(success){
      showSpecialAnimation();
      addLog("✨ 필살기 성공! "+SPECIAL_DAMAGE+" 데미지!");
      document.getElementById("message").textContent="🎉 필살기 성공! 5 데미지!";
      applyDamage("player",SPECIAL_DAMAGE,"필살기","필살기 성공!");
    }else{
      addLog("💨 필살기 실패! 데미지 0");
      document.getElementById("message").textContent="💨 필살기 실패! 데미지 0";
    }

    if(!checkEnd()){
      setTimeout(enemyTurn,850);
    }
  },450);
}

function applyDamage(attacker,damage,move,label){
  if(battleOver)return;

  if(attacker==="player"){
    enemyHP=Math.max(0,enemyHP-damage);
    showDamage("enemyFighter",damage);
    addLog("🟦 "+player.name+"의 "+move+"! "+label+" "+damage+" 데미지!");
    document.getElementById("message").textContent=label+" "+damage+" 데미지!";
  }else{
    playerHP=Math.max(0,playerHP-damage);
    showDamage("playerFighter",damage);
    addLog("🟥 "+enemy.name+"의 "+move+"! "+label+" "+damage+" 데미지!");
    document.getElementById("message").textContent=label+" "+damage+" 데미지를 받았습니다!";
  }
  updateHP();
}

function enemyTurn(){
  if(battleOver)return;

  if(Math.random()<0.25){
    addLog("🔥 "+enemy.name+" 필살기 발동!");
    document.getElementById("message").textContent=enemy.name+"의 필살기!";
    setTimeout(()=>{
      if(battleOver)return;
      if(Math.random()<0.5){
        showSpecialAnimation();
        addLog("✨ 상대 필살기 성공! 5 데미지!");
        applyDamage("enemy",SPECIAL_DAMAGE,"필살기","필살기 성공!");
      }else{
        addLog("💨 상대 필살기 실패! 데미지 0");
        document.getElementById("message").textContent="상대 필살기 실패! 데미지 0";
      }
      if(!checkEnd()){
        busy=false;
        updateButtons();
        document.getElementById("message").textContent+=" 내 차례입니다!";
      }
    },450);
  }else{
    const moveIndex=Math.floor(Math.random()*enemy.moves.length);
    const move=enemy.moves[moveIndex];
    const result=getDamage(enemy.type,player.type);
    applyDamage("enemy",result.damage,move,result.label);

    if(!checkEnd()){
      busy=false;
      updateButtons();
      document.getElementById("message").textContent="내 차례입니다! 공격을 선택하세요.";
    }
  }
}

function showDamage(targetId,damage){
  const target=document.getElementById(targetId);
  const number=document.createElement("div");
  number.className="damage";
  number.textContent="-"+Number(damage.toFixed(2));
  target.appendChild(number);
  setTimeout(()=>number.remove(),950);
}

function showSpecialAnimation(){
  const effect=document.createElement("div");
  effect.className="special-effect";
  effect.innerHTML="<span>⚡ 필살기 발동! ⚡</span>";
  document.body.appendChild(effect);
  setTimeout(()=>effect.remove(),850);
}

function updateHP(){
  document.getElementById("playerHpText").textContent=playerHP.toFixed(2)+" / 10";
  document.getElementById("enemyHpText").textContent=enemyHP.toFixed(2)+" / 10";
  document.getElementById("playerHpBar").style.width=(playerHP/MAX_HP*100)+"%";
  document.getElementById("enemyHpBar").style.width=(enemyHP/MAX_HP*100)+"%";
}

function updateButtons(){
  for(let i=0;i<4;i++){
    document.getElementById("move"+i).disabled=busy||battleOver;
  }
  document.getElementById("specialButton").disabled=busy||battleOver;
}

function addLog(text){
  const log=document.getElementById("battleLog");
  const line=document.createElement("div");
  line.className="log-line";
  line.textContent=text;
  log.appendChild(line);
  log.scrollTop=log.scrollHeight;
}

function checkEnd(){
  if(playerHP<=0.1){
    playerHP=0;
    updateHP();
    finishBattle(false);
    return true;
  }
  if(enemyHP<=0.1){
    enemyHP=0;
    updateHP();
    finishBattle(true);
    return true;
  }
  return false;
}

function finishBattle(playerWon){
  battleOver=true;
  busy=true;
  updateButtons();

  const result=playerWon?"🏆 승리! "+player.name+"의 승리입니다!":"💔 패배! "+enemy.name+"에게 패배했습니다.";
  document.getElementById("resultText").textContent=result;
  document.getElementById("resultPanel").classList.remove("hidden");
  document.getElementById("message").textContent=playerWon?"상대 몬스터가 기절했습니다!":"내 몬스터가 기절했습니다!";
  addLog(playerWon?"🏆 플레이어 승리!":"💔 상대 AI 승리!");
}
</script>
</body>
</html>
