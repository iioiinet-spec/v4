<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나만의 D-Day 스케줄</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;1,400&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #0d0d0d;
      --card-bg: rgba(26, 26, 26, 0.7);
      --text-main: #f5f5f5;
      --text-sub: #888888;
      --border: rgba(255, 255, 255, 0.15);
      --point: #ffffff;
      --dday-size: 90px;
      --font-size: 14px;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      color: var(--text-main);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px 100px;
    }

    /* 우측 상단 편집 버튼 */
    .edit-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      background: rgba(26, 26, 26, 0.9);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }
    .edit-btn:hover { background: rgba(255, 255, 255, 0.2); }

    /* 편집 패널 */
    .edit-panel {
      position: fixed;
      top: 70px;
      right: 20px;
      z-index: 100;
      width: 280px;
      background: rgba(20, 20, 20, 0.95);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      backdrop-filter: blur(20px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: none;
    }
    .edit-panel.active { display: block; }
    .edit-panel h3 { margin: 0 0 15px; font-size: 15px; font-family: 'Playfair Display', serif; font-style: italic; }
    .edit-group { margin-bottom: 12px; }
    .edit-group label { display: block; font-size: 11px; color: var(--text-sub); margin-bottom: 4px; }
    .edit-group input, .edit-group select {
      width: 100%;
      padding: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 13px;
    }

    .container { width: 100%; max-width: 900px; z-index: 10; }

    /* D-Day 박스 */
    .dday-box {
      padding: 40px 20px;
      margin-bottom: 30px;
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    #dday {
      font-family: 'Caveat', cursive;
      font-size: var(--dday-size);
      font-weight: 700;
      color: var(--point);
      line-height: 1.1;
    }
    .date-label {
      margin-top: 10px;
      font-size: 14px;
      color: var(--text-sub);
    }

    /* 시간표 박스 */
    .schedule-box {
      padding: 30px 25px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      overflow-x: auto;
    }
    .schedule-box h2 {
      margin: 0 0 20px;
      text-align: center;
      font-family: 'Playfair Display', serif;
      font-weight: 400;
      font-style: italic;
      font-size: 24px;
    }

    table { width: 100%; min-width: 600px; border-collapse: separate; border-spacing: 8px; }
    th, td {
      padding: 14px 12px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      background: rgba(20, 20, 20, 0.6);
      color: var(--text-main);
      font-size: var(--font-size);
      cursor: pointer;
    }
    td:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.3); }
    th { background: rgba(255,255,255,0.05); color: var(--text-sub); cursor: default; }
    .time { background: rgba(255,255,255,0.08); font-weight: 600; color: var(--point); cursor: default; }

    .subject-input {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--point);
      text-align: center;
      font-size: var(--font-size);
      font-family: inherit;
      outline: none;
    }
  </style>
</head>
<body>

  <button class="edit-btn" id="editToggleBtn">⚙️ 편집</button>

  <div class="edit-panel" id="editPanel">
    <h3>환경 설정</h3>
    <div class="edit-group">
      <label>디데이 이름</label>
      <input type="text" id="inputLabel" value="디데이 목표">
    </div>
    <div class="edit-group">
      <label>목표 날짜</label>
      <input type="date" id="inputDate" value="2026-12-31">
    </div>
    <div class="edit-group">
      <label>배경 모드</label>
      <select id="inputTheme">
        <option value="dark">딥 블랙 (다크)</option>
        <option value="charcoal">차콜 그레이</option>
        <option value="light">클래식 라이트</option>
      </select>
    </div>
    <div class="edit-group">
      <label>D-Day 글씨 크기 (<span id="ddaySizeVal">90</span>px)</label>
      <input type="range" id="inputDdaySize" min="50" max="140" value="90">
    </div>
    <div class="edit-group">
      <label>표 글씨 크기 (<span id="fontSizeVal">14</span>px)</label>
      <input type="range" id="inputFontSize" min="11" max="20" value="14">
    </div>
  </div>

  <div class="container">
    <section class="dday-box">
      <div id="dday"></div>
      <div class="date-label" id="targetDate"></div>
    </section>

    <section class="schedule-box">
      <h2>Weekly Schedule</h2>
      <table>
        <thead>
          <tr>
            <th>시간</th>
            <th>월</th>
            <th>화</th>
            <th>수</th>
            <th>목</th>
            <th>금</th>
          </tr>
        </thead>
        <tbody id="scheduleBody"></tbody>
      </table>
    </section>
  </div>

  <script>
    // 기존에 꼬인 저장 데이터 초기화 및 기본값 설정
    let settings = JSON.parse(localStorage.getItem('my_schedule_settings')) || {
      label: '방학',
      date: '2026-07-20',
      theme: 'dark',
      ddaySize: 90,
      fontSize: 14
    };

    let periodsData = JSON.parse(localStorage.getItem('my_schedule_periods')) || [
      { time: '09:00', subjects: ['유튜브', 'unity', '산책', 'unity', '유튜브'] },
      { time: '10:00', subjects: ['유튜브', 'unity', 'unity', '만들기', '유튜브'] },
      { time: '11:00', subjects: ['로블록스', '유튜브', 'unity', 'unity', '유튜브'] },
      { time: '13:00', subjects: ['unity', '만들기', '산책', '만들기', '유튜브'] },
      { time: '14:00', subjects: ['만들기', '유튜브', '로블록스', 'unity', '유튜브'] }
    ];

    const ddayElement = document.getElementById('dday');
    const targetDateElement = document.getElementById('targetDate');
    const scheduleBody = document.getElementById('scheduleBody');
    const editToggleBtn = document.getElementById('editToggleBtn');
    const editPanel = document.getElementById('editPanel');

    const inputLabel = document.getElementById('inputLabel');
    const inputDate = document.getElementById('inputDate');
    const inputTheme = document.getElementById('inputTheme');
    const inputDdaySize = document.getElementById('inputDdaySize');
    const inputFontSize = document.getElementById('inputFontSize');
    const ddaySizeVal = document.getElementById('ddaySizeVal');
    const fontSizeVal = document.getElementById('fontSizeVal');

    function applySettings() {
      inputLabel.value = settings.label;
      inputDate.value = settings.date;
      inputTheme.value = settings.theme;
      inputDdaySize.value = settings.ddaySize;
      inputFontSize.value = settings.fontSize;
      
      ddaySizeVal.textContent = settings.ddaySize;
      fontSizeVal.textContent = settings.fontSize;

      document.documentElement.style.setProperty('--dday-size', settings.ddaySize + 'px');
      document.documentElement.style.setProperty('--font-size', settings.fontSize + 'px');

      if (settings.theme === 'charcoal') {
        document.documentElement.style.setProperty('--bg', '#1a1a1a');
      } else if (settings.theme === 'light') {
        document.documentElement.style.setProperty('--bg', '#f2f2f2');
        document.documentElement.style.setProperty('--text-main', '#111111');
        document.documentElement.style.setProperty('--text-sub', '#666666');
        document.documentElement.style.setProperty('--card-bg', 'rgba(255, 255, 255, 0.8)');
        document.documentElement.style.setProperty('--border', 'rgba(0, 0, 0, 0.15)');
        document.documentElement.style.setProperty('--point', '#111111');
      } else {
        document.documentElement.style.setProperty('--bg', '#0d0d0d');
        document.documentElement.style.setProperty('--text-main', '#f5f5f5');
        document.documentElement.style.setProperty('--text-sub', '#888888');
        document.documentElement.style.setProperty('--card-bg', 'rgba(26, 26, 26, 0.7)');
        document.documentElement.style.setProperty('--border', 'rgba(255, 255, 255, 0.15)');
        document.documentElement.style.setProperty('--point', '#ffffff');
      }

      targetDateElement.textContent = `${settings.label} · ${settings.date}`;
      updateDday();
    }

    function saveSettings() {
      settings.label = inputLabel.value;
      settings.date = inputDate.value;
      settings.theme = inputTheme.value;
      settings.ddaySize = inputDdaySize.value;
      settings.fontSize = inputFontSize.value;

      localStorage.setItem('my_schedule_settings', JSON.stringify(settings));
      applySettings();
    }

    editToggleBtn.addEventListener('click', () => {
      editPanel.classList.toggle('active');
    });

    [inputLabel, inputDate, inputTheme, inputDdaySize, inputFontSize].forEach(el => {
      el.addEventListener('input', saveSettings);
      el.addEventListener('change', saveSettings);
    });

    function updateDday() {
      const now = new Date();
      const target = new Date(`${settings.date}T00:00:00`);
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const diff = Math.ceil((target - today) / (1000 * 60 * 60 * 24));

      if (diff > 0) ddayElement.textContent = `D-${diff}`;
      else if (diff === 0) ddayElement.textContent = 'D-Day';
      else ddayElement.textContent = `D+${Math.abs(diff)}`;
    }

    function makeSchedule() {
      scheduleBody.innerHTML = '';
      periodsData.forEach((period, pIdx) => {
        const row = document.createElement('tr');
        const timeCell = document.createElement('td');
        timeCell.className = 'time';
        timeCell.textContent = period.time;
        row.appendChild(timeCell);

        period.subjects.forEach((subject, sIdx) => {
          const cell = document.createElement('td');
          cell.textContent = subject;

          cell.addEventListener('click', () => {
            if (cell.querySelector('input')) return;
            const curText = cell.textContent;
            cell.textContent = '';
            
            const input = document.createElement('input');
            input.type = 'text';
            input.value = curText;
            input.className = 'subject-input';
            
            const saveVal = () => {
              periodsData[pIdx].subjects[sIdx] = input.value.trim() || curText;
              localStorage.setItem('my_schedule_periods', JSON.stringify(periodsData));
              makeSchedule();
            };

            input.addEventListener('blur', saveVal);
            input.addEventListener('keydown', (e) => { if (e.key === 'Enter') saveVal(); });

            cell.appendChild(input);
            input.focus();
            input.select();
          });

          row.appendChild(cell);
        });
        scheduleBody.appendChild(row);
      });
    }

    applySettings();
    makeSchedule();
  </script>
</body>
</html>
