:root{
  --ink:#000000;
  --panel:#1a1a1a;
  --steel:#434343;
  --steel-hi:#5c5c5c;
  --amber:#fd9f28;
  --amber-dk:#955d12;
  --paper:#f2f2f2;
  --danger:#ff5a3c;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{height:100%;margin:0;background:#000;overflow:hidden;}
body{
  font-family:'Galmuri11',monospace;
  color:var(--paper);
  -webkit-font-smoothing:none;
  font-smooth:never;
  user-select:none;-webkit-user-select:none;
  touch-action:none;
}
#frame{position:relative;width:100%;height:100%;}
#stage{
  position:absolute;left:50%;top:50%;
  width:1280px;height:720px;
  transform-origin:center center;
  background:#000;overflow:hidden;
  cursor:crosshair;
}
canvas#view{position:absolute;inset:0;width:1280px;height:720px;image-rendering:pixelated;}
.hidden{display:none !important;}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;font-size:22px;line-height:1.3;}
.panel{
  position:absolute;background:rgba(0,0,0,.72);
  border-left:4px solid var(--amber);
  padding:10px 18px 12px 16px;
}
.panel .lab{color:var(--steel-hi);font-size:22px;}
.panel .big{font-size:44px;line-height:1;color:var(--paper);}
.panel .big small{font-size:22px;color:var(--steel-hi);margin-left:6px;}
#p-hp{left:28px;bottom:28px;width:300px;}
#segs{display:flex;gap:4px;margin:8px 0 8px;}
#segs i{flex:1;height:14px;background:var(--steel);clip-path:polygon(18% 0,82% 0,100% 50%,82% 100%,18% 100%,0 50%);}
#segs i.on{background:var(--amber);}
#segs.low i.on{background:var(--danger);}
#p-ammo{right:28px;bottom:28px;text-align:right;border-left:0;border-right:4px solid var(--amber);padding:10px 16px 12px 18px;min-width:210px;}
#p-wave{left:50%;top:22px;transform:translateX(-50%);text-align:center;border-left:0;border-bottom:4px solid var(--amber);padding:8px 28px 10px;min-width:260px;}
#p-wave .big{font-size:33px;}
#p-score{left:28px;top:22px;}
#mini{position:absolute;right:28px;top:22px;width:132px;height:132px;background:rgba(0,0,0,.72);border-right:4px solid var(--amber);image-rendering:pixelated;}
#cross{position:absolute;left:640px;top:360px;width:0;height:0;}
#cross i{position:absolute;background:var(--paper);box-shadow:0 0 0 2px rgba(0,0,0,.65);}
#cross i:nth-child(1){left:-2px;top:-20px;width:4px;height:12px;}
#cross i:nth-child(2){left:-2px;top:8px;width:4px;height:12px;}
#cross i:nth-child(3){left:-20px;top:-2px;width:12px;height:4px;}
#cross i:nth-child(4){left:8px;top:-2px;width:12px;height:4px;}
#hitm{position:absolute;left:640px;top:360px;width:0;height:0;opacity:0;}
#hitm i{position:absolute;width:6px;height:18px;background:var(--amber);left:-3px;top:-9px;}
#hitm i:nth-child(1){transform:rotate(45deg) translateY(-22px);}
#hitm i:nth-child(2){transform:rotate(-45deg) translateY(-22px);}
#hitm i:nth-child(3){transform:rotate(135deg) translateY(-22px);}
#hitm i:nth-child(4){transform:rotate(-135deg) translateY(-22px);}
#hitm.head i{background:#fff;}
#msg{position:absolute;left:0;right:0;top:170px;text-align:center;opacity:0;}
#msg .t{font-size:66px;line-height:1.1;color:var(--amber);text-shadow:4px 4px 0 #000;}
#msg .s{font-size:22px;color:var(--paper);text-shadow:2px 2px 0 #000;margin-top:8px;}
#reload{position:absolute;left:0;right:0;top:420px;text-align:center;font-size:22px;color:var(--amber);text-shadow:2px 2px 0 #000;}
#dmg{position:absolute;inset:0;opacity:0;background:radial-gradient(ellipse at center,rgba(255,90,60,0) 45%,rgba(255,60,30,.85) 100%);}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;z-index:5;}
#s-title{background:#000 center/cover no-repeat;padding:0 0 0 96px;}
#s-title::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.88) 0,rgba(0,0,0,.55) 48%,rgba(0,0,0,0) 78%);}
#s-title>*{position:relative;}
#hero{position:absolute !important;right:40px;bottom:-20px;width:640px;height:640px;image-rendering:auto;}
h1{margin:0;font-size:88px;line-height:1.05;font-weight:400;color:var(--paper);text-shadow:6px 6px 0 var(--amber-dk);}
.tag{font-size:22px;color:var(--amber);margin:14px 0 40px;letter-spacing:.35em;}
.btn{
  pointer-events:auto;cursor:pointer;
  font-family:inherit;font-size:33px;line-height:1;
  background:var(--amber);color:#000;border:0;padding:18px 40px 20px;
  box-shadow:6px 6px 0 var(--amber-dk);
  align-self:flex-start;
}
.btn:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--amber-dk);}
.btn:active:not(:disabled){transform:translate(4px,4px);box-shadow:2px 2px 0 var(--amber-dk);}
.btn:disabled{background:var(--steel);color:var(--steel-hi);box-shadow:none;cursor:default;}
.btn:focus-visible{outline:4px solid #fff;outline-offset:4px;}
.keys{margin:44px 0 0;display:grid;grid-template-columns:auto auto;gap:6px 28px;font-size:22px;width:max-content;}
.keys dt{color:var(--amber);}
.keys dd{margin:0;color:var(--paper);}
.note{margin-top:22px;font-size:22px;color:var(--steel-hi);max-width:560px;}
.veil{background:rgba(0,0,0,.78);align-items:center;text-align:center;}
.veil h2{margin:0 0 14px;font-size:66px;font-weight:400;color:var(--amber);text-shadow:4px 4px 0 #000;}
.veil p{margin:0 0 34px;font-size:22px;color:var(--paper);}
.veil .btn{align-self:center;}
.row{display:flex;gap:28px;justify-content:center;}
.btn.alt{background:var(--steel);color:var(--paper);box-shadow:6px 6px 0 #000;}
.btn.alt:hover:not(:disabled){box-shadow:8px 8px 0 #000;}
.btn.alt:active:not(:disabled){box-shadow:2px 2px 0 #000;}
.stats{display:grid;grid-template-columns:auto auto;gap:6px 36px;margin:10px 0 40px;font-size:33px;text-align:left;}
.stats span:nth-child(odd){color:var(--steel-hi);}
.stats span:nth-child(even){color:var(--paper);text-align:right;}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>

    <div id="p-hp" class="panel"><div class="lab">체력</div><div id="segs"></div><div class="big" id="v-hp">100</div></div>
    <div id="p-ammo" class="panel"><div class="lab">탄약</div><div class="big"><span id="v-mag">30</span><small id="v-res">/ 120</small></div></div>
    <div id="cross"><i></i><i></i><i></i><i></i></div>
    <div id="hitm"><i></i><i></i><i></i><i></i></div>

    <div class="tag">HEX STRIKE</div>

];
const MAP = HALF.map(r => { const a = r.split('').map(c => c === '.' ? 0 : +c); return a.concat(a.slice().reverse()); });
const MW = 24, MH = 24;
const wallAt = (x, y) => { const cx = x | 0, cy = y | 0; if (x < 0 || y < 0 || cx >= MW || cy >= MH) return true; return MAP[cy][cx] > 0; };
const blocked = (x, y, r) => wallAt(x - r, y - r) || wallAt(x + r, y - r) || wallAt(x - r, y + r) || wallAt(x + r, y + r);

/* =====================================================================
   오디오 (WebAudio 합성음)
   ===================================================================== */
let AC = null, muted = false, noiseBuf = null;
function audioInit() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.5, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function tone(f0, f1, dur, type, vol) {
  if (!AC || muted) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
  g.gain.setValueAtTime(vol || 0.06, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur);
}
function noise(dur, vol, freq) {
  if (!AC || muted) return;
  const t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = 'bandpass'; f.frequency.value = freq || 1500;
  g.gain.setValueAtTime(vol || 0.1, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(AC.destination); s.start(t); s.stop(t + dur);
}
const sfx = {
  shoot()  { noise(0.12, 0.16, 1800); tone(240, 60, 0.12, 'square', 0.07); },
  hit()    { tone(900, 700, 0.05, 'square', 0.05); },
  head()   { tone(1400, 1000, 0.09, 'square', 0.06); tone(700, 500, 0.12, 'triangle', 0.06); },
  kill()   { tone(300, 80, 0.3, 'sawtooth', 0.06); noise(0.25, 0.1, 600); },
  hurt()   { tone(160, 50, 0.25, 'sawtooth', 0.1); noise(0.15, 0.1, 400); },
  swing()  { noise(0.18, 0.05, 900); },
  reload() { tone(500, 400, 0.05, 'square', 0.04); setTimeout(() => tone(380, 600, 0.06, 'square', 0.04), 700); },
  empty()  { tone(200, 180, 0.04, 'square', 0.04); },
  pick()   { tone(600, 1200, 0.12, 'square', 0.05); },
  wave()   { tone(330, 330, 0.12, 'square', 0.05); setTimeout(() => tone(440, 440, 0.12, 'square', 0.05), 130); setTimeout(() => tone(660, 660, 0.2, 'square', 0.05), 260); }

const TS = 512;
const TEX_OFFSETS = [0, 900, 1900, 2920];
let TEX = [];
function buildTextures(bg) {
  TEX = TEX_OFFSETS.map(off => {
    const c = document.createElement('canvas'); c.width = c.height = TS;
    const g = c.getContext('2d'); g.imageSmoothingQuality = 'high';
    const k = bg.height / 1080;
    g.drawImage(bg, off * k, 0, 1080 * k, bg.height, 0, 0, TS, TS);
    return c;
  });
}

const DEATHCFG = {
  head: { rf: 0.8,  dx: -1700, bump: 1800 },
  torso:{ rf: -1.5, dx: 300,   bump: 0 },
  armL: { rf: 1.4,  dx: -2000, bump: 1000 },
  armR: { rf: -1.3, dx: 2200,  bump: 1400 },
  legL: { rf: -1.45,dx: -1000, bump: 300 },
  legR: { rf: 1.4,  dx: 900,   bump: 300 }

function drawDeath(c, t) {

const ease = t => t * t * (3 - 2 * t);

           legL: Math.max(0, s) * 330, legR: Math.max(0, -s) * 330, legLr: s * 0.05, legRr: -s * 0.05 };
}
function attackPose(t) {

  else if (t < 0.62) { const k = (t - 0.45) / 0.17; arm = 2.0 - k * 2.9; lean = -0.07 + 0.2 * k; bob = -60 - 120 * k; head = 0.08 * k; armL = -0.3 + 0.5 * k; }
  else { const k = ease((t - 0.62) / 0.38); arm = -0.9 * (1 - k); lean = 0.13 * (1 - k); bob = -180 * (1 - k); head = 0.08 * (1 - k); armL = 0.2 * (1 - k); }

const FR = { walk: [], attack: [], hurt: null, death: [] };

/* ---------- 픽업 아이콘 (육각형) ---------- */
const PICK = {};
function hexPath(c, cx, cy, r) { c.beginPath(); for (let i = 0; i < 6; i++) { const a = Math.PI / 3 * i; const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r; i ? c.lineTo(x, y) : c.moveTo(x, y); } c.closePath(); }

    hexPath(c, 48, 48, 44); c.fillStyle = '#000'; c.fill();

    if (kind === 'hp') { c.fillStyle = '#000'; c.fillRect(42, 24, 12, 48); c.fillRect(24, 42, 48, 12); }

/* =====================================================================
   게임 상태
   ===================================================================== */
const player = { x: 12, y: 18.5, a: -Math.PI / 2, hp: 100, mag: 30, res: 120, kick: 0, bobT: 0, moveAmt: 0,
                 reloading: 0, fireCd: 0, hurtFlash: 0, dead: false };
let enemies = [], pickups = [], particles = [];
let state = 'title';           // title | play | pause | over
let wave = 0, toSpawn = 0, spawnT = 0, nextWaveT = 0, waveActive = false;
let score = 0, kills = 0, best = 0;
let locked = false, lockFailed = false, mouseDown = false;
let msgT = 0, hitT = 0, overT = 0;
const keys = new Set();
const zbuf = new Float32Array(W);
try { best = +localStorage.getItem('hexstrike-best') || 0; } catch (e) {}

/* ---------- 길찾기 (플레이어 기준 BFS) ---------- */
const flow = new Int16Array(MW * MH);
let flowT = 0;
function buildFlow() {
  flow.fill(999);
  const sx = player.x | 0, sy = player.y | 0;
  const q = [sx + sy * MW]; flow[q[0]] = 0;
  for (let h = 0; h < q.length; h++) {
    const id = q[h], cx = id % MW, cy = (id / MW) | 0, d = flow[id];
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue;
      const nx = cx + dx, ny = cy + dy;
      if (nx < 0 || ny < 0 || nx >= MW || ny >= MH || MAP[ny][nx]) continue;
      if (dx && dy && (MAP[cy][nx] || MAP[ny][cx])) continue;
      const nid = nx + ny * MW; if (flow[nid] <= d + 1) continue;
      flow[nid] = d + 1; q.push(nid);
    }
  }
}
function hasLOS(x0, y0, x1, y1) {
  const dx = x1 - x0, dy = y1 - y0, d = Math.hypot(dx, dy); if (d < 0.01) return true;
  const ux = dx / d, uy = dy / d, px = -uy * 0.24, py = ux * 0.24;
  for (let t = 0; t < d; t += 0.18) {
    const x = x0 + ux * t, y = y0 + uy * t;
    if (wallAt(x, y) || wallAt(x + px, y + py) || wallAt(x - px, y - py)) return false;
  }
  return true;
}

/* ---------- 적 ---------- */
function spawnEnemy() {
  let tries = 0, x, y;
  do {
    x = 1.5 + (Math.random() * (MW - 3)) | 0; y = 1.5 + (Math.random() * (MH - 3)) | 0;
    x = (x | 0) + 0.5; y = (y | 0) + 0.5; tries++;
  } while ((MAP[y | 0][x | 0] || Math.hypot(x - player.x, y - player.y) < (tries < 40 ? 9 : 5)) && tries < 80);
  if (MAP[y | 0][x | 0]) return;
  enemies.push({
    x, y, hp: 50 + wave * 8, maxhp: 50 + wave * 8,
    speed: Math.min(2.3, 1.05 + wave * 0.1) * (0.9 + Math.random() * 0.25),
    dmg: Math.min(22, 9 + wave), state: 'walk', anim: Math.random(), atkT: 0, atkDur: 0.9, hit: false,
    cd: 0.5, hurtT: 0, deadT: 0, spawnT: 0, p: null
  });
}
function tryMove(e, dx, dy, r) {
  if (!blocked(e.x + dx, e.y, r)) e.x += dx;
  if (!blocked(e.x, e.y + dy, r)) e.y += dy;
}
function updateEnemy(e, dt) {
  e.spawnT = Math.min(1, e.spawnT + dt / 0.6);
  if (e.state === 'dead') { e.deadT += dt; return; }
  const dx = player.x - e.x, dy = player.y - e.y, d = Math.hypot(dx, dy);
  if (e.state === 'hurt') { e.hurtT -= dt; if (e.hurtT <= 0) e.state = 'walk'; return; }
  if (e.state === 'attack') {
    e.atkT += dt;
    if (!e.hit && e.atkT / e.atkDur >= 0.55) {
      e.hit = true; sfx.swing();
      if (d < 1.35 && !player.dead) hurtPlayer(e.dmg);
    }
    if (e.atkT >= e.atkDur) { e.state = 'walk'; e.cd = 0.5; }
    return;
  }
  e.cd -= dt;
  if (d < 1.0 && e.cd <= 0) { e.state = 'attack'; e.atkT = 0; e.hit = false; return; }
  // 이동 목표
  let tx = player.x, ty = player.y;
  if (!hasLOS(e.x, e.y, player.x, player.y)) {
    const cx = e.x | 0, cy = e.y | 0; let best = flow[cx + cy * MW], bx = cx, by = cy;
    for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) {
      const nx = cx + ox, ny = cy + oy; if (nx < 0 || ny < 0 || nx >= MW || ny >= MH || MAP[ny][nx]) continue;
      if (ox && oy && (MAP[cy][nx] || MAP[ny][cx])) continue;
      if (flow[nx + ny * MW] < best) { best = flow[nx + ny * MW]; bx = nx; by = ny; }
    }
    tx = bx + 0.5; ty = by + 0.5;
  }
  let mx = tx - e.x, my = ty - e.y; const md = Math.hypot(mx, my) || 1; mx /= md; my /= md;
  // 다른 적과 간격 유지
  for (const o of enemies) if (o !== e && o.state !== 'dead') {
    const ox = e.x - o.x, oy = e.y - o.y, od = Math.hypot(ox, oy);
    if (od < 0.6 && od > 0.001) { mx += ox / od * 0.6; my += oy / od * 0.6; }
  }
  const ml = Math.hypot(mx, my) || 1;
  const sp = d < 0.9 ? 0 : e.speed;
  tryMove(e, mx / ml * sp * dt, my / ml * sp * dt, 0.26);
  e.anim += dt * e.speed * 0.9;
}

/* ---------- 플레이어 ---------- */
function hurtPlayer(n) {
  player.hp = Math.max(0, player.hp - n); player.hurtFlash = 1; sfx.hurt();
  if (player.hp <= 0 && !player.dead) { player.dead = true; overT = 1.1; }
}
function reload() {
  if (player.reloading > 0 || player.mag >= 30 || player.res <= 0) return;
  player.reloading = 1.3; sfx.reload();
}
function shoot() {
  if (player.fireCd > 0 || player.reloading > 0 || player.dead) return;
  if (player.mag <= 0) { sfx.empty(); player.fireCd = 0.3; reload(); return; }
  player.mag--; player.fireCd = 0.11; player.kick = 1; sfx.shoot();
  let best = null, bestT = 1e9, head = false;
  const wallD = zbuf[W >> 1];
  for (const e of enemies) {
    if (e.state === 'dead' || !e.p) continue;
    const p = e.p; if (p.ty < 0.15 || p.ty > wallD) continue;
    const top = p.y + (CELL - MARG - CH) / CELL * p.h, bot = p.y + (CELL - MARG) / CELL * p.h;
    const hw = 0.17 * p.w, ch = bot - top;
    if (Math.abs(W / 2 - p.sx) > hw || H / 2 < top || H / 2 > bot) continue;
    if (p.ty < bestT) { bestT = p.ty; best = e; head = (H / 2 - top) < ch * 0.17 && Math.abs(W / 2 - p.sx) < p.w * 0.09; }
  }
  if (best) {
    const dmg = head ? 70 : 22; best.hp -= dmg; hitT = 0.18; $('hitm').className = head ? 'head' : '';
    for (let i = 0; i < 9; i++) particles.push({ x: W / 2, y: H / 2, vx: (Math.random() - .5) * 220, vy: -Math.random() * 160 - 20, life: 0.5 + Math.random() * 0.3, s: 2 + Math.random() * 4, c: Math.random() < .5 ? '#fd9f28' : '#9a9a9a' });
    if (best.hp <= 0) {
      best.state = 'dead'; best.deadT = 0; kills++; score += head ? 150 : 100; sfx.kill();
      if (Math.random() < 0.38) pickups.push({ x: best.x, y: best.y, type: Math.random() < .5 ? 'hp' : 'ammo', t: Math.random() * 6 });
    } else {
      score += 10; (head ? sfx.head : sfx.hit)();
      if (best.state !== 'attack' || best.atkT / best.atkDur < 0.4) { best.state = 'hurt'; best.hurtT = 0.22; best.atkT = 0; }
    }
  }
}

/* ---------- 웨이브 ---------- */
function showMsg(t, s, dur) { $('msg-t').textContent = t; $('msg-s').textContent = s || ''; msgT = dur || 2.2; }
function startWave(n) {
  wave = n; toSpawn = 4 + n * 2; spawnT = 1; waveActive = true; sfx.wave();
  showMsg('웨이브 ' + n, '적 ' + toSpawn + '체 접근 중');
}
const alive = () => enemies.reduce((a, e) => a + (e.state !== 'dead' ? 1 : 0), 0);

function resetGame() {
  Object.assign(player, { x: 12, y: 18.5, a: -Math.PI / 2, hp: 100, mag: 30, res: 120, kick: 0, bobT: 0, moveAmt: 0, reloading: 0, fireCd: 0, hurtFlash: 0, dead: false });
  enemies = []; pickups = []; particles = []; score = 0; kills = 0; wave = 0; waveActive = false; nextWaveT = 0;
  startWave(1);
}

/* =====================================================================
   업데이트
   ===================================================================== */
function update(dt) {
  if (state !== 'play') return;
  // 회전 (방향키 / Q E)
  const turn = (keys.has('ArrowRight') || keys.has('KeyE') ? 1 : 0) - (keys.has('ArrowLeft') || keys.has('KeyQ') ? 1 : 0);
  if (!player.dead) {
    player.a += turn * 2.4 * dt;
    // 이동
    const fw = (keys.has('KeyW') || keys.has('ArrowUp') ? 1 : 0) - (keys.has('KeyS') || keys.has('ArrowDown') ? 1 : 0);
    const st = (keys.has('KeyD') ? 1 : 0) - (keys.has('KeyA') ? 1 : 0);
    let mx = Math.cos(player.a) * fw + -Math.sin(player.a) * st, my = Math.sin(player.a) * fw + Math.cos(player.a) * st;
    const ml = Math.hypot(mx, my);
    const sp = (keys.has('ShiftLeft') || keys.has('ShiftRight')) ? 5.0 : 3.2;
    if (ml > 0) {
      mx = mx / ml * sp * dt; my = my / ml * sp * dt;
      if (!blocked(player.x + mx, player.y, 0.22)) player.x += mx;
      if (!blocked(player.x, player.y + my, 0.22)) player.y += my;
      player.bobT += dt * (sp > 4 ? 13 : 9); player.moveAmt += (1 - player.moveAmt) * Math.min(1, dt * 10);
    } else player.moveAmt += (0 - player.moveAmt) * Math.min(1, dt * 10);
    // 발사
    if (player.fireCd > 0) player.fireCd -= dt;
    if ((mouseDown || keys.has('Space')) && player.reloading <= 0) shoot();
    if (player.reloading > 0) {
      player.reloading -= dt;
      if (player.reloading <= 0) { const n = Math.min(30 - player.mag, player.res); player.mag += n; player.res -= n; }
    }
  }
  player.kick = Math.max(0, player.kick - dt * 7);
  player.hurtFlash = Math.max(0, player.hurtFlash - dt * 2.2);

  // 길찾기 갱신
  flowT -= dt; if (flowT <= 0) { buildFlow(); flowT = 0.25; }

  // 웨이브 진행
  if (waveActive && !player.dead) {
    spawnT -= dt;
    if (toSpawn > 0 && spawnT <= 0 && alive() < 6 + Math.min(wave, 6)) { spawnEnemy(); toSpawn--; spawnT = Math.max(0.5, 1.6 - wave * 0.08); }
    if (toSpawn === 0 && alive() === 0) {
      waveActive = false; nextWaveT = 4; score += wave * 200;
      player.hp = Math.min(100, player.hp + 20); player.res += 30;
      showMsg('웨이브 ' + wave + ' 클리어', '체력 +20  탄약 +30', 3.2); sfx.pick();
    }
  } else if (!waveActive && !player.dead) {
    nextWaveT -= dt; if (nextWaveT <= 0) startWave(wave + 1);
  }

  // 적 / 픽업
  for (const e of enemies) updateEnemy(e, dt);
  enemies = enemies.filter(e => !(e.state === 'dead' && e.deadT > 4));
  for (const p of pickups) p.t += dt;
  pickups = pickups.filter(p => {
    if (Math.hypot(p.x - player.x, p.y - player.y) < 0.7 && !player.dead) {
      if (p.type === 'hp') { if (player.hp >= 100) return true; player.hp = Math.min(100, player.hp + 25); }
      else player.res += 30;
      sfx.pick(); return false;
    }
    return true;
  });

  // 파티클 / 연출 타이머
  for (const p of particles) { p.life -= dt; p.vy += 520 * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  particles = particles.filter(p => p.life > 0);
  if (msgT > 0) msgT -= dt;
  if (hitT > 0) hitT -= dt;

  if (player.dead) {
    overT -= dt;
    if (overT <= 0) gameOver();
  }
}

/* =====================================================================
   렌더링
   ===================================================================== */
const fb = ctx.createImageData(W, H);
const buf = new Uint32Array(fb.data.buffer);
const rgba = (r, g, b) => (255 << 24) | (b << 16) | (g << 8) | r;

function drawFloorCeiling(dirX, dirY, planeX, planeY) {
  const half = H >> 1;
  for (let y = half; y < H; y++) {
    const p = y - half + 0.5, rowDist = half / p;
    const fog = Math.max(0, 1 - rowDist / 13);
    const fx0 = player.x + rowDist * (dirX - planeX), fy0 = player.y + rowDist * (dirY - planeY);
    const sx = rowDist * 2 * planeX / W, sy = rowDist * 2 * planeY / W;
    let fx = fx0, fy = fy0;
    const fo = y * W, co = (H - 1 - y) * W;
    for (let x = 0; x < W; x++, fx += sx, fy += sy) {
      const cx = Math.floor(fx), cy = Math.floor(fy), u = fx - cx, v = fy - cy;
      const chk = (cx + cy) & 1;
      // 바닥
      let r, g, b;
      if ((u < 0.05 && (cx & 3) === 0) || (v < 0.05 && (cy & 3) === 0)) { r = 149; g = 93; b = 18; }
      else if (u < 0.025 || v < 0.025) { r = 52; g = 52; b = 52; }
      else { r = g = b = chk ? 26 : 20; }
      buf[fo + x] = rgba(r * fog | 0, g * fog | 0, b * fog | 0);
      // 천장
      if (u > 0.3 && u < 0.7 && v > 0.3 && v < 0.7 && (cx & 3) === 2 && (cy & 3) === 2) { r = g = b = 225; }
      else if (u < 0.03 || v < 0.03) { r = g = b = 30; }
      else { r = g = b = chk ? 13 : 9; }
      buf[co + x] = rgba(r * fog | 0, g * fog | 0, b * fog | 0);
    }
  }
}

function drawWalls(dirX, dirY, planeX, planeY) {
  for (let x = 0; x < W; x++) {
    const camX = 2 * x / W - 1;
    const rdx = dirX + planeX * camX, rdy = dirY + planeY * camX;
    let mx = player.x | 0, my = player.y | 0;
    const ddx = Math.abs(1 / (rdx || 1e-9)), ddy = Math.abs(1 / (rdy || 1e-9));
    let sdx, sdy, stx, sty;
    if (rdx < 0) { stx = -1; sdx = (player.x - mx) * ddx; } else { stx = 1; sdx = (mx + 1 - player.x) * ddx; }
    if (rdy < 0) { sty = -1; sdy = (player.y - my) * ddy; } else { sty = 1; sdy = (my + 1 - player.y) * ddy; }
    let side = 0, hit = 0, guard = 0;
    while (!hit && guard++ < 64) {
      if (sdx < sdy) { sdx += ddx; mx += stx; side = 0; } else { sdy += ddy; my += sty; side = 1; }
      if (mx < 0 || my < 0 || mx >= MW || my >= MH) { hit = 1; break; }
      if (MAP[my][mx] > 0) hit = MAP[my][mx];
    }
    const perp = Math.max(0.05, side === 0 ? sdx - ddx : sdy - ddy);
    zbuf[x] = perp;
    let wx = side === 0 ? player.y + perp * rdy : player.x + perp * rdx; wx -= Math.floor(wx);
    if ((side === 0 && rdx > 0) || (side === 1 && rdy < 0)) wx = 1 - wx;
    const lh = H / perp, ds = (H - lh) / 2;
    const tex = TEX[((hit || 1) - 1) % TEX.length];
    ctx.drawImage(tex, Math.min(TS - 1, (wx * TS) | 0), 0, 1, TS, x, ds, 1, lh);
    const a = Math.min(0.94, perp / 13 + (side ? 0.2 : 0));
    ctx.globalAlpha = a; ctx.fillStyle = '#000'; ctx.fillRect(x, ds, 1, lh); ctx.globalAlpha = 1;
  }
}

function drawSprites(dirX, dirY, planeX, planeY) {
  const list = [];
  const inv = 1 / (planeX * dirY - dirX * planeY);
  const proj = (wx, wy) => {
    const sx = wx - player.x, sy = wy - player.y;
    const tx = inv * (dirY * sx - dirX * sy), ty = inv * (-planeY * sx + planeX * sy);
    return { tx, ty, sx: (W / 2) * (1 + tx / ty) };
  };
  for (const e of enemies) { const p = proj(e.x, e.y); e.p = null; if (p.ty > 0.12) list.push({ kind: 'e', o: e, ...p }); }
  for (const k of pickups) { const p = proj(k.x, k.y); if (p.ty > 0.12) list.push({ kind: 'p', o: k, ...p }); }
  list.sort((a, b) => b.ty - a.ty);

  for (const s of list) {
    const ty = s.ty;
    let frame, ws, alpha = 1, floorOff = 0;
    const floorY = H / 2 + H / (2 * ty);
    if (s.kind === 'e') {
      const e = s.o;
      if (e.state === 'dead') frame = FR.death[Math.min(6, (e.deadT / 0.1) | 0)];
      else if (e.state === 'hurt') frame = FR.hurt;
      else if (e.state === 'attack') frame = FR.attack[Math.min(7, (e.atkT / e.atkDur * 8) | 0)];
      else frame = FR.walk[((e.anim % 1) * 10) | 0];
      ws = 0.7 * CELL / CH;
      alpha = e.spawnT; if (e.state === 'dead' && e.deadT > 3) alpha *= Math.max(0, 1 - (e.deadT - 3));
    } else {
      frame = PICK[s.o.type]; ws = 0.34;
      floorOff = 0.13 + Math.sin(s.o.t * 3) * 0.03;
    }
    alpha *= Math.max(0, Math.min(1, (14 - ty) / 5));
    if (alpha <= 0) continue;
    const dh = Math.abs(H / ty) * ws, dw = dh;
    const fw = frame.width, fh = frame.height;
    let dy;
    if (s.kind === 'e') dy = floorY - (CELL - MARG) / CELL * dh;
    else dy = floorY - dh - floorOff * H / ty;
    const left = s.sx - dw / 2;
    if (s.kind === 'e') s.o.p = { sx: s.sx, ty, y: dy, w: dw, h: dh };
    const x0 = Math.max(0, Math.floor(left)), x1 = Math.min(W - 1, Math.floor(left + dw));
    ctx.globalAlpha = alpha;
    let runStart = -1;
    for (let x = x0; x <= x1 + 1; x++) {
      const vis = x <= x1 && ty < zbuf[x];
      if (vis && runStart < 0) runStart = x;
      if (!vis && runStart >= 0) {
        const sxp = (runStart - left) / dw * fw, swp = (x - runStart) / dw * fw;
        ctx.drawImage(frame, sxp, 0, swp, fh, runStart, dy, x - runStart, dh);
        runStart = -1;
      }
    }
    ctx.globalAlpha = 1;
  }
}

function poly(cx, by, pts, c) {
  ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(cx + pts[0], by + pts[1]);
  for (let i = 2; i < pts.length; i += 2) ctx.lineTo(cx + pts[i], by + pts[i + 1]);
  ctx.closePath(); ctx.fill();
}
function drawWeapon() {
  let dip = 0;
  if (player.reloading > 0) dip = Math.sin(Math.min(1, (1.3 - player.reloading) / 1.3) * Math.PI) * 90;
  const bx = Math.sin(player.bobT) * 4 * player.moveAmt, byb = Math.abs(Math.cos(player.bobT)) * 4 * player.moveAmt;
  const cx = W / 2 + 92 + bx, by = H + 10 - player.kick * 14 + byb + dip;
  poly(cx, by, [-14, 0, 6, -44, 70, -36, 100, 0], '#181818');
  poly(cx, by, [-56, 0, -36, -60, -14, -54, -18, 0], '#232323');
  poly(cx, by, [-36, 0, -26, -96, 26, -96, 40, 0], '#434343');
  poly(cx, by, [-26, -96, 26, -96, 24, -104, -24, -104], '#5c5c5c');
  poly(cx, by, [-5, -96, 5, -96, 10, -32, -10, -32], '#fd9f28');
  if (player.kick > 0.6) {
    const fcx = cx, fcy = by - 112, r = 14 + player.kick * 16;
    ctx.fillStyle = '#fd9f28'; ctx.beginPath();
    for (let i = 0; i < 6; i++) { const a = Math.PI / 3 * i + Math.PI / 6; const x = fcx + Math.cos(a) * r, y = fcy + Math.sin(a) * r; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillRect(fcx - 4, fcy - 4, 8, 8);
  }
}

const mini = $('mini'), mctx = mini.getContext('2d');
function drawMini() {
  mctx.fillStyle = '#000'; mctx.fillRect(0, 0, 132, 132);
  const cs = 5, ox = 6, oy = 6;
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    if (MAP[y][x]) { mctx.fillStyle = '#434343'; mctx.fillRect(ox + x * cs, oy + y * cs, cs, cs); }
  }
  for (const k of pickups) { mctx.fillStyle = '#fd9f28'; mctx.fillRect(ox + k.x * cs - 1, oy + k.y * cs - 1, 3, 3); }
  for (const e of enemies) if (e.state !== 'dead') { mctx.fillStyle = '#fff'; mctx.fillRect(ox + e.x * cs - 1.5, oy + e.y * cs - 1.5, 4, 4); }
  const px = ox + player.x * cs, py = oy + player.y * cs;
  mctx.strokeStyle = 'rgba(253,159,40,.45)'; mctx.beginPath();
  for (const s of [-0.58, 0.58]) { mctx.moveTo(px, py); mctx.lineTo(px + Math.cos(player.a + s) * 14, py + Math.sin(player.a + s) * 14); }
  mctx.stroke();
  mctx.fillStyle = '#fd9f28'; mctx.fillRect(px - 2, py - 2, 5, 5);
}

function render() {
  const dirX = Math.cos(player.a), dirY = Math.sin(player.a);
  const planeX = -dirY * 0.66, planeY = dirX * 0.66;
  drawFloorCeiling(dirX, dirY, planeX, planeY);
  ctx.putImageData(fb, 0, 0);
  drawWalls(dirX, dirY, planeX, planeY);
  drawSprites(dirX, dirY, planeX, planeY);
  for (const p of particles) { ctx.globalAlpha = Math.min(1, p.life * 3); ctx.fillStyle = p.c; ctx.fillRect(p.x | 0, p.y | 0, p.s, p.s); }
  ctx.globalAlpha = 1;
  if (!player.dead) drawWeapon();
}

/* ---------- HUD ---------- */
const cache = {};
function setText(id, v) { if (cache[id] !== v) { cache[id] = v; $(id).textContent = v; } }
const segs = $('segs'); for (let i = 0; i < 10; i++) segs.appendChild(document.createElement('i'));
function updateHud() {
  setText('v-score', String(score));
  setText('v-wave', '웨이브 ' + wave);
  setText('v-left', '남은 적 ' + (alive() + toSpawn));
  setText('v-hp', String(Math.ceil(player.hp)));
  setText('v-mag', String(player.mag));
  setText('v-res', '/ ' + player.res);
  const on = Math.ceil(player.hp / 10);
  if (cache.segs !== on) { cache.segs = on; [...segs.children].forEach((c, i) => c.className = i < on ? 'on' : ''); segs.className = player.hp <= 30 ? 'low' : ''; }
  $('reload').classList.toggle('hidden', !(player.reloading > 0));
  $('hitm').style.opacity = hitT > 0 ? Math.min(1, hitT / 0.12) : 0;
  $('msg').style.opacity = (msgT > 0 && state === 'play') ? Math.min(1, msgT * 2, (msgT > 0.4 ? 1 : msgT / 0.4)) : 0;
  $('dmg').style.opacity = player.hurtFlash * 0.9;
  drawMini();
}

/* =====================================================================
   화면 전환 / 입력
   ===================================================================== */
const show = (id, on) => $(id).classList.toggle('hidden', !on);
function setState(s) {
  state = s;
  show('s-title', s === 'title'); show('s-pause', s === 'pause'); show('s-over', s === 'over');
  show('hud', s === 'play' || s === 'pause');
}
function requestLock() {
  if (lockFailed || locked) return;
  try { const r = stage.requestPointerLock(); if (r && r.catch) r.catch(() => { lockFailed = true; }); } catch (e) { lockFailed = true; }
}
function startGame() { audioInit(); resetGame(); setState('play'); mouseDown = false; requestLock(); }
function pause() { if (state !== 'play') return; setState('pause'); mouseDown = false; if (document.pointerLockElement) document.exitPointerLock(); }
function resume() { if (state !== 'pause') return; setState('play'); requestLock(); }
function gameOver() {
  if (score > best) { best = score; try { localStorage.setItem('hexstrike-best', String(best)); } catch (e) {} }
  $('o-wave').textContent = wave; $('o-kill').textContent = kills; $('o-score').textContent = score; $('o-best').textContent = best;
  setState('over'); mouseDown = false; if (document.pointerLockElement) document.exitPointerLock();
}

$('btn-start').addEventListener('click', startGame);
$('btn-resume').addEventListener('click', resume);
$('btn-restart').addEventListener('click', startGame);
$('btn-retry').addEventListener('click', startGame);
document.addEventListener('pointerlockchange', () => {
  const was = locked; locked = document.pointerLockElement === stage;
  if (was && !locked && state === 'play') pause();
});
document.addEventListener('pointerlockerror', () => { lockFailed = true; });
document.addEventListener('mousemove', e => { if (locked && state === 'play' && !player.dead) player.a += e.movementX * 0.0024; });
stage.addEventListener('mousedown', e => {
  if (e.button !== 0 || state !== 'play') return;
  mouseDown = true; audioInit(); if (!locked) requestLock();
});
addEventListener('mouseup', () => { mouseDown = false; });
addEventListener('contextmenu', e => e.preventDefault());
addEventListener('blur', () => { mouseDown = false; keys.clear(); if (state === 'play') pause(); });
addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  keys.add(e.code);
  if (e.code === 'KeyM') muted = !muted;
  if (state === 'play') {
    if (e.code === 'KeyR') reload();
    if (e.code === 'KeyP' || (e.code === 'Escape' && !locked)) pause();
  } else if (state === 'pause') {
    if (e.code === 'KeyP' || e.code === 'Enter') resume();
    else if (e.code === 'KeyR') startGame();
  } else if (state === 'title' && e.code === 'Enter' && !$('btn-start').disabled) startGame();
  else if (state === 'over' && e.code === 'Enter') startGame();
});
addEventListener('keyup', e => keys.delete(e.code));

/* =====================================================================
   메인 루프
   ===================================================================== */
const hero = $('hero'), hctx = hero.getContext('2d');
let last = performance.now(), heroT = 0, ready = false;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (ready) {
    if (state === 'title') {
      heroT += dt; const cyc = heroT % 3.6;
      hctx.clearRect(0, 0, CELL, CELL);
      const f = cyc < 2.4 ? FR.walk[((cyc * 5) | 0) % 10] : FR.attack[Math.min(7, ((cyc - 2.4) / 1.2 * 8) | 0)];
      hctx.drawImage(f, 0, 0);
    } else {
      update(dt); render(); if (state !== 'over' || true) updateHud();
    }
  }
  requestAnimationFrame(loop);
}

(async function init() {
  try {
    const [wall] = await Promise.all([loadImg(WALL_SRC), document.fonts.load('22px Galmuri11', '헥스 스트라이크')]);
    await Promise.all(Object.keys(PARTS).map(async n => { IM[n] = await loadImg(PARTS[n].src); }));
    buildTextures(wall); bakeAll(); bakePickups();
    ready = true;
    const b = $('btn-start'); b.disabled = false; b.textContent = '게임 시작';
  } catch (err) {
    $('btn-start').textContent = '불러오기 실패';
    console.error(err);
  }
})();
requestAnimationFrame(loop);
})();
</script>
