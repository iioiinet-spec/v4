<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>앨리스의 이상한 나라 모험 - 3000점 도전기</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0d031a;
            color: #fff;
            font-family: 'Malgun Gothic', 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 850px;
            height: 520px;
            border: 4px solid #facc15;
            border-radius: 16px;
            box-shadow: 0 0 40px rgba(168, 85, 247, 0.7);
            overflow: hidden;
            background: #1e1035;
        }
        /* UI 상단 상태창 */
        #ui-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 17px;
            font-weight: bold;
            background: rgba(15, 5, 29, 0.85);
            backdrop-filter: blur(6px);
            z-index: 10;
            border-bottom: 2px solid rgba(250, 204, 21, 0.3);
        }
        .ui-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .life-heart { color: #ef4444; letter-spacing: 2px; }
        .score-highlight { color: #facc15; }
        .stage-highlight { color: #38bdf8; }

        canvas { display: block; }

        /* NPC 말풍선 */
        #npc-speech-bubble {
            position: absolute;
            padding: 10px 18px;
            background: #ffffff;
            color: #0f172a;
            border: 2px solid #a855f7;
            border-radius: 18px;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 15;
            white-space: nowrap;
            transform: translate(-50%, -100%);
            animation: bounce 1s infinite alternate;
        }
        #npc-speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 8px 8px 0;
            border-style: solid;
            border-color: #ffffff transparent;
            display: block;
            width: 0;
        }

        /* 퀴즈 대화 상자 */
        #dialog-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            background: rgba(23, 11, 41, 0.95);
            border: 2px solid #a855f7;
            border-radius: 14px;
            padding: 16px 20px;
            z-index: 20;
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.6);
        }
        #speaker-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }
        #speaker-genre {
            font-size: 12px;
            background: #a855f7;
            color: #fff;
            padding: 2px 8px;
            border-radius: 10px;
        }
        #speaker-name {
            font-size: 19px;
            font-weight: bold;
        }
        #dialog-text {
            font-size: 15px;
            line-height: 1.4;
            margin-bottom: 12px;
            color: #f1f5f9;
        }
        #options-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .opt-btn {
            background: #3b1568;
            border: 1px solid #c084fc;
            color: #fff;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            text-align: left;
            transition: all 0.2s;
        }
        .opt-btn:hover {
            background: #6b21a8;
            border-color: #38bdf8;
            transform: translateY(-2px);
        }

        /* 결과 알림 대화 상자 */
        #result-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(23, 11, 41, 0.98);
            border: 3px solid #facc15;
            border-radius: 16px;
            padding: 24px 32px;
            text-align: center;
            z-index: 25;
            box-shadow: 0 0 30px rgba(250, 204, 21, 0.5);
            min-width: 380px;
        }
        #result-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 12px;
        }
        #result-desc {
            font-size: 16px;
            margin-bottom: 20px;
            color: #e2e8f0;
        }
        .btn-confirm {
            background: linear-gradient(135deg, #a855f7, #6b21a8);
            color: #fff;
            border: 1px solid #c084fc;
            padding: 10px 24px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-confirm:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, #c084fc, #9333ea);
        }

        /* 포탈 안내 */
        #portal-prompt {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(234, 179, 8, 0.95);
            color: #000;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 15px;
            box-shadow: 0 0 15px #eab308;
            z-index: 15;
            animation: pulse 1.2s infinite alternate;
        }

        @keyframes bounce {
            0% { transform: translate(-50%, -100%); }
            100% { transform: translate(-50%, -112%); }
        }
        @keyframes pulse {
            0% { transform: translateX(-50%) scale(1); }
            100% { transform: translateX(-50%) scale(1.08); }
        }

        /* 오버레이 */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(12, 4, 24, 0.94);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 30;
        }
        .overlay h1 { font-size: 44px; margin-bottom: 12px; }
        .game-over-title { color: #f87171; text-shadow: 0 0 15px #f87171; }
        .victory-title { color: #4ade80; text-shadow: 0 0 20px #4ade80; }
        .overlay p { font-size: 18px; margin-bottom: 24px; color: #cbd5e1; text-align: center; line-height: 1.5; }
        .btn-restart {
            padding: 12px 32px;
            font-size: 18px;
            font-weight: bold;
            background: linear-gradient(135deg, #facc15, #eab308);
            color: #1e1035;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 15px #facc15;
            transition: all 0.2s;
        }
        .btn-restart:hover { transform: scale(1.08); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="ui-bar">
        <div class="ui-item">ROUND: <span id="stage-num" class="stage-highlight">1</span> / 30</div>
        <div class="ui-item">SCORE: <span id="score-val" class="score-highlight">0</span> / 3000</div>
        <div class="ui-item">LIFE: <span id="life-val" class="life-heart">♥♥♥♥♥</span></div>
    </div>

    <!-- NPC 말풍선 -->
    <div id="npc-speech-bubble" class="hidden">안녕, 앨리스! [ENTER]를 눌러 퀴즈 풀기</div>

    <!-- 포탈 이동 안내 -->
    <div id="portal-prompt" class="hidden">✨ 포탈 앞에서 [ENTER]를 눌러 다음 라운드로 이동하세요! ✨</div>

    <canvas id="gameCanvas" width="850" height="520"></canvas>

    <!-- 퀴즈 대화 모달 UI -->
    <div id="dialog-box" class="hidden">
        <div id="speaker-header">
            <span id="speaker-name">체셔 캣</span>
            <span id="speaker-genre">장르</span>
        </div>
        <div id="dialog-text">질문이 여기에 표시됩니다.</div>
        <div id="options-container"></div>
    </div>

    <!-- 결과 안내 모달 -->
    <div id="result-modal" class="hidden">
        <div id="result-title">🎉 정답입니다!</div>
        <div id="result-desc">정답설명이 여기에 표시됩니다.</div>
        <button class="btn-confirm" onclick="confirmResult()">다음으로 넘어가기</button>
    </div>

    <!-- 엔딩 화면 -->
    <div id="screen-gameover" class="overlay hidden">
        <h1 class="game-over-title">GAME OVER</h1>
        <p>기회를 모두 소진했습니다...<br>이상한 나라의 미궁 속에 영원히 갇히고 말았습니다.</p>
        <button class="btn-restart" onclick="restartGame()">다시 도전하기</button>
    </div>

    <div id="screen-victory" class="overlay hidden">
        <h1 class="victory-title">🎉 VICTORY! 🎉</h1>
        <p>축하합니다! 최고 난이도까지 모든 문제를 극복했습니다!<br>앨리스는 무사히 현실 세계로 돌아가는 열쇠를 얻었습니다!</p>
        <button class="btn-restart" onclick="restartGame()">처음부터 다시 하기</button>
    </div>
</div>

// --- 게임 엔진 상태 ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let score = 0;
let life = 5;
let currentStage = 1;
let isQuizOpen = false;
let isResultOpen = false;
let isNearNPC = false;
let portalActive = false;
let gameFinished = false;

let backgroundObjects = [];
const keys = { left: false, right: false, up: false, down: false, space: false };

// 앨리스
const alice = {
    x: 90,
    y: 340,
    width: 38,
    height: 56,
    vx: 0,
    vy: 0,
    speed: 4.8,
    jumpPower: -11.8,
    gravity: 0.58,
    grounded: false,
    facing: 'right',
    animFrame: 0
};

// NPC
const npc = { x: 430, y: 320, width: 50, height: 70 };

// 포탈
const portal = { x: 730, y: 310, width: 48, height: 75, animFrame: 0 };

const GROUND_Y = 400;

// --- 키 이벤트 ---
window.addEventListener('keydown', (e) => {
    if (gameFinished) return;

    if (e.key === 'ArrowLeft') keys.left = true;
    if (e.key === 'ArrowRight') keys.right = true;

    if (e.code === 'Space') {
        keys.space = true;
        if (alice.grounded && !isQuizOpen && !isResultOpen) {
            alice.vy = alice.jumpPower;
            alice.grounded = false;
        }
    }

    if (e.key === 'Enter') {
        if (isNearNPC && !isQuizOpen && !isResultOpen && !portalActive) {
            openQuizDialog();
        } 
        else if (portalActive && isAliceNearPortal() && !isResultOpen) {
            nextStage();
        }
    }
});

window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft') keys.left = false;
    if (e.key === 'ArrowRight') keys.right = false;
    if (e.code === 'Space') keys.space = false;
});

function initGame() {
    score = 0;
    life = 5;
    currentStage = 1;
    gameFinished = false;

    document.getElementById('screen-gameover').classList.add('hidden');
    document.getElementById('screen-victory').classList.add('hidden');

    updateUI();
    loadStage();
    requestAnimationFrame(gameLoop);
}

// 배경 공중 물체 초기화
function generateBackgroundObjects() {
    backgroundObjects = [];
    for (let i = 0; i < 30; i++) {
        backgroundObjects.push({
            x: Math.random() * canvas.width,
            y: Math.random() * (GROUND_Y - 40),
            size: Math.random() * 8 + 3,
            speedY: Math.random() * 0.5 + 0.2,
            rot: Math.random() * Math.PI * 2
        });
    }
}

function loadStage() {
    alice.x = 90;
    alice.y = GROUND_Y - alice.height;
    alice.vx = 0;
    alice.vy = 0;

    portalActive = false;
    isQuizOpen = false;
    isResultOpen = false;
    isNearNPC = false;

    document.getElementById('dialog-box').classList.add('hidden');
    document.getElementById('result-modal').classList.add('hidden');
    document.getElementById('portal-prompt').classList.add('hidden');
    document.getElementById('npc-speech-bubble').classList.add('hidden');

    generateBackgroundObjects();
    updateUI();
}

function updateUI() {
    document.getElementById('stage-num').textContent = currentStage;
    document.getElementById('score-val').textContent = score;
    document.getElementById('life-val').textContent = '♥'.repeat(Math.max(0, life));
}

function openQuizDialog() {
    isQuizOpen = true;
    document.getElementById('npc-speech-bubble').classList.add('hidden');

    const dialogBox = document.getElementById('dialog-box');
    const speakerElem = document.getElementById('speaker-name');
    const genreElem = document.getElementById('speaker-genre');
    const textElem = document.getElementById('dialog-text');
    const optsContainer = document.getElementById('options-container');

    const qData = QUIZ_DATABASE[currentStage - 1];

    dialogBox.classList.remove('hidden');
    speakerElem.textContent = qData.speaker;
    speakerElem.style.color = qData.color;
    genreElem.textContent = qData.genre;
    textElem.textContent = qData.q;

    optsContainer.innerHTML = '';
    qData.opts.forEach((optText, idx) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.textContent = optText;
        btn.onclick = () => handleAnswer(idx);
        optsContainer.appendChild(btn);
    });
}

function handleAnswer(selectedIdx) {
    const qData = QUIZ_DATABASE[currentStage - 1];
    document.getElementById('dialog-box').classList.add('hidden');
    isQuizOpen = false;
    isResultOpen = true;

    const resultModal = document.getElementById('result-modal');
    const resultTitle = document.getElementById('result-title');
    const resultDesc = document.getElementById('result-desc');

    resultModal.classList.remove('hidden');
    const correctText = qData.opts[qData.ans];

    if (selectedIdx === qData.ans) {
        score += 100;
        resultTitle.textContent = "🎉 정답입니다! (+100점)";
        resultTitle.style.color = "#4ade80";
        resultDesc.innerHTML = `정답: <b>'${correctText}'</b><br>다음 라운드로 이동하는 마법 포탈이 열렸습니다!`;
        portalActive = true;
    } else {
        life--;
        resultTitle.textContent = "❌ 틀렸습니다! (하트 -1)";
        resultTitle.style.color = "#f87171";
        resultDesc.innerHTML = `정답은 <b>'${correctText}'</b>였습니다.<br>곧바로 다음 문제로 그냥 넘어갑니다!`;
        portalActive = false;
    }
    updateUI();
}

function confirmResult() {
    document.getElementById('result-modal').classList.add('hidden');
    isResultOpen = false;

    if (life <= 0) {
        showGameOver();
    } else if (portalActive) {
        document.getElementById('portal-prompt').classList.remove('hidden');
    } else {
        nextStage();
    }
}

function checkNPCProximity() {
    let dx = (alice.x + alice.width/2) - (npc.x + npc.width/2);
    let dy = (alice.y + alice.height/2) - (npc.y + npc.height/2);
    let dist = Math.sqrt(dx*dx + dy*dy);

    const bubble = document.getElementById('npc-speech-bubble');

    if (dist < 75 && !portalActive && !isQuizOpen && !isResultOpen) {
        isNearNPC = true;
        const qData = QUIZ_DATABASE[currentStage - 1];
        bubble.textContent = `${qData.greeting} [ENTER]`;
        bubble.classList.remove('hidden');
        bubble.style.left = (npc.x + 25) + 'px';
        bubble.style.top = (npc.y - 15) + 'px';
    } else {
        isNearNPC = false;
        bubble.classList.add('hidden');
    }
}

function isAliceNearPortal() {
    let dx = (alice.x + alice.width/2) - (portal.x + portal.width/2);
    let dy = (alice.y + alice.height/2) - (portal.y + portal.height/2);
    return Math.abs(dx) < 50 && Math.abs(dy) < 50;
}

function nextStage() {
    if (currentStage >= 30 || score >= 3000) {
        showVictory();
    } else {
        currentStage++;
        loadStage();
    }
}

function showGameOver() {
    gameFinished = true;
    document.getElementById('screen-gameover').classList.remove('hidden');
}

function showVictory() {
    gameFinished = true;
    document.getElementById('screen-victory').classList.remove('hidden');
}

function restartGame() {
    initGame();
}

function update() {
    if (isQuizOpen || isResultOpen || gameFinished) return;

    if (keys.left) {
        alice.vx = -alice.speed;
        alice.facing = 'left';
        alice.animFrame += 0.2;
    } else if (keys.right) {
        alice.vx = alice.speed;
        alice.facing = 'right';
        alice.animFrame += 0.2;
    } else {
        alice.vx = 0;
    }

    alice.vy += alice.gravity;
    alice.x += alice.vx;
    alice.y += alice.vy;

    if (alice.y + alice.height >= GROUND_Y) {
        alice.y = GROUND_Y - alice.height;
        alice.vy = 0;
        alice.grounded = true;
    }

    if (alice.x < 10) alice.x = 10;
    if (alice.x + alice.width > canvas.width - 10) alice.x = canvas.width - 10 - alice.width;

    checkNPCProximity();
    portal.animFrame += 0.07;

    backgroundObjects.forEach(obj => {
        obj.y -= obj.speedY;
        obj.rot += 0.02;
        if (obj.y < -20) obj.y = GROUND_Y - 10;
    });
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const currentTheme = THEMES[(currentStage - 1) % THEMES.length];

    // 1. 라운드 배경
    let bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    bgGrad.addColorStop(0, currentTheme.bgTop);
    bgGrad.addColorStop(1, currentTheme.bgBottom);
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 2. 공중 물체 연출
    drawThemeObjects(currentTheme.objType);

    // 땅
    ctx.fillStyle = currentTheme.ground;
    ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);
    ctx.fillStyle = currentTheme.groundBorder;
    ctx.fillRect(0, GROUND_Y, canvas.width, 6);

    // 3. 테마별 고유 구조물/물건 그리기 (버섯 외 다채로운 구조물!)
    drawEnvironmentProps(currentTheme.prop);

    // 4. NPC
    const qData = QUIZ_DATABASE[currentStage - 1];
    drawNPC(npc.x, npc.y, qData.type, qData.speaker);

    // 5. 포탈
    if (portalActive) {
        drawPortal(portal.x, portal.y);
    }

    // 6. 앨리스
    drawAlice(alice.x, alice.y, alice.facing, alice.animFrame);
}

// 배경 공중 오브젝트
function drawThemeObjects(type) {
    ctx.save();
    backgroundObjects.forEach(obj => {
        ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
        ctx.strokeStyle = "rgba(255, 255, 255, 0.6)";
        ctx.lineWidth = 1.5;

        if (type === 'stars') {
            ctx.beginPath();
            ctx.arc(obj.x, obj.y, obj.size / 3, 0, Math.PI * 2);
            ctx.fill();
        } else if (type === 'spores') {
            ctx.fillStyle = "rgba(167, 243, 208, 0.6)";
            ctx.beginPath();
            ctx.arc(obj.x, obj.y, obj.size / 2, 0, Math.PI * 2);
            ctx.fill();
        } else if (type === 'cards') {
            ctx.save();
            ctx.translate(obj.x, obj.y);
            ctx.rotate(obj.rot);
            ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
            ctx.fillRect(-6, -9, 12, 18);
            ctx.fillStyle = "rgba(239, 68, 68, 0.8)";
            ctx.beginPath();
            ctx.arc(0, 0, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        } else if (type === 'clocks') {
            ctx.save();
            ctx.translate(obj.x, obj.y);
            ctx.rotate(obj.rot);
            ctx.beginPath();
            ctx.moveTo(0, 0); ctx.lineTo(0, -10);
            ctx.moveTo(0, 0); ctx.lineTo(6, 0);
            ctx.stroke();
            ctx.restore();
        } else if (type === 'bubbles') {
            ctx.fillStyle = "rgba(186, 230, 253, 0.4)";
            ctx.beginPath();
            ctx.arc(obj.x, obj.y, obj.size, 0, Math.PI * 2);
            ctx.fill();
        }
    });
    ctx.restore();
}

// 테마에 알맞게 바뀌는 주변 배치 물건들
function drawEnvironmentProps(propType) {
    if (propType === 'mushrooms') {
        drawMushroom(120, GROUND_Y, "#ef4444");
        drawMushroom(660, GROUND_Y, "#38bdf8");
    } else if (propType === 'clocktowers') {
        drawClockTower(120, GROUND_Y);
        drawClockTower(660, GROUND_Y);
    } else if (propType === 'rosearches') {
        drawRoseArch(130, GROUND_Y);
        drawRoseArch(650, GROUND_Y);
    } else if (propType === 'keyholes') {
        drawKeyholeProp(120, GROUND_Y);
        drawKeyholeProp(660, GROUND_Y);
    } else if (propType === 'crystals') {
        drawCrystalProp(120, GROUND_Y);
        drawCrystalProp(660, GROUND_Y);
    }
}

// 버섯
function drawMushroom(x, y, capColor) {
    ctx.fillStyle = "#fef08a";
    ctx.fillRect(x - 7, y - 22, 14, 22);
    ctx.fillStyle = capColor;
    ctx.beginPath();
    ctx.arc(x, y - 22, 20, Math.PI, 0, false);
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(x - 7, y - 28, 3, 0, Math.PI * 2);
    ctx.arc(x + 7, y - 26, 2.5, 0, Math.PI * 2);
    ctx.fill();
}

// 마법 시계탑
function drawClockTower(x, y) {
    ctx.fillStyle = "#facc15";
    ctx.fillRect(x - 12, y - 70, 24, 70);
    ctx.fillStyle = "#78350f";
    ctx.fillRect(x - 10, y - 68, 20, 68);
    // 시계판
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(x, y - 50, 12, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x, y - 50); ctx.lineTo(x, y - 57);
    ctx.moveTo(x, y - 50); ctx.lineTo(x + 5, y - 50);
    ctx.stroke();
}

// 장미 아치
function drawRoseArch(x, y) {
    ctx.strokeStyle = "#4d7c0f";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(x, y, 30, Math.PI, 0);
    ctx.stroke();

    ctx.fillStyle = "#f43f5e";
    ctx.beginPath();
    ctx.arc(x - 30, y - 5, 7, 0, Math.PI * 2);
    ctx.arc(x + 30, y - 5, 7, 0, Math.PI * 2);
    ctx.arc(x, y - 30, 8, 0, Math.PI * 2);
    ctx.fill();
}

// 거대 열쇠 구멍
function drawKeyholeProp(x, y) {
    ctx.fillStyle = "#facc15";
    ctx.beginPath();
    ctx.arc(x, y - 40, 16, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(x - 16, y - 40, 32, 40);

    ctx.fillStyle = "#0f172a";
    ctx.beginPath();
    ctx.arc(x, y - 42, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x - 4, y - 40); ctx.lineTo(x + 4, y - 40);
    ctx.lineTo(x + 6, y - 20); ctx.lineTo(x - 6, y - 20);
    ctx.fill();
}

// 빛나는 수정
function drawCrystalProp(x, y) {
    ctx.fillStyle = "#38bdf8";
    ctx.beginPath();
    ctx.moveTo(x, y - 50);
    ctx.lineTo(x + 15, y - 20);
    ctx.lineTo(x, y);
    ctx.lineTo(x - 15, y - 20);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#7dd3fc";
    ctx.beginPath();
    ctx.moveTo(x, y - 50);
    ctx.lineTo(x + 15, y - 20);
    ctx.lineTo(x, y - 20);
    ctx.fill();
}

// 앨리스 그리기
function drawAlice(x, y, facing, frame) {
    ctx.save();
    let headY = y + 14;

    ctx.fillStyle = "#facc15";
    ctx.beginPath();
    ctx.arc(x + 19, headY - 2, 16, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#0f172a";
    ctx.fillRect(x + 11, headY - 16, 16, 5);
    ctx.beginPath();
    ctx.arc(x + 19, headY - 17, 5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#ffedd5";
    ctx.beginPath();
    ctx.arc(x + 19, headY, 11, 0, Math.PI * 2);
    ctx.fill();

    let eyeL_X = facing === 'right' ? x + 17 : x + 13;
    let eyeR_X = facing === 'right' ? x + 24 : x + 20;

    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(eyeL_X, headY - 1, 3.2, 0, Math.PI * 2);
    ctx.arc(eyeR_X, headY - 1, 3.2, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#2563eb";
    ctx.beginPath();
    ctx.arc(eyeL_X + (facing==='right'?0.6:-0.6), headY - 1, 2, 0, Math.PI * 2);
    ctx.arc(eyeR_X + (facing==='right'?0.6:-0.6), headY - 1, 2, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "#e11d48";
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.arc(x + 19, headY + 3, 3, 0.1 * Math.PI, 0.9 * Math.PI);
    ctx.stroke();

    let skirtSway = Math.sin(frame) * 2;
    ctx.fillStyle = "#3b82f6";
    ctx.beginPath();
    ctx.moveTo(x + 9, headY + 10);
    ctx.lineTo(x + 29, headY + 10);
    ctx.lineTo(x + 35 + skirtSway, y + 46);
    ctx.lineTo(x + 3 - skirtSway, y + 46);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(x + 13, headY + 11, 12, 22);

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(x + 11, y + 46, 6, 8);
    ctx.fillRect(x + 21, y + 46, 6, 8);

    ctx.fillStyle = "#0f172a";
    ctx.fillRect(x + 9, y + 53, 8, 3);
    ctx.fillRect(x + 21, y + 53, 8, 3);

    ctx.restore();
}

// NPC 그리기
function drawNPC(x, y, type, name) {
    ctx.save();

    if (type === 'cat') {
        ctx.fillStyle = "#a855f7";
        ctx.beginPath();
        ctx.arc(x + 25, y + 35, 22, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#f43f5e";
        ctx.fillRect(x + 12, y + 22, 26, 4);
        ctx.fillRect(x + 10, y + 32, 30, 4);

        ctx.fillStyle = "#a855f7";
        ctx.beginPath();
        ctx.moveTo(x + 6, y + 20); ctx.lineTo(x + 15, y + 2); ctx.lineTo(x + 22, y + 18); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(x + 44, y + 20); ctx.lineTo(x + 35, y + 2); ctx.lineTo(x + 28, y + 18); ctx.fill();

        ctx.fillStyle = "#facc15";
        ctx.beginPath();
        ctx.arc(x + 16, y + 26, 5, 0, Math.PI * 2);
        ctx.arc(x + 34, y + 26, 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(x + 25, y + 36, 14, 0, Math.PI);
        ctx.fill();
        ctx.strokeStyle = "#000";
        ctx.lineWidth = 1.2;
        for(let i=-10; i<=10; i+=4) {
            ctx.beginPath();
            ctx.moveTo(x + 25 + i, y + 36);
            ctx.lineTo(x + 25 + i, y + 46);
            ctx.stroke();
        }
    } 
    else if (type === 'hatter') {
        ctx.fillStyle = "#f97316";
        ctx.beginPath();
        ctx.arc(x + 25, y + 38, 16, 0, Math.PI*2);
        ctx.fill();

        ctx.fillStyle = "#ffedd5";
        ctx.fillRect(x + 14, y + 28, 22, 20);

        ctx.fillStyle = "#15803d";
        ctx.fillRect(x + 8, y + 2, 34, 26);
        ctx.fillRect(x + 2, y + 24, 46, 6);

        ctx.fillStyle = "#fff";
        ctx.fillRect(x + 12, y + 8, 12, 12);
        ctx.fillStyle = "#000";
        ctx.font = "bold 8px sans-serif";
        ctx.fillText("10/6", x + 13, y + 17);
    }
    else if (type === 'queen') {
        ctx.fillStyle = "#dc2626";
        ctx.fillRect(x + 8, y + 32, 34, 34);

        ctx.fillStyle = "#ffedd5";
        ctx.fillRect(x + 14, y + 16, 22, 18);

        ctx.fillStyle = "#facc15";
        ctx.beginPath();
        ctx.moveTo(x + 12, y + 16); ctx.lineTo(x + 18, y + 2); ctx.lineTo(x + 25, y + 12); ctx.lineTo(x + 32, y + 2); ctx.lineTo(x + 38, y + 16);
        ctx.fill();
    }
    else if (type === 'rabbit') {
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(x + 12, y + 2, 8, 22);
        ctx.fillRect(x + 30, y + 2, 8, 22);

        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(x + 25, y + 30, 15, 0, Math.PI*2);
        ctx.fill();

        ctx.fillStyle = "#b91c1c";
        ctx.fillRect(x + 12, y + 42, 26, 22);
    }
    else {
        ctx.fillStyle = "#0284c7";
        for(let i=0; i<4; i++) {
            ctx.beginPath();
            ctx.arc(x + 12 + i*8, y + 25 + i*5, 11, 0, Math.PI*2);
            ctx.fill();
        }
    }

    ctx.fillStyle = "#facc15";
    ctx.font = "bold 14px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(name, x + 25, y - 10);

    ctx.restore();
}

// 포탈
function drawPortal(x, y) {
    ctx.save();
    ctx.translate(x + portal.width/2, y + portal.height/2);
    ctx.rotate(portal.animFrame);

    let grad = ctx.createRadialGradient(0, 0, 4, 0, 0, 32);
    grad.addColorStop(0, "#ffffff");
    grad.addColorStop(0.4, "#a855f7");
    grad.addColorStop(0.8, "#06b6d4");
    grad.addColorStop(1, "transparent");

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.ellipse(0, 0, 24, 38, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "#facc15";
    ctx.lineWidth = 2.5;
    ctx.stroke();

    ctx.restore();
}

function gameLoop() {
    update();
    draw();
    if (!gameFinished) {
        requestAnimationFrame(gameLoop);
    }
}

window.onload = () => {
    initGame();
};
</script>
