<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>뽁뽁이 비닐 오비</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
            font-family: 'Arial', sans-serif;
            user-select: none;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.3);
            border-radius: 12px;
            overflow: hidden;
            border: 3px solid #333;
        }

        canvas {
            background: linear-gradient(to bottom, #1e1e2f, #2a2a40);
            display: block;
        }

        #ui {
            display: flex;
            justify-content: space-between;
            width: 450px;
            margin-bottom: 12px;
            font-size: 20px;
            font-weight: bold;
        }

        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        button {
            padding: 14px 30px;
            font-size: 18px;
            font-weight: bold;
            background-color: #00ffcc;
            color: #000;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }
        button:hover { background-color: #00b386; color: white; }
    </style>
</head>
<body>

    <div id="ui">
        <div>현재 높이: <span id="score" style="color: #00ffcc;">0</span> 층</div>
        <div style="font-size: 14px; color: #aaa; align-self: center;">(힐링패드 빈도 대폭 감소!)</div>
    </div>

    <div id="game-container">
        <div id="overlay">
            <h1 style="color: #ff6b81; margin-bottom: 10px;">뽁뽁이 비닐 오비 🫧</h1>
            <p style="color: #ccc; margin-bottom: 20px; line-height: 1.6;">
                <b>A / D</b> 또는 <b>좌 / 우 방향키</b>: 이동<br>
                <b>W</b> 또는 <b>스페이스바</b>: 수동 점프<br>
                가끔 등장하는 분홍빛 <b>힐링패드</b> 위에 올라가면 소리가 계속 납니다!
            </p>
            <button onclick="startGame()">오비 시작하기</button>
        </div>
        <canvas id="canvas" width="450" height="600"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');
        const overlay = document.getElementById('overlay');

        let isPlaying = false;
        let score = 0;
        let cameraY = 0;
        let audioCtx = null;
        let healTimer = 0;

        function playKeySound() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.025);

                gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.025);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.025);
            } catch (e) {}
        }

        let player = {
            x: 210,
            y: 480,
            width: 24,
            height: 24,
            vx: 0,
            vy: 0,
            speed: 4.5,
            jumpForce: -9.5,
            isGrounded: false,
            jumpsLeft: 2
        };

        let platforms = [];
        let keys = { left: false, right: false };

        window.addEventListener('keydown', (e) => {
            if (!isPlaying) return;
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
            
            if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
                if (player.jumpsLeft > 0) {
                    player.vy = player.jumpForce;
                    player.jumpsLeft--;
                    player.isGrounded = false;
                    playKeySound();
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
        });

        function startGame() {
            isPlaying = true;
            score = 0;
            cameraY = 0;
            player.x = 210;
            player.y = 480;
            player.vx = 0;
            player.vy = 0;
            player.jumpsLeft = 2;
            player.isGrounded = false;
            healTimer = 0;

            platforms = [
                { x: 180, y: 530, width: 90, height: 20, isHeal: false },
                { x: 90, y: 430, width: 90, height: 20, isHeal: false },
                { x: 270, y: 340, width: 90, height: 20, isHeal: false },
                { x: 140, y: 250, width: 110, height: 20, isHeal: true }, // 가끔 하나씩 등장
                { x: 210, y: 160, width: 90, height: 20, isHeal: false },
                { x: 90, y: 70, width: 90, height: 20, isHeal: false }
            ];

            overlay.style.display = 'none';
            loop();
        }

        function update() {
            if (!isPlaying) return;

            if (keys.left) player.vx = -player.speed;
            else if (keys.right) player.vx = player.speed;
            else player.vx = 0;

            player.x += player.vx;

            if (player.x < -player.width) player.x = canvas.width;
            if (player.x > canvas.width) player.x = -player.width;

            player.vy += 0.38;
            player.y += player.vy;

            let targetCameraY = player.y - 250;
            if (targetCameraY < cameraY) {
                cameraY = targetCameraY;
                let currentHeight = Math.floor(Math.abs(cameraY) / 12);
                if (currentHeight > score) {
                    score = currentHeight;
                    scoreDisplay.textContent = score;
                }
            }

            let landing = false;
            let standingOnHeal = false;

            if (player.vy > 0) {
                for (let p of platforms) {
                    if (
                        player.x + player.width > p.x &&
                        player.x < p.x + p.width &&
                        player.y + player.height >= p.y &&
                        player.y + player.height <= p.y + 16
                    ) {
                        player.y = p.y - player.height;
                        player.vy = 0;
                        
                        if (!player.isGrounded) {
                            playKeySound();
                        }

                        landing = true;
                        player.jumpsLeft = 2;

                        if (p.isHeal) {
                            standingOnHeal = true;
                        }
                    }
                }
            }
            player.isGrounded = landing;

            if (landing && standingOnHeal) {
                healTimer++;
                if (healTimer % 8 === 0) {
                    playKeySound();
                }
            } else {
                healTimer = 0;
            }

            if (player.y > cameraY + canvas.height + 30) {
                player.y = cameraY + canvas.height - 50;
                player.vy = -10;
            }

            let highestPlatform = platforms[platforms.length - 1];
            if (highestPlatform.y > cameraY - 60) {
                let isHealChance = Math.random() < 0.10; // 확률을 10%로 대폭 낮춤
                let pWidth = isHealChance ? 110 : 90;
                let newX = Math.random() * (canvas.width - pWidth);
                let newY = highestPlatform.y - (65 + Math.random() * 35);
                platforms.push({ x: newX, y: newY, width: pWidth, height: 20, isHeal: isHealChance });
            }

            platforms = platforms.filter(p => p.y < cameraY + canvas.height + 100);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(0, -cameraY);

            for (let p of platforms) {
                if (p.isHeal) {
                    ctx.fillStyle = 'rgba(255, 105, 180, 0.3)';
                    ctx.strokeStyle = 'rgba(255, 182, 193, 0.9)';
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.roundRect(p.x, p.y, p.width, p.height, 6);
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = '#ff6b81';
                    ctx.font = 'bold 12px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('♥ HEAL ♥', p.x + p.width / 2, p.y + 14);
                } else {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.roundRect(p.x, p.y, p.width, p.height, 5);
                    ctx.fill();
                    ctx.stroke();

                    let bubbleRadius = 3.5;
                    let spacing = 16;
                    for (let bx = p.x + 10; bx < p.x + p.width - 5; bx += spacing) {
                        for (let by = p.y + 6; by < p.y + p.height - 4; by += 8) {
                            ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
                            ctx.beginPath();
                            ctx.arc(bx, by, bubbleRadius, 0, Math.PI * 2);
                            ctx.fill();

                            ctx.fillStyle = '#ffffff';
                            ctx.fillRect(bx - 1, by - 1, 1.5, 1.5);
                        }
                    }
                }
            }

            ctx.fillStyle = '#ffeb3b';
            ctx.beginPath();
            ctx.roundRect(player.x, player.y, player.width, player.height, 6);
            ctx.fill();
            
            ctx.fillStyle = '#000';
            ctx.fillRect(player.x + 5, player.y + 7, 4, 4);
            ctx.fillRect(player.x + 15, player.y + 7, 4, 4);

            ctx.restore();
        }

        function loop() {
            if (!isPlaying) return;
            update();
            draw();
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
