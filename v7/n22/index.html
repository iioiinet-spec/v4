<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>NEON TETRIS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap');

  :root{
    --bg-deep:#060915;
    --bg-navy:#0b1030;
    --panel:#0e1436;
    --grid-line: rgba(140,160,255,0.08);
    --border-glow: rgba(90,120,255,0.35);
    --text-dim: #6b7bb8;
    --text-bright: #dbe3ff;
    --cyan:#00f0ff;
    --yellow:#ffe600;
    --purple:#c724ff;
    --green:#39ff8f;
    --red:#ff2d55;
    --blue:#2f6bff;
    --orange:#ff9500;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    height:100%;
    background:
      radial-gradient(ellipse at 20% -10%, rgba(90,60,220,0.25), transparent 55%),
      radial-gradient(ellipse at 100% 110%, rgba(0,180,255,0.12), transparent 50%),
      var(--bg-deep);
    color:var(--text-bright);
    font-family:'Rajdhani', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  .stage{
    display:flex;
    gap:28px;
    align-items:flex-start;
    padding:24px;
  }

  .title-wrap{
    position:relative;
    text-align:center;
    margin-bottom:14px;
  }
  .title{
    font-family:'Orbitron', sans-serif;
    font-weight:900;
    font-size:22px;
    letter-spacing:6px;
    background:linear-gradient(90deg,var(--cyan),var(--purple));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 0 30px rgba(120,80,255,0.35);
  }
  .subtitle{
    font-size:11px;
    letter-spacing:4px;
    color:var(--text-dim);
    margin-top:2px;
  }

  .board-frame{
    position:relative;
    padding:10px;
    background:linear-gradient(180deg, rgba(20,26,60,0.9), rgba(8,10,26,0.9));
    border:1px solid var(--border-glow);
    border-radius:10px;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.02) inset,
      0 0 40px rgba(60,80,220,0.18),
      0 20px 60px rgba(0,0,0,0.5);
  }

  #board{
    display:block;
    background:var(--bg-navy);
    border-radius:4px;
  }

  .side{
    display:flex;
    flex-direction:column;
    gap:16px;
    width:190px;
  }

  .panel{
    background:linear-gradient(180deg, rgba(20,26,60,0.85), rgba(8,10,26,0.85));
    border:1px solid var(--border-glow);
    border-radius:10px;
    padding:14px 16px;
    box-shadow:0 0 24px rgba(60,80,220,0.12);
  }

  .panel h3{
    font-family:'Orbitron', sans-serif;
    font-size:11px;
    letter-spacing:3px;
    color:var(--text-dim);
    margin-bottom:8px;
    font-weight:700;
  }

  #next-canvas{
    display:block;
    margin:0 auto;
    background:var(--bg-navy);
    border-radius:6px;
  }

  .stat-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:6px;
  }
  .stat-row:last-child{ margin-bottom:0; }
  .stat-label{
    font-size:11px;
    letter-spacing:2px;
    color:var(--text-dim);
  }
  .stat-value{
    font-family:'Orbitron', sans-serif;
    font-size:18px;
    font-weight:700;
    color:var(--text-bright);
    text-shadow:0 0 12px rgba(0,240,255,0.4);
  }

  .controls-list{
    list-style:none;
    font-size:12.5px;
    color:var(--text-dim);
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .controls-list kbd{
    display:inline-block;
    min-width:20px;
    text-align:center;
    padding:2px 6px;
    margin-right:8px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:4px;
    font-family:'Orbitron', sans-serif;
    font-size:10px;
    color:var(--text-bright);
  }

  .overlay{
    position:absolute;
    inset:10px;
    background:rgba(6,8,18,0.88);
    backdrop-filter: blur(2px);
    border-radius:6px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    text-align:center;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s ease;
  }
  .overlay.visible{
    opacity:1;
    pointer-events:auto;
  }
  .overlay .big{
    font-family:'Orbitron', sans-serif;
    font-size:26px;
    font-weight:900;
    letter-spacing:4px;
    color:var(--red);
    text-shadow:0 0 24px rgba(255,45,85,0.7);
  }
  .overlay .big.start{
    color:var(--cyan);
    text-shadow:0 0 24px rgba(0,240,255,0.7);
  }
  .overlay .score-final{
    font-size:14px;
    color:var(--text-dim);
    letter-spacing:2px;
  }
  .overlay button{
    font-family:'Orbitron', sans-serif;
    font-size:12px;
    letter-spacing:2px;
    padding:10px 22px;
    background:linear-gradient(90deg,var(--cyan),var(--purple));
    border:none;
    border-radius:6px;
    color:#06070f;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 0 20px rgba(120,80,255,0.5);
    transition:transform 0.15s ease;
  }
  .overlay button:hover{ transform:scale(1.05); }

  .pause-hint{
    text-align:center;
    font-size:11px;
    color:var(--text-dim);
    margin-top:10px;
    letter-spacing:1px;
  }

  .spin-toast{
    position:absolute;
    top:14px;
    left:50%;
    transform:translateX(-50%) translateY(-8px);
    font-family:'Orbitron', sans-serif;
    font-size:12.5px;
    font-weight:700;
    letter-spacing:2px;
    padding:7px 16px;
    border-radius:7px;
    background:rgba(10,14,32,0.82);
    border:1px solid rgba(255,255,255,0.18);
    color:#fff;
    text-shadow:0 0 12px rgba(199,36,255,0.6);
    opacity:0;
    pointer-events:none;
    transition:opacity 0.22s ease, transform 0.22s ease;
    white-space:nowrap;
    z-index:5;
  }
  .spin-toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  .mute-btn{
    position:absolute;
    top:0;
    right:0;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:6px;
    width:28px;
    height:28px;
    font-size:13px;
    cursor:pointer;
    color:var(--text-bright);
    transition:transform 0.15s ease, background 0.15s ease;
  }
  .mute-btn:hover{
    background:rgba(255,255,255,0.14);
    transform:scale(1.08);
  }
  .mute-btn.muted{
    opacity:0.5;
  }

  #combo-row .stat-value{
    color:var(--orange);
    text-shadow:0 0 12px rgba(255,149,0,0.6);
  }

  @keyframes board-shake{
    10%, 90% { transform: translate3d(-1px, 0, 0); }
    20%, 80% { transform: translate3d(2px, 0, 0); }
    30%, 50%, 70% { transform: translate3d(-5px, 0, 0); }
    40%, 60% { transform: translate3d(5px, 0, 0); }
  }
  .board-frame.shake{
    animation: board-shake 0.35s;
  }
  .board-frame.shake-strong{
    animation: board-shake 0.5s;
  }
</style>
</head>
<body>

<div class="stage">
  <div>
    <div class="title-wrap">
      <div class="title">NEON TETRIS</div>
      <div class="subtitle">BLOCK CASCADE</div>
      <button class="mute-btn" id="mute-btn" title="음소거 전환">🔊</button>
    </div>
    <div class="board-frame">
      <canvas id="board"></canvas>
      <div class="spin-toast" id="spin-toast"></div>
      <div class="overlay start visible" id="overlay">
        <div class="big start" id="overlay-title">NEON TETRIS</div>
        <div class="score-final" id="overlay-sub">스페이스 또는 버튼으로 시작</div>
        <button id="overlay-btn">시작하기</button>
      </div>
    </div>
    <div class="pause-hint">P : 일시정지</div>
  </div>

  <div class="side">
    <div class="panel">
      <h3>HOLD</h3>
      <canvas id="hold-canvas" width="120" height="90"></canvas>
    </div>
    <div class="panel">
      <h3>NEXT</h3>
      <canvas id="next-canvas" width="120" height="150"></canvas>
    </div>
    <div class="panel">
      <div class="stat-row"><span class="stat-label">SCORE</span><span class="stat-value" id="score">0</span></div>
      <div class="stat-row"><span class="stat-label">BEST</span><span class="stat-value" id="best">0</span></div>
      <div class="stat-row"><span class="stat-label">LINES</span><span class="stat-value" id="lines">0</span></div>
      <div class="stat-row"><span class="stat-label">LEVEL</span><span class="stat-value" id="level">1</span></div>
      <div class="stat-row" id="combo-row" style="display:none;"><span class="stat-label">COMBO</span><span class="stat-value" id="combo">0</span></div>
    </div>
    <div class="panel">
      <h3>CONTROLS</h3>
      <ul class="controls-list">
        <li><kbd>&larr;</kbd><kbd>&rarr;</kbd> 좌우 이동</li>
        <li><kbd>&uarr;</kbd> 회전</li>
        <li><kbd>&darr;</kbd> 빠르게 내리기</li>
        <li><kbd>SPACE</kbd> 즉시 낙하</li>
        <li><kbd>B</kbd> 보관함</li>
        <li><kbd>M</kbd> 음소거</li>
        <li><kbd>P</kbd> 일시정지</li>
      </ul>
    </div>
  </div>
</div>

<script>
(function(){
  const COLS = 10, ROWS = 20;
  const CELL = 28;
  const boardCanvas = document.getElementById('board');
  boardCanvas.width = COLS * CELL;
  boardCanvas.height = ROWS * CELL;
  const ctx = boardCanvas.getContext('2d');

  const nextCanvas = document.getElementById('next-canvas');
  const nctx = nextCanvas.getContext('2d');

  const holdCanvas = document.getElementById('hold-canvas');
  const hctx = holdCanvas.getContext('2d');

  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const linesEl = document.getElementById('lines');
  const levelEl = document.getElementById('level');
  const comboRow = document.getElementById('combo-row');
  const comboEl = document.getElementById('combo');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlay-title');
  const overlaySub = document.getElementById('overlay-sub');
  const overlayBtn = document.getElementById('overlay-btn');
  const muteBtn = document.getElementById('mute-btn');
  const boardFrame = document.querySelector('.board-frame');

  const COLORS = {
    I: '#00f0ff',
    O: '#ffe600',
    T: '#c724ff',
    S: '#39ff8f',
    Z: '#ff2d55',
    J: '#2f6bff',
    L: '#ff9500'
  };

  const SHAPES = {
    I: [[0,1],[1,1],[2,1],[3,1]],
    O: [[1,0],[2,0],[1,1],[2,1]],
    T: [[1,0],[0,1],[1,1],[2,1]],
    S: [[1,0],[2,0],[0,1],[1,1]],
    Z: [[0,0],[1,0],[1,1],[2,1]],
    J: [[0,0],[0,1],[1,1],[2,1]],
    L: [[2,0],[0,1],[1,1],[2,1]]
  };
  const TYPES = Object.keys(SHAPES);

  let grid, current, nextQueue, pos, rotationState;
  let hold = null, canHold = true;
  let lastActionWasRotate = false;
  let toastTimer = null;
  let score, lines, level, dropInterval, dropTimer, lastTime;
  let running = false, paused = false, gameOverFlag = false;
  let rafId = null;
  let bag = [];
  let combo = -1;
  let backToBack = false;
  let bestScore = 0;
  let particles = [];
  let soundOn = true;
  let audioCtx = null;
  let bgmTimer = null;
  let bgmIndex = 0;

  function newGrid(){
    return Array.from({length: ROWS}, () => Array(COLS).fill(null));
  }

  function randomType(){
    return TYPES[Math.floor(Math.random() * TYPES.length)];
  }

  function shuffledBag(){
    const arr = TYPES.slice();
    for (let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function nextFromBag(){
    if (bag.length === 0) bag = shuffledBag();
    return bag.pop();
  }

  // ---------- Sound (procedural, Web Audio API — no external assets) ----------
  function ensureAudio(){
    if (!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function beep(freq, duration, type, gainValue, startDelay){
    if (!soundOn) return;
    const ac = ensureAudio();
    if (!ac) return;
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    osc.connect(gain);
    gain.connect(ac.destination);
    const t = ac.currentTime + (startDelay || 0);
    const g = gainValue || 0.1;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.linearRampToValueAtTime(g, t + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
    osc.start(t);
    osc.stop(t + duration + 0.02);
  }

  const SFX = {
    move: () => beep(220, 0.03, 'square', 0.05),
    rotate: () => beep(330, 0.05, 'square', 0.07),
    lock: () => beep(140, 0.05, 'square', 0.08),
    hold: () => beep(500, 0.05, 'triangle', 0.06),
    hardDrop: () => beep(110, 0.08, 'square', 0.09),
    clear: (n) => { for (let i = 0; i < n; i++) beep(440 + i * 130, 0.1, 'square', 0.1, i * 0.05); },
    spin: () => beep(700, 0.14, 'sawtooth', 0.09),
    combo: (n) => beep(600 + Math.min(n, 8) * 40, 0.08, 'triangle', 0.08),
    levelup: () => { beep(523, 0.1, 'square', 0.1, 0); beep(659, 0.1, 'square', 0.1, 0.1); beep(784, 0.16, 'square', 0.1, 0.2); },
    gameover: () => { beep(392, 0.15, 'sawtooth', 0.1, 0); beep(330, 0.15, 'sawtooth', 0.1, 0.15); beep(261, 0.32, 'sawtooth', 0.12, 0.3); }
  };

  const BGM_NOTES = [659.25, 493.88, 523.25, 587.33, 523.25, 493.88, 440.00, 440.00,
                      523.25, 659.25, 587.33, 523.25, 493.88, 493.88, 523.25, 587.33];

  function startBGM(){
    stopBGM();
    bgmIndex = 0;
    bgmTimer = setInterval(() => {
      if (!soundOn || paused || !running) return;
      beep(BGM_NOTES[bgmIndex % BGM_NOTES.length], 0.16, 'triangle', 0.035);
      bgmIndex++;
    }, 210);
  }

  function stopBGM(){
    if (bgmTimer) clearInterval(bgmTimer);
    bgmTimer = null;
  }

  function makePiece(type){
    // cells within a 4x4 or 3x2 local box, we normalize using a rotation matrix approach
    return {
      type,
      cells: SHAPES[type].map(c => c.slice()),
      x: 3,
      y: -1,
      rotationIndex: 0
    };
  }

  function getCells(piece){
    return piece.cells.map(([cx, cy]) => [cx + piece.x, cy + piece.y]);
  }

  function collides(piece, offsetX, offsetY, cells){
    const testCells = (cells || piece.cells).map(([cx, cy]) => [cx + piece.x + offsetX, cy + piece.y + offsetY]);
    for (const [x, y] of testCells){
      if (x < 0 || x >= COLS || y >= ROWS) return true;
      if (y >= 0 && grid[y][x]) return true;
    }
    return false;
  }

  function rotateCells(cells, type){
    if (type === 'O') return cells.map(c => c.slice());
    // rotate around approximate center (1.5,1.5 for I, 1,1 for others)
    const center = type === 'I' ? 1.5 : 1;
    return cells.map(([x, y]) => {
      const nx = center - (y - center);
      const ny = center + (x - center);
      return [Math.round(nx), Math.round(ny)];
    });
  }

  const NEXT_PREVIEW_COUNT = 2;

  function refillQueue(){
    while (nextQueue.length < NEXT_PREVIEW_COUNT){
      nextQueue.push(makePiece(nextFromBag()));
    }
  }

  function spawnPiece(){
    refillQueue();
    current = nextQueue.shift();
    current.x = 3; current.y = -1;
    refillQueue();
    canHold = true;
    lastActionWasRotate = false;
    drawNext();
    if (collides(current, 0, 0)){
      endGame();
    }
  }

  function holdPiece(){
    if (!canHold) return;
    canHold = false;
    SFX.hold();
    if (hold === null){
      hold = makePiece(current.type);
      refillQueue();
      current = nextQueue.shift();
      current.x = 3; current.y = -1;
      refillQueue();
      drawNext();
    } else {
      const heldType = hold.type;
      hold = makePiece(current.type);
      current = makePiece(heldType);
      current.x = 3; current.y = -1;
    }
    lastActionWasRotate = false;
    if (collides(current, 0, 0)){
      endGame();
    }
    dropTimer = 0;
    drawHold();
  }

  function isBlocked(x, y){
    if (x < 0 || x >= COLS || y >= ROWS) return true;
    if (y < 0) return false;
    return !!grid[y][x];
  }

  // 3-corner rule for T, immobility rule (all-spin) for every other piece
  function checkSpin(){
    if (!lastActionWasRotate) return null;

    if (current.type === 'O'){
      // Easter egg: O has no real rotation, but if the player still hits
      // rotate while it's boxed in on left/right/down, we honor the effort.
      const stuckLeft = collides(current, -1, 0);
      const stuckRight = collides(current, 1, 0);
      const stuckDown = collides(current, 0, 1);
      if (stuckLeft && stuckRight && stuckDown) return 'o';
      return null;
    }

    if (current.type === 'T'){
      const corners = [
        [current.x, current.y],         // top-left
        [current.x + 2, current.y],     // top-right
        [current.x, current.y + 2],     // bottom-left
        [current.x + 2, current.y + 2]  // bottom-right
      ];
      const filled = corners.map(([x, y]) => isBlocked(x, y));
      const frontByRotation = {
        0: [0, 1], // stem up -> front = top corners
        1: [1, 3], // stem right -> front = right corners
        2: [2, 3], // stem down -> front = bottom corners
        3: [0, 2]  // stem left -> front = left corners
      };
      const frontIdx = frontByRotation[current.rotationIndex] || [0, 1];
      const frontFilled = frontIdx.every(i => filled[i]);
      const totalFilled = filled.filter(Boolean).length;
      if (totalFilled >= 3){
        return frontFilled ? 'full' : 'mini';
      }
      return null;
    }

    // all-spin: piece can't move left, right, or down right after a rotation
    const stuckLeft = collides(current, -1, 0);
    const stuckRight = collides(current, 1, 0);
    const stuckDown = collides(current, 0, 1);
    if (stuckLeft && stuckRight && stuckDown) return 'all';
    return null;
  }

  function showSpinToast(text){
    const el = document.getElementById('spin-toast');
    if (!el) return;
    el.textContent = text;
    el.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 1100);
  }

  function lockPiece(){
    const spin = checkSpin();
    const cells = getCells(current);
    for (const [x, y] of cells){
      if (y < 0) { endGame(); return; }
      grid[y][x] = current.type;
    }
    SFX.lock();
    clearLines(spin);
    spawnPiece();
  }

  function clearLines(spinType){
    // capture full-row info first (for particles) before mutating the grid
    const clearedRowsInfo = [];
    for (let y = 0; y < ROWS; y++){
      if (grid[y].every(cell => cell)){
        clearedRowsInfo.push({ y, colors: grid[y].slice() });
      }
    }
    const cleared = clearedRowsInfo.length;

    if (cleared > 0){
      for (let y = ROWS - 1; y >= 0; y--){
        if (grid[y].every(cell => cell)){
          grid.splice(y, 1);
          grid.unshift(Array(COLS).fill(null));
          y++;
        }
      }
      spawnClearParticles(clearedRowsInfo);
    }

    let basePoints = 0;
    let message = '';

    if (spinType === 'full'){
      const table = [400, 800, 1200, 1600];
      basePoints = table[Math.min(cleared, table.length - 1)] * level;
      const names = ['', 'SINGLE', 'DOUBLE', 'TRIPLE'];
      message = cleared === 0 ? 'T-SPIN' : `T-SPIN ${names[Math.min(cleared, 3)]}`;
    } else if (spinType === 'mini'){
      const table = [100, 200, 400, 400];
      basePoints = table[Math.min(cleared, table.length - 1)] * level;
      const names = ['', 'SINGLE', 'DOUBLE'];
      message = cleared === 0 ? 'T-SPIN MINI' : `T-SPIN MINI ${names[Math.min(cleared, 2)]}`;
    } else if (spinType === 'all'){
      const table = [100, 200, 400, 600];
      basePoints = table[Math.min(cleared, table.length - 1)] * level;
      const names = ['', 'SINGLE', 'DOUBLE', 'TRIPLE'];
      message = cleared === 0 ? 'SPIN' : `SPIN ${names[Math.min(cleared, 3)]}`;
    } else if (spinType === 'o'){
      const table = [50, 100, 200, 300];
      basePoints = table[Math.min(cleared, table.length - 1)] * level;
      const names = ['', 'SINGLE', 'DOUBLE', 'TRIPLE'];
      message = cleared === 0 ? 'O-SPIN?!' : `O-SPIN ${names[Math.min(cleared, 3)]}`;
    } else if (cleared > 0){
      basePoints = [0, 100, 300, 500, 800][cleared] * level;
    }

    // back-to-back: tetris (4-line) or any spin-clear counts as a "hard" clear
    let b2bApplied = false;
    if (cleared > 0){
      const isHardClear = cleared === 4 || !!spinType;
      if (isHardClear && backToBack){
        basePoints = Math.floor(basePoints * 1.5);
        b2bApplied = true;
      }
      backToBack = isHardClear;
      combo++;
    } else {
      combo = -1;
    }

    let comboBonus = 0;
    if (combo > 0){
      comboBonus = 50 * combo * level;
    }

    const totalPoints = basePoints + comboBonus;

    if (cleared > 0 || spinType){
      score += totalPoints;
      lines += cleared;
      const newLevel = Math.floor(lines / 10) + 1;
      if (newLevel !== level){
        level = newLevel;
        dropInterval = Math.max(120, 800 - (level - 1) * 65);
        SFX.levelup();
      }
      if (score > bestScore){
        bestScore = score;
        bestEl.textContent = bestScore;
      }
      updateStats();
    }

    updateComboDisplay();

    if (message){
      showSpinToast((b2bApplied ? 'BACK-TO-BACK ' : '') + message);
      SFX.spin();
      triggerShake(cleared >= 2 ? 'strong' : 'light');
    } else if (cleared > 0){
      SFX.clear(cleared);
      if (combo > 0) SFX.combo(combo);
      triggerShake(cleared >= 3 ? 'strong' : 'light');
    }
  }

  function updateComboDisplay(){
    if (combo > 0){
      comboRow.style.display = '';
      comboEl.textContent = combo;
    } else {
      comboRow.style.display = 'none';
    }
  }

  function triggerShake(strength){
    boardFrame.classList.remove('shake', 'shake-strong');
    void boardFrame.offsetWidth; // restart animation
    boardFrame.classList.add(strength === 'strong' ? 'shake-strong' : 'shake');
    setTimeout(() => boardFrame.classList.remove('shake', 'shake-strong'), 520);
  }

  function spawnClearParticles(rowsInfo){
    for (const { y, colors } of rowsInfo){
      for (let x = 0; x < COLS; x++){
        const type = colors[x];
        if (!type) continue;
        const cx = x * CELL + CELL / 2;
        const cy = y * CELL + CELL / 2;
        for (let i = 0; i < 5; i++){
          particles.push({
            x: cx, y: cy,
            vx: (Math.random() - 0.5) * 4.5,
            vy: -Math.random() * 3 - 0.5,
            life: 1,
            decay: 0.018 + Math.random() * 0.02,
            size: 2 + Math.random() * 2.5,
            color: COLORS[type]
          });
        }
      }
    }
  }

  function updateAndDrawParticles(){
    if (particles.length === 0) return;
    ctx.save();
    for (let i = particles.length - 1; i >= 0; i--){
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.14;
      p.life -= p.decay;
      if (p.life <= 0){ particles.splice(i, 1); continue; }
      ctx.globalAlpha = Math.max(p.life, 0);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function updateStats(){
    scoreEl.textContent = score;
    linesEl.textContent = lines;
    levelEl.textContent = level;
  }

  function hardDrop(){
    let dist = 0;
    while (!collides(current, 0, dist + 1)) dist++;
    current.y += dist;
    score += dist * 2;
    updateStats();
    SFX.hardDrop();
    lockPiece();
    dropTimer = 0;
  }

  function softDrop(){
    if (!collides(current, 0, 1)){
      current.y++;
      score += 1;
      lastActionWasRotate = false;
      updateStats();
    } else {
      lockPiece();
    }
    dropTimer = 0;
  }

  function move(dx){
    if (!collides(current, dx, 0)){
      current.x += dx;
      lastActionWasRotate = false;
      SFX.move();
    }
  }

  function rotate(){
    const rotated = rotateCells(current.cells, current.type);
    const kicks = [0, -1, 1, -2, 2];
    for (const k of kicks){
      if (!collides(current, k, 0, rotated)){
        current.cells = rotated;
        current.x += k;
        current.rotationIndex = (current.rotationIndex + 1) % 4;
        lastActionWasRotate = true;
        SFX.rotate();
        return;
      }
    }
  }

  function hexToRgba(hex, alpha){
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
  }

  function roundRectPath(c, x, y, w, h, r){
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function drawGlassCell(c, px, py, size, color, ghost){
    const radius = Math.max(3, size * 0.2);
    if (ghost){
      c.save();
      roundRectPath(c, px, py, size, size, radius);
      c.setLineDash([3, 3]);
      c.lineWidth = 1.5;
      c.strokeStyle = hexToRgba(color, 0.55);
      c.stroke();
      c.restore();
      return;
    }

    c.save();
    roundRectPath(c, px, py, size, size, radius);
    c.clip();

    // frosted base fill
    const grad = c.createLinearGradient(px, py, px, py + size);
    grad.addColorStop(0, hexToRgba(color, 0.5));
    grad.addColorStop(1, hexToRgba(color, 0.22));
    c.fillStyle = grad;
    c.fillRect(px, py, size, size);

    // faint frosted noise layer for glass feel
    c.fillStyle = 'rgba(255,255,255,0.06)';
    c.fillRect(px, py, size, size);

    // diagonal glare streak
    c.beginPath();
    c.moveTo(px, py);
    c.lineTo(px + size * 0.65, py);
    c.lineTo(px, py + size * 0.65);
    c.closePath();
    c.fillStyle = 'rgba(255,255,255,0.32)';
    c.fill();

    // soft bottom shadow inside glass
    c.fillStyle = 'rgba(0,0,0,0.12)';
    c.fillRect(px, py + size * 0.72, size, size * 0.28);

    c.restore();

    // outer border
    roundRectPath(c, px, py, size, size, radius);
    c.lineWidth = 1.3;
    c.strokeStyle = hexToRgba(color, 0.85);
    c.stroke();
  }

  function drawCell(c, x, y, color, ghost){
    const px = x * CELL + 2, py = y * CELL + 2;
    drawGlassCell(c, px, py, CELL - 4, color, ghost);
  }

  function drawGrid(){
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--grid-line');
    ctx.lineWidth = 1;
    for (let x = 0; x <= COLS; x++){
      ctx.beginPath();
      ctx.moveTo(x * CELL + 0.5, 0);
      ctx.lineTo(x * CELL + 0.5, ROWS * CELL);
      ctx.stroke();
    }
    for (let y = 0; y <= ROWS; y++){
      ctx.beginPath();
      ctx.moveTo(0, y * CELL + 0.5);
      ctx.lineTo(COLS * CELL, y * CELL + 0.5);
      ctx.stroke();
    }
  }

  function draw(){
    ctx.clearRect(0, 0, boardCanvas.width, boardCanvas.height);
    drawGrid();

    // locked cells
    for (let y = 0; y < ROWS; y++){
      for (let x = 0; x < COLS; x++){
        if (grid[y][x]) drawCell(ctx, x, y, COLORS[grid[y][x]]);
      }
    }

    if (current){
      // ghost
      let ghostY = 0;
      while (!collides(current, 0, ghostY + 1)) ghostY++;
      for (const [cx, cy] of current.cells){
        const gx = cx + current.x, gy = cy + current.y + ghostY;
        if (gy >= 0) drawCell(ctx, gx, gy, COLORS[current.type], true);
      }
      // current piece
      const cells = getCells(current);
      for (const [x, y] of cells){
        if (y >= 0) drawCell(ctx, x, y, COLORS[current.type]);
      }
    }

    updateAndDrawParticles();
  }

  function drawNext(){
    nctx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
    if (!nextQueue || nextQueue.length === 0) return;
    const cellSize = 20;
    const slotHeight = nextCanvas.height / NEXT_PREVIEW_COUNT;

    nextQueue.slice(0, NEXT_PREVIEW_COUNT).forEach((piece, idx) => {
      const cells = piece.cells;
      const xs = cells.map(c => c[0]), ys = cells.map(c => c[1]);
      const minX = Math.min(...xs), maxX = Math.max(...xs);
      const minY = Math.min(...ys), maxY = Math.max(...ys);
      const w = (maxX - minX + 1) * cellSize;
      const h = (maxY - minY + 1) * cellSize;
      const slotTop = idx * slotHeight;
      const offsetX = (nextCanvas.width - w) / 2 - minX * cellSize;
      const offsetY = slotTop + (slotHeight - h) / 2 - minY * cellSize;

      nctx.globalAlpha = idx === 0 ? 1 : 0.55;
      for (const [cx, cy] of cells){
        const px = offsetX + cx * cellSize + 1.5, py = offsetY + cy * cellSize + 1.5;
        drawGlassCell(nctx, px, py, cellSize - 3, COLORS[piece.type]);
      }
      nctx.globalAlpha = 1;

      if (idx > 0){
        nctx.strokeStyle = 'rgba(255,255,255,0.08)';
        nctx.lineWidth = 1;
        nctx.beginPath();
        nctx.moveTo(8, slotTop);
        nctx.lineTo(nextCanvas.width - 8, slotTop);
        nctx.stroke();
      }
    });
  }

  function drawHold(){
    hctx.clearRect(0, 0, holdCanvas.width, holdCanvas.height);
    if (!hold) return;
    const cellSize = 22;
    const cells = hold.cells;
    const xs = cells.map(c => c[0]), ys = cells.map(c => c[1]);
    const minX = Math.min(...xs), maxX = Math.max(...xs);
    const minY = Math.min(...ys), maxY = Math.max(...ys);
    const w = (maxX - minX + 1) * cellSize;
    const h = (maxY - minY + 1) * cellSize;
    const offsetX = (holdCanvas.width - w) / 2 - minX * cellSize;
    const offsetY = (holdCanvas.height - h) / 2 - minY * cellSize;
    hctx.globalAlpha = canHold ? 1 : 0.4;
    for (const [cx, cy] of cells){
      const px = offsetX + cx * cellSize + 1.5, py = offsetY + cy * cellSize + 1.5;
      drawGlassCell(hctx, px, py, cellSize - 3, COLORS[hold.type]);
    }
    hctx.globalAlpha = 1;
  }

  function gameLoop(time){
    if (!running || paused) { lastTime = time; rafId = requestAnimationFrame(gameLoop); return; }
    if (lastTime === undefined) lastTime = time;
    const delta = time - lastTime;
    lastTime = time;
    dropTimer += delta;
    if (dropTimer > dropInterval){
      if (!collides(current, 0, 1)){
        current.y++;
        lastActionWasRotate = false;
      } else {
        lockPiece();
      }
      dropTimer = 0;
    }
    draw();
    rafId = requestAnimationFrame(gameLoop);
  }

  function startGame(){
    grid = newGrid();
    score = 0; lines = 0; level = 1;
    dropInterval = 800;
    dropTimer = 0; lastTime = undefined;
    running = true; paused = false; gameOverFlag = false;
    hold = null; canHold = true;
    lastActionWasRotate = false;
    bag = [];
    combo = -1;
    backToBack = false;
    particles = [];
    updateComboDisplay();
    nextQueue = [];
    spawnPiece();
    drawHold();
    updateStats();
    overlay.classList.remove('visible');
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(gameLoop);
    ensureAudio();
    startBGM();
  }

  function endGame(){
    running = false;
    gameOverFlag = true;
    stopBGM();
    SFX.gameover();
    overlayTitle.textContent = 'GAME OVER';
    overlayTitle.classList.remove('start');
    const newBest = score > 0 && score >= bestScore;
    if (newBest) bestScore = score;
    bestEl.textContent = bestScore;
    overlaySub.textContent = `최종 점수: ${score}  ·  ${lines}줄 제거${newBest ? '  ·  NEW BEST!' : ''}`;
    overlayBtn.textContent = '다시하기';
    overlay.classList.add('visible');
  }

  function togglePause(){
    if (!running) return;
    paused = !paused;
    overlayTitle.classList.toggle('start', paused);
    overlayTitle.textContent = paused ? 'PAUSED' : '';
    overlaySub.textContent = paused ? '스페이스로 계속하기' : '';
    overlayBtn.textContent = paused ? '계속하기' : '';
    if (paused){
      overlay.classList.add('visible');
    } else {
      overlay.classList.remove('visible');
    }
  }

  function toggleMute(){
    soundOn = !soundOn;
    muteBtn.textContent = soundOn ? '🔊' : '🔇';
    muteBtn.classList.toggle('muted', !soundOn);
  }

  muteBtn.addEventListener('click', () => {
    ensureAudio();
    toggleMute();
  });

  overlayBtn.addEventListener('click', () => {
    if (paused){ togglePause(); return; }
    startGame();
  });

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space'){
      e.preventDefault();
      if (!running && !paused){ startGame(); return; }
      if (paused){ togglePause(); return; }
      if (running) hardDrop();
      return;
    }
    if (e.key === 'p' || e.key === 'P'){
      togglePause();
      return;
    }
    if (e.key === 'm' || e.key === 'M'){
      ensureAudio();
      toggleMute();
      return;
    }
    if (!running || paused) return;
    switch(e.key){
      case 'ArrowLeft': e.preventDefault(); move(-1); break;
      case 'ArrowRight': e.preventDefault(); move(1); break;
      case 'ArrowUp': e.preventDefault(); rotate(); break;
      case 'ArrowDown': e.preventDefault(); softDrop(); break;
      case 'b': case 'B': e.preventDefault(); holdPiece(); break;
    }
  });

  // initial static render
  grid = newGrid();
  drawHold();
  draw();
  rafId = requestAnimationFrame(gameLoop);
})();
</script>
</body>
</html>
