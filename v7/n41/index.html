<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>몬스터 대전 게임</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #1e1e2f;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            width: 800px;
            height: 600px;
            background-color: #2b2b40;
            border: 4px solid #4a4a6a;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            position: relative;
        }

        /* 화면 공통 */
        .screen {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .hidden {
            display: none !important;
        }

        /* 1. 시작 화면 (몬스터 선택) */
        #select-screen h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #ffd700;
            text-shadow: 2px 2px #ff4500;
        }

        #select-screen p {
            font-size: 1.1rem;
            margin-bottom: 30px;
            color: #aaa;
        }

        .monster-cards {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card {
            background-color: #3b3b58;
            border: 2px solid #5c5c8a;
            border-radius: 10px;
            width: 130px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }

        .card:hover {
            transform: translateY(-8px);
            background-color: #4e4e7c;
            border-color: #ffd700;
        }

        .card .emoji {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .card .name {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .card .type {
            font-size: 0.85rem;
            padding: 3px 6px;
            border-radius: 4px;
            display: inline-block;
        }

        /* 타입별 색상 */
        .type-fire { background-color: #e74c3c; color: white; }
        .type-water { background-color: #3498db; color: white; }
        .type-grass { background-color: #2ecc71; color: white; }
        .type-electric { background-color: #f1c40f; color: black; }
        .type-sixpath { background-color: #9b59b6; color: white; }

        /* 2. 전투 화면 */
        #battle-screen {
            justify-content: space-between;
            padding: 20px;
        }

        /* 배틀 스테이지 (몬스터 배치) */
        .battle-stage {
            width: 100%;
            height: 260px;
            position: relative;
            background: linear-gradient(to bottom, #4a69bd, #6a89cc);
            border-radius: 8px;
            border: 2px solid #38ada8;
            overflow: hidden;
            padding: 20px;
        }

        .fighter {
            position: absolute;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* 상대 몬스터 (우측 상단) */
        #enemy-fighter {
            top: 20px;
            right: 20px;
            flex-direction: row-reverse;
        }

        /* 내 몬스터 (좌측 하단) */
        #player-fighter {
            bottom: 20px;
            left: 20px;
        }

        .fighter-info {
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 15px;
            border-radius: 8px;
            width: 180px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .fighter-name {
            font-weight: bold;
            font-size: 1rem;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }

        .hp-bar-container {
            width: 100%;
            height: 12px;
            background-color: #555;
            border-radius: 6px;
            overflow: hidden;
            margin-top: 5px;
            border: 1px solid #222;
        }

        .hp-bar {
            width: 100%;
            height: 100%;
            background-color: #2ecc71;
            transition: width 0.3s ease, background-color 0.3s ease;
        }

        .hp-text {
            font-size: 0.75rem;
            text-align: right;
            margin-top: 2px;
            color: #ddd;
        }

        .fighter-sprite {
            font-size: 4.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            animation: bounce 2s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* 컨트롤 패널 (로그 및 기술 버튼) */
        .control-panel {
            width: 100%;
            height: 240px;
            display: flex;
            gap: 15px;
        }

        .log-box {
            flex: 1.2;
            background-color: #1a1a24;
            border: 2px solid #4a4a6a;
            border-radius: 8px;
            padding: 12px;
            overflow-y: auto;
            font-size: 0.95rem;
            line-height: 1.4;
            color: #ddd;
        }

        .action-box {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 10px;
        }

        .action-btn {
            background-color: #3b3b58;
            border: 2px solid #5c5c8a;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 5px;
        }

        .action-btn:hover:not(:disabled) {
            background-color: #5c5c8a;
            border-color: #ffd700;
        }

        .action-btn:active:not(:disabled) {
            transform: scale(0.96);
        }

        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .skill-desc {
            font-size: 0.7rem;
            color: #aaa;
            margin-top: 3px;
        }

        /* 3. 결과 화면 */
        #result-screen h1 {
            font-size: 3rem;
            margin-bottom: 15px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        #result-screen p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: #ccc;
        }

        .primary-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .primary-btn:hover {
            background-color: #c0392b;
            transform: translateY(-2px);
        }

        /* 특수 효과 엘리먼트들 */
        #hammer-effect {
            position: absolute;
            font-size: 5rem;
            pointer-events: none;
            opacity: 0;
            z-index: 10;
        }

        #thunder-effect {
            position: absolute;
            font-size: 5rem;
            pointer-events: none;
            opacity: 0;
            z-index: 10;
        }

        #meteor-effect {
            position: absolute;
            font-size: 5rem;
            pointer-events: none;
            opacity: 0;
            z-index: 10;
        }

        /* 망치 떨어지는 애니메이션 */
        @keyframes hammerDrop {
            0% { transform: translateY(-150px) scale(1.5) rotate(-45deg); opacity: 0; }
            50% { opacity: 1; }
            70% { transform: translateY(0px) scale(1.2) rotate(0deg); }
            80% { transform: translateY(-15px) scale(1) rotate(0deg); }
            100% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
        }
        .animate-hammer { animation: hammerDrop 0.6s ease-in forwards; }

        /* 번개 치는 애니메이션 */
        @keyframes thunderFlash {
            0% { opacity: 0; transform: scale(0.8) translateY(-30px); }
            30% { opacity: 1; transform: scale(1.3); filter: drop-shadow(0 0 15px yellow); }
            60% { opacity: 0.8; transform: scale(1); }
            100% { opacity: 0; transform: scale(1) translateY(10px); }
        }
        .animate-thunder { animation: thunderFlash 0.5s ease-out forwards; }

        /* 운석 떨어지는 애니메이션 */
        @keyframes meteorDrop {
            0% { transform: translate(120px, -180px) scale(2) rotate(-45deg); opacity: 0; }
            40% { opacity: 1; }
            75% { transform: translate(0px, 0px) scale(1.2) rotate(-15deg); filter: drop-shadow(0 0 20px orange); }
            85% { transform: translate(-10px, 10px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1) rotate(0deg); opacity: 1; }
        }
        .animate-meteor { animation: meteorDrop 0.65s ease-in forwards; }

        /* 피격 시 화면 흔들림 효과 */
        @keyframes shake {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-10px, 5px); }
            40% { transform: translate(10px, -5px); }
            60% { transform: translate(-5px, -5px); }
            80% { transform: translate(5px, 5px); }
            100% { transform: translate(0, 0); }
        }
        .shake-screen { animation: shake 0.4s ease-in-out; }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- 1. 몬스터 선택 화면 -->
        <div id="select-screen" class="screen">
            <h1>몬스터 대전 게임</h1>
            <p>전투에 참여할 나만의 몬스터를 선택하세요!</p>
            <div class="monster-cards" id="monster-cards-container"></div>
        </div>

        <!-- 2. 전투 화면 -->
        <div id="battle-screen" class="screen hidden">
            <div class="battle-stage" id="battle-stage">
                <!-- 애니메이션 이펙트 요소들 -->
                <div id="hammer-effect">🔨</div>
                <div id="thunder-effect">⚡</div>
                <div id="meteor-effect">☄️</div>

                <!-- 상대 몬스터 -->
                <div id="enemy-fighter" class="fighter">
                    <div class="fighter-sprite" id="enemy-sprite">👾</div>
                    <div class="fighter-info">
                        <div class="fighter-name">
                            <span id="enemy-name">상대</span>
                            <span id="enemy-type-badge"></span>
                        </div>
                        <div class="hp-bar-container">
                            <div id="enemy-hp-bar" class="hp-bar"></div>
                        </div>
                        <div class="hp-text" id="enemy-hp-text">100 / 100</div>
                    </div>
                </div>

                <!-- 내 몬스터 -->
                <div id="player-fighter" class="fighter">
                    <div class="fighter-sprite" id="player-sprite">🐱</div>
                    <div class="fighter-info">
                        <div class="fighter-name">
                            <span id="player-name">플레이어</span>
                            <span id="player-type-badge"></span>
                        </div>
                        <div class="hp-bar-container">
                            <div id="player-hp-bar" class="hp-bar"></div>
                        </div>
                        <div class="hp-text" id="player-hp-text">100 / 100</div>
                    </div>
                </div>
            </div>

            <!-- 하단 컨트롤 패널 -->
            <div class="control-panel">
                <div class="log-box" id="log-box">
                    전투가 시작되었습니다! 기술을 선택하세요.
                </div>
                <div class="action-box" id="action-box"></div>
            </div>
        </div>

        <!-- 3. 결과 화면 -->
        <div id="result-screen" class="screen hidden">
            <h1 id="result-title">승리!</h1>
            <p id="result-desc">멋진 전투였습니다!</p>
            <button class="primary-btn" onclick="resetGame()">다시하기</button>
        </div>
    </div>

    <script>
        const monstersData = [
            {
                id: 'fire',
                name: '화염냥',
                emoji: '🦊',
                type: '불',
                typeName: 'type-fire',
                hp: 100,
                skills: [
                    { name: '일반 공격', type: 'normal', power: 15, desc: '기본적인 발톱 공격' },
                    { name: '강화 화염구', type: 'strong', power: 30, desc: '강한 불 타입 기술' },
                    { name: '약한 불꽃', type: 'weak', power: 10, desc: '약한 불 타입 기술' },
                    { name: '체력 회복', type: 'heal', power: 25, desc: 'HP 25 회복' }
                ]
            },
            {
                id: 'water',
                name: '아쿠포니',
                emoji: '🐳',
                type: '물',
                typeName: 'type-water',
                hp: 100,
                skills: [
                    { name: '일반 공격', type: 'normal', power: 15, desc: '기본적인 몸통 박치기' },
                    { name: '거대한 파도', type: 'strong', power: 30, desc: '강한 물 타입 기술' },
                    { name: '물방울 튀기기', type: 'weak', power: 10, desc: '약한 물 타입 기술' },
                    { name: '체력 회복', type: 'heal', power: 25, desc: 'HP 25 회복' }
                ]
            },
            {
                id: 'grass',
                name: '리프론',
                emoji: '🐼',
                type: '풀',
                typeName: 'type-grass',
                hp: 100,
                skills: [
                    { name: '일반 공격', type: 'normal', power: 15, desc: '기본적인 나뭇잎 공격' },
                    { name: '태풍의 덩굴', type: 'strong', power: 30, desc: '강한 풀 타입 기술' },
                    { name: '씨앗 던지기', type: 'weak', power: 10, desc: '약한 풀 타입 기술' },
                    { name: '체력 회복', type: 'heal', power: 25, desc: 'HP 25 회복' }
                ]
            },
            {
                id: 'electric',
                name: '볼트론',
                emoji: '⚡',
                type: '전기',
                typeName: 'type-electric',
                hp: 500,
                skills: [
                    { name: '강력한 벼락', type: 'strong_all', power: 100, desc: '강한 공격' },
                    { name: '초고압 전류', type: 'strong_all', power: 100, desc: '강한 공격' },
                    { name: '플라즈마 캐논', type: 'thunder_atk', power: 100, desc: '번개가 내리친다!' },
                    { name: '썬더 볼트', type: 'strong_all', power: 100, desc: '강한 공격' },
                    { name: '스파크 잽', type: 'strong_all', power: 100, desc: '강한 공격' },
                    { name: '볼트 체이서', type: 'strong_all', power: 100, desc: '강한 공격' },
                    { name: '일렉트릭 쇼크', type: 'strong_all', power: 100, desc: '강한 공격' },
                    { name: '라이트닝 스톰', type: 'strong_all', power: 100, desc: '강한 공격' },
                    { name: '기가 볼트', type: 'strong_all', power: 100, desc: '강한 공격' },
                    { name: '오메가 스파크', type: 'strong_all', power: 100, desc: '강한 공격' }
                ]
            },
            {
                id: 'sixpath',
                name: '육도신수',
                emoji: '🌀',
                type: '육도',
                typeName: 'type-sixpath',
                hp: 10000000000,
                skills: [
                    { name: '육도의 심판', type: 'sixpath_atk', power: 500, desc: '하늘에서 망치가 떨어진다!' },
                    { name: '파멸의 인력', type: 'meteor_atk', power: 500, desc: '운석이 떨어져 꽂힌다!' }
                ]
            }
        ];

        const typeAdvantage = {
            '육도': { '전기': 2.0, '불': 1.0, '풀': 1.0, '물': 1.0, '육도': 1.0 },
            '전기': { '불': 2.0, '풀': 1.0, '물': 1.0, '육도': 0.5, '전기': 1.0 },
            '불': { '풀': 2.0, '물': 0.5, '전기': 1.0, '육도': 1.0, '불': 1.0 },
            '풀': { '물': 2.0, '불': 0.5, '전기': 1.0, '육도': 1.0, '풀': 1.0 },
            '물': { '불': 2.0, '풀': 0.5, '전기': 1.0, '육도': 1.0, '물': 1.0 }
        };

        let playerState = null;
        let enemyState = null;
        let isMyTurn = true;

        function initSelectScreen() {
            const container = document.getElementById('monster-cards-container');
            container.innerHTML = '';

            monstersData.forEach(m => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => selectMonster(m.id);
                card.innerHTML = `
                    <div class="emoji">${m.emoji}</div>
                    <div class="name">${m.name}</div>
                    <div class="type ${m.typeName}">${m.type} 타입</div>
                `;
                container.appendChild(card);
            });
        }

        function selectMonster(id) {
            const chosen = monstersData.find(m => m.id === id);
            playerState = {
                ...chosen,
                maxHp: chosen.hp,
                currentHp: chosen.hp,
                healCount: 2,
                skills: JSON.parse(JSON.stringify(chosen.skills))
            };

            const randomEnemy = monstersData[Math.floor(Math.random() * monstersData.length)];
            enemyState = {
                ...randomEnemy,
                maxHp: randomEnemy.hp,
                currentHp: randomEnemy.hp,
                healCount: 2,
                skills: JSON.parse(JSON.stringify(randomEnemy.skills))
            };

            document.getElementById('select-screen').classList.add('hidden');
            document.getElementById('battle-screen').classList.remove('hidden');

            updateBattleUI();
            appendLog(`야생의 ${enemyState.name}(${enemyState.type} 타입)이(가) 나타났다!`);
            appendLog(`가라! ${playerState.name}!`);

            isMyTurn = true;
        }

        function updateBattleUI() {
            document.getElementById('player-name').innerText = playerState.name;
            document.getElementById('player-sprite').innerText = playerState.emoji;
            const playerBadge = document.getElementById('player-type-badge');
            playerBadge.className = `type ${playerState.typeName}`;
            playerBadge.innerText = playerState.type;

            updateHpBar('player', playerState.currentHp, playerState.maxHp);

            document.getElementById('enemy-name').innerText = enemyState.name;
            document.getElementById('enemy-sprite').innerText = enemyState.emoji;
            const enemyBadge = document.getElementById('enemy-type-badge');
            enemyBadge.className = `type ${enemyState.typeName}`;
            enemyBadge.innerText = enemyState.type;

            updateHpBar('enemy', enemyState.currentHp, enemyState.maxHp);
            renderActionButtons();
        }

        function updateHpBar(target, current, max) {
            const percentage = Math.max(0, Math.min(100, (current / max) * 100));
            const bar = document.getElementById(`${target}-hp-bar`);
            const text = document.getElementById(`${target}-hp-text`);

            bar.style.width = `${percentage}%`;
            
            if (percentage > 50) {
                bar.style.backgroundColor = '#2ecc71';
            } else if (percentage > 20) {
                bar.style.backgroundColor = '#f1c40f';
            } else {
                bar.style.backgroundColor = '#e74c3c';
            }

            const formatNum = (num) => num > 10000 ? num.toLocaleString() : num;
            text.innerText = `${formatNum(current)} / ${formatNum(max)}`;
        }

        function renderActionButtons() {
            const actionBox = document.getElementById('action-box');
            actionBox.innerHTML = '';
            
            if (playerState.skills.length > 4) {
                actionBox.style.overflowY = 'auto';
                actionBox.style.gridTemplateColumns = '1fr 1fr';
            } else {
                actionBox.style.overflowY = 'visible';
                actionBox.style.gridTemplateColumns = '1fr 1fr';
            }

            playerState.skills.forEach((skill, index) => {
                const btn = document.createElement('button');
                btn.className = 'action-btn';
                btn.disabled = !isMyTurn;

                let descText = skill.desc;
                if (skill.type === 'heal') {
                    descText = `HP 25 회복 (잔여 ${playerState.healCount}회)`;
                    if (playerState.healCount <= 0) btn.disabled = true;
                }

                btn.innerHTML = `
                    <span>${skill.name}</span>
                    <span class="skill-desc">${descText}</span>
                `;
                btn.onclick = () => useSkill(index);
                actionBox.appendChild(btn);
            });
        }

        function appendLog(message) {
            const logBox = document.getElementById('log-box');
            logBox.innerHTML += `<br>${message}`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        // 망치 떨어지는 연출 함수
        function playHammerAnimation(targetIsPlayer, callback) {
            const hammer = document.getElementById('hammer-effect');
            const stage = document.getElementById('battle-stage');
            
            if (targetIsPlayer) {
                hammer.style.left = '90px';
                hammer.style.top = '30px';
            } else {
                hammer.style.left = '520px';
                hammer.style.top = '10px';
            }

            hammer.classList.add('animate-hammer');
            stage.classList.add('shake-screen');

            setTimeout(() => {
                hammer.classList.remove('animate-hammer');
                stage.classList.remove('shake-screen');
                hammer.style.opacity = '0';
                if (callback) callback();
            }, 600);
        }

        // 번개(플라즈마 캐논) 연출 함수
        function playThunderAnimation(targetIsPlayer, callback) {
            const thunder = document.getElementById('thunder-effect');
            const stage = document.getElementById('battle-stage');
            
            if (targetIsPlayer) {
                thunder.style.left = '90px';
                thunder.style.top = '30px';
            } else {
                thunder.style.left = '520px';
                thunder.style.top = '10px';
            }

            thunder.classList.add('animate-thunder');
            stage.classList.add('shake-screen');

            setTimeout(() => {
                thunder.classList.remove('animate-thunder');
                stage.classList.remove('shake-screen');
                thunder.style.opacity = '0';
                if (callback) callback();
            }, 500);
        }

        // 운석(파멸의 인력) 연출 함수
        function playMeteorAnimation(targetIsPlayer, callback) {
            const meteor = document.getElementById('meteor-effect');
            const stage = document.getElementById('battle-stage');
            
            if (targetIsPlayer) {
                meteor.style.left = '90px';
                meteor.style.top = '30px';
            } else {
                meteor.style.left = '520px';
                meteor.style.top = '10px';
            }

            meteor.classList.add('animate-meteor');
            stage.classList.add('shake-screen');

            setTimeout(() => {
                meteor.classList.remove('animate-meteor');
                stage.classList.remove('shake-screen');
                meteor.style.opacity = '0';
                if (callback) callback();
            }, 650);
        }

        function useSkill(skillIndex) {
            if (!isMyTurn) return;

            const skill = playerState.skills[skillIndex];
            isMyTurn = false;
            setButtonsEnabled(false);

            appendLog(`[내 턴] ${playerState.name}의 ${skill.name}!`);

            if (skill.type === 'heal') {
                if (playerState.healCount > 0) {
                    playerState.healCount--;
                    playerState.currentHp = Math.min(playerState.maxHp, playerState.currentHp + skill.power);
                    appendLog(`${playerState.name}은(는) 체력을 회복했다!`);
                    updateHpBar('player', playerState.currentHp, playerState.maxHp);
                }
                proceedAfterSkill(true);
            } else {
                let damage = skill.power;
                let multiplier = 1.0;

                const attackerType = playerState.type;
                const defenderType = enemyState.type;
                if (typeAdvantage[attackerType] && typeAdvantage[attackerType][defenderType] !== undefined) {
                    multiplier = typeAdvantage[attackerType][defenderType];
                }

                damage = Math.floor(damage * multiplier);
                enemyState.currentHp = Math.max(0, enemyState.currentHp - damage);

                // 기술에 따른 연출 분기
                if (skill.name === '육도의 심판' || skill.type === 'sixpath_atk') {
                    playHammerAnimation(false, () => {
                        applyAttackResult(damage, multiplier, 'enemy', enemyState);
                    });
                } else if (skill.name === '플라즈마 캐논' || skill.type === 'thunder_atk') {
                    playThunderAnimation(false, () => {
                        applyAttackResult(damage, multiplier, 'enemy', enemyState);
                    });
                } else if (skill.name === '파멸의 인력' || skill.type === 'meteor_atk') {
                    playMeteorAnimation(false, () => {
                        applyAttackResult(damage, multiplier, 'enemy', enemyState);
                    });
                } else {
                    applyAttackResult(damage, multiplier, 'enemy', enemyState);
                }
            }
        }

        function applyAttackResult(damage, multiplier, targetType, targetState) {
            if (multiplier > 1.0) {
                appendLog(`효과가 굉장했다! (데미지: ${damage.toLocaleString()})`);
            } else if (multiplier < 1.0) {
                appendLog(`효과가 별로인 듯하다... (데미지: ${damage.toLocaleString()})`);
            } else {
                appendLog(`데미지: ${damage.toLocaleString()}`);
            }

            updateHpBar(targetType, targetState.currentHp, targetState.maxHp);

            if (targetState.currentHp <= 0) {
                setTimeout(() => endBattle(true), 1000);
            } else {
                setTimeout(enemyTurn, 1200);
            }
        }

        function proceedAfterSkill(isPlayer) {
            if (isPlayer) {
                if (enemyState.currentHp <= 0) {
                    setTimeout(() => endBattle(true), 1000);
                } else {
                    setTimeout(enemyTurn, 1200);
                }
            }
        }

        function enemyTurn() {
            appendLog(`--- 상대의 턴 ---`);

            const availableSkills = enemyState.skills.filter(s => {
                if (s.type === 'heal') return enemyState.healCount > 0 && enemyState.currentHp < enemyState.maxHp;
                return true;
            });

            const chosenSkill = availableSkills[Math.floor(Math.random() * availableSkills.length)];

            appendLog(`상대 ${enemyState.name}의 ${chosenSkill.name}!`);

            if (chosenSkill.type === 'heal') {
                enemyState.healCount--;
                enemyState.currentHp = Math.min(enemyState.maxHp, enemyState.currentHp + chosenSkill.power);
                appendLog(`상대 ${enemyState.name}이(가) 체력을 회복했다!`);
                updateHpBar('enemy', enemyState.currentHp, enemyState.maxHp);
                checkEnemyTurnEnd();
            } else {
                let damage = chosenSkill.power;
                let multiplier = 1.0;

                const attackerType = enemyState.type;
                const defenderType = playerState.type;
                if (typeAdvantage[attackerType] && typeAdvantage[attackerType][defenderType] !== undefined) {
                    multiplier = typeAdvantage[attackerType][defenderType];
                }

                damage = Math.floor(damage * multiplier);
                playerState.currentHp = Math.max(0, playerState.currentHp - damage);

                // 컴퓨터가 사용할 때도 연출 적용
                if (chosenSkill.name === '육도의 심판' || chosenSkill.type === 'sixpath_atk') {
                    playHammerAnimation(true, () => {
                        finishEnemyAttack(damage, multiplier);
                    });
                } else if (chosenSkill.name === '플라즈마 캐논' || chosenSkill.type === 'thunder_atk') {
                    playThunderAnimation(true, () => {
                        finishEnemyAttack(damage, multiplier);
                    });
                } else if (chosenSkill.name === '파멸의 인력' || chosenSkill.type === 'meteor_atk') {
                    playMeteorAnimation(true, () => {
                        finishEnemyAttack(damage, multiplier);
                    });
                } else {
                    finishEnemyAttack(damage, multiplier);
                }
            }
        }

        function finishEnemyAttack(damage, multiplier) {
            if (multiplier > 1.0) {
                appendLog(`효과가 굉장했다! (플레이어가 ${damage.toLocaleString()}의 데미지를 입었다)`);
            } else if (multiplier < 1.0) {
                appendLog(`효과가 별로인 듯하다... (플레이어가 ${damage.toLocaleString()}의 데미지를 입었다)`);
            } else {
                appendLog(`플레이어가 ${damage.toLocaleString()}의 데미지를 입었다.`);
            }

            updateHpBar('player', playerState.currentHp, playerState.maxHp);
            checkEnemyTurnEnd();
        }

        function checkEnemyTurnEnd() {
            if (playerState.currentHp <= 0) {
                setTimeout(() => endBattle(false), 1000);
            } else {
                isMyTurn = true;
                renderActionButtons();
                appendLog(`--- 내 턴 ---`);
            }
        }

        function setButtonsEnabled(enabled) {
            const buttons = document.querySelectorAll('.action-btn');
            buttons.forEach(btn => btn.disabled = !enabled);
        }

        function endBattle(isWin) {
            document.getElementById('battle-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');

            const title = document.getElementById('result-title');
            const desc = document.getElementById('result-desc');

            if (isWin) {
                title.innerText = '승리!';
                title.style.color = '#2ecc71';
                desc.innerText = `${playerState.name}의 활약으로 승리했습니다!`;
            } else {
                title.innerText = '패배...';
                title.style.color = '#e74c3c';
                desc.innerText = `${playerState.name}이(가) 쓰러졌습니다... 다음엔 더 강해져서 도전하세요!`;
            }
        }

        function resetGame() {
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('select-screen').classList.remove('hidden');
            document.getElementById('log-box').innerHTML = '전투가 시작되었습니다! 기술을 선택하세요.';
            isMyTurn = true;
            playerState = null;
            enemyState = null;
            initSelectScreen();
        }

        window.onload = () => {
            initSelectScreen();
        };
    </script>
</body>
</html>
