<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 에임 연습장 - 저격 분리형</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
            user-select: none;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 30px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 25px;
            border-radius: 8px;
            z-index: 10;
            pointer-events: none;
        }

        /* 기본 크로스헤어 */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 8px;
            transform: translate(-50%, -50%);
            z-index: 10;
            pointer-events: none;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background-color: #00ffcc;
        }
        #crosshair::before { top: 3px; left: -4px; width: 16px; height: 2px; }
        #crosshair::after { top: -4px; left: 3px; width: 2px; height: 16px; }

        /* 저격총 우클릭 시 켜지는 스코프 */
        #sniper-scope {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 28%, black 29%);
            display: none;
            z-index: 9;
            pointer-events: none;
        }
        #sniper-scope::before {
            content: '';
            position: absolute;
            top: 50%; left: 0; width: 100%; height: 2px;
            background: #ff3b30;
        }
        #sniper-scope::after {
            content: '';
            position: absolute;
            top: 0; left: 50%; width: 2px; height: 100%;
            background: #ff3b30;
        }

        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            color: white;
        }

        .menu-box {
            background: #222;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            border: 2px solid #444;
        }

        select, button {
            padding: 12px 20px;
            font-size: 18px;
            font-weight: bold;
            margin: 10px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
        }

        select { background: #333; color: white; }
        button { background-color: #00ffcc; color: #000; }
        button:hover { background-color: #00b386; color: white; }
    </style>
    <!-- Three.js 및 PointerLockControls CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>

    <div id="ui">
        <div>점수: <span id="score">0</span></div>
        <div>훈련장: <span id="mode-name" style="color: #ffeb3b;">AK47 소총 연습장</span></div>
    </div>

    <div id="crosshair"></div>
    <div id="sniper-scope"></div>

    <div id="overlay">
        <div class="menu-box">
            <h1>3D 에임 연습장</h1>
            <p style="color: #aaa; margin-bottom: 20px;">연습하고 싶은 훈련장을 선택하세요!</p>
            
            <label>훈련장 선택:</label><br>
            <select id="mode-select">
                <option value="ak47">AK47 소총 연습장 (근/중거리)</option>
                <option value="gatling">개틀링건 연사 연습장 (난사)</option>
                <option value="sniper">저격총 전용 초장거리 연습장 (우클릭 조준)</option>
            </select><br><br>

            <button id="start-btn">훈련 시작</button>
        </div>
    </div>

    <script>
        let scene, camera, renderer, controls;
        let targets = [];
        let gunGroup;
        let score = 0;
        let isPlaying = false;
        let currentMode = 'ak47';
        let isAimed = false;
        let isShooting = false;
        let shootInterval = null;

        const scoreDisplay = document.getElementById('score');
        const modeNameDisplay = document.getElementById('mode-name');
        const modeSelect = document.getElementById('mode-select');
        const overlay = document.getElementById('overlay');
        const startBtn = document.getElementById('start-btn');
        const sniperScope = document.getElementById('sniper-scope');
        const crosshair = document.getElementById('crosshair');

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            controls = new THREE.PointerLockControls(camera, document.body);

            startBtn.addEventListener('click', () => {
                currentMode = modeSelect.value;
                updateModeSettings();
                controls.lock();
            });

            controls.addEventListener('lock', () => {
                overlay.style.display = 'none';
                isPlaying = true;
                if (targets.length === 0) setupTrainingField();
            });

            controls.addEventListener('unlock', () => {
                if (isPlaying) {
                    overlay.style.display = 'flex';
                    document.querySelector('.menu-box h1').textContent = "일시정지";
                    startBtn.textContent = "이어하기";
                    stopShooting();
                    resetAim();
                }
            });

            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const pLight = new THREE.PointLight(0xffffff, 1);
            pLight.position.set(0, 10, 5);
            scene.add(pLight);

            createGunModel();

            window.addEventListener('mousedown', onMouseDown);
            window.addEventListener('mouseup', onMouseUp);
            window.addEventListener('contextmenu', e => e.preventDefault());
            window.addEventListener('resize', onWindowResize);
        }

        function updateModeSettings() {
            isAimed = false;
            if (currentMode === 'ak47') {
                modeNameDisplay.textContent = "AK47 소총 연습장";
                camera.fov = 75;
                crosshair.style.display = 'block';
                sniperScope.style.display = 'none';
            } else if (currentMode === 'gatling') {
                modeNameDisplay.textContent = "개틀링건 연사 연습장";
                camera.fov = 75;
                crosshair.style.display = 'block';
                sniperScope.style.display = 'none';
            } else if (currentMode === 'sniper') {
                modeNameDisplay.textContent = "저격총 전용 연습장";
                camera.fov = 75;
                crosshair.style.display = 'block';
                sniperScope.style.display = 'none';
            }
            camera.updateProjectionMatrix();
        }

        function createGunModel() {
            gunGroup = new THREE.Group();
            const bodyGeo = new THREE.BoxGeometry(0.15, 0.15, 0.9);
            const gunMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.3 });
            const body = new THREE.Mesh(bodyGeo, gunMat);
            body.position.set(0.3, -0.25, -0.5);
            gunGroup.add(body);

            camera.add(gunGroup);
            scene.add(camera);
        }

        function setupTrainingField() {
            clearTargets();
            const count = (currentMode === 'sniper') ? 2 : 3;
            const minZ = (currentMode === 'sniper') ? -60 : -10;
            const maxZ = (currentMode === 'sniper') ? -100 : -18;

            for (let i = 0; i < count; i++) {
                spawnTarget(minZ, maxZ);
            }
        }

        function spawnTarget(minZ, maxZ) {
            const size = (currentMode === 'sniper') ? 1.5 : 0.8;
            const geometry = new THREE.CylinderGeometry(size, size, 0.2, 32);
            geometry.rotateX(Math.PI / 2);
            const material = new THREE.MeshStandardMaterial({ color: 0xff3b30 });
            const target = new THREE.Mesh(geometry, material);

            const rx = (Math.random() - 0.5) * (currentMode === 'sniper' ? 25 : 12);
            const ry = (Math.random() - 0.5) * (currentMode === 'sniper' ? 12 : 6);
            const rz = minZ - Math.random() * (Math.abs(maxZ - minZ));

            target.position.set(rx, ry, rz);
            scene.add(target);
            targets.push(target);
        }

        function clearTargets() {
            targets.forEach(t => {
                scene.remove(t);
                t.geometry.dispose();
                t.material.dispose();
            });
            targets = [];
        }

        const raycaster = new THREE.Raycaster();
        const centerVector = new THREE.Vector2(0, 0);

        function onMouseDown(e) {
            if (!isPlaying || !controls.isLocked) return;

            // 저격총 연습장에서 우클릭(버튼 2)을 누를 때만 조준 활성화
            if (e.button === 2 && currentMode === 'sniper') {
                isAimed = true;
                camera.fov = 15; // 초고배율 스코프 줌
                camera.updateProjectionMatrix();
                sniperScope.style.display = 'block';
                crosshair.style.display = 'none';
                return;
            }

            // 좌클릭(버튼 0) 발사
            if (e.button === 0) {
                if (currentMode === 'gatling') {
                    isShooting = true;
                    shootInterval = setInterval(performShot, 80);
                } else {
                    performShot();
                }
            }
        }

        function onMouseUp(e) {
            if (e.button === 0) {
                isShooting = false;
                if (shootInterval) {
                    clearInterval(shootInterval);
                    shootInterval = null;
                }
            }
            // 저격총 연습장에서 우클릭을 떼면 조준 해제
            if (e.button === 2 && currentMode === 'sniper') {
                resetAim();
            }
        }

        function resetAim() {
            if (currentMode === 'sniper') {
                isAimed = false;
                camera.fov = 75;
                camera.updateProjectionMatrix();
                sniperScope.style.display = 'none';
                crosshair.style.display = 'block';
            }
        }

        function performShot() {
            if (!controls.isLocked) return;

            // 반동 효과
            gunGroup.position.z += 0.08;
            setTimeout(() => { gunGroup.position.z -= 0.08; }, 50);

            raycaster.setFromCamera(centerVector, camera);
            const intersects = raycaster.intersectObjects(targets);

            if (intersects.length > 0) {
                const hitTarget = intersects[0].object;
                scene.remove(hitTarget);
                targets = targets.filter(t => t !== hitTarget);

                score++;
                scoreDisplay.textContent = score;

                const minZ = (currentMode === 'sniper') ? -60 : -10;
                const maxZ = (currentMode === 'sniper') ? -100 : -18;
                spawnTarget(minZ, maxZ);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        init();
        animate();
    </script>
</body>
</html>
