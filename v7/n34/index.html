<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Battle Royale - Solo & Duo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        #lobby { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: radial-gradient(circle, #1e293b 0%, #0f172a 100%); }
        .card { background: rgba(30, 41, 59, 0.7); border: 1px solid #334155; border-radius: 16px; padding: 32px; backdrop-filter: blur(12px); width: 440px; text-align: center; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
        h1 { font-size: 2.2rem; margin-bottom: 24px; color: #38bdf8; text-shadow: 0 0 10px rgba(56, 189, 248, 0.3); }
        .mode-select { display: flex; gap: 12px; margin-bottom: 20px; justify-content: center; }
        .btn-mode { flex: 1; padding: 14px 10px; border: 1px solid #475569; background: #334155; color: #cbd5e1; border-radius: 8px; cursor: pointer; font-weight: bold; transition: all 0.2s; font-size: 0.95rem; }
        .btn-mode.active { background: #0284c7; color: #ffffff; border-color: #38bdf8; box-shadow: 0 0 12px rgba(56, 189, 248, 0.4); }
        .btn-start { width: 100%; padding: 16px; background: #22c55e; border: none; color: white; font-size: 1.2rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
        .btn-start:hover { background: #16a34a; transform: translateY(-2px); }
        
        #gameContainer { display: none; position: relative; width: 100vw; height: 100vh; }
        canvas { display: block; }
        
        #hud { position: absolute; top: 20px; left: 20px; pointer-events: none; font-family: monospace; }
        .hud-card { background: rgba(15, 23, 42, 0.75); border: 1px solid rgba(255, 255, 255, 0.1); padding: 12px 18px; border-radius: 8px; margin-bottom: 10px; min-width: 200px; }
        .hp-bar-bg { width: 100%; height: 14px; background: #334155; border-radius: 7px; overflow: hidden; margin-top: 6px; }
        .hp-bar-fill { height: 100%; background: #22c55e; width: 100%; transition: width 0.1s; }
        
        #respawnHud { display: none; color: #f59e0b; font-weight: bold; margin-top: 5px; }

        #minimapCanvas { position: absolute; bottom: 20px; right: 20px; border: 2px solid #475569; border-radius: 50%; background: rgba(15, 23, 42, 0.8); }

        #modal { display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
        #modal.active { display: flex; }
        .modal-card { background: #1e293b; border: 2px solid #38bdf8; border-radius: 16px; padding: 32px; text-align: center; width: 360px; }
    </style>
</head>
<body>

    <!-- 로비 -->
    <div id="lobby">
        <div class="card">
            <h1>AI BATTLE ROYALE</h1>
            <p style="color: #94a3b8; margin-bottom: 20px;">게임 모드를 선택하세요</p>
            
            <div class="mode-select">
                <button type="button" class="btn-mode active" id="btnSolo" onclick="setMode('solo')">솔로 (나 포함 50명)</button>
                <button type="button" class="btn-mode" id="btnDuo" onclick="setMode('duo')">듀오 (나 포함 20명)</button>
            </div>

            <div style="background: rgba(0,0,0,0.2); padding: 14px; border-radius: 8px; margin-bottom: 20px; text-align: left; font-size: 0.85rem; color: #cbd5e1; line-height: 1.5;">
                ⏱ <b>자기장 축소:</b> 총 3분 (180초)<br>
                🤝 <b>듀오 모드 규칙:</b><br>
                &nbsp;&nbsp;• 20명 (10개 팀 / 2인 1조)<br>
                &nbsp;&nbsp;• 1명 사망 시 30초 후 부활<br>
                &nbsp;&nbsp;• 적 1킬당 부활 시간 5초 단축<br>
                🟢 <b>아군(내 팀):</b> 초록색 / 🔴 <b>적군:</b> 빨간색
            </div>

            <button class="btn-start" onclick="startGame()">게임 시작</button>
        </div>
    </div>

    <!-- 게임 화면 -->
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <canvas id="minimapCanvas" width="150" height="150"></canvas>

        <div id="hud">
            <div class="hud-card">
                <div>모드: <span id="modeDisplay" style="color:#38bdf8; font-weight:bold;">SOLO</span></div>
                <div>생존: <span id="aliveCount" style="color:#22c55e; font-weight:bold;">0</span></div>
                <div>킬수: <span id="killCount" style="color:#f43f5e; font-weight:bold;">0</span></div>
                <div id="respawnHud">팀원 부활까지: <span id="respawnTime">0</span>초</div>
            </div>
            <div class="hud-card">
                <div>체력</div>
                <div class="hp-bar-bg"><div id="hpFill" class="hp-bar-fill"></div></div>
            </div>
            <div class="hud-card">
                <div style="color: #a855f7;">자기장 축소: <span id="zoneTimer">180</span>초</div>
            </div>
        </div>
    </div>

    <!-- 결과 모달 -->
    <div id="modal">
        <div class="modal-card">
            <h2 id="modalTitle" style="font-size: 2rem; margin-bottom: 10px;">게임 종료</h2>
            <p id="modalDesc" style="color: #94a3b8; margin-bottom: 20px;"></p>
            <button class="btn-start" onclick="returnToLobby()">로비로 이동</button>
        </div>
    </div>

<script>
const MAP_SIZE = 4000;
let canvas, ctx, miniCanvas, miniCtx;
let gameMode = 'solo'; // 'solo' or 'duo'
let isRunning = false;

// 게임 상태
let players = [];
let bullets = [];
let myPlayer = null;

// 자기장 (총 3분 = 180초)
const TOTAL_ZONE_TIME = 180;
let zoneTimer = TOTAL_ZONE_TIME;
let zone = {
    x: MAP_SIZE / 2,
    y: MAP_SIZE / 2,
    currentRadius: MAP_SIZE * 0.7,
    targetRadius: 120,
    shrinkSpeed: 0
};

// 카메라
let camera = { x: 0, y: 0 };

function setMode(mode) {
    gameMode = mode;
    document.getElementById('btnSolo').classList.toggle('active', mode === 'solo');
    document.getElementById('btnDuo').classList.toggle('active', mode === 'duo');
}

class Player {
    constructor(id, teamId, isAI = true) {
        this.id = id;
        this.teamId = teamId;
        this.isAI = isAI;
        this.x = Math.random() * (MAP_SIZE - 400) + 200;
        this.y = Math.random() * (MAP_SIZE - 400) + 200;
        this.radius = 18;
        this.hp = 100;
        this.maxHp = 100;
        this.speed = 4;
        this.isDead = false;
        this.kills = 0;
        
        // 부활 타이머
        this.respawnTimer = 0;

        // AI 행동
        this.angle = Math.random() * Math.PI * 2;
        this.lastShoot = 0;
        this.shootDelay = 400; // ms
    }

    update(dt) {
        if (this.isDead) {
            if (gameMode === 'duo' && this.respawnTimer > 0) {
                this.respawnTimer -= dt;
                if (this.respawnTimer <= 0) {
                    this.respawn();
                }
            }
            return;
        }

        // 자기장 데미지 (밖으로 나갔을 경우)
        const distFromZoneCenter = Math.hypot(this.x - zone.x, this.y - zone.y);
        if (distFromZoneCenter > zone.currentRadius) {
            this.hp -= 8 * dt; // 초당 8 피해
            if (this.hp <= 0) this.die();
        }

        if (this.isAI) {
            this.updateAI(dt);
        }
    }

    updateAI(dt) {
        // 아군 탐색
        let teammate = null;
        if (gameMode === 'duo') {
            teammate = players.find(p => p.teamId === this.teamId && p.id !== this.id);
        }

        // 가장 가까운 적 탐색
        let closestEnemy = null;
        let minDist = Infinity;
        for (let p of players) {
            if (!p.isDead && p.teamId !== this.teamId) {
                let d = Math.hypot(p.x - this.x, p.y - this.y);
                if (d < minDist) {
                    minDist = d;
                    closestEnemy = p;
                }
            }
        }

        let moveX = 0, moveY = 0;

        // 1. 자기장 이동
        const distToCenter = Math.hypot(this.x - zone.x, this.y - zone.y);
        if (distToCenter > zone.currentRadius * 0.85) {
            let angleToCenter = Math.atan2(zone.y - this.y, zone.x - this.x);
            moveX = Math.cos(angleToCenter);
            moveY = Math.sin(angleToCenter);
        } 
        // 2. 적 교전
        else if (closestEnemy && minDist < 600) {
            this.angle = Math.atan2(closestEnemy.y - this.y, closestEnemy.x - this.x);

            if (minDist > 220) {
                moveX = Math.cos(this.angle);
                moveY = Math.sin(this.angle);
            } else if (minDist < 100) {
                moveX = -Math.cos(this.angle);
                moveY = -Math.sin(this.angle);
            }

            let now = Date.now();
            if (now - this.lastShoot > this.shootDelay) {
                this.shoot();
                this.lastShoot = now;
            }
        } 
        // 3. 듀오 엄호
        else if (teammate && !teammate.isDead) {
            let distToTeammate = Math.hypot(teammate.x - this.x, teammate.y - this.y);
            if (distToTeammate > 180) {
                let angleToTeam = Math.atan2(teammate.y - this.y, teammate.x - this.x);
                moveX = Math.cos(angleToTeam);
                moveY = Math.sin(angleToTeam);
            }
        } 
        // 4. 일반 이동
        else {
            if (Math.random() < 0.02) {
                this.angle += (Math.random() - 0.5);
            }
            moveX = Math.cos(this.angle) * 0.5;
            moveY = Math.sin(this.angle) * 0.5;
        }

        this.x += moveX * this.speed;
        this.y += moveY * this.speed;

        this.x = Math.max(20, Math.min(MAP_SIZE - 20, this.x));
        this.y = Math.max(20, Math.min(MAP_SIZE - 20, this.y));
    }

    shoot() {
        let bulletAngle = this.angle + (Math.random() - 0.5) * 0.08;
        bullets.push({
            ownerId: this.id,
            teamId: this.teamId,
            x: this.x + Math.cos(bulletAngle) * (this.radius + 5),
            y: this.y + Math.sin(bulletAngle) * (this.radius + 5),
            vx: Math.cos(bulletAngle) * 13,
            vy: Math.sin(bulletAngle) * 13,
            life: 60
        });
    }

    die() {
        this.isDead = true;
        
        if (gameMode === 'duo') {
            let teammate = players.find(p => p.teamId === this.teamId && p.id !== this.id);
            if (teammate && !teammate.isDead) {
                this.respawnTimer = 30; // 30초 부활 대기
            }
        }

        checkGameStatus();
    }

    respawn() {
        let teammate = players.find(p => p.teamId === this.teamId && !p.isDead);
        if (teammate) {
            this.x = teammate.x + (Math.random() - 0.5) * 80;
            this.y = teammate.y + (Math.random() - 0.5) * 80;
        } else {
            this.x = zone.x + (Math.random() - 0.5) * zone.currentRadius * 0.5;
            this.y = zone.y + (Math.random() - 0.5) * zone.currentRadius * 0.5;
        }
        this.hp = this.maxHp;
        this.isDead = false;
        this.respawnTimer = 0;
    }

    reduceRespawnTime(seconds) {
        if (this.respawnTimer > 0) {
            this.respawnTimer = Math.max(0, this.respawnTimer - seconds);
        }
    }
}

// 입력 처리
const keys = {};
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

let mousePos = { x: 0, y: 0 };
window.addEventListener('mousemove', e => {
    mousePos.x = e.clientX;
    mousePos.y = e.clientY;
});
window.addEventListener('mousedown', () => {
    if (myPlayer && !myPlayer.isDead && isRunning) {
        myPlayer.shoot();
    }
});

function startGame() {
    document.getElementById('lobby').style.display = 'none';
    document.getElementById('gameContainer').style.display = 'block';

    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d');
    miniCanvas = document.getElementById('minimapCanvas');
    miniCtx = miniCanvas.getContext('2d');

    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    initGame();
    isRunning = true;
    lastTime = performance.now();
    requestAnimationFrame(gameLoop);
}

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

function initGame() {
    players = [];
    bullets = [];
    zoneTimer = TOTAL_ZONE_TIME;

    zone.x = MAP_SIZE / 2;
    zone.y = MAP_SIZE / 2;
    zone.currentRadius = MAP_SIZE * 0.6;
    zone.targetRadius = 150;
    zone.shrinkSpeed = (zone.currentRadius - zone.targetRadius) / TOTAL_ZONE_TIME;

    // 인원 설정 (솔로: 50명, 듀오: 20명 = 10팀)
    const totalCount = (gameMode === 'solo') ? 50 : 20;
    const teamSize = (gameMode === 'solo') ? 1 : 2;
    const totalTeams = totalCount / teamSize;

    let pId = 0;
    for (let t = 0; t < totalTeams; t++) {
        for (let m = 0; m < teamSize; m++) {
            let isUser = (pId === 0); // 첫 번째 플레이어가 나
            let p = new Player(pId, t, !isUser);
            if (isUser) myPlayer = p;
            players.push(p);
            pId++;
        }
    }

    document.getElementById('modeDisplay').innerText = gameMode === 'solo' ? 'SOLO (50명)' : 'DUO (20명)';
}

let lastTime = 0;
function gameLoop(now) {
    if (!isRunning) return;

    let dt = (now - lastTime) / 1000;
    if (dt > 0.1) dt = 0.1;
    lastTime = now;

    update(dt);
    render();

    requestAnimationFrame(gameLoop);
}

function update(dt) {
    if (zoneTimer > 0) {
        zoneTimer -= dt;
        zone.currentRadius -= zone.shrinkSpeed * dt;
        if (zone.currentRadius < zone.targetRadius) zone.currentRadius = zone.targetRadius;
    }

    // 플레이어 조종
    if (myPlayer && !myPlayer.isDead) {
        let moveX = 0, moveY = 0;
        if (keys['w'] || keys['화살표위']) moveY -= 1;
        if (keys['s'] || keys['화살표아래']) moveY += 1;
        if (keys['a'] || keys['화살표왼쪽']) moveX -= 1;
        if (keys['d'] || keys['화살표오른쪽']) moveX += 1;

        if (moveX !== 0 || moveY !== 0) {
            let len = Math.hypot(moveX, moveY);
            myPlayer.x += (moveX / len) * myPlayer.speed;
            myPlayer.y += (moveY / len) * myPlayer.speed;
        }

        let screenCenterX = canvas.width / 2;
        let screenCenterY = canvas.height / 2;
        myPlayer.angle = Math.atan2(mousePos.y - screenCenterY, mousePos.x - screenCenterX);
    }

    players.forEach(p => p.update(dt));

    // 탄환 처리 및 충돌
    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        b.life--;

        for (let p of players) {
            if (!p.isDead && p.teamId !== b.teamId) {
                let dist = Math.hypot(p.x - b.x, p.y - b.y);
                if (dist < p.radius) {
                    p.hp -= 25;
                    b.life = 0;

                    if (p.hp <= 0) {
                        p.die();
                        let killer = players.find(k => k.id === b.ownerId);
                        if (killer) {
                            killer.kills++;
                            
                            // 1킬당 팀원 부활시간 5초 차감
                            if (gameMode === 'duo') {
                                let deadTeammate = players.find(tm => tm.teamId === killer.teamId && tm.isDead);
                                if (deadTeammate) {
                                    deadTeammate.reduceRespawnTime(5);
                                }
                            }
                        }
                    }
                    break;
                }
            }
        }

        if (b.life <= 0) bullets.splice(i, 1);
    }

    if (myPlayer) {
        camera.x = myPlayer.x - canvas.width / 2;
        camera.y = myPlayer.y - canvas.height / 2;
    }

    updateHUD();
}

function updateHUD() {
    let activeTeams = new Set(players.filter(p => !p.isDead).map(p => p.teamId));
    let aliveText = gameMode === 'solo' 
        ? `${players.filter(p => !p.isDead).length}명` 
        : `${activeTeams.size} 팀 (${players.filter(p => !p.isDead).length}명)`;

    document.getElementById('aliveCount').innerText = aliveText;
    document.getElementById('killCount').innerText = myPlayer ? myPlayer.kills : 0;
    document.getElementById('zoneTimer').innerText = Math.max(0, Math.floor(zoneTimer));

    if (myPlayer) {
        let hpPct = Math.max(0, (myPlayer.hp / myPlayer.maxHp) * 100);
        document.getElementById('hpFill').style.width = hpPct + '%';

        if (gameMode === 'duo') {
            let teammate = players.find(p => p.teamId === myPlayer.teamId && p.id !== myPlayer.id);
            let respawnHud = document.getElementById('respawnHud');
            if (teammate && teammate.isDead && teammate.respawnTimer > 0) {
                respawnHud.style.display = 'block';
                document.getElementById('respawnTime').innerText = Math.ceil(teammate.respawnTimer);
            } else {
                respawnHud.style.display = 'none';
            }
        }
    }
}

function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(-camera.x, -camera.y);

    // 격자 배경
    ctx.strokeStyle = '#1e293b';
    ctx.lineWidth = 2;
    for (let x = 0; x < MAP_SIZE; x += 100) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, MAP_SIZE); ctx.stroke();
    }
    for (let y = 0; y < MAP_SIZE; y += 100) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(MAP_SIZE, y); ctx.stroke();
    }

    // 자기장
    ctx.strokeStyle = 'rgba(168, 85, 247, 0.8)';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.arc(zone.x, zone.y, zone.currentRadius, 0, Math.PI * 2);
    ctx.stroke();

    // 탄환
    ctx.fillStyle = '#f59e0b';
    bullets.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
        ctx.fill();
    });

    // 플레이어 (내 팀: 초록색 / 적팀: 빨간색)
    players.forEach(p => {
        if (p.isDead) return;

        ctx.save();
        ctx.translate(p.x, p.y);

        let isMyTeam = myPlayer && (p.teamId === myPlayer.teamId);
        let playerColor = isMyTeam ? '#22c55e' : '#ef4444';

        // 조준선
        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(p.angle) * 25, Math.sin(p.angle) * 25);
        ctx.stroke();

        // 캐릭터
        ctx.fillStyle = playerColor;
        ctx.beginPath();
        ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.stroke();

        // HP 바
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(-20, -30, 40, 6);
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(-20, -30, 40 * (p.hp / p.maxHp), 6);

        ctx.restore();
    });

    ctx.restore();

    renderMinimap();
}

function renderMinimap() {
    miniCtx.clearRect(0, 0, miniCanvas.width, miniCanvas.height);
    let scale = miniCanvas.width / MAP_SIZE;

    // 자기장 표시
    miniCtx.strokeStyle = '#a855f7';
    miniCtx.lineWidth = 2;
    miniCtx.beginPath();
    miniCtx.arc(zone.x * scale, zone.y * scale, zone.currentRadius * scale, 0, Math.PI * 2);
    miniCtx.stroke();

    // 플레이어 (초록 / 빨강)
    players.forEach(p => {
        if (p.isDead) return;
        let isMyTeam = myPlayer && (p.teamId === myPlayer.teamId);
        miniCtx.fillStyle = isMyTeam ? '#22c55e' : '#ef4444';
        miniCtx.beginPath();
        miniCtx.arc(p.x * scale, p.y * scale, 3.5, 0, Math.PI * 2);
        miniCtx.fill();
    });
}

function checkGameStatus() {
    let activeTeams = new Set(players.filter(p => !p.isDead).map(p => p.teamId));

    if (activeTeams.size === 1) {
        let winningTeam = [...activeTeams][0];
        let isWin = myPlayer && myPlayer.teamId === winningTeam;
        showEndModal(isWin ? "🏆 우승!" : "💀 패배", isWin ? "최후의 승자가 되었습니다!" : "다른 플레이어가 우승했습니다.");
    } 
    else if (myPlayer) {
        let myTeamAlive = players.some(p => p.teamId === myPlayer.teamId && (!p.isDead || p.respawnTimer > 0));
        if (!myTeamAlive) {
            showEndModal("💀 전멸", gameMode === 'solo' ? "당신은 사망했습니다." : "팀이 모두 전멸했습니다.");
        }
    }
}

function showEndModal(title, desc) {
    isRunning = false;
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('modalDesc').innerText = desc;
    document.getElementById('modal').classList.add('active');
}

function returnToLobby() {
    document.getElementById('modal').classList.remove('active');
    document.getElementById('gameContainer').style.display = 'none';
    document.getElementById('lobby').style.display = 'flex';
}
</script>
</body>
</html>
