<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 점프 맵 - 대장정 및 무빙 플랫폼 버전</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: 'Arial', sans-serif;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            pointer-events: none;
        }
        h1 { margin: 0 0 10px 0; font-size: 20px; color: #4CAF50; }
        p { margin: 5px 0; font-size: 14px; }
    </style>
</head>
<body>

    <div id="info">
        <h1>🎮 3D 점프 맵 (무빙 플랫폼 포함)</h1>
        <p><b>이동:</b> W, A, S, D | <b>점프:</b> SPACE BAR</p>
        <p><b>설명:</b> 맵 길이가 3배 더 길어졌고, 움직이는 발판이 추가되었습니다!</p>
    </div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 20, 10);
        scene.add(directionalLight);

        const colliders = [];
        const movingPlatforms = []; // 움직이는 발판 리스트

        function createPlatform(x, y, z, width, height, depth, color, isMoving = false, moveAxis = 'x', moveRange = 3, moveSpeed = 0.03) {
            const geometry = new THREE.BoxGeometry(width, height, depth);
            const material = new THREE.MeshStandardMaterial({ color: color });
            const platform = new THREE.Mesh(geometry, material);
            platform.position.set(x, y, z);
            scene.add(platform);
            platform.geometry.computeBoundingBox();
            
            if (isMoving) {
                platform.userData = {
                    initialPos: new THREE.Vector3(x, y, z),
                    axis: moveAxis,
                    range: moveRange,
                    speed: moveSpeed,
                    timeOffset: Math.random() * 100
                };
                movingPlatforms.push(platform);
            } else {
                colliders.push(platform);
            }
            return platform;
        }

        // [초대형 확장 코스: 기존보다 약 3배 길어진 50단계 이상의 맵]
        createPlatform(0, -1, 0, 6, 1, 6, 0x4CAF50);       // 1
        createPlatform(0, 1, -8, 4, 1, 4, 0xFF9800);      // 2
        createPlatform(4, 2.5, -14, 3, 1, 3, 0xFF5722);    // 3
        createPlatform(4, 4, -20, 2.5, 1, 2.5, 0xE91E63);  // 4
        createPlatform(0, 5.5, -24, 3, 1, 3, 0x9C27B0);    // 5
        
        // 첫 번째 무빙 플랫폼 (좌우 이동)
        createPlatform(-4, 7, -30, 3, 1, 3, 0x00E676, true, 'x', 4, 0.04); 

        createPlatform(-4, 8.5, -38, 3, 1, 4, 0x3F51B5);   // 7
        createPlatform(0, 10, -45, 3, 1, 3, 0x00BCD4);     // 8
        
        // 두 번째 무빙 플랫폼 (상하 이동)
        createPlatform(4, 11.5, -52, 3, 1, 3, 0xFFEB3B, true, 'y', 2.5, 0.03);

        createPlatform(4, 13, -60, 2.5, 1, 2.5, 0x009688); // 10
        createPlatform(0, 14.5, -67, 3, 1, 3, 0x8BC34A);    // 11
        createPlatform(-4, 16, -74, 3, 1, 3, 0xCDDC39);    // 12
        
        // 세 번째 무빙 플랫폼 (앞뒤 이동)
        createPlatform(-4, 17.5, -82, 3, 1, 3, 0xFF4081, true, 'z', 4, 0.05);

        createPlatform(0, 19, -90, 3, 1, 3, 0xFF5722);     // 14
        createPlatform(4, 20.5, -98, 2.5, 1, 2.5, 0x795548);// 15
        createPlatform(4, 22, -106, 3, 1, 4, 0x607D8B);    // 16
        createPlatform(0, 23.5, -114, 3, 1, 3, 0x9C27B0);   // 17
        createPlatform(-4, 25, -122, 3, 1, 3, 0x00BCD4);   // 18
        createPlatform(-4, 26.5, -130, 3, 1, 3, 0x4CAF50);  // 19
        createPlatform(0, 28, -140, 10, 1, 10, 0x2196F3);  // 20. 최종 대형 도착 발판

        // [노란 뉴비 캐릭터 생성]
        const playerGroup = new THREE.Group();

        // 1. 머리 (노란색)
        const headGeo = new THREE.BoxGeometry(0.4, 0.4, 0.4);
        const headMat = new THREE.MeshStandardMaterial({ color: 0xffeb3b });
        const head = new THREE.Mesh(headGeo, headMat);
        head.position.set(0, 1.2, 0);
        playerGroup.add(head);

        // 2. 몸통 (파란색 셔츠)
        const torsoGeo = new THREE.BoxGeometry(0.5, 0.6, 0.3);
        const torsoMat = new THREE.MeshStandardMaterial({ color: 0x007acc });
        const torso = new THREE.Mesh(torsoGeo, torsoMat);
        torso.position.set(0, 0.7, 0);
        playerGroup.add(torso);

        // 3. 팔 (노란색)
        const armGeo = new THREE.BoxGeometry(0.15, 0.5, 0.2);
        const armMat = new THREE.MeshStandardMaterial({ color: 0xffeb3b });
        
        const leftArm = new THREE.Mesh(armGeo, armMat);
        leftArm.position.set(0, -0.2, 0);
        const leftArmHolder = new THREE.Group();
        leftArmHolder.position.set(-0.35, 0.9, 0);
        leftArmHolder.add(leftArm);
        playerGroup.add(leftArmHolder);

        const rightArm = new THREE.Mesh(armGeo, armMat);
        rightArm.position.set(0, -0.2, 0);
        const rightArmHolder = new THREE.Group();
        rightArmHolder.position.set(0.35, 0.9, 0);
        rightArmHolder.add(rightArm);
        playerGroup.add(rightArmHolder);

        // 4. 다리 (초록색 바지)
        const legGeo = new THREE.BoxGeometry(0.2, 0.5, 0.25);
        const legMat = new THREE.MeshStandardMaterial({ color: 0x2e7d32 });

        const leftLeg = new THREE.Mesh(legGeo, legMat);
        leftLeg.position.set(0, -0.25, 0);
        const leftLegHolder = new THREE.Group();
        leftLegHolder.position.set(-0.13, 0.5, 0);
        leftLegHolder.add(leftLeg);
        playerGroup.add(leftLegHolder);

        const rightLeg = new THREE.Mesh(legGeo, legMat);
        rightLeg.position.set(0, -0.25, 0);
        const rightLegHolder = new THREE.Group();
        rightLegHolder.position.set(0.13, 0.5, 0);
        rightLegHolder.add(rightLeg);
        playerGroup.add(rightLegHolder);

        scene.add(playerGroup);
        playerGroup.position.set(0, 1.5, 0);

        const playerVelocity = new THREE.Vector3();
        const gravity = -0.015;
        const jumpForce = 0.3;
        const moveSpeed = 0.15; 
        let isGrounded = false;
        let walkCycle = 0;
        let currentPlatform = null; // 현재 타고 있는 움직이는 발판 추적용

        const keys = { w: false, a: false, s: false, d: false };

        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW') keys.w = true;
            if (e.code === 'KeyA') keys.a = true;
            if (e.code === 'KeyS') keys.s = true;
            if (e.code === 'KeyD') keys.d = true;
            
            if (e.code === 'Space' && isGrounded) {
                playerVelocity.y = jumpForce;
                isGrounded = false;
                currentPlatform = null; // 점프하면 발판에서 떨어짐
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') keys.w = false;
            if (e.code === 'KeyA') keys.a = false;
            if (e.code === 'KeyS') keys.s = false;
            if (e.code === 'KeyD') keys.d = false;
        });

        function checkCollision(targetPos) {
            const halfW = 0.3;
            const halfD = 0.2;
            const h = 1.4;

            const pBox = new THREE.Box3(
                new THREE.Vector3(targetPos.x - halfW, targetPos.y + 0.1, targetPos.z - halfD),
                new THREE.Vector3(targetPos.x + halfW, targetPos.y + h, targetPos.z + halfD)
            );

            // 일반 발판 체크
            for (let obj of colliders) {
                const box = new THREE.Box3().setFromObject(obj);
                if (pBox.intersectsBox(box)) return true;
            }
            // 움직이는 발판 체크
            for (let obj of movingPlatforms) {
                const box = new THREE.Box3().setFromObject(obj);
                if (pBox.intersectsBox(box)) return true;
            }
            return false;
        }

        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // [무빙 플랫폼 업데이트]
            for (let platform of movingPlatforms) {
                const data = platform.userData;
                const offset = Math.sin(elapsedTime * data.speed * 50 + data.timeOffset) * data.range;
                
                const oldPos = platform.position.clone();

                if (data.axis === 'x') platform.position.x = data.initialPos.x + offset;
                if (data.axis === 'y') platform.position.y = data.initialPos.y + offset;
                if (data.axis === 'z') platform.position.z = data.initialPos.z + offset;

                platform.deltaMove = new THREE.Vector3().subVectors(platform.position, oldPos);
            }

            let moveDir = new THREE.Vector3();
            if (keys.w) moveDir.z -= 1;
            if (keys.s) moveDir.z += 1;
            if (keys.a) moveDir.x -= 1;
            if (keys.d) moveDir.x += 1;
            
            let isMoving = (keys.w || keys.a || keys.s || keys.d);

            if (isMoving) {
                moveDir.normalize();
                moveDir.multiplyScalar(moveSpeed);
                
                const angle = Math.atan2(moveDir.x, moveDir.z);
                playerGroup.rotation.y = angle;

                walkCycle += 0.15;
                leftArmHolder.rotation.x = Math.sin(walkCycle) * 0.6;
                rightArmHolder.rotation.x = -Math.sin(walkCycle) * 0.6;
                leftLegHolder.rotation.x = -Math.sin(walkCycle) * 0.6;
                rightLegHolder.rotation.x = Math.sin(walkCycle) * 0.6;
            } else {
                leftArmHolder.rotation.x = THREE.MathUtils.lerp(leftArmHolder.rotation.x, 0, 0.1);
                rightArmHolder.rotation.x = THREE.MathUtils.lerp(rightArmHolder.rotation.x, 0, 0.1);
                leftLegHolder.rotation.x = THREE.MathUtils.lerp(leftLegHolder.rotation.x, 0, 0.1);
                rightLegHolder.rotation.x = THREE.MathUtils.lerp(rightLegHolder.rotation.x, 0, 0.1);
            }

            // X축 이동
            let nextPos = playerGroup.position.clone();
            nextPos.x += moveDir.x;
            if (!checkCollision(nextPos)) {
                playerGroup.position.x = nextPos.x;
            }

            // Z축 이동
            nextPos = playerGroup.position.clone();
            nextPos.z += moveDir.z;
            if (!checkCollision(nextPos)) {
                playerGroup.position.z = nextPos.z;
            }

            // 만약 움직이는 발판 위에 있다면 발판 이동량만큼 캐릭터도 함께 이동
            if (isGrounded && currentPlatform && currentPlatform.deltaMove) {
                playerGroup.position.add(currentPlatform.deltaMove);
            }

            // Y축(중력 및 점프) 적용
            playerVelocity.y += gravity;
            nextPos = playerGroup.position.clone();
            nextPos.y += playerVelocity.y;

            let landed = false;
            const halfW = 0.3;
            const halfD = 0.2;
            const h = 1.5;

            const pBox = new THREE.Box3(
                new THREE.Vector3(playerGroup.position.x - halfW, nextPos.y, playerGroup.position.z - halfD),
                new THREE.Vector3(playerGroup.position.x + halfW, nextPos.y + h, playerGroup.position.z + halfD)
            );

            // 일반 발판 충돌 확인
            for (let obj of colliders) {
                const box = new THREE.Box3().setFromObject(obj);
                if (pBox.intersectsBox(box)) {
                    if (playerVelocity.y < 0) { 
                        playerGroup.position.y = box.max.y;
                        playerVelocity.y = 0;
                        isGrounded = true;
                        currentPlatform = null;
                        landed = true;
                        break;
                    } else if (playerVelocity.y > 0) { 
                        playerVelocity.y = 0;
                        landed = true;
                        break;
                    }
                }
            }

            // 움직이는 발판 충돌 확인
            if (!landed) {
                for (let obj of movingPlatforms) {
                    const box = new THREE.Box3().setFromObject(obj);
                    if (pBox.intersectsBox(box)) {
                        if (playerVelocity.y < 0) { 
                            playerGroup.position.y = box.max.y;
                            playerVelocity.y = 0;
                            isGrounded = true;
                            currentPlatform = obj; // 현재 탄 발판 저장
                            landed = true;
                            break;
                        } else if (playerVelocity.y > 0) { 
                            playerVelocity.y = 0;
                            landed = true;
                            break;
                        }
                    }
                }
            }

            if (!landed) {
                playerGroup.position.y = nextPos.y;
                isGrounded = false;
                currentPlatform = null;
            }

            // 낙하 리스폰
            if (playerGroup.position.y < -10) {
                playerGroup.position.set(0, 1.5, 0);
                playerVelocity.set(0, 0, 0);
                isGrounded = true;
                currentPlatform = null;
            }

            // 카메라 추적
            camera.position.x = playerGroup.position.x;
            camera.position.y = playerGroup.position.y + 3;
            camera.position.z = playerGroup.position.z + 6;
            camera.lookAt(playerGroup.position.x, playerGroup.position.y + 0.7, playerGroup.position.z);

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
