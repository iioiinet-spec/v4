<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>다이나믹 포켓몬 타워 점프맵</title>
    <style>
        body { margin: 0; background: #111; color: #fff; font-family: sans-serif; text-align: center; }
        canvas { background: #1a1a2e; display: block; margin: 10px auto; border: 3px solid #444; }
        #instructions { margin: 5px; font-size: 13px; color: #ccc; }
        
        #inventoryUI {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 340px; background: rgba(20, 20, 30, 0.95);
            border: 2px solid #a855f7; border-radius: 10px;
            padding: 15px; box-shadow: 0 0 15px rgba(0,0,0,0.8);
            z-index: 10;
        }
        .inv-btn {
            background: #3b82f6; color: white; border: none;
            padding: 6px 12px; margin: 4px; border-radius: 5px; cursor: pointer;
        }
        .inv-btn:hover { background: #2563eb; }
        .inv-btn:disabled { background: #555; cursor: not-allowed; }
    </style>
</head>
<body>

<h2>🏰 다이나믹 포켓몬 타워 점프맵</h2>
<div id="instructions">
    이동: A, D / 점프: Space | <b>파이리 불쏘기: F</b> | <b>꼬부기 물쏘기: G</b> | 모닥불: C<br>
    <b>인벤토리 열기: I 키</b> | <b>교체: [보라색 기계] 근처에서 1~6번 키</b>
</div>

<!-- 인벤토리 창 -->
<div id="inventoryUI">
    <h3>🎒 인벤토리</h3>
    <div id="woodListText" style="text-align: left; font-size: 13px; max-height: 120px; overflow-y: auto; background:#111; padding:8px; border-radius:5px;"></div>
    <hr>
    <div>
        <button class="inv-btn" onclick="useWoodForBulbasaur()">🌱 목재 사용 (이상해씨 최대HP/현재HP +5)</button><br>
        <button id="upgradeBtn" class="inv-btn" onclick="upgradeWoodWithPikachu()">⚡ 파찌파찌액셀 (보유한 최고강 목재 강화 50%)</button>
    </div>
    <p style="font-size: 12px; color: #aaa; margin-top:8px;">'I' 키를 눌러 창 닫기</p>
</div>

<canvas id="game" width="600" height="700"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const keys = {};
window.addEventListener("keydown", e => keys[e.code] = true);
window.addEventListener("keyup", e => keys[e.code] = false);

// 포켓몬 데이터 설정
const pokemonData = {
    "뮤": { id: 151, hp: 100, maxHp: 100, imgSrc: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/151.png" },
    "피카츄": { id: 25, hp: 100, maxHp: 100, imgSrc: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png" },
    "꼬부기": { id: 7, hp: 100, maxHp: 100, imgSrc: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/7.png" },
    "파이리": { id: 4, hp: 100, maxHp: 100, imgSrc: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/4.png" },
    "이상해씨": { id: 1, hp: 100, maxHp: 100, bonusMaxHp: 0, imgSrc: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/1.png" },
    "트랄랄레로 트랄랄라": { id: 0, hp: 100, maxHp: 100, imgSrc: "" }
};

const pokemonList = ["뮤", "피카츄", "꼬부기", "파이리", "이상해씨", "트랄랄레로 트랄랄라"];
const images = {};

pokemonList.forEach(name => {
    if (pokemonData[name].imgSrc) {
        const img = new Image();
        img.src = pokemonData[name].imgSrc;
        images[name] = img;
    }
});

let currentPokemon = "피카츄";
let canSwitch = false;
let isInvOpen = false;

// 인벤토리 목재 관리
let inventoryWoods = { 0: 0 }; 
let totalTreeGrowthCounts = 0; 

const player = {
    x: 280, y: 2400, w: 40, h: 40,
    vx: 0, vy: 0,
    facing: "right",
    stamina: 100, maxStamina: 100,
    isGrounded: false
};

let cameraY = 0;

// ★ 지그재그 다이나믹 발판 생성
const platforms = [
    { x: 0, y: 2460, w: 600, h: 40 } // 바닥
];

let side = 0; // 0: 왼쪽, 1: 중앙, 2: 오른쪽
for (let y = 2340; y >= -4500; y -= 95) {
    let w = 80 + Math.random() * 50; // 발판 크기 가변
    let x;

    // 좌-중-우 다이나믹 배치
    if (side === 0) {
        x = 30 + Math.random() * 80;
        side = Math.random() < 0.5 ? 1 : 2;
    } else if (side === 1) {
        x = 220 + Math.random() * 80;
        side = Math.random() < 0.5 ? 0 : 2;
    } else {
        x = 400 + Math.random() * 80;
        side = Math.random() < 0.5 ? 0 : 1;
    }

    let isMoving = Math.random() < 0.25; // 25% 확률로 움직이는 발판
    platforms.push({
        x: Math.floor(x), y: y, w: Math.floor(w), h: 20,
        isMoving: isMoving,
        vx: isMoving ? (Math.random() < 0.5 ? 2 : -2) : 0,
        minX: 30, maxX: 480
    });
}
platforms.push({ x: 150, y: -4600, w: 300, h: 30 }); // 정상

// ★ 가시 대량 추가
const spikes = [];
platforms.forEach((p, idx) => {
    if (idx === 0 || idx === platforms.length - 1) return;
    
    if (Math.random() < 0.7) {
        let spikeX = p.x + 5 + Math.random() * (p.w - 25);
        spikes.push({ x: Math.floor(spikeX), y: p.y - 15, w: 20, h: 15, parentPlatform: p, relX: spikeX - p.x });
    }
});

// ★ 목재 아이템 추가
const woodItems = [];
platforms.forEach((p, idx) => {
    if (idx % 3 === 1) {
        woodItems.push({ x: p.x + p.w / 2 - 10, y: p.y - 25, w: 20, h: 20, active: true, parentPlatform: p });
    }
});

// ★ 나무 및 교체기계 배치
const trees = [];
for (let y = 2200; y >= -4300; y -= 450) {
    trees.push({ x: 80 + (Math.abs(y) % 400), y: y, w: 30, h: 50, isOnFire: false, level: 1 });
}

const campfires = [];

const switchMachines = [];
for (let y = 2310; y >= -4400; y -= 380) {
    switchMachines.push({ x: 50 + (Math.abs(y * 3) % 450), y: y, w: 30, h: 40 });
}

const fireProjectiles = [];
const waterProjectiles = [];

window.addEventListener("keydown", e => {
    if (e.code === "KeyI") {
        isInvOpen = !isInvOpen;
        document.getElementById("inventoryUI").style.display = isInvOpen ? "block" : "none";
        updateInventoryUI();
    }

    if (canSwitch && e.key >= '1' && e.key <= '6') {
        const idx = parseInt(e.key) - 1;
        if (pokemonList[idx]) currentPokemon = pokemonList[idx];
    }

    if (e.code === "KeyF" && currentPokemon === "파이리") shootFire();
    if (e.code === "KeyG" && currentPokemon === "꼬부기") shootWater();
    if (e.code === "KeyC") buildCampfire();
});

function shootFire() {
    fireProjectiles.push({
        x: player.facing === "right" ? player.x + player.w : player.x - 15,
        y: player.y + 12, w: 15, h: 15,
        vx: player.facing === "right" ? 8 : -8, range: 300
    });
}

function shootWater() {
    waterProjectiles.push({
        x: player.facing === "right" ? player.x + player.w : player.x - 15,
        y: player.y + 12, w: 15, h: 15,
        vx: player.facing === "right" ? 8 : -8, range: 300
    });
}

function buildCampfire() {
    let totalWoodVal = 0;
    for (let lvl in inventoryWoods) {
        totalWoodVal += inventoryWoods[lvl] * (parseInt(lvl) + 1);
    }

    if (totalWoodVal >= 5) {
        let needed = 5;
        let lvls = Object.keys(inventoryWoods).map(Number).sort((a,b) => b-a);
        
        for (let lvl of lvls) {
            let valPerItem = lvl + 1;
            while (inventoryWoods[lvl] > 0 && needed >= valPerItem) {
                inventoryWoods[lvl]--;
                needed -= valPerItem;
            }
        }
        for (let lvl of lvls) {
            while (inventoryWoods[lvl] > 0 && needed > 0) {
                inventoryWoods[lvl]--;
                needed -= (lvl + 1);
            }
        }

        campfires.push({ x: player.x + 5, y: player.y + 15, w: 30, h: 25, isOnFire: false });
        alert("🔥 모닥불 설치 완료! (파이리의 불로 지필 수 있습니다)");
        updateInventoryUI();
    } else {
        alert("목재가 부족합니다! (필요 총가치: 5)");
    }
}

function updateInventoryUI() {
    let text = "";
    for (let lvl in inventoryWoods) {
        if (inventoryWoods[lvl] > 0) {
            text += `${lvl == 0 ? '일반 목재' : lvl + '강 목재'}: ${inventoryWoods[lvl]}개<br>`;
        }
    }
    document.getElementById("woodListText").innerHTML = text || "목재 없음";
    document.getElementById("upgradeBtn").disabled = (currentPokemon !== "피카츄");
}

function useWoodForBulbasaur() {
    let lvls = Object.keys(inventoryWoods).map(Number).sort((a,b) => b-a);
    let targetLvl = lvls.find(l => inventoryWoods[l] > 0);

    if (targetLvl !== undefined) {
        inventoryWoods[targetLvl]--;
        pokemonData["이상해씨"].bonusMaxHp += 5;
        pokemonData["이상해씨"].maxHp = Math.max(10, 100 + pokemonData["이상해씨"].bonusMaxHp);
        pokemonData["이상해씨"].hp += 5;

        alert("🌱 목재를 사용해 이상해씨의 체력과 최대 체력이 5 증가했습니다!");
        updateInventoryUI();
    } else {
        alert("사용할 목재가 없습니다.");
    }
}

function upgradeWoodWithPikachu() {
    if (currentPokemon !== "피카츄") return;

    let lvls = Object.keys(inventoryWoods).map(Number).filter(l => inventoryWoods[l] > 0).sort((a,b) => b-a);
    if (lvls.length === 0) {
        alert("강화할 목재가 없습니다!");
        return;
    }

    let targetLvl = lvls[0];
    inventoryWoods[targetLvl]--;

    if (Math.random() < 0.5) {
        let nextLvl = targetLvl + 1;
        inventoryWoods[nextLvl] = (inventoryWoods[nextLvl] || 0) + 1;
        alert(`⚡ 찌릿찌릿! [${nextLvl}강 목재] 강화 성공!`);
    } else {
        alert(`💥 과부하로 ${targetLvl == 0 ? '목재' : targetLvl + '강 목재'}가 타버렸습니다. (강화 실패)`);
    }
    updateInventoryUI();
}

function respawn() {
    alert(`💀 ${currentPokemon}의 체력이 0이 되어 사망했습니다! 시작 지점으로 이동합니다.`);
    pokemonData[currentPokemon].hp = pokemonData[currentPokemon].maxHp;
    player.x = 280; player.y = 2400; player.vx = 0; player.vy = 0;
}

function update() {
    if (isInvOpen) return;

    let curData = pokemonData[currentPokemon];

    // 이동하는 발판 업데이트
    platforms.forEach(p => {
        if (p.isMoving) {
            p.x += p.vx;
            if (p.x < p.minX || p.x + p.w > p.maxX) p.vx *= -1;
        }
    });

    // 가시 및 목재 위치를 움직이는 발판에 고정
    spikes.forEach(s => {
        if (s.parentPlatform && s.parentPlatform.isMoving) {
            s.x = s.parentPlatform.x + s.relX;
        }
    });
    woodItems.forEach(w => {
        if (w.parentPlatform && w.parentPlatform.isMoving) {
            w.x = w.parentPlatform.x + (w.parentPlatform.w / 2 - 10);
        }
    });

    // 이동 속도 (트랄랄레로 트랄랄라: 7)
    let moveSpeed = (currentPokemon === "트랄랄레로 트랄랄라") ? 7 : 4;

    if (keys["KeyA"]) { player.vx = -moveSpeed; player.facing = "left"; }
    else if (keys["KeyD"]) { player.vx = moveSpeed; player.facing = "right"; }
    else { player.vx = 0; }

    // 점프력 (트랄랄레로 트랄랄라: -13.5)
    let jumpPower = (currentPokemon === "트랄랄레로 트랄랄라") ? -13.5 : -10.5;

    if (currentPokemon === "뮤" && keys["Space"]) {
        if (player.stamina > 0) { player.vy = -4.5; player.stamina -= 0.7; }
    } else if (keys["Space"] && player.isGrounded) {
        player.vy = jumpPower;
        player.isGrounded = false;
    }

    if (!(currentPokemon === "뮤" && keys["Space"]) && player.stamina < player.maxStamina) {
        player.stamina += 0.3;
    }

    player.vy += 0.4;
    player.x += player.vx;
    player.y += player.vy;

    cameraY = player.y - 400;

    // 발판 충돌
    player.isGrounded = false;
    platforms.forEach(p => {
        if (player.x < p.x + p.w && player.x + player.w > p.x &&
            player.y + player.h > p.y && player.y + player.h < p.y + p.h + player.vy) {
            player.y = p.y - player.h; player.vy = 0; player.isGrounded = true;
            if (p.isMoving) player.x += p.vx; // 발판 타고 같이 이동
        }
    });

    // 가시 충돌
    spikes.forEach(s => {
        if (checkOverlap(player, s)) {
            curData.hp -= 1.5;
        }
    });

    // 목재 습득
    woodItems.forEach(w => {
        if (w.active && checkOverlap(player, w)) {
            w.active = false;
            inventoryWoods[0] = (inventoryWoods[0] || 0) + 1;
        }
    });

    // 교체 기계
    canSwitch = false;
    switchMachines.forEach(m => { if (checkOverlap(player, m)) canSwitch = true; });

    // 불꽃 발사체
    for (let i = fireProjectiles.length - 1; i >= 0; i--) {
        let fp = fireProjectiles[i];
        fp.x += fp.vx; fp.range -= Math.abs(fp.vx);
        let hit = false;

        trees.forEach(t => {
            if (checkOverlap(fp, t)) {
                if (!t.isOnFire) {
                    t.isOnFire = true;
                    pokemonData["이상해씨"].bonusMaxHp -= 5;
                    pokemonData["이상해씨"].maxHp = Math.max(10, 100 + pokemonData["이상해씨"].bonusMaxHp);
                    if (pokemonData["이상해씨"].hp > pokemonData["이상해씨"].maxHp) {
                        pokemonData["이상해씨"].hp = pokemonData["이상해씨"].maxHp;
                    }
                }
                hit = true;
            }
        });

        campfires.forEach(c => { if (checkOverlap(fp, c)) { c.isOnFire = true; hit = true; } });
        if (hit || fp.range <= 0) fireProjectiles.splice(i, 1);
    }

    // 물 발사체
    for (let i = waterProjectiles.length - 1; i >= 0; i--) {
        let wp = waterProjectiles[i];
        wp.x += wp.vx; wp.range -= Math.abs(wp.vx);
        let hit = false;

        trees.forEach(t => {
            if (checkOverlap(wp, t)) {
                if (t.isOnFire) {
                    t.isOnFire = false;
                } else if (t.level < 5) {
                    t.level++;
                    t.h += 8; t.y -= 8;
                    totalTreeGrowthCounts++;

                    if (totalTreeGrowthCounts % 5 === 0) {
                        pokemonData["이상해씨"].bonusMaxHp += 5;
                        pokemonData["이상해씨"].maxHp = Math.max(10, 100 + pokemonData["이상해씨"].bonusMaxHp);
                        pokemonData["이상해씨"].hp += 5;
                    }
                }
                hit = true;
            }
        });

        if (hit || wp.range <= 0) waterProjectiles.splice(i, 1);
    }

    // 불탄 나무/모닥불 로직
    let nearFireSource = false;
    let isTouchingDangerTree = false;

    trees.forEach(t => {
        if (t.isOnFire) {
            if (checkOverlap(player, t)) { isTouchingDangerTree = true; curData.hp -= 0.5; }
            let dist = Math.hypot((player.x + 20) - (t.x + 15), (player.y + 20) - (t.y + 25));
            if (dist < 100 && !isTouchingDangerTree) nearFireSource = true;
        }
    });

    campfires.forEach(c => {
        if (c.isOnFire) {
            let dist = Math.hypot((player.x + 20) - (c.x + 15), (player.y + 20) - (c.y + 12));
            if (dist < 100 || checkOverlap(player, c)) nearFireSource = true;
        }
    });

    if (nearFireSource && !isTouchingDangerTree) {
        curData.hp = Math.min(curData.maxHp, curData.hp + 0.2);
    }

    // 사망 체크
    if (curData.hp <= 0) {
        curData.hp = 0;
        respawn();
    }
}

function checkOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

// 직접 상어 및 나이키 운동화 그리기
function drawTralaleroShark(x, y, facing) {
    ctx.save();
    ctx.translate(x + 20, y + 20);
    if (facing === "left") ctx.scale(-1, 1);

    // 상어 몸통
    ctx.fillStyle = "#4B6584";
    ctx.beginPath();
    ctx.ellipse(0, -5, 22, 12, 0, 0, Math.PI * 2);
    ctx.fill();

    // 상어 지느러미
    ctx.beginPath();
    ctx.moveTo(-5, -15);
    ctx.lineTo(2, -25);
    ctx.lineTo(8, -15);
    ctx.fill();

    // 꼬리
    ctx.beginPath();
    ctx.moveTo(-20, -5);
    ctx.lineTo(-30, -15);
    ctx.lineTo(-26, -5);
    ctx.lineTo(-30, 5);
    ctx.fill();

    // 배
    ctx.fillStyle = "#F5F6FA";
    ctx.beginPath();
    ctx.ellipse(2, -2, 18, 6, 0, 0, Math.PI * 2);
    ctx.fill();

    // 눈
    ctx.fillStyle = "#000";
    ctx.beginPath();
    ctx.arc(12, -8, 2, 0, Math.PI * 2);
    ctx.fill();

    // 파란색 나이키 신발
    ctx.fillStyle = "#00A8FF";
    ctx.fillRect(5, 8, 14, 8);
    ctx.fillRect(-12, 8, 14, 8);

    // 밑창
    ctx.fillStyle = "#FFF";
    ctx.fillRect(5, 14, 14, 2);
    ctx.fillRect(-12, 14, 14, 2);

    ctx.restore();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(0, -cameraY);

    // 발판 (움직이는 발판은 보라색 계열로 구별)
    platforms.forEach(p => {
        ctx.fillStyle = p.isMoving ? "#8b5cf6" : "#4a5568";
        ctx.fillRect(p.x, p.y, p.w, p.h);
    });

    // 가시
    ctx.fillStyle = "#e11d48";
    spikes.forEach(s => {
        ctx.beginPath();
        ctx.moveTo(s.x, s.y + s.h);
        ctx.lineTo(s.x + s.w / 2, s.y);
        ctx.lineTo(s.x + s.w, s.y + s.h);
        ctx.fill();
    });

    // 교체 기계
    switchMachines.forEach(m => {
        ctx.fillStyle = "#a855f7";
        ctx.fillRect(m.x, m.y, m.w, m.h);
        ctx.fillStyle = "#fff"; ctx.font = "10px sans-serif";
        ctx.fillText("교체", m.x + 5, m.y + 22);
    });

    // 목재
    woodItems.forEach(w => {
        if (w.active) {
            ctx.fillStyle = "#8b4513"; ctx.fillRect(w.x, w.y, w.w, w.h);
            ctx.fillStyle = "#fff"; ctx.font = "9px sans-serif";
            ctx.fillText("목재", w.x + 1, w.y + 13);
        }
    });

    // 나무
    trees.forEach(t => {
        ctx.fillStyle = t.isOnFire ? "#ef4444" : "#22c55e";
        ctx.fillRect(t.x, t.y, t.w, t.h);
        if (t.isOnFire) {
            ctx.fillStyle = "#f97316"; ctx.fillRect(t.x + 5, t.y - 10, 20, 10);
        }
        ctx.fillStyle = "#fff"; ctx.font = "10px sans-serif";
        ctx.fillText(`Lv.${t.level}`, t.x + 4, t.y + 15);
    });

    // 모닥불
    campfires.forEach(c => {
        ctx.fillStyle = "#5c4033"; ctx.fillRect(c.x, c.y + 15, c.w, 10);
        if (c.isOnFire) {
            ctx.fillStyle = "#ff4500"; ctx.fillRect(c.x + 8, c.y, 14, 15);
        }
    });

    // 투사체
    ctx.fillStyle = "#ff4500";
    fireProjectiles.forEach(fp => ctx.fillRect(fp.x, fp.y, fp.w, fp.h));

    ctx.fillStyle = "#3b82f6";
    waterProjectiles.forEach(wp => ctx.fillRect(wp.x, wp.y, wp.w, wp.h));

    // 플레이어 그리기
    if (currentPokemon === "트랄랄레로 트랄랄라") {
        drawTralaleroShark(player.x, player.y, player.facing);
    } else {
        const pImg = images[currentPokemon];
        if (pImg && pImg.complete) {
            ctx.save();
            if (player.facing === "left") {
                ctx.translate(player.x + player.w + 5, player.y - 5);
                ctx.scale(-1, 1);
                ctx.drawImage(pImg, 0, 0, 50, 50);
            } else {
                ctx.drawImage(pImg, player.x - 5, player.y - 5, 50, 50);
            }
            ctx.restore();
        } else {
            ctx.fillStyle = "yellow";
            ctx.fillRect(player.x, player.y, player.w, player.h);
        }
    }

    ctx.restore();

    // UI
    let curData = pokemonData[currentPokemon];

    ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
    ctx.fillRect(10, 10, 310, 125);

    ctx.fillStyle = "#fff"; ctx.font = "15px sans-serif";
    ctx.fillText(`현재 포켓몬: ${currentPokemon}`, 20, 35);
    ctx.fillText(`체력(HP): ${Math.floor(curData.hp)} / ${curData.maxHp}`, 20, 60);

    if (currentPokemon === "뮤") {
        ctx.fillText(`뮤 스태미나: ${Math.floor(player.stamina)} / ${player.maxStamina}`, 20, 85);
    }

    ctx.fillText(`나무 총 성장횟수: ${totalTreeGrowthCounts}회`, 20, 110);

    if (canSwitch) {
        ctx.fillStyle = "#a855f7";
        ctx.fillText("⚡ [교체기계 접속!] 1~6 키로 교체 가능", 20, 128);
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
