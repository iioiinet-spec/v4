<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>타워 디펜스: 성 부수기</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #game-container {
            position: relative;
            width: 1000px;
            height: 600px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border-radius: 12px;
            overflow: hidden;
            background-color: #fff;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        /* 1. 시작 화면 */
        #start-screen {
            background: linear-gradient(135deg, #102a45, #1e3c72);
            color: white;
        }

        .main-title {
            font-size: 56px;
            font-weight: 900;
            margin-bottom: 40px;
            text-shadow: 4px 4px 10px rgba(0,0,0,0.6);
            letter-spacing: 2px;
        }

        .btn {
            padding: 16px 48px;
            font-size: 26px;
            font-weight: bold;
            color: #222;
            background-color: #ffca28;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            transition: all 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-3px);
            background-color: #ffb300;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        /* 2. 선택 화면 (노란색 배경) */
        #select-screen {
            background-color: #fff9c4;
            padding: 20px;
            gap: 20px;
        }

        .select-section {
            background: rgba(255, 255, 255, 0.9);
            padding: 20px 35px;
            border-radius: 18px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.06);
            text-align: center;
            width: 75%;
        }

        .select-section h3 {
            margin-bottom: 15px;
            color: #444;
            font-size: 22px;
        }

        .option-group {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .select-btn {
            padding: 12px 28px;
            font-size: 18px;
            font-weight: bold;
            border: 3px solid #ddd;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
        }

        .select-btn.active {
            border-color: #f57c00;
            background-color: #ffe0b2;
            color: #e65100;
        }

        /* 3. 승리 / 패배 오버레이 */
        #game-over-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .result-text {
            font-size: 110px;
            font-weight: 900;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-bottom: 20px;
        }

        .victory-text {
            color: #ffeb3b; 
            text-shadow: 0 0 25px #f57f17, 6px 6px 0px #000;
        }

        .defeat-text {
            color: #f44336;
            text-shadow: 0 0 25px #b71c1c, 6px 6px 0px #000;
        }

        .overlay-btn {
            pointer-events: auto;
            margin-top: 150px;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* 하단 UI */
        #game-ui {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100px;
            background: rgba(0,0,0,0.7);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            box-sizing: border-box;
            z-index: 4;
        }

        .unit-slots {
            display: flex;
            gap: 12px;
        }

        .slot {
            width: 75px;
            height: 75px;
            background: #fff;
            border: 3px solid #555;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .slot.disabled {
            filter: grayscale(1);
            cursor: not-allowed;
            background: #ccc;
        }

        .slot .icon {
            font-size: 38px;
        }

        .slot .cooldown-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0,0,0,0.65);
            height: 0%;
            transition: height 0.05s linear;
        }

        .info-panel {
            color: white;
            font-weight: bold;
            font-size: 18px;
            text-align: right;
        }

        .limit-warning {
            color: #ff5252;
            font-size: 16px;
            margin-top: 4px;
            height: 20px;
            font-weight: 800;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- 1. 시작 화면 -->
    <div id="start-screen" class="screen">
        <h1 class="main-title">🏰 타워 디펜스 🐺</h1>
        <button id="btn-start" class="btn">시작하기</button>
    </div>

    <!-- 2. 선택 화면 -->
    <div id="select-screen" class="screen hidden">
        <h2 style="font-size: 36px; color: #333; margin-bottom: 10px;">게임 설정</h2>
        
        <div class="select-section">
            <h3>🗺️ 맵 선택</h3>
            <div class="option-group">
                <button class="select-btn active" data-type="map" data-value="candy">🍭 사탕의 나라</button>
                <button class="select-btn" data-type="map" data-value="forest">🌲 울창한 숲</button>
            </div>
        </div>

        <div class="select-section">
            <h3>🏰 내 타워 모양 선택</h3>
            <div class="option-group">
                <button class="select-btn active" data-type="tower" data-value="classic">🏰 클래식 성</button>
                <button class="select-btn" data-type="tower" data-value="magic">🔮 마법 탑</button>
            </div>
        </div>

        <button id="btn-go-game" class="btn" style="margin-top: 10px;">전투 시작!</button>
    </div>

    <!-- 3. 게임 화면 Canvas -->
    <canvas id="gameCanvas" width="1000" height="600"></canvas>

    <!-- 4. 결과 레이어 -->
    <div id="game-over-overlay" class="hidden">
        <div id="result-text" class="result-text hidden"></div>
        <button id="btn-to-select" class="btn overlay-btn hidden">선택화면으로</button>
    </div>

    <!-- 5. 하단 UI -->
    <div id="game-ui" class="hidden">
        <div class="unit-slots">
            <div id="slot-1" class="slot">
                <span class="icon">🐺</span>
                <div id="cooldown-1" class="cooldown-overlay"></div>
            </div>
            <div class="slot disabled"></div>
            <div class="slot disabled"></div>
            <div class="slot disabled"></div>
            <div class="slot disabled"></div>
        </div>

        <div class="info-panel">
            <div>소환된 유닛: <span id="unit-count">0</span> / 10</div>
            <div id="limit-msg" class="limit-warning"></div>
        </div>
    </div>
</div>

<script>
    // --- BGM 사운드 시스템 ---
    class SoundSystem {
        constructor() {
            this.ctx = null;
            this.bgmInterval = null;
        }

        init() {
            if (!this.ctx) {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        playBGM() {
            this.init();
            if (this.bgmInterval) return;

            const notes = [130.81, 164.81, 196.00, 146.83, 174.61, 220.00, 110.00, 130.81, 164.81, 116.54, 146.83, 174.61];
            let step = 0;
            this.bgmInterval = setInterval(() => {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(notes[step % notes.length], this.ctx.currentTime);
                
                const subOsc = this.ctx.createOscillator();
                subOsc.type = 'sine';
                subOsc.frequency.setValueAtTime(notes[step % notes.length] / 2, this.ctx.currentTime);

                gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.8);

                osc.connect(gain);
                subOsc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                subOsc.start();
                osc.stop(this.ctx.currentTime + 0.8);
                subOsc.stop(this.ctx.currentTime + 0.8);

                step++;
            }, 400);
        }
    }

    const soundSystem = new SoundSystem();

    // --- 게임 설정 ---
    const config = {
        selectedMap: 'candy',
        selectedTower: 'classic'
    };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let gameState = 'START';
    let animationFrameId = null;

    let wolves = [];
    let bears = [];
    let particles = [];
    let backgroundItems = [];
    let floatingTexts = [];
    let sparks = [];
    let whirlpools = []; // 🌀 소용돌이 오브젝트 배열
    
    let myTower = { hp: 20, maxHp: 20, x: 30, y: 260, width: 130, height: 200, destroyed: false };
    let enemyTower = { hp: 20, maxHp: 20, x: 840, y: 260, width: 130, height: 200, destroyed: false };
    
    let isCoolingDown = false;

    // --- DOM 요소 ---
    const startScreen = document.getElementById('start-screen');
    const selectScreen = document.getElementById('select-screen');
    const gameOverOverlay = document.getElementById('game-over-overlay');
    const gameUI = document.getElementById('game-ui');
    const resultText = document.getElementById('result-text');
    const btnToSelect = document.getElementById('btn-to-select');
    const unitCountEl = document.getElementById('unit-count');
    const limitMsgEl = document.getElementById('limit-msg');
    const slot1 = document.getElementById('slot-1');
    const cooldown1 = document.getElementById('cooldown-1');

    // --- 이벤트 핸들러 ---
    document.getElementById('btn-start').addEventListener('click', () => {
        soundSystem.playBGM();
        startScreen.classList.add('hidden');
        selectScreen.classList.remove('hidden');
        gameState = 'SELECT';
    });

    document.querySelectorAll('.select-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            const type = e.target.dataset.type;
            const val = e.target.dataset.value;

            document.querySelectorAll(`.select-btn[data-type="${type}"]`).forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');

            if (type === 'map') config.selectedMap = val;
            if (type === 'tower') config.selectedTower = val;
        });
    });

    document.getElementById('btn-go-game').addEventListener('click', () => {
        selectScreen.classList.add('hidden');
        gameUI.classList.remove('hidden');
        initGame();
    });

    slot1.addEventListener('click', spawnWolf);

    btnToSelect.addEventListener('click', () => {
        gameOverOverlay.classList.add('hidden');
        resultText.classList.add('hidden');
        btnToSelect.classList.add('hidden');
        gameUI.classList.add('hidden');
        selectScreen.classList.remove('hidden');
        gameState = 'SELECT';
    });

    // --- 게임 초기화 ---
    function initGame() {
        gameState = 'PLAYING';
        wolves = [];
        bears = [];
        particles = [];
        backgroundItems = [];
        floatingTexts = [];
        sparks = [];
        whirlpools = [];
        
        myTower.hp = 20;
        myTower.destroyed = false;
        enemyTower.hp = 20;
        enemyTower.destroyed = false;
        
        isCoolingDown = false;
        cooldown1.style.height = '0%';
        limitMsgEl.textContent = '';
        updateUnitUI();

        if (config.selectedMap === 'candy') {
            for (let i = 0; i < 35; i++) {
                backgroundItems.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 14 + 10,
                    speed: Math.random() * 1.5 + 0.5,
                    emoji: ['🍬', '🍭', '🧁', '🍩'][Math.floor(Math.random() * 4)]
                });
            }
        }

        spawnBear();

        lastTime = performance.now();
        if (animationFrameId) cancelAnimationFrame(animationFrameId);
        gameLoop();
    }

    // 🐺 늑대 소환 (성 뒤쪽 x:40 소환)
    function spawnWolf() {
        if (gameState !== 'PLAYING') return;

        if (wolves.length >= 10) {
            limitMsgEl.textContent = '출격제한!';
            return;
        }

        if (isCoolingDown) return;

        wolves.push({
            hp: 5,
            maxHp: 5,
            x: myTower.x + 10,
            y: 430,
            speed: 0.5 * 60,
            atk: 2,
            atkSpeed: 3000,
            lastAtkTime: 0,
            walkFrame: 0,
            isAttacking: false
        });

        updateUnitUI();

        isCoolingDown = true;
        let start = Date.now();
        let timer = setInterval(() => {
            let elapsed = Date.now() - start;
            let progress = (elapsed / 3000) * 100;
            cooldown1.style.height = Math.max(0, 100 - progress) + '%';

            if (elapsed >= 3000) {
                clearInterval(timer);
                isCoolingDown = false;
                cooldown1.style.height = '0%';
            }
        }, 30);
    }

    // 🐻 곰 소환 (성 뒤쪽 x:950, 체력 100)
    function spawnBear() {
        if (enemyTower.destroyed || gameState !== 'PLAYING') return;
        bears.push({
            hp: 100,
            maxHp: 100,
            x: enemyTower.x + enemyTower.width - 20,
            y: 425,
            speed: 1.0 * 60,
            atk: 1,
            atkSpeed: 4000,
            lastAtkTime: 0,
            walkFrame: 0,
            isAttacking: false
        });
    }

    function createSparks(x, y) {
        for (let i = 0; i < 15; i++) {
            sparks.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 12,
                vy: (Math.random() - 0.5) * 12,
                size: Math.random() * 5 + 3,
                life: 1.0
            });
        }
    }

    function updateUnitUI() {
        unitCountEl.textContent = wolves.length;
        if (wolves.length < 10) {
            limitMsgEl.textContent = '';
        }
    }

    // --- 프레임 업데이트 ---
    let lastTime = 0;

    function update(deltaTime) {
        const now = Date.now();

        if (config.selectedMap === 'candy') {
            backgroundItems.forEach(item => {
                item.y += item.speed;
                if (item.y > canvas.height) {
                    item.y = -20;
                    item.x = Math.random() * canvas.width;
                }
            });
        }

        // 🌀 소용돌이 업데이트
        whirlpools.forEach((wp, index) => {
            wp.angle += 0.2;
            
            // 곰에게 지속 데미지
            bears.forEach(b => {
                if (Math.abs(b.x - wp.x) < 40) {
                    b.hp -= wp.atk;
                }
            });

            // 상대 타워에게 지속 데미지
            if (Math.abs((enemyTower.x + 30) - wp.x) < 50 && !enemyTower.destroyed) {
                damageEnemyTower(wp.atk);
            }

            wp.duration -= deltaTime;
            if (wp.duration <= 0) whirlpools.splice(index, 1);
        });

        // 늑대 로직
        wolves.forEach(wolf => {
            let targetBear = bears.find(b => b.x > wolf.x && b.x - wolf.x < 55);

            if (targetBear) {
                wolf.isAttacking = true;
                if (now - wolf.lastAtkTime >= wolf.atkSpeed) {
                    wolf.lastAtkTime = now;
                    
                    let rand = Math.random();

                    // 1) 1% 확률 즉사
                    if (rand < 0.01) {
                        targetBear.hp = 0;
                        floatingTexts.push({
                            text: '☠️ 즉사!',
                            x: targetBear.x,
                            y: targetBear.y - 40,
                            color: '#e91e63',
                            alpha: 1
                        });
                    } else {
                        targetBear.hp -= wolf.atk;

                        // 2) 3% 확률 소용돌이 소환
                        if (Math.random() < 0.03) {
                            whirlpools.push({
                                x: targetBear.x,
                                y: targetBear.y + 10,
                                angle: 0,
                                atk: 0.1,
                                duration: 3000
                            });
                            floatingTexts.push({
                                text: '🌀 소용돌이!',
                                x: targetBear.x,
                                y: targetBear.y - 60,
                                color: '#00bcd4',
                                alpha: 1
                            });
                        }

                        // 3) 10% 확률 5칸(50px) 밀치기
                        if (Math.random() < 0.10) {
                            targetBear.x = Math.min(enemyTower.x + enemyTower.width - 20, targetBear.x + 50);
                            floatingTexts.push({
                                text: '밀치기!',
                                x: targetBear.x,
                                y: targetBear.y - 40,
                                color: '#ff9800',
                                alpha: 1
                            });
                        }
                    }
                }
            } else if (wolf.x < enemyTower.x - 40) {
                wolf.isAttacking = false;
                wolf.x += wolf.speed * (deltaTime / 1000);
                wolf.walkFrame += deltaTime * 0.01;
            } else {
                wolf.isAttacking = true;
                if (now - wolf.lastAtkTime >= wolf.atkSpeed && !enemyTower.destroyed) {
                    wolf.lastAtkTime = now;
                    damageEnemyTower(wolf.atk);

                    // 타워 공격 시에도 3% 확률 소용돌이
                    if (Math.random() < 0.03) {
                        whirlpools.push({
                            x: enemyTower.x,
                            y: enemyTower.y + 160,
                            angle: 0,
                            atk: 0.1,
                            duration: 3000
                        });
                    }
                }
            }
        });

        // 곰 로직
        bears.forEach(bear => {
            let targetWolf = wolves.find(w => w.x < bear.x && bear.x - w.x < 55);

            if (targetWolf) {
                bear.isAttacking = true;
                if (now - bear.lastAtkTime >= bear.atkSpeed) {
                    bear.lastAtkTime = now;

                    let isCrit = Math.random() < 0.05;
                    let finalAtk = isCrit ? bear.atk * 4 : bear.atk;
                    targetWolf.hp -= finalAtk;

                    if (isCrit) {
                        createSparks(targetWolf.x, targetWolf.y - 20);
                        floatingTexts.push({
                            text: 'CRITICAL! 💥',
                            x: targetWolf.x - 10,
                            y: targetWolf.y - 50,
                            color: '#f44336',
                            alpha: 1
                        });
                    }
                }
            } else if (bear.x > myTower.x + myTower.width) {
                bear.isAttacking = false;
                bear.x -= bear.speed * (deltaTime / 1000);
                bear.walkFrame += deltaTime * 0.01;
            } else {
                bear.isAttacking = true;
                if (now - bear.lastAtkTime >= bear.atkSpeed && !myTower.destroyed) {
                    bear.lastAtkTime = now;
                    
                    let isCrit = Math.random() < 0.05;
                    let finalAtk = isCrit ? bear.atk * 4 : bear.atk;
                    damageMyTower(finalAtk);

                    if (isCrit) {
                        createSparks(myTower.x + myTower.width, myTower.y + 100);
                        floatingTexts.push({
                            text: 'CRITICAL! 💥',
                            x: myTower.x + myTower.width,
                            y: myTower.y + 60,
                            color: '#f44336',
                            alpha: 1
                        });
                    }
                }
            }
        });

        wolves = wolves.filter(w => w.hp > 0);
        
        let deadBears = bears.filter(b => b.hp <= 0).length;
        bears = bears.filter(b => b.hp > 0);
        for (let i = 0; i < deadBears; i++) {
            spawnBear();
        }

        updateUnitUI();

        floatingTexts.forEach((ft, index) => {
            ft.y -= 0.8;
            ft.alpha -= 0.02;
            if (ft.alpha <= 0) floatingTexts.splice(index, 1);
        });

        sparks.forEach((s, index) => {
            s.x += s.vx;
            s.y += s.vy;
            s.life -= 0.04;
            if (s.life <= 0) sparks.splice(index, 1);
        });

        particles.forEach((p, index) => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.2;
            p.alpha -= 0.01;
            if (p.alpha <= 0) particles.splice(index, 1);
        });
    }

    function damageMyTower(amount) {
        if (myTower.destroyed) return;
        myTower.hp -= amount;
        if (myTower.hp <= 0) {
            myTower.hp = 0;
            myTower.destroyed = true;
            triggerDefeat();
        }
    }

    function damageEnemyTower(amount) {
        if (enemyTower.destroyed) return;
        enemyTower.hp -= amount;
        if (enemyTower.hp <= 0) {
            enemyTower.hp = 0;
            enemyTower.destroyed = true;
            triggerVictory();
        }
    }

    function triggerVictory() {
        gameState = 'VICTORY';
        
        for (let i = 0; i < 70; i++) {
            particles.push({
                x: enemyTower.x + 60,
                y: enemyTower.y + 100,
                vx: (Math.random() - 0.5) * 18,
                vy: (Math.random() - 1) * 15,
                color: config.selectedMap === 'candy' ? '#ff4081' : '#795548',
                size: Math.random() * 16 + 8,
                alpha: 1
            });
        }

        setTimeout(() => {
            resultText.textContent = '승리';
            resultText.className = 'result-text victory-text';
            gameOverOverlay.classList.remove('hidden');
            resultText.classList.remove('hidden');
            btnToSelect.classList.remove('hidden');
        }, 400);
    }

    function triggerDefeat() {
        gameState = 'DEFEAT';

        for (let i = 0; i < 70; i++) {
            particles.push({
                x: myTower.x + 60,
                y: myTower.y + 100,
                vx: (Math.random() - 0.5) * 18,
                vy: (Math.random() - 1) * 15,
                color: '#555555',
                size: Math.random() * 16 + 8,
                alpha: 1
            });
        }

        setTimeout(() => {
            resultText.textContent = '패배';
            resultText.className = 'result-text defeat-text';
            gameOverOverlay.classList.remove('hidden');
            resultText.classList.remove('hidden');
            btnToSelect.classList.remove('hidden');
        }, 400);
    }

    // --- 렌더링 ---
    function render() {
        if (config.selectedMap === 'candy') {
            ctx.fillStyle = '#ffe0b2';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            backgroundItems.forEach(item => {
                ctx.font = `${item.size}px serif`;
                ctx.fillText(item.emoji, item.x, item.y);
            });
        } else {
            ctx.fillStyle = '#c8e6c9';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // 바닥
        ctx.fillStyle = '#8d6e63';
        ctx.fillRect(0, 460, canvas.width, 140);

        drawMyTower();
        drawEnemyTower();

        // 🌀 소용돌이 이펙트 그리기
        whirlpools.forEach(wp => {
            ctx.save();
            ctx.translate(wp.x, wp.y);
            ctx.rotate(wp.angle);
            ctx.strokeStyle = '#00e5ff';
            ctx.lineWidth = 4;
            ctx.beginPath();
            for (let i = 0; i < 3; i++) {
                ctx.arc(0, 0, (i + 1) * 10, i, i + Math.PI);
            }
            ctx.stroke();
            ctx.restore();
        });

        // 늑대
        wolves.forEach(wolf => {
            drawBigWolf(wolf.x, wolf.y, wolf.walkFrame, wolf.isAttacking, wolf.lastAtkTime);
            drawHPBar(wolf.x - 15, wolf.y - 50, 50, wolf.hp, wolf.maxHp);
        });

        // 곰
        bears.forEach(bear => {
            drawBigBear(bear.x, bear.y, bear.walkFrame);
            drawHPBar(bear.x - 15, bear.y - 50, 50, bear.hp, bear.maxHp);
        });

        // 크리티컬 스파크
        sparks.forEach(s => {
            ctx.save();
            ctx.globalAlpha = s.life;
            ctx.fillStyle = '#ff1744';
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        });

        // 텍스트 메시지
        floatingTexts.forEach(ft => {
            ctx.save();
            ctx.globalAlpha = ft.alpha;
            ctx.font = 'bold 20px sans-serif';
            ctx.fillStyle = ft.color;
            ctx.fillText(ft.text, ft.x, ft.y);
            ctx.restore();
        });

        // 파티클
        particles.forEach(p => {
            ctx.save();
            ctx.globalAlpha = p.alpha;
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, p.size, p.size);
            ctx.restore();
        });
    }

    function drawHPBar(x, y, width, hp, maxHp) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
        ctx.fillRect(x - 1, y - 1, width + 2, 7);
        ctx.fillStyle = '#ff5252';
        ctx.fillRect(x, y, width, 5);
        ctx.fillStyle = '#4caf50';
        ctx.fillRect(x, y, Math.max(0, (hp / maxHp) * width), 5);
    }

    // 🎨 [확대된 늑대] 입벌어짐 애니메이션
    function drawBigWolf(x, y, frame, isAttacking, lastAtkTime) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(1.7, 1.7);

        const legOffset = Math.sin(frame) * 5;
        const mouthOpen = isAttacking && (Date.now() - lastAtkTime < 350);

        ctx.fillStyle = '#546e7a';
        ctx.beginPath();
        ctx.moveTo(-15, -10);
        ctx.lineTo(-28, -20 + legOffset);
        ctx.lineTo(-20, -5);
        ctx.fill();

        ctx.fillStyle = '#37474f';
        ctx.fillRect(-10 + legOffset, 5, 5, 15);
        ctx.fillRect(5 - legOffset, 5, 5, 15);
        ctx.fillStyle = '#455a64';
        ctx.fillRect(-6 - legOffset, 5, 5, 15);
        ctx.fillRect(9 + legOffset, 5, 5, 15);

        ctx.fillStyle = '#607d8b';
        ctx.beginPath();
        ctx.ellipse(0, -2, 18, 12, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#cfd8dc';
        ctx.beginPath();
        ctx.arc(8, -4, 8, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#546e7a';
        ctx.beginPath();
        ctx.arc(14, -12, 9, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#546e7a';
        if (mouthOpen) {
            ctx.beginPath();
            ctx.moveTo(15, -14);
            ctx.lineTo(28, -15);
            ctx.lineTo(15, -8);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(15, -6);
            ctx.lineTo(26, 0);
            ctx.lineTo(13, -2);
            ctx.fill();

            ctx.fillStyle = '#e53935';
            ctx.beginPath();
            ctx.moveTo(16, -8);
            ctx.lineTo(24, -8);
            ctx.lineTo(16, -2);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(21, -12, 2, 4);
            ctx.fillRect(20, -4, 2, 3);
        } else {
            ctx.beginPath();
            ctx.moveTo(16, -14);
            ctx.lineTo(26, -8);
            ctx.lineTo(16, -6);
            ctx.fill();
        }

        ctx.fillStyle = '#212121';
        ctx.beginPath();
        ctx.arc(25, mouthOpen ? -14 : -8, 2, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#37474f';
        ctx.beginPath();
        ctx.moveTo(10, -18);
        ctx.lineTo(13, -27);
        ctx.lineTo(17, -18);
        ctx.fill();

        ctx.fillStyle = '#ffeb3b';
        ctx.beginPath();
        ctx.arc(16, -14, 2.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }

    // 🐻 [확대된 곰]
    function drawBigBear(x, y, frame) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(1.7, 1.7);

        const legOffset = Math.sin(frame) * 4;

        ctx.fillStyle = '#3e2723';
        ctx.fillRect(-10 - legOffset, 5, 7, 15);
        ctx.fillRect(5 + legOffset, 5, 7, 15);

        ctx.fillStyle = '#4e342e';
        ctx.beginPath();
        ctx.ellipse(0, -3, 20, 14, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.arc(-14, -14, 11, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.arc(-20, -22, 4.5, 0, Math.PI * 2);
        ctx.arc(-10, -22, 4.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#d7ccc8';
        ctx.beginPath();
        ctx.arc(-18, -12, 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(-20, -13, 2, 0, Math.PI * 2);
        ctx.arc(-13, -16, 1.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }

    // 🏰 내 타워
    function drawMyTower() {
        if (myTower.destroyed) return;

        ctx.save();
        if (config.selectedTower === 'classic') {
            ctx.fillStyle = '#78909c';
            ctx.fillRect(myTower.x, myTower.y, myTower.width, myTower.height);
            ctx.fillStyle = '#37474f';
            ctx.fillRect(myTower.x - 10, myTower.y, myTower.width + 20, 30);
            
            ctx.fillStyle = '#263238';
            ctx.fillRect(myTower.x + 35, myTower.y + 110, 60, 90);
        } else {
            ctx.fillStyle = '#7e57c2';
            ctx.fillRect(myTower.x + 20, myTower.y, myTower.width - 40, myTower.height);
            ctx.beginPath();
            ctx.arc(myTower.x + myTower.width/2, myTower.y - 20, 35, 0, Math.PI * 2);
            ctx.fillStyle = '#b388ff';
            ctx.fill();
        }

        drawHPBar(myTower.x, myTower.y - 30, myTower.width, myTower.hp, myTower.maxHp);
        ctx.restore();
    }

    // 🍭 상대 성
    function drawEnemyTower() {
        if (enemyTower.destroyed) return;

        ctx.save();
        if (config.selectedMap === 'candy') {
            ctx.fillStyle = '#e91e63';
            ctx.fillRect(enemyTower.x + 50, enemyTower.y + 30, 30, enemyTower.height - 30);
            
            ctx.beginPath();
            ctx.arc(enemyTower.x + 65, enemyTower.y + 30, 55, 0, Math.PI * 2);
            ctx.fillStyle = '#ff4081';
            ctx.fill();
            ctx.lineWidth = 9;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();
        } else {
            ctx.fillStyle = '#5d4037';
            ctx.fillRect(enemyTower.x, enemyTower.y, enemyTower.width, enemyTower.height);
            ctx.fillStyle = '#3e2723';
            ctx.fillRect(enemyTower.x - 10, enemyTower.y, enemyTower.width + 20, 30);
        }

        drawHPBar(enemyTower.x, enemyTower.y - 30, enemyTower.width, enemyTower.hp, enemyTower.maxHp);
        ctx.restore();
    }

    function gameLoop(time) {
        let deltaTime = time - lastTime;
        if (isNaN(deltaTime)) deltaTime = 0;
        lastTime = time;

        update(deltaTime);
        render();

        animationFrameId = requestAnimationFrame(gameLoop);
    }
</script>
</body>
