<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>다크 포켓몬풍 몬스터 아레나 EX - 임팩트 연출판</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #050608;
      color: #fff;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    #game-container {
      width: 100%;
      max-width: 680px;
      height: 900px;
      background: #0d0f17;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.95);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      border: 2px solid #1f2738;
    }

    .screen {
      display: none;
      flex-direction: column;
      width: 100%;
      height: 100%;
      padding: 20px;
    }
    .screen.active {
      display: flex;
    }

    /* --- 선택 화면 --- */
    #select-screen h1 {
      text-align: center;
      color: #00f0ff;
      margin: 5px 0;
      font-size: 2rem;
      letter-spacing: 2px;
      text-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
      font-weight: 900;
    }
    #select-screen p {
      text-align: center;
      color: #727f96;
      margin-bottom: 15px;
      font-size: 0.9rem;
    }
    .monster-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 15px;
    }
    .select-card {
      background: #141824;
      border: 2px solid #283147;
      border-radius: 14px;
      padding: 10px 6px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s ease;
      position: relative;
    }
    .select-card:hover {
      transform: translateY(-5px);
      border-color: #00f0ff;
      box-shadow: 0 5px 20px rgba(0,240,255,0.3);
    }
    .select-card.selected {
      border-color: #00ff88 !important;
      background: #0e2b20 !important;
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
    }
    .select-card .emoji {
      font-size: 2.8rem;
      margin-bottom: 3px;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.7));
    }
    .select-card .name {
      font-size: 1rem;
      font-weight: 900;
      margin-bottom: 2px;
      letter-spacing: -0.5px;
    }
    .select-card .type-badge {
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 8px;
      background: rgba(255,255,255,0.08);
      display: inline-block;
      margin-bottom: 4px;
      color: #a0aab8;
    }
    .select-card .ability-desc {
      font-size: 0.68rem;
      color: #ffcc00;
      font-weight: bold;
      margin-top: 4px;
      line-height: 1.2;
    }

    .card-dragon {
      border-color: #ffd700;
      background: linear-gradient(135deg, #2b2200 0%, #141824 100%);
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
    }
    .card-dragon .name { color: #ffe066; }

    .card-normal {
      border-color: #ff007f;
      background: linear-gradient(135deg, #360747 0%, #141824 100%);
      animation: rainbowGlow 3s infinite linear;
    }
    .card-normal .name {
      background: linear-gradient(90deg, #ff007f, #7f00ff, #00d4ff, #00ff88);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    @keyframes rainbowGlow {
      0% { border-color: #ff0055; box-shadow: 0 0 15px rgba(255,0,85,0.5); }
      33% { border-color: #00e5ff; box-shadow: 0 0 15px rgba(0,229,255,0.5); }
      66% { border-color: #7d00ff; box-shadow: 0 0 15px rgba(125,0,255,0.5); }
      100% { border-color: #ff0055; box-shadow: 0 0 15px rgba(255,0,85,0.5); }
    }

    .action-btn {
      background: linear-gradient(135deg, #ff0055 0%, #ff3300 100%);
      color: white;
      border: none;
      padding: 16px;
      font-size: 1.15rem;
      font-weight: 900;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.2s;
      margin-top: auto;
      letter-spacing: 1.5px;
      box-shadow: 0 4px 20px rgba(255, 0, 85, 0.4);
    }
    .action-btn:active:not(:disabled) { transform: translateY(2px); }
    .action-btn:disabled {
      background: #222736;
      color: #4a5366;
      box-shadow: none;
      cursor: not-allowed;
    }
    .action-btn:not(:disabled):hover { filter: brightness(1.2); }

    /* --- 배틀 화면 --- */
    #battle-screen {
      padding: 15px;
      justify-content: space-between;
    }
    .battle-field {
      height: 410px;
      background: radial-gradient(circle at center, #182035 0%, #0a0d14 100%);
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      border: 2px solid #232b3e;
      box-shadow: inset 0 0 40px rgba(0,0,0,0.9);
    }

    .enemy-platform {
      position: absolute;
      top: 110px;
      right: 30px;
      width: 190px;
      height: 40px;
      background: rgba(0, 240, 255, 0.08);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 50%;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
    }
    .player-platform {
      position: absolute;
      bottom: 25px;
      left: 30px;
      width: 230px;
      height: 50px;
      background: rgba(0, 255, 136, 0.08);
      border: 1px solid rgba(0, 255, 136, 0.3);
      border-radius: 50%;
      box-shadow: 0 0 15px rgba(0, 255, 136, 0.2);
    }

    .enemy-area {
      position: absolute;
      top: 15px;
      right: 20px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }
    .player-area {
      position: absolute;
      bottom: 25px;
      left: 20px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .monster-sprite {
      font-size: 6rem;
      filter: drop-shadow(0 12px 12px rgba(0,0,0,0.8));
      transition: transform 0.2s;
      z-index: 2;
    }
    .enemy-area .monster-sprite { transform: scaleX(-1); margin-right: 30px; }
    .player-area .monster-sprite { margin-left: 40px; }

    .sprite-dragon { filter: drop-shadow(0 0 25px rgba(255, 215, 0, 0.9)); }
    .sprite-normal { filter: drop-shadow(0 0 25px rgba(255, 0, 200, 0.9)); }

    /* HP/MP 정보 창 */
    .status-box {
      background: rgba(13, 16, 26, 0.95);
      color: #fff;
      border: 2px solid #2b354d;
      padding: 10px 14px;
      border-radius: 10px;
      width: 240px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.7);
      z-index: 3;
    }
    .status-box .header {
      display: flex;
      justify-content: space-between;
      font-weight: 900;
      margin-bottom: 4px;
      font-size: 0.95rem;
    }
    .ability-tag {
      font-size: 0.72rem;
      color: #ffcc00;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .bar-container {
      width: 100%;
      height: 10px;
      background: #11141f;
      border-radius: 5px;
      overflow: hidden;
      margin-bottom: 3px;
      border: 1px solid #22293b;
    }
    .bar-fill {
      height: 100%;
      width: 100%;
      transition: width 0.3s ease, background-color 0.3s;
    }
    .hp-green { background-color: #00ff88; box-shadow: 0 0 10px rgba(0,255,136,0.5); }
    .hp-yellow { background-color: #ffcc00; box-shadow: 0 0 10px rgba(255,204,0,0.5); }
    .hp-red { background-color: #ff0055; box-shadow: 0 0 10px rgba(255,0,85,0.5); }
    .mp-blue { background-color: #00f0ff; box-shadow: 0 0 10px rgba(0,240,255,0.5); }

    .bar-text {
      font-size: 0.72rem;
      color: #7a879e;
      font-weight: 700;
      text-align: right;
    }

    /* 로그 창 */
    .log-box {
      height: 120px;
      background: #080a0f;
      border: 2px solid #1c2333;
      border-radius: 12px;
      padding: 12px;
      overflow-y: auto;
      font-size: 0.9rem;
      line-height: 1.5;
      margin-top: 10px;
    }
    .log-box p { margin: 0 0 6px 0; }
    .log-highlight { color: #00f0ff; font-weight: bold; }
    .log-damage { color: #ff0055; font-weight: bold; }
    .log-heal { color: #00ff88; font-weight: bold; }
    .log-mp { color: #ffe066; font-weight: bold; }
    .log-ability { color: #ff00ff; font-weight: bold; }

    /* 기술 버튼 영역 */
    .skills-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }
    .skill-btn {
      background: #141824;
      color: white;
      border: 2px solid #283147;
      padding: 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 800;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: 0.2s;
    }
    .skill-btn:hover:not(:disabled) {
      background: #1e2436;
      border-color: #00f0ff;
      box-shadow: 0 0 12px rgba(0,240,255,0.2);
    }
    .skill-btn:active:not(:disabled) { transform: translateY(2px); }
    .skill-btn:disabled {
      background: #0b0d14;
      opacity: 0.4;
      cursor: not-allowed;
      border-color: #141824;
    }
    .skill-cost {
      font-size: 0.75rem;
      color: #00f0ff;
      margin-top: 3px;
    }

    /* --- ✨ 임팩트 이펙트 스타일 --- */
    .vfx-overlay {
      position: absolute;
      pointer-events: none;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      font-size: 4rem;
      animation: vfxPop 0.6s ease-out forwards;
    }

    @keyframes vfxPop {
      0% { transform: scale(0.2) rotate(0deg); opacity: 0; }
      50% { transform: scale(1.4) rotate(180deg); opacity: 1; }
      100% { transform: scale(1) rotate(360deg); opacity: 0; }
    }

    /* 속성별 이펙트 광원 */
    .vfx-fire { background: radial-gradient(circle, rgba(255,68,0,0.8) 0%, rgba(255,0,0,0) 70%); }
    .vfx-water { background: radial-gradient(circle, rgba(0,213,255,0.8) 0%, rgba(0,100,255,0) 70%); }
    .vfx-grass { background: radial-gradient(circle, rgba(0,255,136,0.8) 0%, rgba(0,150,50,0) 70%); }
    .vfx-rock { background: radial-gradient(circle, rgba(255,187,0,0.8) 0%, rgba(150,100,0,0) 70%); }
    .vfx-dragon { background: radial-gradient(circle, rgba(255,215,0,0.9) 0%, rgba(255,100,0,0) 70%); }
    .vfx-normal { background: radial-gradient(circle, rgba(255,0,200,0.9) 0%, rgba(150,0,255,0) 70%); }
    .vfx-heal { background: radial-gradient(circle, rgba(0,255,187,0.8) 0%, rgba(0,255,100,0) 70%); }

    /* 대미지 팝업 텍스트 */
    .dmg-popup {
      position: absolute;
      font-weight: 900;
      font-size: 2.2rem;
      color: #ff0055;
      text-shadow: 0 0 10px #ff0055, 0 0 20px #000;
      z-index: 20;
      pointer-events: none;
      animation: floatUp 0.8s ease-out forwards;
    }
    .dmg-popup.heal {
      color: #00ff88;
      text-shadow: 0 0 10px #00ff88, 0 0 20px #000;
    }

    @keyframes floatUp {
      0% { opacity: 0; transform: translateY(0) scale(0.5); }
      30% { opacity: 1; transform: translateY(-30px) scale(1.3); }
      100% { opacity: 0; transform: translateY(-60px) scale(1); }
    }

    /* 화면 흔들림 효과 */
    .screen-shake {
      animation: shake 0.4s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-8px, 6px); }
      40% { transform: translate(8px, -6px); }
      60% { transform: translate(-5px, -4px); }
      80% { transform: translate(5px, 4px); }
    }

    /* 교체 모달 */
    .modal-overlay {
      position: absolute;
      top:0; left:0; right:0; bottom:0;
      background: rgba(0,0,0,0.9);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 100;
    }
    .modal-overlay.active { display: flex; }
    .modal-title {
      font-size: 1.5rem;
      color: #00f0ff;
      margin-bottom: 20px;
      text-align: center;
      font-weight: 900;
      letter-spacing: 1px;
    }
    .switch-list {
      display: flex;
      gap: 12px;
      width: 100%;
      justify-content: center;
    }
    .switch-card {
      background: #141824;
      border: 2px solid #00ff88;
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      width: 130px;
    }
    .switch-card:hover { background: #0e2b20; }

    /* 결과 화면 */
    #result-screen {
      text-align: center;
      justify-content: center;
      align-items: center;
    }
    #result-title {
      font-size: 3.5rem;
      margin-bottom: 15px;
      font-weight: 900;
      letter-spacing: 2px;
    }
    .win-text { color: #00ff88; text-shadow: 0 0 30px rgba(0,255,136,0.6); }
    .lose-text { color: #ff0055; text-shadow: 0 0 30px rgba(255,0,85,0.6); }

    /* 애니메이션 */
    @keyframes attackLeft {
      0% { transform: translateX(0); }
      50% { transform: translateX(60px); }
      100% { transform: translateX(0); }
    }
    @keyframes attackRight {
      0% { transform: translateX(0) scaleX(-1); }
      50% { transform: translateX(-60px) scaleX(-1); }
      100% { transform: translateX(0) scaleX(-1); }
    }
    @keyframes damageFlash {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.1; }
    }
    .anim-attack-player { animation: attackLeft 0.3s ease-in-out; }
    .anim-attack-enemy { animation: attackRight 0.3s ease-in-out; }
    .anim-damage { animation: damageFlash 0.4s ease-in-out 2; }
  </style>
</head>
<body>

<div id="game-container">
  
  <!-- 1. 선택 화면 -->
  <div id="select-screen" class="screen active">
    <h1>ARENA BATTLE</h1>
    <p>출격시킬 몬스터를 선발하십시오 (노말 확율: 10%)</p>
    
    <div class="monster-grid" id="select-grid"></div>
    
    <button id="start-btn" class="action-btn" disabled onclick="startGame()">전투 개시</button>
  </div>

  <!-- 2. 배틀 화면 -->
  <div id="battle-screen" class="screen">
    
    <div class="battle-field" id="battle-field">
      <div class="enemy-platform"></div>
      <div class="player-platform"></div>

      <!-- 상대 몬스터 -->
      <div class="enemy-area" id="enemy-area">
        <div class="status-box">
          <div class="header">
            <span id="enemy-name">상대</span>
            <span id="enemy-type">속성</span>
          </div>
          <div class="ability-tag" id="enemy-ability">특성: -</div>
          <div class="bar-container">
            <div id="enemy-hp-bar" class="bar-fill hp-green"></div>
          </div>
          <div class="bar-text" id="enemy-hp-text">HP 0/0</div>
          <div class="bar-container" style="margin-top:3px;">
            <div id="enemy-mp-bar" class="bar-fill mp-blue"></div>
          </div>
          <div class="bar-text" id="enemy-mp-text">MP 0/0</div>
        </div>
        <div class="monster-sprite" id="enemy-sprite">👾</div>
      </div>

      <!-- 내 몬스터 -->
      <div class="player-area" id="player-area">
        <div class="monster-sprite" id="player-sprite">👾</div>
        <div class="status-box">
          <div class="header">
            <span id="player-name">내 몬스터</span>
            <span id="player-type">속성</span>
          </div>
          <div class="ability-tag" id="player-ability">특성: -</div>
          <div class="bar-container">
            <div id="player-hp-bar" class="bar-fill hp-green"></div>
          </div>
          <div class="bar-text" id="player-hp-text">HP 0/0</div>
          <div class="bar-container" style="margin-top:3px;">
            <div id="player-mp-bar" class="bar-fill mp-blue"></div>
          </div>
          <div class="bar-text" id="player-mp-text">MP 0/0</div>
        </div>
      </div>
    </div>

    <!-- 대화 로그 -->
    <div class="log-box" id="log-box"></div>

    <!-- 스킬 버튼 -->
    <div class="skills-grid" id="skills-grid"></div>
  </div>

  <!-- 3. 교체 모달 -->
  <div class="modal-overlay" id="switch-modal">
    <div class="modal-title">다음 출격시킬 몬스터를 선택하라!</div>
    <div class="switch-list" id="switch-list"></div>
  </div>

  <!-- 4. 결과 화면 -->
  <div id="result-screen" class="screen">
    <div id="result-title">VICTORY</div>
    <p id="result-desc" style="font-size: 1.1rem; color: #727f96; margin-bottom: 30px;"></p>
    <button class="action-btn" style="width: 200px;" onclick="location.reload()">재도전</button>
  </div>

</div>

<script>
  // --- 스킬별 임팩트 이펙트 아이콘 설정 ---
  const SKILL_EFFECT_ICONS = {

  const BASE_SPECIES = {

    GRASS: {

      skills: [
        { name: '멸망의 포효', cost: 0, power: 30, type: '풀' },

      ]
    },
    DRAGON: {
      type: '드래곤', name: '바하무트',
      maxHp: 270, maxMp: 200,
      isDragon: true,
      abilityName: '용의 위압 (MP 강탈)',
      skills: [
        { name: '용왕의 단죄', cost: 0, power: 40, type: '드래곤' },
        { name: '종말의 기계 브레스', cost: 35, power: 85, type: '드래곤' },
        { name: '드래고닉 스피릿', cost: 20, power: 55, type: '드래곤' },
        { name: '불사의 재생', cost: 10, isHeal: true, type: '회복' }
      ]
    },
    NORMAL: {
      type: '노말', name: '아수라',
      maxHp: 380, maxMp: 310,
      isNormal: true,
      abilityName: '신의 가호 (크리&MP수급)',
      skills: [
        { name: '신마의 일격', cost: 0, power: 50, type: '노말' },
        { name: '차원 붕괴 폭발', cost: 35, power: 95, type: '노말' },
        { name: '섬광 섬멸탄', cost: 20, power: 60, type: '노말' },
        { name: '불사의 재생', cost: 10, isHeal: true, type: '회복' }
      ]
    }
  };

  const MONSTER_EMOJIS = {
    FIRE: '🐺', WATER: '🐍', GRASS: '🦁', ROCK: '🗿', DRAGON: '🐲', NORMAL: '👑'
  };

  const TYPE_ADVANTAGE = {
    '불': '풀', '풀': '물', '물': '돌', '돌': '불'
  };

  let availableList = [];
  let selectedIndices = [];
  let playerTeam = [];
  let enemyTeam = [];
  let activePlayerMon = null;
  let activeEnemyMon = null;
  let isTurnProcessing = false;

  function generateRandomCandidate() {
    const rand = Math.random() * 100;
    if (rand < 10) return { ...BASE_SPECIES.NORMAL, icon: MONSTER_EMOJIS.NORMAL };
    else if (rand < 40) return { ...BASE_SPECIES.DRAGON, icon: MONSTER_EMOJIS.DRAGON };
    else {
      const basicKeys = ['FIRE', 'WATER', 'GRASS', 'ROCK'];
      const chosen = basicKeys[Math.floor(Math.random() * basicKeys.length)];
      return { ...BASE_SPECIES[chosen], icon: MONSTER_EMOJIS[chosen] };
    }
  }

  function cloneMonster(mon) {
    return {
      ...mon,
      hp: mon.maxHp,
      mp: mon.maxMp,
      shield: mon.type === '물' ? 40 : 0,
      healCount: 2,
      isFainted: false
    };
  }

  // --- 선택 화면 ---
  const selectGrid = document.getElementById('select-grid');
  const startBtn = document.getElementById('start-btn');

  for (let i = 0; i < 6; i++) {
    availableList.push(generateRandomCandidate());
  }

  availableList.forEach((mon, index) => {
    const card = document.createElement('div');
    let extraClass = '';
    if (mon.isDragon) extraClass = 'card-dragon';
    if (mon.isNormal) extraClass = 'card-normal';

    card.className = `select-card ${extraClass}`;
    card.innerHTML = `
      <div class="emoji">${mon.icon}</div>
      <div class="name">${mon.name}</div>
      <div class="type-badge">[${mon.type}]</div>
      <div class="ability-desc">⚡ ${mon.abilityName}</div>
    `;
    card.onclick = () => toggleSelect(index, card);
    selectGrid.appendChild(card);
  });

  function toggleSelect(index, card) {
    if (selectedIndices.includes(index)) {
      selectedIndices = selectedIndices.filter(i => i !== index);
      card.classList.remove('selected');
    } else {
      if (selectedIndices.length < 3) {
        selectedIndices.push(index);
        card.classList.add('selected');
      }
    }
    startBtn.disabled = selectedIndices.length !== 3;
  }

  // --- 게임 시작 ---
  function startGame() {
    playerTeam = selectedIndices.map(i => cloneMonster(availableList[i]));

    enemyTeam = [];
    for (let i = 0; i < 3; i++) {
      enemyTeam.push(cloneMonster(generateRandomCandidate()));
    }

    document.getElementById('select-screen').classList.remove('active');
    document.getElementById('battle-screen').classList.add('active');

    activePlayerMon = playerTeam[0];
    activeEnemyMon = enemyTeam[0];

    addLog(`<span class="log-highlight">아레나 전투가 개시되었습니다!</span>`);
    addLog(`적군 <span class="log-highlight">${activeEnemyMon.name}</span> 출격!`);
    addLog(`선봉 출격, <span class="log-highlight">${activePlayerMon.name}</span>!`);

    updateUI();
  }

  function updateUI() {
    document.getElementById('player-name').innerText = activePlayerMon.name;
    document.getElementById('player-type').innerText = `[${activePlayerMon.type}]`;
    document.getElementById('player-ability').innerText = `특성: ${activePlayerMon.abilityName}`;
    
    const pSprite = document.getElementById('player-sprite');
    pSprite.innerText = activePlayerMon.icon;
    pSprite.className = `monster-sprite ${activePlayerMon.isDragon ? 'sprite-dragon' : ''} ${activePlayerMon.isNormal ? 'sprite-normal' : ''}`;

    updateBar('player-hp', activePlayerMon.hp, activePlayerMon.maxHp, true, activePlayerMon.shield);
    updateBar('player-mp', activePlayerMon.mp, activePlayerMon.maxMp, false);

    document.getElementById('enemy-name').innerText = activeEnemyMon.name;
    document.getElementById('enemy-type').innerText = `[${activeEnemyMon.type}]`;
    document.getElementById('enemy-ability').innerText = `특성: ${activeEnemyMon.abilityName}`;
    
    const eSprite = document.getElementById('enemy-sprite');
    eSprite.innerText = activeEnemyMon.icon;
    eSprite.className = `monster-sprite ${activeEnemyMon.isDragon ? 'sprite-dragon' : ''} ${activeEnemyMon.isNormal ? 'sprite-normal' : ''}`;

    updateBar('enemy-hp', activeEnemyMon.hp, activeEnemyMon.maxHp, true, activeEnemyMon.shield);
    updateBar('enemy-mp', activeEnemyMon.mp, activeEnemyMon.maxMp, false);

    renderSkills();
  }

  function updateBar(prefix, current, max, isHp, shield = 0) {
    const pct = Math.max(0, Math.min(100, (current / max) * 100));
    const fillEl = document.getElementById(`${prefix}-bar`);
    const textEl = document.getElementById(`${prefix}-text`);

    fillEl.style.width = `${pct}%`;
    let shieldText = shield > 0 ? ` (🛡️${shield})` : '';
    textEl.innerText = `${isHp ? 'HP' : 'MP'} ${current}/${max}${shieldText}`;

    if (isHp) {
      fillEl.className = 'bar-fill ';
      if (pct > 50) fillEl.classList.add('hp-green');
      else if (pct > 20) fillEl.classList.add('hp-yellow');
      else fillEl.classList.add('hp-red');
    }
  }

  function renderSkills() {
    const grid = document.getElementById('skills-grid');
    grid.innerHTML = '';

    activePlayerMon.skills.forEach((skill) => {
      const btn = document.createElement('button');
      btn.className = 'skill-btn';
      
      let subText = `MP ${skill.cost}`;
      if (skill.isHeal) subText += ` (남은 회복: ${activePlayerMon.healCount}/2)`;

      btn.innerHTML = `
        <span>${skill.name}</span>
        <span class="skill-cost">${subText}</span>
      `;

      btn.disabled = isTurnProcessing;
      btn.onclick = () => handlePlayerTurn(skill);
      grid.appendChild(btn);
    });
  }

  /* --- 💥 visual VFX 연출 함수 --- */
  function playVisualImpact(targetAreaId, skillType, isHeal = false, value = 0) {
    const area = document.getElementById(targetAreaId);
    
    // 1. 스킬 오버레이 이펙트
    const vfx = document.createElement('div');
    const vfxClassMap = {
      '불': 'vfx-fire', '물': 'vfx-water', '풀': 'vfx-grass',
      '돌': 'vfx-rock', '드래곤': 'vfx-dragon', '노말': 'vfx-normal', '회복': 'vfx-heal'
    };
    vfx.className = `vfx-overlay ${vfxClassMap[skillType] || 'vfx-fire'}`;
    vfx.innerText = SKILL_EFFECT_ICONS[skillType] || '💥';
    
    // 상대 위치 설정
    vfx.style.top = '40%';
    vfx.style.left = targetAreaId === 'enemy-area' ? '30%' : '50%';
    area.appendChild(vfx);

    // 2. 대미지 / 회복 팝업 텍스트
    const popup = document.createElement('div');
    popup.className = `dmg-popup ${isHeal ? 'heal' : ''}`;
    popup.innerText = isHeal ? `+${value}` : `-${value}`;
    popup.style.top = '10%';
    popup.style.left = targetAreaId === 'enemy-area' ? '20%' : '40%';
    area.appendChild(popup);

    // 3. 화면 전체 진동 효과 (공격 스킬 시)
    if (!isHeal) {
      const bField = document.getElementById('battle-field');
      bField.classList.add('screen-shake');
      setTimeout(() => bField.classList.remove('screen-shake'), 400);
    }

    // 엘리먼트 제거
    setTimeout(() => {
      vfx.remove();
      popup.remove();
    }, 800);
  }

  // --- 플레이어 턴 ---
  function handlePlayerTurn(skill) {
    if (isTurnProcessing) return;

    if (skill.isHeal && activePlayerMon.healCount <= 0) {
      addLog(`<span class="log-damage">회복 횟수를 모두 소모하였습니다!</span>`);
      return;
    }

    if (activePlayerMon.mp < skill.cost) {
      addLog(`<span class="log-damage">MP가 부족합니다.</span>`);
      return;
    }

    isTurnProcessing = true;
    renderSkills();

    activePlayerMon.mp -= skill.cost;

    const pSprite = document.getElementById('player-sprite');
    pSprite.classList.add('anim-attack-player');
    setTimeout(() => pSprite.classList.remove('anim-attack-player'), 300);

    if (skill.isHeal) {
      activePlayerMon.healCount--;
      const healAmount = 70;
      activePlayerMon.hp = Math.min(activePlayerMon.maxHp, activePlayerMon.hp + healAmount);
      
      playVisualImpact('player-area', '회복', true, healAmount);
      addLog(`<span class="log-heal">${activePlayerMon.name}이(가) 생명력을 회복했다! (+${healAmount})</span>`);
      updateUI();
      setTimeout(processEnemyTurn, 1200);
    } else {
      executeAttack(activePlayerMon, activeEnemyMon, skill, () => {
        if (checkFainted(activeEnemyMon)) {
          handleEnemyFaint();
        } else {
          setTimeout(processEnemyTurn, 1000);
        }
      });
    }
  }

  // --- 공격 계산 및 임팩트 적용 ---
  function executeAttack(attacker, defender, skill, callback) {
    let multiplier = 1.0;
    let effectMsg = "";

    if (attacker.type === '노말') {
      if (defender.type !== '드래곤') {
        multiplier = 2.0;
        effectMsg = "⚡ 압도적인 신성 파괴력!";
      }
    } else if (attacker.type === '드래곤') {
      multiplier = 1.0;
    } else {
      if (TYPE_ADVANTAGE[attacker.type] === defender.type) {
        multiplier = 2.0;
        effectMsg = "💥 치명적인 속성 강타!";
      } else if (TYPE_ADVANTAGE[defender.type] === attacker.type) {
        multiplier = 0.5;
        effectMsg = "🛡️ 속성에 상쇄되어 약화되었다...";
      }
    }

    let damage = Math.floor(skill.power * multiplier);

    if (attacker.type === '노말' && Math.random() < 0.2) {
      damage *= 2;
      effectMsg += " 🔥[크리티컬!]";
    }

    if (defender.type === '돌') {
      damage = Math.max(5, damage - 15);
      addLog(`<span class="log-ability">🛡️ [거신 타이탄] 단단한 피부로 피해 15 경감!</span>`);
    }

    if (defender.shield > 0) {
      if (defender.shield >= damage) {
        defender.shield -= damage;
        damage = 0;
        addLog(`<span class="log-ability">🌊 [레비아탄] 심해의 방패가 피해를 완벽 흡수!</span>`);
      } else {
        damage -= defender.shield;
        defender.shield = 0;
        addLog(`<span class="log-ability">🌊 [레비아탄] 심해의 방패 파괴!</span>`);
      }
    }

    defender.hp = Math.max(0, defender.hp - damage);
    addLog(`${attacker.name}의 <span class="log-highlight">${skill.name}</span>!`);

    if (attacker.type === '드래곤') {
      defender.mp = Math.max(0, defender.mp - 15);
      addLog(`<span class="log-ability">🐲 [바하무트] 용의 위압으로 적 MP 15 감쇄!</span>`);
    }

    if (defender.type === '불' && defender.hp <= defender.maxHp * 0.5 && defender.hp > 0) {
      attacker.hp = Math.max(0, attacker.hp - 15);
      addLog(`<span class="log-ability">🔥 [헬하운드] 광폭화 반격! ${attacker.name}에게 15 피해!</span>`);
    }

    const isTargetEnemy = (defender === activeEnemyMon);
    const targetAreaId = isTargetEnemy ? 'enemy-area' : 'player-area';
    const targetSprite = document.getElementById(isTargetEnemy ? 'enemy-sprite' : 'player-sprite');
    
    setTimeout(() => {
      // 💥 임팩트 Visual 연출 실행
      playVisualImpact(targetAreaId, skill.type, false, damage);

      targetSprite.classList.add('anim-damage');
      setTimeout(() => targetSprite.classList.remove('anim-damage'), 800);

      if (effectMsg) addLog(`<span class="log-highlight">${effectMsg}</span>`);
      addLog(`${defender.name}에게 <span class="log-damage">${damage}</span>의 타격!`);
      
      updateUI();
      if (callback) callback();
    }, 300);
  }

  // --- 적 턴 ---
  function processEnemyTurn() {
    addLog(`<b>적군의 역습!</b>`);

    const usableSkills = activeEnemyMon.skills.filter(s => {
      if (s.cost > activeEnemyMon.mp) return false;
      if (s.isHeal && (activeEnemyMon.healCount <= 0 || activeEnemyMon.hp >= activeEnemyMon.maxHp * 0.8)) return false;
      return true;
    });

    const chosenSkill = usableSkills.length > 0 
      ? usableSkills[Math.floor(Math.random() * usableSkills.length)]
      : activeEnemyMon.skills[0];

    activeEnemyMon.mp -= chosenSkill.cost;

    const eSprite = document.getElementById('enemy-sprite');
    eSprite.classList.add('anim-attack-enemy');
    setTimeout(() => eSprite.classList.remove('anim-attack-enemy'), 300);

    if (chosenSkill.isHeal) {
      activeEnemyMon.healCount--;
      const healAmount = 70;
      activeEnemyMon.hp = Math.min(activeEnemyMon.maxHp, activeEnemyMon.hp + healAmount);
      
      playVisualImpact('enemy-area', '회복', true, healAmount);
      addLog(`<span class="log-heal">적군 ${activeEnemyMon.name}이(가) 생명력을 회복했다! (+${healAmount})</span>`);
      updateUI();
      endTurnRound();
    } else {
      executeAttack(activeEnemyMon, activePlayerMon, chosenSkill, () => {
        if (checkFainted(activePlayerMon)) {
          handlePlayerFaint();
        } else {
          endTurnRound();
        }
      });
    }
  }

  function endTurnRound() {
    if (!activePlayerMon.isFainted) {
      activePlayerMon.mp = Math.min(activePlayerMon.maxMp, activePlayerMon.mp + 20);
      
      if (activePlayerMon.type === '풀' && activePlayerMon.hp < activePlayerMon.maxHp) {
        activePlayerMon.hp = Math.min(activePlayerMon.maxHp, activePlayerMon.hp + 15);
        addLog(`<span class="log-ability">🌿 [베히모스] 광합성으로 HP 15 회복!</span>`);
      }
      if (activePlayerMon.type === '노말') {
        activePlayerMon.mp = Math.min(activePlayerMon.maxMp, activePlayerMon.mp + 15);
        addLog(`<span class="log-ability">✨ [아수라] 신의 가호로 MP 15 추가 수급!</span>`);
      }
    }

    if (!activeEnemyMon.isFainted) {
      activeEnemyMon.mp = Math.min(activeEnemyMon.maxMp, activeEnemyMon.mp + 20);

      if (activeEnemyMon.type === '풀' && activeEnemyMon.hp < activeEnemyMon.maxHp) {
        activeEnemyMon.hp = Math.min(activeEnemyMon.maxHp, activeEnemyMon.hp + 15);
      }
      if (activeEnemyMon.type === '노말') {
        activeEnemyMon.mp = Math.min(activeEnemyMon.maxMp, activeEnemyMon.mp + 15);
      }
    }

    updateUI();
    isTurnProcessing = false;
    renderSkills();
  }

  function checkFainted(mon) {
    if (mon.hp <= 0) {
      mon.isFainted = true;
      return true;
    }
    return false;
  }

  function handleEnemyFaint() {
    addLog(`<span class="log-damage">적군 ${activeEnemyMon.name}을(를) 완벽히 격파했다!</span>`);
    
    const nextEnemy = enemyTeam.find(m => !m.isFainted);
    if (nextEnemy) {
      setTimeout(() => {
        activeEnemyMon = nextEnemy;
        addLog(`적군 차선수 <span class="log-highlight">${activeEnemyMon.name}</span> 강림!`);
        updateUI();
        isTurnProcessing = false;
        renderSkills();
      }, 1200);
    } else {
      showGameOver(true);
    }
  }

  function handlePlayerFaint() {
    addLog(`<span class="log-damage">${activePlayerMon.name}이(가) 쓰러졌습니다!</span>`);

    const hasAliveMon = playerTeam.some(m => !m.isFainted);
    if (hasAliveMon) {
      setTimeout(showSwitchModal, 1000);
    } else {
      showGameOver(false);
    }
  }

  function showSwitchModal() {
    const modal = document.getElementById('switch-modal');
    const list = document.getElementById('switch-list');
    list.innerHTML = '';

    playerTeam.forEach((mon) => {
      if (!mon.isFainted && mon !== activePlayerMon) {
        const card = document.createElement('div');
        card.className = 'switch-card';
        card.innerHTML = `
          <div style="font-size:2.5rem;">${mon.icon}</div>
          <div style="font-weight:900; margin-top:4px;">${mon.name}</div>
          <div style="font-size:0.75rem; color:#a0aab8;">HP ${mon.hp}/${mon.maxHp}</div>
        `;
        card.onclick = () => {
          activePlayerMon = mon;
          modal.classList.remove('active');
          addLog(`긴급 교체! 출격, <span class="log-highlight">${activePlayerMon.name}</span>!`);
          updateUI();
          isTurnProcessing = false;
          renderSkills();
        };
        list.appendChild(card);
      }
    });

    modal.classList.add('active');
  }

  function showGameOver(isWin) {
    setTimeout(() => {
      document.getElementById('battle-screen').classList.remove('active');
      const resultScreen = document.getElementById('result-screen');
      const resultTitle = document.getElementById('result-title');
      const resultDesc = document.getElementById('result-desc');

      resultScreen.classList.add('active');
      if (isWin) {
        resultTitle.innerText = "VICTORY";
        resultTitle.className = "win-text";
        resultDesc.innerText = "아레나의 모든 적을 섬멸하고 완전한 승리를 거두었습니다!";
      } else {
        resultTitle.innerText = "DEFEAT";
        resultTitle.className = "lose-text";
        resultDesc.innerText = "모든 전력이 전멸하여 전투에서 패배하였습니다.";
      }
    }, 1200);
  }

  function addLog(msg) {
    const logBox = document.getElementById('log-box');
    const p = document.createElement('p');
    p.innerHTML = msg;
    logBox.appendChild(p);
    logBox.scrollTop = logBox.scrollHeight;
  }
</script>
</body>
