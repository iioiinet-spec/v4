<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Neon Tetris 10x10</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 2rem;
            color: #00f3ff;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }

        .game-container {
            display: flex;
            gap: 30px;
            background: #131b2e;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(0, 243, 255, 0.1);
            border: 1px solid #1f2942;
            position: relative;
        }

        .board-wrapper {
            position: relative;
        }

        canvas {
            background-color: #090d16;
            border: 2px solid #1f2942;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
            display: block;
            cursor: pointer;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 160px;
        }

        .panel {
            background: #090d16;
            border: 1px solid #1f2942;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .panel h3 {
            margin: 0 0 8px 0;
            font-size: 0.9rem;
            color: #8b9bb4;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .panel p {
            margin: 0;
            font-size: 1.4rem;
            font-weight: bold;
            color: #00f3ff;
            text-shadow: 0 0 5px rgba(0, 243, 255, 0.5);
        }

        .spawn-area {
            background: #090d16;
            border: 2px dashed #1f2942;
            border-radius: 8px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-top: 15px;
        }

        .spawn-area canvas {
            background: transparent;
            border: none;
            box-shadow: none;
        }

        .instructions {
            font-size: 0.8rem;
            color: #8b9bb4;
            line-height: 1.4;
            background: #090d16;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #1f2942;
        }

        /* 게임 오버 오버레이 */
        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(9, 13, 22, 0.85);
            backdrop-filter: blur(5px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            z-index: 10;
        }

        #game-over-screen h2 {
            color: #ff0055;
            font-size: 2.5rem;
            margin: 0 0 15px 0;
            text-shadow: 0 0 15px rgba(255, 0, 85, 0.7);
        }

        .btn {
            background: linear-gradient(135deg, #00f3ff, #0066ff);
            color: #090d16;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
            transition: all 0.2s ease;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.7);
        }
    </style>
</head>
<body>

    <h1>NEON TETRIS</h1>
    <div class="game-container">
        <!-- 메인 보드 -->
        <div class="board-wrapper">
            <canvas id="board" width="350" height="350"></canvas>
        </div>

        <!-- 사이드바 -->
        <div class="sidebar">
            <div style="display: flex; flex-direction: column; gap: 12px;">
                <div class="panel">
                    <h3>Score</h3>
                    <p id="score">0</p>
                </div>
                <div class="panel">
                    <h3>Lines</h3>
                    <p id="lines">0</p>
                </div>
                <div class="panel">
                    <h3>Level</h3>
                    <p id="level">1</p>
                </div>
            </div>

            <div>
                <div style="font-size: 0.8rem; color: #8b9bb4; margin-bottom: 5px; text-align: center;">NEXT BLOCK</div>
                <div class="spawn-area" id="spawn-container">
                    <canvas id="spawnCanvas" width="100" height="100"></canvas>
                </div>
            </div>

            <div class="instructions">
                <strong>조작법:</strong><br>
                하단의 대기 블록을 마우스로 <strong>클릭하여 집은 뒤</strong>, 보드판 위로 드래그하여 <strong>마우스를 놓으면</strong> 배치됩니다.
            </div>
        </div>

        <!-- 게임 오버 화면 -->
        <div id="game-over-screen">
            <h2>GAME OVER</h2>
            <button class="btn" id="restart-btn">다시하기</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('board');
        const ctx = canvas.getContext('2d');
        const spawnCanvas = document.getElementById('spawnCanvas');
        const spawnCtx = spawnCanvas.getContext('2d');

        const BLOCK_SIZE = 35; // 350 / 10 = 35px
        const COLS = 10;
        const ROWS = 10;

        let board = Array(ROWS).fill().map(() => Array(COLS).fill(0));
        let score = 0;
        let linesCleared = 0;
        let level = 1;
        let isGameOver = false;

        // 7가지 테트로미노 정의 및 네온 컬러
        const SHAPES = [
            { shape: [[1, 1, 1, 1]], color: '#00f3ff' }, // I
            { shape: [[1, 1], [1, 1]], color: '#f3ff00' }, // O
            { shape: [[0, 1, 0], [1, 1, 1]], color: '#b000ff' }, // T
            { shape: [[0, 1, 1], [1, 1, 0]], color: '#00ff66' }, // S
            { shape: [[1, 1, 0], [0, 1, 1]], color: '#ff0055' }, // Z
            { shape: [[1, 0, 0], [1, 1, 1]], color: '#ff9900' }, // J
            { shape: [[0, 0, 1], [1, 1, 1]], color: '#0066ff' }  // L
        ];

        let currentBlock = null;
        let isDragging = false;
        let dragOffset = { x: 0, y: 0 };
        let mousePos = { x: 0, y: 0 };

        function getRandomBlock() {
            const rand = SHAPES[Math.floor(Math.random() * SHAPES.length)];
            return {
                shape: rand.shape,
                color: rand.color,
                width: rand.shape[0].length,
                height: rand.shape.length
            };
        }

        function initGame() {
            board = Array(ROWS).fill().map(() => Array(COLS).fill(0));
            score = 0;
            linesCleared = 0;
            level = 1;
            isGameOver = false;
            document.getElementById('game-over-screen').style.display = 'none';
            currentBlock = getRandomBlock();
            updateUI();
            draw();
        }

        function updateUI() {
            document.getElementById('score').innerText = score;
            document.getElementById('lines').innerText = linesCleared;
            document.getElementById('level').innerText = level;
        }

        // 블록 그리기 헬퍼 함수 (네온 효과)
        function drawBlock(context, x, y, size, color) {
            context.fillStyle = color;
            context.shadowColor = color;
            context.shadowBlur = 10;
            context.fillRect(x + 1, y + 1, size - 2, size - 2);
            context.shadowBlur = 0; // 초기화
        }

        // 전체 화면 렌더링
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            spawnCtx.clearRect(0, 0, spawnCanvas.width, spawnCanvas.height);

            // 1. 격자 선 그리기 (은은하게)
            ctx.strokeStyle = '#162038';
            ctx.lineWidth = 1;
            for (let i = 0; i <= COLS; i++) {
                ctx.beginPath();
                ctx.moveTo(i * BLOCK_SIZE, 0);
                ctx.lineTo(i * BLOCK_SIZE, canvas.height);
                ctx.stroke();
            }
            for (let j = 0; j <= ROWS; j++) {
                ctx.beginPath();
                ctx.moveTo(0, j * BLOCK_SIZE);
                ctx.lineTo(canvas.width, j * BLOCK_SIZE);
                ctx.stroke();
            }

            // 2. 보드에 고정된 블록들 그리기
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (board[r][c] !== 0) {
                        drawBlock(ctx, c * BLOCK_SIZE, r * BLOCK_SIZE, BLOCK_SIZE, board[r][c]);
                    }
                }
            }

            // 3. 하단 스폰 영역의 대기 블록 그리기 (드래그 중이 아닐 때)
            if (currentBlock && !isDragging) {
                const bW = currentBlock.shape[0].length * 20;
                const bH = currentBlock.shape.length * 20;
                const startX = (spawnCanvas.width - bW) / 2;
                const startY = (spawnCanvas.height - bH) / 2;

                for (let r = 0; r < currentBlock.shape.length; r++) {
                    for (let c = 0; c < currentBlock.shape[r].length; c++) {
                        if (currentBlock.shape[r][c]) {
                            drawBlock(spawnCtx, startX + c * 20, startY + r * 20, 20, currentBlock.color);
                        }
                    }
                }
            }

            // 4. 드래그 중인 블록 그리기
            if (currentBlock && isDragging) {
                const drawX = mousePos.x - dragOffset.x;
                const drawY = mousePos.y - dragOffset.y;

                for (let r = 0; r < currentBlock.shape.length; r++) {
                    for (let c = 0; c < currentBlock.shape[r].length; c++) {
                        if (currentBlock.shape[r][c]) {
                            drawBlock(ctx, drawX + c * BLOCK_SIZE, drawY + r * BLOCK_SIZE, BLOCK_SIZE, currentBlock.color);
                        }
                    }
                }
            }
        }

        // 마우스 이벤트 처리 (드래그 앤 드롭)
        spawnCanvas.addEventListener('mousedown', (e) => {
            if (isGameOver || !currentBlock) return;
            isDragging = true;
            
            // 마우스 포인터를 블록의 중앙 기준으로 설정
            dragOffset.x = (currentBlock.shape[0].length * BLOCK_SIZE) / 2;
            dragOffset.y = (currentBlock.shape.length * BLOCK_SIZE) / 2;

            const rect = canvas.getBoundingClientRect();
            mousePos = {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
            draw();
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const rect = canvas.getBoundingClientRect();
            mousePos = {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
            draw();
        });

        window.addEventListener('mouseup', (e) => {
            if (!isDragging || !currentBlock) return;
            isDragging = false;

            const rect = canvas.getBoundingClientRect();
            const dropX = e.clientX - rect.left;
            const dropY = e.clientY - rect.top;

            // 드랍된 위치를 보드 격자 좌표로 변환
            const targetCol = Math.floor((dropX - dragOffset.x + BLOCK_SIZE / 2) / BLOCK_SIZE);
            const targetRow = Math.floor((dropY - dragOffset.y + BLOCK_SIZE / 2) / BLOCK_SIZE);

            if (canPlace(currentBlock, targetCol, targetRow)) {
                placeBlock(currentBlock, targetCol, targetRow);
                checkLines();
                
                // 새로운 블록 생성 및 게임 오버 체크
                currentBlock = getRandomBlock();
                if (!hasAnyValidMove(currentBlock)) {
                    isGameOver = true;
                    document.getElementById('game-over-screen').style.display = 'flex';
                }
            }
            draw();
        });

        function canPlace(block, col, row) {
            for (let r = 0; r < block.shape.length; r++) {
                for (let c = 0; c < block.shape[r].length; c++) {
                    if (block.shape[r][c]) {
                        let boardR = row + r;
                        let boardC = col + c;
                        if (boardR < 0 || boardR >= ROWS || boardC < 0 || boardC >= COLS) return false;
                        if (board[boardR][boardC] !== 0) return false;
                    }
                }
            }
            return true;
        }

        function placeBlock(block, col, row) {
            for (let r = 0; r < block.shape.length; r++) {
                for (let c = 0; c < block.shape[r].length; c++) {
                    if (block.shape[r][c]) {
                        board[row + r][col + c] = block.color;
                    }
                }
            }
        }

        function checkLines() {
            let rowsToClear = [];

            // 가로 줄 검사
            for (let r = 0; r < ROWS; r++) {
                if (board[r].every(cell => cell !== 0)) {
                    rowsToClear.push(r);
                }
            }

            // 세로 줄 검사
            let colsToClear = [];
            for (let c = 0; c < COLS; c++) {
                let isFull = true;
                for (let r = 0; r < ROWS; r++) {
                    if (board[r][c] === 0) {
                        isFull = false;
                        break;
                    }
                }
                if (isFull) colsToClear.push(c);
            }

            let clearedCount = rowsToClear.length + colsToClear.length;

            if (clearedCount > 0) {
                // 가로 줄 비우기
                rowsToClear.forEach(r => {
                    for (let c = 0; c < COLS; c++) board[r][c] = 0;
                });
                // 세로 줄 비우기
                colsToClear.forEach(c => {
                    for (let r = 0; r < ROWS; r++) board[r][c] = 0;
                });

                // 점수 계산
                score += clearedCount * 100 * level;
                linesCleared += clearedCount;
                level = Math.floor(linesCleared / 5) + 1;
                updateUI();
            }
        }

        // 현재 블록을 놓을 수 있는 공간이 보드에 단 하나라도 있는지 확인
        function hasAnyValidMove(block) {
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (canPlace(block, c, r)) return true;
                }
            }
            return false;
        }

        document.getElementById('restart-btn').addEventListener('click', initGame);

        // 초기 실행
        initGame();
    </script>
</body>
</html>
