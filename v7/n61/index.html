<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포켓몬 가오레 - 완전 랜덤 등장 및 코스 시스템</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background: radial-gradient(circle, #1b2735 0%, #090a0f 100%);
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .game-container {
            max-width: 700px;
            margin: 0 auto;
            background: rgba(20, 20, 35, 0.95);
            border: 3px solid #f1c40f;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
        }
        h1 {
            color: #f1c40f;
            text-shadow: 2px 2px #e74c3c;
            margin-bottom: 5px;
        }
        .subtitle {
            font-size: 13px;
            color: #bdc3c7;
            margin-bottom: 15px;
        }
        .user-bar {
            background: rgba(0,0,0,0.4);
            padding: 8px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }
        .screen {
            background: #0d1117;
            border: 3px solid #34495e;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            min-height: 260px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .disk-card {
            background: linear-gradient(135deg, #2c3e50, #34495e);
            border: 3px solid #f39c12;
            border-radius: 15px;
            padding: 15px;
            width: 75%;
            margin: 10px 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .grade-5 { border-color: #9b59b6; background: linear-gradient(135deg, #4a235a, #2c3e50); }
        .grade-4 { border-color: #3498db; background: linear-gradient(135deg, #1b4f72, #2c3e50); }
        .grade-3 { border-color: #e67e22; background: linear-gradient(135deg, #784212, #2c3e50); }
        .grade-2 { border-color: #f1c40f; background: linear-gradient(135deg, #7d6608, #2c3e50); }
        .grade-1 { border-color: #95a5a6; background: linear-gradient(135deg, #34495e, #2c3e50); }
        
        .pokemon-img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            image-rendering: pixelated;
            background: rgba(0,0,0,0.3);
            border-radius: 50%;
            padding: 5px;
            margin-bottom: 5px;
            border: 2px solid #555;
        }

        .silhouette {
            filter: brightness(0) invert(0);
        }

        .hp-bar-container {
            background: #555;
            border-radius: 10px;
            overflow: hidden;
            height: 16px;
            width: 100%;
            margin-top: 8px;
            border: 1px solid #222;
        }
        .hp-bar {
            background: #2ecc71;
            height: 100%;
            width: 100%;
            transition: width 0.1s linear;
        }
        input {
            width: 80%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #444;
            background: #222;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin: 5px;
            box-shadow: 0 4px #c0392b;
            transition: 0.1s;
        }
        button:active {
            transform: translateY(4px);
            box-shadow: 0 0 #c0392b;
        }
        button:hover {
            background: #ff5252;
        }
        .sub-btn { background: #3498db; box-shadow: 0 4px #2980b9; }
        .sub-btn:hover { background: #54a0ff; }
        .select-btn { background: #27ae60; box-shadow: 0 4px #1e8449; padding: 6px 12px; font-size: 13px; }
        
        #log {
            font-size: 15px;
            margin-top: 15px;
            min-height: 45px;
            color: #00ffff;
            font-weight: bold;
        }
        .flex-box {
            display: flex;
            justify-content: space-around;
            width: 100%;
        }
        .d-none { display: none !important; }
        .storage-list {
            max-height: 200px;
            overflow-y: auto;
            width: 100%;
            text-align: left;
            padding: 5px;
        }
        .storage-item {
            background: #1e272e;
            padding: 8px 12px;
            margin: 5px 0;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #f1c40f;
        }
        .encounter-select, .course-select {
            display: flex;
            justify-content: space-around;
            width: 100%;
            margin-top: 5px;
            flex-wrap: wrap;
        }
        .choice-card, .course-card {
            background: #1e272e;
            border: 2px solid #555;
            border-radius: 10px;
            padding: 10px;
            width: 30%;
            cursor: pointer;
            transition: 0.2s;
            box-sizing: border-box;
            margin-bottom: 10px;
        }
        .choice-card { width: 18%; padding: 8px; }
        .choice-card:hover, .course-card:hover {
            border-color: #f1c40f;
            transform: translateY(-3px);
        }

        .gauge-outer {
            background: #222;
            border: 2px solid #f1c40f;
            border-radius: 15px;
            width: 100%;
            height: 24px;
            margin: 6px 0;
            overflow: hidden;
            position: relative;
        }
        .gauge-inner {
            background: linear-gradient(90deg, #f39c12, #e74c3c);
            height: 100%;
            width: 0%;
            transition: width 0.1s ease-out;
        }
        .gauge-text {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 12px;
            text-shadow: 1px 1px #000;
        }
        .battle-divider {
            width: 100%;
            border: none;
            border-top: 2px solid #f1c40f;
            margin: 6px 0;
        }
    </style>
</head>
<body>
<div class="game-container">
    <h1>POKEMON GA-OLE</h1>
    <div class="subtitle">랜덤 코스 표지 & 완전 랜덤 5마리 조우 시스템</div>
    
    <!-- 로그인 영역 -->
    <div id="auth-screen" class="screen">
        <div id="login-box" style="width:100%;">
            <h2>로그인</h2>
            <input type="text" id="login-id" placeholder="아이디"><br>
            <input type="password" id="login-pw" placeholder="비밀번호"><br>
            <button onclick="processLogin()">로그인</button><br>
            <button class="sub-btn" onclick="switchView('register')">회원가입하기</button>
        </div>

        <div id="register-box" class="d-none" style="width:100%;">
            <h2>회원가입</h2>
            <input type="text" id="reg-id" placeholder="사용할 아이디"><br>
            <input type="password" id="reg-pw" placeholder="사용할 비밀번호"><br>
            <button onclick="processRegister()">가입 완료</button><br><button class="sub-btn" onclick="switchView('login')">로그인 화면으로</button>
        </div>
    </div>

    <!-- 게임 메인 영역 -->
    <div id="game-main-screen" class="d-none">
        <div class="user-bar">
            <span>👤 트레이너: <b id="current-user-name" style="color:#f1c40f;"></b></span>
            <div>
                <button class="sub-btn" style="padding:6px 12px; font-size:12px;" onclick="openStorage()">내 디스크 보관함</button>
                <button class="sub-btn" style="padding:6px 12px; font-size:12px; background:#d63031; box-shadow:0 3px #b22222;" onclick="logout()">로그아웃</button>
            </div>
        </div>

        <div class="screen">
            <div id="content">
                <h2>메인 메뉴</h2>
                <p>디스크를 기계에 세팅하고 모험을 시작하세요!</p>
            </div>
            <div id="log">버튼을 눌러 코스를 선택하세요.</div>
        </div>
        
        <div id="controls">
            <button id="action-btn" onclick="progressGame()">모험 시작하기</button>
        </div>
    </div>
</div>

<script>
    const pokemonDatabase = {
        "캐터피": { name: "캐터피", grade: 1, hp: 60, maxHp: 60, attack: 15, id: 10 },
        "뿔충이": { name: "뿔충이", grade: 1, hp: 60, maxHp: 60, attack: 15, id: 13 },
        "구구": { name: "구구", grade: 1, hp: 65, maxHp: 65, attack: 16, id: 16 },
        "꼬렛": { name: "꼬렛", grade: 1, hp: 65, maxHp: 65, attack: 17, id: 19 },
        
        "피카츄": { name: "피카츄", grade: 2, hp: 85, maxHp: 85, attack: 25, id: 25 },
        "이상해씨": { name: "이상해씨", grade: 2, hp: 80, maxHp: 80, attack: 22, id: 1 },
        "파이리": { name: "파이리", grade: 2, hp: 75, maxHp: 75, attack: 24, id: 4 },
        "꼬부기": { name: "꼬부기", grade: 2, hp: 80, maxHp: 80, attack: 23, id: 7 },

        "라이츄": { name: "라이츄", grade: 3, hp: 110, maxHp: 110, attack: 35, id: 26 },
        "이상해꽃": { name: "이상해꽃", grade: 3, hp: 120, maxHp: 120, attack: 34, id: 3 },
        "리자몽": { name: "리자몽", grade: 3, hp: 115, maxHp: 115, attack: 38, id: 6 },
        "거북왕": { name: "거북왕", grade: 3, hp: 125, maxHp: 125, attack: 33, id: 9 },

        "망나뇽": { name: "망나뇽", grade: 4, hp: 150, maxHp: 150, attack: 48, id: 149 },
        "마기라스": { name: "마기라스", grade: 4, hp: 155, maxHp: 155, attack: 50, id: 248 },
        "한카리아스": { name: "한카리아스", grade: 4, hp: 160, maxHp: 160, attack: 52, id: 445 },

        "뮤츠": { name: "뮤츠", grade: 5, hp: 190, maxHp: 190, attack: 68, id: 150 },
        "레쿠쟈": { name: "레쿠쟈", grade: 5, hp: 200, maxHp: 200, attack: 72, id: 384 },
        "아르세우스": { name: "아르세우스", grade: 5, hp: 220, maxHp: 220, attack: 78, id: 493 }
    };

    let currentUser = null;
    let currentEnemy = null;
    let myActivePokemon = null; 
    let selectedFeaturePokemon = null; // 코스 표지 포켓몬 이름
    let gameState = "MENU"; 

    let spaceCount = 0;
    let enemySpaceCount = 0;
    let timerInterval = null;
    let timeLeft = 10;
    let battleTimerInterval = null;
    let battleTimeLeft = 5;
    let keyReleased = true;

    function getSprite(id) {
        return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`;
    }

    window.onload = function() {
        const savedUser = localStorage.getItem("gaole_logged_user");
        if (savedUser) {
            currentUser = savedUser;
            checkStarterAndStart();
        }
    };

    function switchView(viewName) {
        const loginBox = document.getElementById("login-box");
        const registerBox = document.getElementById("register-box");
        if (viewName === 'register') {
            loginBox.classList.add("d-none");
            registerBox.classList.remove("d-none");
        } else {
            registerBox.classList.add("d-none");
            loginBox.classList.remove("d-none");
        }
    }

    function processRegister() {
        const id = document.getElementById("reg-id").value.trim();
        const pw = document.getElementById("reg-pw").value.trim();
        if (!id || !pw) { alert("아이디와 비밀번호를 모두 입력해주세요."); return; }
        if (localStorage.getItem("gaole_user_" + id)) { alert("이미 존재하는 아이디입니다."); return; }

        localStorage.setItem("gaole_user_" + id, pw);
        localStorage.setItem("gaole_storage_" + id, JSON.stringify([]));
        localStorage.setItem("gaole_active_" + id, ""); 
        alert("회원가입 완료! 로그인해주세요.");
        switchView('login');
    }

    function processLogin() {
        const id = document.getElementById("login-id").value.trim();
        const pw = document.getElementById("login-pw").value.trim();
        const savedPw = localStorage.getItem("gaole_user_" + id);

        if (!savedPw || savedPw !== pw) {
            alert("아이디 또는 비밀번호가 올바르지 않습니다.");
            return;
        }

        currentUser = id;
        localStorage.setItem("gaole_logged_user", id);
        checkStarterAndStart();
    }

    function logout() {
        localStorage.removeItem("gaole_logged_user");
        currentUser = null;
        document.getElementById("game-main-screen").classList.add("d-none");
        document.getElementById("auth-screen").classList.remove("d-none");
        document.getElementById("login-id").value = "";
        document.getElementById("login-pw").value = "";
        switchView('login');
    }

    function checkStarterAndStart() {
        document.getElementById("auth-screen").classList.add("d-none");
        document.getElementById("game-main-screen").classList.remove("d-none");
        document.getElementById("current-user-name").innerText = currentUser;

        let activeName = localStorage.getItem("gaole_active_" + currentUser);
        let storageKey = "gaole_storage_" + currentUser;
        let myDisks = JSON.parse(localStorage.getItem(storageKey)) || [];

        if (!activeName || myDisks.length === 0) {
            showStarterSelectScreen();
        } else {
            myActivePokemon = JSON.parse(JSON.stringify(pokemonDatabase[activeName]));
            resetMenu();
        }
    }

    function showStarterSelectScreen() {
        gameState = "STARTER_SELECT";
        const content = document.getElementById("content");
        const log = document.getElementById("log");
        const btn = document.getElementById("action-btn");

        content.innerHTML = `
            <h2>첫 번째 파트너 포켓몬을 선택하세요!</h2>
            <div class="encounter-select">
                <div class="choice-card" onclick="selectStarter('피카츄')" style="width:22%;">
                    <img src="${getSprite(25)}" class="pokemon-img" style="width:50px; height:50px;">
                    <p style="font-size:11px; margin:2px 0;"><b>피카츄</b><br>(2성)</p>
                </div>
                <div class="choice-card" onclick="selectStarter('파이리')" style="width:22%;">
                    <img src="${getSprite(4)}" class="pokemon-img" style="width:50px; height:50px;">
                    <p style="font-size:11px; margin:2px 0;"><b>파이리</b><br>(2성)</p>
                </div>
                <div class="choice-card" onclick="selectStarter('이상해씨')" style="width:22%;">
                    <img src="${getSprite(1)}" class="pokemon-img" style="width:50px; height:50px;">
                    <p style="font-size:11px; margin:2px 0;"><b>이상해씨</b><br>(2성)</p>
                </div>
                <div class="choice-card" onclick="selectStarter('꼬부기')" style="width:22%;">
                    <img src="${getSprite(7)}" class="pokemon-img" style="width:50px; height:50px;">
                    <p style="font-size:11px; margin:2px 0;"><b>꼬부기</b><br>(2성)</p>
                </div>
            </div>
        `;
        log.innerText = "당신과 함께 모험할 첫 디스크 포켓몬을 골라주세요!";
        btn.style.display = "none";
    }

    function selectStarter(name) {
        let starterData = pokemonDatabase[name];
        let storageKey = "gaole_storage_" + currentUser;
        let myDisks = JSON.parse(localStorage.getItem(storageKey)) || [];

        myDisks.push({ name: starterData.name, grade: starterData.grade, id: starterData.id });
        localStorage.setItem(storageKey, JSON.stringify(myDisks));
        localStorage.setItem("gaole_active_" + currentUser, starterData.name);

        myActivePokemon = JSON.parse(JSON.stringify(starterData));
        alert(`축하합니다! ${name} 디스크를 기계에 세팅했습니다!`);
        resetMenu();
    }

    function resetMenu() {
        gameState = "MENU";
        const content = document.getElementById("content");
        const log = document.getElementById("log");
        const btn = document.getElementById("action-btn");

        btn.style.display = "inline-block";
        content.innerHTML = `
            <h2>메인 메뉴</h2>
            <p>현재 세팅된 내 디스크: <b>${myActivePokemon.name}</b> (⭐️${myActivePokemon.grade})</p>
            <p>랜덤 코스를 선택하여 모험을 시작하세요!</p>
        `;
        log.innerText = "버튼을 눌러 랜덤 코스 선택 화면으로 이동하세요.";
        btn.innerText = "코스 선택하기";
    }

    function progressGame() {
        const btn = document.getElementById("action-btn");
        if (gameState === "MENU") {
            showCourseSelection();
        } else if (gameState === "CATCH") {
            resetMenu();
        } else if (gameState === "END") {
            resetMenu();
        }
    }

    // [랜덤 코스 선택 화면: 3개의 랜덤 표지 포켓몬 제시]
    function showCourseSelection() {
        const content = document.getElementById("content");
        const log = document.getElementById("log");
        const btn = document.getElementById("action-btn");

        gameState = "COURSE_SELECT";
        btn.style.display = "none";

        // 데이터베이스에서 무작위로 3마리 포켓몬을 골라 코스 표지로 지정
        let allKeys = Object.keys(pokemonDatabase);
        let randomKeys = [];
        while (randomKeys.length < 3) {
            let randKey = allKeys[Math.floor(Math.random() * allKeys.length)];
            if (!randomKeys.includes(randKey)) {
                randomKeys.push(randKey);
            }
        }

        content.innerHTML = `
            <h2>탐색할 코스를 선택하세요 (표지 포켓몬 등장 확률 2배!)</h2>
            <div class="course-select">
                ${randomKeys.map(key => {
                    let poke = pokemonDatabase[key];
                    return `
                        <div class="course-card" onclick="selectCourse('${poke.name}')">
                            <img src="${getSprite(poke.id)}" class="pokemon-img" style="width:55px; height:55px;">
                            <h3 style="color:#f1c40f; margin:3px 0; font-size:13px;">${poke.name} 코스</h3>
                            <p style="font-size:10px; color:#bdc3c7; margin:0;">⭐️ ${poke.grade}성 등장 확률 2배!</p>
                        </div>
                    `;
                }).join('')}
            </div>
        `;
        log.innerText = "원하는 표지의 랜덤 코스를 선택해주세요!";
    }

    function selectCourse(pokeName) {
        selectedFeaturePokemon = pokeName;
        startSpawnPhase();
    }

    // [부르기 (스페이스바 연타로 5마리 완전 랜덤 포켓몬 등장)]
    let spawnedEncounterList = [];

    function startSpawnPhase() {
        const content = document.getElementById("content");
        const btn = document.getElementById("action-btn");
        const log = document.getElementById("log");

        gameState = "SPAWN_BASH";
        spaceCount = 0;
        timeLeft = 10;
        btn.style.display = "none";

        spawnedEncounterList = [
            getRandomPokemonWithFeatureBonus(),
            getRandomPokemonWithFeatureBonus(),
            getRandomPokemonWithFeatureBonus(),
            getRandomPokemonWithFeatureBonus(),
            getRandomPokemonWithFeatureBonus()
        ];

        content.innerHTML = `
            <h2>[${selectedFeaturePokemon} 코스] 포켓몬을 불러내라!</h2>
            <div class="gauge-outer">
                <div id="spawn-gauge" class="gauge-inner" style="width: 0%;"></div>
                <div class="gauge-text" id="spawn-text">연타 횟수: 0회 (남은 시간: 10초)</div>
            </div>
            <div class="encounter-select" style="margin-top:10px;">
                ${spawnedEncounterList.map((poke) => `
                    <div class="choice-card grade-${poke.grade}" style="width:18%;">
                        <img src="${getSprite(poke.id)}" class="pokemon-img silhouette" style="width:35px; height:35px;">
                        <p style="font-size:9px; margin:2px 0;">⭐️ ${poke.grade}성</p>
                    </div>
                `).join('')}
            </div>
        `;
        log.innerText = "10초 동안 스페이스바를 연타해 포켓몬을 불러내세요!";

        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                finishSpawnPhase();
            } else {
                updateSpawnGauge();
            }
        }, 1000);
    }

    function updateSpawnGauge() {
        let textElem = document.getElementById("spawn-text");
        let gaugeElem = document.getElementById("spawn-gauge");

        if (textElem) {
            textElem.innerText = `연타 횟수: ${spaceCount}회 (남은 시간: ${timeLeft}초)`;
            let percent = Math.min(100, (spaceCount / 40) * 100);
            gaugeElem.style.width = percent + "%";
        }
    }

    function finishSpawnPhase() {
        const content = document.getElementById("content");
        const log = document.getElementById("log");

        gameState = "ENCOUNTER_SELECT";

        content.innerHTML = `
            <h2>부르기 완료! 싸울 상대를 선택하세요</h2>
            <div class="encounter-select">
                ${spawnedEncounterList.map((poke) => `
                    <div class="choice-card grade-${poke.grade}" onclick='startBattleWithEnemy(${JSON.stringify(poke)})'>
                        <img src="${getSprite(poke.id)}" class="pokemon-img" style="width:45px; height:45px;">
                        <p style="font-size:10px; margin:2px 0;"><b>⭐️ ${poke.grade}성</b><br>${poke.name}</p>
                    </div>
                `).join('')}
            </div>
        `;
        log.innerText = `총 ${spaceCount}번 연타! 등장한 포켓몬 중 배틀할 상대를 선택하세요.`;
    }

    // 표지 포켓몬 등장 확률 2배 및 완전 랜덤 포켓몬 추출 로직
    function getRandomPokemonWithFeatureBonus() {
        let allPokemon = Object.values(pokemonDatabase);
        let bonus = Math.min(20, spaceCount * 0.4);

        let featureTarget = pokemonDatabase[selectedFeaturePokemon];
        let featureChance = (featureTarget.grade === 5 ? 0.05 : featureTarget.grade === 3 ? 0.25 : 0.40) * 2; 
        featureChance += (bonus * 0.01);

        if (Math.random() < featureChance) {
            return JSON.parse(JSON.stringify(featureTarget));
        }

        // 완전 랜덤 등급 및 포켓몬 추첨
        let rand = Math.random() * 100;
        let targetGrade = 1;
        if (rand < (0.5 + bonus * 0.05)) targetGrade = 5;
        else if (rand < (8 + bonus * 0.3)) targetGrade = 4;
        else if (rand < (25 + bonus)) targetGrade = 3;
        else if (rand < 60) targetGrade = 2;
        else targetGrade = 1;

        let pool = allPokemon.filter(p => p.grade === targetGrade);
        let selected = pool[Math.floor(Math.random() * pool.length)];
        return JSON.parse(JSON.stringify(selected));
    }

    function startBattleWithEnemy(enemyObj) {
        currentEnemy = enemyObj;
        myActivePokemon.hp = myActivePokemon.maxHp;
        gameState = "BATTLE_BASH";
        spaceCount = 0;
        enemySpaceCount = 0;
        battleTimeLeft = 5;
        keyReleased = true;

        updateBattleScreen();
        const log = document.getElementById("log");
        log.innerText = `[${myActivePokemon.name}] 디스크 세팅 완료! 5초 동안 빠르게 연타하여 공격하세요!`;

        if (battleTimerInterval) clearInterval(battleTimerInterval);
        battleTimerInterval = setInterval(() => {
            battleTimeLeft--;
            enemySpaceCount += (currentEnemy.grade * 1.5);

            if (battleTimeLeft <= 0) {
                clearInterval(battleTimerInterval);
                executeBattleAttack();
            } else {
                updateBattleGaugesOnly();
                let textElem = document.getElementById("battle-timer-text");
                if (textElem) textElem.innerText = `[ 배틀 진행 중 ] 남은 시간: ${battleTimeLeft}초`;
            }
        }, 1000);
    }

    window.addEventListener("keydown", function(e) {
        if (e.code === "Space") {
            if (gameState === "SPAWN_BASH") {
                e.preventDefault();
                spaceCount++;
                updateSpawnGauge();
            } else if (gameState === "BATTLE_BASH") {
                e.preventDefault();
                if (keyReleased) {
                    spaceCount++;
                    keyReleased = false;
                    updateBattleGaugesOnly();
                }
            }
        }
    });

    window.addEventListener("keyup", function(e) {
        if (e.code === "Space") {
            if (gameState === "BATTLE_BASH") {
                keyReleased = true;
            }
        }
    });

    function updateBattleGaugesOnly() {
        let myGauge = document.getElementById("my-gauge");
        let myText = document.getElementById("my-gauge-text");
        let enemyGauge = document.getElementById("enemy-gauge");
        let enemyText = document.getElementById("enemy-gauge-text");

        if (myGauge && enemyGauge) {
            let myPercent = Math.min(100, (spaceCount / 25) * 100);
            let enemyPercent = Math.min(100, (enemySpaceCount / 25) * 100);

            myGauge.style.width = myPercent + "%";
            myText.innerText = `내 공격 연타: ${spaceCount}회`;

            enemyGauge.style.width = enemyPercent + "%";
            enemyText.innerText = `상대 반격 연타: ${Math.floor(enemySpaceCount)}회`;
        }
    }

    function executeBattleAttack() {
        let pDmg = Math.floor(spaceCount * 3.5) + myActivePokemon.attack;
        let eDmg = Math.floor(enemySpaceCount * 3) + currentEnemy.attack;

        currentEnemy.hp = Math.max(0, currentEnemy.hp - pDmg);
        myActivePokemon.hp = Math.max(0, myActivePokemon.hp - eDmg);

        updateBattleScreen();

        const log = document.getElementById("log");
        log.innerHTML = `내 디스크 공격으로 ${pDmg} 피해! (상대의 반격으로 ${eDmg} 피해 발생!)`;

        if (currentEnemy.hp <= 0) {
            setTimeout(() => triggerCatchPhase(), 1500);
            return;
        }

        if (myActivePokemon.hp <= 0) {
            setTimeout(() => {
                gameState = "CATCH";
                const content = document.getElementById("content");
                const btn = document.getElementById("action-btn");
                content.innerHTML = `
                    <h2>배틀 패배... 😭</h2>
                    <img src="${getSprite(currentEnemy.id)}" class="pokemon-img">
                    <p style="margin:5px 0;">내 포켓몬 디스크가 버티지 못했습니다.</p>
                `;
                log.innerText = "아쉽게 패배했습니다.";
                btn.style.display = "inline-block";
                btn.innerText = "메인으로 돌아가기";
            }, 1500);
            return;
        }

        setTimeout(() => {
            spaceCount = 0;
            enemySpaceCount = 0;
            battleTimeLeft = 5;
            keyReleased = true;
            log.innerHTML += `<br>치열한 공방전! 다음 5초 연타를 시작하세요!`;

            if (battleTimerInterval) clearInterval(battleTimerInterval);
            battleTimerInterval = setInterval(() => {
                battleTimeLeft--;
                enemySpaceCount += (currentEnemy.grade * 1.5);

                if (battleTimeLeft <= 0) {
                    clearInterval(battleTimerInterval);
                    executeBattleAttack();
                } else {
                    updateBattleGaugesOnly();
                    let textElem = document.getElementById("battle-timer-text");
                    if (textElem) textElem.innerText = `[ 배틀 진행 중 ] 남은 시간: ${battleTimeLeft}초`;
                }
            }, 1000);
        }, 1500);
    }

    function triggerCatchPhase() {
        gameState = "CATCH";
        const content = document.getElementById("content");
        const log = document.getElementById("log");
        const btn = document.getElementById("action-btn");

        content.innerHTML = `
            <h2>포켓몬 찬스! 🎉</h2>
            <img src="${getSprite(currentEnemy.id)}" class="pokemon-img">
            <p style="color:#f1c40f; font-size:18px; margin:5px;">${currentEnemy.name} 포획 성공!</p>
            <p style="font-size:13px; margin:0;">디스크가 보관함에 저장되었습니다.</p>
        `;
        log.innerText = "축하합니다! 새로운 디스크를 획득했습니다.";

        let storageKey = "gaole_storage_" + currentUser;
        let myDisks = JSON.parse(localStorage.getItem(storageKey)) || [];
        let exists = myDisks.some(d => d.name === currentEnemy.name);
        if (!exists) {
            myDisks.push({ name: currentEnemy.name, grade: currentEnemy.grade, id: currentEnemy.id });
            localStorage.setItem(storageKey, JSON.stringify(myDisks));
        }

        btn.style.display = "inline-block";
        btn.innerText = "메인으로 돌아가기";
    }

    function updateBattleScreen() {
        const content = document.getElementById("content");
        content.innerHTML = `
            <h3 style="margin:0 0 4px 0;" id="battle-timer-text">[ 배틀 진행 중 ] 결과 계산 중</h3>
            
            <hr class="battle-divider">

            <div class="gauge-outer" style="margin: 3px 0;">
                <div id="my-gauge" class="gauge-inner" style="width: ${(spaceCount/25)*100}%;"></div>
                <div class="gauge-text" id="my-gauge-text">내 공격 연타: ${spaceCount}회</div>
            </div>

            <div class="gauge-outer" style="margin: 3px 0;">
                <div id="enemy-gauge" class="gauge-inner" style="width: ${(enemySpaceCount/25)*100}%; background: linear-gradient(90deg, #c0392b, #8e44ad);"></div>
                <div class="gauge-text" id="enemy-gauge-text">상대 반격 연타: ${Math.floor(enemySpaceCount)}회</div>
            </div>

            <hr class="battle-divider">

            <div class="flex-box" style="margin-top: 4px;">
                <div class="disk-card grade-${myActivePokemon.grade}" style="width: 45%; margin:0; padding:6px;">
                    <img src="${getSprite(myActivePokemon.id)}" class="pokemon-img" style="width:50px; height:50px; margin-bottom:2px;">
                    <p style="margin:0; font-weight:bold; font-size:11px;">${myActivePokemon.name} (⭐️${myActivePokemon.grade})</p>
                    <div class="hp-bar-container" style="height:10px; margin-top:3px;"><div class="hp-bar" style="width: ${(myActivePokemon.hp / myActivePokemon.maxHp) * 100}%"></div></div>
                    <p style="font-size:9px; margin:2px 0 0 0;">HP: ${myActivePokemon.hp}/${myActivePokemon.maxHp}</p>
                </div>
                <div class="disk-card grade-${currentEnemy.grade}" style="width: 45%; margin:0; padding:6px;">
                    <img src="${getSprite(currentEnemy.id)}" class="pokemon-img" style="width:50px; height:50px; margin-bottom:2px;">
                    <p style="margin:0; font-weight:bold; font-size:11px;">${currentEnemy.name} (⭐️${currentEnemy.grade})</p>
                    <div class="hp-bar-container" style="height:10px; margin-top:3px;"><div class="hp-bar" style="width: ${(currentEnemy.hp / currentEnemy.maxHp) * 100}%; background: #e74c3c;"></div></div>
                    <p style="font-size:9px; margin:2px 0 0 0;">HP: ${currentEnemy.hp}/${currentEnemy.maxHp}</p>
                </div>
            </div>
        `;
    }

    function openStorage() {
        let storageKey = "gaole_storage_" + currentUser;
        let myDisks = JSON.parse(localStorage.getItem(storageKey)) || [];
        
        let content = document.getElementById("content");
        let log = document.getElementById("log");
        let btn = document.getElementById("action-btn");

        content.innerHTML = `
            <h2>🗂️ ${currentUser}님의 디스크 보관함</h2>
            <p style="font-size:12px; color:#f1c40f; margin:0 0 5px 0;">카드를 선택하면 기계에 세팅할 파트너 디스크로 지정됩니다!</p>
            <div class="storage-list">
                ${myDisks.length === 0 ? '<p style="text-align:center; color:#888;">저장된 디스크가 없습니다.</p>' : 
                  myDisks.map(d => `
                    <div class="storage-item">
                        <div style="display:flex; align-items:center;">
                            <img src="${getSprite(d.id)}" style="width:35px; height:35px; margin-right:10px; background:rgba(0,0,0,0.3); border-radius:50%;">
                            <span>⭐️ ${d.grade}성 <b>${d.name}</b> ${myActivePokemon.name === d.name ? '(★세팅됨)' : ''}</span>
                        </div>
                        <button class="select-btn" onclick="setActivePokemon('${d.name}')">디스크 세팅</button>
                    </div>
                  `).join('')}
            </div>
        `;
        log.innerText = `보관함에 총 ${myDisks.length}개의 디스크가 있습니다.`;
        btn.style.display = "inline-block";
        btn.innerText = "메인으로 돌아가기";
        gameState = "END";
    }

    function setActivePokemon(pokeName) {
        let baseData = pokemonDatabase[pokeName];
        if (baseData) {
            myActivePokemon = JSON.parse(JSON.stringify(baseData));
            localStorage.setItem("gaole_active_" + currentUser, pokeName);
            alert(`[${pokeName}] 디스크가 기계에 세팅되었습니다!`);
            openStorage();
        }
    }
</script>
</body>
</html>
