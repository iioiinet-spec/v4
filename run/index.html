function initClouds(){for(let i=0;i<8;i++)clouds.push({x:rnd(0,W),y:rnd(65,245),s:rnd(.7,1.5),v:rnd(.15,.4)})}
function cloud(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='#ffffffdd';ctx.beginPath();ctx.arc(0,14,30,0,6.3);ctx.arc(31,0,37,0,6.3);ctx.arc(70,15,29,0,6.3);ctx.arc(35,27,42,0,6.3);ctx.fill();ctx.restore()}
function bg(){let g=ctx.createLinearGradient(0,0,0,GROUND);g.addColorStop(0,'#a8dcff');g.addColorStop(.58,'#e9f8ff');g.addColorStop(1,'#fff5d8');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(const q of clouds){q.x-=q.v*(speed/GAME_SPEED_START);if(q.x<-170)q.x=W+rnd(20,160);cloud(q.x,q.y,q.s)}ctx.fillStyle='#c7d9ef';ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W;x+=20)ctx.lineTo(x,430-Math.sin((x+offset*.08)*.008)*37-Math.sin((x+offset*.08)*.003)*30);ctx.lineTo(W,H);ctx.fill();ctx.fillStyle='#9bc6b0';ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W;x+=20)ctx.lineTo(x,490-Math.sin((x+offset*.16)*.008)*28-Math.sin((x+offset*.16)*.003)*24);ctx.lineTo(W,H);ctx.fill();let of=(offset*.26)%250;for(let i=-1;i<7;i++){let x=i*250-of;ctx.fillStyle=i%2?'#f0c6bd':'#d8c7ef';rr(x+45,405,105,120,9);ctx.fill();ctx.fillStyle='#fff';for(let r=0;r<3;r++)for(let k=0;k<3;k++){rr(x+60+k*27,430+r*26,12,13,3);ctx.fill()}}ctx.fillStyle='#a6df8f';ctx.fillRect(0,527,W,48);ctx.fillStyle='#6b7d8d';ctx.fillRect(0,GROUND,W,H-GROUND);ctx.fillStyle='#f1e5c6';ctx.fillRect(0,GROUND-8,W,8);ctx.fillStyle='#fff0a7';let d=180,o=-(offset%d);for(let x=o;x<W+d;x+=d){rr(x,642,92,10,5);ctx.fill()}}
function spawn(n){if(n-lo>no){obs.push(new Ob(Math.random()<.6?'low':'high'));lo=n;no=rnd(OBSTACLE_MIN_DELAY,OBSTACLE_MAX_DELAY)*Math.max(.66,GAME_SPEED_START/speed)}if(n-li>ni){let count=Math.floor(rnd(1,4));for(let i=0;i<count;i++){let it=new Item();it.x+=i*58;it.by+=Math.sin(i*1.2)*35;items.push(it)}li=n;ni=rnd(ITEM_MIN_DELAY,ITEM_MAX_DELAY)}}
function collide(n){let pb={x:p.x+24,y:p.y+15,w:p.w-48,h:p.h-22};for(const o of obs)if(n>=p.inv&&hit(pb,o.box())){hp--;p.inv=n+INVINCIBLE_TIME;burst(p.x+p.w/2,p.y+p.h/2,'#ff626e');if(hp<=0){hp=0;end()}}for(let i=items.length-1;i>=0;i--)if(hit(pb,items[i].box())){score+=ITEM_SCORE;burst(items[i].x,items[i].y,'#ff84bd');items.splice(i,1)}}
function dust(x,y,n){for(let i=0;i<n;i++)parts.push({x,y,vx:rnd(-4,1),vy:rnd(-3.5,-.5),life:30,max:30,s:rnd(4,9),c:'#f4e4cf'})}function ring(x,y){for(let i=0;i<14;i++){let a=6.28*i/14;parts.push({x,y,vx:Math.cos(a)*3.2,vy:Math.sin(a)*3.2,life:28,max:28,s:5,c:'#ffd95d'})}}function burst(x,y,c){for(let i=0;i<18;i++)parts.push({x,y,vx:rnd(-5,5),vy:rnd(-6,2),life:38,max:38,s:rnd(4,9),c})}
function updParts(){for(let i=parts.length-1;i>=0;i--){let q=parts[i];q.x+=q.vx;q.y+=q.vy;q.vy+=.14;if(--q.life<=0)parts.splice(i,1)}}function drawParts(){for(const q of parts){ctx.globalAlpha=q.life/q.max;ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,q.s,0,6.3);ctx.fill()}ctx.globalAlpha=1}
function panel(x,y,w,h){ctx.fillStyle='#ffffffd9';rr(x,y,w,h,22);ctx.fill()}function heart(x,y,s,col){ctx.save();ctx.translate(x,y);ctx.scale(s/20,s/20);ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,6);ctx.bezierCurveTo(-15,-4,-18,15,0,22);ctx.bezierCurveTo(18,15,15,-4,0,6);ctx.fill();ctx.restore()}
function hud(){panel(28,25,340,92);ctx.fillStyle='#52647e';ctx.font='800 18px Segoe UI';ctx.fillText('SCORE',52,57);ctx.fillStyle='#4777c9';ctx.font='900 36px Segoe UI';ctx.fillText(String(score).padStart(6,'0'),52,94);ctx.fillStyle='#718096';ctx.font='700 15px Segoe UI';ctx.fillText('BEST '+String(best).padStart(6,'0'),220,87);panel(W-390,25,360,92);ctx.fillStyle='#52647e';ctx.font='800 17px Segoe UI';ctx.fillText('HP',W-362,61);for(let i=0;i<MAX_HP;i++)heart(W-300+i*50,58,17,i<hp?'#ff617c':'#5a697d2e');ctx.fillStyle='#718096';ctx.font='700 14px Segoe UI';ctx.fillText('SPEED '+speed.toFixed(1),W-362,96)}
function end(){over=true;if(score>best){best=score;localStorage.setItem('alphabetStoneRunnerBest',best)}}function gameover(){ctx.fillStyle='#2d3a4e66';ctx.fillRect(0,0,W,H);panel(W/2-275,H/2-150,550,300);ctx.textAlign='center';ctx.fillStyle='#4777c9';ctx.font='900 54px Segoe UI';ctx.fillText('GAME OVER',W/2,H/2-58);ctx.fillStyle='#4b596e';ctx.font='800 24px Segoe UI';ctx.fillText('SCORE  '+score,W/2,H/2+5);ctx.fillStyle='#4777c9';rr(W/2-150,H/2+70,300,58,18);ctx.fill();ctx.fillStyle='#fff';ctx.font='900 20px Segoe UI';ctx.fillText('Press R to Restart',W/2,H/2+107);ctx.textAlign='left'}
function update(n){
if(over){updParts();return}
time+=16.67;speed+=GAME_SPEED_GROWTH;offset+=speed;
p.update();

/* 달리는 동안 일정 간격으로 발뒤꿈치 먼지 생성 */
if(p.on()&&!p.slide&&Math.floor(time/95)!==Math.floor((time-16.67)/95)){
  dust(p.x+22,GROUND-2,2);
}

spawn(n);
obs.forEach(o=>o.update());
items.forEach(i=>i.update());
updParts();
collide(n);
obs=obs.filter(o=>o.x+o.w>-80);
items=items.filter(i=>i.x+i.r>-50);
score++;
if(score>best)best=score;
}
function draw(){ctx.clearRect(0,0,W,H);bg();items.forEach(i=>i.draw());obs.forEach(o=>o.draw());drawParts();p.draw();hud();if(over)gameover()}function loop(n){update(n);draw();requestAnimationFrame(loop)}
initClouds();reset();requestAnimationFrame(loop);
</script></body></html>
