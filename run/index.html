<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alphabet Adventure Runner</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;min-height:100%;background:#eef8ff}
  body{
    display:flex;align-items:center;justify-content:center;
    font-family:"Segoe UI","Noto Sans KR",Arial,sans-serif;
    color:#23364f;overflow:hidden;
    background:
      radial-gradient(circle at 15% 12%,rgba(255,255,255,.95),transparent 25%),
      linear-gradient(135deg,#ecf8ff 0%,#fff8e9 55%,#f7efff 100%);
  }
  .wrap{width:min(1240px,98vw)}
  .top{
    display:flex;justify-content:space-between;align-items:end;
    gap:16px;margin:0 4px 10px
  }
  .top h1{
    margin:0;font-size:clamp(25px,3vw,39px);font-weight:950;
    letter-spacing:-1.4px;color:#3568bd
  }
  .top p{margin:0;font-size:14px;font-weight:800;color:#64748b}
  .shell{
    padding:14px;border-radius:28px;background:rgba(255,255,255,.88);
    box-shadow:0 24px 70px rgba(65,92,132,.20),inset 0 0 0 1px rgba(255,255,255,.95)
  }
  canvas{
    width:100%;aspect-ratio:16/9;display:block;border-radius:20px;
    background:#9edcff;touch-action:none
  }
  .help{
    margin-top:10px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px
  }
  .help div{
    padding:9px 10px;background:rgba(255,255,255,.9);border-radius:14px;
    box-shadow:0 7px 20px rgba(65,92,132,.08);
    text-align:center;font-size:12px;font-weight:750;line-height:1.45
  }
  .help b{color:#3568bd}
  @media(max-width:780px){
    .help{grid-template-columns:repeat(2,1fr)}
    .top{align-items:flex-start;flex-direction:column}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>ALPHABET ADVENTURE RUNNER</h1>
    <p>HTML5 Canvas · 외부 라이브러리 없음 · 수업용 단일 HTML</p>
  </div>

  <div class="shell">
    <canvas id="game" width="1280" height="720"></canvas>
  </div>

  <div class="help">
    <div><b>SPACE / ↑</b><br>점프 · 2단 점프</div>
    <div><b>↓</b><br>생동감 있는 슬라이딩</div>
    <div><b>알파벳 돌 / 가시</b><br>점프해서 회피</div>
    <div><b>공중 장애물</b><br>슬라이딩으로 회피</div>
    <div><b>R</b><br>Game Over 재시작</div>
  </div>
</div>

<script>
"use strict";

/* =========================================================
   1. 학생들이 수정해보기 좋은 핵심 설정값
   ========================================================= */
let START_SPEED = 7.3;          // 시작 속도
let SPEED_UP = 0.00052;         // 시간에 따른 속도 증가량
let MAX_HP = 5;                 // 최대 체력
let ITEM_SCORE = 100;           // 코인/젤리 점수
let GRAVITY = 0.92;             // 중력
let JUMP_POWER = -18.5;         // 1단 점프 힘
let DOUBLE_JUMP_POWER = -15.8;  // 2단 점프 힘
let HIT_INVINCIBLE = 950;       // 피격 뒤 무적 시간(ms)
let OBSTACLE_MIN = 920;         // 장애물 최소 생성 간격
let OBSTACLE_MAX = 1600;        // 장애물 최대 생성 간격
let ITEM_MIN = 620;             // 아이템 최소 생성 간격
let ITEM_MAX = 1180;            // 아이템 최대 생성 간격

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width;
const H = canvas.height;
const GROUND = 575;

/* =========================================================
   2. 게임 상태
   ========================================================= */
let speed, score, hp, gameOver, time, worldX;
let obstacles = [];
let items = [];
let particles = [];
let clouds = [];
let birds = [];
let lastObstacle = 0;
let lastItem = 0;
let nextObstacle = 1000;
let nextItem = 700;
let best = Number(localStorage.getItem("alphabetAdventureBest") || 0);

/* =========================================================
   3. 플레이어
   - 이미지 한 장을 흔드는 방식이 아니라
     머리/몸/팔/다리를 각각 Canvas로 그려 관절을 실제로 움직입니다.
   ========================================================= */
const player = {
  x: 150,
  y: GROUND - 145,
  width: 92,
  height: 145,
  vy: 0,
  jumpCount: 0,
  sliding: false,
  invincibleUntil: 0,
  hitFlash: 0,

  onGround() {
    return this.y + this.height >= GROUND - 1;
  },

  jump() {
    if (gameOver) return;

    if (this.onGround()) {
      this.stopSlide();
      this.vy = JUMP_POWER;
      this.jumpCount = 1;
      dustBurst(this.x + 35, GROUND - 2, 12);
    } else if (this.jumpCount === 1) {
      this.vy = DOUBLE_JUMP_POWER;
      this.jumpCount = 2;
      ringBurst(this.x + this.width / 2, this.y + 65);
    }
  },

  startSlide() {
    if (gameOver || !this.onGround()) return;
    this.sliding = true;
    this.height = 74;
    this.width = 132;
    this.y = GROUND - this.height;
  },

  stopSlide() {
    if (!this.sliding) return;
    this.sliding = false;
    this.width = 92;
    this.height = 145;
    this.y = Math.min(this.y, GROUND - this.height);
  },

  update() {
    this.vy += GRAVITY;
    this.y += this.vy;

    if (this.y + this.height >= GROUND) {
      this.y = GROUND - this.height;
      this.vy = 0;
      this.jumpCount = 0;
    }

    if (this.hitFlash > 0) this.hitFlash--;
  },

  hitbox() {
    if (this.sliding) {
      return {x:this.x+10, y:this.y+13, width:this.width-20, height:this.height-18};
    }
    return {x:this.x+22, y:this.y+10, width:this.width-36, height:this.height-18};
  },

  draw() {
    const now = performance.now();
    const blink = now < this.invincibleUntil && Math.floor(now / 90) % 2 === 0;
    const running = this.onGround() && !this.sliding;

    ctx.save();
    if (blink) ctx.globalAlpha = 0.35;

    // 발밑 그림자
    let shadowW = this.sliding ? 68 : 43;
    if (running) shadowW *= 0.88 + Math.abs(Math.sin(time * .026)) * .12;
    ctx.fillStyle = "rgba(40,55,75,.18)";
    ctx.beginPath();
    ctx.ellipse(this.x + this.width/2, GROUND + 7, shadowW, 10, 0, 0, Math.PI*2);
    ctx.fill();

    // 상태별 캐릭터를 직접 그림
    if (this.sliding) {
      drawSlidingMannequin(this.x, this.y, time);
    } else if (!this.onGround()) {
      drawJumpingMannequin(this.x, this.y, this.jumpCount, time);
    } else {
      drawRunningMannequin(this.x, this.y, time, speed);
    }

    // 피격 순간 별 효과
    if (this.hitFlash > 0) {
      for (let i=0;i<3;i++) {
        const a = time*.02 + i*Math.PI*2/3;
        drawStar(
          this.x+45+Math.cos(a)*58,
          this.y+36+Math.sin(a)*26,
          8, 4, "#ffd34f"
        );
      }
    }

    ctx.restore();
  }
};

/* =========================================================
   4. 관절형 흰색 캐릭터 그리기
   ========================================================= */

// 둥근 팔/다리를 그리는 함수
function limb(x1,y1,x2,y2,x3,y3,width) {
  ctx.strokeStyle = "#e7e7e7";
  ctx.lineWidth = width;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.lineTo(x2,y2);
  ctx.lineTo(x3,y3);
  ctx.stroke();

  // 살짝 어두운 외곽으로 입체감
  ctx.strokeStyle = "rgba(120,125,135,.28)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.lineTo(x2,y2);
  ctx.lineTo(x3,y3);
  ctx.stroke();
}

// 머리
function mannequinHead(x,y,r) {
  const g = ctx.createRadialGradient(x-r*.35,y-r*.45,3,x,y,r);
  g.addColorStop(0,"#ffffff");
  g.addColorStop(.55,"#eeeeee");
  g.addColorStop(1,"#bfc2c7");
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fill();
}

// 몸통
function mannequinTorso(cx,cy,w,h,rot=0) {
  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(rot);
  const g = ctx.createLinearGradient(-w/2,-h/2,w/2,h/2);
  g.addColorStop(0,"#f9f9f9");
  g.addColorStop(1,"#c9cbd0");
  ctx.fillStyle = g;
  roundRect(-w/2,-h/2,w,h,w*.34);
  ctx.fill();
  ctx.strokeStyle="rgba(100,105,115,.22)";
  ctx.lineWidth=2;
  ctx.stroke();
  ctx.restore();
}

// 달리기 모션
function drawRunningMannequin(x,y,t,currentSpeed) {
  const phase = t * .028 * (currentSpeed / START_SPEED);
  const bob = Math.abs(Math.sin(phase)) * 6;
  const lean = -0.12 + Math.sin(phase*2)*.025;

  const hipX = x + 45;
  const hipY = y + 89 - bob;
  const shoulderX = x + 45;
  const shoulderY = y + 55 - bob;
  const headX = x + 46;
  const headY = y + 22 - bob;

  // 빠르게 달릴수록 뒤에 속도선
  if (currentSpeed > 7.8) {
    ctx.strokeStyle = "rgba(255,255,255,.70)";
    ctx.lineWidth = 5;
    ctx.lineCap = "round";
    for (let i=0;i<4;i++) {
      const yy = y + 35 + i*25 + Math.sin(phase+i)*4;
      const len = 24 + i*10;
      ctx.beginPath();
      ctx.moveTo(x - 20 - len, yy);
      ctx.lineTo(x - 20, yy);
      ctx.stroke();
    }
  }

  // 다리: 좌우가 서로 반대 위상으로 움직임
  const legA = Math.sin(phase);
  const legB = -legA;

  const knee1X = hipX + legA*27;
  const knee1Y = hipY + 28 - Math.abs(legA)*8;
  const foot1X = hipX + legA*50 + 12;
  const foot1Y = hipY + 55 - Math.max(0,legA)*15;

  const knee2X = hipX + legB*27;
  const knee2Y = hipY + 29 - Math.abs(legB)*8;
  const foot2X = hipX + legB*48 - 7;
  const foot2Y = hipY + 55 - Math.max(0,legB)*15;

  // 뒤쪽 다리
  limb(hipX,hipY,knee2X,knee2Y,foot2X,foot2Y,15);

  // 팔: 다리와 반대 방향
  const armA = -legA;
  const armB = -legB;
  limb(shoulderX,shoulderY,
       shoulderX+armB*25,shoulderY+20,
       shoulderX+armB*42+4,shoulderY+34-Math.abs(armB)*8,13);

  mannequinTorso(x+45,y+68-bob,34,55,lean);
  mannequinHead(headX,headY,25);

  // 앞쪽 팔
  limb(shoulderX,shoulderY,
       shoulderX+armA*25,shoulderY+17,
       shoulderX+armA*43+5,shoulderY+28-Math.abs(armA)*10,13);

  // 앞쪽 다리
  limb(hipX,hipY,knee1X,knee1Y,foot1X,foot1Y,16);

  // 손/발 작은 구체
  ctx.fillStyle="#e2e2e2";
  ctx.beginPath();
  ctx.arc(shoulderX+armA*43+5,shoulderY+28-Math.abs(armA)*10,7,0,Math.PI*2);
  ctx.fill();

  // 발 구름 먼지
  if (Math.sin(phase) > .92) {
    dustBurst(x+26,GROUND-1,1);
  }
}

// 점프 모션
function drawJumpingMannequin(x,y,jumpCount,t) {
  const float = Math.sin(t*.012)*3;
  const cx = x+46;
  const headY = y+23+float;
  const shoulderY = y+56+float;
  const hipY = y+91+float;

  // 1단 점프: 무릎 살짝 접기 / 2단 점프: 팔 벌리고 다리 크게 펼치기
  if (jumpCount === 2) {
    // 속도 원
    ctx.strokeStyle="rgba(255,211,79,.55)";
    ctx.lineWidth=5;
    ctx.beginPath();
    ctx.arc(cx,y+72,57+Math.sin(t*.02)*4,0,Math.PI*2);
    ctx.stroke();

    limb(cx,shoulderY,cx-35,shoulderY-15,cx-50,shoulderY+2,13);
    limb(cx,shoulderY,cx+34,shoulderY-19,cx+52,shoulderY-2,13);
    mannequinTorso(cx,y+72+float,34,55,-.05);
    mannequinHead(cx,headY,25);
    limb(cx,hipY,cx-28,hipY+20,cx-47,hipY+41,16);
    limb(cx,hipY,cx+25,hipY+14,cx+47,hipY+32,16);
  } else {
    limb(cx,shoulderY,cx-25,shoulderY+4,cx-38,shoulderY+28,13);
    limb(cx,shoulderY,cx+26,shoulderY-1,cx+42,shoulderY+20,13);
    mannequinTorso(cx,y+72+float,34,55,-.10);
    mannequinHead(cx,headY,25);
    limb(cx,hipY,cx-25,hipY+15,cx-20,hipY+38,16);
    limb(cx,hipY,cx+25,hipY+13,cx+38,hipY+32,16);
  }
}

// 슬라이딩 모션
function drawSlidingMannequin(x,y,t) {
  const pulse = Math.sin(t*.035)*2;
  const cy = y+40;

  // 미끄러지는 속도선
  ctx.strokeStyle="rgba(255,255,255,.75)";
  ctx.lineWidth=5;
  ctx.lineCap="round";
  for(let i=0;i<4;i++){
    ctx.beginPath();
    ctx.moveTo(x-55-i*8, y+20+i*11);
    ctx.lineTo(x-12, y+20+i*11);
    ctx.stroke();
  }

  // 몸을 거의 수평으로 눕힘
  limb(x+61,cy+2,x+92,cy-4,x+119,cy-1,14); // 앞팔
  limb(x+58,cy+7,x+30,cy+25,x+7,cy+31,15); // 뒤다리
  mannequinTorso(x+62,cy,55,32,-.20);
  mannequinHead(x+96,cy-24+pulse*.2,22);

  // 앞쪽 다리 길게 뻗기
  limb(x+52,cy+10,x+84,cy+25,x+121,cy+29,16);

  // 뒷팔
  limb(x+50,cy-6,x+27,cy-17,x+8,cy-12,12);

  // 바닥 마찰 먼지
  ctx.fillStyle="rgba(240,230,210,.72)";
  for(let i=0;i<4;i++){
    ctx.beginPath();
    ctx.arc(x+10-i*14,GROUND-5-i%2*5,6+i*2,0,Math.PI*2);
    ctx.fill();
  }
}

/* =========================================================
   5. 다양한 장애물
   ========================================================= */
class Obstacle {
  constructor(type) {
    this.type = type;
    this.x = W + 110;
    this.spin = Math.random()*Math.PI*2;
    this.phase = Math.random()*Math.PI*2;
    this.letter = String.fromCharCode(65 + Math.floor(Math.random()*26));

    // 각 장애물의 위치/크기
    switch(type) {
      case "stone":
        this.w=90; this.h=102; this.y=GROUND-this.h; break;
      case "crate":
        this.w=82; this.h=82; this.y=GROUND-this.h; break;
      case "spikes":
        this.w=125; this.h=52; this.y=GROUND-this.h; break;
      case "roller":
        this.w=78; this.h=78; this.y=GROUND-this.h; break;
      case "tallStone":
        this.w=76; this.h=145; this.y=GROUND-this.h; break;
      case "hanging":
        this.w=108; this.h=86; this.y=GROUND-168; break;
      case "wing":
        this.w=105; this.h=78; this.y=GROUND-175; break;
      case "bar":
        this.w=142; this.h=58; this.y=GROUND-122; break;
    }
  }

  update() {
    this.x -= speed;
    this.spin += 0.075 * speed/START_SPEED;
    this.phase += .055;
    if(this.type==="wing") this.y += Math.sin(this.phase)*.65;
  }

  hitbox() {
    if(this.type==="spikes") return {x:this.x+7,y:this.y+12,width:this.w-14,height:this.h-12};
    if(this.type==="roller") return {x:this.x+8,y:this.y+8,width:this.w-16,height:this.h-16};
    return {x:this.x+8,y:this.y+6,width:this.w-16,height:this.h-10};
  }

  draw() {
    switch(this.type) {
      case "stone": drawStoneLetter(this.x,this.y,this.w,this.h,this.letter); break;
      case "tallStone": drawStoneLetter(this.x,this.y,this.w,this.h,this.letter); break;
      case "crate": drawCrate(this.x,this.y,this.w,this.h,this.letter); break;
      case "spikes": drawSpikes(this.x,this.y,this.w,this.h); break;
      case "roller": drawSpikeBall(this.x+this.w/2,this.y+this.h/2,this.w*.36,this.spin); break;
      case "hanging": drawHangingLetter(this.x,this.y,this.w,this.h,this.letter); break;
      case "wing": drawWingStone(this.x,this.y,this.w,this.h,this.letter,this.phase); break;
      case "bar": drawWarningBar(this.x,this.y,this.w,this.h); break;
    }
  }
}

function drawStoneLetter(x,y,w,h,letter) {
  // 그림자
  ctx.fillStyle="rgba(35,45,60,.17)";
  ctx.beginPath();ctx.ellipse(x+w/2,y+h+7,w*.45,8,0,0,Math.PI*2);ctx.fill();

  const g=ctx.createLinearGradient(x,y,x+w,y+h);
  g.addColorStop(0,"#c9ccd4"); g.addColorStop(.45,"#969eab"); g.addColorStop(1,"#667180");
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.moveTo(x+w*.13,y+h);ctx.lineTo(x+w*.03,y+h*.55);ctx.lineTo(x+w*.13,y+h*.18);
  ctx.lineTo(x+w*.36,y+h*.04);ctx.lineTo(x+w*.62,y);ctx.lineTo(x+w*.9,y+h*.16);
  ctx.lineTo(x+w*.98,y+h*.6);ctx.lineTo(x+w*.88,y+h);ctx.closePath();ctx.fill();
  ctx.strokeStyle="#515b69";ctx.lineWidth=4;ctx.stroke();

  // 균열
  ctx.strokeStyle="rgba(48,55,65,.56)";ctx.lineWidth=3;ctx.lineCap="round";
  ctx.beginPath();
  ctx.moveTo(x+w*.22,y+h*.22);ctx.lineTo(x+w*.37,y+h*.37);ctx.lineTo(x+w*.3,y+h*.55);
  ctx.moveTo(x+w*.76,y+h*.2);ctx.lineTo(x+w*.63,y+h*.4);ctx.lineTo(x+w*.72,y+h*.58);ctx.stroke();

  // 이끼
  ctx.fillStyle="#6c9a58";
  ctx.beginPath();ctx.arc(x+w*.14,y+h*.74,7,0,Math.PI*2);ctx.arc(x+w*.23,y+h*.72,6,0,Math.PI*2);ctx.fill();

  // 알파벳
  ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.font=`900 ${Math.floor(h*.63)}px Georgia`;
  ctx.strokeStyle="rgba(40,48,58,.82)";ctx.lineWidth=7;ctx.strokeText(letter,x+w/2,y+h*.55);
  ctx.fillStyle="#e3e5e9";ctx.fillText(letter,x+w/2,y+h*.55);
  ctx.textAlign="left";
}

function drawCrate(x,y,w,h,letter) {
  ctx.fillStyle="rgba(30,45,60,.18)";
  ctx.beginPath();ctx.ellipse(x+w/2,y+h+6,w*.46,8,0,0,Math.PI*2);ctx.fill();

  const g=ctx.createLinearGradient(x,y,x+w,y+h);
  g.addColorStop(0,"#c98b50");g.addColorStop(1,"#86522f");
  ctx.fillStyle=g;roundRect(x,y,w,h,8);ctx.fill();
  ctx.strokeStyle="#6f432b";ctx.lineWidth=5;ctx.stroke();

  ctx.strokeStyle="#e0a96d";ctx.lineWidth=7;
  ctx.beginPath();ctx.moveTo(x+9,y+9);ctx.lineTo(x+w-9,y+h-9);
  ctx.moveTo(x+w-9,y+9);ctx.lineTo(x+9,y+h-9);ctx.stroke();

  ctx.fillStyle="#5f3a27";ctx.font=`900 ${Math.floor(h*.42)}px Georgia`;
  ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(letter,x+w/2,y+h/2);ctx.textAlign="left";
}

function drawSpikes(x,y,w,h) {
  ctx.fillStyle="#485461";roundRect(x,y+h-16,w,16,5);ctx.fill();
  const n=5, sw=w/n;
  for(let i=0;i<n;i++){
    let gx=x+i*sw;
    let g=ctx.createLinearGradient(gx,y,gx+sw,y+h);
    g.addColorStop(0,"#f5f7fa");g.addColorStop(1,"#8d99a6");
    ctx.fillStyle=g;
    ctx.beginPath();ctx.moveTo(gx+3,y+h-16);ctx.lineTo(gx+sw/2,y);ctx.lineTo(gx+sw-3,y+h-16);ctx.closePath();ctx.fill();
    ctx.strokeStyle="#68717c";ctx.lineWidth=2;ctx.stroke();
  }
}

function drawSpikeBall(cx,cy,r,spin) {
  ctx.save();ctx.translate(cx,cy);ctx.rotate(spin);

  // 가시
  ctx.fillStyle="#7a4b34";
  for(let i=0;i<10;i++){
    ctx.save();ctx.rotate(i*Math.PI*2/10);
    ctx.beginPath();ctx.moveTo(r*.72,-7);ctx.lineTo(r*1.38,0);ctx.lineTo(r*.72,7);ctx.closePath();ctx.fill();
    ctx.restore();
  }

  const g=ctx.createRadialGradient(-r*.3,-r*.35,3,0,0,r);
  g.addColorStop(0,"#a76c47");g.addColorStop(1,"#66402f");
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="#4c3127";ctx.lineWidth=4;ctx.stroke();

  // 금속 못
  ctx.fillStyle="#cfd5dc";
  for(let i=0;i<5;i++){
    let a=i*Math.PI*2/5+0.3;
    ctx.beginPath();ctx.arc(Math.cos(a)*r*.45,Math.sin(a)*r*.45,5,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

function drawHangingLetter(x,y,w,h,letter) {
  // 줄
  ctx.strokeStyle="#735032";ctx.lineWidth=5;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(x+w*.28,0);ctx.lineTo(x+w*.28,y);
  ctx.moveTo(x+w*.72,0);ctx.lineTo(x+w*.72,y);ctx.stroke();

  drawCrate(x,y,w,h,letter);
}

function drawWingStone(x,y,w,h,letter,phase) {
  // 날개
  ctx.fillStyle="rgba(255,255,255,.92)";
  let flap=Math.sin(phase)*10;
  ctx.beginPath();
  ctx.moveTo(x+10,y+h*.45);ctx.quadraticCurveTo(x-35,y+h*.16-flap,x-47,y+h*.5);
  ctx.quadraticCurveTo(x-24,y+h*.65,x+8,y+h*.6);ctx.closePath();ctx.fill();

  ctx.beginPath();
  ctx.moveTo(x+w-10,y+h*.45);ctx.quadraticCurveTo(x+w+35,y+h*.16-flap,x+w+47,y+h*.5);
  ctx.quadraticCurveTo(x+w+24,y+h*.65,x+w-8,y+h*.6);ctx.closePath();ctx.fill();

  drawStoneLetter(x,y,w,h,letter);
}

function drawWarningBar(x,y,w,h) {
  ctx.fillStyle="rgba(35,45,60,.15)";
  roundRect(x+4,y+h+5,w,8,4);ctx.fill();

  ctx.fillStyle="#f2c14e";roundRect(x,y,w,h,10);ctx.fill();
  ctx.strokeStyle="#525b66";ctx.lineWidth=5;ctx.stroke();

  ctx.save();
  roundRect(x,y,w,h,10);ctx.clip();
  ctx.fillStyle="#2f3741";
  for(let i=-1;i<7;i++){
    ctx.save();ctx.translate(x+i*35,y-10);ctx.rotate(-.55);ctx.fillRect(0,0,16,h+35);ctx.restore();
  }
  ctx.restore();
}

/* =========================================================
   6. 아이템
   ========================================================= */
class Item {
  constructor(index=0) {
    this.x=W+80+index*58;
    this.baseY=random(320,500);
    this.y=this.baseY;
    this.r=random(18,22);
    this.phase=random(0,Math.PI*2);
    this.rot=0;
    this.kind=Math.random()<.62?"coin":"jelly";
  }
  update(){
    this.x-=speed;
    this.phase+=.06;
    this.y=this.baseY+Math.sin(this.phase)*9;
    this.rot+=.05;
  }
  hitbox(){return{x:this.x-this.r,y:this.y-this.r,width:this.r*2,height:this.r*2}}
  draw(){
    ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.rot);
    ctx.shadowBlur=18;ctx.shadowColor=this.kind==="coin"?"#ffd34f":"#ff80c0";
    if(this.kind==="coin"){
      ctx.fillStyle="#ffd34f";ctx.beginPath();ctx.arc(0,0,this.r,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle="#e69f2b";ctx.lineWidth=4;ctx.stroke();
      drawStar(0,0,this.r*.55,this.r*.26,"#fff2a0");
    }else{
      const g=ctx.createLinearGradient(-20,-20,20,20);
      g.addColorStop(0,"#ffb9de");g.addColorStop(1,"#ff63a8");
      ctx.fillStyle=g;roundRect(-this.r,-this.r,this.r*2,this.r*2,10);ctx.fill();
      ctx.fillStyle="#3b4252";
      ctx.beginPath();ctx.arc(-7,-2,2.5,0,Math.PI*2);ctx.arc(7,-2,2.5,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle="#3b4252";ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,4,7,.1,Math.PI-.1);ctx.stroke();
    }
    ctx.restore();
  }
}

/* =========================================================
   7. 배경
   ========================================================= */
function initScenery() {
  clouds=[];
  birds=[];
  for(let i=0;i<8;i++) clouds.push({x:random(0,W),y:random(70,250),s:random(.7,1.5),v:random(.12,.38)});
  for(let i=0;i<5;i++) birds.push({x:random(0,W),y:random(90,260),v:random(.25,.55),s:random(.7,1.2)});
}

function drawBackground() {
  // 하늘
  let sky=ctx.createLinearGradient(0,0,0,GROUND);
  sky.addColorStop(0,"#83c9ff");
  sky.addColorStop(.55,"#dff4ff");
  sky.addColorStop(1,"#fff3d5");
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

  // 햇살
  let glow=ctx.createRadialGradient(1050,105,15,1050,105,150);
  glow.addColorStop(0,"rgba(255,241,160,.92)");
  glow.addColorStop(1,"rgba(255,241,160,0)");
  ctx.fillStyle=glow;ctx.beginPath();ctx.arc(1050,105,150,0,Math.PI*2);ctx.fill();

  // 구름
  clouds.forEach(c=>{
    c.x-=c.v*speed/START_SPEED;
    if(c.x<-170)c.x=W+random(40,180);
    cloud(c.x,c.y,c.s);
  });

  // 새
  ctx.strokeStyle="rgba(255,255,255,.85)";ctx.lineWidth=4;ctx.lineCap="round";
  birds.forEach(b=>{
    b.x-=b.v*speed/START_SPEED;
    if(b.x<-40)b.x=W+random(30,180);
    ctx.beginPath();
    ctx.arc(b.x,b.y,10*b.s,3.5,5.7);
    ctx.arc(b.x+18*b.s,b.y,10*b.s,3.7,5.9);
    ctx.stroke();
  });

  // 산
  mountain("#9dc5e8",430,110,.07);
  mountain("#79b994",495,75,.14);

  // 성 / 마을
  let cityOff=(worldX*.20)%300;
  for(let i=-1;i<6;i++){
    let x=i*300-cityOff;
    // 성탑
    ctx.fillStyle="#f0dfca";roundRect(x+85,355,58,170,8);ctx.fill();
    ctx.fillStyle="#718bc5";
    ctx.beginPath();ctx.moveTo(x+78,355);ctx.lineTo(x+114,315);ctx.lineTo(x+150,355);ctx.closePath();ctx.fill();

    // 집
    ctx.fillStyle=i%2?"#f0c0b0":"#d6c4ec";roundRect(x+155,430,105,95,7);ctx.fill();
    ctx.fillStyle="#d98262";
    ctx.beginPath();ctx.moveTo(x+145,430);ctx.lineTo(x+207,390);ctx.lineTo(x+270,430);ctx.closePath();ctx.fill();
  }

  // 호수
  ctx.fillStyle="rgba(116,199,225,.72)";ctx.fillRect(0,505,W,48);
  for(let i=0;i<20;i++){
    let x=((i*94-worldX*.3)%(W+100)+(W+100))%(W+100)-50;
    ctx.strokeStyle="rgba(255,255,255,.55)";ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(x,525+i%3*8);ctx.lineTo(x+35,525+i%3*8);ctx.stroke();
  }

  // 뒤쪽 울타리
  ctx.strokeStyle="#a87550";ctx.lineWidth=8;
  ctx.beginPath();ctx.moveTo(0,530);ctx.lineTo(W,530);ctx.stroke();
  for(let x=-(worldX*.46%90);x<W;x+=90){
    ctx.fillStyle="#b88259";roundRect(x,502,12,57,4);ctx.fill();
  }

  // 잔디
  ctx.fillStyle="#90d66b";ctx.fillRect(0,550,W,33);
  ctx.fillStyle="#68b94d";ctx.fillRect(0,570,W,12);

  // 도로
  const road=ctx.createLinearGradient(0,GROUND,0,H);
  road.addColorStop(0,"#647889");road.addColorStop(1,"#44596b");
  ctx.fillStyle=road;ctx.fillRect(0,GROUND,W,H-GROUND);

  ctx.fillStyle="#f4e4b8";ctx.fillRect(0,GROUND-7,W,7);

  // 차선
  ctx.fillStyle="#fff1a8";
  let d=-(worldX%190);
  for(let x=d;x<W+190;x+=190){roundRect(x,650,96,10,5);ctx.fill();}

  // 꽃
  for(let i=0;i<24;i++){
    let x=((i*79-worldX*.54)%(W+80)+(W+80))%(W+80)-40;
    let y=559+(i%2)*9;
    ctx.fillStyle=i%3===0?"#ff8fbc":i%3===1?"#fff":"#ffd45f";
    ctx.beginPath();ctx.arc(x,y,3.5,0,Math.PI*2);ctx.fill();
  }
}

function cloud(x,y,s){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.fillStyle="rgba(255,255,255,.90)";
  ctx.beginPath();ctx.arc(0,14,29,0,Math.PI*2);ctx.arc(30,0,37,0,Math.PI*2);
  ctx.arc(70,15,29,0,Math.PI*2);ctx.arc(35,27,42,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function mountain(color,base,amp,factor){
  ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(0,H);
  for(let x=0;x<=W;x+=18){
    let yy=base-Math.sin((x+worldX*factor)*.008)*amp*.42-Math.sin((x+worldX*factor)*.0032)*amp*.34;
    ctx.lineTo(x,yy);
  }
  ctx.lineTo(W,H);ctx.closePath();ctx.fill();
}

/* =========================================================
   8. 생성 로직
   ========================================================= */
const LOW_TYPES = ["stone","crate","spikes","roller","tallStone"];
const HIGH_TYPES = ["hanging","wing","bar"];

function spawn(now) {
  if(now-lastObstacle>nextObstacle){
    // 낮은 장애물 68%, 공중 장애물 32%
    const list = Math.random()<.68 ? LOW_TYPES : HIGH_TYPES;
    const type = list[Math.floor(Math.random()*list.length)];
    obstacles.push(new Obstacle(type));

    lastObstacle=now;
    nextObstacle=random(OBSTACLE_MIN,OBSTACLE_MAX)*Math.max(.68,START_SPEED/speed);
  }

  if(now-lastItem>nextItem){
    const count=Math.floor(random(1,4));
    const base=random(325,500);
    for(let i=0;i<count;i++){
      let it=new Item(i);
      it.baseY=base-Math.sin(i*.9)*25;
      items.push(it);
    }
    lastItem=now;
    nextItem=random(ITEM_MIN,ITEM_MAX);
  }
}

/* =========================================================
   9. 충돌
   ========================================================= */
function overlap(a,b){
  return a.x<b.x+b.width && a.x+a.width>b.x &&
         a.y<b.y+b.height && a.y+a.height>b.y;
}

function collisions(now){
  const pb=player.hitbox();

  for(const o of obstacles){
    if(now>=player.invincibleUntil && overlap(pb,o.hitbox())){
      hp--;
      player.invincibleUntil=now+HIT_INVINCIBLE;
      player.hitFlash=28;
      hitBurst(player.x+50,player.y+60);

      if(hp<=0){
        hp=0;
        endGame();
      }
    }
  }

  for(let i=items.length-1;i>=0;i--){
    if(overlap(pb,items[i].hitbox())){
      score+=ITEM_SCORE;
      itemBurst(items[i].x,items[i].y);
      items.splice(i,1);
    }
  }
}

/* =========================================================
   10. 파티클
   ========================================================= */
function dustBurst(x,y,n){
  for(let i=0;i<n;i++){
    particles.push({
      x,y,vx:random(-4.3,.8),vy:random(-3.7,-.5),
      life:random(18,32),max:32,size:random(3,8),color:"#efe2ce",gravity:.08
    });
  }
}

function ringBurst(x,y){
  for(let i=0;i<14;i++){
    let a=i*Math.PI*2/14;
    particles.push({
      x,y,vx:Math.cos(a)*3.6,vy:Math.sin(a)*3.6,
      life:28,max:28,size:5,color:"#ffd34f",gravity:0
    });
  }
}

function itemBurst(x,y){
  for(let i=0;i<18;i++){
    let a=random(0,Math.PI*2);
    particles.push({
      x,y,vx:Math.cos(a)*random(2,5),vy:Math.sin(a)*random(2,5),
      life:36,max:36,size:random(3,7),color:i%2?"#ff80bb":"#ffd34f",gravity:.05
    });
  }
}

function hitBurst(x,y){
  for(let i=0;i<20;i++){
    particles.push({
      x,y,vx:random(-5,5),vy:random(-6,2),
      life:42,max:42,size:random(4,9),color:i%2?"#ff6170":"#ffd34f",gravity:.14
    });
  }
}

function updateParticles(){
  for(let i=particles.length-1;i>=0;i--){
    let p=particles[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=p.gravity;p.life--;
    if(p.life<=0)particles.splice(i,1);
  }
}

function drawParticles(){
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,p.life/p.max);
    ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}

/* =========================================================
   11. HUD
   ========================================================= */
function panel(x,y,w,h){
  ctx.fillStyle="rgba(26,65,108,.86)";
  roundRect(x,y,w,h,22);ctx.fill();
  ctx.strokeStyle="rgba(255,255,255,.65)";ctx.lineWidth=2;ctx.stroke();
}

function heart(x,y,s,on){
  ctx.save();ctx.translate(x,y);ctx.scale(s/20,s/20);
  ctx.fillStyle=on?"#ff5c78":"rgba(255,255,255,.18)";
  ctx.beginPath();ctx.moveTo(0,6);ctx.bezierCurveTo(-15,-4,-18,15,0,22);
  ctx.bezierCurveTo(18,15,15,-4,0,6);ctx.fill();ctx.restore();
}

function drawHUD(){
  panel(24,22,280,86);
  ctx.fillStyle="#fff";ctx.font="800 17px Segoe UI";ctx.fillText("SCORE",48,53);
  ctx.font="950 34px Segoe UI";ctx.fillText(String(score).padStart(6,"0"),48,91);

  panel(322,22,280,86);
  ctx.font="800 17px Segoe UI";ctx.fillText("BEST",346,53);
  ctx.font="950 34px Segoe UI";ctx.fillText(String(best).padStart(6,"0"),346,91);

  panel(620,22,325,86);
  ctx.font="800 17px Segoe UI";ctx.fillText("HP",644,53);
  for(let i=0;i<MAX_HP;i++)heart(704+i*45,48,16,i<hp);

  panel(963,22,290,86);
  ctx.font="800 17px Segoe UI";ctx.fillText("SPEED",988,53);
  ctx.fillStyle="#fff7b2";ctx.font="950 31px Segoe UI";ctx.fillText(speed.toFixed(1),988,89);

  // 난이도 텍스트
  ctx.fillStyle="rgba(255,255,255,.92)";
  ctx.font="800 14px Segoe UI";
  ctx.fillText(speed<9?"WARM UP":speed<11?"RUNNING!":"SUPER FAST!",1130,88);
}

/* =========================================================
   12. Game Over
   ========================================================= */
function endGame(){
  gameOver=true;
  if(score>best){
    best=score;
    localStorage.setItem("alphabetAdventureBest",String(best));
  }
}

function drawGameOver(){
  ctx.fillStyle="rgba(29,44,66,.42)";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="rgba(255,255,255,.94)";roundRect(W/2-280,H/2-160,560,320,28);ctx.fill();

  ctx.textAlign="center";
  ctx.fillStyle="#3568bd";ctx.font="950 56px Segoe UI";ctx.fillText("GAME OVER",W/2,H/2-66);
  ctx.fillStyle="#394b63";ctx.font="850 25px Segoe UI";ctx.fillText("SCORE  "+score,W/2,H/2+2);
  ctx.fillStyle="#64748b";ctx.font="750 19px Segoe UI";ctx.fillText("BEST  "+best,W/2,H/2+44);

  ctx.fillStyle="#3568bd";roundRect(W/2-155,H/2+78,310,62,18);ctx.fill();
  ctx.fillStyle="#fff";ctx.font="900 21px Segoe UI";ctx.fillText("Press R to Restart",W/2,H/2+117);
  ctx.textAlign="left";
}

/* =========================================================
   13. 키보드 조작
   ========================================================= */
addEventListener("keydown",e=>{
  if([" ","ArrowUp","ArrowDown"].includes(e.key))e.preventDefault();

  if((e.key===" "||e.key==="ArrowUp")&&!e.repeat)player.jump();
  if(e.key==="ArrowDown")player.startSlide();
  if((e.key==="r"||e.key==="R")&&gameOver)resetGame();
});

addEventListener("keyup",e=>{
  if(e.key==="ArrowDown")player.stopSlide();
});

/* =========================================================
   14. 초기화
   ========================================================= */
function resetGame(){
  speed=START_SPEED;
  score=0;
  hp=MAX_HP;
  gameOver=false;
  time=0;
  worldX=0;
  obstacles=[];
  items=[];
  particles=[];

  player.width=92;
  player.height=145;
  player.y=GROUND-player.height;
  player.vy=0;
  player.jumpCount=0;
  player.sliding=false;
  player.invincibleUntil=0;
  player.hitFlash=0;

  const now=performance.now();
  lastObstacle=now;
  lastItem=now;
  nextObstacle=random(OBSTACLE_MIN,OBSTACLE_MAX);
  nextItem=random(ITEM_MIN,ITEM_MAX);
}

/* =========================================================
   15. 업데이트 / 그리기 / 게임 루프
   ========================================================= */
function update(now){
  if(gameOver){
    updateParticles();
    return;
  }

  time+=16.67;
  speed+=SPEED_UP;
  worldX+=speed;

  player.update();

  // 달리는 동안 자연스럽게 발먼지 생성
  if(player.onGround()&&!player.sliding &&
     Math.floor(time/105)!==Math.floor((time-16.67)/105)){
    dustBurst(player.x+27,GROUND-2,2);
  }

  spawn(now);
  obstacles.forEach(o=>o.update());
  items.forEach(i=>i.update());
  updateParticles();
  collisions(now);

  obstacles=obstacles.filter(o=>o.x+o.w>-100);
  items=items.filter(i=>i.x+i.r>-60);

  score++;
  if(score>best)best=score;
}

function draw(){
  ctx.clearRect(0,0,W,H);
  drawBackground();

  items.forEach(i=>i.draw());
  obstacles.forEach(o=>o.draw());
  drawParticles();
  player.draw();
  drawHUD();

  if(gameOver)drawGameOver();
}

function loop(now){
  update(now);
  draw();
  requestAnimationFrame(loop);
}

/* =========================================================
   16. 공통 도형 함수
   ========================================================= */
function random(a,b){return Math.random()*(b-a)+a}

function roundRect(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawStar(cx,cy,outer,inner,color){
  let rot=Math.PI*1.5;
  const step=Math.PI/5;
  ctx.beginPath();
  for(let i=0;i<10;i++){
    let rr=i%2===0?outer:inner;
    let px=cx+Math.cos(rot)*rr;
    let py=cy+Math.sin(rot)*rr;
    if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
    rot+=step;
  }
  ctx.closePath();ctx.fillStyle=color;ctx.fill();
}

/* 시작 */
initScenery();
resetGame();
requestAnimationFrame(loop);
</script>
