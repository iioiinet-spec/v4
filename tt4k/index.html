<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>하늘의 특공대 : 초광역 시야 · 화면 밖 적기 출현 · 적기 2배 · 관리자 모드</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--ink:#0b1f3a;--panel:rgba(9,27,52,.84);--panel2:rgba(20,52,92,.9);--line:rgba(150,205,255,.38);--gold:#ffd24a;--gold-d:#e09a16;--mint:#62f0c4;--mint-d:#17a584;--sky:#6cc7ff;--pink:#ff6b9a;--red:#ff5468;--text:#eaf6ff;--mute:#9bb8d6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#12406e 0%,#07182e 70%);font-family:'Jua','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;color:var(--text);touch-action:none}
#stage{position:fixed;left:50%;top:50%;width:2048px;height:1200px;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;overflow:hidden;border-radius:10px;box-shadow:0 0 0 2px rgba(150,205,255,.25),0 20px 80px rgba(0,0,0,.55)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:absolute;left:0;top:0;width:960px;height:562.5px;transform:scale(2.1333333333);transform-origin:top left;pointer-events:none}
#ui>*{pointer-events:auto}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:26px 22px;gap:14px;animation:fade .25s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.dim{background:radial-gradient(90% 70% at 50% 40%,rgba(5,16,34,.55),rgba(5,16,34,.88))}
h2{margin:0;font-size:34px;font-weight:400;color:var(--gold);text-shadow:0 3px 0 var(--gold-d),0 0 24px rgba(255,210,74,.45);letter-spacing:1px}
.sub{margin:0;color:var(--mute);font-size:16px;text-align:center;word-break:keep-all;line-height:1.35}
.logo{margin:66px 0 0;text-align:center;font-weight:400;line-height:.95}
.logo small{display:block;font-size:22px;color:#cfeaff;letter-spacing:3px;text-shadow:0 2px 0 #1a4f86;margin-bottom:6px}
.logo b{display:block;font-weight:400;font-size:84px;color:#fff;letter-spacing:2px;-webkit-text-stroke:3px #12335c;paint-order:stroke fill;text-shadow:0 6px 0 #1a5fa8,0 12px 26px rgba(0,0,0,.45),0 0 36px rgba(108,199,255,.55);transform:rotate(-3deg)}
.logo i{display:inline-block;font-style:normal;color:var(--gold)}
.btn{font:inherit;font-size:22px;color:#102a4a;background:linear-gradient(180deg,#ffe58a,var(--gold));border:3px solid #12335c;border-radius:18px;padding:12px 26px;cursor:pointer;box-shadow:0 5px 0 var(--gold-d),0 10px 20px rgba(0,0,0,.35);transition:transform .1s,filter .15s;min-width:150px}
.btn:hover{filter:brightness(1.06);transform:translateY(-2px)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--gold-d)}
.btn.big{font-size:34px;padding:16px 46px;border-radius:24px;background:linear-gradient(180deg,#8ff7d6,var(--mint));box-shadow:0 7px 0 var(--mint-d),0 14px 26px rgba(0,0,0,.4);}
.btn.alt{background:linear-gradient(180deg,#a6dcff,var(--sky));box-shadow:0 5px 0 #2a86c6,0 10px 20px rgba(0,0,0,.35)}
.btn.ghost{background:rgba(255,255,255,.1);color:var(--text);border-color:var(--line);box-shadow:none}
.btn.sm{font-size:16px;padding:8px 16px;min-width:0;border-radius:14px}
.btn[disabled]{filter:grayscale(.8) brightness(.7);cursor:not-allowed;animation:none}
@keyframes pulse{50%{transform:scale(1.05)}}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.col{display:flex;flex-direction:column;gap:12px;align-items:center;width:100%}
.foot{margin-top:auto;color:#cfe6ff;font-size:14px;text-align:center;line-height:1.5;opacity:.9;text-shadow:0 1px 3px #000}
.foot kbd{background:rgba(255,255,255,.16);border:1px solid var(--line);border-radius:6px;padding:1px 7px;font:inherit;font-size:13px}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center}
.coin{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:6px 14px 6px 8px;font-size:20px;color:var(--gold)}
.coin::before{content:'★';display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,var(--gold));color:#a46a00;font-size:16px;border:2px solid #b87a10}
.tabs{display:flex;gap:8px}
.tab{font:inherit;font-size:18px;color:var(--mute);background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:8px 22px;cursor:pointer}
.tab.on{color:#102a4a;background:linear-gradient(180deg,#a6dcff,var(--sky));border-color:#12335c}
.card{width:100%;background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:12px;display:flex;gap:12px;align-items:center;text-align:left}
.card.sel{border-color:var(--mint);box-shadow:0 0 0 3px var(--mint),0 0 26px rgba(98,240,196,.35)}
.card canvas{width:92px;height:92px;flex:none;border-radius:16px;background:radial-gradient(circle at 50% 40%,#2a6fb0,#123a66)}
.card .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.card h3{margin:0;font-size:21px;font-weight:400;display:flex;gap:8px;align-items:baseline}
.card h3 small{color:var(--mute);font-size:14px}
.card p{margin:0;font-size:14px;color:var(--mute);word-break:keep-all;line-height:1.3}
.bar{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.bar span{width:34px}
.bar i{flex:1;height:8px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i b{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--mint),var(--sky))}
.pips{display:inline-flex;gap:4px}
.pips i{width:12px;height:12px;border-radius:4px;background:rgba(255,255,255,.16);border:1px solid var(--line)}
.pips i.on{background:linear-gradient(180deg,#fff0a6,var(--gold));border-color:#b87a10}
.list{width:100%;display:flex;flex-direction:column;gap:10px;overflow:auto;padding:2px 2px 8px;max-height:640px}
.opts{display:flex;flex-direction:column;gap:12px;width:100%;margin-top:6px}
.opt{font:inherit;color:var(--text);text-align:left;background:linear-gradient(180deg,rgba(32,76,128,.95),rgba(14,40,78,.95));border:3px solid var(--line);border-radius:22px;padding:14px 16px;display:flex;gap:14px;align-items:center;cursor:pointer;transition:transform .12s,border-color .12s,box-shadow .12s;animation:pop .35s cubic-bezier(.2,1.4,.4,1) both}
.opt:nth-child(2){animation-delay:.07s}.opt:nth-child(3){animation-delay:.14s}
@keyframes pop{from{opacity:0;transform:scale(.8) translateY(20px)}to{opacity:1;transform:none}}
.opt:hover{transform:translateY(-4px) scale(1.02);border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,210,74,.5),0 14px 30px rgba(0,0,0,.4)}
.opt .ic{width:64px;height:64px;flex:none;border-radius:18px;display:grid;place-items:center;font-size:36px;background:radial-gradient(circle at 35% 30%,#4aa0e8,#1b4d8a);border:2px solid var(--line)}
.opt.new .ic{background:radial-gradient(circle at 35% 30%,#ffe58a,#e09a16)}
.opt b{display:block;font-size:22px;font-weight:400;color:#fff}
.opt em{font-style:normal;font-size:13px;color:#102a4a;background:var(--gold);border-radius:8px;padding:1px 8px;margin-left:8px}
.opt.new em{background:var(--mint)}
.opt p{margin:3px 0 0;font-size:15px;color:var(--mute);word-break:keep-all}
.stats{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-size:17px}
.stat b{font-weight:400;color:var(--gold);font-size:22px}
.new-tag{color:#102a4a;background:var(--pink);border-radius:8px;padding:1px 8px;font-size:13px;margin-left:6px;vertical-align:middle}
.toast{position:absolute;left:50%;bottom:210px;transform:translateX(-50%);background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:8px 20px;font-size:17px;white-space:nowrap;pointer-events:none;animation:toast 3.2s ease-out forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.mute{position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--panel);color:var(--text);font-size:19px;cursor:pointer;display:grid;place-items:center}
@media (prefers-reduced-motion:reduce){.btn.big{animation:none}.scr,.opt{animation:none}}

/* ===== 2048×1200 WUXGA+ 가로 레이아웃 / 인터페이스는 가독성 유지 ===== */
.scr{padding:20px 30px;gap:10px}
h2{font-size:30px}
.title{display:grid;grid-template-columns:1.15fr .85fr;grid-template-rows:1fr auto;align-items:center;justify-items:stretch;gap:0 14px;padding:26px 34px 16px}
.tl-left{align-self:center;text-align:left}
.tl-left .logo{margin:0;text-align:left}
.tl-left .logo b{font-size:88px;transform:rotate(-3deg);display:block}
.tl-left .logo small{font-size:21px}
.tl-left .sub{text-align:left;font-size:17px;margin-top:10px}
.sub.chip{display:inline-block;margin-top:10px;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:4px 14px;color:#cfeaff;font-size:14px}
.tl-right{display:flex;flex-direction:column;gap:11px;align-items:center;justify-self:center}
.title .foot{grid-column:1/3;margin:0;font-size:13px}
.hg .topbar{gap:14px}
.hg .list.hg3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-height:none;overflow:visible;padding:0}
.card.v{flex-direction:column;text-align:center;align-items:center;gap:8px;padding:10px 12px}
.card.v canvas{width:120px;height:120px}
.card.v h3{justify-content:center;font-size:19px}
.card.v .info{width:100%;align-items:stretch;text-align:left}
.card.v .info p{min-height:36px}
.card.v .icb{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-size:34px;background:radial-gradient(circle at 35% 30%,#4aa0e8,#1b4d8a);border:2px solid var(--line)}
.card.v .pips{justify-content:center}
.card.v.u{flex-direction:row;text-align:left;gap:10px;padding:8px 12px}
.card.v.u .icb{width:50px;height:50px;font-size:26px;flex:none}
.card.v.u .info p{min-height:0}
.card.v.u .pips{justify-content:flex-start}
.btn.sm2{font-size:24px;padding:10px 30px;border-radius:20px}
.lv{justify-content:center}
.lv .opts{flex-direction:row;gap:16px;margin-top:6px}
.lv .opt{flex-direction:column;text-align:center;width:268px;min-height:236px;justify-content:center;padding:18px 14px}
.lv .opt .tx b{font-size:21px}
.lv .opt p{font-size:15px}
.ps{justify-content:center;gap:16px}
.ps .foot{margin-top:18px}
.res{align-items:center}
.res h2{font-size:42px;margin-top:6px}
.res .stats{grid-template-columns:repeat(4,1fr);gap:10px}
.stat.wide{width:100%;font-size:20px}
.toast{bottom:90px}
#rot{display:none;position:fixed;left:0;right:0;bottom:0;z-index:9;text-align:center;padding:10px;background:rgba(9,27,52,.92);color:#fff;font-size:15px}
#rot button{font:inherit;margin-left:10px;border-radius:10px;border:1px solid var(--line);background:#16424a;color:#fff;padding:3px 12px}
@media (orientation:portrait){#rot.on{display:block}}

/* ===== 실시간 관리자 패널 ===== */
.admin{gap:11px;padding:17px 25px;align-items:stretch;animation:none;background:linear-gradient(135deg,#061a32 0%,#062849 54%,#071d38 100%)}
.admin .admin-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none}
.admin h2{font-size:29px;line-height:1.2}
.admin .admin-sub{font-size:13px;color:#c5e6ff;margin:0;white-space:nowrap}
.admin-grid{display:grid;grid-template-columns:1.04fr 1fr;gap:13px;min-height:0;flex:1}
.admin-pane{min-height:0;overflow:auto;background:rgba(5,20,45,.9);border:2px solid rgba(129,193,255,.35);border-radius:19px;padding:12px}
.admin-pane h3{margin:0 0 10px;color:#97dfff;font-size:20px;font-weight:400}
.admin-planes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.admin-plane{background:linear-gradient(180deg,rgba(33,76,120,.92),rgba(8,30,61,.95));border:2px solid rgba(145,207,255,.32);border-radius:15px;padding:10px 6px;cursor:pointer;color:#effbff;font:inherit;min-height:171px}
.admin-plane.sel{border-color:#65f4c1;box-shadow:inset 0 0 0 2px rgba(101,244,193,.3);background:linear-gradient(180deg,#20587b,#0d3f57)}
.admin-plane:hover{border-color:#ffdc86}
.admin-plane canvas{width:100%;height:83px;object-fit:contain;display:block}
.admin-plane strong{display:block;font-size:15px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.admin-plane small{display:block;color:#b7cce7;font-size:11px;margin-top:3px}
.admin-note{font-size:12px;line-height:1.5;color:#b5d4f4;margin:12px 1px 0;word-break:keep-all}
.admin-weapons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.admin-weapon{display:flex;gap:4px;align-items:center;justify-content:space-between;border:1px solid rgba(150,205,255,.25);border-radius:11px;padding:6px 7px;background:rgba(40,80,120,.32);font-size:13px;min-width:0}
.admin-weapon .wn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.admin-weapon .level{font-size:12px;color:#ffe38e;white-space:nowrap}
.admin-adjust{font:inherit;font-size:18px;line-height:1;color:#fff;border:1px solid #5886b4;background:#164e7c;border-radius:7px;width:25px;height:26px;cursor:pointer;flex:none}
.admin-adjust:disabled{opacity:.25;cursor:not-allowed}
.admin-bottom{display:flex;align-items:center;gap:8px;justify-content:center;flex:none;flex-wrap:wrap}
.admin-bottom .btn{font-size:15px;min-width:0;padding:7px 13px;border-radius:12px}
.admin-toolbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.admin-toolbar .btn{font-size:13px;padding:5px 10px;min-width:0;border-radius:10px}
.admin-sep{height:1px;background:rgba(150,205,255,.25);margin:11px 0}
</style>

<body>
<div id="stage"><canvas id="cv"></canvas><div id="ui"></div></div>
<div id="rot" class="on">2048×1200 초광역 시야: 기체를 1/4 크기로 표시해요 <button onclick="this.parentNode.classList.remove('on')">그냥 플레이</button></div>
<script>
'use strict';
/* ================= 유틸 ================= */
/* === 실제 카메라 줌 아웃: 비행기/적/지형 모두 화면에서 25% 크기 ===
   2048x1200은 물리 렌더링 크기, W/H는 카메라가 보여 주는 월드 크기입니다.
   HUD와 P 관리자 패널은 UIW/UIH 공간에서 별도로 유지됩니다. */
const CAMERA_ZOOM=0.25;
const W=1152/CAMERA_ZOOM,H=675/CAMERA_ZOOM,UIW=960,UIH=562.5,TAU=Math.PI*2;
const UI_SCALE=W/UIW,RENDER_WIDTH=2048,RENDER_HEIGHT=1200;
const angDiff=(a,b)=>{let d=b-a;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;return d};
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a),rint=(a,b)=>Math.floor(rnd(a,b+1)),clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,pick=a=>a[Math.floor(Math.random()*a.length)];
const fmt=n=>Math.round(n).toLocaleString('ko-KR');
const fmtT=s=>{s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function mix(a,b,k){const p=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16)),A=p(a),B=p(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*k).toString(16).padStart(2,'0')).join('')}
const FONT="'Jua','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif";
const cv=$('#cv'),ctx=cv.getContext('2d'),ui=$('#ui');
let RES=RENDER_WIDTH/W;
function fit(){const s=Math.min(innerWidth/RENDER_WIDTH,innerHeight/RENDER_HEIGHT);document.documentElement.style.setProperty('--s',s);if(cv.width!==RENDER_WIDTH||cv.height!==RENDER_HEIGHT){cv.width=RENDER_WIDTH;cv.height=RENDER_HEIGHT}RES=RENDER_WIDTH/W}
addEventListener('resize',fit);fit();

/* ================= 저장 ================= */
const SKEY='hanul_1943_v1';
const defSave=()=>({coins:0,own:{p38:1,sub1:1,st1:1},sel:'p38',selSea:'sub1',selSpace:'st1',theme:'sky',up:{atk:0,hp:0,spd:0,mag:0,xp:0},best:{time:0,kills:0,score:0},clears:0,mute:0,runs:0});
let SAVE=(()=>{try{const d=JSON.parse(localStorage.getItem(SKEY));if(d){const b=defSave();return Object.assign(b,d,{own:Object.assign({p38:1,sub1:1,st1:1},d.own),up:Object.assign(b.up,d.up),best:Object.assign(b.best,d.best)})}}catch(e){}return defSave()})();
const saveNow=()=>{try{localStorage.setItem(SKEY,JSON.stringify(SAVE))}catch(e){}};

/* ================= 사운드 (WebAudio, 가볍게) ================= */
let AC=null,MASTER=null,NB=null;const sfxT={};
function audioInit(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();MASTER=AC.createGain();MASTER.gain.value=.32;MASTER.connect(AC.destination);NB=AC.createBuffer(1,AC.sampleRate*1,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(e){AC=null}}
function tone(f,d,type,v,slide){if(!AC||SAVE.mute)return;try{const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(v||.1,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(MASTER);o.start(t);o.stop(t+d)}catch(e){}}
function noise(d,v,lp){if(!AC||SAVE.mute)return;try{const t=AC.currentTime,s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();s.buffer=NB;f.type='lowpass';f.frequency.setValueAtTime(lp||1200,t);f.frequency.exponentialRampToValueAtTime(120,t+d);g.gain.setValueAtTime(v||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(MASTER);s.start(t);s.stop(t+d)}catch(e){}}
const gate=(k,ms)=>{const n=performance.now();if(n-(sfxT[k]||0)<ms)return false;sfxT[k]=n;return true};
const SFX={
  shot(){if(gate('shot',70))tone(760+Math.random()*120,.05,'square',.035,-380)},
  hit(){if(gate('hit',50))tone(220,.05,'square',.05,-90)},
  boom(){if(gate('boom',60))noise(.32,.2,1100)},
  big(){noise(.8,.4,700);tone(90,.6,'sawtooth',.2,-50)},
  gem(){if(gate('gem',45))tone(1100+Math.random()*300,.07,'sine',.06,500)},
  lvl(){tone(523,.12,'triangle',.18);setTimeout(()=>tone(659,.12,'triangle',.18),90);setTimeout(()=>tone(784,.2,'triangle',.2),180)},
  pow(){tone(660,.1,'square',.1,400);setTimeout(()=>tone(990,.16,'square',.1,300),90)},
  roll(){tone(300,.25,'sawtooth',.06,500)},
  hurt(){noise(.22,.3,500);tone(160,.2,'sawtooth',.12,-80)},
  bomb(){noise(1,.45,900);tone(70,.8,'sawtooth',.25,-30)},
  warn(){tone(520,.18,'square',.1);setTimeout(()=>tone(520,.18,'square',.1),260);setTimeout(()=>tone(520,.18,'square',.1),520)},
  win(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.25,'triangle',.2),i*140))},
  lose(){tone(300,.9,'sawtooth',.15,-250)}
};

/* ================= 스프라이트 도우미 ================= */
const OUT='#14233c';
function sprite(w,h,fn,sc){sc=sc||2;const c=document.createElement('canvas');c.width=Math.round(w*sc);c.height=Math.round(h*sc);const x=c.getContext('2d');x.scale(sc,sc);x.translate(w/2,h/2);fn(x);c.w=w;c.h=h;return c}
function whiteOf(s){const c=document.createElement('canvas');c.width=s.width;c.height=s.height;const x=c.getContext('2d');x.drawImage(s,0,0);x.globalCompositeOperation='source-in';x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);c.w=s.w;c.h=s.h;return c}
function drawSpr(c,s,x,y,rot,sx,sy,al){c.save();c.translate(x,y);if(rot)c.rotate(rot);if(sx!==undefined&&(sx!==1||sy!==1))c.scale(sx,sy);if(al!==undefined&&al<1)c.globalAlpha=al;c.drawImage(s,-s.w/2,-s.h/2,s.w,s.h);c.restore()}
function rr(x,a,b,w,h,r){r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
function fo(x,fill,w){x.fillStyle=fill;x.fill();x.lineWidth=w||3;x.strokeStyle=OUT;x.lineJoin='round';x.stroke()}
const lgv=(x,y0,y1,a,b)=>{const g=x.createLinearGradient(0,y0,0,y1);g.addColorStop(0,a);g.addColorStop(1,b);return g};
const lgh=(x,x0,x1,a,b)=>{const g=x.createLinearGradient(x0,0,x1,0);g.addColorStop(0,a);g.addColorStop(.5,b);g.addColorStop(1,mix(b,'#000000',.18));return g};
function ell(x,cx,cy,rx,ry,rot){x.beginPath();x.ellipse(cx,cy,rx,ry,rot||0,0,TAU)}
function pilot(x,cx,cy,k,s){s=s||1;ell(x,cx,cy,5.6*s,5.8*s);fo(x,'#ffd9b3',1.6);x.beginPath();x.arc(cx,cy-1.2*s,5.9*s,Math.PI,TAU);fo(x,k,1.6);x.fillStyle='#fff';x.beginPath();x.arc(cx-2.5*s,cy-.4*s,2.3*s,0,TAU);x.arc(cx+2.5*s,cy-.4*s,2.3*s,0,TAU);x.fill();x.fillStyle='#1b2b4a';x.beginPath();x.arc(cx-2.5*s,cy-.2*s,1.1*s,0,TAU);x.arc(cx+2.5*s,cy-.2*s,1.1*s,0,TAU);x.fill()}

function eye(x,cx,cy,r,ang){x.fillStyle='#fff';x.beginPath();x.arc(cx,cy,r,0,TAU);x.fill();x.lineWidth=1.6;x.strokeStyle=OUT;x.stroke();x.fillStyle='#d11a2a';x.beginPath();x.arc(cx,cy+r*.18,r*.52,0,TAU);x.fill();x.fillStyle='#1a1a2e';x.beginPath();x.arc(cx,cy+r*.18,r*.26,0,TAU);x.fill();
  x.strokeStyle=OUT;x.lineWidth=2.2;x.lineCap='round';x.beginPath();x.moveTo(cx-r*1.1*ang,cy-r*1.1);x.lineTo(cx+r*1.1*ang,cy-r*.45);x.stroke()}
function ePlane(x,o){
  const L=o.L,Wd=o.Wd,wing=o.wing,col=o.col,acc=o.acc,wh=o.wh||12,lt=mix(col,'#ffffff',.55);
  rr(x,-wing*.4,-L-3,wing*.8,9,4);fo(x,acc,2.5);
  rr(x,-wing,-5,wing*2,wh,wh/2);fo(x,lgv(x,-5,wh,lt,col));
  if(o.nac){for(const s of[-1,1]){ell(x,s*o.nac,-2,9,26);fo(x,lgh(x,-9,9,lt,col),2.6);ell(x,s*o.nac,26,6,6);fo(x,acc,2)}}
  ell(x,0,0,Wd,L);fo(x,lgh(x,-Wd,Wd,lt,col));
  if(o.stripe){x.fillStyle=o.stripe;rr(x,-Wd,-L*.55,Wd*2,6,3);x.fill();rr(x,-Wd*.9,-L*.3,Wd*1.8,4,2);x.fill()}
  ell(x,0,L-5,Wd*.62,8);fo(x,acc,2.5);
  ell(x,0,L*.18,Wd*.62,L*.34);fo(x,lgv(x,-L*.2,L*.6,'#f4feff','#79c8f0'),2.2);
  if(o.eyes===2){eye(x,-Wd*.3,L*.22,4,1);eye(x,Wd*.3,L*.22,4,-1)}else eye(x,0,L*.2,4.8,1);
}

function bossLocal(b,x,y){const dx=x-b.x,dy=y-b.y,c=Math.cos(b.face),s=Math.sin(b.face);return[dx*c+dy*s,-dx*s+dy*c]}
function bossWorld(b,lx,ly){const c=Math.cos(b.face),s=Math.sin(b.face);return[b.x+lx*c-ly*s,b.y+lx*s+ly*c]}
function bossHit(b,x,y,r){const l=bossLocal(b,x,y),dx=l[0]/(b.rx+r),dy=l[1]/(b.ry+r);return dx*dx+dy*dy<1}
function hurtB(b,d,show,col){
  if(b.dying)return;if(b.intro>0){spark(b.x,b.y,2,'#9ad');return}
  const c=crit(d);d=c[0];b.hp-=d;b.fl=.07;G.score+=1;
  if(show||c[1])txt(b.x+rnd(-b.rx*.5,b.rx*.5),b.y+rnd(-30,30),Math.round(d),c[1]?'#ffd24a':(col||'#fff'),c[1]?26:20);

}
function hurt(d){

  d=Math.max(1,Math.round(d*(1-G.stat.arm)));p.hp-=d;p.inv=.9;G.shake=11;G.redF=.45;SFX.hurt();

}

const DROP={scout:[0],zero:[0,0],diver:[1],bomber:[2,1,1],ace:[2,2,1],pow:[2],boat:[1,0],interceptor:[0,1],sniper:[1,1],mine:[0,1],juggernaut:[2,2,1],kamikaze:[1]};
function dropItem(k,x,y){G.it.push({x,y,k,t:0})}
function killE(e){
  if(e.dead)return;e.dead=true;G.kills++;G.score+=ET[e.type].sc;G.combo++;
  boom(e.x,e.y,e.type==='bomber'||e.type==='juggernaut'?1.9:e.type==='ace'||e.type==='sniper'?1.4:e.type==='boat'?1.2:.75);
  const d=ET[e.type];if(Math.random()<d.gem){for(const t of DROP[e.type])gemOf(e.x,e.y,t)}
  if(e.type==='pow')dropItem('pow',e.x,e.y);
  else{const r=Math.random();if(r<.012)dropItem('magnet',e.x,e.y);else if(r<.03&&G.p.hp<G.p.max*.9)dropItem('wrench',e.x,e.y);else if((e.type==='ace'||e.type==='bomber')&&Math.random()<.3)dropItem('wrench',e.x,e.y)}
  G.gauge+=e.type==='scout'?1.1:e.type==='bomber'?8:e.type==='ace'?10:2.4;
  if(G.gauge>=100){G.gauge-=100;if(G.bombs<3){G.bombs++;msg('대폭격 +1 !','#ffd24a')}else G.gauge=99}
}
function bossDie(b){b.dying=2.4;b.hp=0;G.eb.length=0;G.zones.length=0;G.score+=BOSS[b.kind].sc;G.slow=.5;G.flash=.4;SFX.big()}
function bossFinish(b){
  boom(b.x,b.y,3.4);G.flash=.7;G.shake=26;G.boss=null;G.bossKills++;G.bdone[b.kind]=1;
  for(let i=0;i<26;i++)gemOf(b.x+rnd(-b.rx,b.rx)*.8,b.y+rnd(-b.rx,b.rx)*.8,pick([1,2,2,3]));
  dropItem('wrench',b.x-30,b.y);dropItem('bomb',b.x+30,b.y);dropItem('pow',b.x,b.y-40);G.magnetT=1.8;
  if(b.final){G.end=3.4;G.result='win';SFX.win();msg('격침 성공!','#7dffb0')}else msg(b.name+' 격추!','#7dffb0');
}
function openLevelUp(){
  MODE='levelup';SFX.lvl();pickedOpts=buildOpts();
  const html=pickedOpts.map((o,i)=>{
    if(o.t==='x')return `<button class="opt new" data-a="pick" data-i="${i}"><div class="ic">${o.icon}</div><div class="tx"><b>${o.name}</b><p>${o.d}</p></div></button>`;
    const def=(o.t==='w'?WEAPONS:PASSIVES)[o.id],d=o.t==='w'?def.desc[o.lv-1]:def.desc;
    return `<button class="opt ${o.nw?'new':''}" data-a="pick" data-i="${i}"><div class="ic">${def.icon}</div><div class="tx"><b>${def.name}<em>${o.nw?'NEW':'Lv.'+o.lv+(o.lv===def.max?' MAX':'')}</em></b><p>${esc(d)}</p></div></button>`}).join('');
  ui.innerHTML=`<div class="scr dim lv"><h2>레벨 업!</h2><p class="sub">강화할 장비를 고르세요 (Lv.${G.lv}) · 키보드 1 2 3</p><div class="opts">${html}</div></div>`;
}
function buildOpts(){
  const cand=[],wc=Object.keys(G.w).length,pc=Object.keys(G.pas).length;
  for(const id in WEAPONS){const lv=G.w[id]||0;if(lv>0&&lv<WEAPONS[id].max)cand.push({t:'w',id,lv:lv+1,nw:false,wt:3});else if(lv===0&&wc<6)cand.push({t:'w',id,lv:1,nw:true,wt:2.2})}
  for(const id in PASSIVES){const lv=G.pas[id]||0;if(lv>0&&lv<PASSIVES[id].max)cand.push({t:'p',id,lv:lv+1,nw:false,wt:2.4});else if(lv===0&&pc<6)cand.push({t:'p',id,lv:1,nw:true,wt:1.5})}
  const out=[];while(out.length<3&&cand.length){const tot=cand.reduce((s,c)=>s+c.wt,0);let r=Math.random()*tot,i=0;for(;i<cand.length;i++){r-=cand[i].wt;if(r<=0)break}i=Math.min(i,cand.length-1);out.push(cand.splice(i,1)[0])}
  if(!out.length){out.push({t:'x',id:'heal',icon:'🔧',name:'긴급 수리',d:'에너지를 50% 회복해요'},{t:'x',id:'bomb',icon:'💥',name:'대폭격 보급',d:'대폭격 +1'})}
  return out;
}
function applyOpt(o){
  if(o.t==='w'){G.w[o.id]=o.lv;if(o.id==='wing')syncWing()}
  else if(o.t==='p'){G.pas[o.id]=o.lv;if(o.id==='hull'){G.p.max+=20;G.p.hp+=20}calcStat()}
  else if(o.id==='heal')healP(G.p.max*.5);else if(o.id==='bomb')G.bombs=Math.min(3,G.bombs+1);
  G.p.inv=Math.max(G.p.inv,1);
}
function pickOpt(i){
  const o=pickedOpts[i];if(!o)return;applyOpt(o);G.pend--;
  if(G.pend>0)openLevelUp();else{MODE='play';ui.innerHTML=''}
}

function doRoll(){const p=G.p;if(!G||MODE!=='play'||p.rollCd>0||G.end>0)return;p.roll=.6;p.rollCd=3.4;p.inv=Math.max(p.inv,.7);SFX.roll();part({x:p.x,y:p.y,life:.4,size:60,type:'ring'})}

  part({x:G.p.x,y:G.p.y,life:.7,size:760,type:'ring',col:'#ffffff'});part({x:G.p.x,y:G.p.y,life:.5,size:480,type:'ring',col:'#ffd24a'});

}

/* ---------- 무기 (전부 비행 방향 기준) ---------- */
function nearest(x,y,maxD,filter){let best=null,bd=maxD*maxD;for(const e of G.en){if(e.dead||!onScr(e.x,e.y,20)||(filter&&!filter(e)))continue;const d=(e.x-x)**2+(e.y-y)**2;if(d<bd){bd=d;best=e}}
  const b=G.boss;if(b&&!b.dying&&b.intro<=0&&onScr(b.x,b.y,0)){const d=(b.x-x)**2+(b.y-y)**2;if(d<bd){best=b}}return best}
function assistAng(){
  const p=G.p;let best=null,bd=1e9;
  for(const e of G.en){if(e.dead)continue;const dx=e.x-p.x,dy=e.y-p.y,d=Math.hypot(dx,dy);if(d>680||d<30)continue;const da=Math.abs(angDiff(p.hd,Math.atan2(dy,dx)));if(da<.55&&d<bd){bd=d;best=e}}
  const b=G.boss;if(b&&!b.dying&&b.intro<=0){const dx=b.x-p.x,dy=b.y-p.y,d=Math.hypot(dx,dy)-b.ry*.5;const da=Math.abs(angDiff(p.hd,Math.atan2(dy,dx)));if(da<.5&&d<bd)best=b}
  return best?p.hd+angDiff(p.hd,Math.atan2(best.y-p.y,best.x-p.x))*.8:p.hd;
}
function syncWing(){const n=pv([1,1,2,2,3],wl('wing'));while(G.wing.length<n)G.wing.push({x:G.p.x,y:G.p.y});G.wing.length=n}
function updWeapons(dt){
  const p=G.p,st=G.stat,D=st.dmg,R=st.rate,fx=Math.cos(p.hd),fy=Math.sin(p.hd),px=-fy,py=fx;
  for(const id in G.w){
    const lv=G.w[id];G.wt[id]=(G.wt[id]||0)-dt;
    if(id==='orbit'){
      const n=pv([2,2,3,3,4],lv),sp=pv([2.6,2.6,2.6,3.8,3.8],lv),dmg=pv([10,13,13,16,20],lv)*D;G.orb+=sp*dt;
      for(let i=0;i<n;i++){const a=G.orb+i*TAU/n,bx=p.x+Math.cos(a)*76,by=p.y+Math.sin(a)*76;
        for(const e of G.en){if(e.dead||e.type==='boat'||!onScr(e.x,e.y,20))continue;if((e.x-bx)**2+(e.y-by)**2<(e.r+14)**2&&(e.ho||0)<=0){e.ho=.35;hurtE(e,dmg,false);spark(bx,by,3)}}
        const b=G.boss;if(b&&!b.dying&&bossHit(b,bx,by,12)&&(b.ho||0)<=0){b.ho=.35;hurtB(b,dmg,false)}
        for(let j=G.eb.length-1;j>=0;j--){const q=G.eb[j];if(q.r<=7&&(q.x-bx)**2+(q.y-by)**2<(q.r+14)**2){spark(q.x,q.y,3);G.eb.splice(j,1)}}}
      continue;}
    if(G.wt[id]>0)continue;
    if(id==='gun'){const n=pv([2,2,3,3,4],lv),d=pv([8,10,11,13,15],lv)*D,a=assistAng(),vx=Math.cos(a)*800,vy=Math.sin(a)*800;G.wt[id]=pv([.17,.15,.15,.13,.12],lv)/R;
      for(let i=0;i<n;i++){const o=(i-(n-1)/2)*12;pbul({x:p.x+fx*30+px*o,y:p.y+fy*30+py*o,vx,vy,dmg:d,col:'y',life:.95})}SFX.shot()}
    else if(id==='spread'){const n=pv([3,3,5,5,7],lv),d=pv([6,7,7,8,9],lv)*D,a0=assistAng();G.wt[id]=pv([.42,.38,.36,.32,.28],lv)/R;
      for(let i=0;i<n;i++){const a=a0+(i-(n-1)/2)*.17;pbul({x:p.x+fx*24,y:p.y+fy*24,vx:Math.cos(a)*680,vy:Math.sin(a)*680,dmg:d,col:'c',r:5,life:.9})}SFX.shot()}
    else if(id==='missile'){const n=pv([1,2,2,3,4],lv),d=pv([28,32,38,42,48],lv)*D;G.wt[id]=pv([1.1,1,.95,.85,.75],lv)/R;
      for(let i=0;i<n;i++){const o=(i-(n-1)/2);pbul({x:p.x+fx*10+px*o*16,y:p.y+fy*10+py*o*16,vx:fx*260+px*o*110,vy:fy*260+py*o*110,dmg:d,col:'o',kind:'m',r:7,life:2.6,expl:pv([44,44,56,56,64],lv),spd:420})}SFX.shot()}
    else if(id==='laser'){const n=lv>=5?2:1,d=pv([22,26,30,36,44],lv)*D,r=pv([9,9,14,14,19],lv),a=assistAng();G.wt[id]=pv([1,.9,.8,.7,.6],lv)/R;
      for(let i=0;i<n;i++){const o=n===2?(i?22:-22):0;pbul({x:p.x+fx*40+px*o,y:p.y+fy*40+py*o,vx:Math.cos(a)*980,vy:Math.sin(a)*980,dmg:d,col:'m',kind:'l',r,pierce:99,life:.78,hit:new Set()})}SFX.shot()}
    else if(id==='wing'){const d=pv([6,8,8,10,12],lv)*D;G.wt[id]=pv([.34,.34,.34,.28,.24],lv)/R;const a=assistAng(),vx=Math.cos(a)*760,vy=Math.sin(a)*760;for(const w of G.wing)pbul({x:w.x+fx*14,y:w.y+fy*14,vx,vy,dmg:d,col:'y',r:4,life:.9})}
    else if(id==='flak'){const n=pv([1,1,1,2,3],lv),d=pv([30,34,44,44,56],lv)*D,r=pv([64,76,76,76,92],lv);G.wt[id]=pv([1.7,1.6,1.5,1.5,1.3],lv)/R;
      const tg=nearest(p.x,p.y,620);if(tg){for(let i=0;i<n;i++){const t2=tg;pbul({x:p.x+px*(i-(n-1)/2)*14,y:p.y+py*(i-(n-1)/2)*14,tx:t2.x+rnd(-26,26)*(i?1:0),ty:t2.y+rnd(-20,20)*(i?1:0),dmg:d,col:'o',kind:'f',r:7,life:1.6,expl:r,spd:560})}}else G.wt[id]=.3}
    else if(id==='chain'){const jumps=pv([3,4,4,5,6],lv),d=pv([14,16,19,22,26],lv)*D;G.wt[id]=pv([1.2,1.1,1,.9,.8],lv)/R;
      let cur=nearest(p.x,p.y,360),seen=new Set(),pts=[[p.x,p.y]];
      for(let j=0;j<jumps&&cur;j++){pts.push([cur.x,cur.y]);seen.add(cur);if(cur.kind)hurtB(cur,d,true,'#bfe9ff');else hurtE(cur,d,true,'#bfe9ff');const c0=cur;
        cur=null;let bd=200*200;for(const e of G.en){if(e.dead||seen.has(e)||!onScr(e.x,e.y,20))continue;const dd=(e.x-c0.x)**2+(e.y-c0.y)**2;if(dd<bd){bd=dd;cur=e}}}
      if(pts.length>1){G.fx.push({t:'bolt',pts,life:.2,max:.2});SFX.hit()}else G.wt[id]=.25}
  }
  if(wl('wing')){syncWing();const n=G.wing.length;G.wing.forEach((w,i)=>{let tx,ty;if(n===3&&i===2){tx=p.x-fx*58;ty=p.y-fy*58}else{const side=n===1?1:(i%2?1:-1);tx=p.x+px*side*64-fx*20;ty=p.y+py*side*64-fy*20}w.x=lerp(w.x,tx,Math.min(1,dt*9));w.y=lerp(w.y,ty,Math.min(1,dt*9))})}
}
/* ---------- 플레이어 탄 ---------- */
function explode(x,y,r,d,col){
  part({x,y,life:.3,size:r,type:'ring',col:col||'#ffb14a'});for(let i=0;i<6;i++)part({x:x+rnd(-r*.4,r*.4),y:y+rnd(-r*.4,r*.4),vx:rnd(-40,40),vy:rnd(-40,40),life:rnd(.2,.4),size:rnd(14,26),type:'fire'});G.shake=Math.max(G.shake,3);SFX.boom();
  for(const e of G.en.slice())if(!e.dead&&(e.x-x)**2+(e.y-y)**2<(r+e.r)**2)hurtE(e,d,true,'#ffcf8a');
  const b=G.boss;if(b&&!b.dying&&bossHit(b,x,y,r*.6))hurtB(b,d,true,'#ffcf8a');
}
function updPB(dt){
  const p=G.p;
  for(let i=G.pb.length-1;i>=0;i--){
    const b=G.pb[i];b.life-=dt;
    if(b.kind==='m'){
      let tg=b.tg;if(!tg||tg.dead||(tg.hp<=0))tg=b.tg=nearest(b.x,b.y,700);
      if(tg){const want=Math.atan2(tg.y-b.y,tg.x-b.x),cur=Math.atan2(b.vy,b.vx);let da=angDiff(cur,want);const na=cur+clamp(da,-6*dt,6*dt),sp=Math.min(b.spd,Math.hypot(b.vx,b.vy)+700*dt);b.vx=Math.cos(na)*sp;b.vy=Math.sin(na)*sp}
      else{const sp=Math.min(b.spd,Math.hypot(b.vx,b.vy)+500*dt),a=Math.atan2(b.vy,b.vx);b.vx=Math.cos(a)*sp;b.vy=Math.sin(a)*sp}
      if(Math.random()<.9){if(T.id==='sea')part({x:b.x-b.vx*.02,y:b.y-b.vy*.02,vx:rnd(-14,14),vy:rnd(-14,14),life:.5,size:rnd(2.5,5),type:'bubble'});else part({x:b.x-b.vx*.015,y:b.y-b.vy*.015,vx:rnd(-12,12),vy:rnd(-12,12),life:.28,size:rnd(5,9),type:'fire'})}
    }else if(b.kind==='f'){
      const dx=b.tx-b.x,dy=b.ty-b.y,d=Math.hypot(dx,dy)||1;b.vx=dx/d*b.spd;b.vy=dy/d*b.spd;
      if(d<16){explode(b.tx,b.ty,b.expl,b.dmg,'#ffb14a');G.pb.splice(i,1);continue}
    }
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.life<=0||(b.x-p.x)**2+(b.y-p.y)**2>1100*1100){if(b.kind==='f')explode(b.x,b.y,b.expl,b.dmg);G.pb.splice(i,1);continue}
    let dead=false;
    for(const e of G.en){
      if(e.dead)continue;const rr=e.r+b.r;if((e.x-b.x)**2+(e.y-b.y)**2>=rr*rr)continue;
      if(b.hit){if(b.hit.has(e))continue;b.hit.add(e)}
      if(b.kind==='m'||b.kind==='f'){explode(b.x,b.y,b.expl,b.dmg);dead=true;break}
      hurtE(e,b.dmg,b.kind==='l',b.kind==='l'?'#ff9af0':null);spark(b.x,b.y,2);
      if(b.pierce<=0){dead=true;break}else b.pierce--;
    }
    if(!dead&&G.boss&&!G.boss.dying){const bs=G.boss;if(bossHit(bs,b.x,b.y,b.r)&&!(b.hit&&b.hit.has(bs))){
      if(b.hit)b.hit.add(bs);
      if(b.kind==='m'||b.kind==='f'){explode(b.x,b.y,b.expl,b.dmg);dead=true}else{hurtB(bs,b.dmg,b.kind==='l');spark(b.x,b.y,2);if(b.pierce<=0)dead=true;else b.pierce--}}}
    if(dead&&G.pb[i]===b)G.pb.splice(i,1);
  }
}

/* ================= 적: 카메라 바깥에서 등장 · 생성 빈도 ×2 =================
   W/H는 실제로 화면에 보이는 월드 범위(2048×1200 / 줌 25%)입니다.
   모든 일반 적은 상하좌우의 화면 테두리 바깥에서 생성됩니다. */
const ENEMY_CAP=300; // 이전 150의 2배. 무한 누적 방지
const SPAWN_OUTSIDE=220; // 화면 월드 경계에서 최소 220 거리 바깥
function outsidePosition(a,gap=SPAWN_OUTSIDE){
  const dx=Math.cos(a),dy=Math.sin(a);
  // 방향 레이가 화면의 직사각형 테두리와 처음 만나는 교점에 간격을 더함
  const d=Math.min((W/2+gap)/Math.max(1e-6,Math.abs(dx)),(H/2+gap)/Math.max(1e-6,Math.abs(dy)));
  return [G.p.x+dx*d,G.p.y+dy*d];
}
function spawnE(type,x,y,o){
  if(G.en.length>=ENEMY_CAP)return null;
  const d=ET[type],p=G.p;
  // 보스가 출격시키는 적과 보급기를 포함한 모든 적기의 스폰을 화면 밖으로 강제
  if(onScr(x,y,SPAWN_OUTSIDE)){
    const a=Math.atan2(y-p.y,x-p.x);
    [x,y]=outsidePosition(a,SPAWN_OUTSIDE+rnd(25,120));
    // 위치를 옮긴 보급기는 새 위치에서 플레이어 방향으로 비행하도록 갱신
    if(type==='pow'&&o){const a2=Math.atan2(p.y-y,p.x-x);o={...o,vx:Math.cos(a2)*130,vy:Math.sin(a2)*130,hd:a2,fa:a2}}
  }
  const e={id:++EID,type,x,y,vx:0,vy:0,r:d.r,hp:d.hp*G.hpMul,t:rnd(0,6),fl:0,cd:d.fire?rnd(.8,d.fire):0,st:0,sea:!!d.sea,ho:0,dead:false,ang:0,orb:0,dir:1,life:16};
  e.max=e.hp;e.hd=Math.atan2(p.y-y,p.x-x)+((o&&o.dev)||0);e.fa=e.hd;if(o)Object.assign(e,o);G.en.push(e);return e;
}
const baseAng=()=>Math.random()<.72?G.p.hd+rnd(-1.0,1.0):rnd(0,TAU);
function formation(kind,type,n){
  const a=baseAng(),p=G.p,ox=Math.cos(a),oy=Math.sin(a),px=-oy,py=ox;
  const [cx,cy]=outsidePosition(a,rnd(SPAWN_OUTSIDE+70,SPAWN_OUTSIDE+240));
  if(kind==='vee'){
    for(let i=0;i<n;i++){
      const row=Math.floor((i+1)/2),side=i%2?1:-1,k=i?side*row*54:0;
      spawnE(type,cx+px*k+ox*row*56,cy+py*k+oy*row*56);
    }
  }else if(kind==='row'){
    for(let i=0;i<n;i++){const k=(i-(n-1)/2)*72;spawnE(type,cx+px*k,cy+py*k)}
  }else if(kind==='flank'){
    for(let i=0;i<n;i++){
      const aa=a+(i-(n-1)/2)*.095,[sx,sy]=outsidePosition(aa,SPAWN_OUTSIDE+rnd(80,240));
      spawnE(type,sx,sy,{flank:1,dev:rnd(-.25,.25)});
    }
  }else{
    for(let i=0;i<n;i++){
      const aa=a+rnd(-.9,.9),[sx,sy]=outsidePosition(aa,SPAWN_OUTSIDE+rnd(40,220));
      spawnE(type,sx,sy);
    }
  }

  const p=G.p,st=G.stat,s=steerInput();
  if(G.end<=0){
    if(s[2]>.1){const ta=Math.atan2(s[1],s[0]),df=angDiff(p.hd,ta),step=clamp(df,-TURN*dt,TURN*dt);p.hd+=step;if(p.hd>Math.PI)p.hd-=TAU;else if(p.hd<-Math.PI)p.hd+=TAU;p.tilt=lerp(p.tilt,clamp(df/.7,-1,1),Math.min(1,dt*8))}else p.tilt=lerp(p.tilt,0,Math.min(1,dt*6));
    const thr=s[2]>.1?.55+.45*s[2]:.55,sp=st.spd*thr*(p.roll>0?1.3:1);p.spdNow=sp;
    p.x+=Math.cos(p.hd)*sp*dt;p.y+=Math.sin(p.hd)*sp*dt;
  }
  p.prop+=dt*60;
  if(p.inv>0)p.inv-=dt;if(p.roll>0)p.roll-=dt;if(p.rollCd>0)p.rollCd-=dt;

}
function update(dtr){
  if(!G)return;let dt=dtr;if(G.slow>0){G.slow-=dtr;dt*=.35}
  if(G.hint>0)G.hint-=dtr;
  if(G.end<=0){G.t+=dt;director(dt)}
  updPlayer(dt);
  if(G.end<=0||G.result==='win')updWeapons(dt);
  updEnemies(dt);updBoss(dt);updPB(dt);updEB(dt);updZones(dt);updLoot(dt);
  for(let i=G.pt.length-1;i>=0;i--){const q=G.pt[i];q.life-=dt;if(q.life<=0){G.pt.splice(i,1);continue}q.x+=q.vx*dt;q.y+=q.vy*dt;if(q.g)q.vy+=q.g*dt;q.rot+=q.vr*dt;if(q.type==='smoke'){q.vx*=.98;q.vy*=.98}}
  for(let i=G.tx.length-1;i>=0;i--){const q=G.tx[i];q.life-=dt;q.y-=46*dt;if(q.life<=0)G.tx.splice(i,1)}
  for(let i=G.fx.length-1;i>=0;i--){G.fx[i].life-=dt;if(G.fx[i].life<=0)G.fx.splice(i,1)}
  for(let i=G.msg.length-1;i>=0;i--){G.msg[i].life-=dtr;if(G.msg[i].life<=0)G.msg.splice(i,1)}
  if(G.shake>0)G.shake=Math.max(0,G.shake-dtr*30);if(G.flash>0)G.flash-=dtr*1.6;if(G.redF>0)G.redF-=dtr;
  if(G.end>0){G.end-=dtr;if(G.end<=0)finish()}
  else if(G.pend>0&&MODE==='play')openLevelUp();
}

/* 고해상도 환경광 · 반사광 · 속도감 표현 (Canvas2D / 오프라인) */
function drawAtmosphere(c,t){
  c.save();
  if(T.id==='sky'){
    const sun=c.createRadialGradient(W*.74,H*.11,4,W*.74,H*.11,H*.92);
    sun.addColorStop(0,'rgba(255,245,199,.20)');sun.addColorStop(.28,'rgba(158,226,255,.10)');sun.addColorStop(1,'rgba(158,226,255,0)');
    c.fillStyle=sun;c.fillRect(0,0,W,H);
    c.lineCap='round';for(let k=0;k<36;k++){
      const x=mod(k*193+Math.sin(k*31.8)*341-t*8,W),y=mod(k*87+t*(7+k%3),H),len=7+(k%5)*6;
      c.strokeStyle='rgba(236,251,255,'+(.07+.045*(1+Math.sin(t*2+k))).toFixed(3)+')';c.lineWidth=1.2+(k%3)*.6;
      c.beginPath();c.moveTo(x-len*.5,y);c.quadraticCurveTo(x,y-3,x+len*.5,y);c.stroke();
    }
  }else if(T.id==='sea'){
    for(let k=0;k<11;k++){
      const x=mod(k*211+Math.sin(t*.3+k)*65,W+230)-115;
      const g=c.createLinearGradient(x,0,x+165,H);g.addColorStop(0,'rgba(126,242,255,.10)');g.addColorStop(1,'rgba(126,242,255,0)');
      c.fillStyle=g;c.beginPath();c.moveTo(x,0);c.lineTo(x+36,0);c.lineTo(x+165,H);c.lineTo(x+65,H);c.closePath();c.fill();
    }
  }else{
    const g=c.createRadialGradient(W*.65,H*.34,10,W*.65,H*.34,H*.84);
    g.addColorStop(0,'rgba(172,90,255,.095)');g.addColorStop(.45,'rgba(40,150,245,.065)');g.addColorStop(1,'rgba(20,20,80,0)');c.fillStyle=g;c.fillRect(0,0,W,H);
    c.strokeStyle='rgba(180,235,255,.12)';c.lineWidth=1;
    for(let i=0;i<15;i++){const xx=mod(i*319+t*(28+i%4*8),W),yy=mod(i*107-t*14,H);c.beginPath();c.moveTo(xx,yy);c.lineTo(xx-12,yy+8);c.stroke()}
  }
  c.restore();
}
function drawCinema(c,t){
  c.save();
  const g=c.createRadialGradient(W/2,H/2,H*.21,W/2,H/2,H*.93);
  g.addColorStop(0,'rgba(0,5,25,0)');g.addColorStop(.65,'rgba(1,7,25,.05)');g.addColorStop(1,'rgba(1,7,25,.28)');
  c.fillStyle=g;c.fillRect(0,0,W,H);

function drawGame(c){
  const cx=G.p.x,cy=G.p.y;
  c.save();if(G.shake>0)c.translate(rnd(-1,1)*G.shake*.5,rnd(-1,1)*G.shake*.5);

  const weapons=Object.keys(WEAPONS).map(id=>{const w=WEAPONS[id],lv=G.w[id]||0;
    return `<div class="admin-weapon"><span class="wn" title="${esc(w.name)}">${w.icon} ${esc(w.name)}</span>
      <button class="admin-adjust" data-a="admin-weapon" data-id="${id}" data-n="-1" ${lv<=0?'disabled':''} aria-label="${esc(w.name)} 감소">−</button>
      <span class="level">${lv}/${w.max}</span>
      <button class="admin-adjust" data-a="admin-weapon" data-id="${id}" data-n="1" ${lv>=w.max?'disabled':''} aria-label="${esc(w.name)} 증가">+</button></div>`
  }).join('');
  ui.innerHTML=`<div class="scr dim admin">
    <div class="admin-head"><div><h2>관리자 모드 <span style="font-size:16px;color:#89eece">P</span></h2><p class="admin-sub">전투는 일시정지 · 선택 즉시 기체/무기에 반영됩니다</p></div>
      <button class="btn sm alt" data-a="admin-close">전투 복귀 (P)</button></div>
    <div class="admin-grid"><section class="admin-pane"><h3>비행기 / 기체 선택</h3><div class="admin-planes">${planes}</div>
      <div class="admin-sep"></div><p class="admin-note">기체는 잠금 여부와 무관하게 변경할 수 있습니다. 장갑과 이동속도도 함께 적용됩니다.</p>
      <div class="admin-sep"></div><div class="admin-toolbar"><button class="btn sm alt" data-a="admin-heal">체력 100% 회복</button><button class="btn sm ghost" data-a="admin-bombs">폭격 +3</button></div></section>
    <section class="admin-pane"><h3>무기 장착 / 레벨 (0~5)</h3><div class="admin-weapons">${weapons}</div>
      <div class="admin-sep"></div><div class="admin-toolbar"><button class="btn sm alt" data-a="admin-max">장착 무기 MAX</button><button class="btn sm ghost" data-a="admin-reset">무기 초기화</button><button class="btn sm ${G.adminGod?'alt':'ghost'}" data-a="admin-god">무적 ${G.adminGod?'ON':'OFF'}</button></div></section></div>
    <div class="admin-bottom"><button class="btn big" style="font-size:19px;padding:8px 25px" data-a="admin-close">게임으로 돌아가기</button><span class="admin-sub">[P] 열기/닫기 · [Esc] 닫기</span></div>
  </div>`;
  ui.querySelectorAll('canvas[data-ap]').forEach(cn=>{const x=cn.getContext('2d'),s=PSPR[cn.dataset.ap];x.clearRect(0,0,140,105);x.drawImage(s,70-s.w*.65/2,53-s.h*.65/2,s.w*.65,s.h*.65)});
}
function adminClose(){if(MODE!=='admin')return;MODE='play';ui.innerHTML='';IN.keys={};IN.joy.on=false}
function adminAction(a,id,n){
  if(!G||MODE!=='admin')return;
  if(a==='admin-plane'){
    if(!T.vehs.includes(id))return;
    const ratio=G.p.max>0?G.p.hp/G.p.max:1;
    G.plane=id;G.p.max=VEH[id].hp+SAVE.up.hp*12+(G.pas.hull||0)*20;
    G.p.hp=Math.max(1,Math.min(G.p.max,Math.round(G.p.max*ratio)));
    G.p.inv=Math.max(G.p.inv,1.1);calcStat();msg('기체 교체: '+VEH[id].name,'#8affd5');
  }else if(a==='admin-weapon'){
    if(!(id in WEAPONS))return;
    const lv=clamp((G.w[id]||0)+Number(n||0),0,WEAPONS[id].max);
    if(lv===0){delete G.w[id];delete G.wt[id];if(id==='wing')G.wing=[]}
    else{G.w[id]=lv;if(id==='wing')syncWing()}
  }else if(a==='admin-max'){
    for(const id of Object.keys(G.w)){G.w[id]=WEAPONS[id].max;if(id==='wing')syncWing()}
  }else if(a==='admin-reset'){
    G.w={};G.w[VEH[G.plane].start]=1;G.wt={};G.wing=[];
  }else if(a==='admin-heal')healP(G.p.max);
  else if(a==='admin-bombs')G.bombs=Math.min(9,G.bombs+3);
  else if(a==='admin-god')G.adminGod=!G.adminGod;
  adminPanel();
}

function pause(){if(MODE!=='play')return;MODE='pause';IN.joy.on=false;ui.innerHTML=`<div class="scr dim ps">${muteBtn()}<h2>일시정지</h2><div class="col"><button class="btn big" data-a="resume" style="font-size:28px">계속하기</button><button class="btn ghost" data-a="quit">포기하고 나가기</button></div><div class="foot">누른 채 끌어서 선회 · <kbd>WASD</kbd> 방향 · <kbd>Space</kbd> 회피 롤 · <kbd>B</kbd> 대폭격</div></div>`}
function startGame(){audioInit();newGame();MODE='play';ui.innerHTML='';IN.joy.on=false;msg(T.go+'  '+VEH[selId()].name,'#7dffb0')}
function finish(){
  const win=G.result==='win',coins=Math.floor(G.score/220)+Math.floor(G.kills/12)+G.bossKills*70+(win?300:0)+Math.floor(G.t/10);
  const nb={};SAVE.coins+=coins;SAVE.runs++;
  if(G.t>SAVE.best.time){SAVE.best.time=G.t;nb.t=1}if(G.kills>SAVE.best.kills){SAVE.best.kills=G.kills;nb.k=1}if(G.score>SAVE.best.score){SAVE.best.score=G.score;nb.s=1}
  if(win)SAVE.clears++;saveNow();MODE='result';
  const tag=k=>nb[k]?'<span class="new-tag">NEW</span>':'';
  ui.innerHTML=`<div class="scr dim res"><h2 style="${win?'':'color:#ff9aa8;text-shadow:0 3px 0 #b02a42'}">${win?'🎉 '+T.win:'격추당했어요...'}</h2>
    <p class="sub">${win?T.winSub:T.loseSub}</p>
    <div class="stats"><div class="stat">생존 시간<b>${fmtT(G.t)}${tag('t')}</b></div><div class="stat">격추 수<b>${fmt(G.kills)}${tag('k')}</b></div><div class="stat">점수<b>${fmt(G.score)}${tag('s')}</b></div><div class="stat">도달 레벨<b>Lv.${G.lv}</b></div></div>
    <div class="stat wide">획득 훈장<b style="font-size:30px">★ ${fmt(coins)}</b></div>
    <div class="row" style="margin-top:auto"><button class="btn big sm2" data-a="play">다시 ${T.go}</button><button class="btn alt" data-a="hangar">${T.hangar}</button><button class="btn ghost" data-a="title">타이틀</button></div></div>`;
  win?SFX.win():0;
}
const muteBtn=()=>`<button class="mute" data-a="mute" title="소리">${SAVE.mute?'🔇':'🔊'}</button>`;
function toast(s){const d=document.createElement('div');d.className='toast';d.textContent=s;ui.appendChild(d);setTimeout(()=>d.remove(),3300)}
function toggleMute(){SAVE.mute=SAVE.mute?0:1;saveNow();ui.querySelectorAll('.mute').forEach(b=>b.textContent=SAVE.mute?'🔇':'🔊')}
function resume(){if(MODE!=='pause')return;MODE='play';ui.innerHTML=''}
ui.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;audioInit();const a=t.dataset.a,id=t.dataset.id;
  if(a==='play')startGame();else if(a==='hangar')showHangar();else if(a==='title')showTitle();else if(a==='tab')showHangar(id);
  else if(a==='sel'){SAVE[T.selKey]=id;saveNow();showHangar()}
  else if(a==='theme'){applyTheme(id);saveNow();showTitle()}
  else if(a==='buy'){const p=VEH[id];if(SAVE.coins>=p.cost){SAVE.coins-=p.cost;SAVE.own[id]=1;SAVE[T.selKey]=id;saveNow();showHangar();toast(p.name+' 획득!')}}
  else if(a==='up'){const u=UPG.find(q=>q.id===id),lv=SAVE.up[id],c=u.cost[lv];if(c!==undefined&&SAVE.coins>=c){SAVE.coins-=c;SAVE.up[id]++;saveNow();showHangar()}}
  else if(a==='pick')pickOpt(+t.dataset.i);else if(a==='resume')resume();else if(a==='quit'){MODE='title';G=null;showTitle()}
  else if(a==='admin-close')adminClose();else if(a.startsWith('admin-'))adminAction(a,id,t.dataset.n);
  else if(a==='mute')toggleMute();
});
/* ================= 입력: 누른 채 끌면 그 방향으로 선회 (플로팅 조이스틱) ================= */
const inBtn=(b,x,y)=>(x-b.x)**2+(y-b.y)**2<(b.r+14)**2;
const cpos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*UIW,(e.clientY-r.top)/r.height*UIH]};
cv.addEventListener('pointerdown',e=>{audioInit();if(MODE!=='play'||!G)return;const[x,y]=cpos(e);if(inBtn(BTN.pause,x,y)){pause();return}if(inBtn(BTN.roll,x,y)){doRoll();return}if(inBtn(BTN.bomb,x,y)){doBomb();return}
  const j=IN.joy;if(j.on)return;j.on=true;j.id=e.pointerId;j.ax=x;j.ay=y;j.x=x;j.y=y;try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',e=>{const j=IN.joy;if(!j.on||e.pointerId!==j.id)return;const[x,y]=cpos(e);j.x=x;j.y=y;
  const vx=x-j.ax,vy=y-j.ay,l=Math.hypot(vx,vy);if(l>110){j.ax=x-vx/l*110;j.ay=y-vy/l*110}});
const upP=e=>{if(e.pointerId===IN.joy.id)IN.joy.on=false};cv.addEventListener('pointerup',upP);cv.addEventListener('pointercancel',upP);
addEventListener('keydown',e=>{
  IN.keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  if(e.repeat&&(e.code==='KeyP'||e.code==='KeyF'))return;
  if(e.code==='KeyF'){if(document.fullscreenElement){document.exitFullscreen().catch(()=>{})}else{document.documentElement.requestFullscreen?.().catch(()=>{})}}
  if(MODE==='play'){if(e.code==='Space'||e.code==='ShiftLeft'||e.code==='ShiftRight')doRoll();else if(e.code==='KeyB'||e.code==='KeyX')doBomb();else if(e.code==='KeyP')adminPanel();else if(e.code==='Escape')pause()}
  else if(MODE==='admin'&&(e.code==='KeyP'||e.code==='Escape'))adminClose();
  else if(MODE==='pause'&&(e.code==='KeyP'||e.code==='Escape'))resume();
  else if(MODE==='levelup'&&['Digit1','Digit2','Digit3'].includes(e.code))pickOpt(+e.code.slice(5)-1);
  if(e.code==='KeyM')toggleMute();
});
addEventListener('keyup',e=>{IN.keys[e.code]=false});
addEventListener('blur',()=>{IN.keys={};IN.joy.on=false;if(MODE==='play')pause()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&MODE==='play')pause()});

/* ===== 5개 신규 적 유형: 3개 테마별 전용 실루엣/하이라이트 ===== */
const ELITE_TYPES=['interceptor','sniper','mine','juggernaut','kamikaze'];
function eliteShape(x,kind,theme){
  const P=theme==='sky'?['#e7edf1','#5688ae','#ff8c49','#fbd671']:
    theme==='sea'?['#9bf1e2','#247c91','#e782d5','#ccff76']:
    ['#f0d4ff','#704aca','#ff609d','#64eeff'];
  const [hi,lo,accent,light]=P;
  x.save();x.shadowColor=theme==='space'?'rgba(130,90,255,.4)':'rgba(70,150,200,.2)';x.shadowBlur=8;
  if(kind==='mine'){
    for(let i=0;i<12;i++){const a=i*TAU/12;x.save();x.rotate(a);x.beginPath();x.moveTo(-8,-14);x.lineTo(0,-38);x.lineTo(8,-14);x.closePath();fo(x,i%2?accent:lo,2);x.restore()}
    ell(x,0,0,22,22);fo(x,lgv(x,-22,22,hi,lo),3);
    ell(x,0,0,12,12);fo(x,accent,2);ell(x,0,0,5,5);fo(x,light,1.4);
  }else if(kind==='juggernaut'){
    for(const sign of[-1,1]){x.save();x.scale(sign,1);
      x.beginPath();x.moveTo(0,-27);x.lineTo(75,-20);x.lineTo(82,15);x.lineTo(58,29);x.lineTo(20,13);x.closePath();fo(x,lgv(x,-25,28,hi,lo),3.6);
      for(let i=0;i<3;i++){ell(x,29+i*18,5,7,11);fo(x,i===1?accent:lo,2)}x.restore()}
    ell(x,0,-2,25,44);fo(x,lgh(x,-25,25,hi,lo),3.8);
    rr(x,-10,-25,20,38,7);fo(x,accent,2);
    rr(x,-13,26,26,19,5);fo(x,lo,2);
    for(const sign of[-1,1]){rr(x,sign*15-5,15,10,26,5);fo(x,accent,1.5)}
  }else if(kind==='sniper'){
    x.beginPath();x.moveTo(-12,-35);x.lineTo(0,-55);x.lineTo(12,-35);x.lineTo(18,4);x.lineTo(69,22);x.lineTo(44,34);x.lineTo(6,26);x.lineTo(0,42);x.lineTo(-6,26);x.lineTo(-44,34);x.lineTo(-69,22);x.lineTo(-18,4);x.closePath();fo(x,lgv(x,-55,42,hi,lo),3);
    rr(x,-5,-56,10,61,4);fo(x,accent,2);
    ell(x,0,9,11,24);fo(x,hi,2);
    rr(x,-5,-6,10,19,5);fo(x,light,1.5);
    for(const xx of[-52,52]){ell(x,xx,25,8,5);fo(x,accent,2)}
  }else if(kind==='interceptor'){
    x.beginPath();x.moveTo(0,-42);x.lineTo(13,-20);x.lineTo(66,-12);x.lineTo(74,7);x.lineTo(21,13);x.lineTo(16,38);x.lineTo(0,28);x.lineTo(-16,38);x.lineTo(-21,13);x.lineTo(-74,7);x.lineTo(-66,-12);x.lineTo(-13,-20);x.closePath();fo(x,lgv(x,-42,38,hi,lo),3);
    for(const sign of[-1,1]){x.save();x.scale(sign,1);rr(x,24,-7,33,6,3);fo(x,accent,1.2);ell(x,35,6,6,5);fo(x,light,1.5);x.restore()}
    ell(x,0,-8,9,19);fo(x,light,2);
    ell(x,0,-35,8,7);fo(x,accent,2);
  }else{
    x.beginPath();x.moveTo(0,-51);x.lineTo(12,-12);x.lineTo(42,9);x.lineTo(32,19);x.lineTo(9,13);x.lineTo(18,41);x.lineTo(0,30);x.lineTo(-18,41);x.lineTo(-9,13);x.lineTo(-32,19);x.lineTo(-42,9);x.lineTo(-12,-12);x.closePath();fo(x,lgv(x,-51,41,hi,lo),3);
    rr(x,-5,-31,10,53,5);fo(x,accent,2);
    ell(x,0,-42,7,8);fo(x,light,1.5);
    for(const sign of[-1,1]){ell(x,sign*17,19,5,7);fo(x,light,1.2)}
  }
  x.shadowBlur=0;x.restore();
}
function buildEliteSprites(){
  for(const theme of ['sky','sea','space']){
    for(const id of ELITE_TYPES){
      const sz=id==='juggernaut'?[185,140]:id==='mine'?[90,90]:id==='sniper'?[155,125]:[160,125];
      const im=sprite(sz[0],sz[1],x=>eliteShape(x,id,theme),2);
      im.white=whiteOf(im);ES[theme][id]=im;
    }
  }
}

/* ================= 시작 ================= */
let last=0;
function frame(ts){
  const dt=Math.min(.05,Math.max(0,(ts-last)/1000)||0);last=ts;
  ctx.setTransform(RES,0,0,RES,0,0);
  if(MODE==='play'){update(dt);if(G)drawGame(ctx)}
  else if((MODE==='levelup'||MODE==='pause'||MODE==='admin')&&G)drawGame(ctx);
  else titleScene(ctx,dt);
  requestAnimationFrame(frame);
}
buildPlayerSprites();buildEnemySprites();buildBossSprites();buildGlow();buildGems();buildBG();buildSeaAll();buildSpaceAll();buildEliteSprites();buildShadows();applyTheme(SAVE.theme);
showTitle();requestAnimationFrame(frame);
</script>
</body>
