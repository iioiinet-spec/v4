<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>TRAILBLAZER 4x4 / OFFROAD SIM</title>
<style>
  :root{ --acc:#ffc24a; --grn:#7fe08a; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; background:#0a0d0b; }
  body{ font-family:'Consolas','Menlo','Courier New',monospace; user-select:none; -webkit-user-select:none; touch-action:none; }
  canvas{ display:block; position:fixed; top:0; left:0; width:100%; height:100%; }
  #gl{ z-index:1; } #ui{ z-index:2; pointer-events:none; }

  #help{
    position:fixed; z-index:5; left:18px; top:18px; max-width:346px;
    padding:13px 15px 14px; background:rgba(10,14,11,.82);
    border:1px solid rgba(255,194,74,.34); border-left:3px solid var(--acc);
    color:#e6ddc8; font-size:12px; line-height:1.65; backdrop-filter:blur(6px);
    transition:opacity .6s ease;
  }
  #help h1{ margin:0 0 8px; font-size:12px; letter-spacing:2.4px; color:var(--acc); font-weight:700; }
  #help dl{ margin:0; display:grid; grid-template-columns:104px 1fr; gap:3px 10px; }
  #help dt{ color:#9fe08a; font-weight:700; }
  #help dd{ margin:0; color:#c8bfa8; }
  #help .foot{ margin-top:9px; padding-top:8px; border-top:1px solid rgba(255,194,74,.18); color:#8b8371; font-size:11px; }
  #help.dim{ opacity:0; }

  #boot{
    position:fixed; inset:0; z-index:9; display:flex; align-items:center; justify-content:center;
    flex-direction:column; background:#0a0d0b; color:var(--acc); font-size:13px; letter-spacing:4px;
  }
  #boot span{ margin-top:14px; color:#5c5540; font-size:11px; letter-spacing:2px; }
  #boot.done{ opacity:0; pointer-events:none; transition:opacity .8s ease; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<canvas id="gl"></canvas>
<canvas id="ui"></canvas>

<div id="help">
  <h1>TRAILBLAZER 4&times;4</h1>
  <dl>
    <dt>W / S</dt><dd>가속 / 제동·후진</dd>
    <dt>A / D</dt><dd>좌 / 우 조향</dd>
    <dt>Space</dt><dd>핸드브레이크</dd>
    <dt>Shift</dt><dd>저단 기어 (등판力)</dd>
    <dt>C</dt><dd>시점 전환 (근/원/보닛)</dd>
    <dt>R</dt><dd>코스로 복귀</dd>
    <dt>H / P</dt><dd>안내창 / 화질 전환</dd>
  </dl>
  <p class="foot">정글에서 출발해 사막까지 이어지는 5km 순환 코스입니다. 노면을 벗어나면 접지력이 떨어지고, 경사가 급하면 저단 기어를 쓰세요.</p>
</div>

<div id="boot">SYSTEMS INITIALIZING<span>TERRAIN / BIOME SURVEY</span></div>

<script>
(function () {
  'use strict';

  var DEG = Math.PI / 180;
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function smooth(e0, e1, x) { var t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); }

  var FOV = 66;
  var WORLD = 3000;

  // ---------------------------------------------------------- trail curve
  var NT = 1600;
  function trailPoint(t) {
    return {
      x: Math.sin(t) * 700 + Math.sin(2 * t + 0.7) * 240 + Math.sin(3 * t + 2.1) * 110,
      z: Math.cos(t) * 720 + Math.cos(2 * t + 1.3) * 200 - Math.cos(3 * t + 0.4) * 90
    };
  }

  // biome blend: 0 = jungle, 1 = desert, following the loop parameter
  function biomeAt(t) { return smooth(0.18, 0.62, (Math.cos(t + 0.6) * -0.5 + 0.5)); }

  // ---------------------------------------------------------- terrain
  var OCT = [[1, 1, 1.0], [2, 3, 0.55], [3, 2, 0.4], [5, 4, 0.24], [8, 7, 0.14], [13, 11, 0.075]];
  var OSUM = 0; for (var oi = 0; oi < OCT.length; oi++) OSUM += OCT[oi][2];
  function fieldN(x, z) {
    var u = x / WORLD * Math.PI * 2, v = z / WORLD * Math.PI * 2, h = 0;
    for (var i = 0; i < OCT.length; i++) {
      var fx = OCT[i][0], fz = OCT[i][1], a = OCT[i][2];
      h += a * (Math.sin(u * fx + fz * 0.7) * Math.cos(v * fz + fx * 0.3)
              + 0.6 * Math.sin(u * fz + v * fx + 1.3));
    }
    return h / OSUM / 1.6;
  }
  function ridgeN(x, z) {
    var u = x / WORLD * Math.PI * 2, v = z / WORLD * Math.PI * 2;
    var n = Math.sin(u * 4 + 0.4) * Math.cos(v * 5 - 0.8) + 0.7 * Math.sin(u * 7 + v * 6);
    return 1 - Math.abs(n / 1.7);
  }
  function baseH(x, z) {
    return fieldN(x, z) * 52 + Math.pow(clamp(ridgeN(x, z), 0, 1), 2.4) * 46;
  }

  // sampled trail table
  var TP = [];
  (function () {
    var i;
    for (i = 0; i < NT; i++) {
      var t = i / NT * Math.PI * 2;
      var p = trailPoint(t);
      TP.push({ x: p.x, z: p.z, y: 0, tx: 0, tz: 0, nx: 0, nz: 0, s: 0, seg: 0, bio: biomeAt(t) });
    }
    for (i = 0; i < NT; i++) {
      var a = TP[(i - 1 + NT) % NT], b = TP[i], c = TP[(i + 1) % NT];
      var dx = c.x - a.x, dz = c.z - a.z, len = Math.hypot(dx, dz) || 1;
      b.tx = dx / len; b.tz = dz / len;
      b.nx = -b.tz; b.nz = b.tx;
      b.seg = Math.hypot(c.x - b.x, c.z - b.z);
    }
    // smoothed longitudinal profile: the trail is graded, not a trench
    for (i = 0; i < NT; i++) {
      var sum = 0, w = 0;
      for (var k = -6; k <= 6; k++) {
        var q = TP[(i + k + NT) % NT];
        var wt = 1 - Math.abs(k) / 7;
        sum += baseH(q.x, q.z) * wt; w += wt;
      }
      TP[i].y = sum / w;
    }
    var acc = 0;
    for (i = 0; i < NT; i++) { TP[i].s = acc; acc += TP[i].seg; }
    TP.total = acc;
  })();

  var TRAIL_H = 7.4, FEATHER = 78;

  // spatial hash so terrain height queries stay O(1)
  var CELL = 90, GRID = {};
  (function () {
    for (var i = 0; i < NT; i++) {
      var cx = Math.floor(TP[i].x / CELL), cz = Math.floor(TP[i].z / CELL);
      for (var a = -1; a <= 1; a++) for (var b = -1; b <= 1; b++) {
        var key = (cx + a) + '_' + (cz + b);
        (GRID[key] || (GRID[key] = [])).push(i);
      }
    }
  })();
  function nearTrail(x, z) {
    var key = Math.floor(x / CELL) + '_' + Math.floor(z / CELL);
    var list = GRID[key];
    if (!list) return null;
    var best = -1, bd = 1e18;
    for (var i = 0; i < list.length; i++) {
      var p = TP[list[i]];
      var d = (x - p.x) * (x - p.x) + (z - p.z) * (z - p.z);
      if (d < bd) { bd = d; best = list[i]; }
    }
    return { i: best, d: Math.sqrt(bd) };
  }
  function terrainH(x, z) {
    var h = baseH(x, z);
    var n = nearTrail(x, z);
    if (n && n.d < FEATHER) {
      h = lerp(h, TP[n.i].y, 1 - smooth(TRAIL_H, FEATHER, n.d));
    }
    return h;
  }
  function biomeXZ(x, z) {
    var n = nearTrail(x, z);
    if (n) return TP[n.i].bio;
    // fall back to the loop angle when far from the trail
    return biomeAt(Math.atan2(x, z) + Math.PI);
  }

  if (typeof THREE === 'undefined') {
    document.getElementById('boot').innerHTML =
      'THREE.JS \uB85C\uB4DC \uC2E4\uD328<span>\uC778\uD130\uB137 \uC5F0\uACB0\uC744 \uD655\uC778\uD558\uC138\uC694</span>';
    return;
  }
  start();

  function start() {
    function sc(hex) { return new THREE.Color(hex).convertSRGBToLinear(); }

    // ------------------------------------------------ renderer
    var glCanvas = document.getElementById('gl');
    var renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.autoClear = false;
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    var maxAniso = Math.min(8, renderer.capabilities.getMaxAnisotropy());

    var scene = new THREE.Scene();
    var fog = new THREE.FogExp2(sc(0xbfc9c2).getHex(), 0.00085);
    scene.fog = fog;

    var camera = new THREE.PerspectiveCamera(FOV, window.innerWidth / window.innerHeight, 0.15, 3400);

    // ------------------------------------------------ sky
    var skyMat = new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false, fog: false,
      uniforms: {
        top: { value: new THREE.Color(0x3f78b4) },
        mid: { value: new THREE.Color(0xa9c2d2) },
        bot: { value: new THREE.Color(0xe3d6b4) }
      },
      vertexShader: 'varying vec3 vP;void main(){vP=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
      fragmentShader: [
        'uniform vec3 top;uniform vec3 mid;uniform vec3 bot;varying vec3 vP;',
        'void main(){float y=clamp(vP.y*1.5+0.04,-1.0,1.0);',
        'vec3 c=y>0.0?mix(mid,top,pow(y,0.72)):mix(mid,bot,pow(-y,0.42));',
        'gl_FragColor=vec4(c,1.0);}'
      ].join('\n')
    });
    var sky = new THREE.Mesh(new THREE.SphereGeometry(1500, 32, 18), skyMat);
    sky.renderOrder = -1;
    scene.add(sky);

    scene.add(new THREE.HemisphereLight(sc(0xbcd6ea), sc(0x4a4a34), 1.05));
    var sun = new THREE.DirectionalLight(sc(0xfff0d2), 2.35);
    sun.position.set(-180, 230, 140);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    var shCam = sun.shadow.camera;
    shCam.left = -85; shCam.right = 85; shCam.top = 85; shCam.bottom = -85;
    shCam.near = 1; shCam.far = 620;
    shCam.updateProjectionMatrix();
    sun.shadow.bias = -0.0007;
    sun.shadow.normalBias = 0.6;
    scene.add(sun, sun.target);

    // ------------------------------------------------ ground mesh
    var SEG = 360;
    var gGeo = new THREE.PlaneGeometry(WORLD, WORLD, SEG, SEG);
    gGeo.rotateX(-Math.PI / 2);
    var gp = gGeo.attributes.position;
    var gcol = new Float32Array(gp.count * 3);

    var C_JGRASS = sc(0x3f6b2c), C_JDEEP = sc(0x27491f), C_JROCK = sc(0x63614a);
    var C_DSAND = sc(0xe0bd85), C_DDUNE = sc(0xefd6a6), C_DROCK = sc(0xa88a5c);
    var tc = new THREE.Color(), t2 = new THREE.Color();

    for (var i = 0; i < gp.count; i++) {
      var px = gp.getX(i), pz = gp.getZ(i);
      var hy = terrainH(px, pz);
      gp.setY(i, hy);

      var d = 6;
      var sx = (terrainH(px + d, pz) - terrainH(px - d, pz)) / (2 * d);
      var sz = (terrainH(px, pz + d) - terrainH(px, pz - d)) / (2 * d);
      var slope = clamp(Math.hypot(sx, sz), 0, 1.2) / 1.2;
      var alt = clamp(hy / 80, 0, 1);
      var bio = biomeXZ(px, pz);

      tc.copy(C_JDEEP).lerp(C_JGRASS, clamp(alt * 1.8 + 0.2, 0, 1));
      tc.lerp(C_JROCK, clamp((slope - 0.35) * 2.2, 0, 1));
      t2.copy(C_DSAND).lerp(C_DDUNE, clamp(alt * 1.5, 0, 1));
      t2.lerp(C_DROCK, clamp((slope - 0.3) * 2.4, 0, 1));
      tc.lerp(t2, bio);

      var j = 0.9 + 0.2 * (Math.sin(px * 0.29) * Math.cos(pz * 0.26) * 0.5 + 0.5);
      gcol[i * 3] = tc.r * j; gcol[i * 3 + 1] = tc.g * j; gcol[i * 3 + 2] = tc.b * j;
    }
    gGeo.setAttribute('color', new THREE.BufferAttribute(gcol, 3));
    gGeo.computeVertexNormals();

    function groundTex() {
      var cv = document.createElement('canvas');
      cv.width = cv.height = 256;
      var g = cv.getContext('2d');
      g.fillStyle = '#9a9a9a'; g.fillRect(0, 0, 256, 256);
      for (var k = 0; k < 5200; k++) {
        var v = Math.random();
        g.fillStyle = 'rgba(' + (v > 0.5 ? '235,235,235,' : '30,30,30,') + (0.05 + Math.random() * 0.2) + ')';
        g.fillRect(Math.random() * 256, Math.random() * 256, 1.6, 1.6);
      }
      var t = new THREE.CanvasTexture(cv);
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.repeat.set(WORLD / 14, WORLD / 14);
      t.anisotropy = maxAniso;
      return t;
    }
    var gMesh = new THREE.Mesh(gGeo, new THREE.MeshStandardMaterial({
      vertexColors: true, map: groundTex(), roughness: 0.96, metalness: 0.0
    }));
    gMesh.receiveShadow = true;
    scene.add(gMesh);

    // ------------------------------------------------ trail ribbon
    (function buildTrail() {
      var lanes = [-7.4, -5.6, -3.4, -1.2, 1.2, 3.4, 5.6, 7.4];
      var pos = [], col = [], uv = [], idx = [];
      var LN = lanes.length;
      var jT = sc(0x6f5f3f), jR = sc(0x4a3f2a), dT = sc(0xa88656), dR = sc(0x7d6238);
      var ca = new THREE.Color(), cb = new THREE.Color();
      for (var i = 0; i <= NT; i++) {
        var p = TP[i % NT];
        for (var c = 0; c < LN; c++) {
          var o = lanes[c];
          var rut = (Math.abs(o) > 1.2 && Math.abs(o) < 3.2);
          pos.push(p.x + p.nx * o, p.y + 0.30, p.z + p.nz * o);
          uv.push((o + 7) / 4.5, p.s / 4.5);
          ca.copy(rut ? jR : jT); cb.copy(rut ? dR : dT);
          ca.lerp(cb, p.bio);
          var sh = 0.9 + 0.2 * (Math.sin(i * 0.37 + c) * 0.5 + 0.5);
          col.push(ca.r * sh, ca.g * sh, ca.b * sh);
        }
      }
      for (var r = 0; r < NT; r++) {
        for (var q = 0; q < LN - 1; q++) {
          var a = r * LN + q, b = a + 1, c2 = a + LN, d2 = c2 + 1;
          idx.push(a, b, c2, b, d2, c2);
        }
      }
      var g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
      g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
      g.setIndex(idx);
      g.computeVertexNormals();
      var m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({
        vertexColors: true, map: groundTex(), roughness: 0.9, metalness: 0,
        polygonOffset: true, polygonOffsetFactor: -6, polygonOffsetUnits: -6
      }));
      m.receiveShadow = true;
      scene.add(m);
    })();

    // ------------------------------------------------ vegetation & rocks
    var seed = 40817;
    function rnd() { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }

    (function scatter() {
      var dm = new THREE.Object3D();
      var trunkM = [], canopyM = [], palmM = [], frondM = [], cactusM = [], armM = [], bushM = [], rockM = [], grassM = [];

      for (var n = 0; n < 22000; n++) {
        var x = (rnd() - 0.5) * WORLD, z = (rnd() - 0.5) * WORLD;
        var nt = nearTrail(x, z);
        var td = nt ? nt.d : 999;
        if (td < TRAIL_H + 3) continue;
        var y = terrainH(x, z);
        var bio = biomeXZ(x, z);
        var r = rnd();

        if (bio < 0.5) {
          // 열대우림: 상층 임관목 / 야자 / 나무고사리 / 하층 관목
          if (r < 0.30) {
            // 상층 emergent: 곧고 높은 줄기 + 넓은 다층 임관
            var th = 13 + rnd() * 16;
            dm.position.set(x, y + th / 2, z);
            dm.rotation.set((rnd() - 0.5) * 0.07, rnd() * 6, (rnd() - 0.5) * 0.07);
            dm.scale.set(0.5 + rnd() * 0.3, th / 8, 0.5 + rnd() * 0.3);
            dm.updateMatrix(); trunkM.push(dm.matrix.clone());
            // 버팀뿌리
            for (var bu = 0; bu < 3; bu++) {
              var ba = rnd() * 6;
              dm.position.set(x + Math.cos(ba) * 0.75, y + 0.7, z + Math.sin(ba) * 0.75);
              dm.rotation.set(0.34, ba, 0);
              dm.scale.set(0.3, 0.25, 0.3);
              dm.updateMatrix(); trunkM.push(dm.matrix.clone());
            }
            // 임관 3~4겹으로 겹쳐 밀도 표현
            var layers = 3 + Math.floor(rnd() * 2);
            for (var cl = 0; cl < layers; cl++) {
              var cs = (5.2 + rnd() * 3.6) * (1 - cl * 0.16);
              dm.position.set(x + (rnd() - 0.5) * 1.8, y + th - 1.2 - cl * 1.9, z + (rnd() - 0.5) * 1.8);
              dm.rotation.set(rnd(), rnd() * 6, rnd());
              dm.scale.set(cs, cs * (0.34 + rnd() * 0.2), cs);
              dm.updateMatrix(); canopyM.push(dm.matrix.clone());
            }
          } else if (r < 0.50) {
            // 중층목: 낮고 옆으로 퍼진 수관
            var mh = 6 + rnd() * 6;
            dm.position.set(x, y + mh / 2, z);
            dm.rotation.set((rnd() - 0.5) * 0.2, rnd() * 6, (rnd() - 0.5) * 0.2);
            dm.scale.set(0.42 + rnd() * 0.3, mh / 8, 0.42 + rnd() * 0.3);
            dm.updateMatrix(); trunkM.push(dm.matrix.clone());
            for (var m2 = 0; m2 < 2; m2++) {
              var ms = 3.0 + rnd() * 2.4;
              dm.position.set(x + (rnd() - 0.5) * 1.4, y + mh - 0.7 - m2 * 1.2, z + (rnd() - 0.5) * 1.4);
              dm.rotation.set(rnd(), rnd() * 6, rnd());
              dm.scale.set(ms, ms * 0.4, ms);
              dm.updateMatrix(); canopyM.push(dm.matrix.clone());
            }
          } else if (r < 0.68) {
            // 야자: 살짝 휜 줄기 + 방사형 잎 (줄기 축 벡터를 공유해 잎이 정확히 붙도록)
            var ph = 9 + rnd() * 9;
            var tiltA = (rnd() - 0.5) * 0.34, tiltB = rnd() * 6;
            var ax = -Math.sin(tiltA) * Math.cos(tiltB);
            var ay = Math.cos(tiltA);
            var az = Math.sin(tiltA) * Math.sin(tiltB);
            dm.position.set(x + ax * ph / 2, y + ay * ph / 2, z + az * ph / 2);
            dm.rotation.set(0, tiltB, tiltA);
            dm.scale.set(0.3, ph / 8, 0.3);
            dm.updateMatrix(); palmM.push(dm.matrix.clone());
            var tipX = x + ax * ph, tipY = y + ay * ph, tipZ = z + az * ph;
            var nf = 7 + Math.floor(rnd() * 3);
            for (var f = 0; f < nf; f++) {
              dm.position.set(tipX, tipY - 0.25, tipZ);
              dm.rotation.set(0.42 + rnd() * 0.5, f * (6.283 / nf) + rnd() * 0.3, 0);
              var fs = 3.0 + rnd() * 1.8;
              dm.scale.set(fs * 0.26, fs * 0.1, fs);
              dm.updateMatrix(); frondM.push(dm.matrix.clone());
            }
          } else if (r < 0.80) {
            // 나무고사리: 짧은 줄기에 큰 잎
            var fh = 2.2 + rnd() * 2.4;
            dm.position.set(x, y + fh / 2, z);
            dm.rotation.set(0, rnd() * 6, 0);
            dm.scale.set(0.2, fh / 8, 0.2);
            dm.updateMatrix(); palmM.push(dm.matrix.clone());
            for (var q3 = 0; q3 < 6; q3++) {
              dm.position.set(x, y + fh, z);
              dm.rotation.set(0.75 + rnd() * 0.3, q3 * 1.05 + rnd() * 0.3, 0);
              var qs = 1.5 + rnd() * 0.9;
              dm.scale.set(qs * 0.3, qs * 0.09, qs);
              dm.updateMatrix(); frondM.push(dm.matrix.clone());
            }
          } else if (r < 0.96) {
            // 하층 관목 덤불
            var bs = 1.0 + rnd() * 2.2;
            dm.position.set(x, y + bs * 0.35, z);
            dm.rotation.set(rnd(), rnd() * 6, rnd());
            dm.scale.set(bs * 1.5, bs * 0.7, bs * 1.5);
            dm.updateMatrix(); bushM.push(dm.matrix.clone());
          } else {
            var rs = 0.8 + rnd() * 2.6;
            dm.position.set(x, y - 0.3, z);
            dm.rotation.set(rnd() * 3, rnd() * 6, rnd() * 3);
            dm.scale.set(rs, rs * (0.5 + rnd() * 0.6), rs);
            dm.updateMatrix(); rockM.push(dm.matrix.clone());
          }
        } else {
          // desert: sparse cactus, scrub, boulders
          if (r < 0.20) {
            var ch = 2.6 + rnd() * 4.2;
            dm.position.set(x, y + ch / 2, z);
            dm.rotation.set(0, rnd() * 6, 0);
            dm.scale.set(0.55, ch / 4, 0.55);
            dm.updateMatrix(); cactusM.push(dm.matrix.clone());
            if (rnd() > 0.4) {
              var ang = rnd() * 6;
              dm.position.set(x + Math.cos(ang) * 0.75, y + ch * 0.66, z + Math.sin(ang) * 0.75);
              dm.rotation.set(0, ang, 0.9);
              dm.scale.set(0.38, 0.85, 0.38);
              dm.updateMatrix(); armM.push(dm.matrix.clone());
            }
          } else if (r < 0.62) {
            var ds = 0.7 + rnd() * 1.4;
            dm.position.set(x, y + ds * 0.3, z);
            dm.rotation.set(rnd() * 0.5, rnd() * 6, rnd() * 0.5);
            dm.scale.set(ds * 1.6, ds * 0.5, ds * 1.6);
            dm.updateMatrix(); grassM.push(dm.matrix.clone());
          } else if (r < 0.78) {
            var rs2 = 1.0 + rnd() * 4.2;
            dm.position.set(x, y - 0.4, z);
            dm.rotation.set(rnd() * 3, rnd() * 6, rnd() * 3);
            dm.scale.set(rs2, rs2 * (0.45 + rnd() * 0.6), rs2);
            dm.updateMatrix(); rockM.push(dm.matrix.clone());
          }
        }
      }

      // ---- 코스변 집중 식생: 균일 산포만으로는 임도 양옆이 비어 보인다
      for (var ti = 0; ti < NT; ti += 2) {
        var tpo = TP[ti];
        var lush = 1 - tpo.bio;                       // 정글일수록 빽빽
        var count = Math.round(lush * 5 + 0.4);
        for (var c2 = 0; c2 < count; c2++) {
          var sgn2 = rnd() > 0.5 ? 1 : -1;
          var off2 = (TRAIL_H + 3.5) + rnd() * 34;
          var jx = tpo.x + tpo.nx * off2 * sgn2 + (rnd() - 0.5) * 5;
          var jz = tpo.z + tpo.nz * off2 * sgn2 + (rnd() - 0.5) * 5;
          var nt2 = nearTrail(jx, jz);
          if (nt2 && nt2.d < TRAIL_H + 2.5) continue;
          var jy = terrainH(jx, jz);
          var jb = biomeXZ(jx, jz);
          var rr2 = rnd();

          if (jb > 0.55) {
            if (rr2 < 0.5) {
              var ds2 = 0.7 + rnd() * 1.5;
              dm.position.set(jx, jy + ds2 * 0.3, jz);
              dm.rotation.set(rnd() * 0.4, rnd() * 6, rnd() * 0.4);
              dm.scale.set(ds2 * 1.6, ds2 * 0.5, ds2 * 1.6);
              dm.updateMatrix(); grassM.push(dm.matrix.clone());
            } else {
              var rk2 = 0.9 + rnd() * 2.4;
              dm.position.set(jx, jy - 0.35, jz);
              dm.rotation.set(rnd() * 3, rnd() * 6, rnd() * 3);
              dm.scale.set(rk2, rk2 * 0.6, rk2);
              dm.updateMatrix(); rockM.push(dm.matrix.clone());
            }
            continue;
          }

          if (rr2 < 0.34) {
            // 임도를 굽어보는 큰 나무
            var bh2 = 9 + rnd() * 13;
            dm.position.set(jx, jy + bh2 / 2, jz);
            dm.rotation.set((rnd() - 0.5) * 0.09, rnd() * 6, (rnd() - 0.5) * 0.09);
            dm.scale.set(0.44 + rnd() * 0.28, bh2 / 8, 0.44 + rnd() * 0.28);
            dm.updateMatrix(); trunkM.push(dm.matrix.clone());
            for (var lc = 0; lc < 3; lc++) {
              var cs2 = (4.4 + rnd() * 3.0) * (1 - lc * 0.17);
              dm.position.set(jx + (rnd() - 0.5) * 1.6, jy + bh2 - 1.1 - lc * 1.8, jz + (rnd() - 0.5) * 1.6);
              dm.rotation.set(rnd(), rnd() * 6, rnd());
              dm.scale.set(cs2, cs2 * (0.34 + rnd() * 0.18), cs2);
              dm.updateMatrix(); canopyM.push(dm.matrix.clone());
            }
          } else if (rr2 < 0.52) {
            // 야자
            var ph2 = 8 + rnd() * 8;
            var A2 = (rnd() - 0.5) * 0.3, B2 = rnd() * 6;
            var axx = -Math.sin(A2) * Math.cos(B2), ayy = Math.cos(A2), azz = Math.sin(A2) * Math.sin(B2);
            dm.position.set(jx + axx * ph2 / 2, jy + ayy * ph2 / 2, jz + azz * ph2 / 2);
            dm.rotation.set(0, B2, A2);
            dm.scale.set(0.28, ph2 / 8, 0.28);
            dm.updateMatrix(); palmM.push(dm.matrix.clone());
            for (var f2 = 0; f2 < 8; f2++) {
              dm.position.set(jx + axx * ph2, jy + ayy * ph2 - 0.25, jz + azz * ph2);
              dm.rotation.set(0.45 + rnd() * 0.45, f2 * 0.785 + rnd() * 0.3, 0);
              var fs2 = 2.8 + rnd() * 1.6;
              dm.scale.set(fs2 * 0.26, fs2 * 0.1, fs2);
              dm.updateMatrix(); frondM.push(dm.matrix.clone());
            }
          } else {
            // 하층 덤불 벽
            var bs2 = 1.1 + rnd() * 2.4;
            dm.position.set(jx, jy + bs2 * 0.34, jz);
            dm.rotation.set(rnd(), rnd() * 6, rnd());
            dm.scale.set(bs2 * 1.6, bs2 * 0.75, bs2 * 1.6);
            dm.updateMatrix(); bushM.push(dm.matrix.clone());
          }
        }
      }

      var icoG = new THREE.IcosahedronGeometry(1, 1);
      var cylG = new THREE.CylinderGeometry(0.86, 1.2, 8, 8);
      var boxG = new THREE.BoxGeometry(1, 1, 1);
      var capG = new THREE.CylinderGeometry(1, 1, 4, 8);

      var defs = [
        [cylG, new THREE.MeshStandardMaterial({ color: sc(0x4d3a26), roughness: 0.96 }), trunkM],
        [icoG, new THREE.MeshStandardMaterial({ color: sc(0x2b6f24), roughness: 0.88, flatShading: true }), canopyM],
        [cylG, new THREE.MeshStandardMaterial({ color: sc(0x76644a), roughness: 0.95 }), palmM],
        [boxG, new THREE.MeshStandardMaterial({ color: sc(0x46913a), roughness: 0.86 }), frondM],
        [capG, new THREE.MeshStandardMaterial({ color: sc(0x4d7a44), roughness: 0.85 }), cactusM],
        [capG, new THREE.MeshStandardMaterial({ color: sc(0x4d7a44), roughness: 0.85 }), armM],
        [icoG, new THREE.MeshStandardMaterial({ color: sc(0x25551f), roughness: 0.93, flatShading: true }), bushM],
        [icoG, new THREE.MeshStandardMaterial({ color: sc(0x8b8270), roughness: 0.95, flatShading: true }), rockM],
        [icoG, new THREE.MeshStandardMaterial({ color: sc(0x9a8d5e), roughness: 0.95, flatShading: true }), grassM]
      ];
      for (var k = 0; k < defs.length; k++) {
        var arr = defs[k][2];
        if (!arr.length) continue;
        var im = new THREE.InstancedMesh(defs[k][0], defs[k][1], arr.length);
        for (var q = 0; q < arr.length; q++) im.setMatrixAt(q, arr[q]);
        im.instanceMatrix.needsUpdate = true;
        im.castShadow = true; im.receiveShadow = true;
        scene.add(im);
      }
    })();

    // ------------------------------------------------ trail markers
    (function markers() {
      var postG = new THREE.BoxGeometry(0.2, 1.5, 0.2);
      var postMat = new THREE.MeshStandardMaterial({ color: sc(0xe8e2d2), roughness: 0.85 });
      var capG = new THREE.BoxGeometry(0.3, 0.42, 0.3);
      var capMat = new THREE.MeshStandardMaterial({ color: sc(0xff7a22), roughness: 0.7 });
      var pm = [], cm = [];
      var dm = new THREE.Object3D();
      for (var i = 0; i < NT; i += 30) {
        var p = TP[i];
        var sgn = (Math.floor(i / 30) % 2) ? 1 : -1;
        var x = p.x + p.nx * (TRAIL_H + 1.6) * sgn, z = p.z + p.nz * (TRAIL_H + 1.6) * sgn;
        var y = terrainH(x, z);
        dm.position.set(x, y + 0.75, z); dm.rotation.set(0, 0, 0); dm.scale.set(1, 1, 1);
        dm.updateMatrix(); pm.push(dm.matrix.clone());
        dm.position.set(x, y + 1.62, z);
        dm.updateMatrix(); cm.push(dm.matrix.clone());
      }
      [[postG, postMat, pm], [capG, capMat, cm]].forEach(function (e) {
        var im = new THREE.InstancedMesh(e[0], e[1], e[2].length);
        for (var k = 0; k < e[2].length; k++) im.setMatrixAt(k, e[2][k]);
        im.instanceMatrix.needsUpdate = true;
        im.castShadow = true;
        scene.add(im);
      });
    })();

    // ------------------------------------------------ the truck
    var truck = new THREE.Group();
    var wheelPivots = [];
    (function buildTruck() {
      // 오픈탑 오프로더: 박스형 차체 + 노출 롤케이지 + 비드락 휠
      var GREEN = 0x62a12e, GREEN_D = 0x3f6c1c, LIME = 0x9cd63a;
      var paint = new THREE.MeshStandardMaterial({ color: sc(GREEN), roughness: 0.34, metalness: 0.34 });
      var paintD = new THREE.MeshStandardMaterial({ color: sc(GREEN_D), roughness: 0.42, metalness: 0.25 });
      var lime = new THREE.MeshStandardMaterial({ color: sc(LIME), roughness: 0.42, metalness: 0.2 });
      var matte = new THREE.MeshStandardMaterial({ color: sc(0x1b1e21), roughness: 0.82, metalness: 0.15 });
      var trimM = new THREE.MeshStandardMaterial({ color: sc(0x2a2e33), roughness: 0.6, metalness: 0.4 });
      var chrome = new THREE.MeshStandardMaterial({ color: sc(0xaeb4ba), roughness: 0.28, metalness: 0.85 });
      var glass = new THREE.MeshStandardMaterial({
        color: sc(0x3d4f57), roughness: 0.08, metalness: 0.6, transparent: true, opacity: 0.55 });
      var seatM = new THREE.MeshStandardMaterial({ color: sc(0x24262a), roughness: 0.92 });
      var tyreM = new THREE.MeshStandardMaterial({ color: sc(0x141618), roughness: 0.97 });
      var lampW = new THREE.MeshBasicMaterial({ color: 0xfff3d6 });
      var lampR = new THREE.MeshBasicMaterial({ color: 0x8e1710 });

      function box(w, h, d, mat, x, y, z) {
        var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
        m.position.set(x, y, z);
        truck.add(m);
        return m;
      }
      // 튜브: 두 점을 잇는 원통
      var tubeGeo = new THREE.CylinderGeometry(1, 1, 1, 8);
      function tube(x1, y1, z1, x2, y2, z2, r, mat) {
        var a = new THREE.Vector3(x1, y1, z1), b = new THREE.Vector3(x2, y2, z2);
        var dir = new THREE.Vector3().subVectors(b, a);
        var len = dir.length();
        var m = new THREE.Mesh(tubeGeo, mat || matte);
        m.scale.set(r, len, r);
        m.position.copy(a).addScaledVector(dir, 0.5);
        m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
        truck.add(m);
        return m;
      }

      // ---- 섀시 / 바디텁
      box(1.98, 0.30, 4.30, matte, 0, 0.70, 0);           // 프레임
      box(1.96, 0.62, 4.10, paint, 0, 1.12, 0);            // 바디텁
      box(2.00, 0.16, 4.14, paintD, 0, 1.44, 0);           // 벨트라인
      // 사이드 실 / 록레일
      tube(-0.99, 0.86, -1.9, -0.99, 0.86, 1.9, 0.07, trimM);
      tube(0.99, 0.86, -1.9, 0.99, 0.86, 1.9, 0.07, trimM);

      // ---- 보닛 / 그릴 / 펜더
      box(1.86, 0.34, 1.30, paint, 0, 1.44, -2.02);        // 보닛
      box(1.82, 0.52, 0.16, matte, 0, 1.24, -2.68);        // 그릴 패널
      for (var g = -3; g <= 3; g++) {
        box(0.14, 0.42, 0.06, trimM, g * 0.24, 1.24, -2.75);
      }
      [-0.66, 0.66].forEach(function (x) {                  // 원형 헤드램프
        var hl = new THREE.Mesh(new THREE.CylinderGeometry(0.21, 0.21, 0.1, 14), lampW);
        hl.rotation.x = Math.PI / 2; hl.position.set(x, 1.30, -2.74); truck.add(hl);
        var rim = new THREE.Mesh(new THREE.TorusGeometry(0.23, 0.035, 8, 16), trimM);
        rim.position.set(x, 1.30, -2.73); truck.add(rim);
      });
      // 플레어 펜더
      [[-1.06, -1.46], [1.06, -1.46], [-1.06, 1.52], [1.06, 1.52]].forEach(function (p) {
        var f = new THREE.Mesh(new THREE.TorusGeometry(0.86, 0.07, 6, 16, Math.PI), matte);
        f.rotation.set(0, Math.PI / 2, 0);
        f.position.set(p[0] * 1.06, 0.80, p[1]);
        truck.add(f);
      });

      // ---- 윈드실드 (앞으로 눕힌 프레임)
      var wsA = new THREE.Mesh(new THREE.BoxGeometry(1.86, 0.86, 0.09), glass);
      wsA.position.set(0, 1.98, -1.28); wsA.rotation.x = -0.30; truck.add(wsA);
      var wsF = new THREE.Mesh(new THREE.BoxGeometry(1.94, 0.94, 0.05), paint);
      wsF.position.set(0, 1.98, -1.24); wsF.rotation.x = -0.30; truck.add(wsF);
      wsA.position.z -= 0.05;

      // ---- 노출 롤케이지 (오픈탑의 핵심 실루엣)
      var CY = 2.46, SX = 0.88;
      [-1, 1].forEach(function (sd) {
        tube(sd * SX, 1.42, -1.18, sd * SX, CY, -0.86, 0.055);   // A필러
        tube(sd * SX, 1.42, 1.30, sd * SX, CY, 1.10, 0.055);      // B필러
        tube(sd * SX, CY, -0.86, sd * SX, CY, 1.10, 0.055);       // 사이드 레일
        tube(sd * SX, 1.60, 0.10, sd * SX, CY, -0.30, 0.05);      // 대각 보강
      });
      tube(-SX, CY, -0.86, SX, CY, -0.86, 0.055);                 // 프론트 후프
      tube(-SX, CY, 1.10, SX, CY, 1.10, 0.055);                   // 리어 후프
      tube(-SX, CY, 0.14, SX, CY, 0.14, 0.05);                    // 센터 크로스
      tube(-SX * 0.6, CY, -0.86, SX * 0.6, CY, 0.14, 0.042);      // X 브레이스
      tube(SX * 0.6, CY, -0.86, -SX * 0.6, CY, 0.14, 0.042);

      // ---- 실내 (오픈탑이라 보임)
      box(1.72, 0.10, 1.9, matte, 0, 1.44, 0.15);                 // 바닥
      box(1.80, 0.34, 0.24, trimM, 0, 1.72, -1.02);               // 대시
      [[-0.46, -0.42], [0.46, -0.42], [-0.46, 0.78], [0.46, 0.78]].forEach(function (p) {
        box(0.50, 0.16, 0.48, seatM, p[0], 1.60, p[1]);           // 시트 방석
        var bk = box(0.50, 0.56, 0.14, seatM, p[0], 1.86, p[1] + 0.26);
        bk.rotation.x = 0.16;
      });
      var wheel = new THREE.Mesh(new THREE.TorusGeometry(0.17, 0.032, 8, 18), matte);
      wheel.position.set(-0.46, 1.78, -0.86); wheel.rotation.x = 1.15; truck.add(wheel);

      // ---- 리어: 스페어 + 테일게이트
      box(1.88, 0.66, 0.14, paint, 0, 1.26, 2.10);
      var spareG = new THREE.CylinderGeometry(0.46, 0.46, 0.26, 18);
      spareG.rotateX(Math.PI / 2);
      var spare = new THREE.Mesh(spareG, tyreM);
      spare.position.set(0.10, 1.52, 2.26); truck.add(spare);
      var spareRim = new THREE.Mesh(new THREE.TorusGeometry(0.30, 0.06, 8, 20), lime);
      spareRim.position.set(0.10, 1.52, 2.41); truck.add(spareRim);
      [-0.74, 0.74].forEach(function (x) {                        // 테일램프
        box(0.20, 0.30, 0.06, lampR, x, 1.32, 2.19);
      });

      // ---- 스노클 / 루프랙 라이트바 / 범퍼
      tube(-0.98, 1.30, -1.86, -0.98, 2.62, -1.42, 0.075, trimM);
      var snorkTop = box(0.20, 0.20, 0.34, trimM, -0.98, 2.68, -1.34);
      snorkTop.rotation.x = 0.2;
      var spareHub = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.06, 12), chrome);
      spareHub.rotation.x = Math.PI / 2; spareHub.position.set(0.10, 1.52, 2.42); truck.add(spareHub);
      var lightBar = box(1.46, 0.14, 0.14, trimM, 0, CY + 0.16, -0.86);
      for (var l = -2; l <= 2; l++) {
        var lp = new THREE.Mesh(new THREE.CylinderGeometry(0.085, 0.085, 0.08, 10), lampW);
        lp.rotation.x = Math.PI / 2;
        lp.position.set(l * 0.30, CY + 0.16, -0.94); truck.add(lp);
      }
      box(2.02, 0.20, 0.24, matte, 0, 0.92, -2.86);               // 프론트 범퍼
      box(2.02, 0.20, 0.24, matte, 0, 0.92, 2.36);                // 리어 범퍼
      var winch = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.62, 12), chrome);
      winch.rotation.z = Math.PI / 2; winch.position.set(0, 1.06, -2.84); truck.add(winch);

      // ---- 비드락 휠 (라임 링)
      var tyreG = new THREE.CylinderGeometry(0.68, 0.68, 0.46, 20);
      tyreG.rotateZ(Math.PI / 2);
      var lugG = new THREE.BoxGeometry(0.50, 0.10, 0.10);
      var rimG = new THREE.CylinderGeometry(0.40, 0.40, 0.48, 14);
      rimG.rotateZ(Math.PI / 2);
      var ringG = new THREE.TorusGeometry(0.46, 0.055, 8, 20);
      ringG.rotateY(Math.PI / 2);
      var hubG = new THREE.CylinderGeometry(0.16, 0.16, 0.52, 10);
      hubG.rotateZ(Math.PI / 2);

      [[-1.06, -1.46], [1.06, -1.46], [-1.06, 1.52], [1.06, 1.52]].forEach(function (p) {
        var piv = new THREE.Group();
        piv.position.set(p[0], 0.68, p[1]);
        piv.add(new THREE.Mesh(tyreG, tyreM));
        piv.add(new THREE.Mesh(rimG, matte));
        var ring = new THREE.Mesh(ringG, lime);
        ring.position.x = p[0] > 0 ? 0.02 : -0.02;
        piv.add(ring);
        piv.add(new THREE.Mesh(hubG, chrome));
        for (var t = 0; t < 8; t++) {                              // 러그 트레드
          var lug = new THREE.Mesh(lugG, tyreM);
          lug.position.set(0, Math.cos(t / 8 * Math.PI * 2) * 0.66, Math.sin(t / 8 * Math.PI * 2) * 0.66);
          lug.rotation.x = -t / 8 * Math.PI * 2;
          piv.add(lug);
        }
        truck.add(piv);
        wheelPivots.push(piv);
      });

      // ---- 서스펜션 액슬
      tube(-1.06, 0.68, -1.46, 1.06, 0.68, -1.46, 0.085, trimM);
      tube(-1.06, 0.68, 1.52, 1.06, 0.68, 1.52, 0.085, trimM);

      truck.traverse(function (o) { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    })();
    scene.add(truck);

    // ------------------------------------------------ dust
    var puffTex = (function () {
      var cv = document.createElement('canvas'); cv.width = cv.height = 128;
      var g = cv.getContext('2d');
      var rg = g.createRadialGradient(64, 64, 0, 64, 64, 64);
      rg.addColorStop(0, 'rgba(255,255,255,0.9)');
      rg.addColorStop(0.45, 'rgba(255,255,255,0.35)');
      rg.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = rg; g.fillRect(0, 0, 128, 128);
      return new THREE.CanvasTexture(cv);
    })();
    var dustPool = [], dustLive = [];
    for (var d1 = 0; d1 < 150; d1++) {
      var sp = new THREE.Sprite(new THREE.SpriteMaterial({
        map: puffTex, transparent: true, depthWrite: false, opacity: 0
      }));
      sp.visible = false; scene.add(sp);
      dustPool.push({ sp: sp, life: 0, max: 1, vy: 0, gs: 1 });
    }
    var DUST_J = sc(0x6b5a3e), DUST_D = sc(0xdcc190);
    function emitDust(x, y, z, power, bio) {
      if (!dustPool.length) return;
      var p = dustPool.pop();
      p.sp.position.set(x + (Math.random() - 0.5) * 1.2, y + 0.25, z + (Math.random() - 0.5) * 1.2);
      p.max = 0.8 + Math.random() * 0.9; p.life = p.max;
      p.vy = 1.0 + Math.random() * 2.0;
      p.gs = (1.2 + Math.random() * 1.6) * power;
      p.sp.scale.set(p.gs, p.gs, 1);
      p.sp.material.color.copy(DUST_J).lerp(DUST_D, bio);
      p.sp.material.opacity = (0.20 + 0.35 * bio) * clamp(power, 0.25, 1);
      p.sp.visible = true;
      dustLive.push(p);
    }

    // ------------------------------------------------ vehicle state
    var carX = TP[0].x, carZ = TP[0].z, carY = TP[0].y + 0.7;
    var heading = Math.atan2(-TP[0].tx, -TP[0].tz);
    var vel = new THREE.Vector2(0, 0);
    var vy = 0, steer = 0, lowGear = false;
    var grounded = true, airborne = false, impact = 0, shake = 0;
    var bodyPitch = 0, bodyRoll = 0, susPitch = 0, susRoll = 0;
    var wheelSpin = 0, distTravel = 0, topSpd = 0, camMode = 0;
    var RIDE = 0.72, MAXSPD = 32;

    function resetCar() {
      var n = nearTrail(carX, carZ);
      var p = TP[n ? n.i : 0];
      carX = p.x; carZ = p.z; carY = p.y + 1.2;
      heading = Math.atan2(-p.tx, -p.tz);
      vel.set(0, 0); vy = 0; bodyPitch = 0; bodyRoll = 0;
    }

    // ------------------------------------------------ input
    var keys = {}, helpOn = true, helpTimer = 13, postOn = true;
    var helpEl = document.getElementById('help');
    window.addEventListener('keydown', function (e) {
      keys[e.code] = true;
      if (e.code === 'KeyH') { helpOn = !helpOn; helpEl.classList.toggle('dim', !helpOn); helpTimer = 13; }
      if (e.code === 'KeyR') resetCar();
      if (e.code === 'KeyC') camMode = (camMode + 1) % 3;
      if (e.code === 'KeyP') {
        postOn = !postOn;
        renderer.shadowMap.enabled = postOn;
        scene.traverse(function (o) { if (o.material) o.material.needsUpdate = true; });
      }
      if (e.code === 'Space') e.preventDefault();
    });
    window.addEventListener('keyup', function (e) { keys[e.code] = false; });
    window.addEventListener('contextmenu', function (e) { e.preventDefault(); });

    // ------------------------------------------------ post chain
    var rtScene = new THREE.WebGLRenderTarget(2, 2, {
      minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
      format: THREE.RGBAFormat, depthBuffer: true, stencilBuffer: false
    });
    var rtA = new THREE.WebGLRenderTarget(2, 2, {
      minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
      format: THREE.RGBAFormat, depthBuffer: false, stencilBuffer: false
    });
    var rtB = rtA.clone();
    var PVS = 'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.0,1.0);}';
    var brightMat = new THREE.ShaderMaterial({
      uniforms: { tDiffuse: { value: null }, threshold: { value: 0.76 } },
      vertexShader: PVS,
      fragmentShader: [
        'uniform sampler2D tDiffuse;uniform float threshold;varying vec2 vUv;',
        'void main(){vec3 c=texture2D(tDiffuse,vUv).rgb;',
        'float l=dot(c,vec3(0.2126,0.7152,0.0722));',
        'gl_FragColor=vec4(c*max(l-threshold,0.0)/max(l,0.0001),1.0);}'
      ].join('\n')
    });
    var blurMat = new THREE.ShaderMaterial({
      uniforms: { tDiffuse: { value: null }, dir: { value: new THREE.Vector2() }, res: { value: new THREE.Vector2(1, 1) } },
      vertexShader: PVS,
      fragmentShader: [
        'uniform sampler2D tDiffuse;uniform vec2 dir;uniform vec2 res;varying vec2 vUv;',
        'void main(){vec2 t=dir/res;vec3 s=texture2D(tDiffuse,vUv).rgb*0.227027;',
        's+=(texture2D(tDiffuse,vUv+t*1.3846).rgb+texture2D(tDiffuse,vUv-t*1.3846).rgb)*0.316216;',
        's+=(texture2D(tDiffuse,vUv+t*3.2307).rgb+texture2D(tDiffuse,vUv-t*3.2307).rgb)*0.070270;',
        'gl_FragColor=vec4(s,1.0);}'
      ].join('\n')
    });
    var compMat = new THREE.ShaderMaterial({
      uniforms: {
        tScene: { value: null }, tBloom: { value: null },
        bloomAmt: { value: 0.36 }, vigAmt: { value: 0.36 },
        grainAmt: { value: 0.016 }, aberrAmt: { value: 0.0018 },
        speedAmt: { value: 0.0 }, tSeed: { value: 0 }
      },
      vertexShader: PVS,
      fragmentShader: [
        'uniform sampler2D tScene;uniform sampler2D tBloom;',
        'uniform float bloomAmt;uniform float vigAmt;uniform float grainAmt;',
        'uniform float aberrAmt;uniform float speedAmt;uniform float tSeed;',
        'varying vec2 vUv;',
        'void main(){',
        '  vec2 d=vUv-0.5;float r2=dot(d,d);',
        '  vec2 off=d*aberrAmt*(0.35+r2*3.0);',
        '  vec3 c;',
        '  c.r=texture2D(tScene,vUv+off).r;',
        '  c.g=texture2D(tScene,vUv).g;',
        '  c.b=texture2D(tScene,vUv-off).b;',
        '  vec3 rb=vec3(0.0);',
        '  for(int i=1;i<=4;i++){float f=float(i)/4.0;rb+=texture2D(tScene,vUv-d*f*speedAmt).rgb;}',
        '  c=mix(c,rb*0.25,clamp(speedAmt*7.0,0.0,0.55));',
        '  c+=texture2D(tBloom,vUv).rgb*bloomAmt;',
        '  gl_FragColor=vec4(max(c,0.0),1.0);',
        '  #include <encodings_fragment>',
        '  gl_FragColor.rgb*=1.0-vigAmt*smoothstep(0.09,0.60,r2);',
        '  float n=fract(sin(dot(vUv*vec2(tSeed+1.3,tSeed+2.7),vec2(12.9898,78.233)))*43758.5453);',
        '  gl_FragColor.rgb+=(n-0.5)*grainAmt;',
        '}'
      ].join('\n')
    });
    var postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    var postScene = new THREE.Scene();
    var postQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), brightMat);
    postQuad.frustumCulled = false;
    postScene.add(postQuad);
    function pass(m, t) { postQuad.material = m; renderer.setRenderTarget(t); renderer.render(postScene, postCam); }

    // ------------------------------------------------ UI
    var uiCanvas = document.getElementById('ui');
    var ux = uiCanvas.getContext('2d');
    var L = null;
    function mono(s, w) { return (w || '') + ' ' + s + 'px Consolas,"Courier New",monospace'; }
    function rr(ctx, x, y, w, h, r) {
      r = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function onResize() {
      var w = window.innerWidth, h = window.innerHeight;
      camera.aspect = w / h; camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var W = Math.round(w * dpr), H = Math.round(h * dpr);
      var S = Math.max(W / 1600, H / 900);
      L = { W: W, H: H, S: S, vw: W / S, vh: H / S };
      L.l = 800 - L.vw / 2; L.r = 800 + L.vw / 2;
      L.t = 450 - L.vh / 2; L.b = 450 + L.vh / 2;
      L.narrow = L.vw < 1000;
      uiCanvas.width = W; uiCanvas.height = H;
      var pr = renderer.getPixelRatio();
      var pw = Math.max(2, Math.floor(w * pr)), ph = Math.max(2, Math.floor(h * pr));
      rtScene.setSize(pw, ph);
      rtA.setSize(Math.max(2, pw >> 1), Math.max(2, ph >> 1));
      rtB.setSize(Math.max(2, pw >> 1), Math.max(2, ph >> 1));
      blurMat.uniforms.res.value.set(Math.max(2, pw >> 1), Math.max(2, ph >> 1));
    }
    window.addEventListener('resize', onResize);
    onResize();
    function setTx(c) { c.setTransform(L.S, 0, 0, L.S, L.W / 2 - 800 * L.S, L.H / 2 - 450 * L.S); }

    // ------------------------------------------------ loop
    var last = performance.now();
    var camPos = new THREE.Vector3(carX, carY + 6, carZ + 12);
    var camYaw = heading;
    var dustClock = 0, tilt = 0;
    var bootEl = document.getElementById('boot');
    setTimeout(function () { bootEl.classList.add('done'); }, 700);

    function animate() {
      requestAnimationFrame(animate);
      var now = performance.now();
      var dt = Math.min((now - last) / 1000, 0.04);
      last = now;
      if (helpOn && helpTimer > 0) { helpTimer -= dt; if (helpTimer <= 0) helpEl.classList.add('dim'); }

      var throttle = keys['KeyW'] ? 1 : 0;
      var brake = keys['KeyS'] ? 1 : 0;
      var hand = keys['Space'] ? 1 : 0;
      lowGear = !!(keys['ShiftLeft'] || keys['ShiftRight']);
      var steerT = (keys['KeyA'] ? 1 : 0) - (keys['KeyD'] ? 1 : 0);
      steer = lerp(steer, steerT, dt * 8);

      var fwd = new THREE.Vector2(-Math.sin(heading), -Math.cos(heading));
      var side = new THREE.Vector2(Math.cos(heading), -Math.sin(heading));
      var vf = vel.x * fwd.x + vel.y * fwd.y;
      var vs = vel.x * side.x + vel.y * side.y;

      var nt = nearTrail(carX, carZ);
      var offDist = nt ? Math.max(0, nt.d - TRAIL_H) : 60;
      var offTrail = offDist > 0.5;
      var bio = biomeXZ(carX, carZ);

      var power = (lowGear ? 19.0 : 14.5);
      var fade = 1 - clamp(Math.abs(vf) / (lowGear ? MAXSPD * 0.55 : MAXSPD), 0, 1) * 0.85;
      vf += throttle * power * fade * dt;
      if (brake) vf -= (vf > 0 ? 20 : 9) * dt;
      vf -= vf * 0.26 * dt;

      var gx = (terrainH(carX + 3, carZ) - terrainH(carX - 3, carZ)) / 6;
      var gz = (terrainH(carX, carZ + 3) - terrainH(carX, carZ - 3)) / 6;
      var slopeAlong = clamp(gx * fwd.x + gz * fwd.y, -0.6, 0.6);
      vf -= slopeAlong * (lowGear ? 9 : 13) * dt;

      if (offTrail) vf -= vf * 0.30 * dt * clamp(offDist / 22, 0, 1);
      var roll = (throttle || brake ? 1.3 : 3.4) * dt;
      if (Math.abs(vf) < roll) vf = 0; else vf -= (vf > 0 ? roll : -roll);
      vf = clamp(vf, -9, lowGear ? MAXSPD * 0.55 : MAXSPD);

      var grip = hand ? 1.4 : (airborne ? 0.2 : 5.2 * (offTrail ? 0.72 : 1));
      var auth = clamp(1.4 - Math.abs(vf) / MAXSPD * 0.7, 0.4, 1.4);
      heading += steer * auth * clamp(Math.abs(vf) / 5, 0, 1) * 1.5 * dt * (vf < 0 ? -1 : 1);
      vs += -steer * Math.abs(vf) * 0.85 * dt;
      vs *= Math.exp(-grip * dt);

      vel.set(fwd.x * vf + side.x * vs, fwd.y * vf + side.y * vs);
      carX += vel.x * dt; carZ += vel.y * dt;
      distTravel += Math.abs(vf) * dt;
      if (Math.abs(vf) > topSpd) topSpd = Math.abs(vf);

      if (carX > WORLD / 2) carX -= WORLD;
      if (carX < -WORLD / 2) carX += WORLD;
      if (carZ > WORLD / 2) carZ -= WORLD;
      if (carZ < -WORLD / 2) carZ += WORLD;

      var ground = terrainH(carX, carZ);
      vy -= 24 * dt; carY += vy * dt;
      var rest = ground + RIDE;
      if (carY <= rest) {
        if (vy < -6) { impact = clamp(-vy / 20, 0, 1); shake = Math.max(shake, impact); }
        carY = rest; vy = 0; airborne = false; grounded = true;
      } else {
        airborne = carY > rest + 0.4;
        if (!airborne) { carY = lerp(carY, rest, clamp(dt * 15, 0, 1)); vy = 0; }
      }

      // four-corner attitude
      var WB = 1.5, TR = 1.05;
      var fx = -Math.sin(heading), fz = -Math.cos(heading);
      var rx = Math.cos(heading), rz = -Math.sin(heading);
      function at(f, s2) { return terrainH(carX + fx * f + rx * s2, carZ + fz * f + rz * s2); }
      var hFL = at(WB, -TR), hFR = at(WB, TR), hRL = at(-WB, -TR), hRR = at(-WB, TR);
      var tp = Math.atan2(((hFL + hFR) - (hRL + hRR)) / 2, 2 * WB);
      var tr = Math.atan2(((hFR + hRR) - (hFL + hRL)) / 2, 2 * TR);
      if (airborne) { tp *= 0.25; tr *= 0.25; }
      bodyPitch = lerp(bodyPitch, tp, clamp(dt * 7, 0, 1));
      bodyRoll = lerp(bodyRoll, tr, clamp(dt * 7, 0, 1));
      susPitch = lerp(susPitch, -(throttle - brake) * 0.04 + impact * 0.09, clamp(dt * 6, 0, 1));
      susRoll = lerp(susRoll, -vs * 0.013, clamp(dt * 6, 0, 1));
      impact = Math.max(0, impact - dt * 2.2);
      tilt = Math.abs(bodyRoll);

      truck.position.set(carX, carY, carZ);
      truck.rotation.set(bodyPitch + susPitch, heading, bodyRoll + susRoll, 'YXZ');

      wheelSpin += vf * dt / 0.62;
      for (var w = 0; w < wheelPivots.length; w++) {
        wheelPivots[w].rotation.x = wheelSpin;
        if (w < 2) wheelPivots[w].rotation.y = steer * 0.42;
      }

      // dust
      dustClock -= dt;
      var spd = Math.abs(vf);
      if (!airborne && spd > 2.5 && dustClock <= 0) {
        dustClock = 0.05;
        var pw2 = clamp(spd / 16, 0.2, 1.1) * (offTrail ? 1.15 : 0.85);
        emitDust(carX - fx * 1.5 - rx * 1.0, ground, carZ - fz * 1.5 - rz * 1.0, pw2, bio);
        emitDust(carX - fx * 1.5 + rx * 1.0, ground, carZ - fz * 1.5 + rz * 1.0, pw2, bio);
      }
      for (var di = dustLive.length - 1; di >= 0; di--) {
        var pu = dustLive[di];
        pu.life -= dt;
        pu.sp.position.y += pu.vy * dt;
        pu.gs += 5.5 * dt;
        pu.sp.scale.set(pu.gs, pu.gs, 1);
        pu.sp.material.opacity = clamp(pu.life / pu.max, 0, 1) * (0.20 + 0.35 * bio);
        if (pu.life <= 0) { pu.sp.visible = false; dustLive.splice(di, 1); dustPool.push(pu); }
      }

      // biome-driven atmosphere
      var fogJ = new THREE.Color(0x9fb59a), fogD = new THREE.Color(0xe0cda4);
      fog.color.copy(fogJ).lerp(fogD, bio);
      fog.density = lerp(0.0013, 0.00062, bio);
      skyMat.uniforms.bot.value.setRGB(
        lerp(0.79, 0.93, bio), lerp(0.80, 0.84, bio), lerp(0.66, 0.66, bio));

      // third-person camera
      shake = Math.max(0, shake - dt * 2.2);
      var targetYaw = spd > 3 ? Math.atan2(-vel.x, -vel.y) : heading;
      var dy = ((targetYaw - camYaw + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
      camYaw += dy * clamp(dt * 2.4, 0, 1);

      var rig = [
        { back: 8.5, up: 3.4, look: 1.4 },
        { back: 15.0, up: 6.4, look: 1.8 },
        { back: -2.6, up: 2.05, look: 1.9 }
      ][camMode];
      var rigYaw = camMode === 2 ? heading : camYaw;
      var desired = new THREE.Vector3(
        carX + Math.sin(rigYaw) * rig.back,
        carY + rig.up + (camMode === 2 ? 0 : clamp(spd * 0.05, 0, 1.6)),
        carZ + Math.cos(rigYaw) * rig.back
      );
      if (camMode !== 2) {
        var camGround = terrainH(desired.x, desired.z) + 1.6;
        if (desired.y < camGround) desired.y = camGround;
      }
      camPos.lerp(desired, clamp(dt * (camMode === 2 ? 22 : 5.5), 0, 1));
      camera.position.copy(camPos);
      camera.position.x += (Math.random() - 0.5) * shake * 1.1;
      camera.position.y += (Math.random() - 0.5) * shake * 1.1;
      camera.lookAt(carX - Math.sin(heading) * (camMode === 2 ? 14 : 3),
                    carY + rig.look, carZ - Math.cos(heading) * (camMode === 2 ? 14 : 3));
      camera.fov = lerp(camera.fov, FOV + clamp(spd * 0.42, 0, 12), clamp(dt * 3, 0, 1));
      camera.updateProjectionMatrix();

      sky.position.set(carX, carY, carZ);
      sun.position.set(carX - 180, 230, carZ + 140);
      sun.target.position.set(carX, carY * 0.4, carZ);
      sun.target.updateMatrixWorld();

      // render
      renderer.setRenderTarget(postOn ? rtScene : null);
      renderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
      renderer.clear(true, true, false);
      renderer.render(scene, camera);
      if (postOn) {
        compMat.uniforms.speedAmt.value = clamp((spd - 10) / 380, 0, 0.045);
        brightMat.uniforms.tDiffuse.value = rtScene.texture;
        pass(brightMat, rtA);
        blurMat.uniforms.tDiffuse.value = rtA.texture;
        blurMat.uniforms.dir.value.set(1, 0); pass(blurMat, rtB);
        blurMat.uniforms.tDiffuse.value = rtB.texture;
        blurMat.uniforms.dir.value.set(0, 1); pass(blurMat, rtA);
        compMat.uniforms.tScene.value = rtScene.texture;
        compMat.uniforms.tBloom.value = rtA.texture;
        compMat.uniforms.tSeed.value = (now % 10000) / 900;
        pass(compMat, null);
      }

      // ---------------- HUD
      ux.setTransform(1, 0, 0, 1, 0, 0);
      ux.clearRect(0, 0, L.W, L.H);
      setTx(ux);

      var kph = Math.round(spd * 3.6);
      var panelW = L.narrow ? 210 : 244;
      var px = L.l + 24, py = L.b - 150;
      ux.fillStyle = 'rgba(10,14,11,.58)';
      rr(ux, px - 12, py - 28, panelW, 138, 8); ux.fill();
      ux.strokeStyle = 'rgba(255,194,74,.26)'; ux.lineWidth = 1; ux.stroke();

      ux.textAlign = 'left';
      ux.fillStyle = '#ffc24a'; ux.font = mono(11, 'bold');
      ux.fillText('TRAIL STATUS', px, py - 12);
      ux.fillStyle = '#f2ecdd'; ux.font = mono(34, 'bold');
      ux.fillText(String(kph), px, py + 26);
      ux.fillStyle = 'rgba(242,236,221,.5)'; ux.font = mono(11, 'bold');
      ux.fillText('KM/H', px + 78, py + 26);

      ux.fillStyle = '#f2ecdd'; ux.font = mono(14, 'bold');
      ux.fillText('DIST  ' + (distTravel / 1000).toFixed(2) + ' km', px, py + 52);
      ux.fillStyle = lowGear ? '#7fe08a' : 'rgba(242,236,221,.5)';
      ux.fillText(lowGear ? 'GEAR  LOW 4L' : 'GEAR  HIGH 4H', px, py + 74);
      ux.fillStyle = offTrail ? '#ff7a3c' : '#7fe08a';
      ux.fillText(offTrail ? 'OFF TRAIL ' + Math.round(offDist) + 'm' : 'ON TRAIL', px, py + 96);

      // incline + roll gauge
      var gx2 = px + panelW - 66, gy2 = py + 44;
      ux.strokeStyle = 'rgba(255,194,74,.4)'; ux.lineWidth = 1.4;
      ux.beginPath(); ux.arc(gx2, gy2, 26, 0, 7); ux.stroke();
      ux.save();
      ux.translate(gx2, gy2); ux.rotate(-(bodyRoll + susRoll));
      ux.strokeStyle = tilt > 0.5 ? '#ff4a3c' : '#7fe08a'; ux.lineWidth = 2.4;
      ux.beginPath(); ux.moveTo(-19, 0); ux.lineTo(19, 0); ux.stroke();
      ux.restore();
      ux.fillStyle = 'rgba(242,236,221,.5)'; ux.font = mono(9, 'bold'); ux.textAlign = 'center';
      ux.fillText('TILT ' + Math.round(tilt / DEG) + '\u00B0', gx2, gy2 + 40);

      // biome banner
      ux.textAlign = 'right';
      ux.font = mono(12, 'bold');
      ux.fillStyle = bio < 0.5 ? '#7fe08a' : '#ffc24a';
      ux.fillText(bio < 0.35 ? 'BIOME  JUNGLE' : (bio > 0.65 ? 'BIOME  DESERT' : 'BIOME  TRANSITION'),
        L.r - 26, L.t + (L.narrow ? 300 : 34));
      ux.fillStyle = 'rgba(242,236,221,.45)'; ux.font = mono(11, 'bold');
      ux.fillText(['CAM  CHASE', 'CAM  WIDE', 'CAM  HOOD'][camMode], L.r - 26, L.t + (L.narrow ? 318 : 52));
      ux.fillText('TOP ' + Math.round(topSpd * 3.6) + ' KM/H', L.r - 26, L.t + (L.narrow ? 336 : 70));

      // mini map
      var mr = L.narrow ? 52 : 68;
      var mx = L.r - 26 - mr, my = L.b - 26 - mr;
      ux.fillStyle = 'rgba(10,14,11,.5)';
      ux.beginPath(); ux.arc(mx, my, mr, 0, 7); ux.fill();
      ux.strokeStyle = 'rgba(255,194,74,.3)'; ux.lineWidth = 1; ux.stroke();
      ux.save();
      ux.beginPath(); ux.arc(mx, my, mr - 2, 0, 7); ux.clip();
      var msc = (mr - 8) / 1150;
      ux.strokeStyle = 'rgba(255,194,74,.75)'; ux.lineWidth = 1.6;
      ux.beginPath();
      for (var k2 = 0; k2 <= 90; k2++) {
        var q2 = TP[Math.floor(k2 / 90 * NT) % NT];
        var qx = mx + q2.x * msc, qy = my + q2.z * msc;
        if (k2 === 0) ux.moveTo(qx, qy); else ux.lineTo(qx, qy);
      }
      ux.closePath(); ux.stroke();
      ux.fillStyle = '#7fe08a';
      ux.beginPath(); ux.arc(mx + carX * msc, my + carZ * msc, 3.4, 0, 7); ux.fill();
      ux.restore();

      ux.setTransform(1, 0, 0, 1, 0, 0);
    }

    animate();
  }
})();
</script>
</body>
</html>
