/* ================= 우주 배경 + 픽셀 효과 (BULLET HELL 삽입용) ================= */
const BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];  /* 4x4 베이어 디더 */
const mkC=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.imageSmoothingEnabled=false;return c};
/* y축으로 끊김 없이 반복되는 주기 노이즈 */
function pn(i,j,sd){
  const u=i/W*TAU,v=j/H*TAU;let s=0,a=1,n=0;
  for(let o=1;o<=3;o++){
    s+=a*M.sin(v*o+sd+1.7*M.sin(u*(o+1)+sd*.7))*M.cos(u*(o+1)+sd*1.9+1.3*M.sin(v*(o+2)+sd));
    n+=a;a*=.6;
  }
  return (s/n+1)/2;
}
/* 성운 가스: 4단계 색으로 양자화 + 디더링 → 완전한 픽셀 질감 */
function mkNebula(sd,cols,dens){
  const c=mkC(W,H),x=c.getContext('2d'),id=x.createImageData(W,H),d=id.data;
  for(let j=0;j<H;j++)for(let i=0;i<W;i++){
    let v=pn(i,j,sd);v=M.pow(v,2.2)*(dens||3.4);
    const lv=v-BAY[(j&3)*4+(i&3)]/16*.9;
    const ci=lv>2.45?3:lv>1.7?2:lv>1.0?1:lv>.42?0:-1;
    if(ci<0)continue;
    const col=cols[ci],o=(j*W+i)<<2;
    d[o]=col[0];d[o+1]=col[1];d[o+2]=col[2];d[o+3]=255;
  }
  x.putImageData(id,0,0);return c;
}
/* 별밭 한 겹 */
function mkStars(n,sd,pal,big){
  const c=mkC(W,H),x=c.getContext('2d');
  for(let i=0;i<n;i++){
    const px=hs(i*1.7+sd)*W|0,py=hs(i*3.1+sd*2)*H|0,q=hs(i*5.3+sd);
    x.fillStyle=pal[(q*pal.length)|0];
    if(big&&q>.93){x.fillRect(px,py,1,3);x.fillRect(px-1,py+1,3,1)}
    else x.fillRect(px,py,q>.8?2:1,q>.8?2:1);
  }
  return c;
}
/* 행성 스프라이트: 디더 음영 + 띠/크레이터 + 고리 */
function mkPlanet(r,pal,kind,sd){
  const s=r*2+(kind==2?r*2.2:4)|0,c=mkC(s,s),x=c.getContext('2d'),
        bd=mkC(s,s),bx=bd.getContext('2d'),
        cx=s>>1,cy=s>>1,id=bx.createImageData(s,s),d=id.data;
  for(let j=0;j<s;j++)for(let i=0;i<s;i++){
    const dx=i-cx,dy=j-cy,q=M.sqrt(dx*dx+dy*dy);
    if(q>r)continue;
    const nx=dx/r,ny=dy/r,nz=M.sqrt(M.max(0,1-nx*nx-ny*ny));
    let li=-nx*.45-ny*.45+nz*.80;                        /* 좌상단 광원 (정규화된 구면 법선) */
    if(kind==0)li+=M.sin(ny*5.5+sd)*.13;                 /* 가스 행성 띠 */
    if(kind==1){                                          /* 바위 행성 크레이터 */
      for(let k=0;k<5;k++){
        const ax=(hs(k+sd)*1.5-.75)*r,ay=(hs(k+sd+9)*1.5-.75)*r,ar=r*(.12+hs(k+sd+3)*.17);
        if((dx-ax)**2+(dy-ay)**2<ar*ar)li+=((dx-ax)+(dy-ay))>0?.16:-.18;
      }
    }
    li+=pn(i*3,j*3,sd)*.2-.1;
    const lv=(li+.35)*2.9-BAY[(j&3)*4+(i&3)]/16*.8;
    const ci=cl(lv>3.0?3:lv>2.1?2:lv>1.2?1:0,0,3);
    const col=pal[ci],o=(j*s+i)<<2;
    d[o]=col[0];d[o+1]=col[1];d[o+2]=col[2];d[o+3]=255;
  }
  bx.putImageData(id,0,0);
  /* 고리는 뒤쪽 반 → 본체 → 앞쪽 반 순서로 합성 (픽셀 점으로 직접 찍는다) */
  const ring=(a0,a1)=>{
    for(let k=0;k<3;k++){
      const rr=r*(1.34+k*.2),col=['#e2c896','#aa8c64','#f0deb4'][k],th=k==1?2:1;
      x.fillStyle=col;
      for(let q=0;q<150;q++){
        const a=a0+(a1-a0)*q/149;
        x.fillRect(cx+M.cos(a)*rr|0,cy+M.sin(a)*rr*.26|0,th,1);
      }
    }
  };
  if(kind==2){ring(M.PI,TAU);x.drawImage(bd,0,0);ring(0,M.PI)}
  else x.drawImage(bd,0,0);
  return c;
}
/* 운석: 회전 프레임을 미리 구움 */
function mkRock(sd,rot,size){
  const s=size*2+2|0,c=mkC(s,s),x=c.getContext('2d'),m=s>>1,
        id=x.createImageData(s,s),d=id.data;
  for(let j=0;j<s;j++)for(let i=0;i<s;i++){
    const dx=i-m,dy=j-m,q=M.sqrt(dx*dx+dy*dy),a=M.atan2(dy,dx)+rot;
    const rr=size*(.68+.3*(M.sin(a*3+sd)*.5+M.sin(a*5+sd*2)*.3+.8)/1.6);
    if(q>rr)continue;
    let li=(-dx*.6-dy*.6)/size+.45;
    for(let k=0;k<3;k++){
      const ax=M.cos(sd+k*2.3+rot)*size*.42,ay=M.sin(sd+k*1.7+rot)*size*.42,ar=size*.24;
      if((dx-ax)**2+(dy-ay)**2<ar*ar)li-=.26;
    }
    const lv=li*3.4-BAY[(j&3)*4+(i&3)]/16*.75;
    const pal=[[46,38,44],[84,70,74],[128,110,106],[176,160,150]];
    const col=pal[cl(lv>2.5?3:lv>1.6?2:lv>.8?1:0,0,3)],o=(j*s+i)<<2;
    d[o]=col[0];d[o+1]=col[1];d[o+2]=col[2];d[o+3]=255;
  }
  x.putImageData(id,0,0);return c;
}
/* 스캔라인 · 비네트 (픽셀 디더) */
function mkScan(){const c=mkC(W,H),x=c.getContext('2d');x.fillStyle='rgba(0,0,0,.22)';
  for(let j=1;j<H;j+=2)x.fillRect(0,j,W,1);return c}
function mkVig(){
  const c=mkC(W,H),x=c.getContext('2d'),id=x.createImageData(W,H),d=id.data,cx=W/2,cy=H/2,mx=M.sqrt(cx*cx+cy*cy);
  for(let j=0;j<H;j++)for(let i=0;i<W;i++){
    const q=M.sqrt((i-cx)**2+(j-cy)**2)/mx,v=M.max(0,(q-.48)/.52);
    const lv=v*4-BAY[(j&3)*4+(i&3)]/16;
    if(lv<=.3)continue;
    const o=(j*W+i)<<2;d[o]=2;d[o+1]=1;d[o+2]=8;
    d[o+3]=cl(lv>3?210:lv>2?150:lv>1?92:44,0,255);
  }
  x.putImageData(id,0,0);return c;
}

/* ---------- 낙하 오브젝트 ---------- */
let sky=[],skyStage=-1,lastScroll=0;
function seedSky(){
  skyStage=stage;sky=[];

  for(let i=0;i<N;i++)sky.push(newSkyObj(i,1));

function newSkyObj(i,init){
  const r=rnd();

  if(r<(stage==2?.3:.14))return{k:1,p:(rnd()*4)|0,x:10+rnd()*(W-20),y:init?rnd()*H:-70,v:5+rnd()*9,sp:0};
  return{k:0,t:(rnd()*4)|0,x:-10+rnd()*(W+20),y:init?rnd()*H:-20,
         v:26+rnd()*70,dx:(rnd()-.5)*26,f:rnd()*6,fs:2+rnd()*7,sp:0};

function updSky(dt){
  for(let i=sky.length-1;i>=0;i--){
    const o=sky[i];
    if(o.k){o.y+=o.v*dt}
    else{
      o.y+=o.v*dt;o.x+=o.dx*dt;o.f+=o.fs*dt;
      if(stage==1){                                        /* 블랙홀로 빨려 들어감 */
        const bx=W/2,by=118,ex=bx-o.x,ey=by-o.y,q=M.max(26,M.hypot(ex,ey));
        o.x+=ex/q*1400/q*dt;o.y+=ey/q*1400/q*dt;

      }
      if(o.v>46&&rnd()<.5)trail(o.x,o.y,-o.dx*.3,-o.v*.42);  /* 운석 불꽃 꼬리 */
    }
    if(o.y>H+80||o.x<-70||o.x>W+70)sky[i]=newSkyObj(i,0);

/* 운석 꼬리: 게임 파티클과 분리된 전용 버퍼 (메뉴에서도 보이게) */
const TR=Array.from({length:140},()=>({l:0,x:0,y:0,vx:0,vy:0,c:'#f84',z:1}));let tri=0;
function trail(x,y,vx,vy){const t=TR[tri=(tri+1)%140];
  t.x=x;t.y=y;t.vx=vx;t.vy=vy;t.l=t.m=.28+rnd()*.34;
  t.c=rnd()<.42?'#fff2a8':rnd()<.6?'#ff9a3c':'#e8503c';t.z=rnd()<.3?2:1}
function drawTrail(dt){
  g.globalCompositeOperation='lighter';
  for(const t of TR)if(t.l>0){
    t.l-=dt;t.x+=t.vx*dt;t.y+=t.vy*dt;t.vx*=.94;t.vy*=.94;
    g.globalAlpha=cl(t.l/t.m,0,1);g.fillStyle=t.c;g.fillRect(t.x|0,t.y|0,t.z,t.z);
  }
  g.globalAlpha=1;g.globalCompositeOperation='source-over';
}
/* ---------- 블랙홀 · 은하 ---------- */
function blackHole(cx,cy,t){
  const R=17;
  for(let k=0;k<3;k++){                                    /* 강착원반 */
    const rr=R+5+k*5;
    for(let i=0;i<38;i++){
      const a=i/38*TAU+t*(1.5-k*.35),px=cx+M.cos(a)*rr|0,py=cy+M.sin(a)*rr*.30|0;
      const front=M.sin(a)>0,dop=M.cos(a)<0;                /* 도플러 증광 */
      g.fillStyle=dop?(k?'#ffd9a0':'#fff'):(k?'#c4600f':'#f2912a');
      if(!front)g.globalAlpha=.55;
      g.fillRect(px,py,front?2:1,front?2:1);g.globalAlpha=1;
    }
  }
  for(let i=0;i<30;i++){                                   /* 광자 고리 */
    const a=i/30*TAU;g.fillStyle=i%2?'#ffeab0':'#fff';
    g.fillRect(cx+M.cos(a)*(R+2)|0,cy+M.sin(a)*(R+2)|0,1,1);
  }
  g.fillStyle='#000';                                      /* 사건의 지평선 */
  for(let j=-R;j<=R;j++){const w=M.sqrt(R*R-j*j)|0;g.fillRect(cx-w,cy+j,w*2+1,1)}
  for(let i=0;i<22;i++){                                   /* 빨려드는 가스 줄기 */
    const a=t*.6+i*.285,q=R+8+((t*22+i*13)%46);
    g.fillStyle=q<R+18?'#ffd9a0':i%3?'#a24bd8':'#4aa8e8';
    g.fillRect(cx+M.cos(a)*q|0,cy+M.sin(a)*q*.45|0,1,1);
  }
}
function galaxy(cx,cy,t,sc){
  for(let i=0;i<300;i++){
    const q=hs(i)*1+.06,r=q*58*sc,arm=(i&1)?0:M.PI,
          a=r*.085+arm+t*.09+hs(i+7)*.5,
          px=cx+M.cos(a)*r|0,py=cy+M.sin(a)*r*.42|0;
    if(px<-4||px>W+4)continue;

    g.fillStyle=q<.16?'#fff8d0':b>.55?(i%3?'#9ad4ff':'#fff'):(i%4?'#6a7ad8':'#b07ad8');
    g.fillRect(px,py,q<.3?2:1,q<.3?2:1);
  }
  g.fillStyle='#fff';g.fillRect(cx-2,cy-1,4,2);g.fillRect(cx-1,cy-2,2,4);

  const s=px||(r>90?3:r>40?2:1);
  g.globalAlpha=al;g.fillStyle=col;
  let x=r|0,y=0,e=1-x;
  while(x>=y){
    g.fillRect(cx+x|0,cy+y|0,s,s);g.fillRect(cx+y|0,cy+x|0,s,s);
    g.fillRect(cx-x|0,cy+y|0,s,s);g.fillRect(cx-y|0,cy+x|0,s,s);
    g.fillRect(cx+x|0,cy-y|0,s,s);g.fillRect(cx+y|0,cy-x|0,s,s);
    g.fillRect(cx-x|0,cy-y|0,s,s);g.fillRect(cx-y|0,cy-x|0,s,s);
    y++;if(e<0)e+=2*y+1;else{x--;e+=2*(y-x)+1}
  }
  g.globalAlpha=1;
}
function pline(x0,y0,a,len,col,dash,sz){
  g.fillStyle=col;const cx=M.cos(a),cy=M.sin(a),st=dash||3;
  for(let q=0;q<len;q+=st){
    if(dash&&((q/st|0)&1))continue;
    const px=x0+cx*q|0,py=y0+cy*q|0;
    if(px<-4||px>W+4||py<-4||py>H+4)continue;
    g.fillRect(px,py,sz||1,sz||1);
  }
}

/* ============ 관리자 모드 (P) — 메뉴에는 표시하지 않음 ============ */
let aSel=1,aHit=[],aFl=0,god=false;
const AN=(l,get,set,mn,mx,st,fm)=>({k:'n',l,get,set,mn,mx,st,fm});
function aRows(){return[
 {k:'h',l:'PLAYER'},
 AN('LIVES',()=>lives,v=>lives=v,0,9,1,v=>''+v),
 AN('BOMBS',()=>bombs,v=>bombs=v,0,9,1,v=>''+v),
 AN('POWER',()=>pow,v=>pow=v,0,4,1,v=>'LV'+(v+1)),
 AN('WEAPON',()=>wep,v=>wep=v,0,2,1,v=>WN[v]),
 {k:'t',l:'INVINCIBLE',get:()=>god,set:v=>{god=v;if(v)P.inv=M.max(P.inv,1)}},
 {k:'h',l:'GAME'},
 AN('DIFFICULTY',()=>diff,v=>{diff=v;D=DF[v]},0,4,1,v=>DF[v].n),
 AN('STAGE',()=>stage,v=>stage=v,0,2,1,v=>(v+1)+'.'+SN[v].split(' ')[0]),
 AN('SCORE',()=>score,v=>score=M.max(0,v),0,99999999,10000,v=>''+v),
 {k:'h',l:'ACTIONS'},
 {k:'a',l:'GO TO STAGE',r:()=>{beginStage();S='play'}},
 {k:'a',l:'SPAWN BOSS',r:()=>{if(!boss){en=[];clearB(1);T=LEN;boss={x:120,y:-40,in:0,warn:1.2,ph:-1,hp:1,mhp:1,f:0,t:0,dead:0,em:[],bt:0};say('WARNING')}}},
 {k:'a',l:'NEXT PHASE',r:()=>{if(boss&&boss.in>=2&&boss.ph>=0&&!boss.dead&&boss.ph<D.ph.length-1)setPhase(boss.ph+1)}},
 {k:'a',l:'KILL BOSS',r:()=>{if(boss&&boss.in>=2&&!boss.dead){boss.ph=D.ph.length-1;boss.hp=0}}},
 {k:'a',l:'CLEAR ENEMIES',r:()=>{for(const e of en)boom(e.x,e.y,1);en=[]}},
 {k:'a',l:'CLEAR BULLETS',r:()=>{clearB(1);lasers.length=0}},
 {k:'a',l:'DROP ITEMS',r:()=>{for(let i=0;i<5;i++)items.push({x:40+i*40,y:-10-i*12,t:i%5})}},
 {k:'a',l:'MAX POWER',r:()=>{pow=4;bombs=6;lives=M.min(9,lives+1);P.inv=M.max(P.inv,2)}}
]}
function openAdm(){if(S!='play'&&S!='pause')return;S='adm';ptr=null;for(const k in K)K[k]=0;snd(760,.06,'square',.04,420)}
function closeAdm(){if(S!='adm')return;S='play';snd(420,.06,'square',.04,-200)}
function aMove(d){const r=aRows();let i=aSel;for(let n=0;n<r.length;n++){i=(i+d+r.length)%r.length;if(r[i].k!='h')break}aSel=i;snd(1200,.02,'square',.02)}
function aAdj(d){const r=aRows()[aSel];if(!r)return;
 if(r.k=='n'){r.set(cl(r.get()+r.st*d,r.mn,r.mx));snd(900,.025,'square',.025)}
 else if(r.k=='t'){r.set(!r.get());snd(1100,.05,'triangle',.03)}}
function aEnter(){const r=aRows()[aSel];if(!r)return;
 if(r.k=='a'){r.r();aFl=.3;snd(600,.1,'triangle',.05,400)}else aAdj(1)}
function aPtr(px,py){for(const h of aHit){if(py<h.y0||py>h.y1)continue;aSel=h.i;
 const r=aRows()[h.i];
 if(r.k=='a'){aEnter();return}
 if(px>=h.mx&&px<=h.mx+15){aAdj(-1);return}
 if(px>=h.px&&px<=h.px+15){aAdj(1);return}
 if(r.k=='t')aAdj(1);return}}
function drawAdm(){
 const R=aRows();aFl=M.max(0,aFl-.02);
 g.fillStyle='rgba(2,1,10,.86)';g.fillRect(0,0,W,H);
 const PX=8,PW=W-16,PY=24,PH=H-50;
 g.fillStyle='#0a0820';g.fillRect(PX,PY,PW,PH);
 g.fillStyle='#fd3';g.fillRect(PX,PY,PW,1);g.fillRect(PX,PY+PH-1,PW,1);
 g.fillRect(PX,PY,1,PH);g.fillRect(PX+PW-1,PY,1,PH);
 tx('ADMIN',PX+5,PY+4,'#fd3',10);
 tx('P/ESC CLOSE',PX+PW-5,PY+5,'#667',7,'right');
 g.fillStyle='#334';g.fillRect(PX+4,PY+16,PW-8,1);
 aHit=[];
 let y=PY+21;const MXB=PX+PW-50,PXB=PX+PW-20;
 for(let i=0;i<R.length;i++){
  const r=R[i],sl=i==aSel;
  if(r.k=='h'){tx(r.l,PX+5,y+2,'#5cf',7);g.fillStyle='#1b2a44';g.fillRect(PX+5+r.l.length*5,y+5,PW-12-r.l.length*5,1);y+=11;continue}
  if(sl){g.fillStyle='#23203f';g.fillRect(PX+3,y-1,PW-6,11);g.fillStyle='#fd3';g.fillRect(PX+3,y-1,1,11)}
  tx(r.l,PX+7,y,sl?'#fff':'#9ab',7);
  if(r.k=='a'){
   g.fillStyle=sl?(aFl>0?'#5f8':'#fd3'):'#2a2a46';g.fillRect(PXB-14,y-1,30,10);
   tx('RUN',PXB+1,y,sl?'#000':'#889',7,'center');
   aHit.push({i,y0:y-1,y1:y+10,mx:-99,px:-99});
  }else{
   for(const[bx,lb,on]of[[MXB,'-',r.k=='n'?r.get()>r.mn:1],[PXB,'+',r.k=='n'?r.get()<r.mx:1]]){
    g.fillStyle=sl?(on?'#fd3':'#5a4a1a'):'#2a2a46';g.fillRect(bx,y-1,15,10);
    tx(lb,bx+7,y,sl&&on?'#000':'#889',8,'center');
   }
   const v=r.k=='t'?(r.get()?'ON':'OFF'):r.fm(r.get());
   tx(v,MXB-5,y,r.k=='t'?(r.get()?'#5f8':'#667'):'#fe8',7,'right');
   aHit.push({i,y0:y-1,y1:y+10,mx:MXB,px:PXB});
  }
  y+=11;
 }
 tx('UP/DOWN SELECT   LEFT/RIGHT ADJUST   ENTER RUN',W/2,PY+PH-16,'#667',6,'center');
 tx('SEYOUNG CODING LAB   Dr. KIM',W/2,PY+PH-8,'#445',6,'center');
}

/* ---------- render ---------- */
function tx(s,x,y,c,sz,al){g.font='bold '+(sz||8)+'px monospace';g.textAlign=al||'left';g.fillStyle=c||'#fff';g.fillText(s,x,y)}
function drawBoss(b){const x=b.x|0,y=b.y|0,C=BCOL[stage],f=b.f>0;const c=i=>f?'#fff':C[i];
g.fillStyle=c(0);g.fillRect(x-30,y-4,60,6);g.fillStyle=c(1);g.fillRect(x-30,y-8,6,14);g.fillRect(x+24,y-8,6,14);g.fillRect(x-16,y-14,32,26);g.fillStyle=c(0);g.fillRect(x-12,y-10,24,18);g.fillStyle=c(2);g.fillRect(x-22,y+6,4,8);g.fillRect(x+18,y+6,4,8);g.fillRect(x-10,y-12,20,2);
g.fillStyle=(b.t*6|0)%2?'#fff':DCOL[4];g.fillRect(x-4,y-4,8,8);g.fillStyle='#000';g.fillRect(x-1,y-1,2,2)}
function world(){
for(const it of items){g.fillStyle=IC[it.t];g.fillRect(it.x-4|0,it.y-4|0,9,9);g.fillStyle='#000';g.fillRect(it.x-3|0,it.y-3|0,7,7);tx(IL[it.t],it.x|0,(it.y|0)-3,IC[it.t],7,'center')}
for(const e of en){const im=e.f>0?e.d.wh:e.d.im;g.drawImage(im,e.x-im.width/2|0,e.y-im.height/2|0)}
if(boss){drawBoss(boss);if(boss.warn>0){tx('WARNING',120,150,(boss.warn*5|0)%2?'#f33':'#fd3',20,'center');tx(BN_[stage],120,175,'#fff',9,'center')}}
for(const l of lasers)if(l.t<.9){const on=(l.t*12|0)%2;pline(l.x,l.y,l.a,500,on?'#ff5a78':'#7a2a3c',4,on?2:1)}
g.globalCompositeOperation='lighter';
for(const p of PB)if(p.a){if(p.h){g.fillStyle='#fb6';g.fillRect(p.x-1|0,p.y-2|0,3,5);g.fillStyle='#fff';g.fillRect(p.x|0,p.y-1|0,1,2)}else{g.fillStyle=wep==1?'#fe6':'#6df';g.fillRect(p.x-1|0,p.y-4|0,2,7);g.fillStyle='#fff';g.fillRect(p.x|0,p.y-3|0,1,3)}}
g.globalCompositeOperation='source-over';
for(const p of PT)if(p.l>0&&p.k){g.globalAlpha=p.l/p.m*.6;g.fillStyle=p.c;g.fillRect(p.x|0,p.y|0,p.z,p.z)}g.globalAlpha=1;
for(let i=0;i<bmax;i++)if(ba[i]){const s=BS[bk[i]],o=s.width>>1;g.drawImage(s,bx[i]-o|0,by[i]-o|0)}
if(S!='over'&&(P.inv<=0||(P.inv*14|0)%2)){g.drawImage(PL,P.x-6|0,P.y-5|0);g.fillStyle=(scroll*30|0)%2?'#fa0':'#ff6';g.fillRect(P.x-1|0,P.y+5|0,2,3+(scroll*40|0)%3)}
if(foc&&S!='over'){pcirc(P.x|0,P.y|0,GR,'#fff',.4,1);g.fillStyle='#f03';g.fillRect(P.x-1|0,P.y-1|0,3,3);g.fillStyle='#fff';g.fillRect(P.x|0,P.y|0,1,1)}
g.globalCompositeOperation='lighter';
for(const p of PT)if(p.l>0&&!p.k){g.globalAlpha=p.l/p.m;g.fillStyle=p.c;g.fillRect(p.x|0,p.y|0,p.z,p.z)}g.globalAlpha=1;
for(const r of rings)pcirc(r.x|0,r.y|0,r.r,r.c,cl(1-r.r/r.m,0,1));g.globalCompositeOperation='source-over'}
function hud(){tx('SCORE '+String(score).padStart(8,'0'),4,3,'#fff',8);tx('HI '+String(M.max(hi,score)).padStart(8,'0'),W-4,3,'#fd3',8,'right');
tx('GRAZE '+graze,4,13,'#8ff',7);if(chain>1)tx('CHAIN '+chain,W-4,13,'#fa3',7,'right');
tx(DF[diff].n,120,13,DCOL[diff],7,'center');
for(let i=0;i<M.min(lives,8);i++){g.fillStyle='#4cf';g.fillRect(4+i*8,H-12,6,6);g.fillStyle='#fff';g.fillRect(6+i*8,H-11,2,2)}
for(let i=0;i<bombs;i++){g.fillStyle='#fd3';g.fillRect(4+i*8,H-22,6,6);g.fillStyle='#f63';g.fillRect(5+i*8,H-21,4,4)}
tx(WN[wep]+' LV'+(pow+1),120,H-10,'#fff',7,'center');tx('ST'+(stage+1),W-4,H-10,'#aaa',7,'right');
if(boss&&boss.in>=2&&!boss.dead){const w=200,f=cl(boss.hp/boss.mhp,0,1);g.fillStyle='#222';g.fillRect(20,24,w,5);g.fillStyle=BCOL[stage][2];g.fillRect(20,24,w*f|0,5);g.fillStyle='#fff';for(let i=1;i<D.ph.length;i++)g.fillRect(20+w*i/D.ph.length|0,23,1,7);tx(BN_[stage]+'  P'+(boss.ph+1)+'/'+D.ph.length,20,31,'#fff',7)}
if(msgT>0)tx(msg,120,70,'#fff',10,'center');
if('ontouchstart'in window){tx('[B]',W-4,H-24,'#fd3',9,'right');tx('[W]',4,H-24,'#8ff',9)}}
function render(){g.save();if(shake>0&&S=='play')g.translate((rnd()-.5)*shake*14|0,(rnd()-.5)*shake*14|0);bg();if(S!='menu')world();g.restore();
if(SKY){g.drawImage(SKY.scan,0,0);g.drawImage(SKY.vig,0,0)}
if(flash>0){g.globalAlpha=flash*.6;g.fillStyle='#fff';g.fillRect(0,0,W,H);g.globalAlpha=1}
if(S=='menu'){g.fillStyle='rgba(0,0,0,.45)';g.fillRect(0,0,W,H);tx('BULLET',120,40,'#f36',30,'center');tx('HELL',120,74,'#fd3',30,'center');tx('VERTICAL SHMUP / ULTRA',120,112,'#8ff',8,'center');
tx('DIFFICULTY  < >',120,140,'#aaa',8,'center');for(let i=0;i<5;i++)tx((i==diff?'> ':'  ')+DF[i].n,120,154+i*13,i==diff?DCOL[i]:'#667',10,'center');
tx('STAGE ^v  '+(stage+1)+'. '+SN[stage],120,232,'#fff',9,'center');tx('HI '+hi,120,250,'#fd3',8,'center');
tx((scroll*2|0)%2?'PRESS ENTER / TAP CENTER':'',120,280,'#fff',9,'center');
['WASD/ARROW  MOVE   SHIFT  FOCUS','SPACE  BOMB   1/2/3  WEAPON','ESC  PAUSE   M/N  MUSIC/SFX','TOUCH: DRAG  [B] BOMB  [W] WEAPON'].forEach((s,i)=>tx(s,120,310+i*12,'#889',7,'center'))}
else{hud();if(S=='adm')drawAdm();if(S=='pause'){g.fillStyle='rgba(0,0,0,.6)';g.fillRect(0,0,W,H);tx('PAUSE',120,170,'#fff',20,'center');tx('ESC RESUME / Q MENU',120,200,'#aaa',8,'center')}
if(S=='clear'){g.fillStyle='rgba(0,0,0,.5)';g.fillRect(0,0,W,H);tx('STAGE '+(stage+1)+' CLEAR',120,150,'#5f8',16,'center');tx('SCORE '+score,120,185,'#fff',10,'center');tx('GRAZE '+graze+'  MAX CHAIN '+maxCh,120,200,'#8ff',8,'center')}
if(S=='over'||S=='win'){g.fillStyle='rgba(0,0,0,.7)';g.fillRect(0,0,W,H);tx(S=='win'?'ALL CLEAR!':'GAME OVER',120,100,S=='win'?'#5f8':'#f36',20,'center');
['SCORE  '+score+(newHi?'  NEW!':''),'HI     '+hi,'KILLS  '+kills,'GRAZE  '+graze,'MAX CHAIN '+maxCh,DF[diff].n].forEach((s,i)=>tx(s,120,140+i*14,i==5?DCOL[diff]:'#fff',9,'center'));
tx('ENTER / TAP TOP : RETRY',120,250,'#fd3',8,'center');tx('ESC / TAP BOTTOM : MENU',120,266,'#aaa',8,'center')}}}
let lt=0;(function loop(ts){const dt=M.min((ts-lt)/1000||0,.05);lt=ts;
if(S=='play')update(dt);else{scroll+=dt;if(S=='clear'){cT-=dt;if(cT<=0){if(stage<2){stage++;beginStage();S='play'}else{fin();S='win'}}}}
render();requestAnimationFrame(loop)})(0);
