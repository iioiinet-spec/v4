<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ODYSSEY / STARSHIP EXPLORER</title>
<style>
  :root{ --acc:#5fd8ff; --warm:#ffb347; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; background:#04060a; }
  body{ font-family:'Consolas','Menlo','Courier New',monospace; user-select:none; -webkit-user-select:none; }
  canvas{ display:block; position:fixed; top:0; left:0; width:100%; height:100%; }
  #gl{ z-index:1; } #ui{ z-index:2; pointer-events:none; }

  #help{
    position:fixed; z-index:5; left:18px; top:18px; max-width:340px;
    padding:13px 15px 14px; background:rgba(5,10,16,.82);
    border:1px solid rgba(95,216,255,.32); border-left:3px solid var(--acc);
    color:#d3e6f2; font-size:12px; line-height:1.62; backdrop-filter:blur(6px);
    transition:opacity .5s ease;
  }
  #help h1{ margin:0 0 8px; font-size:12px; letter-spacing:2.4px; color:var(--acc); font-weight:700; }
  #help dl{ margin:0; display:grid; grid-template-columns:98px 1fr; gap:3px 10px; }
  #help dt{ color:var(--warm); font-weight:700; }
  #help dd{ margin:0; color:#b3c6d4; }
  #help .foot{ margin-top:9px; padding-top:8px; border-top:1px solid rgba(95,216,255,.18); color:#7d8f9c; font-size:11px; }
  #help.dim{ opacity:0; }

  #boot{
    position:fixed; inset:0; z-index:9; display:flex; align-items:center; justify-content:center;
    flex-direction:column; background:#04060a; color:var(--acc); font-size:13px; letter-spacing:4px;
  }
  #boot span{ margin-top:14px; color:#3d5866; font-size:11px; letter-spacing:2px; }
  #boot.done{ opacity:0; pointer-events:none; transition:opacity .8s ease; }

  #lock{
    position:fixed; z-index:6; left:50%; bottom:36px; transform:translateX(-50%);
    padding:9px 18px; background:rgba(5,10,16,.8); border:1px solid rgba(95,216,255,.35);
    border-radius:8px; color:#cfe6f2; font-size:12px; letter-spacing:1px; cursor:pointer;
  }
  #lock.hide{ display:none; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<canvas id="gl"></canvas>
<canvas id="ui"></canvas>

<div id="help">
  <h1>ODYSSEY &middot; STARSHIP</h1>
  <dl>
    <dt>W A S D</dt><dd>선내 이동</dd>
    <dt>마우스</dt><dd>시점 회전</dd>
    <dt>E</dt><dd>조종석 착석 / 이탈</dd>
    <dt>W / S</dt><dd>[항해] 추력 증감</dd>
    <dt>Shift</dt><dd>[항해] 워프 점프</dd>
    <dt>Space</dt><dd>[항해] 급제동</dd>
    <dt>H / P</dt><dd>안내창 / 화질</dd>
  </dl>
  <p class="foot">선실에서 출발해 통로를 지나 조종실로 가세요. 조종석 앞에 서면 E로 앉아 우주 항해가 시작됩니다.</p>
</div>

<div id="lock">화면을 클릭하면 시점 조작이 시작됩니다</div>
<div id="boot">SYSTEMS INITIALIZING<span>HULL / NAVIGATION</span></div>

<script>
(function () {
  'use strict';

  var DEG = Math.PI / 180;
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }

  if (typeof THREE === 'undefined') {
    document.getElementById('boot').innerHTML =
      'THREE.JS \uB85C\uB4DC \uC2E4\uD328<span>\uC778\uD130\uB137 \uC5F0\uACB0\uC744 \uD655\uC778\uD558\uC138\uC694</span>';
    return;
  }

  // 검증된 구획 배치: 겹침 없음, 전부 연결
  var ROOMS = [
    { n: 'CREW QUARTERS', x: -25.0, z: 0.0, w: 11.0, d: 10.0, h: 3.6 },
    { n: 'CORRIDOR A', x: -14.0, z: 0.0, w: 11.0, d: 4.4, h: 3.0 },
    { n: 'CENTRAL HUB', x: 0.0, z: 0.0, w: 17.0, d: 13.0, h: 4.4 },
    { n: 'CORRIDOR B', x: 13.0, z: 0.0, w: 9.0, d: 4.4, h: 3.0 },
    { n: 'FLIGHT DECK', x: 23.5, z: 0.0, w: 12.0, d: 10.0, h: 3.8 },
    { n: 'CARGO BAY', x: 0.0, z: -10.5, w: 9.0, d: 8.0, h: 3.6 },
    { n: 'LINK', x: -7.0, z: -10.5, w: 5.0, d: 4.0, h: 2.8 },
    { n: 'ENGINE ROOM', x: -14.0, z: -10.5, w: 9.0, d: 8.0, h: 3.6 }
  ];
  function roomAt(x, z) {
    for (var i = 0; i < ROOMS.length; i++) {
      var r = ROOMS[i];
      if (Math.abs(x - r.x) < r.w / 2 && Math.abs(z - r.z) < r.d / 2) return r;
    }
    return null;
  }

  start();

  function start() {
    function sc(h) { return new THREE.Color(h).convertSRGBToLinear(); }

    var glCanvas = document.getElementById('gl');
    var renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.autoClear = false;
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;

    var camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.05, 90000);

    // ================================================ 선내 씬
    var interior = new THREE.Scene();
    interior.fog = new THREE.FogExp2(sc(0x070c14).getHex(), 0.021);

    var hullM = new THREE.MeshStandardMaterial({ color: sc(0x5c646e), roughness: 0.62, metalness: 0.55 });
    var floorM = new THREE.MeshStandardMaterial({ color: sc(0x33393f), roughness: 0.78, metalness: 0.35 });
    var ceilM = new THREE.MeshStandardMaterial({ color: sc(0x272c32), roughness: 0.85, metalness: 0.3 });
    var trimM = new THREE.MeshStandardMaterial({ color: sc(0x1d2126), roughness: 0.5, metalness: 0.7 });
    var glowC = new THREE.MeshBasicMaterial({ color: 0x67e2ff });
    var glowW = new THREE.MeshBasicMaterial({ color: 0xffc178 });
    var panelM = new THREE.MeshStandardMaterial({ color: sc(0x141b24), roughness: 0.3, metalness: 0.6 });
    var screenM = new THREE.MeshBasicMaterial({ color: 0x1d5f7a });

    interior.add(new THREE.AmbientLight(sc(0x5a7488), 0.55));

    function panelTex() {
      var cv = document.createElement('canvas');
      cv.width = cv.height = 256;
      var g = cv.getContext('2d');
      g.fillStyle = '#8f98a3'; g.fillRect(0, 0, 256, 256);
      g.strokeStyle = 'rgba(30,36,44,.55)'; g.lineWidth = 2;
      for (var i = 0; i <= 256; i += 64) {
        g.beginPath(); g.moveTo(i, 0); g.lineTo(i, 256); g.stroke();
        g.beginPath(); g.moveTo(0, i); g.lineTo(256, i); g.stroke();
      }
      g.fillStyle = 'rgba(40,48,58,.5)';
      for (var k = 0; k < 90; k++) g.fillRect(Math.random() * 256, Math.random() * 256, 3, 3);
      g.fillStyle = 'rgba(220,230,240,.16)';
      for (var m = 0; m < 40; m++) g.fillRect(Math.random() * 256, Math.random() * 256, 12, 2);
      var t = new THREE.CanvasTexture(cv);
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.encoding = THREE.sRGBEncoding;
      return t;
    }
    var pTex = panelTex();
    hullM.map = pTex.clone(); hullM.map.repeat.set(3, 1); hullM.map.needsUpdate = true;
    floorM.map = pTex.clone(); floorM.map.repeat.set(4, 4); floorM.map.needsUpdate = true;

    var walls = [];   // 충돌용 AABB
    function addWall(x, z, w, d) { walls.push({ x: x, z: z, w: w, d: d }); }

    function buildRoom(r) {
      var g = new THREE.Group();
      g.position.set(r.x, 0, r.z);

      var fl = new THREE.Mesh(new THREE.BoxGeometry(r.w, 0.2, r.d), floorM);
      fl.position.y = -0.1; g.add(fl);
      var ce = new THREE.Mesh(new THREE.BoxGeometry(r.w, 0.2, r.d), ceilM);
      ce.position.y = r.h; g.add(ce);

      // 천장 조명 스트립
      var strips = Math.max(1, Math.floor(r.d / 3.2));
      for (var s = 0; s < strips; s++) {
        var zz = -r.d / 2 + r.d * (s + 0.5) / strips;
        var st = new THREE.Mesh(new THREE.BoxGeometry(r.w * 0.72, 0.08, 0.26), glowC);
        st.position.set(0, r.h - 0.16, zz); g.add(st);
        var pl = new THREE.PointLight(0x8fe4ff, 0.75, r.w * 1.5, 2);
        pl.position.set(0, r.h - 0.5, zz); g.add(pl);
      }

      // 벽: 인접 방과 겹치는 구간은 문으로 뚫는다
      var sides = [
        { ax: 'x', s: -1, len: r.d, px: -r.w / 2, pz: 0 },
        { ax: 'x', s: 1, len: r.d, px: r.w / 2, pz: 0 },
        { ax: 'z', s: -1, len: r.w, px: 0, pz: -r.d / 2 },
        { ax: 'z', s: 1, len: r.w, px: 0, pz: r.d / 2 }
      ];
      sides.forEach(function (sd) {
        // 이 벽면에 열린 개구부(문) 범위를 구한다
        var gaps = [];
        for (var i = 0; i < ROOMS.length; i++) {
          var o = ROOMS[i];
          if (o === r) continue;
          if (sd.ax === 'x') {
            var wallX = r.x + sd.px;
            if (Math.abs((o.x + (o.x < r.x ? o.w / 2 : -o.w / 2)) - wallX) > 0.1) continue;
            if ((o.x < r.x) !== (sd.s < 0)) continue;
            var a = Math.max(r.z - r.d / 2, o.z - o.d / 2);
            var b = Math.min(r.z + r.d / 2, o.z + o.d / 2);
            if (b - a > 1.6) gaps.push([a - r.z, b - r.z]);
          } else {
            var wallZ = r.z + sd.pz;
            if (Math.abs((o.z + (o.z < r.z ? o.d / 2 : -o.d / 2)) - wallZ) > 0.1) continue;
            if ((o.z < r.z) !== (sd.s < 0)) continue;
            var c = Math.max(r.x - r.w / 2, o.x - o.w / 2);
            var e = Math.min(r.x + r.w / 2, o.x + o.w / 2);
            if (e - c > 1.6) gaps.push([c - r.x, e - r.x]);
          }
        }
        // 개구부를 뺀 나머지 구간에 벽 세그먼트를 세운다
        gaps.sort(function (p, q) { return p[0] - q[0]; });
        var segs = [], cur = -sd.len / 2;
        gaps.forEach(function (gp) {
          var a = Math.max(gp[0] + 0.55, -sd.len / 2);
          var b = Math.min(gp[1] - 0.55, sd.len / 2);
          if (a > cur) segs.push([cur, a]);
          cur = Math.max(cur, b);
        });
        if (cur < sd.len / 2) segs.push([cur, sd.len / 2]);

        segs.forEach(function (sg) {
          var L = sg[1] - sg[0];
          if (L < 0.05) return;
          var mid = (sg[0] + sg[1]) / 2;
          var w, d, wx, wz;
          if (sd.ax === 'x') { w = 0.3; d = L; wx = sd.px; wz = mid; }
          else { w = L; d = 0.3; wx = mid; wz = sd.pz; }
          var m = new THREE.Mesh(new THREE.BoxGeometry(w, r.h, d), hullM);
          m.position.set(wx, r.h / 2, wz);
          g.add(m);
          addWall(r.x + wx, r.z + wz, w, d);
        });

        // 문틀 발광 테두리
        gaps.forEach(function (gp) {
          var mid = (gp[0] + gp[1]) / 2;
          var span = Math.min(gp[1] - gp[0], sd.len) - 1.1;
          if (span < 0.4) return;
          var fr = new THREE.Mesh(
            sd.ax === 'x' ? new THREE.BoxGeometry(0.12, 0.1, span) : new THREE.BoxGeometry(span, 0.1, 0.12),
            glowC);
          fr.position.set(sd.ax === 'x' ? sd.px : mid, 2.5, sd.ax === 'x' ? mid : sd.pz);
          g.add(fr);
        });
      });

      interior.add(g);
      return g;
    }
    ROOMS.forEach(buildRoom);

    // ---------------------------------------------- 구획별 집기
    function prop(geo, mat, x, y, z, rx, ry) {
      var m = new THREE.Mesh(geo, mat);
      m.position.set(x, y, z);
      if (rx) m.rotation.x = rx;
      if (ry) m.rotation.y = ry;
      interior.add(m);
      return m;
    }
    var boxG = function (w, h, d) { return new THREE.BoxGeometry(w, h, d); };

    // 승무원 선실: 침상, 사물함, 창
    (function () {
      var r = ROOMS[0];
      for (var b = 0; b < 2; b++) {
        prop(boxG(2.2, 0.24, 1.0), trimM, r.x - 3.4, 0.55 + b * 1.25, r.z - 3.0);
        prop(boxG(2.0, 0.16, 0.85), panelM, r.x - 3.4, 0.70 + b * 1.25, r.z - 3.0);
        addWall(r.x - 3.4, r.z - 3.0, 2.2, 1.0);
      }
      for (var l = 0; l < 4; l++) prop(boxG(0.9, 1.9, 0.5), trimM, r.x - 4.0 + l * 1.0, 0.95, r.z + 4.3);
      addWall(r.x - 2.0, r.z + 4.3, 4.0, 0.5);
      var win = prop(boxG(0.12, 1.5, 3.0), screenM, r.x - r.w / 2 + 0.1, 1.8, r.z + 1.0);
      win.material = new THREE.MeshBasicMaterial({ color: 0x0a1424 });
      prop(new THREE.TorusGeometry(1.6, 0.09, 8, 24), trimM,
        r.x - r.w / 2 + 0.16, 1.8, r.z + 1.0, 0, Math.PI / 2);
      prop(boxG(1.6, 0.1, 1.6), trimM, r.x + 3.4, 0.75, r.z + 1.0);
      prop(boxG(1.4, 0.06, 1.4), screenM, r.x + 3.4, 0.82, r.z + 1.0);
      addWall(r.x + 3.4, r.z + 1.0, 1.6, 1.6);
    })();

    // 중앙 허브: 홀로 테이블, 기둥
    (function () {
      var r = ROOMS[2];
      var base = prop(new THREE.CylinderGeometry(1.5, 1.8, 0.9, 16), trimM, r.x, 0.45, r.z);
      addWall(r.x, r.z, 3.6, 3.6);
      var holo = prop(new THREE.SphereGeometry(1.15, 20, 14),
        new THREE.MeshBasicMaterial({ color: 0x4fd0ff, transparent: true, opacity: 0.30, wireframe: true }),
        r.x, 2.1, r.z);
      holo.userData.spin = true;
      var ring = prop(new THREE.TorusGeometry(1.5, 0.03, 8, 40),
        new THREE.MeshBasicMaterial({ color: 0x7fe6ff, transparent: true, opacity: 0.55 }),
        r.x, 2.1, r.z, Math.PI / 2.2);
      ring.userData.spin2 = true;
      interior.userData = { holo: holo, ring: ring };
      [[-6.5, -4.8], [6.5, -4.8], [-6.5, 4.8], [6.5, 4.8]].forEach(function (p) {
        prop(new THREE.CylinderGeometry(0.42, 0.5, r.h, 10), hullM, r.x + p[0], r.h / 2, r.z + p[1]);
        addWall(r.x + p[0], r.z + p[1], 1.0, 1.0);
      });
      for (var s = -1; s <= 1; s += 2) {
        prop(boxG(0.3, 1.6, 2.6), panelM, r.x + s * (r.w / 2 - 0.3), 1.9, r.z - 2.0);
        prop(boxG(0.06, 1.2, 2.2), screenM, r.x + s * (r.w / 2 - 0.48), 1.9, r.z - 2.0);
      }
    })();

    // 화물칸: 컨테이너 스택
    (function () {
      var r = ROOMS[5];
      var cols = [0x2f6f8a, 0x8a5a2f, 0x3f7a45, 0x6a3f7a];
      var s2 = 41;
      function rr() { s2 = (s2 * 1103515245 + 12345) % 2147483648; return s2 / 2147483648; }
      for (var i = 0; i < 10; i++) {
        var cw = 1.2 + rr() * 0.7, ch = 0.9 + rr() * 0.8;
        var cx = r.x - 3 + Math.floor(i / 3) * 2.4 + rr() * 0.3;
        var cz = r.z - 2.4 + (i % 3) * 2.0;
        var stack = Math.floor(rr() * 2) + 1;
        for (var k = 0; k < stack; k++) {
          prop(boxG(cw, ch, cw), new THREE.MeshStandardMaterial({
            color: sc(cols[Math.floor(rr() * 4)]), roughness: 0.7, metalness: 0.35
          }), cx, ch / 2 + k * ch, cz);
        }
        addWall(cx, cz, cw, cw);
      }
    })();

    // 기관실: 반응로 코어
    (function () {
      var r = ROOMS[7];
      prop(new THREE.CylinderGeometry(1.3, 1.3, r.h - 0.4, 14), trimM, r.x, (r.h - 0.4) / 2, r.z);
      var core = prop(new THREE.CylinderGeometry(0.85, 0.85, r.h - 1.2, 16),
        new THREE.MeshBasicMaterial({ color: 0xff9a3c, transparent: true, opacity: 0.7 }),
        r.x, (r.h - 0.4) / 2, r.z);
      core.userData.pulse = true;
      interior.userData.core = core;
      var pl = new THREE.PointLight(0xffa040, 1.6, 14, 2);
      pl.position.set(r.x, 1.8, r.z); interior.add(pl);
      addWall(r.x, r.z, 2.8, 2.8);
      for (var p2 = -1; p2 <= 1; p2 += 2) {
        prop(boxG(2.4, 2.0, 0.4), panelM, r.x + p2 * 2.8, 1.3, r.z - 3.2);
        prop(boxG(2.0, 1.4, 0.06), screenM, r.x + p2 * 2.8, 1.4, r.z - 3.44);
      }
    })();

    // ---------------------------------------------- 조종실 + 조종석
    var pilotSeat = new THREE.Vector3(ROOMS[4].x + 1.2, 0, ROOMS[4].z);
    var canopyGroup = new THREE.Group();
    (function () {
      var r = ROOMS[4];
      // 전방 관측창: 벽을 유리로 교체
      var glassM = new THREE.MeshBasicMaterial({ color: 0x0a1220 });
      prop(boxG(0.14, 2.4, r.d - 1.6), glassM, r.x + r.w / 2 - 0.08, 2.0, r.z);
      // 창틀
      prop(boxG(0.24, 0.16, r.d - 1.4), trimM, r.x + r.w / 2 - 0.12, 3.24, r.z);
      prop(boxG(0.24, 0.16, r.d - 1.4), trimM, r.x + r.w / 2 - 0.12, 0.78, r.z);
      for (var m = -1; m <= 1; m++) {
        prop(boxG(0.26, 2.5, 0.16), trimM, r.x + r.w / 2 - 0.12, 2.0, r.z + m * 2.6);
      }
      // 계기 콘솔
      var con = prop(boxG(1.4, 0.9, 4.2), panelM, r.x + 3.2, 0.55, r.z);
      addWall(r.x + 3.2, r.z, 1.4, 4.2);
      var slab = prop(boxG(1.3, 0.1, 4.0), trimM, r.x + 3.2, 1.02, r.z);
      slab.rotation.z = -0.16;
      for (var s = -1; s <= 1; s++) {
        prop(boxG(0.9, 0.05, 1.1), screenM, r.x + 3.15, 1.12 + Math.abs(s) * 0.0, r.z + s * 1.3, 0, 0)
          .rotation.z = -0.16;
      }
      var deckLight = new THREE.PointLight(0xa8d8ff, 1.5, 20, 2);
      deckLight.position.set(r.x + 1.0, 3.0, r.z);
      interior.add(deckLight);
      // 조종석 의자
      prop(boxG(1.0, 0.18, 1.0), trimM, pilotSeat.x, 0.5, pilotSeat.z);
      prop(new THREE.CylinderGeometry(0.16, 0.4, 0.5, 10), trimM, pilotSeat.x, 0.25, pilotSeat.z);
      var back = prop(boxG(0.2, 1.2, 1.0), trimM, pilotSeat.x - 0.5, 1.1, pilotSeat.z);
      back.rotation.z = 0.12;
      prop(boxG(0.9, 0.1, 0.28), trimM, pilotSeat.x - 0.05, 0.9, pilotSeat.z + 0.56);
      prop(boxG(0.9, 0.1, 0.28), trimM, pilotSeat.x - 0.05, 0.9, pilotSeat.z - 0.56);
      // 사이드 콘솔
      for (var q = -1; q <= 1; q += 2) {
        prop(boxG(1.6, 1.0, 0.7), panelM, r.x - 1.0, 0.5, r.z + q * 3.3);
        prop(boxG(1.4, 0.06, 0.55), screenM, r.x - 1.0, 1.02, r.z + q * 3.3);
        addWall(r.x - 1.0, r.z + q * 3.3, 1.6, 0.7);
      }
    })();

    // ================================================ 우주 씬
    var space = new THREE.Scene();

    // 별: 3중 레이어
    var STAR_TEX = (function () {
      var cv = document.createElement('canvas'); cv.width = cv.height = 32;
      var g = cv.getContext('2d');
      var gr = g.createRadialGradient(16, 16, 0, 16, 16, 16);
      gr.addColorStop(0, 'rgba(255,255,255,1)');
      gr.addColorStop(0.28, 'rgba(255,255,255,0.75)');
      gr.addColorStop(1, 'rgba(255,255,255,0)');

        // 천체를 카메라 기준 상대 배치
        for (var bi = 0; bi < bodies.length; bi++) {
          bodies[bi].m.rotation.y += dt * 0.012;
        }
        space.position.set(-shipPos.x, -shipPos.y, -shipPos.z);

        // 워프 중 배경 별은 흐려진다
        for (var sl = 0; sl < starLayers.length; sl++) {
          starLayers[sl].material.opacity = 0.95 * (1 - warp * 0.55);
        }
        // 워프 스트릭 갱신
        var wm = warpLines.material;
        wm.opacity = clamp(warp * 1.4 - 0.05, 0, 1) * 0.62;
        warpLines.position.copy(shipPos);
        if (wm.opacity > 0.01) {
          var arr = warpGeo.attributes.position.array;
          var len = 60 + warp * warp * 900;
          for (var k = 0; k < WARP_N; k++) {
            var sd = warpSeed[k];
            sd.z += Math.min(speed * dt * 0.55, 1400);
            if (sd.z > 120) {
              var ra2 = Math.random() * Math.PI * 2;
              var rd2 = (0.35 + Math.sqrt(Math.random()) * 0.65) * 1500;
              sd.z = -2400 - Math.random() * 400;
              sd.x = Math.cos(ra2) * rd2;
              sd.y = Math.sin(ra2) * rd2;
            }
            var a = tmpV.set(sd.x, sd.y, sd.z).applyQuaternion(shipQuat);
            arr[k * 6] = a.x; arr[k * 6 + 1] = a.y; arr[k * 6 + 2] = a.z;
            var b = tmpV.set(sd.x, sd.y, sd.z - len).applyQuaternion(shipQuat);
            arr[k * 6 + 3] = b.x; arr[k * 6 + 4] = b.y; arr[k * 6 + 5] = b.z;
          }
          warpGeo.attributes.position.needsUpdate = true;
        }
      }

      // ---------------- 렌더
      var activeScene = mode === MODE_WALK ? interior : space;
      renderer.setRenderTarget(postOn ? rtScene : null);
      renderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
      renderer.clear(true, true, false);
      renderer.render(activeScene, camera);

      if (postOn) {
        var sAmt = mode === MODE_FLY ? clamp(warp * warp * 0.085 + throttle * 0.010, 0, 0.095) : 0;
        compMat.uniforms.speedAmt.value = sAmt;
        compMat.uniforms.bloomAmt.value = mode === MODE_FLY ? 0.95 : 0.55;
        brightMat.uniforms.tDiffuse.value = rtScene.texture;
        pass(brightMat, rtA);
        blurMat.uniforms.tDiffuse.value = rtA.texture;
        blurMat.uniforms.dir.value.set(1, 0); pass(blurMat, rtB);
        blurMat.uniforms.tDiffuse.value = rtB.texture;
        blurMat.uniforms.dir.value.set(0, 1); pass(blurMat, rtA);
        compMat.uniforms.tScene.value = rtScene.texture;
        compMat.uniforms.tBloom.value = rtA.texture;
        compMat.uniforms.tSeed.value = (now % 10000) / 900;
        pass(compMat, null);
      }

      // ---------------- HUD
      ux.setTransform(1, 0, 0, 1, 0, 0);
      ux.clearRect(0, 0, L.W, L.H);
      setTx(ux);

      if (mode === MODE_WALK) {
        ux.textAlign = 'center';
        ux.strokeStyle = 'rgba(207,230,242,.7)'; ux.lineWidth = 1.5;
        ux.beginPath(); ux.arc(800, 450, 3.4, 0, 7); ux.stroke();

        ux.fillStyle = '#5fd8ff'; ux.font = mono(13, 'bold');
        ux.fillText(curRoom.n, 800, L.t + 40);

        if (nearSeat) {
          var pulse = 0.65 + Math.sin(now / 220) * 0.35;
          ux.fillStyle = 'rgba(5,10,16,.7)';
          rr(ux, 800 - 118, 500, 236, 40, 8); ux.fill();
          ux.strokeStyle = 'rgba(255,179,71,' + pulse.toFixed(2) + ')'; ux.lineWidth = 1.6; ux.stroke();
          ux.fillStyle = '#ffb347'; ux.font = mono(15, 'bold');
          ux.fillText('[ E ]  조종석 착석', 800, 525);
        }
      } else {
        var kps = speed;
        var ease = seatT * seatT * (3 - 2 * seatT);

        // 조종석 실루엣: 화면 가장자리 프레임
        ux.save();
        ux.globalAlpha = ease;
        var fh = L.vh * 0.17;
        var gradF = ux.createLinearGradient(0, L.b - fh, 0, L.b);
        gradF.addColorStop(0, 'rgba(10,14,20,0)');
        gradF.addColorStop(0.45, 'rgba(12,17,24,.85)');
        gradF.addColorStop(1, 'rgba(6,9,14,1)');
        ux.fillStyle = gradF;
        ux.beginPath();
        ux.moveTo(L.l, L.b);
        ux.lineTo(L.l, L.b - fh * 0.5);
        ux.quadraticCurveTo(800, L.b - fh * 1.25, L.r, L.b - fh * 0.5);
        ux.lineTo(L.r, L.b);
        ux.closePath(); ux.fill();
        ux.strokeStyle = 'rgba(95,216,255,.30)'; ux.lineWidth = 2;
        ux.beginPath();
        ux.moveTo(L.l, L.b - fh * 0.5);
        ux.quadraticCurveTo(800, L.b - fh * 1.25, L.r, L.b - fh * 0.5);
        ux.stroke();
        // 좌우 A필러
        ux.fillStyle = 'rgba(9,13,19,.92)';
        ux.beginPath();
        ux.moveTo(L.l, L.t); ux.lineTo(L.l + L.vw * 0.055, L.t);
        ux.lineTo(L.l + L.vw * 0.018, L.b); ux.lineTo(L.l, L.b);
        ux.closePath(); ux.fill();
        ux.beginPath();
        ux.moveTo(L.r, L.t); ux.lineTo(L.r - L.vw * 0.055, L.t);
        ux.lineTo(L.r - L.vw * 0.018, L.b); ux.lineTo(L.r, L.b);
        ux.closePath(); ux.fill();
        ux.restore();

        // 조준 십자
        ux.strokeStyle = 'rgba(95,216,255,.85)'; ux.lineWidth = 1.6;
        ux.beginPath(); ux.arc(800, 450, 16, 0, 7); ux.stroke();
        ux.beginPath();
        ux.moveTo(800 - 30, 450); ux.lineTo(800 - 20, 450);
        ux.moveTo(800 + 20, 450); ux.lineTo(800 + 30, 450);
        ux.moveTo(800, 450 - 30); ux.lineTo(800, 450 - 20);
        ux.moveTo(800, 450 + 20); ux.lineTo(800, 450 + 30);
        ux.stroke();

        // 천체 라벨
        ux.font = mono(11, 'bold');
        for (var q = 0; q < bodies.length; q++) {
          var bd = bodies[q];
          vProj.copy(bd.g.position).add(space.position).project(camera);
          if (vProj.z > 1) continue;
          var sx = 800 + vProj.x * L.vw / 2, sy = 450 - vProj.y * L.vh / 2;
          if (sx < L.l + 40 || sx > L.r - 40) continue;
          var dist = bd.g.position.clone().add(space.position).length();
          ux.strokeStyle = 'rgba(95,216,255,.6)'; ux.lineWidth = 1.2;
          ux.beginPath(); ux.arc(sx, sy, 13, 0, 7); ux.stroke();
          ux.fillStyle = 'rgba(95,216,255,.9)'; ux.textAlign = 'left';
          ux.fillText(bd.name, sx + 19, sy - 3);
          ux.fillStyle = 'rgba(207,230,242,.55)';
          ux.fillText((dist / 1000).toFixed(1) + ' Mm', sx + 19, sy + 11);
        }

        // 좌측 계기
        ux.save();
        ux.globalAlpha = ease;
        var px = L.l + 40, py = L.b - 150;
        ux.fillStyle = 'rgba(6,11,18,.62)';
        rr(ux, px - 14, py - 34, L.narrow ? 200 : 240, 150, 9); ux.fill();
        ux.strokeStyle = 'rgba(95,216,255,.26)'; ux.lineWidth = 1; ux.stroke();
        ux.textAlign = 'left';
        ux.fillStyle = '#5fd8ff'; ux.font = mono(11, 'bold');
        ux.fillText('NAVIGATION', px, py - 16);
        ux.fillStyle = '#e8f2f8'; ux.font = mono(30, 'bold');
        ux.fillText(kps >= 1000 ? (kps / 1000).toFixed(2) : Math.round(kps), px, py + 20);
        ux.fillStyle = 'rgba(232,242,248,.5)'; ux.font = mono(11, 'bold');
        ux.fillText(kps >= 1000 ? 'x1000 km/s' : 'km/s', px + (kps >= 1000 ? 96 : 60), py + 20);

        // 추력 바
        ux.fillStyle = 'rgba(255,255,255,.09)'; ux.fillRect(px, py + 36, 190, 9);
        ux.fillStyle = warp > 0.3 ? '#ffb347' : '#5fd8ff';
        ux.fillRect(px, py + 36, 190 * throttle, 9);
        ux.fillStyle = 'rgba(232,242,248,.5)'; ux.font = mono(10, 'bold');
        ux.fillText('THRUST', px, py + 58);
        // 워프 충전
        ux.fillStyle = 'rgba(255,255,255,.09)'; ux.fillRect(px, py + 68, 190, 9);
        ux.fillStyle = warpCharge > 0.3 ? '#a8e6ff' : '#ff6b5a';
        ux.fillRect(px, py + 68, 190 * warpCharge, 9);
        ux.fillText('WARP CORE', px, py + 90);
        ux.fillStyle = warp > 0.3 ? '#ffb347' : 'rgba(232,242,248,.4)';
        ux.font = mono(12, 'bold');
        ux.fillText(warp > 0.5 ? 'FTL ENGAGED' : (throttle > 0.05 ? 'SUBLIGHT CRUISE' : 'STATION KEEPING'),
          px, py + 110);
        ux.restore();

        // 우측 상단
        ux.save();
        ux.globalAlpha = ease;
        ux.textAlign = 'right';
        ux.fillStyle = 'rgba(95,216,255,.85)'; ux.font = mono(12, 'bold');
        ux.fillText('ODYSSEY  \u2014  DEEP SPACE', L.r - 34, L.t + 36);
        ux.fillStyle = 'rgba(207,230,242,.5)'; ux.font = mono(11, 'bold');
        ux.fillText('POS  ' + (shipPos.x / 1000).toFixed(1) + ' / ' +
          (shipPos.y / 1000).toFixed(1) + ' / ' + (shipPos.z / 1000).toFixed(1) + ' Mm',
          L.r - 34, L.t + 54);
        ux.fillText('[ E ]  이탈', L.r - 34, L.t + 72);
        ux.restore();

        // 워프 진입 플래시
        if (warp > 0.75) {
          ux.fillStyle = 'rgba(190,235,255,' + ((warp - 0.75) * 0.22).toFixed(3) + ')';
          ux.fillRect(L.l, L.t, L.vw, L.vh);
        }
      }
      ux.setTransform(1, 0, 0, 1, 0, 0);
    }

    animate();
  }
})();
</script>
</body>
</html>
