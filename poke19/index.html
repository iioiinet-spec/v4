<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포켓몬 바닷가 점프맵</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#FFE07D;
    --sky-mid:#7FD1FF;
    --sea-1:#1CA7EC;
    --sea-2:#0C6FA8;
    --sand:#F5DE9B;
    --sand-dark:#E3C077;
    --island-top:#5FCB6C;
    --island-side:#8B5E3C;
    --coral:#FF6F59;
    --coral-dark:#E1502F;
    --ink:#0B3B52;
    --gold:#FFC93C;
    --card:#FFFDF6;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    font-family:'Nunito',sans-serif;
    color:var(--ink);
    overflow:hidden;
    background:var(--sky-mid);
  }
  .scene{
    position:relative;
    width:100%; height:100vh;
    display:flex; flex-direction:column;
    background:linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 45%, var(--sea-1) 46%, var(--sea-2) 100%);
    overflow:hidden;
  }

  /* ---------- SUN / MOON (낮밤 주기에 따라 JS가 위치를 갱신) ---------- */
  .sun{
    position:absolute; z-index:1;
    width:90px; height:90px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #FFF6C9, var(--gold) 55%, #FF9F45 100%);
    box-shadow:0 0 60px 20px rgba(255,201,60,0.55);
    will-change:transform,left,bottom,opacity;
  }
  .sun::after{
    content:''; position:absolute; inset:0; border-radius:50%;
    animation:pulse 4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(255,255,255,0); }
    50%{ box-shadow:0 0 22px 8px rgba(255,255,255,0.15); }
  }
  .moon{
    position:absolute; z-index:1;
    width:64px; height:64px; border-radius:50%;
    background:radial-gradient(circle at 38% 32%, #FFFFFF, #DCE6F2 55%, #AEC2DC 100%);
    box-shadow:0 0 34px 10px rgba(200,220,255,0.35);
    will-change:transform,left,bottom,opacity;
  }
  .moon::before{
    content:''; position:absolute; width:14px; height:14px; border-radius:50%;
    background:rgba(160,180,205,0.55); top:18px; left:14px;
  }
  .moon::after{
    content:''; position:absolute; width:9px; height:9px; border-radius:50%;
    background:rgba(160,180,205,0.45); top:34px; left:34px;
  }
  .star{
    position:absolute; border-radius:50%; background:#fff;
    animation:starTwinkle 2.6s ease-in-out infinite;
  }
  @keyframes starTwinkle{
    0%,100%{ opacity:0.25; }
    50%{ opacity:0.95; }
  }
  .stars-layer{
    position:absolute; inset:0; z-index:0;
    opacity:0; transition:opacity 1.2s ease;
    pointer-events:none;
  }

  /* ---------- 수평선 멀리 헤엄치는 물타입 포켓몬 ---------- */
  .swimmer{
    position:absolute; z-index:3; pointer-events:none;
    filter:saturate(0.85) brightness(1.05);
    animation:swimBob 2.3s ease-in-out infinite;
  }
  .swimmer img{
    width:100%; display:block;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,0.25));
  }
  .swimmer.flip img{ transform:scaleX(-1); }
  @keyframes swimBob{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-3px); }
  }

  /* ---------- 메가뮤츠의 사이킥 파동 ---------- */
  .psy-wave{
    position:absolute; z-index:6; pointer-events:none;
    border-radius:50%;
    border:3px solid rgba(210,140,255,0.85);
    box-shadow:0 0 16px 3px rgba(210,140,255,0.5), inset 0 0 10px 2px rgba(255,255,255,0.3);
    animation:psyWaveExpand 1.1s ease-out forwards;
  }
  @keyframes psyWaveExpand{
    0%{ transform:scale(0.3); opacity:0.9; }
    100%{ transform:scale(2.7); opacity:0; }
  }

  /* ---------- CLOUDS ---------- */
  .cloud{
    position:absolute; background:#fff; border-radius:50px;
    opacity:0.9; filter:drop-shadow(0 6px 4px rgba(0,0,0,0.05));
  }
  .cloud::before,.cloud::after{
    content:''; position:absolute; background:#fff; border-radius:50%;
  }
  .c1{ width:110px; height:36px; top:12%; left:-15%; animation:drift 38s linear infinite; }
  .c1::before{ width:56px; height:56px; top:-28px; left:14px; }
  .c1::after{ width:40px; height:40px; top:-18px; left:60px; }
  .c2{ width:80px; height:28px; top:22%; left:-20%; animation:drift 52s linear infinite; animation-delay:-18s; }
  .c2::before{ width:40px; height:40px; top:-20px; left:10px; }
  .c2::after{ width:30px; height:30px; top:-14px; left:44px; }
  .c3{ width:130px; height:40px; top:8%; left:-25%; animation:drift 64s linear infinite; animation-delay:-40s; }
  .c3::before{ width:60px; height:60px; top:-30px; left:20px; }
  .c3::after{ width:44px; height:44px; top:-18px; left:76px; }
  @keyframes drift{
    from{ transform:translateX(0); }
    to{ transform:translateX(130vw); }
  }

  /* ---------- SEA WAVES ---------- */
  .wave-row{ position:absolute; left:0; right:0; top:45%; height:60px; overflow:hidden; }
  .wave{
    position:absolute; left:-25%; width:150%; height:40px;
    background:repeating-linear-gradient(90deg, rgba(255,255,255,0.55) 0 26px, transparent 26px 60px);
    border-radius:50%;
    animation:sway 6s ease-in-out infinite;
  }
  .wave.w2{ top:10px; opacity:0.6; animation-duration:8s; animation-delay:-2s; }
  @keyframes sway{
    0%,100%{ transform:translateX(0); }
    50%{ transform:translateX(-40px); }
  }

  /* ---------- JUMP PATH (점프맵) ---------- */
  .path-wrap{
    position:relative; flex:1; margin-top:8%;
    overflow-x:auto; overflow-y:hidden;
  }
  .path-wrap::-webkit-scrollbar{ height:10px; }
  .path-wrap::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.6); border-radius:10px; }

  .path{
    position:relative;
    height:100%;
    min-width:max-content;
  }

  .island{
    position:absolute; width:130px; z-index:5;
    display:flex; flex-direction:column; align-items:center;
    animation:dropIn 0.55s cubic-bezier(.34,1.56,.64,1) both;
  }

  .jump-arrow{
    position:absolute; font-size:20px; opacity:0.7;
    user-select:none; pointer-events:none;
  }

  @keyframes dropIn{
    0%{ transform:translateY(-220px) scale(0.4); opacity:0; }
    70%{ transform:translateY(8px) scale(1.08); opacity:1; }
    100%{ transform:translateY(0) scale(1); opacity:1; }
  }

  .sprite-slot{
    position:relative; width:120px; height:120px;
    display:flex; align-items:center; justify-content:center;
    margin-bottom:-18px; z-index:2;
    transition:transform 0.25s ease-out;
  }
  .sprite-slot img{
    width:112px; height:112px; object-fit:contain;
    filter:drop-shadow(0 8px 6px rgba(0,0,0,0.25));
    animation:bob 2.6s ease-in-out infinite;
    opacity:0; transition:opacity 0.35s ease;
  }
  .sprite-slot img.loaded{ opacity:1; }
  .sprite-slot::before{
    content:''; position:absolute; width:46px; height:46px; border-radius:50%;
    background:rgba(255,255,255,0.5);
    animation:skeletonPulse 1.1s ease-in-out infinite;
  }
  .sprite-slot:has(img.loaded)::before,
  .sprite-slot:has(.mon-placeholder)::before{ display:none; }
  @keyframes skeletonPulse{
    0%,100%{ opacity:0.35; transform:scale(0.9); }
    50%{ opacity:0.65; transform:scale(1.05); }
  }
  .mon-placeholder{
    font-size:60px; line-height:1;
    filter:drop-shadow(0 8px 6px rgba(0,0,0,0.25));
    animation:bob 2.6s ease-in-out infinite;
  }
  .island:nth-child(2n) .sprite-slot img{ animation-delay:-0.6s; }
  .island:nth-child(3n) .sprite-slot img{ animation-delay:-1.3s; }
  .island:nth-child(4n) .sprite-slot img{ animation-delay:-1.9s; }
  .sprite-slot img.bumped{
    animation: bob 2.6s ease-in-out infinite, monBump 0.35s ease-out;
  }
  @keyframes monBump{
    0%{ transform:translateX(0) scale(1); }
    35%{ transform:translateX(var(--bump-dir, 10px)) scale(0.9,1.1); }
    100%{ transform:translateX(0) scale(1); }
  }
  @keyframes bob{
    0%,100%{ transform:translateY(0) rotate(-1deg); }
    50%{ transform:translateY(-14px) rotate(1deg); }
  }

  .rock{
    width:130px; height:56px; border-radius:50%;
    background:linear-gradient(180deg, var(--island-top) 0%, var(--island-top) 45%, var(--island-side) 46%, #6b4527 100%);
    box-shadow:0 10px 0 -4px rgba(0,0,0,0.15), 0 14px 16px rgba(0,0,0,0.25);
    position:relative;
  }
  .rock::before{
    content:''; position:absolute; top:6px; left:14px; width:34px; height:12px;
    background:rgba(255,255,255,0.35); border-radius:50%;
  }
  .island.starter .rock{
    background:linear-gradient(180deg, var(--gold) 0%, var(--gold) 45%, #C98A2E 46%, #8a5c1c 100%);
    box-shadow:0 0 0 4px rgba(255,201,60,0.35), 0 14px 16px rgba(0,0,0,0.3);
  }

  .nameplate{
    margin-top:10px; background:var(--card); padding:5px 12px; border-radius:999px;
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:13px;
    box-shadow:0 3px 8px rgba(0,0,0,0.18); white-space:nowrap;
    display:flex; align-items:center; gap:6px;
  }
  .nameplate .dex{ color:#9AA3AD; font-weight:600; font-size:11px; }
  .island.starter .nameplate{ background:var(--gold); }

  /* ---------- SAND / BEACH FOREGROUND ---------- */
  .sand{
    position:absolute; left:0; right:0; bottom:0; height:16%;
    background:linear-gradient(180deg, var(--sand) 0%, var(--sand-dark) 100%);
    border-top-left-radius:60% 22px; border-top-right-radius:60% 22px;
  }
  .palm{ position:absolute; bottom:15%; font-size:54px; filter:drop-shadow(0 6px 4px rgba(0,0,0,0.2)); user-select:none; }
  .palm.p1{ left:2%; transform:scaleX(-1); }
  .palm.p2{ right:3%; }

  /* ---------- HUD ---------- */
  .hud{
    position:absolute; top:0; left:0; right:0; z-index:10;
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 26px; gap:16px; flex-wrap:wrap;
  }
  .title-block h1{
    margin:0; font-family:'Baloo 2',sans-serif; font-size:22px; font-weight:800;
    color:var(--ink); text-shadow:0 2px 0 rgba(255,255,255,0.5);
  }
  .title-block p{ margin:2px 0 0; font-size:13px; font-weight:700; color:#0B3B52; opacity:0.75; }

  .controls{ display:flex; align-items:center; gap:14px; }
  .counter{
    background:var(--card); padding:8px 16px; border-radius:999px;
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:14px;
    box-shadow:0 4px 10px rgba(0,0,0,0.15);
  }
  #addBtn{
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:16px;
    background:var(--coral); color:#fff; border:none; border-radius:999px;
    padding:13px 24px; cursor:pointer;
    box-shadow:0 6px 0 var(--coral-dark), 0 10px 14px rgba(0,0,0,0.25);
    transition:transform 0.08s ease;
  }
  #addBtn:active{ transform:translateY(4px); box-shadow:0 2px 0 var(--coral-dark), 0 6px 10px rgba(0,0,0,0.2); }
  #addBtn:disabled{ opacity:0.7; cursor:default; }

  /* ---------- TOAST ---------- */
  #toast{
    position:absolute; left:50%; top:90px; transform:translateX(-50%) translateY(-12px);
    background:var(--card); padding:10px 20px; border-radius:14px;
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:15px;
    box-shadow:0 6px 16px rgba(0,0,0,0.25); opacity:0; pointer-events:none; z-index:20;
    transition:opacity 0.25s ease, transform 0.25s ease;
    display:flex; align-items:center; gap:8px;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  #toast img{ width:34px; height:34px; }

  @media (max-width:640px){
    .title-block h1{ font-size:17px; }
    .title-block p{ font-size:11px; }
    #addBtn{ font-size:14px; padding:11px 18px; }
  }  /* ---------- MEGA PIKACHU PLAYER ---------- */
  .player{
    position:absolute; width:96px; height:96px;
    z-index:50; will-change:transform; user-select:none;
    pointer-events:none;
  }
  .player-aura{
    position:absolute; inset:-14px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,230,90,0.55) 0%, rgba(255,201,60,0.25) 55%, transparent 75%);
    animation:auraPulse 1.2s ease-in-out infinite;
  }
  @keyframes auraPulse{
    0%,100%{ transform:scale(0.92); opacity:0.75; }
    50%{ transform:scale(1.08); opacity:1; }
  }
  .player img{
    position:relative; width:100%; height:100%; object-fit:contain;
    filter:drop-shadow(0 10px 8px rgba(0,0,0,0.35))
           drop-shadow(0 0 10px rgba(255,214,0,0.85));
    transition:transform 0.08s linear;
  }
  .player.facing-right img{ transform:scaleX(-1); }
  .player.in-air img{ transform:translateY(-4px); }
  .player.facing-right.in-air img{ transform:scaleX(-1) translateY(-4px); }
  .player-label{
    position:absolute; top:-22px; left:50%; transform:translateX(-50%);
    background:var(--gold); padding:2px 10px; border-radius:999px;
    font-family:'Baloo 2',sans-serif; font-weight:800; font-size:11px;
    white-space:nowrap; box-shadow:0 3px 6px rgba(0,0,0,0.2);
  }
  .dust{
    position:absolute; width:8px; height:8px; border-radius:50%;
    background:rgba(255,255,255,0.85); pointer-events:none; z-index:40;
    animation:dustPop 0.5s ease-out forwards;
  }
  @keyframes dustPop{
    0%{ transform:translate(0,0) scale(1); opacity:0.9; }
    100%{ transform:translate(var(--dx), 6px) scale(0); opacity:0; }
  }
  .sand-trail{
    position:absolute; width:10px; height:7px; border-radius:50%;
    background:linear-gradient(180deg, var(--sand) 0%, var(--sand-dark) 100%);
    pointer-events:none; z-index:39;
    animation:sandTrailPop 0.45s ease-out forwards;
  }
  @keyframes sandTrailPop{
    0%{ transform:translate(0,0) scale(1); opacity:0.85; }
    100%{ transform:translate(var(--sdx), var(--sdy)) scale(0.2); opacity:0; }
  }
  .player.sprinting img{ transform:rotate(-8deg); }
  .player.sprinting.facing-right img{ transform:scaleX(-1) rotate(-8deg); }
  .player.sprinting.in-air img{ transform:rotate(-8deg) translateY(-4px); }
  .player.sprinting.facing-right.in-air img{ transform:scaleX(-1) rotate(-8deg) translateY(-4px); }
  /* ---------- SKY FLYERS (메가레쿠자 / 무한다이노) ---------- */
  .sky-flyer{
    position:absolute; z-index:6; pointer-events:none; will-change:transform;
  }
  .sky-flyer img, .sky-flyer svg{
    display:block; width:100%; height:auto;
    filter:drop-shadow(0 10px 10px rgba(0,0,0,0.3));
    transform:rotate(10deg);
    animation:flyerBob 2.4s ease-in-out infinite;
  }
  .sky-flyer.flip img, .sky-flyer.flip svg{ transform:scaleX(-1) rotate(10deg); }
  @keyframes flyerBob{
    0%,100%{ margin-top:0px; }
    50%{ margin-top:-10px; }
  }
  .flyer-label{
    position:absolute; top:-22px; left:50%; transform:translateX(-50%);
    background:var(--card); padding:2px 10px; border-radius:999px;
    font-family:'Baloo 2',sans-serif; font-weight:800; font-size:11px;
    white-space:nowrap; box-shadow:0 3px 6px rgba(0,0,0,0.2);
  }

  .balloon{
    position:absolute; z-index:7; pointer-events:none;
    font-size:28px; line-height:1;
  }
  .splash{
    position:absolute; z-index:7; pointer-events:none;
    font-size:24px; animation:splashPop 0.45s ease-out forwards;
  }
  @keyframes splashPop{
    0%{ transform:scale(0.5); opacity:1; }
    100%{ transform:scale(1.8); opacity:0; }
  }

  /* ---------- GROUND WALKERS (이로치 그란돈 / 테라키온) ---------- */
  .ground-walker{
    position:absolute; z-index:8; pointer-events:none; will-change:transform;
  }
  .ground-walker img{
    display:block; width:100%; height:auto;
    filter:drop-shadow(0 8px 8px rgba(0,0,0,0.35));
    animation:walkBob 0.55s ease-in-out infinite;
  }
  .ground-walker.flip img{ transform:scaleX(-1); }
  @keyframes walkBob{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-7px); }
  }
  .ground-walker.flip img{ animation:walkBobFlip 0.55s ease-in-out infinite; }
  @keyframes walkBobFlip{
    0%,100%{ transform:scaleX(-1) translateY(0); }
    50%{ transform:scaleX(-1) translateY(-7px); }
  }

  .petal{
    position:absolute; z-index:9; pointer-events:none;
    font-size:20px; line-height:1;
  }

  /* ---------- 누워있는 초대형 다이맥스 잠만보 & 메타몽 ---------- */
  .rest-area{
    position:absolute; z-index:4; width:300px; pointer-events:none;
  }
  .rest-area .snorlax-img{
    width:100%; display:block;
    filter:drop-shadow(0 16px 12px rgba(0,0,0,0.35));
  }
  .rest-area .zzz{
    position:absolute; top:0%; right:6%; font-size:32px;
    animation:zzzFloat 3s ease-in-out infinite;
  }
  @keyframes zzzFloat{
    0%{ transform:translateY(0) scale(0.85); opacity:0.55; }
    50%{ transform:translateY(-20px) scale(1.15); opacity:1; }
    100%{ transform:translateY(-38px) scale(0.85); opacity:0; }
  }
  .rest-area .rest-label{
    position:absolute; bottom:-4px; left:50%; transform:translateX(-50%);
    background:var(--card); padding:3px 12px; border-radius:999px;
    font-family:'Baloo 2',sans-serif; font-weight:800; font-size:12px;
    box-shadow:0 3px 6px rgba(0,0,0,0.2); white-space:nowrap;
  }
  .rest-area .ditto-rider{
    position:absolute; top:10%; left:36%; width:28%;
    filter:drop-shadow(0 6px 6px rgba(0,0,0,0.3));
    animation:dittoPlay 1.1s ease-in-out infinite;
  }
  @keyframes dittoPlay{
    0%,100%{ transform:translateY(0) scale(1,1) rotate(-5deg); }
    50%{ transform:translateY(-16px) scale(1.06,0.94) rotate(5deg); }
  }
</style>
</head>
<body>

<div class="scene">
  <div class="stars-layer" id="starsLayer"></div>
  <div class="moon" id="moonEl"></div>
  <div class="sun" id="sunEl"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>

  <div class="wave-row">
    <div class="wave"></div>
    <div class="wave w2"></div>
  </div>

  <div class="hud">
    <div class="title-block">
      <h1>🏝️ 포켓몬 바닷가 점프맵</h1>
      <p>플랫폼을 점프하며 만나는 포켓몬 대탐험!</p>
    </div>
    <div class="controls">
      <div class="counter">🐾 총 출동 <span id="count">3</span>마리</div>
      <button id="addBtn">➕ 포켓몬 추가!</button>
    </div>
  </div>

  <div id="toast"></div>

  <div class="path-wrap" id="pathWrap">
    <div class="path" id="path"></div>
  </div>

  <div class="sand"></div>
  <div class="palm p1">🌴</div>
  <div class="palm p2">🌴</div>
</div>

<div id="controlsHint" style="position:fixed; left:50%; bottom:14px; transform:translateX(-50%);
  background:rgba(255,253,246,0.92); padding:8px 16px; border-radius:12px;
  font-family:'Baloo 2',sans-serif; font-weight:700; font-size:13px; color:#0B3B52;
  box-shadow:0 4px 10px rgba(0,0,0,0.15); z-index:100;">
  ⬅️➡️ 이동 · ⬆️ / Space 점프 · Shift 달리기
</div>

  const STARTERS = [1, 4, 7];
  const GEN1_MAX = 151;

  const START_X = 90;
  const MIN_GAP = 60;   // 가까운 점프
  const MAX_GAP = 230;  // 멀리 뛰어야 하는 점프
  const ISLAND_WIDTH = 130;
  const ROCK_HEIGHT = 56;
  const OFFSET_LEVELS = [170, 244, 200, 274];
  const PLAYER_WIDTH = 96;
  const PLAYER_HEIGHT = 96;
  const GRAVITY = 0.9;
  const JUMP_VELOCITY = 18;
  const MOVE_SPEED = 4.5;
  const SPRINT_MULTIPLIER = 2.1;
  const BUMP_PUSH = 6;
  const DODGE_DISTANCE = 38;

  const pathEl = document.getElementById('path');
  const pathWrap = document.getElementById('pathWrap');
  const countEl = document.getElementById('count');
  const addBtn = document.getElementById('addBtn');
  const toastEl = document.getElementById('toast');

  let total = 0;
  let nextX = START_X;
  let worldWidth = START_X + ISLAND_WIDTH + 300;
  const platforms = []; // { x0, x1, topY }

  function dexLabel(id) {
    return '#' + String(id).padStart(3, '0');
  }

  function imgSrcFor(id) {
    return `data:image/png;base64,${POKEDATA[id].i}`;
  }

  function showToast(name, id) {
    toastEl.innerHTML = `<img src="${imgSrcFor(id)}" alt=""><span>${name} ${dexLabel(id)} 등장!</span>`;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toastEl.classList.remove('show'), 1800);
  }

  function addIsland(id, isStarter) {
    const idx = total;
    const name = POKEDATA[id].n;
    const x = nextX;
    const offsetY = OFFSET_LEVELS[idx % 4];

    const island = document.createElement('div');
    island.className = 'island' + (isStarter ? ' starter' : '');
    island.style.left = x + 'px';
    island.style.bottom = offsetY + 'px';

    island.innerHTML = `
      <div class="sprite-slot">
        <img class="loaded" src="${imgSrcFor(id)}" alt="${name}">
      </div>
      <div class="rock"></div>
      <div class="nameplate"><span class="dex">${dexLabel(id)}</span> ${name}</div>
    `;

    if (idx > 0) {
      const prev = platforms[idx - 1];
      const prevOffset = OFFSET_LEVELS[(idx - 1) % 4];
      const arrow = document.createElement('span');
      arrow.className = 'jump-arrow';
      arrow.textContent = offsetY >= prevOffset ? '↗️' : '↘️';
      arrow.style.left = ((prev.x1 + x) / 2 - 10) + 'px';
      arrow.style.bottom = (Math.min(offsetY, prevOffset) + 40) + 'px';
      pathEl.appendChild(arrow);
    }

    pathEl.appendChild(island);

    platforms.push({
      x0: x,
      x1: x + ISLAND_WIDTH,
      topY: offsetY + ROCK_HEIGHT,
      spriteEl: island.querySelector('.sprite-slot img'),
      slotEl: island.querySelector('.sprite-slot'),
      displaced: false,
      lastBump: 0
    });

    // 다음 발판까지의 간격을 매번 랜덤하게 정해서 가까운 점프/먼 점프가 섞이도록 함
    const gap = MIN_GAP + Math.random() * (MAX_GAP - MIN_GAP);
    nextX = x + ISLAND_WIDTH + gap;

    worldWidth = x + ISLAND_WIDTH + 300;
    pathEl.style.width = worldWidth + 'px';

    total += 1;
    countEl.textContent = total;
    return { id, name, x, offsetY };
  }

  function addRandomPokemon() {
    const id = Math.floor(Math.random() * GEN1_MAX) + 1;
    const { name } = addIsland(id, false);
    showToast(name, id);
  }

  // 초기 스타트몬 총출동
  STARTERS.forEach((id, i) => {
    setTimeout(() => addIsland(id, true), i * 180);
  });

  addBtn.addEventListener('click', addRandomPokemon);

  // ---------- 메가라이츄 플레이어 (방향키 점프맵 조작) ----------
  const player = document.createElement('div');
  player.className = 'player';
  player.innerHTML = `
    <div class="player-aura"></div>
    <img src="data:image/png;base64,${EXTRA_MONS[10304].i}" alt="메가라이츄">
    <div class="player-label">⚡ 메가라이츄</div>
  `;
  pathEl.appendChild(player);
  const playerImgWrap = player;

  let playerX = START_X + (ISLAND_WIDTH - PLAYER_WIDTH) / 2;
  let playerY = OFFSET_LEVELS[0] + ROCK_HEIGHT;
  let vy = 0;
  let onGround = true;
  let facing = 'right';

  const MAX_JUMPS = 2;
  let jumpsUsed = 0;

  const keys = { left: false, right: false, shift: false };

  function doJump() {
    vy = JUMP_VELOCITY;
    onGround = false;
    jumpsUsed += 1;
    spawnDust(playerX, playerY);
  }

  function tryJump() {
    if (onGround) {
      jumpsUsed = 0;
      doJump();
    } else if (jumpsUsed < MAX_JUMPS) {
      doJump();
    }
  }

  window.addEventListener('keydown', (e) => {
    const isJumpKey = e.key === 'ArrowUp' || e.code === 'Space' || e.key === ' ';
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'Space', ' '].includes(e.key) || e.code === 'Space') {
      e.preventDefault();
    }
    if (e.key === 'ArrowLeft') keys.left = true;
    if (e.key === 'ArrowRight') keys.right = true;
    if (e.key === 'Shift') keys.shift = true;
    if (isJumpKey && !e.repeat) tryJump();
  });
  window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft') keys.left = false;
    if (e.key === 'ArrowRight') keys.right = false;
    if (e.key === 'Shift') keys.shift = false;
  });

  function spawnDust(x, y) {
    for (let i = 0; i < 5; i++) {
      const d = document.createElement('div');
      d.className = 'dust';
      const dx = (Math.random() - 0.5) * 40;
      d.style.setProperty('--dx', dx + 'px');
      d.style.left = (x + PLAYER_WIDTH / 2 - 4) + 'px';

  // 발판(및 바닥)과의 충돌 판정: "이전 위치 → 이번 위치"로 이동하며
  // 발판 윗면을 통과했는지를 스윕 방식으로 검사해 빠르게 떨어질 때 통과되는 문제를 방지
  function findLanding(prevY, newY, left, right) {
    let bestTop = null;
    let bestIndex = -1;
    platforms.forEach((p, idx) => {
      const overlapsX = right > p.x0 && left < p.x1;
      if (!overlapsX) return;
      if (prevY >= p.topY - 0.5 && newY <= p.topY + 0.5) {
        if (bestTop === null || p.topY > bestTop) {
          bestTop = p.topY;
          bestIndex = idx;
        }
      }
    });
    // 모래 바닥(0)도 하나의 발판처럼 취급 (실제 발판은 항상 이보다 높으므로 최후의 안전망 역할)
    if (bestTop === null && prevY >= -0.5 && newY <= 0.5) {
      bestTop = 0;
      bestIndex = -1;
    }
    return bestTop === null ? null : { topY: bestTop, index: bestIndex };
  }

  // 플레이어를 살짝 밀어내고, 포켓몬은 발판 옆으로 비켜선다.
  // 플레이어가 벗어나면 포켓몬은 다시 원래 자리(발판 가운데)로 돌아온다.
  function resolveMonBumps(standingIndex) {
    const playerLeft = playerX;
    const playerRight = playerX + PLAYER_WIDTH;
    const playerBottom = playerY;
    const playerTop = playerY + PLAYER_HEIGHT;
    const playerCenter = playerX + PLAYER_WIDTH / 2;

    platforms.forEach((p, idx) => {
      if (!p.spriteEl || !p.slotEl) return;

      const spriteSize = 112;
      const spriteLeft = p.x0 + (ISLAND_WIDTH - spriteSize) / 2;
      const spriteRight = spriteLeft + spriteSize;
      const spriteBottom = p.topY;
      const spriteTop = p.topY + spriteSize;

      const overlapsX = playerRight > spriteLeft && playerLeft < spriteRight;
      const overlapsY = playerTop > spriteBottom && playerBottom < spriteTop;
      const colliding = idx !== standingIndex && overlapsX && overlapsY;

      if (colliding) {
        const spriteCenter = p.x0 + ISLAND_WIDTH / 2;
        const pushDir = playerCenter < spriteCenter ? -1 : 1; // 플레이어를 미는 방향
        const dodgeDir = -pushDir; // 포켓몬은 플레이어 반대쪽, 발판 옆으로 비켜섬

        playerX += pushDir * BUMP_PUSH;
        p.slotEl.style.transform = `translateX(${dodgeDir * DODGE_DISTANCE}px)`;

        if (!p.displaced) {
          p.displaced = true;
          p.spriteEl.style.setProperty('--bump-dir', (dodgeDir * 12) + 'px');
          p.spriteEl.classList.remove('bumped');
          void p.spriteEl.offsetWidth;
          p.spriteEl.classList.add('bumped');
        }
      } else if (p.displaced) {
        // 플레이어가 벗어났으니 원래 자리로 복귀
        p.slotEl.style.transform = 'translateX(0px)';
        p.displaced = false;
      }
    });

    playerX = Math.max(0, Math.min(playerX, worldWidth - PLAYER_WIDTH));
  }

    const moving = keys.left || keys.right;

    if (keys.left) { playerX -= currentSpeed; facing = 'left'; }
    if (keys.right) { playerX += currentSpeed; facing = 'right'; }

  function hexToRgb(hex) {

  function lerpColor(hexA, hexB, t) {
    const a = hexToRgb(hexA), b = hexToRgb(hexB);
    return rgbToStr([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]);
  }

  // 하루 중 네 시점의 하늘/바다 팔레트 (새벽 → 낮 → 노을 → 밤)
  const SKY_KEYFRAMES = [
    { t: 0.00, skyTop: '#FFB199', skyMid: '#FFD9A0', sea1: '#4FA5C9', sea2: '#1B5C82' }, // 새벽
    { t: 0.25, skyTop: '#FFE07D', skyMid: '#7FD1FF', sea1: '#1CA7EC', sea2: '#0C6FA8' }, // 한낮
    { t: 0.50, skyTop: '#FF7B54', skyMid: '#C86B98', sea1: '#3A6EA5', sea2: '#173F63' }, // 노을
    { t: 0.75, skyTop: '#1B2A4A', skyMid: '#0B1730', sea1: '#0A2A45', sea2: '#04101F' }, // 한밤
    { t: 1.00, skyTop: '#FFB199', skyMid: '#FFD9A0', sea1: '#4FA5C9', sea2: '#1B5C82' }, // 다음 새벽
  ];

  function getSkyPalette(phase) {
    for (let i = 0; i < SKY_KEYFRAMES.length - 1; i++) {
      const a = SKY_KEYFRAMES[i], b = SKY_KEYFRAMES[i + 1];
      if (phase >= a.t && phase <= b.t) {
        const localT = (phase - a.t) / (b.t - a.t);
        return {
          skyTop: lerpColor(a.skyTop, b.skyTop, localT),
          skyMid: lerpColor(a.skyMid, b.skyMid, localT),
          sea1: lerpColor(a.sea1, b.sea1, localT),
          sea2: lerpColor(a.sea2, b.sea2, localT),
        };
      }
    }
    return SKY_KEYFRAMES[0];
  }

  let lastDayNightUpdate = 0;
  const dayNightStart = performance.now();

  function updateDayNightCycle() {
    const now = performance.now();
    if (now - lastDayNightUpdate < 150) return; // 색 변화는 천천히 일어나므로 갱신 빈도를 줄인다
    lastDayNightUpdate = now;

    const phase = ((now - dayNightStart) % DAY_CYCLE_MS) / DAY_CYCLE_MS; // 0~1

    const palette = getSkyPalette(phase);
    sceneEl.style.background =
      `linear-gradient(180deg, ${palette.skyTop} 0%, ${palette.skyMid} 45%, ${palette.sea1} 46%, ${palette.sea2} 100%)`;

    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const horizonY = vh * 0.55; // 태양/달이 오르내리는 기준선(수평선 부근)
    const arcHeight = vh * 0.62;
    const leftX = vw * 0.08;
    const rightX = vw * 0.92;

    // 태양: 낮 구간(0~0.5)에서 왼쪽 수평선 → 정점 → 오른쪽 수평선
    if (phase <= 0.5) {
      const dayT = phase / 0.5; // 0~1
      const sunX = leftX + (rightX - leftX) * dayT;
      const sunY = Math.sin(dayT * Math.PI) * arcHeight;
      sunEl.style.left = (sunX - 45) + 'px';
      sunEl.style.bottom = (horizonY * 0 + sunY) + 'px';
      sunEl.style.opacity = String(Math.min(1, dayT * 8, (1 - dayT) * 8 + 0.15));
    } else {
      sunEl.style.opacity = '0';
    }

    // 달: 밤 구간(0.5~1.0)에서 같은 방식으로 오르내림
    if (phase > 0.5) {
      const nightT = (phase - 0.5) / 0.5; // 0~1
      const moonX = leftX + (rightX - leftX) * nightT;
      const moonY = Math.sin(nightT * Math.PI) * arcHeight * 0.85;
      moonEl.style.left = (moonX - 32) + 'px';
      moonEl.style.bottom = moonY + 'px';
      moonEl.style.opacity = String(Math.min(1, nightT * 8, (1 - nightT) * 8 + 0.15));
    } else {
      moonEl.style.opacity = '0';
    }

    // 별: 노을 후반~밤에 서서히 나타났다가 새벽 전에 사라짐
    let starOpacity = 0;
    if (phase > 0.45 && phase <= 0.55) starOpacity = (phase - 0.45) / 0.10;
    else if (phase > 0.55 && phase <= 0.92) starOpacity = 1;
    else if (phase > 0.92 && phase <= 1.0) starOpacity = 1 - (phase - 0.92) / 0.08;
    starsLayerEl.style.opacity = String(Math.max(0, Math.min(1, starOpacity)));
  }

  // ---------- 수평선 멀리서 헤엄치는 물타입 포켓몬들 ----------
  const SWIMMERS = [
    { id: 7,   topPct: 45.4, speed: 0.22, dir: 1,  x: -80,  width: 34 },  // 꼬부기
    { id: 54,  topPct: 44.7, speed: 0.32, dir: -1, x: window.innerWidth + 120, width: 34 }, // 파오리
    { id: 129, topPct: 46.1, speed: 0.4,  dir: 1,  x: -260, width: 26 },  // 잉어킹
    { id: 131, topPct: 44.9, speed: 0.18, dir: -1, x: window.innerWidth + 300, width: 58 }, // 라프라스
    { id: 134, topPct: 46.4, speed: 0.28, dir: 1,  x: -440, width: 36 },  // 샤미드
  ];

  SWIMMERS.forEach((s) => {
    const el = document.createElement('div');
    el.className = 'swimmer';
    el.style.top = s.topPct + '%';
    el.style.width = s.width + 'px';
    el.innerHTML = `<img src="${imgSrcFor(s.id)}" alt="">`;
    sceneEl.appendChild(el);
    s.el = el;
  });

  function updateSwimmers() {
    const vw = window.innerWidth;
    SWIMMERS.forEach((s) => {
      s.x += s.speed * s.dir;
      if (s.dir === 1 && s.x > vw + 80) s.dir = -1;
      if (s.dir === -1 && s.x < -s.width - 80) s.dir = 1;
      s.el.style.left = s.x + 'px';
      s.el.classList.toggle('flip', s.dir === 1);
    });
  }

  requestAnimationFrame(gameLoop);
</script>
