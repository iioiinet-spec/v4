<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>거미줄 히어로 시티</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#2b2f6b; --sky-mid:#6a4b8f; --sky-bot:#e8804f;
    --moon:#fff4d6; --card:#FFFDF6; --ink:#0B3B52;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; font-family:'Nunito',sans-serif; background:#111; }
  .scene{ position:relative; width:100%; height:100vh; cursor:crosshair;
    background:linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 45%, var(--sky-bot) 100%);
    overflow:hidden; }

  .moon{ position:absolute; top:8%; right:10%; width:70px; height:70px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fffef2, var(--moon) 60%, #e9d9a0 100%);
    box-shadow:0 0 40px 10px rgba(255,244,214,0.35); }
  .star{ position:absolute; width:2px; height:2px; background:#fff; border-radius:50%;
    animation:tw 2.4s ease-in-out infinite; }
  @keyframes tw{ 0%,100%{ opacity:0.2; } 50%{ opacity:0.9; } }

  .hud{ position:absolute; top:0; left:0; right:0; z-index:30; padding:18px 24px;
    display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .hud h1{ margin:0; font-family:'Baloo 2',sans-serif; font-size:20px; color:#fff;
    text-shadow:0 2px 6px rgba(0,0,0,0.5); }
  .hud p{ margin:4px 0 0; font-size:13px; color:#ffe9d6; font-weight:700; }
  #addBuildingBtn{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:14px;
    background:#ffb347; color:#3a2200; border:none; border-radius:999px; padding:11px 20px; cursor:pointer;
    box-shadow:0 5px 0 #cc8a2c, 0 8px 12px rgba(0,0,0,0.35); transition:transform 0.08s ease; }
  #addBuildingBtn:active{ transform:translateY(4px); box-shadow:0 1px 0 #cc8a2c, 0 4px 8px rgba(0,0,0,0.3); }

  .city-wrap{ position:absolute; left:0; right:0; bottom:0; height:78%; z-index:5; overflow-x:auto; overflow-y:hidden; }
  .city-wrap::-webkit-scrollbar{ height:10px; }
  .city-wrap::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.4); border-radius:10px; }
  .city{ display:flex; align-items:flex-end; gap:18px; padding:0 3vw; height:100%; width:max-content; }

  .building{ position:relative; flex:0 0 auto; cursor:pointer;
    background:linear-gradient(180deg, #2b2440 0%, #1c1830 100%);
    border-top:3px solid #3a3355; border-radius:4px 4px 0 0;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,0.03);
    transition:filter 0.15s ease, transform 0.15s ease;
  }
  .building:hover{ filter:brightness(1.25); transform:translateY(-2px); }
  .building.active{ filter:brightness(1.4); box-shadow:0 0 0 2px rgba(255,210,60,0.6), inset 0 0 0 1px rgba(255,255,255,0.05); }
  .windows{ position:absolute; inset:10px 8px; display:grid; gap:8px;
    grid-template-columns:repeat(var(--cols),1fr); }
  .win{ background:rgba(255,214,120,0.08); border-radius:1px; }
  .win.lit{ background:rgba(255,214,120,0.85); box-shadow:0 0 6px 1px rgba(255,214,120,0.5); }
  .roof-label{ position:absolute; top:-26px; left:50%; transform:translateX(-50%);
    background:var(--card); padding:2px 8px; border-radius:8px; font-family:'Baloo 2',sans-serif;
    font-size:10px; font-weight:700; color:var(--ink); white-space:nowrap; opacity:0; pointer-events:none;
    transition:opacity 0.15s ease; }
  .building:hover .roof-label{ opacity:1; }

  /* ---------- 거미줄 & 히어로 ---------- */
  #shotLayer{ position:absolute; inset:0; z-index:20; pointer-events:none; }
  .web-shot{ position:absolute; height:2px; background:linear-gradient(90deg, rgba(255,255,255,0.1), rgba(255,255,255,0.95));
    transform-origin:left center; border-radius:2px; }

  .rig{ position:absolute; width:2px; z-index:21; transform-origin:top center; pointer-events:none; }
  .rig .thread{ position:absolute; top:0; left:0; width:2px; height:100%;
    background:repeating-linear-gradient(180deg, rgba(255,255,255,0.9) 0 4px, rgba(255,255,255,0.35) 4px 8px); }
  .rig .anchor-dot{ position:absolute; top:-4px; left:50%; transform:translateX(-50%);
    width:8px; height:8px; border-radius:50%; background:#fff; box-shadow:0 0 6px 2px rgba(255,255,255,0.7); }

  .hero{ position:absolute; left:50%; bottom:-2px; width:40px; height:60px;
    transform:translateX(-50%) rotate(180deg); }
  .hero svg{ width:100%; height:100%; display:block; filter:drop-shadow(0 4px 6px rgba(0,0,0,0.4)); }

  #toast{ position:absolute; left:50%; top:80px; transform:translateX(-50%) translateY(-10px);
    background:var(--card); padding:8px 18px; border-radius:12px; font-family:'Baloo 2',sans-serif;
    font-weight:700; font-size:13px; color:var(--ink); box-shadow:0 6px 14px rgba(0,0,0,0.3);
    opacity:0; transition:opacity 0.2s ease, transform 0.2s ease; z-index:40; white-space:nowrap; }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="scene" id="scene">
  <div class="moon"></div>
  <div id="starsLayer"></div>

  <div class="hud">
    <div>
      <h1>🕸️ 거미줄 히어로 시티</h1>
      <p>건물을 클릭하면 거미줄을 쏘아 웹스윙해요!</p>
    </div>
    <button id="addBuildingBtn">🏗️ 건물 추가</button>
  </div>

  <div id="toast"></div>

  <div class="city-wrap" id="cityWrap">
    <div class="city" id="city"></div>
  </div>
  <div id="shotLayer"></div>
  <div class="rig" id="rig">
    <div class="thread"></div>
    <div class="anchor-dot"></div>
    <div class="hero">
      <svg viewBox="0 0 40 62" xmlns="http://www.w3.org/2000/svg">
        <line x1="14" y1="40" x2="7" y2="59" stroke="#1d3faa" stroke-width="6" stroke-linecap="round"/>
        <line x1="26" y1="40" x2="33" y2="59" stroke="#1d3faa" stroke-width="6" stroke-linecap="round"/>
        <rect x="9" y="17" width="22" height="27" rx="9" fill="#d4222c"/>
        <path d="M9 24 Q20 30 31 24" stroke="#1d3faa" stroke-width="2.5" fill="none" opacity="0.85"/>
        <line x1="10" y1="23" x2="2" y2="9" stroke="#d4222c" stroke-width="6" stroke-linecap="round"/>
        <line x1="30" y1="23" x2="38" y2="9" stroke="#d4222c" stroke-width="6" stroke-linecap="round"/>
        <circle cx="20" cy="10" r="10.5" fill="#d4222c"/>
        <path d="M11 8 Q20 2 29 8" stroke="#1d3faa" stroke-width="2" fill="none"/>
        <ellipse cx="14.5" cy="9.5" rx="4.6" ry="3.2" fill="#fff"/>
        <ellipse cx="25.5" cy="9.5" rx="4.6" ry="3.2" fill="#fff"/>
        <ellipse cx="14.5" cy="9.5" rx="4.6" ry="3.2" fill="none" stroke="#1d3faa" stroke-width="1.4"/>
        <ellipse cx="25.5" cy="9.5" rx="4.6" ry="3.2" fill="none" stroke="#1d3faa" stroke-width="1.4"/>
      </svg>
    </div>
  </div>
</div>

<script>
  const sceneEl = document.getElementById('scene');
  const cityEl = document.getElementById('city');
  const cityWrapEl = document.getElementById('cityWrap');
  const rigEl = document.getElementById('rig');
  const shotLayerEl = document.getElementById('shotLayer');
  const toastEl = document.getElementById('toast');
  const starsLayerEl = document.getElementById('starsLayer');

  // ---------- 별 배치 ----------
  for (let i = 0; i < 60; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 55 + '%';
    s.style.animationDelay = (Math.random() * 2.4) + 's';
    starsLayerEl.appendChild(s);
  }

  // ---------- 빌딩 생성 ----------
  const BUILDING_DEFS = [
    { w: 110, h: 260, name: '실버타워' },
    { w: 150, h: 380, name: '오션빌딩' },
    { w: 95,  h: 200, name: '코너하우스' },
    { w: 170, h: 460, name: '센트럴타워' },
    { w: 120, h: 300, name: '골든오피스' },
    { w: 140, h: 340, name: '문라이트빌딩' },
    { w: 100, h: 230, name: '스카이뷰' },
  ];
  const NAME_PARTS_A = ['스타', '레인보우', '펄', '노바', '크리스탈', '메트로', '선셋', '블루', '골드', '네온'];
  const NAME_PARTS_B = ['타워', '빌딩', '플라자', '센터', '스카이라인', '하우스', '오피스'];

  const buildings = [];

  function createBuilding(def) {
    const el = document.createElement('div');
    el.className = 'building';
    el.style.width = def.w + 'px';
    el.style.height = def.h + 'px';

    const cols = Math.max(2, Math.floor(def.w / 26));
    const rows = Math.max(3, Math.floor(def.h / 30));
    const windowsEl = document.createElement('div');
    windowsEl.className = 'windows';
    windowsEl.style.setProperty('--cols', cols);
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const win = document.createElement('div');
        win.className = 'win' + (Math.random() < 0.4 ? ' lit' : '');
        windowsEl.appendChild(win);
      }
    }
    el.appendChild(windowsEl);

    const label = document.createElement('div');
    label.className = 'roof-label';
    label.textContent = def.name;
    el.appendChild(label);

    cityEl.appendChild(el);
    const record = { el, name: def.name, index: buildings.length };
    buildings.push(record);
    return record;
  }

  BUILDING_DEFS.forEach((def) => createBuilding(def));

  // 건물 추가 버튼: 누를 때마다 오른쪽 끝에 랜덤한 새 건물이 생김
  document.getElementById('addBuildingBtn').addEventListener('click', () => {
    const w = 90 + Math.floor(Math.random() * 100);
    const h = 190 + Math.floor(Math.random() * 320);
    const name = NAME_PARTS_A[Math.floor(Math.random() * NAME_PARTS_A.length)] +
                 NAME_PARTS_B[Math.floor(Math.random() * NAME_PARTS_B.length)];
    createBuilding({ w, h, name });

    // 새로 생긴 건물이 보이도록 오른쪽 끝으로 스크롤
    cityWrapEl.scrollTo({ left: cityWrapEl.scrollWidth, behavior: 'smooth' });
  });

  // ---------- 거미줄 히어로 물리 ----------
  const HANG_LEN = 92;        // 평소 매달려 있을 때의 짧은 거미줄 길이
  let currentPivot = { x: 0, y: 0 };   // 실제 거미줄이 박혀있는 고정 지점
  let currentTheta = 0;
  let currentRadius = HANG_LEN;
  let mode = 'idle'; // 'idle' | 'swinging'
  let swingStart = 0;
  let swingDuration = 950;
  let swingFromPos = { x: 0, y: 0 };
  let swingHangPos = { x: 0, y: 0 };
  let swingControlPos = { x: 0, y: 0 };
  let idleStartTime = performance.now();

  function getAnchorPoint(buildingIndex) {
    const rect = buildings[buildingIndex].el.getBoundingClientRect();
    const sceneRect = sceneEl.getBoundingClientRect();
    return {
      x: rect.left - sceneRect.left + rect.width / 2,
      y: rect.top - sceneRect.top,
    };
  }

  function heroAbsPos() {
    return {
      x: currentPivot.x + currentRadius * Math.sin(currentTheta),
      y: currentPivot.y + currentRadius * Math.cos(currentTheta),
    };
  }

  function showToast(text) {
    toastEl.textContent = text;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toastEl.classList.remove('show'), 1200);
  }

  function spawnWebShot(from, to, onDone) {
    const dx = to.x - from.x, dy = to.y - from.y;
    const dist = Math.hypot(dx, dy);
    const angle = Math.atan2(dy, dx) * (180 / Math.PI);

    const shot = document.createElement('div');
    shot.className = 'web-shot';
    shot.style.left = from.x + 'px';
    shot.style.top = from.y + 'px';
    shot.style.width = dist + 'px';
    shot.style.transform = `rotate(${angle}deg) scaleX(0)`;
    shot.style.transition = 'transform 0.22s ease-out';
    shotLayerEl.appendChild(shot);

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        shot.style.transform = `rotate(${angle}deg) scaleX(1)`;
      });
    });

    setTimeout(() => {
      shot.remove();
      onDone();
    }, 240);
  }

  // 클릭한 지점(targetPoint, scene 기준 좌표)에 거미줄을 쏘고,
  // 그 지점에 줄을 고정한 채 아래로 떨어졌다가 위로 올라가며 웹스윙으로 이동
  function swingToPoint(targetPoint, label) {
    if (mode === 'swinging') return;

    const fromPos = heroAbsPos();
    const dx0 = targetPoint.x - fromPos.x, dy0 = targetPoint.y - fromPos.y;
    const clickDist = Math.hypot(dx0, dy0);
    if (clickDist < 12) return; // 너무 가까우면 무시

    spawnWebShot(fromPos, targetPoint, () => {
      currentPivot = targetPoint; // 거미줄은 쏜 지점에 그대로 고정
      swingFromPos = fromPos;
      swingHangPos = { x: targetPoint.x, y: targetPoint.y + HANG_LEN }; // 최종 매달릴 위치(그 지점 바로 아래)

      // 이동 경로 중간을 아래로 크게 늘어뜨려 "떨어졌다가 올라가는" 궤적을 만든다
      const dipAmount = Math.min(260, clickDist * 0.45 + 40);
      swingControlPos = {
        x: (swingFromPos.x + swingHangPos.x) / 2,
        y: Math.max(swingFromPos.y, swingHangPos.y) + dipAmount,
      };

      swingStart = performance.now();
      mode = 'swinging';
      showToast(`🕸️ ${label} 웹스윙!`);
    });
  }

  function easeInOutSine(t) {
    return -(Math.cos(Math.PI * t) - 1) / 2;
  }

  function updateRig() {
    rigEl.style.left = currentPivot.x + 'px';
    rigEl.style.top = currentPivot.y + 'px';
    rigEl.style.height = currentRadius + 'px';
    // CSS rotate()는 시계방향이라, 우리 위치 공식(x=r·sinθ)과 좌우가 반대로 렌더링되는 것을 보정
    rigEl.style.transform = `rotate(${-currentTheta}rad)`;
  }

  function tick(now) {
    if (mode === 'swinging') {
      const t = Math.min(1, (now - swingStart) / swingDuration);
      const e = easeInOutSine(t);
      const inv = 1 - e;

      // 이차 베지어 곡선: 출발점 → (아래로 처진) 제어점 → 매달릴 위치
      const heroX = inv * inv * swingFromPos.x + 2 * inv * e * swingControlPos.x + e * e * swingHangPos.x;
      const heroY = inv * inv * swingFromPos.y + 2 * inv * e * swingControlPos.y + e * e * swingHangPos.y;

      // 실제 거미줄(고정된 currentPivot)을 기준으로, 방금 구한 위치에 맞춰 로프 길이/각도를 역산
      const dx = heroX - currentPivot.x, dy = heroY - currentPivot.y;
      currentRadius = Math.hypot(dx, dy);
      currentTheta = Math.atan2(dx, dy);

      if (t >= 1) {
        currentTheta = 0;
        currentRadius = HANG_LEN;
        mode = 'idle';
        idleStartTime = now;
      }
    } else {
      const elapsed = (now - idleStartTime) / 1000;
      currentTheta = Math.sin(elapsed * 1.1) * 0.09;
      // 주기적으로 아래로 살짝 처졌다가 원래 자리로 돌아오는 동작 (내려가는 절반만, 나머지 절반은 원위치에서 대기)
      const dipWave = Math.max(0, Math.sin(elapsed * 0.8));
      currentRadius = HANG_LEN + dipWave * 22;
    }
    updateRig();
    requestAnimationFrame(tick);
  }

  // ---------- 초기화 & 클릭으로 웹스윙 ----------
  const START_BUILDING = 1;

  sceneEl.addEventListener('click', (e) => {
    if (e.target.closest('.hud') || e.target.closest('#toast')) return;

    const buildingEl = e.target.closest('.building');
    if (!buildingEl) return; // 건물이 아닌 곳은 거미줄을 쏠 수 없음

    const record = buildings.find((b) => b.el === buildingEl);
    const point = getAnchorPoint(record.index);

    swingToPoint(point, record.name);
  });

  requestAnimationFrame(() => {
    currentPivot = getAnchorPoint(START_BUILDING);
    requestAnimationFrame(tick);
  });
</script>

</body>
</html>
