<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>거미줄 히어로 시티</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-0:#080b23; --sky-1:#1b1f52; --sky-2:#4a3273; --sky-3:#a04a6a; --sky-4:#f0864c;
    --moon:#fff4d6; --card:#FFFDF6; --ink:#0B3B52;
    --glass:#59e8ff; --suit:#232a4d; --suit-dark:#0e1230;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; overflow:hidden;
    font-family:'Nunito',system-ui,sans-serif; background:#05060f; }

  .scene{ position:relative; width:100%; height:100vh; cursor:crosshair; overflow:hidden;
    background:linear-gradient(180deg,
      var(--sky-0) 0%, var(--sky-1) 26%, var(--sky-2) 52%, var(--sky-3) 76%, var(--sky-4) 100%); }

  /* ---------- 하늘: 대기광 + 은하 ---------- */
  .glow-horizon{ position:absolute; left:-10%; right:-10%; bottom:8%; height:52%; z-index:1;
    background:radial-gradient(ellipse 60% 100% at 50% 100%,
      rgba(255,168,92,0.55) 0%, rgba(214,96,110,0.28) 38%, rgba(120,60,130,0) 72%);
    filter:blur(2px); pointer-events:none; }
  .glow-moon{ position:absolute; top:-6%; right:-2%; width:46%; height:52%; z-index:1;
    background:radial-gradient(circle at 62% 42%,
      rgba(255,244,214,0.30) 0%, rgba(255,238,196,0.12) 32%, rgba(255,230,180,0) 66%);
    pointer-events:none; }
  .milky{ position:absolute; inset:0 0 40% 0; z-index:1; opacity:.5; pointer-events:none;
    background:radial-gradient(ellipse 42% 120% at 22% 10%, rgba(150,180,255,0.16), rgba(0,0,0,0) 70%),
               radial-gradient(ellipse 30% 90% at 68% 4%, rgba(255,180,220,0.10), rgba(0,0,0,0) 70%); }

  .moon{ position:absolute; top:8%; right:10%; width:78px; height:78px; border-radius:50%; z-index:2;
    background:radial-gradient(circle at 34% 30%, #fffef4 0%, var(--moon) 55%, #e2cb92 100%);
    box-shadow:0 0 26px 6px rgba(255,244,214,0.45), 0 0 80px 26px rgba(255,236,190,0.18); }
  .moon::before,.moon::after{ content:''; position:absolute; border-radius:50%;
    background:rgba(196,172,120,0.30); }
  .moon::before{ width:17px; height:17px; top:26%; left:24%; box-shadow:26px 14px 0 -3px rgba(196,172,120,0.24); }
  .moon::after{ width:11px; height:11px; bottom:22%; left:44%; box-shadow:-13px -6px 0 -2px rgba(196,172,120,0.20); }

  #starsLayer{ position:absolute; inset:0; z-index:1; pointer-events:none; }
  .star{ position:absolute; background:#fff; border-radius:50%; animation:tw 2.4s ease-in-out infinite; }
  .star.big{ box-shadow:0 0 6px 1px rgba(255,255,255,0.8); }
  @keyframes tw{ 0%,100%{ opacity:0.15; } 50%{ opacity:0.95; } }

  .clouds{ position:absolute; inset:0; z-index:2; pointer-events:none; overflow:hidden; }
  .cloud{ position:absolute; border-radius:50%; filter:blur(14px); opacity:.36;
    background:linear-gradient(180deg, rgba(255,190,170,0.75), rgba(90,60,110,0.15)); }

  /* ---------- 원경 / 중경 스카이라인 (시차 스크롤) ---------- */
  .layer{ position:absolute; left:0; bottom:0; z-index:3; pointer-events:none;
    will-change:transform; }
  .layer svg{ display:block; height:100%; }
  #skyFar{ height:36%; opacity:.55; filter:blur(1.1px); }
  #skyMid{ height:52%; opacity:.85; z-index:4; }

  .haze{ position:absolute; left:0; right:0; bottom:0; height:38%; z-index:6; pointer-events:none;
    background:linear-gradient(180deg, rgba(240,134,76,0) 0%, rgba(226,120,96,0.20) 55%, rgba(60,30,60,0.45) 100%); }

  /* ---------- HUD ---------- */
  .hud{ position:absolute; top:0; left:0; right:0; z-index:40; padding:18px 24px;
    display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .hud h1{ margin:0; font-family:'Baloo 2',sans-serif; font-size:21px; color:#fff; letter-spacing:.3px;
    text-shadow:0 2px 10px rgba(0,0,0,0.6); }
  .hud p{ margin:5px 0 0; font-size:13px; color:#ffe3cb; font-weight:700;
    text-shadow:0 1px 6px rgba(0,0,0,0.55); }
  #addBuildingBtn{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:14px;
    background:linear-gradient(180deg,#ffc663,#ff9f34); color:#3a2200; border:none; border-radius:999px;
    padding:11px 20px; cursor:pointer;
    box-shadow:0 5px 0 #c47c22, 0 10px 18px rgba(0,0,0,0.4); transition:transform .08s ease; }
  #addBuildingBtn:active{ transform:translateY(4px); box-shadow:0 1px 0 #c47c22, 0 4px 10px rgba(0,0,0,0.35); }

  /* ---------- 인터랙티브 도시 ---------- */
  .city-wrap{ position:absolute; left:0; right:0; bottom:0; height:78%; z-index:8;
    overflow-x:auto; overflow-y:hidden; }
  .city-wrap::-webkit-scrollbar{ height:10px; }
  .city-wrap::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.35); border-radius:10px; }
  .city{ display:flex; align-items:flex-end; gap:20px; padding:0 3vw; height:100%; width:max-content; }

  .building{ position:relative; flex:0 0 auto; cursor:pointer; border-radius:3px 3px 0 0;
    background:linear-gradient(100deg, #171436 0%, #241f4a 38%, #2e2757 62%, #191532 100%);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,0.05),
               inset -14px 0 26px -12px rgba(255,206,150,0.30),
               inset 16px 0 30px -14px rgba(0,0,0,0.65),
               0 -2px 34px rgba(10,6,26,0.55);
    transition:filter .16s ease, transform .16s ease; }
  /* 달빛을 받는 오른쪽 모서리 */
  .building::after{ content:''; position:absolute; top:0; right:0; width:2px; height:100%;
    background:linear-gradient(180deg, rgba(255,232,190,0.75), rgba(255,190,140,0.12));
    border-radius:0 3px 0 0; }
  /* 옥상 파라펫 */
  .building::before{ content:''; position:absolute; top:-5px; left:-3px; right:-3px; height:6px;
    border-radius:3px; background:linear-gradient(180deg,#3b3468,#221d44);
    box-shadow:0 1px 0 rgba(255,225,190,0.25) inset; }
  .building:hover{ filter:brightness(1.22) saturate(1.1); transform:translateY(-3px); }
  .building.active{ filter:brightness(1.35); }

  .windows{ position:absolute; inset:14px 9px 0; display:grid; gap:7px;
    grid-template-columns:repeat(var(--cols),1fr); align-content:start; }
  .win{ background:rgba(150,170,220,0.07); border-radius:1px; min-height:9px;
    box-shadow:inset 0 -1px 0 rgba(0,0,0,0.35); }
  .win.lit{ background:linear-gradient(180deg, rgba(255,228,164,0.95), rgba(255,190,110,0.75));
    box-shadow:0 0 7px 1px rgba(255,206,120,0.55), inset 0 -1px 0 rgba(180,120,40,0.5); }
  .win.cool{ background:linear-gradient(180deg, rgba(178,226,255,0.9), rgba(120,180,235,0.7));
    box-shadow:0 0 7px 1px rgba(140,200,255,0.5); }
  .win.half{ background:linear-gradient(180deg, rgba(255,228,164,0.9) 55%, rgba(40,34,70,0.9) 55%); }
  .win.flick{ animation:flick 3.6s steps(1,end) infinite; }
  @keyframes flick{ 0%,86%,100%{ opacity:1; } 88%{ opacity:.28; } 92%{ opacity:1; } 95%{ opacity:.4; } }

  /* 옥상 구조물 */
  .roof-kit{ position:absolute; left:0; right:0; bottom:100%; height:44px; pointer-events:none; }
  .rk{ position:absolute; bottom:0; background:linear-gradient(180deg,#3a336a,#1e1a3d);
    box-shadow:0 0 0 1px rgba(0,0,0,0.4); }
  .rk.mast{ width:2px; background:linear-gradient(180deg,#6d6499,#2a2450); }
  .rk.mast::after{ content:''; position:absolute; top:-4px; left:-2px; width:6px; height:6px;
    border-radius:50%; background:#ff5a5a; box-shadow:0 0 8px 2px rgba(255,90,90,0.75);
    animation:beacon 1.8s ease-in-out infinite; }
  @keyframes beacon{ 0%,100%{ opacity:.25; } 50%{ opacity:1; } }
  .rk.tank{ border-radius:4px 4px 2px 2px; }

  .roof-label{ position:absolute; top:-58px; left:50%; transform:translateX(-50%) translateY(4px);
    background:var(--card); padding:3px 10px; border-radius:9px; font-family:'Baloo 2',sans-serif;
    font-size:10.5px; font-weight:700; color:var(--ink); white-space:nowrap; opacity:0; pointer-events:none;
    box-shadow:0 4px 10px rgba(0,0,0,0.4); transition:opacity .16s ease, transform .16s ease; z-index:5; }
  .building:hover .roof-label{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---------- 거미줄 & 히어로 ---------- */
  #shotLayer{ position:absolute; inset:0; z-index:20; pointer-events:none; }
  .web-shot{ position:absolute; height:3px; border-radius:3px; transform-origin:left center;
    background:linear-gradient(90deg, rgba(255,255,255,0.05), rgba(210,245,255,0.6) 45%, #ffffff 100%);
    filter:drop-shadow(0 0 5px rgba(140,225,255,0.85)); }
  .burst{ position:absolute; width:14px; height:14px; margin:-7px 0 0 -7px; border-radius:50%;
    border:2px solid rgba(160,235,255,0.9); animation:burst .45s ease-out forwards; }
  @keyframes burst{ from{ transform:scale(.3); opacity:1; } to{ transform:scale(3.2); opacity:0; } }
  .trail{ position:absolute; width:9px; height:9px; margin:-4.5px 0 0 -4.5px; border-radius:50%;
    background:radial-gradient(circle, rgba(120,225,255,0.75), rgba(120,225,255,0));
    animation:trail .55s ease-out forwards; }
  @keyframes trail{ from{ transform:scale(1); opacity:.8; } to{ transform:scale(.2); opacity:0; } }

  .rig{ position:absolute; width:2px; z-index:21; transform-origin:top center; pointer-events:none; }
  .rig .thread{ position:absolute; top:0; left:0; width:2px; height:100%;
    background:repeating-linear-gradient(180deg,
      rgba(255,255,255,0.95) 0 5px, rgba(170,230,255,0.35) 5px 10px);
    filter:drop-shadow(0 0 4px rgba(150,225,255,0.7)); }
  .rig .anchor-dot{ position:absolute; top:-5px; left:50%; transform:translateX(-50%);
    width:10px; height:10px; border-radius:50%;
    background:radial-gradient(circle at 35% 32%, #ffffff, #9fe9ff 70%, #4ec2e6 100%);
    box-shadow:0 0 10px 3px rgba(140,225,255,0.8); }

  .hero{ position:absolute; left:50%; bottom:-6px; width:60px; height:98px;
    transform:translateX(-50%) rotate(180deg); }
  .hero svg{ width:100%; height:100%; display:block; overflow:visible;
    filter:drop-shadow(0 3px 7px rgba(0,0,0,0.65)); }
  .hero .body-outline{ stroke:#c2d4ff; stroke-opacity:.42; }
  .hero .arm-reach{ transform-origin:15px 39px; transition:transform .28s ease; }
  .hero.swinging .arm-reach{ transform:rotate(-26deg); }
  .hero .sash{ transform-origin:22px 33px; animation:sash 2.6s ease-in-out infinite; }
  .hero.swinging .sash{ animation-duration:.9s; }
  @keyframes sash{ 0%,100%{ transform:rotate(-5deg) scaleY(1); } 50%{ transform:rotate(6deg) scaleY(1.06); } }

  /* ---------- 화면 마감 ---------- */
  .vignette{ position:absolute; inset:0; z-index:34; pointer-events:none;
    background:radial-gradient(ellipse 74% 68% at 50% 46%, rgba(0,0,0,0) 55%, rgba(4,3,14,0.62) 100%); }
  .grain{ position:absolute; inset:0; z-index:35; pointer-events:none; opacity:.10;
    mix-blend-mode:overlay; background-repeat:repeat; }

  #toast{ position:absolute; left:50%; top:84px; transform:translateX(-50%) translateY(-10px);
    background:var(--card); padding:9px 20px; border-radius:12px; font-family:'Baloo 2',sans-serif;
    font-weight:700; font-size:13px; color:var(--ink); box-shadow:0 8px 18px rgba(0,0,0,0.4);
    opacity:0; transition:opacity .2s ease, transform .2s ease; z-index:41; white-space:nowrap; }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="scene" id="scene">
  <div class="milky"></div>
  <div id="starsLayer"></div>
  <div class="glow-moon"></div>
  <div class="moon"></div>
  <div class="clouds" id="cloudsLayer"></div>
  <div class="glow-horizon"></div>

  <div class="layer" id="skyFar"></div>
  <div class="layer" id="skyMid"></div>

  <div class="hud">
    <div>
      <h1>🕸️ 거미줄 히어로 시티</h1>
      <p>건물을 클릭하면 거미줄을 쏘아 웹스윙해요!</p>
    </div>
    <button id="addBuildingBtn">🏗️ 건물 추가</button>
  </div>

  <div id="toast"></div>

  <div class="city-wrap" id="cityWrap">
    <div class="city" id="city"></div>
  </div>
  <div class="haze"></div>
  <div id="shotLayer"></div>

  <div class="rig" id="rig">
    <div class="thread"></div>
    <div class="anchor-dot"></div>
    <div class="hero" id="hero">
      <svg viewBox="0 0 44 72" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="gRed" x1="0.2" y1="0" x2="0.85" y2="1">
            <stop offset="0%" stop-color="#f2555c"/>
            <stop offset="52%" stop-color="#d8262f"/>
            <stop offset="100%" stop-color="#96101c"/>
          </linearGradient>
          <linearGradient id="gNavy" x1="0.2" y1="0" x2="0.85" y2="1">
            <stop offset="0%" stop-color="#5c70c8"/>
            <stop offset="55%" stop-color="#3d4fa4"/>
            <stop offset="100%" stop-color="#232d6f"/>
          </linearGradient>
          <linearGradient id="gVisor" x1="0" y1="0" x2="0.4" y2="1">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="55%" stop-color="#9df0ff"/>
            <stop offset="100%" stop-color="#4bbcdd"/>
          </linearGradient>
          <linearGradient id="gSash" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0%" stop-color="#4fb9e0" stop-opacity="0.05"/>
            <stop offset="100%" stop-color="#bdeeff" stop-opacity="0.7"/>
          </linearGradient>
        </defs>

        <g stroke="#0d1128" stroke-linecap="round" stroke-linejoin="round">

          <!-- 뒤로 흐르는 짧은 망토 -->
          <g class="sash" stroke="none">
            <path d="M17 32 Q12 24 14 16 Q18 24 21 31 Z" fill="url(#gSash)"/>
            <path d="M27 32 Q31 25 30 18 Q27 25 23 31 Z" fill="url(#gSash)" opacity="0.6"/>
          </g>

          <!-- 다리 (굵고 짧게) -->
          <path d="M18 51 L16 65" stroke-width="12"/>
          <path d="M26 51 L28 65" stroke-width="12"/>
          <path d="M18 51 L16 65" stroke="#3d4fa4" stroke-width="8.5"/>
          <path d="M26 51 L28 65" stroke="#3d4fa4" stroke-width="8.5"/>
          <!-- 부츠 -->
          <path d="M15.9 67.5 L15.7 69.5" stroke-width="10.5" stroke-linecap="butt"/>
          <path d="M28.1 67.5 L28.3 69.5" stroke-width="10.5" stroke-linecap="butt"/>
          <path d="M15.9 67.5 L15.7 69.5" stroke="#d8262f" stroke-width="7.5" stroke-linecap="butt"/>
          <path d="M28.1 67.5 L28.3 69.5" stroke="#d8262f" stroke-width="7.5" stroke-linecap="butt"/>

          <!-- 팔 (짧은 스텁) -->
          <g class="arm-reach">
            <path d="M15 39 Q8.5 42 6.5 49" stroke-width="10.5"/>
            <path d="M15 39 Q8.5 42 6.5 49" stroke="#d8262f" stroke-width="7"/>
            <circle cx="6" cy="50.5" r="4.6" fill="#b01a24" stroke-width="2"/>
          </g>
          <path d="M29 39 Q35.5 42 37.5 49" stroke-width="10.5"/>
          <path d="M29 39 Q35.5 42 37.5 49" stroke="#d8262f" stroke-width="7"/>
          <circle cx="38" cy="50.5" r="4.6" fill="#b01a24" stroke-width="2"/>

          <!-- 몸통 -->
          <path d="M14.5 35 Q22 31.5 29.5 35 L28.5 54 Q22 57.5 15.5 54 Z"
                fill="url(#gNavy)" stroke-width="2.2"/>
          <path d="M14.5 35 Q22 31.5 29.5 35 L29 45 Q22 49 15 45 Z"
                fill="url(#gRed)" stroke-width="2.2"/>
          <!-- 가슴 엠블럼 -->
          <path d="M22 38 L26 43 L22 50 L18 43 Z" fill="#7fe4f7" stroke-width="1.6"/>
          <path d="M22 41.6 L23.6 43.4 L22 46.6 L20.4 43.4 Z" fill="#141b45" stroke="none"/>
          <!-- 벨트 -->
          <path d="M15.6 52.6 Q22 56 28.4 52.6" fill="none" stroke="#5fc6dd" stroke-width="2.4"/>

          <!-- 큰 머리 -->
          <ellipse cx="22" cy="18" rx="15" ry="16" fill="url(#gRed)" stroke-width="2.4"/>
          <!-- 각진 바이저 -->
          <path d="M9.5 19.5 L17.2 14.2 L19.4 21.8 L12.2 25.4 Z" fill="url(#gVisor)" stroke-width="2"/>
          <path d="M34.5 19.5 L26.8 14.2 L24.6 21.8 L31.8 25.4 Z" fill="url(#gVisor)" stroke-width="2"/>
          <path d="M11.6 19.6 L16.4 16.4" fill="none" stroke="#ffffff" stroke-width="1.4" opacity="0.8"/>
          <path d="M32.4 19.6 L27.6 16.4" fill="none" stroke="#ffffff" stroke-width="1.4" opacity="0.8"/>
          <!-- 정수리 크레스트 -->
          <path d="M22 2.4 L25 7 L22 6 L19 7 Z" fill="#5fc6dd" stroke-width="1.8"/>
        </g>
      </svg>
    </div>
  </div>

  <div class="vignette"></div>
  <div class="grain" id="grainLayer"></div>
</div>

<script>
  const sceneEl = document.getElementById('scene');
  const cityEl = document.getElementById('city');
  const cityWrapEl = document.getElementById('cityWrap');
  const rigEl = document.getElementById('rig');
  const heroEl = document.getElementById('hero');
  const shotLayerEl = document.getElementById('shotLayer');
  const toastEl = document.getElementById('toast');
  const starsLayerEl = document.getElementById('starsLayer');

  // ---------- 별 ----------
  for (let i = 0; i < 130; i++) {
    const s = document.createElement('div');
    const big = Math.random() < 0.16;
    s.className = 'star' + (big ? ' big' : '');
    const size = big ? 2.6 : 1 + Math.random() * 1.2;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 58 + '%';
    s.style.opacity = 0.25 + Math.random() * 0.6;
    s.style.animationDelay = (Math.random() * 2.4) + 's';
    s.style.animationDuration = (1.8 + Math.random() * 2.6) + 's';
    starsLayerEl.appendChild(s);
  }

  // ---------- 구름 ----------
  const cloudsLayer = document.getElementById('cloudsLayer');
  for (let i = 0; i < 7; i++) {
    const c = document.createElement('div');
    c.className = 'cloud';
    const w = 170 + Math.random() * 320;
    c.style.width = w + 'px';
    c.style.height = (w * (0.16 + Math.random() * 0.12)) + 'px';
    c.style.left = (Math.random() * 110 - 5) + '%';
    c.style.top = (26 + Math.random() * 34) + '%';
    c.style.opacity = 0.18 + Math.random() * 0.3;
    cloudsLayer.appendChild(c);
  }

  // ---------- 시차 스카이라인 ----------
  function makeSkyline(el, o) {
    const parts = [];
    let x = 0;
    while (x < o.width) {
      const bw = o.minW + Math.random() * (o.maxW - o.minW);
      const bh = o.minH + Math.random() * (o.maxH - o.minH);
      const y = o.height - bh;
      parts.push('<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) +
                 '" width="' + (bw - 3).toFixed(1) + '" height="' + bh.toFixed(1) + '"/>');
      if (Math.random() < 0.34) {
        parts.push('<rect x="' + (x + bw * 0.42).toFixed(1) + '" y="' + (y - 16).toFixed(1) +
                   '" width="2.4" height="16"/>');
      }
      if (Math.random() < 0.22) {
        parts.push('<rect x="' + (x + bw * 0.15).toFixed(1) + '" y="' + (y - 7).toFixed(1) +
                   '" width="' + (bw * 0.3).toFixed(1) + '" height="7" rx="2"/>');
      }
      if (o.windows) {
        const cols = Math.max(1, Math.floor(bw / 13));
        const rows = Math.max(1, Math.floor(bh / 18));
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            if (Math.random() > 0.30) continue;
            parts.push('<rect fill="' + (Math.random() < 0.75 ? '#ffcf86' : '#9fd8ff') +
                       '" opacity="' + (0.3 + Math.random() * 0.5).toFixed(2) +
                       '" x="' + (x + 6 + c * 13).toFixed(1) + '" y="' + (y + 10 + r * 18).toFixed(1) +
                       '" width="4.5" height="6"/>');
          }
        }
      }
      x += bw;
    }
    el.innerHTML = '<svg width="' + o.width + '" height="100%" viewBox="0 0 ' + o.width + ' ' + o.height +
      '" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">' +
      '<g fill="' + o.color + '">' + parts.join('') + '</g></svg>';
    el.style.width = o.width + 'px';
  }

  const skyFarEl = document.getElementById('skyFar');
  const skyMidEl = document.getElementById('skyMid');
  makeSkyline(skyFarEl, { width: 3600, height: 260, minW: 34, maxW: 74, minH: 70, maxH: 210, color: '#2a2450' });
  makeSkyline(skyMidEl, { width: 3600, height: 320, minW: 46, maxW: 104, minH: 100, maxH: 290, color: '#1b1738', windows: true });

  cityWrapEl.addEventListener('scroll', () => {
    const s = cityWrapEl.scrollLeft;
    skyFarEl.style.transform = 'translateX(' + (-s * 0.16) + 'px)';
    skyMidEl.style.transform = 'translateX(' + (-s * 0.38) + 'px)';
  });

  // ---------- 필름 그레인 ----------
  (function grain() {
    const n = 128;
    const cv = document.createElement('canvas');
    cv.width = cv.height = n;
    const g = cv.getContext('2d');
    const img = g.createImageData(n, n);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = 90 + Math.random() * 76;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
      img.data[i + 3] = 255;
    }
    g.putImageData(img, 0, 0);
    document.getElementById('grainLayer').style.backgroundImage = 'url(' + cv.toDataURL() + ')';
  })();

  // ---------- 빌딩 생성 ----------
  const BUILDING_DEFS = [
    { w: 110, h: 260, name: '실버타워' },
    { w: 150, h: 380, name: '오션빌딩' },
    { w: 95,  h: 200, name: '코너하우스' },
    { w: 170, h: 460, name: '센트럴타워' },
    { w: 120, h: 300, name: '골든오피스' },
    { w: 140, h: 340, name: '문라이트빌딩' },
    { w: 100, h: 230, name: '스카이뷰' },
  ];
  const NAME_PARTS_A = ['스타', '레인보우', '펄', '노바', '크리스탈', '메트로', '선셋', '블루', '골드', '네온'];
  const NAME_PARTS_B = ['타워', '빌딩', '플라자', '센터', '스카이라인', '하우스', '오피스'];

  const buildings = [];

  function addRoofKit(el, w) {
    const kit = document.createElement('div');
    kit.className = 'roof-kit';
    const pieces = 1 + Math.floor(Math.random() * 3);
    for (let i = 0; i < pieces; i++) {
      const p = document.createElement('div');
      const kind = Math.random();
      if (kind < 0.34) {
        p.className = 'rk mast';
        p.style.height = (18 + Math.random() * 24) + 'px';
        p.style.left = (12 + Math.random() * (w - 24)) + 'px';
      } else if (kind < 0.67) {
        p.className = 'rk tank';
        const bw = 14 + Math.random() * 20;
        p.style.width = bw + 'px';
        p.style.height = (10 + Math.random() * 12) + 'px';
        p.style.left = (6 + Math.random() * Math.max(1, w - bw - 12)) + 'px';
      } else {
        p.className = 'rk';
        const bw = 20 + Math.random() * 26;
        p.style.width = bw + 'px';
        p.style.height = (7 + Math.random() * 9) + 'px';
        p.style.left = (6 + Math.random() * Math.max(1, w - bw - 12)) + 'px';
      }
      kit.appendChild(p);
    }
    el.appendChild(kit);
  }

  function createBuilding(def) {
    const el = document.createElement('div');
    el.className = 'building';
    el.style.width = def.w + 'px';
    el.style.height = def.h + 'px';

    const cols = Math.max(2, Math.floor(def.w / 26));
    const rows = Math.max(3, Math.floor(def.h / 30));
    const windowsEl = document.createElement('div');
    windowsEl.className = 'windows';
    windowsEl.style.setProperty('--cols', cols);
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const win = document.createElement('div');
        const roll = Math.random();
        let cls = 'win';
        if (roll < 0.30) cls += ' lit';
        else if (roll < 0.40) cls += ' cool';
        else if (roll < 0.47) cls += ' half';
        if (cls !== 'win' && Math.random() < 0.10) cls += ' flick';
        win.className = cls;
        if (cls.indexOf('flick') > -1) win.style.animationDelay = (Math.random() * 3.6) + 's';
        windowsEl.appendChild(win);
      }
    }
    el.appendChild(windowsEl);
    addRoofKit(el, def.w);

    const label = document.createElement('div');
    label.className = 'roof-label';
    label.textContent = def.name;
    el.appendChild(label);

    cityEl.appendChild(el);
    const record = { el, name: def.name, index: buildings.length };
    buildings.push(record);
    return record;
  }

  BUILDING_DEFS.forEach((def) => createBuilding(def));

  document.getElementById('addBuildingBtn').addEventListener('click', () => {
    const w = 90 + Math.floor(Math.random() * 100);
    const h = 190 + Math.floor(Math.random() * 320);
    const name = NAME_PARTS_A[Math.floor(Math.random() * NAME_PARTS_A.length)] +
                 NAME_PARTS_B[Math.floor(Math.random() * NAME_PARTS_B.length)];
    createBuilding({ w, h, name });
    cityWrapEl.scrollTo({ left: cityWrapEl.scrollWidth, behavior: 'smooth' });
  });

  // ---------- 거미줄 히어로 물리 ----------
  const HANG_LEN = 196;
  let currentPivot = { x: 0, y: 0 };
  let currentTheta = 0;
  let currentRadius = HANG_LEN;
  let mode = 'idle';
  let swingStart = 0;
  let swingDuration = 950;
  let swingFromPos = { x: 0, y: 0 };
  let swingHangPos = { x: 0, y: 0 };
  let swingControlPos = { x: 0, y: 0 };
  let idleStartTime = performance.now();
  let lastTrail = 0;

  function getAnchorPoint(buildingIndex) {
    const rect = buildings[buildingIndex].el.getBoundingClientRect();
    const sceneRect = sceneEl.getBoundingClientRect();
    return {
      x: rect.left - sceneRect.left + rect.width / 2,
      y: rect.top - sceneRect.top,
    };
  }

  function heroAbsPos() {
    return {
      x: currentPivot.x + currentRadius * Math.sin(currentTheta),
      y: currentPivot.y + currentRadius * Math.cos(currentTheta),
    };
  }

  function showToast(text) {
    toastEl.textContent = text;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toastEl.classList.remove('show'), 1200);
  }

  function spawnBurst(pt) {
    const b = document.createElement('div');
    b.className = 'burst';
    b.style.left = pt.x + 'px';
    b.style.top = pt.y + 'px';
    shotLayerEl.appendChild(b);
    setTimeout(() => b.remove(), 460);
  }

  function spawnTrail(pt) {
    const t = document.createElement('div');
    t.className = 'trail';
    t.style.left = pt.x + 'px';
    t.style.top = pt.y + 'px';
    shotLayerEl.appendChild(t);
    setTimeout(() => t.remove(), 560);
  }

  function spawnWebShot(from, to, onDone) {
    const dx = to.x - from.x, dy = to.y - from.y;
    const dist = Math.hypot(dx, dy);
    const angle = Math.atan2(dy, dx) * (180 / Math.PI);

    const shot = document.createElement('div');
    shot.className = 'web-shot';
    shot.style.left = from.x + 'px';
    shot.style.top = from.y + 'px';
    shot.style.width = dist + 'px';
    shot.style.transform = `rotate(${angle}deg) scaleX(0)`;
    shot.style.transition = 'transform 0.22s ease-out';
    shotLayerEl.appendChild(shot);

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        shot.style.transform = `rotate(${angle}deg) scaleX(1)`;
      });
    });

    setTimeout(() => {
      shot.remove();
      spawnBurst(to);
      onDone();
    }, 240);
  }

  function swingToPoint(targetPoint, label) {
    if (mode === 'swinging') return;

    const fromPos = heroAbsPos();
    const dx0 = targetPoint.x - fromPos.x, dy0 = targetPoint.y - fromPos.y;
    const clickDist = Math.hypot(dx0, dy0);
    if (clickDist < 12) return;

    spawnWebShot(fromPos, targetPoint, () => {
      currentPivot = targetPoint;
      swingFromPos = fromPos;
      swingHangPos = { x: targetPoint.x, y: targetPoint.y + HANG_LEN };

      const dipAmount = Math.min(230, clickDist * 0.4 + 30);
      swingControlPos = {
        x: (swingFromPos.x + swingHangPos.x) / 2,
        y: Math.max(swingFromPos.y, swingHangPos.y) + dipAmount,
      };

      swingStart = performance.now();
      mode = 'swinging';
      heroEl.classList.add('swinging');
      showToast(`🕸️ ${label} 웹스윙!`);
    });
  }

  function easeInOutSine(t) {
    return -(Math.cos(Math.PI * t) - 1) / 2;
  }

  function updateRig() {
    rigEl.style.left = currentPivot.x + 'px';
    rigEl.style.top = currentPivot.y + 'px';
    rigEl.style.height = currentRadius + 'px';
    rigEl.style.transform = `rotate(${-currentTheta}rad)`;
  }

  function tick(now) {
    if (mode === 'swinging') {
      const t = Math.min(1, (now - swingStart) / swingDuration);
      const e = easeInOutSine(t);
      const inv = 1 - e;

      const heroX = inv * inv * swingFromPos.x + 2 * inv * e * swingControlPos.x + e * e * swingHangPos.x;
      const heroY = inv * inv * swingFromPos.y + 2 * inv * e * swingControlPos.y + e * e * swingHangPos.y;

      const dx = heroX - currentPivot.x, dy = heroY - currentPivot.y;
      currentRadius = Math.hypot(dx, dy);
      currentTheta = Math.atan2(dx, dy);

      if (now - lastTrail > 42) {
        lastTrail = now;
        spawnTrail({ x: heroX, y: heroY });
      }

      if (t >= 1) {
        currentTheta = 0;
        currentRadius = HANG_LEN;
        mode = 'idle';
        heroEl.classList.remove('swinging');
        idleStartTime = now;
      }
    } else {
      const elapsed = (now - idleStartTime) / 1000;
      // 좌우 진자
      currentTheta = Math.sin(elapsed * 1.9) * 0.135 + Math.sin(elapsed * 0.63) * 0.035;
      // 위아래 바운스: 진자가 최저점을 지날 때마다 줄이 늘어나므로 흔들림의 2배 주기
      const bob = (1 - Math.cos(elapsed * 3.8)) * 0.5;
      currentRadius = HANG_LEN + bob * 34;
    }
    updateRig();
    requestAnimationFrame(tick);
  }

  // ---------- 초기화 ----------
  const START_BUILDING = 1;

  sceneEl.addEventListener('click', (e) => {
    if (e.target.closest('.hud') || e.target.closest('#toast')) return;

    const buildingEl = e.target.closest('.building');
    if (!buildingEl) return;

    const record = buildings.find((b) => b.el === buildingEl);
    const point = getAnchorPoint(record.index);

    swingToPoint(point, record.name);
  });

  requestAnimationFrame(() => {
    currentPivot = getAnchorPoint(START_BUILDING);
    requestAnimationFrame(tick);
  });
</script>

</body>
</html>
