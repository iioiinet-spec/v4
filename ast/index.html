<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>우주 상식 퀴즈 · 별을 아는 만큼 보인다</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
:root{
  --space:#06041A;
  --deep:#0D0A2E;
  --panel:#171343;
  --panel-2:#221B5C;
  --line:#332B75;
  --text:#F0EDFF;
  --muted:#9A93C9;
  --gold:#FFD166;
  --rose:#F45B9B;
  --cyan:#6EE7F9;
  --good:#5EEAD4;
  --bad:#FF6B6B;
  --font-display:'Jua','Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif;
  --font-body:'Pretendard Variable',Pretendard,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--space);color:var(--text);font-family:var(--font-body);line-height:1.7;
  -webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden
}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.veil{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(900px 520px at 12% 0%, rgba(244,91,155,.16), transparent 62%),
    radial-gradient(820px 480px at 92% 12%, rgba(110,231,249,.13), transparent 60%),
    radial-gradient(700px 700px at 50% 110%, rgba(255,209,102,.09), transparent 62%)
}
#burst{position:fixed;inset:0;width:100%;height:100%;z-index:40;pointer-events:none}
#flash{
  position:fixed;inset:0;z-index:35;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 50%, rgba(255,107,107,.18), rgba(255,60,60,.55) 100%);
  box-shadow:inset 0 0 160px 40px rgba(255,60,60,.75)
}
#flash.blink{animation:blink .62s steps(1) 3}
@keyframes blink{0%{opacity:0}22%{opacity:1}55%{opacity:.25}100%{opacity:0}}

.stage{position:relative;z-index:5;max-width:760px;margin:0 auto;padding:26px 18px 70px}
.stage.shake{animation:shake .62s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{
  0%,100%{transform:translate3d(0,0,0) rotate(0)}
  8%{transform:translate3d(-13px,4px,0) rotate(-1.1deg)}
  20%{transform:translate3d(14px,-6px,0) rotate(1.2deg)}
  33%{transform:translate3d(-11px,-4px,0) rotate(-.9deg)}
  46%{transform:translate3d(10px,5px,0) rotate(.8deg)}
  60%{transform:translate3d(-7px,-3px,0) rotate(-.5deg)}
  74%{transform:translate3d(5px,2px,0) rotate(.3deg)}
  88%{transform:translate3d(-2px,-1px,0) rotate(-.1deg)}
}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:26px}
.brand{display:flex;align-items:center;gap:10px}
.brand .lg{font-size:26px;filter:drop-shadow(0 0 10px rgba(255,209,102,.8))}
.brand b{font-family:var(--font-display);font-weight:400;font-size:19px;letter-spacing:.01em}
.icons{display:flex;gap:8px}
.ibtn{
  width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:rgba(23,19,67,.75);
  color:var(--muted);font-size:16px;cursor:pointer;display:grid;place-items:center;transition:.18s
}
.ibtn:hover{border-color:var(--gold);color:var(--gold)}
.ibtn.off{opacity:.42}
.ibtn:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

.screen{display:none;animation:rise .38s ease}
.screen.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* start */
.hero{text-align:center;padding:8px 0 6px}
.hero .orb{
  width:118px;height:118px;margin:0 auto 18px;border-radius:50%;position:relative;
  background:radial-gradient(circle at 34% 30%, #FFE9A8, #FFB03A 42%, #C04B7A 78%, #4A1E5C);
  box-shadow:0 0 60px -8px rgba(255,177,58,.8), inset -14px -12px 30px rgba(0,0,0,.5)
}
.hero .orb::after{
  content:"";position:absolute;inset:-19px -46px;border-radius:50%;
  border:3px solid rgba(110,231,249,.55);transform:rotate(-19deg);
  box-shadow:0 0 22px -4px rgba(110,231,249,.7)
}
.hero h1{
  font-family:var(--font-display);font-weight:400;font-size:clamp(30px,7vw,44px);
  margin:0 0 10px;line-height:1.25;letter-spacing:-.01em
}
.hero h1 em{font-style:normal;color:var(--gold);text-shadow:0 0 26px rgba(255,209,102,.5)}
.hero p{color:var(--muted);margin:0 auto 26px;max-width:430px;font-size:15px}

.pickttl{
  font-family:var(--font-display);font-weight:400;font-size:16px;color:var(--cyan);
  display:flex;align-items:center;gap:9px;margin:0 0 12px
}
.pickttl::before{content:"";width:5px;height:16px;border-radius:3px;background:var(--cyan);box-shadow:0 0 12px var(--cyan)}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.cats{grid-template-columns:1fr}}
.cat{
  text-align:left;background:linear-gradient(150deg,var(--panel),var(--deep));
  border:1px solid var(--line);border-radius:18px;padding:17px 18px;cursor:pointer;
  color:var(--text);font-family:var(--font-body);transition:.2s;position:relative;overflow:hidden
}
.cat:hover{border-color:var(--gold);transform:translateY(-3px);box-shadow:0 14px 32px -18px rgba(255,209,102,.9)}
.cat:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.cat .ic{font-size:26px;display:block;margin-bottom:7px}
.cat .nm{font-family:var(--font-display);font-weight:400;font-size:18px;display:block}
.cat .ds{color:var(--muted);font-size:13px;display:block;margin-top:2px}
.cat .cn{
  position:absolute;top:15px;right:16px;font-size:11.5px;color:var(--muted);
  border:1px solid var(--line);border-radius:99px;padding:2px 9px
}
.cat.wide{grid-column:1/-1;border-color:rgba(255,209,102,.55);background:linear-gradient(150deg,#2A1F4E,#160E38)}
.cat.wide .nm{color:var(--gold)}

/* quiz */
.bar{height:9px;border-radius:99px;background:var(--panel);overflow:hidden;margin-bottom:9px;border:1px solid var(--line)}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--cyan),var(--gold));transition:width .45s cubic-bezier(.4,0,.2,1)}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);margin-bottom:20px}
.meta .streak{color:var(--gold)}
.qcard{
  background:linear-gradient(160deg,var(--panel),var(--deep));border:1px solid var(--line);
  border-radius:20px;padding:22px 20px;margin-bottom:16px
}
.qtag{
  display:inline-block;font-size:11.5px;color:var(--cyan);border:1px solid rgba(110,231,249,.4);
  border-radius:99px;padding:2px 10px;margin-bottom:12px
}
.qtext{font-family:var(--font-display);font-weight:400;font-size:clamp(19px,4.4vw,23px);line-height:1.5;margin:0}
.opts{display:grid;gap:10px}
.opt{
  display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;cursor:pointer;
  background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px 16px;
  color:var(--text);font-family:var(--font-body);font-size:15.2px;line-height:1.5;transition:.16s
}
.opt:hover:not(:disabled){border-color:var(--cyan);background:var(--panel-2);transform:translateX(5px)}
.opt:disabled{cursor:default}
.opt:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.opt .kn{
  flex:0 0 auto;width:26px;height:26px;border-radius:9px;display:grid;place-items:center;
  background:var(--panel-2);border:1px solid var(--line);font-size:13px;color:var(--muted);margin-top:1px
}
.opt.right{border-color:var(--good);background:rgba(94,234,212,.13);box-shadow:0 0 26px -8px var(--good)}
.opt.right .kn{background:var(--good);border-color:var(--good);color:#062B26;font-weight:700}
.opt.wrong{border-color:var(--bad);background:rgba(255,107,107,.13)}
.opt.wrong .kn{background:var(--bad);border-color:var(--bad);color:#33060A;font-weight:700}
.opt.dim{opacity:.42}

.verdict{
  border-radius:18px;padding:18px 20px;margin-top:16px;border:1px solid var(--line);
  background:var(--panel);animation:rise .3s ease
}
.verdict.ok{border-color:rgba(94,234,212,.5);background:rgba(94,234,212,.08)}
.verdict.no{border-color:rgba(255,107,107,.5);background:rgba(255,107,107,.08)}
.verdict h3{font-family:var(--font-display);font-weight:400;font-size:20px;margin:0 0 8px}
.verdict.ok h3{color:var(--good)}
.verdict.no h3{color:var(--bad)}
.verdict p{margin:0 0 12px;font-size:14.6px;color:#D8D2FF}
.termbox{
  border-left:3px solid var(--gold);background:rgba(255,209,102,.09);border-radius:0 12px 12px 0;
  padding:11px 15px;font-size:13.6px;color:#F3E4BC
}
.termbox b{color:var(--gold)}
.btn{
  font-family:var(--font-display);font-weight:400;font-size:16px;cursor:pointer;
  padding:12px 30px;border-radius:99px;border:2px solid var(--gold);color:var(--gold);
  background:transparent;transition:.2s;letter-spacing:.02em
}
.btn:hover{background:var(--gold);color:#221600;box-shadow:0 0 30px -6px var(--gold)}
.btn:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.btn.solid{background:var(--gold);color:#221600}
.btn.ghost{border-color:var(--line);color:var(--muted)}
.btn.ghost:hover{background:transparent;border-color:var(--cyan);color:var(--cyan);box-shadow:none}
.next{display:flex;justify-content:flex-end;margin-top:16px}

/* result */
.res{text-align:center;padding:6px 0}
.res .em{font-size:70px;line-height:1;filter:drop-shadow(0 0 22px rgba(255,209,102,.6))}
.res h2{font-family:var(--font-display);font-weight:400;font-size:clamp(26px,6vw,34px);margin:12px 0 4px;color:var(--gold)}
.res .sub{color:var(--muted);font-size:14px;margin:0 0 16px}
.stars{font-size:26px;letter-spacing:5px;margin-bottom:12px}
.bigscore{font-family:var(--font-display);font-weight:400;font-size:46px;line-height:1;color:var(--cyan)}
.bigscore small{font-size:19px;color:var(--muted)}
.res .msg{color:#D8D2FF;max-width:420px;margin:14px auto 24px;font-size:15px}
.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.review{margin-top:34px;text-align:left}
.rvitem{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--bad);border-radius:0 14px 14px 0;padding:14px 17px;margin-bottom:10px}
.rvitem .q{font-weight:700;font-size:14.6px;margin:0 0 7px}
.rvitem .a{font-size:13.6px;color:var(--good);margin:0 0 5px}
.rvitem .a b{color:var(--good)}
.rvitem .w{font-size:13.4px;color:var(--muted);margin:0}
.perfect{
  border:1px solid rgba(255,209,102,.5);background:rgba(255,209,102,.08);border-radius:16px;
  padding:16px 18px;color:#F3E4BC;font-size:14.5px;text-align:center
}

/* glossary */
.modal{
  position:fixed;inset:0;z-index:60;background:rgba(4,2,16,.82);backdrop-filter:blur(6px);
  display:none;padding:24px 16px;overflow-y:auto
}
.modal.on{display:block}
.msheet{max-width:640px;margin:20px auto;background:var(--deep);border:1px solid var(--line);border-radius:22px;padding:24px}
.msheet .mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.msheet h2{font-family:var(--font-display);font-weight:400;font-size:22px;margin:0}
.msheet .mhd{color:var(--muted);font-size:13.5px;margin:0 0 18px}
.glist{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.glist{grid-template-columns:1fr}}
.gitem{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 15px}
.gitem b{display:block;font-family:var(--font-display);font-weight:400;font-size:16px;color:var(--gold);margin-bottom:3px}
.gitem span{font-size:13.3px;color:#C9C2F0}

.tip{color:var(--muted);font-size:12.6px;text-align:center;margin-top:26px}
.tip b{color:var(--cyan)}
.combo{
  position:fixed;left:50%;top:22%;transform:translate(-50%,-10px);z-index:45;pointer-events:none;
  font-family:var(--font-display);font-weight:400;font-size:34px;color:var(--gold);opacity:0;
  text-shadow:0 0 30px rgba(255,209,102,.9)
}
.combo.pop{animation:pop 1s ease forwards}
@keyframes pop{
  0%{opacity:0;transform:translate(-50%,10px) scale(.6)}
  25%{opacity:1;transform:translate(-50%,-6px) scale(1.12)}
  70%{opacity:1;transform:translate(-50%,-10px) scale(1)}
  100%{opacity:0;transform:translate(-50%,-40px) scale(.95)}
}
@media (prefers-reduced-motion: reduce){
  .stage.shake{animation:none}
  #flash.blink{animation:blinksoft .5s ease}
  @keyframes blinksoft{0%{opacity:0}40%{opacity:.5}100%{opacity:0}}
}
</style>
</head>
<body>

<canvas id="sky" aria-hidden="true"></canvas>
<div class="veil" aria-hidden="true"></div>
<div id="flash" aria-hidden="true"></div>
<canvas id="burst" aria-hidden="true"></canvas>
<div class="combo" id="combo" aria-hidden="true"></div>

<div class="stage" id="stage">

  <div class="top">
    <div class="brand"><span class="lg">🌌</span><b>우주 상식 퀴즈</b></div>
    <div class="icons">
      <button class="ibtn" id="btnGloss" title="용어 사전" aria-label="용어 사전 열기">📖</button>
      <button class="ibtn" id="btnSound" title="소리 켜기/끄기" aria-label="소리 켜기 끄기">🔊</button>
      <button class="ibtn" id="btnFx" title="화면 효과 켜기/끄기" aria-label="화면 효과 켜기 끄기">✨</button>
    </div>
  </div>

  <!-- 시작 -->
  <section class="screen on" id="scStart">
    <div class="hero">
      <div class="orb"></div>
      <h1>별을 아는 만큼<br><em>하늘이 넓어진다</em></h1>
      <p>중학생 눈높이로 풀어 쓴 천문 상식 32문항. 맞히면 우주가 흔들리고, 틀리면 경보가 울립니다.</p>
    </div>
    <p class="pickttl">어느 하늘부터 볼까요?</p>
    <div class="cats" id="cats"></div>
    <p class="tip">문제를 맞히면 <b>화면이 흔들리며</b> 별가루가 터지고, 틀리면 <b>붉은 경보가 깜빡</b>입니다. 오른쪽 위 ✨ 버튼으로 효과를 끌 수 있어요.</p>
  </section>

  <!-- 퀴즈 -->
  <section class="screen" id="scQuiz">
    <div class="bar"><i id="qBar"></i></div>
    <div class="meta">
      <span id="qCount">1 / 8</span>
      <span class="streak" id="qStreak"></span>
      <span id="qScore">0점</span>
    </div>
    <div class="qcard">
      <span class="qtag" id="qTag">태양계</span>
      <p class="qtext" id="qText"></p>
    </div>
    <div class="opts" id="qOpts"></div>
    <div id="qVerdict"></div>
  </section>

  <!-- 결과 -->
  <section class="screen" id="scResult">
    <div class="res">
      <div class="em" id="rEm">🚀</div>
      <h2 id="rTitle"></h2>
      <p class="sub" id="rSub"></p>
      <div class="stars" id="rStars"></div>
      <div class="bigscore"><span id="rScore">0</span><small id="rTotal"> / 8</small></div>
      <p class="msg" id="rMsg"></p>
      <div class="acts">
        <button class="btn solid" id="rAgain">다시 도전</button>
        <button class="btn ghost" id="rHome">다른 하늘 보기</button>
      </div>
    </div>
    <div class="review" id="rReview"></div>
  </section>

</div>

<!-- 용어 사전 -->
<div class="modal" id="glossModal" role="dialog" aria-modal="true" aria-label="용어 사전">
  <div class="msheet">
    <div class="mh">
      <h2>📖 우주 용어 사전</h2>
      <button class="ibtn" id="glossClose" aria-label="닫기">✕</button>
    </div>
    <p class="mhd">퀴즈에 나오는 말들을 한 줄로 정리했습니다.</p>
    <div class="glist" id="glist"></div>
  </div>
</div>

<script type="application/json" id="quizdata">
{
  "categories": [
    {
      "id": "solar", "name": "태양계 대탐험", "icon": "🪐", "desc": "행성 8형제와 이웃 천체들",
      "questions": [
        {"q":"태양계에서 몸집이 가장 큰 행성은?","opts":["지구","목성","토성","해왕성"],"ans":1,
         "why":"목성은 지구를 1,300개나 담을 수 있을 만큼 큽니다. 나머지 행성을 전부 합친 것보다 목성 혼자가 더 무거워요.",
         "term":"목성 — 태양계 최대의 가스 행성. 표면이 딱딱한 땅이 아니라 두꺼운 기체 덩어리입니다."},
        {"q":"태양에서 가장 가까운 행성은?","opts":["금성","지구","수성","화성"],"ans":2,
         "why":"수성은 태양 바로 옆에서 88일 만에 한 바퀴를 돕니다. 수성의 1년이 지구의 3개월도 안 되는 셈이죠.",
         "term":"공전 — 한 천체가 다른 천체 둘레를 도는 운동. 지구의 공전 주기가 바로 1년입니다."},
        {"q":"선명한 고리로 가장 유명한 행성은?","opts":["토성","천왕성","화성","금성"],"ans":0,
         "why":"토성의 고리는 얼음과 돌 조각 수십억 개가 모인 것입니다. 통짜 판이 아니라 알갱이들이 줄지어 도는 중이에요.",
         "term":"고리 — 행성 둘레를 도는 얼음·먼지 띠. 목성, 천왕성, 해왕성에도 희미한 고리가 있습니다."},
        {"q":"2006년에 행성 자리에서 내려와 '왜소행성'이 된 천체는?","opts":["명왕성","해왕성","천왕성","세레스"],"ans":0,
         "why":"행성이 되려면 자기 궤도 주변을 홀로 차지해야 하는데, 명왕성은 비슷한 얼음 천체들과 궤도를 나눠 쓰고 있었습니다.",
         "term":"왜소행성 — 둥글 만큼 크지만 궤도 주변을 정리하지 못한 천체. 명왕성, 에리스, 세레스 등."},
        {"q":"화성이 붉게 보이는 진짜 이유는?","opts":["온도가 매우 높아서","표면에 녹슨 철 성분이 많아서","붉은 빛만 반사하는 얼음 때문에","화산이 계속 터지고 있어서"],"ans":1,
         "why":"화성 흙에는 산화철, 즉 녹슨 철가루가 가득합니다. 우리가 보는 붉은색은 사실 거대한 '녹슨 사막'의 색입니다.",

         "why":"한 별자리 안의 별들도 거리는 수십 배씩 차이 납니다. 우주의 다른 곳으로 옮겨 가면 그 모양은 완전히 흐트러집니다.",
         "term":"별자리 — 국제천문연맹이 정한 88개 하늘 구역. 방향을 찾는 '하늘의 주소'입니다."}
      ]
    }
  ],
  "glossary": [
    {"t":"항성과 행성","d":"항성은 스스로 빛나는 별(태양), 행성은 그 둘레를 도는 천체(지구). 밤하늘 별의 대부분은 항성입니다."},
    {"t":"위성","d":"행성 둘레를 도는 천체. 달은 지구의 위성이고, 목성은 위성이 95개 넘게 발견됐습니다."},
    {"t":"광년","d":"빛이 1년 동안 가는 거리, 약 9조 4천억 km. 시간이 아니라 거리 단위입니다."},
    {"t":"은하","d":"별 수천억 개가 중력으로 모인 집단. 우리 은하는 지름이 약 10만 광년입니다."},
    {"t":"성운","d":"우주에 떠 있는 가스와 먼지 구름. 새로운 별이 태어나는 요람입니다."},
    {"t":"적색거성","d":"나이 든 별이 부풀어 크고 붉어진 상태. 태양도 약 50억 년 뒤에 이렇게 됩니다."},
    {"t":"백색왜성","d":"가벼운 별의 마지막 모습. 지구만 한 크기에 태양만 한 질량이 눌려 있습니다."},
    {"t":"중성자별","d":"초신성 폭발 뒤 남은 초고밀도 천체. 한 숟갈이 10억 톤에 이릅니다."},
    {"t":"자전과 공전","d":"자전은 스스로 도는 것, 공전은 남의 둘레를 도는 것. 지구는 24시간 자전, 365일 공전."},
    {"t":"천체","d":"우주에 있는 모든 물체를 부르는 말. 별, 행성, 혜성, 성운이 모두 천체입니다."},
    {"t":"빅뱅","d":"약 138억 년 전 우주가 시작된 사건. 우주는 지금도 계속 팽창하고 있습니다."},
    {"t":"사건의 지평선","d":"블랙홀에서 한 번 넘어가면 빛조차 되돌아 나올 수 없는 경계선."}
  ],
  "praise": ["정답!","좋았어!","우주급 정답!","반짝!","완벽해!","별처럼 빛나는 정답!"],
  "combos": ["2연속!","3연속! 🔥","4연속! 대단해","5연속! 우주 최강","6연속! 전설","7연속! 은하 정복"],
  "ranks": [
    {"min":100,"em":"🛸","title":"우주 정복자","msg":"전 문항 정답입니다. 이 정도면 천문대에 자리를 하나 내줘야 할 것 같은데요."},
    {"min":85,"em":"🚀","title":"우주 탐험대장","msg":"거의 다 맞혔습니다. 놓친 한두 문제만 다시 읽어 두면 완벽해요."},
    {"min":65,"em":"🔭","title":"믿음직한 별지기","msg":"기본기가 탄탄합니다. 아래 오답 노트를 한 번만 훑어보세요."},
    {"min":40,"em":"🌙","title":"견습 천문가","msg":"절반은 잡았습니다. 용어 사전을 먼저 보고 다시 도전하면 점수가 확 오릅니다."},
    {"min":0,"em":"🌍","title":"이제 막 하늘을 올려다본 사람","msg":"괜찮습니다. 오답 노트의 해설만 읽어도 다음 판은 완전히 달라집니다."}
  ]
}
</script>

<script>
(function(){
  "use strict";
  var D = JSON.parse(document.getElementById("quizdata").textContent);
  var $ = function(id){ return document.getElementById(id); };
  var sysReduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var opt = { sound: true, fx: !sysReduce };
  var quiz = { list: [], i: 0, score: 0, streak: 0, bestStreak: 0, wrong: [], locked: false, catName: "" };

  /* ---------- 배경 별 ---------- */
  (function sky(){
    var cv = $("sky"), cx = cv.getContext("2d"), stars = [], W = 0, H = 0, t = 0;
    function size(){
      W = cv.width = window.innerWidth; H = cv.height = window.innerHeight;
      stars = [];
      var n = Math.min(190, Math.floor(W * H / 9000));
      for (var i = 0; i < n; i++){
        stars.push({ x: Math.random()*W, y: Math.random()*H, r: Math.random()*1.5+.3,
                     p: Math.random()*6.28, s: .6+Math.random()*1.6 });
      }
    }
    size();
    window.addEventListener("resize", size);
    function tick(){
      t += .016; cx.clearRect(0,0,W,H);
      for (var i=0;i<stars.length;i++){
        var s = stars[i];
        var a = sysReduce ? .6 : (.35 + .45 * Math.abs(Math.sin(t*s.s + s.p)));
        cx.globalAlpha = a; cx.fillStyle = i % 9 === 0 ? "#FFD166" : (i % 7 === 0 ? "#6EE7F9" : "#FFFFFF");
        cx.beginPath(); cx.arc(s.x, s.y, s.r, 0, 6.2832); cx.fill();
      }
      cx.globalAlpha = 1;
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  })();

  /* ---------- 소리 ---------- */
  var actx = null;
  function beep(kind){
    if (!opt.sound) return;
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === "suspended") actx.resume();
      var seq = kind === "ok" ? [[784,0,.10],[1047,.10,.10],[1319,.20,.22]]
              : kind === "no" ? [[196,0,.16],[147,.16,.30]]
              : [[523,0,.09],[659,.09,.09],[784,.18,.09],[1047,.27,.30]];
      seq.forEach(function(p){
        var o = actx.createOscillator(), g = actx.createGain();
        o.type = kind === "no" ? "sawtooth" : "triangle";
        o.frequency.value = p[0];
        var t0 = actx.currentTime + p[1];
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(kind === "no" ? .16 : .12, t0 + .02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + p[2]);
        o.connect(g); g.connect(actx.destination);
        o.start(t0); o.stop(t0 + p[2] + .02);
      });
    } catch(e){}
  }

  /* ---------- 화면 효과 ---------- */
  var stage = $("stage"), flash = $("flash"), shakeT = null, blinkT = null;
  function shake(){
    if (!opt.fx) return;
    stage.classList.remove("shake");
    void stage.offsetWidth;
    stage.classList.add("shake");
    clearTimeout(shakeT);
    shakeT = setTimeout(function(){ stage.classList.remove("shake"); }, 700);
  }
  function blink(){
    if (!opt.fx) return;
    flash.classList.remove("blink");
    void flash.offsetWidth;
    flash.classList.add("blink");
    clearTimeout(blinkT);
    blinkT = setTimeout(function(){ flash.classList.remove("blink"); }, 2000);
  }
  var bcv = $("burst"), bcx = bcv.getContext("2d"), parts = [], running = false;
  function fitBurst(){ bcv.width = window.innerWidth; bcv.height = window.innerHeight; }
  fitBurst(); window.addEventListener("resize", fitBurst);
  function starburst(x, y){
    if (!opt.fx) return;
    var cols = ["#FFD166","#6EE7F9","#F45B9B","#5EEAD4","#FFFFFF"];
    for (var i = 0; i < 46; i++){
      var a = Math.random() * 6.2832, sp = 3 + Math.random() * 9;
      parts.push({ x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 3,
                   r:2+Math.random()*3.6, c:cols[i%cols.length], life:1, rot:Math.random()*6.28, vr:(Math.random()-.5)*.32 });
    }
    if (!running){ running = true; requestAnimationFrame(burstLoop); }
  }
  function drawStar(cx2, x, y, r){
    cx2.beginPath();
    for (var i = 0; i < 10; i++){
      var rr = (i % 2 === 0) ? r : r * .44;
      var a = -Math.PI/2 + i * Math.PI/5;
      var px = x + Math.cos(a)*rr, py = y + Math.sin(a)*rr;
      if (i === 0) cx2.moveTo(px, py); else cx2.lineTo(px, py);
    }
    cx2.closePath(); cx2.fill();
  }
  function burstLoop(){
    bcx.clearRect(0, 0, bcv.width, bcv.height);
    var alive = false;
    for (var i = 0; i < parts.length; i++){
      var p = parts[i];
      if (p.life <= 0) continue;
      p.vy += .34; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= .016;
      if (p.life > 0){
        alive = true;
        bcx.save(); bcx.globalAlpha = Math.max(p.life, 0);
        bcx.translate(p.x, p.y); bcx.rotate(p.rot); bcx.fillStyle = p.c;
        drawStar(bcx, 0, 0, p.r * 1.9);
        bcx.restore();
      }
    }
    if (alive) requestAnimationFrame(burstLoop);
    else { parts = []; running = false; bcx.clearRect(0, 0, bcv.width, bcv.height); }
  }
  function combo(txt){
    if (!opt.fx) return;
    var el = $("combo");
    el.textContent = txt;
    el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop");
  }

  /* ---------- 화면 전환 ---------- */
  function goto(id){
    var ss = document.querySelectorAll(".screen");
    for (var i = 0; i < ss.length; i++) ss[i].classList.toggle("on", ss[i].id === id);
    window.scrollTo({ top: 0, behavior: sysReduce ? "auto" : "smooth" });
  }

  /* ---------- 시작 화면 ---------- */
  function buildStart(){
    var box = $("cats");
    box.textContent = "";
    D.categories.forEach(function(c){
      var b = document.createElement("button");
      b.className = "cat"; b.type = "button";
      var ic = document.createElement("span"); ic.className = "ic"; ic.textContent = c.icon;
      var nm = document.createElement("span"); nm.className = "nm"; nm.textContent = c.name;
      var ds = document.createElement("span"); ds.className = "ds"; ds.textContent = c.desc;
      var cn = document.createElement("span"); cn.className = "cn"; cn.textContent = c.questions.length + "문항";
      b.appendChild(ic); b.appendChild(nm); b.appendChild(ds); b.appendChild(cn);
      b.addEventListener("click", function(){ start(c.questions, c.name); });
      box.appendChild(b);
    });
    var all = document.createElement("button");
    all.className = "cat wide"; all.type = "button";
    var i2 = document.createElement("span"); i2.className = "ic"; i2.textContent = "🌌";
    var n2 = document.createElement("span"); n2.className = "nm"; n2.textContent = "전 우주 랜덤 도전";
    var d2 = document.createElement("span"); d2.className = "ds"; d2.textContent = "네 분야를 섞어 12문항 — 진짜 실력 확인";
    var c2 = document.createElement("span"); c2.className = "cn"; c2.textContent = "12문항";
    all.appendChild(i2); all.appendChild(n2); all.appendChild(d2); all.appendChild(c2);
    all.addEventListener("click", function(){
      var pool = [];
      D.categories.forEach(function(c){ pool = pool.concat(c.questions); });
      start(shuffle(pool).slice(0, 12), "전 우주 랜덤");
    });
    box.appendChild(all);
  }

  function shuffle(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  /* ---------- 퀴즈 ---------- */
  function start(qs, name){
    quiz.catName = name;
    quiz.list = shuffle(qs).map(function(q){
      var pairs = q.opts.map(function(text, idx){ return { text: text, ok: idx === q.ans }; });
      return { q: q.q, why: q.why, term: q.term, opts: shuffle(pairs) };
    });
    quiz.i = 0; quiz.score = 0; quiz.streak = 0; quiz.bestStreak = 0; quiz.wrong = []; quiz.locked = false;
    goto("scQuiz");
    render();
  }

  function render(){
    quiz.locked = false;
    var item = quiz.list[quiz.i];
    $("qTag").textContent = quiz.catName;
    $("qCount").textContent = (quiz.i + 1) + " / " + quiz.list.length;
    $("qScore").textContent = quiz.score + "점";
    $("qStreak").textContent = quiz.streak >= 2 ? ("🔥 " + quiz.streak + "연속") : "";
    $("qBar").style.width = (quiz.i / quiz.list.length * 100) + "%";
    $("qText").textContent = item.q;
    $("qVerdict").textContent = "";
    var box = $("qOpts");
    box.textContent = "";
    item.opts.forEach(function(o, idx){
      var b = document.createElement("button");
      b.className = "opt"; b.type = "button";
      var kn = document.createElement("span");
      kn.className = "kn"; kn.textContent = String.fromCharCode(65 + idx);
      var tx = document.createElement("span"); tx.textContent = o.text;
      b.appendChild(kn); b.appendChild(tx);
      b.addEventListener("click", function(ev){ answer(idx, ev); });
      box.appendChild(b);
    });
  }

  function answer(idx, ev){
    if (quiz.locked) return;
    quiz.locked = true;
    var item = quiz.list[quiz.i];
    var correct = item.opts[idx].ok;
    var btns = $("qOpts").querySelectorAll(".opt");
    for (var i = 0; i < btns.length; i++){
      btns[i].disabled = true;
      if (item.opts[i].ok) btns[i].classList.add("right");
      else if (i === idx) btns[i].classList.add("wrong");
      else btns[i].classList.add("dim");
    }

    var v = document.createElement("div");
    v.className = "verdict " + (correct ? "ok" : "no");
    var h = document.createElement("h3");
    var p = document.createElement("p"); p.textContent = item.why;
    var tb = document.createElement("div"); tb.className = "termbox";
    var parts2 = item.term.split(" — ");
    var tbB = document.createElement("b"); tbB.textContent = "📖 " + parts2[0];
    tb.appendChild(tbB);
    tb.appendChild(document.createTextNode(" — " + (parts2[1] || "")));

    if (correct){
      quiz.score += 1; quiz.streak += 1;
      if (quiz.streak > quiz.bestStreak) quiz.bestStreak = quiz.streak;
      h.textContent = "⭐ " + D.praise[Math.floor(Math.random() * D.praise.length)];
      shake();
      beep(quiz.streak >= 3 ? "combo" : "ok");
      var x = window.innerWidth / 2, y = window.innerHeight / 2;
      if (ev && ev.clientX){ x = ev.clientX; y = ev.clientY; }
      starburst(x, y);
      if (quiz.streak >= 2){
        var ci = quiz.streak - 2;
        combo(ci < D.combos.length ? D.combos[ci] : (quiz.streak + "연속! 🌌"));
      }
    } else {
      quiz.streak = 0;
      h.textContent = "💫 아쉬워요! 정답은 " + correctText(item) + " 입니다";
      blink();
      beep("no");
      quiz.wrong.push(item);
    }
    v.appendChild(h); v.appendChild(p); v.appendChild(tb);

    var nx = document.createElement("div");
    nx.className = "next";
    var nb = document.createElement("button");
    nb.className = "btn"; nb.type = "button";
    nb.textContent = (quiz.i === quiz.list.length - 1) ? "결과 보기 →" : "다음 문제 →";
    nb.addEventListener("click", next);
    nx.appendChild(nb);
    v.appendChild(nx);

    var host = $("qVerdict");
    host.textContent = "";
    host.appendChild(v);
    $("qScore").textContent = quiz.score + "점";
    $("qStreak").textContent = quiz.streak >= 2 ? ("🔥 " + quiz.streak + "연속") : "";
    $("qBar").style.width = ((quiz.i + 1) / quiz.list.length * 100) + "%";
    setTimeout(function(){ nb.focus(); }, 60);
  }

  function correctText(item){
    for (var i = 0; i < item.opts.length; i++){ if (item.opts[i].ok) return "\u300C" + item.opts[i].text + "\u300D"; }
    return "";
  }

  function next(){
    quiz.i += 1;
    if (quiz.i < quiz.list.length) render();
    else finish();
  }

  /* ---------- 결과 ---------- */
  function finish(){
    var total = quiz.list.length;
    var pct = Math.round(quiz.score / total * 100);
    var rank = D.ranks[D.ranks.length - 1];
    for (var i = 0; i < D.ranks.length; i++){ if (pct >= D.ranks[i].min){ rank = D.ranks[i]; break; } }
    $("rEm").textContent = rank.em;
    $("rTitle").textContent = rank.title;
    $("rSub").textContent = quiz.catName + " · 정답률 " + pct + "%" + (quiz.bestStreak >= 2 ? " · 최고 " + quiz.bestStreak + "연속" : "");
    $("rScore").textContent = quiz.score;
    $("rTotal").textContent = " / " + total;
    $("rMsg").textContent = rank.msg;
    var filled = Math.max(1, Math.round(pct / 20));
    var st = "";
    for (var s = 0; s < 5; s++){ st += (s < filled ? "\u2605" : "\u2606"); }
    var starEl = $("rStars");
    starEl.textContent = st;
    starEl.style.color = pct >= 65 ? "#FFD166" : "#9A93C9";

    var rv = $("rReview");
    rv.textContent = "";
    if (quiz.wrong.length === 0){
      var pf = document.createElement("div");
      pf.className = "perfect";
      pf.textContent = "틀린 문제가 없습니다. 다른 분야도 도전해 보세요!";
      rv.appendChild(pf);
    } else {
      var ttl = document.createElement("p");
      ttl.className = "pickttl";
      ttl.textContent = "오답 노트 " + quiz.wrong.length + "문항";
      rv.appendChild(ttl);
      quiz.wrong.forEach(function(item){
        var d = document.createElement("div"); d.className = "rvitem";
        var q = document.createElement("p"); q.className = "q"; q.textContent = item.q;
        var a = document.createElement("p"); a.className = "a"; a.textContent = "정답 · " + correctText(item);
        var w = document.createElement("p"); w.className = "w"; w.textContent = item.why;
        d.appendChild(q); d.appendChild(a); d.appendChild(w);
        rv.appendChild(d);
      });
    }
    goto("scResult");
    if (pct >= 65){
      setTimeout(function(){
        starburst(window.innerWidth/2, window.innerHeight*0.32);
        beep("combo");
      }, 260);
    }
  }

  $("rAgain").addEventListener("click", function(){
    var src = quiz.list.map(function(it){
      var ansIdx = 0, opts = it.opts.map(function(o, i){ if (o.ok) ansIdx = i; return o.text; });
      return { q: it.q, opts: opts, ans: ansIdx, why: it.why, term: it.term };
    });
    start(src, quiz.catName);
  });
  $("rHome").addEventListener("click", function(){ goto("scStart"); });

  /* ---------- 용어 사전 ---------- */
  (function(){
    var box = $("glist");
    D.glossary.forEach(function(g){
      var d = document.createElement("div"); d.className = "gitem";
      var b = document.createElement("b"); b.textContent = g.t;
      var s = document.createElement("span"); s.textContent = g.d;
      d.appendChild(b); d.appendChild(s); box.appendChild(d);
    });
  })();
  var modal = $("glossModal");
  $("btnGloss").addEventListener("click", function(){ modal.classList.add("on"); });
  $("glossClose").addEventListener("click", function(){ modal.classList.remove("on"); });
  modal.addEventListener("click", function(e){ if (e.target === modal) modal.classList.remove("on"); });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") modal.classList.remove("on"); });

  /* ---------- 설정 버튼 ---------- */
  $("btnSound").addEventListener("click", function(){
    opt.sound = !opt.sound;
    this.textContent = opt.sound ? "🔊" : "🔇";
    this.classList.toggle("off", !opt.sound);
    if (opt.sound) beep("ok");
  });
  var fxBtn = $("btnFx");
  fxBtn.classList.toggle("off", !opt.fx);
  fxBtn.addEventListener("click", function(){
    opt.fx = !opt.fx;
    this.classList.toggle("off", !opt.fx);
    this.title = opt.fx ? "화면 효과 끄기" : "화면 효과 켜기";
  });

  buildStart();
})();
</script>
</body>
</html>
