<!DOCTYPE html><html lang="ko"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>SWING COPTER — 스윙 콥터</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#071423;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;
    font-family:"Segoe UI",Tahoma,Verdana,Arial,sans-serif}
  #c{position:absolute;display:block;cursor:pointer}
</style>
<canvas id=c></canvas>
<script>
'use strict';
const VW=480,VH=760,TAU=Math.PI*2,M=Math;
const FONT='"Segoe UI",Tahoma,Verdana,Arial,sans-serif';
const cv=document.getElementById('c'),c=cv.getContext('2d');
let DPR=1,scale=1;
const cl=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a===undefined?M.random():a+M.random()*(b-a);
const hs=n=>{n=M.sin(n*127.1)*43758.5;return n-M.floor(n)};
function fit(){
  DPR=M.min(2,window.devicePixelRatio||1);
  const iw=innerWidth,ih=innerHeight;
  scale=M.min(iw/VW,ih/VH);
  const w=VW*scale,h=VH*scale;
  cv.style.width=w+'px';cv.style.height=h+'px';
  cv.style.left=(iw-w)/2+'px';cv.style.top=(ih-h)/2+'px';
  cv.width=M.round(VW*DPR);cv.height=M.round(VH*DPR);
  c.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',fit);
let DTg=0;
/* ---------- audio ---------- */
let ac=null,sv=.8;
function initA(){if(ac)return;
  try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function snd(f,d,tp,v,sl){
  if(!ac||!sv)return;
  const o=ac.createOscillator(),n=ac.createGain(),t=ac.currentTime;
  o.type=tp||'square';o.frequency.setValueAtTime(f,t);
  if(sl)o.frequency.linearRampToValueAtTime(M.max(30,f+sl),t+d);
  n.gain.setValueAtTime((v||.05)*sv,t);
  n.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(n);n.connect(ac.destination);o.start(t);o.stop(t+d);
}
let rotorOsc=null,rotorGain=null;
function rotorOn(){
  if(!ac||rotorOsc)return;
  rotorOsc=ac.createOscillator();rotorGain=ac.createGain();
  rotorOsc.type='sawtooth';rotorOsc.frequency.value=62;rotorGain.gain.value=0;
  rotorOsc.connect(rotorGain);rotorGain.connect(ac.destination);rotorOsc.start();
}
function rotorSet(v,f){
  if(!rotorGain)return;
  rotorGain.gain.setTargetAtTime(v*sv,ac.currentTime,.08);
  rotorOsc.frequency.setTargetAtTime(f,ac.currentTime,.12);
}
/* ============ 아트 — 스카이 에이스의 3D 음영 + 귀여운 캐릭터 ============ */
function lg(c,x0,y0,x1,y1,st){const g=c.createLinearGradient(x0,y0,x1,y1);
  for(const s of st)g.addColorStop(s[0],s[1]);return g}
function rg(c,x0,y0,r0,x1,y1,r1,st){const g=c.createRadialGradient(x0,y0,r0,x1,y1,r1);
  for(const s of st)g.addColorStop(s[0],s[1]);return g}
function clipFill(c,path,fill){c.save();path();c.clip();fill();c.restore()}
function rr(c,x,y,w,h,r){
  c.beginPath();
  if(c.roundRect)c.roundRect(x,y,w,h,r);
  else{c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);
       c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
}

/* ---------- 맵별 캐릭터 배색 ---------- */
const SKIN=[
 {b:[[0,'#1f3354'],[.13,'#466ca1'],[.4,'#a8cdf2'],[.58,'#78a2d2'],[.82,'#2f4b76'],[1,'#17263c']],
  v:[[0,'#e9f8ff'],[.22,'#9adcf8'],[.55,'#3a8cc2'],[.86,'#14406a'],[1,'#0d2a46']],
  t:'#ffb23f', g:'255,205,90'},
 {b:[[0,'#17433f'],[.13,'#2c8174'],[.4,'#95e8d8'],[.58,'#4fb4a4'],[.82,'#1f5f58'],[1,'#103431']],
  v:[[0,'#eafff9'],[.22,'#9bf0e0'],[.55,'#2f9e94'],[.86,'#104a48'],[1,'#0a302f']],
  t:'#ffd36b', g:'120,255,228'},
 {b:[[0,'#282152'],[.13,'#554492'],[.4,'#c6b4f8'],[.58,'#8d79d4'],[.82,'#392d72'],[1,'#1f1942']],
  v:[[0,'#f7f0ff'],[.22,'#cdb4fb'],[.55,'#6d53b8'],[.86,'#2d2160'],[1,'#1b1442']],
  t:'#ff9bd2', g:'195,155,255'}
];
function bodyPath(c){
  c.beginPath();
  c.moveTo(0,-27);
  c.bezierCurveTo(17,-27,27,-15,27,0);
  c.bezierCurveTo(27,17,16,28,0,28);
  c.bezierCurveTo(-16,28,-27,17,-27,0);
  c.bezierCurveTo(-27,-15,-17,-27,0,-27);
  c.closePath();
}
function visorPath(c){
  c.beginPath();
  c.moveTo(0,-20);
  c.bezierCurveTo(13,-20,20,-11,20,-1);
  c.bezierCurveTo(20,11,11,18,0,18);
  c.bezierCurveTo(-11,18,-20,11,-20,-1);
  c.bezierCurveTo(-20,-11,-13,-20,0,-20);
  c.closePath();
}
/* ---------- 얼굴 ---------- */
function face(c,t,look,k){
  const blink=((t*0.62)%1)<0.055;          /* 가끔 깜빡 */
  const ex=7.9,ey=-4.2;
  for(const s of[-1,1]){
    const x=s*ex;
    if(blink){
      c.strokeStyle='#16263c';c.lineWidth=2.4;c.lineCap='round';
      c.beginPath();c.moveTo(x-5.4,ey+1);c.quadraticCurveTo(x,ey+3.4,x+5.4,ey+1);c.stroke();
      continue;
    }
    /* 흰자 */
    c.fillStyle=rg(c,x-1.6,ey-2.6,.6,x,ey,9,[[0,'#ffffff'],[.7,'#f2f8ff'],[1,'#cfe0f0']]);
    c.beginPath();c.ellipse(x,ey,6.6,7.8,0,0,TAU);c.fill();
    c.strokeStyle='rgba(16,30,48,.45)';c.lineWidth=.9;c.stroke();
    /* 눈동자 */
    const px=x+look*2.4,py=ey+1.1;
    c.fillStyle=rg(c,px-1,py-1.4,.4,px,py,5,[[0,'#3c5878'],[.5,'#17283e'],[1,'#0a1422']]);
    c.beginPath();c.arc(px,py,4.1,0,TAU);c.fill();
    c.fillStyle='rgba(255,255,255,.95)';
    c.beginPath();c.arc(px-1.5,py-1.8,1.7,0,TAU);c.fill();
    c.fillStyle='rgba(255,255,255,.5)';
    c.beginPath();c.arc(px+1.4,py+1.6,.9,0,TAU);c.fill();
  }
  /* 볼터치 */
  for(const s of[-1,1]){
    c.fillStyle=rg(c,s*14,5.6,0,s*14,5.6,6,
      [[0,'rgba(255,128,150,.55)'],[1,'rgba(255,128,150,0)']]);
    c.beginPath();c.ellipse(s*14,5.6,6,4,0,0,TAU);c.fill();
  }
  /* 미소 */
  c.strokeStyle='rgba(16,30,48,.8)';c.lineWidth=1.9;c.lineCap='round';
  c.beginPath();c.moveTo(-4.6,6.4);c.quadraticCurveTo(0,10.6,4.6,6.4);c.stroke();
}
/* ---------- 맵별 추진 장치 ---------- */
function rotorBlur(c,ph,sp,k){            /* 하늘 — 회전 로터 */
  const span=46;
  c.save();c.globalAlpha=.12+sp*.2;
  c.fillStyle=rg(c,0,-40,2,0,-40,span,
    [[0,'rgba(228,244,255,.95)'],[.55,'rgba(176,208,238,.5)'],[1,'rgba(150,190,226,0)']]);
  c.beginPath();c.ellipse(0,-40,span,5.5,0,0,TAU);c.fill();c.restore();
  for(let i=0;i<2;i++){
    const a=ph+i*M.PI,cs=M.cos(a),x1=cs*span,y1=-40+M.sin(a)*3.2;
    c.save();c.globalAlpha=.34+M.abs(cs)*.5;
    c.strokeStyle=lg(c,0,-42,x1,y1,
      [[0,'#dde9f6'],[.5,'#93a9c0'],[1,'rgba(200,220,240,.25)']]);
    c.lineWidth=2.6;c.lineCap='round';
    c.beginPath();c.moveTo(0,-40);c.lineTo(x1,y1);c.stroke();c.restore();
  }
  c.fillStyle=lg(c,-4,0,4,0,[[0,'#3c4a5c'],[.4,'#b0bfcf'],[1,'#39465a']]);
  c.beginPath();c.moveTo(-4,-23);c.lineTo(4,-23);c.lineTo(2.6,-39);c.lineTo(-2.6,-39);
  c.closePath();c.fill();
  c.fillStyle=lg(c,0,-45,0,-35,[[0,'#e8f2fb'],[.45,'#90a3b9'],[1,'#2f3b4c']]);
  c.beginPath();c.ellipse(0,-40,7.5,4.2,0,0,TAU);c.fill();
  c.fillStyle='rgba(255,255,255,.6)';
  c.beginPath();c.ellipse(-1.8,-41.6,3,1.3,-.2,0,TAU);c.fill();
  c.fillStyle=k.t;c.beginPath();c.ellipse(0,-40,2,1.2,0,0,TAU);c.fill();
}
function screwProp(c,ph,sp,k,t){          /* 수중 — 등지느러미 + 스크루 */
  /* 등지느러미 */
  c.beginPath();
  c.moveTo(-2,-26);c.bezierCurveTo(-2,-38,8,-42,14,-40);
  c.bezierCurveTo(10,-34,8,-30,7,-25);c.closePath();
  c.fillStyle=lg(c,-2,-40,14,-25,[[0,'#7ff0dd'],[.5,'#2f9e92'],[1,'#13504c']]);
  c.fill();c.strokeStyle='rgba(6,30,30,.7)';c.lineWidth=1.1;c.stroke();
  /* 스크루 (아래) */
  c.save();c.translate(0,33);
  c.globalAlpha=.16+sp*.26;
  c.fillStyle=rg(c,0,0,1,0,0,15,
    [[0,'rgba(226,255,250,.9)'],[.6,'rgba(140,230,215,.45)'],[1,'rgba(120,210,200,0)']]);
  c.beginPath();c.ellipse(0,0,15,5,0,0,TAU);c.fill();
  c.globalAlpha=1;
  for(let i=0;i<3;i++){
    const a=ph*.7+i*TAU/3,cs=M.cos(a);
    c.save();c.globalAlpha=.4+M.abs(cs)*.45;
    c.fillStyle=lg(c,0,-4,0,4,[[0,'#dffaf4'],[1,'#3d8f86']]);
    c.beginPath();c.ellipse(cs*8,0,M.max(1.4,M.abs(cs)*5),3.4,0,0,TAU);c.fill();c.restore();
  }
  c.restore();
  c.fillStyle=lg(c,-3.2,0,3.2,0,[[0,'#1d4a46'],[.42,'#bfe9e2'],[1,'#20524e']]);
  rr(c,-3.2,24,6.4,10,3);c.fill();
  /* 옆 지느러미 */
  for(const s of[-1,1]){
    c.beginPath();
    c.moveTo(s*23,3);c.bezierCurveTo(s*36,7,s*40,16,s*34,22);
    c.lineTo(s*22,15);c.closePath();
    c.fillStyle=lg(c,s*21,0,s*40,0,[[0,'#5fc9b9'],[.5,'#2b857a'],[1,'#13443f']]);
    c.fill();c.strokeStyle='rgba(6,30,30,.7)';c.lineWidth=1.1;c.stroke();
  }
}
function thruster(c,t,sp,k){              /* 우주 — 추진 노즐 + 안테나 */
  /* 노즐 */
  c.fillStyle=lg(c,-9,0,9,0,[[0,'#2a2350'],[.4,'#b6a8e4'],[1,'#2e2558']]);
  c.beginPath();c.moveTo(-8,24);c.lineTo(8,24);c.lineTo(11,34);c.lineTo(-11,34);
  c.closePath();c.fill();
  c.strokeStyle='rgba(12,8,30,.8)';c.lineWidth=1.1;c.stroke();
  /* 불꽃 */
  const fl=(.75+M.sin(t*26)*.15+M.sin(t*41)*.1)*(.5+sp*.5);
  c.save();c.globalCompositeOperation='lighter';
  c.fillStyle=rg(c,0,34,1,0,34,34*fl+14,
    [[0,'rgba(255,250,225,1)'],[.26,'rgba(255,190,100,.85)'],
     [.62,'rgba(255,120,60,.45)'],[1,'rgba(255,70,40,0)']]);
  c.beginPath();c.moveTo(-11,33);c.quadraticCurveTo(0,46+40*fl,11,33);c.closePath();c.fill();
  c.fillStyle='rgba(255,255,240,.95)';
  c.beginPath();c.moveTo(-5.5,33);c.quadraticCurveTo(0,40+22*fl,5.5,33);c.closePath();c.fill();
  c.restore();
  /* 부스터 */
  for(const s of[-1,1]){
    c.fillStyle=lg(c,s*23,0,s*40,0,[[0,'#a390e4'],[.45,'#51428f'],[1,'#241c48']]);
    rr(c,s>0?24:-38,0,14,22,6);c.fill();
    c.strokeStyle='rgba(12,8,30,.8)';c.lineWidth=1.2;c.stroke();
    c.fillStyle='rgba(255,255,255,.32)';
    rr(c,s>0?26.5:-35.5,2.5,4,14,2);c.fill();
    c.save();c.globalCompositeOperation='lighter';
    c.fillStyle=rg(c,s*31,26,0,s*31,26,14,
      [[0,'rgba(255,230,190,.85)'],[.4,'rgba(200,150,255,.45)'],[1,'rgba(150,110,255,0)']]);
    c.beginPath();c.arc(s*31,26,14,0,TAU);c.fill();c.restore();
  }
  /* 안테나 */
  c.strokeStyle=lg(c,0,-26,0,-42,[[0,'#8e7ad2'],[1,'#d8ccff']]);
  c.lineWidth=2.4;c.lineCap='round';
  c.beginPath();c.moveTo(0,-25);c.quadraticCurveTo(4,-35,2,-42);c.stroke();
  const bl=(t*2.2)%1<.45;
  c.save();c.globalCompositeOperation='lighter';
  c.fillStyle=rg(c,2,-43,0,2,-43,11,
    [[0,'rgba('+k.g+','+(bl?.9:.35)+')'],[1,'rgba('+k.g+',0)']]);
  c.beginPath();c.arc(2,-43,11,0,TAU);c.fill();c.restore();
  c.fillStyle=bl?'#fff':'#b9a6ea';
  c.beginPath();c.arc(2,-43,3.1,0,TAU);c.fill();
}
function skids(c){                        /* 하늘 — 착륙 스키드 */
  c.strokeStyle=lg(c,0,22,0,38,[[0,'#8d9fb4'],[1,'#44525f']]);
  c.lineWidth=3;c.lineCap='round';c.lineJoin='round';
  for(const dx of[-12,12]){c.beginPath();c.moveTo(dx,24);c.lineTo(dx*1.35,34);c.stroke()}
  c.strokeStyle=lg(c,-24,0,24,0,[[0,'#6f8197'],[.4,'#c5d4e4'],[1,'#6f8197']]);
  c.lineWidth=3.6;c.beginPath();c.moveTo(-22,35);c.lineTo(22,35);c.stroke();
  c.strokeStyle='rgba(255,255,255,.38)';c.lineWidth=1.1;
  c.beginPath();c.moveTo(-20,34.2);c.lineTo(20,34.2);c.stroke();
}
function sideFins(c){                     /* 하늘 — 옆 핀 */
  for(const s of[-1,1]){
    c.beginPath();
    c.moveTo(s*23,3);c.bezierCurveTo(s*35,7,s*39,15,s*35,21);
    c.lineTo(s*23,15);c.closePath();
    c.fillStyle=lg(c,s*21,0,s*39,0,[[0,'#5b84b6'],[.5,'#33557f'],[1,'#1b2b43']]);
    c.fill();c.strokeStyle='rgba(8,16,28,.7)';c.lineWidth=1.1;c.stroke();
  }
}
/* ---------- 캐릭터 본체 ---------- */
function drawCopter(c,x,y,tilt,ph,t,sc,opt){
  const o=opt||{},sp=o.spin===undefined?1:o.spin,S=sc||1,
        mp=o.map||0,k=SKIN[mp],look=cl((o.look===undefined?tilt*2.4:o.look),-1,1);
  c.save();c.translate(x,y);c.rotate(tilt);c.scale(S,S);

  /* 뒤쪽 장식 */
  if(mp===0){skids(c);sideFins(c)}
  else if(mp===1)screwProp(c,ph,sp,k,t);
  else thruster(c,t,sp,k);

  /* 몸통 */
  bodyPath(c);
  c.fillStyle=lg(c,-27,0,27,0,k.b);c.fill();
  c.strokeStyle='rgba(6,12,22,.85)';c.lineWidth=1.5;c.stroke();
  clipFill(c,()=>bodyPath(c),()=>{          /* 상단 광택 */
    c.fillStyle=lg(c,0,-30,0,-2,
      [[0,'rgba(255,255,255,.6)'],[.6,'rgba(255,255,255,.08)'],[1,'rgba(255,255,255,0)']]);
    c.fillRect(-32,-32,64,34);
  });
  clipFill(c,()=>bodyPath(c),()=>{          /* 하단 반사광 */
    c.fillStyle=lg(c,0,30,0,10,
      [[0,'rgba(190,235,255,.4)'],[1,'rgba(190,235,255,0)']]);
    c.fillRect(-32,6,64,28);
  });
  clipFill(c,()=>bodyPath(c),()=>{          /* 띠 */
    c.fillStyle=k.t;
    c.beginPath();c.moveTo(-28,18);c.bezierCurveTo(-11,23,11,23,28,18);
    c.lineTo(28,23);c.bezierCurveTo(11,28,-11,28,-28,23);c.closePath();c.fill();
    c.fillStyle='rgba(255,255,255,.34)';
    c.beginPath();c.moveTo(-28,18);c.bezierCurveTo(-11,23,11,23,28,18);
    c.lineTo(28,19.8);c.bezierCurveTo(11,24.8,-11,24.8,-28,19.8);c.closePath();c.fill();
  });

  /* 바이저 + 얼굴 */
  visorPath(c);
  c.fillStyle=lg(c,-14,-18,14,14,k.v);c.fill();
  clipFill(c,()=>visorPath(c),()=>{
    c.fillStyle='rgba(236,250,255,.82)';          /* 얼굴이 놓일 밝은 면 */
    c.beginPath();c.ellipse(0,-1,19,17.5,0,0,TAU);c.fill();
    face(c,t,look,k);
    c.fillStyle='rgba(255,255,255,.4)';           /* 유리 반사 */
    c.beginPath();c.moveTo(-14,-7);c.bezierCurveTo(-10,-16,-1,-19,7,-17);
    c.lineTo(5,-13);c.bezierCurveTo(-2,-15,-9,-12,-11,-5);c.closePath();c.fill();
    c.fillStyle='rgba(255,255,255,.18)';
    c.beginPath();c.moveTo(-16,2);c.bezierCurveTo(-12,-8,-2,-13,8,-11);
    c.lineTo(7,-9);c.bezierCurveTo(-1,-11,-10,-6,-14,3);c.closePath();c.fill();
  });
  c.strokeStyle='rgba(10,22,38,.85)';c.lineWidth=1.5;visorPath(c);c.stroke();
  if(mp===1){                                      /* 잠수 헬멧 볼트 */
    for(let i=0;i<10;i++){
      const a=i/10*TAU,bx=M.cos(a)*20.5,by=-1+M.sin(a)*18.2;
      c.fillStyle=rg(c,bx-.5,by-.5,0,bx,by,2.2,[[0,'#eaf6f2'],[.6,'#79a69f'],[1,'#2d4b48']]);
      c.beginPath();c.arc(bx,by,2,0,TAU);c.fill();
    }
  }
  /* 항법등 */
  const blink=(t*2.6)%1<.15;
  for(const[lx,col,glow]of[[-26,'#ff6b6b','255,90,90'],[26,'#5dff8a','90,255,130']]){
    c.fillStyle=rg(c,lx,6,0,lx,6,9,[[0,'rgba('+glow+',.85)'],[1,'rgba('+glow+',0)']]);
    c.beginPath();c.arc(lx,6,9,0,TAU);c.fill();
    c.fillStyle=col;c.beginPath();c.arc(lx,6,2,0,TAU);c.fill();
  }
  if(mp===0){
    if(blink){
      c.fillStyle=rg(c,0,-26,0,0,-26,13,[[0,'rgba(255,255,255,.9)'],[1,'rgba(200,230,255,0)']]);
      c.beginPath();c.arc(0,-26,13,0,TAU);c.fill();
    }
    c.fillStyle=blink?'#fff':'#7b8da0';
    c.beginPath();c.arc(0,-26,1.8,0,TAU);c.fill();
    rotorBlur(c,ph,sp,k);
  }
  c.restore();
}

/* ---------- 재질 ---------- */
function steelV(c,x,y,w,h){
  return lg(c,x,0,x+w,0,
    [[0,'#1c242e'],[.1,'#44525f'],[.32,'#aebdcb'],[.5,'#7d8c9b'],[.78,'#3c4956'],[1,'#161d25']]);
}
function steelH(c,x,y,w,h){
  return lg(c,0,y,0,y+h,
    [[0,'#1c242e'],[.12,'#4a5865'],[.34,'#b6c4d1'],[.52,'#8695a4'],[.8,'#3a4753'],[1,'#151c24']]);
}
function rockH(c,y,h){
  return lg(c,0,y,0,y+h,
    [[0,'#10302f'],[.12,'#2c5a52'],[.34,'#86b3a2'],[.52,'#548577'],[.8,'#2a504a'],[1,'#0d2422']]);
}
function hullH(c,y,h){
  return lg(c,0,y,0,y+h,
    [[0,'#171233'],[.12,'#3a2f68'],[.34,'#a496d8'],[.52,'#6d5fa8'],[.8,'#332a60'],[1,'#140f2c']]);
}
function hazard(c,x,y,w,h){
  c.save();rr(c,x,y,w,h,2);c.clip();
  c.fillStyle='#f0a81e';c.fillRect(x,y,w,h);
  c.fillStyle='rgba(22,26,32,.9)';
  for(let i=-h;i<w+h;i+=16)
    {c.beginPath();c.moveTo(x+i,y+h);c.lineTo(x+i+8,y+h);c.lineTo(x+i+8+h,y);c.lineTo(x+i+h,y);
     c.closePath();c.fill()}
  c.fillStyle='rgba(255,255,255,.22)';c.fillRect(x,y,w,h*.34);
  c.restore();
}
function rivets(c,x0,x1,y,n,r){
  for(let i=0;i<n;i++){
    const px=x0+(x1-x0)*(i+.5)/n;
    c.fillStyle=rg(c,px-r*.3,y-r*.3,0,px,y,r,[[0,'#dfe8f1'],[.55,'#8695a4'],[1,'#39454f']]);
    c.beginPath();c.arc(px,y,r,0,TAU);c.fill();
  }
}
function barnacles(c,x0,x1,y,n,sd){
  for(let i=0;i<n;i++){
    const px=x0+(x1-x0)*(i+.5)/n, r=2+hs(sd+i)*1.8;
    c.fillStyle=rg(c,px-r*.3,y-r*.3,0,px,y,r,[[0,'#f2fbf5'],[.5,'#9ec4b2'],[1,'#2d4f46']]);
    c.beginPath();c.arc(px,y,r,0,TAU);c.fill();
    c.fillStyle='rgba(20,46,42,.7)';
    c.beginPath();c.arc(px,y,r*.34,0,TAU);c.fill();
  }
}
/* ---------- 게이트 빔 ---------- */
function drawBeam(c,x,y,w,h,side,mp){
  c.fillStyle='rgba(4,10,20,.3)';
  rr(c,x+4,y+6,w,h,6);c.fill();
  rr(c,x,y,w,h,mp===1?8:5);
  c.fillStyle=mp===1?rockH(c,y,h):mp===2?hullH(c,y,h):steelH(c,x,y,w,h);
  c.fill();
  c.strokeStyle='rgba(6,12,20,.8)';c.lineWidth=1.4;c.stroke();
  const inx=side>0?x+w:x;                   /* 통로를 마주보는 끝 */
  if(mp===0){
    hazard(c,x+(side>0?4:w-30),y+h*.26,26,h*.48);
    rivets(c,x+8,x+w-8,y+5,M.max(2,(w/26)|0),2.1);
    rivets(c,x+8,x+w-8,y+h-5,M.max(2,(w/26)|0),2.1);
  }else if(mp===1){
    /* 산호 무늬 + 따개비 */
    c.save();rr(c,x,y,w,h,8);c.clip();
    for(let i=0;i<M.max(3,(w/16)|0);i++){
      const px=x+6+i*15, r=3+hs(px+y)*3.4;
      c.fillStyle='rgba(255,150,120,'+(.18+hs(px*1.7)*.22).toFixed(2)+')';
      c.beginPath();c.arc(px,y+h*.5+(hs(px*.7)-.5)*h*.4,r,0,TAU);c.fill();
    }
    c.restore();
    barnacles(c,x+8,x+w-8,y+6,M.max(2,(w/30)|0),x);
    /* 흔들리는 해초 */
    c.strokeStyle='rgba(96,196,140,.85)';c.lineWidth=2.6;c.lineCap='round';
    for(let i=0;i<3;i++){
      const bx=inx-(side>0?6+i*7:-(6+i*7)), sw2=M.sin(y*.05+i*1.3)*5;
      c.beginPath();c.moveTo(bx,y+h);
      c.quadraticCurveTo(bx+sw2,y+h+9,bx+sw2*1.8,y+h+17);c.stroke();
    }
  }else{
    /* 에너지 라인 + 주행등 */
    c.save();rr(c,x,y,w,h,5);c.clip();
    c.fillStyle='rgba(255,255,255,.14)';c.fillRect(x,y+h*.2,w,2);
    c.globalCompositeOperation='lighter';
    c.fillStyle=lg(c,0,y+h*.42,0,y+h*.58,
      [[0,'rgba(120,230,255,0)'],[.5,'rgba(150,240,255,.85)'],[1,'rgba(120,230,255,0)']]);
    c.fillRect(x,y+h*.42,w,h*.16);
    c.restore();
    for(let i=0;i<M.max(2,(w/34)|0);i++){
      const px=x+10+i*34;
      c.fillStyle=rg(c,px,y+h-5,0,px,y+h-5,5,
        [[0,'rgba(255,215,120,.9)'],[1,'rgba(255,190,90,0)']]);
      c.beginPath();c.arc(px,y+h-5,5,0,TAU);c.fill();
    }
  }
  /* 끝단 캡 */
  const cx2=side>0?x+w:x;
  rr(c,cx2-(side>0?12:0),y-3,12,h+6,4);
  c.fillStyle=mp===1?rockH(c,y-3,h+6):mp===2?hullH(c,y-3,h+6):steelH(c,0,y-3,0,h+6);
  c.fill();
  c.strokeStyle='rgba(6,12,20,.85)';c.lineWidth=1.3;c.stroke();
  c.fillStyle='rgba(255,255,255,.3)';
  c.fillRect(cx2-(side>0?10:-2),y-1,8,2);
  c.fillStyle='rgba(255,255,255,.3)';
  rr(c,x+3,y+2,w-6,2.4,1.2);c.fill();
}
/* ---------- 스윙 장애물 ---------- */
function drawHammer(c,px,py,ang,len,r,mp,t){
  const hx=px+M.sin(ang)*len,hy=py+M.cos(ang)*len;
  /* 피벗 */
  c.fillStyle=rg(c,px-2,py-2,0,px,py,8,
    mp===1?[[0,'#e6f6ef'],[.5,'#7fa89c'],[1,'#2c4a45']]:
    mp===2?[[0,'#efe9ff'],[.5,'#8d7fc0'],[1,'#2e2558']]:
           [[0,'#dfe8f1'],[.5,'#7f8d9c'],[1,'#303b45']]);
  c.beginPath();c.arc(px,py,7,0,TAU);c.fill();
  c.strokeStyle='rgba(6,12,20,.8)';c.lineWidth=1.2;c.stroke();
  if(mp===1){
    /* 쇠사슬 */
    c.save();c.translate(px,py);c.rotate(-ang);
    for(let i=6;i<len;i+=7){
      c.strokeStyle=i%14<7?'#9fb8b2':'#5c7a74';c.lineWidth=2;
      c.beginPath();c.ellipse(0,i,3.1,4,0,0,TAU);c.stroke();
    }
    c.restore();
  }else if(mp===2){
    /* 에너지 테더 */
    c.save();c.translate(px,py);c.rotate(-ang);
    c.globalCompositeOperation='lighter';
    c.strokeStyle=lg(c,0,0,0,len,
      [[0,'rgba(150,220,255,.75)'],[1,'rgba(190,150,255,.9)']]);
    c.lineWidth=2.6;c.lineCap='round';
    c.beginPath();c.moveTo(0,0);c.lineTo(0,len);c.stroke();
    c.fillStyle='rgba(230,245,255,.85)';
    for(let i=8;i<len;i+=9){c.beginPath();c.arc(0,i,1.5,0,TAU);c.fill()}
    c.restore();
  }else{
    c.save();c.translate(px,py);c.rotate(-ang);
    c.fillStyle=lg(c,-3.4,0,3.4,0,
      [[0,'#222c36'],[.18,'#6f7e8d'],[.42,'#d3e0ec'],[.7,'#7b8a99'],[1,'#1e272f']]);
    rr(c,-3.4,0,6.8,len,3);c.fill();
    c.strokeStyle='rgba(6,12,20,.65)';c.lineWidth=1;c.stroke();
    c.restore();
  }
  /* 머리 */
  c.fillStyle='rgba(6,14,26,.3)';
  c.beginPath();c.arc(hx+3,hy+5,r,0,TAU);c.fill();
  if(mp===1){
    /* 기뢰 — 가시 달린 구체 */
    for(let i=0;i<8;i++){
      const a=i/8*TAU+ang*.3,ex=hx+M.cos(a)*(r+6),ey=hy+M.sin(a)*(r+6);
      c.strokeStyle=lg(c,hx,hy,ex,ey,[[0,'#5d6d6a'],[1,'#c8d8d2']]);
      c.lineWidth=3.4;c.lineCap='round';
      c.beginPath();c.moveTo(hx+M.cos(a)*r*.8,hy+M.sin(a)*r*.8);c.lineTo(ex,ey);c.stroke();
    }
    c.fillStyle=rg(c,hx-r*.4,hy-r*.45,r*.1,hx,hy,r*1.25,
      [[0,'#d8e6e0'],[.22,'#8fa7a0'],[.55,'#46605b'],[.85,'#22332f'],[1,'#141f1d']]);
    c.beginPath();c.arc(hx,hy,r,0,TAU);c.fill();
    c.strokeStyle='rgba(6,20,18,.85)';c.lineWidth=1.5;c.stroke();
    c.save();c.beginPath();c.arc(hx,hy,r,0,TAU);c.clip();
    c.fillStyle='rgba(224,72,60,.85)';c.fillRect(hx-r,hy-r*.2,r*2,r*.4);
    c.restore();
  }else if(mp===2){
    /* 에너지 오브 */
    c.save();c.globalCompositeOperation='lighter';
    c.fillStyle=rg(c,hx,hy,0,hx,hy,r*2.6,
      [[0,'rgba(235,215,255,.95)'],[.3,'rgba(175,135,255,.55)'],[1,'rgba(120,80,230,0)']]);
    c.beginPath();c.arc(hx,hy,r*2.6,0,TAU);c.fill();c.restore();
    c.fillStyle=rg(c,hx-r*.3,hy-r*.35,r*.1,hx,hy,r*1.15,
      [[0,'#ffffff'],[.42,'#eadcff'],[.76,'#a07ef0'],[1,'#4a2aa0']]);
    c.beginPath();c.arc(hx,hy,r,0,TAU);c.fill();
    c.save();c.globalCompositeOperation='lighter';
    c.strokeStyle='rgba(190,230,255,.75)';c.lineWidth=1.5;
    c.beginPath();c.ellipse(hx,hy,r*1.5,r*.48,(t||0)*1.6,0,TAU);c.stroke();
    c.restore();
  }else{
    c.fillStyle=rg(c,hx-r*.4,hy-r*.45,r*.1,hx,hy,r*1.25,
      [[0,'#eef5fc'],[.22,'#b8c7d6'],[.55,'#5d6d7d'],[.85,'#28313b'],[1,'#1a222b']]);
    c.beginPath();c.arc(hx,hy,r,0,TAU);c.fill();
    c.strokeStyle='rgba(6,12,20,.85)';c.lineWidth=1.5;c.stroke();
    c.save();c.beginPath();c.arc(hx,hy,r,0,TAU);c.clip();
    c.fillStyle='rgba(224,72,60,.9)';c.fillRect(hx-r,hy-r*.22,r*2,r*.44);
    c.fillStyle='rgba(255,255,255,.26)';c.fillRect(hx-r,hy-r*.22,r*2,r*.16);
    c.restore();
  }
  c.fillStyle='rgba(255,255,255,.7)';
  c.beginPath();c.ellipse(hx-r*.38,hy-r*.44,r*.3,r*.18,-.5,0,TAU);c.fill();
}
/* ---------- 측벽 ---------- */
function drawWalls(c,wx,H2,scrollY,mp,t){
  const seg=74,off=((scrollY%seg)+seg)%seg;
  for(const s of[-1,1]){
    const x=s<0?0:VW-wx;
    c.fillStyle=mp===1?lg(c,x,0,x+wx,0,
        [[0,'#0b2320'],[.12,'#1f4a43'],[.34,'#5d8f80'],[.54,'#3a6a5f'],[.8,'#1a403a'],[1,'#09201d']]):
      mp===2?lg(c,x,0,x+wx,0,
        [[0,'#120e28'],[.12,'#2c2456'],[.34,'#7a6cb4'],[.54,'#4e4188'],[.8,'#281f52'],[1,'#0f0b22']]):
      steelV(c,x,0,wx,H2);
    c.fillRect(x,0,wx,H2);
    for(let y=off-seg;y<H2+seg;y+=seg){
      if(mp===1){
        c.strokeStyle='rgba(6,24,22,.55)';c.lineWidth=1.4;
        c.beginPath();c.moveTo(x+2,y+3);
        c.quadraticCurveTo(x+wx*.5,y-3,x+wx-2,y+3);c.stroke();
        barnacles(c,x+5,x+wx-5,y+seg*.5,2,y);
      }else if(mp===2){
        c.strokeStyle='rgba(8,6,22,.6)';c.lineWidth=1.2;
        c.beginPath();c.moveTo(x+2,y);c.lineTo(x+wx-2,y);c.stroke();
        c.save();c.globalCompositeOperation='lighter';
        c.fillStyle='rgba(150,210,255,.5)';
        c.fillRect(x+wx*.3,y+seg*.5-1.5,wx*.4,3);c.restore();
      }else{
        c.strokeStyle='rgba(6,12,20,.5)';c.lineWidth=1.2;
        c.beginPath();c.moveTo(x+2,y);c.lineTo(x+wx-2,y);c.stroke();
        c.strokeStyle='rgba(255,255,255,.16)';
        c.beginPath();c.moveTo(x+2,y+1.6);c.lineTo(x+wx-2,y+1.6);c.stroke();
        rivets(c,x+5,x+wx-5,y+seg*.5,2,2);
      }
    }
    /* 안쪽 경계선 */
    const ix=s<0?wx-4:VW-wx;
    if(mp===1){
      c.save();c.globalCompositeOperation='lighter';
      c.fillStyle='rgba(90,230,160,.5)';c.fillRect(ix,0,4,H2);c.restore();
      c.strokeStyle='rgba(96,196,140,.8)';c.lineWidth=2.4;c.lineCap='round';
      for(let y=off-seg;y<H2+seg;y+=44){
        const sw2=M.sin(y*.05+(t||0)*1.2)*6*(s<0?1:-1);
        c.beginPath();c.moveTo(ix+(s<0?0:4),y);
        c.quadraticCurveTo(ix+(s<0?6:-2)+sw2,y+11,ix+(s<0?2:2)+sw2*1.6,y+24);c.stroke();
      }
    }else if(mp===2){
      c.save();c.globalCompositeOperation='lighter';
      c.fillStyle=lg(c,ix,0,ix+4,0,
        [[0,'rgba(120,220,255,.25)'],[.5,'rgba(170,240,255,.95)'],[1,'rgba(120,220,255,.25)']]);
      c.fillRect(ix,0,4,H2);
      for(let y=off-seg;y<H2+seg;y+=52){
        const yy=y+((t||0)*60)%52;
        c.fillStyle='rgba(255,255,255,.75)';c.fillRect(ix-1,yy,6,14);
      }
      c.restore();
    }else{
      c.fillStyle='rgba(240,168,30,.85)';c.fillRect(ix,0,4,H2);
      c.fillStyle='rgba(22,26,32,.75)';
      for(let y=off-seg;y<H2+seg;y+=26)c.fillRect(ix,y,4,13);
      c.fillStyle='rgba(255,255,255,.25)';c.fillRect(ix,0,1.4,H2);
    }
  }
}

/* ============ 배경 — 하늘 · 수중 · 우주 ============ */
const mixc=(a,b,f)=>[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f,a[2]+(b[2]-a[2])*f];
const rgba=(k,a)=>'rgba('+(k[0]|0)+','+(k[1]|0)+','+(k[2]|0)+','+a+')';
const rgbs=k=>'rgb('+(k[0]|0)+','+(k[1]|0)+','+(k[2]|0)+')';
const SPAN=VH+300;
const wrap=v=>((v%SPAN)+SPAN)%SPAN-150;

  {h:0,    t:[[2,8,18],[5,16,30]],          a:[[70,150,190],[90,130,150]],   st:1,  n:'심연 ABYSS'},

  {h:0,    t:[[6,12,34],[16,34,70]],        a:[[70,120,220],[40,70,150]],    st:.5, n:'저궤도 LOW ORBIT'},
  {h:2400, t:[[8,10,26],[18,20,44]],        a:[[150,130,110],[90,78,66]],    st:.75,n:'소행성대 BELT'},
  {h:5200, t:[[22,8,42],[46,16,70]],        a:[[214,96,210],[96,70,220]],    st:.9, n:'성운 NEBULA'},
  {h:8000, t:[[34,20,12],[64,44,18]],       a:[[255,206,120],[230,140,60]],  st:1,  n:'은하 중심 CORE'},
  {h:10500,t:[[2,2,6],[6,4,14]],            a:[[255,170,90],[180,90,220]],   st:1,  n:'블랙홀 경계 HORIZON'}]
];
let ZC=null, WMAP=0;
function zoneAt(alt,mp){
  const Z=ZONES[mp===undefined?WMAP:mp];
  let i=0;while(i<Z.length-2&&alt>=Z[i+1].h)i++;
  const A=Z[i],B=Z[M.min(Z.length-1,i+1)],
        f=cl((alt-A.h)/M.max(1,B.h-A.h),0,1);
  return{t:[mixc(A.t[0],B.t[0],f),mixc(A.t[1],B.t[1],f)],
         a:[mixc(A.a[0],B.a[0],f),mixc(A.a[1],B.a[1],f)],
         st:A.st+(B.st-A.st)*f, name:f<.5?A.n:B.n};
}
/* ---------- 씨앗 ---------- */
let clouds=[],stars=[],motes=[],fish=[],rocks=[],gas=[];
function setWorld(m){WMAP=m;seedSky()}
function seedSky(){
  clouds=[];stars=[];motes=[];fish=[];rocks=[];gas=[];
  if(WMAP===0){
    for(let i=0;i<34;i++)clouds.push({wy:rnd(0,SPAN),x:rnd(-60,VW+60),s:rnd(.5,1.5),
      par:rnd(.34,.86),dx:rnd(-9,9),ph:rnd(0,TAU)});
    for(let i=0;i<130;i++)stars.push({x:rnd(0,VW),y:rnd(0,VH),r:rnd(.5,1.5),
      ph:rnd(0,TAU),sp:rnd(.6,2.2)});
  }else if(WMAP===1){
    for(let i=0;i<46;i++)motes.push({wy:rnd(0,SPAN),x:rnd(0,VW),r:rnd(.8,2.6),
      par:rnd(.5,1.05),ph:rnd(0,TAU),k:0});            /* 마린스노 */
    for(let i=0;i<30;i++)motes.push({wy:rnd(0,SPAN),x:rnd(0,VW),r:rnd(2,6.5),
      par:rnd(1.3,2.3),ph:rnd(0,TAU),k:1});            /* 기포 */
    for(let i=0;i<9;i++)fish.push({wy:rnd(0,SPAN),x:rnd(0,VW),s:rnd(.55,1.5),
      par:rnd(.45,.95),v:rnd(16,46)*(rnd(0,1)<.5?-1:1),ph:rnd(0,TAU),
      k:rnd(0,1)<.68?0:1});                            /* 0 물고기 1 해파리 */
    for(let i=0;i<70;i++)stars.push({x:rnd(0,VW),y:rnd(0,VH),r:rnd(.6,1.8),
      ph:rnd(0,TAU),sp:rnd(.5,1.6)});                  /* 발광 플랑크톤 */
  }else{
    for(let i=0;i<210;i++)stars.push({x:rnd(0,VW),y:rnd(0,SPAN),r:rnd(.4,1.7),
      ph:rnd(0,TAU),sp:rnd(.5,2.4),par:rnd(.04,.3)});
    for(let i=0;i<11;i++)gas.push({wy:rnd(0,SPAN),x:rnd(-40,VW+40),s:rnd(70,190),
      par:rnd(.22,.5),ph:rnd(0,TAU)});
    for(let i=0;i<13;i++){
      const n=6+((rnd(0,4))|0),p=[];
      for(let j=0;j<n;j++)p.push(.62+rnd(0,.46));
      rocks.push({wy:rnd(0,SPAN),x:rnd(0,VW),s:rnd(7,22),par:rnd(.55,1.1),
        rot:rnd(0,TAU),rv:rnd(-.6,.6),p});
    }
  }
}
/* ---------- 공용 조각 ---------- */
function blob(c,x,y,s,col){
  c.beginPath();
  c.arc(x,y,24*s,0,TAU);c.arc(x+26*s,y+6*s,18*s,0,TAU);
  c.arc(x-25*s,y+8*s,16*s,0,TAU);c.arc(x+5*s,y-13*s,17*s,0,TAU);
  c.fillStyle=col;c.fill();
}
function twinkle(k,t){
  if(k.st<=.02)return;
  for(const s of stars){
    const tw=.55+M.sin(t*s.sp+s.ph)*.45;
    c.fillStyle='rgba(255,255,255,'+(k.st*tw*.9).toFixed(3)+')';
    c.beginPath();c.arc(s.x,s.y,s.r,0,TAU);c.fill();
  }
}

function drawSeaMap(camY,t,k,alt){

         [1,'rgba(255,255,255,0)']]);

    }

  /* 물고기 · 해파리 */
  for(const q of fish){
    const sy=wrap(q.wy-camY*q.par);

    const x=(((q.x+q.v*t)%(VW+180))+VW+180)%(VW+180)-90,

      c.closePath();c.fill();
      c.fillStyle='rgba(255,255,255,.4)';
      c.beginPath();c.arc(7,-1.6,1.6,0,TAU);c.fill();
    }else{
      c.scale(s,s);
      const pul=1+M.sin(t*1.9+q.ph)*.12;

      c.fillStyle=rg(c,0,0,0,0,0,30,

  for(const q of motes){

      c.fillStyle='rgba(255,255,255,.3)';
      c.beginPath();c.arc(x-q.r*.3,sy-q.r*.35,q.r*.3,0,TAU);c.fill();

      c.fillStyle=rgba(k.a[1],(.12+q.par*.2).toFixed(2));
      c.beginPath();c.arc(x,sy,q.r,0,TAU);c.fill();
    }
  }
}

function drawSpaceMap(camY,t,k,alt){

      c.beginPath();c.ellipse(px-10,py+8,70,16,.15,0,TAU);c.fill();
      c.restore();
      c.save();c.globalCompositeOperation='lighter';
      c.fillStyle=rg(c,px,py,pr*.92,px,py,pr*1.2,
        [[0,'rgba(130,200,255,.5)'],[1,'rgba(120,180,255,0)']]);
      c.beginPath();c.arc(px,py,pr*1.2,0,TAU);c.fill();c.restore();

    c.beginPath();c.arc(-q.s*.3,q.s*.35,q.s*.16,0,TAU);c.fill();

  /* 블랙홀 */

      [[0,'rgba(255,190,110,.55)'],[.35,'rgba(255,120,70,.22)'],[1,'rgba(200,90,220,0)']]);
    c.beginPath();c.arc(bx,by,br*3.4,0,TAU);c.fill();

    c.strokeStyle='rgba(255,160,90,.55)';c.lineWidth=14;
    c.beginPath();c.ellipse(bx,by,br*2.4,br*.7,t*.16,0,TAU);c.stroke();
    c.restore();
    c.save();c.globalAlpha=bf;
    c.fillStyle='#000';c.beginPath();c.arc(bx,by,br,0,TAU);c.fill();

/* ---------- 디스패치 ---------- */
function drawSky(camY,t){

/* ============ 스윙 조작 · 게임 로직 ============ */
const WALL=26, PR=16;                 /* 측벽 두께 / 캐릭터 충돌 반지름 */
const P={x:VW/2,y:VH*0.68,vx:0,dir:1,tilt:0,ph:0,alive:true};
let S='menu',camY=0,rise=150,score=0,best=0,T=0,DT=0,
    gates=[],nextGY=0,parts=[],shake=0,flash=0,dead=0,newBest=false,
    msg='',msgT=0,spin=1,passed=0,startT=0;

/* ---- 맵 ---- */
const MAPS=[
 {n:'하늘', e:'SKY',   ob:'해머',       am:1.00, vm:1.00, dg:.72, rf:98,
  c:'#9ad2f7', sw:'#ffd24a',
  fx:['#ffffff','#ffe9a8','#ffa83c','#ff6a2a'], sm:'#5b6b80', ds:'#9fb6d2',
  dw:'rgba(190,225,250,.55)'},
 {n:'수중', e:'OCEAN', ob:'기뢰',       am:0.82, vm:0.88, dg:.52, rf:58,
  c:'#7fe6d4', sw:'#7fe6d4',
  fx:['#ffffff','#d6fff8','#7fe6d4','#3fb9a6'], sm:'#1f5a52', ds:'#9fd8cd',
  dw:'rgba(222,252,255,.5)'},
 {n:'우주', e:'SPACE', ob:'에너지 오브', am:1.12, vm:1.12, dg:.90, rf:74,
  c:'#c2aef8', sw:'#c2aef8',
  fx:['#ffffff','#f2e6ff','#c2aef8','#8a62e8'], sm:'#3a2f68', ds:'#b9a6ea',
  dw:'rgba(255,205,150,.5)'}
];
let map=0;
try{map=cl(+localStorage.swingMap||0,0,2)}catch(e){}

/* ---- 난이도 ---- */
const SW=[{n:'쉬움',  e:'EASY',  a:860, v:232,g:258,w:206,hs:.55},
          {n:'보통',  e:'NORMAL',a:1050,v:270,g:244,w:180,hs:.75},
          {n:'어려움',e:'HARD',  a:1250,v:310,g:230,w:156,hs:1.0}];
const RMAX=236, HANG=32;              /* 최대 상승 속도 / 장애물 매닮 높이 */
let lv=0;
try{lv=cl(+localStorage.swingLv||0,0,2)}catch(e){}

/* 맵마다 기록을 따로 남긴다 */
let BESTS=[0,0,0];
try{for(let i=0;i<3;i++)BESTS[i]=+localStorage['swingBest'+i]||0}catch(e){}
function syncBest(){best=BESTS[map]}
syncBest();

const EA=()=>SW[lv].a*MAPS[map].am;   /* 실제 가속도 */
const EV=()=>SW[lv].v*MAPS[map].vm;   /* 실제 최고 속도 */
/* 다음 게이트의 통과 지점까지 실제로 도달할 수 있는 좌우 이동량.
   장애물이 빔보다 LEAD 만큼 먼저 올라오므로 그만큼 시간을 깎고,
   이전 통과 지점을 최고속의 1/3 로 반대 방향으로 지나쳤다고 본다. */
const LEADH=125, LEADN=50;
let STEPH=80, STEPN=130;
function calcStep(){
  const a=EA(),v=EV(),v0=v/3,tb=v0/a,ov=v0*v0/(2*a),
        reach=sp=>{
          const t=M.max(.2,sp/RMAX),tr=M.max(0,t-tb),
                fw=a*tr<=v ? a*tr*tr/2 : v*tr-v*v/(2*a);
          return M.max(62,(fw-ov)*0.92);
        };
  STEPH=reach(SW[lv].g-LEADH);   /* 장애물이 있는 게이트 — 먼저 올라온다 */
  STEPN=M.min(165,reach(SW[lv].g-LEADN));
}

function part(x,y,vx,vy,l,col,r,k){parts.push({x,y,vx,vy,l,m:l,c:col,r,k:k||0})}
function say(m){msg=m;msgT=1.4}

function reset(){
  camY=0;rise=150;score=0;T=0;passed=0;startT=0;
  gates=[];parts=[];shake=0;flash=0;dead=0;newBest=false;msgT=0;
  P.x=VW/2;P.y=VH*0.68;P.vx=0;P.dir=1;P.tilt=0;P.alive=true;
  syncBest();calcStep();setWorld(map);
  nextGY=-320;prevTX=VW/2;
  for(let i=0;i<7;i++)addGate();
}
function start(){reset();S='play';startT=T}

/* ---- 게이트 ----
   게이트마다 "반드시 통과할 수 있는 지점" tx 를 먼저 정한다.
   · tx 는 이전 게이트의 tx 에서 STEP 안쪽 → 제때 도달할 수 있다
   · 통로는 tx 를 PR 여유를 두고 감싸도록 배치 → 빔에 닿지 않는다
   · 장애물은 tx 반대쪽에 매달고 스윙 끝이 tx 까지 오지 못하게 한다
   덕분에 tx 를 따라가면 어떤 조합에서도 통과가 보장된다. */
let prevTX=VW/2;
function addGate(){
  const E=SW[lv],d=M.max(0,gates.length?-nextGY:0),
        gw=M.max(E.w*0.70,E.w-d*0.0020),      /* 통과 폭 */
        hang=rnd(0,1)<.66, stp=hang?STEPH:STEPN,
        loT=WALL+PR+6, hiT=VW-WALL-PR-6,
        ta=M.max(loT,prevTX-stp), tb2=M.min(hiT,prevTX+stp),
        tx=ta<tb2?rnd(ta,tb2):(ta+tb2)/2,
        /* 통로는 tx 를 넉넉한 여유로 품어야 한다 */
        cA=tx-gw/2+PR+14, cB=tx+gw/2-PR-14,
        wA=WALL+gw/2, wB=VW-WALL-gw/2,
        cLo=M.max(cA,M.min(cB,wA)), cHi=M.min(cB,M.max(cA,wB)),
        cx=cLo<cHi?rnd(cLo,cHi):(cLo+cHi)/2;
  /* 장애물 — tx 에서 먼 쪽 반쪽에만 매단다 */
  let ham=null;
  const hr=10+rnd(0,3), clr=PR+hr+12,
        roomR=(cx+gw/2)-tx, roomL=tx-(cx-gw/2),
        sd=roomR>=roomL?1:-1, smax=(M.max(roomR,roomL)-clr)/2;
  if(hang&&smax>8){
    const len=36+rnd(0,26),
          amp=M.min(0.62+rnd(0,0.26),M.asin(cl(smax/len,0,.96)));
    if(amp>0.18){
      const sw2=M.sin(amp)*len;
      ham={ph:rnd(0,TAU),sp:(0.9+rnd(0,0.8))*E.hs,len,r:hr,
           px:tx+sd*(clr+sw2),amp};
    }
  }
  gates.push({y:nextGY, gx:cx, gw, tx, ham, hit:false, scored:false});
  prevTX=tx;
  nextGY-=E.g;
}
/* ---- 충돌 ---- */
function circRect(cx,cy,r,x,y,w,h){
  const nx=cl(cx,x,x+w),ny=cl(cy,y,y+h);
  return (cx-nx)**2+(cy-ny)**2<r*r;
}
function hitTest(){
  if(P.x-PR<WALL||P.x+PR>VW-WALL)return 1;
  for(const g of gates){
    const sy=g.y-camY;
    if(sy<-120||sy>VH+120)continue;
    const bh=30,by=sy-bh/2,
          lw=g.gx-g.gw/2-WALL,rx=g.gx+g.gw/2,rw=VW-WALL-rx;
    if(lw>0&&circRect(P.x,P.y,PR,WALL,by,lw,bh))return 2;
    if(rw>0&&circRect(P.x,P.y,PR,rx,by,rw,bh))return 2;
    if(g.ham){
      const a=M.sin(g.ham.ph)*g.ham.amp,
            hx=g.ham.px+M.sin(a)*g.ham.len,
            hy=sy+HANG+M.cos(a)*g.ham.len;
      if((P.x-hx)**2+(P.y-hy)**2<(PR+g.ham.r)**2)return 3;
    }
  }
  return 0;
}
function crash(kind){
  if(!P.alive)return;
  const MP=MAPS[map];
  P.alive=false;S='dead';dead=0;shake=1;flash=1;
  if(score>BESTS[map]){BESTS[map]=score;best=score;newBest=true;
    try{localStorage['swingBest'+map]=score}catch(e){}}
  for(let i=0;i<64;i++){
    const a=rnd(0,TAU),v=rnd(50,380);
    part(P.x,P.y,M.cos(a)*v,M.sin(a)*v,rnd(.4,1.1),MP.fx[(rnd(0,4))|0],rnd(1.2,3.6),0);
  }
  for(let i=0;i<22;i++){
    const a=rnd(0,TAU),v=rnd(20,130);
    part(P.x,P.y,M.cos(a)*v,M.sin(a)*v-40,rnd(1,2),MP.sm,rnd(4,10),1);
  }
  for(let i=0;i<12;i++){
    const a=rnd(0,TAU),v=rnd(70,260);
    part(P.x,P.y,M.cos(a)*v,M.sin(a)*v,rnd(.8,1.5),MP.ds,rnd(2,4),2);
  }
  snd(map===1?110:150,.45,'sawtooth',.09,-120);
  snd(map===2?90:70,.6,'triangle',.07,-30);
}
/* ---- 갱신 ---- */
function update(dt){
  T+=dt;
  shake=M.max(0,shake-dt*2.4);flash=M.max(0,flash-dt*2.2);
  if(msgT>0)msgT-=dt;
  P.ph+=dt*(26+spin*10);
  if(S!='play'){
    if(S=='dead'){dead+=dt;
      for(const p of parts){p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
        p.vy+=(p.k==1?-30:600)*dt;p.vx*=.985;p.vy*=.985}
      parts=parts.filter(p=>p.l>0)}
    return;
  }
  const E=SW[lv],MP=MAPS[map],A=EA(),V=EV();
  /* 상승 */
  rise=M.min(RMAX,150+(-camY)*0.0060);
  camY-=rise*dt;
  /* 스윙: 방향으로 가속, 매질 저항 */
  P.vx+=P.dir*A*dt;
  P.vx*=M.pow(MP.dg,dt);
  P.vx=cl(P.vx,-V,V);
  P.x+=P.vx*dt;
  P.tilt=cl(P.vx/V,-1,1)*0.42;
  /* 추진 흔적 */
  if(rnd(0,1)<.6)part(P.x+rnd(-9,9),P.y+22,rnd(-24,24),
    map===1?rnd(-150,-60):rnd(60,140),rnd(.22,.44),MP.dw,rnd(1,2.4),3);
  /* 게이트 보충 · 점수 */
  while(gates.length&&gates[0].y-camY>VH+200)gates.shift();
  while(nextGY-camY>-260)addGate();
  for(const g of gates){
    if(!g.scored&&g.y-camY>P.y+10){g.scored=true;score++;passed++;
      if(score%10===0)say(score+' GATES!');
      snd(760+M.min(12,score)*22,.08,'triangle',.05,260);
      for(let i=0;i<10;i++){const a=rnd(0,TAU),v=rnd(40,150);
        part(P.x,P.y-8,M.cos(a)*v,M.sin(a)*v,rnd(.3,.6),MP.sw,rnd(1.2,2.6),0)}
    }
    if(g.ham)g.ham.ph+=dt*g.ham.sp*1.7;
  }
  /* 파티클 */
  for(const p of parts){p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt+(p.k==3?rise*dt:0);
    if(p.k==1)p.vy-=30*dt;else if(p.k!=3)p.vy+=(map===1?180:600)*dt;
    p.vx*=.985;p.vy*=.985}
  parts=parts.filter(p=>p.l>0);
  /* 충돌 */
  const h=hitTest();
  if(h)crash(h);
}
/* ---- 그리기 ---- */
function drawGates(){
  for(const g of gates){
    const sy=g.y-camY;
    if(sy<-160||sy>VH+200)continue;
    const bh=30,by=sy-bh/2,lw=g.gx-g.gw/2-WALL,rx=g.gx+g.gw/2,rw=VW-WALL-rx;
    if(lw>4)drawBeam(c,WALL,by,lw,bh,1,map);
    if(rw>4)drawBeam(c,rx,by,rw,bh,-1,map);
    if(g.ham){
      const a=M.sin(g.ham.ph)*g.ham.amp;
      drawHammer(c,g.ham.px,sy+HANG,a,g.ham.len,g.ham.r,map,T);
    }
  }
}
function drawParts(){
  c.save();
  for(const p of parts){
    const a=cl(p.l/p.m,0,1);
    if(p.k==1){c.globalAlpha=a*.4;c.fillStyle=p.c;
      c.beginPath();c.arc(p.x,p.y,p.r*(1.9-a),0,TAU);c.fill();continue}
    if(p.k==3){c.globalAlpha=a*.5;c.fillStyle=p.c;
      c.beginPath();c.arc(p.x,p.y,p.r,0,TAU);c.fill();continue}
    c.globalAlpha=a;c.globalCompositeOperation=p.k==2?'source-over':'lighter';
    c.fillStyle=p.c;c.beginPath();c.arc(p.x,p.y,p.r*(p.k==2?1:a*.6+.5),0,TAU);c.fill();
    c.globalCompositeOperation='source-over';
  }
  c.restore();
}
function vignette(){
  c.fillStyle=rg(c,VW/2,VH/2,VH*.45,VW/2,VH/2,VH*.92,
    [[0,'rgba(0,0,0,0)'],[1,'rgba(4,10,20,.5)']]);
  c.fillRect(0,0,VW,VH);
}
function txt(s,x,y,sz,col,al,w){
  c.font=(w||'700')+' '+sz+'px '+FONT;
  c.textAlign=al||'left';c.textBaseline='alphabetic';
  c.fillStyle=col;c.fillText(s,x,y);
}
/* 배경 위에 올라가는 글자 — 어두운 그림자로 대비 확보 */
function txtS(s,x,y,sz,col,al,w,sh){
  c.font=(w||'700')+' '+sz+'px '+FONT;
  c.textAlign=al||'left';c.textBaseline='alphabetic';
  c.save();
  c.shadowColor='rgba(4,14,28,'+(sh||.85)+')';
  c.shadowBlur=sz*.45;c.shadowOffsetY=1.5;
  c.fillStyle=col;c.fillText(s,x,y);
  c.fillText(s,x,y);
  c.restore();
}
function panel(x,y,w,h,r){
  rr(c,x,y,w,h,r);
  c.fillStyle='rgba(8,20,36,.76)';c.fill();
  c.strokeStyle='rgba(150,205,245,.32)';c.lineWidth=1.4;c.stroke();
}
let hit=[];
function sel(cx2,y,w,val,label,col,fn){
  const x=cx2-w/2,h=52;
  panel(x,y,w,h,13);
  txt(label,cx2,y+19,11,'rgba(196,224,246,.85)','center','700');
  txt(val,cx2,y+41,17,col,'center','800');
  for(const d of[-1,1]){
    const ax=d<0?x+17:x+w-17;
    c.save();c.globalAlpha=.9;c.strokeStyle=col;c.lineWidth=2.6;
    c.lineCap='round';c.lineJoin='round';c.beginPath();
    c.moveTo(ax-d*4,y+18);c.lineTo(ax+d*4,y+26);c.lineTo(ax-d*4,y+34);c.stroke();c.restore();
    hit.push({x0:ax-18,y0:y,x1:ax+18,y1:y+h,f:()=>fn(d)});
  }
}
function lvSel(d){
  lv=cl(lv+d,0,SW.length-1);
  try{localStorage.swingLv=lv}catch(e){}
  calcStep();
  snd(520+lv*130,.07,'square',.04,160);
}
function mapSel(i){
  i=cl(i,0,MAPS.length-1);
  if(i===map)return;
  map=i;
  try{localStorage.swingMap=map}catch(e){}
  syncBest();calcStep();setWorld(map);
  snd(430+map*150,.1,'triangle',.05,220);
}
/* 맵 카드 */
function mapCard(x,y,w,h,i){
  const on=(i===map),MP=MAPS[i];
  c.save();rr(c,x,y,w,h,14);c.clip();
  const z=zoneAt(i===0?900:4600,i);
  c.fillStyle=lg(c,0,y,0,y+h,[[0,rgbs(z.t[0])],[1,rgbs(z.t[1])]]);
  c.fillRect(x,y,w,h);
  c.fillStyle='rgba(4,12,26,.3)';c.fillRect(x,y+h-26,w,26);
  drawCopter(c,x+w/2,y+h*0.44,M.sin(T*1.3+i)*.1,T*7+i*2,T,0.56,{map:i,spin:1});
  c.restore();
  if(on){
    c.save();c.globalAlpha=.5+M.sin(T*3)*.2;
    rr(c,x-3,y-3,w+6,h+6,17);
    c.strokeStyle=MP.c;c.lineWidth=2;c.stroke();c.restore();
  }
  rr(c,x,y,w,h,14);
  c.strokeStyle=on?MP.c:'rgba(150,205,245,.34)';c.lineWidth=on?2.8:1.3;c.stroke();
  if(!on){rr(c,x,y,w,h,14);c.fillStyle='rgba(4,12,26,.34)';c.fill()}
  txt(MP.n,x+w/2,y+h-9,14,on?'#fff':'rgba(222,238,252,.82)','center','800');
  hit.push({x0:x,y0:y,x1:x+w,y1:y+h,f:()=>mapSel(i)});
}
/* 이동 거리 표시 — 맵마다 어울리는 축척으로 환산 */
const ALT=[[2,'m'],[1,'m'],[.1,'km']];
function alti(){return ((-camY)*ALT[map][0])|0}
function altU(){return ALT[map][1]}
function hud(){
  const MP=MAPS[map];
  txtS(String(score),VW/2,76,54,'#fff','center','800',.95);
  txtS('BEST '+best,VW-WALL-10,26,13,'rgba(255,255,255,.92)','right','700');
  txtS(alti()+' '+altU(),WALL+10,26,13,'rgba(255,255,255,.92)','left','700');
  txtS(MP.n+' · '+(ZC?ZC.name:''),WALL+10,44,10,'rgba(206,228,248,.85)','left','700');
  /* 추력 방향 표시 */
  const ix=VW/2,iy=VH-26;
  c.save();c.globalAlpha=.8;
  c.fillStyle='rgba(8,20,36,.5)';rr(c,ix-38,iy-13,76,26,13);c.fill();
  c.fillStyle=P.dir>0?MP.sw:'rgba(255,255,255,.25)';
  c.beginPath();c.moveTo(ix+6,iy-6);c.lineTo(ix+20,iy);c.lineTo(ix+6,iy+6);c.closePath();c.fill();
  c.fillStyle=P.dir<0?MP.sw:'rgba(255,255,255,.25)';
  c.beginPath();c.moveTo(ix-6,iy-6);c.lineTo(ix-20,iy);c.lineTo(ix-6,iy+6);c.closePath();c.fill();
  c.restore();
  if(msgT>0){c.save();c.globalAlpha=cl(msgT/.4,0,1);
    txtS(msg,VW/2,VH*0.3,26,MP.sw,'center','800');c.restore()}
}
function render(){
  hit=[];
  c.setTransform(DPR,0,0,DPR,0,0);
  c.save();
  if(shake>0)c.translate(rnd(-1,1)*shake*12,rnd(-1,1)*shake*12);
  drawSky(camY,T);
  drawWalls(c,WALL,VH,-camY,map,T);
  if(S!='menu')drawGates();
  if(S!='menu'&&P.alive)drawCopter(c,P.x,P.y,P.tilt,P.ph,T,1,{spin:spin,map:map});
  if(S=='menu')
    drawCopter(c,VW/2,240+M.sin(T*1.4)*9,M.sin(T*1.1)*0.12,P.ph,T,1.15,{spin:1,map:map});
  drawParts();
  c.restore();
  vignette();
  if(flash>0){c.fillStyle='rgba(255,236,200,'+(flash*.5)+')';c.fillRect(0,0,VW,VH)}

  if(S=='menu'){
    const MP=MAPS[map];
    /* 글자가 앉을 자리에 부드러운 어둠을 깔아 대비를 만든다 */
    c.fillStyle=lg(c,0,0,0,210,
      [[0,'rgba(5,16,32,.5)'],[.7,'rgba(5,16,32,.18)'],[1,'rgba(5,16,32,0)']]);
    c.fillRect(0,0,VW,210);
    c.fillStyle=lg(c,0,VH*0.72,0,VH,
      [[0,'rgba(5,16,32,0)'],[.4,'rgba(5,16,32,.36)'],[1,'rgba(5,16,32,.66)']]);
    c.fillRect(0,VH*0.72,VW,VH*0.28);

    txtS('SWING',VW/2,100,52,'#fff','center','800');
    txtS('COPTER',VW/2,148,52,MP.sw,'center','800');
    txtS('탭 할 때마다 추력 방향이 바뀝니다',VW/2,182,13,'rgba(226,242,255,.95)','center','600');

    const cw=128,cg=10,cx0=(VW-(cw*3+cg*2))/2;
    for(let i=0;i<3;i++)mapCard(cx0+i*(cw+cg),314,cw,104,i);

    const E=SW[lv];
    sel(VW/2,438,M.min(300,VW*0.74),E.n+'   '+E.e,'난이도   ↑ ↓',MP.sw,lvSel);
    const bw=M.min(280,VW*0.7),bx=VW/2-bw/2,by=510;
    panel(bx,by,bw,54,14);
    c.save();c.globalAlpha=.74+M.sin(T*3.4)*.26;
    txt('TAP TO START',VW/2,by+34,20,'#fff','center','800');c.restore();
    hit.push({x0:bx,y0:by,x1:bx+bw,y1:by+54,f:()=>start()});

    txtS('마우스 클릭 · 터치 · SPACE',VW/2,592,13,'rgba(226,242,255,.95)','center','600');
    txtS('← →  맵 선택      ↑ ↓  난이도',VW/2,611,13,'rgba(226,242,255,.95)','center','600');
    txtS('측벽 · 빔 · '+MP.ob+'에 닿으면 추락',VW/2,630,13,'rgba(226,242,255,.95)','center','600');
    txtS(MP.n+' 최고 기록  '+best,VW/2,666,15,MP.sw,'center','700');
    txtS('세영코딩연구소  저자 : 컴퓨터공학박사 KIM',VW/2,VH-14,11,
      'rgba(214,232,248,.8)','center','600');
  }else{
    hud();
    if(S=='dead'&&dead>0.5){
      c.fillStyle='rgba(4,12,24,'+cl((dead-0.5)*1.6,0,.6)+')';c.fillRect(0,0,VW,VH);
      const a=cl((dead-0.5)*2,0,1);
      c.save();c.globalAlpha=a;
      const pw=M.min(300,VW*0.76),ph2=206,px=VW/2-pw/2,py=VH/2-ph2/2;
      panel(px,py,pw,ph2,18);
      txt('CRASHED',VW/2,py+44,30,'#ff8a6a','center','800');
      txt(MAPS[map].n+' · '+SW[lv].n,VW/2,py+64,11,'rgba(200,226,246,.7)','center','600');
      txt(String(score),VW/2,py+116,50,'#fff','center','800');
      txt('GATES',VW/2,py+134,11,'rgba(200,226,246,.7)','center','600');
      txt(alti()+' '+altU()+' 상승',VW/2,py+158,13,'rgba(220,235,250,.85)','center','600');
      txt(newBest?'NEW BEST!':'BEST  '+best,VW/2,py+180,14,
        newBest?MAPS[map].sw:'rgba(220,235,250,.85)','center','700');
      if(dead>1.05){c.save();c.globalAlpha=a*(.7+M.sin(T*3.4)*.3);
        txt('TAP TO RETRY',VW/2,py+ph2+30,16,'#fff','center','700');c.restore()}
      c.restore();
    }
    if(S=='pause'){
      c.fillStyle='rgba(4,12,24,.6)';c.fillRect(0,0,VW,VH);
      txt('PAUSED',VW/2,VH/2-6,30,'#fff','center','800');
      txt('ESC 로 계속 · M 으로 메뉴',VW/2,VH/2+24,14,'rgba(220,235,250,.85)','center','600');
    }
  }
}

/* ---------- input ---------- */
function toMenu(){reset();S='menu'}
function tap(pt){
  initA();rotorOn();
  if(S=='menu'){
    if(pt)for(const h of hit)
      if(pt.x>=h.x0&&pt.x<=h.x1&&pt.y>=h.y0&&pt.y<=h.y1){h.f();return}
    return;
  }
  if(S=='dead'){if(dead>1.0)start();return}
  if(S=='pause'){S='play';return}
  /* 추력 방향 반전 */
  P.dir=-P.dir;
  snd(300+(P.dir>0?90:0),.07,'square',.035,120);
  for(let i=0;i<7;i++)part(P.x-P.dir*14,P.y+rnd(-6,10),
    -P.dir*rnd(40,150),rnd(-20,60),rnd(.2,.4),MAPS[map].dw,rnd(1,2.2),0);
}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  const r=cv.getBoundingClientRect();
  tap({x:(e.clientX-r.left)/r.width*VW,y:(e.clientY-r.top)/r.height*VH});
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
});
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{
  if(S=='menu'){
    if(e.code=='ArrowLeft'||e.code=='ArrowRight'){
      mapSel(map+(e.code=='ArrowRight'?1:-1));e.preventDefault();return}
    if(e.code=='ArrowUp'||e.code=='ArrowDown'){
      lvSel(e.code=='ArrowDown'?1:-1);e.preventDefault();return}
    if(e.code=='Digit1'||e.code=='Digit2'||e.code=='Digit3'){
      mapSel(+e.code.slice(5)-1);e.preventDefault();return}
    if(e.code=='Space'||e.code=='Enter'){
      e.preventDefault();initA();rotorOn();start();return}
    return;
  }
  if(e.code=='Space'||e.code=='ArrowUp'||e.code=='Enter'){
    e.preventDefault();if(!e.repeat)tap(null);
  }
  else if(e.code=='Escape'||e.code=='KeyP'){
    if(S=='play')S='pause';else if(S=='pause')S='play';
  }
  else if(e.code=='KeyR'&&(S=='play'||S=='dead'))start();
  else if(e.code=='KeyM')toMenu();
  else if(e.code=='KeyS'){sv=sv?0:.8;if(rotorGain)rotorSet(0,62)}
});
addEventListener('blur',()=>{if(S=='play')S='pause'});

/* ---------- loop ---------- */
let last=0;
function frame(ts){
  const dt=M.min(.034,(ts-last)/1000||0);last=ts;DT=dt;DTg=dt;
  spin=(S=='play'||S=='menu')?1:M.max(0,spin-dt*.5);
  update(dt);
  if(rotorGain){
    rotorOsc.type=['sawtooth','sine','triangle'][map];
    const bf=MAPS[map].rf;
    rotorSet(S=='play'?.026:S=='menu'?.016:0,S=='play'?bf:bf*0.78);
  }
  render();
  requestAnimationFrame(frame);
}
fit();reset();
requestAnimationFrame(frame);
</script></html>
