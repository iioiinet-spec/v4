<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>거미줄 히어로 시티</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#2b2f6b; --sky-mid:#6a4b8f; --sky-bot:#e8804f;
    --moon:#fff4d6; --card:#FFFDF6; --ink:#0B3B52;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; font-family:'Nunito',sans-serif; background:#111; }
  .scene{ position:relative; width:100%; height:100vh; cursor:crosshair;
    background:linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 45%, var(--sky-bot) 100%);
    overflow:hidden; }

  .moon{ position:absolute; top:8%; right:10%; width:70px; height:70px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fffef2, var(--moon) 60%, #e9d9a0 100%);
    box-shadow:0 0 40px 10px rgba(255,244,214,0.35); }
  .star{ position:absolute; width:2px; height:2px; background:#fff; border-radius:50%;
    animation:tw 2.4s ease-in-out infinite; }
  @keyframes tw{ 0%,100%{ opacity:0.2; } 50%{ opacity:0.9; } }

  .hud{ position:absolute; top:0; left:0; right:0; z-index:30; padding:18px 24px;
    display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .hud h1{ margin:0; font-family:'Baloo 2',sans-serif; font-size:20px; color:#fff;
    text-shadow:0 2px 6px rgba(0,0,0,0.5); }
  .hud p{ margin:4px 0 0; font-size:13px; color:#ffe9d6; font-weight:700; }
  #addBuildingBtn{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:14px;
    background:#ffb347; color:#3a2200; border:none; border-radius:999px; padding:11px 20px; cursor:pointer;
    box-shadow:0 5px 0 #cc8a2c, 0 8px 12px rgba(0,0,0,0.35); transition:transform 0.08s ease; }
  #addBuildingBtn:active{ transform:translateY(4px); box-shadow:0 1px 0 #cc8a2c, 0 4px 8px rgba(0,0,0,0.3); }

  .city-wrap{ position:absolute; left:0; right:0; bottom:0; height:78%; z-index:5; overflow-x:auto; overflow-y:hidden; }
  .city-wrap::-webkit-scrollbar{ height:10px; }
  .city-wrap::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.4); border-radius:10px; }
  .city{ display:flex; align-items:flex-end; gap:18px; padding:0 3vw; height:100%; width:max-content; }

  .building{ position:relative; flex:0 0 auto; cursor:pointer;
    background:linear-gradient(180deg, #2b2440 0%, #1c1830 100%);
    border-top:3px solid #3a3355; border-radius:4px 4px 0 0;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,0.03);
    transition:filter 0.15s ease, transform 0.15s ease;
  }
  .building:hover{ filter:brightness(1.25); transform:translateY(-2px); }
  .building.active{ filter:brightness(1.4); box-shadow:0 0 0 2px rgba(255,210,60,0.6), inset 0 0 0 1px rgba(255,255,255,0.05); }
  .windows{ position:absolute; inset:10px 8px; display:grid; gap:8px;
    grid-template-columns:repeat(var(--cols),1fr); }
  .win{ background:rgba(255,214,120,0.08); border-radius:1px; }
  .win.lit{ background:rgba(255,214,120,0.85); box-shadow:0 0 6px 1px rgba(255,214,120,0.5); }
  .roof-label{ position:absolute; top:-26px; left:50%; transform:translateX(-50%);
    background:var(--card); padding:2px 8px; border-radius:8px; font-family:'Baloo 2',sans-serif;
    font-size:10px; font-weight:700; color:var(--ink); white-space:nowrap; opacity:0; pointer-events:none;
    transition:opacity 0.15s ease; }
  .building:hover .roof-label{ opacity:1; }

  /* ---------- 거미줄 & 히어로 ---------- */
  #shotLayer{ position:absolute; inset:0; z-index:20; pointer-events:none; }
  .web-shot{ position:absolute; height:2px; background:linear-gradient(90deg, rgba(255,255,255,0.1), rgba(255,255,255,0.95));
    transform-origin:left center; border-radius:2px; }

  .rig{ position:absolute; width:2px; z-index:21; transform-origin:top center; }
  .rig .thread{ position:absolute; top:0; left:0; width:2px; height:100%; pointer-events:none;
    background:repeating-linear-gradient(180deg, rgba(255,255,255,0.9) 0 4px, rgba(255,255,255,0.35) 4px 8px); }
  .rig .anchor-dot{ position:absolute; top:-4px; left:50%; transform:translateX(-50%); pointer-events:none;
    width:8px; height:8px; border-radius:50%; background:#fff; box-shadow:0 0 6px 2px rgba(255,255,255,0.7); }

  .hero{ position:absolute; left:50%; bottom:-2px; width:46px; height:76px; cursor:pointer;
    transform:translateX(-50%) rotate(180deg); }
  .hero svg{ width:100%; height:100%; display:block; filter:drop-shadow(0 4px 6px rgba(0,0,0,0.4)); }
  .hero .select-ring{ position:absolute; inset:-8px; border-radius:50%; opacity:0;
    border:3px dashed #ffd23f; animation:selSpin 3s linear infinite; }
  .rig.selected .hero .select-ring{ opacity:0.9; }
  @keyframes selSpin{ from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }
  .hero-name-tag{ position:absolute; top:-22px; left:50%; transform:translateX(-50%) rotate(180deg);
    background:var(--card); padding:2px 9px; border-radius:8px; font-family:'Baloo 2',sans-serif;
    font-size:10px; font-weight:700; color:var(--ink); white-space:nowrap; opacity:0; transition:opacity 0.15s ease; }
  .rig:hover .hero-name-tag{ opacity:1; }

  /* ---------- 헐크 (오리지널 초록 괴력 캐릭터) & 벽 부수기 ---------- */
  .hulk{ position:absolute; bottom:20%; z-index:6; pointer-events:none; }
  .hulk svg{ display:block; filter:drop-shadow(0 6px 8px rgba(0,0,0,0.45)); }
  .hulk.smashing .hulk-arm{ animation:hulkPunch 0.5s ease-in-out; }
  @keyframes hulkPunch{
    0%{ transform:rotate(0deg); }
    35%{ transform:rotate(-38deg) translateX(-6px); }
    55%{ transform:rotate(14deg) translateX(4px); }
    100%{ transform:rotate(0deg); }
  }
  .building.shaking{ animation:buildingShake 0.4s ease-in-out; }
  @keyframes buildingShake{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-3px); }
    50%{ transform:translateX(3px); }
    75%{ transform:translateX(-2px); }
  }
  .crack{ position:absolute; z-index:7; opacity:0; transition:opacity 0.4s ease; pointer-events:none; }
  .crack.show{ opacity:0.9; }
  .debris{ position:absolute; width:6px; height:6px; background:#8a8a8a; border-radius:1px;
    z-index:8; pointer-events:none; animation:debrisPop 0.55s ease-out forwards; }
  @keyframes debrisPop{
    0%{ transform:translate(0,0) rotate(0deg); opacity:1; }
    100%{ transform:translate(var(--dx), var(--dy)) rotate(180deg); opacity:0; }
  }

  #toast{ position:absolute; left:50%; top:80px; transform:translateX(-50%) translateY(-10px);
    background:var(--card); padding:8px 18px; border-radius:12px; font-family:'Baloo 2',sans-serif;
    font-weight:700; font-size:13px; color:var(--ink); box-shadow:0 6px 14px rgba(0,0,0,0.3);
    opacity:0; transition:opacity 0.2s ease, transform 0.2s ease; z-index:40; white-space:nowrap; }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="scene" id="scene">
  <div class="moon"></div>
  <div id="starsLayer"></div>

  <div class="hud">
    <div>
      <h1>🕸️ 거미줄 히어로 시티</h1>
      <p>건물을 클릭하면 거미줄을 쏘아 웹스윙해요!</p>
    </div>
    <button id="addBuildingBtn">🏗️ 건물 추가</button>
  </div>

  <div id="toast"></div>

  <div class="city-wrap" id="cityWrap">
    <div class="city" id="city"></div>
  </div>
  <div id="shotLayer"></div>
  <div id="heroLayer"></div>
</div>

<script>
  const sceneEl = document.getElementById('scene');
  const cityEl = document.getElementById('city');
  const cityWrapEl = document.getElementById('cityWrap');
  const heroLayerEl = document.getElementById('heroLayer');
  const shotLayerEl = document.getElementById('shotLayer');
  const toastEl = document.getElementById('toast');
  const starsLayerEl = document.getElementById('starsLayer');

  // ---------- 별 배치 ----------
  for (let i = 0; i < 60; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 55 + '%';
    s.style.animationDelay = (Math.random() * 2.4) + 's';
    starsLayerEl.appendChild(s);
  }

  // ---------- 빌딩 생성 ----------
  const BUILDING_DEFS = [
    { w: 110, h: 260, name: '실버타워' },
    { w: 150, h: 380, name: '오션빌딩' },
    { w: 95,  h: 200, name: '코너하우스' },
    { w: 170, h: 460, name: '센트럴타워' },
    { w: 120, h: 300, name: '골든오피스' },
    { w: 140, h: 340, name: '문라이트빌딩' },
    { w: 100, h: 230, name: '스카이뷰' },
  ];
  const NAME_PARTS_A = ['스타', '레인보우', '펄', '노바', '크리스탈', '메트로', '선셋', '블루', '골드', '네온'];
  const NAME_PARTS_B = ['타워', '빌딩', '플라자', '센터', '스카이라인', '하우스', '오피스'];

  const buildings = [];

  function createBuilding(def) {
    const el = document.createElement('div');
    el.className = 'building';
    el.style.width = def.w + 'px';
    el.style.height = def.h + 'px';

    const cols = Math.max(2, Math.floor(def.w / 26));
    const rows = Math.max(3, Math.floor(def.h / 30));
    const windowsEl = document.createElement('div');
    windowsEl.className = 'windows';
    windowsEl.style.setProperty('--cols', cols);
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const win = document.createElement('div');
        win.className = 'win' + (Math.random() < 0.4 ? ' lit' : '');
        windowsEl.appendChild(win);
      }
    }
    el.appendChild(windowsEl);

    const label = document.createElement('div');
    label.className = 'roof-label';
    label.textContent = def.name;
    el.appendChild(label);

    cityEl.appendChild(el);
    const record = { el, name: def.name, index: buildings.length };
    buildings.push(record);
    return record;
  }

  BUILDING_DEFS.forEach((def) => createBuilding(def));

  // 건물 추가 버튼: 누를 때마다 오른쪽 끝에 랜덤한 새 건물이 생김
  document.getElementById('addBuildingBtn').addEventListener('click', () => {
    const w = 90 + Math.floor(Math.random() * 100);
    const h = 190 + Math.floor(Math.random() * 320);
    const name = NAME_PARTS_A[Math.floor(Math.random() * NAME_PARTS_A.length)] +
                 NAME_PARTS_B[Math.floor(Math.random() * NAME_PARTS_B.length)];
    createBuilding({ w, h, name });

    // 새로 생긴 건물이 보이도록 오른쪽 끝으로 스크롤
    cityWrapEl.scrollTo({ left: cityWrapEl.scrollWidth, behavior: 'smooth' });
  });

  // ---------- 거미줄 히어로 물리 (여러 명 지원) ----------
  const HANG_LEN = 92;        // 평소 매달려 있을 때의 짧은 거미줄 길이
  const heroes = [];
  let selectedHero = null;

  function heroSvgMarkup(primary, secondary, eyeStroke) {
    return `
      <svg viewBox="0 0 60 100" xmlns="http://www.w3.org/2000/svg">
        <rect x="17" y="76" width="10" height="19" rx="4.5" fill="${secondary}" stroke="#141414" stroke-width="2.5"/>
        <rect x="33" y="76" width="10" height="19" rx="4.5" fill="${secondary}" stroke="#141414" stroke-width="2.5"/>
        <rect x="15" y="91" width="13" height="8" rx="3.5" fill="${primary}" stroke="#141414" stroke-width="2.5"/>
        <rect x="32" y="91" width="13" height="8" rx="3.5" fill="${primary}" stroke="#141414" stroke-width="2.5"/>
        <rect x="2" y="47" width="11" height="24" rx="5.5" fill="${primary}" stroke="#141414" stroke-width="2.5" transform="rotate(-10 7.5 47)"/>
        <rect x="47" y="47" width="11" height="24" rx="5.5" fill="${primary}" stroke="#141414" stroke-width="2.5" transform="rotate(10 52.5 47)"/>
        <circle cx="6" cy="73" r="6.5" fill="${secondary}" stroke="#141414" stroke-width="2.5"/>
        <circle cx="54" cy="73" r="6.5" fill="${secondary}" stroke="#141414" stroke-width="2.5"/>
        <rect x="13" y="45" width="34" height="33" rx="14" fill="${primary}" stroke="#141414" stroke-width="2.8"/>
        <circle cx="30" cy="60" r="5" fill="${secondary}" stroke="#141414" stroke-width="2.2"/>
        <circle cx="30" cy="25" r="24" fill="${primary}" stroke="#141414" stroke-width="2.8"/>
        <ellipse cx="20" cy="26" rx="8.5" ry="10.5" fill="#fff" stroke="${eyeStroke}" stroke-width="2.4"/>
        <ellipse cx="40" cy="26" rx="8.5" ry="10.5" fill="#fff" stroke="${eyeStroke}" stroke-width="2.4"/>
        <path d="M12 20 Q20 12 28 20" stroke="${eyeStroke}" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        <path d="M32 20 Q40 12 48 20" stroke="${eyeStroke}" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      </svg>`;
  }

  const HERO_DEFS = [
    { key: 'classic', label: '클래식 슈트', primary: '#e42430', secondary: '#14357a', eyeStroke: '#141414', startBuilding: 1 },
    { key: 'black',   label: '블랙 슈트',   primary: '#1c1c1f', secondary: '#3a3a40', eyeStroke: '#1c1c1f', startBuilding: 4 },
  ];

  function getAnchorPoint(buildingIndex) {
    const rect = buildings[buildingIndex].el.getBoundingClientRect();
    const sceneRect = sceneEl.getBoundingClientRect();
    return {
      x: rect.left - sceneRect.left + rect.width / 2,
      y: rect.top - sceneRect.top,
    };
  }

  function heroAbsPos(h) {
    return {
      x: h.pivot.x + h.radius * Math.sin(h.theta),
      y: h.pivot.y + h.radius * Math.cos(h.theta),
    };
  }

  function showToast(text) {
    toastEl.textContent = text;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toastEl.classList.remove('show'), 1200);
  }

  function spawnWebShot(from, to, onDone) {
    const dx = to.x - from.x, dy = to.y - from.y;
    const dist = Math.hypot(dx, dy);
    const angle = Math.atan2(dy, dx) * (180 / Math.PI);

    const shot = document.createElement('div');
    shot.className = 'web-shot';
    shot.style.left = from.x + 'px';
    shot.style.top = from.y + 'px';
    shot.style.width = dist + 'px';
    shot.style.transform = `rotate(${angle}deg) scaleX(0)`;
    shot.style.transition = 'transform 0.22s ease-out';
    shotLayerEl.appendChild(shot);

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        shot.style.transform = `rotate(${angle}deg) scaleX(1)`;
      });
    });

    setTimeout(() => {
      shot.remove();
      onDone();
    }, 240);
  }

  function createHero(def) {
    const rigEl = document.createElement('div');
    rigEl.className = 'rig';

    const heroEl = document.createElement('div');
    heroEl.className = 'hero';
    heroEl.innerHTML =
      heroSvgMarkup(def.primary, def.secondary, def.eyeStroke) +
      `<div class="select-ring"></div><div class="hero-name-tag">${def.label}</div>`;

    rigEl.innerHTML = `<div class="thread"></div><div class="anchor-dot"></div>`;
    rigEl.appendChild(heroEl);
    heroLayerEl.appendChild(rigEl);

    const h = {
      key: def.key,
      label: def.label,
      rigEl, heroEl,
      pivot: { x: 0, y: 0 },
      theta: 0,
      radius: HANG_LEN,
      mode: 'idle',
      swingStart: 0,
      swingDuration: 950,
      swingFromPos: { x: 0, y: 0 },
      swingHangPos: { x: 0, y: 0 },
      swingControlPos: { x: 0, y: 0 },
      idleStartTime: performance.now(),
    };

    heroEl.addEventListener('click', (e) => {
      e.stopPropagation(); // 히어로 클릭은 건물 웹스윙과 구분되는 "선택" 동작
      selectHero(h);
    });

    heroes.push(h);
    return h;
  }

  function selectHero(h) {
    selectedHero = h;
    heroes.forEach((x) => x.rigEl.classList.toggle('selected', x === h));
    showToast(`${h.label} 선택!`);
  }

  // 클릭한 지점(targetPoint, scene 기준 좌표)에 거미줄을 쏘고,
  // 그 지점에 줄을 고정한 채 아래로 떨어졌다가 위로 올라가며 웹스윙으로 이동
  function swingToPoint(h, targetPoint, label) {
    if (h.mode === 'swinging') return;

    const fromPos = heroAbsPos(h);
    const dx0 = targetPoint.x - fromPos.x, dy0 = targetPoint.y - fromPos.y;
    const clickDist = Math.hypot(dx0, dy0);
    if (clickDist < 12) return; // 너무 가까우면 무시

    spawnWebShot(fromPos, targetPoint, () => {
      h.pivot = targetPoint; // 거미줄은 쏜 지점에 그대로 고정
      h.swingFromPos = fromPos;
      h.swingHangPos = { x: targetPoint.x, y: targetPoint.y + HANG_LEN };

      const dipAmount = Math.min(260, clickDist * 0.45 + 40);
      h.swingControlPos = {
        x: (h.swingFromPos.x + h.swingHangPos.x) / 2,
        y: Math.max(h.swingFromPos.y, h.swingHangPos.y) + dipAmount,
      };

      h.swingStart = performance.now();
      h.mode = 'swinging';
      showToast(`🕸️ ${h.label} → ${label} 웹스윙!`);
    });
  }

  function easeInOutSine(t) {
    return -(Math.cos(Math.PI * t) - 1) / 2;
  }

  function updateRig(h) {
    h.rigEl.style.left = h.pivot.x + 'px';
    h.rigEl.style.top = h.pivot.y + 'px';
    h.rigEl.style.height = h.radius + 'px';
    // CSS rotate()는 시계방향이라, 우리 위치 공식(x=r·sinθ)과 좌우가 반대로 렌더링되는 것을 보정
    h.rigEl.style.transform = `rotate(${-h.theta}rad)`;
  }

  function tickHero(h, now) {
    if (h.mode === 'swinging') {
      const t = Math.min(1, (now - h.swingStart) / h.swingDuration);
      const e = easeInOutSine(t);
      const inv = 1 - e;

      const heroX = inv * inv * h.swingFromPos.x + 2 * inv * e * h.swingControlPos.x + e * e * h.swingHangPos.x;
      const heroY = inv * inv * h.swingFromPos.y + 2 * inv * e * h.swingControlPos.y + e * e * h.swingHangPos.y;

      const dx = heroX - h.pivot.x, dy = heroY - h.pivot.y;
      h.radius = Math.hypot(dx, dy);
      h.theta = Math.atan2(dx, dy);

      if (t >= 1) {
        h.theta = 0;
        h.radius = HANG_LEN;
        h.mode = 'idle';
        h.idleStartTime = now;
      }
    } else {
      const elapsed = (now - h.idleStartTime) / 1000;
      h.theta = Math.sin(elapsed * 1.1) * 0.09;
      const dipWave = Math.max(0, Math.sin(elapsed * 0.8));
      h.radius = HANG_LEN + dipWave * 22;
    }
    updateRig(h);
  }

  function tick(now) {
    heroes.forEach((h) => tickHero(h, now));
    requestAnimationFrame(tick);
  }

  // ---------- 헐크 (오리지널 초록 괴력 캐릭터) - 건물에 매달려 벽을 부숨 ----------
  const HULK_BUILDING_INDEX = 3; // 센트럴타워

  function createHulk(buildingIndex) {
    const buildingEl = buildings[buildingIndex].el;

    const hulkEl = document.createElement('div');
    hulkEl.className = 'hulk';
    hulkEl.style.right = '-18px';
    hulkEl.style.bottom = '30%';
    hulkEl.innerHTML = `
      <svg width="70" height="86" viewBox="0 0 70 86" xmlns="http://www.w3.org/2000/svg">
        <rect x="20" y="52" width="13" height="24" rx="5" fill="#2f7d32" stroke="#0d2b0f" stroke-width="2.5"/>
        <rect x="37" y="52" width="13" height="24" rx="5" fill="#2f7d32" stroke="#0d2b0f" stroke-width="2.5"/>
        <rect x="18" y="74" width="16" height="8" rx="3" fill="#5b3a1e" stroke="#0d2b0f" stroke-width="2.2"/>
        <rect x="36" y="74" width="16" height="8" rx="3" fill="#5b3a1e" stroke="#0d2b0f" stroke-width="2.2"/>
        <rect x="14" y="30" width="42" height="30" rx="10" fill="#3fa047" stroke="#0d2b0f" stroke-width="3"/>
        <rect x="14" y="42" width="42" height="10" fill="#5b3a1e" opacity="0.9"/>
        <g class="hulk-arm" style="transform-origin:52px 36px;">
          <rect x="50" y="26" width="16" height="34" rx="7" fill="#3fa047" stroke="#0d2b0f" stroke-width="2.8"/>
          <circle cx="58" cy="63" r="11" fill="#3fa047" stroke="#0d2b0f" stroke-width="2.8"/>
        </g>
        <rect x="2" y="26" width="16" height="34" rx="7" fill="#3fa047" stroke="#0d2b0f" stroke-width="2.8"/>
        <circle cx="10" cy="63" r="11" fill="#3fa047" stroke="#0d2b0f" stroke-width="2.8"/>
        <circle cx="35" cy="16" r="18" fill="#3fa047" stroke="#0d2b0f" stroke-width="3"/>
        <path d="M20 12 Q35 2 50 12" stroke="#0d2b0f" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <ellipse cx="27" cy="16" rx="4" ry="3" fill="#0d2b0f"/>
        <ellipse cx="43" cy="16" rx="4" ry="3" fill="#0d2b0f"/>
        <path d="M22 26 Q35 22 48 26" stroke="#0d2b0f" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      </svg>
    `;
    buildingEl.appendChild(hulkEl);

    const crackEl = document.createElement('div');
    crackEl.className = 'crack';
    crackEl.style.right = '8px';
    crackEl.style.bottom = '32%';
    crackEl.innerHTML = `
      <svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
        <path d="M30 4 L24 18 L34 24 L20 36 L28 40 L14 56" stroke="#111" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path d="M30 4 L38 16 L28 22 L42 32 L32 38 L44 54" stroke="#111" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>
      </svg>
    `;
    buildingEl.appendChild(crackEl);

    function spawnDebris() {
      const rect = hulkEl.getBoundingClientRect();
      const bRect = buildingEl.getBoundingClientRect();
      for (let i = 0; i < 6; i++) {
        const d = document.createElement('div');
        d.className = 'debris';
        d.style.left = (rect.left - bRect.left + 10) + 'px';
        d.style.top = (rect.top - bRect.top + 30) + 'px';
        const dx = (Math.random() - 0.5) * 60 - 20;
        const dy = (Math.random() - 0.8) * 50;
        d.style.setProperty('--dx', dx + 'px');
        d.style.setProperty('--dy', dy + 'px');
        buildingEl.appendChild(d);
        setTimeout(() => d.remove(), 600);
      }
    }

    function smash() {
      hulkEl.classList.add('smashing');
      buildingEl.classList.add('shaking');
      crackEl.classList.add('show');
      setTimeout(spawnDebris, 220);
      setTimeout(() => {
        hulkEl.classList.remove('smashing');
        buildingEl.classList.remove('shaking');
      }, 500);
    }

    setInterval(smash, 2400);
    setTimeout(smash, 800);
  }

  // ---------- 초기화 & 클릭으로 웹스윙 ----------
  HERO_DEFS.forEach((def) => createHero(def));

  sceneEl.addEventListener('click', (e) => {
    if (e.target.closest('.hud') || e.target.closest('#toast')) return;
    if (e.target.closest('.hero')) return; // 히어로 클릭은 선택 전용, 위에서 별도 처리됨

    const buildingEl = e.target.closest('.building');
    if (!buildingEl) return; // 건물이 아닌 곳은 거미줄을 쏠 수 없음
    if (!selectedHero) return;

    const record = buildings.find((b) => b.el === buildingEl);
    const point = getAnchorPoint(record.index);

    swingToPoint(selectedHero, point, record.name);
  });

  requestAnimationFrame(() => {
    heroes.forEach((h, i) => {
      h.pivot = getAnchorPoint(HERO_DEFS[i].startBuilding);
    });
    selectHero(heroes[0]);
    createHulk(HULK_BUILDING_INDEX);
    requestAnimationFrame(tick);
  });
</script>


</body>
</html>
